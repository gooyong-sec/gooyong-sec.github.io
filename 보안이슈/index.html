l/detail.html?idx=141775) | 서울시 공공자전거 따릉이 이용자 약 450만 명의 개인정보가 유출됐다는 보도(월은 별도 요약 기준). |\n| 2026 | 통계 | [데일리안(보도, 월 미확인)](https://www.dailian.co.kr/news/view/1694727/%EA%B5%AD%EB%82%B4-%EA%B0%9C%EC%9D%B8%EC%A0%95%EB%B3%B4-6%EB%85%84%EA%B0%84-1%EC%96%B54000%EB%A7%8C%EA%B1%B4-2026) | 국내 개인정보 유출이 6년간 1억 4천만 건에 이르고, 해킹만큼 업무 과실로 인한 유출도 많았다는 분석 보도. |\n| 2025-12-30 | 분석 | [네이트뉴스(보도)](https://m.news.nate.com/view/20251230n35953) | KT가 보안 조치를 한 뒤에도 펨토셀에 추가 취약점이 있다는 지적이 나왔고, 해외 컨퍼런스에서 시험 결과가 공개됐다는 보도. |\n| 2025-12-29 | 정책·제재 | [네이트뉴스(보도)](https://m.news.nate.com/view/20251229n29835) | KT 펨토셀 사건과 관련해 정부가 전체 이용자에게 위약금을 면제해야 한다고 밝혔다는 보도. 통화·문자까지 감청 위험에 노출됐다는 내용이다. |\n"}],"classes":{"A":"노출 장비·서비스 취약점","B":"자격 증명·MFA","C":"서드파티·공급망","D":"사회공학","E":"장기 체류·탐지 실패","F":"백업·복구 부재","G":"파괴·지정학","H":"인증·키 설계 결함","I":"클라이언트 취약점","J":"경위·원인 미공개"},"glossary":[["CVE","취약점에 붙는 공식 번호표(예: CVE-2026-1234). 같은 결함을 모두가 같은 이름으로 부르게 해 준다."],["CVSS","취약점의 위험도를 0~10점으로 매긴 점수. 높을수록 위험하다."],["KEV","미국 CISA가 '실제로 악용되고 있다'고 확인한 취약점 목록. 여기 오르면 서둘러 패치해야 한다."],["제로데이","제조사가 아직 모르거나 아직 패치가 없는 취약점. 이를 이용한 공격을 '제로데이 공격'이라 한다(보도에서는 '이미 공격에 쓰이는 미패치 취약점'을 뜻하는 경우가 많다)."],["취약점","소프트웨어·장비의 보안 결함. 공격자가 이를 이용해 들어온다."],["패치","결함을 고치는 업데이트."],["RCE","원격 코드 실행. 공격자가 멀리서 상대 서버에 명령을 실행시키는 것으로 가장 위험한 유형 중 하나다."],["인증 우회","로그인 확인을 건너뛰고 들어가는 결함."],["웹셸","웹서버에 심어 두는 악성 파일. 공격자가 인터넷으로 접속해 서버에 명령을 내리는 '뒷문'이다."],["백도어","정상 로그인 없이 다시 들어올 수 있게 숨겨 둔 통로."],["랜섬웨어","파일을 암호화해 못 쓰게 만든 뒤, 풀어 주는 대가로 돈을 요구하는 악성코드."],["와이퍼","돈 요구 없이 데이터를 그냥 지워 버리는 파괴형 악성코드."],["인포스틸러","PC에서 비밀번호·쿠키 등을 훔치는 악성코드."],["피싱","가짜 메일·사이트로 속여 정보를 빼내는 수법."],["vishing","전화로 속여 정보를 빼내는 수법(음성 피싱)."],["사회공학","기술이 아니라 사람을 속여 정보를 얻는 공격."],["MFA","다중 인증. 비밀번호(아는 것)에 더해 휴대전화·보안키(가진 것)나 지문(신체 특징)처럼 서로 다른 종류를 함께 확인한다. 문자 코드는 가로채일 수 있어 방식에 따라 강도가 다르다."],["FIDO2","비밀번호·코드를 입력하지 않고 보안키·기기 인증을 쓰는 방식. 등록된 사이트인지 확인해 인증하므로 가짜 로그인 사이트에 강하다. 기기 감염이나 로그인 뒤의 세션 탈취까지 막아 주지는 않는다."],["패스키","FIDO2 기반의 비밀번호 없는 로그인. 지문·얼굴 등으로 인증한다."],["SSO","한 번 로그인하면 여러 서비스에 같이 접속되는 통합 로그인."],["IdP","SSO 같은 로그인을 대신 확인해 주는 서비스(예: Okta, Entra ID)."],["OAuth","앱이 비밀번호 없이 다른 서비스에 접속하도록 허락해 주는 방식. 허락의 증표가 '토큰'이다."],["토큰","로그인 상태나 접근 권한을 나타내는 값. 일부는 유출되면 유효기간과 권한 범위 안에서 비밀번호 없이도 악용될 수 있다."],["세션 하이재킹","훔친 로그인 상태(쿠키·토큰)로 그 사람인 척 접속하는 것."],["세션","로그인한 뒤 이어지는 접속 상태."],["쿠키","웹사이트가 로그인 상태 등을 기억하려고 브라우저에 저장하는 작은 정보."],["자격 증명","아이디·비밀번호·토큰·키처럼 신원을 증명하는 정보."],["패스워드 스프레이","흔한 비밀번호 몇 개를 수많은 계정에 돌려 가며 시도하는 공격."],["무차별 대입","비밀번호를 계속 바꿔 가며 맞을 때까지 시도하는 공격."],["EDR","PC·서버에서 수상한 행동을 감시하는 보안 프로그램."],["WAF","웹사이트 앞에서 공격성 요청을 걸러 주는 웹 방화벽."],["VPN","바깥에서 회사 내부망에 안전하게 접속하게 해 주는 통로."],["방화벽","네트워크 출입을 규칙으로 막고 허용하는 장비."],["엣지 장비","회사 네트워크와 인터넷의 경계에 있는 장비(VPN·방화벽·메일 게이트웨이 등)."],["ERP","회계·인사·재고 같은 회사 핵심 업무를 관리하는 시스템."],["MFT","기업이 큰 파일을 안전하게 주고받게 해 주는 파일 전송 소프트웨어."],["SaaS","설치 없이 웹으로 쓰는 서비스(예: Salesforce, Slack)."],["공급망 공격","고객이 쓰는 소프트웨어·협력사를 먼저 뚫어 그 고객 모두를 노리는 공격."],["SBOM","소프트웨어에 어떤 부품(라이브러리)이 들어 있는지 적은 목록."],["CI/CD","코드를 자동으로 빌드·시험·배포하는 개발 자동화 과정."],["의존성","내 프로그램이 가져다 쓰는 외부 라이브러리·패키지."],["서명 키","로그인 토큰이 진짜임을 보증하는 비밀 도장. 유출되면 가짜 토큰을 만들 수 있다."],["KMS","암호 키를 안전하게 보관·관리하는 전용 서비스."],["HSM","키가 장치 밖으로 나가지 않게 보관하는 전용 보안 장치."],["불변 백업","정해진 기간 동안 수정·삭제를 막아 둔 백업. 별도 관리 권한과 복구 훈련이 함께 필요하고, 오염된 데이터를 되돌려 주지는 못한다."],["헬프데스크","직원·고객의 문의를 받아 계정 문제 등을 처리하는 지원 창구."],["횡적 이동","한 시스템에 들어온 뒤 내부의 다른 시스템으로 옮겨 가는 것."],["지속성","재부팅·비밀번호 변경 뒤에도 침입 상태를 유지하는 것."],["권한 상승","일반 권한에서 관리자 같은 높은 권한을 얻는 것."],["터널링","허용된 통신 안에 다른 통신을 숨겨 보내 방화벽을 통과하는 기법."],["프록시","중간에서 통신을 대신 전달해 주는 서버. 공격자는 출처를 숨기는 데 쓴다."],["C2","공격자가 감염된 기기를 원격으로 조종하는 연결(명령·제어)."],["IOC","침해 흔적을 알려 주는 단서(악성 IP, 파일 이름 등)."],["APT","정부 지원 등으로 장기간·치밀하게 공격하는 조직."],["포렌식","침해 증거를 보존·분석해 무슨 일이 있었는지 밝히는 조사."],["최소 권한","꼭 필요한 권한만 주는 원칙."],["PAM","관리자 같은 높은 권한 계정을 별도로 통제·기록하는 관리 방식."],["조건부 접근","기기·위치·위험도에 따라 로그인을 허용하거나 막는 정책."],["ESXi","VMware의 가상 서버 운영 소프트웨어. 한 대에 서버 수십 개가 올라간다."],["Intune","마이크로소프트의 기기 관리 서비스. 원격 초기화 같은 기능이 있다."],["MDM","회사가 직원 스마트폰·PC를 원격으로 관리하는 방식."],["역직렬화","전달받은 데이터를 프로그램 객체로 되돌리는 처리. 신뢰할 수 없는 데이터를 위험한 방식으로 복원하면 구현에 따라 코드 실행 같은 문제가 생길 수 있다."],["SHA 고정","검토한 특정 코드를 고유 번호(SHA)로 지정해 몰래 바뀌는 것을 막는 방법. 악성 코드를 고정하면 그대로 실행되므로 코드가 안전하다는 보증은 아니다."],["LFI","서버에 있는 파일을 프로그램이 불러오게 만드는 결함(로컬 파일 포함)."],["정규화","URL 같은 입력을 하나의 표준 형태로 바꾸는 처리. 검사 단계와 처리 단계가 다르게 해석하면 우회가 생긴다."],["NTDS.dit","윈도 도메인의 모든 계정 비밀번호 정보가 들어 있는 파일."],["USIM","휴대폰 가입자를 식별·인증하는 칩(유심)."],["펨토셀","집·사무실용 초소형 기지국."],["TACACS+","네트워크 장비 관리자 로그인을 확인하는 프로토콜."],["DTLS","UDP 통신을 암호화하는 방식(VPN 등에서 쓴다)."],["BPFDoor","특정 통신 신호로 깨우는 방식으로 숨어 있는 리눅스 백도어."],["오픈소스","누구나 코드를 보고 쓸 수 있게 공개된 소프트웨어."],["KISA","한국인터넷진흥원. 한국의 인터넷·보안 지원 기관."],["CISA","미국 사이버보안·인프라보안국."],["ATT&CK","MITRE가 만든 '공격자가 쓰는 행동 사전'. 전술(목표)과 기법(방법)으로 정리한다."],["SAML","회사 로그인(SSO)에서 \"이 사람이 맞다\"는 증명서를 주고받는 표준 방식. 이 방식을 처리하는 장비 부분의 결함이 문제가 된 사례가 있다."],["접속키","서비스·서버에 접속할 때 쓰는 비밀 열쇠(API 키·액세스 키 등). 코드나 개발 PC에 방치하면 유출 위험이 크다."],["AI 에이전트","스스로 판단해 여러 단계의 작업을 자동으로 이어서 수행하는 AI. 공격에 쓰이면 사람보다 훨씬 빠르게 시도할 수 있다."],["ARTEX","오픈소스 LLM 기반 자율 침투 테스트 도구(보도). 방어 점검용이지만 공격에도 쓸 수 있고, 금융권 사건에서 사용 여부는 확정되지 않았다."],["민관합동조사단","정부와 민간 전문가가 함께 침해사고의 원인과 피해를 조사하는 팀."],["SQL 삽입","입력칸에 데이터베이스 명령을 끼워 넣어 원래 허용되지 않은 정보를 읽거나 바꾸는 공격. 입력값을 제대로 검사하지 않을 때 가능하다."],["핫월렛","거래소가 즉시 이체할 수 있도록 인터넷에 연결해 둔 가상자산 지갑. 편리하지만 침해되면 바로 자산이 빠져나갈 수 있다."],["CAA 기록","도메인 주인이 \"이 인증기관만 내 도메인 인증서를 발급할 수 있다\"고 DNS에 적어 두는 설정. 부정 발급을 줄이지만 DNS 자체가 뚫리면 우회될 수 있다."],["인증서 투명성 로그","인증기관이 발급한 인증서를 공개 장부에 기록하는 제도. 내 도메인에 낯선 인증서가 발급됐는지 감시할 수 있다."],["ccTLD",".kr처럼 나라별로 관리되는 최상위 도메인. 운영 쪽이 뚫리면 그 아래 도메인이 위험해질 수 있다."],["비밀번호 스프레이","흔한 비밀번호 몇 개를 수많은 계정에 돌려 가며 시도해 잠금을 피하는 방식."],["경로 조작","파일 경로에 `/..` 같은 조각을 넣어 허용되지 않은 폴더의 파일에 접근하는 공격(path traversal)."],["서비스 거부(DoS)","서버에 과부하를 주거나 결함을 건드려 정상 서비스를 멈추게 하는 공격. 데이터 탈취와는 다른 피해다."],["UAF","이미 해제(반납)한 메모리 영역을 모르고 다시 쓰는 결함(use-after-free). 공격자가 그 자리를 미리 조작해 두면 코드 실행으로 이어질 수 있다."],["인증기관(CA)","웹사이트 주소가 진짜 그 사이트의 것임을 보증하는 인증서를 발급하는 기관. 브라우저가 신뢰하는 CA 목록에서 빠지면 그 인증서는 더 이상 믿을 수 없다."],["교차서명","한 인증기관이 발급한 인증서를, 다른 인증기관이 \"나도 이 인증서를 보증한다\"고 추가로 서명해 주는 것. 신뢰 범위를 넓혀 주지만, 원래 인증기관이 위험해지면 교차서명된 인증서도 함께 위험해진다."],["환경변수","프로그램을 실행할 때 설정값을 담아두는 변수. API 키·DB 접속정보 같은 민감한 값을 넣어두는 경우가 많아, 유출되면 다른 시스템 침해로 바로 이어질 수 있다."],["릴리스 파이프라인","코드를 패키지·이미지로 만들어 사용자에게 자동으로 배포하는 절차. 이 단계가 오염되면 정상 설치 과정을 거친 사용자도 악성코드를 받게 된다."],["정수 오버플로","숫자가 프로그램이 처리할 수 있는 범위를 넘어가면서 계산이 틀어지는 결함. 메모리를 잘못 다루게 만들어 임의 코드 실행으로 이어질 수 있다."],["PoC(개념증명)","결함이 실제로 공격에 쓰일 수 있음을 보여주는 검증용 코드. PoC가 나왔다고 곧바로 실제 공격이 벌어지는 것은 아니지만, 공개 후 며칠 안에 실제 공격으로 이어지는 경우가 많다."],["GDS(글로벌 유통 시스템)","여러 항공사·여행사가 공동으로 쓰는 예약·발권 중개 시스템. 이 시스템 하나가 뚫리면 연결된 여러 항공사의 고객 정보가 동시에 위험해질 수 있다."],["UEFI 부트킷","컴퓨터가 켜질 때 운영체제보다 먼저 실행되는 부팅(펌웨어) 단계에 심는 악성코드. 백신이 설치되기도 전에 자리를 잡아 탐지가 어렵고, 운영체제를 다시 설치해도 살아남을 수 있다."],["Secure Boot","컴퓨터가 부팅할 때 서명되지 않은(검증되지 않은) 프로그램이 실행되지 못하게 막는 보안 기능. 서명 검증 절차에 결함이 있거나 관련 인증서 폐기 절차가 수동으로만 적용되면 이 보호가 무력화될 수 있다."],["크립토재킹(가상화폐 채굴 악용)","공격자가 남의 서버·컴퓨터 자원을 몰래 가져다 가상화폐를 채굴하는 행위. 채굴이 목적이라도 같은 공간에 저장된 개인정보가 함께 노출될 수 있다."],["AGENTS.md·CLAUDE.md","AI 코딩 에이전트가 작업을 시작할 때 자동으로 읽고 따르는 '사용 설명서' 파일. 사람이 편의를 위해 만든 것이지만, 에이전트는 이 파일의 지시를 사람의 지시만큼 신뢰하므로 악성 내용이 들어가면 그대로 따를 위험이 있다."],["npm 패키지","자바스크립트 프로그램이 널리 쓰는 외부 코드 묶음(라이브러리). 이름만 보고 설치하면 악성 코드가 섞여 들어올 수 있다."],["페이지 캐시","컴퓨터가 디스크에 있는 파일 내용을 속도를 위해 메모리에 잠시 복사해 두는 공간. 읽기 전용 파일이라도 이 복사본을 조작하는 결함이 있으면 보호가 무력화될 수 있다."],["Critical Patch Update(CPU)","Oracle이 분기마다 정기적으로 배포하는 보안 패치 묶음. 긴급 패치와 달리 미리 공지된 일정에 맞춰 나온다."],["디코이(가짜 서버)","보안 연구자가 공격자를 유인·관찰하기 위해 실제 서비스처럼 꾸며 놓은 가짜 서버(허니팟과 비슷한 개념). 여기 찍힌 공격 시도가 실제 서비스가 뚫렸다는 뜻은 아니다."],["하드웨어 지갑(콜드월렛)","암호화폐의 개인 키를 인터넷에 연결되지 않은 전용 기기에만 보관해 해킹 위험을 낮추는 장치. 다만 기기 자체가 제조·유통 과정에서 변조되면 이 보호가 무력화될 수 있다."],["SAFU 펀드","거래소 바이낸스가 해킹 등 사고 시 이용자 손실을 보전하기 위해 미리 적립해 둔 자체 비상금. 보험사가 지급하는 보험이 아니라 거래소 자체 자금이며, 규모는 거래소가 자율적으로 정한다."],["제로클릭(공격)","피해자가 링크를 클릭하거나 파일을 열지 않아도, 메시지를 받기만 해도 공격이 성립하는 방식. 피해자의 어떤 행동도 필요 없어 스스로 조심해서 막을 방법이 없고, 방어는 전적으로 제조사·통신사의 패치에 달려 있다."],["에이전틱 AI(공격형 AI 에이전트)","사람이 매 단계를 일일이 지시하지 않아도 스스로 판단해 정찰·공격·데이터 수집 같은 여러 단계를 이어서 수행하는 AI 프로그램. 공격에 쓰이면 사람 손이 덜 가면서도 더 빠르고 넓게 시도할 수 있지만, 실제로 \"뚫은\" 건수까지 늘었는지는 별도로 확인해야 한다."],["WAP 푸시(SMS)","문자메시지(SMS)의 한 형식으로, 원래는 통신사가 설정 정보 등을 단말기에 전달하려고 쓴다. 이 형식을 조작하면 받는 사람이 알아차리지 못한 채 기기 동작에 영향을 줄 수 있다."],["바이러스토탈(VirusTotal)","구글이 운영하는 악성코드 검사 사이트. 파일을 올리면 여러 백신으로 한꺼번에 검사해 주는데, 유료 회원끼리는 올라온 파일을 내려받아 볼 수 있어 기밀 문서를 올리면 그대로 노출될 위험이 있다."],["레이스 컨디션(Race Condition)","프로그램이 같은 자원을 거의 동시에 처리할 때 처리 순서가 뒤섞여 생기는 결함. 공격자가 검사와 실제 사용 사이의 짧은 시간차를 노리면 검증을 건너뛰고 코드를 실행시킬 수 있다."],["도메인 트러스트","한 조직 안에서 서로 다른 관리 영역(도메인)끼리 \"서로의 계정을 믿고 받아주기\"로 맺는 관계. 공격자가 이 관계를 새로 만들거나 바꾸면, 원래 접근할 수 없던 영역까지 넘어갈 수 있다."],["CDN(콘텐츠 전송망)","소프트웨어 업데이트나 웹 콘텐츠를 사용자에게 빠르게 전달하려고 세계 여러 곳에 분산시켜 둔 서버망. 이 배포망 자체가 뚫리면 정상 업데이트처럼 보이는 경로로 악성코드가 퍼질 수 있다."],["NTLM 해시","윈도우가 네트워크 공유 폴더 등에 로그인할 때 비밀번호 원문 대신 주고받는 암호 요약값. 원격 서버에 자동 접속만 해도 이 값이 전송될 수 있어, 가로챈 뒤 비밀번호를 추측하거나 다른 서버 인증에 악용할 수 있다."],["XXE(XML 외부 개체)","데이터를 주고받는 문서 형식인 XML 안에 '서버 내부 파일을 읽어 오라'는 외부 참조 명령을 몰래 끼워 넣는 공격. 파서에서 외부 참조 기능을 끄지 않으면 서버 설정 파일 등이 그대로 노출될 수 있다."],["브라우저 샌드박스","웹 브라우저가 악성 사이트에 뚫리더라도 그 피해가 브라우저 창 안에서만 머물고 컴퓨터(운영체제) 전체로 번지지 않게 가두는 격리 벽. 다만 별도의 샌드박스 탈출 결함과 결합되면 이 벽도 뚫릴 수 있다."],["웹소켓(WebSocket)","웹 브라우저나 프로그램이 서버와 한 번 연결을 맺은 뒤 실시간으로 양방향 데이터를 주고받는 통신 방식. 분할된 메시지를 재조합하는 과정에 결함이 있으면 로그인 전 단계에서도 메모리 오염 공격 통로가 될 수 있다."],["하이퍼바이저","물리적인 서버 한 대를 쪼개 여러 대의 가상 서버(가상머신)를 만들고 관리하는 핵심 소프트웨어(예: ESXi, XCP-ng). 하이퍼바이저나 그 통합 관리 도구가 뚫리면 그 위에서 돌아가는 가상 서버 전체가 한꺼번에 장악될 수 있다."],["MSP(관리형 서비스 제공사)","여러 고객 기업의 서버·PC·보안 장비를 원격으로 대신 관리해 주는 전문 업체. 관리 효율은 높지만 MSP의 원격 관리 콘솔이나 관리자 세션이 뚫리면 연결된 다수 고객사로 피해가 동시에 번질 수 있다."],["OIDC(OpenID Connect)","장기 비밀번호(액세스 키)를 미리 저장해 두지 않고도 \"이 작업은 허용된 GitHub 저장소 등에서 실행 중이다\"라는 단기 신원 증명(토큰)을 주고받아 클라우드에 로그인하는 표준 방식. 비밀키 유출 위험을 줄여 주지만, 누구를 믿을지 정한 '신뢰 정책(Trust Policy)'이나 페더레이션 설정 자체가 공격자에게 변조되면 시크릿을 바꿔도 공격자가 계속 권한을 얻을 수 있다."],["CLFS(공통 로그 파일 시스템)","윈도우 운영체제가 프로그램이나 거래 기록(로그)을 빠르게 저장·복구하려고 커널(핵심 영역)에서 기본으로 돌리는 드라이버(clfs.sys). 일반 계정도 접근할 수 있으면서 가장 높은 시스템 권한(SYSTEM)으로 동작해, 랜섬웨어나 해커가 일반 계정에서 최고 관리자 권한으로 올라설 때 단골로 악용한다."],["CRLF 삽입(CRLF Injection)","줄바꿈 문자(CR·LF, 엔터키 역할)를 입력값에 몰래 끼워 넣어, 프로그램이 한 줄짜리 설정이나 웹 응답 머리글(헤더)을 두 줄 이상으로 착각하게 만드는 공격. 응답 내용을 변조하거나 명령을 끼워 넣어 코드 실행으로 이어질 수 있다."],["로컬 소켓(유닉스 도메인 소켓)","같은 컴퓨터(장비) 안에서 돌아가는 프로그램끼리 명령이나 데이터를 주고받으려고 파일 경로(예: /tmp/...) 형태로 열어 두는 내부 통신 창구. 바깥 인터넷에서는 직접 보이지 않더라도, 모든 로컬 계정이 쓸 수 있게 열어 두고 누구인지 확인(인증)하지 않으면 웹셸 등으로 일단 발을 들인 해커가 최고 관리자(root) 권한을 얻는 지름길이 된다."],["교차 계정 IAM 역할(Cross-account IAM Role)","클라우드(AWS 등)에서 외부 협력사나 분석 서비스가 내 클라우드 자원에 접근할 수 있도록, 비밀번호를 주는 대신 \"저 회사 계정이 요청하면 이 역할을 잠시 빌려주겠다(AssumeRole)\"고 맺어 두는 신뢰 설정. 편리하지만 서비스 해지·계약 종료 뒤에 이 역할을 지우지 않고 방치하면, 나중에 그 협력사가 해킹당했을 때 공격자가 이 통로를 그대로 타고 내 클라우드로 들어올 수 있다."],["데이터 무보관(Zero-Data-Retention)","AI 서비스나 외부 API 공급사가 \"고객이 보낸 질문(프롬프트)과 응답을 처리 직후 바로 지우고 서버에 저장하거나 학습에 쓰지 않겠다\"고 약속하는 정책. 다만 계약상 약속이 있더라도 하위 공급사의 개발·로깅 설정 실수로 실제 서버에 기록이 남아 유출된 사례가 있어, 계약만 믿고 비밀번호·API 키를 AI 대화창에 그대로 입력해서는 안 된다."]],"techNotes":{"T1003":["컴퓨터에서 계정 정보 뽑기","컴퓨터(OS) 안에 저장된 아이디·비밀번호(해시)를 통째로 꺼내 간다."],"T1005":["컴퓨터 안의 자료 모으기","침투한 컴퓨터·서버에 있는 파일을 찾아 모은다."],"T1021":["원격 접속 기능으로 이동","SSH·원격 데스크톱 같은 정상 원격 접속 기능으로 다른 컴퓨터로 옮겨 간다."],"T1027":["코드·파일 숨기기(난독화)","악성 코드를 알아보기 어렵게 인코딩·암호화해 탐지를 피한다."],"T1036":["정상인 척 위장","악성 파일의 이름·모양을 정상 프로그램처럼 꾸민다."],"T1040":["네트워크 통신 엿보기","네트워크를 지나가는 데이터(비밀번호 등)를 몰래 읽는다."],"T1041":["조종 통로로 데이터 빼내기","공격자가 원격 조종에 쓰는 연결을 그대로 이용해 자료를 밖으로 보낸다."],"T1053":["예약 작업으로 자동 실행","cron·작업 스케줄러에 등록해 정해진 때마다 악성 작업이 실행되게 한다. 재부팅해도 유지된다."],"T1056":["입력값 가로채기","로그인 화면 등에 입력하는 아이디·비밀번호를 몰래 가로챈다."],"T1059":["명령·스크립트 실행","쉘·PowerShell·Python·PHP 같은 도구로 명령을 실행한다."],"T1068":["취약점으로 권한 올리기","소프트웨어 결함을 이용해 일반 권한에서 관리자(root) 권한으로 올라간다."],"T1070":["흔적(로그) 지우기","로그 같은 침입 흔적을 지워 조사를 어렵게 한다."],"T1071":["평범한 웹 통신으로 조종","HTTP 같은 흔한 통신에 명령을 섞어 정상 트래픽처럼 보이게 한다."],"T1072":["관리·배포 도구 악용","기기 관리·소프트웨어 배포 도구를 악용해 명령이나 프로그램을 실행한다(많은 기기에 한꺼번에 내릴 수도 있다)."],"T1078":["유효한 계정 악용(정상 계정으로 로그인)","훔치거나 얻은 진짜(유효한) 계정으로 로그인한다. 보안 장치가 정상 사용자로 착각하기 쉽다."],"T1090":["중계(프록시) 사용","다른 서버·기기를 거쳐 통신해 출처를 숨기거나 내부망 접근을 우회한다."],"T1098":["계정 권한 조작","계정이나 앱에 권한을 추가·변경해 접근을 유지한다."],"T1105":["공격 도구 내려받기","침투한 기기에 외부에서 추가 악성 도구를 내려받는다."],"T1110":["비밀번호 대량 시도","비밀번호를 계속 바꿔 넣어 맞는 것을 찾는다(무차별 대입·패스워드 스프레이)."],"T1111":["2단계 인증 가로채기","SMS·인증 코드·푸시 승인 같은 2단계 인증 정보를 가로채 로그인을 완성한다."],"T1114":["이메일 수집","메일함의 내용을 읽거나 복사해 간다."],"T1133":["외부 원격 접속 이용","VPN·원격 데스크톱처럼 바깥에서 들어오는 서비스를 통해 접속한다."],"T1136":["새 계정 만들기","나중에 쓰려고 몰래 새 계정을 만든다."],"T1190":["인터넷에 열린 서비스의 취약점 공격","웹사이트·VPN·메일 장비처럼 인터넷에서 보이는 서비스의 결함을 공격해 들어온다. 가장 흔한 첫 침투 방법이다."],"T1195":["공급망 오염","고객이 쓰는 소프트웨어·패키지·개발 도구를 미리 오염시켜, 그것을 쓰는 모두를 감염시킨다."],"T1199":["믿는 협력사를 통해 침투","거래·연동 중인 업체의 접속 권한을 이용해 들어온다."],"T1200":["악성 장비 연결","가짜 기지국·USB 같은 장비를 설치해 침투한다."],"T1203":["사용자 프로그램 취약점으로 실행","문서·이미지를 여는 프로그램의 결함을 이용해 악성 코드를 실행시킨다."],"T1205":["신호 패킷으로 백도어 깨우기","특정한 통신 신호를 받으면 숨어 있던 악성코드가 반응한다(BPFDoor 등)."],"T1213":["업무 시스템에서 자료 빼내기","CRM·위키·데이터베이스·소스 저장소 같은 업무 저장소에서 데이터를 가져간다."],"T1219":["원격 제어 프로그램 설치","정상적인 원격 관리 프로그램을 설치해 몰래 조종한다."],"T1485":["데이터 파괴","파일·시스템을 복구하기 어렵게 지운다."],"T1486":["파일 암호화(랜섬웨어)","파일을 암호화해 못 쓰게 만들고, 풀어 주는 대가로 돈을 요구한다."],"T1490":["복구 수단 막기","백업·복구 기능을 지우거나 망가뜨려 복구를 어렵게 한다."],"T1505":["서버에 숨은 악성 부품(웹셸 등)","서버 소프트웨어에 악성 부품을 심어 언제든 다시 들어올 수 있게 한다(대표 사례가 웹셸)."],"T1528":["앱 접속 토큰 훔치기","앱이 서비스에 접속할 때 쓰는 열쇠(OAuth·API 토큰)를 훔친다."],"T1539":["로그인 상태(쿠키) 훔치기","이미 로그인된 상태를 나타내는 쿠키·세션 정보를 훔친다."],"T1550":["인증 자료 악용(훔친 증표로 로그인)","비밀번호 대신 훔친 토큰·쿠키·해시 같은 인증 자료를 내밀어 로그인한다."],"T1552":["안전하지 않게 놓인 비밀번호 찾기","파일·로그·설정에 평문으로 적힌 비밀번호·키를 찾아낸다."],"T1554":["정상 프로그램 변조","서버·장비에 설치된 정상 프로그램 파일을 바꿔 악성 기능을 넣는다."],"T1555":["저장된 비밀번호 꺼내기","브라우저·비밀번호 관리자 등에 저장된 계정 정보를 꺼낸다."],"T1083":["파일·폴더 뒤지기","뚫은 컴퓨터 안의 파일·폴더 목록을 살펴보며 쓸만한 정보(비밀번호 파일, 지갑 파일 등)가 있는지 찾는다. 찾아봤다는 것과 실제로 꺼내 갔다는 것은 다르다."],"T1556":["로그인 절차 조작","인증 과정을 바꿔서 비밀번호 없이 통과하거나 비밀번호를 수집한다."],"T1557":["중간자 공격","통신 중간에 끼어들어 내용을 가로채거나 바꾼다."],"T1565":["데이터 변조","화면·거래·데이터를 바꿔 속인다."],"T1566":["피싱(속여서 접속)","이메일·문자·전화(비싱)로 속여 비밀번호나 접속을 얻는다."],"T1567":["웹 서비스로 데이터 반출","GitHub·클라우드 저장소 같은 정상 웹 서비스에 훔친 데이터를 올려 빼낸다."],"T1572":["터널링","허용된 통신(HTTP 등) 안에 다른 통신을 숨겨 방화벽을 통과한다."],"T1574":["실행 흐름 가로채기","프로그램이 불러오는 라이브러리 등을 바꿔 정상 프로그램 안에서 악성 코드를 돌린다."],"T1583":["공격용 서버·도메인 마련","가짜 도메인·임대 서버처럼 공격에 쓸 인프라를 확보한다."],"T1585":["가짜 계정 만들기","신뢰를 얻거나 속이기 위해 가짜 온라인 계정을 만든다."],"T1599":["네트워크 경계 우회","장비의 접근 규칙(ACL) 등을 바꿔 막혀 있던 구간을 이어 붙인다."],"T1602":["장비 설정 정보 빼내기","네트워크 장비의 설정 파일(비밀번호 등 포함)을 가져간다."],"T1606":["로그인 증표 위조","쿠키·토큰 같은 로그인 증표를 직접 만들어 낸다."],"T1649":["인증서 훔치기·위조","장비·사용자가 신원을 증명하는 인증서를 훔치거나 복제한다."],"T1650":["접근 권한 구입","이미 뚫린 접근 권한이나 계정을 구매해 활용한다."],"T1657":["금전 갈취·탈취","협박·몸값 요구, 사기, 기술적 탈취 등으로 돈을 가져간다(MITRE 정의에 협박이 포함돼 있다)."],"T1671":["클라우드 앱 연동으로 거점 확보","악성 앱·연동을 등록해 비밀번호가 바뀌어도 접근을 유지한다."],"T1677":["개발 자동화 파이프라인 오염","CI/CD 자동화 작업 안에 악성 명령을 넣어 비밀 키를 가져간다."],"T1119":["자동으로 자료 모으기","프로그램으로 많은 정보를 반복 조회·수집한다."],"T1499":["서비스 멈추게 하기","장비나 서비스를 과부하·오류로 멈추게 해 쓰지 못하게 한다."],"T1595":["공격 대상 스캔·탐색","공격 전에 인터넷에서 취약한 서버·서비스를 자동으로 훑어 찾는다."],"T1531":["계정 접근 막기","정상 사용자나 관리자의 계정을 삭제하거나 잠가서 원래 담당자가 시스템에 들어오지 못하게 한다."],"T1584":["남의 인프라를 장악해 공격에 쓰기","도메인·DNS·서버 등 제3자가 운영하는 인프라를 침해해 공격 준비에 쓴다."],"T1588":["공격 도구·자원 구하기","공격에 쓸 도구, 인증서, 계정 등을 만들지 않고 얻어 쓴다(예: 탈취한 도메인으로 정상 TLS 인증서를 받음)."],"T1542":["부팅 과정에 숨어들기","컴퓨터가 켜질 때 운영체제보다 먼저 실행되는 부팅 단계(펌웨어·부트로더)에 악성코드를 심어, 백신이 깔리기도 전에 자리잡고 운영체제를 다시 설치해도 살아남는다."],"T1553":["서명 검증 무력화하기","소프트웨어가 정상 제작사의 서명인지 확인하는 절차를 우회하거나 바꿔, 가짜·변조된 프로그램을 정상처럼 실행시킨다."],"T1685":["보안 도구 끄거나 망가뜨리기","백신·보안 소프트웨어 같은 방어 도구를 끄거나 설정을 바꿔 제대로 작동하지 못하게 만든다."],"T1102":["정상 웹서비스로 몰래 통신하기","구글 드라이브·원드라이브 같은 누구나 쓰는 정상 클라우드 서비스를 명령 전달 통로로 써서, 방화벽이 평범한 트래픽으로 오인하게 만든다."],"T1204":["사람 대신 악성 파일·지침 실행하기","사람(또는 이번 사례처럼 AI 에이전트)이 악성 파일이나 지침을 그대로 열거나 따르게 만들어 공격자가 원하는 동작을 실행시킨다."],"T1189":["무심코 둘러본 사이트에서 악성 파일 받기","사람이 그냥 둘러본 웹사이트가 방문자 몰래 악성 파일을 컴퓨터에 내려받게 하거나 코드를 실행시킨다."],"T1087":["계정 목록 훑어보기","공격자가 조직 내부의 사용자·관리자 계정 목록을 들여다봐, 다음에 노릴 계정을 고른다."],"T1484":["조직 정책·신뢰관계 바꾸기","도메인이나 테넌트(관리 단위)의 정책, 또는 서로 다른 관리 영역이 \"믿고 받아주는\" 신뢰 관계를 공격자가 바꿔서, 원래 접근할 수 없던 영역까지 넘어가거나 권한을 넓힌다."],"T1135":["공유 폴더 들여다보기","네트워크에 연결된 공유 폴더 목록과 그 안의 파일을 살펴봐, 다음에 쓸 수 있는 정보(다른 조직·부서의 접속 정보 등)를 찾는다."],"T1530":["클라우드 저장소 자료 가져가기","구글 드라이브·원드라이브 같은 클라우드 저장 서비스에 보관된 파일을 공격자가 그대로 내려받아 가져간다."],"T1613":["컨테이너·클라우드 자원 둘러보기","공격자가 뚫은 서버에서 어떤 컨테이너·클라우드 자원이 돌아가고 있는지 확인해, 다음에 노릴 자원이나 더 큰 권한을 가진 자원을 찾는다."],"T1596":["공개 기술 데이터베이스 검색하기","Shodan·FOFA처럼 인터넷에 연결된 장비를 찾아 주는 검색 서비스로, 공격 대상이 쓰는 장비·소프트웨어 정보를 미리 조사한다."],"T1187":["강제 인증으로 암호 정보 빼내기","이메일·문서나 파일 안에 공격자 서버 주소를 몰래 심어 두어, 컴퓨터가 그 주소에 자동 접속할 때 윈도우 등이 스스로 보내는 로그인 암호 정보(NTLM 해시 등)를 가로챈다."],"T1125":["웹캠·화면 영상 몰래 녹화하기","감염된 컴퓨터나 스마트폰의 카메라(웹캠)를 몰래 켜거나 화상회의 영상을 녹화해 가져간다."]},"tacDesc":{"TA0043":["공격 전에 목표를 조사한다.","털려는 집을 미리 둘러본다."],"TA0042":["공격에 쓸 도구·계정·서버를 준비한다.","범행 도구와 차량을 마련한다."],"TA0001":["처음으로 안에 들어온다.","문이나 창문으로 첫 침입에 성공한다."],"TA0002":["악성 코드나 명령을 실행한다.","집 안에서 장치를 작동시킨다."],"TA0003":["재부팅·비밀번호 변경 뒤에도 남아 있는다.","몰래 복제 열쇠를 만들어 두거나 뒷문을 연다."],"TA0004":["더 높은 권한(관리자)을 얻는다.","직원 출입증을 마스터키로 바꾼다."],"TA0005":["들키지 않게 숨는다(구 '방어 회피').","CCTV를 피하고 흔적을 지운다."],"TA0112":["보안 기능을 끄거나 약하게 만든다.","경보기를 끈다."],"TA0006":["아이디·비밀번호·토큰을 훔친다.","열쇠를 훔친다."],"TA0007":["내부 구조를 파악한다.","건물 안 지도를 그린다."],"TA0008":["다른 시스템으로 옮겨 간다.","방에서 방으로 이동한다."],"TA0009":["훔칠 데이터를 모은다.","가져갈 물건을 한곳에 모은다."],"TA0011":["공격자가 원격으로 조종한다.","몰래 설치한 무전기로 지시를 받는다."],"TA0010":["데이터를 밖으로 빼낸다.","물건을 집 밖으로 반출한다."],"TA0040":["파괴·암호화·갈취·서비스 중단 같은 최종 피해를 준다.","불을 지르거나 금고를 막고 돈을 요구한다."]},"news":[{"date":"2026-11-13","cat":"침해사고","src":"보안뉴스(보도)","sum":"금융보안원 상시평가 시스템 해킹 조사에서 공격자가 문자(SMS) 인증 우회와 금감원 사칭으로 신규 계정을 만든 뒤 관리자 운영 점검 기능의 권한 검증 미흡을 악용해 48개사 파일 130여 건을 내려받은 것으로 드러났으며, 2022년 감사 지적 이후에도 금융사 편의를 위해 유동 IP 접속을 다시 허용한 점이 원인으로 지목됐다(공격 IP 246개 차단 완료).","url":"https://www.boannews.com/news/articleView.html?idxno=147263","rel":"D20261111-fsec"},{"date":"2026-11-13","cat":"침해사고","src":"보안뉴스(보도)","sum":"웹3 게임 플랫폼 '메이플스토리 유니버스'의 오프체인 서버 인프라 일부에 11/12 비인가 접근이 발생해 지갑 주소·세션 키·이메일 일부와 빌더센터 앱 328개의 개발자 API 키·OAuth 클라이언트 ID가 노출됐으나, KMS 복호화 시도를 차단하고 키·서버를 전면 교체해 가상자산 유출은 막았다는 보도.","url":"https://www.boannews.com/news/articleView.html?idxno=147252","rel":""},{"date":"2026-11-13","cat":"침해사고","src":"보안뉴스(보도)","sum":"협업 플랫폼 'NHN두레이(Dooray)'에서 11/13 새벽 외부 비인가 계정 접근 시도와 API 키를 이용한 비정상 호출이 포착돼, 회사 측이 민간·공공 고객사 보호를 위해 기존 서비스·관리자 API 키를 전량 폐기하고 API 서비스를 일시 차단해 조사 중이라는 보도.","url":"https://www.boannews.com/n function inline(s){
  s = esc(s);
  const codes = [];
  s = s.replace(/`([^`]+)`/g, (m, c) => { codes.push(c); return '\u0000' + (codes.length - 1) + '\u0000'; });
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?![*\w])/g, '$1<em>$2</em>');
  s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (m, t, h) => /^https?:/.test(h)
    ? `<a href="${h}" target="_blank" rel="noopener">${t}</a>` : `<a href="#" data-rel="${h}">${t}</a>`);
  return s.replace(/\u0000(\d+)\u0000/g, (m, i) => `<code>${codes[i]}</code>`);
}
function buildList(items){
  let html = '', st = [];
  for (const it of items) {
    while (st.length && it.ind < st[st.length - 1].ind) html += '</li></' + (st.pop().ord ? 'ol' : 'ul') + '>';
    if (!st.length || it.ind > st[st.length - 1].ind) { html += '<' + (it.ord ? 'ol' : 'ul') + '><li>' + inline(it.text); st.push({ ind: it.ind, ord: it.ord }); }
    else html += '</li><li>' + inline(it.text);
  }
  while (st.length) html += '</li></' + (st.pop().ord ? 'ol' : 'ul') + '>';
  return html;
}
function md(text){
  const L = text.replace(/\r/g, '').split('\n'); const out = []; let i = 0;
  const isBlock = l => /^(#{1,6} |```|>|---+\s*$|\s*([-*]|\d+\.)\s|\|)/.test(l);
  while (i < L.length) {
    const l = L[i];
    if (/^```/.test(l)) { const c = []; i++; while (i < L.length && !/^```/.test(L[i])) c.push(L[i++]); i++; out.push('<pre><code>' + esc(c.join('\n')) + '</code></pre>'); continue; }
    let m;
    if ((m = l.match(/^(#{1,6}) (.*)$/))) { out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`); i++; continue; }
    if (/^---+\s*$/.test(l)) { out.push('<hr>'); i++; continue; }
    if (/^>/.test(l)) { const q = []; while (i < L.length && /^>/.test(L[i])) q.push(inline(L[i++].replace(/^>\s?/, ''))); out.push('<blockquote>' + q.join('<br>') + '</blockquote>'); continue; }
    if (/^\|/.test(l) && /^\|[\s:|-]+\|?\s*$/.test(L[i + 1] || '')) {
      const cells = r => r.replace(/^\|/, '').replace(/\|\s*$/, '').split('|').map(c => c.trim());
      const head = cells(l); i += 2; const rows = [];
      while (i < L.length && /^\|/.test(L[i])) rows.push(cells(L[i++]));
      out.push('<table><thead><tr>' + head.map(c => `<th>${inline(c)}</th>`).join('') + '</tr></thead><tbody>' +
        rows.map(r => '<tr>' + r.map(c => `<td>${inline(c)}</td>`).join('') + '</tr>').join('') + '</tbody></table>'); continue;
    }
    if (/^\s*([-*]|\d+\.)\s+/.test(l)) {
      const items = [];
      while (i < L.length) {
        const mm = L[i].match(/^(\s*)([-*]|\d+\.)\s+(.*)$/);
        if (mm) { items.push({ ind: mm[1].length, ord: /\d/.test(mm[2]), text: mm[3] }); i++; }
        else if (L[i].trim() && /^\s{2,}\S/.test(L[i]) && items.length) { items[items.length - 1].text += ' ' + L[i++].trim(); }
        else break;
      }
      out.push(buildList(items)); continue;
    }
    if (!l.trim()) { i++; continue; }
    const p = [];
    while (i < L.length && L[i].trim() && !(p.length && isBlock(L[i]))) p.push(L[i++]);
    out.push('<p>' + p.map(inline).join('<br>') + '</p>');
  }
  return out.join('\n');
}
function sections(text){
  return text.split(/\n\s*\n/).map(b => {
    const lab = (b.match(/^\*\*([^*]+)\*\*/) || [, ''])[1];
    const cls = /^(쉽게 말하면|먼저 할 일)/.test(lab) ? 's-easy' : /^개요/.test(lab) ? 's-over' : /^왜 일어났나/.test(lab) ? 's-why' : /^침투 경로/.test(lab) ? 's-path' : /^어떻게 조치하나/.test(lab) ? 's-fix' : /^교훈/.test(lab) ? 's-less' : '';
    return `<div class="sec ${cls}">${md(b)}</div>`;
  }).join('');
}
function resolveDoc(base, href){
  const target = href.split('#')[0]; if (!target) return null;
  const parts = base.split('/').slice(0, -1);
  for (const seg of target.split('/')) { if (seg === '..') parts.pop(); else if (seg && seg !== '.') parts.push(seg); }
  const p = parts.join('/');
  return docs.find(d => d.path === p) ? p : null;
}

    location.hash = t ? '#/doc/' + enc(t) : '#/matrix';
  });
  window.scrollTo(0, 0);
}

function vGuide(){
  view.innerHTML = `<h1>처음이세요?</h1>
    <p class="sub">보안 지식이 없어도 읽을 수 있게 만든 안내입니다. 어려운 말은 밑줄 위에 마우스를 올리면 뜻이 나옵니다.</p>
    <h2>이 화면은 이렇게 읽으세요</h2>
    <div class="card"><div class="kv">
      <b>① 쉽게 말하면</b><span>사건마다 맨 위의 보라색 상자. 무슨 일인지 두세 문장으로 설명합니다.</span>
      <b>② 먼저 할 일</b><span>전문가가 아니어도 할 수 있는 첫 행동입니다. 전체 대응이 아니라 시작점이며, 담당자는 사건 본문의 조치를 보세요.</span>
      <b>③ 왜 일어났나</b><span>주황색 상자. 바로 이유(직접 원인)와 근본 이유(구조적 원인)를 나눠 씁니다.</span>
      <b>④ 침투 경로</b><span>빨간색 상자. 공격자가 어떤 순서로 들어왔는지.</span>
      <b>⑤ 어떻게 조치하나</b><span>초록색 상자. 즉시·단기·장기·탐지 순서로 정리했습니다.</span>
      <b>⑥ ATT&amp;CK 표</b><span>사건 아래 표. 공격 행동에 표준 이름표를 붙인 것입니다.</span></div></div>
    <h2>읽을 때 주의할 점</h2>
    <div class="card"><div class="kv">
      <b>'로그인 없이'</b><span>그 기능에 접속할 수 있는 상태에서, 계정 인증 없이 공격된다는 뜻입니다. 인터넷 어디서나 가능하다는 뜻은 아닙니다.</span>
      <b>패치 ≠ 끝</b><span>패치는 결함을 막을 뿐, 이미 심어진 악성코드·훔친 비밀번호·토큰·키는 그대로일 수 있어 별도로 회수·교체해야 합니다.</span>
      <b>인터넷에서 닫기 ≠ 복구</b><span>추가 침입을 줄일 뿐 이미 침해됐는지는 따로 점검해야 합니다.</span>
      <b>조치마다 범위가 다름</b><span>방화벽(WAF)·망 분리·암호화·2단계 인증은 각각 막는 경로가 다릅니다. 하나만으로 사건 전체를 막지는 못합니다.</span></div></div>
    <h2>얼마나 믿을 수 있나 (근거 표기)</h2>
    <div class="card"><div class="kv">
      <span>${tag('확인')}</span><span>제조사·정부·보안 연구기관이 직접 확인한 내용.</span>
      <span>${tag('보도')}</span><span>언론 보도에 나온 내용. 원문을 직접 확인하지는 못했습니다.</span>
      <span>${tag('추정')}</span><span>공개 자료가 부족해 이 보고서가 추측한 내용.</span>
      <span>${tag('주장')}</span><span>공격자가 주장하는 내용. 사실로 확인된 것이 아닙니다.</span>
      <span>${tag('후보')}</span><span>(ATT&amp;CK 표에서) 아직 관측되지 않았고, 확인되면 적용할 항목.</span></div></div>
    <h2>원인 유형 A~I</h2>
    <div class="card"><div class="kv">${Object.entries(classes).map(([k, v]) => `<b>${k} ${esc(v)}</b><span>${esc(CLS_EASY[k] || '')}</span>`).join('')}</div></div>
    <h2>ATT&amp;CK이 뭐예요?</h2>
    <div class="card"><p style="margin-top:0"><strong>ATT&amp;CK은 '공격자가 쓰는 행동 사전'입니다.</strong> 공격을 단계별 목표인 <strong>전술</strong>과, 그 목표를 이루는 구체적 방법인 <strong>기법</strong>으로 나눠 정리했습니다. 집에 침입하는 것에 빗대면 아래와 같습니다. 모든 공격이 15단계를 다 거치지는 않습니다.</p>
      <div class="flow">${tactics.map((t, n) => `<div class="step"><span class="n">${n + 1}</span><div><strong>${esc(t.ko)}</strong> <span class="sub" style="margin:0">${t.id}</span><br>${esc((tacDesc[t.id] || ['', ''])[0])} <span class="sub" style="margin:0">(비유: ${esc((tacDesc[t.id] || ['', ''])[1])})</span></div></div>`).join('')}</div>
      <p class="sub" style="margin-bottom:0">예) 전술 <strong>초기접근</strong>(문으로 들어오기)을 이루는 기법 중 하나가 <a href="#/matrix/T1190">T1190 인터넷에 열린 서비스의 취약점 공격</a>입니다.</p></div>
    <p class="sub"><a href="#/glossary">용어집 보기</a> · <a href="#/matrix">ATT&amp;CK 매트릭스 보기</a> · <a href="#/korea">국내 소식 보기</a></p>`;
}
function vKorea(){
  const kr = incidents.filter(i => i.region.includes('한국')).sort((a, b) => b.date.localeCompare(a.date));
  const cats = ['전체', ...new Set(news.map(n => n.cat))];
  const cur = state.ncat || '전체';
  const list = news.filter(n => cur === '전체' || n.cat === cur);
  view.innerHTML = `<h1>국내 소식</h1>
    <p class="sub">한국에서 일어난 사건과 국내 뉴스를 따로 모았습니다. 뉴스는 기사를 옮긴 것이 아니라 요약한 것이니, 자세한 내용은 출처 링크에서 확인하세요.</p>
    <h2 style="margin-top:8px">국내 주요 사건 (${kr.length}건)</h2>
    <div class="list">${kr.map(incCard).join('') || '<p class="sub">아직 없습니다.</p>'}</div>
    <h2>뉴스 브리핑 (${list.length}건)</h2>
    <div class="filters">${cats.map(c => `<button class="pill ${c === cur ? 'on' : ''}" data-nc="${esc(c)}">${esc(c)}</button>`).join('')}</div>
    <div class="news">${list.map(n => `<div class="item"><div class="sub" style="margin:0">${esc(n.date)} · ${tag(n.cat, 'mute')} · ${esc(n.src)}</div>
      <div>${esc(n.sum)}</div>
      <div style="font-size:13px"><a href="${esc(n.url)}" target="_blank" rel="noopener">원문 보기 ↗</a>${n.rel && incById[n.rel] ? ` · 관련 사건: <a href="#/inc/${n.rel}">${esc(incById[n.rel].title)}</a>` : ''}</div></div>`).join('') || '<p class="sub">없습니다.</p>'}</div>`;
  view.querySelectorAll('[data-nc]').forEach(b => b.onclick = () => { state.ncat = b.dataset.nc; vKorea(); });
}
function vGlossary(){
  const q = (state.gq || '').toLowerCase();
  view.innerHTML = `<h1>용어집</h1><p class="sub">${glossary.length}개 · 보고서와 사건 화면에서 이 용어가 처음 나오면 밑줄로 표시됩니다.</p>
    <div class="filters"><input id="gq" type="search" value="${esc(state.gq || '')}" placeholder="용어 검색" aria-label="용어 검색" style="padding:8px 12px;border:1px solid var(--border);border-radius:8px;background:var(--panel);color:var(--text);min-width:240px"></div>
    <table class="mtable"><thead><tr><th style="width:170px">용어</th><th>쉬운 설명</th></tr></thead><tbody>${glossary.filter(([t, d]) => !q || (t + d).toLowerCase().includes(q)).map(([t, d]) =>
      `<tr><td><strong>${esc(t)}</strong></td><td>${esc(d)}</td></tr>`).join('')}</tbody></table>`;
  const el = $('#gq');
  el.oninput = e => { state.gq = e.target.value; vGlossary(); const n = $('#gq'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); };
}

// ── 라우터 ──
function route(hash){
  const h = decodeURIComponent((hash == null ? location.hash : hash).replace(/^#\/?/, '')) || 'home';
  const [k, ...rest] = h.split('/'); const arg = rest.join('/');
  document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('on', a.dataset.k === (k === 'inc' ? 'timeline' : k === 'doc' ? (arg.startsWith('일일/') ? 'daily' : 'docs') : k)));
  if (k !== 'matrix') closeDrawer();
  ({ home: vHome, timeline: vTimeline, matrix: () => vMatrix(arg), actors: vActors, daily: vDaily, docs: vDocs, guide: vGuide, korea: vKorea, glossary: vGlossary,
     inc: () => vInc(arg), doc: () => vDoc(arg) }[k] || vHome)();
}
view.addEventListener('click', e => { const c = e.target.closest('[data-inc]'); if (c && !e.target.closest('a')) location.hash = '#/inc/' + c.dataset.inc; });
addEventListener('hashchange', () => route());
window.go = route; // 콘솔에서 go('#/matrix/T1190') 처럼 직접 이동 가능
$('#q').addEventListener('input', e => { state.q = e.target.value; if (!/^#\/timeline/.test(location.hash)) location.hash = '#/timeline'; else vTimeline(); });
const root = document.documentElement;
try { const t = localStorage.getItem('theme'); if (t) root.dataset.theme = t; } catch (e) {}
$('#theme').onclick = () => {
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme:dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('theme', root.dataset.theme); } catch (e) {}
};
route();
})();
</script>
