인증서 저장소를 쓰거나 폐기 확인(OCSP/CRL)을 하지 않는 소프트웨어(예: macOS 기본 curl)는 별도 패치 필요. Go 1.27.3/1.26.10, Node.js·Debian/FreeBSD ca-certificates 패치 적용 여부 확인(일부는 보도 시점 기준 미공개 — 최신 상태 재확인).\n- 단기: 자사가 발급받은 인증서가 eMudhra 영향 인증서 체인에 속하는지 확인.\n- 장기: 인증기관의 키 생성 과정은 외부 감사·투명성 로그 모니터링 대상으로 유지.\n- 탐지: 해당하지 않음(이미 폐기된 인증서에 대한 사후 조치 성격).\n\n**교훈**: 암호화는 키가 추측 불가능하다는 전제 위에 서 있다. 키 생성 스크립트의 \"이름이 비슷해서 헷갈렸다\" 같은 사소한 실수가 신뢰 체계 전체를 흔들 수 있다.\n\n### [D20261022-onamae] 일본 GMO Onamae Desktop Cloud 침해\n> 날짜: 2026-10-20(회사 확인)~10-21(서버 강제 중단, 공개) · 유형: 클라우드/호스팅 공급자 침해 · 행위자: 미귀속 · 지역: 일본 · 근거: 확인\n\n**쉽게 말하면**: 일본의 대형 도메인·호스팅 업체 GMO가 운영하는 'Desktop Cloud'(외환 자동매매 프로그램을 24시간 돌리는 가상 서버 서비스)에 외부인이 몰래 들어와 악성 프로그램을 심었습니다. 최대 2만6,739대의 고객 서버가 영향권에 들어 회사가 서버를 강제로 껐습니다.\n\n**먼저 할 일(초보용)**: 이 서비스를 쓰고 있다면, 그 서버에 저장해 둔 비밀번호나 접속키는 **그 서버가 아닌 다른 안전한 기기에서** 새로 바꾸세요. 결제(신용카드) 정보는 별도 시스템에 있어 영향이 없다고 회사가 밝혔지만, 이 사건을 빙자한 피싱 메일·전화(GMO는 전화·메일로 비밀번호를 묻지 않는다고 공지)에 주의하세요.\n\n**개요**: GMO는 10/20 외부인이 무단으로 Desktop Cloud 인프라에 접근해 일부 고객 환경에 악성 프로그램을 설치한 사실을 확인했고, 10/21 오전 4시(현지 시각)부터 고객 서버를 순차적으로 강제 종료했다. 최대 26,739대가 영향권으로 집계됐고, 서비스 복구 일정은 미정이다. 공격 수단·경로는 공개되지 않았다.\n\n**왜 일어났나**\n- 직접 원인: 공개되지 않았다. 최초 침투 경로(관리 콘솔 취약점, 탈취 자격 증명 등)는 확인된 자료가 없다.\n- 구조적 원인 [추정]: 침투 경로가 비공개라 구조적 분석도 보류한다. 다만 수많은 고객 가상 서버를 한 인프라에서 운영하는 구조상, 인프라 쪽이 한 번 뚫리면 영향이 개별 서버 단위로 즉시 번진다는 점은 이번 사건에서도 확인된다[추정].\n\n**침투 경로 [미공개]**: 공개된 자료에서 확인되지 않아 이 보고서는 매핑하지 않는다(분류 J·초기 접근 미공개에 준함).\n\n**어떻게 조치하나**\n- 즉시(회사): 영향 서버 격리·강제 중단(이미 시행), 증거 보존 후 원인 조사.\n- 즉시(고객): 서버에 저장된 비밀번호·API 키 등을 **다른 안전한 기기에서** 교체. 서비스 복구 공지를 공식 채널로만 확인.\n- 단기: 영향받은 고객에게 침해 범위(개인정보 유출 여부 포함) 구체적 통지.\n- 장기: 호스팅 공급자 입장에서는 고객 간 격리 강화, 단일 인프라 침해가 전체로 번지지 않게 하는 분리 설계 재검토.\n- 탐지: 해당 없음(이미 발견·공개된 사건).\n\n**교훈**: 클라우드·호스팅처럼 \"남이 관리해 주는\" 인프라도 그 공급자가 뚫리면 고객이 직접 통제할 수 없는 피해를 입는다. 공급자 선택 시 보안 사고 대응 이력도 고려 요소다.\n\n### 참고 기록 — Lazarus의 양자내성암호(post-quantum) 악용 C2, CISA의 \"Plex2Shell\" 명명\n- **Lazarus(북한 추정) C2 은닉**: Check Point 보도에 따르면, 북한 연계 Lazarus 그룹이 7~8월경 방위·항공 분야를 겨냥한 \"Dream Job\"(가짜 채용 제안) 공격에서 Windows 제로데이(CVE-2026-68820, AFD.sys, 8월 패치 완료)를 실행한 뒤, 명령·제어(C2) 통신 암호화에 양자컴퓨터도 풀기 어렵다는 양자내성암호(ML-KEM/Kyber)를 사용한 것이 뒤늦게 분석·보도됐다. 결함 자체는 이미 패치됐고 새로운 사건이 아니라 기존 캠페인의 기법 분석이므로 별도 `### [ID]`로 쓰지 않는다. ATT&CK 매핑은 추가하지 않는다(핵심 결함이 이미 지난 보고서 범위 밖에서 패치돼 이번 저장소의 신규 사건 기준에 맞지 않음).\n- **\"Plex2Shell\"**: CISA가 10/21 [D20261021-plex](2026-10-21.md)의 Plex Media Server 결함 4건이 실제로 체인으로 엮여 공격에 쓰인 사례를 \"Plex2Shell\"이라 명명해 공식 확인했다. 기존 매핑(TA0001\\|T1190\\|확인)을 그대로 유지하고 별도 사건으로 분리하지 않는다.\n\n## 3. 국내 소식\n\n**금융권 연쇄 해킹([D20261006-finsector](../과거3년/2026.md)) 후속 — 수사 체계와 공격 IP 특정**: 경찰청 사이버테러수사대가 10/5 정식 수사로 전환해 4개팀 28명 규모 전담수사팀을 꾸려 신한·KB국민·하나·BNK부산은행·현대캐피탈 등을 수사 중이며, 해외(중국발 추정) AI를 활용한 동시다발 공격 가능성을 염두에 두고 국제공조도 검토한다고 보도됐다. 금융감독원은 공격에 쓰인 IP 19개·12개국(미국·일본·홍콩·싱가포르 등, 국내 IP도 1개 포함)을 특정해 전 금융권에 배포하고 10/8까지 차단 여부 점검을 요청했다. 다만 동일 IP 발견이 동일 공격자를 확정하는 것은 아니라는 점은 10/6 보도에서도 이미 지적됐다(기존 기록과 동일한 유의사항). 이 건은 새 사건이 아니라 기존 사건의 수사·대응 후속이라 `국내뉴스.psv`에만 기록했다.\n\n**국내 질의 결과**: 지침에 따라 ①금융권 ②통신·OTT·이커머스 ③공공·지자체·교육·의료 ④국내 랜섬웨어 ⑤정부 발표 ⑥기존 사건 규모 갱신, 총 6개 범주를 각각 검색했다. ①금융권은 위 수사 후속만 새로 확인됐다. ②통신·이커머스(쿠팡·티빙·통신3사)는 10월 신규 사건을 찾지 못했고, 검색 결과는 모두 6~9월 티빙 유출 사건의 기존 보도였다(티빙 피해 규모가 1,953만 명으로 집계됐다는 9/22 국회 자료는 이미 지난 수치 갱신이라 이번 보고서에서는 새로 쓰지 않는다 — 날짜 확인 필요시 원문 참고). ③공공·지자체·교육·의료는 10월 신규 유출 사건을 찾지 못했다(가장 최근은 2월 따릉이 450만 건 유출이며 10월 신규분은 없음). ④국내 랜섬웨어 10월 통계는 아직 공개되지 않았다(안랩 ASEC 최신 월간 보고서는 7월자). ⑤과기정통부·금융위·개인정보보호위 등의 10월 중 신규 긴급 발표는 위 수사 후속 외에 확인하지 못했다. ⑥기존 사건 규모 갱신(티빙 1,953만 명 등)은 9월 자료로 보이며 이번 10월 질의에서 새로 포착된 것은 아니다.\n\n## 4. 우선 대응 체크리스트\n\n1. **PHP 치명적 결함 2건**: PHP로 돌아가는 모든 웹사이트/서버를 지금 8.5.12·8.4.27·8.3.36·8.2.35로 업데이트. 패치 전 공격이 이미 관측됐으므로 최우선.\n2. **SafePay 랜섬웨어**: VPN·엣지 장비 KEV 결함 패치, MFA 전면 적용(공동권고 기준).\n3. **UpdraftCentral**: 사용 중이면 지금 연결 키 삭제, 사이트 전수 점검, 벤더 수정판 발표 대기.\n4. **eMudhra CA 인증서**: 브라우저·OS 자동 업데이트 확인, Go/Node.js/배포판 ca-certificates 패치 여부 재확인.\n5. **Onamae Desktop Cloud 고객**: 영향 서버의 비밀번호·키를 안전한 기기에서 교체.\n6. [10-17](2026-10-17.md)~[10-21](2026-10-21.md) 보고서의 Ivanti·Atlassian·Ahsay·PAN-OS·Cisco SEG·BeyondTrust·Fortinet·SiteGuard·Plex·Siemens — 기한이 지났거나 임박한 건이 많으므로 미조치 상태라면 우선 처리.\n7. 금융권 연쇄 해킹 수사 결과·전담수사팀 진행 상황은 확인되는 대로 반영한다.\n\n## 5. 검증 수준과 한계\n\n- CISA KEV는 JSON 피드를 직접 받아 10/20 등재분 이후 10/21~10/22 신규 등재가 없음을 확인했다(1차 출처).\n- PHP2Shell·SafePay·UpdraftCentral·eMudhra·Onamae 5건은 BleepingComputer를 WebFetch로 직접 열람해 확인했다(일반 WebSearch는 이번에도 색인 지연으로 최근 1~2일 소식을 거의 찾지 못했다 — SafePay·PHP2Shell·Onamae·eMudhra는 일반 검색으로는 찾지 못하고 BleepingComputer 메인 페이지 직접 열람으로만 확인됨). BleepingComputer는 2차 보도이며, PHP·CISA/FBI·eMudhra·Patchstack 등 1차 발표 내용을 가능한 범위에서 교차 확인했으나 원문 공지를 전부 직접 열람하지는 못했다.\n- UpdraftCentral 건은 보고서 작성 시점 기준 \"진행 중, 벤더 수정 미공개\" 상태이며, 이후 상황이 바뀌었을 수 있다(원문 최신 버전 확인 필요).\n- eMudhra 건은 악용이 확인되지 않아 ATT&CK 매핑을 '후보'로만 두었다.\n- Onamae 건은 침투 경로가 공개되지 않아 ATT&CK 매핑을 하지 않았다.\n- 국내 질의 6개 범주 중 ②③⑥은 10월 신규 사건을 찾지 못했으며, 이것이 \"사건이 없다\"는 뜻인지 \"보도되지 않았다\"는 뜻인지는 구분할 수 없다.\n\n## 출처\n\n- CISA KEV JSON 피드 (직접 확인)\n- BleepingComputer(메인 페이지 직접 열람 및 개별 기사): PHP2Shell, SafePay(CISA/FBI AA26-293A), UpdraftCentral, eMudhra, Onamae Desktop Cloud, Plex2Shell\n- Cloudflare(CTO Dane Knecht 언급, 보도 인용), 영국 NCSC 권고(보도 인용)\n- Patchstack, Nethemba(보도 인용) — UpdraftCentral 분석\n- eMudhra 자체 발표(보도 인용), 연구자 Wayne·Flüpke(보도 인용), Mozilla/Dennis Jackson 공개 현황 페이지(보도 인용) — eMudhra 사건\n- Check Point Research(보도 인용) — Lazarus 참고 기록\n- mt.co.kr, news.mtn.co.kr, biz.sbs.co.kr, ytn.co.kr, weekly.khan.co.kr (국내 금융권 해킹 수사 후속 보도)\n- MITRE ATT&CK v19.2(저장소 기준)\n"},{"path":"일일/2026-10-23.md","title":"일일 보안 이슈 분석 — 2026-10-23","md":"# 일일 보안 이슈 분석 — 2026-10-23\n\n> 수집 기준: 2026-10-23(오늘, 조사 진행 시각까지 공개분). CISA KEV는 JSON 피드를 직접 확인했으며 10/20 등재분([10-22 보고서](2026-10-22.md) 수록) 이후 10/21~10/23 신규 등재는 없었다. 해외 소식은 BleepingComputer 메인 페이지를 WebFetch로 직접 열람해 확인했고(일반 WebSearch는 이번에도 10/22~23 당일 기사를 거의 찾지 못함), 국내 소식은 보안뉴스(boannews.com) 기사 목록을 WebFetch로 직접 확인했다.\n> 근거 표기: **[확인]** 벤더·정부기관·연구자가 직접 확인 / 보도 언론 보도 / **[추정]** 본 보고서의 추정 / **[주장]** 공격자 일방 주장. **조치는 본 보고서의 권고**이며 벤더 공식 지침이 우선한다.\n> **ATT&CK 버전 점검**: attack.mitre.org 확인 결과 공식 버전이 **v19.2 → v20.0**으로 올라갔다(오늘 확인). 이 저장소는 당분간 **v19.2 매핑을 유지**하며 임의로 대규모 재매핑하지 않는다. 자세한 내용은 5번 절 참고.\n\n## 1. 오늘의 요약\n\n| # | 이슈 | CVE | 유형 | 상태 | 즉시 조치 |\n|---|------|-----|------|------|-----------|\n| 1 | 커넥트와이즈 침해 — AI 에이전트 도구로 계정 탈취(Storm-0940) | — | 비밀번호 대입 + 신뢰 관계 악용 | [확인] MS 분석 발표, 과거 한국 금융권 공격 도구와 연관 | 커넥트와이즈 연동 앱 계정·토큰 전면 재발급 |\n| 2 | Arista VeloCloud Orchestrator 제로데이 | CVE-2026-114625 | SQL 삽입 → 권한 상승 | [확인] 실제 악용 중 | VCO 5.2.3.18·6.1.3.10·6.4.2.12 이상으로 즉시 패치 |\n| 3 | LiteLLM 공급망 공격 — 릴리스에 정보 탈취 악성코드 | — | 공급망(릴리스 파이프라인 변조) | [확인] 악성 버전 배포·제거 완료 | litellm 1.107.0 사용 환경 전수 점검·재구축 |\n| 4 | Capcom 데이터 유출(1,170만 계정) | — | 개인정보 유출 | [확인] 회사 확인, 경위 비공개 | 안내 메일 확인, 사칭 메일 주의 |\n| 5 | Railway 클라우드 플랫폼 비밀값 노출 | — | 비밀값(시크릿) 노출 가능성 | [확인] 회사 경고, 경위 비공개 | 저장된 환경변수·키 전면 교체 |\n| 6 | GitLab 정규표현식 컴파일러 치명적 RCE | CVE-2026-110264 | 인증 없는 원격 코드 실행(이론상) | [확인] 패치 공개, 실제 악용 미확인 | 19.5.1 등 패치 버전으로 업데이트 |\n| 7 | 연세대 학사 포털 해킹(국내) | — | 개인정보 유출 | [확인] 학교 확인, 경위 비공개 | 학교 공지 확인, 사칭 문자 주의 |\n| 8 | 한국국제교류재단 메일시스템 침해(국내) | — | 침해 조사 중 | [확인] 재단 확인, 경위 비공개 | 재단 발송 메일 사칭 주의 |\n\n## 2. 이슈별 분석\n\n### [D20261023-connectwise] 커넥트와이즈 클라우드 백업 침해 — AI 에이전트 도구 '아르텍스'로 계정 탈취(Storm-0940)\n> 날짜: 2026-10(9월부터 공격, 10/15 이후 수법 변화, 10/23 MS 분석 공개) · 유형: 비밀번호 대입 + 신뢰 관계 악용 · 행위자: Storm-0940(중국 정부 연계 추정) · 지역: 글로벌(한국 금융권 연관 이력 포함) · 근거: 확인\n\n**쉽게 말하면**: 마이크로소프트(MS)가 클라우드 백업 업체 커넥트와이즈(ConnectWise)의 침해 사건을 분석한 결과, 공격자가 AI가 스스로 여러 단계를 이어서 수행하는 \"에이전트형\" 해킹 도구 '아르텍스(ARTEX)'로 비밀번호 대입 공격과 계정 탈취를 자동화했고, 일부에서는 공격 시작 3시간 안에 관리자급 권한까지 손에 넣었다고 밝혔습니다. 이 도구는 과거 한국 금융기관을 겨냥한 공격에도 쓰인 적이 있어, 레코디드퓨처는 최근 한국 금융권을 노리는 공격 조직을 별도로 추적하고 있습니다.\n\n**먼저 할 일(초보용)**: 커넥트와이즈 서비스를 연동해 쓰고 있다면, 담당자는 연동 계정·토큰을 지금 재발급(회전)하고 MS 그래프·디렉터리에 낯선 계정·그룹·권한이 생기지 않았는지 확인하세요. 일반 이용자는 이 사건으로 바로 할 일은 없지만, 소속 기관이 커넥트와이즈를 쓰는지 담당 부서에 문의할 수 있습니다.\n\n**개요**: MS 위협 인텔리전스에 따르면 '아르텍스'는 고(Go) 언어로 만든 AI 에이전트형 침투 테스트 도구로, 표적 탐색부터 비밀번호 대입, 권한 악용까지 공격 과정을 자동으로 수행한다. 맞춤 배포본은 중국 AI 모델 딥시크(DeepSeek)를 쓰도록 설정돼 있었고 일부는 GLM·그록(Grok)도 지정됐다. 9월부터 중국 정부 연계 조직 '스톰-0940(Storm-0940)'이 이 도구로 항공우주·방산·자동차·금융·정부·반도체 등 14개 분야 수백 개 조직을 공격했다. 10/10~14 사이 8개 조직 계정 327개를 대상으로 대규모 비밀번호 대입을 시도해 실패 로그인이 15만 1천 건을 넘었으나(11일 하루 11만 건 이상, 최대 분당 2,900건) 실제 로그인 성공은 없었다. 10/15 이후에는 고객사 접근에 쓰이는 애플리케이션(OAuth) 자격 증명을 확보해 대화형 사용자 로그인 없이 앱 자체 인증으로 고객 환경에 진입하는 방식이 관측됐고(두 수법의 인과관계는 MS도 명시하지 않음), 일부 사례에서는 MS 그래프·계정 디렉터리까지 들어가 인증 정보·사용자 계정·그룹·고권한 역할을 조작했다. '아르텍스'는 과거 한국 금융기관 공격에도 쓰인 전력이 있는데(이후 소스코드는 비공개 전환), 레코디드퓨처 인사이크트그룹은 한국 금융권을 노리는 별도 조직을 'TAG-217'로 추적 중이며 8/17부터 원격 접속 기반시설 테스트·인터넷 스캔을 시작한 것으로 분석했다. **MS는 스톰-0940이 한국 금융권을 공격했다고 확정하지는 않으며, 도구가 여러 조직에서 공유돼 쓰인다는 점만 확인했다.**\n\n**왜 일어났나**\n- 직접 원인 [확인: MS]: AI 에이전트 도구로 대규모 비밀번호 대입을 자동화했으나(10/10~14, 로그인 성공 없음) 이와 별도로 커넥트와이즈 연동 애플리케이션(OAuth)의 자격 증명을 확보해, 사람이 직접 로그인하는 절차 없이 앱 자체의 인증으로 고객 환경에 접근했다. 비밀번호 대입이 이 자격 증명 확보로 직접 이어졌는지는 MS도 명확히 밝히지 않았다.\n- 구조적 원인 [추정]: (1) MSP·백업 업체처럼 여러 고객사에 연결된 서비스 계정은 한 번 장악되면 사용자 암호와 무관하게 모든 연결 고객사로 번질 수 있다 (2) AI 에이전트 도구는 사람이 수십 시간 걸릴 단계를 자동으로 빠르게 이어 붙여, 탐지·대응이 따라가기 전에 권한 상승까지 끝낼 수 있다 (3) 범용 AI 모델을 침투 작업에 맞게 \"조립\"하는 방식이라 특정 벤더 하나를 막아도 다른 조직이 같은 도구를 계속 쓸 수 있다.\n\n**침투 경로 [확인: MS]**: 대규모 비밀번호 대입(10/10~14, 로그인 성공 없음, 별개 관측) + 커넥트와이즈 연동 애플리케이션(OAuth)의 자격 증명 확보(경로 비공개) → 대화형 사용자 로그인 없이 앱 자체 인증으로 신뢰 관계를 악용해 고객 환경 진입 → (일부) MS 그래프·디렉터리 접근으로 인증 정보·계정·그룹·고권한 역할 조작.\n\n**어떻게 조치하나**\n- 즉시: 증거(인증 로그·디렉터리 변경 이력) 보존 후 커넥트와이즈 연동 애플리케이션 계정·토큰을 전면 재발급. MS는 공격자가 추가한 인증 정보가 정리 후에도 남아 다른 계정·클라우드 서비스 접근 통로로 쓰일 수 있다고 경고했으므로, 재발급 전 디렉터리 전체(계정·그룹·권한 변경 이력)를 점검한다.\n- 단기: MS 그래프·디렉터리 감사 로그에서 비정상적인 계정·그룹·권한 생성 이력 전수 조사. 애플리케이션(서비스) 계정에도 조건부 접근·이상 로그인 탐지 적용.\n- 장기: MSP·백업처럼 여러 고객사를 잇는 서비스 계정은 최소 권한·단기 토큰으로 제한하고, 사용자 암호와 별개로 애플리케이션 계정 자체의 이상 행위 탐지 체계를 갖춘다.\n- 탐지: 짧은 시간 내 다수 계정에 대한 대량 로그인 실패, 애플리케이션 계정의 평소와 다른 디렉터리 접근·권한 변경 시도.\n\n**교훈**: 비밀번호 대입이 전부 실패해도 공격이 끝난 게 아니다. 이미 부여된 애플리케이션 권한 하나만 장악하면 AI 도구가 사람 없이 몇 시간 안에 관리자 권한까지 이어 붙일 수 있다.\n\n### [D20261023-velocloud] Arista VeloCloud Orchestrator 제로데이(CVE-2026-114625)\n> 날짜: 2026-10-23(벤더 공지·패치 공개) · 유형: SQL 삽입 → 권한 상승 · 행위자: 미귀속 · 지역: 글로벌 · 근거: 확인\n\n**쉽게 말하면**: 기업 네트워크를 중앙에서 관리하는 Arista의 VeloCloud Orchestrator(VCO, 자체 설치형)에서 낮은 권한의 로그인 사용자가 데이터베이스 명령을 끼워 넣는 결함으로 \"슈퍼유저\" 권한까지 올라갈 수 있는 치명적 결함이 실제로 공격에 쓰이고 있습니다.\n\n**먼저 할 일(초보용)**: VCO On-Prem을 운영한다면 지금 5.2.3.18·6.1.3.10·6.4.2.12 이상으로 업데이트하세요. 당장 패치가 어렵다면 Arista가 공개한 공격자 IP(74.82.197.86, 38.54.50.151)를 차단하고 관리 웹 화면 접근을 관리망으로만 제한하세요.\n\n**개요**: CVE-2026-114625는 인증된 일반 사용자가 SQL 삽입으로 로컬 \"슈퍼유저 운영자\" 권한을 얻을 수 있는 결함이다. 공격에 필요한 조건은 기본 권한, VCO 웹 인터페이스 접근, 유효한 인증 세션뿐이며 사용자 개입(클릭 등)이 필요 없는 저난이도 공격이다. Arista는 공격이 진행 중이라고 밝히고 패치 버전과 임시 완화책(공격자 IP 차단, 관리망 제한, 접속 로그 점검)을 함께 공개했다.\n\n**왜 일어났나**\n- 직접 원인 [확인: Arista]: 웹 인터페이스의 입력값 검증 부족으로 SQL 삽입이 가능해, 인증된 일반 계정이 권한 상승 질의를 실행할 수 있었다. **공격자가 그 \"인증된 일반 계정\" 자체를 어떻게 처음 확보했는지는 공개되지 않았다** — 이번 사건의 결함(CVE-2026-114625)은 권한 상승 수단이며 최초 진입 수단이 아니다.\n- 구조적 원인 [추정]: 네트워크 전체를 중앙에서 통제하는 관리 콘솔(오케스트레이터)은 공격 성공 시 보상이 크기 때문에 지속적으로 표적이 된다. 저난이도·무상호작용 결함일수록 자동화 스캐너로 빠르게 대량 악용되기 쉽다.\n\n**침투 경로 [확인: Arista(권한 상승 부분만), 최초 진입은 미공개]**: (최초 접근 경로 비공개) → 인증된(낮은 권한) 세션으로 VCO 웹 인터페이스 접근 → SQL 삽입 질의 실행 → VCO 내부 \"슈퍼유저 운영자\" 역할 권한 획득. 획득 이후 행위(설정 변경, 터널 트래픽 열람 등)는 공개되지 않았다.\n\n**어떻게 조치하나**\n- 즉시: 증거(웹 접근 로그, 최근 관리자 활동 이력) 보존 후 패치. 공격자 IP 차단, 관리 웹 인터페이스를 관리망에서만 접근 가능하게 제한.\n- 단기: 패치 전후 관리자 계정·설정 변경 이력 소급 점검, 침해 의심 시 Arista TAC에 연락.\n- 장기: 네트워크 오케스트레이터 같은 단일 관리 콘솔은 외부 인터넷에 직접 노출하지 않고 전용 관리망·VPN을 통해서만 접근하도록 재설계.\n- 탐지: 저권한 계정의 비정상적인 권한 상승 흔적, 알려진 공격자 IP로부터의 접속 시도.\n\n**교훈**: \"인증된 사용자\"라는 조건은 생각보다 낮은 문턱이다. 저권한 계정 하나만 있으면 SQL 삽입 같은 흔한 결함으로도 관리 콘솔 전체 권한까지 올라갈 수 있다.\n\n### [D20261023-litellm] LiteLLM 공급망 공격 — 릴리스 파이프라인 장악, PyPI·Docker에 정보 탈취 악성코드 배포\n> 날짜: 2026-10-21(공격)~10-22(제거 완료, 보도) · 유형: 공급망(릴리스 파이프라인 변조) · 행위자: 미귀속 · 지역: 글로벌 · 근거: 확인(Socket·Endor Labs 분석, 메인테이너 확인)\n\n**쉽게 말하면**: 여러 AI 서비스를 중개하는 오픈소스 도구 LiteLLM의 \"정식 배포 과정\" 자체가 공격자에게 장악돼, PyPI·Docker Hub·GitHub 컨테이너 저장소에 정보 탈취 악성코드가 심긴 가짜 정식 버전(1.107.0)이 약 2~3시간 동안 올라가 있었습니다. 코드를 내려받거나 `pip install`만 해도 비밀번호·API 키·개발 도구 인증정보가 통째로 빠져나갈 수 있는 구조였습니다.\n\n**먼저 할 일(초보용)**: LiteLLM 1.107.0을 설치·배포했거나 그 시간대에 pip/Docker 명령을 실행한 적이 있다면, 지금 추가로 Python이나 pip를 실행하지 말고(실행할 때마다 악성코드가 다시 동작할 수 있음) 해당 환경을 깨끗한 백업에서 다시 만들고, 그 환경에 있던 모든 비밀번호·키·토큰을 **다른 안전한 환경에서** 새로 발급하세요.\n\n**개요**: 공격자는 10/21 LiteLLM의 공식 릴리스 파이프라인을 장악해 악성 버전 1.107.0을 PyPI(7개 wheel, 11:39~13:23 UTC), Docker Hub(14:20 UTC까지), GitHub 컨테이너 레지스트리(13:51 UTC까지)에 배포했다. 애플리케이션 코드 자체는 건드리지 않고 cook.pth·cook.py·sitecustomize.py 세 파일을 라이브러리 디렉터리에 추가했는데, 파이썬은 시작할 때마다 .pth 파일과 sitecustomize를 자동으로 실행하므로 Python이나 pip를 켤 때마다(점검을 위해 켜는 것까지 포함) 악성코드가 함께 실행됐다. 보안 업체 Socket·Endor Labs가 배포 6분 만에 탐지해 분석을 공개했고, 악성 버전은 이후 제거됐다. 전사용(엔터프라이즈) 비공개 버전 고객은 영향받지 않았다. 안전한 버전은 1.106.2다.\n\n**왜 일어났나**\n- 직접 원인 [확인: Socket·Endor Labs]: 코드 저장소 자체가 아니라 빌드·배포(릴리스) 과정이 장악돼, 정상 버전 번호를 단 악성 패키지가 공식 배포처(PyPI·Docker Hub·GHCR)를 통해 그대로 뿌려졌다.\n- 구조적 원인 [추정]: (1) 오픈소스 프로젝트의 릴리스 파이프라인은 코드 리뷰보다 접근 통제가 약한 경우가 많아, 코드 저장소가 안전해도 배포 단계가 별도의 공격 지점이 된다 (2) 파이썬의 .pth/sitecustomize 자동 실행 기능은 정상적인 환경 설정 용도이지만, 그 특성 때문에 설치 이후 \"껐다 켤 때마다\" 악성코드가 반복 실행되는 지속성 수단으로도 쓰인다 (3) LiteLLM은 올해 3월에도 CI/CD에서 쓰던 Trivy 스캐너가 뚫려 공급망 공격을 당한 적이 있어, 같은 프로젝트가 서로 다른 경로로 반복해서 공급망 공격의 표적이 됐다.\n\n**침투 경로 [확인/추정]**: 릴리스 파이프라인 장악(구체적 침투 수단 비공개, 탈취된 것으로 보이는 배포용 토큰이 쓰였다는 보도가 있으나 그 토큰의 최초 탈취 경로는 미확정) → 악성 버전을 PyPI·Docker Hub·GHCR에 정상 버전으로 배포(공급사 배포 경로 변조, T1195.002) → 설치 환경에서 Python/pip 실행 시 .pth·sitecustomize 자동 실행으로 악성코드 구동 → 클라우드·개발자 자격 증명(.env, SSH/GPG/TLS 키 등) 탐색·수집 → AES-256-CBC(키는 RSA-4096)로 암호화해 공격자가 통제하는 수집 엔드포인트(litellm[.]dev/healthcheck)로 전송 → 별도 상주 로더가 외부 포인터를 주기적으로 확인해 추가 코드를 내려받아 실행.\n\n**어떻게 조치하나**\n- 즉시: 1.107.0을 설치·실행한 적이 있는 환경은 추가로 Python을 실행하지 말고 격리, 증거(설치 로그·네트워크 기록) 보존.\n- 단기: 영향 환경은 패키지 디렉터리 삭제만으로 끝내지 말고(시작 파일·상주 로더가 남을 수 있음) 깨끗한 백업에서 재구축. 그 환경에서 쓰던 클라우드·Git·npm·SSH/GPG/TLS·CI/CD 비밀을 **격리된 다른 환경에서** 전부 재발급.\n- 장기: 오픈소스 의존성은 릴리스 파이프라인(배포 단계) 접근 통제·서명 검증도 공급망 위험 평가 대상에 포함하고, 설치 전 해시·서명 검증을 자동화.\n- 탐지: 짧은 시간에만 존재했다 사라진 패키지 버전, Python 시작 시 비정상 외부 통신, 사이트 패키지 디렉터리의 예상치 못한 .pth/sitecustomize 파일.\n\n**교훈**: 소스코드 저장소가 안전해도 \"그 코드를 어떻게 포장해서 보내는가\"의 단계가 뚫리면 똑같이 전체 사용자가 위험해진다. 공급망 보안은 코드 리뷰만으로 끝나지 않는다.\n\n### [D20261023-capcom] Capcom CAPCOM ID 데이터 유출 — 계정 1,170만여 개 영향\n> 날짜: 2026-10-19(탐지·확인)~10-21(신고) · 유형: 개인정보 유출 · 행위자: 미귀속 · 지역: 글로벌(일본) · 근거: 확인\n\n**쉽게 말하면**: 일본 게임사 Capcom의 여러 서비스에서 공통으로 쓰는 로그인 계정(CAPCOM ID)이 해킹당해 1,170만여 개 계정의 이메일 주소와 로그인 관련 정보가 유출됐습니다. 극히 일부(43개 계정)는 생년월일·성별 등 더 많은 정보가, 196개 계정은 비밀번호가 공격자에 의해 바뀌어 잠겼습니다. 비밀번호 자체와 신용카드 정보는 영향이 없다고 회사는 밝혔습니다.\n\n**먼저 할 일(초보용)**: CAPCOM ID를 쓰고 있다면 Capcom의 공식 안내 메일·공지만 믿고, \"계정 확인\"을 유도하는 다른 이메일·문자의 링크는 누르지 마세요. 같은 이메일·비밀번호를 다른 사이트에서도 쓰고 있다면 그 사이트들의 비밀번호를 바꾸는 것이 안전합니다.\n\n**개요**: Capcom은 10/19 CAPCOM ID에 대한 비인가 접근을 확인했고 다음 날 고객 정보 유출을 공식 확인했다. 10/21 경찰과 일본 개인정보보호위원회(PPC)에 신고했다. 유출 항목은 1,170만여 개 계정의 이메일 주소, 계정 생성일, 마지막 로그인 시각·횟수·IP 주소이며, 43개 계정은 생년월일·성별·닉네임·국가까지 포함됐다. 196개 계정은 공격자가 비밀번호를 바꿔 소유자가 접근할 수 없게 만들었고 Capcom이 재설정했다. 비밀번호(다른 계정)와 신용카드 정보는 영향받지 않았고 서비스는 계속 운영 중이다. **최초 침투 방법은 공개되지 않았다.** Capcom은 2020년에도 Ragnar Locker 랜섬웨어 공격을 당해 당시 오래된 VPN 장비를 통해 침입당한 것으로 2021년 확인됐다.\n\n**왜 일어났나**\n- 직접 원인: 공개되지 않았다. Capcom은 \"침투 경로를 파악하고 재발 방지 조치를 취했다\"고만 밝혔다.\n- 구조적 원인 [추정]: (1) 여러 서비스·게임을 하나의 공용 계정(CAPCOM ID)으로 묶는 구조는 편리한 만큼, 그 계정 시스템 하나가 뚫리면 연결된 모든 서비스의 이용자 정보가 동시에 노출된다 (2) 2020년에도 오래된 VPN 장비로 침해를 당한 전력이 있어, 외부 노출 자산 관리가 반복되는 약점일 가능성이 있으나 이번 사건의 원인으로 확정할 근거는 없다.\n\n**침투 경로 [미공개]**: 공개된 자료에서 확인되지 않아 이 보고서는 매핑하지 않는다.\n\n**어떻게 조치하나**\n- 즉시(회사): 증거 보존, 신고(경찰·PPC) 완료, 영향 계정 단계적 통지, 지역별 상담 채널 운영.\n- 즉시(이용자): 사칭 메일·문자 주의. 다른 서비스에서 같은 비밀번호를 쓰고 있다면 **그 서비스에서** 바꾸기(CAPCOM ID 비밀번호 자체는 영향 없음).\n- 단기: 침투 경로 공식 발표 시 그 경로를 막는 조치(패치·접근 통제)를 전사 자산에 동일하게 적용.\n- 장기: 공용 계정 시스템의 로그인 이상 탐지(대량 비밀번호 변경 시도 등) 강화, 2020년 사고 이후 개선 조치의 재점검.\n- 탐지: 해당 없음(이미 발견·신고된 사건).\n\n**교훈**: \"하나의 계정으로 모든 서비스를 쓰게\" 만드는 편의 기능은 침해가 났을 때 피해 범위도 그만큼 넓힌다.\n\n### [D20261023-railway] Railway 클라우드 플랫폼 — 고객 비밀값(시크릿) 노출 가능성\n> 날짜: 2026-10(이번 주 초 탐지, 10/22 공개) · 유형: 클라우드 플랫폼 비밀값 노출 · 행위자: 미귀속 · 지역: 글로벌 · 근거: 확인(회사 공지)\n\n**쉽게 말하면**: 코드를 올리면 자동으로 서버에 배포해 주는 클라우드 서비스 Railway가 \"고객의 환경변수(API 키·DB 접속정보 등 비밀값)를 저장하는 시스템에서 외부인의 접근이 의심된다\"고 이용자들에게 경고하며 비밀값을 모두 바꾸라고 안내했습니다. 일부는 암호화가 풀린 채로 접근됐을 가능성이 있다고 합니다.\n\n**먼저 할 일(초보용)**: Railway를 쓰고 있다면 지금 그 플랫폼에 저장해 둔 모든 환경변수·API 키·DB 비밀번호·프라이빗 레지스트리 접속정보를 새로 발급해 교체하세요. 서비스 로그에서 이상한 접근이 없었는지도 함께 확인하세요.\n\n**개요**: Railway는 고객 환경변수를 저장하는 시스템에서 의심스러운 활동을 발견했다며, 외부인이 암호화된 변수에 접근했고 일부는 복호화된 형태로 노출됐을 수 있다고 밝혔다. 이용자 약 480만 명, 서비스 1,600만여 개를 서비스하는 플랫폼으로, 초기 분석상 일부 이용자만 영향받았을 가능성이 있지만 회사는 전체 이용자에게 조치를 권고했다. 조사 중 모든 배포를 일시 중단했고, 10/22 08:44(UTC) 기준 Pro·Enterprise 워크스페이스의 빌드는 복구됐지만 배포는 여전히 지연됐다(Hobby·Free·Trial은 미복구). Railway는 이 사건을 \"AI 추론(inference) 제공업체들을 겨냥한 일련의 공격\"의 일부로 설명했으며, 해당 업체들에는 통지하고 키 회수를 권고했다고 밝혔다. **구체적인 최초 침투 방법은 공개되지 않았다.**\n\n**왜 일어났나**\n- 직접 원인: 공개되지 않았다. 회사는 \"의심스러운 활동\"만 언급했다.\n- 구조적 원인 [추정]: (1) 여러 고객의 비밀값을 한 플랫폼이 대신 보관·암호화하는 구조는, 그 저장 시스템 자체가 뚫리면 암호화 여부와 무관하게 다수 고객이 동시에 위험해진다 (2) \"AI 추론 제공업체를 겨냥한 일련의 공격\"이라는 설명은 같은 시기 AI 관련 인프라가 반복 표적이 되고 있음을 보여주는 단서이나, 구체적 연결고리는 공개되지 않았다.\n\n**침투 경로 [미공개]**: 공개된 자료에서 확인되지 않아 이 보고서는 매핑하지 않는다.\n\n**어떻게 조치하나**\n- 즉시(이용자): 플랫폼에 저장된 모든 환경변수·API 키·프라이빗 레지스트리 자격 증명을 **다른 안전한 위치에서** 새로 발급·교체. 관련 서비스 로그에서 이상 활동 점검.\n- 즉시(회사): 배포 일시 중단(시행), 영향 확인된 계정 개별 통지, 조사 완료까지 투명한 현황 공지.\n- 단기: 영향 범위(어떤 고객·변수가 실제로 복호화돼 노출됐는지) 확정 후 재통지.\n- 장기: 고객 비밀값 저장소에 대한 접근 감사 강화, 평시에도 비밀값 수명 단축·자동 회전 유도.\n- 탐지: 해당 없음(이미 발견·공개된 사건).\n\n**교훈**: \"암호화돼 저장돼 있다\"는 것이 저장 시스템 자체가 뚫렸을 때의 안전을 보장하지는 않는다. 플랫폼이 대신 보관하는 비밀값일수록 유출 시 즉시 전면 교체가 유일한 확실한 대응이다.\n\n### [D20261023-gitlab] GitLab 정규표현식 컴파일러 치명적 결함(CVE-2026-110264)\n> 날짜: 2026-10-22(패치 공개) · 유형: 인증 없는 원격 코드 실행(이론상, 실제 악용 미확인) · 행위자: 해당 없음 · 지역: 글로벌 · 근거: 확인(실제 악용은 미확인)\n\n**쉽게 말하면**: 소스코드 관리 도구 GitLab에서, 특정 형식으로 만든 정규표현식(패턴) 하나만 서버가 처리하게 만들면 로그인 없이도 서버에서 임의 코드를 실행시킬 수 있는, 벤더가 \"최고 위험도(치명적)\"로 분류한 결함이 발견돼 패치됐습니다. 아직 실제로 이용된 공격은 확인되지 않았습니다.\n\n**먼저 할 일(초보용)**: GitLab을 직접 설치해 운영한다면(GitLab.com 이용자는 이미 자동 적용됨) 관리자가 지금 19.5.1·19.4.3·19.3.6·19.2.9·19.1.9·19.0.10·18.11.13 중 해당 버전으로 업데이트하도록 요청하세요.\n\n**개요**: CVE-2026-110264는 설정 파일 속 정규표현식을 해석하는 내부 엔진(Regular Expression Compiler)의 정수 오버플로 결함으로, 특수하게 조작된 정규표현식을 컴파일할 때 인증 없이 서버에서 임의 코드를 실행시킬 수 있다. 연구자 'joaxcar'가 GitLab의 버그바운티(HackerOne)로 신고했다. GitLab.com은 이미 패치됐고, 자체 설치형(Self-managed) 사용자는 19.5.1 등으로 업데이트해야 한다. 보안업체 Shadowserver는 인터넷에 노출된 GitLab CE 인스턴스를 2,700개 이상 추적 중이다. **보도 시점까지 실제 악용 사례는 확인되지 않았다.**\n\n**왜 일어났나**\n- 직접 원인 [확인: GitLab]: 정규표현식을 처리하는 내부 컴파일러의 정수 오버플로로 메모리 처리가 어긋나 임의 코드 실행까지 이어질 수 있었다.\n- 구조적 원인 [추정]: 사용자 입력(정규표현식 같은 패턴 문자열)을 해석하는 내부 엔진은 \"그냥 문자열 처리\"로 보이기 쉬워 외부 공격 표면으로 충분히 취급되지 않는 경우가 많다.\n\n**침투 경로 [후보]**: 실제 악용이 확인되지 않아 이 보고서는 '후보'로만 매핑한다. 이론상: 인증 없이 조작된 정규표현식을 GitLab 서버가 처리하게 만드는 경로를 통한 악용이 가능하다고 벤더가 밝혔다.\n\n**어떻게 조치하나**\n- 즉시: 자체 설치형 GitLab을 19.5.1 등 패치 버전으로 업데이트. GitLab.com·GitLab Dedicated 이용자는 추가 조치 불필요.\n- 단기: 인터넷에 노출된 GitLab 인스턴스가 있는지 확인(Shadowserver 등 외부 노출 자산 점검 활용).\n- 장기: 입력값을 해석하는 내부 엔진(파서·컴파일러류)도 정기 보안 감사·퍼징 대상에 포함.\n- 탐지: 해당 없음(실제 악용 미확인, 패치 적용이 핵심 대응).\n\n**교훈**: 벤더가 매긴 \"최고 위험도\" 등급이 곧 \"이미 악용되고 있다\"는 뜻은 아니다. 다만 인증이 필요 없고 상호작용도 필요 없는 결함은 패치를 늦출수록 위험이 누적된다.\n\n### [D20261023-yonsei] 연세대 학사 행정 포털 개인정보 유출 (국내)\n> 날짜: 2026-10-22(학교 확인·공지) · 유형: 개인정보 유출 · 행위자: 미귀속 · 지역: 한국 · 근거: 확인(학교 공지, 보도)\n\n**쉽게 말하면**: 연세대 학사 행정 포털에 외부인이 허락 없이 접근해 재학생·졸업생 등 약 1만여 명의 학번·휴대전화번호·이메일 등이 유출됐습니다. 주민등록번호 같은 더 민감한 정보는 포함되지 않았다고 학교는 밝혔습니다.\n\n**먼저 할 일(초보용)**: 연세대 구성원이라면 학교 공지(대표 홈페이지)에서 내 정보가 유출됐는지 확인하고, 학교·행정실을 사칭한 문자·전화·메일을 조심하세요. 다른 사이트에서 같은 비밀번호를 쓰고 있다면 그 사이트의 비밀번호도 바꾸는 것이 안전합니다.\n\n**개요**: 연세대 정보통신처는 학사 행정 포털에서 \"외부 비인가 접근\"을 확인해 10/22 개인정보 유출 안내를 발표했다. 유출 항목은 재학생·졸업생의 학번, 휴대전화번호, 이메일, 일부 시스템 관리 정보이며, 주민등록번호 등 고유식별정보·민감정보는 포함되지 않았다고 학교는 설명했다. 피해 규모는 재학생 등 1만여 명(보도)이며 졸업생 포함 정확한 인원·항목별 집계는 공개되지 않았다. 학교는 인지 즉시 유출 경로를 차단하고 수사기관에 수사를 의뢰했다.\n\n**왜 일어났나**\n- 직접 원인: 공개되지 않았다. 학교는 \"외부 비인가 접근\"이라고만 밝혔고 공격 방식·침투 경로·시점은 공개하지 않았다.\n- 구조적 원인 [추정]: 공개된 정보만으로는 구조적 원인을 판단하기 어렵다. 학사 포털 같은 재학생·졸업생 대량 개인정보를 다루는 시스템은 그 자체로 반복적인 표적이 되는 경향이 과거 사례(서울사이버대 등)에서도 확인된다[추정, 이번 사건과의 직접적 연결은 아님].\n\n**침투 경로 [미공개]**: 공개된 자료에서 확인되지 않아 이 보고서는 매핑하지 않는다.\n\n**어떻게 조치하나**\n- 즉시: 증거(접근 로그) 보존, 유출 경로 차단(완료), 수사 의뢰(완료), 구성원 개별 유출 항목 공지.\n- 단기: 학사 포털 접근 로그 소급 분석으로 침투 시점·범위 확정, 2차 피해(사칭 문자·전화) 모니터링.\n- 장기: 학사 시스템 외부 접점(로그인·연동 API) 전수 점검, 재학생·졸업생 개인정보 보유 기간·최소화 정책 재검토.\n- 탐지: 학사 DB 대량 조회, 평소와 다른 시간대·경로의 관리자 계정 접근.\n\n**교훈**: 경위가 공개되지 않아도 피해자 안내와 차단을 먼저 하는 것이 2차 피해를 줄인다. 다만 원인을 모른 채 \"같은 방식의 재발\"을 막을 수는 없으므로 경위 규명이 이후 핵심 과제다.\n\n### [D20261023-kfund] 한국국제교류재단(KF) 메일시스템 침해 조사 (국내)\n> 날짜: 2026-10-19(이상 징후 발견)~10-22(신고) · 유형: 침해 조사 중(실제 유출 여부 미확정) · 행위자: 미귀속 · 지역: 한국 · 근거: 확인(재단 신고, 보도)\n\n**쉽게 말하면**: 한국국제교류재단의 대량 홍보메일 발송 시스템에서 수상한 접근 흔적이 발견됐습니다. 이 시스템에는 구독자 이메일 주소 약 22만 7천 건(이름 포함 약 18만 7천 건, 전화번호 포함 약 5,400건)이 들어 있었는데, **이 숫자는 서버에 저장돼 있던 양이고 실제로 빼내 갔는지는 아직 확인되지 않았습니다.**\n\n**먼저 할 일(초보용)**: 한국국제교류재단의 홍보메일을 받아본 적이 있다면, 재단·외교·문화교류 행사를 사칭한 메일이나 문자의 링크·첨부파일을 열지 마세요. 재단은 전화로 비밀번호나 결제 정보를 묻지 않습니다.\n\n**개요**: 재단은 10/19 자체 보안 점검 중 메일 발송 시스템에서 이상 징후를 발견해 해당 서버를 긴급 차단했다. 서버에는 이메일 주소 약 22만 7천 건, 그중 이름이 함께 저장된 건이 약 18만 7천 건, 전화번호까지 결합된 건이 약 5,400건 있었다(이메일·성명·연락처가 결합된 형태로 보관). 재단은 10/22 개인정보보호위원회에 신고하고 대상자 통지를 마쳤다고 밝혔으며, 정밀 포렌식으로 침투 경로와 실제 유출 여부·규모를 조사 중이다. **공격자가 메일 서버에 어떻게 침투했는지는 공개되지 않았다.**\n\n**왜 일어났나**\n- 직접 원인: 공개되지 않았다. 재단은 침투 경로를 조사 중이라고만 밝혔다.\n- 구조적 원인 [추정]: 대량 메일 발송 시스템은 이름·이메일·연락처가 결합된 형태로 구독자 정보를 한곳에 모아 두는 경우가 많아, 홍보용 도구 하나가 뚫리면 결합된 개인정보 전체가 한꺼번에 위험해지는 구조적 특징이 있다[추정].\n\n**침투 경로 [미공개]**: 공개된 자료에서 확인되지 않아 이 보고서는 매핑하지 않는다.\n\n**어떻게 조치하나**\n- 즉시: 문제 서버 차단(완료), 증거 보존, 개인정보보호위원회 신고·대상자 통지(완료).\n- 단기: 포렌식으로 실제 유출 여부·범위 확정, 확정되는 대로 재통지. 결합 저장된 개인정보(이메일+이름+연락처)의 접근 권한 재점검.\n- 장기: 홍보·마케팅용 메일 시스템도 민감도에 맞는 접근 통제·암호화 적용, 구독자 정보 보유 기간 최소화.\n- 탐지: 메일 발송 시스템의 비정상적인 대량 조회·내보내기(export) 시도.\n\n**교훈**: \"홍보메일 발송\"처럼 핵심 업무가 아닌 것처럼 보이는 시스템도 대량의 결합된 개인정보를 쥐고 있을 수 있다. 실제 유출 여부가 불확실해도 선제적으로 신고·통지한 것은 긍정적인 대응이다.\n\n### 참고 기록 — PHP2Shell 공격 시작 시점 추가 확인(아마존)\n- **아마존 위협 인텔리전스 확인**: 아마존은 [D20261022-php2shell](2026-10-22.md) 결함(CVE-2026-109618·109619)에 대한 공격 시도가 패치 공개(10/21)보다 **4일 앞선 10/17(토)**에 이미 시작됐다고 확인했다. 허니팟에서 사전 공격을 탐지했으며, Cloudflare·watchTowr·Patchstack도 공개 전 실패한 공격 시도를 확인했다고 보도됐다. \"방어자는 공개일을 최초 공격 시점으로 가정해서는 안 된다\"는 경고다. 패치 공개 이후 관측된 활동은 대부분 스캐닝·핑거프린팅·작동하지 않는 익스플로잇 수준이며 확인된 침해 사례는 아직 보고되지 않았다(Dataminr). 기존 매핑(TA0001\\|T1190\\|확인)을 유지하고 별도 사건으로 분리하지 않는다.\n\n## 3. 국내 소식\n\n**금융권 연쇄 해킹([D20261006-finsector](../과거3년/2026.md)) 후속 — 가상자산거래소 등으로 조사·신고 대상 확대, 16개사·약 10만 건 집계**: 10/14 금융위원회 제2차 긴급 상황대응 회의에서 침해사고·접근시도가 확인돼 조사·신고 대상에 오른 금융사가 16곳으로 늘고 유출 규모가 약 10만 건으로 집계됐다고 밝혔다(개별 사건들이 같은 공격자의 연쇄 침해인지는 확인되지 않았다). 가상자산거래소 고팍스(운영사 스트리미)와 코인마켓거래소 프라뱅도 새로 포함됐는데, 고팍스는 다른 곳에서 유출된 것으로 추정되는 아이디·비밀번호 조합으로 고객 계정에 로그인을 시도한 흔적이 이상거래탐지시스템(FDS)에 포착돼 당국에 신고했다(로그인 성공·고객 자산 피해는 없다고 밝힘, 접근 경로 조사 중) — 이는 기존 사건들과 달리 서버 직접 침입이 아니라 **다른 서비스에서 유출된 계정정보로 로그인을 시도하는 방식(크리덴셜 스터핑)**이라는 점에서 공격 양상이 넓어졌음을 보여준다. 프라뱅은 이용자 20명의 개인정보(이름·성별·국적·생년월일·연락처·주소·직장 등 12개 항목)가 유출됐다고 확인했다. 금융당국이 555개 금융사를 긴급 점검한 결과 130곳에서 보안 패치 미적용 등 미흡사항이 발견됐고, 산은캐피탈(848명)·피에프씨테크놀로지스(302명) 등 개별 유출 사례도 추가 보도됐다. 이 건은 기존 사건의 규모·범위 갱신이라 새 사건으로 쓰지 않고 `국내뉴스.psv`에 기록했다.\n\n**PHP2Shell([D20261022-php2shell](2026-10-22.md)) 국내 대응**: 과기정통부·KISA가 민간 분야 사이버위기 경보를 '주의' 단계로 올리고 기업용 PHP 취약점 대응 수칙을 배포했다. 금융보안원은 금융사에 웹 API 즉시 점검을 권고했고, 개인정보보호위원회는 이 결함으로 개인정보가 유출될 수 있다며 홈페이지 연계 DB의 접근권한 최소화를 당부했다. 새 사건이 아니라 기존 해외 사건의 국내 대응 후속이라 `국내뉴스.psv`에만 기록했다.\n\n**국내 질의 결과**: 지침에 따라 ①금융권 ②통신·OTT·이커머스 ③공공·지자체·교육·의료 ④국내 랜섬웨어 ⑤정부 발표 ⑥기존 사건 규모 갱신, 총 6개 범주를 각각 검색했다. ①금융권은 위 가상자산거래소 확산·16개사 집계가 새로 확인됐다. ②통신·이커머스(쿠팡·티빙)는 10월 신규 사건을 찾지 못했고, 검색 결과는 모두 6~9월 티빙 유출 사건의 기존 보도였다. ③공공·지자체·교육·의료는 일반 WebSearch로는 10월 신규 사건을 찾지 못했으나, 보안뉴스(boannews.com) 기사 목록 직접 열람으로 **연세대([D20261023-yonsei](#d20261023-yonsei-연세대-학사-행정-포털-개인정보-유출-국내))·한국국제교류재단([D20261023-kfund](#d20261023-kfund-한국국제교류재단kf-메일시스템-침해-조사-국내))** 두 건을 새로 확인해 이번 보고서의 사건으로 등록했다(일반 WebSearch는 이번에도 10월 신규 공공·교육기관 사건을 찾지 못함 — boannews 직접 열람이 더 효과적이었다). ④국내 랜섬웨어 10월 통계는 공개되지 않았다(안랩 ASEC 최신 월간 보고서는 7월자, 이전과 동일). ⑤과기정통부·금융위·개인정보보호위 등의 10월 중 발표는 위 PHP2Shell 대응 수칙 배포·경보 격상 외에 추가로 확인하지 못했다. ⑥기존 사건 규모 갱신은 위 금융권 건이 해당한다.\n\n## 4. 우선 대응 체크리스트\n\n1. **커넥트와이즈 연동 조직**: 연동 애플리케이션 계정·토큰 전면 재발급, MS 그래프·디렉터리 변경 이력 점검.\n2. **Arista VCO 운영자**: 5.2.3.18·6.1.3.10·6.4.2.12 이상으로 즉시 패치, 공개된 공격자 IP 차단.\n3. **LiteLLM 1.107.0 사용 환경**: Python 재실행 금지, 깨끗한 백업에서 재구축, 모든 비밀값 다른 환경에서 재발급.\n4. **Capcom CAPCOM ID 이용자**: 공식 안내만 신뢰, 사칭 메일 주의, 동일 비밀번호 재사용 시 다른 서비스에서 교체.\n5. **Railway 이용자**: 저장된 환경변수·API 키·레지스트리 인증정보 전체 교체.\n6. **GitLab 자체 설치형 운영자**: 19.5.1 등 패치 버전으로 업데이트(악용 미확인이지만 치명적 등급).\n7. **연세대·한국국제교류재단 관련자**: 공식 공지 확인, 사칭 메일·문자 주의.\n8. **금융권 연쇄 해킹**: 가상자산거래소까지 조사·신고 대상이 넓어졌으므로 크리덴셜 스터핑(다른 서비스에서 유출된 계정정보로 로그인 시도) 대비 로그인 이상 탐지도 함께 점검.\n9. [10-17](2026-10-17.md)~[10-22](2026-10-22.md) 보고서의 Ivanti·Atlassian·Ahsay·PAN-OS·Cisco SEG·BeyondTrust·Fortinet·SiteGuard·Plex·Siemens·PHP·SafePay·UpdraftCentral·eMudhra·Onamae — 기한이 지났거나 임박한 건이 많으므로 미조치 상태라면 우선 처리.\n\n## 5. 검증 수준과 한계\n\n- CISA KEV는 JSON 피드를 직접 받아 10/20 등재분 이후 10/21~10/23 신규 등재가 없음을 확인했다(1차 출처).\n- 해외 6건은 BleepingComputer 메인 페이지·개별 기사를 WebFetch로 직접 열람해 확인했다(일반 WebSearch는 이번에도 10/22~23 당일 소식을 거의 찾지 못함). BleepingComputer는 2차 보도이며, MS·Arista·GitLab·Capcom·Railway·LiteLLM 측 1차 발표 내용을 가능한 범위에서 교차 확인했으나 원문 공지를 전부 직접 열람하지는 못했다.\n- Capcom·Railway·연세대·한국국제교류재단 4건은 **최초 침투 경로가 공개되지 않아** ATT&CK 매핑을 하지 않았다(분류 J에 준함).\n- GitLab 건은 실제 악용이 확인되지 않아 매핑을 '후보'로만 두었다.\n- 커넥트와이즈 건은 MS가 \"스톰-0940이 한국 금융권을 공격했다\"고 확정하지 않았으므로, 본 보고서도 한국 금융권과의 연관은 \"아르텍스 도구의 과거 사용 이력 + 별도 조직(TAG-217) 추적 중\"이라는 수준으로만 서술했다(동일 조직이라는 단정 아님).\n- 한국국제교류재단 건은 \"22만여 건\"이 서버에 저장돼 있던 양이며 실제 유출 여부·범위는 재단도 아직 확정하지 않았다고 명시했다.\n- **ATT&CK 버전이 v19.2 → v20.0으로 올라간 것을 attack.mitre.org에서 확인했다.** 이 저장소는 기존 매핑과의 일관성을 위해 당분간 v19.2 체계를 유지하며, 전술명·ID 변경 여부는 다음 작업에서 `ATTACK/_catalog.psv`·`build.mjs`의 TACTICS 갱신과 함께 검토해야 한다(오늘은 임의로 재매핑하지 않았다).\n- 국내 질의 6개 범주 중 ②④는 10월 신규 사건을 찾지 못했으며, 이것이 \"사건이 없다\"는 뜻인지 \"보도되지 않았다\"는 뜻인지는 구분할 수 없다.\n\n## 출처\n\n- CISA KEV JSON 피드 (직접 확인)\n- BleepingComputer(메인 페이지 직접 열람 및 개별 기사): 커넥트와이즈/Storm-0940/ARTEX, Arista VeloCloud, LiteLLM, Capcom, Railway, GitLab, PHP2Shell 추가 확인(아마존)\n- Microsoft 위협 인텔리전스(보도 인용), Recorded Future 인사이크트그룹(보도 인용) — 커넥트와이즈/TAG-217\n- Arista 보안 공지(보도 인용) — VeloCloud Orchestrator\n- Socket, Endor Labs(보도 인용) — LiteLLM 분석\n- GitLab 보안 공지, 연구자 joaxcar(HackerOne, 보도 인용) — GitLab RCE\n- Capcom 공식 발표(보도 인용), Railway 공식 공지(보도 인용)\n- attack.mitre.org(직접 확인, 버전 점검)\n- 보안뉴스(boannews.com, 직접 열람): 연세대, 한국국제교류재단, 금융권 PHP2Shell 대응, 커넥트와이즈 국내 보도\n- news.mtn.co.kr, dailian.co.kr — 금융권 해킹 가상자산거래소 확산 보도\n- MITRE ATT&CK v19.2(저장소 기준, v20.0 공식 전환 확인됨 — 5번 절 참고)\n"},{"path":"일일/2026-10-24.md","title":"일일 보안 이슈 분석 — 2026-10-24","md":"# 일일 보안 이슈 분석 — 2026-10-24\n\n> 수집 기준: 2026-10-24(오늘, 조사 진행 시각까지 공개분). CISA KEV는 JSON 피드를 직접 확인했으며 10/23 등재분 2건(Arista VeloCloud — [10-23 보고서](2026-10-23.md) 수록, Collabora Online CODE Server — 신규)을 반영했다. 해외 소식은 BleepingComputer 메인 페이지와 개별 기사를 WebFetch로 직접 열람해 확인했고, 국내 소식은 보안뉴스(boannews.com) 기사 목록을 WebFetch로 직접 확인했다.\n> 근거 표기: **[확인]** 벤더·정부기관·연구자가 직접 확인 / 보도 언론 보도 / **[추정]** 본 보고서의 추정 / **[주장]** 공격자 일방 주장. **조치는 본 보고서의 권고**이며 벤더 공식 지침이 우선한다.\n> **ATT&CK 버전 점검**: attack.mitre.org 확인 결과 공식 버전은 [10-23 보고서](2026-10-23.md)에서 확인한 **v20.0**을 유지하고 있다(오늘 추가 변경 없음). 이 저장소는 당분간 **v19.2 매핑을 유지**하며 임의로 대규모 재매핑하지 않는다.\n\n## 1. 오늘의 요약\n\n| # | 이슈 | CVE | 유형 | 상태 | 즉시 조치 |\n|---|------|-----|------|------|-----------|\n| 1 | Nextcloud용 Collabora 내장 CODE 서버 RCE — 웹셸 설치 | CVE-2026-110447 | 인증 없는 명령어 주입 | [확인] CISA KEV 등재, 실제 악용(웹셸) | richdocumentscode 26.4.303 이상으로 업데이트 또는 앱 제거 |\n| 2 | Quest Diagnostics 검사실 시스템 무단 접근 | — | 개인정보 유출(조사 중) | [확인] 회사 확인, 경위 비공개 | Quanum LSM 중단 확인, 안내 공지 모니터링 |\n| 3 | HPE ArubaOS 최고 심각도 결함 8건(전체 72건 패치) | CVE-2026-79844 등 | 인증 우회·명령어·SQL 삽입 → RCE | [확인] 벤더 패치, 실제 악용 미확인 | 보안 공지 확인 후 즉시 패치, 관리 인터페이스 망분리 |\n| 4 | Node.js·Bun Brotli 디코더 결함(아웃바운드까지 영향) | CVE-2026-111497 | 압축 해제 처리 중 메모리 손상 → RCE | [확인] 패치 공개, PoC 성공(ITW 미확인) | 지원 버전(26.12.1·24.22.1·22.23.4 등)으로 즉시 업데이트 |\n| 5 | 대한항공 고객 예약번호 유출 — 위탁 발권망(아마데우스) 침해(국내) | — | 서드파티(GDS) 신뢰 관계 악용 | [확인] 회사 확인, 경위 일부만 공개 | 대한항공 공식 공지만 신뢰, 사칭 메시지 주의 |\n\n## 2. 이슈별 분석\n\n### [D20261024-collabora] Nextcloud용 Collabora 내장 CODE 서버 RCE — 웹셸 설치, 공개까지 4주 지연(CVE-2026-110447)\n> 날짜: 2026-09(9월 중순부터 실제 악용, 수정판 9/11 배포)~10-14(보안 공지·CVE 공개)·10-23(CISA KEV 등재) · 유형: 인증 없는 명령어 주입 · 행위자: 미귀속 · 지역: 글로벌 · 근거: 확인(Collabora·Nextcloud 공지, CISA KEV, 관리자 보고)\n\n**쉽게 말하면**: 문서 공동편집 플랫폼 Nextcloud에 함께 쓰이는 Collabora의 \"내장 CODE 서버\" 기능에서, 그 서버가 잠깐 꺼져 있는 틈(재시작·업그레이드·오류 직후)을 노려 로그인 없이도 서버에 명령을 실행시킬 수 있는 결함이 실제로 악용되고 있습니다. 공격자는 이 결함으로 서버에 \"웹셸\"(원격 뒷문 파일)을 심어 비밀번호·암호화폐 지갑 흔적을 뒤진 것으로 보고됐습니다. 결함을 고친 버전은 9월 11일에 나왔지만, 공식 보안 공지·CVE는 한 달 넘게 지나서야 공개됐습니다.\n\n**먼저 할 일(초보용)**: Nextcloud에 richdocumentscode(내장 Collabora CODE 서버) 앱을 쓰고 있다면 지금 26.4.303 이상으로 업데이트하거나, 꼭 필요하지 않다면 앱을 완전히 제거하세요(끄기만 해서는 안 됩니다). 이미 공격받은 흔적(낯선 PHP 파일 등)이 있다면 비밀번호를 그 서버에서 바로 바꾸지 말고, 안전한 다른 기기에서 바꾸세요.\n\n**개요**: CVE-2026-110447은 Nextcloud의 richdocumentscode 앱이 번들 Collabora 서버를 띄우는 과정의 OS 명령어 주입 결함이다. 인증·사용자 상호작용이 전혀 필요 없고, 내장 CODE 서버가 중지된 상태(재시작·업그레이드·크래시 등)일 때 `proxy.php`로 조작된 요청을 보내면 명령이 실행된다. 독립형 Collabora Online 서버, Docker/RPM/DEB 설치본, Nextcloud All-in-One 배포본은 영향받지 않는다. 관리자 보고에 따르면 실제 악용은 9월 10~중순부터 시작됐고, 수정 코드는 9/9 커밋·9/11 버전 26.4.303 배포로 이미 막혔지만, 공식 보안 공지·GitHub 어드바이저리·CVE 공개는 10/14에야 이뤄졌다(커뮤니티 경고는 10/3). Collabora는 공지 지연이 AI 기반 보안 보고 급증으로 인한 GitHub CVE 처리 적체 때문이라고 설명했고, Nextcloud는 사용자에게 업데이트 시간을 주려는 목적이었다고 밝혔다. CISA는 10/23 이 CVE를 KEV(알려진 악용 취약점 목록)에 등재했다. 공격자는 PHP 웹셸을 심어 비밀번호 데이터베이스·패스워드 매니저 흔적·암호화폐 지갑을 탐색한 것으로 보고됐으나, 랜섬웨어 조직이 이를 악용한다는 일부 사용자 주장은 보도에서 독립적으로 확인되지 않았다.\n\n**왜 일어났나**\n- 직접 원인 [확인: Collabora]: 번들 서버 기동 로직이 사용자가 통제 가능한 입력을 그대로 OS 명령에 섞어 넣어, 서버가 꺼져 있는 특정 순간에 인증 없이 명령어 주입이 가능했다.\n- 구조적 원인 [추정]: (1) \"내장/번들\" 기능은 별도 서비스처럼 보이지 않아 독립된 공격 표면으로 충분히 경계되지 않는 경우가 많다 (2) 패치가 조용히(공지 없이) 먼저 배포되고 공식 공지가 한 달 가까이 늦어진 사례는, 방어자가 \"패치 버전 번호가 올라갔으니 안전하다\"고 넘겨짚고 실제 결함 내용을 놓치게 만들 수 있다 (3) 보안 공지 처리 체계(GitHub 어드바이저리 큐 등)의 적체는 공지 지연으로 이어져, 그 사이 공격자가 먼저 악용할 시간을 벌어준다.\n\n**침투 경로 [확인: Collabora·관리자 보고]**: 인증 없이 `proxy.php`로 조작된 요청 전송(CODE 서버가 중지된 상태일 때) → OS 명령어 주입으로 임의 명령 실행 → PHP 웹셸 설치(지속 접근 확보) → 웹셸로 비밀번호 데이터베이스·패스워드 매니저·암호화폐 지갑 흔적 탐색(실제 탈취 완료 여부는 독립적으로 확인되지 않음).\n\n**어떻게 조치하나**\n- 즉시: 증거(웹 접근 로그, 앱 디렉터리 변경 이력) 보존 후 richdocumentscode를 26.4.303 이상으로 업데이트하거나 완전히 제거. 비활성화만으로는 불충분하다고 Collabora가 밝혔다.\n- 단기: 앱 디렉터리에서 낯선 PHP 파일(웹셸) 유무 점검. 침해 의심 시 비밀번호·토큰은 해당 서버가 아닌 **다른 안전한 환경에서** 재발급.\n- 장기: 번들/내장 서비스도 별도 공격 표면으로 취급해 정기 점검 대상에 포함. 벤더 보안 공지 공개 지연 가능성을 염두에 두고 패치 버전 변경 로그도 함께 추적.\n- 탐지: CODE 서버 중지 직후 `proxy.php`로의 비정상 요청, 앱 디렉터리 내 예상치 못한 PHP 파일 생성.\n\n**교훈**: \"패치는 이미 나왔다\"는 것이 \"공지도 이미 됐다\"는 뜻은 아니다. 조용히 배포된 수정판과 한 달 늦은 공식 공지 사이의 공백에서 공격자가 먼저 움직였다.\n\n### [D20261024-questdx] Quest Diagnostics 검사실 관리 시스템(Quanum LSM) 무단 접근 — 환자 기록 노출\n> 날짜: 2026-10-21(무단 접근 인지) · 유형: 개인정보 유출(조사 중, 항목·규모 미확정) · 행위자: 미귀속 · 지역: 글로벌(미국) · 근거: 확인(회사 SEC 제출·공지)\n\n**쉽게 말하면**: 미국 대형 임상검사 회사 Quest Diagnostics가 의료진이 검사를 주문하고 결과를 확인하는 온라인 시스템(Quanum LSM)에 외부인이 허락 없이 접근한 것을 확인했습니다. 일부 환자 기록이 노출된 것으로 보고 있지만, 정확히 몇 명의 어떤 정보가 유출됐는지는 아직 회사도 파악하지 못했습니다.\n\n**먼저 할 일(초보용)**: Quest Diagnostics에서 검사를 받은 적이 있다면 지금 당장 할 일은 없습니다. 회사의 추가 공지를 기다리고, 공식 공지 전에 \"유출 확인\" 등을 명목으로 개인정보나 결제 정보를 요구하는 메일·전화는 응하지 마세요.\n\n**개요**: Quest Diagnostics는 SEC 제출 문서에서 \"2026년 10월 21일 Quanum LSM(Lab Services Manager) 시스템에 대한 무단 접근을 알게 됐다\"고 밝혔다. Quanum LSM은 의사·병원·의료기관 직원이 검사를 주문하고 결과·진행 상황을 확인하며 용품을 주문하는 플랫폼이다. 회사는 사고 대응 절차를 가동해 해당 시스템을 중단했고(고객에게는 종이 처방서나 Quanum eLabs 사용을 권고), 예방 차원에서 Essential Insights·LabHQ 등 다른 시스템 접근도 일시 중단했다. 외부 전문가가 조사를 돕고 있고 법 집행기관에도 통지했다. 직접 고객용 LIS 인터페이스·EMR 사용자, 일반 고객 서비스 운영에는 영향이 없다고 밝혔다. **영향받은 인원·유출 항목·침투 경로는 보도 시점까지 공개되지 않았다.** 2019년에도 청구 대행업체 AMCA 침해로 환자 약 1,190만 명의 정보가 유출된 전력이 있다(이번 사건과 직접적 연결은 없음).\n\n**왜 일어났나**\n- 직접 원인: 공개되지 않았다. 회사는 \"무단 접근\"만 밝혔다.\n- 구조적 원인 [추정]: 의료기관·검사기관이 공유하는 주문·결과 조회 플랫폼은 여러 기관이 동시에 접속하는 구조라, 계정 하나가 뚫려도 연결된 다수 기관의 환자 정보가 함께 위험해질 수 있다. 다만 이번 사건의 구체적 원인과의 연결은 확인되지 않았다.\n\n**침투 경로 [미공개]**: 공개된 자료에서 확인되지 않아 이 보고서는 매핑하지 않는다.\n\n**어떻게 조치하나**\n- 즉시(회사): 시스템 중단(완료), 증거 보존, 외부 전문가·법 집행기관 통지(완료).\n- 단기: 영향받은 환자·정보 항목 확정 후 개별 통지, 조사 완료까지 투명한 현황 공지.\n- 장기: 공유형 검사실 관리 플랫폼의 접근 통제·이상 접근 탐지 강화, 2019년 AMCA 사건 이후 개선 조치 재점검.\n- 탐지: 해당 없음(이미 발견·조사 중인 사건).\n\n**교훈**: \"무단 접근을 인지했다\"는 발표와 \"정확히 무엇이 새어 나갔는지 확정\"하는 것 사이에는 시간이 걸린다. 그 공백 기간에도 사칭 메일 등 2차 피해는 먼저 시작될 수 있다.\n\n### [D20261024-arubaos] HPE ArubaOS 최고 심각도 결함 8건(전체 72건 패치) — 인증 우회·명령어·SQL 삽입 → RCE\n> 날짜: 2026-10-23(벤더 공지·패치 공개) · 유형: 인증 우회·명령어 주입·SQL 삽입 → 원격 코드 실행 · 행위자: 해당 없음 · 지역: 글로벌 · 근거: 확인(HPE 공지, 실제 악용·PoC 미확인)\n\n**쉽게 말하면**: HP엔터프라이즈(HPE)의 무선 네트워크 장비 운영체제 ArubaOS(AOS-8·AOS-10)에서, 로그인 없이도 공격자가 장비를 완전히 장악할 수 있는 \"최고 위험도\" 결함 8건이 발견돼 패치됐습니다(전체로는 72건 패치). 아직 공개된 공격 도구나 실제 공격 사례는 확인되지 않았습니다.\n\n**먼저 할 일(초보용)**: 회사나 기관에서 Aruba 무선 액세스 포인트·컨트롤러·모빌리티 컨덕터를 운영한다면, 네트워크 담당자에게 HPE 보안 공지(hpesbnw05162en_us)를 확인해 지금 패치하도록 요청하세요. 당장 패치가 어렵다면 관리 화면 접근을 관리망으로만 제한해야 합니다.\n\n**개요**: HPE는 ArubaOS AOS-8·AOS-10 계열에서 72개 취약점을 패치했고, 이 중 8건이 최고 심각도로 분류됐다. CVE-2026-79844·79847·79851(인증 우회·버퍼 오버플로로 인한 RCE), CVE-2026-79846·79848·79849(인증 없는 명령어·SQL 삽입으로 인한 RCE), CVE-2026-79845(PAPI 프로토콜 인증 우회), CVE-2026-79850(인증 우회로 인한 RCE)이 포함된다. 모두 인증·사용자 상호작용 없이 낮은 복잡도로 공격 가능하다고 HPE는 밝혔다. HPE는 \"공개된 PoC 익스플로잇 코드나 이 취약점들을 겨냥한 공개 논의를 알지 못한다\"고 밝혔다. HPE는 즉시 패치, 관리 인터페이스를 전용 Layer 2 세그먼트/VLAN과 방화벽 정책으로 분리, 계정 활동 로깅 강화를 권고했다.\n\n**왜 일어났나**\n- 직접 원인 [확인: HPE]: 인증·명령어 처리 로직의 결함(인증 우회, 명령어·SQL 삽입, 버퍼 오버플로)이 겹쳐 인증 없는 원격 코드 실행으로 이어질 수 있었다.\n- 구조적 원인 [추정]: 건물 전체 무선망을 중앙에서 통제하는 네트워크 운영체제는 한 번 장악되면 그 위에 올라탄 모든 통신을 들여다보거나 끊을 수 있어, 결함 한 건의 심각도가 일반 서버 소프트웨어보다 크게 평가된다.\n\n**침투 경로 [후보]**: 실제 악용·공개 PoC가 확인되지 않아 이 보고서는 '후보'로만 매핑한다. 이론상: 인증 없이 관리 인터페이스에 조작된 요청을 보내 명령어·SQL 삽입 또는 버퍼 오버플로를 유발하는 경로가 벤더 설명과 일치한다.\n\n**어떻게 조치하나**\n- 즉시: HPE 보안 공지(hpesbnw05162en_us) 확인 후 해당 버전으로 즉시 패치. 패치 전까지 관리 인터페이스(CLI·웹) 접근을 전용 VLAN·방화벽 정책으로 제한.\n- 단기: 패치 전후 관리자 계정·설정 변경 이력 점검, 계정 활동(accounting) 로깅 적용 여부 확인.\n- 장기: 네트워크 운영체제 관리 콘솔은 인터넷에 직접 노출하지 않고 전용 관리망을 통해서만 접근하도록 설계.\n- 탐지: 해당 없음(실제 악용·PoC 미확인, 패치 적용이 핵심 대응).\n\n**교훈**: \"아직 공격에 쓰였다는 증거가 없다\"는 \"안전하다\"는 뜻이 아니다. 인증이 필요 없고 복잡도가 낮은 결함은 공개 후 PoC가 나오는 데 며칠이 채 걸리지 않는 경우가 많다.\n\n### [D20261024-node2shell] Node.js·Bun Brotli 디코더 결함 — 요청뿐 아니라 응답 처리로도 공격 가능(CVE-2026-111497)\n> 날짜: 2026-10-21(패치 공개)~10-22(PoC 등장) · 유형: 압축 해제 처리 중 메모리 손상(버퍼 오버플로) → 원격 코드 실행 · 행위자: 해당 없음 · 지역: 글로벌 · 근거: 확인(Node.js 보안팀, 실제 공격 미확인)\n\n**쉽게 말하면**: 서버 프로그램을 만드는 데 널리 쓰이는 Node.js(와 Bun)에서, 데이터를 압축 해제하는 내부 기능(Brotli)에 조작된 압축 데이터를 넣으면 서버에서 임의 코드가 실행될 수 있는 결함이 발견돼 패치됐습니다. 이 결함은 공격자가 서버로 보내는 요청뿐 아니라, 서버가 \"바깥으로 내보낸 요청의 응답\"을 받을 때도 작동할 수 있어 막기가 더 까다롭습니다. 패치 하루 뒤 보안 연구자들이 실제로 코드 실행에 성공하는 검증 코드를 만들었지만, 아직 실제 공격에 쓰였다는 사례는 확인되지 않았습니다.\n\n**먼저 할 일(초보용)**: Node.js 또는 Bun으로 서버·백엔드를 운영하는 조직이라면 담당 개발자에게 지금 지원 버전(Node.js 26.12.1·24.22.1·22.23.4 이상, Bun 1.4.4 이상)으로 업데이트하도록 요청하세요. 일반 이용자가 당장 할 일은 없습니다.\n\n**개요**: CVE-2026-111497은 구글이 만든 압축 알고리즘 Brotli의 디코더(해제기)에 있는 버퍼 오버플로 결함으로, 영향 버전은 Brotli 1.0.3~1.2.0이다. Node.js 보안팀은 세 가지 공격 경로를 밝혔다: (1) Express 5·body-parser 2.x처럼 `Content-Encoding: br` 요청 본문을 자동 해제하는 서버는 외부 공격 패킷에 바로 노출된다(순수 Node.js 기본 HTTP 서버는 자동 해제하지 않음) (2) 내장 `fetch()`가 외부 응답의 Brotli 데이터를 자동 해제하므로, 공격자가 통제하는 외부 서버·웹훅 응답으로도 공격이 가능하다 (3) `node:zlib`의 해제 함수에 신뢰할 수 없는 입력을 직접 넘기는 경우. Node.js는 10/21 26.12.1·24.22.1(24.x LTS)·22.23.4(22.x LTS)로 패치했고(20.x 이하는 EOL로 패치 없음), Bun은 1.4.4에서 수정했다. 패치 공개 하루 뒤(10/22) 초기 PoC가 나왔고, 이후 보안 연구자들이 리눅스 arm64 공식 미수정 Node.js 24.22.0 이미지에서 원격 코드 실행에 성공했다고 보고했다. **보도 시점까지 실제 공격(in-the-wild) 사례는 확인되지 않았다.**\n\n**왜 일어났나**\n- 직접 원인 [확인: Node.js 보안팀]: 서드파티 압축 라이브러리(Brotli)의 버퍼 오버플로 결함을 Node.js·Bun이 내부적으로 그대로 사용해, 조작된 압축 데이터를 처리할 때 메모리가 깨져 코드 실행으로 이어질 수 있었다.\n- 구조적 원인 [추정]: (1) 프레임워크가 \"편의 기능\"으로 넣은 자동 압축 해제(요청 본문·fetch 응답 모두)는 개발자가 의식하지 못한 채 공격 표면을 넓힌다 (2) 널리 쓰이는 압축·파싱 라이브러리 하나의 결함은 그 라이브러리를 번들로 포함한 모든 런타임(Node.js, Bun)에 동시에 영향을 미친다 (3) 도커 이미지처럼 버전을 고정해 두는 배포 방식은, 베이스 이미지 태그를 올리지 않으면 패치가 적용되지 않은 채 재빌드를 반복하게 만들 수 있다.\n\n**침투 경로 [후보]**: 실제 공격이 확인되지 않아 이 보고서는 '후보'로만 매핑한다. 이론상: 공격자가 조작한 Brotli 압축 데이터를 (a) `Content-Encoding: br` 요청 본문으로 서버에 전송하거나 (b) 서버가 신뢰 없이 호출하는 외부 서버·웹훅의 응답으로 보내면, 서버가 이를 자동 해제하는 순간 메모리 손상이 발생해 코드 실행으로 이어질 수 있다고 벤더가 설명했다.\n\n**어떻게 조치하나**\n- 즉시: Node.js를 26.12.1·24.22.1·22.23.4 이상으로, Bun은 1.4.4 이상으로 업데이트. 도커 이미지는 베이스 이미지 태그를 올려 재빌드(취약한 구버전 태그 그대로 재빌드 금지).\n- 단기: 20.x 이하 EOL 버전을 쓰고 있다면 지원 버전으로 마이그레이션 계획 수립. 임시로 프록시·WAF에서 인바운드 `Content-Encoding: br` 요청을 막을 수 있으나, 이 방법으로는 `fetch()` 아웃바운드 경로는 막지 못한다는 점을 인지한다.\n- 장기: 외부 응답을 자동으로 압축 해제·파싱하는 기본 동작(프레임워크·런타임 공통 기능)을 공격 표면 점검 목록에 포함.\n- 탐지: 해당 없음(실제 공격 미확인, 패치 적용과 PoC 차단이 핵심 대응).\n\n**교훈**: 공격 표면은 \"내가 받는 요청\"에만 있지 않다. 내 서버가 먼저 내보낸 요청의 응답을 처리하는 코드(fetch 등)도 똑같이 공격 경로가 될 수 있다.\n\n### [D20261024-koreanair] 대한항공 고객 예약번호 유출 — 위탁 발권망(아마데우스) 침해 (국내)\n> 날짜: 2023-08~2026-09(추정 침해 기간, 조사 중)·2026-10-20(아마데우스가 대한항공에 통보) · 유형: 서드파티(GDS) 신뢰 관계 악용 · 행위자: 미귀속 · 지역: 한국 · 근거: 확인(대한항공 공지, 보도)\n\n**쉽게 말하면**: 대한항공이 항공권 예약·발권 업무를 맡기는 글로벌 IT 업체 아마데우스(Amadeus)의 시스템이 뚫려, 대한항공 고객의 예약번호가 외부로 노출됐습니다. 대한항공 자체 전산망이 직접 뚫린 것은 아니고, 발권 업무를 대신 처리해 주는 **외부 업체 쪽**이 뚫린 것이 원인입니다. 다른 개인정보가 추가로 유출됐는지는 아직 확인 중입니다.\n\n**먼저 할 일(초보용)**: 대한항공을 이용했다면 지금 당장 바꿀 비밀번호는 없습니다(예약번호 유출이며, 대한항공 계정 비밀번호 유출이 아닙니다). 대한항공·아마데우스를 사칭해 \"예약 확인\"이나 개인정보를 요구하는 메일·문자·전화의 링크는 누르지 말고, 대한항공 공식 공지로만 확인하세요.\n\n**개요**: 대한항공은 10/20 밤 10시 44분경 아마데우스로부터 고객 개인정보 유출 정황을 통보받았다고 밝혔다. 아마데우스는 여객 예약·발권 시스템을 위탁 운영하는 글로벌 항공 IT 기업으로, 대한항공 자체 전산망은 침해되지 않았다고 회사는 설명했다. 현재까지 공식 확인된 유출 항목은 승객 예약번호뿐이며, 그 외 개인정보가 포함됐는지는 아마데우스와 대조 조사 중이고 확인되면 해당 고객에게 개별 안내할 방침이다. 침투 경로는 \"아마데우스 시스템 계정의 정상 로그인 인증정보가 도용돼 악용된 것\"으로 파악됐으나, 그 인증정보를 어떻게 탈취했는지는 공개되지 않았다. 대한항공은 통보 직후 자체 시스템을 점검해 내부 DB 침해 정황은 확인하지 못했고, 고객에게 출처 불분명한 URL·첨부파일 주의를 당부했으며 아마데우스에 추가 피해 방지와 원인 규명을 요구하고 있다. 아마데우스는 비인가 접근 경로를 차단하고 다크웹 모니터링을 가동했다고 밝혔다. **영향받은 고객 수, 추가 유출 항목, 당국 신고 여부는 보도 시점까지 공개되지 않았다.** 참고로 아마데우스는 지난 9월에도 별개 사건(iHotelier 호텔 예약 플랫폼, 제3자 업체 경유)으로 이름·이메일·전화번호·예약번호 노출을 공개한 적이 있으나, 이번 대한항공 건과의 직접적 연결은 확인되지 않았다.\n\n**왜 일어났나**\n- 직접 원인 [확인: 대한항공]: 대한항공이 아니라 위탁업체 아마데우스의 시스템 계정 인증정보가 도용돼 악용됐다. 그 인증정보가 어떻게 처음 탈취됐는지는 공개되지 않았다.\n- 구조적 원인 [추정]: (1) 항공권 예약·발권처럼 여러 항공사가 공동으로 쓰는 글로벌 유통 시스템(GDS)은 한 업체의 계정 하나가 뚫려도 그 업체와 연동된 모든 항공사의 고객 정보가 동시에 위험해질 수 있다 (2) 자사 전산망을 아무리 강하게 지켜도, 발권처럼 외부에 위탁한 핵심 업무의 보안 수준은 그 위탁업체에 좌우되며 항공사 스스로 직접 통제하기 어렵다.\n\n**침투 경로 [확인/일부]**: 아마데우스 시스템 계정의 정상 로그인 인증정보 도용(최초 탈취 경로는 비공개) → 그 계정으로 아마데우스 발권 시스템에 정상 로그인처럼 접근(신뢰 관계 악용) → 대한항공 고객 예약번호 열람·노출.\n\n**어떻게 조치하나**\n- 즉시: 증거(아마데우스 접근 로그) 보존, 아마데우스의 비인가 접근 경로 차단(시행), 대한항공 자체 시스템 점검(시행, 침해 정황 미확인).\n- 단기: 아마데우스·대한항공 대조 조사로 추가 유출 항목 확정 후 개별 고객 안내. 2차 피해(사칭 메일·문자) 모니터링.\n- 장기: 위탁 발권·예약 시스템 계정도 자사 핵심 시스템과 동일한 수준으로 접근 통제·이상 로그인 탐지를 요구하는 계약·점검 체계 마련.\n- 탐지: 해당 없음(이미 통보받아 조사 중인 사건).\n\n**교훈**: 내 회사의 서버가 안전해도, 핵심 업무를 맡긴 위탁업체의 계정 하나가 뚫리면 고객 정보는 똑같이 노출된다. \"우리 전산망은 안전하다\"는 설명이 고객에게는 위로가 되지 않는다.\n\n### 참고 기록 — eMudhra 위조 인증서, 오라클 자바(JSSE)까지 영향 확산(CVE-2026-91403)\n- **오라클 비정기 긴급 패치**: [D20261022-emudhra](2026-10-22.md) 사건(약한 키로 위조 가능했던 인증기관 eMudhra의 중간 CA 인증서 8개)의 영향이 오라클 자바 SE(JSSE, GraalVM·OpenJDK 등 동일 신뢰 저장소 사용 배포판 포함)까지 번져, 오라클이 CVE-2026-91403(CVSS 9.1)으로 비정기 보안 업데이트를 배포했다는 보도가 있었다. 패치는 침해된 인증서 지문 16개를 `blocked.certs`에 등록해 연결을 거부한다. 크롬·파이어폭스는 약 3시간 만에 해당 인증서를 차단했고 eMudhra는 10/18~19 인증서를 폐기했다. **실제 악용 사례는 보도에서 확인되지 않았다.** 기존 매핑(TA0042\\|T1588.004\\|후보)을 유지하고 별도 사건으로 분리하지 않는다.\n\n## 3. 국내 소식\n\n**커넥트와이즈/아르텍스([D20261023-connectwise](2026-10-23.md)) 국내 보도**: 보안뉴스가 MS 분석을 인용해 \"3시간 만에 관리자 권한 탈취\" 제목으로 보도하며 한국 금융권 공격 이력과 레코디드퓨처의 별도 조직(TAG-217) 추적 소식을 전했다. 새 사건이 아니라 기존 해외 사건의 국내 보도라 `국내뉴스.psv`에만 기록했다.\n\n**PHP2Shell([D20261022-php2shell](2026-10-22.md)) 국내 패치 현황**: 보안뉴스·에스케어 공동조사(쇼단 기반)에 따르면 패치 공개 약 36시간 뒤(10/23 오전 11시 기준)에도 국내 PHP 서버(버전 노출분) 약 5,500대 중 3.8%만 수정판을 적용한 상태였다. 전날 저녁 0.6%에서 약 15시간 만에 3.2%p 오른 수치로, 평소 평균 패치 기간(30일 이상)보다는 빠르지만 자동화 공격 속도에는 여전히 못 미친다는 평가다. 새 사건이 아니라 기존 해외 사건의 국내 대응 후속이라 `국내뉴스.psv`에만 기록했다.\n\n**국내 의료기관 침해사고 급증 — 국정감사 자료**: 국회 보건복지위 소병훈 의원실이 공개한 자료에 따르면 2026년 1~9월 민간 의료기관 침해사고는 28건으로, 전년(2025년) 연간 전체(11건)의 약 2.5배로 늘었다. 이 중 병원(17건)·의원(8건)이 89.3%를 차지했고, 28건 중 26건이 랜섬웨어 공격으로 확인됐다. 주요 침투 경로로는 원격 유지보수용으로 열어 둔 포트나 상용 원격제어 프로그램의 취약점이 지목됐다. 보안관제 가입 현황도 함께 공개됐는데, 2026년 9월 말 기준 전국 병·의원급 7만 5,560곳 중 상시 보안관제에 가입한 곳은 단 63곳(0.0066%)뿐이었고, 상급종합병원은 77.1%가 가입했지만 종합병원은 10.6%에 그쳤다. 개별 기관이 특정되지 않은 통계 자료라 사건으로 쓰지 않고 `국내뉴스.psv`에 기록했다.\n\n**국내 질의 결과**: 지침에 따라 ①금융권 ②통신·OTT·이커머스 ③공공·지자체·교육·의료 ④국내 랜섬웨어 ⑤정부 발표 ⑥기존 사건 규모 갱신, 총 6개 범주를 각각 검색했다. ①금융권은 10/19 국감 이후 10/23~24 사이의 새로운 당국 발표를 찾지 못했다(가장 최근은 [10-23 보고서](2026-10-23.md)에 기록된 10/19 금감원 국감 내용). ②통신·이커머스(쿠팡·티빙)는 10월 신규 사건을 찾지 못했고 검색 결과는 기존 티빙 사건(3,954만 계정, 과기정통부 민관합동조사단 최종 집계)의 재인용이었다. ③공공·지자체·교육·의료는 일반 WebSearch로 10월 신규 공공·지자체·교육기관 사건을 찾지 못했으나, **대한항공 건**([D20261024-koreanair](#d20261024-koreanair-대한항공-고객-예약번호-유출-위탁-발권망아마데우스-침해-국내))을 보안뉴스 직접 열람으로 새로 확인했고(항공 분야), 의료기관은 위 국정감사 통계를 확인했다(개별 사건은 10월 신규를 찾지 못함). ④국내 랜섬웨어 10월 전국 통계는 공개되지 않았다(안랩 ASEC 최신 월간 보고서는 7월자로 [10-23 보고서](2026-10-23.md)와 동일, 10월 통계 미공개). ⑤과기정통부·금융위·개인정보보호위의 10월 23~24일 신규 발표는 추가로 확인하지 못했다. ⑥기존 사건 규모 갱신은 이번 조사에서는 확인되지 않았다(금융권 사건은 10/19 국감 이후 추가 집계 발표 없음).\n\n## 4. 우선 대응 체크리스트\n\n1. **Nextcloud + Collabora 내장 CODE 서버 운영자**: richdocumentscode 26.4.303 이상 업데이트 또는 앱 제거(CISA KEV 등재, 실제 웹셸 설치 확인).\n2. **Quest Diagnostics 이용 의료기관·환자**: 공식 공지 확인, Quanum LSM 대체 수단(종이 처방서·Quanum eLabs) 안내 숙지.\n3. **HPE Aruba 무선망 운영자**: 보안 공지(hpesbnw05162en_us) 확인 후 즉시 패치, 관리 인터페이스 망분리.\n4. **Node.js·Bun 백엔드 운영자**: 지원 버전으로 즉시 업데이트, 도커 베이스 이미지 태그 갱신 후 재빌드.\n5. **대한항공 이용 고객**: 공식 공지만 신뢰, 사칭 메시지 주의(비밀번호 변경 불필요).\n6. [10-17](2026-10-17.md)~[10-23](2026-10-23.md) 보고서의 Ivanti·Atlassian·Ahsay·PAN-OS·Cisco SEG·BeyondTrust·Fortinet·SiteGuard·Plex·Siemens·PHP·SafePay·UpdraftCentral·eMudhra·Onamae·커넥트와이즈·Arista VCO·LiteLLM·GitLab — 기한이 지났거나 임박한 건이 많으므로 미조치 상태라면 우선 처리.\n\n## 5. 검증 수준과 한계\n\n- CISA KEV는 JSON 피드를 직접 받아 10/23 등재분 2건(Arista VeloCloud — 기존 사건, Collabora Online CODE Server — 신규)을 확인했다(1차 출처).\n- 해외 4건은 BleepingComputer·보안뉴스 기사를 WebFetch로 직접 열람해 확인했다(2차 보도). Collabora·Node.js 건은 벤더(Collabora/Nextcloud, Node.js 보안팀)의 공지 내용을 가능한 범위에서 교차 확인했으나 원문 공지 페이지를 전부 직접 열람하지는 못했다.\n- **HPE ArubaOS 건은 HPE 공식 보안 공지 페이지(hpesbnw05162en_us)를 직접 열람하지 못했다** — BleepingComputer가 인용한 HPE 발표 내용만 확인했으며, CVE 번호 8개는 별도 독립 출처로 교차 확인하지 못했다(근거 다소 약함으로 분류).\n- Quest Diagnostics 건은 **침투 경로·영향 인원·유출 항목이 전부 공개되지 않아** ATT&CK 매핑을 하지 않았다(분류 J에 준함).\n- HPE ArubaOS·Node.js 건은 실제 악용·공개 PoC 상황이 서로 다르다(ArubaOS는 PoC도 미확인, Node.js는 연구자 PoC는 성공했으나 실제 공격 미확인). 둘 다 매핑은 '후보'로만 두었다.\n- 대한항공 건은 \"아마데우스 시스템 계정의 정상 로그인 인증정보가 도용\"됐다는 점은 회사가 확인했으나, 그 인증정보의 최초 탈취 경로와 영향받은 고객 수는 공개되지 않았다. 9월에 보도된 별개의 아마데우스 iHotelier 사건과의 연결 여부도 확인되지 않았다.\n- 국내 질의 중 ①⑥(금융권 신규 발표·기존 사건 규모 갱신)은 10/19 국감 이후 새로운 자료를 찾지 못했으며, 이것이 \"추가 집계가 없다\"는 뜻인지 \"아직 보도되지 않았다\"는 뜻인지는 구분할 수 없다.\n\n## 출처\n\n- CISA KEV JSON 피드 (직접 확인)\n- BleepingComputer(직접 열람): Collabora/Nextcloud, Quest Diagnostics, HPE ArubaOS, Node.js/Bun Brotli, eMudhra→Oracle 추가 확인\n- Collabora·Nextcloud 공지(보도 인용), CISA KEV(직접 확인) — Collabora CODE 서버\n- Quest Diagnostics SEC 제출·공지(보도 인용)\n- HPE 보안 공지 hpesbnw05162en_us(보도 인용, 원문 직접 열람 못함)\n- Node.js 보안팀 공지(보도 인용) — CVE-2026-111497\n- 대한항공 공식 발표(보안뉴스 보도 인용) — 아마데우스 예약번호 유출\n- 보안뉴스(boannews.com, 직접 열람): 대한항공, 커넥트와이즈 국내 보도, PHP2Shell 국내 패치율 조사, Node.js RCE, Oracle JSSE 패치\n- 메디게이트뉴스, 아이뉴스24(보도) — 의료기관 침해사고·랜섬웨어 국정감사 자료\n- MITRE ATT&CK v19.2(저장소 기준, v20.0 공식 전환은 [10-23 보고서](2026-10-23.md)에서 확인됨)\n"},{"path":"일일/2026-10-25.md","title":"일일 보안 이슈 분석 — 2026-10-25","md":"# 일일 보안 이슈 분석 — 2026-10-25\n\n> 수집 기준: 2026-10-25(오늘, 조사 진행 시각까지 공개분). CISA KEV는 JSON 피드를 직접 확인했으며 10/23 등재분(최신) 이후 10/24~25 신규 등재는 없었다(1차 출처). 해외 소식은 BleepingComputer·SecurityWeek 메인 페이지와 개별 기사, Kaspersky의 BlackX 원문 분석(securelist.com)을 WebFetch로 직접 열람해 확인했고, 국내 소식은 보안뉴스 등 언론 보도를 WebSearch로 확인했다(직접 열람은 일부만 가능했다).\n> 근거 표기: **[확인]** 벤더·정부기관·연구자가 직접 확인 / 보도 언론 보도 / **[추정]** 본 보고서의 추정 / **[주장]** 공격자 일방 주장. **조치는 본 보고서의 권고**이며 벤더 공식 지침이 우선한다.\n> **ATT&CK 버전 점검**: attack.mitre.org 확인 결과 공식 버전은 여전히 **v20.0**이다(10/23 확인분과 동일, 추가 변경 없음). 이 저장소는 당분간 **v19.2 매핑을 유지**하며 임의로 대규모 재매핑하지 않는다.\n\n## 1. 오늘의 요약\n\n| # | 이슈 | CVE | 유형 | 상태 | 즉시 조치 |\n|---|------|-----|------|------|-----------|\n| 1 | BlackX UEFI 부트킷 — 낡은 Baton Drop 결함으로 Secure Boot 우회, 중앙아시아 외교기관 스파이 활동 | CVE-2022-21894(Baton Drop) | UEFI 부트킷을 통한 지속성 확보·Secure Boot 우회 | [확인] Kaspersky 확인, 실제 침해(외교기관) | MS의 취약 부트매니저 인증서 폐기 절차 수동 적용 |\n| 2 | PHP 세션 처리 결함 — 패치 전 미공개 RCE, 특정 설정 조합 한정 | CVE-2026-115560 | 세션 핸들러 런타임 전환 처리 결함 → RCE(패치 없음) | [확인] PHP 보안팀 공지, 실제 악용 미확인 | 해당 설정 조합 사용 시 `session.upload_progress.enabled=0` |\n| 3 | Time4Popcorn(폐기된 Popcorn Time 포크) 자동 업데이트 결함 — 최대 335만 기기 노출 | CVE-2026-30612 | 서명·암호화 없는 HTTP 자동 업데이트 → RCE | [확인] Eye Security 확인(연구자 선의 조치, 실제 악의적 악용 미확인) | 앱 완전 삭제(Windows·macOS) |\n| 4 | 할리스 멤버십 해킹 — 고객정보 약 276만 건 유출(국내) | — | 클라우드 서비스 비정상 접근(세부 경위 비공개) | [확인] 회사 공지, 경위 비공개 | 할리스 비밀번호 변경 + 동일 비밀번호 쓰는 다른 서비스도 변경 |\n\n## 2. 이슈별 분석\n\n### [D20261025-blackx] BlackX UEFI 부트킷 — 침해 후 지속성 도구, 2022년 \"Baton Drop\" 결함(CVE-2022-21894)으로 Secure Boot 우회, 중앙아시아 외교기관 스파이 활동\n> 날짜: 2026년 초(스파이 활동 관측 시작, 정확한 최초 시점 비공개)~2026-10-23(Kaspersky 분석 공개) · 유형: 침해 후 UEFI 부트킷을 통한 Secure Boot 우회·지속성 확보(지정학적 첩보 목적 추정) · 행위자: 미귀속(Kaspersky가 중간 확신도로 APT41/Brass Typhoon/Wicked Panda/Barium으로 추정) · 지역: 글로벌(타지키스탄·우즈베키스탄·투르크메니스탄 외교기관 표적) · 근거: 확인(Kaspersky 분석)\n\n**쉽게 말하면**: 공격자가 이미 어떤 방법으로든 기업망에 침투해 관리자 권한까지 확보한 뒤, 거기서 더 깊고 오래 숨어 있기 위해 컴퓨터가 켜질 때 윈도우보다 먼저 실행되는 \"부팅 단계\"에 몰래 끼어드는 악성코드(UEFI 부트킷) \"BlackX\"를 심는 사례가 발견됐습니다. 이 부트킷은 윈도우의 보안 기능인 Secure Boot(서명되지 않은 프로그램은 부팅 단계에서 실행하지 못하게 막는 기능)를, 2022년에 이미 알려진 낡은 결함(\"Baton Drop\")을 이용해 우회합니다. 문제는 그 결함을 막는 조치(인증서 폐기)가 자동으로 적용되지 않고 관리자가 수동으로 한 단계를 더 처리해야 한다는 점인데, 이걸 하지 않은 \"완전히 패치된\" 윈도우 PC들도 그대로 당했습니다. 다만 이 부트킷이 보안 소프트웨어를 끄려고 시도한 기능은 Kaspersky 자체 분석에서 정작 Kaspersky 제품에는 효과가 없었던 것으로 확인됐습니다(다른 보안제품 대상 효과는 별도로 공개되지 않음). 중앙아시아 외교기관을 겨냥한 스파이(정보 수집) 활동에 실제로 쓰였습니다.\n\n**먼저 할 일(초보용)**: 일반 개인 이용자가 당장 할 일은 없습니다(이 공격은 특정 외교기관을 겨냥한 표적형입니다). 회사·기관의 윈도우 PC를 관리한다면, 담당자에게 마이크로소프트의 \"취약한 윈도우 부트매니저 인증서 폐기\" 안내(Tech Community 블로그)를 지금 수동으로 적용했는지 확인해 달라고 요청하세요. Windows Update만으로는 이 폐기 절차가 자동 실행되지 않습니다.\n\n**개요**: Kaspersky는 2026년 초 중앙아시아(타지키스탄·우즈베키스탄·투르크메니스탄) 외교기관을 표적으로 한 스파이 활동을 분석해 신종 UEFI 부트킷 \"BlackX\"를 공개했다(securelist.com, 10/23 보도 인용). 공격자는 **이미 해당 기관 망을 침해하고 관리자 권한을 확보한 뒤** BlackX를 설치했다고 Kaspersky는 밝혔다 — 즉 BlackX 자체가 최초 침입 수단은 아니고, 침해 이후 더 깊은 지속성을 확보하기 위한 도구다. BlackX는 2022년부터 알려진 부트킷 \"BlackLotus\"와 구조가 \"놀랍도록 비슷\"하며, BlackLotus의 공개 유출 소스코드에는 없지만 일부 BlackLotus 샘플에는 있던 코드가 BlackX에도 있어, 제작자가 BlackLotus를 역분석했거나 원본 소스코드를 입수한 것으로 보인다. BlackX는 \"Baton Drop\"(CVE-2022-21894)이라는 기존에 알려진 결함을 이용해 맞춤 MOK(Machine Owner Key, 기기 소유자 키)를 등록하고 임의의 EFI 파일을 불러와 Secure Boot를 우회한다. Kaspersky는 BlackX 피해자 전원이 \"완전히 패치된\" 윈도우를 쓰고 있었다고 밝혔는데, 이는 Baton Drop 패치가 취약한 \"Windows Production PCA 2011\" 인증서를 자동으로 폐기(차단)하지 않고, 관리자가 수동으로 폐기를 적용해야 하는 구조적 공백 때문이다(이 인증서는 보도 시점 기준 발급기관에 의해 폐기된 상태였으나, 공격 당시 폐기 여부·시점은 공개되지 않았다). 폐기된 인증서로 서명된 커널 드라이버가 보안 프로세스 비활성화·레지스트리 콜백·ETW(이벤트 추적) 변조를 시도하도록 설계됐지만, **Kaspersky는 동적 분석에서 이 기능이 자사 제품(Kaspersky)을 방해하는 데는 효과가 없었다고 밝혔다**(Avast 대상 결과는 보도에서 확인되지 않음). APT41(Brass Typhoon·Wicked Panda·Barium) 귀속은 Kaspersky가 **중간 확신도**로만 평가한 것이다.\n\n**왜 일어났나**\n- 직접 원인 [확인: Kaspersky]: 이미 관리자 권한을 확보한 공격자가 BlackX를 설치해, Baton Drop 취약점으로 맞춤 MOK를 등록·임의 EFI 파일을 로드함으로써 Secure Boot의 서명 검증을 우회하고 OS보다 낮은 단계에서 지속성을 확보했다. 함께 설치된 커널 드라이버는 보안 소프트웨어 방해·추적 기능 변조를 시도하도록 설계됐으나, 적어도 Kaspersky 제품을 상대로는 효과가 없었던 것으로 분석에서 확인됐다.\n- 구조적 원인 [추정]: (1) 패치가 나와도 \"자동 적용\"이 아니라 관리자의 추가 조치(인증서 폐기)가 필요한 경우, 패치 적용률 통계만으로는 실제 보호 여부를 알 수 없다 (2) 부팅 단계 보안(UEFI·Secure Boot)은 운영체제보다 더 낮은 계층이라, OS용 백신·EDR이 여기까지 보지 못하는 경우가 많다 (3) 이미 몇 년 전 공개된 결함(Baton Drop, 2022년)이라도 수동 조치율이 낮으면 공격자에게는 여전히 \"새 결함\"처럼 쓸 수 있다. 이 분석이 실제 피해 기관의 미조치 이유와 일치하는지는 확인되지 않았다.\n\n**침투 경로 [확인/일부: Kaspersky]**: (최초 네트워크 침입 경로는 이번 보도에서 공개되지 않음) → 공격자가 관리자 권한 확보 → BlackX 부트킷 설치, Baton Drop(CVE-2022-21894) 취약점으로 Secure Boot 우회(맞춤 MOK 등록, 임의 EFI 파일 로드) → 폐기된 인증서로 서명된 커널 드라이버 설치(보안 소프트웨어 방해·ETW 변조 시도, Kaspersky 제품 대상은 효과 없음 확인) → 사이드로드 DLL(OxiDLLRunner)이 셸코드·Rust 페이로드 실행 → RAT가 Google Drive·OneDrive·Yandex.Disk 같은 정상 클라우드 서비스를 명령·제어(C2) 통로로 사용(추가 플러그인을 내려받는 기능은 설계상 확인됐으나 실제 내려받기·실행이 관측됐는지는 보도에 명시되지 않음).\n\n**어떻게 조치하나**\n- 즉시: 윈도우 PC 환경에서 마이크로소프트가 안내한 취약 부트매니저 인증서(\"Windows Production PCA 2011\") 폐기 절차를 공식 안내에 따라 수동으로 적용했는지 확인하고, 미적용 상태라면 지금 적용한다. 적용 후 부팅·복구 매체(복구 USB 등)와의 호환성도 함께 점검한다(해당 인증서를 차단 목록에 추가하는 것만으로는 복구 매체가 영향받을 수 있다).\n- 단기: 외교·공공기관처럼 표적이 될 가능성이 높은 조직은 부팅 로그·펌웨어 변조 흔적(비표준 EFI 파일, 알려지지 않은 MOK 등록) 점검. BlackX는 침해 이후 도구이므로, 이미 망에 다른 침입 흔적이 있는지도 함께 조사한다.\n- 장기: 패치의 \"자동 적용\"과 \"수동 폐기 필요\" 항목을 구분해 관리하는 패치 관리 체계 마련, 부팅 단계 보안(UEFI 측정 부팅, TPM 연동 점검)을 OS 수준 보안과 별도로 점검.\n- 탐지: 비정상 MOK 등록, 알려지지 않은 서명 커널 드라이버 로드, 보안 프로세스가 특정 조건에서만 꺼지는 패턴, Google Drive·OneDrive·Yandex.Disk로의 비정상 트래픽.\n\n**교훈**: \"패치가 나왔다\"와 \"내 PC에 실제로 적용됐다\"는 다른 문제다. 특히 관리자가 수동으로 한 단계를 더 눌러야 하는 패치는, 몇 년이 지나도 미적용 상태로 남아 있는 PC가 생긴다.\n\n### [D20261025-phprce] PHP 세션 처리 결함(CVE-2026-115560) — PHP2Shell과 별개의 미패치 RCE, 특정 설정 조합에서만 작동\n> 날짜: 2026-10-23(보안 공지 공개, 패치는 아직 없음) · 유형: 세션 핸들러 런타임 전환 처리 결함 → 원격 코드 실행(미패치) · 행위자: 해당 없음 · 지역: 글로벌 · 근거: 확인(PHP 보안팀 공지, 실제 악용 미확인)\n\n**쉽게 말하면**: 웹사이트의 약 70%가 쓰는 프로그래밍 언어 PHP에서, [D20261022-php2shell](2026-10-22.md)(PHP2Shell)과는 별개인 새로운 원격 코드 실행 결함(CVE-2026-115560)이 발견됐습니다. 아직 수정판이 나오지 않았지만, PHP 보안팀은 \"특이한 설정과 코드 조합\"에서만 공격이 가능하다고 밝혔습니다. 즉 모든 PHP 사이트가 위험한 게 아니라, 특정 방식으로 세션을 다루는 일부 사이트만 해당됩니다.\n\n**먼저 할 일(초보용)**: 일반 이용자가 당장 할 일은 없습니다. 자체 웹서버를 운영하는 개발자·관리자라면, 서버의 세션 설정 중 `session.upload_progress.enabled`를 지금 0으로 꺼 두는 것이 안전합니다(이 기능을 런타임에 끄고 켜는 코드를 쓰지 않는다면 끄는 데 문제가 없습니다).\n\n**개요**: BleepingComputer(10/23)에 따르면 CVE-2026-115560은 PHP 세션 처리 결함으로, PHP 보안팀은 \"설정과 애플리케이션 코드의 이례적인 조합\"에서만 악용 가능하다고 밝혔다. 구체적으로, 설정 파일에서 `session.serialize_handler`를 `php_binary` 또는 `php_serialize`로 지정해 두고, 애플리케이션 코드가 `session_start()` 호출 전에 `ini_set()`으로 이 값을 `php`로 런타임 전환하면서도 세션 업로드 진행률(`session.upload_progress`) 기능은 계속 켜 둔 경우에만 문제가 생긴다. PHP 팀은 금요일(10/23) 공지로 이를 밝혔고, 패치는 아직 없으며(정규 릴리스 주기에 맞춰 다음 버전에서 공개 예정이라고 보도됨), 이 완화 조치는 PHP2Shell(CVE-2026-109618·109619) 패치가 나온 수요일(10/21)과 같은 시점에 함께 적용했어야 한다고 보도는 설명했다. VirusTotal 집계로 인터넷에 노출된 PHP 호스트는 510만 대 이상, 그중 약 380만 대는 공격 가능한 포트가 열려 있다고 보도됐으나, 이는 PHP 전체 노출 규모이며 이번 CVE의 실제 영향 대상(특정 설정 조합 사용 서버) 규모는 별도로 공개되지 않았다. **이 CVE에 대한 실제 악용 사례는 보도 시점까지 확인되지 않았다.**\n\n**왜 일어났나**\n- 직접 원인 [확인: PHP 보안팀]: 세션 직렬화 핸들러를 설정 시점과 런타임 시점에 다르게 지정하는 특정 코드 패턴이, 세션 업로드 진행률 기능과 결합할 때 메모리 처리 오류로 이어져 원격 코드 실행이 가능하다.\n- 구조적 원인 [추정]: (1) 설정(ini)에서 정한 값과 코드가 런타임에 바꾸는 값이 일치하지 않는 조합은, 개발자가 \"설정대로 동작한다\"고 가정하기 쉬워 놓치는 경우가 많다 (2) 레거시 세션 기능(업로드 진행률 표시)처럼 오래되고 잘 쓰이지 않는 기능이 계속 기본값으로 남아 있으면, 그 기능을 잊고 있던 다른 코드 변경(런타임 핸들러 전환)과 뒤늦게 충돌할 수 있다.\n\n**침투 경로 [후보]**: 실제 악용이 확인되지 않아 이 보고서는 '후보'로만 매핑한다. 이론상: 공격자가 위 설정 조합(세션 직렬화 핸들러 런타임 전환 + 업로드 진행률 활성화)을 쓰는 서버를 찾아 조작된 세션 업로드 요청을 보내면 메모리 처리 오류로 코드 실행이 가능하다고 벤더가 설명했다.\n\n**어떻게 조치하나**\n- 즉시: 애플리케이션 코드가 세션 시작 전 `ini_set()`으로 `session.serialize_handler`를 런타임에 바꾸는지 점검하고, 해당한다면 실제 요청을 처리하는 모든 PHP 환경에 `session.upload_progress.enabled=0`을 적용한 뒤 설정 반영 여부(프로세스·PHP-FPM 재시작 등)를 확인한다. 이 기능을 쓰지 않는 서버는 이번 건의 영향을 받지 않는다고 PHP 팀은 밝혔다.\n- 단기: PHP의 다음 정규 릴리스에서 정식 패치가 나오는지 확인하고 공개 즉시 적용. PHP2Shell(CVE-2026-109618·109619) 패치 적용 여부도 함께 재확인.\n- 장기: 세션 관련 설정값을 ini 파일과 런타임 코드 양쪽에서 동시에 바꾸는 패턴을 코드 리뷰 체크리스트에 포함.\n- 탐지: 해당 없음(실제 악용 미확인, 완화 조치 적용이 핵심 대응).\n\n**교훈**: \"패치가 없다\"는 \"할 수 있는 일이 없다\"는 뜻이 아니다. 벤더가 구체적인 설정 조건을 공개하면, 그 조건에 해당하는지만 확인해도 위험을 크게 줄일 수 있다.\n\n### [D20261025-popcorntime] 폐기된 Popcorn Time 포크 앱(Time4Popcorn) 자동 업데이트 결함 — 최대 335만 기기 노출, 연구자가 선의로 차단(CVE-2026-30612)\n> 날짜: 2025-11~2026-03(연구자의 선의 조치 기간)·2026-10-23(보도 공개) · 유형: 서명·암호화 없는 HTTP 자동 업데이트 메커니즘 → 원격 코드 실행 · 행위자: 해당 없음(실제 악의적 공격자는 확인되지 않음) · 지역: 글로벌 · 근거: 확인(Eye Security 분석)\n\n**쉽게 말하면**: 영화·TV를 무단으로 스트리밍해 주던 \"Popcorn Time\"의 포크(파생) 앱 중 하나인 \"Time4Popcorn\"이 이미 관리를 그만둔(버려진) 상태인데, 이 앱의 자동 업데이트 기능이 암호화도 서명 확인도 없이 동작하고 있었습니다. 그 업데이트용 인터넷 주소(도메인)가 버려진 것을 보안 연구자들이 먼저 사들여, 누군가 이 앱을 쓰는 최대 335만 대(윈도 300만·맥 35만)의 컴퓨터에 원격으로 코드를 실행시킬 수 있다는 것을 확인했습니다. 다행히 실제 공격자가 이를 악용했다는 증거는 없고, 연구자들이 먼저 선의로 업데이트 기능을 꺼 버렸습니다.\n\n**먼저 할 일(초보용)**: 아직 Time4Popcorn(또는 비슷한 Popcorn Time 포크 앱)을 PC에 설치해 쓰고 있다면, 지금 완전히 삭제하세요. 안드로이드 버전은 원격으로 끌 수 없는 구조라 여전히 위험하므로, 설치돼 있다면 바로 지워야 합니다.\n\n**개요**: CVE-2026-30612는 폐기된 Popcorn Time 포크 \"Time4Popcorn\"의 윈도·맥 업데이트 기능에 있는 결함이다. 업데이트 프로그램이 폐기된 도메인(popcorntimeupd.xyz)에 암호화 없는 HTTP로 접속해, 실행 파일의 디지털 서명을 검증하지 않고 그대로 받아 실행했다. 보안 업체 Eye Security가 이 폐기된 도메인을 직접 사들여 관찰한 결과, 최대 윈도 300만·맥 35만 대의 접속을 확인했으며(가정·회사·정부·군 네트워크 포함), 실제 이 앱을 쓰는 사용자는 거의 없어 보였다. Eye Security는 2025년 11월부터 2026년 3월까지 이 업데이트 메커니즘을 이용해 \"업데이트 기능 자체를 멈추고 끄는\" 코드를 배포했으며, 호스트 데이터를 수집하거나 파일을 지우지는 않았다고 밝혔다. 조치 후 다운로드는 2백만 건이 기록됐고 업데이트 요청은 3/1까지 98% 줄었다. 이후 도메인 소유권은 비영리 보안 기관 Shadowserver Foundation에 이전됐다. **실제 악의적인 공격자가 이 취약점을 악용한 사례는 보도에서 확인되지 않았다.** 다만 Eye Security는 \"우리가 업데이트를 보낼 수 있었다면, 수백만 대에서 코드 실행이 가능했을 것\"이라고 밝혔다. 안드로이드 버전은 업데이트 기능을 원격으로 끌 수 없는 구조이고, 이 앱은 2014년 버전의 낡은 크롬 엔진을 샌드박스 보호 없이 쓰고 있어 여전히 위험 요소로 남아 있다.\n\n**왜 일어났나**\n- 직접 원인 [확인: Eye Security]: 업데이트 프로그램이 암호화되지 않은 HTTP로 통신하고 받은 실행 파일의 서명을 검증하지 않아, 그 업데이트 도메인을 통제하는 누구든 임의 코드를 배포할 수 있었다.\n- 구조적 원인 [추정]: (1) 관리가 중단된(버려진) 앱은 개발자가 사라져도 자동 업데이트 기능과 그 도메인은 계속 살아 있는 경우가 많아, 도메인이 만료되면 제3자가 사들여 그 신뢰를 그대로 물려받을 수 있다 (2) 불법·회색지대 앱은 정식 보안 공지·패치 체계가 없어, 결함이 발견돼도 공식적으로 고쳐지지 않고 방치된다.\n\n**침투 경로 [후보]**: 실제 악의적 악용이 확인되지 않아 이 보고서는 '후보'로만 매핑한다. 이론상: 공격자가 폐기된 업데이트 도메인을 장악 → 서명 검증 없는 HTTP 업데이트 채널로 악성 실행 파일 배포 → 윈도에서는 SYSTEM, 맥에서는 root 권한으로 실행.\n\n**어떻게 조치하나**\n- 즉시: Time4Popcorn 등 관리가 중단된 Popcorn Time 계열 앱을 쓰고 있다면 완전 삭제(윈도·맥·안드로이드 모두)가 가장 확실한 조치다. 연구자가 업데이트 기능을 중지시킨 것은 임시 조치이며, 앱 자체(낡은 크롬 엔진 등)의 다른 결함까지 없애주지는 않는다.\n- 단기: 조직 내 자산 점검 시 관리 중단(폐기)된 소프트웨어 목록 작성, 특히 자동 업데이트 기능이 있는 프로그램 우선 점검.\n- 장기: 소프트웨어 자산관리(SAM)에 \"개발 중단 여부\"를 점검 항목으로 포함, 폐기 예정 소프트웨어의 업데이트 도메인·인증서를 조직이 직접 폐기하는 절차 마련(개발사 입장에서의 일반 원칙).\n- 탐지: 해당 없음(실제 악용 미확인, 이미 연구자가 업데이트 기능을 선제적으로 비활성화한 사건).\n\n**교훈**: 앱 개발이 멈춰도 \"업데이트 기능\"은 멈추지 않는 경우가 많다. 그 기능이 신뢰를 검증하지 않는 구조였다면, 개발자가 떠난 뒤에도 위험은 남아 있다가 누구든(선의의 연구자든 악의적 공격자든) 가로챌 수 있다.\n\n### [D20261025-hollys] 할리스 커피 멤버십 해킹 — 고객정보 약 276만 건 유출, 가상화폐 채굴 목적 클라우드 접근 중 노출 (국내)\n> 날짜: 2026-09-03~10-07(추정 유출 기간)·2026-10-16(회사 인지)·2026-10-18(고객 통보) · 유형: 클라우드 서비스 비정상 접근(세부 경위 비공개) · 행위자: 미귀속 · 지역: 한국 · 근거: 확인(회사 공지, 보도)\n\n**쉽게 말하면**: 커피 프랜차이즈 할리스가 멤버십 정보를 보관하던 클라우드 서비스에 외부인이 가상화폐를 채굴할 목적으로 몰래 접근했는데, 그 과정에서 고객 개인정보 약 276만 건이 함께 노출됐습니다. 유출된 정보는 활성 고객 DB가 아니라 과거 멤버십 개편 때 만들어 둔 임시 데이터 파일이며, 2020년 2월 11일 이전 가입 고객이 주로 해당합니다. 할리스는 사고를 16일에 인지했지만, 고객에게는 이틀이 지난 18일에야 문자로 알려 늦은 통보라는 비판을 받고 있습니다.\n\n**먼저 할 일(초보용)**: 2020년 2월 이전부터 할리스 멤버십을 썼다면, 지금 할리스 비밀번호를 바꾸고, 같은 아이디·비밀번호를 다른 사이트에서도 쓰고 있다면 그 사이트들의 비밀번호도 함께 바꾸세요. 유출 항목에 비밀번호가 포함돼 있어, 비밀번호 변경이 이번 사건에서는 실제로 의미 있는 조치입니다(다른 사건과 달리 단순 안내가 아닙니다).\n\n**개요**: 할리스는 10/19 입장문에서 외부 공격자가 가상화폐 채굴을 위해 멤버십 정보가 담긴 클라우드 서비스에 비정상적으로 접근하는 과정에서 고객 정보가 유출됐다고 밝혔다. 신고된 유출 규모는 약 276만 건(중복 회원 포함 추정치)이며, 정확한 규모는 추가 확인 중이다. 유출 항목은 아이디·비밀번호·이름·생년월일·전화번호·주소·이메일·중복가입확인정보(DI) 등 9개 항목이다. 유출된 데이터는 현재 활성 고객 DB가 아니라 과거 멤버십 서비스 개편 과정에서 만든 임시 데이터 파일로 파악됐으며, 주로 2020년 2월 11일 이전 가입 고객이 대상이다. 추정 유출 기간은 2026년 9월 3일~10월 7일이다. 회사는 접근 경로를 차단하고 인증 절차를 강화했으며 관계기관에 신고하고 조사에 협조하고 있다고 밝혔다. 다만 회사가 10/16 사고를 인지한 뒤 홈페이지에만 공지를 올리고, 고객에게는 이틀 뒤인 10/18에야 문자로 통보한 점, 그리고 법정 신고 기한을 넘겼다는 지적이 보도에서 제기됐다. **구체적인 침투 경로(클라우드 계정이 어떻게 뚫렸는지)는 보도 시점까지 공개되지 않았다.**\n\n**왜 일어났나**\n- 직접 원인: 공개되지 않았다. 회사는 \"가상화폐 채굴을 위한 클라우드 서비스 비정상 접근\"만 밝혔으며, 그 접근이 탈취된 계정 자격 증명 때문인지, 클라우드 설정 오류 때문인지, 다른 취약점 때문인지는 공개되지 않았다.\n- 구조적 원인 [추정]: (1) 가상화폐 채굴을 노린 공격은 보통 컴퓨팅 자원 탈취가 목적이지만, 같은 클라우드 환경에 멤버십 개인정보가 함께 있었다면 채굴 목적의 침입이라도 개인정보 노출로 이어질 수 있다 (2) \"활성 DB가 아닌 과거 임시 데이터 파일\"이 유출됐다는 설명은, 더 이상 쓰지 않는 데이터도 삭제하지 않고 클라우드에 남겨 두면 그 자체로 노출 위험이 된다는 점을 보여준다. 이 구조적 분석이 실제 이번 사건의 원인과 일치하는지는 확인되지 않았다.\n\n**침투 경로 [미공개]**: 공개된 자료에서 확인되지 않아 이 보고서는 매핑하지 않는다.\n\n**어떻게 조치하나**\n- 즉시(회사): 비인가 접근 경로 차단(시행), 인증 절차 강화(시행), 증거 보존, 관계기관 신고·조사 협조(시행).\n- 단기: 정확한 유출 규모·항목 확정 후 개별 고객 통지, 비밀번호가 포함된 유출인 만큼 전체 영향 고객에게 비밀번호 재설정 강제 적용 검토.\n- 장기: 더 이상 쓰지 않는 과거 데이터(개편 전 임시 파일 등)를 클라우드에 남겨 두지 않고 정기적으로 삭제·파기하는 데이터 보유 정책 수립, 해당 임시파일에 접근 가능했던 계정·키의 자격 증명 교체, 클라우드 접근 로그·이상 탐지 강화.\n- 탐지: 해당 없음(이미 인지·조사 중인 사건).\n\n**교훈**: 공격의 \"목적\"이 개인정보 탈취가 아니었어도(이번엔 채굴이 목적) 같은 공간에 보관된 개인정보는 함께 노출된다. 더는 쓰지 않는 데이터를 치우지 않는 것도 유출 규모를 키우는 원인이 된다.\n\n## 3. 국내 소식\n\n**국내 질의 결과**: 지침에 따라 ①금융권 ②통신·OTT·이커머스 ③공공·지자체·교육·의료 ④국내 랜섬웨어 ⑤정부 발표 ⑥기존 사건 규모 갱신, 총 6개 범주를 각각 검색했다. ①금융권은 10/19 국감 이후 10/24~25 사이의 새로운 당국 발표나 추가 피해 기관을 찾지 못했다(가장 최근은 [10-24 보고서](2026-10-24.md)에 기록된 10/19 금감원 국감 내용과 동일). ②통신·이커머스(쿠팡·티빙·통신 3사)는 10월 신규 침해사고를 찾지 못했고, 검색 결과는 9월 발표된 티빙 사건(3,954만 계정, 민관합동조사단 최종 집계)과 10/6 국정감사 소환 관련 기존 보도의 재인용이었다. ③공공·지자체·교육·의료는 일반 WebSearch로 10월 24~25일 신규 공공·교육기관 사건을 찾지 못했으나, **할리스 커피(식음료 프랜차이즈) 멤버십 해킹**을 새로 확인해 이번 보고서의 사건으로 등록했다(10/16 인지·10/19 공식 입장, 276만 건 유출). ④국내 랜섬웨어 10월 전국 통계는 공개되지 않았다(안랩 ASEC 최신 월간 보고서는 7월자로 변동 없음). ⑤과기정통부·금융위·개인정보보호위원회·금융감독원의 10월 24~25일 신규 발표는 확인하지 못했다. ⑥기존 사건 규모 갱신은 이번 조사에서는 확인되지 않았다(금융권·티빙 사건 모두 10/19~9월 집계 이후 추가 갱신 보도를 찾지 못했다).\n\n할리스 사건은 유출 규모(약 276만 건)와 비밀번호를 포함한 유출 항목이 분명해 이번 보고서의 사건(D20261025-hollys)으로 등록했고, `국내뉴스.psv`에는 별도로 적지 않았다(이미 사건으로 다뤘으므로 중복 기재하지 않음).\n\n## 4. 우선 대응 체크리스트\n\n1. **윈도우 PC 다수 운영 기관(특히 외교·공공·연구기관)**: 마이크로소프트의 취약 부트매니저 인증서(\"Windows Production PCA 2011\") 폐기 절차를 수동으로 적용했는지 지금 확인.\n2. **PHP 개발자·서버 관리자**: 세션 직렬화 핸들러를 런타임에 바꾸는 코드가 있는지 점검하고, 해당하면 `session.upload_progress.enabled=0` 즉시 적용.\n3. **Time4Popcorn 등 관리 중단 Popcorn Time 계열 앱 사용자**: 지금 완전 삭제(윈도·맥·안드로이드 모두).\n4. **할리스 멤버십 이용자(2020년 2월 이전 가입)**: 할리스 비밀번호 변경, 동일 비밀번호를 쓰는 다른 서비스도 변경.\n5. [10-17](2026-10-17.md)~[10-24](2026-10-24.md) 보고서의 Ivanti·Atlassian·Ahsay·PAN-OS·Cisco SEG·BeyondTrust·Fortinet·SiteGuard·Plex·Siemens·PHP(PHP2Shell)·SafePay·UpdraftCentral·eMudhra·Onamae·커넥트와이즈·Arista VCO·LiteLLM·GitLab·Collabora·HPE ArubaOS·Node.js/Bun — 기한이 지났거나 임박한 건이 많으므로 미조치 상태라면 우선 처리.\n\n## 5. 검증 수준과 한계\n\n- CISA KEV는 JSON 피드를 직접 받아 10/23 등재분 이후 10/24~25 신규 등재가 없음을 확인했다(1차 출처, 피드가 매우 커 전체를 한 번에 읽지는 못했고 날짜순 최신 구간을 확인했다).\n- BlackX·PHP·Time4Popcorn 3건은 BleepingComputer 기사를 WebFetch로 직접 열람해 확인했다(2차 보도). BlackX는 Kaspersky의 원문 분석(securelist.com)도 WebFetch로 직접 열람해 보도 내용을 교차 확인했다(1차 출처 확인 과정에서 보안 소프트웨어 무력화 실패·침해 후 설치라는 점을 추가로 확인해 본문에 반영). PHP 보안팀·Eye Security의 원문 공지·분석 페이지는 직접 열람하지 못하고 보도 인용으로만 확인했다.\n- BlackX는 공격자가 이미 관리자 권한을 확보한 뒤 설치한 침해 후 도구로, 최초 네트워크 침입 경로는 보도에서 공개되지 않아 ATT&CK 매핑에서 초기 접근(Initial Access) 전술은 제외했다. APT41 귀속은 Kaspersky가 \"중간 확신도\"로 밝힌 것으로 확정적이지 않다. 보안 소프트웨어 비활성화 시도는 Kaspersky 자체 분석에서 Kaspersky 제품에는 효과가 없었던 것으로 확인됐고, 사이드로드 DLL의 추가 플러그인 내려받기도 설계상 확인됐을 뿐 실제 사용 여부는 보도에 명시되지 않았다(T1105은 '추정'으로 하향).\n- 할리스 건은 \"가상화폐 채굴 목적 클라우드 비정상 접근\"이라는 목적·결과만 공개됐고 구체적 침투 경로(계정 탈취·설정 오류·취약점 등)가 공개되지 않아 ATT&CK 매핑을 하지 않았다(분류 J에 준함).\n- 국내 질의 중 ①⑥(금융권 신규 발표·기존 사건 규모 갱신)은 10/19 국감 이후 새로운 자료를 찾지 못했으며, 이것이 \"추가 집계가 없다\"는 뜻인지 \"아직 보도되지 않았다\"는 뜻인지는 구분할 수 없다.\n- ②(쿠팡·티빙·통신 3사)와 ③(공공·교육)의 보안뉴스(boannews.com) 등 전문 매체 기사 목록 직접 열람은 이번 조사에서 WebSearch로 대체했고, 지난 보고서들처럼 사이트를 직접 열람하지는 못했다. 전문 매체 직접 열람이 가능했다면 추가 국내 사건이 더 확인됐을 가능성이 있다.\n\n## 출처\n\n- CISA KEV JSON 피드 (직접 확인)\n- BleepingComputer(직접 열람): BlackX/Baton Drop, PHP CVE-2026-115560, Time4Popcorn/CVE-2026-30612\n- SecurityWeek(메인 페이지 직접 열람, 10/24~25 신규 기사 없음 확인)\n- Kaspersky securelist.com 분석(직접 열람) — BlackX UEFI 부트킷\n- PHP 보안팀 공지(보도 인용) — CVE-2026-115560\n- Eye Security 분석(보도 인용) — Time4Popcorn CVE-2026-30612\n- 할리스 공식 입장문(SBS Biz·서울신문·뉴스토마토 등 보도 인용) — 멤버십 해킹\n- MITRE ATT&CK v19.2(저장소 기준, v20.0 공식 전환은 유지 확인됨, 재매핑 보류)\n"},{"path":"일일/2026-10-26.md","title":"일일 보안 이슈 분석 — 2026-10-26","md":"# 일일 보안 이슈 분석 — 2026-10-26\n\n> 수집 기준: 2026-10-26(오늘, 조사 진행 시각까지 공개분). CISA KEV는 JSON 피드를 직접 확인했으며 10/23 등재분(최신) 이후 10/24~26 신규 등재는 없었다(1차 출처). 해외 소식은 BleepingComputer 기사를 WebFetch로 직접 열람해 확인했고, PHP2Shell 후속 보강 내용은 decrypt.co(AP 통신 재배급)를 WebFetch로 직접 확인했다. 국내 소식은 WebSearch로 6개 범주를 각각 확인했다(언론사 직접 열람은 일부만 가능).\n> 근거 표기: **[확인]** 벤더·정부기관·연구자가 직접 확인 / 보도 언론 보도 / **[추정]** 본 보고서의 추정 / **[주장]** 공격자 일방 주장. **조치는 본 보고서의 권고**이며 벤더 공식 지침이 우선한다.\n> **ATT&CK 버전 점검**: attack.mitre.org 확인 결과 공식 버전은 여전히 **v20.0**이다(10/25 확인분과 동일, 추가 변경 없음). 이 저장소는 당분간 **v19.2 매핑을 유지**하며 임의로 대규모 재매핑하지 않는다.\n\n## 1. 오늘의 요약\n\n| # | 이슈 | CVE | 유형 | 상태 | 즉시 조치 |\n|---|------|-----|------|------|-----------|\n| 1 | AI 코딩 에이전트가 AGENTS.md·CLAUDE.md 지침 파일을 맹신해 하이재킹당함 | — | AI 에이전트의 작업 디렉터리 지침 파일 자동 신뢰·실행 | [확인] Forever Security 확인, 실제 악성 패키지 설치 시도 1건 관측 | 에이전트를 `~/Downloads` 등 넓은 폴더가 아니라 프로젝트 루트에서만 실행 |\n\n오늘은 해외 대형 신규 침해·제로데이·랜섬웨어 소식이 CISA KEV·주요 매체(BleepingComputer, SecurityWeek)에서 추가로 확인되지 않았다(§5 참고). 아래 1건이 오늘의 신규 사건이며, 기존 사건 2건에 대한 후속 확인 사항은 \"참고 기록\"으로 별도 기록한다.\n\n## 2. 이슈별 분석\n\n### [D20261026-agentsmd] AI 코딩 에이전트(Claude Code·Codex 등) 하이재킹 — Downloads 폴더의 악성 AGENTS.md·CLAUDE.md 지침 파일을 에이전트가 그대로 신뢰\n> 날짜: 발견 시점 비공개(연구사 보고서는 보도 주간 내 공개)·2026-10-25(BleepingComputer 보도) · 유형: AI 코딩 에이전트가 작업 디렉터리의 지침 파일(AGENTS.md·CLAUDE.md)을 자동으로 읽고 그 지시에 따라 명령 실행을 시도해 악성 패키지 설치·OAuth 토큰 노출로 이어질 수 있는 설계상 신뢰 경계 문제 · 행위자: 미귀속(실제 공격자 불명, 연구는 보안기업 Forever Security) · 지역: 글로벌 · 근거: 확인(Forever Security가 관측했다고 보고, 고객 PC에서 설치 시도 1건)\n\n**쉽게 말하면**: 최근 개발자들이 많이 쓰는 \"AI 코딩 에이전트\"(OpenAI Codex, Anthropic Claude Code 등)는 작업을 시작할 폴더에 `AGENTS.md`나 `CLAUDE.md`라는 이름의 \"안내 파일\"이 있으면 그 내용을 사람의 지시만큼 신뢰하고 그대로 따릅니다. 보안회사 Forever Security는, 누군가의 PC에서 이 안내 파일이 몰래 다운로드 폴더(Downloads)에 들어가 있었고, 그 폴더에서 에이전트를 실행했더니 안내 파일의 지시에 따라 악성 프로그램(npm 패키지)을 설치하려 한 사례를 실제로 발견했습니다. 더 나아가 연구진은, 이런 방식으로 Claude Code의 통신을 공격자 서버로 몰래 우회시켜 로그인 정보(OAuth 토큰)를 빼낼 수 있다는 것도 실험으로 보여줬습니다(이건 아직 실제 공격 사례는 아니고 연구 시범입니다). OpenAI와 Anthropic은 이걸 \"고쳐야 할 결함\"이 아니라 \"에이전트가 설계대로 동작한 것\"이라는 입장이어서, 패치로 해결되지 않고 사용자가 사용 습관을 바꿔야 하는 문제입니다.\n\n**먼저 할 일(초보용)**: AI 코딩 에이전트(Claude Code, Codex, Cursor 등)를 쓰고 있다면, 지금부터는 다운로드 폴더(Downloads)나 홈 폴더처럼 넓은 범위가 아니라, 실제 작업할 프로젝트 폴더 안에서만 실행하세요. 낯선 `AGENTS.md`·`CLAUDE.md` 파일이 작업 폴더에 보이면 내용을 먼저 열어서 확인하고, 이상한 지시(패키지 설치, 외부 서버 접속 등)가 있으면 그 폴더에서 에이전트를 실행하지 마세요.\n\n**개요**: BleepingComputer(10/25) 보도에 따르면, AI 에이전트 위험을 연구하는 보안기업 Forever Security(연구원 Gal Weizman 등)는 고객 PC에서 악성 `AGENTS.md` 파일이 `~/Downloads` 폴더에 들어 있고, 이 폴더가 코딩 에이전트의 작업 디렉터리로 쓰이고 있던 사례를 발견했다. 코딩 에이전트는 작업 디렉터리에 있는 `AGENTS.md`·`CLAUDE.md` 같은 지침 파일을 시작할 때 자동으로 읽고 따르도록 설계돼 있는데, 이 사례에서는 그 지침에 따라 악성 npm 패키지 **`function-color`** 설치가 시도된 것이 확인됐다. 이 파일이 애초에 어떻게 Downloads 폴더에 들어갔는지는 확인되지 않았으며, 연구진은 \"웹페이지가 방문자 몰래 Downloads에 이런 파일을 내려받게 만들 수 있다\"고 주장했을 뿐 이번 사례의 실제 유입 경로는 밝혀지지 않았다. 연구진은 OpenAI Codex와 Claude Code를 대상으로 자체 PoC 실험에서 재현에 성공했다고 보고했다(Codex는 무해한 계산기 앱 실행 페이로드로 90% 성공). Claude Code의 경우, 악성 `CLAUDE.md`로 API 트래픽을 공격자 서버로 우회시켜 OAuth 토큰(앱이 서버에 접속할 때 쓰는 인증 정보)을 노출시키고 공격자가 모델을 사칭해 도구 호출(코드 실행)을 반환하는 시나리오를, 연구진의 해당 PoC 실험에서 약 50% 확률로 성공시켰다고 보고했다. **이 토큰 탈취 시나리오는 연구 시연이며, 실제 공격에서 관측된 사례는 아니다.** Forever Security 내부 통계로는 Downloads 폴더에서 Claude Code·Codex·Cursor CLI 등을 실행한 고객이 수백 명이고, Claude Code만 해당 위치에서 1,300회 이상 세션이 열렸다고 한다. **OpenAI와 Anthropic 양사는 연구진에게 \"패치할 결함이 아니라 설계된 동작\"이라는 입장을 밝혔고**(기사에 두 회사의 별도 공식 성명은 인용되지 않음), 에이전트를 프로젝트 디렉터리에서 실행하라고 권고한다고 보도됐다.\n\n**왜 일어났나**\n- 직접 원인 [확인: Forever Security]: AI 코딩 에이전트가 작업 디렉터리에 있는 지침 파일(AGENTS.md·CLAUDE.md)의 내용을 사람의 지시와 동등하게 신뢰하고 자동으로 따르도록 설계돼 있어, 그 폴더에 악성 지침 파일이 놓이면(유입 경로는 이번 사례에서 불명) 에이전트가 이를 그대로 수행한다.\n- 구조적 원인 [추정]: (1) \"지침 파일을 작업 디렉터리에서 자동으로 읽는다\"는 편의 기능은, 그 디렉터리에 누가 무엇을 놓을 수 있는지에 대한 신뢰 경계를 따로 두지 않는다 (2) Downloads 폴더는 브라우저·설치 프로그램 등 다양한 경로로 외부 콘텐츠가 들어오는 \"신뢰도가 낮은\" 위치인데도, 사용자들이 편의상 그 폴더에서 바로 에이전트를 실행하는 습관이 있다(Forever Security 집계로 수백 명·1,300여 세션) (3) 벤더가 \"설계된 동작\"이라고 보는 이상, 이 문제는 패치가 아니라 사용자 행동(실행 위치 제한)으로만 줄일 수 있다.\n\n**침투 경로 [확인·일부 후보]**: (파일이 Downloads 폴더에 들어간 경로는 이번 사례에서 확인되지 않음 — Downloads는 노출 조건일 뿐이고, 연구진이 주장한 \"웹페이지가 몰래 저장\" 가능성은 가설이며 실제 유입 원인으로 확인된 것은 아님 → [후보]) → 사용자가 Downloads 폴더(또는 악성 파일이 있는 폴더)를 작업 디렉터리로 지정해 AI 코딩 에이전트 실행 → 에이전트가 그 폴더의 AGENTS.md·CLAUDE.md를 자동으로 읽고 지침으로 신뢰 [확인] → 지침에 따라 악성 npm 패키지(`function-color`) 설치 명령 실행을 시도 [확인, Forever Security가 관측했다고 보고] / 또는 API 트래픽을 공격자 서버로 우회시켜 OAuth 토큰 노출 후 공격자가 모델을 사칭해 코드 실행 [연구 PoC, 별도 실험이며 이번 실제 사건에 적용됐다는 근거는 없음].\n\n**어떻게 조치하나**\n- 즉시: AI 코딩 에이전트를 Downloads·홈 디렉터리처럼 넓은 폴더가 아니라 신뢰할 수 있는 프로젝트 루트 폴더에서만 실행하도록 습관·정책을 바꾼다(프로젝트 루트라고 무조건 안전한 것은 아니며, 에이전트가 함께 읽는 상위·전역 설정·지침 파일까지 점검해야 한다). 처음 보는 AGENTS.md·CLAUDE.md 파일은 에이전트를 실행하기 전에 내용을 먼저 읽고 검토한다.\n- 단기: 에이전트의 승인 프롬프트(명령 실행 전 확인)와 샌드박스·격리 실행 기능을 켜 두고 임의로 우회·비활성화하지 않는다. 조직 차원에서는 개발자 PC의 에이전트 실행 디렉터리와 상위·전역 설정 파일을 조사해 Downloads·홈 폴더에서 실행된 이력이 있는지, 지침 파일이 변조됐는지 점검한다. 이미 Downloads 등 넓은 폴더에서 에이전트를 돌린 적이 있다면 해당 에이전트가 쓰던 OAuth 토큰·API 키를 폐기하고 재인증하며, 의도치 않은 패키지가 설치됐는지 확인한다.\n- 장기: AI 코딩 에이전트 도입 가이드라인에 \"지침 파일은 작업 디렉터리 안의 콘텐츠이므로 그 디렉터리(와 상위 경로)의 출처를 신뢰할 수 있어야 한다\"는 원칙을 포함한다. 신뢰할 수 없는 코드·저장소는 격리된 환경(컨테이너 등)에서 먼저 테스트한다.\n- 탐지: 에이전트가 설치를 시도하는 패키지명이 평소 프로젝트의 의존성 목록에 없는 경우, 에이전트 프로세스가 평소와 다른 외부 서버로 API 트래픽을 보내거나 API 목적지(엔드포인트) 설정이 바뀐 경우.\n\n**교훈**: AI 에이전트에게 \"작업 폴더 안의 문서는 믿을 만하다\"는 가정은, 그 폴더가 사람이 신중하게 고른 프로젝트가 아니라 브라우저가 아무거나 받아 두는 Downloads 폴더일 때는 깨진다. 벤더가 \"설계된 동작\"이라고 선을 그은 문제는, 패치를 기다리지 말고 사용자가 먼저 실행 위치를 바꿔야 한다.\n\n### 참고 기록 — PHP2Shell: AI가 발견했고, 3개국 정부가 선제적으로 웹사이트를 내렸다\n\n[D20261022-php2shell](2026-10-22.md) 결함(CVE-2026-109618·109619)에 대한 추가 사실이 decrypt.co(AP 통신 재배급, 10/21)를 통해 확인됐다. OpenAI는 자사 AI 모델(GPT-5.6 \"Sol\")이 이 결함을 찾아내는 데 핵심적인 역할을 했다고 밝혔다 — 보안업체 Calif가 8월에 1차 버전을, OpenAI 팀이 9월에 더 완전한 버전을 GPT-5.6으로 찾았고, 클라우드 보안업체 Wiz도 독립적으로 두 결함을 모두 발견했다. OpenAI의 Greg Brockman은 \"Patch the Planet\" 이니셔티브 아래 두 달간 대응 연합을 이끌었다고 밝혔다(해당 결함은 PHP에 14년간 존재했고 2024년에 제한된 형태가 한 차례 나왔으나 당시엔 중대하게 평가되지 않았다고 보도됐다). 패치 세부 내용이 조기 유출되자 PHP 유지관리팀은 원래 목표였던 10/22보다 하루 앞당긴 **10/21**에 패치를 공개했다. 핀란드·네덜란드·프랑스 정부는 패치 공개 당일(수요일) 자국 정부 웹사이트 일부를 선제적으로 오프라인 전환했다고 보도됐다 — 누구든 PHP 서버에서 임의 코드를 실행할 수 있는 결함이었기 때문이다. **이 기사에서도 실제 악용(ITW) 사례는 보고되지 않았다.** 기존 매핑(TA0001|T1190|확인)과 분류(A)는 그대로 유지하며 별도 사건으로 분리하지 않는다. \"AI가 취약점을 찾아 수정 연합을 이끈\" 보기 드문 사례로 기록해 둔다.\n\n## 3. 국내 소식\n\n**국내 질의 결과**: 지침에 따라 ①금융권 ②통신·OTT·이커머스 ③공공·지자체·교육·의료 ④국내 랜섬웨어 ⑤정부 발표 ⑥기존 사건 규모 갱신, 총 6개 범주를 각각 검색했다(검색어에 \"2026년 10월\" 포함). ①금융권(검색어: \"2026년 10월 금융권 해킹 개인정보 유출 은행 카드 저축은행\")은 10/19 국감 이후 새로운 당국 발표·추가 피해 기관을 찾지 못했다 — 가장 최근 수치는 [10-23 보고서](2026-10-23.md)에 기록된 16개사·약 10만 건(10/14 집계)과 동일했다. ②통신·이커머스(검색어: \"2026년 10월 쿠팡 티빙 통신사 침해사고 개인정보 유출\")는 10월 신규 침해사고를 찾지 못했고, 결과는 모두 기존 티빙 사건(민관합동조사단 최종 집계 3,954만 계정)의 재인용·국정감사 후속 보도였다. ③공공·지자체·교육·의료(검색어: \"2026년 10월 공공기관 대학 의료기관 개인정보 유출 해킹\")는 10월 신규 사건을 찾지 못했고, 검색된 것은 모두 과거 사건(2026-01 해킹포럼 탈취, 2026-07 국립외교원 해킹, 2024년 전북대 사건 등)의 재인용이었다. ④국내 랜섬웨어(검색어: \"2026년 10월 국내 랜섬웨어 피해\")는 결과가 없었다 — 검색 결과는 전부 해외(미국·글로벌) 통계였다. ⑤정부 발표(검색어: \"과기정통부 KISA 개인정보보호위원회 금융위 금감원 2026년 10월 발표 제재\")는 10/24~26 구간의 신규 발표를 찾지 못했으나, 10/13 국정감사에서 **개인정보보호위원회 송경희 위원장**이 금융권·공공기관 유출 사고에 매출 최대 10% 과징금과 조사 비협조 시 이행강제금을 적용하고, 대규모 유출엔 전담 조사단을 꾸리겠다고 밝힌 발언을 새로 확인해 `국내뉴스.psv`에 기록했다(아직 법안·시행 여부가 아니라 국감 발언 단계임을 유의). ⑥기존 사건 규모 갱신(검색어: \"금융권 해킹 16개사 10만건 추가 집계 10월 24일 25일 26일\")은 10/24~26 구간의 추가 갱신 보도를 찾지 못했다.\n\n오늘 조사에서는 사건으로 등록할 만큼 크고 새로운 국내 사건은 확인되지 않았다(어제 할리스 커피 멤버십 해킹이 이미 등록됨).\n\n## 4. 우선 대응 체크리스트\n\n1. **AI 코딩 에이전트(Claude Code·Codex·Cursor 등) 사용자·개발팀**: 에이전트를 Downloads·홈 폴더가 아니라 프로젝트 루트 폴더에서만 실행하도록 지금 점검·변경.\n2. **PHP 운영 조직**: [D20261022-php2shell](2026-10-22.md) 패치(10/21 공개) 적용 여부 재확인 — 국내 패치율이 낮았던 전례([10-24 보고서](2026-10-24.md) 3.8%)가 있다.\n3. [10-17](2026-10-17.md)~[10-25](2026-10-25.md) 보고서의 Ivanti·Atlassian·Ahsay·PAN-OS·Cisco SEG·BeyondTrust·Fortinet·SiteGuard·Plex·Siemens·PHP(PHP2Shell)·SafePay·UpdraftCentral·eMudhra·Onamae·커넥트와이즈·Arista VCO·LiteLLM·GitLab·Collabora·HPE ArubaOS·Node.js/Bun·Time4Popcorn — 기한이 지났거나 임박한 건이 많으므로 미조치 상태라면 우선 처리.\n\n## 5. 검증 수준과 한계\n\n- CISA KEV는 JSON 피드를 직접 받아 10/23 등재분 이후 10/24~26 신규 등재가 없음을 확인했다(1차 출처, 피드가 매우 커 날짜순 최신 구간만 확인했다).\n- AGENTS.md/CLAUDE.md 하이재킹은 BleepingComputer 기사(2차 보도, 연구사 인터뷰 기반)를 WebFetch로 직접 열람해 확인했다. Forever Security의 원문 보고서는 직접 열람하지 못했다. 이 사건은 ATT&CK Enterprise 매트릭스가 원래 사람이 조직 내부망에서 공격받는 상황을 전제로 만들어져, \"AI 에이전트가 로컬 지침 파일을 자동으로 따르는\" 이번 공격 방식과 완전히 일치하는 공식 기법이 없다. 아래 매핑은 가장 가까운 기법에 대한 유비이며, 공식 사이트(attack.mitre.org)에서 재확인했다.\n  - T1204.002(악성 파일, User Execution)는 원래 \"사람\"이 파일을 열어 실행하는 상황을 가리킨다. 에이전트가 지침에 따라 설치 명령 실행을 시도한 행위 자체는 실제 관측됐지만, 이를 T1204.002로 대응시키는 것은 분석상의 유비이지 공식 기법 정의와의 일치가 아니므로 — 행위 관측과 매핑 확신을 분리해 — 근거를 후보로 표기했다(Codex 검토에서 \"확인\"은 과도하다는 지적을 반영해 하향).\n  - T1189(드라이브 바이 컴프로마이즈)는 \"웹페이지가 Downloads에 몰래 파일을 저장\"한다는 연구진의 가설적 주장일 뿐, 이번 실제 사례의 유입 경로는 확인되지 않아 후보로만 표기했다(Downloads 폴더라는 점은 노출 조건이지 확인된 유입 원인이 아니다).\n  - T1528(앱 접속 토큰 훔치기)은 Claude Code OAuth 토큰 탈취가 연구진의 별도 PoC 실험(약 50% 성공률)으로만 시연됐고, 이번 실제 관측 사건(npm 패키지 설치 시도)에 이 기법이 적용됐다는 근거는 없어 후보로 표기했다.\n- PHP2Shell 후속 보강 내용은 decrypt.co(AP 통신 재배급) 1건만 WebFetch로 확인했고, OpenAI·PHP 유지관리팀의 원문 발표는 직접 열람하지 못했다. CVE 번호는 이 기사에 나오지 않아 기존 저장소 기록([D20261022-php2shell](2026-10-22.md))을 그대로 따랐다.\n- 국내 질의 중 ①②③④⑥은 WebSearch만으로 수행했고(보안뉴스 등 전문 매체 직접 열람은 이번 조사에서 하지 못함), 결과 없음이 \"사건이 실제로 없다\"는 뜻인지 \"아직 보도되지 않았다\"는 뜻인지는 구분할 수 없다.\n- 해외 랜섬웨어·대형 유출 일반 검색에서는 10월 24~26일 날짜로 특정되는 새로운 대형 사건을 추가로 찾지 못했다(검토했으나 채택하지 않음: 날짜·근거가 불충분한 보도 몇 건).\n\n## 출처\n\n- CISA KEV JSON 피드 (직접 확인)\n- BleepingComputer(직접 열람): AI 코딩 에이전트 AGENTS.md/CLAUDE.md 하이재킹\n- decrypt.co(직접 열람, AP 통신 재배급): PHP2Shell AI 발견·각국 정부 대응\n- 머니투데이(보도, 10/13 국정감사): 개인정보보호위원회 과징금·이행강제금 발언\n- MITRE ATT&CK v19.2(저장소 기준, v20.0 공식 전환은 유지 확인됨, 재매핑 보류)\n"},{"path":"일일/2026-10-27.md","title":"일일 보안 이슈 분석 — 2026-10-27","md":"# 일일 보안 이슈 분석 — 2026-10-27\n\n> 수집 기준: 2026-10-27(오늘, 조사 진행 시각까지 공개분). CISA KEV는 JSON 피드를 직접 확인했으며 10/26 등재분(PHP2Shell 2건, [D20261022-php2shell](2026-10-22.md) 기존 사건) 이후 10/27 신규 등재는 없었다(1차 출처). 해외 소식은 BleepingComputer 기사를 WebFetch로 직접 열람해 확인했다. 국내 소식은 WebSearch로 6개 범주를 각각 확인했다(언론사 직접 열람은 이번 조사에서 하지 못함).\n> 근거 표기: **[확인]** 벤더·정부기관·연구자가 직접 확인 / 보도 언론 보도 / **[추정]** 본 보고서의 추정 / **[주장]** 공격자 일방 주장. **조치는 본 보고서의 권고**이며 벤더 공식 지침이 우선한다.\n> **ATT&CK 버전 점검**: attack.mitre.org 확인 결과 공식 버전은 여전히 **v20.0**이다(10/26 확인분과 동일, 추가 변경 없음). 이 저장소는 당분간 **v19.2 매핑을 유지**하며 임의로 대규모 재매핑하지 않는다.\n\n## 1. 오늘의 요약\n\n| # | 이슈 | CVE | 유형 | 상태 | 즉시 조치 |\n|---|------|-----|------|------|-----------|\n| 1 | 코펜하겐대학교(덴마크) 테스트 환경 해킹 — 약 54만5천 명 정보 노출 | — | 테스트 환경 무단 접근(침투 경로 비공개) | [확인] 대학 공지, 보도 | 영향 확인 안내 대기, PIN 재발급 안내 시 즉시 적용 |\n\n오늘은 해외 대형 신규 침해·제로데이·랜섬웨어 소식이 CISA KEV·주요 매체에서 추가로 확인되지 않았다(§5 참고). 위 1건이 오늘의 신규 사건이며, 기존 사건 2건에 대한 중요한 후속 확인 사항은 \"참고 기록\"으로 별도 기록한다.\n\n## 2. 이슈별 분석\n\n### [D20261027-copenhagen] 코펜하겐대학교(덴마크) 테스트 환경 해킹 — 학생·교직원 약 54만5천 명 정보 노출\n> 날짜: 발견·공개 정확한 날짜는 비공개(보도 기준 '지난 화요일' 발견, '금요일' 1차 공개, 그다음 날 추가 공개)·2026-10-26(BleepingComputer 보도) · 유형: 테스트 환경 무단 접근(초기 침투 경로 비공개) · 행위자: 미귀속 · 지역: 덴마크(해외) · 근거: 확인(코펜하겐대학교 공지, 보도)\n\n**쉽게 말하면**: 덴마크 코펜하겐대학교가 쓰던 \"테스트용\" 시스템에 공격자가 들어가, 학생·교직원 등 약 54만5천 명의 이름, 덴마크의 주민등록번호 성격인 CPR 번호, 전화번호, 이메일이 노출됐을 수 있다는 사실이 확인됐습니다. 이 중 약 2만 명은 건물 출입에 쓰는 PIN 코드까지 노출돼, 대학은 일부 건물 출입을 임시로 제한했습니다. 공격자가 애초에 어떻게 들어왔는지는 아직 공개되지 않았습니다.\n\n**먼저 할 일(초보용)**: 코펜하겐대학교 재학생·교직원이라면 대학의 공식 공지로 본인 정보가 포함됐는지 확인하고, 안내받은 대로 출입 PIN 코드를 새로 발급받으세요(아직 안내받지 못했다면 공식 채널로 직접 확인). 대학을 사칭해 개인정보나 비밀번호를 요구하는 메일·문자에는 응답하지 말고 공식 공지로만 확인하세요.\n\n**개요**: BleepingComputer(10/26) 보도에 따르면, 코펜하겐대학교는 자사의 한 \"테스트 환경\"(test environment)에 공격자가 접근했다고 확인했다. 이 환경에는 학생·교직원 등 약 52만5천 명의 개인정보(이름, CPR 번호, 전화번호, 이메일)가 들어 있었는데, 다음 날 대학은 추가로 약 2만 명의 출입용 PIN 코드도 노출됐을 가능성이 있다고 밝혔다. 보도는 두 수치를 더해 전체 영향 범위를 약 54만5천 명으로 밝혔으나, **두 집단이 서로 겹치는지는 보도에 명시되지 않았다.** 대학은 공격을 봉쇄하고 공격자의 접근을 차단했다고 밝혔으며, 평소 업무를 지원하는 핵심 시스템까지 공격자가 도달했거나 대학 운영이 중단된 흔적은 없다고 설명했다. 예방 조치로 일부 핵심 건물의 물리적 출입을 제한했고, 새 출입 코드를 배포하며 순차적으로 재개방하고 있다. 대학은 이 사건을 덴마크 개인정보보호청(Datatilsynet)에 신고했으며 GDPR 적용 대상이라고 밝혔다. **공격자가 테스트 환경에 처음 접근한 경로(초기 침투 방법)는 보도 시점까지 공개되지 않았다.** 공격자 귀속도 밝혀지지 않았다. PIN 코드가 노출됐다는 사실 자체는 \"노출된 PIN으로 무단 출입이 가능해졌다\"는 위험을 뜻하며, 실제 무단 출입이 일어났다는 증거는 보도에 없다.\n\n**왜 일어났나**\n- 직접 원인 [비공개]: 공격자가 테스트 환경에 접근한 구체적인 방법(취약점, 탈취한 인증정보 등)이 대학 공지·보도에서 밝혀지지 않았다.\n- 구조적 원인 [추정 — 확인된 사실이 아니라 일반적인 위험 가설]: (1) \"테스트 환경\"이라는 이름 때문에 실제 운영 시스템보다 접근 통제·모니터링 수준이 낮게 설정되는 경우가 흔히 있는데, 그런 환경에 실제 개인정보(또는 그에 준하는 데이터)가 그대로 들어 있다면 노출 시 피해가 운영 시스템 수준으로 커질 수 있다(이번 사건에서 실제로 그런 통제 격차가 있었는지는 공개되지 않았다) (2) 물리적 출입 PIN이 같은 개인정보와 함께 노출됐다는 사실은, IT 시스템 침해가 건물 출입 보안 문제로 번질 수 있음을 보여준다(이 사건에서 PIN이 테스트 환경과 같은 시스템·데이터베이스에 있었는지는 공개되지 않았다).\n\n**침투 경로 [비공개]**: 초기 침투 방법이 공개되지 않아 이 보고서는 매핑하지 않는다. 확인된 것은 \"테스트 환경\"이 공격 대상이 됐고, 그 안의 개인정보(및 일부 출입 PIN)가 노출됐다는 사실뿐이다.\n\n**어떻게 조치하나**\n- 즉시: (대학이 공개한 바로는 이미 수행) 공격자 접근 차단, 영향 범위 확정을 위한 내부 조사. (본 보고서의 권고) 로그 등 증거를 신속히 보존하고, 노출된 PIN은 폐기 후 전면 재발급하며(이미 진행 중이라고 밝힘) 해당 PIN으로 이뤄진 과거 출입 기록을 점검한다.\n- 단기: 영향받은 개인별 통지 완료, 피싱·사칭 시도 모니터링 안내.\n- 장기: 테스트·비운영 환경에 실제 개인정보를 두지 않도록 데이터 거버넌스(가명처리·마스킹 또는 합성 데이터 사용)를 정비하고, 테스트 환경에도 운영 환경과 동등한 접근 통제·로깅을 적용.\n- 탐지: 테스트·비운영 환경에 대한 비정상 접근은 운영 환경보다 모니터링 수준이 낮아 놓치기 쉬우므로, 테스트 환경도 동일한 이상 접근 탐지 체계에 포함.\n\n**교훈**: \"테스트 환경\"이라는 이름이 \"덜 중요한 데이터\"를 뜻하지는 않는다. 실제 개인정보가 들어가는 순간 그 환경은 운영 시스템과 같은 수준의 보호가 필요하다.\n\n### 참고 기록 — PHP2Shell, 패치 5일 만에 \"가장 신뢰할 만한\" 실제 악용(RCE) 확인 + 패치 없는 새 결함 추가 공개\n\n[D20261022-php2shell](2026-10-22.md) 사건(CVE-2026-109618·109619)에 중요한 후속 사실이 BleepingComputer(10/26)를 통해 확인됐다. Perplexity의 탐지·대응 리드 Adel Karimi가 허니팟(공격을 유인하기 위한 가짜 시스템) 데이터에서 Apache mod_php(PHP 8.4.26) 대상 실제 원격 코드 실행(RCE) 흔적을 발견했고, Expel의 위협 연구자 Marcus Hutchins는 이를 \"지금까지 본 PHP2Shell 실제 악용 중 가장 신뢰할 만한 확인\"이라고 평가했다. 공격자는 공개된 PoC의 오프셋을 활용해 약 800KiB 분량의 쿠키(메모리 일부)를 빼낸 뒤, 그 안에서 함수 주소를 추출해 후속 실행 명령에 사용한 것으로 분석됐다. **Karimi 본인은 이 확인이 공격에 유리한 \"단일 워커(single-worker)\" 구성에서 나온 것이라, 다른 서버 구성에서도 같은 성공률을 보장하지는 않는다고 밝혔다.** 아마존 위협 인텔리전스에 따르면 패치(10/21) 약 나흘 전부터 표적 공격이 시작됐다. CISA는 탐지용 SIGMA 규칙을 배포했는데, **본 보고서가 CISA KEV JSON 피드를 직접 확인한 결과 10/26 CVE-2026-109618·109619 두 건 모두 KEV(실제 악용 확인 취약점 목록)에 신규 등재된 것을 확인했다** — 미국 정부 차원에서도 실제 악용으로 공식 인정된 것이다. 아울러 PHP 보안팀은 아직 패치가 없는 새 RCE 결함(CVE-2026-115560, 특정 설정·애플리케이션 코드 조합에서만 영향)을 추가로 공개했으며, 패치 전까지 `session.upload_progress.enabled=0` 설정을 임시 완화책으로 권고했다. 기존 매핑(TA0001\\|T1190\\|확인)과 분류(A)는 그대로 유지한다. 이번에 확인된 메모리 노출(쿠키 800KiB)→함수 주소 추출 과정은 \"공개 웹 애플리케이션 악용(T1190)\"이라는 관찰 범위에서 벗어나지 않는다고 판단해 별도 기법을 추가하지 않았다. CVE-2026-115560은 아직 공격에 쓰였다는 사례나 구체적인 공격 행위가 보고되지 않아 이번 보고서에서는 매핑하지 않으며(패치 여부 자체가 매핑 기준은 아니다), 실제 악용이 확인되면 별도로 검토한다. 패치 전 완화책(`session.upload_progress.enabled=0`)은 §4 체크리스트에 별도로 담았다.\n\n### 참고 기록 — Node2Shell(Brotli 디코더 결함), .NET·Python까지 영향 확산 확인(CVE-2026-111497)\n\n[D20261024-node2shell](2026-10-24.md) 사건의 Brotli 디코더 버퍼 오버플로 결함이, 기존에 확인된 Node.js·Bun 외에 **.NET**과 **Python의 HTTP 클라이언트 라이브러리들(urllib3[brotli], requests, httpx, aiohttp[speedups] 등, Brotli 디코더를 설정해 쓰는 경우에 한정)**에도 영향을 준다는 사실이 보도(10/26)로 추가 확인됐다. 마이크로소프트는 영향받는 .NET 버전에 긴급 패치를 배포했고(보도에는 권한 상승 위험으로 설명됨), 보안업체 Imperva는 이 결함이 실제로 원격 코드 실행(RCE)까지 이어질 수 있다고 확인했다. **다만 실제 공격(ITW) 사례는 이번 보도 시점까지도 확인되지 않았다.** .NET에서 보도된 위험은 권한 상승이고 Node.js·Bun·Imperva가 확인한 원격 코드 실행(RCE)과는 성격이 다르며, Python 영향도 취약한 Brotli 디코더를 실제로 설정해 쓰는 경우에만 해당한다. 기존 매핑(TA0001\\|T1190\\|후보, 공개 HTTP 엔드포인트가 요청 본문을 자동 해제하는 경로에 한정 — 아웃바운드 `fetch()` 등 클라이언트 쪽 처리는 별개 메커니즘으로 매핑 범위에서 계속 제외)과 분류(A)는 영향 범위만 넓어진 것으로 보고 그대로 유지하며(실제 악용 증거가 늘지 않아 '후보' 등급은 유지), 별도 사건으로 분리하지 않는다. .NET·Python 사용 조직도 Node.js·Bun과 같은 긴급도로 패치 여부를 확인해야 한다.\n\n## 3. 국내 소식\n\n**국내 질의 결과**: 지침에 따라 ①금융권 ②통신·OTT·이커머스 ③공공·지자체·교육·의료 ④국내 랜섬웨어 ⑤정부 발표 ⑥기존 사건 규모 갱신, 총 6개 범주를 각각 검색했다(검색어에 \"2026년 10월\" 포함). ①금융권(검색어: \"2026년 10월 금융권 해킹 개인정보 유출 은행 카드 저축은행\")은 10/14 집계(16개사·약 10만 건, 555개사 긴급점검 중 130곳 미흡사항)보다 더 새로운 수치를 찾지 못했다 — 이미 [10-26 보고서](2026-10-26.md)까지 기록된 내용과 동일하다. ②통신·이커머스(검색어: \"2026년 10월 쿠팡 티빙 통신사 침해사고 개인정보 유출\")는 10월 신규 침해사고를 찾지 못했고, 결과는 모두 기존 티빙 사건(최종 집계 3,954만 계정·피해 1,953만 명)과 2025년 쿠팡 사건의 재인용이었다. ③공공·지자체·교육·의료(검색어: \"2026년 10월 공공기관 대학 의료기관 개인정보 유출 해킹\")는 10월 신규 사건을 찾지 못했고, 검색된 것은 모두 과거 사건(2026-01 해킹포럼 탈취, 2024년 전북대 사건, 2021년 서울대병원 사건 등)의 재인용이었다. ④국내 랜섬웨어(검색어: \"2026년 10월 국내 랜섬웨어 피해\")는 10월 신규 피해를 찾지 못했다 — 검색 결과는 4월 중소기업 대상 공격(경찰청·중기부·KISA 공동 발표)의 재인용과 해외 통계뿐이었다. ⑤정부 발표(검색어: \"과기정통부 KISA 개인정보보호위원회 금융위 금감원 2026년 10월 발표 제재\")는 10/24~27 구간의 신규 발표를 찾지 못했다. 10/13 국정감사 발언(개인정보보호위원회 송경희 위원장, 과징금 최대 10%)은 이미 [10-26 보고서](2026-10-26.md)에 기록돼 있으며, 추가로 금융위가 10/1 「신용정보업감독규정」 개정을 예고(신용정보법 위반에 대한 별도 과징금 산정기준 마련)한 사실을 확인했으나 이는 이번 금융권 침해사고에 대한 제재가 아니라 일반 제도 개편이라 `국내뉴스.psv`에 추가하지 않았다(사건과 직접 연결되지 않음). ⑥기존 사건 규모 갱신(검색어: \"금융권 해킹 16개사 10만건 추가 집계 10월 26일 27일\")은 10/14~15 보도 이후의 추가 갱신 기사를 찾지 못했다.\n\n오늘 조사에서는 사건으로 등록할 만큼 크고 새로운 국내 사건은 확인되지 않았다.\n\n## 4. 우선 대응 체크리스트\n\n1. **코펜하겐대학교 관계자(해외 참고)**: 안내받은 출입 PIN 재발급을 즉시 적용하고, 대학을 사칭한 메일·문자 주의.\n2. **PHP 운영 조직**: [D20261022-php2shell](2026-10-22.md) 패치(10/21 공개) 미적용 상태라면 최우선 적용 — 이제 CISA KEV에 정식 등재된 실제 악용 취약점이다. `session.upload_progress.enabled`를 쓰는 조직은 신규 미패치 결함(CVE-2026-115560) 대비로 `session.upload_progress.enabled=0` 설정 검토.\n3. **Node.js·Bun·.NET·Python(Brotli 압축 해제 사용) 조직**: [D20261024-node2shell](2026-10-24.md) 패치 적용 여부 재확인 — 오늘부로 .NET·Python 사용 조직도 대상에 포함된다.\n4. [10-17](2026-10-17.md)~[10-26](2026-10-26.md) 보고서의 Ivanti·Atlassian·Ahsay·PAN-OS·Cisco SEG·BeyondTrust·Fortinet·SiteGuard·Plex·Siemens·UpdraftCentral·eMudhra·Onamae·커넥트와이즈·Arista VCO·LiteLLM·GitLab·Collabora·HPE ArubaOS·Time4Popcorn — 기한이 지났거나 임박한 건이 많으므로 미조치 상태라면 우선 처리.\n\n## 5. 검증 수준과 한계\n\n- CISA KEV는 JSON 피드를 직접 받아 10/26 등재분(PHP2Shell 2건)을 확인했고 10/27 신규 등재는 없음을 확인했다(1차 출처, 피드가 매우 커 날짜순 최신 구간만 확인했다).\n- 코펜하겐대학교 사건은 BleepingComputer 기사(2차 보도) 1건만 WebFetch로 직접 열람해 확인했다. 대학의 공식 원문 공지는 직접 열람하지 못했으며, 정확한 발견·공개 날짜(요일만 보도됨)는 확인하지 못해 지어내지 않고 비공개로 표기했다. 초기 침투 경로가 공개되지 않아 ATT&CK 매핑은 하지 않았다(분류는 J·경위 미공개).\n- PHP2Shell 후속 확인은 BleepingComputer 기사 1건을 WebFetch로 직접 열람했고, CISA KEV 등재 사실은 JSON 피드를 직접 재확인했다. Perplexity·Expel의 원문 분석 게시물은 직접 열람하지 못했다.\n- Node2Shell(.NET·Python 영향 확산) 소식도 같은 BleepingComputer 기사 1건에서 함께 확인했으며, Microsoft·Imperva의 원문 공지는 직접 열람하지 못했다.\n- 국내 질의 6개 범주 모두 WebSearch만으로 수행했고(전문 매체 직접 열람은 이번 조사에서 하지 못함), 결과 없음이 \"사건이 실제로 없다\"는 뜻인지 \"아직 보도되지 않았다\"는 뜻인지는 구분할 수 없다.\n- 검토했으나 채택하지 않음: 호스팅업체 DreamHost가 File Manager 장애 이후 이메일·FTP/SFTP 비밀번호 전면 재설정을 강제한 사건(BleepingComputer, 10/26) — DreamHost는 이를 \"예방 조치\"라고만 밝혔고 실제 침해 여부·영향 범위를 확인·공개하지 않아, 사건으로 등록하기엔 근거가 아직 불충분하다고 판단했다.\n- 해외 랜섬웨어·대형 유출 일반 검색에서는 10월 24~27일 날짜로 명확히 특정되는 새로운 대형 사건을 추가로 찾지 못했다.\n\n## 출처\n\n- CISA KEV JSON 피드 (직접 확인)\n- BleepingComputer(직접 열람): 코펜하겐대학교 테스트 환경 침해, PHP2Shell 실제 악용 확인, Node2Shell(Brotli) .NET·Python 영향 확산, DreamHost 비밀번호 재설정(참고, 채택 안 함)\n- MITRE ATT&CK v19.2(저장소 기준, v20.0 공식 전환은 유지 확인됨, 재매핑 보류)\n"},{"path":"일일/2026-10-28.md","title":"일일 보안 이슈 분석 — 2026-10-28","md":"# 일일 보안 이슈 분석 — 2026-10-28\n\n> 수집 기준: 2026-10-28(오늘, 조사 진행 시각까지 공개분). 전날(10/27) 보고서까지 공백 없이 이어진다. CISA KEV는 JSON 피드를 직접 확인했으며 10/27 등재분(2건) 이후 10/28 신규 등재는 확인 시점까지 없었다(1차 출처). 해외 소식은 CISA 공식 경보와 SecurityWeek 기사를 WebFetch로 직접 열람해 확인했다. 국내 소식은 WebSearch로 6개 범주를 각각 확인했다(언론사 직접 열람은 이번 조사에서 하지 못함).\n> 근거 표기: **[확인]** 벤더·정부기관·연구자가 직접 확인 / 보도 언론 보도 / **[추정]** 본 보고서의 추정 / **[주장]** 공격자 일방 주장. **조치는 본 보고서의 권고**이며 벤더 공식 지침이 우선한다.\n> **ATT&CK 버전 점검**: attack.mitre.org 확인 결과 공식 버전은 여전히 **v20.0**이다(10/26~27 확인분과 동일, 추가 변경 없음). 이 저장소는 당분간 **v19.2 매핑을 유지**하며 임의로 대규모 재매핑하지 않는다.\n\n## 1. 오늘의 요약\n\n| # | 이슈 | CVE | 유형 | 상태 | 즉시 조치 |\n|---|------|-----|------|------|-----------|\n| 1 | Adobe Commerce·Magento \"PolyShell\" 파일 업로드 결함 — CISA KEV 등재, 953개 쇼핑몰 감염 캠페인 | CVE-2026-48356 | 공개 웹앱 파일 업로드 → 원격 코드 실행 | [확인] CISA KEV, Sansec 연구 | 최신 보안 패치(APSB26-73) 적용, 악성 코드 감염 여부 점검 |\n\n오늘은 CISA KEV에 신규 등재된 Adobe Commerce/Magento 결함 1건을 새 사건으로 기록한다. 또한 [D20261024-node2shell](2026-10-24.md) 사건의 Node.js/Bun Brotli 결함이 같은 날 CISA KEV에 함께 등재돼 \"실제 악용 미확인\" 상태에서 벗어났으나, ATT&CK 매핑은 아래 참고 기록에서 설명하는 이유로 근거 등급을 유지했다.\n\n## 2. 이슈별 분석\n\n### [D20261028-polyshell] Adobe Commerce·Magento \"PolyShell\" 파일 업로드 결함 — CISA KEV 등재, 953개 쇼핑몰 장기 감염 캠페인 확인(CVE-2026-48356)\n> 날짜: 공개 2026-07-14(Adobe APSB26-73) · 실제 악용 흔적 최소 2026-03~2026-10(Sansec 관측) · CISA KEV 등재 2026-10-27 · 유형: 공개 쇼핑몰 웹앱의 인증 없는 파일 업로드 → 원격 코드 실행 · 행위자: 미귀속(스키밍·광고 사기 추정 캠페인) · 지역: 전 세계(해외) · 근거: 확인(CISA KEV 공식 경보, Sansec 연구 보도 인용)\n\n**쉽게 말하면**: 온라인 쇼핑몰에 많이 쓰이는 Adobe Commerce·Magento라는 프로그램에 \"손님(비회원) 장바구니\" 기능을 통해 로그인 없이도 악성 파일을 서버에 올릴 수 있는 결함이 있었습니다. 이 결함은 올해 7월에 이미 패치가 나왔는데, 미국 정부(CISA)가 10월 27일 \"실제로 공격에 쓰이고 있다\"고 공식 확인해 위험 목록에 새로 올렸습니다. 보안업체 Sansec는 이 결함 등을 이용해 최소 7개월 넘게 전 세계 쇼핑몰 953곳에 악성 코드가 몰래 심어진 것을 확인했습니다. 심어진 악성 코드가 정확히 무엇을 훔치는지(카드 정보인지 다른 것인지)는 아직 확인되지 않았습니다.\n\n**먼저 할 일(초보용)**: Adobe Commerce·Magento 쇼핑몰을 운영한다면 최신 보안 패치(APSB26-73, 7월 공개분 포함 이후 모든 패치)가 적용됐는지 바로 확인하고, 이미 공격받았을 가능성에 대비해 관리자 계정 목록과 사이트에 심어진 수상한 스크립트를 함께 점검하세요. 패치만 하고 이미 침투한 흔적(불법 관리자 계정, 숨겨진 스크립트)을 치우지 않으면 패치 후에도 공격자가 남아 있을 수 있습니다.\n\n**개요**: CISA는 2026-10-27 공식 경보에서 CVE-2026-48356(Adobe Commerce·Magento 파일 업로드 결함)을 \"실제 악용 증거\"를 근거로 KEV(실제 악용 확인 취약점 목록)에 신규 등재했다고 밝혔다. CISA·Adobe의 취약점 설명은 \"허용되지 않아야 할 종류의 파일을 서버에 무제한 업로드할 수 있고, 업로드된 파일이 (업로드를 수행한) 사용자 권한 맥락에서 실행돼 코드 실행으로 이어질 수 있다\"는 것이다. 일부 2차 보도는 이 결함이 로그인하지 않은 방문자도 쓰는 \"손님 장바구니\" REST API를 통해 악용된다고 설명하지만, **이 구체적 메커니즘은 이번 조사에서 Adobe 공식 문서를 직접 열람해 재확인하지는 못했다.** 심각도 점수도 출처마다 9.3~9.6으로 다르게 보도돼, 이 보고서는 특정 수치를 단정하지 않는다. Adobe는 지난 7월 14일 보안 공지(APSB26-73)로 패치를 냈으며 당시에는 \"실제 악용 사례를 알지 못한다\"고 밝혔다. 그러나 보안업체 Sansec는 별도 조사에서, 2025년 7월부터 이어져 온 장기 악성 코드 캠페인을 확인했고, 이 중 **최소 471곳은 올해 3월에 이 결함(PolyShell)을 통해** 악성 로더가 심어진 것으로 보도됐다. 같은 캠페인이 이후에도 PolyShell 외에 다른 결함(SessionReaper 등)과 도메인을 바꿔가며 계속 운영돼, 10월 현재까지 캠페인 전체 누적 감염 쇼핑몰은 953곳으로 집계됐다(SecurityWeek가 Sansec 연구를 인용) — **즉 953곳 전부가 이번 CVE 하나로 뚫렸다는 뜻은 아니며, 확인된 것은 그중 최소 471곳의 3월 감염 경로다.** 1차 출처(Adobe)가 패치를 낸 시점(7월)과 CISA가 공식적으로 \"악용 확인\"으로 분류한 시점(10월) 사이에는 상당한 간극이 있다. 심어진 악성 코드는 방문자를 가려 진짜 사람에게만 작동하도록 설계돼 보안 연구자의 탐지를 피하려 했고, 과거 버전
