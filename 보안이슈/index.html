*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.65 system-ui,-apple-system,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
.side{background:var(--panel);border-right:1px solid var(--border);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-weight:700;font-size:16px;padding:4px 10px 14px}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.nav a{display:block;padding:8px 10px;border-radius:8px;color:var(--text);margin-bottom:2px}
.nav a:hover{background:var(--mute-soft);text-decoration:none}
.nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.main{min-width:0}
.top{display:flex;gap:10px;align-items:center;padding:12px 24px;border-bottom:1px solid var(--border);background:var(--panel);position:sticky;top:0;z-index:5}
.top input{flex:1;max-width:560px;padding:9px 12px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text)}
.btn{border:1px solid var(--border);background:var(--panel);border-radius:8px;padding:7px 12px}
.btn:hover{background:var(--mute-soft)}
#view{padding:24px;max-width:1400px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:18px;margin:26px 0 10px}h3{font-size:16px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 18px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:28px;line-height:1.2}.stat span{color:var(--muted);font-size:13px}
.bar{display:grid;grid-template-columns:190px 1fr 34px;gap:8px;align-items:center;font-size:13px;margin:5px 0}
.bar i{display:block;height:10px;background:var(--accent);border-radius:5px;min-width:3px}
.bar span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;border:1px solid transparent;white-space:nowrap}
.tag.ok{background:var(--ok-soft);color:var(--ok)}.tag.warn{background:var(--warn-soft);color:var(--warn)}.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.info{background:var(--info-soft);color:var(--info)}.tag.mute{background:var(--mute-soft);color:var(--mute)}
.chip{display:inline-block;font:12px/1.5 ui-monospace,Consolas,monospace;padding:0 7px;border-radius:6px;background:var(--accent-soft);color:var(--accent);margin:2px 4px 2px 0}
.chip:hover{text-decoration:none;filter:brightness(.95)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px;align-items:center}
.filters select{padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--panel);color:var(--text)}
.pill{border:1px solid var(--border);background:var(--panel);border-radius:999px;padding:4px 12px;font-size:13px}
.pill.on{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.list{display:grid;gap:10px}
.inc{display:block;color:inherit;cursor:pointer}.inc:hover{border-color:var(--accent);text-decoration:none}
.inc .d{font:12px ui-monospace,Consolas,monospace;color:var(--muted)}
.inc .m{color:var(--muted);font-size:13px;margin:2px 0 4px}
.back{display:inline-block;margin-bottom:12px}
.metas{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 16px}.metas .tag{white-space:normal}
.sec{border-left:4px solid var(--border);background:var(--panel);border-radius:0 10px 10px 0;padding:6px 16px;margin:10px 0}
.sec p,.sec ul{margin:6px 0}
.s-why{border-left-color:var(--warn)}.s-path{border-left-color:var(--bad)}.s-fix{border-left-color:var(--ok)}.s-less{border-left-color:var(--info)}.s-over{border-left-color:var(--accent)}

.doc table,.sec table{border-collapse:collapse;display:block;overflow-x:auto;max-width:100%;margin:10px 0}
.doc th,.doc td,.sec th,.sec td{border:1px solid var(--border);padding:6px 10px;vertical-align:top;text-align:left;font-size:14px}
.doc th,.sec th{background:var(--mute-soft)}
code{font:13px ui-monospace,Consolas,monospace;background:var(--mute-soft);padding:1px 5px;border-radius:5px}
pre{background:var(--mute-soft);padding:12px;border-radius:8px;overflow:auto}pre code{background:none;padding:0}
hr{border:0;border-top:1px solid var(--border);margin:20px 0}

.col h3{position:sticky;top:0;background:var(--bg);padding:6px 4px;font-size:13px;line-height:1.3;margin:0}

040","id":"T1531","name":"Account Access Removal"},{"ta":"TA0040","id":"T1485","name":"Data Destruction"},{"ta":"TA0040","id":"T1486","name":"Data Encrypted for Impact"},{"ta":"TA0040","id":"T1565","name":"Data Manipulation"},{"ta":"TA0040","id":"T1491","name":"Defacement"},{"ta":"TA0040","id":"T1561","name":"Disk Wipe"},{"ta":"TA0040","id":"T1667","name":"Email Bombing"},{"ta":"TA0040","id":"T1499","name":"Endpoint Denial of Service"},{"ta":"TA0040","id":"T1657","name":"Financial Theft"},{"ta":"TA0040","id":"T1495","name":"Firmware Corruption"},{"ta":"TA0040","id":"T1490","name":"Inhibit System Recovery"},{"ta":"TA0040","id":"T1498","name":"Network Denial of Service"},{"ta":"TA0040","id":"T1496","name":"Resource Hijacking"},{"ta":"TA0040","id":"T1489","name":"Service Stop"},{"ta":"TA0040","id":"T1529","name":"System Shutdown/Reboot"}],"incidents":[{"id":"INC-2023-10-okta","title":"Okta 고객지원 시스템 침해","file":"과거3년/2023-Q4.md","date":"2023-10-20","type":"서드파티·신원(IdP)","actor":"미귀속","region":"글로벌","evidence":"확인","easy":"로그인 서비스 회사(Okta)의 고객지원 창구에 올라온 '문제 해결용 파일' 안에 로그인 상태 정보가 들어 있었고, 공격자가 이를 훔쳐 다른 회사 시스템에 몰래 들어갔습니다. 비밀번호가 아니라 '이미 로그인했다는 표시'를 훔친 사건입니다.","todo":"지원팀의 공식 민감정보 제거 절차를 따라 파일에서 로그인 정보(쿠키·토큰)를 지우고, 남지 않았는지 확인한 뒤 보내세요. 유출이 의심되면 로그인 세션을 모두 끊습니다.","cls":["C","B"],"s":495,"e":1858},{"id":"INC-2023-10-citrixbleed","title":"Citrix Bleed (CVE-2023-4966) 대량 악용","file":"과거3년/2023-Q4.md","date":"2023-10-10","type":"엣지 장비 취약점","actor":"LockBit 계열 제휴자 외","region":"글로벌","evidence":"확인","easy":"회사 원격 접속 장비(Citrix)의 결함 때문에 '이미 로그인한 사람의 증표'가 밖으로 새어 나왔고, 공격자는 그 증표로 비밀번호와 2단계 인증 없이 들어왔습니다.","todo":"장비를 업데이트한 뒤 접속 중인 세션을 모두 끊고 비밀번호도 바꾸세요. 업데이트만으로는 이미 훔친 증표가 남습니다.","cls":["A"],"s":2002,"e":3174},{"id":"INC-2024-01-ivanti","title":"Ivanti Connect Secure 제로데이 (CVE-2023-46805 + CVE-2024-21887)","file":"과거3년/2024.md","date":"2024-01-10","type":"엣지 장비 취약점","actor":"UNC5221(중국 연계 의심)","region":"글로벌","evidence":"확인","easy":"회사 VPN 장비(Ivanti)의 결함 두 개를 이어 붙이면 로그인 없이 장비를 조종할 수 있었고, 실제로 많은 장비가 공격당했습니다.","todo":"제조사의 임시 조치와 업데이트를 적용하고, 의심되면 장비를 초기화한 뒤 그 장비에 저장된 비밀번호를 모두 바꾸세요.","cls":["A"],"s":278,"e":1312},{"id":"INC-2024-01-midnight","title":"Microsoft 사내 메일 침해 (Midnight Blizzard)","file":"과거3년/2024.md","date":"2024-01-19","type":"신원·클라우드","actor":"Midnight Blizzard(러시아 국가 지원, Microsoft 귀속)","region":"글로벌","evidence":"확인","easy":"마이크로소프트가 잊고 있던 '테스트용 계정'에 2단계 인증이 꺼져 있었고, 공격자가 흔한 비밀번호를 여러 계정에 시도하는 방식(비밀번호 추측 공격)으로 들어온 뒤 거기서 핵심 계정으로 번져 임원 메일을 읽었습니다.","todo":"테스트·옛 계정에도 2단계 인증을 켜고, 쓰지 않는 앱과 계정을 정리하세요.","cls":["B"],"s":1481,"e":2464},{"id":"INC-2024-02-changehc","title":"Change Healthcare 랜섬웨어 (ALPHV/BlackCat)","file":"과거3년/2024.md","date":"2024-02-21","type":"신원·랜섬웨어","actor":"ALPHV/BlackCat","region":"미국","evidence":"확인","easy":"미국 의료비 청구 회사의 원격 접속 화면에 2단계 인증이 없었습니다. 훔친 비밀번호 하나로 들어와 9일 뒤 랜섬웨어로 서비스를 멈췄고, 병원과 약국의 업무가 마비됐습니다.","todo":"회사 바깥에서 들어오는 모든 로그인에 2단계 인증을 켜세요.","cls":["B","F"],"s":2605,"e":3573},{"id":"INC-2024-03-xz","title":"XZ Utils 백도어 (CVE-2024-3094)","file":"과거3년/2024.md","date":"2024-03-29","type":"공급망(오픈소스)","actor":"가명 \"Jia Tan\"(미귀속)","region":"글로벌","evidence":"확인","easy":"리눅스에 널리 쓰이는 압축 프로그램에 누군가 2년에 걸쳐 신뢰를 쌓은 뒤 몰래 '뒷문'을 심었습니다. 한 개발자가 속도 이상을 눈치채서 큰 피해는 막았습니다.","todo":"영향 버전(5.6.0·5.6.1)을 쓰는지 확인하고 안전한 버전으로 바꾸세요.","cls":["C"],"s":3703,"e":4813},{"id":"INC-2024-04-panos","title":"Palo Alto PAN-OS GlobalProtect 제로데이 (CVE-2024-3400)","file":"과거3년/2024.md","date":"2024-04-12","type":"엣지 장비 취약점","actor":"UTA0218","region":"글로벌","evidence":"확인","easy":"회사 방화벽·VPN 장비(Palo Alto)의 입력 처리 결함 때문에 로그인 없이 관리자 권한으로 명령을 실행할 수 있었습니다.","todo":"업데이트와 제조사 지침을 적용하고, 장비 안에 저장된 비밀번호를 바꾸세요.","cls":["A"],"s":4959,"e":5964},{"id":"INC-2024-05-snowflake","title":"Snowflake 고객 계정 대량 침해 (UNC5537)","file":"과거3년/2024.md","date":"2024-05","type":"신원·클라우드","actor":"UNC5537","region":"글로벌","evidence":"확인","easy":"클라우드 데이터 서비스(Snowflake) 자체가 뚫린 것이 아니라, 정보 탈취 악성코드 등으로 고객 쪽 직원·외주 PC 등에서 비밀번호가 유출됐습니다. 2단계 인증이 없던 계정들이 그대로 로그인당했습니다.","todo":"모든 클라우드 계정에 2단계 인증을 켜고, 오래된 비밀번호를 바꾸세요. 감염이 의심되는 PC는 격리한 뒤 안전한 기기에서 바꿔야 새 비밀번호도 털리지 않습니다.","cls":["B"],"s":6089,"e":7251},{"id":"INC-2024-05-court-kr","title":"한국 법원 전산망 해킹 (Lazarus)","file":"과거3년/2024.md","date":"2024-05-10","type":"국가 지원 APT·정보 탈취","actor":"Lazarus(북한)","region":"한국","evidence":"보도","easy":"북한 해킹 조직이 한국 법원 전산망에 2년 넘게 머물며 1,014GB를 외부로 보냈습니다. 어떤 자료인지 확인된 것은 일부뿐입니다.","todo":"로그를 오래 보관하고, 서버에서 밖으로 나가는 큰 데이터 전송을 감시하세요.","cls":["E"],"s":7380,"e":8326},{"id":"INC-2024-10-salttyphoon","title":"Salt Typhoon 통신사 침해","file":"과거3년/2024.md","date":"2024-10","type":"국가 지원 APT·통신","actor":"Salt Typhoon(중국 MSS 연계)","region":"글로벌","evidence":"확인","easy":"중국 연계 조직이 통신사 장비의 '이미 알려졌지만 고치지 않은 결함'을 주로 이용해 들어가 통화 기록과 위치 정보를 오랫동안 엿봤습니다.","todo":"네트워크·통신 장비도 알려진 결함은 바로 고치고, 장비 관리용 접속 경로를 따로 분리하세요.","cls":["A","E"],"s":8462,"e":9727},{"id":"INC-2024-12-cleo","title":"Cleo 파일 전송 제품 대량 악용 (Cl0p)","file":"과거3년/2024.md","date":"2024-12-03","type":"엣지·MFT 취약점","actor":"Cl0p","region":"글로벌","evidence":"확인","easy":"기업이 큰 파일을 주고받을 때 쓰는 소프트웨어(Cleo)의 결함으로 Cl0p 조직이 많은 회사의 파일을 한꺼번에 훔쳤습니다. 한 번 업데이트한 뒤에도 다시 뚫렸습니다.","todo":"당시 기준 수정 버전은 5.8.0.24 이상이며, 지금은 제조사의 최신 보안 버전을 확인해 올리고 인터넷에서 바로 접속되지 않게 막으세요.","cls":["A"],"s":9845,"e":10958},{"id":"INC-2024-12-treasury","title":"미 재무부 침해 (BeyondTrust, Silk Typhoon)","file":"과거3년/2024.md","date":"2024-12-02","type":"서드파티·원격 지원 SaaS","actor":"Silk Typhoon(중국 국가 지원)","region":"미국","evidence":"확인","easy":"원격 지원 서비스(BeyondTrust)의 열쇠(API 키)가 털려, 그 열쇠로 미국 재무부 컴퓨터에 원격 접속했습니다.","todo":"원격 지원 도구의 접근 범위를 줄이고, 비밀 키를 정기적으로 바꾸세요.","cls":["C"],"s":11112,"e":12051},{"id":"INC-2025-02-bybit","title":"Bybit 약 15억 달러 탈취 (Lazarus)","file":"과거3년/2025.md","date":"2025-02-21","type":"서드파티·암호화폐","actor":"Lazarus(북한, FBI 확인)","region":"글로벌","evidence":"확인","easy":"암호화폐 거래소의 큰 이체를 승인하는 사람들이 정상으로 보이는 화면을 보고 승인했는데, 실제로는 공격자가 자산을 빼낼 수 있게 만든 조작된 거래였습니다(약 15억 달러).","todo":"큰 이체는 승인 화면과 다른 경로로 거래 내용을 한 번 더 확인하세요.","cls":["C"],"s":246,"e":1163},{"id":"INC-2025-03-tjactions","title":"tj-actions/changed-files 공급망 공격 (CVE-2025-30066)","file":"과거3년/2025.md","date":"2025-03-14","type":"공급망(CI/CD)","actor":"미귀속","region":"글로벌","evidence":"확인","easy":"개발자들이 많이 쓰는 자동화 도구(GitHub Action)가 오염돼, 이를 쓰는 프로젝트의 비밀번호·키가 작업 기록에 드러났습니다.","todo":"영향 기간에 쓴 비밀값을 모두 바꾸고, 외부 도구는 이름표(버전)가 아니라 고정된 코드 번호(SHA)로 지정하세요.","cls":["C"],"s":1307,"e":2305},{"id":"INC-2025-04-skt","title":"SK텔레콤 USIM 정보 유출","file":"과거3년/2025.md","date":"2025-04-22","type":"국가 규모 개인정보·통신","actor":"미귀속","region":"한국","evidence":"확인","easy":"SK텔레콤 핵심 서버에 악성코드가 약 4년 동안 숨어 있었고, 가입자 인증 관련 정보(USIM 인증에 쓰이는 정보)가 유출됐습니다. 관리 계정이 암호화 없이 서버에 적혀 있었던 것이 출발점이었다고 정부가 밝혔습니다.","todo":"일반 사용자는 통신사 안내에 따라 유심 보호 서비스를 이용하세요. 서버 담당자는 관리 계정을 안전한 비밀 보관소로 옮기고 숨은 악성코드(BPFDoor)를 점검하세요.","cls":["E","H"],"s":2413,"e":3657},{"id":"INC-2025-04-mns","title":"Marks & Spencer 랜섬웨어 (Scattered Spider · DragonForce 보도)","file":"과거3년/2025.md","date":"2025-04-24","type":"사회공학·랜섬웨어","actor":"Scattered Spider(DragonForce 랜섬웨어 사용)","region":"영국","evidence":"보도","easy":"영국 유통업체 M&S가 공격 조직에 들어와 서버가 암호화됐고, 결제와 온라인 주문이 오랫동안 멈췄습니다. 초기 침투 방법은 공식 확인되지 않았고, 전화로 직원을 속이는 수법을 쓰는 조직으로 알려져 있습니다.","todo":"지원 창구가 비밀번호·2단계 인증을 재설정해 줄 때는, 요청자가 알려 준 번호가 아니라 미리 등록된 연락처로 확인하고 관리자 승인을 거치게 하세요.","cls":["D","F","E"],"s":3835,"e":4987},{"id":"INC-2025-06-yes24","title":"예스24 랜섬웨어","file":"과거3년/2025.md","date":"2025-06-09","type":"랜섬웨어","actor":"미귀속","region":"한국","evidence":"보도","easy":"예스24가 랜섬웨어(파일을 암호화하고 돈을 요구하는 악성코드)에 걸려 5일 동안 서비스가 멈췄습니다. 백업이 부족해 복구가 오래 걸렸다고 알려졌습니다.","todo":"인터넷과 분리된 백업을 만들고, 실제로 복구해 보는 훈련을 하세요.","cls":["F"],"s":5081,"e":5741},{"id":"INC-2025-07-sgi","title":"SGI서울보증 랜섬웨어","file":"과거3년/2025.md","date":"2025-07-14","type":"랜섬웨어·원격 접속","actor":"Qilin 지목(보도)","region":"한국","evidence":"보도","easy":"SGI서울보증은 VPN 로그인에 비밀번호를 계속 바꿔 넣는 공격을 당했고, 백업까지 함께 암호화돼 모든 업무가 멈췄다고 보도됐습니다.","todo":"원격 접속에 2단계 인증과 로그인 실패 횟수 제한을 걸고, 백업은 업무 네트워크와 분리해 두세요.","cls":["B","F"],"s":5851,"e":6644},{"id":"INC-2025-07-toolshell","title":"SharePoint ToolShell (CVE-2025-53770)","file":"과거3년/2025.md","date":"2025-07-18","type":"엣지·서버 취약점","actor":"Linen Typhoon·Violet Typhoon·Storm-2603(중국 연계)","region":"글로벌","evidence":"확인","easy":"회사에 직접 설치해 쓰는 SharePoint 서버의 결함으로 로그인 없이 서버를 장악할 수 있었습니다. 업데이트한 뒤에도 훔친 '서버 암호 키'가 남아 있으면 계속 악용될 수 있었습니다.","todo":"업데이트와 함께 서버의 암호 키(MachineKey)를 교체하고, 서버가 인터넷에 직접 열려 있지 않은지 점검하세요.","cls":["A"],"s":6819,"e":7784},{"id":"INC-2025-08-salesloft","title":"Salesloft Drift OAuth 토큰 탈취 → Salesforce 데이터 유출","file":"과거3년/2025.md","date":"2025-08-08","type":"서드파티·SaaS 연동","actor":"UNC6395(ShinyHunters 연계 보도)","region":"글로벌","evidence":"확인","easy":"영업 도구(Salesloft Drift)의 '연결 열쇠(토큰)'가 털려, 이 도구와 연결된 수백 개 회사의 고객 데이터(Salesforce)가 빠져나갔습니다. 문의 기록에 붙여넣은 비밀번호·키는 2차 피해로 이어질 수 있었습니다.","todo":"연결된 외부 앱의 권한을 점검하고 유출된 연결 토큰은 폐기·재발급하세요. 문의 기록에 비밀번호를 붙여넣지 않도록 하세요(비밀번호만 바꿔서는 이미 발급된 토큰이 사라지지 않습니다).","cls":["C"],"s":7953,"e":9242},{"id":"INC-2025-08-jlr","title":"Jaguar Land Rover 가동 중단","file":"과거3년/2025.md","date":"2025-08-31","type":"랜섬웨어 추정·제조","actor":"\"Scattered Lapsus$ Hunters\" 주장(NYT는 러시아 연계 보도)","region":"영국","evidence":"보도","easy":"재규어 랜드로버가 사이버 공격을 받아 세계 공장이 약 5주 멈췄습니다. 어떻게 들어왔는지는 아직 확인되지 않았습니다.","todo":"공장 생산망과 사무망을 분리하고, 컴퓨터 없이도 돌아가는 비상 운영 절차를 만들어 훈련하세요.","cls":["F"],"s":9397,"e":10177},{"id":"INC-2025-08-kt","title":"KT 무단 소액결제 (불법 초소형 기지국)","file":"과거3년/2025.md","date":"2025-08","type":"통신망·인증","actor":"미귀속(40대 중국 교포 용의자 체포 보도)","region":"한국","evidence":"확인","easy":"가짜 초소형 기지국으로 KT 이용자의 문자·인증번호를 가로채 소액결제를 했습니다. KT에 납품된 이 장비들이 모두 같은 인증서를 쓰고 있었던 점이 약점이었습니다.","todo":"일반 사용자는 통신사 안내에 따라 결제 한도를 조정하세요. 통신사는 장비마다 다른 인증서를 쓰게 바꿔야 합니다.","cls":["H"],"s":10302,"e":11283},{"id":"INC-2025-08-lottecard","title":"롯데카드 개인정보 유출 (WebLogic 미패치)","file":"과거3년/2025.md","date":"2025-08-26","type":"엣지·서버 취약점·금융","actor":"미귀속","region":"한국","evidence":"보도","easy":"이미 2017년에 고쳐진 서버 결함(WebLogic)이 고쳐지지 않은 채 남아 있다가 악용돼 고객 정보가 유출됐다는 보도입니다.","todo":"인터넷에 열린 서버 목록을 만들어 실제 공격에 쓰이는 결함과 외부에 노출된 시스템부터 패치하세요. CVV는 결제 승인 뒤 저장하지 말고, 카드번호는 꼭 필요한 경우에만 보호해서 저장하세요.","cls":["A"],"s":11407,"e":12445},{"id":"INC-2025-09-shaihulud","title":"Shai-Hulud npm 웜","file":"과거3년/2025.md","date":"2025-09-15","type":"공급망(오픈소스)","actor":"미귀속","region":"글로벌","evidence":"확인","easy":"개발자가 설치하는 npm 패키지에 '스스로 퍼지는' 악성코드가 들어 있어, 개발자 PC의 키를 훔치고 그 키로 다른 패키지까지 오염시켰습니다.","todo":"영향 패키지를 쓰는지 확인하고, 감염이 의심되는 PC는 격리한 뒤 안전한 기기에서 개발·배포용 토큰을 모두 바꾸세요.","cls":["C"],"s":12556,"e":13571},{"id":"INC-2025-10-f5","title":"F5 BIG-IP 개발 환경 침해","file":"과거3년/2025.md","date":"2025-10-15","type":"공급망·국가 지원 APT","actor":"UNC5221(중국 연계, BRICKSTORM 백도어)","region":"글로벌","evidence":"확인","easy":"네트워크 장비 회사 F5의 개발 환경에 중국 연계 조직이 1년 넘게 숨어 소스 코드와 아직 공개되지 않은 취약점 정보를 가져갔습니다.","todo":"F5 장비를 쓴다면 최신 패치를 먼저 적용하고, 관리 화면을 인터넷에서 닫으세요.","cls":["C","E"],"s":13708,"e":14599},{"id":"INC-2025-10-oracleebs","title":"Oracle E-Business Suite 제로데이 (Cl0p)","file":"과거3년/2025.md","date":"2025-07","type":"엣지·ERP 취약점","actor":"Cl0p(2번째 CVE PoC는 ShinyHunters 관련 보도)","region":"글로벌","evidence":"확인","easy":"기업 업무 시스템(Oracle EBS)의 결함을 Cl0p 조직이 먼저 알고 악용해 여러 대학과 기업의 데이터를 훔친 뒤 협박했습니다.","todo":"패치를 적용하고, 인터넷에서 바로 접속되지 않게 막으세요.","cls":["A"],"s":14761,"e":15548},{"id":"INC-2025-11-coupang","title":"쿠팡 3,370만 계정 개인정보 유출","file":"과거3년/2025.md","date":"2025-11","type":"내부자·인증키 관리","actor":"전 직원(퇴사자)","region":"한국","evidence":"확인","easy":"쿠팡의 인증 업무를 맡았던 전 직원이 퇴사 후에도 가지고 있던 '서명 키'로 시스템에 접속해 3,367만 계정의 정보를 조회했다고 정부 조사 결과가 나왔습니다.","todo":"퇴사할 때 키와 계정을 회수하고, 서명 키는 개발자 PC가 아닌 전용 보관소에서만 관리하며 정기적으로 바꾸세요. 키를 바꿀 때는 이미 발급된 토큰도 무효화해야 합니다.","cls":["B","H"],"s":15664,"e":16693},{"id":"INC-2025-12-react2shell","title":"React2Shell (CVE-2025-55182)","file":"과거3년/2025.md","date":"2025-12-03","type":"프레임워크 취약점","actor":"다수(중국 연계 그룹이 수 시간 내 악용, Amazon 보고)","region":"글로벌","evidence":"확인","easy":"웹사이트를 만드는 도구(React·Next.js)의 결함으로 로그인 없이 서버에서 명령을 실행할 수 있었고, 공개 직후부터 공격이 시작됐습니다.","todo":"영향 버전을 최신 보안 버전으로 올리세요.","cls":["A"],"s":16849,"e":17720},{"id":"INC-2026-01-shinyhunters","title":"ShinyHunters SSO 보이스 피싱(vishing) 캠페인","file":"과거3년/2026.md","date":"2026-01","type":"사회공학·신원","actor":"ShinyHunters","region":"글로벌","evidence":"보도","easy":"공격자가 'IT 지원팀'이라며 직원에게 전화해 가짜 로그인 페이지에 비밀번호와 인증 코드를 입력하게 만들었고, 그렇게 들어가 회사 데이터를 가져갔다고 보도됐습니다.","todo":"인증 코드나 승인 알림 대신 보안키·패스키(속아도 인증되지 않는 방식)를 쓰고, 'IT는 전화로 코드를 묻지 않는다'고 모두에게 알리세요.","cls":["D","B"],"s":334,"e":1496},{"id":"INC-2026-01-kyowon","title":"교원그룹 랜섬웨어","file":"과거3년/2026.md","date":"2026-01-10","type":"랜섬웨어·웹셸","actor":"미확인","region":"한국","evidence":"보도","easy":"교원그룹이 랜섬웨어에 걸려 가상 서버 약 600대가 영향을 받았고 여러 서비스에 장애가 났습니다. 웹서버에 숨은 악성 파일(웹셸)이 사용됐다는 보도가 있으나 최초 침투 방법은 확인되지 않았습니다.","todo":"웹서버에 숨은 악성 파일이 없는지 점검하고, 백업은 업무 네트워크와 분리해 두세요.","cls":["F"],"s":1594,"e":2462},{"id":"INC-2026-03-stryker","title":"Stryker 와이퍼 공격 (Handala)","file":"과거3년/2026.md","date":"2026-03-11","type":"파괴 공격·클라우드 관리","actor":"Handala(이란 정보부 MOIS 연계, 미 법무부 귀속 보도)","region":"글로벌","evidence":"보도","easy":"의료기기 기업 Stryker에서 공격자가 관리자 계정을 훔친 뒤, 기기 관리 도구(Intune)의 '원격 초기화' 기능으로 직원 기기를 대량으로 지웠습니다. 별도 악성코드 없이 정상 기능이 무기가 됐습니다.","todo":"관리자 계정에 강한 2단계 인증을 걸고, 대량 삭제는 여러 관리자의 승인이 있어야 실행되게 하세요.","cls":["G","B"],"s":2616,"e":3730},{"id":"INC-2026-03-teampcp","title":"TeamPCP 보안·개발 도구 공급망 연쇄 (Trivy → Checkmarx → Bitwarden CLI)","file":"과거3년/2026.md","date":"2026-03-16","type":"공급망(CI/CD)","actor":"TeamPCP","region":"글로벌","evidence":"확인","easy":"보안 점검 도구 Trivy를 시작으로 Checkmarx, Bitwarden CLI까지 개발 도구가 연달아 오염돼 개발자·CI의 비밀 키가 털렸습니다.","todo":"영향 기간에 쓴 키를 모두 바꾸되 감염이 의심되는 환경은 격리한 뒤 안전한 기기에서 바꾸고, '옛 키가 완전히 무효가 됐는지'까지 확인하세요.","cls":["C"],"s":3887,"e":5081},{"id":"INC-2026-04-fbi","title":"FBI 감시 시스템 침해 (\"major incident\" 지정)","file":"과거3년/2026.md","date":"2026-04-02","type":"국가 지원 APT·서드파티","actor":"중국 연계 의심(Salt Typhoon 지목 보도, 확정 아님)","region":"미국","evidence":"보도","easy":"FBI는 감시 시스템이 인터넷 업체의 연동 구간을 통해 침해됐다고 의회에 알렸습니다. 중국 연계 의심 보도가 있지만 확정은 아닙니다.","todo":"외부 업체와 연결된 구간의 로그인·접속 기록을 점검하세요.","cls":["C"],"s":5241,"e":6059},{"id":"INC-2026-05-tving","title":"티빙(TVING) 가입자 3,954만 계정 유출","file":"과거3년/2026.md","date":"2026-05-30","type":"키 관리·개인정보","actor":"미귀속","region":"한국","evidence":"확인","easy":"티빙 개발자의 '접속키'가 털려, 해커가 개발 환경과 운영 시스템으로 차례로 들어갔고, 휴면·탈퇴 계정을 포함한 3,954만 계정의 정보가 유출됐다고 정부가 발표했습니다(2026-09-03).","todo":"티빙 이용자는 같은 비밀번호를 쓰는 다른 서비스의 비밀번호도 바꾸고 2단계 인증을 켜세요. 담당자는 개발자 접속키를 코드나 개발 PC에 두지 말고 전용 보관소에서 관리하며 정기적으로 바꾸세요.","cls":["B","H","E"],"s":6175,"e":7993},{"id":"D20261003-fortimail","title":"FortiMail CVE-2026-104286","file":"일일/2026-10-03.md","date":"2026-10-01","type":"엣지 장비 취약점","actor":"미귀속","region":"글로벌","evidence":"확인","easy":"메일 보안 장비(FortiMail)에 로그인 없이 파일을 써 넣을 수 있는 결함이 있고, 실제로 공격에 쓰이고 있습니다.","todo":"제조사의 임시 조치(IBE 끄기, 관리 화면을 인터넷에서 닫기)를 적용하고, 수정 버전이 나왔는지 확인하세요.","cls":["A"],"s":1633,"e":3173},{"id":"D20261003-citrix","title":"Citrix NetScaler CVE-2026-88771 / -88772","file":"일일/2026-10-03.md","date":"2026-09-27","type":"엣지 장비 취약점","actor":"미귀속","region":"글로벌","evidence":"확인","easy":"회사 원격 접속 장비(NetScaler)의 결함 두 개가 이미 공격에 쓰이고 있습니다. 공개되기 3주 전부터 악용됐다는 관측이 있습니다.","todo":"패치 직전에 가능한 범위에서 로그와 설정을 신속히 보존하고(조사는 병행) 지체 없이 패치한 뒤, 접속 중인 세션을 모두 끊으세요.","cls":["A"],"s":3303,"e":4694},{"id":"D20261003-cisco","title":"Cisco SD-WAN Manager CVE-2026-76504","file":"일일/2026-10-03.md","date":"2026-09-30","type":"엣지 장비 취약점","actor":"미귀속","region":"글로벌","evidence":"확인","easy":"Cisco SD-WAN 관리 화면의 로그인 검사가 주소의 글자 하나를 다르게 쓰면(%6a) 건너뛰어져서 관리자처럼 접속할 수 있었습니다.","todo":"바로 패치(우회 방법이 없습니다)하고, 관리 화면을 인터넷에서 닫으세요.","cls":["A"],"s":4818,"e":5891},{"id":"D20261003-wordpress","title":"WordPress CVE-2026-87902","file":"일일/2026-10-03.md","date":"2026-09-22","type":"웹 애플리케이션 취약점","actor":"미귀속","region":"글로벌","evidence":"확인","easy":"워드프레스의 결함으로, 특정 조건의 사이트에서는 로그인 없이 서버 코드가 실행됩니다. 패치가 공개된 당일부터 공격이 있었습니다.","todo":"워드프레스를 최신 버전으로 올리고 자동 업데이트를 켜세요.","cls":["A"],"s":6011,"e":7191},{"id":"D20261003-peoplesoft","title":"Oracle PeopleSoft CVE-2026-35273 / ShinyHunters","file":"일일/2026-10-03.md","date":"2026-06-10","type":"엣지·ERP 취약점","actor":"ShinyHunters(UNC6240)","region":"글로벌","evidence":"확인","easy":"대학·기업이 쓰는 PeopleSoft의 결함을 ShinyHunters가 악용했습니다. 방화벽(WAF)의 차단 규칙은 글자 하나를 다르게 쓰는 것만으로 피해 갔습니다.","todo":"방화벽 규칙에 기대지 말고 실제 패치를 적용하세요.","cls":["A"],"s":7351,"e":8914},{"id":"D20261003-zammad","title":"Zammad CVE-2026-102489 / -102490 (DIVD 침해)","file":"일일/2026-10-03.md","date":"2026-09-21","type":"웹 애플리케이션 취약점","actor":"미귀속(DIVD는 AI 에이전트형 공격 의혹)","region":"글로벌","evidence":"확인","easy":"헬프데스크 소프트웨어 Zammad의 결함 두 개를 이어 로그인 없이 서버 최고 권한(root)까지 얻을 수 있었고, 실제 침해가 있었습니다.","todo":"당시 기준 수정 버전은 7.2.0이며, 지금은 제조사의 최신 보안 버전으로 올리고 기존 로그인 세션을 모두 무효화하세요.","cls":["A"],"s":9071,"e":10367},{"id":"D20261003-apple","title":"Apple CoreGraphics CVE-2026-86950","file":"일일/2026-10-03.md","date":"2026-09-29","type":"클라이언트 취약점","actor":"미귀속(표적 공격)","region":"글로벌","evidence":"확인","easy":"아이폰·맥이 이미지·문서를 그리는 부분의 결함이 소수의 표적에게 악용됐습니다.","todo":"기기를 최신 보안 업데이트로 올리세요. 표적이 될 위험이 큰 사람은 Lockdown Mode를 고려하세요.","cls":["I"],"s":10496,"e":11377},{"id":"D20261003-dmdc","title":"미 국방부 DMDC 유출","file":"일일/2026-10-03.md","date":"2026-07-16","type":"파일 공유 시스템·대규모 개인정보","actor":"미귀속","region":"미국","evidence":"보도","easy":"미국 국방부 인사 정보 시스템의 파일 공유 서비스 결함으로 약 305만 명의 정보가 노출됐다고 보도됐습니다.","todo":"파일 공유 서비스의 패치·공개 범위·접근 권한을 먼저 점검하고, 주민번호 같은 민감한 번호는 최소한만 저장하며 암호화하고, 접속 기록을 오래 보관하세요.","cls":["E"],"s":11486,"e":12376},{"id":"D20261006-finsector","title":"금융권 동시다발 해킹 (AI 자동화 공격 정황)","file":"일일/2026-10-06-국내보충.md","date":"2026-09-29","type":"다수 금융사·자동화 공격","actor":"미귀속(연관성 조사 중)","region":"한국","evidence":"보도","easy":"9월 말부터 10월 초 사이 금융사 7곳에서 개인정보 유출이 보고됐습니다. 같은 공격자의 IP가 여러 곳에서 발견돼 서로 연관된 공격인지 조사 중이고, 일부 사건에서 AI 도구의 흔적이 보도됐지만 실제로 쓰였는지는 공식 확인되지 않았습니다.","todo":"이용자는 금융사 안내를 확인하고, 대출·한도를 미끼로 한 의심 전화·문자를 조심하세요. 담당자는 대출 조회·업무 지원·영업 지원처럼 바깥에서 접속하는 업무 시스템의 인증과 접근 통제, 이상 접속 탐지부터 점검하세요.","cls":["A"],"s":941,"e":2974},{"id":"D20261006-kepco","title":"한국전력 전 직원 개인정보 외부 노출","file":"일일/2026-10-06-국내보충.md","date":"2026-10-01","type":"정보 노출","actor":"미확인(해킹 여부 미확인)","region":"한국","evidence":"보도","easy":"한국전력 전 직원 약 2만 4천 명의 이름·연락처·이메일·직위 등이 외부 웹페이지에 올라와 있었습니다. 국정원이 먼저 발견해 알렸고 약 32시간 뒤 삭제됐습니다. 한전은 주민번호·주소 같은 민감정보와 고객 정보는 노출되지 않았다고 밝혔습니다. 해킹인지 실수인지는 아직 확인되지 않았습니다.","todo":"직원은 한전·협력사를 사칭한 피싱 메일·문자를 조심하세요. 담당자는 노출 경위가 해킹인지 설정 실수인지 밝혀질 때까지 관련 접근 기록을 보존하고, 같은 식으로 공개된 페이지가 더 없는지 점검하세요.","cls":["J"],"s":3089,"e":4054},{"id":"D20261006-seoulcyber","title":"서울사이버대 개인정보 유출","file":"일일/2026-10-06-국내보충.md","date":"2026-10-04","type":"개인정보 유출","actor":"미귀속","region":"한국","evidence":"보도","easy":"KISA(한국인터넷진흥원)가 학교 구성원의 개인정보로 보이는 자료가 외부 사이트에 올라와 있다고 알려 왔고, 학교는 성명·학번·연락처·주소 등이 유출된 것으로 확인했습니다. 주민번호·비밀번호·계좌번호는 암호화된 채 유출됐고, 발표 시점까지 풀린 정황은 확인되지 않았다고 학교는 설명합니다. 규모와 시점은 조사 중입니다.","todo":"재학생·졸업생·교직원은 학교 공지를 확인하고, 학교를 사칭한 문자·전화를 조심하며, 같은 비밀번호를 쓰는 다른 서비스도 바꾸세요. 담당자는 암호화 키가 함께 유출됐는지부터 확인하세요.","cls":["J"],"s":4159,"e":5066},{"id":"D20261006-mofa","title":"외교부(국립외교원 온라인교육시스템) 개인정보 유출","file":"일일/2026-10-06-국내보충.md","date":"2026-02-01","type":"장기 체류·개인정보","actor":"미귀속","region":"한국","evidence":"보도","easy":"국립외교원 온라인교육시스템이 2025년 4~5월에 장악당해 약 10개월 동안 접근이 이어졌고, 현직·전직 외교부 직원 최대 1만 건의 정보(이름·아이디·이메일·암호화된 비밀번호 등)가 유출됐습니다. 외교부는 2026년 2월 초에 알았고, 국회 의원실 자료에 따르면 보도 시점(10/6)까지 책임자에 대한 인사·감찰 조치가 없었습니다.","todo":"해당 시스템 이용자는 같은 비밀번호를 쓰는 다른 서비스도 바꾸고 외교·공무 사칭 메일을 조심하세요. 담당 기관은 방화벽이 열린 경위와 보안관제에서 빠진 이유를 조사해 재발 방지부터 하세요.","cls":["E"],"s":5181,"e":6192},{"id":"D20261006-citrix-saml","title":"Citrix NetScaler SAML CVE-2026-88779","file":"일일/2026-10-06.md","date":"2026-10-04","type":"엣지 장비 취약점","actor":"미귀속","region":"글로벌","evidence":"확인","easy":"회사 원격 접속 장비(NetScaler)에서 또 하나의 결함이 공격에 쓰이고 있습니다. 로그인(SAML 방식) 처리 부분의 결함이며, 벤더는 서비스 중단 위험이라고 했지만 연구자들은 명령 실행으로 이어질 가능성도 봅니다. 10-03 보고서의 Citrix 건과는 별개의 결함입니다.","todo":"SAML 로그인을 쓰는 장비인지 확인하고, 수정 버전으로 올린 뒤 접속 중인 세션을 모두 끊으세요. 이미 침해됐을 수 있는 장비라면 그 장비에서 새 비밀번호·키를 만들지 마세요.","cls":["A"],"s":1200,"e":2636},{"id":"D20261006-dk-cpr","title":"덴마크 CPR(주민등록부) 대량 조회","file":"일일/2026-10-06.md","date":"2026-10-05","type":"서드파티 접근 권한 오남용","actor":"미확인","region":"글로벌","evidence":"보도","easy":"덴마크 국민 신분 정보를 모아 둔 국가 등록부에, 접근 권한을 가진 민간 업체의 계정이 악용돼 약 880만 명 등록자의 이름·주소·주민번호(CPR 번호)에 무단 접근이 있었다고 보도됐습니다. 정보가 자동화된 조회로 빠져나갔다고 보도됐습니다. 복사·판매·공개 여부는 아직 알려지지 않았습니다.","todo":"덴마크 거주자라면 당국 안내를 따르고 신분증 번호를 이용한 사칭(전화·문자) 시도를 경계하세요. 담당자라면 외부 업체에 준 조회 권한의 범위와 조회량 제한을 점검하세요. 비밀번호만 바꿔도 이미 얻은 주민번호는 되돌릴 수 없습니다.","cls":["C","B"],"s":2751,"e":3833},{"id":"D20261007-bitget","title":"Bitget 가상자산 탈취 (보안 제품 제로데이)","file":"일일/2026-10-07.md","date":"2026-09-25","type":"서드파티 보안 제품 제로데이 → 내부 이동 → 지갑 서버","actor":"미귀속(회사는 북한 해커 주장, 미검증)","region":"글로벌","evidence":"보도","easy":"가상자산 거래소 Bitget이 약 3억 8,750만 달러어치 자산을 도난당했다고 밝혔습니다. 회사 설명에 따르면 외부 보안 제품의 제조사도 모르던 결함이 공격에 쓰였고, 그 제품 장비들이 입구가 됐고, 그곳에서 지갑을 관리하는 서버까지 들어갔다고 합니다. 어떤 제품인지는 공개되지 않았고, 누구 소행인지도 확정되지 않았습니다.","todo":"이용자는 거래소 공지를 확인하고 출금 재개 전까지 공식 안내 외의 '복구 도와드립니다' 연락을 믿지 마세요. 담당자라면 인터넷에 노출된 보안 장비의 버전과 관리 화면 노출을 점검하고, 의심 장비에서 새 키·비밀번호를 만들지 말고 깨끗한 기기에서 교체하세요.","cls":["A","C"],"s":1447,"e":3028},{"id":"D20261007-roundcube","title":"Roundcube 웹메일 CVE-2026-48842 악용","file":"일일/2026-10-07.md","date":"2026-09-21","type":"엣지·웹 서비스 취약점","actor":"미귀속","region":"글로벌","evidence":"보도","easy":"웹으로 메일을 보는 프로그램(Roundcube)에서 로그인 없이도 데이터베이스에 명령을 끼워 넣을 수 있는 결함이 5월에 패치됐는데, 아직 안 고친 서버를 노린 공격이 벌어지고 있다고 캐나다 정부 기관이 공개 보고를 인용해 경고했습니다. 약 52만 대가 인터넷에 노출돼 있다고 보도됐습니다.","todo":"메일 서버 담당자는 Roundcube 버전을 확인하고 1.6.16 또는 1.7.1 이상(당시 기준)으로 올리세요. 이미 뚫렸을 수 있으니 패치만으로 끝내지 말고 접속 기록과 사용자 계정 이상 여부를 보세요.","cls":["A"],"s":3155,"e":4247},{"id":"D20261007-asos","title":"ASOS 침해 주장과 인정된 개인정보 유출","file":"일일/2026-10-07.md","date":"2026-10-06","type":"서드파티 플랫폼 무단 접근","actor":"'Xuanye group' 자칭","region":"글로벌","evidence":"보도","easy":"영국 온라인 패션몰 ASOS 앱에서 \"해킹당했다\"는 알림이 이용자에게 전송됐습니다. 회사는 고객 소통에 쓰는 외부 플랫폼에 무단 접근이 있었고 이름·연락처 같은 기본 정보가 접근됐을 가능성이 있다고 밝혔습니다. 다만 공격자가 주장한 '데이터 저장소(Snowflake) 완전 장악'은 확인되지 않았습니다.","todo":"이용자는 ASOS를 사칭한 문자·이메일(링크 클릭 유도)을 조심하세요. 회사 발표에 따르면 회사는 카드 정보·비밀번호가 영향받지 않은 것으로 판단한다고 하지만, 앱 알림 속 링크는 누르지 마세요. 담당자는 외부 고객 소통 플랫폼의 계정·토큰 접근을 점검하세요.","cls":["J","C"],"s":4377,"e":5496},{"id":"D20261008-atlassian","title":"Atlassian 제품군 CVE-2026-21589 악용","file":"일일/2026-10-08.md","date":"2026-10-07","type":"엣지·웹 서비스 취약점","actor":"미귀속","region":"글로벌","evidence":"보도","easy":"회사 안에 직접 설치해 쓰는 업무 도구(Jira, Confluence, Bitbucket 등)에서 로그인 없이 서버의 파일을 읽을 수 있는 결함이 발견됐고, 연구기관이 공격 방법을 공개한 지 약 2시간 만에 공격 시도가 관측됐다고 보도됐습니다. 자동 검사 도구까지 퍼져 있어 노출된 서버는 금방 표적이 될 수 있습니다.","todo":"담당자는 직접 설치형 Atlassian 제품의 버전을 확인하고 Atlassian 공식 보안 공지의 수정 버전으로 올리세요. 인터넷에서 바로 접근되지 않게 막고, 이미 공격받았을 수 있으니 패치 후에도 접속 기록과 설정 파일·비밀 값 노출 여부를 점검하세요.","cls":["A"],"s":1350,"e":2907},{"id":"D20261008-fortibleed","title":"FortiBleed — 유출된 FortiGate 로그인 정보의 랜섬웨어 악용","file":"일일/2026-10-08.md","date":"2026-10-07","type":"유출 자격 증명 재사용","actor":"INC/Lynx·Payload 랜섬웨어 계열이 연루됐다고 FBI가 경고(보도)","region":"글로벌","evidence":"보도","easy":"방화벽·VPN 장비(FortiGate)의 아이디와 비밀번호 묶음이 유출돼 돌아다니고 있고, 이를 이용한 침입이 계속되고 있다고 FBI가 경고했다고 보도됐습니다. 침입자는 관리자 계정을 새로 만들고 기존 관리자를 지워 원래 담당자를 쫓아냈습니다. 특정 제품 결함이 아니라 유출된 로그인 정보를 쓰는 공격이라는 점이 핵심입니다.","todo":"담당자는 FortiGate 관리 화면과 SSL VPN이 인터넷에 열려 있는지 확인하고 막으세요. 장비 안의 관리자 목록과 최근 설정 변경에서 낯선 계정을 찾으세요. 침입이 의심되면 그 장비에서 새 비밀번호를 만들지 말고 깨끗한 기기에서 바꾸며, 이미 열린 VPN 접속(세션)도 모두 끊어야 합니다.","cls":["B"],"s":3086,"e":4642},{"id":"D20261008-cctld","title":"국가 도메인 관련 침해와 구글 도메인 인증서 부정 발급","file":"일일/2026-10-08.md","date":"2026-10-07","type":"서드파티(도메인 운영 쪽) 침해 → DNS 변조","actor":"미귀속","region":"글로벌","evidence":"보도","easy":"인터넷 주소를 관리하는 일부 나라(가나, 아메리칸사모아, 시에라리온)의 도메인 운영 쪽이 뚫려, 공격자가 주소 안내 정보를 바꾸고 구글 관련 주소에 대한 '정상으로 보이는 보안 인증서'까지 받아 냈다고 구글이 밝혔다고 보도됐습니다. 구글 자체 시스템은 안전하다고 합니다. 가짜 사이트가 진짜처럼 보일 수 있다는 점이 문제입니다.","todo":"일반 이용자는 브라우저를 최신으로 유지하세요(구글은 Chrome에서 해당 인증서를 차단했다고 합니다). 도메인 담당자는 자사 도메인의 인증서 발급 기록을 공개 감시 목록(인증서 투명성 로그)에서 확인하고, 인증서를 발급할 수 있는 기관을 제한하는 CAA 기록을 설정하세요(CAA는 이후 부정 발급을 줄일 뿐 진행 중인 DNS 탈취를 막지는 못합니다).","cls":["C"],"s":4778,"e":6180},{"id":"D20261009-kev-legacy","title":"CISA, 오래된 취약점 5건을 '악용 확인' 목록에 추가","file":"일일/2026-10-09.md","date":"2026-10-08","type":"오래된(레거시) 결함의 재악용","actor":"미공개","region":"글로벌","evidence":"확인","easy":"미국 CISA가 2015~2023년에 알려진 오래된 보안 결함 5개가 지금도 실제 공격에 쓰이고 있다고 목록에 올렸습니다. 파일 전송(ProFTPD), 문서 편집(ONLYOFFICE), 웹 관리(Strapi), 웹 개발틀(Struts), 주소 서버(BIND) 프로그램입니다. 오래전에 고쳐진 결함도 업데이트하지 않은 서버가 남아 있으면 그대로 뚫립니다.","todo":"담당자는 우리 회사에서 이 다섯 프로그램을 쓰는지 자산 목록에서 찾고, 쓴다면 버전을 확인해 최신으로 올리세요. 더 이상 지원되지 않는 버전(Strapi 항목은 지원 종료 가능성이 명시됨)은 업데이트가 어려우니 교체·폐기를 검토하세요. 인터넷에 직접 열려 있다면 먼저 접근을 막으세요.","cls":["A"],"s":1297,"e":3117},{"id":"D20261009-cisco-seg","title":"Cisco Secure Email Gateway CVE-2026-76461 — 로그인 없이 루트 명령 실행","file":"일일/2026-10-09.md","date":"2026-09-14","type":"엣지·웹 서비스 취약점","actor":"미귀속","region":"글로벌","evidence":"확인","easy":"회사로 들어오는 메일을 걸러 주는 Cisco 장비에서, 조작된 메일 한 통만으로 장비의 최고 권한(루트)으로 명령을 실행할 수 있는 결함이 이미 악용되고 있습니다. 보안 장비 자체가 뚫리면 메일 내용 열람이나 내부망 침투의 발판이 될 수 있습니다. 한 달 가까이 지난 건이지만 아직 이 저장소에 정리하지 못해 오늘 추가합니다.","todo":"담당자는 Cisco 이메일 게이트웨이(AsyncOS)를 쓰는지 확인하고 Cisco 공지의 수정 버전으로 올리세요. 우회책이 없다고 보도됐으니 패치가 핵심입니다. 이미 침해됐을 수 있으니 패치 후에도 Cisco가 공개한 침해 지표(IOC)로 점검하되(미검출이 미침해의 증거는 아님), 장비 안의 로그는 공격자가 지울 수 있으므로 방화벽·네트워크 기록과 대조하세요.","cls":["A"],"s":3272,"e":4976},{"id":"D20261013-ivanti","title":"Ivanti Connect Secure 인증 우회 제로데이 — 루트 권한까지 체인 공격","file":"일일/2026-10-13.md","date":"2026-10-13","type":"노출 VPN 장비 취약점","actor":"UTA0576(Volexity 명명, 보도)","region":"글로벌","evidence":"확인","easy":"회사 직원들이 외부에서 사내망에 접속할 때 쓰는 Ivanti VPN 장비에 로그인 절차를 건너뛸 수 있는 결함이 있고, 공격자들이 이미 10월 초부터 이를 실제로 쓰고 있었습니다. 더 나쁜 건 이 결함 하나만으로 끝나지 않고 아직 패치 안 된 또 다른 결함과 엮어서 장비의 최고 권한(루트)까지 올라갔다는 점입니다.","todo":"담당자는 Ivanti Connect Secure를 쓰는지 확인하고 Ivanti 공지의 수정 버전(ICS 22.8R2.5, 25.1.3.0, 25.1.3.1, 25.1.1.2 등, 계열별로 다르므로 공지 확인)으로 즉시 올리세요. 이미 뚫렸을 가능성이 있으니 패치만으로 끝내지 말고 계정 비밀번호, LAPS 비밀번호, BitLocker 복구 키 등 장비가 알고 있던 비밀 값을 깨끗한 환경에서 다시 발급하세요. 장비에서 바로 새 비밀번호를 만들지 마세요.","cls":["A"],"s":1330,"e":3061},{"id":"D20261014-ahsaycbs","title":"Ahsay AhsayCBS — 인증 우회 + 명령 삽입으로 웹셸·채굴기 설치","file":"일일/2026-10-14.md","date":"2026-10-07","type":"노출 백업 서버 취약점","actor":"미상","region":"글로벌","evidence":"확인","easy":"회사 데이터를 백업해 주는 Ahsay 백업 서버(AhsayCBS) 소프트웨어에 두 가지 결함이 있었고, 이를 엮으면 로그인 없이 서버 최고 권한(SYSTEM)으로 명령을 실행할 수 있습니다. 공격자들은 이걸로 몰래 접속할 뒷문(웹셸)을 심고, 서버 자원을 훔쳐 가상자산을 채굴하는 프로그램까지 설치했습니다.","todo":"Ahsay AhsayCBS를 쓴다면 버전에 맞는 핫픽스(v10 계열은 10.3.4.45, v7~v9 계열은 9.15.2.70, 보도 기준이며 Ahsay 발표 인용)를 파트너 포털에서 받아 적용하세요. 이전 패치(v10.3.4.0·v9.15.2.59)는 결함을 완전히 막지 못했다고 Ahsay가 직접 확인했다는 보도가 있습니다. 패치만으로는 이미 심어진 웹셸이 없어지지 않으니, 서버에서 낯선 JSP 파일이나 'MicrosoftEdgeUpdateSvc'라는 이름의 수상한 서비스가 있는지 반드시 확인하고 지우세요.","cls":["A"],"s":1259,"e":3114},{"id":"D20261014-panos","title":"Palo Alto Networks PAN-OS 관리 인터페이스 — 루트 권한 코드 삽입","file":"일일/2026-10-14.md","date":"2026-10-14","type":"노출 방화벽 관리 인터페이스 취약점","actor":"미상","region":"글로벌","evidence":"확인","easy":"회사 네트워크를 지키는 Palo Alto 방화벽의 관리 화면에 결함이 있어서, 이미 로그인 권한(인증)을 가진 채 그 화면에 접근할 수 있는 공격자가 방화벽의 최고 권한(루트)으로 명령을 실행할 수 있습니다. 벤더 공식 공지는 \"인증된 공격자\"를 전제로 명시하므로, 비밀번호 없이 바로 뚫리는 결함은 아닙니다. 그래도 벤더는 \"매우 제한적인 악용\"이 있었다고 밝혔습니다.","todo":"PAN-OS를 쓴다면 관리 인터페이스(장비 설정 화면)를 인터넷에서 바로 접근하지 못하게 막고, Palo Alto가 공개한 수정 버전(예: PAN-OS 12.2는 12.2.4 이상, 계열별로 다르니 공지 확인)으로 올리세요. 공개된 공격자 IP 3개(66.42.72.14, 208.83.239.114, 149.248.47.234)가 접속한 적이 있는지 로그에서 확인하세요.","cls":["A"],"s":3260,"e":5807},{"id":"D20261016-beyondtrust","title":"BeyondTrust Remote Support 인증 우회 — 8월부터 국가 배후 추정 공격자가 악용","file":"일일/2026-10-16.md","date":"2026-10-16","type":"노출 원격지원 장비 취약점","actor":"ARMORY CASTLE(Mandiant 명명, 중국 연계 추정, 보도)","region":"글로벌","evidence":"확인","easy":"고객센터·IT 지원팀이 원격으로 컴퓨터를 조작할 때 쓰는 BeyondTrust 원격지원 장비에 로그인 없이도 뚫을 수 있는 결함이 있었습니다. 중국과 연계됐을 것으로 보이는 공격자 그룹이 이미 8월부터 몰래 이 결함을 써 왔다는 것이 10월 중순에 드러났습니다.","todo":"BeyondTrust Remote Support·Privileged Remote Access를 쓴다면, SaaS(클라우드) 버전은 10/8에 이미 패치됐으니 최신 상태인지 확인하고, 자체 서버에 설치한(온프레미스) 버전은 자동 업데이트가 꺼져 있다면 수동으로 패치하세요. 8월부터 뚫려 있었을 가능성이 있으니 패치 후에도 침해 지표(IOC)를 점검하세요.","cls":["A"],"s":1177,"e":3559},{"id":"D20261021-siteguard","title":"EG Secure Solutions SiteGuard Server Edition CVE-2026-106931","file":"일일/2026-10-21.md","date":"2026-10-14(공개·KEV 전 보도 기준)","type":"서버 소프트웨어 취약점","actor":"미귀속","region":"일본 중심","evidence":"확인","easy":"일본에서 많이 쓰는 서버용 보안 소프트웨어(SiteGuard, 일종의 침입 차단 프로그램)에 결함이 있어, 이미 서버에 낮은 권한으로 들어와 있는 공격자가 그 결함을 이용해 서버의 최고 권한(root/SYSTEM)까지 올라갈 수 있습니다. 실제 공격에 쓰였다는 것이 제조사와 일본 정부 대응팀(JPCERT/CC)에 의해 확인됐습니다.","todo":"바로 패치부터 하지 말고, 제조사가 안내하는 대로 관리 화면에서 진단정보(로그)를 먼저 내려받아 보존한 다음 수정판을 적용하세요. 패치가 침입 흔적을 지울 수 있다고 벤더가 직접 경고했습니다.","cls":["A"],"s":1440,"e":2843},{"id":"D20261021-plex","title":"Plex Media Server 체이닝 가능 취약점 4건","file":"일일/2026-10-21.md","date":"2026-10-20(KEV 등재)","type":"서버 소프트웨어 취약점","actor":"미귀속","region":"글로벌","evidence":"확인","easy":"집이나 소규모 사무실에서 영상·음악을 모아 재생할 때 많이 쓰는 프로그램 Plex Media Server에서, 서로 이어 붙이면 위험해지는 결함 4개가 발견돼 CISA가 \"실제 공격에 쓰였다\"며 긴급 목록(KEV)에 올렸습니다.","todo":"Plex Media Server를 1.43.3.10861 이상으로 업데이트하세요. 외부(인터넷)에서 접속되게 포트를 열어 둔 경우라면 꼭 필요한지 다시 확인하세요.","cls":["A"],"s":2973,"e":4722},{"id":"D20261021-arundel","title":"미국 메릴랜드 Anne Arundel County 랜섬웨어(Rhysida 주장)","file":"일일/2026-10-21.md","date":"2026-08(공격 시점, 보도 기준)","type":"지자체 랜섬웨어·데이터 탈취","actor":"Rhysida(주장)","region":"미국","evidence":"보도(일부 확인)","easy":"미국 메릴랜드주 Anne Arundel 카운티(지방정부)가 8월에 침해를 당해 일부 시스템의 파일이 빠져나갔다고 카운티가 직접 확인했습니다. 랜섬웨어 조직 Rhysida는 2.6테라바이트, 81만여 개 파일을 가져갔다며 다크웹에서 비트코인 25개(약 20억 원 상당)에 팔겠다고 올렸는데, 이 수치는 범죄조직의 주장일 뿐 카운티가 확인한 내용은 아닙니다.","todo":"이 카운티의 주민이라면 공식 통지를 기다리고, 아직 통지를 받지 못했다고 안심하지 말고 카운티의 공식 발표를 주기적으로 확인하세요. 침해된 시스템에서는 비밀번호를 바꾸지 말고, 안전한 기기에서 공식 안내에 따라 조치하세요.","cls":["J"],"s":4888,"e":5902},{"id":"D20261022-php2shell","title":"PHP \"PHP2Shell\" 치명적 결함(CVE-2026-109618, CVE-2026-109619)","file":"일일/2026-10-22.md","date":"2026-10-21(긴급 패치 공개)","type":"서버 소프트웨어 취약점","actor":"미귀속","region":"글로벌","evidence":"확인","easy":"웹사이트 서버 쪽에서 널리 쓰이는 프로그래밍 언어 PHP 자체에 치명적 결함 2개가 발견됐습니다. 로그인조차 필요 없이 멀리서 서버에 명령을 실행시킬 수 있는 결함이라, PHP로 돌아가는 웹사이트는 사실상 전부 영향권입니다. 패치가 나오기도 전에 이미 공격이 시도되고 있었다고 Cloudflare가 확인했습니다.","todo":"직접 서버를 관리한다면(또는 관리업체에 문의해) PHP를 8.5.12·8.4.27·8.3.36·8.2.35 중 내 버전대의 최신 수정판으로 지금 업데이트하세요. 당장 업데이트가 어렵다면 잠시 해당 웹사이트를 인터넷에서 내려 두는 것도 선택지입니다(영국 NCSC 권고).","cls":["A"],"s":1456,"e":3342},{"id":"D20261022-safepay","title":"SafePay 랜섬웨어 CISA·FBI 공동권고(AA26-293A)","file":"일일/2026-10-22.md","date":"2026-10-21(공동권고 발표, 활동 기간 2024-11~2026-08)","type":"랜섬웨어(이중 갈취)","actor":"SafePay","region":"북미·남미·유럽·호주","evidence":"확인","easy":"미국 CISA·FBI·비밀경호국과 독일·영국 수사기관이 함께 \"SafePay\"라는 랜섬웨어 조직이 2024년 8월부터 전 세계 600곳 이상의 기반 시설급 기관을 공격했다고 공식 경고했습니다. 이 조직은 다른 유명 랜섬웨어 조직들이 와해된 뒤 그 자리를 메우며 몸집을 키웠습니다.","todo":"내 기관이 VPN·방화벽 같은 외부 접속 장비를 쓰고 있다면, 담당자는 그 장비들이 CISA KEV(실제 악용 확인 목록)에 오른 결함을 방치하고 있지 않은지부터 확인하고, 모든 외부 접속에 다중 인증(MFA)이 빠짐없이 걸려 있는지 점검하세요.","cls":["A","B","F"],"s":3516,"e":5009},{"id":"D20261022-updraftcentral","title":"UpdraftCentral(워드프레스 백업 관리) 탈취 키로 백도어 설치","file":"일일/2026-10-22.md","date":"2026-10-18~19(공격 관측, 보고서 작성 시점 진행 중)","type":"서드파티 키 탈취 → 공급망 변조","actor":"미귀속","region":"글로벌(워드프레스 생태계)","evidence":"확인(보도: Patchstack·Nethemba 등)","easy":"수많은 워드프레스 사이트를 중앙에서 백업·관리해 주는 UpdraftCentral 서비스의 \"진짜 열쇠(키)\"를 공격자가 손에 넣어, 정상적인 명령인 것처럼 속여 연결된 사이트들에 뒷문(백도어)을 심고 있습니다. 코드 자체의 결함이 아니라 열쇠를 도둑맞은 것이라, 플러그인을 아무리 업데이트해도 열쇠를 바꾸지 않으면 계속 뚫릴 수 있습니다.","todo":"UpdraftCentral으로 사이트를 관리하고 있다면, 패치를 기다리지 말고 지금 UpdraftCentral 연결 키를 삭제(연결 해제)하세요. 이미 낯선 플러그인이 설치돼 있거나 사이트가 갑자기 멈췄다면, 그 사이트는 침해됐다고 가정하고 백업을 복원하기 전에 비밀번호를 모두 새로 바꾸세요(단, 침해 의심 사이트 자체에서 바꾸지 말고 안전한 기기에서).","cls":["C"],"s":5220,"e":6854},{"id":"D20261022-emudhra","title":"eMudhra 인증기관(CA) 중간 인증서 약한 키","file":"일일/2026-10-22.md","date":"2026-10-17(발견)~10-20(브라우저 차단 완료)","type":"인증·키 설계 결함","actor":"해당 없음(결함 발견, 악용 미확인)","region":"글로벌","evidence":"확인","easy":"웹사이트가 \"진짜\"임을 보증해 주는 인증기관(CA) 중 하나인 eMudhra가 만든 인증서 8개의 \"서명용 비밀열쇠\"가 사실상 256가지 중 하나로 아주 쉽게 맞혀질 수 있을 만큼 허술했습니다. 이 열쇠를 알아내면 공격자가 실제 사이트를 사칭하는 가짜 인증서를 만들 수 있어, Mozilla·Google·Apple이 해당 인증서를 모두 차단했습니다.","todo":"일반 사용자는 브라우저(Firefox·Chrome 등)와 운영체제(macOS·iOS 등)의 보안 업데이트를 지금 설치하면 된다(설치만으로 자동 반영). 직접 서버를 운영한다면 Go 언어로 만든 프로그램은 1.27.3/1.26.10 이상으로, Node.js·Debian/FreeBSD의 인증서 묶음(ca-certificates)도 각 배포판 패치를 확인하세요.","cls":["H"],"s":7013,"e":8740},{"id":"D20261022-onamae","title":"일본 GMO Onamae Desktop Cloud 침해","file":"일일/2026-10-22.md","date":"2026-10-20(회사 확인)~10-21(서버 강제 중단, 공개)","type":"클라우드/호스팅 공급자 침해","actor":"미귀속","region":"일본","evidence":"확인","easy":"일본의 대형 도메인·호스팅 업체 GMO가 운영하는 'Desktop Cloud'(외환 자동매매 프로그램을 24시간 돌리는 가상 서버 서비스)에 외부인이 몰래 들어와 악성 프로그램을 심었습니다. 최대 2만6,739대의 고객 서버가 영향권에 들어 회사가 서버를 강제로 껐습니다.","todo":"이 서비스를 쓰고 있다면, 그 서버에 저장해 둔 비밀번호나 접속키는 **그 서버가 아닌 다른 안전한 기기에서** 새로 바꾸세요. 결제(신용카드) 정보는 별도 시스템에 있어 영향이 없다고 회사가 밝혔지만, 이 사건을 빙자한 피싱 메일·전화(GMO는 전화·메일로 비밀번호를 묻지 않는다고 공지)에 주의하세요.","cls":["C","J"],"s":8892,"e":10750},{"id":"D20261023-connectwise","title":"커넥트와이즈 클라우드 백업 침해 — AI 에이전트 도구 '아르텍스'로 계정 탈취(Storm-0940)","file":"일일/2026-10-23.md","date":"2026-10(9월부터 공격, 10/15 이후 수법 변화, 10/23 MS 분석 공개)","type":"비밀번호 대입 + 신뢰 관계 악용","actor":"Storm-0940(중국 정부 연계 추정)","region":"글로벌(한국 금융권 연관 이력 포함)","evidence":"확인","easy":"마이크로소프트(MS)가 클라우드 백업 업체 커넥트와이즈(ConnectWise)의 침해 사건을 분석한 결과, 공격자가 AI가 스스로 여러 단계를 이어서 수행하는 \"에이전트형\" 해킹 도구 '아르텍스(ARTEX)'로 비밀번호 대입 공격과 계정 탈취를 자동화했고, 일부에서는 공격 시작 3시간 안에 관리자급 권한까지 손에 넣었다고 밝혔습니다. 이 도구는 과거 한국 금융기관을 겨냥한 공격에도 쓰인 적이 있어, 레코디드퓨처는 최근 한국 금융권을 노리는 공격 조직을 별도로 추적하고 있습니다.","todo":"커넥트와이즈 서비스를 연동해 쓰고 있다면, 담당자는 연동 계정·토큰을 지금 재발급(회전)하고 MS 그래프·디렉터리에 낯선 계정·그룹·권한이 생기지 않았는지 확인하세요. 일반 이용자는 이 사건으로 바로 할 일은 없지만, 소속 기관이 커넥트와이즈를 쓰는지 담당 부서에 문의할 수 있습니다.","cls":["C","B"],"s":1801,"e":4269},{"id":"D20261023-velocloud","title":"Arista VeloCloud Orchestrator 제로데이(CVE-2026-114625)","file":"일일/2026-10-23.md","date":"2026-10-23(벤더 공지·패치 공개)","type":"SQL 삽입 → 권한 상승","actor":"미귀속","region":"글로벌","evidence":"확인","easy":"기업 네트워크를 중앙에서 관리하는 Arista의 VeloCloud Orchestrator(VCO, 자체 설치형)에서 낮은 권한의 로그인 사용자가 데이터베이스 명령을 끼워 넣는 결함으로 \"슈퍼유저\" 권한까지 올라갈 수 있는 치명적 결함이 실제로 공격에 쓰이고 있습니다.","todo":"VCO On-Prem을 운영한다면 지금 5.2.3.18·6.1.3.10·6.4.2.12 이상으로 업데이트하세요. 당장 패치가 어렵다면 Arista가 공개한 공격자 IP(74.82.197.86, 38.54.50.151)를 차단하고 관리 웹 화면 접근을 관리망으로만 제한하세요.","cls":["A"],"s":4431,"e":5895},{"id":"D20261023-litellm","title":"LiteLLM 공급망 공격 — 릴리스 파이프라인 장악, PyPI·Docker에 정보 탈취 악성코드 배포","file":"일일/2026-10-23.md","date":"2026-10-21(공격)~10-22(제거 완료, 보도)","type":"공급망(릴리스 파이프라인 변조)","actor":"미귀속","region":"글로벌","evidence":"확인(Socket·Endor Labs 분석, 메인테이너 확인)","easy":"여러 AI 서비스를 중개하는 오픈소스 도구 LiteLLM의 \"정식 배포 과정\" 자체가 공격자에게 장악돼, PyPI·Docker Hub·GitHub 컨테이너 저장소에 정보 탈취 악성코드가 심긴 가짜 정식 버전(1.107.0)이 약 2~3시간 동안 올라가 있었습니다. 코드를 내려받거나 `pip install`만 해도 비밀번호·API 키·개발 도구 인증정보가 통째로 빠져나갈 수 있는 구조였습니다.","todo":"LiteLLM 1.107.0을 설치·배포했거나 그 시간대에 pip/Docker 명령을 실행한 적이 있다면, 지금 추가로 Python이나 pip를 실행하지 말고(실행할 때마다 악성코드가 다시 동작할 수 있음) 해당 환경을 깨끗한 백업에서 다시 만들고, 그 환경에 있던 모든 비밀번호·키·토큰을 **다른 안전한 환경에서** 새로 발급하세요.","cls":["C"],"s":6104,"e":8377},{"id":"D20261023-capcom","title":"Capcom CAPCOM ID 데이터 유출 — 계정 1,170만여 개 영향","file":"일일/2026-10-23.md","date":"2026-10-19(탐지·확인)~10-21(신고)","type":"개인정보 유출","actor":"미귀속","region":"글로벌(일본)","evidence":"확인","easy":"일본 게임사 Capcom의 여러 서비스에서 공통으로 쓰는 로그인 계정(CAPCOM ID)이 해킹당해 1,170만여 개 계정의 이메일 주소와 로그인 관련 정보가 유출됐습니다. 극히 일부(43개 계정)는 생년월일·성별 등 더 많은 정보가, 196개 계정은 비밀번호가 공격자에 의해 바뀌어 잠겼습니다. 비밀번호 자체와 신용카드 정보는 영향이 없다고 회사는 밝혔습니다.","todo":"CAPCOM ID를 쓰고 있다면 Capcom의 공식 안내 메일·공지만 믿고, \"계정 확인\"을 유도하는 다른 이메일·문자의 링크는 누르지 마세요. 같은 이메일·비밀번호를 다른 사이트에서도 쓰고 있다면 그 사이트들의 비밀번호를 바꾸는 것이 안전합니다.","cls":["J"],"s":8527,"e":10032},{"id":"D20261023-railway","title":"Railway 클라우드 플랫폼 — 고객 비밀값(시크릿) 노출 가능성","file":"일일/2026-10-23.md","date":"2026-10(이번 주 초 탐지, 10/22 공개)","type":"클라우드 플랫폼 비밀값 노출","actor":"미귀속","region":"글로벌","evidence":"확인(회사 공지)","easy":"코드를 올리면 자동으로 서버에 배포해 주는 클라우드 서비스 Railway가 \"고객의 환경변수(API 키·DB 접속정보 등 비밀값)를 저장하는 시스템에서 외부인의 접근이 의심된다\"고 이용자들에게 경고하며 비밀값을 모두 바꾸라고 안내했습니다. 일부는 암호화가 풀린 채로 접근됐을 가능성이 있다고 합니다.","todo":"Railway를 쓰고 있다면 지금 그 플랫폼에 저장해 둔 모든 환경변수·API 키·DB 비밀번호·프라이빗 레지스트리 접속정보를 새로 발급해 교체하세요. 서비스 로그에서 이상한 접근이 없었는지도 함께 확인하세요.","cls":["C","J"],"s":10191,"e":11658},{"id":"D20261023-gitlab","title":"GitLab 정규표현식 컴파일러 치명적 결함(CVE-2026-110264)","file":"일일/2026-10-23.md","date":"2026-10-22(패치 공개)","type":"인증 없는 원격 코드 실행(이론상, 실제 악용 미확인)","actor":"해당 없음","region":"글로벌","evidence":"확인(실제 악용은 미확인)","easy":"소스코드 관리 도구 GitLab에서, 특정 형식으로 만든 정규표현식(패턴) 하나만 서버가 처리하게 만들면 로그인 없이도 서버에서 임의 코드를 실행시킬 수 있는, 벤더가 \"최고 위험도(치명적)\"로 분류한 결함이 발견돼 패치됐습니다. 아직 실제로 이용된 공격은 확인되지 않았습니다.","todo":"GitLab을 직접 설치해 운영한다면(GitLab.com 이용자는 이미 자동 적용됨) 관리자가 지금 19.5.1·19.4.3·19.3.6·19.2.9·19.1.9·19.0.10·18.11.13 중 해당 버전으로 업데이트하도록 요청하세요.","cls":["A"],"s":11831,"e":13189},{"id":"D20261023-yonsei","title":"연세대 학사 행정 포털 개인정보 유출 (국내)","file":"일일/2026-10-23.md","date":"2026-10-22(학교 확인·공지)","type":"개인정보 유출","actor":"미귀속","region":"한국","evidence":"확인(학교 공지, 보도)","easy":"연세대 학사 행정 포털에 외부인이 허락 없이 접근해 재학생·졸업생 등 약 1만여 명의 학번·휴대전화번호·이메일 등이 유출됐습니다. 주민등록번호 같은 더 민감한 정보는 포함되지 않았다고 학교는 밝혔습니다.","todo":"연세대 구성원이라면 학교 공지(대표 홈페이지)에서 내 정보가 유출됐는지 확인하고, 학교·행정실을 사칭한 문자·전화·메일을 조심하세요. 다른 사이트에서 같은 비밀번호를 쓰고 있다면 그 사이트의 비밀번호도 바꾸는 것이 안전합니다.","cls":["J"],"s":13322,"e":14493},{"id":"D20261023-kfund","title":"한국국제교류재단(KF) 메일시스템 침해 조사 (국내)","file":"일일/2026-10-23.md","date":"2026-10-19(이상 징후 발견)~10-22(신고)","type":"침해 조사 중(실제 유출 여부 미확정)","actor":"미귀속","region":"한국","evidence":"확인(재단 신고, 보도)","easy":"한국국제교류재단의 대량 홍보메일 발송 시스템에서 수상한 접근 흔적이 발견됐습니다. 이 시스템에는 구독자 이메일 주소 약 22만 7천 건(이름 포함 약 18만 7천 건, 전화번호 포함 약 5,400건)이 들어 있었는데, **이 숫자는 서버에 저장돼 있던 양이고 실제로 빼내 갔는지는 아직 확인되지 않았습니다.**","todo":"한국국제교류재단의 홍보메일을 받아본 적이 있다면, 재단·외교·문화교류 행사를 사칭한 메일이나 문자의 링크·첨부파일을 열지 마세요. 재단은 전화로 비밀번호나 결제 정보를 묻지 않습니다.","cls":["J"],"s":14653,"e":16304},{"id":"D20261024-collabora","title":"Nextcloud용 Collabora 내장 CODE 서버 RCE — 웹셸 설치, 공개까지 4주 지연(CVE-2026-110447)","file":"일일/2026-10-24.md","date":"2026-09(9월 중순부터 실제 악용, 수정판 9/11 배포)~10-14(보안 공지·CVE 공개)·10-23(CISA KEV 등재)","type":"인증 없는 명령어 주입","actor":"미귀속","region":"글로벌","evidence":"확인(Collabora·Nextcloud 공지, CISA KEV, 관리자 보고)","easy":"문서 공동편집 플랫폼 Nextcloud에 함께 쓰이는 Collabora의 \"내장 CODE 서버\" 기능에서, 그 서버가 잠깐 꺼져 있는 틈(재시작·업그레이드·오류 직후)을 노려 로그인 없이도 서버에 명령을 실행시킬 수 있는 결함이 실제로 악용되고 있습니다. 공격자는 이 결함으로 서버에 \"웹셸\"(원격 뒷문 파일)을 심어 비밀번호·암호화폐 지갑 흔적을 뒤진 것으로 보고됐습니다. 결함을 고친 버전은 9월 11일에 나왔지만, 공식 보안 공지·CVE는 한 달 넘게 지나서야 공개됐습니다.","todo":"Nextcloud에 richdocumentscode(내장 Collabora CODE 서버) 앱을 쓰고 있다면 지금 26.4.303 이상으로 업데이트하거나, 꼭 필요하지 않다면 앱을 완전히 제거하세요(끄기만 해서는 안 됩니다). 이미 공격받은 흔적(낯선 PHP 파일 등)이 있다면 비밀번호를 그 서버에서 바로 바꾸지 말고, 안전한 다른 기기에서 바꾸세요.","cls":["A"],"s":1698,"e":3938},{"id":"D20261024-questdx","title":"Quest Diagnostics 검사실 관리 시스템(Quanum LSM) 무단 접근 — 환자 기록 노출","file":"일일/2026-10-24.md","date":"2026-10-21(무단 접근 인지)","type":"개인정보 유출(조사 중, 항목·규모 미확정)","actor":"미귀속","region":"글로벌(미국)","evidence":"확인(회사 SEC 제출·공지)","easy":"미국 대형 임상검사 회사 Quest Diagnostics가 의료진이 검사를 주문하고 결과를 확인하는 온라인 시스템(Quanum LSM)에 외부인이 허락 없이 접근한 것을 확인했습니다. 일부 환자 기록이 노출된 것으로 보고 있지만, 정확히 몇 명의 어떤 정보가 유출됐는지는 아직 회사도 파악하지 못했습니다.","todo":"Quest Diagnostics에서 검사를 받은 적이 있다면 지금 당장 할 일은 없습니다. 회사의 추가 공지를 기다리고, 공식 공지 전에 \"유출 확인\" 등을 명목으로 개인정보나 결제 정보를 요구하는 메일·전화는 응하지 마세요.","cls":["J"],"s":4129,"e":5528},{"id":"D20261024-arubaos","title":"HPE ArubaOS 최고 심각도 결함 8건(전체 72건 패치) — 인증 우회·명령어·SQL 삽입 → RCE","file":"일일/2026-10-24.md","date":"2026-10-23(벤더 공지·패치 공개)","type":"인증 우회·명령어 주입·SQL 삽입 → 원격 코드 실행","actor":"해당 없음","region":"글로벌","evidence":"확인(HPE 공지, 실제 악용·PoC 미확인)","easy":"HP엔터프라이즈(HPE)의 무선 네트워크 장비 운영체제 ArubaOS(AOS-8·AOS-10)에서, 로그인 없이도 공격자가 장비를 완전히 장악할 수 있는 \"최고 위험도\" 결함 8건이 발견돼 패치됐습니다(전체로는 72건 패치). 아직 공개된 공격 도구나 실제 공격 사례는 확인되지 않았습니다.","todo":"회사나 기관에서 Aruba 무선 액세스 포인트·컨트롤러·모빌리티 컨덕터를 운영한다면, 네트워크 담당자에게 HPE 보안 공지(hpesbnw05162en_us)를 확인해 지금 패치하도록 요청하세요. 당장 패치가 어렵다면 관리 화면 접근을 관리망으로만 제한해야 합니다.","cls":["A"],"s":5738,"e":7267},{"id":"D20261024-node2shell","title":"Node.js·Bun Brotli 디코더 결함 — 요청뿐 아니라 응답 처리로도 공격 가능(CVE-2026-111497)","file":"일일/2026-10-24.md","date":"2026-10-21(패치 공개)~10-22(PoC 등장)","type":"압축 해제 처리 중 메모리 손상(버퍼 오버플로) → 원격 코드 실행","actor":"해당 없음","region":"글로벌","evidence":"확인(Node.js 보안팀, 실제 공격 미확인)","easy":"서버 프로그램을 만드는 데 널리 쓰이는 Node.js(와 Bun)에서, 데이터를 압축 해제하는 내부 기능(Brotli)에 조작된 압축 데이터를 넣으면 서버에서 임의 코드가 실행될 수 있는 결함이 발견돼 패치됐습니다. 이 결함은 공격자가 서버로 보내는 요청뿐 아니라, 서버가 \"바깥으로 내보낸 요청의 응답\"을 받을 때도 작동할 수 있어 막기가 더 까다롭습니다. 패치 하루 뒤 보안 연구자들이 실제로 코드 실행에 성공하는 검증 코드를 만들었지만, 아직 실제 공격에 쓰였다는 사례는 확인되지 않았습니다.","todo":"Node.js 또는 Bun으로 서버·백엔드를 운영하는 조직이라면 담당 개발자에게 지금 지원 버전(Node.js 26.12.1·24.22.1·22.23.4 이상, Bun 1.4.4 이상)으로 업데이트하도록 요청하세요. 일반 이용자가 당장 할 일은 없습니다.","cls":["A"],"s":7502,"e":9724},{"id":"D20261024-koreanair","title":"대한항공 고객 예약번호 유출 — 위탁 발권망(아마데우스) 침해 (국내)","file":"일일/2026-10-24.md","date":"2023-08~2026-09(추정 침해 기간, 조사 중)·2026-10-20(아마데우스가 대한항공에 통보)","type":"서드파티(GDS) 신뢰 관계 악용","actor":"미귀속","region":"한국","evidence":"확인(대한항공 공지, 보도)","easy":"대한항공이 항공권 예약·발권 업무를 맡기는 글로벌 IT 업체 아마데우스(Amadeus)의 시스템이 뚫려, 대한항공 고객의 예약번호가 외부로 노출됐습니다. 대한항공 자체 전산망이 직접 뚫린 것은 아니고, 발권 업무를 대신 처리해 주는 **외부 업체 쪽**이 뚫린 것이 원인입니다. 다른 개인정보가 추가로 유출됐는지는 아직 확인 중입니다.","todo":"대한항공을 이용했다면 지금 당장 바꿀 비밀번호는 없습니다(예약번호 유출이며, 대한항공 계정 비밀번호 유출이 아닙니다). 대한항공·아마데우스를 사칭해 \"예약 확인\"이나 개인정보를 요구하는 메일·문자·전화의 링크는 누르지 말고, 대한항공 공식 공지로만 확인하세요.","cls":["C"],"s":9926,"e":12256},{"id":"D20261025-blackx","title":"BlackX UEFI 부트킷 — 침해 후 지속성 도구, 2022년 \"Baton Drop\" 결함(CVE-2022-21894)으로 Secure Boot 우회, 중앙아시아 외교기관 스파이 활동","file":"일일/2026-10-25.md","date":"2026년 초(스파이 활동 관측 시작, 정확한 최초 시점 비공개)~2026-10-23(Kaspersky 분석 공개)","type":"침해 후 UEFI 부트킷을 통한 Secure Boot 우회·지속성 확보(지정학적 첩보 목적 추정)","actor":"미귀속(Kaspersky가 중간 확신도로 APT41/Brass Typhoon/Wicked Panda/Barium으로 추정)","region":"글로벌(타지키스탄·우즈베키스탄·투르크메니스탄 외교기관 표적)","evidence":"확인(Kaspersky 분석)","easy":"공격자가 이미 어떤 방법으로든 기업망에 침투해 관리자 권한까지 확보한 뒤, 거기서 더 깊고 오래 숨어 있기 위해 컴퓨터가 켜질 때 윈도우보다 먼저 실행되는 \"부팅 단계\"에 몰래 끼어드는 악성코드(UEFI 부트킷) \"BlackX\"를 심는 사례가 발견됐습니다. 이 부트킷은 윈도우의 보안 기능인 Secure Boot(서명되지 않은 프로그램은 부팅 단계에서 실행하지 못하게 막는 기능)를, 2022년에 이미 알려진 낡은 결함(\"Baton Drop\")을 이용해 우회합니다. 문제는 그 결함을 막는 조치(인증서 폐기)가 자동으로 적용되지 않고 관리자가 수동으로 한 단계를 더 처리해야 한다는 점인데, 이걸 하지 않은 \"완전히 패치된\" 윈도우 PC들도 그대로 당했습니다. 다만 이 부트킷이 보안 소프트웨어를 끄려고 시도한 기능은 Kaspersky 자체 분석에서 정작 Kaspersky 제품에는 효과가 없었던 것으로 확인됐습니다(다른 보안제품 대상 효과는 별도로 공개되지 않음). 중앙아시아 외교기관을 겨냥한 스파이(정보 수집) 활동에 실제로 쓰였습니다.","todo":"일반 개인 이용자가 당장 할 일은 없습니다(이 공격은 특정 외교기관을 겨냥한 표적형입니다). 회사·기관의 윈도우 PC를 관리한다면, 담당자에게 마이크로소프트의 \"취약한 윈도우 부트매니저 인증서 폐기\" 안내(Tech Community 블로그)를 지금 수동으로 적용했는지 확인해 달라고 요청하세요. Windows Update만으로는 이 폐기 절차가 자동 실행되지 않습니다.","cls":["G"],"s":1808,"e":5293},{"id":"D20261025-phprce","title":"PHP 세션 처리 결함(CVE-2026-115560) — PHP2Shell과 별개의 미패치 RCE, 특정 설정 조합에서만 작동","file":"일일/2026-10-25.md","date":"2026-10-23(보안 공지 공개, 패치는 아직 없음)","type":"세션 핸들러 런타임 전환 처리 결함 → 원격 코드 실행(미패치)","actor":"해당 없음","region":"글로벌","evidence":"확인(PHP 보안팀 공지, 실제 악용 미확인)","easy":"웹사이트의 약 70%가 쓰는 프로그래밍 언어 PHP에서, [D20261022-php2shell](2026-10-22.md)(PHP2Shell)과는 별개인 새로운 원격 코드 실행 결함(CVE-2026-115560)이 발견됐습니다. 아직 수정판이 나오지 않았지만, PHP 보안팀은 \"특이한 설정과 코드 조합\"에서만 공격이 가능하다고 밝혔습니다. 즉 모든 PHP 사이트가 위험한 게 아니라, 특정 방식으로 세션을 다루는 일부 사이트만 해당됩니다.","todo":"일반 이용자가 당장 할 일은 없습니다. 자체 웹서버를 운영하는 개발자·관리자라면, 서버의 세션 설정 중 `session.upload_progress.enabled`를 지금 0으로 꺼 두는 것이 안전합니다(이 기능을 런타임에 끄고 켜는 코드를 쓰지 않는다면 끄는 데 문제가 없습니다).","cls":["A"],"s":5525,"e":7738},{"id":"D20261025-popcorntime","title":"폐기된 Popcorn Time 포크 앱(Time4Popcorn) 자동 업데이트 결함 — 최대 335만 기기 노출, 연구자가 선의로 차단(CVE-2026-30612)","file":"일일/2026-10-25.md","date":"2025-11~2026-03(연구자의 선의 조치 기간)·2026-10-23(보도 공개)","type":"서명·암호화 없는 HTTP 자동 업데이트 메커니즘 → 원격 코드 실행","actor":"해당 없음(실제 악의적 공격자는 확인되지 않음)","region":"글로벌","evidence":"확인(Eye Security 분석)","easy":"영화·TV를 무단으로 스트리밍해 주던 \"Popcorn Time\"의 포크(파생) 앱 중 하나인 \"Time4Popcorn\"이 이미 관리를 그만둔(버려진) 상태인데, 이 앱의 자동 업데이트 기능이 암호화도 서명 확인도 없이 동작하고 있었습니다. 그 업데이트용 인터넷 주소(도메인)가 버려진 것을 보안 연구자들이 먼저 사들여, 누군가 이 앱을 쓰는 최대 335만 대(윈도 300만·맥 35만)의 컴퓨터에 원격으로 코드를 실행시킬 수 있다는 것을 확인했습니다. 다행히 실제 공격자가 이를 악용했다는 증거는 없고, 연구자들이 먼저 선의로 업데이트 기능을 꺼 버렸습니다.","todo":"아직 Time4Popcorn(또는 비슷한 Popcorn Time 포크 앱)을 PC에 설치해 쓰고 있다면, 지금 완전히 삭제하세요. 안드로이드 버전은 원격으로 끌 수 없는 구조라 여전히 위험하므로, 설치돼 있다면 바로 지워야 합니다.","cls":["I"],"s":8031,"e":10248},{"id":"D20261025-hollys","title":"할리스 커피 멤버십 해킹 — 고객정보 약 276만 건 유출, 가상화폐 채굴 목적 클라우드 접근 중 노출 (국내)","file":"일일/2026-10-25.md","date":"2026-09-03~10-07(추정 유출 기간)·2026-10-16(회사 인지)·2026-10-18(고객 통보)","type":"클라우드 서비스 비정상 접근(세부 경위 비공개)","actor":"미귀속","region":"한국","evidence":"확인(회사 공지, 보도)","easy":"커피 프랜차이즈 할리스가 멤버십 정보를 보관하던 클라우드 서비스에 외부인이 가상화폐를 채굴할 목적으로 몰래 접근했는데, 그 과정에서 고객 개인정보 약 276만 건이 함께 노출됐습니다. 유출된 정보는 활성 고객 DB가 아니라 과거 멤버십 개편 때 만들어 둔 임시 데이터 파일이며, 2020년 2월 11일 이전 가입 고객이 주로 해당합니다. 할리스는 사고를 16일에 인지했지만, 고객에게는 이틀이 지난 18일에야 문자로 알려 늦은 통보라는 비판을 받고 있습니다.","todo":"2020년 2월 이전부터 할리스 멤버십을 썼다면, 지금 할리스 비밀번호를 바꾸고, 같은 아이디·비밀번호를 다른 사이트에서도 쓰고 있다면 그 사이트들의 비밀번호도 함께 바꾸세요. 유출 항목에 비밀번호가 포함돼 있어, 비밀번호 변경이 이번 사건에서는 실제로 의미 있는 조치입니다(다른 사건과 달리 단순 안내가 아닙니다).","cls":["J"],"s":10479,"e":12399}],"mappings":[{"id":"INC-2023-10-okta","ta":"TA0001","tech":"T1078","parent":"T1078","ev":"확인","note":"지원 시스템 서비스 계정의 도난 자격 증명으로 접속"},{"id":"INC-2023-10-okta","ta":"TA0006","tech":"T1539","parent":"T1539","ev":"확인","note":"HAR 파일 안의 쿠키·세션 토큰 확보"},{"id":"INC-2023-10-okta","ta":"TA0008","tech":"T1550.004","parent":"T1550","ev":"확인","note":"탈취한 세션 토큰으로 고객 환경 접근"},{"id":"INC-2023-10-okta","ta":"TA0001","tech":"T1199","parent":"T1199","ev":"추정","note":"IdP 공급사를 거쳐 하위 고객으로 확산"},{"id":"INC-2023-10-citrixbleed","ta":"TA0001","tech":"T1190","parent":"T1190","ev":"확인","note":"NetScaler 정보 노출 취약점 악용"},{"id":"INC-2023-10-citrixbleed","ta":"TA0006","tech":"T1539","parent":"T1539","ev":"확인","note":"메모리 누수로 세션 토큰 수집"},{"id":"INC-2023-10-citrixbleed","ta":"TA0008","tech":"T1550.004","parent":"T1550","ev":"확인","note":"탈취 세션 재사용으로 MFA 우회"},{"id":"INC-2023-10-citrixbleed","ta":"TA0040","tech":"T1486","parent":"T1486","ev":"확인","note":"LockBit 계열 랜섬웨어 (ICBC 미국 법인 등은 관련성 보도)"},{"id":"INC-2023-10-citrixbleed","ta":"TA0040","tech":"T1657","parent":"T1657","ev":"확인","note":"데이터 공개 위협 (Boeing 유출 등)"},{"id":"INC-2024-01-ivanti","ta":"TA0001","tech":"T1190","parent":"T1190","ev":"확인","note":"인증 우회 + 명령 주입 연쇄"},{"id":"INC-2024-01-ivanti","ta":"TA0003","tech":"T1505.003","parent":"T1505","ev":"확인","note":"VPN 장비에 웹셸 설치"},{"id":"INC-2024-01-ivanti","ta":"TA0006","tech":"T1056.003","parent":"T1056","ev":"추정","note":"로그인 페이지 변조로 자격 증명 수집 (Mandiant 분석, 원문 미확인)"},{"id":"INC-2024-01-midnight","ta":"TA0006","tech":"T1110.003","parent":"T1110","ev":"확인","note":"패스워드 스프레이"},{"id":"INC-2024-01-midnight","ta":"TA0001","tech":"T1078.004","parent":"T1078 552","ev":"확인","note":"Socket·Endor Labs 확인: 악성코드가 .env 파일·SSH/GPG/TLS 키·CI 설정 등에 평문으로 남은 자격 증명을 탐색해 수집"},{"id":"D20261023-litellm","ta":"TA0009","tech":"T1005","parent":"T1005","ev":"확인","note":"Socket·Endor Labs 확인: 브라우저 데이터·셸 히스토리·시스템 정보 등 로컬 자료 수집"},{"id":"D20261023-litellm","ta":"TA0010","tech":"T1041","parent":"T1041","ev":"확인","note":"Socket·Endor Labs 확인: 암호화한 탈취 자료를 공격자가 통제하는 수집 엔드포인트(litellm[.]dev/healthcheck, 상주 로더의 외부 통신과 같은 도메인)로 전송"},{"id":"D20261023-litellm","ta":"TA0011","tech":"T1105","parent":"T1105","ev":"확인","note":"Socket·Endor Labs 확인: 별도 상주 로더가 외부 포인터를 주기적으로 확인해 추가 코드를 내려받음"},{"id":"D20261023-gitlab","ta":"TA0001","tech":"T1190","parent":"T1190","ev":"후보","note":"GitLab 확인(버그바운티 보고): 인증 없이 조작된 정규표현식으로 서버 코드 실행이 이론상 가능하나, 보도 시점까지 실제 악용 확인되지 않음"},{"id":"D20261024-collabora","ta":"TA0001","tech":"T1190","parent":"T1190","ev":"확인","note":"CISA KEV 등재(10/23)·Collabora 확인: 인증 없이 proxy.php에 명령어 주입, 9월 중순부터 실제 악용(웹셸 설치) 관측"},{"id":"D20261024-collabora","ta":"TA0003","tech":"T1505","parent":"T1505","ev":"확인","note":"BleepingComputer·관리자 보고: 공격자가 PHP 웹셸을 심어 지속 접근 확보"},{"id":"D20261024-collabora","ta":"TA0007","tech":"T1083","parent":"T1083","ev":"후보","note":"보도: 웹셸로 비밀번호 데이터베이스·패스워드 매니저·암호화폐 지갑 관련 파일을 탐색한 흔적이 보고됐으나, 실제 접근·탈취까지 이어졌는지는 독립적으로 확인되지 않음"},{"id":"D20261024-arubaos","ta":"TA0001","tech":"T1190","parent":"T1190","ev":"후보","note":"HPE 확인(보도 인용): 인증 없이 악용 가능한 치명적 결함이나 PoC·실제 악용은 보도 시점까지 확인되지 않음"},{"id":"D20261024-node2shell","ta":"TA0001","tech":"T1190","parent":"T1190","ev":"후보","note":"Node.js 보안팀 확인(보도 인용): 공개 HTTP 엔드포인트가 Content-Encoding: br 요청 본문을 자동 해제하는 인바운드 경로(예: Express 5)에 한정해 조작된 Brotli 데이터로 RCE 가능, 연구자가 미패치 공식 이미지에서 PoC 성공시켰으나 실제 공격(ITW)은 보도 시점까지 확인되지 않음(아웃바운드 fetch() 경로는 별개 메커니즘이라 이 매핑 범위에서 제외)"},{"id":"D20261024-koreanair","ta":"TA0001","tech":"T1199","parent":"T1199","ev":"확인","note":"대한항공 확인(보도): 항공권 발권 시스템을 위탁 운영하는 아마데우스와의 신뢰 관계가 악용돼 고객 예약번호 노출"},{"id":"D20261024-koreanair","ta":"TA0001","tech":"T1078","parent":"T1078","ev":"확인","note":"대한항공 확인(보도): 아마데우스 시스템 계정의 정상 로그인 인증정보가 도용돼 악용"},{"id":"D20261025-blackx","ta":"TA0003","tech":"T1542.003","parent":"T1542","ev":"확인","note":"Kaspersky 확인: BlackX 부트킷이 Baton Drop(CVE-2022-21894) 취약점으로 UEFI 부팅 단계에 자리잡아 OS 시작 전부터 지속성 확보"},{"id":"D20261025-blackx","ta":"TA0112","tech":"T1553.006","parent":"T1553","ev":"확인","note":"Kaspersky 확인: 맞춤 MOK 등록·임의 EFI 파일 로드로 서명 검증 정책을 우회해 Secure Boot 무력화"},{"id":"D20261025-blackx","ta":"TA0112","tech":"T1685","parent":"T1685","ev":"확인","note":"Kaspersky 확인: 폐기된 인증서로 서명된 커널 드라이버가 보안 프로세스 비활성화를 시도하도록 설계됨(동적 분석에서 Kaspersky 제품 대상은 효과 없음 확인, Avast 결과는 비공개)"},{"id":"D20261025-blackx","ta":"TA0011","tech":"T1102.002","parent":"T1102","ev":"추정","note":"보도 인용: RAT가 Google Drive·OneDrive·Yandex.Disk 등 정상 클라우드 서비스를 양방향 C2 통로로 사용"},{"id":"D20261025-blackx","ta":"TA0011","tech":"T1105","parent":"T1105","ev":"추정","note":"Kaspersky 확인(설계)·본 보고서 추정(실사용): 사이드로드 DLL(OxiDLLRunner)이 추가 플러그인(DLL)을 받아 실행하도록 설계됐으나, 실제 내려받기·실행이 관측됐는지는 보도에 명시되지 않음"},{"id":"D20261025-phprce","ta":"TA0001","tech":"T1190","parent":"T1190","ev":"후보","note":"PHP 보안팀 확인(보도 인용): 공개 웹 응용 프로그램이 특정 설정(세션 직렬화 핸들러 런타임 전환+업로드 진행률 활성화) 조합을 쓸 경우를 가정한 예상 기법이며, 실제 공격에서 관측된 매핑이 아니다(보도 시점까지 악용 미확인)"},{"id":"D20261025-popcorntime","ta":"TA0001","tech":"T1195.002","parent":"T1195","ev":"후보","note":"Eye Security 설명(보도 인용): 폐기된 업데이트 도메인을 장악해 서명 검증 없는 HTTP 업데이트 채널로 악성코드를 배포할 경우를 가정한 후보. 연구자들이 선의로 같은 메커니즘을 써 업데이트 기능을 중지시켰을 뿐, 실제 악의적 공급망 침해는 관측되지 않음"}],"docs":[{"path":"일일/2026-10-03.md","title":"일일 보안 이슈 분석 — 2026-10-03","md":"# 일일 보안 이슈 분석 — 2026-10-03\n\n> 수집 기준: 2026-09-22 ~ 10-03 공개분. CISA KEV 신규 등재와 1차 벤더/연구기관 자료를 우선했다.\n> 근거 표기: **[확인]** 벤더·CISA·연구기관이 직접 확인 / **[주장]** 공격자 일방 주장 / **[추정]** 공개 자료에 없어 본 보고서가 추정. 주체가 중요한 곳은 괄호로 밝힌다. **조치는 본 보고서의 권고**이며 벤더 공식 지침이 우선한다. 모든 '즉시' 조치는 증거(로그·메모리·디스크·클라우드 감사 기록)를 보존한 뒤 수행하고, 침해된 장비·계정에서 새 비밀을 발급하지 않는다.\n> ATT&CK 기준: **v19.2**(TA0005는 *Stealth*로 개칭, *Defense Impairment* 신설). 사건별 기법 매핑은 [../ATTACK/README.md](../ATTACK/README.md)의 전술별 파일과 UI에서 본다.\n\n## 1. 오늘의 요약\n\n| # | 이슈 | CVE | 유형 | 상태 | 즉시 조치 |\n|---|------|-----|------|------|-----------|\n| 1 | Fortinet FortiMail 제로데이 | CVE-2026-104286 | 인증 없이 임의 파일 쓰기 (CVSS 9.8) | 악용 중, KEV 10/1 | IBE 비활성화, 관리 인터페이스 격리 (패치 출시 여부 확인) |\n| 2 | Citrix NetScaler ADC/Gateway 제로데이 2건 | CVE-2026-88771, -88772 | 인증 없이 RCE (CVSS v4 9.5) | 전 세계 악용 중, KEV 9/27 | 패치 **전** 포렌식 증거 보존 후 패치 |\n| 3 | Cisco Catalyst SD-WAN Manager | CVE-2026-76504 | 인증 우회 → admin API (CVSS 9.8) | 악용 중, KEV 9/30 | 패치(우회책 없음), KEV 기한 10/3 |\n| 4 | WordPress 코어 | CVE-2026-87902 | 로컬 파일 포함 → RCE (CVSS 9.2) | 패치 당일 악용, KEV 9/25 | 7.1.2 / 7.0.6 / 6.9.9 / 6.8.10 |\n| 5 | Oracle PeopleSoft (ShinyHunters) | CVE-2026-35273 | 인증 없이 RCE, WAF 우회 | 대량 악용 지속 | 패치 적용, WAF에만 의존 금지 |\n| 6 | Zammad 헬프데스크 | CVE-2026-102489 + -102490 | 세션 고정 → RCE → root | 악용 중, KEV 10/2 | 7.2.0 업그레이드, KEV 기한 10/5 |\n| 7 | Apple CoreGraphics | CVE-2026-86950 | 메모리 쓰기 범위 초과 | 표적 공격, KEV 9/29 | iOS/macOS 26.7.1, macOS 15.8.1 |\n| 8 | 미 국방부 DMDC 유출 | (제품·CVE 비공개) | 파일 공유 시스템 취약점 | 약 305만 명 영향 | 공개 정보 제한적 |\n\n## 2. 이슈별 분석\n\n### [D20261003-fortimail] FortiMail CVE-2026-104286\n> 날짜: 2026-10-01 · 유형: 엣지 장비 취약점 · 행위자: 미귀속 · 지역: 글로벌 · 근거: 확인\n\n**쉽게 말하면**: 메일 보안 장비(FortiMail)에 로그인 없이 파일을 써 넣을 수 있는 결함이 있고, 실제로 공격에 쓰이고 있습니다.\n\n**먼저 할 일(초보용)**: 제조사의 임시 조치(IBE 끄기, 관리 화면을 인터넷에서 닫기)를 적용하고, 수정 버전이 나왔는지 확인하세요.\n\n**개요**: FortiMail에서 인증 없이 파일을 쓰는 제로데이가 악용 중이며 CISA KEV에 10/1 등재됐다(CVSS 9.8, Fortinet 공지 FG-IR-175). 영향 버전은 8.0.0–8.0.1, 7.6.0–7.6.6, 7.4.0–7.4.8, 7.2.0–7.2.9다.\n\n**왜 일어났나**\n- 직접 원인 [확인: Fortinet]: 경로 순회(CWE-22)와 널 바이트(NULL byte) 처리 오류(CWE-158)가 결합해, 조작된 HTTP(S) 요청으로 인증 없이 파일 쓰기가 가능하다. 경로 검증과 파일 쓰기 단계의 문자열 해석 차이일 가능성은 있으나 구체 메커니즘은 미공개다 [추정: 본 보고서].\n- 구조적 원인 [추정]: (1) 메일 보안 장비의 웹/IBE 관리면이 인터넷에 노출 (2) 장비에 EDR이 없어 변조를 못 봄 (3) 7.2 계열은 지원 종료 성격으로 수정 대상이 아님(7.4 이상 이전 권고)\n\n**관측된 아티팩트 [확인]** (실행 순서는 확인되지 않음): `/data/lib/liblog.so`와 `/data/etc/ld.so.preload` 추가, `/data/bin/webconsole`·`/data/bin/mailservice` 추가, `/bin/smit`·`/data/etc/httpd.conf`·`/data/migadmin.tar.gz` 변조, root cron이 `/migadmin` 참조, 의심 아카이브 계정 `archive234`가 데이터를 유출하도록 설정. IOC: IP `79.141.169.187`, `45.129.0.192`.\n\n**침투 경로 [추정: 본 보고서]**: 노출된 웹/IBE → 임의 파일 쓰기 → `ld.so.preload`로 `liblog.so`를 프로세스에 주입 → cron으로 재부팅 후 유지 → 아카이브 계정으로 메일 수집. 각 파일의 구체 기능은 공개 자료에 없다.\n\n**어떻게 조치하나**\n- 즉시: IBE 기능 비활성화(CLI), 관리 인터페이스를 신뢰 대역으로 제한하거나 인터넷에서 제거, **수정 버전(8.0.2 / 7.6.7 / 7.4.9 이상) 출시 여부 확인 후 즉시 적용**\n- 단기: `ld.so.preload`, `liblog.so`, `/migadmin` cron, `archive234`, 비인가 아카이브·전달 규칙 점검. 변조가 확인되면 **제거가 아니라 재구축**을 우선하고, 장비에 저장된 자격 증명·인증서·키 교체\n- 장기: 7.2 → 7.4 이상 이전, 메일 장비 관리면 비노출, 장비 로그 외부 보존\n- 탐지: 장비의 신규 공유 라이브러리·cron 변경, IBE 복호화 시 잘못된 Base64 오류, 위 IOC IP와의 통신\n\n**교훈**: 메일 장비는 모든 메일이 지나가는 곳이다. 침해되면 **메일 내용과 인증 링크** 전부가 노출된다.\n\n### [D20261003-citrix] Citrix NetScaler CVE-2026-88771 / -88772\n> 날짜: 2026-09-27 · 유형: 엣지 장비 취약점 · 행위자: 미귀속 · 지역: 글로벌 · 근거: 확인\n\n**쉽게 말하면**: 회사 원격 접속 장비(NetScaler)의 결함 두 개가 이미 공격에 쓰이고 있습니다. 공개되기 3주 전부터 악용됐다는 관측이 있습니다.\n\n**먼저 할 일(초보용)**: 패치 직전에 가능한 범위에서 로그와 설정을 신속히 보존하고(조사는 병행) 지체 없이 패치한 뒤, 접속 중인 세션을 모두 끊으세요.\n\n**개요**: NetScaler ADC·Gateway의 제로데이 2건이 전 세계에서 악용돼 CISA KEV에 9/27 등재됐다(CISA 공지는 CVE-2026-88771~88778 8건 중 2건이 치명적 제로데이). 벤더 공지는 CTX697096.\n\n**왜 일어났나**\n- 직접 원인 [확인]: -88771은 입력 검증 미흡으로 인증 없이 명령 실행, **기본 구성에서도 영향**. -88772는 DTLS(UDP 기반 TLS) 파싱 코드의 힙 버퍼 오버플로로, DTLS가 VPN 가상 서버에서 기본 활성화되어 있다(영향 버전 범위는 벤더 공지 확인).\n- 구조적 원인: (1) VPN 포털이 인터넷에 직접 노출 (2) 기본 활성 기능이 공격 면이 됨 (3) 장비 내부에 EDR이 없음 (4) 2023 Citrix Bleed 이후에도 같은 제품군에서 반복\n- 악용 시점 [관측: eSentire]: -88771은 **9월 5일부터** 악용돼 KEV 등재(9/27)보다 22일 앞섰다. 벤더 공개일이 이보다 늦었는지는 확인하지 못했다.\n\n**관측된 공격 [확인]**: 인터넷 노출 Gateway에 조작 요청 → 인증 없이 명령 실행 → 웹셸 `/var/netscaler/logon/LogonPoint/custom/.ctxs.receiver`(확장자 없이 PHP 실행) → `/etc/httpd.conf`에서 `php_engine` 활성화(CERT-EU) → 웹셸이 `NSC_CLIENTTYPE` 헤더의 Base64 PHP 코드를 실행. 내부망 진입 가능성은 [추정]이며 후속 이동은 확인된 바 없다.\n\n**어떻게 조치하나**\n- 즉시: **패치 전에** 침해 지표 확인·포렌식 증거(로그·설정·메모리) 보존(CISA 권고), 그다음 패치. 패치 후 **활성 세션 전부 종료**, 장비 저장 자격 증명 교체\n- 단기: 위 웹셸 경로·`php_engine` 설정·`NSC_CLIENTTYPE` 이상 값 점검, 침해 의심 장비는 재구축, NetScaler Console의 IOC 확인\n- 장기: VPN·게이트웨이 앞단 관리면 분리, 엣지 장비 로그 외부 보존, 악용 확인 시 우선 격리·긴급 패치 SLA\n- 탐지: 헤더 `NSC_CLIENTTYPE`에 Base64 문자열, `custom` 디렉터리의 비PHP 확장자 파일, 장비의 비정상 아웃바운드\n\n**교훈**: **패치 전에 증거 보존** — 패치가 아티팩트를 지울 수 있다. 같은 제품이 3년 만에 다시 제로데이다.\n\n### [D20261003-cisco] Cisco SD-WAN Manager CVE-2026-76504\n> 날짜: 2026-09-30 · 유형: 엣지 장비 취약점 · 행위자: 미귀속 · 지역: 글로벌 · 근거: 확인\n\n**쉽게 말하면**: Cisco SD-WAN 관리 화면의 로그인 검사가 주소의 글자 하나를 다르게 쓰면(%6a) 건너뛰어져서 관리자처럼 접속할 수 있었습니다.\n\n**먼저 할 일(초보용)**: 바로 패치(우회 방법이 없습니다)하고, 관리 화면을 인터넷에서 닫으세요.\n\n**개요**: SD-WAN Manager API 인증 우회(CVSS 9.8). Cisco PSIRT가 9월 악용을 인지했고 CISA KEV에 9/30 등재됐다. 올해 Cisco SD-WAN 제어 구성요소의 세 번째 치명적 인증 우회라고 Rapid7이 지적했다.\n\n**왜 일어났나**\n- 직접 원인 [확인: Cisco, Rapid7]: URL 인코딩 처리 오류(CWE-177). 특정 API 엔드포인트의 인증 규칙이 `j_security_check` 경로를 `%6a`(=`j`)처럼 인코딩한 요청에는 적용되지 않고, 요청은 그대로 처리되어 admin 권한 API에 접근된다.\n- 구조적 원인 [추정]: (1) 인증 검사와 라우팅이 서로 다른 단계에서 문자열을 해석 (2) SD-WAN 컨트롤러가 인터넷에 노출 (3) 같은 구성요소의 반복 취약점\n\n**관측된 후속 행위**: 공개 자료에서 **확인되지 않음**. admin API 접근만으로 구성정보 수집이 성립하는 것은 아니다.\n\n**어떻게 조치하나**\n- 즉시: 패치 20.9.10.1 / 20.12.8.2 / 20.15.6.1 / 20.18.4.1 / 26.1.2.1 / 26.2.1 (우회책 없음). KEV 기한 10/3(2차 자료 기준)\n- 단기: Manager 관리면 인터넷 비노출·허용 IP 제한, `serviceproxy-access.log`·`vmanage-server.log`에서 인코딩된 인증 경로 POST와 사용자명 `viptela-reserved-*` 점검, admin 계정·API 키 감사\n- 장기: SD-WAN 컨트롤러를 관리망에만 두기, 구성 변경 승인·감사 로그 외부 보존\n- 탐지: 인코딩된 `j_security_check` 요청, 평소 없던 admin API 호출\n\n**교훈**: **인증 검사 위치와 처리 위치가 다르면** 인코딩 한 글자로 우회된다. 정규화 후 검사.\n\n### [D20261003-wordpress] WordPress CVE-2026-87902\n> 날짜: 2026-09-22 · 유형: 웹 애플리케이션 취약점 · 행위자: 미귀속 · 지역: 글로벌 · 근거: 확인\n\n**쉽게 말하면**: 워드프레스의 결함으로, 특정 조건의 사이트에서는 로그인 없이 서버 코드가 실행됩니다. 패치가 공개된 당일부터 공격이 있었습니다.\n\n**먼저 할 일(초보용)**: 워드프레스를 최신 버전으로 올리고 자동 업데이트를 켜세요.\n\n**개요**: `get_page_template()` 템플릿 해석 로직 결함으로 인증 없이 RCE 가능(CVSS 9.2). 9/22 패치 당일 11:49 UTC에 첫 악용, 9/23~25 허니팟에서 68건 이상, KEV는 9/25.\n\n**왜 일어났나**\n- 직접 원인 [확인: Patchstack 등]: 조작된 요청으로 읽을 수 있는 임의 로컬 `.php`를 include(LFI). KEV는 \"Remote File Inclusion\"으로 분류하지만 이는 KEV의 표현이고, 관측된 흐름은 *로컬 include → PHP 파일 생성 → 원격 스크립트 수령*이다.\n- 선행 조건 [확인]: 활성 테마 최상위 디렉터리명이 `page-`로 시작하고, 웹 서버가 읽을 수 있는 PHP(대표적으로 `pearcmd.php`)가 있을 것. 조건이 좁아 모든 사이트가 영향받지는 않는다.\n- 구조적 원인 [추정]: (1) 서버에 `pearcmd.php` 같은 도구가 남아 있음 (2) 웹 서버 계정이 `/tmp`에 쓸 수 있음 (3) 공개 즉시 자동 악용 스캐너가 대응\n\n**관측된 공격 [확인]**: 조작 요청 → `pearcmd.php` include → `/tmp`·`/var/tmp`에 PHP 파일 쓰기 → GitHub 호스팅 업로드 스크립트 수령 → 웹셸 실행.\n\n**어떻게 조치하나**\n- 즉시: 7.1.2 / 7.0.6 / 6.9.9 / 6.8.10로 업데이트, **자동 업데이트 활성화**\n- 단기: 테마 디렉터리에 `page-` 접두 폴더가 있는지 점검, `/tmp`·`/var/tmp`의 PHP 파일·`wp-pear-rce-flag.php`·`poc87902.php` 점검, 웹 서버의 `/tmp` 쓰기·실행 제한\n- 장기: 컨테이너에서 PEAR 제거(`pearcmd.php` 불필요 시), `open_basedir`·읽기 전용 파일 시스템, 웹셸 탐지\n- 탐지: `/tmp` 아래의 PHP 생성, 웹 서버 프로세스의 외부 다운로드(GitHub)\n\n**교훈**: **패치 공개 = 악용 시작**(몇 시간). 자동 업데이트와 불필요한 도구 제거가 가장 싼 방어다.\n\n### [D20261003-peoplesoft] Oracle PeopleSoft CVE-2026-35273 / ShinyHunters\n> 날짜: 2026-06-10 · 유형: 엣지·ERP 취약점 · 행위자: ShinyHunters(UNC6240) · 지역: 글로벌 · 근거: 확인\n\n**쉽게 말하면**: 대학·기업이 쓰는 PeopleSoft의 결함을 ShinyHunters가 악용했습니다. 방화벽(WAF)의 차단 규칙은 글자 하나를 다르게 쓰는 것만으로 피해 갔습니다.\n\n**먼저 할 일(초보용)**: 방화벽 규칙에 기대지 말고 실제 패치를 적용하세요.\n\n**개요**: PeopleSoft Environment Management Hub(`/PSEMHUB/`)의 인증 없는 RCE(CVSS 9.8). 5/27부터 제로데이로 악용, 6/10 Oracle 공개. Google GTIG는 ShinyHunters를 UNC6240으로 추적하며 6월 기준 100개 이상 조직이 피해를 입었다.\n\n**왜 일어났나**\n- 직접 원인 [확인]: 직렬화 Java 객체를 받는 `/PSEMHUB/hub`의 인증 없는 RCE.\n- WAF 우회 [확인: BleepingComputer]: WAF가 원문 경로 `/PSEMHUB/`를 차단하는데, 공격자는 `/%50SEMHUB/`로 요청한다. WAF는 디코딩 전 문자열을 비교해 놓치고, WebLogic은 디코딩해 취약 엔드포인트로 라우팅한다. **WAF 규칙만으로 막고 있던 조직**이 표적이 된다. 해당 피해 조직들이 실제로 미패치였는지는 확인되지 않았다.\n- 구조적 원인: (1) ERP 관리 구성요소가 인터넷에 노출 (2) **패치 대신 WAF 가상 패치에 의존** (3) 기본 비활성화되지 않은 관리 허브\n\n**관측된 활동 [확인]** (보고된 도구·행위 목록이며 같은 호스트에서 이 순서로 실행됐다는 뜻은 아님): 정찰(직렬화 객체 POST 5~15회), 메모리 내 명령 실행 또는 JSP 웹셸(`x.jsp`, `u.jsp`/`u2.jsp`, `tunnel.jsp`/`.jspx`), Windows: `Ple64.exe`(Light Alloy 위장) → SIDEEYE 백도어, Linux: MeshAgent, Neo-reGeorg SOCKS5 터널, 데이터 탈취 후 공갈.\n\n**FBI 건 [주장: ShinyHunters]**: 9/22 FBIjobs.gov와 AWS GovCloud를 침해해 2~3TB를 가져갔다고 주장. FBI는 FBIjobs.gov의 무단 활동을 조사 중이라고만 밝혔고 침해·유출은 **확인하지 않았다**. 공격자는 WAF 우회 외에 \"새 미공개 취약점\"도 썼다고 주장하나 검증되지 않았다.\n\n**어떻게 조치하나**\n- 즉시: **패치 적용**(WAF 규칙으로 대체 금지), PSEMHUB 접근을 내부망·허용 IP로 제한, 로그에서 `/PSEMHUB/`와 `/%50SEMHUB/` 검색\n- 단기: 웹셸(`x.jsp`, `u.jsp`, `tunnel.jsp*`), `Ple64.exe`, MeshAgent·Neo-reGeorg 흔적 점검, 의심 서버의 자격 증명 교체, 공갈 메일 수신 시 법무·수사기관 연계\n- 장기: ERP 관리 기능 비노출, WAF 규칙을 **디코딩 후 정규화 기준**으로 점검, 정기 침투 테스트\n- 탐지: 정규화 전후 URI 둘 다 로깅, WebLogic에서의 쉘 프로세스·비정상 외부 통신\n\n**교훈**: WAF는 **패치의 대체물이 아니라 시간 벌기**다. 인코딩 한 글자로 규칙이 무너진다.\n\n### [D20261003-zammad] Zammad CVE-2026-102489 / -102490 (DIVD 침해)\n> 날짜: 2026-09-21 · 유형: 웹 애플리케이션 취약점 · 행위자: 미귀속(DIVD는 AI 에이전트형 공격 의혹) · 지역: 글로벌 · 근거: 확인\n\n**쉽게 말하면**: 헬프데스크 소프트웨어 Zammad의 결함 두 개를 이어 로그인 없이 서버 최고 권한(root)까지 얻을 수 있었고, 실제 침해가 있었습니다.\n\n**먼저 할 일(초보용)**: 당시 기준 수정 버전은 7.2.0이며, 지금은 제조사의 최신 보안 버전으로 올리고 기존 로그인 세션을 모두 무효화하세요.\n\n**개요**: 헬프데스크 소프트웨어 Zammad의 세션 고정/하이재킹으로 `zammad` 사용자 권한 RCE(CVE-2026-102489, CVSS 9.4)가 가능하고, 로컬 권한 상승(CVE-2026-102490, CVSS 9.4)으로 root에 이른다. DIVD가 자신의 인스턴스 침해를 조사하다 발견했고 10/2 KEV에 등재(기한 10/5).\n\n**왜 일어났나**\n- 직접 원인 [확인: DIVD, 2차 보도]: 세션 처리 결함으로 인증 없이 세션을 가로채고, 그 권한에서 로컬 권한 상승 결함으로 root 획득.\n- 구조적 원인 [추정]: (1) 헬프데스크 소프트웨어는 인터넷에 노출되고 고객 대화·자격 증명을 다룸 (2) 애플리케이션 계정(`zammad`)에서 root로 가는 경로가 존재 (3) 오픈소스 인스턴스의 느린 업그레이드\n- AI 에이전트 공격 의혹 [추정: DIVD]: 스크립트에 사람이 달지 않을 설명 주석, 수초 내 root 도달, 어설픈 논리를 근거로 \"agentic AI 기반 공격으로 보인다\"고 평가. \"수초\"의 측정 시작점은 확인하지 못했고 귀속 증거가 아니라 정황 판단이다.\n\n**타임라인 [확인]**: 9/21 침해 → 9/22 DIVD 탐지·차단 → 9/24 벤더 신고 → 9/26 영향 인스턴스 통지 → 9/30 공개 → 10/2 KEV. 6.3.0–6.5.4 악용 가능, 7.0.0–7.1.3은 취약 코드가 있으나 \"환경 조건상 악용 불가\"로 보고됨(해당 버전 전체에서 불가능하다는 뜻은 아님). 유출: 자원봉사자 이메일 등.\n\n**어떻게 조치하나**\n- 즉시: **Zammad 7.2.0으로 업그레이드**(기한 10/5), 업그레이드 불가 시 서비스 오프라인·접근 제한\n- 단기: **기존 세션 전부 무효화**, 인증 후 세션 ID 재발급 확인, `zammad` 계정·서버의 신규 계정·SSH 키·cron 점검, 침해 의심 시 서버 재구축\n- 장기: 헬프데스크를 VPN·SSO 뒤로, 애플리케이션 서비스 계정에 sudo·SUID 최소화, 오픈소스 보안 공지 구독\n- 탐지: 세션 쿠키 이상 재사용, 앱 서버의 쉘 실행·root 승격, 대량 티켓 조회\n\n**교훈**: 헬프데스크 시스템은 **사람의 신뢰가 쌓인 곳**이다. 침해되면 사회공학 재료가 된다.\n\n### [D20261003-apple] Apple CoreGraphics CVE-2026-86950\n> 날짜: 2026-09-29 · 유형: 클라이언트 취약점 · 행위자: 미귀속(표적 공격) · 지역: 글로벌 · 근거: 확인\n\n**쉽게 말하면**: 아이폰·맥이 이미지·문서를 그리는 부분의 결함이 소수의 표적에게 악용됐습니다.\n\n**먼저 할 일(초보용)**: 기기를 최신 보안 업데이트로 올리세요. 표적이 될 위험이 큰 사람은 Lockdown Mode를 고려하세요.\n\n**개요**: CoreGraphics의 범위 초과 쓰기로 조작된 파일 처리 시 코드 실행 가능. Apple은 \"극도로 정교한 공격\"에서 특정 개인을 겨냥한 악용을 인지했다고 밝혔고 Meta Product Security가 신고했다. KEV 9/29.\n\n**왜 일어났나**\n- 직접 원인 [확인: Apple]: 렌더링 코드의 경계 검사 부족(범위 초과 쓰기). iOS/iPadOS 26.7.1 미만, macOS Tahoe 26.7.1 미만, macOS Sequoia 15.8.1 미만이 영향.\n- 구조적 원인 [추정]: 이미지·PDF 같은 복잡한 포맷 파서의 메모리 안전성 한계, 메시징 앱을 통한 파일 자동 처리.\n- 전달 경로 [추정: 일부 보도의 가설]: WhatsApp PDF 전달 가능성이 거론되나 정황 수준이다. 공개 PoC는 제어된 범위 초과 쓰기만 보여주고 코드 실행은 시연하지 않는다.\n\n**어떻게 조치하나**\n- 즉시: iOS/iPadOS·macOS 최신 보안 업데이트 적용, 자동 업데이트 켜기\n- 단기: 표적 공격 위험이 높은 사용자는 **Lockdown Mode** 사용 검토, 출처 불명 첨부파일 열람 최소화, 의심 시 기기 점검·조사\n- 장기: MDM으로 OS 업데이트 강제·최소 버전 정책, 고위험 인원 별도 관리\n- 탐지: MDM·EDR의 OS 버전 준수율, 비정상 크래시(렌더링 프로세스) 이력\n\n**교훈**: 클라이언트 제로데이는 **업데이트 속도가 유일한 방어**다. 고위험 사용자는 기능을 줄여라.\n\n### [D20261003-dmdc] 미 국방부 DMDC 유출\n> 날짜: 2026-07-16 · 유형: 파일 공유 시스템·대규모 개인정보 · 행위자: 미귀속 · 지역: 미국 · 근거: 보도\n\n**쉽게 말하면**: 미국 국방부 인사 정보 시스템의 파일 공유 서비스 결함으로 약 305만 명의 정보가 노출됐다고 보도됐습니다.\n\n**먼저 할 일(초보용)**: 파일 공유 서비스의 패치·공개 범위·접근 권한을 먼저 점검하고, 주민번호 같은 민감한 번호는 최소한만 저장하며 암호화하고, 접속 기록을 오래 보관하세요.\n\n**개요**: 파일 공유 시스템 취약점으로 2025-10부터 2026-07-16 발견 시까지 무단 접근이 있었다(보고된 침해 기간 약 9개월). 생존자 276만 명과 사망자 29만 4천 명 등 약 305만 명이 영향을 받았고, 유출 데이터에 이름·생년월일·연락처와 **암호화되지 않은 SSN**이 포함됐다고 보도됐다.\n\n**왜 일어났나**\n- 직접 원인: 취약점(제품·CVE)은 공개되지 않았다.\n- 구조적 원인: 침해 기간이 길었다는 사실만으로 연속 접근이나 \"미탐지\"를 단정할 수 없고, 유출 데이터가 평문이었다는 것이 원본 시스템의 저장 방식을 뜻하는지도 확인되지 않았다. 확인되는 구조는 (1) 인터넷 접점의 파일 공유 시스템 (2) 침해 기간이 약 9개월 (3) 유출 데이터에 평문 SSN이 포함됐다는 보도 정도다.\n\n**어떻게 조치하나** (원인 미공개로 일반 권고)\n- 즉시: 영향 대상 통지·신용 모니터링, 파일 공유 시스템 패치·접근 제한\n- 단기: SSN 등 민감 필드 암호화·토큰화, 대량 다운로드 감사, 소급 가능한 로그 보존 여부 확인(보존이 짧으면 \"IOC 없음\" 판단의 신뢰도가 낮다)\n- 장기: 데이터 최소 수집·보유기간, 파일 공유 시스템의 인터넷 비노출, 접근 통제·권한 분리\n- 탐지: 평소와 다른 대량 파일 조회, 비정상 시간대 접근\n\n**교훈**: 민감정보는 **저장 순간부터 보호**해야 한다. 기간이 길수록 피해 산정이 어려워진다.\n\n## 3. 교차 분석 — 선정한 8건에서 보이는 패턴\n\n> 표본은 이번 주 눈에 띈 8건이며 전체 공격의 분모는 아니다. 아래는 추세 단정이 아니라 선정 사례의 공통점이다.\n\n1. **URL 디코딩·정규화 불일치 2건 + 유사 가능성 1건**: Cisco(`%6a`)와 PeopleSoft(`%50`)는 설명상 URL 디코딩 시점 차이로 인증 규칙·WAF 규칙을 피한 사례다. FortiMail은 널 바이트 처리 취약점으로 검증과 사용 단계의 해석 차이일 가능성은 있으나 같은 메커니즘임은 확인되지 않았다. 공통 교훈은 *디코딩 후 검사하고 검사한 값 그대로 사용*하는 구조이며, 시그니처 기반 WAF만으로는 한계가 있다는 점이다.\n2. **인터넷에 노출된 장비·서비스의 악용 반복**: FortiMail, NetScaler, SD-WAN Manager, PeopleSoft, Zammad가 모두 인터넷 접점이다. EDR 설치가 어려운 장비가 많고 침해 시 내부망 진입점이 될 수 있다.\n3. **패치 전 악용과 패치 직후 악용이 함께 관측**: Citrix는 KEV 등재 22일 전부터, WordPress는 패치 당일 악용됐다. PeopleSoft는 6/10 공개 후에도 WAF에 의존한 시스템이 표적이 됐다(속도와 운영 지연은 서로 다른 문제다).\n4. **자동화·AI 정황은 단일 사례**: Zammad의 DIVD 평가가 맞다면 취약점 연쇄 악용이 자동화되는 신호이나 아직 한 건의 정황 판단이다.\n5. **침해 기간이 긴 사례**: DMDC는 보고된 침해 기간이 약 9개월. 로그 보존, 파일 공유 시스템 감사, 민감정보 보호가 쟁점이다.\n\n과거 3년 사건과의 연결은 [../과거3년/99-총평.md](../과거3년/99-총평.md)에 있다.\n\n## 4. 침투 경로 종합 (선정 사례의 공통 흐름)\n\n```\n[정찰: 인터넷 스캔]\n   └→ T1190 노출된 장비/웹 앱 악용 (인증 없이)\n        ├ 인코딩 불일치 (Cisco %6a / PeopleSoft %50 / FortiMail 널 바이트)\n        └ 입력 검증·메모리 결함 (Citrix, Zammad, WordPress)\n   └→ 지속성: T1505.003 웹셸 / T1053.003 cron / (FortiMail) T1574.006 로더 변조\n   └→ C2: T1071.001, T1572·T1090 터널링, T1219 원격 관리 도구\n   └→ (일부) 내부 이동 → 데이터 탈취 → T1657 공갈 (ShinyHunters)\n```\n\n## 5. 우선 대응 체크리스트\n\n**패치와 침해 대응은 별개의 완료 조건이다.** 패치만으로 이미 설치된 웹셸·로더 변조·탈취된 인증 자료는 사라지지 않는다.\n\n1. **오늘**: Cisco SD-WAN(KEV 기한 10/3) 패치. Citrix는 패치 **전** 로그·설정·메모리 증거 보존 및 IOC 점검 후 패치.\n2. **10/5까지**: Zammad 7.2.0(기한 10/5). 패치와 함께 기존 세션 무효화, 인증 후 세션 ID 재발급 동작 확인. WordPress 최신 보안 릴리스, PeopleSoft 패치 확인.\n3. **관리 평면 노출 점검**: FortiMail·NetScaler·SD-WAN 관리 인터페이스, PSEMHUB가 인터넷에 꼭 열려 있어야 하는지 확인하고 허용 출발지를 제한.\n4. **FortiMail**: IBE 비활성화, 관리 인터페이스를 신뢰 대역으로 제한, `ld.so.preload`·`archive234`·`/migadmin` cron 점검, 비인가 아카이브 계정·전달 규칙 조사, 수정 버전 출시 여부 확인. 변조가 확인되면 제거보다 재구축 우선.\n5. **헌팅**: WebLogic·프록시 로그의 `/PSEMHUB/`와 `/%50SEMHUB/`, 인코딩된 `j_security_check`, `NSC_CLIENTTYPE` 이상 값, `/tmp`·`/var/tmp`의 PHP 파일. 파일명 IOC만 보지 말고 **원문 URI와 실제 처리 경로를 함께 로깅**하고 `%6a`·`%50` 문자열 차단에만 의존하지 않는다.\n6. **행위 탐지**: 동적 링커 설정·공유 라이브러리·cron·웹 실행 설정 변경, 웹 프로세스의 파일 생성·자식 프로세스·예상 밖 외부 통신. MeshAgent 같은 합법 원격 도구는 승인 기준과 비교.\n7. **Apple**: OS 업데이트 적용 상태 확인. 표적 공격 가능성이 있는 사용자는 별도 조사 절차 검토.\n8. **데이터 보호**: 민감정보(SSN 등) 최소 수집·보유기간·암호화·대량 다운로드 감사, 각 사건의 최초 악용일까지 소급 가능한 로그 보존 여부 확인.\n\n## 6. 검증 수준과 한계\n\n- CVE 정보는 CISA KEV, 벤더 권고(Fortinet, Citrix, Cisco), 연구기관(Rapid7, Google GTIG, eSentire, DIVD) 및 2차 보도에서 교차 확인했다. 버전·날짜 등 세부는 2차 자료에 의존한 항목이 있어 **조치 전 벤더 원문 재확인 필요**.\n- **제외한 항목**: Supabase 대량 설정 오류, AI 음성 복제 결제 사기(Fideuram), KillSec 검거, Tokyo Metro·Keio 사건, Zscaler 랜섬웨어 통계(+275.8%)는 단일 2차 요약에서만 확인되어 1차 검증을 마치지 못했다.\n- FBI 침해 건은 공격자 주장이며 확인되지 않았다.\n- 독립 검토: GPT(Codex) 검토를 받아 ATT&CK v19.2 전술 분류 교정, 관측과 추정의 분리, 단정 완화, 방어 항목 보강을 반영했다. ATT&CK 전술은 공식 사이트에서 직접 재확인했다.\n\n## 출처\n\n- CISA KEV 카탈로그, CISA 알림(10/1 FortiMail, 9/27 Citrix, 10/2 Zammad)\n- Fortinet FortiMail 0-day 보도(cybersecuritynews), Citrix 보안 공지 CTX697096, eSentire/Unit 42/watchTowr Citrix 분석\n- Rapid7, Horizon3, SOC Prime의 Cisco SD-WAN CVE-2026-76504 분석\n- The Hacker News / SecurityWeek / Patchstack의 WordPress CVE-2026-87902\n- Google GTIG / BleepingComputer / Arctic Wolf / eSentire의 PeopleSoft CVE-2026-35273\n- DIVD / SecurityOnline의 Zammad 분석\n- The Hacker News / eSecurityPlanet의 Apple CoreGraphics 분석\n- Federal News Network / Security Affairs의 DMDC 유출 보도\n- MITRE ATT&CK v19.2 (attack.mitre.org)\n"},{"path":"일일/2026-10-06-국내보충.md","title":"국내 보안 이슈 보충 — 2026-10-06","md":"# 국내 보안 이슈 보충 — 2026-10-06\n\n> 이 문서는 해외 이슈 위주로 정리하던 일일 보고서에서 **빠졌던 국내 이슈**를 보충한 것이다(수집 기간: 2026-09-18 ~ 10-06). 해외 이슈는 `2026-10-03.md`와 `2026-10-06.md`를 본다. 티빙 사건은 [과거3년/2026.md](../과거3년/2026.md)에 있다.\n> 근거 표기: **[확인]** 정부·금융당국·해당 기관이 밝힌 내용 / **보도** 언론 보도 / **[추정]** 본 보고서 / **[주장]** 일방 주장. 구조적 원인은 본 보고서의 분석이다. **조치는 본 보고서의 권고**이며 기관 공식 지침이 우선하고, 모든 '즉시' 조치는 증거(로그·메모리·디스크·클라우드 감사 기록)를 신속히 보존하되 패치를 미루지 않으며 침해된 시스템에서 새 비밀을 발급하지 않는다.\n\n## 1. 오늘의 요약\n\n| # | 이슈 | 규모 | 상태 |\n|---|------|------|------|\n| 1 | 금융권 동시다발 해킹 (신한·KB·하나·BNK부산·예가람·현대캐피탈·웰컴) | 7곳, 기관별 발표 합산 약 6.6만 명 + 법인정보 2,200건 | 조사 중, 금융당국 10/4 긴급 소집 |\n| 2 | 한국전력 전 직원 정보 노출 | 약 2.4만 명(7개 항목) | 삭제 완료, 경위 조사 중 |\n| 3 | 서울사이버대 개인정보 유출 | 규모·시점 조사 중 | KISA 통보 10/4 |\n| 4 | 외교부(국립외교원 온라인교육시스템) 개인정보 유출 | 최대 1만 건 | 인지 2026-02, 책임 조치 없음 보도(10/6) |\n\n## 2. 이슈별 분석\n\n### [D20261006-finsector] 금융권 동시다발 해킹 (AI 자동화 공격 정황)\n> 날짜: 2026-09-29 · 유형: 다수 금융사·자동화 공격 · 행위자: 미귀속(연관성 조사 중) · 지역: 한국 · 근거: 보도\n\n**쉽게 말하면**: 9월 말부터 10월 초 사이 금융사 7곳에서 개인정보 유출이 보고됐습니다. 같은 공격자의 IP가 여러 곳에서 발견돼 서로 연관된 공격인지 조사 중이고, 일부 사건에서 AI 도구의 흔적이 보도됐지만 실제로 쓰였는지는 공식 확인되지 않았습니다.\n\n**먼저 할 일(초보용)**: 이용자는 금융사 안내를 확인하고, 대출·한도를 미끼로 한 의심 전화·문자를 조심하세요. 담당자는 대출 조회·업무 지원·영업 지원처럼 바깥에서 접속하는 업무 시스템의 인증과 접근 통제, 이상 접속 탐지부터 점검하세요.\n\n**개요**: 피해 금융사와 규모는 보도 기준으로 신한은행 25,729명(9/29~30 발생, 이름·전화번호·연소득·대출 산출한도 등, 일부는 주민등록번호 66건·연계정보 97건 포함), 예가람저축은행 약 4만 명, KB국민은행 119명(9/30 밤, 직원용 모바일 업무지원 시스템), 하나은행 89명(영업지원시스템 ODS), 현대캐피탈 146명(대출모집인), BNK부산은행 11명(외주 개발 직원), 웰컴저축은행 법인정보 최대 2,200건이다. 기관별 발표 인원을 단순 합산하면 약 6.6만 명이며 기관 간 중복 여부는 확인되지 않았다(법인정보는 별도). 금융위원회와 금융감독원은 **10/4 오후 2시 정부서울청사에서 전 금융권 협회장과 피해 금융사 최고경영자를 긴급 소집**했다. 금융감독원·금융보안원이 같은 공격자 IP를 공유하며 추가 피해를 찾고 있다고 보도됐다. 피해 인원은 계속 갱신될 수 있다.\n\n**왜 일어났나**\n- 직접 원인 [보도: 각 금융사 보고]: **대출 조회, 업무 지원 서비스, 영업지원시스템** 같은 외부 접점 서비스가 공격 통로로 보고됐다. 구체적인 취약점(CVE 등)이나 침투 방법은 공개되지 않았다.\n- AI 정황 [보도, 미확정]: 신한 관련 공격 서버에서 오픈소스 LLM 기반 자율 침투 테스트 도구 'ARTEX'의 흔적이 발견됐다는 보도가 있다. 그러나 **실제로 쓰였는지는 공식 확인되지 않았고**, 공개 도구라 흔적만으로 공격자를 특정하기 어렵다. 보안업체의 특정 재현 환경에서는 대상 작업이 22초, 약 0.88달러로 가능했다고 보도됐으나 이는 실제 사건의 소요 시간·비용이 아니다. BNK부산은행은 10/1 밤 AI 에이전트를 이용한 웹서버 공격 시도가 있었고 대부분 차단됐으나 후속 점검에서 외주 직원 정보 유출이 확인됐다(보도). 공통 IP는 연관성의 단서일 뿐 동일 공격자의 확정 근거는 아니다.\n- 구조적 원인(분석, 추정): (1) 보조 업무 시스템(모집인·외주·영업지원)의 인증·접근 통제가 약했을 가능성 (2) 조회 서비스가 주민등록번호 같은 민감정보를 다룸 (3) 자동화 공격의 속도에 비해 탐지·차단이 늦을 수 있음 (4) 금융사 간 공격 정보 공유 시차\n\n**침투 경로 [추정: 중간 단계 미공개]**: 외부 접점 업무 시스템 공격 → 고객 정보 조회·추출 → (BNK부산은행 일부 사례) 유출 자료를 외부 사이트에 올림(위키 서술, 미확인)\n\n**어떻게 조치하나**\n- 즉시: 증거 보존 후 금융보안원이 공유한 공격자 IP 차단과 과거 로그 소급 조회(IP는 바뀔 수 있으므로 요청 패턴·파일 흔적 같은 다른 지표를 함께 사용), 영향 시스템 격리·계정 재설정, 피해자·모집인 통지와 2차 피해(대출 사기) 안내\n- 단기: 외부 접점 업무 시스템 전수 점검(인증, 접근 IP 제한, 요청 속도 제한), 사용자별 조회 권한·서비스 계정 최소 권한·API 인증/인가 점검, 모집인·외주 계정에 2단계 인증, 대량 조회·순차 식별자 조회 알림, 웹서버 취약점 점검과 WAF 로그 소급 분석\n- 장기: 조회 화면의 개인정보 최소화·마스킹, 봇·자동화 공격 탐지, AI 기반 공격을 가정한 모의훈련, 금융권 위협 정보 실시간 공유, 외주 업체 보안 점검\n- 탐지: 같은 IP·ASN이 여러 금융사에 접속, 사람이 하기 어려운 속도의 반복 요청, 평소와 다른 조회량\n\n**교훈**: 공격 통로가 대출 조회·영업지원 같은 **보조 업무 시스템**으로 보고됐고, 공격은 여러 회사를 잇달아 노렸다. 한 곳이 당하면 다른 곳의 IP·수법 정보를 바로 공유해야 한다.\n\n### [D20261006-kepco] 한국전력 전 직원 개인정보 외부 노출\n> 날짜: 2026-10-01 · 유형: 정보 노출 · 행위자: 미확인(해킹 여부 미확인) · 지역: 한국 · 근거: 보도\n\n**쉽게 말하면**: 한국전력 전 직원 약 2만 4천 명의 이름·연락처·이메일·직위 등이 외부 웹페이지에 올라와 있었습니다. 국정원이 먼저 발견해 알렸고 약 32시간 뒤 삭제됐습니다. 한전은 주민번호·주소 같은 민감정보와 고객 정보는 노출되지 않았다고 밝혔습니다. 해킹인지 실수인지는 아직 확인되지 않았습니다.\n\n**먼저 할 일(초보용)**: 직원은 한전·협력사를 사칭한 피싱 메일·문자를 조심하세요. 담당자는 노출 경위가 해킹인지 설정 실수인지 밝혀질 때까지 관련 접근 기록을 보존하고, 같은 식으로 공개된 페이지가 더 없는지 점검하세요.\n\n**개요**: 한전은 10/1 오후 4시경 전 직원(약 2만 4천 명)의 정보 7개 항목이 특정 외부 웹페이지에 노출됐다고 밝혔고, 국정원이 처음 발견해 통보한 뒤 10/3 새벽 0시경 삭제가 끝났다(보도). 같은 사건을 다룬 [2026-10-06.md](2026-10-06.md)의 초기 정리는 이 문서로 통합했다.\n\n**왜 일어났나**\n- 직접 원인: **노출 경위는 조사 중**이며 외부 공격인지 내부 설정·관리 실수인지는 확인되지 않았다.\n- 구조적 원인(분석, 추정): 외부에 공개된 자기 정보를 찾는 점검이 있었는지는 공개되지 않았다. 국정원 통보로 알게 됐다는 사실은 확인되지만 자체 탐지 여부는 알 수 없다.\n\n**어떻게 조치하나**\n- 즉시: 노출 페이지 삭제(완료)와 함께 게시·접근 로그 보존, 검색 캐시까지 삭제됐는지 확인, 직원 대상 2차 피해(사칭) 주의 안내\n- 단기: 노출 경위 확인, 외부 검색엔진·유출 사이트에 우리 정보가 올라와 있는지 정기 점검\n- 장기: 전사 개인정보 공개 기준과 승인 절차, 외부 노출 자산 모니터링, 삭제 요청 절차의 시간 목표 설정\n- 탐지: 내부 명단 형식의 데이터가 외부 공개 페이지·게시판에 올라오는지 감시\n\n**교훈**: 직원 명단은 **사칭 피싱의 재료**다. 알게 된 뒤 삭제까지 걸리는 시간이 피해를 좌우한다.\n\n### [D20261006-seoulcyber] 서울사이버대 개인정보 유출\n> 날짜: 2026-10-04 · 유형: 개인정보 유출 · 행위자: 미귀속 · 지역: 한국 · 근거: 보도\n\n**쉽게 말하면**: KISA(한국인터넷진흥원)가 학교 구성원의 개인정보로 보이는 자료가 외부 사이트에 올라와 있다고 알려 왔고, 학교는 성명·학번·연락처·주소 등이 유출된 것으로 확인했습니다. 주민번호·비밀번호·계좌번호는 암호화된 채 유출됐고, 발표 시점까지 풀린 정황은 확인되지 않았다고 학교는 설명합니다. 규모와 시점은 조사 중입니다.\n\n**먼저 할 일(초보용)**: 재학생·졸업생·교직원은 학교 공지를 확인하고, 학교를 사칭한 문자·전화를 조심하며, 같은 비밀번호를 쓰는 다른 서비스도 바꾸세요. 담당자는 암호화 키가 함께 유출됐는지부터 확인하세요.\n\n**개요**: 학교는 10/4 KISA로부터 외부 사이트 게시 통보를 받았다. 유출 항목은 성명, 학번, 생년월일, 연락처, 이메일, 주소, 학과, 학적 상태, 입학·학력 정보 등이다(보도).\n\n**왜 일어났나**\n- 직접 원인: 유출 경로는 공개되지 않았다. 규모·시점은 조사 중이다.\n- 구조적 원인(분석): 공개된 정보만으로는 구조적 원인을 판단하기 어렵다. KISA 통보로 사건을 확인했다는 점만 확인되며, 자체 탐지 여부와 통보 전 인지 경위는 공개되지 않았다.\n\n**어떻게 조치하나**\n- 즉시: 증거 보존, 유출 자료 확인·삭제 요청, 구성원 통지와 2차 피해(사칭 전화) 안내\n- 단기: 암호화 키 노출 여부와 복호화 가능성 점검, 웹·학사 시스템 접근 로그 소급 분석, 외부 노출 자산과 관제 대상 목록 대조, 로그 수집 누락·보존 기간 점검\n- 장기: 학사 정보 최소 보관·파기, 외부 유출 모니터링, 보안 인력·예산 확충\n- 탐지: 외부 유출 사이트 모니터링, 학사 DB의 대량 조회\n\n**교훈**: **암호화는 키가 지켜질 때만 의미**가 있다. 암호문이 유출됐다는 것과 보호 효과가 사라졌다는 것은 다르므로 키 유출 여부를 먼저 확인한다.\n\n### [D20261006-mofa] 외교부(국립외교원 온라인교육시스템) 개인정보 유출\n> 날짜: 2026-02-01 · 유형: 장기 체류·개인정보 · 행위자: 미귀속 · 지역: 한국 · 근거: 보도\n\n**쉽게 말하면**: 국립외교원 온라인교육시스템이 2025년 4~5월에 장악당해 약 10개월 동안 접근이 이어졌고, 현직·전직 외교부 직원 최대 1만 건의 정보(이름·아이디·이메일·암호화된 비밀번호 등)가 유출됐습니다. 외교부는 2026년 2월 초에 알았고, 국회 의원실 자료에 따르면 보도 시점(10/6)까지 책임자에 대한 인사·감찰 조치가 없었습니다.\n\n**먼저 할 일(초보용)**: 해당 시스템 이용자는 같은 비밀번호를 쓰는 다른 서비스도 바꾸고 외교·공무 사칭 메일을 조심하세요. 담당 기관은 방화벽이 열린 경위와 보안관제에서 빠진 이유를 조사해 재발 방지부터 하세요.\n\n**개요**: 보도에 따르면 공격자가 2025년 4~5월 서버를 장악한 뒤 2026년 2월까지 약 10개월간 접근했고 외교부는 2월 초 사실을 인지했다. 국회 의원실(안철수 의원) 자료로는 방화벽 개방 경위, 보안관제 대상에서 제외된 이유, 손해배상 책임 판단이 아직 마무리되지 않았고 인사·감찰 조치도 없다(2026-10-06 보도).\n\n**왜 일어났나**\n- 직접 원인: 서버 장악 경로는 공개되지 않았다. **방화벽이 열린 경위와 보안관제 제외 사유가 조사 중**이다.\n- 구조적 원인(분석, 추정): 해당 시스템이 보안관제 범위 밖에 있었을 가능성, 약 10개월 동안 접근을 발견하지 못한 점은 조사 쟁점이다. 인사·감찰 조치가 없다는 것이 사고 대응 전체의 부재를 뜻하지는 않는다.\n\n**어떻게 조치하나**\n- 즉시: 시스템 격리·재구축 판단, 접근 로그 보존, 이용자 통지와 비밀번호 변경 안내\n- 단기: 보안관제 대상 자산 목록 전수 점검(교육·부속 시스템 포함), 방화벽 정책 재검토, 로그 수집 누락·보존 기간·경보 처리 여부 점검\n- 장기: 장기 침해 대비 위협 헌팅, 로그 보존 기간 확대, 사고 책임·재발 방지 절차 정립\n- 탐지: 관제 목록에 없는 서버의 외부 통신, 장기간 낮은 빈도의 반복 접근\n\n**교훈**: 중요하지 않다고 본 **부속 시스템**이 관제에서 빠져 있으면 10개월도 못 볼 수 있다.\n\n## 3. 교차 분석 — 이번에 확인한 국내 사건에서 보이는 점\n\n> 표본은 사건 4건(티빙 포함 시 5건)이며 대표성이 없다. 추세가 아니라 관찰이다.\n\n1. **보조·부속 시스템이 점검 대상으로 드러났다**: 금융권은 대출 조회·영업지원 같은 업무 시스템이, 외교부는 교육 시스템이 대상이었다. 티빙·서울사이버대·한전은 최초 침투 지점이 공개되지 않았다.\n2. **외부 통보로 알게 된 사례가 있다**: 한전(국정원)과 서울사이버대(KISA)는 외부 기관 통보로 확인했다. 자체 탐지 여부는 공개되지 않았으므로 '탐지 실패'로 단정하지 않는다. 외교부는 약 10개월간 접근을 발견하지 못한 것이 조사 쟁점이다.\n3. **키와 암호화의 한계**: 티빙은 접속키와 암호화 키가 함께 유출돼 보호 효과가 약해졌다. 서울사이버대는 암호화된 채 유출됐고 발표 시점까지 복호화 정황이 확인되지 않았다. 두 사례를 같은 실패로 묶지 않는다.\n4. **자동화 공격 정황은 보도 수준**: 금융권 사건에서 AI 도구 흔적이 보도됐으나 확정이 아니며, 일곱 곳 전체에 적용할 수 없다.\n\n## 4. 우선 대응 체크리스트\n\n1. **외부에서 접속되는 보조 업무 시스템 목록**을 만들고 인증(2단계), 접근 IP, 요청 속도 제한, 서비스 계정 최소 권한을 점검한다.\n2. **우리 정보가 밖에 있는지 스스로 찾는다**: 외부 사이트 모니터링, 대량 조회·반출 알림. 외부 통보에만 기대지 않는다.\n3. **키 관리**: 접속키·암호화 키를 코드·개발 PC에 두지 말고 전용 보관소에서 관리하고 정기 교체. 데이터 접근 권한과 키 관리 권한을 분리한다.\n4. **관제 대상 자산 전수 점검**: 교육·부속·외주 시스템과 로그 수집 누락을 확인한다.\n5. **금융권**: 공유된 공격자 IP를 소급 조회하되 다른 지표도 함께 쓰고, 외주·모집인 계정을 점검한다.\n6. **개인정보 보유 기간**: 휴면·탈퇴 정보의 보유 목적·기간과 파기 의무 준수를 점검한다(티빙 사건).\n\n## 5. 검증 수준과 한계\n\n- 금융권 사건의 피해 규모는 파이낸셜뉴스(10/4) 보도의 기관별 발표 합산이며, 금융사별 공식 발표와 다를 수 있고 기관 간 중복은 확인되지 않았다.\n- AI 도구(ARTEX) 사용은 **확정되지 않았다**. 'ARTEX' 흔적과 22초·0.88달러 재현 결과는 보도 기준이다.\n- 금융권 사건의 날짜별 타임라인 일부(예가람 9/18 최초 침해 등)는 위키 서술이라 확인하지 않았다.\n- 한전·서울사이버대·외교부는 경위가 공개되지 않아 ATT&CK 매핑을 하지 않았다.\n- 이 문서는 해외 이슈를 다루지 않는다.\n- 독립 검토(GPT): 비민감 요약으로 한 번 받아 단정 완화, 매핑 조정(근거 없는 항목 제외), 조치 보강을 반영했다.\n\n## 출처\n\n- 파이낸셜뉴스(10/4) 금융사 7곳 피해 집계, 한국일보(10/3) 2금융권 확산·금융당국 긴급 소집, 디지털타임스·이데일리·전자신문·서울신문 AI 자동화 공격 정황 보도\n- YTN·MBC·국제뉴스 한국전력 직원 정보 노출 보도, 헤럴드경제·국제뉴스·데일리안 서울사이버대 보도, 데일리안(10/6) 외교부 보도\n"},{"path":"일일/2026-10-06.md","title":"일일 보안 이슈 분석 — 2026-10-06","md":"# 일일 보안 이슈 분석 — 2026-10-06\n\n> 수집 기준: 2026-10-04 ~ 10-06 공개분(10-03 보고서 이후 공백일 포함). CISA KEV 신규 등재와 1차 출처·보도를 우선했다. 이미 [2026-10-03 보고서](2026-10-03.md)에 있는 사건은 중복 작성하지 않았다.\n> 근거 표기: **[확인]** 벤더·CISA·연구기관·정부가 직접 확인 / **보도** 언론 보도 / **[추정]** 본 보고서의 추정 / **[주장]** 공격자 일방 주장. **조치는 본 보고서의 권고**이며 벤더 공식 지침이 우선한다. 모든 '즉시' 조치는 증거(로그·메모리·디스크·클라우드 감사 기록)를 신속히 보존하되 패치를 미루지 않으며, 침해된 장비·계정에서 새 비밀을 발급하지 않는다. 수정 버전 번호는 작성 당시 기준이므로 최신 보안 버전을 확인한
