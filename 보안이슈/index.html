*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.65 system-ui,-apple-system,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
.side{background:var(--panel);border-right:1px solid var(--border);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-weight:700;font-size:16px;padding:4px 10px 14px}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.nav a{display:block;padding:8px 10px;border-radius:8px;color:var(--text);margin-bottom:2px}
.nav a:hover{background:var(--mute-soft);text-decoration:none}
.nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.main{min-width:0}
.top{display:flex;gap:10px;align-items:center;padding:12px 24px;border-bottom:1px solid var(--border);background:var(--panel);position:sticky;top:0;z-index:5}
.top input{flex:1;max-width:560px;padding:9px 12px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text)}
.btn{border:1px solid var(--border);background:var(--panel);border-radius:8px;padding:7px 12px}
.btn:hover{background:var(--mute-soft)}
#view{padding:24px;max-width:1400px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:18px;margin:26px 0 10px}h3{font-size:16px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 18px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:28px;line-height:1.2}.stat span{color:var(--muted);font-size:13px}
.bar{display:grid;grid-template-columns:190px 1fr 34px;gap:8px;align-items:center;font-size:13px;margin:5px 0}
.bar i{display:block;height:10px;background:var(--accent);border-radius:5px;min-width:3px}
.bar span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;border:1px solid transparent;white-space:nowrap}
.tag.ok{background:var(--ok-soft);color:var(--ok)}.tag.warn{background:var(--warn-soft);color:var(--warn)}.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.info{background:var(--info-soft);color:var(--info)}.tag.mute{background:var(--mute-soft);color:var(--mute)}
.chip{display:inline-block;font:12px/1.5 ui-monospace,Consolas,monospace;padding:0 7px;border-radius:6px;background:var(--accent-soft);color:var(--accent);margin:2px 4px 2px 0}
.chip:hover{text-decoration:none;filter:brightness(.95)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px;align-items:center}
.filters select{padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--panel);color:var(--text)}
.pill{border:1px solid var(--border);background:var(--panel);border-radius:999px;padding:4px 12px;font-size:13px}
.pill.on{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.list{display:grid;gap:10px}
.inc{display:block;color:inherit;cursor:pointer}.inc:hover{border-color:var(--accent);text-decoration:none}
.inc .d{font:12px ui-monospace,Consolas,monospace;color:var(--muted)}
.inc .m{color:var(--muted);font-size:13px;margin:2px 0 4px}
.back{display:inline-block;margin-bottom:12px}
.metas{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 16px}.metas .tag{white-space:normal}
.sec{border-left:4px solid var(--border);background:var(--panel);border-radius:0 10px 10px 0;padding:6px 16px;margin:10px 0}
.sec p,.sec ul{margin:6px 0}
.s-why{border-left-color:var(--warn)}.s-path{border-left-color:var(--bad)}.s-fix{border-left-color:var(--ok)}.s-less{border-left-color:var(--info)}.s-over{border-left-color:var(--accent)}

.doc table,.sec table{border-collapse:collapse;display:block;overflow-x:auto;max-width:100%;margin:10px 0}
.doc th,.doc td,.sec th,.sec td{border:1px solid var(--border);padding:6px 10px;vertical-align:top;text-align:left;font-size:14px}
.doc th,.sec th{background:var(--mute-soft)}
code{font:13px ui-monospace,Consolas,monospace;background:var(--mute-soft);padding:1px 5px;border-radius:5px}

.col h3{position:sticky;top:0;background:var(--bg);padding:6px 4px;font-size:13px;line-height:1.3;margin:0}

"name":"Exfiltration Over Other Network Medium"},{"ta":"TA0010","id":"T1052","name":"Exfiltration Over Physical Medium"},{"ta":"TA0010","id":"T1567","name":"Exfiltration Over Web Service"},{"ta":"TA0010","id":"T1029","name":"Scheduled Transfer"},{"ta":"TA0010","id":"T1537","name":"Transfer Data to Cloud Account"},{"ta":"TA0040","id":"T1531","name":"Account Access Removal"},{"ta":"TA0040","id":"T1485","name":"Data Destruction"},{"ta":"TA0040","id":"T1486","name":"Data Encrypted for Impact"},{"ta":"TA0040","id":"T1565","name":"Data Manipulation"},{"ta":"TA0040","id":"T1491","name":"Defacement"},{"ta":"TA0040","id":"T1561","name":"Disk Wipe"},{"ta":"TA0040","id":"T1667","name":"Email Bombing"},{"ta":"TA0040","id":"T1499","name":"Endpoint Denial of Service"},{"ta":"TA0040","id":"T1657","name":"Financial Theft"},{"ta":"TA0040","id":"T1495","name":"Firmware Corruption"},{"ta":"TA0040","id":"T1490","name":"Inhibit System Recovery"},{"ta":"TA0040","id":"T1498","name":"Network Denial of Service"},{"ta":"TA0040","id":"T1496","name":"Resource Hijacking"},{"ta":"TA0040","id":"T1489","name":"Service Stop"},{"ta":"TA0040","id":"T1529","name":"System Shutdown/Reboot"}],"incidents":[{"id":"INC-2023-10-okta","title":"Okta 고객지원 시스템 침해","file":"과거3년/2023-Q4.md","date":"2023-10-20","type":"서드파티·신원(IdP)","actor":"미귀속","region":"글로벌","evidence":"확인","easy":"로그인 서비스 회사(Okta)의 고객지원 창구에 올라온 '문제 해결용 파일' 안에 로그인 상태 정보가 들어 있었고, 공격자가 이를 훔쳐 다른 회사 시스템에 몰래 들어갔습니다. 비밀번호가 아니라 '이미 로그인했다는 표시'를 훔친 사건입니다.","todo":"지원팀의 공식 민감정보 제거 절차를 따라 파일에서 로그인 정보(쿠키·토큰)를 지우고, 남지 않았는지 확인한 뒤 보내세요. 유출이 의심되면 로그인 세션을 모두 끊습니다.","cls":["C","B"],"s":495,"e":1858},{"id":"INC-2023-10-citrixbleed","title":"Citrix Bleed (CVE-2023-4966) 대량 악용","file":"과거3년/2023-Q4.md","date":"2023-10-10","type":"엣지 장비 취약점","actor":"LockBit 계열 제휴자 외","region":"글로벌","evidence":"확인","easy":"회사 원격 접속 장비(Citrix)의 결함 때문에 '이미 로그인한 사람의 증표'가 밖으로 새어 나왔고, 공격자는 그 증표로 비밀번호와 2단계 인증 없이 들어왔습니다.","todo":"장비를 업데이트한 뒤 접속 중인 세션을 모두 끊고 비밀번호도 바꾸세요. 업데이트만으로는 이미 훔친 증표가 남습니다.","cls":["A"],"s":2002,"e":3174},{"id":"INC-2024-01-ivanti","title":"Ivanti Connect Secure 제로데이 (CVE-2023-46805 + CVE-2024-21887)","file":"과거3년/2024.md","date":"2024-01-10","type":"엣지 장비 취약점","actor":"UNC5221(중국 연계 의심)","region":"글로벌","evidence":"확인","easy":"회사 VPN 장비(Ivanti)의 결함 두 개를 이어 붙이면 로그인 없이 장비를 조종할 수 있었고, 실제로 많은 장비가 공격당했습니다.","todo":"제조사의 임시 조치와 업데이트를 적용하고, 의심되면 장비를 초기화한 뒤 그 장비에 저장된 비밀번호를 모두 바꾸세요.","cls":["A"],"s":278,"e":1312},{"id":"INC-2024-01-midnight","title":"Microsoft 사내 메일 침해 (Midnight Blizzard)","file":"과거3년/2024.md","date":"2024-01-19","type":"신원·클라우드","actor":"Midnight Blizzard(러시아 국가 지원, Microsoft 귀속)","region":"글로벌","evidence":"확인","easy":"마이크로소프트가 잊고 있던 '테스트용 계정'에 2단계 인증이 꺼져 있었고, 공격자가 흔한 비밀번호를 여러 계정에 시도하는 방식(비밀번호 추측 공격)으로 들어온 뒤 거기서 핵심 계정으로 번져 임원 메일을 읽었습니다.","todo":"테스트·옛 계정에도 2단계 인증을 켜고, 쓰지 않는 앱과 계정을 정리하세요.","cls":["B"],"s":1481,"e":2464},{"id":"INC-2024-02-changehc","title":"Change Healthcare 랜섬웨어 (ALPHV/BlackCat)","file":"과거3년/2024.md","date":"2024-02-21","type":"신원·랜섬웨어","actor":"ALPHV/BlackCat","region":"미국","evidence":"확인","easy":"미국 의료비 청구 회사의 원격 접속 화면에 2단계 인증이 없었습니다. 훔친 비밀번호 하나로 들어와 9일 뒤 랜섬웨어로 서비스를 멈췄고, 병원과 약국의 업무가 마비됐습니다.","todo":"회사 바깥에서 들어오는 모든 로그인에 2단계 인증을 켜세요.","cls":["B","F"],"s":2605,"e":3573},{"id":"INC-2024-03-xz","title":"XZ Utils 백도어 (CVE-2024-3094)","file":"과거3년/2024.md","date":"2024-03-29","type":"공급망(오픈소스)","actor":"가명 \"Jia Tan\"(미귀속)","region":"글로벌","evidence":"확인","easy":"리눅스에 널리 쓰이는 압축 프로그램에 누군가 2년에 걸쳐 신뢰를 쌓은 뒤 몰래 '뒷문'을 심었습니다. 한 개발자가 속도 이상을 눈치채서 큰 피해는 막았습니다.","todo":"영향 버전(5.6.0·5.6.1)을 쓰는지 확인하고 안전한 버전으로 바꾸세요.","cls":["C"],"s":3703,"e":4813},{"id":"INC-2024-04-panos","title":"Palo Alto PAN-OS GlobalProtect 제로데이 (CVE-2024-3400)","file":"과거3년/2024.md","date":"2024-04-12","type":"엣지 장비 취약점","actor":"UTA0218","region":"글로벌","evidence":"확인","easy":"회사 방화벽·VPN 장비(Palo Alto)의 입력 처리 결함 때문에 로그인 없이 관리자 권한으로 명령을 실행할 수 있었습니다.","todo":"업데이트와 제조사 지침을 적용하고, 장비 안에 저장된 비밀번호를 바꾸세요.","cls":["A"],"s":4959,"e":5964},{"id":"INC-2024-05-snowflake","title":"Snowflake 고객 계정 대량 침해 (UNC5537)","file":"과거3년/2024.md","date":"2024-05","type":"신원·클라우드","actor":"UNC5537","region":"글로벌","evidence":"확인","easy":"클라우드 데이터 서비스(Snowflake) 자체가 뚫린 것이 아니라, 정보 탈취 악성코드 등으로 고객 쪽 직원·외주 PC 등에서 비밀번호가 유출됐습니다. 2단계 인증이 없던 계정들이 그대로 로그인당했습니다.","todo":"모든 클라우드 계정에 2단계 인증을 켜고, 오래된 비밀번호를 바꾸세요. 감염이 의심되는 PC는 격리한 뒤 안전한 기기에서 바꿔야 새 비밀번호도 털리지 않습니다.","cls":["B"],"s":6089,"e":7251},{"id":"INC-2024-05-court-kr","title":"한국 법원 전산망 해킹 (Lazarus)","file":"과거3년/2024.md","date":"2024-05-10","type":"국가 지원 APT·정보 탈취","actor":"Lazarus(북한)","region":"한국","evidence":"보도","easy":"북한 해킹 조직이 한국 법원 전산망에 2년 넘게 머물며 1,014GB를 외부로 보냈습니다. 어떤 자료인지 확인된 것은 일부뿐입니다.","todo":"로그를 오래 보관하고, 서버에서 밖으로 나가는 큰 데이터 전송을 감시하세요.","cls":["E"],"s":7380,"e":8326},{"id":"INC-2024-10-salttyphoon","title":"Salt Typhoon 통신사 침해","file":"과거3년/2024.md","date":"2024-10","type":"국가 지원 APT·통신","actor":"Salt Typhoon(중국 MSS 연계)","region":"글로벌","evidence":"확인","easy":"중국 연계 조직이 통신사 장비의 '이미 알려졌지만 고치지 않은 결함'을 주로 이용해 들어가 통화 기록과 위치 정보를 오랫동안 엿봤습니다.","todo":"네트워크·통신 장비도 알려진 결함은 바로 고치고, 장비 관리용 접속 경로를 따로 분리하세요.","cls":["A","E"],"s":8462,"e":9727},{"id":"INC-2024-12-cleo","title":"Cleo 파일 전송 제품 대량 악용 (Cl0p)","file":"과거3년/2024.md","date":"2024-12-03","type":"엣지·MFT 취약점","actor":"Cl0p","region":"글로벌","evidence":"확인","easy":"기업이 큰 파일을 주고받을 때 쓰는 소프트웨어(Cleo)의 결함으로 Cl0p 조직이 많은 회사의 파일을 한꺼번에 훔쳤습니다. 한 번 업데이트한 뒤에도 다시 뚫렸습니다.","todo":"당시 기준 수정 버전은 5.8.0.24 이상이며, 지금은 제조사의 최신 보안 버전을 확인해 올리고 인터넷에서 바로 접속되지 않게 막으세요.","cls":["A"],"s":9845,"e":10958},{"id":"INC-2024-12-treasury","title":"미 재무부 침해 (BeyondTrust, Silk Typhoon)","file":"과거3년/2024.md","date":"2024-12-02","type":"서드파티·원격 지원 SaaS","actor":"Silk Typhoon(중국 국가 지원)","region":"미국","evidence":"확인","easy":"원격 지원 서비스(BeyondTrust)의 열쇠(API 키)가 털려, 그 열쇠로 미국 재무부 컴퓨터에 원격 접속했습니다.","todo":"원격 지원 도구의 접근 범위를 줄이고, 비밀 키를 정기적으로 바꾸세요.","cls":["C"],"s":11112,"e":12051},{"id":"INC-2025-02-bybit","title":"Bybit 약 15억 달러 탈취 (Lazarus)","file":"과거3년/2025.md","date":"2025-02-21","type":"서드파티·암호화폐","actor":"Lazarus(북한, FBI 확인)","region":"글로벌","evidence":"확인","easy":"암호화폐 거래소의 큰 이체를 승인하는 사람들이 정상으로 보이는 화면을 보고 승인했는데, 실제로는 공격자가 자산을 빼낼 수 있게 만든 조작된 거래였습니다(약 15억 달러).","todo":"큰 이체는 승인 화면과 다른 경로로 거래 내용을 한 번 더 확인하세요.","cls":["C"],"s":246,"e":1163},{"id":"INC-2025-03-tjactions","title":"tj-actions/changed-files 공급망 공격 (CVE-2025-30066)","file":"과거3년/2025.md","date":"2025-03-14","type":"공급망(CI/CD)","actor":"미귀속","region":"글로벌","evidence":"확인","easy":"개발자들이 많이 쓰는 자동화 도구(GitHub Action)가 오염돼, 이를 쓰는 프로젝트의 비밀번호·키가 작업 기록에 드러났습니다.","todo":"영향 기간에 쓴 비밀값을 모두 바꾸고, 외부 도구는 이름표(버전)가 아니라 고정된 코드 번호(SHA)로 지정하세요.","cls":["C"],"s":1307,"e":2305},{"id":"INC-2025-04-skt","title":"SK텔레콤 USIM 정보 유출","file":"과거3년/2025.md","date":"2025-04-22","type":"국가 규모 개인정보·통신","actor":"미귀속","region":"한국","evidence":"확인","easy":"SK텔레콤 핵심 서버에 악성코드가 약 4년 동안 숨어 있었고, 가입자 인증 관련 정보(USIM 인증에 쓰이는 정보)가 유출됐습니다. 관리 계정이 암호화 없이 서버에 적혀 있었던 것이 출발점이었다고 정부가 밝혔습니다.","todo":"일반 사용자는 통신사 안내에 따라 유심 보호 서비스를 이용하세요. 서버 담당자는 관리 계정을 안전한 비밀 보관소로 옮기고 숨은 악성코드(BPFDoor)를 점검하세요.","cls":["E","H"],"s":2413,"e":3657},{"id":"INC-2025-04-mns","title":"Marks & Spencer 랜섬웨어 (Scattered Spider · DragonForce 보도)","file":"과거3년/2025.md","date":"2025-04-24","type":"사회공학·랜섬웨어","actor":"Scattered Spider(DragonForce 랜섬웨어 사용)","region":"영국","evidence":"보도","easy":"영국 유통업체 M&S가 공격 조직에 들어와 서버가 암호화됐고, 결제와 온라인 주문이 오랫동안 멈췄습니다. 초기 침투 방법은 공식 확인되지 않았고, 전화로 직원을 속이는 수법을 쓰는 조직으로 알려져 있습니다.","todo":"지원 창구가 비밀번호·2단계 인증을 재설정해 줄 때는, 요청자가 알려 준 번호가 아니라 미리 등록된 연락처로 확인하고 관리자 승인을 거치게 하세요.","cls":["D","F","E"],"s":3835,"e":4987},{"id":"INC-2025-06-yes24","title":"예스24 랜섬웨어","file":"과거3년/2025.md","date":"2025-06-09","type":"랜섬웨어","actor":"미귀속","region":"한국","evidence":"보도","easy":"예스24가 랜섬웨어(파일을 암호화하고 돈을 요구하는 악성코드)에 걸려 5일 동안 서비스가 멈췄습니다. 백업이 부족해 복구가 오래 걸렸다고 알려졌습니다.","todo":"인터넷과 분리된 백업을 만들고, 실제로 복구해 보는 훈련을 하세요.","cls":["F"],"s":5081,"e":5741},{"id":"INC-2025-07-sgi","title":"SGI서울보증 랜섬웨어","file":"과거3년/2025.md","date":"2025-07-14","type":"랜섬웨어·원격 접속","actor":"Qilin 지목(보도)","region":"한국","evidence":"보도","easy":"SGI서울보증은 VPN 로그인에 비밀번호를 계속 바꿔 넣는 공격을 당했고, 백업까지 함께 암호화돼 모든 업무가 멈췄다고 보도됐습니다.","todo":"원격 접속에 2단계 인증과 로그인 실패 횟수 제한을 걸고, 백업은 업무 네트워크와 분리해 두세요.","cls":["B","F"],"s":5851,"e":6644},{"id":"INC-2025-07-toolshell","title":"SharePoint ToolShell (CVE-2025-53770)","file":"과거3년/2025.md","date":"2025-07-18","type":"엣지·서버 취약점","actor":"Linen Typhoon·Violet Typhoon·Storm-2603(중국 연계)","region":"글로벌","evidence":"확인","easy":"회사에 직접 설치해 쓰는 SharePoint 서버의 결함으로 로그인 없이 서버를 장악할 수 있었습니다. 업데이트한 뒤에도 훔친 '서버 암호 키'가 남아 있으면 계속 악용될 수 있었습니다.","todo":"업데이트와 함께 서버의 암호 키(MachineKey)를 교체하고, 서버가 인터넷에 직접 열려 있지 않은지 점검하세요.","cls":["A"],"s":6819,"e":7784},{"id":"INC-2025-08-salesloft","title":"Salesloft Drift OAuth 토큰 탈취 → Salesforce 데이터 유출","file":"과거3년/2025.md","date":"2025-08-08","type":"서드파티·SaaS 연동","actor":"UNC6395(ShinyHunters 연계 보도)","region":"글로벌","evidence":"확인","easy":"영업 도구(Salesloft Drift)의 '연결 열쇠(토큰)'가 털려, 이 도구와 연결된 수백 개 회사의 고객 데이터(Salesforce)가 빠져나갔습니다. 문의 기록에 붙여넣은 비밀번호·키는 2차 피해로 이어질 수 있었습니다.","todo":"연결된 외부 앱의 권한을 점검하고 유출된 연결 토큰은 폐기·재발급하세요. 문의 기록에 비밀번호를 붙여넣지 않도록 하세요(비밀번호만 바꿔서는 이미 발급된 토큰이 사라지지 않습니다).","cls":["C"],"s":7953,"e":9242},{"id":"INC-2025-08-jlr","title":"Jaguar Land Rover 가동 중단","file":"과거3년/2025.md","date":"2025-08-31","type":"랜섬웨어 추정·제조","actor":"\"Scattered Lapsus$ Hunters\" 주장(NYT는 러시아 연계 보도)","region":"영국","evidence":"보도","easy":"재규어 랜드로버가 사이버 공격을 받아 세계 공장이 약 5주 멈췄습니다. 어떻게 들어왔는지는 아직 확인되지 않았습니다.","todo":"공장 생산망과 사무망을 분리하고, 컴퓨터 없이도 돌아가는 비상 운영 절차를 만들어 훈련하세요.","cls":["F"],"s":9397,"e":10177},{"id":"INC-2025-08-kt","title":"KT 무단 소액결제 (불법 초소형 기지국)","file":"과거3년/2025.md","date":"2025-08","type":"통신망·인증","actor":"미귀속(40대 중국 교포 용의자 체포 보도)","region":"한국","evidence":"확인","easy":"가짜 초소형 기지국으로 KT 이용자의 문자·인증번호를 가로채 소액결제를 했습니다. KT에 납품된 이 장비들이 모두 같은 인증서를 쓰고 있었던 점이 약점이었습니다.","todo":"일반 사용자는 통신사 안내에 따라 결제 한도를 조정하세요. 통신사는 장비마다 다른 인증서를 쓰게 바꿔야 합니다.","cls":["H"],"s":10302,"e":11283},{"id":"INC-2025-08-lottecard","title":"롯데카드 개인정보 유출 (WebLogic 미패치)","file":"과거3년/2025.md","date":"2025-08-26","type":"엣지·서버 취약점·금융","actor":"미귀속","region":"한국","evidence":"보도","easy":"이미 2017년에 고쳐진 서버 결함(WebLogic)이 고쳐지지 않은 채 남아 있다가 악용돼 고객 정보가 유출됐다는 보도입니다.","todo":"인터넷에 열린 서버 목록을 만들어 실제 공격에 쓰이는 결함과 외부에 노출된 시스템부터 패치하세요. CVV는 결제 승인 뒤 저장하지 말고, 카드번호는 꼭 필요한 경우에만 보호해서 저장하세요.","cls":["A"],"s":11407,"e":12445},{"id":"INC-2025-09-shaihulud","title":"Shai-Hulud npm 웜","file":"과거3년/2025.md","date":"2025-09-15","type":"공급망(오픈소스)","actor":"미귀속","region":"글로벌","evidence":"확인","easy":"개발자가 설치하는 npm 패키지에 '스스로 퍼지는' 악성코드가 들어 있어, 개발자 PC의 키를 훔치고 그 키로 다른 패키지까지 오염시켰습니다.","todo":"영향 패키지를 쓰는지 확인하고, 감염이 의심되는 PC는 격리한 뒤 안전한 기기에서 개발·배포용 토큰을 모두 바꾸세요.","cls":["C"],"s":12556,"e":13571},{"id":"INC-2025-10-f5","title":"F5 BIG-IP 개발 환경 침해","file":"과거3년/2025.md","date":"2025-10-15","type":"공급망·국가 지원 APT","actor":"UNC5221(중국 연계, BRICKSTORM 백도어)","region":"글로벌","evidence":"확인","easy":"네트워크 장비 회사 F5의 개발 환경에 중국 연계 조직이 1년 넘게 숨어 소스 코드와 아직 공개되지 않은 취약점 정보를 가져갔습니다.","todo":"F5 장비를 쓴다면 최신 패치를 먼저 적용하고, 관리 화면을 인터넷에서 닫으세요.","cls":["C","E"],"s":13708,"e":14599},{"id":"INC-2025-10-oracleebs","title":"Oracle E-Business Suite 제로데이 (Cl0p)","file":"과거3년/2025.md","date":"2025-07","type":"엣지·ERP 취약점","actor":"Cl0p(2번째 CVE PoC는 ShinyHunters 관련 보도)","region":"글로벌","evidence":"확인","easy":"기업 업무 시스템(Oracle EBS)의 결함을 Cl0p 조직이 먼저 알고 악용해 여러 대학과 기업의 데이터를 훔친 뒤 협박했습니다.","todo":"패치를 적용하고, 인터넷에서 바로 접속되지 않게 막으세요.","cls":["A"],"s":14761,"e":15548},{"id":"INC-2025-11-coupang","title":"쿠팡 3,370만 계정 개인정보 유출","file":"과거3년/2025.md","date":"2025-11","type":"내부자·인증키 관리","actor":"전 직원(퇴사자)","region":"한국","evidence":"확인","easy":"쿠팡의 인증 업무를 맡았던 전 직원이 퇴사 후에도 가지고 있던 '서명 키'로 시스템에 접속해 3,367만 계정의 정보를 조회했다고 정부 조사 결과가 나왔습니다.","todo":"퇴사할 때 키와 계정을 회수하고, 서명 키는 개발자 PC가 아닌 전용 보관소에서만 관리하며 정기적으로 바꾸세요. 키를 바꿀 때는 이미 발급된 토큰도 무효화해야 합니다.","cls":["B","H"],"s":15664,"e":16693},{"id":"INC-2025-12-react2shell","title":"React2Shell (CVE-2025-55182)","file":"과거3년/2025.md","date":"2025-12-03","type":"프레임워크 취약점","actor":"다수(중국 연계 그룹이 수 시간 내 악용, Amazon 보고)","region":"글로벌","evidence":"확인","easy":"웹사이트를 만드는 도구(React·Next.js)의 결함으로 로그인 없이 서버에서 명령을 실행할 수 있었고, 공개 직후부터 공격이 시작됐습니다.","todo":"영향 버전을 최신 보안 버전으로 올리세요.","cls":["A"],"s":16849,"e":17720},{"id":"INC-2026-01-shinyhunters","title":"ShinyHunters SSO 보이스 피싱(vishing) 캠페인","file":"과거3년/2026.md","date":"2026-01","type":"사회공학·신원","actor":"ShinyHunters","region":"글로벌","evidence":"보도","easy":"공격자가 'IT 지원팀'이라며 직원에게 전화해 가짜 로그인 페이지에 비밀번호와 인증 코드를 입력하게 만들었고, 그렇게 들어가 회사 데이터를 가져갔다고 보도됐습니다.","todo":"인증 코드나 승인 알림 대신 보안키·패스키(속아도 인증되지 않는 방식)를 쓰고, 'IT는 전화로 코드를 묻지 않는다'고 모두에게 알리세요.","cls":["D","B"],"s":334,"e":1496},{"id":"INC-2026-01-kyowon","title":"교원그룹 랜섬웨어","file":"과거3년/2026.md","date":"2026-01-10","type":"랜섬웨어·웹셸","actor":"미확인","region":"한국","evidence":"보도","easy":"교원그룹이 랜섬웨어에 걸려 가상 서버 약 600대가 영향을 받았고 여러 서비스에 장애가 났습니다. 웹서버에 숨은 악성 파일(웹셸)이 사용됐다는 보도가 있으나 최초 침투 방법은 확인되지 않았습니다.","todo":"웹서버에 숨은 악성 파일이 없는지 점검하고, 백업은 업무 네트워크와 분리해 두세요.","cls":["F"],"s":1594,"e":2462},{"id":"INC-2026-03-stryker","title":"Stryker 와이퍼 공격 (Handala)","file":"과거3년/2026.md","date":"2026-03-11","type":"파괴 공격·클라우드 관리","actor":"Handala(이란 정보부 MOIS 연계, 미 법무부 귀속 보도)","region":"글로벌","evidence":"보도","easy":"의료기기 기업 Stryker에서 공격자가 관리자 계정을 훔친 뒤, 기기 관리 도구(Intune)의 '원격 초기화' 기능으로 직원 기기를 대량으로 지웠습니다. 별도 악성코드 없이 정상 기능이 무기가 됐습니다.","todo":"관리자 계정에 강한 2단계 인증을 걸고, 대량 삭제는 여러 관리자의 승인이 있어야 실행되게 하세요.","cls":["G","B"],"s":2616,"e":3730},{"id":"INC-2026-03-teampcp","title":"TeamPCP 보안·개발 도구 공급망 연쇄 (Trivy → Checkmarx → Bitwarden CLI)","file":"과거3년/2026.md","date":"2026-03-16","type":"공급망(CI/CD)","actor":"TeamPCP","region":"글로벌","evidence":"확인","easy":"보안 점검 도구 Trivy를 시작으로 Checkmarx, Bitwarden CLI까지 개발 도구가 연달아 오염돼 개발자·CI의 비밀 키가 털렸습니다.","todo":"영향 기간에 쓴 키를 모두 바꾸되 감염이 의심되는 환경은 격리한 뒤 안전한 기기에서 바꾸고, '옛 키가 완전히 무효가 됐는지'까지 확인하세요.","cls":["C"],"s":3887,"e":5081},{"id":"INC-2026-04-fbi","title":"FBI 감시 시스템 침해 (\"major incident\" 지정)","file":"과거3년/2026.md","date":"2026-04-02","type":"국가 지원 APT·서드파티","actor":"중국 연계 의심(Salt Typhoon 지목 보도, 확정 아님)","region":"미국","evidence":"보도","easy":"FBI는 감시 시스템이 인터넷 업체의 연동 구간을 통해 침해됐다고 의회에 알렸습니다. 중국 연계 의심 보도가 있지만 확정은 아닙니다.","todo":"외부 업체와 연결된 구간의 로그인·접속 기록을 점검하세요.","cls":["C"],"s":5241,"e":6059},{"id":"INC-2026-05-tving","title":"티빙(TVING) 가입자 3,954만 계정 유출","file":"과거3년/2026.md","date":"2026-05-30","type":"키 관리·개인정보","actor":"미귀속","region":"한국","evidence":"확인","easy":"티빙 개발자의 '접속키'가 털려, 해커가 개발 환경과 운영 시스템으로 차례로 들어갔고, 휴면·탈퇴 계정을 포함한 3,954만 계정의 정보가 유출됐다고 정부가 발표했습니다(2026-09-03).","todo":"티빙 이용자는 같은 비밀번호를 쓰는 다른 서비스의 비밀번호도 바꾸고 2단계 인증을 켜세요. 담당자는 개발자 접속키를 코드나 개발 PC에 두지 말고 전용 보관소에서 관리하며 정기적으로 바꾸세요.","cls":["B","H","E"],"s":6175,"e":7993},{"id":"D20261003-fortimail","title":"FortiMail CVE-2026-104286","file":"일일/2026-10-03.md","date":"2026-10-01","type":"엣지 장비 취약점","actor":"미귀속","region":"글로벌","evidence":"확인","easy":"메일 보안 장비(FortiMail)에 로그인 없이 파일을 써 넣을 수 있는 결함이 있고, 실제로 공격에 쓰이고 있습니다.","todo":"제조사의 임시 조치(IBE 끄기, 관리 화면을 인터넷에서 닫기)를 적용하고, 수정 버전이 나왔는지 확인하세요.","cls":["A"],"s":1633,"e":3173},{"id":"D20261003-citrix","title":"Citrix NetScaler CVE-2026-88771 / -88772","file":"일일/2026-10-03.md","date":"2026-09-27","type":"엣지 장비 취약점","actor":"미귀속","region":"글로벌","evidence":"확인","easy":"회사 원격 접속 장비(NetScaler)의 결함 두 개가 이미 공격에 쓰이고 있습니다. 공개되기 3주 전부터 악용됐다는 관측이 있습니다.","todo":"패치 직전에 가능한 범위에서 로그와 설정을 신속히 보존하고(조사는 병행) 지체 없이 패치한 뒤, 접속 중인 세션을 모두 끊으세요.","cls":["A"],"s":3303,"e":4694},{"id":"D20261003-cisco","title":"Cisco SD-WAN Manager CVE-2026-76504","file":"일일/2026-10-03.md","date":"2026-09-30","type":"엣지 장비 취약점","actor":"미귀속","region":"글로벌","evidence":"확인","easy":"Cisco SD-WAN 관리 화면의 로그인 검사가 주소의 글자 하나를 다르게 쓰면(%6a) 건너뛰어져서 관리자처럼 접속할 수 있었습니다.","todo":"바로 패치(우회 방법이 없습니다)하고, 관리 화면을 인터넷에서 닫으세요.","cls":["A"],"s":4818,"e":5891},{"id":"D20261003-wordpress","title":"WordPress CVE-2026-87902","file":"일일/2026-10-03.md","date":"2026-09-22","type":"웹 애플리케이션 취약점","actor":"미귀속","region":"글로벌","evidence":"확인","easy":"워드프레스의 결함으로, 특정 조건의 사이트에서는 로그인 없이 서버 코드가 실행됩니다. 패치가 공개된 당일부터 공격이 있었습니다.","todo":"워드프레스를 최신 버전으로 올리고 자동 업데이트를 켜세요.","cls":["A"],"s":6011,"e":7191},{"id":"D20261003-peoplesoft","title":"Oracle PeopleSoft CVE-2026-35273 / ShinyHunters","file":"일일/2026-10-03.md","date":"2026-06-10","type":"엣지·ERP 취약점","actor":"ShinyHunters(UNC6240)","region":"글로벌","evidence":"확인","easy":"대학·기업이 쓰는 PeopleSoft의 결함을 ShinyHunters가 악용했습니다. 방화벽(WAF)의 차단 규칙은 글자 하나를 다르게 쓰는 것만으로 피해 갔습니다.","todo":"방화벽 규칙에 기대지 말고 실제 패치를 적용하세요.","cls":["A"],"s":7351,"e":8914},{"id":"D20261003-zammad","title":"Zammad CVE-2026-102489 / -102490 (DIVD 침해)","file":"일일/2026-10-03.md","date":"2026-09-21","type":"웹 애플리케이션 취약점","actor":"미귀속(DIVD는 AI 에이전트형 공격 의혹)","region":"글로벌","evidence":"확인","easy":"헬프데스크 소프트웨어 Zammad의 결함 두 개를 이어 로그인 없이 서버 최고 권한(root)까지 얻을 수 있었고, 실제 침해가 있었습니다.","todo":"당시 기준 수정 버전은 7.2.0이며, 지금은 제조사의 최신 보안 버전으로 올리고 기존 로그인 세션을 모두 무효화하세요.","cls":["A"],"s":9071,"e":10367},{"id":"D20261003-apple","title":"Apple CoreGraphics CVE-2026-86950","file":"일일/2026-10-03.md","date":"2026-09-29","type":"클라이언트 취약점","actor":"미귀속(표적 공격)","region":"글로벌","evidence":"확인","easy":"아이폰·맥이 이미지·문서를 그리는 부분의 결함이 소수의 표적에게 악용됐습니다.","todo":"기기를 최신 보안 업데이트로 올리세요. 표적이 될 위험이 큰 사람은 Lockdown Mode를 고려하세요.","cls":["I"],"s":10496,"e":11377},{"id":"D20261003-dmdc","title":"미 국방부 DMDC 유출","file":"일일/2026-10-03.md","date":"2026-07-16","type":"파일 공유 시스템·대규모 개인정보","actor":"미귀속","region":"미국","evidence":"보도","easy":"미국 국방부 인사 정보 시스템의 파일 공유 서비스 결함으로 약 305만 명의 정보가 노출됐다고 보도됐습니다.","todo":"파일 공유 서비스의 패치·공개 범위·접근 권한을 먼저 점검하고, 주민번호 같은 민감한 번호는 최소한만 저장하며 암호화하고, 접속 기록을 오래 보관하세요.","cls":["E"],"s":11486,"e":12376},{"id":"D20261006-citrix-saml","title":"Citrix NetScaler SAML CVE-2026-88779","file":"일일/2026-10-04.md","date":"2026-10-04","type":"엣지 장비 취약점","actor":"미귀속","region":"글로벌","evidence":"확인","easy":"회사 원격 접속 장비(NetScaler)에서 또 하나의 결함이 공격에 쓰이고 있습니다. 로그인(SAML 방식) 처리 부분의 결함이며, 벤더는 서비스 중단 위험이라고 했지만 연구자들은 명령 실행으로 이어질 가능성도 봅니다. 10-03 보고서의 Citrix 건과는 별개의 결함입니다.","todo":"SAML 로그인을 쓰는 장비인지 확인하고, 수정 버전으로 올린 뒤 접속 중인 세션을 모두 끊으세요. 이미 침해됐을 수 있는 장비라면 그 장비에서 새 비밀번호·키를 만들지 마세요.","cls":["A"],"s":1078,"e":2637},{"id":"D20261006-dk-cpr","title":"덴마크 CPR(주민등록부) 대량 조회","file":"일일/2026-10-05.md","date":"2026-10-05","type":"서드파티 접근 권한 오남용","actor":"미확인","region":"글로벌","evidence":"보도","easy":"덴마크 국민 신분 정보를 모아 둔 국가 등록부에, 접근 권한을 가진 민간 업체의 계정이 악용돼 약 880만 명 등록자의 이름·주소·주민번호(CPR 번호)에 무단 접근이 있었다고 보도됐습니다. 정보가 자동화된 조회로 빠져나갔다고 보도됐습니다. 복사·판매·공개 여부는 아직 알려지지 않았습니다.","todo":"덴마크 거주자라면 당국 안내를 따르고 신분증 번호를 이용한 사칭(전화·문자) 시도를 경계하세요. 담당자라면 외부 업체에 준 조회 권한의 범위와 조회량 제한을 점검하세요. 비밀번호만 바꿔도 이미 얻은 주민번호는 되돌릴 수 없습니다.","cls":["C","B"],"s":769,"e":1842},{"id":"D20261006-finsector","title":"금융권 동시다발 해킹 (AI 자동화 공격 정황)","file":"일일/2026-10-06-국내보충.md","date":"2026-09-29","type":"다수 금융사·자동화 공격","actor":"미귀속(연관성 조사 중)","region":"한국","evidence":"보도","easy":"9월 말부터 10월 초 사이 금융사 7곳에서 개인정보 유출이 보고됐습니다. 같은 공격자의 IP가 여러 곳에서 발견돼 서로 연관된 공격인지 조사 중이고, 일부 사건에서 AI 도구의 흔적이 보도됐지만 실제로 쓰였는지는 공식 확인되지 않았습니다.","todo":"이용자는 금융사 안내를 확인하고, 대출·한도를 미끼로 한 의심 전화·문자를 조심하세요. 담당자는 대출 조회·업무 지원·영업 지원처럼 바깥에서 접속하는 업무 시스템의 인증과 접근 통제, 이상 접속 탐지부터 점검하세요.","cls":["A"],"s":941,"e":2974},{"id":"D20261006-kepco","title":"한국전력 전 직원 개인정보 외부 노출","file":"일일/2026-10-06-국내보충.md","date":"2026-10-01","type":"정보 노출","actor":"미확인(해킹 여부 미확인)","region":"한국","evidence":"보도","easy":"한국전력 전 직원 약 2만 4천 명의 이름·연락처·이메일·직위 등이 외부 웹페이지에 올라와 있었습니다. 국정원이 먼저 발견해 알렸고 약 32시간 뒤 삭제됐습니다. 한전은 주민번호·주소 같은 민감정보와 고객 정보는 노출되지 않았다고 밝혔습니다. 해킹인지 실수인지는 아직 확인되지 않았습니다.","todo":"직원은 한전·협력사를 사칭한 피싱 메일·문자를 조심하세요. 담당자는 노출 경위가 해킹인지 설정 실수인지 밝혀질 때까지 관련 접근 기록을 보존하고, 같은 식으로 공개된 페이지가 더 없는지 점검하세요.","cls":["J"],"s":3089,"e":4054},{"id":"D20261006-seoulcyber","title":"서울사이버대 개인정보 유출","file":"일일/2026-10-06-국내보충.md","date":"2026-10-04","type":"개인정보 유출","actor":"미귀속","region":"한국","evidence":"보도","easy":"KISA(한국인터넷진흥원)가 학교 구성원의 개인정보로 보이는 자료가 외부 사이트에 올라와 있다고 알려 왔고, 학교는 성명·학번·연락처·주소 등이 유출된 것으로 확인했습니다. 주민번호·비밀번호·계좌번호는 암호화된 채 유출됐고, 발표 시점까지 풀린 정황은 확인되지 않았다고 학교는 설명합니다. 규모와 시점은 조사 중입니다.","todo":"재학생·졸업생·교직원은 학교 공지를 확인하고, 학교를 사칭한 문자·전화를 조심하며, 같은 비밀번호를 쓰는 다른 서비스도 바꾸세요. 담당자는 암호화 키가 함께 유출됐는지부터 확인하세요.","cls":["J"],"s":4159,"e":5066},{"id":"D20261006-mofa","title":"외교부(국립외교원 온라인교육시스템) 개인정보 유출","file":"일일/2026-10-06-국내보충.md","date":"2026-02-01","type":"장기 체류·개인정보","actor":"미귀속","region":"한국","evidence":"보도","easy":"국립외교원 온라인교육시스템이 2025년 4~5월에 장악당해 약 10개월 동안 접근이 이어졌고, 현직·전직 외교부 직원 최대 1만 건의 정보(이름·아이디·이메일·암호화된 비밀번호 등)가 유출됐습니다. 외교부는 2026년 2월 초에 알았고, 국회 의원실 자료에 따르면 보도 시점(10/6)까지 책임자에 대한 인사·감찰 조치가 없었습니다.","todo":"해당 시스템 이용자는 같은 비밀번호를 쓰는 다른 서비스도 바꾸고 외교·공무 사칭 메일을 조심하세요. 담당 기관은 방화벽이 열린 경위와 보안관제에서 빠진 이유를 조사해 재발 방지부터 하세요.","cls":["E"],"s":5181,"e":6192},{"id":"D20261006-sonicwall-sma","title":"SonicWall SMA1000 Work Place 사전 인증 SSRF (CVE-2026-102255)","file":"일일/2026-10-06.md","date":"2026-10-06","type":"엣지 장비 취약점","actor":"미귀속","region":"글로벌","evidence":"확인","easy":"원격 접속 장비인 SonicWall SMA1000 시리즈의 사용자 포털(Work Place) 인터페이스에서 로그인하지 않은 외부 공격자가 장비로 하여금 내부 기능에 요청을 보내게 만들고 비인가 작업을 수행할 수 있는 최고 위험도(CVSS 10.0) 결함이 공개됐습니다.","todo":"SonicWall SMA1000 장비를 운영 중이라면 벤더 권고에 따른 최신 패치(12.4.3-03312 이상)를 즉시 적용하고, Work Place 포털과 관리 인터페이스의 불필요한 외부 노출을 차단하세요.","cls":["A"],"s":933,"e":2298},{"id":"D20261007-bitget","title":"Bitget 가상자산 탈취 (보안 제품 제로데이)","file":"일일/2026-10-07.md","date":"2026-09-25","type":"서드파티 보안 제품 제로데이 → 내부 이동 → 지갑 서버","actor":"미귀속(회사는 북한 해커 주장, 미검증)","region":"글로벌","evidence":"보도","easy":"가상자산 거래소 Bitget이 약 3억 8,750만 달러어치 자산을 도난당했다고 밝혔습니다. 회사 설명에 따르면 외부 보안 제품의 제조사도 모르던 결함이 공격에 쓰였고, 그 제품 장비들이 입구가 됐고, 그곳에서 지갑을 관리하는 서버까지 들어갔다고 합니다. 어떤 제품인지는 공개되지 않았고, 누구 소행인지도 확정되지 않았습니다.","todo":"이용자는 거래소 공지를 확인하고 출금 재개 전까지 공식 안내 외의 '복구 도와드립니다' 연락을 믿지 마세요. 담당자라면 인터넷에 노출된 보안 장비의 버전과 관리 화면 노출을 점검하고, 의심 장비에서 새 키·비밀번호를 만들지 말고 깨끗한 기기에서 교체하세요.","cls":["A","C"],"s":1447,"e":3028},{"id":"D20261007-roundcube","title":"Roundcube 웹메일 CVE-2026-48842 악용","file":"일일/2026-10-07.md","date":"2026-09-21","type":"엣지·웹 서비스 취약점","actor":"미귀속","region":"글로벌","evidence":"보도","easy":"웹으로 메일을 보는 프로그램(Roundcube)에서 로그인 없이도 데이터베이스에 명령을 끼워 넣을 수 있는 결함이 5월에 패치됐는데, 아직 안 고친 서버를 노린 공격이 벌어지고 있다고 캐나다 정부 기관이 공개 보고를 인용해 경고했습니다. 약 52만 대가 인터넷에 노출돼 있다고 보도됐습니다.","todo":"메일 서버 담당자는 Roundcube 버전을 확인하고 1.6.16 또는 1.7.1 이상(당시 기준)으로 올리세요. 이미 뚫렸을 수 있으니 패치만으로 끝내지 말고 접속 기록과 사용자 계정 이상 여부를 보세요.","cls":["A"],"s":3155,"e":4247},{"id":"D20261007-asos","title":"ASOS 침해 주장과 인정된 개인정보 유출","file":"일일/2026-10-07.md","date":"2026-10-06","type":"서드파티 플랫폼 무단 접근","actor":"'Xuanye group' 자칭","region":"글로벌","evidence":"보도","easy":"영국 온라인 패션몰 ASOS 앱에서 \"해킹당했다\"는 알림이 이용자에게 전송됐습니다. 회사는 고객 소통에 쓰는 외부 플랫폼에 무단 접근이 있었고 이름·연락처 같은 기본 정보가 접근됐을 가능성이 있다고 밝혔습니다. 다만 공격자가 주장한 '데이터 저장소(Snowflake) 완전 장악'은 확인되지 않았습니다.","todo":"이용자는 ASOS를 사칭한 문자·이메일(링크 클릭 유도)을 조심하세요. 회사 발표에 따르면 회사는 카드 정보·비밀번호가 영향받지 않은 것으로 판단한다고 하지만, 앱 알림 속 링크는 누르지 마세요. 담당자는 외부 고객 소통 플랫폼의 계정·토큰 접근을 점검하세요.","cls":["J","C"],"s":4377,"e":5496},{"id":"D20261008-atlassian","title":"Atlassian 제품군 CVE-2026-21589 악용","file":"일일/2026-10-08.md","date":"2026-10-07","type":"엣지·웹 서비스 취약점","actor":"미귀속","region":"글로벌","evidence":"보도","easy":"회사 안에 직접 설치해 쓰는 업무 도구(Jira, Confluence, Bitbucket 등)에서 로그인 없이 서버의 파일을 읽을 수 있는 결함이 발견됐고, 연구기관이 공격 방법을 공개한 지 약 2시간 만에 공격 시도가 관측됐다고 보도됐습니다. 자동 검사 도구까지 퍼져 있어 노출된 서버는 금방 표적이 될 수 있습니다.","todo":"담당자는 직접 설치형 Atlassian 제품의 버전을 확인하고 Atlassian 공식 보안 공지의 수정 버전으로 올리세요. 인터넷에서 바로 접근되지 않게 막고, 이미 공격받았을 수 있으니 패치 후에도 접속 기록과 설정 파일·비밀 값 노출 여부를 점검하세요.","cls":["A"],"s":1350,"e":2907},{"id":"D20261008-fortibleed","title":"FortiBleed — 유출된 FortiGate 로그인 정보의 랜섬웨어 악용","file":"일일/2026-10-08.md","date":"2026-10-07","type":"유출 자격 증명 재사용","actor":"INC/Lynx·Payload 랜섬웨어 계열이 연루됐다고 FBI가 경고(보도)","region":"글로벌","evidence":"보도","easy":"방화벽·VPN 장비(FortiGate)의 아이디와 비밀번호 묶음이 유출돼 돌아다니고 있고, 이를 이용한 침입이 계속되고 있다고 FBI가 경고했다고 보도됐습니다. 침입자는 관리자 계정을 새로 만들고 기존 관리자를 지워 원래 담당자를 쫓아냈습니다. 특정 제품 결함이 아니라 유출된 로그인 정보를 쓰는 공격이라는 점이 핵심입니다.","todo":"담당자는 FortiGate 관리 화면과 SSL VPN이 인터넷에 열려 있는지 확인하고 막으세요. 장비 안의 관리자 목록과 최근 설정 변경에서 낯선 계정을 찾으세요. 침입이 의심되면 그 장비에서 새 비밀번호를 만들지 말고 깨끗한 기기에서 바꾸며, 이미 열린 VPN 접속(세션)도 모두 끊어야 합니다.","cls":["B"],"s":3086,"e":4642},{"id":"D20261008-cctld","title":"국가 도메인 관련 침해와 구글 도메인 인증서 부정 발급","file":"일일/2026-10-08.md","date":"2026-10-07","type":"서드파티(도메인 운영 쪽) 침해 → DNS 변조","actor":"미귀속","region":"글로벌","evidence":"보도","easy":"인터넷 주소를 관리하는 일부 나라(가나, 아메리칸사모아, 시에라리온)의 도메인 운영 쪽이 뚫려, 공격자가 주소 안내 정보를 바꾸고 구글 관련 주소에 대한 '정상으로 보이는 보안 인증서'까지 받아 냈다고 구글이 밝혔다고 보도됐습니다. 구글 자체 시스템은 안전하다고 합니다. 가짜 사이트가 진짜처럼 보일 수 있다는 점이 문제입니다.","todo":"일반 이용자는 브라우저를 최신으로 유지하세요(구글은 Chrome에서 해당 인증서를 차단했다고 합니다). 도메인 담당자는 자사 도메인의 인증서 발급 기록을 공개 감시 목록(인증서 투명성 로그)에서 확인하고, 인증서를 발급할 수 있는 기관을 제한하는 CAA 기록을 설정하세요(CAA는 이후 부정 발급을 줄일 뿐 진행 중인 DNS 탈취를 막지는 못합니다).","cls":["C"],"s":4778,"e":6180},{"id":"D20261009-kev-legacy","title":"CISA, 오래된 취약점 5건을 '악용 확인' 목록에 추가","file":"일일/2026-10-09.md","date":"2026-10-08","type":"오래된(레거시) 결함의 재악용","actor":"미공개","region":"글로벌","evidence":"확인","easy":"미국 CISA가 2015~2023년에 알려진 오래된 보안 결함 5개가 지금도 실제 공격에 쓰이고 있다고 목록에 올렸습니다. 파일 전송(ProFTPD), 문서 편집(ONLYOFFICE), 웹 관리(Strapi), 웹 개발틀(Struts), 주소 서버(BIND) 프로그램입니다. 오래전에 고쳐진 결함도 업데이트하지 않은 서버가 남아 있으면 그대로 뚫립니다.","todo":"담당자는 우리 회사에서 이 다섯 프로그램을 쓰는지 자산 목록에서 찾고, 쓴다면 버전을 확인해 최신으로 올리세요. 더 이상 지원되지 않는 버전(Strapi 항목은 지원 종료 가능성이 명시됨)은 업데이트가 어려우니 교체·폐기를 검토하세요. 인터넷에 직접 열려 있다면 먼저 접근을 막으세요.","cls":["A"],"s":1297,"e":3117},{"id":"D20261009-cisco-seg","title":"Cisco Secure Email Gateway CVE-2026-76461 — 로그인 없이 루트 명령 실행","file":"일일/2026-10-09.md","date":"2026-09-14","type":"엣지·웹 서비스 취약점","actor":"미귀속","region":"글로벌","evidence":"확인","easy":"회사로 들어오는 메일을 걸러 주는 Cisco 장비에서, 조작된 메일 한 통만으로 장비의 최고 권한(루트)으로 명령을 실행할 수 있는 결함이 이미 악용되고 있습니다. 보안 장비 자체가 뚫리면 메일 내용 열람이나 내부망 침투의 발판이 될 수 있습니다. 한 달 가까이 지난 건이지만 아직 이 저장소에 정리하지 못해 오늘 추가합니다.","todo":"담당자는 Cisco 이메일 게이트웨이(AsyncOS)를 쓰는지 확인하고 Cisco 공지의 수정 버전으로 올리세요. 우회책이 없다고 보도됐으니 패치가 핵심입니다. 이미 침해됐을 수 있으니 패치 후에도 Cisco가 공개한 침해 지표(IOC)로 점검하되(미검출이 미침해의 증거는 아님), 장비 안의 로그는 공격자가 지울 수 있으므로 방화벽·네트워크 기록과 대조하세요.","cls":["A"],"s":3272,"e":4976},{"id":"D20261013-ivanti","title":"Ivanti Connect Secure 인증 우회 제로데이 — 루트 권한까지 체인 공격","file":"일일/2026-10-13.md","date":"2026-10-13","type":"노출 VPN 장비 취약점","actor":"UTA0576(Volexity 명명, 보도)","region":"글로벌","evidence":"확인","easy":"회사 직원들이 외부에서 사내망에 접속할 때 쓰는 Ivanti VPN 장비에 로그인 절차를 건너뛸 수 있는 결함이 있고, 공격자들이 이미 10월 초부터 이를 실제로 쓰고 있었습니다. 더 나쁜 건 이 결함 하나만으로 끝나지 않고 아직 패치 안 된 또 다른 결함과 엮어서 장비의 최고 권한(루트)까지 올라갔다는 점입니다.","todo":"담당자는 Ivanti Connect Secure를 쓰는지 확인하고 Ivanti 공지의 수정 버전(ICS 22.8R2.5, 25.1.3.0, 25.1.3.1, 25.1.1.2 등, 계열별로 다르므로 공지 확인)으로 즉시 올리세요. 이미 뚫렸을 가능성이 있으니 패치만으로 끝내지 말고 계정 비밀번호, LAPS 비밀번호, BitLocker 복구 키 등 장비가 알고 있던 비밀 값을 깨끗한 환경에서 다시 발급하세요. 장비에서 바로 새 비밀번호를 만들지 마세요.","cls":["A"],"s":1330,"e":3061},{"id":"D20261014-ahsaycbs","title":"Ahsay AhsayCBS — 인증 우회 + 명령 삽입으로 웹셸·채굴기 설치","file":"일일/2026-10-14.md","date":"2026-10-07","type":"노출 백업 서버 취약점","actor":"미상","region":"글로벌","evidence":"확인","easy":"회사 데이터를 백업해 주는 Ahsay 백업 서버(AhsayCBS) 소프트웨어에 두 가지 결함이 있었고, 이를 엮으면 로그인 없이 서버 최고 권한(SYSTEM)으로 명령을 실행할 수 있습니다. 공격자들은 이걸로 몰래 접속할 뒷문(웹셸)을 심고, 서버 자원을 훔쳐 가상자산을 채굴하는 프로그램까지 설치했습니다.","todo":"Ahsay AhsayCBS를 쓴다면 버전에 맞는 핫픽스(v10 계열은 10.3.4.45, v7~v9 계열은 9.15.2.70, 보도 기준이며 Ahsay 발표 인용)를 파트너 포털에서 받아 적용하세요. 이전 패치(v10.3.4.0·v9.15.2.59)는 결함을 완전히 막지 못했다고 Ahsay가 직접 확인했다는 보도가 있습니다. 패치만으로는 이미 심어진 웹셸이 없어지지 않으니, 서버에서 낯선 JSP 파일이나 'MicrosoftEdgeUpdateSvc'라는 이름의 수상한 서비스가 있는지 반드시 확인하고 지우세요.","cls":["A"],"s":1259,"e":3114},{"id":"D20261014-panos","title":"Palo Alto Networks PAN-OS 관리 인터페이스 — 루트 권한 코드 삽입","file":"일일/2026-10-14.md","date":"2026-10-14","type":"노출 방화벽 관리 인터페이스 취약점","actor":"미상","region":"글로벌","evidence":"확인","easy":"회사 네트워크를 지키는 Palo Alto 방화벽의 관리 화면에 결함이 있어서, 이미 로그인 권한(인증)을 가진 채 그 화면에 접근할 수 있는 공격자가 방화벽의 최고 권한(루트)으로 명령을 실행할 수 있습니다. 벤더 공식 공지는 \"인증된 공격자\"를 전제로 명시하므로, 비밀번호 없이 바로 뚫리는 결함은 아닙니다. 그래도 벤더는 \"매우 제한적인 악용\"이 있었다고 밝혔습니다.","todo":"PAN-OS를 쓴다면 관리 인터페이스(장비 설정 화면)를 인터넷에서 바로 접근하지 못하게 막고, Palo Alto가 공개한 수정 버전(예: PAN-OS 12.2는 12.2.4 이상, 계열별로 다르니 공지 확인)으로 올리세요. 공개된 공격자 IP 3개(66.42.72.14, 208.83.239.114, 149.248.47.234)가 접속한 적이 있는지 로그에서 확인하세요.","cls":["A"],"s":3260,"e":5807},{"id":"D20261016-beyondtrust","title":"BeyondTrust Remote Support 인증 우회 — 8월부터 국가 배후 추정 공격자가 악용","file":"일일/2026-10-16.md","date":"2026-10-16","type":"노출 원격지원 장비 취약점","actor":"ARMORY CASTLE(Mandiant 명명, 중국 연계 추정, 보도)","region":"글로벌","evidence":"확인","easy":"고객센터·IT 지원팀이 원격으로 컴퓨터를 조작할 때 쓰는 BeyondTrust 원격지원 장비에 로그인 없이도 뚫을 수 있는 결함이 있었습니다. 중국과 연계됐을 것으로 보이는 공격자 그룹이 이미 8월부터 몰래 이 결함을 써 왔다는 것이 10월 중순에 드러났습니다.","todo":"BeyondTrust Remote Support·Privileged Remote Access를 쓴다면, SaaS(클라우드) 버전은 10/8에 이미 패치됐으니 최신 상태인지 확인하고, 자체 서버에 설치한(온프레미스) 버전은 자동 업데이트가 꺼져 있다면 수동으로 패치하세요. 8월부터 뚫려 있었을 가능성이 있으니 패치 후에도 침해 지표(IOC)를 점검하세요.","cls":["A"],"s":1177,"e":3559},{"id":"D20261021-siteguard","title":"EG Secure Solutions SiteGuard Server Edition CVE-2026-106931","file":"일일/2026-10-21.md","date":"2026-10-14(공개·KEV 전 보도 기준)","type":"서버 소프트웨어 취약점","actor":"미귀속","region":"일본 중심","evidence":"확인","easy":"일본에서 많이 쓰는 서버용 보안 소프트웨어(SiteGuard, 일종의 침입 차단 프로그램)에 결함이 있어, 이미 서버에 낮은 권한으로 들어와 있는 공격자가 그 결함을 이용해 서버의 최고 권한(root/SYSTEM)까지 올라갈 수 있습니다. 실제 공격에 쓰였다는 것이 제조사와 일본 정부 대응팀(JPCERT/CC)에 의해 확인됐습니다.","todo":"바로 패치부터 하지 말고, 제조사가 안내하는 대로 관리 화면에서 진단정보(로그)를 먼저 내려받아 보존한 다음 수정판을 적용하세요. 패치가 침입 흔적을 지울 수 있다고 벤더가 직접 경고했습니다.","cls":["A"],"s":1440,"e":2843},{"id":"D20261021-plex","title":"Plex Media Server 체이닝 가능 취약점 4건","file":"일일/2026-10-21.md","date":"2026-10-20(KEV 등재)","type":"서버 소프트웨어 취약점","actor":"미귀속","region":"글로벌","evidence":"확인","easy":"집이나 소규모 사무실에서 영상·음악을 모아 재생할 때 많이 쓰는 프로그램 Plex Media Server에서, 서로 이어 붙이면 위험해지는 결함 4개가 발견돼 CISA가 \"실제 공격에 쓰였다\"며 긴급 목록(KEV)에 올렸습니다.","todo":"Plex Media Server를 1.43.3.10861 이상으로 업데이트하세요. 외부(인터넷)에서 접속되게 포트를 열어 둔 경우라면 꼭 필요한지 다시 확인하세요.","cls":["A"],"s":2973,"e":4722},{"id":"D20261021-arundel","title":"미국 메릴랜드 Anne Arundel County 랜섬웨어(Rhysida 주장)","file":"일일/2026-10-21.md","date":"2026-08(공격 시점, 보도 기준)","type":"지자체 랜섬웨어·데이터 탈취","actor":"Rhysida(주장)","region":"미국","evidence":"보도(일부 확인)","easy":"미국 메릴랜드주 Anne Arundel 카운티(지방정부)가 8월에 침해를 당해 일부 시스템의 파일이 빠져나갔다고 카운티가 직접 확인했습니다. 랜섬웨어 조직 Rhysida는 2.6테라바이트, 81만여 개 파일을 가져갔다며 다크웹에서 비트코인 25개(약 20억 원 상당)에 팔겠다고 올렸는데, 이 수치는 범죄조직의 주장일 뿐 카운티가 확인한 내용은 아닙니다.","todo":"이 카운티의 주민이라면 공식 통지를 기다리고, 아직 통지를 받지 못했다고 안심하지 말고 카운티의 공식 발표를 주기적으로 확인하세요. 침해된 시스템에서는 비밀번호를 바꾸지 말고, 안전한 기기에서 공식 안내에 따라 조치하세요.","cls":["J"],"s":4888,"e":5902},{"id":"D20261022-php2shell","title":"PHP \"PHP2Shell\" 치명적 결함(CVE-2026-109618, CVE-2026-109619)","file":"일일/2026-10-22.md","date":"2026-10-21(긴급 패치 공개)","type":"서버 소프트웨어 취약점","actor":"미귀속","region":"글로벌","evidence":"확인","easy":"웹사이트 서버 쪽에서 널리 쓰이는 프로그래밍 언어 PHP 자체에 치명적 결함 2개가 발견됐습니다. 로그인조차 필요 없이 멀리서 서버에 명령을 실행시킬 수 있는 결함이라, PHP로 돌아가는 웹사이트는 사실상 전부 영향권입니다. 패치가 나오기도 전에 이미 공격이 시도되고 있었다고 Cloudflare가 확인했습니다.","todo":"직접 서버를 관리한다면(또는 관리업체에 문의해) PHP를 8.5.12·8.4.27·8.3.36·8.2.35 중 내 버전대의 최신 수정판으로 지금 업데이트하세요. 당장 업데이트가 어렵다면 잠시 해당 웹사이트를 인터넷에서 내려 두는 것도 선택지입니다(영국 NCSC 권고).","cls":["A"],"s":1456,"e":3342},{"id":"D20261022-safepay","title":"SafePay 랜섬웨어 CISA·FBI 공동권고(AA26-293A)","file":"일일/2026-10-22.md","date":"2026-10-21(공동권고 발표, 활동 기간 2024-11~2026-08)","type":"랜섬웨어(이중 갈취)","actor":"SafePay","region":"북미·남미·유럽·호주","evidence":"확인","easy":"미국 CISA·FBI·비밀경호국과 독일·영국 수사기관이 함께 \"SafePay\"라는 랜섬웨어 조직이 2024년 8월부터 전 세계 600곳 이상의 기반 시설급 기관을 공격했다고 공식 경고했습니다. 이 조직은 다른 유명 랜섬웨어 조직들이 와해된 뒤 그 자리를 메우며 몸집을 키웠습니다.","todo":"내 기관이 VPN·방화벽 같은 외부 접속 장비를 쓰고 있다면, 담당자는 그 장비들이 CISA KEV(실제 악용 확인 목록)에 오른 결함을 방치하고 있지 않은지부터 확인하고, 모든 외부 접속에 다중 인증(MFA)이 빠짐없이 걸려 있는지 점검하세요.","cls":["A","B","F"],"s":3516,"e":5009},{"id":"D20261022-updraftcentral","title":"UpdraftCentral(워드프레스 백업 관리) 탈취 키로 백도어 설치","file":"일일/2026-10-22.md","date":"2026-10-18~19(공격 관측, 보고서 작성 시점 진행 중)","type":"서드파티 키 탈취 → 공급망 변조","actor":"미귀속","region":"글로벌(워드프레스 생태계)","evidence":"확인(보도: Patchstack·Nethemba 등)","easy":"수많은 워드프레스 사이트를 중앙에서 백업·관리해 주는 UpdraftCentral 서비스의 \"진짜 열쇠(키)\"를 공격자가 손에 넣어, 정상적인 명령인 것처럼 속여 연결된 사이트들에 뒷문(백도어)을 심고 있습니다. 코드 자체의 결함이 아니라 열쇠를 도둑맞은 것이라, 플러그인을 아무리 업데이트해도 열쇠를 바꾸지 않으면 계속 뚫릴 수 있습니다.","todo":"UpdraftCentral으로 사이트를 관리하고 있다면, 패치를 기다리지 말고 지금 UpdraftCentral 연결 키를 삭제(연결 해제)하세요. 이미 낯선 플러그인이 설치돼 있거나 사이트가 갑자기 멈췄다면, 그 사이트는 침해됐다고 가정하고 백업을 복원하기 전에 비밀번호를 모두 새로 바꾸세요(단, 침해 의심 사이트 자체에서 바꾸지 말고 안전한 기기에서).","cls":["C"],"s":5220,"e":6854},{"id":"D20261022-emudhra","title":"eMudhra 인증기관(CA) 중간 인증서 약한 키","file":"일일/2026-10-22.md","date":"2026-10-17(발견)~10-20(브라우저 차단 완료)","type":"인증·키 설계 결함","actor":"해당 없음(결함 발견, 악용 미확인)","region":"글로벌","evidence":"확인","easy":"웹사이트가 \"진짜\"임을 보증해 주는 인증기관(CA) 중 하나인 eMudhra가 만든 인증서 8개의 \"서명용 비밀열쇠\"가 사실상 256가지 중 하나로 아주 쉽게 맞혀질 수 있을 만큼 허술했습니다. 이 열쇠를 알아내면 공격자가 실제 사이트를 사칭하는 가짜 인증서를 만들 수 있어, Mozilla·Google·Apple이 해당 인증서를 모두 차단했습니다.","todo":"일반 사용자는 브라우저(Firefox·Chrome 등)와 운영체제(macOS·iOS 등)의 보안 업데이트를 지금 설치하면 된다(설치만으로 자동 반영). 직접 서버를 운영한다면 Go 언어로 만든 프로그램은 1.27.3/1.26.10 이상으로, Node.js·Debian/FreeBSD의 인증서 묶음(ca-certificates)도 각 배포판 패치를 확인하세요.","cls":["H"],"s":7013,"e":8740},{"id":"D20261022-onamae","title":"일본 GMO Onamae Desktop Cloud 침해","file":"일일/2026-10-22.md","date":"2026-10-20(회사 확인)~10-21(서버 강제 중단, 공개)","type":"클라우드/호스팅 공급자 침해","actor":"미귀속","region":"일본","evidence":"확인","easy":"일본의 대형 도메인·호스팅 업체 GMO가 운영하는 'Desktop Cloud'(외환 자동매매 프로그램을 24시간 돌리는 가상 서버 서비스)에 외부인이 몰래 들어와 악성 프로그램을 심었습니다. 최대 2만6,739대의 고객 서버가 영향권에 들어 회사가 서버를 강제로 껐습니다.","todo":"이 서비스를 쓰고 있다면, 그 서버에 저장해 둔 비밀번호나 접속키는 **그 서버가 아닌 다른 안전한 기기에서** 새로 바꾸세요. 결제(신용카드) 정보는 별도 시스템에 있어 영향이 없다고 회사가 밝혔지만, 이 사건을 빙자한 피싱 메일·전화(GMO는 전화·메일로 비밀번호를 묻지 않는다고 공지)에 주의하세요.","cls":["C","J"],"s":8892,"e":10750},{"id":"D20261023-connectwise","title":"커넥트와이즈 클라우드 백업 침해 — AI 에이전트 도구 '아르텍스'로 계정 탈취(Storm-0940)","file":"일일/2026-10-23.md","date":"2026-10(9월부터 공격, 10/15 이후 수법 변화, 10/23 MS 분석 공개)","type":"비밀번호 대입 + 신뢰 관계 악용","actor":"Storm-0940(중국 정부 연계 추정)","region":"글로벌(한국 금융권 연관 이력 포함)","evidence":"확인","easy":"마이크로소프트(MS)가 클라우드 백업 업체 커넥트와이즈(ConnectWise)의 침해 사건을 분석한 결과, 공격자가 AI가 스스로 여러 단계를 이어서 수행하는 \"에이전트형\" 해킹 도구 '아르텍스(ARTEX)'로 비밀번호 대입 공격과 계정 탈취를 자동화했고, 일부에서는 공격 시작 3시간 안에 관리자급 권한까지 손에 넣었다고 밝혔습니다. 이 도구는 과거 한국 금융기관을 겨냥한 공격에도 쓰인 적이 있어, 레코디드퓨처는 최근 한국 금융권을 노리는 공격 조직을 별도로 추적하고 있습니다.","todo":"커넥트와이즈 서비스를 연동해 쓰고 있다면, 담당자는 연동 계정·토큰을 지금 재발급(회전)하고 MS 그래프·디렉터리에 낯선 계정·그룹·권한이 생기지 않았는지 확인하세요. 일반 이용자는 이 사건으로 바로 할 일은 없지만, 소속 기관이 커넥트와이즈를 쓰는지 담당 부서에 문의할 수 있습니다.","cls":["C","B"],"s":1801,"e":4269},{"id":"D20261023-velocloud","title":"Arista VeloCloud Orchestrator 제로데이(CVE-2026-114625)","file":"일일/2026-10-23.md","date":"2026-10-23(벤더 공지·패치 공개)","type":"SQL 삽입 → 권한 상승","actor":"미귀속","region":"글로벌","evidence":"확인","easy":"기업 네트워크를 중앙에서 관리하는 Arista의 VeloCloud Orchestrator(VCO, 자체 설치형)에서 낮은 권한의 로그인 사용자가 데이터베이스 명령을 끼워 넣는 결함으로 \"슈퍼유저\" 권한까지 올라갈 수 있는 치명적 결함이 실제로 공격에 쓰이고 있습니다.","todo":"VCO On-Prem을 운영한다면 지금 5.2.3.18·6.1.3.10·6.4.2.12 이상으로 업데이트하세요. 당장 패치가 어렵다면 Arista가 공개한 공격자 IP(74.82.197.86, 38.54.50.151)를 차단하고 관리 웹 화면 접근을 관리망으로만 제한하세요.","cls":["A"],"s":4431,"e":5895},{"id":"D20261023-litellm","title":"LiteLLM 공급망 공격 — 릴리스 파이프라인 장악, PyPI·Docker에 정보 탈취 악성코드 배포","file":"일일/2026-10-23.md","date":"2026-10-21(공격)~10-22(제거 완료, 보도)","type":"공급망(릴리스 파이프라인 변조)","actor":"미귀속","region":"글로벌","evidence":"확인(Socket·Endor Labs 분석, 메인테이너 확인)","easy":"여러 AI 서비스를 중개하는 오픈소스 도구 LiteLLM의 \"정식 배포 과정\" 자체가 공격자에게 장악돼, PyPI·Docker Hub·GitHub 컨테이너 저장소에 정보 탈취 악성코드가 심긴 가짜 정식 버전(1.107.0)이 약 2~3시간 동안 올라가 있었습니다. 코드를 내려받거나 `pip install`만 해도 비밀번호·API 키·개발 도구 인증정보가 통째로 빠져나갈 수 있는 구조였습니다.","todo":"LiteLLM 1.107.0을 설치·배포했거나 그 시간대에 pip/Docker 명령을 실행한 적이 있다면, 지금 추가로 Python이나 pip를 실행하지 말고(실행할 때마다 악성코드가 다시 동작할 수 있음) 해당 환경을 깨끗한 백업에서 다시 만들고, 그 환경에 있던 모든 비밀번호·키·토큰을 **다른 안전한 환경에서** 새로 발급하세요.","cls":["C"],"s":6104,"e":8377},{"id":"D20261023-capcom","title":"Capcom CAPCOM ID 데이터 유출 — 계정 1,170만여 개 영향","file":"일일/2026-10-23.md","date":"2026-10-19(탐지·확인)~10-21(신고)","type":"개인정보 유출","actor":"미귀속","region":"글로벌(일본)","evidence":"확인","easy":"일본 게임사 Capcom의 여러 서비스에서 공통으로 쓰는 로그인 계정(CAPCOM ID)이 해킹당해 1,170만여 개 계정의 이메일 주소와 로그인 관련 정보가 유출됐습니다. 극히 일부(43개 계정)는 생년월일·성별 등 더 많은 정보가, 196개 계정은 비밀번호가 공격자에 의해 바뀌어 잠겼습니다. 비밀번호 자체와 신용카드 정보는 영향이 없다고 회사는 밝혔습니다.","todo":"CAPCOM ID를 쓰고 있다면 Capcom의 공식 안내 메일·공지만 믿고, \"계정 확인\"을 유도하는 다른 이메일·문자의 링크는 누르지 마세요. 같은 이메일·비밀번호를 다른 사이트에서도 쓰고 있다면 그 사이트들의 비밀번호를 바꾸는 것이 안전합니다.","cls":["J"],"s":8527,"e":10032},{"id":"D20261023-railway","title":"Railway 클라우드 플랫폼 — 고객 비밀값(시크릿) 노출 가능성","file":"일일/2026-10-23.md","date":"2026-10(이번 주 초 탐지, 10/22 공개)","type":"클라우드 플랫폼 비밀값 노출","actor":"미귀속","region":"글로벌","evidence":"확인(회사 공지)","easy":"코드를 올리면 자동으로 서버에 배포해 주는 클라우드 서비스 Railway가 \"고객의 환경변수(API 키·DB 접속정보 등 비밀값)를 저장하는 시스템에서 외부인의 접근이 의심된다\"고 이용자들에게 경고하며 비밀값을 모두 바꾸라고 안내했습니다. 일부는 암호화가 풀린 채로 접근됐을 가능성이 있다고 합니다.","todo":"Railway를 쓰고 있다면 지금 그 플랫폼에 저장해 둔 모든 환경변수·API 키·DB 비밀번호·프라이빗 레지스트리 접속정보를 새로 발급해 교체하세요. 서비스 로그에서 이상한 접근이 없었는지도 함께 확인하세요.","cls":["C","J"],"s":10191,"e":11658},{"id":"D20261023-gitlab","title":"GitLab 정규표현식 컴파일러 치명적 결함(CVE-2026-110264)","file":"일일/2026-10-23.md","date":"2026-10-22(패치 공개)","type":"인증 없는 원격 코드 실행(이론상, 실제 악용 미확인)","actor":"해당 없음","region":"글로벌","evidence":"확인(실제 악용은 미확인)","easy":"소스코드 관리 도구 GitLab에서, 특정 형식으로 만든 정규표현식(패턴) 하나만 서버가 처리하게 만들면 로그인 없이도 서버에서 임의 코드를 실행시킬 수 있는, 벤더가 \"최고 위험도(치명적)\"로 분류한 결함이 발견돼 패치됐습니다. 아직 실제로 이용된 공격은 확인되지 않았습니다.","todo":"GitLab을 직접 설치해 운영한다면(GitLab.com 이용자는 이미 자동 적용됨) 관리자가 지금 19.5.1·19.4.3·19.3.6·19.2.9·19.1.9·19.0.10·18.11.13 중 해당 버전으로 업데이트하도록 요청하세요.","cls":["A"],"s":11831,"e":13189},{"id":"D20261023-yonsei","title":"연세대 학사 행정 포털 개인정보 유출 (국내)","file":"일일/2026-10-23.md","date":"2026-10-22(학교 확인·공지)","type":"개인정보 유출","actor":"미귀속","region":"한국","evidence":"확인(학교 공지, 보도)","easy":"연세대 학사 행정 포털에 외부인이 허락 없이 접근해 재학생·졸업생 등 약 1만여 명의 학번·휴대전화번호·이메일 등이 유출됐습니다. 주민등록번호 같은 더 민감한 정보는 포함되지 않았다고 학교는 밝혔습니다.","todo":"연세대 구성원이라면 학교 공지(대표 홈페이지)에서 내 정보가 유출됐는지 확인하고, 학교·행정실을 사칭한 문자·전화·메일을 조심하세요. 다른 사이트에서 같은 비밀번호를 쓰고 있다면 그 사이트의 비밀번호도 바꾸는 것이 안전합니다.","cls":["J"],"s":13322,"e":14493},{"id":"D20261023-kfund","title":"한국국제교류재단(KF) 메일시스템 침해 조사 (국내)","file":"일일/2026-10-23.md","date":"2026-10-19(이상 징후 발견)~10-22(신고)","type":"침해 조사 중(실제 유출 여부 미확정)","actor":"미귀속","region":"한국","evidence":"확인(재단 신고, 보도)","easy":"한국국제교류재단의 대량 홍보메일 발송 시스템에서 수상한 접근 흔적이 발견됐습니다. 이 시스템에는 구독자 이메일 주소 약 22만 7천 건(이름 포함 약 18만 7천 건, 전화번호 포함 약 5,400건)이 들어 있었는데, **이 숫자는 서버에 저장돼 있던 양이고 실제로 빼내 갔는지는 아직 확인되지 않았습니다.**","todo":"한국국제교류재단의 홍보메일을 받아본 적이 있다면, 재단·외교·문화교류 행사를 사칭한 메일이나 문자의 링크·첨부파일을 열지 마세요. 재단은 전화로 비밀번호나 결제 정보를 묻지 않습니다.","cls":["J"],"s":14653,"e":16304},{"id":"D20261024-collabora","title":"Nextcloud용 Collabora 내장 CODE 서버 RCE — 웹셸 설치, 공개까지 4주 지연(CVE-2026-110447)","file":"일일/2026-10-24.md","date":"2026-09(9월 중순부터 실제 악용, 수정판 9/11 배포)~10-14(보안 공지·CVE 공개)·10-23(CISA KEV 등재)","type":"인증 없는 명령어 주입","actor":"미귀속","region":"글로벌","evidence":"확인(Collabora·Nextcloud 공지, CISA KEV, 관리자 보고)","easy":"문서 공동편집 플랫폼 Nextcloud에 함께 쓰이는 Collabora의 \"내장 CODE 서버\" 기능에서, 그 서버가 잠깐 꺼져 있는 틈(재시작·업그레이드·오류 직후)을 노려 로그인 없이도 서버에 명령을 실행시킬 수 있는 결함이 실제로 악용되고 있습니다. 공격자는 이 결함으로 서버에 \"웹셸\"(원격 뒷문 파일)을 심어 비밀번호·암호화폐 지갑 흔적을 뒤진 것으로 보고됐습니다. 결함을 고친 버전은 9월 11일에 나왔지만, 공식 보안 공지·CVE는 한 달 넘게 지나서야 공개됐습니다.","todo":"Nextcloud에 richdocumentscode(내장 Collabora CODE 서버) 앱을 쓰고 있다면 지금 26.4.303 이상으로 업데이트하거나, 꼭 필요하지 않다면 앱을 완전히 제거하세요(끄기만 해서는 안 됩니다). 이미 공격받은 흔적(낯선 PHP 파일 등)이 있다면 비밀번호를 그 서버에서 바로 바꾸지 말고, 안전한 다른 기기에서 바꾸세요.","cls":["A"],"s":1698,"e":3938},{"id":"D20261024-questdx","title":"Quest Diagnostics 검사실 관리 시스템(Quanum LSM) 무단 접근 — 환자 기록 노출","file":"일일/2026-10-24.md","date":"2026-10-21(무단 접근 인지)","type":"개인정보 유출(조사 중, 항목·규모 미확정)","actor":"미귀속","region":"글로벌(미국)","evidence":"확인(회사 SEC 제출·공지)","easy":"미국 대형 임상검사 회사 Quest Diagnostics가 의료진이 검사를 주문하고 결과를 확인하는 온라인 시스템(Quanum LSM)에 외부인이 허락 없이 접근한 것을 확인했습니다. 일부 환자 기록이 노출된 것으로 보고 있지만, 정확히 몇 명의 어떤 정보가 유출됐는지는 아직 회사도 파악하지 못했습니다.","todo":"Quest Diagnostics에서 검사를 받은 적이 있다면 지금 당장 할 일은 없습니다. 회사의 추가 공지를 기다리고, 공식 공지 전에 \"유출 확인\" 등을 명목으로 개인정보나 결제 정보를 요구하는 메일·전화는 응하지 마세요.","cls":["J"],"s":4129,"e":5528},{"id":"D20261024-arubaos","title":"HPE ArubaOS 최고 심각도 결함 8건(전체 72건 패치) — 인증 우회·명령어·SQL 삽입 → RCE","file":"일일/2026-10-24.md","date":"2026-10-23(벤더 공지·패치 공개)","type":"인증 우회·명령어 주입·SQL 삽입 → 원격 코드 실행","actor":"해당 없음","region":"글로벌","evidence":"확인(HPE 공지, 실제 악용·PoC 미확인)","easy":"HP엔터프라이즈(HPE)의 무선 네트워크 장비 운영체제 ArubaOS(AOS-8·AOS-10)에서, 로그인 없이도 공격자가 장비를 완전히 장악할 수 있는 \"최고 위험도\" 결함 8건이 발견돼 패치됐습니다(전체로는 72건 패치). 아직 공개된 공격 도구나 실제 공격 사례는 확인되지 않았습니다.","todo":"회사나 기관에서 Aruba 무선 액세스 포인트·컨트롤러·모빌리티 컨덕터를 운영한다면, 네트워크 담당자에게 HPE 보안 공지(hpesbnw05162en_us)를 확인해 지금 패치하도록 요청하세요. 당장 패치가 어렵다면 관리 화면 접근을 관리망으로만 제한해야 합니다.","cls":["A"],"s":5738,"e":7267},{"id":"D20261024-node2shell","title":"Node.js·Bun Brotli 디코더 결함 — 요청뿐 아니라 응답 처리로도 공격 가능(CVE-2026-111497)","file":"일일/2026-10-24.md","date":"2026-10-21(패치 공개)~10-22(PoC 등장)","type":"압축 해제 처리 중 메모리 손상(버퍼 오버플로) → 원격 코드 실행","actor":"해당 없음","region":"글로벌","evidence":"확인(Node.js 보안팀, 실제 공격 미확인)","easy":"서버 프로그램을 만드는 데 널리 쓰이는 Node.js(와 Bun)에서, 데이터를 압축 해제하는 내부 기능(Brotli)에 조작된 압축 데이터를 넣으면 서버에서 임의 코드가 실행될 수 있는 결함이 발견돼 패치됐습니다. 이 결함은 공격자가 서버로 보내는 요청뿐 아니라, 서버가 \"바깥으로 내보낸 요청의 응답\"을 받을 때도 작동할 수 있어 막기가 더 까다롭습니다. 패치 하루 뒤 보안 연구자들이 실제로 코드 실행에 성공하는 검증 코드를 만들었지만, 아직 실제 공격에 쓰였다는 사례는 확인되지 않았습니다.","todo":"Node.js 또는 Bun으로 서버·백엔드를 운영하는 조직이라면 담당 개발자에게 지금 지원 버전(Node.js 26.12.1·24.22.1·22.23.4 이상, Bun 1.4.4 이상)으로 업데이트하도록 요청하세요. 일반 이용자가 당장 할 일은 없습니다.","cls":["A"],"s":7502,"e":9724},{"id":"D20261024-koreanair","title":"대한항공 고객 예약번호 유출 — 위탁 발권망(아마데우스) 침해 (국내)","file":"일일/2026-10-24.md","date":"2023-08~2026-09(추정 침해 기간, 조사 중)·2026-10-20(아마데우스가 대한항공에 통보)","type":"서드파티(GDS) 신뢰 관계 악용","actor":"미귀속","region":"한국","evidence":"확인(대한항공 공지, 보도)","easy":"대한항공이 항공권 예약·발권 업무를 맡기는 글로벌 IT 업체 아마데우스(Amadeus)의 시스템이 뚫려, 대한항공 고객의 예약번호가 외부로 노출됐습니다. 대한항공 자체 전산망이 직접 뚫린 것은 아니고, 발권 업무를 대신 처리해 주는 **외부 업체 쪽**이 뚫린 것이 원인입니다. 다른 개인정보가 추가로 유출됐는지는 아직 확인 중입니다.","todo":"대한항공을 이용했다면 지금 당장 바꿀 비밀번호는 없습니다(예약번호 유출이며, 대한항공 계정 비밀번호 유출이 아닙니다). 대한항공·아마데우스를 사칭해 \"예약 확인\"이나 개인정보를 요구하는 메일·문자·전화의 링크는 누르지 말고, 대한항공 공식 공지로만 확인하세요.","cls":["C"],"s":9926,"e":12256},{"id":"D20261025-blackx","title":"BlackX UEFI 부트킷 — 침해 후 지속성 도구, 2022년 \"Baton Drop\" 결함(CVE-2022-21894)으로 Secure Boot 우회, 중앙아시아 외교기관 스파이 활동","file":"일일/2026-10-25.md","date":"2026년 초(스파이 활동 관측 시작, 정확한 최초 시점 비공개)~2026-10-23(Kaspersky 분석 공개)","type":"침해 후 UEFI 부트킷을 통한 Secure Boot 우회·지속성 확보(지정학적 첩보 목적 추정)","actor":"미귀속(Kaspersky가 중간 확신도로 APT41/Brass Typhoon/Wicked Panda/Barium으로 추정)","region":"글로벌(타지키스탄·우즈베키스탄·투르크메니스탄 외교기관 표적)","evidence":"확인(Kaspersky 분석)","easy":"공격자가 이미 어떤 방법으로든 기업망에 침투해 관리자 권한까지 확보한 뒤, 거기서 더 깊고 오래 숨어 있기 위해 컴퓨터가 켜질 때 윈도우보다 먼저 실행되는 \"부팅 단계\"에 몰래 끼어드는 악성코드(UEFI 부트킷) \"BlackX\"를 심는 사례가 발견됐습니다. 이 부트킷은 윈도우의 보안 기능인 Secure Boot(서명되지 않은 프로그램은 부팅 단계에서 실행하지 못하게 막는 기능)를, 2022년에 이미 알려진 낡은 결함(\"Baton Drop\")을 이용해 우회합니다. 문제는 그 결함을 막는 조치(인증서 폐기)가 자동으로 적용되지 않고 관리자가 수동으로 한 단계를 더 처리해야 한다는 점인데, 이걸 하지 않은 \"완전히 패치된\" 윈도우 PC들도 그대로 당했습니다. 다만 이 부트킷이 보안 소프트웨어를 끄려고 시도한 기능은 Kaspersky 자체 분석에서 정작 Kaspersky 제품에는 효과가 없었던 것으로 확인됐습니다(다른 보안제품 대상 효과는 별도로 공개되지 않음). 중앙아시아 외교기관을 겨냥한 스파이(정보 수집) 활동에 실제로 쓰였습니다.","todo":"일반 개인 이용자가 당장 할 일은 없습니다(이 공격은 특정 외교기관을 겨냥한 표적형입니다). 회사·기관의 윈도우 PC를 관리한다면, 담당자에게 마이크로소프트의 \"취약한 윈도우 부트매니저 인증서 폐기\" 안내(Tech Community 블로그)를 지금 수동으로 적용했는지 확인해 달라고 요청하세요. Windows Update만으로는 이 폐기 절차가 자동 실행되지 않습니다.","cls":["G"],"s":1808,"e":5293},{"id":"D20261025-phprce","title":"PHP 세션 처리 결함(CVE-2026-115560) — PHP2Shell과 별개의 미패치 RCE, 특정 설정 조합에서만 작동","file":"일일/2026-10-25.md","date":"2026-10-23(보안 공지 공개, 패치는 아직 없음)","type":"세션 핸들러 런타임 전환 처리 결함 → 원격 코드 실행(미패치)","actor":"해당 없음","region":"글로벌","evidence":"확인(PHP 보안팀 공지, 실제 악용 미확인)","easy":"웹사이트의 약 70%가 쓰는 프로그래밍 언어 PHP에서, [D20261022-php2shell](2026-10-22.md)(PHP2Shell)과는 별개인 새로운 원격 코드 실행 결함(CVE-2026-115560)이 발견됐습니다. 아직 수정판이 나오지 않았지만, PHP 보안팀은 \"특이한 설정과 코드 조합\"에서만 공격이 가능하다고 밝혔습니다. 즉 모든 PHP 사이트가 위험한 게 아니라, 특정 방식으로 세션을 다루는 일부 사이트만 해당됩니다.","todo":"일반 이용자가 당장 할 일은 없습니다. 자체 웹서버를 운영하는 개발자·관리자라면, 서버의 세션 설정 중 `session.upload_progress.enabled`를 지금 0으로 꺼 두는 것이 안전합니다(이 기능을 런타임에 끄고 켜는 코드를 쓰지 않는다면 끄는 데 문제가 없습니다).","cls":["A"],"s":5525,"e":7738},{"id":"D20261025-popcorntime","title":"폐기된 Popcorn Time 포크 앱(Time4Popcorn) 자동 업데이트 결함 — 최대 335만 기기 노출, 연구자가 선의로 차단(CVE-2026-30612)","file":"일일/2026-10-25.md","date":"2025-11~2026-03(연구자의 선의 조치 기간)·2026-10-23(보도 공개)","type":"서명·암호화 없는 HTTP 자동 업데이트 메커니즘 → 원격 코드 실행","actor":"해당 없음(실제 악의적 공격자는 확인되지 않음)","region":"글로벌","evidence":"확인(Eye Security 분석)","easy":"영화·TV를 무단으로 스트리밍해 주던 \"Popcorn Time\"의 포크(파생) 앱 중 하나인 \"Time4Popcorn\"이 이미 관리를 그만둔(버려진) 상태인데, 이 앱의 자동 업데이트 기능이 암호화도 서명 확인도 없이 동작하고 있었습니다. 그 업데이트용 인터넷 주소(도메인)가 버려진 것을 보안 연구자들이 먼저 사들여, 누군가 이 앱을 쓰는 최대 335만 대(윈도 300만·맥 35만)의 컴퓨터에 원격으로 코드를 실행시킬 수 있다는 것을 확인했습니다. 다행히 실제 공격자가 이를 악용했다는 증거는 없고, 연구자들이 먼저 선의로 업데이트 기능을 꺼 버렸습니다.","todo":"아직 Time4Popcorn(또는 비슷한 Popcorn Time 포크 앱)을 PC에 설치해 쓰고 있다면, 지금 완전히 삭제하세요. 안드로이드 버전은 원격으로 끌 수 없는 구조라 여전히 위험하므로, 설치돼 있다면 바로 지워야 합니다.","cls":["I"],"s":8031,"e":10248},{"id":"D20261025-hollys","title":"할리스 커피 멤버십 해킹 — 고객정보 약 276만 건 유출, 가상화폐 채굴 목적 클라우드 접근 중 노출 (국내)","file":"일일/2026-10-25.md","date":"2026-09-03~10-07(추정 유출 기간)·2026-10-16(회사 인지)·2026-10-18(고객 통보)","type":"클라우드 서비스 비정상 접근(세부 경위 비공개)","actor":"미귀속","region":"한국","evidence":"확인(회사 공지, 보도)","easy":"커피 프랜차이즈 할리스가 멤버십 정보를 보관하던 클라우드 서비스에 외부인이 가상화폐를 채굴할 목적으로 몰래 접근했는데, 그 과정에서 고객 개인정보 약 276만 건이 함께 노출됐습니다. 유출된 정보는 활성 고객 DB가 아니라 과거 멤버십 개편 때 만들어 둔 임시 데이터 파일이며, 2020년 2월 11일 이전 가입 고객이 주로 해당합니다. 할리스는 사고를 16일에 인지했지만, 고객에게는 이틀이 지난 18일에야 문자로 알려 늦은 통보라는 비판을 받고 있습니다.","todo":"2020년 2월 이전부터 할리스 멤버십을 썼다면, 지금 할리스 비밀번호를 바꾸고, 같은 아이디·비밀번호를 다른 사이트에서도 쓰고 있다면 그 사이트들의 비밀번호도 함께 바꾸세요. 유출 항목에 비밀번호가 포함돼 있어, 비밀번호 변경이 이번 사건에서는 실제로 의미 있는 조치입니다(다른 사건과 달리 단순 안내가 아닙니다).","cls":["J"],"s":10479,"e":12399},{"id":"D20261026-agentsmd","title":"AI 코딩 에이전트(Claude Code·Codex 등) 하이재킹 — Downloads 폴더의 악성 AGENTS.md·CLAUDE.md 지침 파일을 에이전트가 그대로 신뢰","file":"일일/2026-10-26.md","date":"발견 시점 비공개(연구사 보고서는 보도 주간 내 공개)·2026-10-25(BleepingComputer 보도)","type":"AI 코딩 에이전트가 작업 디렉터리의 지침 파일(AGENTS.md·CLAUDE.md)을 자동으로 읽고 그 지시에 따라 명령 실행을 시도해 악성 패키지 설치·OAuth 토큰 노출로 이어질 수 있는 설계상 신뢰 경계 문제","actor":"미귀속(실제 공격자 불명, 연구는 보안기업 Forever Security)","region":"글로벌","evidence":"확인(Forever Security가 관측했다고 보고, 고객 PC에서 설치 시도 1건)","easy":"최근 개발자들이 많이 쓰는 \"AI 코딩 에이전트\"(OpenAI Codex, Anthropic Claude Code 등)는 작업을 시작할 폴더에 `AGENTS.md`나 `CLAUDE.md`라는 이름의 \"안내 파일\"이 있으면 그 내용을 사람의 지시만큼 신뢰하고 그대로 따릅니다. 보안회사 Forever Security는, 누군가의 PC에서 이 안내 파일이 몰래 다운로드 폴더(Downloads)에 들어가 있었고, 그 폴더에서 에이전트를 실행했더니 안내 파일의 지시에 따라 악성 프로그램(npm 패키지)을 설치하려 한 사례를 실제로 발견했습니다. 더 나아가 연구진은, 이런 방식으로 Claude Code의 통신을 공격자 서버로 몰래 우회시켜 로그인 정보(OAuth 토큰)를 빼낼 수 있다는 것도 실험으로 보여줬습니다(이건 아직 실제 공격 사례는 아니고 연구 시범입니다). OpenAI와 Anthropic은 이걸 \"고쳐야 할 결함\"이 아니라 \"에이전트가 설계대로 동작한 것\"이라는 입장이어서, 패치로 해결되지 않고 사용자가 사용 습관을 바꿔야 하는 문제입니다.","todo":"AI 코딩 에이전트(Claude Code, Codex, Cursor 등)를 쓰고 있다면, 지금부터는 다운로드 폴더(Downloads)나 홈 폴더처럼 넓은 범위가 아니라, 실제 작업할 프로젝트 폴더 안에서만 실행하세요. 낯선 `AGENTS.md`·`CLAUDE.md` 파일이 작업 폴더에 보이면 내용을 먼저 열어서 확인하고, 이상한 지시(패키지 설치, 외부 서버 접속 등)가 있으면 그 폴더에서 에이전트를 실행하지 마세요.","cls":["I","H"],"s":1477,"e":6042},{"id":"D20261027-copenhagen","title":"코펜하겐대학교(덴마크) 테스트 환경 해킹 — 학생·교직원 약 54만5천 명 정보 노출","file":"일일/2026-10-27.md","date":"발견·공개 정확한 날짜는 비공개(보도 기준 '지난 화요일' 발견, '금요일' 1차 공개, 그다음 날 추가 공개)·2026-10-26(BleepingComputer 보도)","type":"테스트 환경 무단 접근(초기 침투 경로 비공개)","actor":"미귀속","region":"덴마크(해외)","evidence":"확인(코펜하겐대학교 공지, 보도)","easy":"덴마크 코펜하겐대학교가 쓰던 \"테스트용\" 시스템에 공격자가 들어가, 학생·교직원 등 약 54만5천 명의 이름, 덴마크의 주민등록번호 성격인 CPR 번호, 전화번호, 이메일이 노출됐을 수 있다는 사실이 확인됐습니다. 이 중 약 2만 명은 건물 출입에 쓰는 PIN 코드까지 노출돼, 대학은 일부 건물 출입을 임시로 제한했습니다. 공격자가 애초에 어떻게 들어왔는지는 아직 공개되지 않았습니다.","todo":"코펜하겐대학교 재학생·교직원이라면 대학의 공식 공지로 본인 정보가 포함됐는지 확인하고, 안내받은 대로 출입 PIN 코드를 새로 발급받으세요(아직 안내받지 못했다면 공식 채널로 직접 확인). 대학을 사칭해 개인정보나 비밀번호를 요구하는 메일·문자에는 응답하지 말고 공식 공지로만 확인하세요.","cls":["J"],"s":1206,"e":5491},{"id":"D20261028-polyshell","title":"Adobe Commerce·Magento \"PolyShell\" 파일 업로드 결함 — CISA KEV 등재, 953개 쇼핑몰 장기 감염 캠페인 확인(CVE-2026-48356)","file":"일일/2026-10-28.md","date":"공개 2026-07-14(Adobe APSB26-73)","type":"공개 쇼핑몰 웹앱의 인증 없는 파일 업로드 → 원격 코드 실행","actor":"미귀속(스키밍·광고 사기 추정 캠페인)","region":"전 세계(해외)","evidence":"확인(CISA KEV 공식 경보, Sansec 연구 보도 인용)","easy":"온라인 쇼핑몰에 많이 쓰이는 Adobe Commerce·Magento라는 프로그램에 \"손님(비회원) 장바구니\" 기능을 통해 로그인 없이도 악성 파일을 서버에 올릴 수 있는 결함이 있었습니다. 이 결함은 올해 7월에 이미 패치가 나왔는데, 미국 정부(CISA)가 10월 27일 \"실제로 공격에 쓰이고 있다\"고 공식 확인해 위험 목록에 새로 올렸습니다. 보안업체 Sansec는 이 결함 등을 이용해 최소 7개월 넘게 전 세계 쇼핑몰 953곳에 악성 코드가 몰래 심어진 것을 확인했습니다. 심어진 악성 코드가 정확히 무엇을 훔치는지(카드 정보인지 다른 것인지)는 아직 확인되지 않았습니다.","todo":"Adobe Commerce·Magento 쇼핑몰을 운영한다면 최신 보안 패치(APSB26-73, 7월 공개분 포함 이후 모든 패치)가 적용됐는지 바로 확인하고, 이미 공격받았을 가능성에 대비해 관리자 계정 목록과 사이트에 심어진 수상한 스크립트를 함께 점검하세요. 패치만 하고 이미 침투한 흔적(불법 관리자 계정, 숨겨진 스크립트)을 치우지 않으면 패치 후에도 공격자가 남아 있을 수 있습니다.","cls":["A"],"s":1448,"e":5717},{"id":"D20261029-php2shellroot","title":"PHP2Shell + Linux 커널 \"Fragnesia\" 결함 체인으로 방화벽·관리서버 25대 루트 권한 탈취, 美 정부 관련 기관 포함(CVE-2026-109618, CVE-2026-109619, CVE-2026-46300)","file":"일일/2026-10-29.md","date":"PHP2Shell 공개 2026-10-21","type":"공개 웹앱 원격 코드 실행 → 커널 결함으로 root 권한 상승 → 웹셸·자격증명 탈취","actor":"미귀속(중국계 추정 보도, 북한계 스캐닝 별도 보도 — 둘 다 결론 아님)","region":"전 세계(해외, 피해 기관 1곳은 미국 정부 관련)","evidence":"확인(CISA KEV 공식 경보 2건, Dream 연구 보도 인용)","easy":"지난주 전 세계 웹사이트의 약 70%가 쓰는 프로그래밍 언어 PHP에서 로그인 없이도 서버를 장악할 수 있는 결함(PHP2Shell)이 발견돼 긴급 패치가 나왔습니다. 그런데 공격자들이 이 결함 하나만으로는 \"서버 프로그램 권한\"만 얻을 수 있었던 것을 노려, 리눅스 운영체제 자체의 또 다른 결함(연구자들이 \"Fragnesia\"라고 이름 붙인 결함)을 추가로 써서 \"컴퓨터 전체를 마음대로 할 수 있는 최고 권한(root)\"까지 올라간 사실이 보안업체 Dream(이스라엘)의 조사로 확인됐습니다. 이 방식으로 방화벽 장비 24대와 내부 관리서버 1대, 총 25대가 뚫렸고, 그중 3대는 미국 정부와 관련된 기관의 장비였습니다. 공격자는 그 안에서 비밀번호·개인 키를 훔치고 회사 내부 사용자 목록(Active Directory)까지 들여다봤습니다. 미국 정부(CISA)는 이 두 가지 결함 모두를 \"실제로 악용되고 있다\"고 공식 확인해 위험 목록에 올렸고, 첫 번째 결함(PHP2Shell)은 오늘(10/29)까지, 두 번째 결함(Fragnesia)은 10/31까지 미국 연방기관에 조치를 요구했습니다.","todo":"PHP를 쓰는 웹서버나, 이 결함이 적용될 수 있는 방화벽·보안장비를 운영한다면 두 가지 패치(PHP 8.5.12/8.4.27/8.3.36/8.2.35, 그리고 해당 리눅스 커널 최신 보안판) **모두**를 지금 바로 적용하세요. 하나만 막으면 나머지 하나로 똑같이 뚫릴 수 있습니다. 이미 공격받은 기기라면 비밀번호·키를 그 기기가 아닌 **다른 안전한 기기에서** 새로 만들어야 합니다 — 뚫린 기기에서 비밀번호만 바꾸면 공격자가 이미 심어둔 뒷문은 그대로 남습니다.","cls":["A"],"s":2109,"e":5939},{"id":"D20261029-silenttrain","title":"중국계 Volt Typhoon, 폐기형 중계망 \"Silent Train\"으로 제로데이 공격 흔적 은닉(CVE-2026-16812 등)","file":"일일/2026-10-29.md","date":"활동 관측 지속(3년 이상, 2025년 초부터 하이브리드 구조로 전환)","type":"국가배후 스텔스 중계 인프라·제로데이 공격","actor":"중국 정부 배후 추정 Volt Typhoon(美 정부·연구기관 과거 지정)","region":"미국·아시아태평양(해외)","evidence":"확인(Lumen Black Lotus Labs 연구, 보도 인용)","easy":"중국 정부와 연계된 것으로 알려진 해킹 조직 Volt Typhoon이 \"Silent Train\"이라는 이름의 중계 네트워크를 3년 넘게 운영해 온 사실이 통신회사 Lumen의 보안연구팀(Black Lotus Labs)에 의해 공개됐습니다. 이 조직은 해외 서버와 해킹한 가정용 라우터를 여러 단계로 엮어 공격 출처를 가리고, 한 작업이 끝나면 8시간 안에 설치한 도구와 흔적을 전부 지워버립니다. 동시에 기업·기관이 쓰는 네트워크 관리 장비(VeloCloud, Cisco SD-WAN, N-able, Versa Director 등)의 공개되지 않은 결함(제로데이) 4건 이상을 실제로 악용해 침투했습니다. 통신·국방·공공기관·교육·전력 등 미국의 핵심 인프라가 주요 표적이었고, 특히 캘리포니아·텍사스·하와이가 많이 공격받아 아시아태평양 관련 목적이 있는 것으로 분석됩니다.","todo":"조직에서 VeloCloud Orchestrator·Cisco Catalyst SD-WAN·N-able N-central·Versa Director 같은 네트워크 관리 솔루션을 쓴다면, 관리 인터페이스가 인터넷에 그대로 노출돼 있는지부터 확인하고 바로 차단하세요. 일반 가정에서는 집에서 쓰는 와이파이 공유기(라우터)의 관리자 비밀번호를 기본값에서 바꾸고 최신 펌웨어로 업데이트하는 것이 이런 중계망에 이용되는 것을 막는 첫걸음입니다.","cls":["A","E"],"s":6249,"e":9150},{"id":"D20261029-oracleebs","title":"Oracle E-Business Suite 신규 SQL인젝션→RCE 결함, 패치 직후 정찰 스캐닝 포착(CVE-2026-101767)","file":"일일/2026-10-29.md","date":"Oracle 패치 공개 2026-10-20(2026년 10월 CPU)","type":"공개 웹앱 비인증 SQL 인젝션 → 원격 코드 실행 가능","actor":"미귀속(정찰 단계)","region":"전 세계(해외)","evidence":"확인(Oracle 패치)·보도(정찰 스캐닝)","easy":"기업이 회계·인사 등에 널리 쓰는 Oracle E-Business Suite(EBS) 소프트웨어에서, 로그인 없이도 데이터베이스 명령을 끼워 넣어(SQL 인젝션) 결국 서버에서 임의 명령까지 실행할 수 있는 심각한 결함이 발견돼 10월 20일 패치가 나왔습니다. 아직 실제로 이 결함을 이용해 성공적으로 뚫린 사례는 확인되지 않았지만, 보안회사가 설치해 둔 '가짜 서버(디코이)'에서 공격자들이 패치 일주일 만에 이 결함을 겨냥해 찔러보는(정찰) 시도를 포착했습니다.","todo":"Oracle E-Business Suite를 운영한다면 2026년 10월 Critical Patch Update(CVE-2026-101767 포함)를 지금 바로 적용하세요. Oracle은 과거 EBS 공격 중 다수가 \"이미 나와 있던 패치를 적용하지 않아서\" 성공했다고 밝힌 바 있어, 패치 지연이 가장 큰 위험 요인입니다.","cls":["A"],"s":9427,"e":11510},{"id":"D20261029-sonet","title":"소니 자회사(일본 ISP) So-net 유출, 약 259만 건(NTT도코모 일부 포함)","file":"일일/2026-10-29.md","date":"침해 발생 2026-10-19","type":"ISP 회원 DB 침해(경위 미공개)","actor":"미귀속","region":"일본(해외)","evidence":"확인(소니 네트워크 커뮤니케이션즈 확인)","easy":"소니 그룹의 일본 인터넷 서비스 자회사 '소니 네트워크 커뮤니케이션즈'가 운영하는 인터넷 접속 서비스(So-net)의 회원 데이터베이스가 외부인에게 뚫려, 이름·전화번호·이메일·생년월일·성별·접속 식별자 등 고객 정보 약 259만 건이 유출됐습니다. 이 중 44만여 건은 NTT도코모가 위탁 운영을 맡긴 'Docomo Hikari' 서비스 고객 정보도 포함돼 있습니다. 비밀번호가 함께 유출된 이메일 계정도 5만4천여 건 있어, 같은 비밀번호를 다른 곳에서도 쓰고 있다면 위험합니다. 다행히 계좌번호나 카드 정보는 유출되지 않았다고 회사가 밝혔습니다. 다만 공격자가 정확히 어떤 방법(피싱, 서버 결함 등)으로 침투했는지는 아직 공개되지 않았습니다.","todo":"So-net 또는 소니가 위탁 운영하는 Docomo Hikari(최근 6개월 내 해지한 사람도 포함) 이용자라면, 유출된 이메일 계정과 같은 비밀번호를 다른 서비스에서도 쓰고 있었는지 확인하고 **안전한 기기에서** 비밀번호를 바꾸세요. 도코모 측은 'd포인트 클럽'이나 유니버설 스튜디오 재팬 행사로 위장해 개인정보를 묻는 피싱 메일·사이트에 주의하라고 공지했습니다.","cls":["J","C"],"s":11719,"e":14212},{"id":"D20261030-binance","title":"바이낸스, 직원 노트북 침해로 시작된 사상 최대 규모(약 63억 달러) 암호화폐 탈취","file":"일일/2026-10-30.md","date":"자금 유출 2026-10-29 20:05(UTC)부터 약 20분간","type":"내부 직원 기기 침해 → 내부 서비스 접근 권한 악용(구체적 경위 일부 미공개)","actor":"TraderTraitor(북한 정찰총국 배후 추정, Lazarus Group/APT38과 동일 계열로 분류 — TRM Labs·Chainalysis 귀속)","region":"전 세계(해외, 거래소 바이낸스)","evidence":"확인(바이낸스 자체 확인·성명)·확인(TRM·Chainalysis 귀속 분석)","easy":"세계 최대 암호화폐 거래소 바이낸스에서 2026년 10월 29일 밤, 10개 블록체인에 걸쳐 약 20분 만에 약 63억 달러(역대 최대 규모 암호화폐 탈취, 2025년 바이비트 사건의 약 4배) 상당의 암호화폐가 빠져나갔습니다. 바이낸스는 한 운영 담당 직원(DevOps 엔지니어)의 노트북이 침해당한 것에서 시작해, 공격자가 내부 \"서비스 컨테이너\"(회사 내부 시스템의 한 구성 단위)에 접근해 승인되지 않은 인출 거래를 제출할 수 있었다고 밝혔습니다. 다만 그 노트북이 정확히 어떻게 뚫렸는지, 그리고 바이낸스가 언급한 \"추가로 발견된 침해 지점\"이 구체적으로 무엇인지는 아직 공개되지 않았습니다. 보안 분석업체 TRM Labs와 Chainalysis는 이 공격을 북한 정찰총국과 연계된 해킹 조직(TraderTraitor, 흔히 라자루스 그룹으로 불리는 조직군)이 저질렀다고 높은 확신도로 분석했습니다. 바이낸스는 지갑 개인 키 유출 증거는 없다고 밝혔고, 테더·서클 등 스테이블코인 발행사들이 약 27억 달러를 동결했지만, 공격자는 여전히 약 24억 달러를 통제하고 있는 것으로 추정됩니다.","todo":"바이낸스를 이용하는 일반 이용자가 당장 취할 조치는 없습니다 — 바이낸스는 이용자 자금이 안전하며 자체 비상 적립금(SAFU 펀드)과 회사 자금으로 손실 전액을 보전하겠다고 밝혔습니다. 다만 바이낸스는 사고 수습 중 입출금을 일시 중단했으니 거래소 공지를 확인하세요. 기업·기관 입장에서는 \"직원 한 명의 업무용 기기가 뚫리면 거액 자금 이동 권한까지 닿는\" 구조가 자신의 조직에도 있는지 점검하는 것이 이번 사건에서 얻을 수 있는 첫걸음입니다.","cls":["J"],"s":2503,"e":5496},{"id":"D20261030-gitlabrce","title":"GitLab CI/CD 정규식 처리 결함, 패치 2주 반 만에 실제 악용 확인(CVE-2026-97229, CVSS 10.0)","file":"일일/2026-10-30.md","date":"GitLab 보안 권고·패치 공개 2026-10-12","type":"자체 호스팅 GitLab 비인증 원격 코드 실행","actor":"미귀속","region":"전 세계(해외)","evidence":"확인(GitLab 보안 권고, CISA KEV)","easy":"회사들이 소스코드 관리와 자동 빌드(CI/CD)에 널리 쓰는 GitLab 소프트웨어에서, 로그인조차 하지 않은 공격자가 특수하게 만든 \"정규식\"(문자열 패턴) 하나만으로 서버에서 마음대로 명령을 실행할 수 있는 최고 위험도(10점 만점) 결함이 발견됐습니다. 10월 12일 패치가 나왔지만, 2주 반이 지난 10월 29일 미국 정부(CISA)가 이 결함이 \"실제로 공격에 쓰이고 있다\"고 공식 확인해 긴급 위험 목록에 올렸습니다.","todo":"회사 서버에 직접 설치해 쓰는(자체 호스팅) GitLab Community/Enterprise Edition을 운영한다면 지금 바로 19.2.8·19.3.5·19.4.2 이상 버전으로 업그레이드하세요. GitLab.com(GitLab이 직접 운영하는 클라우드 서비스)과 GitLab Dedicated 고객은 이미 안전한 버전을 쓰고 있어 추가 조치가 필요 없습니다.","cls":["A"],"s":5759,"e":7865},{"id":"D20261030-ciscoasa","title":"Cisco ASA/FTD SSL VPN 결함, 실제 공격으로 장비 다운 확인(CVE-2026-76418)","file":"일일/2026-10-30.md","date":"Cisco 패치 공개 2026-10-29","type":"공개 VPN 장비 비인증 서비스 거부(DoS)","actor":"미귀속","region":"전 세계(해외)","evidence":"확인(Cisco 패치, CISA KEV)","easy":"많은 기업이 원격 접속(VPN)에 쓰는 Cisco의 방화벽 장비(ASA·FTD)에서, 로그인하지 않은 공격자가 조작된 요청을 보내는 것만으로 장비를 강제로 재부팅시켜 먹통으로 만들 수 있는 결함이 발견됐습니다. 이 결함은 실제로 장비를 다운시키는 데 쓰이고 있다는 것이 미국 정부(CISA)에 의해 공식 확인됐습니다. 이 결함 자체로는 데이터를 훔치거나 장비를 장악할 수는 없지만, 원격 접속이 끊기면 업무가 마비될 수 있습니다.","todo":"Cisco ASA 소프트웨어나 Secure FTD 소프트웨어로 원격 접속(SSL VPN) 서비스를 운영한다면 Cisco가 배포한 보안 패치를 지금 바로 적용하세요.","cls":["A"],"s":8103,"e":9619},{"id":"D20261030-drupalcommerce","title":"Drupal Commerce Core 접근제어 결함, 실제 공격 진행 중(CVE-2026-118539)","file":"일일/2026-10-30.md","date":"Drupal 보안 권고 공개 2026-10-28(수)","type":"공개 웹앱(전자상거래 모듈) 인가 우회","actor":"미귀속","region":"전 세계(해외)","evidence":"확인(Drupal 자체 \"실제 악용 중\" 확인)","easy":"웹사이트 제작 도구 Drupal의 전자상거래(쇼핑몰) 확장 모듈인 Commerce Core에서, 로그인하지 않은 방문자가 특정 경로·데이터에 대한 접근 제한을 건너뛸 수 있는 결함이 발견됐습니다. Drupal 측은 이 결함이 \"실제로 공격에 쓰이고 있다\"고 직접 확인했습니다. 이 모듈은 포춘 500대 기업과 대학을 포함해 4만2천 개 이상의 웹사이트에서 쓰이고 있습니다.","todo":"Drupal Commerce Core로 쇼핑몰을 운영한다면 지금 바로 8.x-2.41(이전 버전 계열) 또는 3.3.13(3.x 계열) 이상으로 업그레이드하고, 최근 주문 내역에 이상한 점이 없는지 점검하세요.","cls":["A"],"s":9850,"e":11593},{"id":"D20261030-ledgerimplant","title":"Ledger 하드웨어 지갑 일부 물량에서 유통 단계 하드웨어 임플란트(스파이 칩) 확인","file":"일일/2026-10-30.md","date":"피해 신고 접수·조사 시작 2026-10-09","type":"리셀러(유통사) 공급망 하드웨어 변조","actor":"미귀속","region":"전 세계(해외, 주로 아시아 지역 유통 경로)","evidence":"확인(Ledger Donjon 팀 확인, 독립 연구자 분해 분석)","easy":"암호화폐를 인터넷과 분리해 안전하게 보관하는 \"하드웨어 지갑\" 제조사 Ledger의 일부 제품에서, 동남아시아 리셀러(재판매업체) 'CryptoBilis'를 거친 물량에 몰래 심어진 도청용 전자회로(하드웨어 임플란트)가 발견됐습니다. 이 회로는 화면에 뜨는 복구용 비밀 단어(시드 문구)를 몰래 읽어, 휴대폰 유심(eSIM)이 내장된 통신 모듈을 통해 공격자에게 전송하는 방식으로 동작했습니다. 이 수법으로 일부 이용자의 자산이 빠져나간 것으로 추정됩니다. Ledger는 이 리셀러를 통한 제품에서만 문제가 확인됐다고 밝혔다. CryptoBilis가 이 사건 당시 Ledger의 정식 인증 리셀러였는지는 보도마다 엇갈린다 — 일부 보도는 Ledger 공식 리셀러 목록에 포함돼 있었다고 전하고, 다른 보도는 목록에 없다고 전해 이번 조사에서 확정하지 못했다. 경쟁사인 Trezor는 같은 리셀러와 거래를 끊었다고 밝혔다(Trezor 자사 제품에서 임플란트가 발견됐다는 보도는 아니다).","todo":"CryptoBilis를 통해 Ledger 하드웨어 지갑을 구매했다면, 아직 초기 설정을 하지 않았다면 설정하지 마세요. 이미 설정해 사용 중이라면 그 기기를 더 쓰지 말고 **새로 구매한 정식 기기에서 새로 생성한 복구 문구로** 자산을 즉시 옮기세요 — 침해된 기기에서 만든 새 문구는 안전하지 않습니다.","cls":["C"],"s":11867,"e":15665},{"id":"D20261103-chainalysis","title":"블록체인 분석업체 Chainalysis 내부 시스템 침해","file":"일일/2026-10-31.md","date":"탐지 2026년 10월 중(구체일 미공개)","type":"내부 시스템·도구 비인가 접근(최초 침투 경로 미공개)","actor":"미귀속","region":"전 세계(해외)","evidence":"확인(회사 자체 발표)","easy":"법집행기관·거래소에 블록체인 분석 서비스를 제공하는 Chainalysis가 자사 내부 시스템에 외부인이 접근한 사실을 확인했다고 밝혔습니다. 회사는 \"공격형 에이전틱(AI 자동화) 기법\"이 쓰였다고 언급했지만, 구체적으로 어떤 기법인지, 어떤 결함이 이용됐는지는 공개하지 않았습니다. 유출 가능 정보는 사용자 ID·실명·이메일·조직 내 역할명 수준이며, 수사 자료 내용이나 로그인 인증정보·세션 토큰에 접근한 증거는 없다고 밝혔습니다. 같은 시기 보도된 바이낸스 해킹 사건과는 무관하다고 회사가 명시했습니다.","todo":"Chainalysis의 서비스를 이용하는 법집행기관·거래소 담당자는 회사의 공식 안내를 확인하고, 유출 가능 범위에 자신의 계정 정보(이름·이메일·역할명)가 포함되는지 문의하세요. 일반 이용자가 직접 할 일은 보도되지 않았습니다.","cls":["J"],"s":1045,"e":2409},{"id":"D20261103-aidevbreach","title":"AI 개발 플랫폼 연쇄 침해(Northflank 등 최소 9건, Wiz \"Black October\" 보고서)","file":"일일/2026-10-31.md","date":"Wiz 경보 2026-10-30 11:43(UTC)","type":"클라우드 개발·배포 플랫폼 침해(경위 미공개, 다수 플랫폼)","actor":"미귀속(플랫폼마다 동일 공격자인지 미확인)","region":"전 세계(해외)","evidence":"확인(Northflank·Wiz 발표)","easy":"코드를 배포·실행해 주는 클라우드 플랫폼 'Northflank'가 보안업체 Wiz의 경보로 침해 사실을 알게 돼, 고객들에게 \"여러분의 환경변수(API 키 등 민감한 설정값)가 복호화되어 탈취됐다고 가정하라\"고 통보했습니다. 실제로 여러 고객이 자신의 AI API 키가 무단으로 쓰인 것을 신고했습니다. Wiz는 \"AI 개발 플랫폼들의 암울한 10월(Black October for AI Developer Platforms)\"이라는 보고서에서, 10월 한 달 동안 Northflank·Railway·OpenCode·Warp·Lightning AI 등 AI 개발용 플랫폼에서 최소 9건의 유사한 보안 사고를 확인했다고 밝혔습니다(사고마다 심각도·확인 수준이 다를 수 있고, 모두 같은 공격자인지도 확인되지 않음). 이 9건과는 별개로, 관련이 명확히 밝혀지지 않은 2건에서 탈취된 기업 자격증명으로 아마존의 AI 서비스(Bedrock)를 약 250만 번 호출해 약 10만 달러의 요금이 발생한 사례도 Wiz 보고서에 포함돼 있습니다(이 2건이 위 9개 플랫폼 침해의 직접적인 결과인지는 보도에서 명확히 연결되지 않습니다).","todo":"Northflank·Railway·OpenCode·Warp·Lightning AI 등을 이용한다면, 해당 플랫폼에 저장해 둔 모든 API 키·비밀값이 유출됐다고 가정하고 **지금 바로 교체(재발급)**하세요. AI 서비스 사용량·청구 내역에 평소와 다른 급증이 있는지도 함께 확인하세요.","cls":["C","J"],"s":2693,"e":4906},{"id":"D20261103-smsdeath","title":"안드로이드 \"SMS of Death\" — 문자 한 통으로 전화 기능 마비(CVE-2026-58882)","file":"일일/2026-10-31.md","date":"구글 보안 패치 포함 2026-10-01(일부 버전만, 공식 보안 게시판 미등재)","type":"모바일(안드로이드) 제로클릭 서비스 거부","actor":"해당 없음(취약점 공개, 실제 악용 공격 사례는 보도되지 않음)","region":"전 세계(해외)","evidence":"확인(연구자 기술분석·PoC)","easy":"연구자 Mark Blah는 안드로이드 전화 기능 내부의 문자(SMS) 처리 코드에서, 특수하게 조작한 문자 한 통만 받으면(열어보지 않아도, 문자함에 보이지도 않는 채로) 전화 기능이 그대로 멈춰버리는 결함(CVE-2026-58882)을 공개했습니다. 피해자가 아무것도 하지 않아도 공격이 성립하는 \"제로클릭\" 방식입니다. 같은 문자를 20통 반복해서 보내면 일부 구버전(안드로이드 12) 기기는 재부팅이 계속 반복되는 상태에 빠져 공장 초기화까지 해야 했던 사례도 보고됐습니다. 응급전화를 포함해 통화 자체가 안 되는 상태가 될 수 있어, 단순 불편을 넘어서는 위험입니다.","todo":"휴대폰 설정에서 시스템 업데이트를 확인해 최신 보안 패치를 적용하세요(안드로이드 14 이상 일부 기기는 10월 패치로 해결된 것으로 보이나, 구글의 공식 보안 게시판에는 아직 정식으로 등재되지 않아 정확한 적용 범위는 제조사 공지를 확인해야 합니다). 안드로이드 12·13 기기는 현재 공식 패치가 없어 더 취약하니, 전화가 갑자기 먹통이 되면 기기를 재시작해 보고 반복되면 제조사 서비스센터에 문의하세요.","cls":["I"],"s":5176,"e":7044},{"id":"D20261103-finsector2","title":"국내 금융권에서 이전 보고서가 놓친 침해 5건 추가 확인(빗썸·대신증권·미래에셋·새마을금고·OK저축은행)","file":"일일/2026-11-01.md","date":"발생/탐지 각각 — 새마을금고 2026-10-10, OK저축은행 2026-10-11(1차)·10-15(2차), 대신증권 탐지 2026-10-17·발표 2026-10-28, 빗썸 2026-10-27, 미래에셋자산운용 확인 2026-10-28","type":"금융사별 개별 침해(사별로 경위 상이, 대부분 미공개)","actor":"미확인(사별로 다를 수 있음, 기존 연쐐 해킹과의 연관성 불명)","region":"한국","evidence":"확인(각 사 자체 발표 또는 당국 신고 보도)","easy":"지난 보고서들이 \"국내 금융권 신규 사건 없음\"으로 결론 내렸던 기간(10월 중) 사이에, 사실은 5개 금융사에서 추가로 개인정보 유출이 있었다는 것이 오늘 조사에서 확인됐습니다. 가장 심각한 곳은 가상자산거래소 **빗썸**으로, 사내 모바일 그룹웨어가 침해당해 고객 844명(주민등록번호·운전면허번호·신분증 사본 포함)과 임직원 715명의 정보가 유출됐습니다. **대신증권**은 비대면 계좌개설 연계 서버에 비정상 접근이 있어 3만8,490명의 정보(계좌번호 등 일부는 암호화)가 유출됐고, **새마을금고**(약 400명)·**OK저축은행**(1차 250명+2차 추가)·**미래에셋자산운용**(규모 미공개, 회사는 민감정보는 없었다고 주장)도 각각 피해를 신고했습니다. 이 5건이 9월 말부터 보도된 \"금융권 연쐐 해킹\"(`D20261006-finsector`, 신한·KB국민 등 7곳)과 같은 공격자의 소행인지는 **확인되지 않았습니다** — 시기가 겹치지만 각 회사가 지목한 침해 경로가 서로 다르고(그룹웨어 vs 계좌개설 서버 등), 공통 공격 IP 등 연결 증거가 보도되지 않았기 때문입니다.","todo":"빗썸·대신증권·새마을금고·OK저축은행·미래에셋자산운용 중 거래하는 곳이 있다면, 해당 회사의 개별 안내(문자·이메일)를 확인하고 명의도용·대출 사기·보이스피싱 의심 전화를 조심하세요. 특히 빗썸은 신분증 사본·주민등록번호가 유출된 고객이 있으니, 명의도용 방지 서비스(공동인증서 등록 현황 조회, PASS 앱의 명의도용방지 기능 등) 가입을 검토하세요. 비밀번호 변경은 시작점일 뿐이며, 이미 발급된 로그인 상태(세션)는 비밀번호만 바꿔서는 사라지지 않으므로 각 사의 \"전체 기기 로그아웃\" 기능이 있다면 함께 쓰세요.","cls":["J"],"s":911,"e":3423},{"id":"D20261103-synologyc3rb3r","title":"Synology NAS 대상 C3RB3R(Cerber 계열) 랜섬웨어, 진입 경로는 출처 간 불일치","file":"일일/2026-11-02.md","date":"공격 시작 2026년 10월 초","type":"NAS(개인·기업용 네트워크 저장장치) 랜섬웨어","actor":"미귀속(보도상 C3RB3R/옛 Cerber 랜섬웨어 계열로 식별)","region":"전 세계(한국 내 피해도 일부 보도)","evidence":"확인(Synology 자체 확인 — 암호화 피해 사실)·보도(랜섬웨어 계열명, 진입 경로는 출처 간 불일치)","easy":"대만 회사 Synology가 만드는 가정·기업용 네트워크 저장장치(NAS)가 랜섬웨어(파일을 암호화하고 돈을 요구하는 악성코드)에 감염돼 파일이 암호화되는 사고가 10월 초부터 잇따랐습니다. 보도·연구자들은 이 악성코드를 'C3RB3R'(옛 Cerber 랜섬웨어 계열)로 식별했습니다. 파일 확장자가 `.L0CK3D`로 바뀌고 폴더마다 비트코인을 요구하는 메모가 남겨집니다. 다만 공격자가 정확히 어떤 결함으로 침투했는지는 보도마다 다르게 나와(일부는 9월에 이미 패치된 결함, 다른 보도는 최고 위험도의 새 결함 2건을 지목) 이번 조사에서 확정하지 못했습니다. 한국 매체(조선비즈)도 국내에서 비슷한 피해가 다수 발생했다고 전했으나 같은 캠페인인지는 확인되지 않았습니다.","todo":"Synology NAS를 쓴다면 지금 바로 DSM(운영체제) 버전을 최신으로 업데이트하고, 인터넷에 직접 노출된 관리 포트가 있다면 막으세요. 이미 파일이 `.L0CK3D`로 바뀌었다면 **몸값을 지불하지 말고**, 감염된 장비를 네트워크에서 분리한 뒤 백업(오프라인 백업이 있다면)으로 복구를 시도하세요.","cls":["A"],"s":1098,"e":3052},{"id":"D20261103-eufridge","title":"유럽 슈퍼마켓 냉동·냉장 시스템 원격 조작, 벨기에·네덜란드 등 115개+ 매장","file":"일일/2026-11-02.md","date":"주 사건 2026-11-01 밤~11-02 새벽","type":"산업제어(OT) 시스템 원격 조작(최초 침투 경로 미공개)","actor":"미귀속(단일/복수 캠페인 여부 불명)","region":"유럽(벨기에·네덜란드·스웨덴·룩셈부르크·아일랜드·에스토니아)","evidence":"확인 일부(냉동설비업체 성명)·보도","easy":"벨기에·네덜란드·스웨덴 등 유럽 여러 나라의 슈퍼마켓 115개 이상(ICA, Coop, Ahold Delhaize, Carrefour 등)에서 냉동고·냉장고의 온도 설정이 외부에서 원격으로 바뀌거나 \"해빙(서리 제거) 모드\"로 전환돼, 보관 중인 식품이 상할 뻔한 사고가 11월 1일 밤부터 2일 새벽 사이에 발생했습니다. 냉동설비업체 Sabcobel은 이달 초 프랑스에서도 비슷한 사고가 있었고 \"같은 결함\"이 쓰였다고 밝혔습니다. 다만 공격자가 정확히 어떻게 시스템에 접근했는지는 아직 공개되지 않았습니다.","todo":"이 유형의 냉동·냉장 제어시스템(Danfoss AK-SM/AK-SC, Copeland/Dixell XWEB 등)을 운영하는 매장·물류센터 담당자는 제어 장비가 인터넷에서 직접 접근 가능한 상태인지 지금 확인하고, 그렇다면 원격 접근을 차단하거나 비밀번호·접근 통제를 강화하세요. 일반 소비자가 할 일은 없습니다.","cls":["J"],"s":3330,"e":5670},{"id":"D20261103-vaporpanda","title":"중국계 Vapor Panda, AI 에이전트 프레임워크 'ARTEX'로 14개국 200개+ 조직 동시 공격","file":"일일/2026-11-03.md","date":"캠페인 시작 2026-10-17","type":"공개 인프라 취약점 악용 + AI 에이전트 자동화 정찰·공격","actor":"Vapor Panda(CrowdStrike 명명, 중국계로 평가)","region":"전 세계(최소 14개국)","evidence":"확인(CrowdStrike 조사, 보도로 교차 확인)","easy":"보안업체 CrowdStrike는 중국과 연계된 것으로 보이는 해킹 조직 'Vapor Panda'가 사람이 아니라 **AI 에이전트(스스로 여러 단계를 이어서 판단하고 실행하는 AI 프로그램)**를 이용해 10월 17일부터 전 세계 14개 나라, 200개 넘는 조직(통신·제약·반도체·국방·원자력·금융 등)을 동시에 공격했다고 밝혔습니다. 실제로 내부까지 뚫린 것으로 확인된 곳은 최소 9곳입니다. 공격에 쓰인 'ARTEX'라는 AI 에이전트 도구는 중국 AI 모델 '딥시크(DeepSeek)'를 주로 활용했고, 사람 운영자는 중요한 결정에만 개입했습니다. 이 ARTEX 도구는 과거 한국 금융권을 노린 공격(올해 9~10월, 신한·KB국민 등)과 미국 커넥트와이즈(ConnectWise) 침해 사건(10월, Storm-0940 조직)에도 쓰인 바 있는 도구이지만, CrowdStrike는 이번 Vapor Panda 캠페인이 그 사건들과는 **별개**라고 밝혔습니다 — 즉 같은 \"도구\"를 여러 조직이 나눠 쓰고 있을 가능성이 있다는 뜻이며, 조직이 같다는 뜻은 아닙니다.","todo":"일반 이용자가 바로 할 일은 없습니다. 조직의 보안 담당자는 외부에 노출된 서비스(특히 오픈소스 헬프데스크·협업 도구 등)의 패치 현황을 점검하고, 사용 중인 EDR(침해 탐지 솔루션)이 공격자의 우회 설정 대상으로 지목되지 않았는지 벤더 공지를 확인하세요.","cls":["A","B"],"s":1173,"e":4257},{"id":"D20261104-binance","title":"바이낸스, 가짜 채용면접으로 시작된 공격에 지갑 서명 서비스가 뚫려 약 63억 달러 상당 자산 이전","file":"일일/2026-11-04.md","date":"접촉 시작 2026년 9월","type":"구인 사칭 사회공학 → 내부 인프라 침투 → 가상자산 탈취","actor":"북한 연계 추정(TraderTraitor/Lazarus/Jade Sleet/APT38로도 알려짐, FBI 귀속 보도)","region":"전 세계(해외, 거래소는 다국적)","evidence":"확인(바이낸스 자체 발표)·보도(공격자 귀속)","easy":"세계 최대 가상자산 거래소 바이낸스가 10월 29일, 지갑에 서명(승인)을 해 주는 내부 서비스가 뚫려 여러 블록체인에서 약 63억 4천만 달러 상당의 자산이 빠져나갔다고 11월 3일 발표했습니다. 시작은 9월, 한 소프트�웨어 엔지니어가 구인 플랫폼에서 가짜 채용 담당자의 연락을 받은 것이었습니다. 두 차례 가짜 면접(영상통화까지 포함)을 거친 뒤 \"코딩 과제\"를 내려받아 실행했는데, 이 파일에 백신이 못 잡아내는 악성코드가 숨어 있었습니다. 이후 공격자는 이 엔지니어의 노트북을 발판으로 삼아 다른 직원 2명까지 추가로 뚫었고, 결국 지갑 서명 서비스에 접근해 대규모 자산을 빼냈습니다. 바이낸스는 이후 약 28억 5천만 달러를 동결·회수했고 일부 자산 종류는 자체 자금으로 메웠다고 밝혔습니다.","todo":"바이낸스 이용자가 지금 당장 할 일은 보도되지 않았습니다(이용자 자금이 아니라 거래소 내부 시스템이 공격 대상이었습니다). 구직 중인 개발자·보안 담당자라면, 면접 과정에서 받은 \"코딩 과제\"나 실행 파일을 회사 업무용 기기에서 바로 실행하지 말고 격리된 환경(가상머신 등)에서만 열어 보세요.","cls":["D","B"],"s":2508,"e":5257},{"id":"D20261104-douzone","title":"국내 ERP·백업 업체 더존비즈온 해킹, 거래 기업 24곳 이상에서 개인정보 유출 의심","file":"일일/2026-11-04.md","date":"보도 2026-11-02~11-04(최초 침해 시점 미공개)","type":"서드파티(ERP·클라우드 백업 공급사) 침해, 침투 경로 대부분 미공개","actor":"미귀속","region":"한국","evidence":"확인(피해(의심) 기업 각사 공지, 과기정통부 중대사고 지정)","easy":"국내 중소기업·세무회계사무소가 많이 쓰는 경영관리 소프트웨어(ERP) 회사 더존비즈온이 해킹당했습니다. 더존비즈온의 세무회계용 ERP '스마트 A10'과 클라우드 백업 서비스 'APO백업서비스'가 침해당한 것으로 보이며, 이 서비스를 쓰는 거래 기업 24곳 이상(케이옥션, 더본코리아, 한양증권, 국기원, 병원·재단·학교 관련 단체 등)에서 직원·고객의 이름·주민등록번호·계좌번호 등 개인정보가 유출됐을 가능성이 확인됐습니다. 과학기술정보통신부는 이를 \"중대사고\"로 보고 민관합동조사단을 꾸렸습니다. 다만 더존비즈온이 정확히 어떤 경로로 처음 뚫렸는지는 아직 공개되지 않았고, 피해(의심) 기업 목록은 계속 늘어나고 있습니다.","todo":"케이옥션·더본코리아·한양증권·전북문화관광재단 등 위에서 언급된 기업·기관과 거래했거나 그 직원·고객이라면, 해당 기관의 개별 공지를 확인하세요. 비밀번호 변경만으로는 이미 유출된 주민등록번호·계좌번호 자체를 되돌릴 수 없으므로, 명의도용 방지 서비스 가입과 금융 거래 알림 설정을 함께 검토하세요.","cls":["C"],"s":5480,"e":7931},{"id":"D20261104-vtleak","title":"대통령 전용기(공군1호기) 탑승자 168명 명단, 바이러스토탈에 5개월간 노출","file":"일일/2026-11-04.md","date":"명단 업로드(추정 시작) 2026-06-02","type":"정보 노출(외부 침입의 증거는 보도되지 않았고, 게시 경위는 조사 중)","actor":"해당 없음","region":"한국","evidence":"확인(외교부 신고·경찰 수사 전환 보도)","easy":"지난 6월 유럽 순방(한국-벨기에) 때 대통령 전용기에 탑승한 168명(대통령 부부, 국가안보실장 등 고위 관계자, 경호원, 출입기자 포함)의 명단 파일이, 구글이 운영하는 악성코드 검사 사이트 '바이러스토탈'에 약 5개월간 올라가 있었던 것으로 확인됐습니다. 이 사이트는 유료 회원끼리 업로드된 파일을 내려받아 볼 수 있는 구조라, 그 기간 동안 누구든 유료 회원이면 이름·생년월일·여권번호가 담긴 이 파일을 내려받을 수 있었습니다. 외교부는 11월 3일 오전 이 사실을 확인해 개인정보보호위원회에 신고했고, 경찰은 수사를 시작했습니다. 다만 지금까지 공개된 내용에는 외부 공격자가 침입했다는 증거가 제시되지 않았고, 누가·어떻게 이 파일을 그 사이트에 올렸는지(개인의 직접 업로드인지, 이메일 보안 솔루션의 자동 전송인지)도 아직 조사 중입니다. \"해킹당했다\"고 단정할 근거는 현재로서는 없으며, 그 노출을 5개월간 아무도 알아차리지 못했다는 점이 핵심 문제입니다.","todo":"일반 국민이 직접 할 일은 없습니다. 명단에 포함된 당사자는 외교부의 여권 재발급 등 안내를 따르면 됩니다.","cls":["E"],"s":8174,"e":10753},{"id":"D20261104-taegwang","title":"국내 보안기업 태광네트웍정보, 에베레스트 랜섬웨어 조직이 263GB 탈취 주장(공급망 영향 우려)","file":"일일/2026-11-04.md","date":"사고 발생(회사 추정) 2026-10-12경","type":"네트워크·보안 기업 내부 계정 침해(최초 침투 경로 미공개)","actor":"에베레스트(Everest) 랜섬웨어 조직(주장)","region":"한국","evidence":"확인(회사 자체 공지: 계정 비정상 접근·일부 자료 유출)·주장(탈취 규모 263GB는 공격자 주장)","easy":"안랩 보안장비의 공공 부문 총판과 KT 매니지드 보안 사업 등을 맡아 온 국내 네트워크·보안 전문기업 태광네트웍정보가 해킹당했습니다. 회사는 업무용 Microsoft 365 원드라이브(클라우드 저장소) 계정에 외부의 비정상 접근이 있었고 일부 자료가 유출됐다고 공지했습니다. 그런데 랜섬웨어 조직 '에베레스트'는 다크웹에 이보다 훨씬 큰 규모(약 263GB, 5만 4,581개 파일)를 탈취했다고 주장하며, 여기에 병원·공공기관·금융회사·KT·안랩 등 여러 기관·협력사 이름이 담긴 자료가 포함된다고 밝혔습니다. 이 주장이 사실인지, 회사가 인정한 범위를 넘어서는지는 독립적으로 확인되지 않았습니다. 다만 이 회사가 다수 기관의 네트워크 구축·보안 유지보수를 담당해 왔기 때문에, 만약 고객사 기술자료(네트워크 구성도, 인증정보 등)가 실제로 유출됐다면 그 고객사들까지 위험이 번질 수 있다는 점이 우려됩니다.","todo":"태광네트웍정보와 거래했거나 그 담당자인 조직은, 이 회사에 제공했던 네트워크 구성도·인증정보 등 기술자료의 종류와 외부 유지보수 계정 사용 여부를 지금 확인하세요. 또한 태광네트웍정보 직원을 사칭한 거래·계좌변경 요청 전화·메일은 사실 확인 전까지 응하지 마세요.","cls":["C"],"s":11093,"e":13590},{"id":"D20261104-cpguard","title":"서버 보안 제품 cPGuard, 업데이트 배포망(CDN) 변조로 약 2,946대에 백도어·정보탈취 스크립트 유포","file":"일일/2026-11-04.md","date":"변조 시작 2026-11-02 02:06(UTC)","type":"소프트웨어 공급망(업데이트 배포망) 변조","actor":"미귀속(탈취한 자격 증명 사용)","region":"전 세계(해외)","evidence":"확인(벤더 OpsShield 자체 확인)","easy":"cPanel·DirectAdmin·Plesk 같은 서버 관리 도구와 함께 쓰이는 보안 제품 'cPGuard'의 업데이트 배포망(CDN)이 해킹당해, 정상 업데이트 경로로 백도어와 정보탈취 스크립트가 유포됐습니다. 제조사 OpsShield는 11월 2일 공격자가 탈취한 계정으로 배포망에 접근해 악성 스크립트를 심었다고 밝혔고, 이 기간(버전 5.88.12~5.88.19)에 업데이트를 받은 서버는 비밀번호 해시·데이터베이스 설정·루트 계정의 SSH 키 등 민감한 파일을 노려 공격자에게 전송하는 스크립트가 함께 설치됐습니다. 회사는 2,946대의 서버가 영향을 받았다고 확인했습니다. 호스팅 업체나 서버 관리자가 쓰는 보안 제품이 오히려 공격 통로가 된 사례입니다.","todo":"cPGuard를 쓰는 서버 관리자는 지금 바로 버전을 5.88.25 이상으로 업데이트하세요. 그리고 비밀번호만 바꾸는 것으로는 부족합니다 — 이미 유출됐을 수 있는 SSH 키, 데이터베이스 접속정보, 클라우드 비밀값을 모두 새로 발급해야 합니다(기존 값은 이미 공격자 손에 있을 수 있으므로 무효화가 핵심입니다).","cls":["C"],"s":13848,"e":16150},{"id":"D20261104-workos","title":"개발 인프라 업체 WorkOS, AI 공격 자동화 도구(ARTEX AI)로 내부 영업 시스템 침해","file":"일일/2026-11-04.md","date":"접근 식별 2026-10-30","type":"내부 업무 시스템 침해(최초 침투 경로 미공개)","actor":"미귀속(ARTEX AI 프레임워크 사용 추정)","region":"전 세계(해외)","evidence":"확인(회사 자체 발표: 침해 사실)·추정(공격 도구, user agent 흔적 기준)","easy":"로그인·인증 기능을 다른 회사들에 API로 제공하는 개발 인프라 업체 WorkOS(최소 3,000여 개 회사가 이용)가, 영업팀이 쓰는 내부 시스템에 외부인이 침입한 사실을 10월 30일 확인했다고 밝혔습니다. 회사는 \"AI 기반 공격 자동화 도구\"가 쓰였다고 설명했고, 창업자는 이 도구가 앞서 여러 사건(한국 금융권 공격, 네덜란드 허니팟 침해 등)에 쓰인 'ARTEX AI'라고 언급했습니다(공격자 흔적에서 \"artex-enrich/1.0\" 같은 식별값이 발견됨). 유출 가능 정보는 고객사의 담당자 이름·이메일·직책, 제품 사용 현황, 영업·상담 대화 요약 등이며, WorkOS는 자사의 실제 서비스(인증 API)나 고객 데이터 자체는 영향받지 않았다고 밝혔습니다.","todo":"WorkOS를 이용하는 기업의 담당자는 자신의 이름·연락처·소속이 이번에 노출됐을 수 있다는 점을 인지하고, 이를 이용한 표적 피싱(사칭 메일·전화)에 평소보다 주의하세요. WorkOS 자체 인증 서비스에는 영향이 없다고 발표됐으므로 일반 최종 사용자가 직접 할 일은 없습니다.","cls":["J"],"s":16405,"e":18610},{"id":"D20261104-3amschool","title":"영국 한 학교 재단, AI 자동화 패턴으로 추정되는 3AM 랜섬웨어 공격으로 PC 37대 암호화","file":"일일/2026-11-04.md","date":"공격 활동 2026-09-10~09-19","type":"랜섬웨어(AI 자동화 의심)","actor":"3AM 랜섬웨어 계열(과거 Conti·Royal 연계 분석)","region":"영국(해외)","evidence":"보도(Bitdefender 연구 기준)","easy":"영국의 한 학교 재단(여러 학교를 운영하는 단체)이 '3AM'이라는 랜섬웨어 조직의 공격을 받아 약 50대 중 37대의 컴퓨터가 암호화됐습니다. 보안업체 Bitdefender는 공격자가 명령을 40~100초 간격으로 조금씩 바꿔가며 반복 실행한 패턴을 발견했는데, 이는 사람이 아니라 AI가 자동으로 판단해 다음 명령을 내리는 방식(\"에이전틱 루프\")과 비슷하다고 분석했습니다. 다만 공격자의 컴퓨터 자체를 들여다보지 못해, 정말 AI 모델이 썼는지, 아니면 사람이 AI 모델의 답을 보고 손으로 입력을 중계했는지는 확정하지 못했습니다. 공격자는 백업서버(Veeam) 3대에서 자격 증명을 훔치고, 원래 따로 분리돼 있던 조직 내 3개 관리 영역(도메인)을 서로 신뢰하도록 연결해 접근 범위를 넓혔습니다.","todo":"이 사건은 특정 학교의 사건이라 일반 이용자가 할 일은 없습니다. 조직의 IT 담당자는 Veeam 등 백업 소프트웨어에 저장된 자격 증명이 평문으로 보관되고 있는지 점검하고, 백업서버 접근 계정에도 일반 서버와 동등한 수준의 보호(MFA 등)를 적용해야 합니다.","cls":["F","E"],"s":18861,"e":21397},{"id":"D20261104-barracuda","title":"바라쿠다, 다수 보안장비에서 root 권한 탈취 가능한 치명적 결함 2건 패치","file":"일일/2026-11-04.md","date":"벤더 보안 공지 2026-11-03","type":"보안장비 취약점(실제 악용 미확인)","actor":"해당 없음","region":"전 세계(해외)","evidence":"확인(벤더 보안 공지)","easy":"네트워크·이메일 보안 장비 회사 바라쿠다(Barracuda Networks)가 자사 여러 제품(이메일 보안 게이트웨이, 로드밸런서, 메시지 아카이버, 웹 방화벽 등)에서 공격자가 root(최고 관리자) 권한까지 얻을 수 있는 치명적 결함 2건을 공개하고 패치했습니다. 하나는 인증 절차의 약점(CVE-2026-116606), 다른 하나는 관리자 권한이 있는 사용자가 root로 명령을 실행할 수 있는 결함(CVE-2026-111560)입니다. 아직 실제로 이 결함이 공격에 쓰였다는 보도는 없지만, 관리 화면에 접근할 수 있는 공격자라면 장비를 완전히 장악할 수 있어 위험도가 높습니다.","todo":"바라쿠다 제품(ESG, Load Balancer ADC, Message Archiver, WAF, WAF Control Center, Web Security Gateway)을 쓰는 조직의 담당자는 지금 바로 벤더가 안내한 패치(제품별로 다름)를 적용하고, 관리 인터페이스가 인터넷에 직접 노출돼 있다면 당장 차단하세요.","cls":["A"],"s":21569,"e":23439},{"id":"D20261104-wpcore","title":"CISA, 워드프레스 코어 레이스 컨디션 결함(CVE-2026-119977)을 '실제 악용 확인' 목록에 신규 등재","file":"일일/2026-11-04.md","date":"결함 패치(벤더) 보도 기준 7.1.4 출시","type":"공개 CMS(콘텐츠 관리 시스템) 취약점, 실제 악용 확인","actor":"미귀속(자동화 스캐너 추정)","region":"전 세계(해외)","evidence":"확인(CISA KEV 등재=실제 악용 확인)·보도(기술적 세부 내용, 단일 2차 출처)","easy":"미국 CISA(사이버보안 담당 정부기관)가 11월 3일, 워드프레스 코어(전 세계 웹사이트의 상당수가 쓰는 콘텐츠 관리 시스템)의 한 결함(CVE-2026-119977)을 \"실제로 공격에 쓰이고 있다\"고 확인되는 목록(KEV, 실제 악용 취약점 카탈로그)에 새로 올렸습니다. 확인된 단일 2차 보도에 따르면 이 결함은 업데이트(스테이징) 처리 과정에서 생기는 '레이스 컨디션'(프로그램이 거의 동시에 일어나는 일의 순서를 제대로 처리하지 못해 생기는 결함)으로, 검증을 건너뛰고 코드를 실행시킬 수 있는 수준의 심각도(CVSS 8.1)로 평가됩니다. 워드프레스 7.1.4(또는 7.0.8) 버전에서 해결됐다고 알려졌습니다.","todo":"워드프레스로 운영되는 웹사이트의 관리자는 지금 바로 워드프레스 버전을 확인하고, 7.1.4(또는 7.0.8) 이상으로 업데이트하세요.","cls":["A"],"s":23718,"e":25681},{"id":"D20261106-apt29","title":"러시아 연계 APT29(추정), 정상 웹사이트 변조로 아이폰·안드로이드 겨냥(Poisoned Source)","file":"일일/2026-11-05.md","date":"Plerdy 추적 스크립트 변조 활동 2026-08-27~09-03","type":"워터링홀(정상 웹사이트 변조)·모바일 익스플로잇 체인","actor":"러시아 연계 APT29 또는 하위 조직(Sekoia 중~고신뢰도 추정)","region":"전 세계(해외, 피해자 특정 미공개)","evidence":"확인(Sekoia 연구기관 직접 확인)·추정(행위자 귀속)","easy":"프랑스 보안업체 Sekoia가 \"Poisoned Source\"라는 이름으로 공개한 연구에 따르면, 공격자들이 멀쩍이 둘러보기만 해도 아이폰·안드로이드 기기가 감염될 수 있는 캠페인을 벌였습니다. 이들은 정상 웹사이트에 악성 코드를 심거나, 진짜 내용을 그대로 중계하는 가짜 거울(미러) 사이트를 운영하거나, 우크라이나의 웹 분석 서비스 'Plerdy'의 추적 스크립트 자체를 변조하는 세 가지 방식을 함께 썼습니다. 방문자의 기기 운영체제·브라우저 버전을 확인해 거기 맞는 공격을 내려보냈고, 아이폰에서는 문자메시지·왓츠앱·텔레그램 대화 내용·위치·사진까지, 안드로이드에서는 저장된 비밀번호·방문기록·와이파이 비밀번호까지 빼갔습니다. Sekoia는 이 공격이 러시아 정부와 연계된 것으로 알려진 APT29(일명 코지베어) 또는 그 하위 조직의 소행일 가능성이 중간~높은 신뢰도로 있다고 평가했습니다. 다행히 모든 공격 방식은 이미 제조사가 패치한 결함만 썼기 때문에, 최신 업데이트를 적용한 기기는 영향받지 않습니다.","todo":"아이폰·안드로이드 이용자는 지금 바로 운영체제와 Chrome 등 브라우저를 최신 버전으로 업데이트하세요. Sekoia는 완전히 패치된 기기에서는 이 공격 체인이 작동하지 않는다고 밝혔습니다.","cls":["C","I"],"s":1478,"e":3985},{"id":"D20261106-arkea","title":"프랑스 아르케아(Arkéa) 은행, 협력업체 경유 공격으로 약 1,333억원 상당 탈취","file":"일일/2026-11-05.md","date":"공격 포착(블록체인 추적) 2026-11-02","type":"협력업체 경유 은행 내부 계좌 자금 이전","actor":"미귀속","region":"프랑스(해외)","evidence":"확인(은행 자체 확인)·추정(피해 규모, 블록체인 추적)","easy":"프랑스의 협동조합은행 그룹 아르케아(Arkéa)가, 이름이 공개되지 않은 협력업체의 플랫폼을 거쳐 공격당해 은행 자체 계좌에서 다른 금융기관으로 거액이 빠져나갔습니다. 미국의 블록체인 추적가 ZachXBT는 며칠에 걸쳐 약 1억 3,300만 달러(약 1,333억 원) 이상이 빠져나갔고 일부가 암호화폐로 세탁됐을 가능성이 있다고 추산했습니다. 은행은 정확한 금액을 밝히지 않았지만 그 규모가 맞다고 인정했습니다. 중요한 점은 이 사건이 고객의 계좌나 자산을 겨냥한 것이 아니라 은행 \"자체\" 계좌가 쓰였다는 것입니다. 은행은 고객 자산에는 영향이 없다고 밝혔고, 자금 일부는 이미 동결됐습니다.","todo":"아르케아·포르튀네오(Fortuneo) 이용자가 지금 당장 해야 할 일은 보도되지 않았습니다(고객 계좌·자산은 영향받지 않았다고 발표됐습니다). 다만 은행과 거래하는 협력업체·공급업체는 자사 플랫폼의 접근 로그를 점검해 볼 필요가 있습니다.","cls":["C","J"],"s":4227,"e":6415},{"id":"D20261106-cwpdoor","title":"서버관리패널 CWP 변조 공급망 공격(CWPdoor), 노출 인스턴스 34만여 개","file":"일일/2026-11-05.md","date":"변조 업데이터 스크립트 포착 2026-06-29","type":"소프트웨어 공급망(서버 관리 패널) 변조","actor":"미귀속","region":"전 세계(해외, CWP 공개 노출 인스턴스 34만여 개)","evidence":"확인(보안연구진 확인)","easy":"리눅스 서버를 관리하는 무료 제어판 소프트웨어 CWP(Control Web Panel, 구 CentOS Web Panel)의 핵심 웹서버 프로그램(cwpsrv)이 악성 버전으로 바뀌어 있는 사례가 발견됐습니다. 연구자들은 이를 'CWPdoor'라고 이름 붙였는데, 평소에는 조용히 숨어 있다가 공격자가 특수하게 꾸민 요청을 보내면 암호화된 명령을 받아 실행하는 방식입니다. 명령을 실행한 흔적(로그·타임스탬프)도 스스로 지워 매우 은밀합니다. 전 세계에 공개적으로 노출된 CWP 설치 대수가 34만 개가 넘는 것으로 집계됐지만, 이 중 실제로 이 백도어에 감염된 서버가 몇 대인지는 아직 공개되지 않았습니다.","todo":"CWP(Control Web Panel)를 쓰는 서버 관리자는 지금 바로 cwpsrv 바이너리에 수상한 유닉스 소켓(`ngx_http_integrity_helper`)이나 의심스러운 헬퍼 프로세스가 있는지 확인하고, 감염이 확인되면 정상 버전으로 교체한 뒤 제어판 관련 자격 증명을 전부 새로 발급하세요(기존 값은 공격자가 이미 알고 있을 수 있습니다).","cls":["C"],"s":6677,"e":9137},{"id":"D20261106-digicert","title":"인증기관 DigiCert, 내부 시스템 노출로 고객정보·신원확인문서 유출","file":"일일/2026-11-05.md","da
