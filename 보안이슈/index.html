다.\n> ATT&CK 기준: **v19.2**. 사건별 매핑은 [../ATTACK/README.md](../ATTACK/README.md) 참고.\n\n## 1. 오늘의 요약\n\n| # | 이슈 | CVE | 유형 | 상태 | 즉시 조치 |\n|---|------|-----|------|------|-----------|\n| 1 | Citrix NetScaler SAML 제로데이 | CVE-2026-88779 | 메모리 오버플로(CVSS 8.7), 서비스 거부 + 명령 실행 정황 | 악용 중, KEV 10/4 (기한 10/7) | 14.1-73.41 / 13.1-64.28 이상 |\n| 2 | 덴마크 CPR(주민등록부) 대량 조회 | 해당 없음 | 사설 업체 접근 권한 오남용 | 약 880만 건 조회, 조사 중 | 접근 권한·조회량 통제 |\n| 3 | 국내 이슈 | | | [국내 보충](2026-10-06-국내보충.md) 참고 | |\n\n추가 메모: 10-03 보고서의 FortiMail(CVE-2026-104286)은 10/2 보도 기준 **수정 패치가 아직 출시되지 않았다**(여러 브랜치가 '예정'). 우회책(IBE 비활성화, 관리면 제한)에 의존 중이므로 벤더 공지를 계속 확인한다. KEV 기한은 10/4였다.\n\n## 2. 이슈별 분석\n\n### [D20261006-citrix-saml] Citrix NetScaler SAML CVE-2026-88779\n> 날짜: 2026-10-04 · 유형: 엣지 장비 취약점 · 행위자: 미귀속 · 지역: 글로벌 · 근거: 확인\n\n**쉽게 말하면**: 회사 원격 접속 장비(NetScaler)에서 또 하나의 결함이 공격에 쓰이고 있습니다. 로그인(SAML 방식) 처리 부분의 결함이며, 벤더는 서비스 중단 위험이라고 했지만 연구자들은 명령 실행으로 이어질 가능성도 봅니다. 10-03 보고서의 Citrix 건과는 별개의 결함입니다.\n\n**먼저 할 일(초보용)**: SAML 로그인을 쓰는 장비인지 확인하고, 수정 버전으로 올린 뒤 접속 중인 세션을 모두 끊으세요. 이미 침해됐을 수 있는 장비라면 그 장비에서 새 비밀번호·키를 만들지 마세요.\n\n**개요**: CISA가 10/4 KEV에 등재했다(기한 10/7). SAML 인증(서비스 제공자 SP 또는 인증 제공자 IdP 구성)을 쓰는 NetScaler ADC·Gateway의 메모리 버퍼 오버플로이며 CVSS v4 8.7이다. 벤더가 확인한 것은 DoS 영향이며, 아래 셸 명령·다운로드·크래시는 관리자 관측 보고이고 이 CVE와의 인과는 미확인이다. 수정 버전은 14.1-73.41, 13.1-64.28(FIPS: 14.1-73.41 FIPS, 13.1-37.282)이다(보도 기준, 벤더 공지 원문 재확인 필요).\n\n**왜 일어났나**\n- 직접 원인 [보도]: 인증 처리(`nsaaad` 프로세스)의 메모리 오버플로. 벤더는 \"미조치 장비에 대한 표적 공격으로 서비스 거부 가능\"이라 밝혔다.\n- 구조적 원인 [추정]: (1) 인증·VPN 장비가 인터넷에 직접 노출 (2) 같은 제품군에서 몇 주 사이 연속 제로데이 (3) 장비 내부 EDR 부재.\n- 실행 가능성 [보도]: 관리자들이 사용자명 필드에 셸 명령이 삽입된 공격 요청을 관측했고, 그 요청이 외부 IP `213.209.159[.]55`에서 페이로드를 내려받으려는 시도를 관측했고 `nsaaad`가 반복 비정상 종료했다. 이것이 성공한 명령 실행인지는 확인되지 않았다.\n\n**침투 경로 [추정]**: 인터넷에 노출된 SAML 인증 엔드포인트에 조작 요청 → 프로세스 충돌(서비스 거부) 또는 명령 실행 시도 → 외부 페이로드 내려받기 시도. 이후 행위는 공개 자료에 없다.\n\n**어떻게 조치하나**\n- 즉시: 증거(로그·설정·메모리)를 신속히 보존하되 패치를 미루지 말고 수정 버전 적용. 패치 후 활성 세션 종료. 최근 다른 Citrix 취약점 때문에 패치했더라도 이 건은 별도로 확인.\n- 단기: `nsaaad` 반복 비정상 종료, 인증 로그의 셸 문자가 든 사용자명, 위 IP와의 통신 점검. 침해 의심 장비는 재구축하고 장비 저장 자격 증명·인증서·키 교체(깨끗한 기기에서).\n- 장기: 인증 장비 관리면 분리, 로그 외부 보존, 엣지 장비 긴급 패치 SLA.\n- 탐지: 인증 서비스 크래시, 사용자명 필드의 이상 문자열, 장비의 비정상 아웃바운드.\n\n**교훈**: 같은 제품군에서 한 주 사이 제로데이가 이어졌다. \"한 번 패치했으니 끝\"이 아니라 계속 점검해야 한다.\n\n### [D20261006-dk-cpr] 덴마크 CPR(주민등록부) 대량 조회\n> 날짜: 2026-10-05 · 유형: 서드파티 접근 권한 오남용 · 행위자: 미확인 · 지역: 글로벌 · 근거: 보도\n\n**쉽게 말하면**: 덴마크 국민 신분 정보를 모아 둔 국가 등록부에, 접근 권한을 가진 민간 업체의 계정이 악용돼 약 880만 명 등록자의 이름·주소·주민번호(CPR 번호)에 무단 접근이 있었다고 보도됐습니다. 정보가 자동화된 조회로 빠져나갔다고 보도됐습니다. 복사·판매·공개 여부는 아직 알려지지 않았습니다.\n\n**먼저 할 일(초보용)**: 덴마크 거주자라면 당국 안내를 따르고 신분증 번호를 이용한 사칭(전화·문자) 시도를 경계하세요. 담당자라면 외부 업체에 준 조회 권한의 범위와 조회량 제한을 점검하세요. 비밀번호만 바꿔도 이미 얻은 주민번호는 되돌릴 수 없습니다.\n\n**개요**: 10/2 인지, 10/5 공개(보도). 사설 업체의 정당한 접근 권한이 오남용돼 대규모 자동 조회가 이뤄졌다. 약 1,100만 건 중 약 880만 명 등록자 정보에 접근했고 현재 거주자뿐 아니라 이민·사망자도 포함한다(현 국민 수가 아님)(2차 보도 기준, 정부 원문 재확인 필요).\n\n**왜 일어났나**\n- 직접 원인 [보도]: 장관이 \"민간 업체의 접근 보안이 부적절했다\"고 밝혔다. 업체 직원 계정 탈취·자격 증명 유출·내부 통제 미흡 중 무엇인지는 **확인되지 않았다**.\n- 구조적 원인 [추정]: (1) 민간 업체에 대량 조회 가능한 권한 위임 (2) 유효한 주민번호를 찾기 위한 자동 조회를 막는 속도·총량 제한 부재 가능성.\n\n**침투 경로 [추정]**: 해킹이라기보다 정상 권한으로의 자동 조회. 어떻게 권한을 얻었는지는 미공개.\n\n**어떻게 조치하나**\n- 즉시: 해당 업체 접근 차단·자격 증명 회수, 조회 로그 보존, 영향자 통지.\n- 단기: 업체별 조회 상한·이상 징후 경보, 권한 재심사.\n- 장기: 최소 권한, 외부 업체 접근을 개인 계정·MFA·IP 제한으로 통제, 식별번호 의존 인증 축소.\n- 탐지: 순차·대량 조회 패턴, 평소와 다른 시간대·출처.\n\n**교훈**: 외부 업체에 준 정당한 권한도 공격면이다. 식별번호는 한 번 새면 바꿀 수 없다.\n\n> 한국전력 직원 정보 노출(10/1)은 같은 날 작성된 [국내 보충 보고서](2026-10-06-국내보충.md)의 `D20261006-kepco`에서 다룬다.\n\n## 3. 교차 분석\n\n> 표본은 2건이며 추세를 말하지 않는다.\n\n1. **엣지 장비 반복**: Citrix는 10-03 건에 이어 또 제로데이이며, FortiMail은 패치 미출시로 우회책에 의존한다.\n2. **정당한 권한의 오남용**: 덴마크 CPR은 취약점이 아니라 위임된 접근 권한 문제로 보도됐다(원인은 미확인).\n\n## 4. 침투 경로 종합\n\n```\n[정찰] → T1190 노출 장비 악용 (Citrix SAML)\n[자격/권한] → T1078 유효 계정 오남용 → T1119 자동 수집 (덴마크 CPR)\n[노출] → 외부 웹페이지 (한전, 경로 미확인)\n```\n\n## 5. 우선 대응 체크리스트\n\n1. **10/7까지**: Citrix 14.1-73.41 / 13.1-64.28 이상(당시 기준). 패치 후 세션 종료, `nsaaad` 크래시·IP `213.209.159[.]55` 점검.\n2. **FortiMail**: 패치 출시 여부를 매일 확인하고 그때까지 IBE 비활성·관리면 제한.\n3. **외부 업체 권한**: 대량 조회 가능한 계정의 목록·상한·로그 점검.\n\n\n## 6. 검증 수준과 한계\n\n- Citrix CVE-2026-88779는 CISA KEV 등재(목록 직접 확인)와 BleepingComputer 보도에 근거한다. 벤더 공지 원문은 직접 확인하지 못했다.\n- 덴마크 CPR은 2차 요약(shattered.io) 한 건에 의존하며 정부 1차 자료를 확인하지 못했다. 수치·원인은 보도 수준이다.\n- 같은 기간 눈에 띈 Pentagon·DTU(약 20만 명)·미국 의료 업체 유출은 이미 있는 사건(DMDC)이거나 단일 출처라 제외했다. 10/3 이후 SharePoint·MikroTik·Adobe Magento KEV(9/24~25)는 시간 관계상 분석하지 못했다.\n- ATT&CK는 v19.2 유지를 공식 사이트에서 확인했다.\n- 독립 검토(Codex) 반영: T1499→후보, T1078→후보, T1119→추정으로 낮추고 CVSS v4 표기·880만 \"명\"·32시간 해석을 정정했다. Codex가 덴마크 정부 1차 발표와 Citrix 벤더 공지(CTX697174)를 제시했으나 본 실행에서 직접 확인하지 못했다. \n\n## 출처\n\n- CISA KEV 카탈로그 (10/4 CVE-2026-88779 등재 확인)\n- BleepingComputer: Citrix NetScaler SAML zero-day, The Register: FortiMail 제로데이(패치 미출시)\n- shattered.io: 덴마크 CPR 유출 요약(2차)\n- 세계일보 10/2 개인정보위 방안, SBS Biz·여성신문·중앙이코노미 등 한전 노출 보도\n- MITRE ATT&CK v19.2\n"},{"path":"일일/2026-10-07.md","title":"일일 보안 이슈 분석 — 2026-10-07","md":"# 일일 보안 이슈 분석 — 2026-10-07\n\n> 수집 기준: 2026-10-06 ~ 10-07 공개분과 이전 보고서에서 다루지 못한 9월 말 사건. CISA KEV는 직접 확인했으며 10/4 이후 신규 등재는 없었다. 이미 [2026-10-06 보고서](2026-10-06.md)·[국내 보충](2026-10-06-국내보충.md)에 있는 사건은 중복 작성하지 않았다.\n> 근거 표기: **[확인]** 벤더·정부기관·피해 기업이 직접 확인 / **보도** 언론 보도 / **[추정]** 본 보고서의 추정 / **[주장]** 공격자 일방 주장. **조치는 본 보고서의 권고**이며 벤더 공식 지침이 우선한다. 모든 '즉시' 조치는 증거(로그·메모리·디스크·클라우드 감사 기록)를 신속히 보존하되 패치를 미루지 않으며, 침해된 장비·계정에서 새 비밀을 발급하지 않는다. 수정 버전 번호는 작성 당시 기준이므로 최신 보안 버전을 확인한다.\n> ATT&CK 기준: **v19.2**. 사건별 매핑은 [../ATTACK/README.md](../ATTACK/README.md) 참고.\n\n## 1. 오늘의 요약\n\n| # | 이슈 | CVE | 유형 | 상태 | 즉시 조치 |\n|---|------|-----|------|------|-----------|\n| 1 | 가상자산 거래소 Bitget 약 3.875억 달러 탈취 | 미공개 | 보안 장비 제로데이 → 지갑 서버 | 회사 발표(9/30), 북한 배후설은 미검증 | 보안 장비 패치·재구축, 지갑 서명 통제 |\n| 2 | Roundcube 웹메일 SQL 삽입 악용 | CVE-2026-48842 | 인증 없이 가능한 SQL 삽입 | 악용 보도(캐나다 사이버보안센터가 공개 보고 인용), 5월 패치 | 1.6.16 / 1.7.1 이상 |\n| 3 | 영국 패션몰 ASOS 침해 주장 | 해당 없음 | 서드파티 고객 소통 플랫폼 무단 접근 | 회사가 무단 접근 인정, Snowflake 장악 주장은 미확인 | 연동 플랫폼 접근 점검 |\n| 4 | 국내 이슈 | | | 금융권 건 후속 보도 외 신규 대형 건 확인 못함 | [국내 보충](2026-10-06-국내보충.md) 참고 |\n\n추가 메모: 10-06 보고서의 Citrix CVE-2026-88779는 KEV 기한이 10/7이다. FortiMail은 패치 출시 여부를 계속 확인한다. 같은 기간 미국 교육 서비스 업체 Frontline Education이 서드파티 소프트웨어 취약점으로 직원 정보(사회보장번호 포함)가 유출됐다고 알렸으나 규모·제품이 미공개라 사건으로 쓰지 않았다.\n\n## 2. 이슈별 분석\n\n### [D20261007-bitget] Bitget 가상자산 탈취 (보안 제품 제로데이)\n> 날짜: 2026-09-25 · 유형: 서드파티 보안 제품 제로데이 → 내부 이동 → 지갑 서버 · 행위자: 미귀속(회사는 북한 해커 주장, 미검증) · 지역: 글로벌 · 근거: 보도\n\n**쉽게 말하면**: 가상자산 거래소 Bitget이 약 3억 8,750만 달러어치 자산을 도난당했다고 밝혔습니다. 회사 설명에 따르면 외부 보안 제품의 제조사도 모르던 결함이 공격에 쓰였고, 그 제품 장비들이 입구가 됐고, 그곳에서 지갑을 관리하는 서버까지 들어갔다고 합니다. 어떤 제품인지는 공개되지 않았고, 누구 소행인지도 확정되지 않았습니다.\n\n**먼저 할 일(초보용)**: 이용자는 거래소 공지를 확인하고 출금 재개 전까지 공식 안내 외의 '복구 도와드립니다' 연락을 믿지 마세요. 담당자라면 인터넷에 노출된 보안 장비의 버전과 관리 화면 노출을 점검하고, 의심 장비에서 새 키·비밀번호를 만들지 말고 깨끗한 기기에서 교체하세요.\n\n**개요**: 회사 발표를 전한 보도(9/30) 기준, 가장 이른 악성 활동은 8/31이고 실제 탈취는 9/25(UTC+8) 약 3시간 동안 이뤄졌다. ETH·XRP·BNB·AVAX·USDT·USDC 등 여러 블록체인의 자산이 대상이다. 회사는 출금을 중단하고 회수 협조에 5% 현상금을 내걸었다. CVE 번호와 제품명은 공개되지 않았다(1차 발표 원문은 직접 확인하지 못함).\n\n**왜 일어났나**\n- 직접 원인 [보도: 회사 설명]: 서드파티 보안 제품의 제로데이 악용 후 장비 두 대(A·B)가 침해됐다는 설명 → 웹셸 설치와 C2(공격자 원격 조종) 연결 → 지갑 서버로 이동 → 악성 패키지 배포로 지갑 처리 과정에서 자산을 이전(위조 출금 명령 주입 등 세부 방식은 확인 필요). 각 단계의 기술적 증거는 공개되지 않았다.\n- 구조적 원인 [추정]: (1) 보안 제품이 공격 입구가 됨(인터넷에 노출된 서비스였는지는 미확인) (2) 보도된 최초 악성 활동(8/31)부터 자산 이전(9/25)까지 약 25일이 걸렸으나 최초 침투·탐지·대응 시점은 별도 확인이 필요함(미탐지로 단정하지 않음) (3) 일반 서버 대역에서 핫월렛(즉시 이체 가능한 지갑) 서버로 이어지는 경로 분리 미흡 가능성. 이는 본 보고서의 분석이며 확인된 사실이 아니다.\n- 배후 [주장]: 대표가 접속 패턴과 블록체인 분석을 근거로 북한을 지목했으나 외부 연구자의 독립 검증은 없다.\n\n**침투 경로 [보도: 회사 설명 인용]**: 보안 제품 제로데이 → 웹셸·C2 → 내부 이동 → 운영 지갑 서버 → 악성 패키지 → 자산 이체. 내부 이동의 구체 수단은 미공개.\n\n**어떻게 조치하나**\n- 즉시: 증거 보존 후 해당 계열 보안 장비의 패치·우회책 적용, 관리 화면 외부 차단. 침해 의심 장비는 재구축하고 그 장비를 거친 키·인증서는 폐기 후 깨끗한 환경에서 재발급.\n- 단기: 장비 로그에서 웹셸·비정상 아웃바운드 점검, 지갑 서버로 가는 접속 경로 전수 확인, 대량 출금 한도·지연·다중 승인.\n- 장기: 지갑 서명 키를 하드웨어 보관(HSM 등)·다중 서명으로 분리, 보안 장비 관리면 분리, 엣지 장비 긴급 패치 기준.\n- 탐지: 장비의 신규 파일·비정상 프로세스, 지갑 서버로의 새 접속원, 평소와 다른 배포 활동.\n\n**교훈**: 보안 장비도 공격 입구가 된다. 최초 활동에서 탈취까지 약 25일이 걸렸으니 그 사이 탐지 기회가 있었는지 점검할 만하다(탐지 실패를 단정하는 것은 아니다).\n\n### [D20261007-roundcube] Roundcube 웹메일 CVE-2026-48842 악용\n> 날짜: 2026-09-21 · 유형: 엣지·웹 서비스 취약점 · 행위자: 미귀속 · 지역: 글로벌 · 근거: 보도\n\n**쉽게 말하면**: 웹으로 메일을 보는 프로그램(Roundcube)에서 로그인 없이도 데이터베이스에 명령을 끼워 넣을 수 있는 결함이 5월에 패치됐는데, 아직 안 고친 서버를 노린 공격이 벌어지고 있다고 캐나다 정부 기관이 공개 보고를 인용해 경고했습니다. 약 52만 대가 인터넷에 노출돼 있다고 보도됐습니다.\n\n**먼저 할 일(초보용)**: 메일 서버 담당자는 Roundcube 버전을 확인하고 1.6.16 또는 1.7.1 이상(당시 기준)으로 올리세요. 이미 뚫렸을 수 있으니 패치만으로 끝내지 말고 접속 기록과 사용자 계정 이상 여부를 보세요.\n\n**개요**: Roundcube의 `virtuser_query` 플러그인에서 인증 없이 가능한 SQL 삽입이다. 캐나다 사이버보안센터가 9/21 갱신된 공지에서 \"공개 보고가 실제 악용을 나타낸다\"고 밝혔다(센터가 직접 검증했다는 뜻은 아님; 개발사는 5/24 패치 공지). 심각도는 '높음'(점수 미확인). CISA KEV 등재 여부는 이번 확인에서 알 수 없었다(KEV 목록 상위 15건에는 없음).\n\n**왜 일어났나**\n- 직접 원인 [확인: 개발사 공지]: `virtuser_query` 플러그인의 입력 검증 결함. 5월에 수정본이 나왔다.\n- 구조적 원인 [추정]: (1) 패치가 나온 지 4개월이 지나도 많은 서버가 미적용 (2) 메일 서버가 인터넷에 직접 노출. 구체적 피해 사례와 공격자 목적은 공개되지 않았다.\n\n**침투 경로 [보도 범위]**: 인터넷 노출 Roundcube에 조작 요청 → 인증 우회·DB 명령 실행. 이후 행위는 미공개.\n\n**어떻게 조치하나**\n- 즉시: 증거 보존 후 수정 버전 적용(패치를 미루지 않음).\n- 단기: 웹서버·DB 로그에서 `virtuser_query` 관련 비정상 요청 소급 점검, 메일함 접근·전달 규칙 이상 확인, 의심 시 DB 자격 증명을 깨끗한 기기에서 교체.\n- 장기: 웹메일 접근 IP 제한·VPN 뒤 배치, 소프트웨어 자산 목록과 자동 패치 점검.\n- 탐지: 웹 로그의 SQL 구문 문자열, 비정상 DB 질의량.\n\n**교훈**: 패치가 나온 뒤에도 몇 달 지나 공격이 시작될 수 있다. 오래된 공개 취약점이 가장 흔한 입구다.\n\n### [D20261007-asos] ASOS 침해 주장과 인정된 개인정보 유출\n> 날짜: 2026-10-06 · 유형: 서드파티 플랫폼 무단 접근 · 행위자: 'Xuanye group' 자칭 · 지역: 글로벌 · 근거: 보도\n\n**쉽게 말하면**: 영국 온라인 패션몰 ASOS 앱에서 \"해킹당했다\"는 알림이 이용자에게 전송됐습니다. 회사는 고객 소통에 쓰는 외부 플랫폼에 무단 접근이 있었고 이름·연락처 같은 기본 정보가 접근됐을 가능성이 있다고 밝혔습니다. 다만 공격자가 주장한 '데이터 저장소(Snowflake) 완전 장악'은 확인되지 않았습니다.\n\n**먼저 할 일(초보용)**: 이용자는 ASOS를 사칭한 문자·이메일(링크 클릭 유도)을 조심하세요. 회사 발표에 따르면 회사는 카드 정보·비밀번호가 영향받지 않은 것으로 판단한다고 하지만, 앱 알림 속 링크는 누르지 마세요. 담당자는 외부 고객 소통 플랫폼의 계정·토큰 접근을 점검하세요.\n\n**개요**: 10/6 ASOS 앱 푸시 알림으로 알려졌다. 자칭 'Xuanye group'이 텔레그램에서 책임을 주장했다. 영향 고객 수와 유출 범위, 공격 방법은 미확인이다(BleepingComputer 보도 한 건 기준). 서드파티 플랫폼 무단 접근은 회사 확인, Snowflake 장악은 공격자 주장이다.\n\n**왜 일어났나**\n- 직접 원인 [보도: 회사 확인]: 고객 소통용 서드파티 플랫폼에 무단 접근. 접근 방법(탈취한 자격 증명인지 취약점인지)은 **확인되지 않았다**.\n- 구조적 원인 [추정]: 외부 서비스가 고객 알림 발송 권한까지 가진 구조는 한 곳이 뚫리면 이용자에게 직접 영향이 간다. 이 건의 실제 원인으로 단정하지 않는다.\n- Snowflake 장악 [주장: 공격자]: 증거가 제시되지 않았다.\n\n**침투 경로**: 미공개 (공격자 주장 외 확인된 경로 없음). 그래서 ATT&CK 매핑은 하지 않았다.\n\n**어떻게 조치하나**\n- 즉시: 증거 보존, 서드파티 플랫폼의 API 키·세션 토큰 회수(비밀번호 변경만으로는 이미 발급된 토큰이 사라지지 않음), 알림 발송 권한 임시 차단.\n- 단기: 연동 서비스별 권한·접속 기록 점검, 데이터 저장소 접근 로그 확인.\n- 장기: 외부 서비스에 최소 권한, 키 주기적 교체, 서드파티 접근 이상 탐지.\n- 탐지: 평소와 다른 알림 발송, 외부 서비스의 새 접속원.\n\n**교훈**: 공격자의 큰 주장과 회사가 확인한 범위는 다르다. 확인된 것만 믿고 대응하되, 서드파티 연동 권한은 평소에 줄여 두어야 한다.\n\n## 3. 교차 분석\n\n> 표본은 3건이며 추세를 말하지 않는다.\n\n1. **서드파티·외부 구성요소**: Bitget(보안 장비), ASOS(고객 소통 플랫폼)는 모두 자사 밖의 구성요소가 입구로 보도됐다. 다만 ASOS의 접근 방법은 미공개다.\n2. **패치 지연**: Roundcube는 패치 후 4개월 뒤 악용이 확인됐다.\n\n## 4. 침투 경로 종합\n\n```\n[노출 장비] → T1190 보안 장비·웹메일 악용 (Bitget, Roundcube)\n[지속·원격] → 웹셸 → C2 → 지갑 서버 → 금전 탈취 (Bitget)\n[경위 미공개] → ASOS (매핑 없음)\n```\n\n## 5. 우선 대응 체크리스트\n\n1. **Citrix(10/7 기한)**: 수정 버전 적용과 세션 종료, 점검 항목은 [10-06 보고서](2026-10-06.md) 참고.\n2. **Roundcube**: 1.6.16 / 1.7.1 이상(당시 기준) 확인, 웹 로그 소급 점검.\n3. **보안 장비·가상자산 보관**: 노출 장비 목록과 관리면 노출 점검, 지갑 서명 키 분리·다중 승인.\n4. **외부 플랫폼 연동**: 토큰·API 키 목록과 권한 점검.\n\n## 6. 검증 수준과 한계\n\n- Bitget은 BleepingComputer 보도(회사 발표 인용) 한 건에 근거하며 회사 원문·제품명·CVE는 확인하지 못했다. 북한 배후는 회사 주장이다.\n- Roundcube의 악용은 캐나다 사이버보안센터 공지(원문 확인: \"공개 보고가 악용을 나타낸다\")에 근거하며 센터의 직접 검증은 아니다. 구체적 피해 사례는 확인하지 못했다.\n- ASOS는 BleepingComputer 한 건 기준이며 규모는 미확인이다. 공격자 주장은 사실로 취급하지 않았다.\n- 국내: 금융권·통신·공공·랜섬웨어 질의를 했으나 10/6~7 신규 대형 사건은 확인하지 못했다. 금융위가 10/7 금융사 자체 점검 결과를 놓고 추가 회의를 연다는 보도와 금융당국의 점검 체크리스트·금감원 검사 방침만 국내뉴스에 추가했다. 검색에 나온 병원·대학 사례는 발생 시점을 확인하지 못해 제외했다.\n- Citrix·FortiMail 후속과 9/24~25 KEV(SharePoint·MikroTik·Adobe Magento·WSO2·Check Point)는 분석하지 못했다.\n- ATT&CK는 v19.2 기준이다(공식 사이트 점검 결과는 최종 요약 참고).\n\n## 출처\n\n- CISA KEV 카탈로그 (목록 직접 확인, 10/4 이후 신규 없음)\n- BleepingComputer: Bitget 제로데이 침해, Roundcube 악용, ASOS 침해, Frontline Education 침해\n- inews24·SBS Biz: 금융위 점검 회의 보도\n- MITRE ATT&CK v19.2\n"},{"path":"일일/2026-10-08.md","title":"일일 보안 이슈 분석 — 2026-10-08","md":"# 일일 보안 이슈 분석 — 2026-10-08\n\n> 수집 기준: 2026-10-07 ~ 10-08 공개분. CISA KEV는 직접 확인했으며 10/4(Citrix CVE-2026-88779) 이후 신규 등재는 없었다. 이미 [10-07 보고서](2026-10-07.md)·[10-06 국내 보충](2026-10-06-국내보충.md)에 있는 사건은 중복 작성하지 않았다.\n> 근거 표기: **[확인]** 벤더·정부기관·피해 기업이 직접 확인 / **보도** 언론 보도 / **[추정]** 본 보고서의 추정 / **[주장]** 공격자 일방 주장. **조치는 본 보고서의 권고**이며 벤더 공식 지침이 우선한다. 모든 '즉시' 조치는 증거(로그·메모리·디스크·클라우드 감사 기록)를 신속히 보존하되 패치를 미루지 않으며, 침해된 장비·계정에서 새 비밀을 발급하지 않는다. 수정 버전 번호는 작성 당시 기준이므로 최신 보안 버전을 확인한다.\n> ATT&CK 기준: **v19.2**. 사건별 매핑은 [../ATTACK/README.md](../ATTACK/README.md) 참고.\n\n## 1. 오늘의 요약\n\n| # | 이슈 | CVE | 유형 | 상태 | 즉시 조치 |\n|---|------|-----|------|------|-----------|\n| 1 | Atlassian 제품군 인증 없는 파일 접근 결함 악용 | CVE-2026-21589 | 인터넷에 열린 서비스 취약점 | 공개 시연 코드 공개 2시간 만에 악용 관측(보도) | 보안 업데이트, 외부 접근 제한 |\n| 2 | FortiGate 로그인 정보 유출 묶음('FortiBleed') 악용 | 없음 | 유출된 계정 정보 재사용 | FBI 경고(보도), 랜섬웨어 침투구로 관측 | 외부 접근 제한, VPN 세션 종료, MFA |\n| 3 | 가나·아메리칸사모아·시에라리온 국가 도메인 관련 침해 → 구글 도메인용 인증서 부정 발급 | 없음 | 인터넷 주소 체계(DNS) 변조 | 구글 발표(보도) | 인증서 투명성 로그 감시, CAA 기록 |\n| 4 | 국내 이슈 | | | 10/7~8 신규 대형 건 확인 못함 | [국내 보충](2026-10-06-국내보충.md) 참고 |\n\n추가 메모: 일본 반도체 검사장비 업체 Advantest가 랜섬웨어 침해로 개인정보가 유출됐다는 통지를 10/6자로 냈다는 보도가 있으나(2월 침입, 공개까지 약 8개월), 상세를 1차 확인하지 못해 사건으로 쓰지 않았다.\n\n## 2. 이슈별 분석\n\n### [D20261008-atlassian] Atlassian 제품군 CVE-2026-21589 악용\n> 날짜: 2026-10-07 · 유형: 엣지·웹 서비스 취약점 · 행위자: 미귀속 · 지역: 글로벌 · 근거: 보도\n\n**쉽게 말하면**: 회사 안에 직접 설치해 쓰는 업무 도구(Jira, Confluence, Bitbucket 등)에서 로그인 없이 서버의 파일을 읽을 수 있는 결함이 발견됐고, 연구기관이 공격 방법을 공개한 지 약 2시간 만에 공격 시도가 관측됐다고 보도됐습니다. 자동 검사 도구까지 퍼져 있어 노출된 서버는 금방 표적이 될 수 있습니다.\n\n**먼저 할 일(초보용)**: 담당자는 직접 설치형 Atlassian 제품의 버전을 확인하고 Atlassian 공식 보안 공지의 수정 버전으로 올리세요. 인터넷에서 바로 접근되지 않게 막고, 이미 공격받았을 수 있으니 패치 후에도 접속 기록과 설정 파일·비밀 값 노출 여부를 점검하세요.\n\n**개요**: BleepingComputer(10/7) 보도에 따르면 CVE-2026-21589는 Bitbucket·Confluence·Jira Software·Jira Service Management·Bamboo·Crowd Data Center와 Crucible·Fisheye의 자체 설치형 인스턴스에서 인증 없이 웹 애플리케이션 안의 파일에 접근할 수 있는 결함이다(보도는 '임의 파일'로 표현했으나 정확한 경로가 필요한 등 범위 조건은 Atlassian 공지에서 확인해야 한다). 보안업체 Previdian이 허니팟(미끼 서버)으로 공격을 탐지했고 watchTowr가 기술 분석과 공개 시연 코드(PoC)를 냈다. 수정 버전은 보도에 없어 Atlassian 공지를 확인해야 한다(원문 공지는 직접 확인하지 못함). CISA KEV 등재는 아직 없다.\n\n**왜 일어났나**\n- 직접 원인 [보도]: 인증 없이 파일 경로를 조작해 파일을 읽을 수 있는 구현상 결함(세부 원인은 공지 확인 필요).\n- 구조적 원인 [추정]: (1) 공개 시연 코드가 나오면 수 시간 안에 악용이 시작되는 속도 (2) 업무 도구가 인터넷에 직접 노출되는 운영 (3) 소스·티켓 도구에 설정 파일과 비밀 값이 모여 있어 파일 읽기만으로 이후 침투로 이어질 수 있음. 이는 분석이며 확인된 사실이 아니다.\n\n**침투 경로 [보도 범위]**: 인터넷 노출 인스턴스에 조작된 요청 → 임의 파일 읽기. 이후 행위(자격 증명 탈취 등)는 확인되지 않았다.\n\n**어떻게 조치하나**\n- 즉시: 증거 보존 후 수정 버전 적용(패치를 미루지 않음). 패치 전에는 외부 접근 차단, WAF·프록시로 경로 조작 패턴 차단, 제품별 임시 완화 규칙(보도에 소개된 Tomcat 재작성 규칙 등)은 공지에서 확인해 적용.\n- 단기: 웹 로그에서 경로 조작 요청과 보도된 의심 IP(38.60.157.86, 146.70.187.234, 159.26.119.225 — 보도 기준) 접속 소급 점검. 서버에 저장된 DB 접속 정보·토큰·연동 키 노출 가능성을 따져 깨끗한 기기에서 교체(비밀번호만 바꾸면 이미 발급된 토큰은 남음).\n- 장기: 관리용 협업 도구는 VPN 뒤에 두기, 자산 목록과 긴급 패치 기준 마련.\n- 탐지: 설정·키 파일에 대한 비정상 읽기, 새로 생긴 관리자·API 토큰.\n\n**교훈**: 공개 시연 코드와 자동 검사 템플릿이 함께 나오면 패치 여유 시간은 사실상 없다.\n\n### [D20261008-fortibleed] FortiBleed — 유출된 FortiGate 로그인 정보의 랜섬웨어 악용\n> 날짜: 2026-10-07 · 유형: 유출 자격 증명 재사용 · 행위자: INC/Lynx·Payload 랜섬웨어 계열이 연루됐다고 FBI가 경고(보도) · 지역: 글로벌 · 근거: 보도\n\n**쉽게 말하면**: 방화벽·VPN 장비(FortiGate)의 아이디와 비밀번호 묶음이 유출돼 돌아다니고 있고, 이를 이용한 침입이 계속되고 있다고 FBI가 경고했다고 보도됐습니다. 침입자는 관리자 계정을 새로 만들고 기존 관리자를 지워 원래 담당자를 쫓아냈습니다. 특정 제품 결함이 아니라 유출된 로그인 정보를 쓰는 공격이라는 점이 핵심입니다.\n\n**먼저 할 일(초보용)**: 담당자는 FortiGate 관리 화면과 SSL VPN이 인터넷에 열려 있는지 확인하고 막으세요. 장비 안의 관리자 목록과 최근 설정 변경에서 낯선 계정을 찾으세요. 침입이 의심되면 그 장비에서 새 비밀번호를 만들지 말고 깨끗한 기기에서 바꾸며, 이미 열린 VPN 접속(세션)도 모두 끊어야 합니다.\n\n**개요**: BleepingComputer(10/7) 보도에 따르면 'FortiBleed'는 194개국 86,644대 기기의 접속 정보(아이디·평문 비밀번호)가 유출된 사건의 이름이다(규모는 보도 기준이며 단위는 기기. 최초 유출 자료의 계정 수와 후속 침해 장비 집계가 섞였을 수 있어 모집단은 불명확). FBI는 이 공격 흐름이(관리자 계정 생성·삭제는 일부 사고에서 관측) 랜섬웨어 제휴자(INC/Lynx, Payload)의 첫 진입점으로 관측됐다고 밝힌 것으로 보도됐다. 특정 CVE나 취약 버전은 보도에 없다. 정보 탈취 악성코드 기록·크리덴셜 스터핑·비밀번호 스프레이로 계정을 얻고, 장비에서 비밀번호 해시를 꺼내 GPU 군집으로 오프라인 해독한다고 한다. FBI 원문은 직접 확인하지 못했다.\n\n**왜 일어났나**\n- 직접 원인 [보도: FBI 인용]: 유출·재사용된 로그인 정보와 약한 비밀번호 저장 방식(과거 방식 해시)으로 인한 장비 접근.\n- 구조적 원인 [추정]: (1) 관리·VPN 화면의 인터넷 노출 (2) MFA 미적용 계정 (3) 유출 목록을 받아 교체하지 않는 운영. 유출 경위 자체는 공개되지 않았다.\n\n**침투 경로 [보도: FBI 인용]**: 유출·탈취 자격 증명 → 방화벽/VPN 로그인 → 관리자 계정 생성·기존 관리자 삭제(접근 차단) → 랜섬웨어 단계로 이어짐.\n\n**어떻게 조치하나**\n- 즉시: 증거(장비 로그·설정 백업) 보존 후 관리 화면·SSL VPN 외부 접근 제한, 활성 VPN 세션 종료, 관리자·VPN 계정 비밀번호를 깨끗한 기기에서 교체하고 MFA 강제. 비밀번호만 바꿔서는 이미 발급된 세션이 사라지지 않으므로 세션 종료를 따로 한다.\n- 단기: 관리자 목록·설정 변경 이력에서 낯선 계정 점검·제거, 내부 이동 흔적 조사, 장비 설정에 저장된 비밀(연동 계정 등) 교체, 의심 장비는 재구축 판단(침해된 장비에서 새 비밀을 발급하지 않음).\n- 장기: 관리면 분리, 관리자 비밀번호 저장 방식 강화(보도는 PBKDF2, 지원 버전은 제조사 절차 확인; 이미 탈취된 비밀번호는 별도로 교체해야 함), 유출 목록 모니터링.\n- 탐지: 관리자 계정 생성·삭제 로그, 평소와 다른 접속원의 VPN 로그인.\n\n**교훈**: 패치만으로는 막을 수 없는 입구가 있다. 유출된 로그인 정보는 이미 공격자 손에 있다고 보고 교체와 MFA를 해야 한다.\n\n### [D20261008-cctld] 국가 도메인 관련 침해와 구글 도메인 인증서 부정 발급\n> 날짜: 2026-10-07 · 유형: 서드파티(도메인 운영 쪽) 침해 → DNS 변조 · 행위자: 미귀속 · 지역: 글로벌 · 근거: 보도\n\n**쉽게 말하면**: 인터넷 주소를 관리하는 일부 나라(가나, 아메리칸사모아, 시에라리온)의 도메인 운영 쪽이 뚫려, 공격자가 주소 안내 정보를 바꾸고 구글 관련 주소에 대한 '정상으로 보이는 보안 인증서'까지 받아 냈다고 구글이 밝혔다고 보도됐습니다. 구글 자체 시스템은 안전하다고 합니다. 가짜 사이트가 진짜처럼 보일 수 있다는 점이 문제입니다.\n\n**먼저 할 일(초보용)**: 일반 이용자는 브라우저를 최신으로 유지하세요(구글은 Chrome에서 해당 인증서를 차단했다고 합니다). 도메인 담당자는 자사 도메인의 인증서 발급 기록을 공개 감시 목록(인증서 투명성 로그)에서 확인하고, 인증서를 발급할 수 있는 기관을 제한하는 CAA 기록을 설정하세요(CAA는 이후 부정 발급을 줄일 뿐 진행 중인 DNS 탈취를 막지는 못합니다).\n\n**개요**: BleepingComputer(10/7)가 구글의 공식 발표를 인용해 보도했다. 공격자는 .gh·.as·.sl 국가 코드 최상위 도메인(ccTLD)의 서드파티 운영자를 침해해 권한 있는 DNS 기록을 수정하고, 인증기관에서 유효한 TLS 인증서를 받았다. 구글은 CRLSet으로 Chrome에서 차단했고, 인증서 투명성 로그에서 찾은 추가 인증서도 선제 차단했다. 구글은 영향 도메인을 모두 찾지 못했을 수 있고 CRLSet 보호는 Chrome 이용자에만 적용된다고 밝혔다. 구글 원문은 직접 확인하지 못했다.\n\n**왜 일어났나**\n- 직접 원인 [보도: 구글 발표 인용]: 서드파티 운영자 침해로 DNS 기록 수정 권한을 얻었다. 최초 침투 방법은 **확인되지 않았다**.\n- 구조적 원인 [추정]: 인증서 발급이 'DNS를 제어하는 쪽이 도메인 주인'이라는 가정에 의존하므로, 상위 DNS가 뚫리면 정상 발급 절차로 부정 인증서가 나올 수 있다. 이는 분석이다.\n\n**침투 경로 [보도 범위]**: 서드파티 운영자 침해(경위 미공개) → DNS 기록 변조 → 인증서 요청·발급 → 도메인 사칭 가능.\n\n**어떻게 조치하나**\n- 즉시: 해당 ccTLD 하위에 도메인이 있으면 증거 보존 후 DNS 기록·위임을 점검해 정상으로 복구하고 레지스트라 계정 점검. Chrome 차단은 다른 브라우저·도메인까지 보호하지 않는다. 부정 발급 인증서는 발급기관에 폐기를 요청.\n- 단기: 인증서 투명성 로그 감시를 도메인 전체로 확대, CAA 기록 설정, 레지스트라 계정 MFA.\n- 장기: 핵심 도메인은 레지스트리 락과 DNSSEC 적용(적용 가능 여부와 보호 범위는 운영자마다 다르며 운영자 자체 침해까지 막지는 못함), 중요 서비스는 인증서 발급 모니터링.\n- 탐지: 투명성 로그에 처음 보는 발급, DNS 응답 변경.\n\n**교훈**: 내 시스템이 안전해도 주소 체계를 맡은 외부가 뚫리면 사칭이 가능하다. 인증서 발급 기록을 감시하는 것이 가장 싼 방어다.\n\n## 3. 교차 분석\n\n> 표본은 3건이며 추세를 말하지 않는다.\n\n1. **속도**: Atlassian은 공개 시연 코드 후 약 2시간 만에 악용이 관측됐다고 보도됐다.\n2. **자격 증명**: FortiBleed는 취약점이 아닌 유출 로그인 정보 재사용이다. 패치만으로는 해결되지 않는다.\n3. **서드파티·상위 인프라**: ccTLD 건은 자사 밖의 주소 체계가 입구다. 다만 세 건의 직접 연관성은 없다.\n\n## 4. 침투 경로 종합\n\n```\n[노출 서비스] → T1190 Atlassian 인증 없는 파일 접근(허니팟에서 관측된 악용 시도 기준)\n[유출 자격 증명] → T1110/T1078 FortiGate 로그인 → T1136 관리자 생성 → T1531 관리자 차단\n[상위 인프라] → T1584 DNS 운영 쪽 변조 (최초 침투 미공개)\n```\n\n## 5. 우선 대응 체크리스트\n\n1. **Atlassian 직접 설치형**: 공지 확인, 수정 버전 적용, 외부 접근 차단.\n2. **FortiGate**: 관리면·SSL VPN 외부 접근 제한, 세션 종료, 관리자 목록 점검, MFA.\n3. **도메인**: 인증서 투명성 로그 감시와 CAA 설정, 레지스트라 계정 보호.\n4. **Citrix(10/7 기한 경과)**: 후속은 [10-06 보고서](2026-10-06.md) 참고.\n\n## 6. 검증 수준과 한계\n\n- 세 건 모두 BleepingComputer 보도 한 건씩에 근거하며 Atlassian 공지·FBI 경고·구글 발표 원문은 직접 확인하지 못했다.\n- Atlassian의 수정 버전 번호와 KEV 등재 여부, FortiBleed의 유출 경위와 기기 수 검증, ccTLD 침해의 최초 경로는 확인하지 못했다.\n- 보도 속 'FBI 관측'은 BleepingComputer 인용이며 FBI 원문은 보지 못했다. ATT&CK 매핑은 본 보고서 작성자의 판단이다. T1531은 공식 플랫폼 목록에 네트워크 장비가 없을 수 있어 행위 기준으로 매핑했다.\n- 국내: 금융·통신·이커머스·공공·교육·의료·랜섬웨어 질의를 했으나 10/7~8 신규 대형 사건과 금융위 10/7 회의 결과 발표는 확인하지 못했다(국내뉴스에 추가한 항목 없음).\n- Advantest 랜섬웨어 건은 1차 확인 부족으로 제외했다. 9/22~25 KEV(SharePoint·MikroTik·Magento·WSO2·Check Point)는 분석하지 못했다.\n- ATT&CK는 v19.2 기준이다(공식 사이트 점검 결과는 최종 요약 참고).\n\n## 출처\n\n- CISA KEV 카탈로그 (목록 직접 확인, 10/4 이후 신규 없음)\n- BleepingComputer: Atlassian CVE-2026-21589 악용, FortiBleed 공격 FBI 경고, ccTLD 침해와 구글 도메인 하이재킹\n- MITRE ATT&CK v19.2\n"},{"path":"일일/2026-10-09.md","title":"일일 보안 이슈 분석 — 2026-10-09","md":"# 일일 보안 이슈 분석 — 2026-10-09\n\n> 수집 기준: 2026-10-08 ~ 10-09 공개분 + 10-08 CISA KEV 신규 등재. CISA KEV 목록은 직접 확인했다(JSON 피드). 이미 [10-08 보고서](2026-10-08.md)·[10-06 국내 보충](2026-10-06-국내보충.md)에 있는 사건은 중복 작성하지 않았다.\n> 근거 표기: **[확인]** 벤더·정부기관·피해 기업이 직접 확인 / **보도** 언론 보도 / **[추정]** 본 보고서의 추정 / **[주장]** 공격자 일방 주장. **조치는 본 보고서의 권고**이며 벤더 공식 지침이 우선한다. 모든 '즉시' 조치는 증거(로그·메모리·디스크·클라우드 감사 기록)를 신속히 보존하되 패치를 미루지 않으며, 침해된 장비·계정에서 새 비밀을 발급하지 않는다. 수정 버전 번호는 작성 당시 기준이므로 최신 보안 버전을 확인한다.\n> ATT&CK 기준: **v19.2**. 사건별 매핑은 [../ATTACK/README.md](../ATTACK/README.md) 참고.\n\n## 1. 오늘의 요약\n\n| # | 이슈 | CVE | 유형 | 상태 | 즉시 조치 |\n|---|------|-----|------|------|-----------|\n| 1 | CISA가 오래된 취약점 5건(ProFTPD·ONLYOFFICE·Strapi·Struts·BIND)을 악용 목록에 추가 | CVE-2015-3306 외 4건 | 오래된 결함의 재악용 | CISA KEV 등재 [확인](10/8, 기한 10/11) | 자산 목록 대조, 패치·폐기 |\n| 2 | Cisco 이메일 보안 장비(Secure Email Gateway) 루트 명령 실행 결함 악용 | CVE-2026-76461 | 인터넷에 열린 장비 취약점 | Cisco·CISA 확인, KEV 기한(9/17) 경과 | 수정 버전 적용, 장비 침해 점검 |\n| 3 | 국내 금융권 연쇄 해킹 후속 | | | 신규 대형 건은 없음, 피해 현황 갱신 | [국내 보충](2026-10-06-국내보충.md) 참고 |\n\n추가 메모: 10/9 시점 신규 대형 해외 침해(랜섬웨어·대량 유출)는 1차 출처로 확인하지 못해 사건으로 쓰지 않았다. Microsoft 10월 정기 패치(Patch Tuesday)는 아직 공개 전으로 보인다.\n\n## 2. 이슈별 분석\n\n### [D20261009-kev-legacy] CISA, 오래된 취약점 5건을 '악용 확인' 목록에 추가\n> 날짜: 2026-10-08 · 유형: 오래된(레거시) 결함의 재악용 · 행위자: 미공개 · 지역: 글로벌 · 근거: 확인\n\n**쉽게 말하면**: 미국 CISA가 2015~2023년에 알려진 오래된 보안 결함 5개가 지금도 실제 공격에 쓰이고 있다고 목록에 올렸습니다. 파일 전송(ProFTPD), 문서 편집(ONLYOFFICE), 웹 관리(Strapi), 웹 개발틀(Struts), 주소 서버(BIND) 프로그램입니다. 오래전에 고쳐진 결함도 업데이트하지 않은 서버가 남아 있으면 그대로 뚫립니다.\n\n**먼저 할 일(초보용)**: 담당자는 우리 회사에서 이 다섯 프로그램을 쓰는지 자산 목록에서 찾고, 쓴다면 버전을 확인해 최신으로 올리세요. 더 이상 지원되지 않는 버전(Strapi 항목은 지원 종료 가능성이 명시됨)은 업데이트가 어려우니 교체·폐기를 검토하세요. 인터넷에 직접 열려 있다면 먼저 접근을 막으세요.\n\n**개요**: CISA KEV 직접 확인 결과 10/8 등재 5건(CISA KEV에 기재된 조치 기한이 모두 10/11이며 모든 기업에 적용되는 법정 마감은 아니다): ① ProFTPD CVE-2015-3306 — `site cpfr/cpto` 명령으로 서버 안 파일을 복사해 읽기·쓰기(서비스 권한과 환경에 따라 정보 노출이나 코드 실행으로 이어질 수 있음) ② ONLYOFFICE Docs CVE-2021-3199 — JWT 사용 시 이미지 업로드 경로 조작(path traversal)으로 원격 코드 실행 가능 ③ Strapi CVE-2023-22894 — 관리자 화면 접근자가 쿼리 필터를 이용해 민감한 값을 알아낼 수 있고(관리자 권한에 따라 대상이 달라짐) CVE-2023-22621과 연쇄 시 원격 코드 실행 가능(KEV가 지원 종료 가능성을 명시하므로 영향받는 버전의 지원 상태 확인 필요) ④ Apache Struts CVE-2016-3081 — 동적 메서드 호출이 켜진 경우 `method:` 접두어로 코드 실행 ⑤ ISC BIND CVE-2015-5477 — TKEY 질의로 서비스 거부(DoS). 랜섬웨어 사용 여부는 목록상 '알 수 없음'이다. 누가·어디서·어떤 규모로 악용했는지는 공개되지 않았다.\n\n**왜 일어났나**\n- 직접 원인 [확인: KEV 등재 사유]: CISA가 '실제 악용 증거가 있다'고 판단한 결함이다. 구체적 공격 경위는 공개되지 않았다.\n- 구조적 원인 [추정]: 피해 환경의 패치 지연 원인은 공개되지 않았다. 구버전 잔존·자산 목록 누락·지원 종료 제품 사용 여부를 점검할 필요가 있다(점검 항목이며 원인으로 확인된 것이 아니다).\n\n**침투 경로 [확인 범위]**: 인터넷에 열린 서비스의 알려진 결함 악용(구체 경로 미공개). 5건 모두 검토한 공개 자료에는 개별 침해 경위와 피해 규모가 제시되지 않았다.\n\n**어떻게 조치하나**\n- 즉시: 자산 목록·스캐너로 제품명뿐 아니라 실제 버전·구성·인터넷 노출·내장 구성요소를 확인한다(Struts는 동적 메서드 호출 비활성화가 우회책으로 알려져 있으나 패치를 대체하지 않는다). 증거(접속 로그·설정)를 보존하되 패치를 미루지 않고 제조사 수정 버전으로 올린다. 올릴 수 없으면 인터넷 노출을 차단한다. CISA 필수 조치는 제조사 완화책 적용(없으면 사용 중단)이다.\n- 단기: 해당 서비스의 과거 로그에서 비정상 파일 명령·경로 조작 요청 소급 점검, 웹셸·새 계정 확인. 침해 흔적이 있으면 그 서버에서 새 비밀을 만들지 말고 재구축을 검토한다.\n- 장기: 지원 종료 소프트웨어 교체 계획, 인터넷 노출 자산 정기 점검, 신규 등재와 자산 목록의 자동 대조.\n- 탐지: 해당 서비스 프로세스가 갑자기 셸을 실행하거나 낯선 파일을 쓰는 행위.\n\n**교훈**: 새 제로데이만 위험한 것이 아니다. 10년 된 결함도 방치된 서버에서는 여전히 입구가 된다.\n\n### [D20261009-cisco-seg] Cisco Secure Email Gateway CVE-2026-76461 — 로그인 없이 루트 명령 실행\n> 날짜: 2026-09-14 · 유형: 엣지·웹 서비스 취약점 · 행위자: 미귀속 · 지역: 글로벌 · 근거: 확인\n\n**쉽게 말하면**: 회사로 들어오는 메일을 걸러 주는 Cisco 장비에서, 조작된 메일 한 통만으로 장비의 최고 권한(루트)으로 명령을 실행할 수 있는 결함이 이미 악용되고 있습니다. 보안 장비 자체가 뚫리면 메일 내용 열람이나 내부망 침투의 발판이 될 수 있습니다. 한 달 가까이 지난 건이지만 아직 이 저장소에 정리하지 못해 오늘 추가합니다.\n\n**먼저 할 일(초보용)**: 담당자는 Cisco 이메일 게이트웨이(AsyncOS)를 쓰는지 확인하고 Cisco 공지의 수정 버전으로 올리세요. 우회책이 없다고 보도됐으니 패치가 핵심입니다. 이미 침해됐을 수 있으니 패치 후에도 Cisco가 공개한 침해 지표(IOC)로 점검하되(미검출이 미침해의 증거는 아님), 장비 안의 로그는 공격자가 지울 수 있으므로 방화벽·네트워크 기록과 대조하세요.\n\n**개요**: CISA KEV 직접 확인: CVE-2026-76461은 'Cisco Secure Email Gateway SQL 인젝션 취약점', 설명은 \"인증 없는 원격 공격자가 AsyncOS의 SQL 인젝션으로 기반 OS에서 루트 권한 임의 명령을 실행할 수 있다\", 2026-09-14 등재, 기한 9/17(이미 경과), 랜섬웨어 사용 '알 수 없음'. 검색으로 확인한 보도(SecurityWeek·Sophos·The Hacker News 등, 원문은 직접 열람하지 못함)에 따르면 CVSS 9.8, 물리·가상 장비 모두 영향, Secure Email and Web Manager와 Secure Web Appliance는 영향 없음, 조작된 메일로 악용, 공격자는 미상. 권고 버전 예: AsyncOS 16.5.0-780(보도 기준이며 계열별 수정 버전은 다를 수 있으니 Cisco 공지로 확인).\n\n**왜 일어났나**\n- 직접 원인 [확인: KEV 설명]: 메일 분석 코드의 SQL 삽입(SQL 인젝션: 입력값이 데이터베이스 명령으로 해석되는 결함)이 루트 명령 실행으로 이어짐.\n- 구조적 원인 [추정]: (1) 외부 메일을 처음 받는 장비가 인터넷에 직접 노출되는 구조 (2) 보안 장비가 높은 권한으로 동작 (3) 장비 내부는 사용자가 점검하기 어려운 블랙박스. 분석이며 확인된 사실이 아니다.\n\n**침투 경로 [보도 범위]**: 조작된 메일 → 장비의 메일 처리 → SQL 인젝션 → 루트 명령 실행. 이후 행위(자격 증명 탈취 등)는 확인되지 않았다.\n\n**어떻게 조치하나**\n- 즉시: 증거(장비 로그·설정·가능하면 디스크 사본)를 보존하고 수정 버전으로 올린다. 패치를 미루지 않는다.\n- 단기: Cisco 공개 IOC 점검, 장비 로그만 믿지 말고 외부 방화벽·메일 시스템 기록과 대조(클러스터는 전 구성원 조사, 패치만으로 침해 제거를 단정하지 않으며 복구 후에도 모니터링). 침해가 의심되면 증거 보존 후 새 장비(가상이면 새 VM)에 설정을 다시 구축하고(Cisco 공지가 강하게 권고한다고 알려짐; 물리 장비는 Cisco 지원 문의, 클러스터는 침해 멤버가 있으면 전체를 안전하게 복구), 장비에 저장된 연동 계정·인증서·키를 깨끗한 환경에서 교체한다(비밀번호만 바꾸면 이미 발급된 토큰은 남음).\n- 장기: 메일 보안 장비의 관리면 분리, 이상 행위 모니터링, 이중화로 패치 중 서비스 영향 완화.\n- 탐지: 장비에서 낯선 프로세스·외부 접속, 비정상 메일 처리 오류.\n\n**교훈**: 메일을 지켜 주는 장비가 가장 먼저 공격받을 수 있다. 보안 장비도 패치 대상이다.\n\n## 3. 교차 분석\n\n> 표본은 2건이며 추세를 말하지 않는다.\n\n1. **공통점은 '노출된 서비스의 알려진 결함'**: 두 건 모두 인터넷에 열린 서비스·장비의 결함이다. 다만 하나는 10년 된 결함 묶음이고 하나는 최신 결함이다.\n2. **패치 지연의 비용**: KEV 기한이 지난 뒤에도 장비를 확인하지 않은 곳은 위험이 이어진다.\n\n## 4. 침투 경로 종합\n\n```\n[노출 서비스] → T1190 후보(KEV 등재, 세부 미공개) / BIND는 T1499.004 후보\n[노출 장비]   → T1190 Cisco SEG SQL 인젝션 (Cisco·CISA 확인) → 루트 명령 실행 가능(이후 행위 미확인)\n```\n\n## 5. 우선 대응 체크리스트\n\n1. **레거시 5종**: 자산 목록 대조, 패치·폐기, 인터넷 노출 차단(기한 10/11).\n2. **Cisco SEG**: 수정 버전, IOC 점검, 외부 기록 대조.\n3. **Citrix(10/7 기한 경과)** 등 앞선 건의 후속은 [10-06](2026-10-06.md)·[10-08](2026-10-08.md) 참고.\n\n## 6. 검증 수준과 한계\n\n- KEV 등재(날짜·설명·기한)는 CISA 피드로 직접 확인했다. 그 외 Cisco 건의 세부(CVSS·버전·IOC)는 검색 결과의 2차 보도로 Cisco 원문 공지는 직접 열람하지 못했다.\n- 레거시 5건의 악용 주체·규모·방식은 확인하지 못했다. ATT&CK 매핑은 '노출 서비스 악용' 수준이며 레거시 5건은 '후보'로 둔다(BIND는 서비스 거부 기능이라 T1499.004 후보).\n- 국내: 금융·통신·이커머스·공공·교육·의료·랜섬웨어 질의를 했으나 10/8~9 신규 대형 사건은 찾지 못했다. 금융위 10/7 회의 결과 발표는 확인하지 못했다. 국내뉴스에는 10/3~6 보도 4건을 추가했다.\n- 9/22~25 KEV 일부(SharePoint·MikroTik·Magento·WSO2·Check Point)는 이번에도 분석하지 못했다.\n- ATT&CK는 v19.2 기준이다(공식 사이트 점검 결과는 최종 요약 참고).\n\n## 출처\n\n- CISA KEV 카탈로그/JSON 피드 (직접 확인)\n- Cisco Secure Email Gateway CVE-2026-76461: SecurityWeek, Sophos, The Hacker News, Cybersecurity Dive 보도(검색 결과 기준)\n- MITRE ATT&CK v19.2\n"},{"path":"일일/2026-10-10.md","title":"일일 보안 이슈 분석 — 2026-10-10","md":"# 일일 보안 이슈 분석 — 2026-10-10\n\n> 수집 기준: 2026-10-09 ~ 10-10 공개분. CISA KEV 목록은 JSON 피드로 직접 확인했다. 이미 [10-09 보고서](2026-10-09.md)·[10-06 국내 보충](2026-10-06-국내보충.md)에 있는 사건은 중복 작성하지 않았다.\n> 근거 표기: **[확인]** 벤더·정부기관·피해 기업이 직접 확인 / **보도** 언론 보도 / **[추정]** 본 보고서의 추정 / **[주장]** 공격자 일방 주장. **조치는 본 보고서의 권고**이며 벤더 공식 지침이 우선한다.\n> ATT&CK 기준: **v19.2**. 사건별 매핑은 [../ATTACK/README.md](../ATTACK/README.md) 참고.\n\n## 1. 오늘의 요약\n\n오늘은 모니터링한 공개 출처에서 보고 마감 시각까지 신규 주요 사건을 1차 출처로 확인하지 못했다(KEV 신규 없음이 신규 사건 없음의 근거는 아니다). 억지로 만들지 않고 확인된 사실만 기록한다.\n\n| # | 항목 | 상태 | 비고 |\n|---|------|------|------|\n| 1 | CISA 악용 확인 목록(KEV) | 10/10 조회한 피드에서 dateAdded가 10/8 이후인 항목 중 10/8 등재분 5건 외 없음 [확인] | 10/8 등재 5건은 [10-09 보고서](2026-10-09.md), 기한 10/11 |\n| 2 | 국내 금융권 연쇄 해킹 후속 | 신규 피해 확인 안 됨(보도) | 아래 참고, 사건은 [10-06 국내 보충](2026-10-06-국내보충.md)의 `D20261006-finsector` |\n| 3 | Microsoft 10월 정기 패치 | 10/13 예정으로 보이며 아직 공개 전 | 공개되면 다음 보고서에서 다룬다 |\n\n## 2. 국내 후속 (사건 갱신, 새 사건 아님)\n\n- 금융감독원이 은행·카드사의 긴급 보안점검 결과를 10/6 제출받아 분석 중이고, 증권·보험·저축은행 등은 10/8까지 제출해야 한다는 보도(YTN 10/7; 나머지 금융사의 제출 완료 여부는 확인하지 못함). 해당 보도 시점까지 연휴 이후 추가 유출이 확인됐다는 발표는 없었다. 공격 IP는 10/6~7 보도 기준 33개(중복 제거 28개)이며, 이후 수치가 늘었다는 후속 보도가 있을 수 있어 최신 값은 확인하지 못했다(IP 개수는 공격자 수나 피해 금융사 수가 아니다).\n- 일부 증권사에서 실제 공격에 앞선 '스캐닝'(공격 대상의 열린 문을 미리 살피는 행위) 정황이 발견됐다는 보도(YTN 10/6). 어느 증권사인지, 언제인지는 공개되지 않았다. 스캐닝 정황만으로 침해 성공이나 동일 공격자의 행위라고 볼 수 없다.\n- (별도 정책 동향) 금융보안원이 금융 AI 에이전트 보안 평가 기준을 마련해 연말까지 시범 검증 후 내년부터 적용할 계획이라는 보도.\n- 위 두 건은 `국내뉴스.psv`에 추가했다. 점검 결과 제출 마감(10/8) 이후의 최종 결과 발표는 확인하지 못했다.\n\n**먼저 할 일(일반 이용자)**: 금융사 앱·사이트의 비밀번호를 바꾸되(피해 서비스와 같은 비밀번호를 재사용한 계정부터; 이미 유출된 정보가 회수되지는 않습니다) 지원되는 추가 인증(OTP 등)을 켜세요. 공식 앱에서 유출 공지와 거래 내역을 확인하고 이상 거래는 금융사에 신고하세요. 금융사를 사칭하는 전화·문자의 링크는 누르지 말고 공식 앱·대표번호로 직접 확인하세요. 이미 발급된 로그인 세션은 비밀번호 변경만으로 모두 사라지지 않을 수 있으니 의심되면 모든 기기에서 로그아웃하고 활성 세션을 해제하세요.\n\n## 3. 우선 대응 체크리스트\n\n1. **레거시 5종(KEV 10/8 등재)**: 자산 대조, 패치·폐기, 인터넷 노출 차단. 기한 10/11.\n2. **Cisco Secure Email Gateway(CVE-2026-76461)**: 수정 버전, IOC 점검 — [10-09](2026-10-09.md) 참고.\n3. 금융권 점검 결과 발표와 Microsoft 10/13 패치 공개 여부를 다음 보고서에서 확인한다.\n\n## 4. 검증 수준과 한계\n\n- KEV는 CISA JSON 피드로 직접 확인했다(10/8 이후 신규 없음).\n- 해외 침해·랜섬웨어·제로데이는 검색했으나 10/9~10 신규 건을 1차 출처로 확인하지 못했다. 검색 결과의 일부 CVE 번호(예: FortiMail, Cisco SD-WAN 항목)는 2차 목록 출처이며 1차 출처 대조 전이다.\n- 국내: 금융, 통신·이커머스, 공공·교육·의료, 랜섬웨어, 정부 발표 질의를 했으나 10/9~10 신규 대형 사건과 개인정보위·KISA의 새 조사 결과는 찾지 못했다. 쿠팡 질의는 2025-11 사건의 2026-02 조사 결과 기사만 나와 신규 정보가 없었다.\n- ATT&CK는 v19.2 기준이며 이 보고서에는 신규 매핑이 없다.\n\n## 출처\n\n- CISA KEV JSON 피드 (직접 확인)\n- YTN 2026-10-06, 2026-10-07 금융권 해킹 후속 보도\n- MITRE ATT&CK v19.2\n"},{"path":"일일/2026-10-11.md","title":"일일 보안 이슈 분석 — 2026-10-11","md":"# 일일 보안 이슈 분석 — 2026-10-11\n\n> 수집 기준: 2026-10-10 ~ 10-11 공개분. CISA KEV 목록은 JSON 피드로 직접 확인했다. 이미 [10-10 보고서](2026-10-10.md)·[10-06 국내 보충](2026-10-06-국내보충.md)에 있는 사건은 중복 작성하지 않았다.\n> 근거 표기: **[확인]** 벤더·정부기관·피해 기업이 직접 확인 / **보도** 언론 보도 / **[추정]** 본 보고서의 추정 / **[주장]** 공격자 일방 주장. **조치는 본 보고서의 권고**이며 벤더 공식 지침이 우선한다.\n> ATT&CK 기준: **v19.2**. 사건별 매핑은 [../ATTACK/README.md](../ATTACK/README.md) 참고.\n\n## 1. 오늘의 요약\n\n오늘도 모니터링한 공개 출처에서 보고 마감 시각까지 신규 주요 사건을 1차 출처로 확인하지 못했다(신규 사건을 못 찾은 것이 신규 사건이 없다는 근거는 아니다). 억지로 만들지 않고 확인된 사실만 기록한다.\n\n| # | 항목 | 상태 | 비고 |\n|---|------|------|------|\n| 1 | CISA 악용 확인 목록(KEV) | 10/11 조회 시점 기준 최신 등재일은 10/8이며 10/9 이후 신규 등재 없음 [확인](KEV만으로 전체 신규 사건 없음을 판단할 수는 없다) | 10/8 등재 5건은 [10-09 보고서](2026-10-09.md), 기한 10/11(오늘) |\n| 2 | 국내 금융권 연쇄 해킹 후속 | 10/7 이후 점검 결과 종합 발표는 찾지 못함(보도 기준) | 사건은 [10-06 국내 보충](2026-10-06-국내보충.md)의 `D20261006-finsector` |\n| 3 | Fortinet FortiMail 경로 조작 결함 | 이미 정리된 사건. 기존 악용 보고를 2차 출처에서 다시 읽었을 뿐 신규 악용 증거는 없고 제조사 원문은 이번에도 확인하지 못함 | 수정 버전·1차 공지는 벤더 공지를 직접 확인할 것 |\n| 4 | Microsoft 10월 정기 패치 | 10/13 예정, 아직 공개 전 | 공개되면 다음 보고서에서 다룬다 |\n\n## 2. 국내 후속 (사건 갱신, 새 사건 아님)\n\n- 금융당국은 10/4 신한·KB국민·하나·BNK부산은행, 예가람·웰컴저축은행, 현대캐피탈 등 7개사 침해에서 공통 IP가 복수 금융회사에서 발견됐다고 밝혔고(7개사 모두인지는 기사만으로 단정하지 않는다) 전 금융권 약 500개사에 공격 IP를 전파했다는 보도(SBS Biz). 같은 IP는 연관성의 단서일 뿐 같은 공격자라는 확정이 아니며, 당국도 IP만으로 국가를 특정할 수 없다고 밝혔다.\n- 소비자경보 '주의' 단계 발령과 한 달간의 2차 피해 특별 대응 기간 운영 보도(10/7 전후). 유출된 정보가 다른 정보와 결합하면 보이스피싱에 악용될 수 있다는 우려가 있다(보도).\n- 점검 결과 종합 발표(10/8 마감분 포함)는 찾지 못했다. 위 두 건을 `국내뉴스.psv`에 추가했다.\n\n**먼저 할 일(일반 이용자)**: 금융사를 사칭하는 전화·문자의 링크는 누르지 말고 공식 앱·대표번호로 직접 확인하세요. 같은 비밀번호를 쓰는 계정부터 바꾸고 추가 인증(OTP 등)을 켜세요(이미 유출된 정보가 회수되지는 않습니다). 이미 발급된 로그인 세션은 비밀번호 변경만으로 사라지지 않을 수 있으니 의심되면 모든 기기에서 로그아웃하세요.\n\n## 3. 우선 대응 체크리스트\n\n1. **레거시 5종(KEV 10/8 등재)**: 자산 대조, 패치·폐기, 인터넷 노출 차단. 기한 오늘(10/11).\n2. **FortiMail·Cisco Secure Email Gateway**: 관리 화면의 인터넷 노출 차단, 벤더 공지의 수정 버전(당시 기준이므로 최신 보안 버전 확인)과 침해 흔적 점검. 영향 버전 확인, 장비 격리, 로그·지속성·횡적 이동 점검을 하고, 의심 장비에서는 새 비밀을 발급하지 말고 증거를 보존한다. 깨끗한 환경에서 기존 자격증명·토큰을 폐기·교체하고, 재구축 시 신뢰할 수 있는 이미지를 쓰고 복구 후 다시 점검한다(조치 제안이며 실제 침해 확인을 뜻하지 않는다).\n3. Microsoft 10/13 패치 공개와 금융권 점검 결과 발표를 다음 보고서에서 확인한다.\n\n## 4. 검증 수준과 한계\n\n- KEV는 CISA JSON 피드를 직접 읽어 확인했다(피드가 매우 커 앞부분만 읽었고 최신순 정렬을 전제로 했다).\n- 해외 제로데이·랜섬웨어 검색에서 10/9~11 신규 건을 1차 출처로 확인하지 못했다. 랜섬웨어 추적 사이트의 항목은 공격자 주장이며 검증되지 않았다.\n- 국내: 금융, 쿠팡·통신·플랫폼, 공공·교육·의료·랜섬웨어, 정부 발표 질의를 했으나 신규 대형 사건과 개인정보위·KISA의 새 조사 결과는 찾지 못했다(쿠팡은 2026-06 과징금·2026-07 분쟁조정 등 기존 기사뿐). 랜섬웨어 질의는 오래된 기사 위주였다.\n- ATT&CK는 v19.2 기준이며 이 보고서에는 신규 매핑이 없다. 공식 사이트에서 현재 v19.2임을 확인했다.\n- GPT 검토는 1회 실시했고 범위 한정·표현 완화·조치 보완 지적을 반영했다.\n\n## 출처\n\n- CISA KEV JSON 피드 (직접 확인)\n- SBS Biz 2026-10-04, 뉴스토마토 금융권 2차 피해 보도, YTN 2026-10-07\n- 2차 출처: eSecurityPlanet·Wiz DB(FortiMail 악용 보도)\n- MITRE ATT&CK v19.2\n"},{"path":"일일/2026-10-12.md","title":"일일 보안 이슈 분석 — 2026-10-12","md":"# 일일 보안 이슈 분석 — 2026-10-12\n\n> 수집 기준: 2026-10-11 ~ 10-12 공개분. CISA KEV 목록은 JSON 피드로 직접 확인했다. 이미 [10-11 보고서](2026-10-11.md)·[10-06 국내 보충](2026-10-06-국내보충.md)에 있는 사건은 중복 작성하지 않았다.\n> 근거 표기: **[확인]** 벤더·정부기관·피해 기업이 직접 확인 / **보도** 언론 보도 / **[추정]** 본 보고서의 추정 / **[주장]** 공격자 일방 주장. **조치는 본 보고서의 권고**이며 벤더 공식 지침이 우선한다.\n> ATT&CK 기준: **v19.2**. 사건별 매핑은 [../ATTACK/README.md](../ATTACK/README.md) 참고.\n\n## 1. 오늘의 요약\n\n오늘도 보고 마감 시각까지 신규 주요 사건을 1차 출처로 확인하지 못했다(못 찾은 것이 없었다는 근거는 아니다). 억지로 만들지 않고 확인된 사실만 기록한다.\n\n| # | 항목 | 상태 | 비고 |\n|---|------|------|------|\n| 1 | CISA 악용 확인 목록(KEV) | 10/12 조회 시점 기준 최신 등재일은 10/8이며 이후 신규 등재 없음 [확인](피드 앞부분만 읽었고 최신순 정렬을 전제로 함) | 10/8 등재 5건은 [10-09 보고서](2026-10-09.md) |\n| 2 | 국내 금융권 연쇄 해킹 후속 | 점검 결과 종합 발표는 찾지 못함(보도 기준). 금융위는 외부 노출 시스템의 인증·접근통제 점검을, 금감원은 약 500개사에 공격 IP 전파와 12개 항목 점검을 지시했다는 보도 | 사건은 [10-06 국내 보충](2026-10-06-국내보충.md)의 `D20261006-finsector`, 국정감사(금감원 19일 예정)에서 추가 공개 가능 |\n| 3 | 한국정보보호교육센터 외주 서버 침입 | 9/29 보도(SBS Biz). 규모 미공개라 사건으로 쓰지 않고 `국내뉴스.psv`에만 추가 | 보도 기준, 기관 공식 발표는 확인하지 못함 |\n| 4 | Microsoft 10월 정기 패치 | 10/13 예정, 공개 전 | 다음 보고서에서 다룬다 |\n\n## 2. 국내 후속 (사건 갱신, 새 사건 아님)\n\n- 금융권 점검 결과 종합 발표는 아직 없다. 은행·카드사 점검 제출은 10/6, 그 밖의 업권은 10/8 마감으로 전해졌고 분석 중이라는 보도에 머문다.\n- 피해 수치는 보도마다 다르다(개인 약 6만6천 명과 법인 2,200건이라는 보도, 기관별 수치 등). 단위(사람·건)와 기관 간 중복 가능성이 있어 합산하지 않는다.\n- 소비자경보 '주의' 단계와 한 달간 2차 피해 특별 대응 기간이 이어진다. 실제 피해가 확인되면 '경고'로 올릴 계획이라는 보도.\n\n**먼저 할 일(일반 이용자)**: 금융사를 사칭하는 전화·문자의 링크는 누르지 말고 공식 앱·대표번호로 직접 확인하세요. 대출·자금 이체를 재촉하면 일단 끊으세요. 같은 비밀번호를 쓰는 계정부터 바꾸고 추가 인증을 켜되, 이미 유출된 정보는 회수되지 않으며 발급된 로그인 세션은 비밀번호 변경만으로 사라지지 않을 수 있어 의심되면 모든 기기에서 로그아웃하세요.\n\n## 3. 우선 대응 체크리스트\n\n1. 인터넷에 노출된 관리 화면·메일 보안 장비(FortiMail, Cisco Secure Email Gateway 등)의 노출 차단과 패치. 수정 버전은 당시 기준이므로 최신 보안 버전을 벤더 공지에서 확인한다. 침해가 의심되면 증거(로그·메모리·디스크)를 보존하고, 의심 장비에서 새 비밀을 발급하지 말며 깨끗한 환경에서 세션·토큰·키를 회수한다.\n2. 외주·위탁 업체의 서버 접근 통제와 수탁사 점검(위 3번 사례처럼 외주 서버가 뚫리면 위탁 기관 고객 정보가 노출될 수 있다는 구조적 위험 — 보도 기준).\n3. Microsoft 10/13 패치 공개와 금융권 점검 결과 발표를 다음 보고서에서 확인한다.\n\n## 4. 검증 수준과 한계\n\n- KEV는 CISA JSON 피드를 직접 읽었으나 피드가 매우 커 앞부분만 확인했다.\n- 해외 제로데이·랜섬웨어 검색에서 10/11~12 신규 건을 1차 출처로 확인하지 못했다. 검색 결과 일부는 날짜·CVE 표기가 불확실한 2차 요약이어서 사용하지 않았다.\n- 국내: 금융, 쿠팡·통신·플랫폼, 공공·교육·의료·랜섬웨어, 정부 발표 질의를 했으나 신규 대형 사건과 개인정보위·KISA의 새 조사 결과는 찾지 못했다(쿠팡은 2025-11 사건의 2026-02 조사 결과 기사뿐).\n- ATT&CK는 공식 사이트에서 v19.2(전술 15개)임을 확인했다. 신규 매핑은 없다.\n- GPT 검토는 신규 사건·매핑이 없는 단순 갱신이라 비민감 요약 1회만 실시했다(아래 최종 요약 참고).\n\n## 출처\n\n- CISA KEV JSON 피드 (직접 확인)\n- SBS Biz 2026-09-29 (한국정보보호교육센터), YTN 2026-10-07, MTN 2026-10-06 (금융권 점검)\n- MITRE ATT&CK v19.2\n"},{"path":"일일/2026-10-13.md","title":"일일 보안 이슈 분석 — 2026-10-13","md":"# 일일 보안 이슈 분석 — 2026-10-13\n\n> 수집 기준: 2026-10-13 공개분(Microsoft 10월 정기 패치 포함) + CISA KEV 10/13 신규 등재. CISA KEV는 JSON 피드를 직접 내려받아 `dateAdded` 필드로 걸러 확인했다. 이미 [10-12 보고서](2026-10-12.md)·[10-09 보고서](2026-10-09.md)·[10-06 국내 보충](2026-10-06-국내보충.md)에 있는 사건은 중복 작성하지 않았다.\n> 근거 표기: **[확인]** 벤더·정부기관·피해 기업이 직접 확인 / **보도** 언론 보도 / **[추정]** 본 보고서의 추정 / **[주장]** 공격자 일방 주장. **조치는 본 보고서의 권고**이며 벤더 공식 지침이 우선한다. 수정 버전 번호는 작성 당시 기준이므로 최신 보안 버전을 벤더 공지에서 확인한다.\n> ATT&CK 기준: 이 저장소는 **v19.2**로 매핑한다. **공식 사이트를 확인한 결과 2026-10-13 v20.0이 나왔다**(아래 4번 참고). 버전 갱신은 `_catalog.psv` 전체 재작업이 필요한 별도 작업이라 이번 보고서에는 반영하지 않았다.\n\n## 1. 오늘의 요약\n\n| # | 이슈 | CVE | 유형 | 상태 | 즉시 조치 |\n|---|------|-----|------|------|-----------|\n| 1 | Ivanti Connect Secure 인증 우회 제로데이 | CVE-2026-104935 | 노출 VPN 장비 취약점 | Ivanti·CISA 확인, KEV 등재(10/13, 기한 10/16) | 수정 버전 적용, 침해 흔적 점검 |\n| 2 | Microsoft 10월 정기 패치(Patch Tuesday) | CVE-2026-96951 외 다수 | 정기 패치 + 실악용 제로데이 1건 | 공개·패치 완료 [확인] | Windows Shell 결함 우선 패치 |\n| 3 | MITRE ATT&CK v20.0 공개 | — | 분류 체계 갱신 | [확인](공식 사이트) | 이 저장소의 버전 갱신은 별도 작업으로 보류 |\n| 4 | 국내 금융권 연쇄 해킹 국정감사 | — | 정책 후속 | 금융위 국감(10/8) 사과, 금감원 국감은 10/19 예정 | [10-06 국내 보충](2026-10-06-국내보충.md) 참고 |\n\n## 2. 이슈별 분석\n\n### [D20261013-ivanti] Ivanti Connect Secure 인증 우회 제로데이 — 루트 권한까지 체인 공격\n> 날짜: 2026-10-13 · 유형: 노출 VPN 장비 취약점 · 행위자: UTA0576(Volexity 명명, 보도) · 지역: 글로벌 · 근거: 확인\n\n**쉽게 말하면**: 회사 직원들이 외부에서 사내망에 접속할 때 쓰는 Ivanti VPN 장비에 로그인 절차를 건너뛸 수 있는 결함이 있고, 공격자들이 이미 10월 초부터 이를 실제로 쓰고 있었습니다. 더 나쁜 건 이 결함 하나만으로 끝나지 않고 아직 패치 안 된 또 다른 결함과 엮어서 장비의 최고 권한(루트)까지 올라갔다는 점입니다.\n\n**먼저 할 일(초보용)**: 담당자는 Ivanti Connect Secure를 쓰는지 확인하고 Ivanti 공지의 수정 버전(ICS 22.8R2.5, 25.1.3.0, 25.1.3.1, 25.1.1.2 등, 계열별로 다르므로 공지 확인)으로 즉시 올리세요. 이미 뚫렸을 가능성이 있으니 패치만으로 끝내지 말고 계정 비밀번호, LAPS 비밀번호, BitLocker 복구 키 등 장비가 알고 있던 비밀 값을 깨끗한 환경에서 다시 발급하세요. 장비에서 바로 새 비밀번호를 만들지 마세요.\n\n**개요**: CISA KEV 직접 확인: CVE-2026-104935, 'Ivanti Connect Secure 스푸핑에 의한 인증 우회 취약점', 2026-10-13 등재, 기한 10/16, 랜섬웨어 사용 '알 수 없음'. Ivanti는 같은 날 공지에서 CVSS 8.6으로 평가하고 \"제한적인 실악용을 인지하고 있다\"고 밝혔다(보도, 원문은 직접 열람하지 못함). 영향 버전은 ICS 22.8R2.4 이하, 25.1.2.2 이하, 25.1.1.1 이하. 보안업체 Volexity는 자사가 UTA0576으로 명명한 공격자가 이 인증 우회에 원격코드실행·별도의 권한상승 결함을 체인으로 엮어 완전히 패치된 장비에서도 루트 권한을 얻었다고 보도됐다. 권한상승 결함은 이번 보도 시점 기준 아직 패치되지 않았다고 전해진다. watchTowr는 조작된 'X-DSCGI-PATH' 헤더 하나로 인증을 우회할 수 있다고 분석했다(보도). 공격 시작 시점은 보도마다 달라 Volexity는 10월 초(일부 보도는 10/1, 다른 보도는 10/3)부터로 추정한다.\n\n**왜 일어났나**\n- 직접 원인 [확인: Ivanti·CISA]: 인증 절차를 스푸핑으로 우회하는 결함(CVE-2026-104935). 상세 코드 경로는 공개되지 않았다.\n- 구조적 원인 [추정]: VPN 장비가 인터넷에 직접 노출되고, 하나의 결함이 다른 미패치 결함과 체인되면 완전 패치된 장비도 뚫릴 수 있는 구조적 위험(분석이며 확인된 사실 아님).\n\n**침투 경로 [보도 범위]**: 조작된 요청으로 인증 우회(CVE-2026-104935) → 별도 RCE·권한상승 결함 체인 → 루트 권한 획득 → 자격 증명·AD 데이터·LAPS 비밀번호·BitLocker 복구 키 수집(보도, Volexity). 이후 횡적 이동·유출 여부는 공개되지 않았다.\n\n**어떻게 조치하나**\n- 즉시: 증거(장비 로그·설정)를 보존하고 수정 버전으로 올린다. 패치를 미루지 않는다.\n- 단기: 이미 침해됐을 가능성을 전제로 장비에 저장·연동된 자격증명(LAPS 비밀번호, BitLocker 복구 키, 연동 계정)을 깨끗한 환경에서 교체한다. AD 쪽에서 비정상 로그인·권한 변경을 점검한다.\n- 장기: 권한상승 결함의 Ivanti 패치가 나오면 즉시 적용. VPN 장비 관리면 노출 축소, 다중 인증 강화.\n- 탐지: 장비의 비정상 인증 요청(조작된 헤더 등), 이후 AD·LAPS·BitLocker 관련 조회 행위.\n\n**교훈**: 패치 하나로 안전해지지 않는다. 공격자는 패치된 결함과 미패치 결함을 엮어서 들어온다.\n\n## 3. Microsoft 10월 정기 패치(Patch Tuesday) — 실악용 제로데이 1건 포함\n\n> 10/12 보고서에서 \"10/13 예정, 공개 전\"으로 남겨 둔 건의 후속.\n\n**쉽게 말하면**: 매달 둘째 화요일에 나오는 마이크로소프트 보안 패치가 이번 달엔 역대 최대 규모로 나왔습니다. 그중 하나는 이미 실제 공격에 쓰이고 있었습니다.\n\n**개요**: BleepingComputer·SecurityWeek 등 보도에 따르면(원문은 직접 열람하지 못함) 이번 달 패치는 역대 최대 규모이며 매체별로 1,407~1,415건으로 숫자가 엇갈린다(합산 기준이 달라 생기는 차이로 보이며 단정하지 않는다). 제로데이 3건:\n- **CVE-2026-96951** (Windows Shell, CVSS 8.8): Mark of the Web(인터넷에서 받은 파일임을 표시해 경고를 띄우는 보호 기능) 우회. Microsoft가 실제 악용을 확인했고 CISA가 같은 날(10/13) KEV에 등재했다(기한 10/16). 메일·메신저·협업 도구로 조작된 파일을 전달해 열게 하는 방식으로 알려졌다(보도, 사용자 상호작용 필요).\n- **CVE-2026-108398** (.NET Framework 보안 기능 우회): Google Project Zero의 James Forshaw가 발견, 공개는 됐지만 실악용 보고는 없다(보도).\n- **CVE-2026-92707** (MessagePack-CSharp 서비스 거부): 공개됐지만 실악용 보고는 없다(보도).\n\n그 외 눈에 띄는 항목(모두 보도 기준, CISA KEV 등재는 아님): CVE-2026-70229(Active Directory Domain Services RCE), CVE-2026-77900(Azure App Service RCE), CVE-2026-96222·CVE-2026-108131(AD FS 스푸핑). 이번 달로 Windows 11 24H2 Home/Pro, Windows 10 Enterprise LTSB 2016의 보안 업데이트가 종료됐다(보도).\n\n**먼저 할 일(초보용)**: Windows를 쓰는 조직은 이번 달 패치, 특히 Windows Shell 결함(CVE-2026-96951)부터 적용하세요. 아직 Windows 10 LTSB 2016이나 Windows 11 24H2 Home/Pro를 쓴다면 지원 종료 여부를 확인하고 전환 계획을 세우세요.\n\n## 4. MITRE ATT&CK v20.0 공개 (2026-10-13)\n\n공식 사이트(attack.mitre.org) 확인 결과 **ATT&CK Enterprise v20.0이 2026-10-13 공개**됐다. 새 전술 신설은 없고, 주요 변화는: AI 관련 신규 기법 9개(AI-Enabled Exfiltration, Direct/Indirect Prompt Injection, Anti-Automation Evasion, Impair Autonomous Defenses, AI Result Poisoning, Steal Application Specific Passwords 등), ICS 쪽 신규 기법(Command and Scripting Interpreter 하위기법 등), 신규 캠페인(2026년 미국 상수도 시설 공격·멕시코 정부 인프라 AI 지원 침해) 추가. 이 저장소(`ATTACK/_catalog.psv`)는 아직 v19.2 기준이며, v20 반영(신규 기법 목록 갱신·기존 매핑 재검토)은 규모가 커서 이번 일일 보고서 범위를 벗어난다. 별도 작업으로 남겨 둔다.\n\n## 5. 국내 후속 (사건 갱신, 새 사건 아님)\n\n- 10/8 국회 정무위원회 금융위원회 국정감사에서 이억원 금융위원장이 연쇄 해킹 사태에 \"금융당국 수장으로서 송구하다\"는 취지로 사과했다는 보도. 5대 은행장은 10/19 금융감독원 국정감사에 증인으로 출석할 예정이라는 보도(다음 보고서 범위 밖이므로 결과는 추후 확인).\n- 그 외 금융권 점검 결과 종합 발표는 10/13 기준으로도 찾지 못했다.\n\n## 6. 우선 대응 체크리스트\n\n1. **Ivanti Connect Secure(KEV 10/13 등재, 기한 10/16)**: 수정 버전 적용, 장비·AD의 자격증명·LAPS·BitLocker 키 교체, 침해 흔적 점검.\n2. **Microsoft 10월 패치**: Windows Shell CVE-2026-96951 우선 적용.\n3. ATT&CK v20 반영 여부는 별도 과제로 추적한다.\n4. 금감원 국정감사(10/19) 결과는 해당 날짜 보고서에서 확인한다(이 보고서의 수집 범위 밖).\n\n## 7. 검증 수준과 한계\n\n- KEV 10/13 등재 2건(Ivanti, Windows Shell)은 CISA JSON 피드를 직접 받아 `dateAdded` 필드로 확인했다.\n- Ivanti의 CVSS 점수·영향 버전·Volexity의 UTA0576 분석은 모두 2차 보도 기준이며 Ivanti·Volexity 원문은 직접 열람하지 못했다. 공격 시작 시점(10/1 vs 10/3)은 보도마다 다르다.\n- Microsoft 10월 패치 총 건수는 매체별로 1,407~1,415건으로 엇갈려 하나로 확정하지 않았다. Microsoft 공식 보안 업데이트 가이드 원문은 직접 열람하지 못했다.\n- ATT&CK v20.0 공개는 공식 사이트(attack.mitre.org/resources/updates/)에서 직접 확인했다.\n- 국내: 금융·통신·이커머스·공공·교육·의료 질의를 했으나 10/13 당일 신규 대형 사건은 찾지 못했다. 국정감사 관련 사과·증인 채택 보도는 모두 10/8 발생분이 10/13 전후에도 재인용되는 수준이었다.\n- GPT(Codex) 검토는 이 보고서 중 사실관계가 가장 많은 Ivanti 항목을 포함해 실시했다(출처 미표기 주장, 내부 불일치 여부 점검).\n- **중복 작성 안내**: 이 보고서 작성 시점에 [10-17 보고서](2026-10-17.md)가 이미 존재하며, 10-12 이후 공백을 자체적으로 메운다는 전제로 Ivanti·Microsoft 패치 건을 다시 다루고 있다(해당 보고서는 10-13~16 구간에 일일 보고서가 없다고 전제하고 작성됨). 두 보고서의 날짜(KEV `dateAdded` 기준 10/13)와 내용이 겹치므로, 정리자는 추후 한쪽으로 통합하거나 상호 참조로 바꾸는 것을 검토해야 한다.\n\n## 출처\n\n- CISA KEV JSON 피드 (직접 확인)\n- Ivanti Connect Secure CVE-2026-104935: Rapid7, SOCPrime, BleepingComputer, The Hacker News, Cybersecurity Dive (검색 결과 기준, 원문 미열람)\n- Microsoft 10월 Patch Tuesday: BleepingComputer, IT-Connect, TechSpot, SecurityWeek, Help Net Security, Security Affairs (검색 결과 기준, 원문 미열람)\n- MITRE ATT&CK 공식 사이트 (attack.mitre.org/resources/updates/, 직접 확인)\n- 금융위 국정감사: MTN, 데일리안, SBS Biz (보도)\n"},{"path":"일일/2026-10-14.md","title":"일일 보안 이슈 분석 — 2026-10-14","md":"# 일일 보안 이슈 분석 — 2026-10-14\n\n> 수집 기준: 2026-10-14 공개분 + CISA KEV 10/14 신규 등재. CISA KEV는 JSON 피드를 직접 내려받아 `dateAdded` 필드로 걸러 확인했다. 이미 [10-13 보고서](2026-10-13.md)·[10-09 보고서](2026-10-09.md)에 있는 사건은 중복 작성하지 않았다.\n> 근거 표기: **[확인]** 벤더·정부기관·피해 기업이 직접 확인 / **보도** 언론 보도 / **[추정]** 본 보고서의 추정 / **[주장]** 공격자 일방 주장. **조치는 본 보고서의 권고**이며 벤더 공식 지침이 우선한다. 수정 버전 번호는 작성 당시 기준이므로 최신 보안 버전을 벤더 공지에서 확인한다.\n> ATT&CK 기준: **v19.2**(저장소 기준). 공식 사이트는 2026-10-13 v20.0으로 갱신됐다([10-13 보고서](2026-10-13.md) 4번 참고, 반영은 별도 작업).\n\n## 1. 오늘의 요약\n\n| # | 이슈 | CVE | 유형 | 상태 | 즉시 조치 |\n|---|------|-----|------|------|-----------|\n| 1 | Ahsay AhsayCBS 백업 콘솔 인증 우회 + 명령 삽입 체인 | CVE-2026-105133, CVE-2026-105134 | 노출 백업 서버 취약점 | KEV 등재(10/14, 기한 10/17) [확인], 웹셸·채굴기 설치는 보도 기준 | 핫픽스 적용, 웹셸·채굴기 수색 |\n| 2 | Palo Alto Networks PAN-OS 관리 인터페이스 코드 삽입 | CVE-2026-0322 | 노출 방화벽 관리 인터페이스 취약점(인증된 공격자 전제) | Palo Alto·CISA 확인, KEV 등재(10/14, 기한 10/17) | 패치, 관리 인터페이스 노출 차단, 고권한 계정 보호 |\n| 3 | Cisco Secure Email Gateway 경로 조작(신규 CVE) | CVE-2026-76519 | 노출 메일 장비 취약점(기존 사건의 후속) | Cisco 확인: 실제 악용, CISA KEV 등재(10/14, 기한 10/17) | 패치, [10-09 사건](2026-10-09.md)과 함께 점검 |\n\n## 2. 이슈별 분석\n\n### [D20261014-ahsaycbs] Ahsay AhsayCBS — 인증 우회 + 명령 삽입으로 웹셸·채굴기 설치\n> 날짜: 2026-10-07 · 유형: 노출 백업 서버 취약점 · 행위자: 미상 · 지역: 글로벌 · 근거: 확인\n\n**쉽게 말하면**: 회사 데이터를 백업해 주는 Ahsay 백업 서버(AhsayCBS) 소프트웨어에 두 가지 결함이 있었고, 이를 엮으면 로그인 없이 서버 최고 권한(SYSTEM)으로 명령을 실행할 수 있습니다. 공격자들은 이걸로 몰래 접속할 뒷문(웹셸)을 심고, 서버 자원을 훔쳐 가상자산을 채굴하는 프로그램까지 설치했습니다.\n\n**먼저 할 일(초보용)**: Ahsay AhsayCBS를 쓴다면 버전에 맞는 핫픽스(v10 계열은 10.3.4.45, v7~v9 계열은 9.15.2.70, 보도 기준이며 Ahsay 발표 인용)를 파트너 포털에서 받아 적용하세요. 이전 패치(v10.3.4.0·v9.15.2.59)는 결함을 완전히 막지 못했다고 Ahsay가 직접 확인했다는 보도가 있습니다. 패치만으로는 이미 심어진 웹셸이 없어지지 않으니, 서버에서 낯선 JSP 파일이나 'MicrosoftEdgeUpdateSvc'라는 이름의 수상한 서비스가 있는지 반드시 확인하고 지우세요.\n\n**개요**: CISA KEV 직접 확인: CVE-2026-105133('AhsayCBS 부적절한 인증 취약점'), CVE-2026-105134('AhsayCBS 명령 삽입 취약점'), 둘 다 2026-10-14 등재, 기한 10/17, 랜섬웨어 사용 '알 수 없음'. 보안업체 Huntress·Bitdefender 보도(원문 미열람)에 따르면 공격자는 `checkSysPwd` 함수의 인증 우회(CVE-2026-105133)로 들어가 복제(Replication) 수신 기능의 OS 명령 삽입(CVE-2026-105134)으로 SYSTEM 권한 코드 실행에 이른다. 최초 악용은 2026-10-07 23:20(UTC)로 관측됐고 최소 5개 기관이 영향을 받았다고 보도됐다. 공격자는 JSP 웹셸과 Microsoft Edge로 위장한 XMRig 채굴 프로그램을 심었고, 'MicrosoftEdgeUpdateSvc'라는 가짜 윈도우 서비스로 지속성을 확보했다(보도). CVSS 점수는 출처마다 다르다(VulDB 기준 CVE-2026-105134를 10.0으로 본 보도와 CVSS 4.0 기준 9.3으로 본 보도가 섞여 있어 단정하지 않는다).\n\n**왜 일어났나**\n- 직접 원인 [보도 기준]: 인증 검증 함수의 결함과 복제 기능의 명령 삽입 결함이 체인됐다.\n- 구조적 원인 [추정]: 백업 서버가 관리용 포트를 인터넷에 노출하고 있었을 가능성(분석이며 확인된 사실 아님). 이전 패치(v10.3.4.0, v9.15.2.59)가 결함을 완전히 막지 못했다는 점은 Ahsay 스스로 확인했다고 보도됐으며(esecurityplanet 등), 패치 검증 과정의 한계를 시사한다.\n\n**침투 경로 [보도 범위]**: 인증 우회(CVE-2026-105133) → 복제 수신 기능 명령 삽입(CVE-2026-105134) → SYSTEM 권한 코드 실행 → JSP 웹셸 설치 → XMRig 채굴기 설치·가짜 서비스로 지속성 확보. 유출 여부는 공개되지 않았다.\n\n**어떻게 조치하나**\n- 즉시: 핫픽스(벤더 공지 확인)를 적용하고, 서버에서 낯선 JSP 파일·'MicrosoftEdgeUpdateSvc' 서비스·비정상 CPU 사용(채굴기 특징)을 점검한다.\n- 단기: 웹셸이 발견되면 패치만으로 제거되지 않으므로 서버를 재구축하거나 포렌식 전문가의 점검을 받는다. 백업 서버에 저장된 자격증명·암호화 키를 깨끗한 환경에서 교체한다.\n- 장기: 백업 서버 관리 포트의 인터넷 노출을 차단하고 접근을 VPN·허용 IP로 제한한다.\n- 탐지: 비정상 프로세스명(Edge 위장), 서비스 목록의 낯선 항목, 과도한 CPU 사용.\n\n**교훈**: 백업 서버는 평소 눈에 잘 안 띄지만 뚫리면 SYSTEM 권한을 내주는 만큼 패치 우선순위에서 밀리면 안 된다.\n\n### [D20261014-panos] Palo Alto Networks PAN-OS 관리 인터페이스 — 루트 권한 코드 삽입\n> 날짜: 2026-10-14 · 유형: 노출 방화벽 관리 인터페이스 취약점 · 행위자: 미상 · 지역: 글로벌 · 근거: 확인\n\n**쉽게 말하면**: 회사 네트워크를 지키는 Palo Alto 방화벽의 관리 화면에 결함이 있어서, 이미 로그인 권한(인증)을 가진 채 그 화면에 접근할 수 있는 공격자가 방화벽의 최고 권한(루트)으로 명령을 실행할 수 있습니다. 벤더 공식 공지는 \"인증된 공격자\"를 전제로 명시하므로, 비밀번호 없이 바로 뚫리는 결함은 아닙니다. 그래도 벤더는 \"매우 제한적인 악용\"이 있었다고 밝혔습니다.\n\n**먼저 할 일(초보용)**: PAN-OS를 쓴다면 관리 인터페이스(장비 설정 화면)를 인터넷에서 바로 접근하지 못하게 막고, Palo Alto가 공개한 수정 버전(예: PAN-OS 12.2는 12.2.4 이상, 계열별로 다르니 공지 확인)으로 올리세요. 공개된 공격자 IP 3개(66.42.72.14, 208.83.239.114, 149.248.47.234)가 접속한 적이 있는지 로그에서 확인하세요.\n\n**개요**: Palo Alto Networks는 2026-10-14 공지에서 CVE-2026-0322(CWE-94, 코드 삽입)를 CVSS 8.6으로 평가했고 \"관리 인터페이스를 노린 매우 제한적인 악용을 관측했다\"고 밝혔다(보도, 원문 미열람). CISA가 같은 날 KEV에 등재했고(기한 10/17), BOD 26-04에 따른 포렌식 트리아지 대상으로 표시됐다(보도). 영향 제품은 PA-Series·VM-Series 방화벽, Panorama 가상·M-Series 어플라이언스이며 Cloud NGFW·Prisma Access는 영향 없음. **접근 조건은 Palo Alto 공식 공지(security.paloaltonetworks.com/CVE-2026-0322, 직접 확인)에 \"인증된 공격자가 관리 인터페이스에 네트워크로 접근할 수 있어야 한다\"고 명시돼 있다(CVSS Privileges Required: HIGH, Attack Vector: NETWORK)**. 일부 2차 보도는 이 전제 조건을 생략하고 전달해 혼선이 있었으나, 벤더 원문을 우선한다. Palo Alto는 공격에 연관된 IP 3개(66.42.72.14, 208.83.239.114, 149.248.47.234)를 공개했다(보도).\n\n**왜 일어났나**\n- 직접 원인 [확인: Palo Alto 공지 인용 보도]: 관리 인터페이스 코드에서 입력값이 제대로 검증되지 않아 루트 권한 코드 실행으로 이어짐(CWE-94).\n- 구조적 원인 [추정]: 관리 인터페이스가 인터넷에 노출된 구성이 위험을 키운다는 분석(Palo Alto도 관리 접근을 신뢰 IP로 제한할 것을 권고했다는 보도). 확인된 사실이 아니라 분석이다.\n\n**침투 경로 [확인: 벤더 공지 + 보도]**: 이미 확보한 인증 자격 증명으로 관리 인터페이스에 네트워크 접근 → 코드 삽입 → 루트 권한 코드 실행. 자격 증명을 어떻게 확보했는지는 공개되지 않았다.\n\n**어떻게 조치하나**\n- 즉시: 관리 인터페이스의 인터넷 노출을 차단하고 수정 버전으로 패치한다. 공개된 공격자 IP 3개와 로그를 대조한다.\n- 단기: 관리 인터페이스 접근을 신뢰된 내부 IP로 제한(Palo Alto의 일반 권고). 침해가 의심되면 장비를 격리하고 증거를 보존한다.\n- 장기: 관리면 분리, 접근 제어 목록 상시 점검.\n- 탐지: 관리 인터페이스 접근 로그의 비정상 요청, 공개된 공격자 IP와의 통신.\n\n**교훈**: 방화벽의 '관리용' 화면도 결국 하나의 서비스다. 관리 인터페이스를 인터넷에 열어 두면 방화벽 자체가 공격 표면이 된다.\n\n### Cisco Secure Email Gateway CVE-2026-76519 — 경로 조작으로 루트 명령 실행 ([10-09 사건](2026-10-09.md) 후속, 간단 기록)\n\n[10-09 보고서](2026-10-09.md)에서 다룬 Cisco Secure Email Gateway의 SQL 인젝션(CVE-2026-76461)과 같은 계열 장비에서 또 다른 결함이 CISA KEV에 등재됐다. CVE-2026-76519는 AMP(Advanced Malware Protection) 기능에서 File Reputation이 켜진 상태로 조작된 첨부파일이 든 메일을 처리할 때 발생하는 상대 경로 조작(path traversal, CWE-23) 결함으로, 인증이나 사용자 상호작용 없이 임의 파일 쓰기·루트 권한 명령 실행으로 이어질 수 있다고 알려졌다(보도, Cisco 원문 미열람). CISA KEV 직접 확인: 2026-10-14 등재, 기한 10/17. **Cisco의 이 CVE 전용 공지(sec.cloudapps.cisco.com, 직접 확인)는 \"Exploitation and Public Announcements\" 항목에서 \"2026년 10월 Cisco PSIRT는 이 취약점의 실제 악용을 인지했다\"고 CVE-2026-76519를 특정해 명시한다** — 10-09 보고서의 CVE-2026-76461과는 별도로 이 CVE 자체가 실악용 확인 대상이다. 이미 패치가 늦은 조직은 10-09·10-14 두 결함을 함께 점검해야 한다. 조치는 [10-09 보고서](2026-10-09.md)의 권고(수정 버전 적용, 침해된 장비는 재구축, 자격증명 교체)와 동일하다.\n\n## 3. 검증 수준과 한계\n\n- KEV 10/14 등재 4건(Ahsay 2건, Cisco SEG 1건, PAN-OS 1건)은 CISA JSON 피드를 직접 받아 `dateAdded` 필드로 확인했다.\n- Ahsay 사건의 공격 시점·피해 기관 수·웹셸·채굴기 설치 세부는 2차 보도(Huntress·Bitdefender·SecurityWeek·The Hacker News 등) 기준이며 Ahsay 원문 공지는 직접 열람하지 못했다(이전 패치 미완성 사실은 Ahsay가 확인했다는 보도가 있으나, 보도를 통한 간접 확인이다). CVSS 점수는 출처마다 다르다.\n- PAN-OS·Cisco SEG 두 건은 Codex를 통한 자동 검토 과정에서 벤더 공식 공지(security.paloaltonetworks.com/CVE-2026-0322, sec.cloudapps.cisco.com의 CVE-2026-76519 전용 공지)를 직접 확인해 **최초 초안의 \"조건 불명확\"·\"어느 CVE가 실악용인지 불명확\" 서술을 벤더 원문 기준으로 수정했다**. PAN-OS는 인증된 고권한 공격자가 전제이며, Cisco SEG(CVE-2026-76519)는 Cisco가 CVE를 특정해 실악용을 확인했다.\n- 국내: 금융·통신·이커머스·공공·교육·의료 질의를 했으나 10/14 당일 신규 대형 사건은 찾지 못했다.\n- ATT&CK는 저장소 기준 v19.2이며 v20.0 반영은 [10-13 보고서](2026-10-13.md)에서 다룬 대로 보류 상태다.\n- GPT(Codex) 검토는 Ahsay·PAN-OS 항목을 포함해 실시했다(출처 미표기 주장, 내부 불일치 여부 점검).\n- **중복 작성 안내**: [10-17 보고서](2026-10-17.md)가 10-12~10-16 공백을 자체적으로 메운다는 전제로 이 보고서의 Ahsay·Cisco SEG·PAN-OS 건을 다시 다루고 있다(그 전제는 이 보고서 작성으로 더 이상 맞지 않는다). 정리자는 추후 한쪽으로 통합하거나 상호 참조로 바꾸는 것을 검토해야 한다.\n\n## 4. 우선 대응 체크리스트\n\n1. **AhsayCBS**: 핫픽스 적용 + 웹셸·채굴기·가짜 서비스 수색(패치만으로 제거되지 않음).\n2. **PAN-OS 관리 인터페이스**: 인터넷 노출 차단, 패치, 공개된 공격자 IP 3개와 로그 대조.\n3. **Cisco SEG**: CVE-2026-76461([10-09](2026-10-09.md))·CVE-2026-76519 두 건을 함께 패치·점검.\n\n## 출처\n\n- CISA KEV JSON 피드 (직접 확인)\n- AhsayCBS: Bitdefender, SecurityWeek, The Hacker News, BleepingComputer, Huntress, eSecurityPlanet, Rescana, FieldEffect (검색 결과 기준, 원문 미열람)\n- PAN-OS CVE-2026-0322: Palo Alto Networks 공식 공지(security.paloaltonetworks.com/CVE-2026-0322, 직접 확인), BleepingComputer, SOCPrime, CSO Online, CSA Singapore, The Hacker News, SecurityWeek\n- Cisco Secure Email Gateway CVE-2026-76519: Cisco 공식 보안 공지(sec.cloudapps.cisco.com, 직접 확인), BetaNews 등 2차 보도\n- Ahsay AhsayCBS 이전 패치 실패·v9.15.2.70 핫픽스: eSecurityPlanet (벤더 발표 인용 보도)\n"},{"path":"일일/2026-10-15.md","title":"일일 보안 이슈 분석 — 2026-10-15","md":"# 일일 보안 이슈 분석 — 2026-10-15\n\n> 수집 기준: 2026-10-15 공개분 + CISA KEV 10/15 신규 등재. CISA KEV는 JSON 피드를 직접 내려받아 `dateAdded` 필드로 걸러 확인했다. 이미 [10-14 보고서](2026-10-14.md)·[10-08 보고서](2026-10-08.md)에 있는 사건은 중복 작성하지 않았다.\n> 근거 표기: **[확인]** 벤더·정부기관·피해 기업이 직접 확인 / **보도** 언론 보도 / **[추정]** 본 보고서의 추정 / **[주장]** 공격자 일방 주장. **조치는 본 보고서의 권고**이며 벤더 공식 지침이 우선한다.\n> ATT&CK 기준: **v19.2**(저장소 기준). 공식 사이트는 2026-10-13 v20.0으로 갱신됐다([10-13 보고서](2026-10-13.md) 4번 참고, 반영은 별도 작업). 오늘은 신규 매핑이 없다.\n\n## 1. 오늘의 요약\n\n오늘은 완전히 새로운 침해 사건을 1차 출처로 확인하지 못했다(못 찾은 것이 없었다는 근거는 아니다). 유일하게 확인한 변화는 기존에 이미 정리해 둔 사건의 KEV 공식 등재다.\n\n| # | 항목 | 상태 | 비고 |\n|---|------|------|------|\n| 1 | Atlassian 제품군 인증 없는 파일 접근(CVE-2026-21589) | CISA KEV 공식 등재(10/15, 기한 10/18) [확인] | 사건 본문은 [10-08 보고서](2026-10-08.md)의 `D20261008-atlassian`, 중복 작성하지 않음 |\n| 2 | 국내 금융권 연쇄 해킹 후속 | 10/15 기준 신규 종합 발표 없음(보도 기준) | [10-06 국내 보충](2026-10-06-국내보충.md) 참고, 금감원 국감 10/19 예정 |\n| 3 | 해외 신규 제로데이·랜섬웨어 | 1차 출처로 확인된 신규 건 없음 | 아래 4번 참고 |\n\n## 2. Atlassian CVE-2026-21589 — CISA KEV 공식 등재 (후속, 새 사건 아님)\n\n[10-08 보고서](2026-10-08.md)에서 \"공개 시연 코드 공개 2시간 만에 악용 관측(보도), CISA KEV 등재는 아직 없다\"고 적었던 그 결함이다. CISA KEV 직접 확인: CVE-2026-21589('Atlassian 제품군 외부에 노출된 파일·디렉터리 취약점'), 2026-10-15 등재, 기한 10/18, 랜섬웨어 사용 '알 수 없음'. 검색된 2차 보도(CVSS 9.3으로 소개)에 따르면 악용은 10/7 전후부터 이어졌고 CrowdSec은 10/7 이후 89개의 서로 다른 IP에서 일치하는 요청을 추적했다고 보도됐다. 영향 제품(Bitbucket·Confluence·Jira Software·Jira Service Management·Bamboo·Crowd Data Center 등 자체 설치형)과 조치 권고는 [10-08 보고서](2026-10-08.md)와 동일하다. 수정 버전을 아직 적용하지 않은 조직은 KEV 공식 등재를 계기로 우선순위를 올려야 한다.\n\n## 3. 국내 후속 (사건 갱신, 새 사건 아님)\n\n- 금융권 점검 결과 종합 발표는 10/15 기준으로도 찾지 못했다. 5대 은행장이 증인으로 서는 금감원 국정감사는 10/19로 예정돼 있다는 보도([10-13 보고서](2026-10-13.md) 참고, 결과는 해당 날짜 보고서에서 확인할 사항이며 이 보고서의 수집 범위 밖이다).\n\n## 4. 검증 수준과 한계\n\n- KEV 10/15 등재(Atlassian 1건)는 CISA JSON 피드를 직접 받아 `dateAdded` 필드로 확인했다.\n- 해외 신규 제로데이·랜섬웨어 질의(여러 매체·날짜 조합)에서 10/15 당일 신규 1차 출처 사건을 확인하지 못했다. 랜섬웨어 추적 사이트의 항목은 공격자 주장이며 검증되지 않아 사용하지 않았다.\n- 국내: 금융·통신·이커머스·공공·교육·의료 질의를 했으나 10/15 당일 신규 대형 사건과 개인정보위·KISA의 새 조사 결과는 찾지 못했다.\n- ATT&CK는 저장소 기준 v19.2이며 신규 매핑이 없어 `매핑.psv`를 갱신하지 않았다.\n- 오늘은 신규 사건·매핑이 없는 단순 후속 갱신이라 GPT(Codex) 검토는 비민감 요약 1회만 실시했다.\n- **중복 작성 안내**: [10-17 보고서](2026-10-17.md)가 이 Atlassian 건을 다시 전체 분석으로 다루고 있다(10-12~10-16 공백을 자체적으로 메운다는 전제로 작성됐으나, 이 보고서로 그 전제는 더 이상 맞지 않는다). 정리자는 추후 통합을 검토해야 한다.\n\n## 출처\n\n- CISA KEV JSON 피드 (직접 확인)\n- Atlassian CVE-2026-21589: CrowdSec, Security Affairs, SecurityWeek, Senserva (검색 결과 기준, 원문 미열람)\n"},{"path":"일일/2026-10-16.md","title":"일일 보안 이슈 분석 — 2026-10-16","md":"# 일일 보안 이슈 분석 — 2026-10-16\n\n> 수집 기준: 2026-10-16 공개분 + CISA KEV 10/16 신규 등재. CISA KEV는 JSON 피드를 직접 내려받아 `dateAdded` 필드로 걸러 확인했다. 이미 [10-15 보고서](2026-10-15.md)·[10-13 보고서](2026-10-13.md)에 있는 사건은 중복 작성하지 않았다.\n> 근거 표기: **[확인]** 벤더·정부기관·피해 기업이 직접 확인 / **보도** 언론 보도 / **[추정]** 본 보고서의 추정 / **[주장]** 공격자 일방 주장. **조치는 본 보고서의 권고**이며 벤더 공식 지침이 우선한다. 수정 버전 번호는 작성 당시 기준이므로 최신 보안 버전을 벤더 공지에서 확인한다.\n> ATT&CK 기준: **v19.2**(저장소 기준). 공식 사이트는 2026-10-13 v20.0으로 갱신됐다([10-13 보고서](2026-10-13.md) 4번 참고, 반영은 별도 작업).\n\n## 1. 오늘의 요약\n\n| # | 이슈 | CVE | 유형 | 상태 | 즉시 조치 |\n|---|------|-----|------|------|-----------|\n| 1 | BeyondTrust Remote Support 인증 우회 제로데이 | CVE-2026-102764 | 노출 원격지원 장비 취약점 | KEV 등재(10/16, 기한 10/19), 8월부터 추정 국가 배후 공격자가 실악용 | 패치(SaaS 완료, 자체 호스팅은 수동 적용), 침해 흔적 점검 |\n| 2 | Fortinet FortiOS 외 다수 제품 경로 조작 | CVE-2025-61624 | 관리자 권한 필요한 결함 | KEV 등재(10/16, 기한 10/19) | 패치, 관리자 계정 보호 강화 |\n| 3 | 국내 금융권 연쇄 해킹 후속 | — | 10/19 금감원 국정감사 예정(다음 수집 범위) | [10-13 보고서](2026-10-13.md) 참고 | — |\n\n## 2. 이슈별 분석\n\n### [D20261016-beyondtrust] BeyondTrust Remote Support 인증 우회 — 8월부터 국가 배후 추정 공격자가 악용\n> 날짜: 2026-10-16 · 유형: 노출 원격지원 장비 취약점 · 행위자: ARMORY CASTLE(Mandiant 명명, 중국 연계 추정, 보도) · 지역: 글로벌 · 근거: 확인\n\n**쉽게 말하면**: 고객센터·IT 지원팀이 원격으로 컴퓨터를 조작할 때 쓰는 BeyondTrust 원격지원 장비에 로그인 없이도 뚫을 수 있는 결함이 있었습니다. 중국과 연계됐을 것으로 보이는 공격자 그룹이 이미 8월부터 몰래 이 결함을 써 왔다는 것이 10월 중순에 드러났습니다.\n\n**먼저 할 일(초보용)**: BeyondTrust Remote Support·Privileged Remote Access를 쓴다면, SaaS(클라우드) 버전은 10/8에 이미 패치됐으니 최신 상태인지 확인하고, 자체 서버에 설치한(온프레미스) 버전은 자동 업데이트가 꺼져 있다면 수동으로 패치하세요. 8월부터 뚫려 있었을 가능성이 있으니 패치 후에도 침해 지표(IOC)를 점검하세요.\n\n**개요**: CISA KEV 직접 확인: CVE-2026-102764, 'BeyondTrust Remote Support 스푸핑에 의한 인증 우회 취약점', 2026-10-16 등재, 기한 10/19, 랜섬웨어 사용 '알 수 없음'. 캐나다 사이버센터(AL26-025)·보도에 따르면 이 결함(CWE-290)은 BeyondTrust Remote Support 전 버전(RS 26.2.3 이하)에 영향을 주며 자격 증명이나 사용자 동작 없이도 임의 파일 업로드로 이어져 장비 전체가 장악될 수 있다(CVSSv4 9.3로 보도). Mandiant는 중국 연계로 추정되는 그룹(자사 명명 ARMORY CASTLE)이 이 결함을 2026년 8월 말부터 제로데이로 악용했다고 보도됐으며, 이 그룹이 과거에도 선택적으로 쓰던 결함을 공개 후 광범위하게 재악용하는 패턴을 보여 왔다고 경고했다(보도, Mandiant 원문 미열람). BeyondTrust는 10/8 SaaS 고객 전체에 패치를 적용했고, 자체 호스팅 고객은 자동 업데이트가 꺼져 있으면 수동 패치가 필요하다고 밝혔다(보도). Privileged Remote Access 제품도 영향받을 수 있다는 보도가 있다.\n\n**왜 일어났나**\n- 직접 원인 [확인: CISA KEV·캐나다 사이버센터]: 인증 절차를 스푸핑으로 우회하는 결함(CWE-290)이 임의 파일 업로드·장비 장악으로 이어짐.\n- 구조적 원인 [추정]: 원격지원 장비가 여러 고객사의 PC·서버에 접근할 수 있는 높은 권한을 가지면서 동시에 인터넷에 노출되는 구조적 위험(분석이며 확인된 사실 아님).\n\n**침투 경로 [보도 범위]**: 인증 우회(CVE-2026-102764) → 임의 파일 업로드 → 장비 장악. 이후 행위(횡적 이동·자격 증명 탈취 등)는 공개되지 않았다.\n\n**어떻게 조치하나**\n- 즉시: SaaS는 패치 적용 여부를 확인하고, 자체 호스팅은 즉시 수동 패치한다. 패치 전후로 장비 로그·네트워크 기록을 보존한다.\n- 단기: 8월 이후 접속 기록을 소급 점검하고, BeyondTrust·Mandiant가 공개하는 침해 지표(IOC)와 대조한다. 침해가 의심되면 장비에 연동된 고객사 접속 계정·토큰을 깨끗한 환경에서 교체한다.\n- 장기: 원격지원 장비의 인터넷 노출 축소, 접근을 허용 IP로 제한, 공급업체 보안 공지 구독.\n- 탐지: 비정상 파일 업로드, 낯선 관리자 계정 생성, 장비에서의 이상 접속 패턴.\n\n**교훈**: 원격지원 도구는 '관리용'이라 신뢰하기 쉽지만, 수많은 고객 환경에 접근 권한을 가진 만큼 뚫리면 피해 범위가 넓어진다. 공개 전 몇 달간 조용히 악용되는 제로데이가 드물지 않다.\n\n### Fortinet FortiOS·FortiPAM·FortiProxy·FortiSwitchManager 경로 조작 (CVE-2025-61624, 간단 기록)\n> 근거: 확인(KEV 등재) / 악용 상세는 미확인\n\nCISA KEV 직접 확인: CVE-2025-61624('Fortinet 다중 제품 경로 조작 취약점'), 2026-10-16 등재, 기한 10/19, 랜섬웨어 사용 '알 수 없음'. 이 결함은 2026-04-14 Fortinet 공지(FG-IR-26-122)로 이미 공개됐던 것으로, 관리자 프로필과 읽기·쓰기 권한을 가진 인증된 공격자가 CLI를 통해 임의 파일을 쓰거나 지울 수 있다(Fortinet 공지 기준 CVSSv3 5.4, NVD는 6.5로 평가해 점수가 엇갈린다). 이미 유효한 관리자 자격 증명이 필요하다는 점에서 인터넷에 노출된 미인증 결함보다 위험도는 낮지만, CISA가 실제 악용 증거를 확인해 KEV에 올렸다는 점은 이미 탈취된 관리자 계정이 악용 경로로 쓰일 수 있음을 뜻한다(추정). 조치: 영향 제품을 쓰는 조직은 Fortinet 공지의 수정 버전으로 올리고, 관리자 계정의 비밀번호·다중 인증을 강화해 계정 탈취 자체를 막아야 한다. 이 건은 별도 `### [ID]` 사건으로 쓰지 않고 여기 기록만 남긴다(악용 경위·피해 사례가 공개되지 않아 전체 분석 형식을 채우기 어렵다).\n\n## 3. 국내 후속 (사건 갱신, 새 사건 아님)\n\n- 금융권 점검 결과 종합 발표는 10/16 기준으로도 찾지 못했다. 5대 은행장이 증인으로 서는 금감원 국정감사는 10/19로 예정돼 있다(보도, [10-13 보고서](2026-10-13.md) 참고). 그 결과는 10/19 이후 보고서의 수집 범위다.\n\n## 4. 우선 대응 체크리스트\n\n1. **BeyondTrust Remote Support·Privileged Remote Access**: 자체 호스팅은 즉시 수동 패치, 8월 이후 접속 로그 소급 점검, IOC 대조.\n2. **Fortinet 경로 조작(CVE-2025-61624)**: 수정 버전 적용 + 관리자 계정 보호(비밀번호 교체, MFA).\n3. 10/19 금감원 국정감사 결과는 다음 수집 구간(10/17~)에서 확인한다(이 보고서의 범위 밖).\n\n## 5. 검증 수준과 한계\n\n- KEV 10/16 등재 2건(BeyondTrust, Fortinet)은 CISA JSON 피드를 직접 받아 `dateAdded` 필드로 확인했다.\n- BeyondTrust 사건의 공격 시작 시점(8월 말)·공격자 귀속(ARMORY CASTLE, 중국 연계 추정)은 Mandiant를 인용한 2차 보도 기준이며 Mandiant·BeyondTrust 원문은 직접 열람하지 못했다. CVSS 점수(9.3)도 2차 보도 기준이다.\n- Fortinet CVE-2025-61624는 KEV 등재 사실은 직접 확인했으나, 구체적인 악용 사례·규모는 공개 자료에서 찾지 못했다. 악용에 이미 유효한 관리자 자격 증명이 필요하다는 점(낮은 위험도 근거)과 CISA가 실악용으로 판단해 등재한 사실(KEV 등재 기준) 사이의 긴장은 그대로 남겨 두며, 자격증명 탈취가 선행됐을 가능성이 있다는 설명은 이 보고서의 추정이다.\n- 국내: 금융·통신·이커머스·공공·교육·의료 질의를 했으나 10/16 당일 신규 대형 사건은 찾지 못했다.\n- ATT&CK는 저장소 기준 v19.2이며, v20.0 반영은 [10-13 보고서](2026-10-13.md)에서 다룬 대로 보류 상태다.\n- GPT(Codex) 검토는 BeyondTrust 항목을 포함해 실시했다(출처 미표기 주장, 내부 불일치 여부 점검).\n- **중복 작성 안내**: [10-18 보고서](2026-10-18.md)가 BeyondTrust·Fortinet 건을 다시 다루고 있다(10-12~10-17 공백을 전제로 작성됐으나, 이 보고서로 그 전제는 더 이상 맞지 않는다). 정리자는 추후 통합을 검토해야 한다.\n\n## 출처\n\n- CISA KEV JSON 피드 (직접 확인)\n- BeyondTrust CVE-2026-102764: BleepingComputer, 캐나다 사이버센터(cyber.gc.ca AL26-025), NHS England, Mandiant 인용 보도 (검색 결과 기준, 원문 미열람)\n- Fortinet CVE-2025-61624: Wiz, Appsecure, stack.watch, CERT.hr (검색 결과 기준, 원문 미열람)\n- 금융권 국정감사 일정: MTN, 데일리안, SBS Biz (보도)\n"},{"path":"일일/2026-10-17.md","title":"일일 보안 이슈 분석 — 2026-10-17","md":"# 일일 보안 이슈 분석 — 2026-10-17\n\n> 수집 기준: 2026-10-17 공개분. **작성 경과 안내**: 이 보고서는 처음 작성할 때 \"10-13~10-16 구간에 일일 보고서가 없다\"는 전제로 그 공백을 한 번에 메우는 형태(Ivanti Connect Secure·Atlassian CVE-2026-21589 전체 분석 등)로 썼으나, 같은 구간을 담당한 별도 작업자가 [10-13](2026-10-13.md)~[10-16](2026-10-16.md) 보고서를 실제로 채워 그 전제가 틀렸다. 중복된 전체 분석(Ivanti, Atlassian)은 삭제하고 해당 날짜 보고서로 링크만 남긴다. 아래는 10/17 당일 기준으로 다시 정리한 내용이다. CISA KEV 목록은 JSON 피드로 직접 확인했다(조회 시점 기준 최신 등재일은 10/16, 10/17 신규 등재는 확인되지 않았다).\n> 근거 표기: **[확인]** 벤더·정부기관·연구기관이 직접 확인 / 보도 언론 보도 / **[추정]** 본 보고서의 추정 / **[주장]** 공격자 일방 주장. **조치는 본 보고서의 권고**이며 벤더 공식 지침이 우선한다.\n> ATT&CK 기준: **저장소는 v19.2**(기존 매핑 유지). 공식 사이트는 2026-10-13 **v20.0**으로 갱신됐음을 확인했으나([10-13 보고서](2026-10-13.md) 참고), 저장소 전체 반영(`_catalog.psv` 재작업)은 범위가 커 별도 작업으로 보류한다. 오늘은 신규 매핑이 없다.\n\n## 1. 오늘의 요약\n\n오늘(10/17) 당일 기준 신규 주요 사건을 1차 출처로 확인하지 못했다. 이미 [10-13](2026-10-13.md)~[10-16](2026-10-16.md) 보고서가 다룬 Ivanti Connect Secure(CVE-2026-104935), Ahsay AhsayCBS(CVE-2026-105133/105134), PAN-OS(CVE-2026-0322), Cisco Secure Email Gateway(CVE-2026-76519), BeyondTrust Remote Support(CVE-2026-102764), Fortinet(CVE-2025-61624), Atlassian(CVE-2026-21589) 건은 오늘 다시 쓰지 않는다. 다만 이 중 PAN-OS·Cisco SEG·Ahsay 세 건은 CISA KEV 조치 기한이 오늘(10/17)이다.\n\n| # | 항목 | 상태 | 비고 |\n|---|------|------|------|\n| 1 | PAN-OS CVE-2026-0322 / Cisco SEG CVE-2026-76519 / Ahsay AhsayCBS 2건 — KEV 조치 기한 | 오늘(10/17) 경과 | 사건 본문은 [10-14 보고서](2026-10-14.md) |\n| 2 | Atlassian CVE-2026-21589 — KEV 조치 기한 | 10/18(내일) | 사건 본문은 [10-08 보고서](2026-10-08.md), KEV 등재는 [10-15 보고서](2026-10-15.md) |\n| 3 | 국내 금융권 연쇄 해킹 후속 | 금감원 국정감사가 10/19(이틀 뒤)로 예정 | [10-13 보고서](2026-10-13.md) 참고 |\n| 4 | 해외 신규 제로데이·랜섬웨어 | 1차 출처로 확인하지 못함 | — |\n\n## 2. 우선 대응 체크리스트 (기한 임박·경과 건 재확인)\n\n1. **PAN-OS CVE-2026-0322, Cisco SEG CVE-2026-76519, Ahsay AhsayCBS(CVE-2026-105133/105134)**: KEV 기한이 오늘(10/17)이다. 아직 패치·점검을 끝내지 못했다면 [10-14 보고서](2026-10-14.md)의 조치 항목을 오늘 우선 처리한다.\n2. **Atlassian CVE-2026-21589**: 기한이 내일(10/18)이다. [10-08](2026-10-08.md)·[10-15](2026-10-15.md) 보고서의 조치 항목을 확인한다.\n3. **Ivanti Connect Secure**: 권한 상승 결함이 [10-13 보고서](2026-10-13.md) 작성 시점 기준 아직 미패치였다. 벤더 추가 공지를 계속 확인한다.\n4. 금감원 국정감사(10/19) 결과는 해당일 보고서에서 확인한다.\n\n## 3. 검증 수준과 한계\n\n- KEV는 CISA JSON 피드를 직접 읽어 확인했다(조회 시점 기준 최신 등재일 10/16이며 10/17 신규 등재는 확인되지 않았다 — 피드 갱신 지연 가능성을 배제할 수는 없다).\n- 해외 신규 제로데이·랜섬웨어, 국내 금융·통신·플랫폼·공공 질의를 반복했으나 10/17 당일 신규 대형 사건은 확인하지 못했다.\n- **중복 작성을 바로잡은 기록**: 이 보고서의 이전 버전은 Ivanti·Atlassian을 전체 분석(`D20261017-ivanti-ics`, `D20261017-atlassian-cve21589`)으로 다시 썼고 `ATTACK/매핑.psv`·`분류.psv`에도 중복 행을 추가했었다. 같은 CVE가 이미 [10-13 보고서](2026-10-13.md)의 `D20261013-ivanti`, [10-08 보고서](2026-10-08.md)의 `D20261008-atlassian`로 등록돼 있음을 확인하고 중복 행을 제거했다(이 교정은 Codex 리뷰에서 지적받은 날짜·표기 문제를 고치는 과정에서 원본 자료를 다시 대조해 발견했다).\n- ATT&CK는 저장소 기준 v19.2이며 오늘은 신규 매핑이 없다.\n\n## 출처\n\n- CISA KEV JSON 피드 (직접 확인)\n- 10/13~10/16 사건의 출처는 각 날짜 보고서([10-13](2026-10-13.md), [10-14](2026-10-14.md), [10-15](2026-10-15.md), [10-16](2026-10-16.md)) 참고\n"},{"path":"일일/2026-10-18.md","title":"일일 보안 이슈 분석 — 2026-10-18","md":"# 일일 보안 이슈 분석 — 2026-10-18\n\n> 수집 기준: 2026-10-18 공개분. **작성 경과 안내**: 이 보고서는 처음에 \"10-16까지 공백\"이라는 전제로 BeyondTrust Remote Support(CVE-2026-102764) 전체 분석을 다시 썼으나, 같은 CVE가 이미 [10-16 보고서](2026-10-16.md)의 `D20261016-beyondtrust`로 정리돼 있어 중복이었다. 중복 분석은 삭제하고 링크만 남긴다. CISA KEV 목록은 JSON 피드로 직접 확인했다(조회 시점 기준 최신 등재일은 여전히 10/16이며 10/17~18 신규 등재는 확인되지 않았다).\n> 근거 표기: **[확인]** 벤더·정부기관·피해 기업이 직접 확인 / 보도 언론 보도 / **[추정]** 본 보고서의 추정 / **[주장]** 공격자 일방 주장. **조치는 본 보고서의 권고**이며 벤더 공식 지침이 우선한다.\n> ATT&CK 기준: **저장소는 v19.2**(기존 매핑 유지). 공식 사이트 v20.0 반영은 [10-13 보고서](2026-10-13.md)에서 다룬 대로 별도 작업으로 보류한다. 오늘은 신규 매핑이 없다.\n\n## 1. 오늘의 요약\n\n오늘(10/18) 당일 기준 신규 주요 사건을 1차 출처로 확인하지 못했다. [10-16 보고서](2026-10-16.md)가 다룬 BeyondTrust Remote Support(CVE-2026-102764)·Fortinet(CVE-2025-61624) 건은 다시 쓰지 않는다.\n\n| # | 항목 | 상태 | 비고 |\n|---|------|------|------|\n| 1 | BeyondTrust Remote Support·Fortinet — KEV 조치 기한 | 10/19(내일) | 사건 본문은 [10-16 보고서](2026-10-16.md) |\n| 2 | Atlassian CVE-2026-21589 — KEV 조치 기한 | 오늘(10/18) 경과 | 사건 본문은 [10-08](2026-10-08.md)·[10-15](2026-10-15.md) 보고서 |\n| 3 | 국내 금융권 연쇄 해킹 후속 | 금감원 국정감사가 내일(10/19) 예정 | [10-13 보고서](2026-10-13.md) 참고, 결과는 10/19 보고서에서 확인 |\n| 4 | 해외 신규 제로데이·랜섬웨어 | 1차 출처로 확인하지 못함 | — |\n\n## 2. 우선 대응 체크리스트\n\n1. **Atlassian CVE-2026-21589**: 기한이 오늘(10/18)이다. 아직 패치하지 않았다면 최우선 처리한다.\n2. **BeyondTrust Remote Support·Fortinet**: 기한이 내일(10/19)이다. [10-16 보고서](2026-10-16.md)의 자체 호스팅 수동 패치·IOC 점검 항목을 확인한다.\n3. 금감원 국정감사(10/19) 결과는 해당일 보고서에서 확인한다.\n\n## 3. 검증 수준과 한계\n\n- KEV는 CISA JSON 피드를 직접 읽어 확인했다. 조회 시점 기준 최신 등재일은 10/16이었고, 10/17~18 사이 신규 등재는 이번 조회에서 확인되지 않았다(피드 갱신 지연 가능성을 배제할 수는 없다).\n- 해외 신규 제로데이·랜섬웨어, 국내 금융·통신·플랫폼·공공 질의를 반복했으나 10/18 당일 신규 대형 사건은 확인하지 못했다.\n- **중복 작성을 바로잡은 기록**: 이 보고서의 이전 버전은 BeyondTrust를 전체 분석(`D20261018-beyondtrust-rs`)으로 다시 썼고 `ATTACK/매핑.psv`·`분류.psv`에도 중복 행을 추가했었다. 같은 CVE가 이미 [10-16 보고서](2026-10-16.md)의 `D20261016-beyondtrust`로 등록돼 있음을 확인하고 중복 행을 제거했다.\n- ATT&CK는 저장소 기준 v19.2이며 오늘은 신규 매핑이 없다.\n\n## 출처\n\n- CISA KEV JSON 피드 (직접 확인)\n- 10/16 사건의 출처는 [10-16 보고서](2026-10-16.md) 참고\n"},{"path":"일일/2026-10-19.md","title":"일일 보안 이슈 분석 — 2026-10-19","md":"# 일일 보안 이슈 분석 — 2026-10-19\n\n> 수집 기준: 2026-10-18 ~ 10-19 공개분. CISA KEV 목록은 JSON 피드로 직접 확인했다(조회 시점 기준 최신 등재일은 여전히 10/16이며 10/17 이후 신규 등재는 이번 조회에서도 확인되지 않았다). 이미 [10-17](2026-10-17.md)·[10-18](2026-10-18.md) 보고서에 있는 사건은 중복 작성하지 않았다.\n> 근거 표기: **[확인]** 벤더·정부기관·피해 기업이 직접 확인 / 보도 언론 보도 / **[추정]** 본 보고서의 추정 / **[주장]** 공격자 일방 주장. **조치는 본 보고서의 권고**이며 벤더 공식 지침이 우선한다.\n> ATT&CK 기준: **저장소는 v19.2**(기존 매핑 유지). 공식 사이트 v20.0(2026-10-13 출시) 반영은 [10-13 보고서](2026-10-13.md)에서 다룬 대로 별도 작업으로 보류한다. 사건별 매핑은 [../ATTACK/README.md](../ATTACK/README.md) 참고.\n\n## 1. 오늘의 요약\n\n오늘 보고 마감 시각까지 신규 주요 해외 사건을 1차 출처로 확인하지 못했다(못 찾은 것이 없었다는 근거는 아니다). 국내에서는 예고됐던 금감원 국정감사가 오늘 열렸을 것으로 보이나, 실제 진행 내용(질의·답변)은 검색에서 확인하지 못했다. 억지로 만들지 않고 확인된 사실만 기록한다.\n\n| # | 항목 | 상태 | 비고 |\n|---|------|------|------|\n| 1 | CISA 악용 확인 목록(KEV) | 10/19 조회 시점 기준 최신 등재일은 10/16이며 이후 신규 등재 없음 [확인](피드 앞부분만 읽었고 최신순 정렬을 전제로 함) | 10/13~10/16 등재분은 [10-17](2026-10-17.md)·[10-18](2026-10-18.md) 보고서 |\n| 2 | 금감원 국정감사(5대 은행장 증인 출석 예정) | 오늘(10/19) 개최 예정이었다는 사전 보도까지만 확인, 실제 진행 결과는 이번 조회에서 찾지 못함 | [10-06 국내 보충](2026-10-06-국내보충.md) 참고, 결과는 다음 보고서에서 확인 |\n| 3 | 해외 신규 제로데이·랜섬웨어·대량 유출 | 1차 출처로 확인하지 못함 | 검색 결과는 대부분 과거 사건·월간 집계 요약이었다 |\n\n## 2. 국내 후속 (사건 갱신, 새 사건 아님)\n\n- 국회 정무위원회는 금감원 국정감사 증인으로 5대 시중은행장(이환주 KB국민, 정상혁 신한, 이호성 하나, 정진완 우리, 강태영 NH농협)을 채택했고, 10/19(오늘) 금감원 국감에서 해킹 사고 경위·정보보호 체계·재발 방지책을 질의받을 예정이라는 보도(10/6~10/8 사전 보도)가 있었다. 하지만 오늘 실제 질의·답변 내용, 국감장에서 나온 구체 발언은 이번 검색에서 확인하지 못했다(검색엔진이 당일 보도를 아직 반영하지 않았을 수 있다).\n- 금융위는 국감 전 2차 망분리 규제 완화 대상 선정을 잠정 연기했다는 보도(10/8 전후)가 있으며, 사고 수습·원인 파악·보안점검을 먼저 진행하겠다는 입장이었다. 이는 이미 알려진 내용으로 새 사건이 아니다.\n- 이 보고서는 국감 '예고'와 '결과'를 구분한다. 오늘 보고서에는 예고 내용만 반영했고, 실제 진행 결과는 익일 보도를 확인한 뒤 다음 보고서에서 다룬다.\n\n**먼저 할 일(일반 이용자)**: 금융사를 사칭하는 전화·문자의 링크는 누르지 말고 공식 앱·대표번호로 직접 확인하세요. 같은 비밀번호를 쓰는 계정부터 바꾸고 추가 인증(OTP 등)을 켜세요. 이미 유출된 정보가 회수되지는 않으며, 의심되면 모든 기기에서 로그아웃하세요.\n\n## 3. 우선 대응 체크리스트\n\n1. [10-17 보고서](2026-10-17.md)의 Ivanti·Atlassian·Ahsay, [10-18 보고서](2026-10-18.md)의 BeyondTrust·Fortinet 조치는 기한이 지났거나 임박했으니 미적용 상태라면 오늘 우선 처리한다.\n2. 금감원 국정감사 결과(은행장 답변, 추가 대책 발표 여부)를 익일 보도로 확인한다.\n\n## 4. 검증 수준과 한계\n\n- KEV는 CISA JSON 피드를 직접 읽어 확인했다(피드가 커서 앞부분만 확인했고, 조회 시점 기준 최신 등재일이 10/16에서 더 갱신되지 않은 상태였다 — 피드 자체가 아직 갱신되지 않았을 가능성과 실제로 신규 등재가 없었을 가능성을 구분할 수 없다).\n- 해외 제로데이·랜섬웨어 검색에서 10/18~19 신규 건을 1차 출처로 확인하지 못했다. 검색 결과는 과거 사건이나 월간·반기 집계 요약이 대부분이었고 날짜가 맞지 않는 것은 사용하지 않았다.\n- 국내 금감원 국정감사는 오늘(10/19) 열릴 예정이었다는 사전 보도까지만 확인했고, 실제 진행 내용(출석 여부, 질의·답변, 신규 발표)은 검색에서 찾지 못했다. 검색엔진의 색인 지연일 수 있어 다음 보고서에서 다시 확인한다.\n- 국내: 금융·통신·이커머스·공공·교육·의료 질의를 했으나 10/18~19 신규 대형 국내 사건은 확인하지 못했다.\n- ATT&CK는 저장소 기준 v19.2이며 이번 보고서에는 신규 매핑이 없다.\n- GPT 검토는 신규 사건·매핑이 없는 단순 갱신이라 비민감 요약 1회만 실시했다.\n\n## 출처\n\n- CISA KEV JSON 피드 (직접 확인)\n- 금감원 국정감사 배경: MTN 2026-10-06, 2026-10-08\n- MITRE ATT&CK v19.2(저장소 기준), 공식 사이트는 v20.0(직접 확인, 반영 보류)\n"},{"path":"일일/2026-10-20.md","title":"일일 보안 이슈 분석 — 2026-10-20","md":"# 일일 보안 이슈 분석 — 2026-10-20\n\n> 수집 기준: 2026-10-20(오늘, 조사 진행 시각까지 공개분). **오늘 날짜 보고서라 수집 창이 짧다**: 하루가 끝나기 전에 작성했으므로 오늘 늦게 나올 소식은 다음 보고서에서 다룬다. CISA KEV 목록은 JSON 피드로 직접 확인했다(조회 시점 기준 최신 등재일은 10/16). 이미 [10-17](2026-10-17.md)~[10-19](2026-10-19.md) 보고서에 있는 사건은 중복 작성하지 않았다.\n> 근거 표기: **[확인]** 벤더·정부기관·피해 기업이 직접 확인 / 보도 언론 보도 / **[추정]** 본 보고서의 추정 / **[주장]** 공격자 일방 주장. **조치는 본 보고서의 권고**이며 벤더 공식 지침이 우선한다.\n> ATT&CK 기준: **저장소는 v19.2**(기존 매핑 유지). 공식 사이트 v20.0(2026-10-13 출시) 반영은 [10-13 보고서](2026-10-13.md)에서 다룬 대로 별도 작업으로 보류한다. 사건별 매핑은 [../ATTACK/README.md](../ATTACK/README.md) 참고.\n\n## 1. 오늘의 요약\n\n조사 진행 시각까지 신규 주요 해외·국내 사건을 1차 출처로 확인하지 못했다(못 찾은 것이 없었다는 근거는 아니며, 특히 오늘은 수집 창이 짧다). 억지로 만들지 않고 확인된 사실만 기록한다.\n\n| # | 항목 | 상태 | 비고 |\n|---|------|------|------|\n| 1 | CISA 악용 확인 목록(KEV) | 조회 시점 기준 최신 등재일은 10/16이며 이후 신규 등재 없음 [확인](피드 앞부분만 읽었고 최신순 정렬을 전제로 함) | 10/13~10/16 등재분은 [10-17](2026-10-17.md)·[10-18](2026-10-18.md) 보고서 |\n| 2 | 금감원 국정감사(10/19 개최 예정분) 결과 | 어제(10/19) 열렸을 것으로 보이나 실제 질의·답변·발표 내용은 오늘 조회에서도 확인하지 못함 | [10-19 보고서](2026-10-19.md)에서 이미 같은 한계를 기록함, 추가 확인 필요 |\n| 3 | 해외 신규 제로데이·랜섬웨어·대량 유출 | 1차 출처로 확인하지 못함 | 검색 결과는 대부분 과거 사건·월간 집계 요약 |\n\n## 2. 국내 후속 (사건 갱신, 새 사건 아님)\n\n- 금감원 국정감사(10/19) 결과를 오늘도 다시 검색했으나 구체적인 질의·답변 보도를 찾지 못했다. 언론사 홈페이지를 직접 순회하지 않고 검색엔진에 의존한 한계일 수 있다. 다음 보고서로 넘긴다.\n- 그 외 국내 금융권 연쇄 해킹 관련 새로운 조사 결과·제재 발표는 확인하지 못했다.\n\n## 3. 우선 대응 체크리스트\n\n1. [10-17 보고서](2026-10-17.md)의 Ivanti Connect Secure·Atlassian 다중 제품·Ahsay AhsayCBS, [10-18 보고서](2026-10-18.md)의 BeyondTrust Remote Support·Fortinet 다중 제품 — 조치 기한이 모두 지났으므로 아직 패치·점검을 끝내지 못했다면 오늘 최우선으로 처리한다.\n2. 금감원 국정감사 결과는 확인되는 즉시 반영한다.\n\n## 4. 검증 수준과 한계\n\n- 오늘은 \"오늘 날짜\" 보고서의 구조적 한계가 있다: 수집 창이 짧아(조사 시각 이후 뉴스는 반영되지 않음) 오늘 늦게 나오는 소식은 다루지 못한다. 이는 보고서의 결함이 아니라 매일 보고서의 공통적 성격이다.\n- KEV는 CISA JSON 피드를 직접 읽어 확인했다(앞부분만 확인, 최신순 정렬 전제).\n- 해외 제로데이·랜섬웨어·국내 금융/통신/플랫폼/공공 질의를 모두 반복했으나 10/19~20 신규 건을 1차 출처로 확인하지 못했다.\n- 금감원 국정감사 결과는 이틀째(10/19 보고서, 오늘 보고서) 확인하지 못하고 있다. 검색엔진 색인 지연일 가능성과 실제로 아직 상세 보도가 나오지 않았을 가능성을 구분할 수 없다.\n- ATT&CK는 저장소 기준 v19.2이며 이번 보고서에는 신규 매핑이 없다.\n- GPT 검토는 신규 사건·매핑이 없는 단순 갱신이라 비민감 요약 1회만 실시했다.\n\n## 출처\n\n- CISA KEV JSON 피드 (직접 확인)\n- MITRE ATT&CK v19.2(저장소 기준), 공식 사이트는 v20.0(직접 확인, 반영 보류)\n"},{"path":"일일/2026-10-21.md","title":"일일 보안 이슈 분석 — 2026-10-21","md":"# 일일 보안 이슈 분석 — 2026-10-21\n\n> 수집 기준: 2026-10-21(오늘, 조사 진행 시각까지 공개분). CISA KEV는 JSON 피드를 직접 받아 확인했다(10/14~10/20 등재분 중 [10-17](2026-10-17.md)~[10-20](2026-10-20.md) 보고서에 이미 있는 건은 제외). 이번 조사는 WebSearch 호출 한도에 걸려 중간에 중단됐고, 그 사실을 한계 항목에 밝힌다.\n> 근거 표기: **[확인]** 벤더·정부기관·피해 기업이 직접 확인 / 보도 언론 보도 / **[추정]** 본 보고서의 추정 / **[주장]** 공격자 일방 주장. **조치는 본 보고서의 권고**이며 벤더 공식 지침이 우선한다.\n> ATT&CK 기준: **저장소는 v19.2**(기존 매핑 유지). 공식 사이트 v20.0(2026-10-13 출시) 반영은 [10-13 보고서](2026-10-13.md)에서 다룬 대로 별도 작업으로 보류한다.\n\n## 1. 오늘의 요약\n\n| # | 이슈 | CVE | 유형 | 상태 | 즉시 조치 |\n|---|------|-----|------|------|-----------|\n| 1 | SiteGuard Server Edition(일본 WAF) 명령 삽입 | CVE-2026-106931 | 로컬 권한 상승 → root/SYSTEM | 악용 확인, KEV 10/20(기한 10/23) | 진단정보 보존 후 수정판 적용 |\n| 2 | Plex Media Server 체이닝 가능 취약점 4건 | CVE-2026-96652·96654·96655·96656 | SSRF·플러그인 우회·임의 파일 쓰기 | KEV 10/20 등재(악용 확인) | 1.43.3.10861 이상으로 업데이트 |\n| 3 | Siemens Software Center DLL 탐색경로 결함 | CVE-2026-110936 | 로컬 권한 상승(DLL 끼워넣기) | KEV 10/20(기한 11/3), 악용 사례는 미공개 | 수정판 적용, 간단 기록(별도 사건 아님) |\n| 4 | 미국 메릴랜드 Anne Arundel County 랜섬웨어(Rhysida) | — | 지자체 랜섬웨어·데이터 탈취 | 카운티 확인(파일 탈취), 규모는 공격자 주장 | 통지 대상 확정, 탈취 자료 범위 조사 |\n| 5 | 국내: 금감원 국정감사(10/19) 결과 | — | 정책 후속(기존 사건) | [확인](국감 보도) | [D20261006-finsector](../과거3년/2026.md) 후속, 국내뉴스.psv에 기록 |\n\n## 2. 이슈별 분석\n\n### [D20261021-siteguard] EG Secure Solutions SiteGuard Server Edition CVE-2026-106931\n> 날짜: 2026-10-14(공개·KEV 전 보도 기준) · 유형: 서버 소프트웨어 취약점 · 행위자: 미귀속 · 지역: 일본 중심 · 근거: 확인\n\n**쉽게 말하면**: 일본에서 많이 쓰는 서버용 보안 소프트웨어(SiteGuard, 일종의 침입 차단 프로그램)에 결함이 있어, 이미 서버에 낮은 권한으로 들어와 있는 공격자가 그 결함을 이용해 서버의 최고 권한(root/SYSTEM)까지 올라갈 수 있습니다. 실제 공격에 쓰였다는 것이 제조사와 일본 정부 대응팀(JPCERT/CC)에 의해 확인됐습니다.\n\n**먼저 할 일(초보용)**: 바로 패치부터 하지 말고, 제조사가 안내하는 대로 관리 화면에서 진단정보(로그)를 먼저 내려받아 보존한 다음 수정판을 적용하세요. 패치가 침입 흔적을 지울 수 있다고 벤더가 직접 경고했습니다.\n\n**개요**: SiteGuard Server Edition은 서버에 설치하는 호스트 기반 WAF(웹 방화벽)다. 기본적으로 켜져 있는 통계 기능에 OS 명령 삽입(CWE-78) 결함이 있어, 이미 낮은 권한으로 서버에 접근한 사용자가 root(Linux)·SYSTEM(Windows) 권한으로 명령을 실행할 수 있다(CVSS4 8.5). 벤더와 JPCERT/CC가 실제 악용을 확인했고 CISA KEV에 10/20 등재됐다(기한 10/23).\n\n**왜 일어났나**\n- 직접 원인 [확인: 벤더, JPCERT/CC(보도 종합)]: 기본 활성화된 통계 기능이 외부 입력을 OS 명령에 그대로 넘겨 삽입 공격이 가능하다.\n- 구조적 원인 [추정]: (1) 보안 제품 자체가 공격 표면이 됨 — 침입을 막는 제품이 오히려 root 획득 통로가 된 역설적 사례 (2) 통계 기능처럼 핵심 방어 기능이 아닌 부가 기능이 기본 켜짐 (3) 벤더가 직접 계약 고객에게만 먼저 알린 뒤 공개까지 시차가 있어, 공개 전에 이미 공격받은 서버가 있었을 가능성이 보도됨.\n\n**침투 경로 [추정: 보도 종합]**: 선행 침투 경로는 공개되지 않았다(이 결함 자체는 \"이미 낮은 권한을 가진 사용자\"를 전제로 하는 권한 상승 결함이다). 그 낮은 권한을 어떻게 얻었는지는 확인되지 않았으므로 초기 침투 단계는 매핑하지 않는다.\n\n**어떻게 조치하나**\n- 즉시: 패치 **전에** 관리 콘솔에서 진단정보(로그) 내보내 보존(벤더 권고), 통계 기능을 끌 수 있다면 임시로 비활성화\n- 단기: 수정판 적용(Apache/Nginx는 8.00 Update 5, FreeBSD는 7.00 Update 6 등 — 벤더 공지에서 정확한 버전 재확인), 서버 내 신규 계정·SUID·cron 점검\n- 장기: 보안 제품 자체도 패치 대상 자산으로 관리(제품 목록에서 빠지기 쉬움), 서버 접근 권한 최소화로 \"낮은 권한 침입\" 자체를 줄임\n- 탐지: 통계 기능 관련 프로세스가 비정상적으로 자식 프로세스(쉘 등)를 생성하는지 모니터링\n\n**교훈**: 보안 제품도 소프트웨어이고, 소프트웨어는 취약점이 생긴다. 방어 도구 자체를 패치 대상에서 빼놓지 않아야 한다.\n\n### [D20261021-plex] Plex Media Server 체이닝 가능 취약점 4건\n> 날짜: 2026-10-20(KEV 등재) · 유형: 서버 소프트웨어 취약점 · 행위자: 미귀속 · 지역: 글로벌 · 근거: 확인\n\n**쉽게 말하면**: 집이나 소규모 사무실에서 영상·음악을 모아 재생할 때 많이 쓰는 프로그램 Plex Media Server에서, 서로 이어 붙이면 위험해지는 결함 4개가 발견돼 CISA가 \"실제 공격에 쓰였다\"며 긴급 목록(KEV)에 올렸습니다.\n\n**먼저 할 일(초보용)**: Plex Media Server를 1.43.3.10861 이상으로 업데이트하세요. 외부(인터넷)에서 접속되게 포트를 열어 둔 경우라면 꼭 필요한지 다시 확인하세요.\n\n**개요**: CISA KEV에 2026-10-20 등재된 4건(CVE-2026-96652, -96654, -96655, -96656)은 CISA가 \"서로 체인으로 엮일 수 있다\"고 명시했다. CVE-2026-96654는 인증 없이 네트워크로 플러그인 기능을 호출할 수 있는 결함, CVE-2026-96652·96655는 서버가 공격자가 지정한 주소로 요청을 보내게 하는 SSRF, CVE-2026-96656은 관리자 권한에서 서버가 시작할 때 실행되는 파일을 임의로 쓸 수 있는 결함이다(이 건은 CISA가 포렌식 조사 대상으로 별도 표시).\n\n**왜 일어났나**\n- 직접 원인 [확인: CISA KEV, 벤더 포럼 공지(보도 종합)]: 입력값 검증 부족(플러그인 호출 매개변수 미검증, 전송 대상 URL 미검증)과 파일 쓰기 권한 설계가 결합해 있다. Plex가 1.43.3.10861에서 네 건을 함께 수정했다.\n- 구조적 원인 [추정]: (1) 홈 서버·NAS 환경에서 포트 포워딩으로 인터넷에 노출되는 경우가 흔함 (2) 플러그인 구조가 외부 입력을 느슨하게 신뢰 (3) CISA가 \"known ransomware campaign use: Unknown\"으로 표시해, 랜섬웨어 연계는 확인되지 않았다.\n\n**관측된 공격 [확인/미공개]**: CISA는 KEV 등재 기준(실악용 증거 확인)을 충족했다고만 밝혔고, 구체적인 공격 순서·IOC는 공개 자료에서 확인하지 못했다.\n\n**어떻게 조치하나**\n- 즉시: 1.43.3.10861 이상 업데이트, 인터넷 노출 여부 재확인(불필요하면 포트 포워딩 해제)\n- 단기: 관리자 계정 비밀번호·2단계 인증 점검, 서버 시작 시 로드되는 파일 목록에 낯선 항목이 있는지 확인(CVE-2026-96656이 특히 이 경로)\n- 장기: 미디어 서버류는 꼭 필요한 경우에만 인터넷에 노출하고, VPN 뒤에 두는 구성 검토\n- 탐지: 서버 로그에서 플러그인 호출·전송(transcode) 관련 엔드포인트의 비정상 요청\n\n**교훈**: 가정용·소규모 소프트웨어도 인터넷에 열려 있으면 기업용 장비와 같은 위험을 가진다. \"내 서버는 작아서 안전하다\"는 가정은 틀리기 쉽다.\n\n### 참고 기록 — Siemens Software Center CVE-2026-110936 (간단 기록)\nCISA KEV 확인: 2026-10-20 등재(기한 11/3). Software Center가 DLL(공유 라이브러리)을 찾는 경로 설정이 느슨해(CWE-427, Uncontrolled Search Path Element), 로컬 공격자가 그 경로에 악성 DLL을 미리 심어 두면 프로그램 실행 시 그 권한으로 코드가 실행된다(로컬 권한 상승). 이미 기기에 접근 권한이 있어야 하는 결함이라 인터넷에서 바로 들어오는 경로는 아니며, 실제 악용 사례·경위는 공개되지 않았다. 조치는 수정판 적용과, 쓰기 권한이 있는 폴더에서 신뢰할 수 없는 실행 파일·DLL이 로드되지 않는지 점검이다. 별도 `### [ID]` 사건으로 쓰지 않고 여기 기록만 남긴다.\n\n### [D20261021-arundel] 미국 메릴랜드 Anne Arundel County 랜섬웨어(Rhysida 주장)\n> 날짜: 2026-08(공격 시점, 보도 기준) · 유형: 지자체 랜섬웨어·데이터 탈취 · 행위자: Rhysida(주장) · 지역: 미국 · 근거: 보도(일부 확인)\n\n**쉽게 말하면**: 미국 메릴랜드주 Anne Arundel 카운티(지방정부)가 8월에 침해를 당해 일부 시스템의 파일이 빠져나갔다고 카운티가 직접 확인했습니다. 랜섬웨어 조직 Rhysida는 2.6테라바이트, 81만여 개 파일을 가져갔다며 다크웹에서 비트코인 25개(약 20억 원 상당)에 팔겠다고 올렸는데, 이 수치는 범죄조직의 주장일 뿐 카운티가 확인한 내용은 아닙니다.\n\n**먼저 할 일(초보용)**: 이 카운티의 주민이라면 공식 통지를 기다리고, 아직 통지를 받지 못했다고 안심하지 말고 카운티의 공식 발표를 주기적으로 확인하세요. 침해된 시스템에서는 비밀번호를 바꾸지 말고, 안전한 기기에서 공식 안내에 따라 조치하세요.\n\n**개요**: 카운티 대변인은 공격자가 \"제한된 수의 시스템\"에 접근해 일부 파일을 복사해 갔다고 확인했다. 어떤 정보가 포함됐는지, 주민이 영향을 받았는지는 조사 중이라고 밝혔다(보도 시점 기준). 이 카운티는 2025년 1~2월에도 별도의 랜섬웨어 공격을 겪은 적이 있어, 이번 8월 건과 혼동하지 않아야 한다.\n\n**왜 일어났나**\n- 직접 원인: 공개되지 않았다. 최초 침투 경로(피싱·노출 취약점·탈취 자격 증명 등)는 확인된 자료가 없다.\n- 구조적 원인: 원인이 공개되지 않아 구조적 분석도 보류한다. 다만 지자체 시스템이 반복해서(2025년, 2026년 8월) 침해당했다는 사실 자체가 지속적인 보안 투자·탐지 역량의 공백을 시사한다 [추정].\n\n**어떻게 조치하나** (원인 미공개로 일반 권고)\n- 즉시: 영향 범위 확정까지 조사 지속, 확인된 침해 시스템은 격리·증거 보존\n- 단기: 주민·직원 대상 통지 준비, 유출 의심 정보 종류별(주민등록 상당 번호, 의료정보 등) 대응 절차 수립\n- 장기: 지자체 공통의 레거시 시스템 전수 점검, 침해 재발 방지를 위한 외부 노출 자산 점검\n- 탐지: 향후 유사 패턴(동일 계정·장비) 재침해 감시\n\n**교훈**: 공격자의 유출 규모 주장과 피해 기관의 확인된 사실은 다르다. 보도에서도 이 둘을 섞지 않아야 한다.\n\n## 3. 국내 소식\n\n**금감원 국정감사(10/19) 결과 — 기존 금융권 연쇄 해킹 사건의 후속**: 10/19 국회 정무위원회의 금융감독원 국정감사에서 은행권 해킹 대응이 주요 쟁점이었다. 이찬진 금감원장은 원인을 규명해 허점을 보완하겠다고 답했고, 금감원은 보안 취약점 분석·평가 강화, IT자산 식별·관리 의무화, AI 기반 모의해킹 훈련 확대 등을 제도적으로 보강하겠다고 밝혔다. 금감원 업무보고에 따르면 2월 가동한 통합관제시스템(FIRST)을 통해 9월까지 금융권에 전파한 위협정보는 213건이었다. 이 건은 새 사건이 아니라 [D20261006-finsector](../과거3년/2026.md) 사건의 정책 후속이라 `국내뉴스.psv`에만 기록했다.\n\n**국내 질의 결과**: 지침에 따라 ①금융권 ②통신·OTT·이커머스 ③공공·지자체·교육·의료 ④국내 랜섬웨어 ⑤정부 발표 ⑥기존 사건 규모 갱신, 총 6개 범주를 각각 검색했다. ①금융권은 국정감사 후속(위 기록)만 확인했고 새로운 침해·유출은 찾지 못했다. ②통신·이커머스는 10월 기준 신규 사건을 찾지 못했다(검색 결과는 대부분 2025년 말~2026년 2월 쿠팡 사건 후속 보도였다). ③공공·지자체·교육·의료는 10월 신규 사건을 찾지 못했고, 개인정보보호위원회 평가 제도 강화(4월 발표, 감점 상향) 같은 정책 자료만 확인됐다. ④국내 랜섬웨어 10월 통계는 아직 공개되지 않았다(안랩 ASEC 최신 월간 보고서는 7월자). ⑤과기정통부·KISA의 금융권 대응 긴급체계(2만8천개사 보안점검 권고 메일 등)는 10/5 보도로 이미 지난 사건의 후속이라 새로 기록하지 않았다. ⑥기존 사건 규모 갱신은 확인하지 못했다. **WebSearch 호출 한도에 걸려 이 범주들의 조사를 조기에 마쳤다는 한계가 있다** — 특히 ②③④는 질의를 한 차례씩만 수행했다.\n\n## 4. 우선 대응 체크리스트\n\n1. **SiteGuard Server Edition(기한 10/23)**: 진단정보 보존 → 수정판 적용. 이미 영향받았는지 벤더 안내로 확인.\n2. **Plex Media Server**: 1.43.3.10861 이상 업데이트, 인터넷 노출 여부 재확인.\n3. **Siemens Software Center(기한 11/3)**: 수정판 적용, 로컬 DLL 심기 가능 경로 점검.\n4. [10-17](2026-10-17.md)~[10-20](2026-10-20.md) 보고서의 Ivanti·Atlassian·Ahsay·PAN-OS·Cisco SEG·BeyondTrust·Fortinet — 기한이 모두 지났으므로 미조치 상태라면 최우선 처리.\n5. 금감원 국정감사 후속 제도(IT자산 의무화, 모의해킹 훈련 확대 등)의 구체 시행 일정은 확인되는 대로 반영한다.\n\n## 5. 검증 수준과 한계\n\n- CISA KEV는 JSON 피드를 직접 받아 10/14~10/20 신규 등재분을 확인했다(1차 출처).\n- SiteGuard·Plex는 CISA/벤더 1차 확인 + 2차 보도(JPCERT/CC 인용 포함)로 뒷받침됐으나, 구체적 공격 순서·IOC는 공개 자료에서 찾지 못했다.\n- Anne Arundel County 건은 카운티의 \"파일 탈취\" 확인은 보도를 통해 간접 확인했고, Rhysida의 규모 주장(2.6TB, 81만여 파일)은 검증되지 않았다.\n- **WebSearch 호출 한도(세션당)에 도달해 조사를 계획보다 일찍 종료했다.** 해외 이슈는 5~8건 목표에 못 미치는 3건(+간단 기록 1건)만 확정했고, 국내 업종별 질의도 각 1회씩만 수행해 추가 사건이 있을 가능성을 배제할 수 없다.\n- ATT&CK는 저장소 기준 v19.2이며, SiteGuard(T1068)·Plex(T1190) 2개 사건에 신규 매핑을 추가했다. Anne Arundel 건은 초기 침투 경위가 공개되지 않아 매핑하지 않았다(저장소 관행: J분류 사건은 매핑 생략).\n- **GPT(Codex) 검토를 실시하지 못했다.** WebSearch 한도 도달로 작업을 마무리해야 했고, 비민감 요약을 구성해 검토를 요청할 시간이 없었다. 다음 작업에서 보완이 필요하다.\n\n## 출처\n\n- CISA KEV JSON 피드 (직접 확인)\n- JPCERT/CC·EG Secure Solutions 벤더 공지 인용 보도: dailysecurityreview, internet.watch.impress.co.jp, issoh.co.jp, rocket-boys.co.jp, securityonline.info\n- Plex Media Server 벤더 포럼 공지 인용(CISA KEV 노트), stack.watch, sentinelone.com\n- cybernews.com, therecord.media, thebanner.com, technical.ly, wmar2news.com (Anne Arundel County 보도)\n- 아시아투데이, 이투데이, 데일리한국, 블로터 (금감원 국정감사 10/19 보도)\n- MITRE ATT&CK v19.2(저장소 기준), 공식 사이트는 v20.0(반영 보류, [10-13 보고서](2026-10-13.md) 참고)\n"},{"path":"일일/2026-10-22.md","title":"일일 보안 이슈 분석 — 2026-10-22","md":"# 일일 보안 이슈 분석 — 2026-10-22\n\n> 수집 기준: 2026-10-22(오늘, 조사 진행 시각까지 공개분). 전날([10-21 보고서](2026-10-21.md))이 WebSearch 호출 한도로 조기 종료됐던 것과 달리, 이번에는 BleepingComputer 메인 페이지를 직접 열람(WebFetch)해 2026-10-21 당일 발표된 보안 뉴스를 확인하는 방식으로 보완했다. CISA KEV는 JSON 피드를 직접 확인했으며 10/20 등재분([10-21 보고서](2026-10-21.md) 수록) 이후 10/21~10/22 신규 등재는 없었다.\n> 근거 표기: **[확인]** 벤더·정부기관·연구자가 직접 확인 / 보도 언론 보도 / **[추정]** 본 보고서의 추정 / **[주장]** 공격자 일방 주장. **조치는 본 보고서의 권고**이며 벤더 공식 지침이 우선한다.\n> ATT&CK 기준: **저장소는 v19.2**(기존 매핑 유지). 공식 사이트 버전 점검 결과는 5번 절 참고.\n\n## 1. 오늘의 요약\n\n| # | 이슈 | CVE | 유형 | 상태 | 즉시 조치 |\n|---|------|-----|------|------|-----------|\n| 1 | PHP \"PHP2Shell\" 치명적 결함 2건 | CVE-2026-109618·109619 | 인증 없는 원격 코드 실행(RCE) | [확인] 패치 전 공격 관측(Cloudflare), 긴급 패치 공개 | PHP 8.5.12/8.4.27/8.3.36/8.2.35로 즉시 업데이트 |\n| 2 | SafePay 랜섬웨어 CISA·FBI 공동권고 | — | 랜섬웨어(이중 갈취) | [확인] 미·독·영 공동권고(AA26-293A) | VPN·엣지 장비 패치, MFA 전면 적용 |\n| 3 | UpdraftCentral(워드프레스) 키 탈취 백도어 | CVE-2026-10795(별건, 선행 결함) | 서드파티 키 탈취 → 공급망 변조 | [확인] 공격 진행 중, 벤더 수정 미공개 | UpdraftCentral 연결 키 삭제, 사이트 전수 점검 |\n| 4 | eMudhra 인증기관(CA) 중간 인증서 약한 키 | CVE-2026-111943(Go 영향분) | 인증·키 설계 결함 | [확인] 8개 인증서 폐기, 주요 브라우저 차단 | 브라우저·OS·Go 등 최신 보안 업데이트 적용 |\n| 5 | 일본 Onamae Desktop Cloud(GMO) 침해 | — | 클라우드/호스팅 공급자 침해 | [확인] GMO 확인, 서버 강제 중단 | 영향받은 서버의 비밀번호·키를 **안전한 기기에서** 교체 |\n\n## 2. 이슈별 분석\n\n### [D20261022-php2shell] PHP \"PHP2Shell\" 치명적 결함(CVE-2026-109618, CVE-2026-109619)\n> 날짜: 2026-10-21(긴급 패치 공개) · 유형: 서버 소프트웨어 취약점 · 행위자: 미귀속 · 지역: 글로벌 · 근거: 확인\n\n**쉽게 말하면**: 웹사이트 서버 쪽에서 널리 쓰이는 프로그래밍 언어 PHP 자체에 치명적 결함 2개가 발견됐습니다. 로그인조차 필요 없이 멀리서 서버에 명령을 실행시킬 수 있는 결함이라, PHP로 돌아가는 웹사이트는 사실상 전부 영향권입니다. 패치가 나오기도 전에 이미 공격이 시도되고 있었다고 Cloudflare가 확인했습니다.\n\n**먼저 할 일(초보용)**: 직접 서버를 관리한다면(또는 관리업체에 문의해) PHP를 8.5.12·8.4.27·8.3.36·8.2.35 중 내 버전대의 최신 수정판으로 지금 업데이트하세요. 당장 업데이트가 어렵다면 잠시 해당 웹사이트를 인터넷에서 내려 두는 것도 선택지입니다(영국 NCSC 권고).\n\n**개요**: PHP 보안팀은 10/20 \"내일 긴급 패치가 나온다\"고 먼저 예고했고, 10/21 실제로 패치를 냈다. 두 결함은 요청이 비정상적으로 끝날 때 PHP 내부 메모리가 손상된 상태로 남는 같은 근본 원인에서 나왔다. CVE-2026-109618은 메모리 부족 상황에서 생기는 손상을 체인으로 엮어 RCE로 이어지고, CVE-2026-109619는 \"오래된 전역 상태\" 문제로 이미 해제된 메모리를 다시 쓰는 결함(UAF)이 생겨 인증 없이 메모리 노출·RCE까지 가능하다. PHP-FPM, Apache+mod_php, php-cgi, FrankenPHP, LiteSpeed 등 웹 요청을 처리하는 모든 PHP 구성이 영향을 받으며, mod_php는 애플리케이션 코드가 실행되기도 전에 공격이 들어갈 수 있어 PHP팀이 가장 위험하다고 밝혔다. VirusTotal 집계로 인터넷에 노출된 PHP 서버가 510만 대 이상이다.\n\n**왜 일어났나**\n- 직접 원인 [확인: PHP 보안팀, 발견자 Calif·OpenAI·Wiz 보안 연구자]: 요청 비정상 종료 시 메모리 상태를 안전하게 정리하지 못하는 내부 결함.\n- 구조적 원인 [추정]: (1) PHP는 20년 넘게 누적된 코드베이스로, 메모리 관리처럼 근본적인 부분의 결함은 파생 제품(mod_php, FrankenPHP 등) 전체에 동시에 영향을 준다 (2) 패치 공개 전 예고(10/20)와 실제 공개(10/21) 사이의 틈에도 공격이 시작된 것은, 결함 정보가 완전히 비공개 상태에서도 공격자가 독자적으로 유사한 결함을 찾아 쓸 수 있음을 보여준다.\n\n**침투 경로 [확인: Cloudflare CTO]**: 패치 공개 전부터 두 결함을 겨냥한 초기 공격이 이미 관측됐다(Cloudflare가 임시 WAF 규칙으로 대응). 구체적인 공격 그룹·목적(웹셸 설치 여부 등)은 공개되지 않았다.\n\n**어떻게 조치하나**\n- 즉시: 가능하면 로그 보존 후 PHP 8.5.12/8.4.27/8.3.36/8.2.35(버전대별 최신)로 업데이트. 즉시 패치가 어려우면 임시 완화(CVE-2026-109618: `memory_limit=-1`을 변경 불가능하게 설정 + `post_max_size`를 8~32M로 제한, CVE-2026-109619: `session.upload_progress.enabled=0` 후 워커 재시작)를 적용하되 **이는 부분 완화일 뿐 패치의 대체가 아니다**(PHP 코어 개발자 공식 언급).\n- 단기: PHP 8.1 이하는 더 이상 공식 지원이 없으므로(일부 배포판 자체 백포트 확인) 지원 버전으로 전환 계획 수립. 웹 서버 로그에서 비정상 종료·크래시 패턴 점검.\n- 장기: PHP 버전을 포함한 웹 스택 전체를 패치 대상 자산 목록에 명시적으로 포함.\n- 탐지: 패치 전 공격 시도의 흔적(비정상 요청으로 인한 워커 크래시·재시작 급증)을 모니터링.\n\n**교훈**: 언어·런타임처럼 \"당연히 있는\" 기반 소프트웨어의 결함은 그 위에 올라간 모든 서비스에 동시에 영향을 준다. 패치 예고와 공개 사이의 짧은 틈도 공격 창이 될 수 있다.\n\n### [D20261022-safepay] SafePay 랜섬웨어 CISA·FBI 공동권고(AA26-293A)\n> 날짜: 2026-10-21(공동권고 발표, 활동 기간 2024-11~2026-08) · 유형: 랜섬웨어(이중 갈취) · 행위자: SafePay · 지역: 북미·남미·유럽·호주 · 근거: 확인\n\n**쉽게 말하면**: 미국 CISA·FBI·비밀경호국과 독일·영국 수사기관이 함께 \"SafePay\"라는 랜섬웨어 조직이 2024년 8월부터 전 세계 600곳 이상의 기반 시설급 기관을 공격했다고 공식 경고했습니다. 이 조직은 다른 유명 랜섬웨어 조직들이 와해된 뒤 그 자리를 메우며 몸집을 키웠습니다.\n\n**먼저 할 일(초보용)**: 내 기관이 VPN·방화벽 같은 외부 접속 장비를 쓰고 있다면, 담당자는 그 장비들이 CISA KEV(실제 악용 확인 목록)에 오른 결함을 방치하고 있지 않은지부터 확인하고, 모든 외부 접속에 다중 인증(MFA)이 빠짐없이 걸려 있는지 점검하세요.\n\n**개요**: SafePay는 2024년 8월 등장해 제휴(affiliate) 없이 자체적으로만 움직이는 랜섬웨어 조직으로, BlackCat(ALPHV)·LockBit 같은 조직들이 와해된 뒤 그 공백을 메우며 \"가장 활발한 랜섬웨어 조직 중 하나\"가 됐다(CISA 평가). 공개 유출 사이트에는 돈을 내지 않은 피해자만 올라오므로 실제 피해 기관 수는 600곳보다 많을 가능성이 있다.\n\n**왜 일어났나**\n- 직접 원인 [확인: CISA·FBI 등 공동권고]: 노출(유출)된 자격 증명으로 정상 계정처럼 로그인(무차별 대입과는 별개 경로), 무차별 대입·비밀번호 스프레이, VPN 접근 악용(권고는 특히 Mullvad VPN 관련 IP를 지목), 엣지 장비·인터넷 노출 시스템의 알려진 CVE를 자동화 스크립트로 공격하는 등 복수의 초기 침투 경로를 함께 쓴다.\n- 구조적 원인 [추정]: (1) 유명 랜섬웨어 조직이 단속·내부 분열로 사라져도 그 공백을 빠르게 메우는 신생 조직이 계속 나타나는 생태계 구조 (2) VPN·엣지 장비가 여전히 가장 흔한 초기 침투 통로로 반복 지목됨.\n\n**침투 경로 [확인: 공동권고]**: 초기 접근(자격 증명 탈취·무차별 대입·VPN 악용·엣지 장비 CVE 악용) → 내부 이동(권고는 관리 도구·권한 제한을 완화책으로 제시, 세부 이동 기법은 비공개) → 민감 문서 탈취 → 볼륨 섀도 복사본 삭제·NAS 백업 장치 초기화로 복구 방해 → 파일 암호화 후 이중 갈취(유출 위협 + 복호화 비용 요구).\n\n**어떻게 조치하나**\n- 즉시: 증거 보존 후 신고(법 집행기관), **몸값을 내도 복구가 보장되지 않는다**는 점을 의사결정에 반영(CISA 명시).\n- 단기: VPN·방화벽 등 엣지 장비의 KEV 등재
