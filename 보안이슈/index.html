은 암호화폐 지갑을 사칭한 도메인에서 추가 코드를 받아왔다. **다만 Sansec는 최종적으로 어떤 데이터를 빼가는지(결제 카드 정보를 훔치는 \"스키머\"인지 등)는 직접 확인하지 못했다고 밝혔다** — 따라서 이 보고서도 \"카드 정보 탈취\"를 단정하지 않는다.\n\n**왜 일어났나**\n- 직접 원인 [확인]: Adobe Commerce·Magento가 업로드 파일의 형식을 제대로 제한하지 않아, 업로드 권한을 가진 사용자(2차 보도에 따르면 비회원 포함 가능)가 서버가 실행 가능한 파일을 올릴 수 있었다(CISA·Adobe 확인). 비회원도 인증 없이 악용 가능했는지의 세부 조건은 2차 보도 수준으로만 확인됐다.\n- 구조적 원인 [추정 — 확인된 사실이 아니라 일반적인 위험 가설]: (1) 패치가 7월에 나왔음에도 10월까지도 일부 쇼핑몰이 같은 캠페인에 감염된 상태로 남아 있었다는 사실은, 전자상거래 운영사들이 핵심 매출 시스템인 쇼핑몰 패치를 뒤로 미루는 경향이 있고(다운타임 우려 등), 패치를 적용해도 이미 심어진 악성 코드·백도어 계정을 같이 치우지 않으면 재감염된다는 점을 보여준다(이번 사건에서 실제로 \"패치 지연\" 때문이었는지, 아니면 \"패치했지만 기존 침투 흔적이 남아 있었던\" 재감염인지, 혹은 다른 결함(SessionReaper 등)을 통한 재침투인지는 보도에서 구분되지 않았다). (2) 비회원도 쓸 수 있는 공개 업로드 기능은 공격 표면이 넓어, 개발 단계에서 입력 검증을 놓치면 전 세계 동일 플랫폼 사용자 전체가 동시에 노출된다.\n\n**침투 경로 [확인 — 취약점 유형 / 세부 메커니즘은 보도 수준]**: 취약점 자체는 CISA·Adobe가 \"제한 없는 위험 파일 업로드\" 유형으로 확인했다. 공격자가 구체적으로 어떤 요청 경로(2차 보도는 \"손님 장바구니 REST API\"로 설명)로 파일을 올렸는지, 그 파일이 실제로 webshell 형태였는지는 1차 출처로 직접 확인하지 못했다. 확인된 것은 업로드된 코드를 통해 쇼핑몰 페이지에 악성 자바스크립트 로더가 삽입됐다는 결과뿐이며, 개별 쇼핑몰이 정확히 어떤 순서로 당했는지 같은 세부 포렌식 정보는 공개되지 않았다.\n\n**어떻게 조치하나**\n- 즉시: (본 보고서의 권고) Adobe Commerce·Magento 운영 조직은 외부 노출을 줄이고(WAF 규칙 적용 등) APSB26-73 이후 모든 패치를 신속히 적용한다 — 점검을 이유로 패치를 늦추지 않되, 가능한 범위에서 증거(웹 서버 로그, 업로드 디렉터리 변경 이력)를 함께 보존한다. 패치만으로 이미 설치된 악성 코드나 생성된 관리자 계정이 사라지지는 않으므로 침해 흔적 점검을 병행한다.\n- 단기: 사이트 소스에서 Sansec가 보고한 로더 패턴·낯선 외부 도메인 호출 여부를 점검하고, 관리자 계정 목록에서 모르는 계정을 전부 제거한다. 노출 가능성이 있던 기간의 관리자·연동 비밀번호와 API 키는 깨끗한(감염 의심이 없는) 관리 환경에서 폐기·교체하고, 새 자격 증명을 감염 의심 서버에 입력·배포하지 않는다. 침해가 확인되면 신뢰 가능한 백업·이미지로 재구축하는 방안도 검토한다.\n- 장기: 손님(비회원)도 접근 가능한 API 엔드포인트는 업로드 가능한 파일 형식·크기·실행 권한을 서버 설정 단에서 제한하고(예: 업로드 디렉터리의 스크립트 실행 금지), 전자상거래처럼 매출과 직결된 시스템도 일반 시스템과 동일한 패치 SLA를 적용한다.\n- 탐지: 웹 애플리케이션 방화벽(WAF)으로 비정상적인 파일 업로드 요청을 탐지하고, 쇼핑몰 프런트엔드에 삽입된 미승인 스크립트·외부 도메인 호출을 주기적으로 스캔한다.\n\n**교훈**: 벤더가 패치를 내고 \"실제 악용 사례 없음\"이라고 밝혀도, 그 결함을 노린 캠페인이 이미 조용히 몇 달째 진행 중일 수 있다. 패치 공개 이후에도 실제 악용 여부를 계속 추적해야 하는 이유다.\n\n### 참고 기록 — Node2Shell(Brotli 디코더 결함), CISA KEV 등재로 실제 악용은 공식 확인됐으나 ATT&CK 매핑은 유지(CVE-2026-111497)\n\n[D20261024-node2shell](2026-10-24.md) 사건의 Node.js/Bun Brotli 디코더 결함(CVE-2026-111497)이 2026-10-27 CISA KEV에 Adobe Commerce 결함과 함께 신규 등재됐다. CISA는 해당 경보에서 두 건 모두 \"실제 악용 증거를 근거로\" 등재했다고 밝혔다(1차 출처, CISA KEV JSON 피드로 직접 재확인). 이는 10/24~27 보고서들이 기록했던 \"연구자 PoC는 성공했으나 실제 공격(ITW) 사례는 보도 시점까지 확인되지 않았다\"는 상태에서 벗어나, 이 CVE가 **실제로 악용되고 있다는 사실 자체는 미국 정부 차원에서 공식 확인된 것**이다. 다만 Brotli 디코더 결함은 서버가 요청 본문을 해제하는 인바운드 경로(T1190에 해당하는 \"공개 웹앱 공격\")와, 클라이언트가 응답을 해제하는 아웃바운드 경로(별개 메커니즘, 이 매핑 범위에서 계속 제외) 양쪽에서 문제가 될 수 있는데, CISA 경보 자체는 실제로 어느 경로가 악용됐는지 명시하지 않았다. \"KEV 등재=실제 악용 확인\"이 곧바로 \"T1190 경로로 악용됐다는 확인\"을 의미하지는 않는다고 판단해, 기존 매핑(TA0001\\|T1190)의 근거 등급은 **후보로 유지**하고 설명만 갱신했다(분류 A는 유지). .NET·Python 영향 범위, 패치 버전 등 그 외 사실관계는 기존 보고서 내용을 그대로 유지한다.\n\n## 3. 국내 소식\n\n**국내 질의 결과**: 지침에 따라 ①금융권 ②통신·이커머스 ③공공·지자체·교육·의료 ④국내 랜섬웨어 ⑤정부 발표 ⑥기존 사건 규모 갱신, 총 6개 범주를 각각 검색했다(검색어에 \"2026년 10월\" 포함). ①금융권(검색어: \"2026년 10월 금융권 해킹 개인정보 유출 은행 카드 저축은행\")은 10/14~15 집계(16개사·약 10만 건)보다 새로운 수치를 찾지 못했다 — 이미 [10-26](2026-10-26.md)·[10-27](2026-10-27.md) 보고서까지 기록된 내용과 동일하다. ②통신·이커머스(검색어: \"2026년 10월 쿠팡 티빙 통신사 침해사고 개인정보 유출\")는 10월 신규 침해사고를 찾지 못했고, 결과는 모두 기존 티빙 사건(최종 집계 3,954만 계정·피해 1,953만 명)의 재인용이었다. ③공공·지자체·교육·의료(검색어: \"2026년 10월 공공기관 대학 의료기관 개인정보 유출 해킹\")는 10월 신규 사건을 찾지 못했고, 검색된 것은 모두 과거 사건(2026-01 해킹포럼 탈취, 2024년 전북대 사건, 2021년 서울대병원 사건 등)의 재인용이었다. ④국내 랜섬웨어(검색어: \"2026년 10월 국내 랜섬웨어 피해 기업\")는 10월 신규 피해를 찾지 못했다 — 검색 결과는 4월 중소기업 대상 공격(경찰청·중기부·KISA 공동 발표)의 재인용과 해외(일본·글로벌) 통계뿐이었다. ⑤정부 발표(검색어: \"과기정통부 KISA 개인정보보호위원회 금융위 금감원 2026년 10월 발표 제재\")는 10/24~28 구간의 신규 발표를 찾지 못했다. 10/13 국정감사 발언과 10/1 금융위 「신용정보업감독규정」 개정 예고는 이미 [10-26](2026-10-26.md)·[10-27](2026-10-27.md) 보고서에 기록돼 있어 중복 추가하지 않았다. ⑥기존 사건 규모 갱신(검색어: \"금융권 해킹 16개사 추가 집계 10월 27일 28일 금융감독원\")은 10/14~15 보도 이후의 추가 갱신 기사를 찾지 못했다 — 당국은 \"사고 금융사 수가 더 늘어날 수 있다\"고 밝힌 상태가 계속 유지되고 있을 뿐, 확정된 갱신치는 없다.\n\n오늘 조사에서도 사건으로 등록할 만큼 크고 새로운 국내 사건·수치는 확인되지 않았다(6개 범주 모두 기존 보고서 내용과 동일하거나 더 오래된 자료만 확인됨).\n\n## 4. 우선 대응 체크리스트\n\n1. **Adobe Commerce·Magento 운영 조직(최우선, 신규)**: [D20261028-polyshell](#d20261028-polyshell-adobe-commercemagento-polyshell-파일-업로드-결함--cisa-kev-등재-953개-쇼핑몰-장기-감염-캠페인-확인cve-2026-48356) 패치(APSB26-73 이후 전체) 적용 여부 즉시 확인 — CISA KEV 등재, 연방 기한 2026-11-10. 패치 전 침해 흔적(수상한 관리자 계정·스크립트) 점검 선행.\n2. **Node.js·Bun·.NET·Python(Brotli 압축 해제 사용) 조직**: [D20261024-node2shell](2026-10-24.md) 패치 적용 여부 재확인 — CISA KEV 등재로 실제 악용 자체가 공식 확인돼 긴급도가 한 단계 올라갔다(다만 어느 경로로 악용됐는지는 비공개).\n3. [10-17](2026-10-17.md)~[10-27](2026-10-27.md) 보고서의 Ivanti·Atlassian·Ahsay·PAN-OS·Cisco SEG·BeyondTrust·Fortinet·SiteGuard·Plex·Siemens·UpdraftCentral·eMudhra·Onamae·커넥트와이즈·Arista VCO·LiteLLM·GitLab·Collabora·HPE ArubaOS·PHP2Shell — 기한이 지났거나 임박한 건이 많으므로 미조치 상태라면 우선 처리.\n4. **코펜하겐대학교 관계자(해외 참고)**: [10-27](2026-10-27.md) 안내받은 출입 PIN 재발급을 즉시 적용.\n\n## 5. 검증 수준과 한계\n\n- CISA KEV는 JSON 피드를 직접 받아 10/27 등재분(Adobe Commerce/Magento, Brotli 2건)을 확인했고, 확인 시점까지 10/28 신규 등재는 없었다(1차 출처).\n- CISA 공식 경보 원문(2026-10-27)을 WebFetch로 직접 열람해 KEV 등재 근거·BOD 26-04 관련 내용을 확인했다(1차 출처). 등재 사유에 구체적인 공격 사례·피해 기업명은 명시돼 있지 않았다.\n- PolyShell(CVE-2026-48356) 캠페인 세부 내용(953개 쇼핑몰, 타임라인)은 SecurityWeek 기사(2차 보도, Sansec 연구 인용)를 WebFetch로 직접 열람해 확인했다. Sansec·Adobe의 원문은 직접 열람하지 못했다. 최종 악성 코드가 정확히 무엇을 하는지(결제 정보 탈취 여부)는 Sansec도 확인하지 못했다고 보도됐다.\n- PolyShell의 CVSS 점수는 검색 결과마다 9.3~9.6으로 달랐고, \"손님 장바구니 REST API를 통한 비인증 업로드\"라는 구체적 공격 경로도 2차 보도 수준으로만 확인돼 이 보고서는 특정 수치·세부 경로를 단정하지 않았다. 같은 이유로 ATT&CK 매핑에서 T1505.003(웹셸)은 실제 설치된 웹셸 파일의 직접 증거가 없어 '확인'이 아닌 '후보'로 표기했다.\n- 국내 질의 6개 범주 모두 WebSearch만으로 수행했고(전문 매체 직접 열람은 이번 조사에서 하지 못함), 결과 없음이 \"사건이 실제로 없다\"는 뜻인지 \"아직 보도되지 않았다\"는 뜻인지는 구분할 수 없다.\n- 검토했으나 채택하지 않음: SonicWall SMA1000 제로데이(CVE-2026-15409·15410, Inc 랜섬웨어 연계 보도)는 2026년 7월 공개된 사건으로 오늘 기준 새로운 전개를 찾지 못해 공백일 사건으로 다루지 않았다(이미 3개월 이상 지난 사건이며 본 저장소의 과거 기록 여부는 이번 조사에서 확인하지 못했다).\n- 해외 랜섬웨어·대형 유출 일반 검색(BleepingComputer 등)에서는 10월 27~28일 날짜로 명확히 특정되는 추가 대형 사건을 찾지 못했다.\n\n## 출처\n\n- CISA KEV JSON 피드 (직접 확인)\n- CISA 공식 경보(직접 열람): \"CISA Adds Two Known Exploited Vulnerabilities to Catalog\" (2026-10-27)\n- SecurityWeek(직접 열람): \"953 Online Stores Infected in Long-Lasting Malware Campaign\" (PolyShell/CVE-2026-48356, Sansec 연구 인용)\n- MITRE ATT&CK v19.2(저장소 기준, v20.0 공식 전환은 유지 확인됨, 재매핑 보류)\n"},{"path":"일일/2026-10-29.md","title":"일일 보안 이슈 분석 — 2026-10-29","md":"# 일일 보안 이슈 분석 — 2026-10-29\n\n> 수집 기준: 2026-10-29(오늘, 조사 진행 시각까지 공개분). 전날(10/28) 보고서까지 공백 없이 이어진다. CISA KEV는 JSON 피드를 직접 확인했으며 10/28 신규 등재 2건(Broadcom VMware ESX, Linux Kernel \"Fragnesia\")을 확인했다(1차 출처). 해외 소식은 BleepingComputer·TheHackerNews 메인 페이지를 WebFetch로 직접 열람해 확인했고, 세부 내용은 WebSearch로 교차 확인했다. 국내 소식은 WebSearch로 6개 범주를 각각 확인했다(언론사 직접 열람은 이번 조사에서 하지 못함).\n> 근거 표기: **[확인]** 벤더·정부기관·연구자가 직접 확인 / 보도 언론 보도 / **[추정]** 본 보고서의 추정 / **[주장]** 공격자 일방 주장. **조치는 본 보고서의 권고**이며 벤더 공식 지침이 우선한다.\n> **ATT&CK 버전 점검**: attack.mitre.org 직접 확인 결과 공식 버전은 여전히 **v20.0**이다(10/26~28 확인분과 동일, 추가 변경 없음). 이 저장소는 당분간 **v19.2 매핑을 유지**하며 임의로 대규모 재매핑하지 않는다.\n\n## 1. 오늘의 요약\n\n| # | 이슈 | CVE | 유형 | 상태 | 즉시 조치 |\n|---|------|-----|------|------|-----------|\n| 1 | PHP2Shell + \"Fragnesia\" 커널 결함 체인으로 방화벽·관리서버 25대 루트 탈취(美 정부 관련 기관 포함) | CVE-2026-109618·109619, CVE-2026-46300 | 공개 웹앱 RCE → 커널 권한상승 → 웹셸·AD 정찰 | [확인] CISA KEV 2건 신규 등재, Dream 연구(보도 인용) | PHP2Shell 패치(기한 **오늘 10/29**)·커널 패치(기한 10/31) 둘 다 적용 |\n| 2 | 중국계 Volt Typhoon, 폐기형 중계망 \"Silent Train\"으로 제로데이 공격 은닉 | CVE-2026-16812 등 4건 | 국가배후 스텔스 C2·중계 인프라 | [확인] Lumen Black Lotus Labs 연구 | 통신·국방·공공·인프라 기관은 경계장비 관리 인터페이스 외부 노출 점검 |\n| 3 | Oracle E-Business Suite 신규 SQL인젝션→RCE 결함, 패치 직후 정찰 스캐닝 포착 | CVE-2026-101767 | 공개 웹앱 비인증 SQL인젝션 | [확인] Oracle 패치, 정찰 스캐닝만 보도 확인(성공 공격 미확인) | 2026-10 CPU(10/20) 즉시 적용 |\n| 4 | 소니 자회사(일본 ISP) So-net 유출, 약 259만 건(NTT도코모 일부 포함) | — | ISP 회원 DB 침해(경위 미공개) | [확인] 소니 네트워크 커뮤니케이션즈 확인 | 영향받은 계정 비밀번호를 **안전한 기기에서** 교체 |\n\n오늘은 새 사건 4건을 기록한다. 또한 [D20261022-onamae](2026-10-22.md)(일본 GMO Desktop Cloud 침해) 사건에 랜섬 협박 관련 후속 보도가 있어 참고 기록으로 추가한다.\n\n## 2. 이슈별 분석\n\n### [D20261029-php2shellroot] PHP2Shell + Linux 커널 \"Fragnesia\" 결함 체인으로 방화벽·관리서버 25대 루트 권한 탈취, 美 정부 관련 기관 포함(CVE-2026-109618, CVE-2026-109619, CVE-2026-46300)\n> 날짜: PHP2Shell 공개 2026-10-21 · CISA KEV 등재(PHP2Shell) 2026-10-26, 기한 2026-10-29 · 실제 공격 관측 2026-10-25(Dream 보도) · CISA KEV 등재(Fragnesia) 2026-10-28, 기한 2026-10-31 · 유형: 공개 웹앱 원격 코드 실행 → 커널 결함으로 root 권한 상승 → 웹셸·자격증명 탈취 · 행위자: 미귀속(중국계 추정 보도, 북한계 스캐닝 별도 보도 — 둘 다 결론 아님) · 지역: 전 세계(해외, 피해 기관 1곳은 미국 정부 관련) · 근거: 확인(CISA KEV 공식 경보 2건, Dream 연구 보도 인용)\n\n**쉽게 말하면**: 지난주 전 세계 웹사이트의 약 70%가 쓰는 프로그래밍 언어 PHP에서 로그인 없이도 서버를 장악할 수 있는 결함(PHP2Shell)이 발견돼 긴급 패치가 나왔습니다. 그런데 공격자들이 이 결함 하나만으로는 \"서버 프로그램 권한\"만 얻을 수 있었던 것을 노려, 리눅스 운영체제 자체의 또 다른 결함(연구자들이 \"Fragnesia\"라고 이름 붙인 결함)을 추가로 써서 \"컴퓨터 전체를 마음대로 할 수 있는 최고 권한(root)\"까지 올라간 사실이 보안업체 Dream(이스라엘)의 조사로 확인됐습니다. 이 방식으로 방화벽 장비 24대와 내부 관리서버 1대, 총 25대가 뚫렸고, 그중 3대는 미국 정부와 관련된 기관의 장비였습니다. 공격자는 그 안에서 비밀번호·개인 키를 훔치고 회사 내부 사용자 목록(Active Directory)까지 들여다봤습니다. 미국 정부(CISA)는 이 두 가지 결함 모두를 \"실제로 악용되고 있다\"고 공식 확인해 위험 목록에 올렸고, 첫 번째 결함(PHP2Shell)은 오늘(10/29)까지, 두 번째 결함(Fragnesia)은 10/31까지 미국 연방기관에 조치를 요구했습니다.\n\n**먼저 할 일(초보용)**: PHP를 쓰는 웹서버나, 이 결함이 적용될 수 있는 방화벽·보안장비를 운영한다면 두 가지 패치(PHP 8.5.12/8.4.27/8.3.36/8.2.35, 그리고 해당 리눅스 커널 최신 보안판) **모두**를 지금 바로 적용하세요. 하나만 막으면 나머지 하나로 똑같이 뚫릴 수 있습니다. 이미 공격받은 기기라면 비밀번호·키를 그 기기가 아닌 **다른 안전한 기기에서** 새로 만들어야 합니다 — 뚫린 기기에서 비밀번호만 바꾸면 공격자가 이미 심어둔 뒷문은 그대로 남습니다.\n\n**개요**: PHP 개발팀은 2026-10-21 두 개의 치명적 결함(CVE-2026-109618·109619, 통칭 \"PHP2Shell\", CVSS 9.2)에 대한 긴급 패치를 냈다. 로그인 없이 단 한 번의 HTTP 요청만으로 PHP를 실행하는 서버 프로세스 권한에서 임의 코드를 실행시킬 수 있는 결함이다. Amazon 위협 인텔리전스는 패치 공개보다 4일 앞선 10/17부터 공격 시도가 있었다고 밝혔고, CISA는 10/26 이 2건을 KEV(실제 악용 확인 취약점 목록)에 등재했다(기한 2026-10-29). 이스라엘 보안업체 Dream은 10/26 별도 조사 결과를 발표했는데, 공격자가 PHP2Shell로 얻은 \"PHP 프로세스 권한\"만으로는 장비 전체를 장악할 수 없다는 한계를 넘기 위해, 리눅스 커널의 또 다른 결함(CVE-2026-46300, 연구자 명명 \"Fragnesia\")을 연쇄로 사용했다고 확인했다. Fragnesia는 커널의 XFRM ESP-in-TCP(네트워크 암호화 처리) 경로에서 변수 초기화가 빠진 결함으로, 낮은 권한의 로컬 공격자가 읽기 전용으로 설정된 파일의 메모리 캐시(page cache) 내용을 조작해 root 권한까지 올라갈 수 있게 한다 — CISA 경보 원문도 이 결함이 \"CVE-2026-109618·109619와 체이닝돼 PHP 웹셸을 심고 root 권한으로 명령을 실행하는 데 쓰일 수 있다\"고 명시했다(1차 출처). CISA는 10/28 Fragnesia를 KEV에 추가 등재했다(기한 2026-10-31). Dream은 이 체인으로 방화벽 24대와 내부 관리 서버 1대, 총 25대가 루트 권한까지 넘어간 것을 확인했다고 밝혔다(일부 2차 보도는 미국 정부 관련 기관 피해 서버 수를 3대가 아닌 2대로 다르게 보도해 수치가 완전히 일치하지는 않는다). 공격받은 방화벽 소프트웨어의 제조사·제품명은 Dream도 공개하지 않았으며(제조사에 통보했다고만 밝힘), 이번 조사에서 1차 확인하지 못했다. 미국 정부 관련 기관 환경에서는 공격자가 지속적인 통신 터널을 구축하고 자격 증명·개인 키를 탈취했으며 Active Directory 계정 목록을 열거(enumeration)한 흔적이 복구됐다. 일부 보도는 이 공격을 \"AI 보조 공격으로 보인다\"고 설명했으나, 구체적으로 어떤 단계에 AI가 쓰였는지에 대한 근거는 이번 조사에서 확인하지 못했다 — **따라서 본 보고서는 'AI 보조'를 단정하지 않는다.** 공격자 귀속에 대해서도 일부 연구자는 중국계 가능성을, 별도 보도(Cyfirma)는 북한계로 추정되는 스캐닝 활동을 각각 보고했으나 **둘 다 결론이 아니다.**\n\n**왜 일어났나**\n- 직접 원인 [확인]: (1) PHP가 요청 처리 중 메모리 부족·내부 상태 재사용 관련 결함으로 비인증 코드 실행을 허용했다(PHP 보안팀 확인). (2) 리눅스 커널이 특정 네트워크 암호화 처리 경로에서 변수를 초기화하지 않아, 이미 PHP 프로세스 권한을 얻은 공격자가 읍기 전용 파일의 캐시를 조작해 root로 올라갈 수 있었다(CISA·Red Hat 설명).\n- 구조적 원인 [추정 — 확인된 사실이 아니라 분석]: PHP 결함을 정상적으로 패치하면 그 경로를 통한 **새로운** 최초 침투는 막힌다. 다만 이미 그 경로(또는 다른 경로)로 PHP 프로세스 권한을 얻은 공격자가 남아 있다면, 아직 패치되지 않은 커널 결함으로 권한을 상승시킬 수 있다. 방화벽처럼 PHP·커널이 함께 내장된 장비는 제조사가 두 패치를 내는 시점이 다를 수 있어, 그 사이 잔여 위험이 이어질 수 있다(다만 이번 방화벽 제조사가 실제로 패치가 늦었는지는 공개되지 않아 확정할 수 없다 — 이는 일반적인 위험 조건에 대한 분석이며 이번 사건에서 확인된 원인이 아니다).\n\n**침투 경로 [확인 — CISA 경보 원문과 연구 보도 교차 확인]**: ① 공개된 네트워크 인터페이스에 단 한 번의 비인증 HTTP 요청으로 PHP2Shell 결함을 트리거해 PHP 프로세스 권한으로 코드 실행(CVE-2026-109618·109619). ② 같은 장비에서 Fragnesia 결함(CVE-2026-46300)을 추가로 써 root 권한까지 상승(CISA 경보가 이 체이닝을 직접 명시). ③ root 권한으로 웹셸을 심어 지속 접근을 확보하고, 자격 증명·개인 키 탈취 및 Active Directory 열거를 수행. 공격받은 방화벽의 구체적 제품·버전은 공개되지 않았다.\n\n**어떻게 조치하나**\n- 즉시: (본 보고서의 권고) PHP 사용 서버는 8.5.12/8.4.27/8.3.36/8.2.35로, 해당 커널을 쓰는 리눅스 시스템·방화벽 장비는 벤더가 배포한 Fragnesia 수정판으로 **둘 다** 업데이트한다. 패치 전에 가능한 범위에서 로그(웹서버·커널 감사 로그)와 메모리 덤프를 보존하되, 보존을 이유로 패치를 늦추지 않는다. 이미 침해가 의심되면 패치만으로 기존 웹셸·백도어 계정이 사라지지 않으므로 별도 점검이 필요하다.\n- 단기: root 권한 탈취 흔적(알 수 없는 웹셸 파일, 예상치 못한 커널 모듈·캐시 변조)을 점검하고, 영향 가능 기간 동안 쓰인 자격 증명·API 키·개인 키는 감염 의심이 없는 깨끗한 환경에서 폐기·교체한다(침해된 장비 안에서 새 비밀을 만들지 않는다). Active Directory 계정 변경 이력·비정상 로그인을 점검한다.\n- 장기: 방화벽 등 경계 보안장비도 일반 서버와 같은 패치 SLA를 적용하고, 공급사에 커널·내장 소프트웨어 버전의 패치 지원 주기를 확인한다. 공개 인터페이스에서 관리 콘솔·API를 분리해 노출을 최소화한다.\n- 탐지: CISA가 공개한 SIGMA 탐지 규칙(PHP2Shell 공격 시도용)을 적용하고, 커널 이상 동작(의도치 않은 파일 수정, 권한 없는 프로세스의 root 전환)을 모니터링한다.\n\n**교훈**: 급하게 공개된 결함 하나만 막으면 안전하다고 생각하기 쉽지만, 공격자는 애초에 \"권한 상승용 2차 결함\"을 함께 준비해 두는 경우가 많다. 패치는 체인 전체를 봐야 한다.\n\n### [D20261029-silenttrain] 중국계 Volt Typhoon, 폐기형 중계망 \"Silent Train\"으로 제로데이 공격 흔적 은닉(CVE-2026-16812 등)\n> 날짜: 활동 관측 지속(3년 이상, 2025년 초부터 하이브리드 구조로 전환) · 보도 2026-10-28 · 유형: 국가배후 스텔스 중계 인프라·제로데이 공격 · 행위자: 중국 정부 배후 추정 Volt Typhoon(美 정부·연구기관 과거 지정) · 지역: 미국·아시아태평양(해외) · 근거: 확인(Lumen Black Lotus Labs 연구, 보도 인용)\n\n**쉽게 말하면**: 중국 정부와 연계된 것으로 알려진 해킹 조직 Volt Typhoon이 \"Silent Train\"이라는 이름의 중계 네트워크를 3년 넘게 운영해 온 사실이 통신회사 Lumen의 보안연구팀(Black Lotus Labs)에 의해 공개됐습니다. 이 조직은 해외 서버와 해킹한 가정용 라우터를 여러 단계로 엮어 공격 출처를 가리고, 한 작업이 끝나면 8시간 안에 설치한 도구와 흔적을 전부 지워버립니다. 동시에 기업·기관이 쓰는 네트워크 관리 장비(VeloCloud, Cisco SD-WAN, N-able, Versa Director 등)의 공개되지 않은 결함(제로데이) 4건 이상을 실제로 악용해 침투했습니다. 통신·국방·공공기관·교육·전력 등 미국의 핵심 인프라가 주요 표적이었고, 특히 캘리포니아·텍사스·하와이가 많이 공격받아 아시아태평양 관련 목적이 있는 것으로 분석됩니다.\n\n**먼저 할 일(초보용)**: 조직에서 VeloCloud Orchestrator·Cisco Catalyst SD-WAN·N-able N-central·Versa Director 같은 네트워크 관리 솔루션을 쓴다면, 관리 인터페이스가 인터넷에 그대로 노출돼 있는지부터 확인하고 바로 차단하세요. 일반 가정에서는 집에서 쓰는 와이파이 공유기(라우터)의 관리자 비밀번호를 기본값에서 바꾸고 최신 펌웨어로 업데이트하는 것이 이런 중계망에 이용되는 것을 막는 첫걸음입니다.\n\n**개요**: Lumen의 위협연구팀 Black Lotus Labs는 2026-10-28, 중국 국가배후 해킹조직 Volt Typhoon이 \"Silent Train\"이라는 폐기형(disposable) 중계 인프라를 3년 이상 운영해 왔다고 공개했다. 공격자는 미국 외 지역의 VPS(가상서버)와, 노출된 관리 인터페이스를 가진 가정용·소호(SOHO)용 라우터(Intelbras 모뎀을 해외 중계, Netgear Orbi 기기를 미국 내 중계로 사용)를 여러 단계로 엮어 공격 출처를 숨겼다. 2025년 초부터는 이런 \"쓰고 버리는\" 중계 외에, 기업용 관리 인프라를 1~3개월 유지하는 하이브리드 구조로 전환됐다고 확인됐다. 연구팀은 이 과정에서 최소 4건의 제로데이(VeloCloud Orchestrator CVE-2026-16812, Cisco Catalyst SD-WAN CVE-2026-20127, N-able N-central CVE-2025-8875·8876, Versa Director CVE-2024-39717)가 실제 공격에 쓰인 것을 확인했고, Quest KACE에서도 제로데이로 추정되는 활동을 추가로 관측했다. 이런 관리 솔루션을 장악하면 폭넓은 관리자 권한을 얻어 자격 증명 탈취·원격 접속·하위 고객망 침투까지 가능해진다. 표적은 통신·정부기관·국방 하청업체·교육기관·전력 등 핵심 인프라·위성사업자·IT/MSP·운송·항공·긴급구조 등 광범위했고, 미국 내에서는 캘리포니아·텍사스·하와이가 가장 많이 공격받아 인도·태평양 관련 임무 지원 목적이라는 분석이 제시됐다. 보도는 2024년 FBI의 KV-Botnet(Volt Typhoon이 쓰던 이전 봇넷) 단속이 오히려 이 Silent Train 구조로의 전환을 가속했을 가능성을 제시했으나, Silent Train 자체가 단속·차단됐다는 내용은 이번 보도에 없다.\n\n**왜 일어났나**\n- 직접 원인 [확인]: 네트워크 관리 솔루션(SD-WAN 오케스트레이터, RMM 도구 등)의 제로데이 결함이 공격자에게 초기 침투와 폭넓은 관리자 권한을 동시에 제공했다.\n- 구조적 원인 [추정 — 분석]: (1) 기업이 외부 MSP·벤더에 맡기는 중앙화된 관리 인프라는 한 번 뚫리면 그 아래 연결된 모든 고객망에 영향을 줄 수 있는 구조적 취약점이다. (2) 가정용 라우터처럼 보안 관리가 거의 안 되는 수많은 소형 기기가 인터넷에 노출돼 있다는 사실 자체가, 국가배후 조직이 \"값싸고 추적하기 어려운\" 중계망 재료로 쓸 수 있게 해 준다. (3) 법 집행기관의 봇넷 단속이 공격자의 기술을 \"더 정교하고 추적하기 어려운\" 방향으로 진화시키는 역효과를 낳을 수 있다는 점도 이번 사례가 보여준다(단, 이것이 이번 전환의 유일한 원인인지는 확인되지 않았다).\n\n**침투 경로 [확인 — 연구 보도 기준]**: 노출된 관리 인터페이스를 가진 경계·관리 장비(SD-WAN 오케스트레이터, RMM 솔루션)의 제로데이를 악용해 초기 침투하고, 이후 노출된 SOHO·IoT 기기의 관리 인터페이스를 악용해 임시 SSH 서비스·키를 설치하는 방식으로 중계망을 구성했다. 개별 피해 기관의 세부 포렌식(정확히 어떤 벡터로 각 장비가 뚫렸는지)은 공개되지 않았다.\n\n**어떻게 조치하나**\n- 즉시: (본 보고서의 권고) VeloCloud Orchestrator·Cisco Catalyst SD-WAN·N-able N-central·Versa Director·Quest KACE 운영 조직은 관리 인터페이스의 인터넷 노출 여부를 즉시 점검하고 차단하며, 해당 벤더의 최신 보안 패치를 적용한다. 노출됐던 기간의 관리자 자격 증명은 깨끗한 환경에서 교체한다.\n- 단기: 중앙화된 관리 시스템의 로그를 장기 보관 체계로 옮기고, 비정상적인 관리 활동(새 계정 생성, 설정 변경, 짧은 SSH 세션 등)을 점검한다.\n- 장기: 다운스트림 고객·협력사와의 신뢰 연결(trusted connection)을 주기적으로 재검토하고, 가정용·소호용 네트워크 장비는 기본 비밀번호 변경과 펌웨어 자동 업데이트를 기본값으로 설정한다.\n- 탐지: 관리 인터페이스에 대한 비정상 접근, 8시간 이내에 생성·삭제되는 임시 SSH 키·서비스 같은 \"흔적을 스스로 지우는\" 패턴을 탐지 규칙에 반영한다.\n\n**교훈**: 국가배후 조직은 단속으로 도구를 잃으면 사라지지 않고 더 교묘한 구조로 재등장한다. 핵심 인프라를 운영하는 조직은 \"공격받은 적이 없다\"를 \"안전하다\"로 오해해서는 안 된다.\n\n### [D20261029-oracleebs] Oracle E-Business Suite 신규 SQL인젝션→RCE 결함, 패치 직후 정찰 스캐닝 포착(CVE-2026-101767)\n> 날짜: Oracle 패치 공개 2026-10-20(2026년 10월 CPU) · 정찰 스캐닝 관측 보도 2026-10-27 · 유형: 공개 웹앱 비인증 SQL 인젝션 → 원격 코드 실행 가능 · 행위자: 미귀속(정찰 단계) · 지역: 전 세계(해외) · 근거: 확인(Oracle 패치)·보도(정찰 스캐닝)\n\n**쉽게 말하면**: 기업이 회계·인사 등에 널리 쓰는 Oracle E-Business Suite(EBS) 소프트웨어에서, 로그인 없이도 데이터베이스 명령을 끼워 넣어(SQL 인젝션) 결국 서버에서 임의 명령까지 실행할 수 있는 심각한 결함이 발견돼 10월 20일 패치가 나왔습니다. 아직 실제로 이 결함을 이용해 성공적으로 뚫린 사례는 확인되지 않았지만, 보안회사가 설치해 둔 '가짜 서버(디코이)'에서 공격자들이 패치 일주일 만에 이 결함을 겨냥해 찔러보는(정찰) 시도를 포착했습니다.\n\n**먼저 할 일(초보용)**: Oracle E-Business Suite를 운영한다면 2026년 10월 Critical Patch Update(CVE-2026-101767 포함)를 지금 바로 적용하세요. Oracle은 과거 EBS 공격 중 다수가 \"이미 나와 있던 패치를 적용하지 않아서\" 성공했다고 밝힌 바 있어, 패치 지연이 가장 큰 위험 요인입니다.\n\n**개요**: Oracle은 2026-10-20 발표한 10월 정기 보안 패치(Critical Patch Update)에서 E-Business Suite의 Application Object Library 핵심 구성요소에 있는 CVE-2026-101767을 수정했다. 보안업체 Horizon3.ai는 이 결함을 \"Thin Client Framework 서블릿의 비인증 SQL 인젝션\"으로 설명했으며, 공격자가 데이터베이스 계정(APPS) 권한으로 SQL을 실행한 뒤 이를 발판으로 운영체제 명령까지 실행할 수 있는 구조라고 밝혔다. 위협 인텔리전스 업체 Defused는 10/27, 자사가 운영하는 EBS 디코이(가짜 취약 서버)에서 이 결함을 겨냥한 \"탐색적 익스플로잇 시도\"가 기록됐다고 보도됐다. 보안 스캐닝 기관 Shadowserver는 인터넷에 노출된 Oracle EBS 인스턴스를 670개 이상(대부분 미국) 추적 중이라고 밝혔으나, 이 중 몇 개가 실제 운영 서버이고 몇 개가 이미 패치됐는지는 파악하지 못했다. **보도 시점까지 이 결함을 이용한 성공적 침해 사례는 확인되지 않았다** — 관측된 것은 스캐닝·탐색 수준이다.\n\n**왜 일어났나**\n- 직접 원인 [확인]: EBS의 특정 서블릿이 사용자 입력을 제대로 검증하지 않아 비인증 상태에서 SQL 인젝션이 가능했고, 이를 통해 얻은 데이터베이스 권한이 운영체제 명령 실행으로 이어질 수 있는 구조였다(Horizon3.ai 분석, 보도 인용).\n- 구조적 원인 [추정 — 분석]: Oracle EBS 같은 전사적 자원관리(ERP) 시스템은 교체·패치가 어려운 핵심 업무 시스템으로 취급돼 보안 패치 적용이 늦어지는 경향이 있다. Oracle 스스로도 과거 EBS 공격 다수가 \"이미 패치가 나와 있었음에도 적용하지 않아서\" 성공했다고 밝힌 바 있어, 이번에도 패치 지연이 핵심 위험 요인이 될 가능성이 높다(다만 이는 과거 패턴에 근거한 분석이며 이번 CVE에 실제로 해당할지는 확인되지 않았다).\n\n**침투 경로 [후보 — 실제 악용 미확인]**: 공개 인터넷에 노출된 EBS 웹 인터페이스에 비인증 HTTP 요청으로 SQL 인젝션을 시도하는 구조이나(Horizon3.ai 설명), 보도 시점까지 실제 공격으로 이어진 사례가 없어 이 침투 경로는 \"확인된 공격\"이 아니라 \"가능한 경로\"로만 표기한다.\n\n**어떻게 조치하나**\n- 즉시: (본 보고서의 권고) Oracle EBS 12.2.3~12.2.15 운영 조직은 2026년 10월 CPU를 즉시 적용한다. 노출된 인스턴스는 외부 접근을 WAF 등으로 추가 제한한다.\n- 단기: 디코이에서 관측된 탐색 패턴을 토대로 EBS 웹 로그에서 비정상 SQL 패턴·에러 응답 폭증을 점검한다.\n- 장기: EBS처럼 교체가 어려운 ERP 시스템도 별도의 신속 패치 절차(핫픽스 창구)를 마련해 패치 지연을 줄인다.\n- 탐지: Oracle EBS 웹 인터페이스에 대한 비정상 요청 패턴(SQL 특수문자 포함 등)을 WAF·IDS로 모니터링한다.\n\n**교훈**: \"아직 실제 공격이 없다\"는 \"안전하다\"가 아니라 \"아직\"일 뿐이다. 패치 공개 직후부터 디코이에 탐색 시도가 잡히는 것은, 공격자들이 패치를 역분석해 공격 코드를 만드는 속도가 매우 빠르다는 뜻이다.\n\n### [D20261029-sonet] 소니 자회사(일본 ISP) So-net 유출, 약 259만 건(NTT도코모 일부 포함)\n> 날짜: 침해 발생 2026-10-19 · 탐지 2026-10-23 · 공개 2026-10-27 · 유형: ISP 회원 DB 침해(경위 미공개) · 행위자: 미귀속 · 지역: 일본(해외) · 근거: 확인(소니 네트워크 커뮤니케이션즈 확인)\n\n**쉽게 말하면**: 소니 그룹의 일본 인터넷 서비스 자회사 '소니 네트워크 커뮤니케이션즈'가 운영하는 인터넷 접속 서비스(So-net)의 회원 데이터베이스가 외부인에게 뚫려, 이름·전화번호·이메일·생년월일·성별·접속 식별자 등 고객 정보 약 259만 건이 유출됐습니다. 이 중 44만여 건은 NTT도코모가 위탁 운영을 맡긴 'Docomo Hikari' 서비스 고객 정보도 포함돼 있습니다. 비밀번호가 함께 유출된 이메일 계정도 5만4천여 건 있어, 같은 비밀번호를 다른 곳에서도 쓰고 있다면 위험합니다. 다행히 계좌번호나 카드 정보는 유출되지 않았다고 회사가 밝혔습니다. 다만 공격자가 정확히 어떤 방법(피싱, 서버 결함 등)으로 침투했는지는 아직 공개되지 않았습니다.\n\n**먼저 할 일(초보용)**: So-net 또는 소니가 위탁 운영하는 Docomo Hikari(최근 6개월 내 해지한 사람도 포함) 이용자라면, 유출된 이메일 계정과 같은 비밀번호를 다른 서비스에서도 쓰고 있었는지 확인하고 **안전한 기기에서** 비밀번호를 바꾸세요. 도코모 측은 'd포인트 클럽'이나 유니버설 스튜디오 재팬 행사로 위장해 개인정보를 묻는 피싱 메일·사이트에 주의하라고 공지했습니다.\n\n**개요**: 소니 네트워크 커뮤니케이션즈는 So-net 회원 데이터베이스에 대한 외부 침해가 10/19 발생했고 4일 뒤인 10/23 이를 탐지했다고 밝혔다. 회사는 침해된 서버를 즉시 차단하고 외부 통신을 막은 뒤, 10/27 공식 발표와 함께 일본 개인정보보호위원회에 신고했다. 유출된 정보는 약 259만 건의 고객 레코드(이름·전화번호·이메일·아이디·생년월일·성별·인터넷 접속 식별자)이며, 이 중 'plala(S코스)' 고객 44만3,495건은 NTT도코모가 소니에 위탁 운영을 맡긴 'Docomo Hikari' 서비스와도 관련돼 있다. 별도로 여러 이메일 서비스 계정 5만4,401건은 비밀번호까지 함께 유출됐다. 회사는 계좌번호·카드 정보 등 결제 관련 정보는 유출되지 않았다고 밝혔다. 10/27 기준 소니·도코모 모두 유출 정보의 실제 악용(명의도용 등)은 확인되지 않았다고 밝혔다. **침해 원인·구체적 경위는 조사 중이며 공개되지 않았다** — 이번 조사에서도 1차 출처로 확인하지 못했다.\n\n**왜 일어났나**\n- 직접 원인: 공개되지 않음(조사 중). 피싱·자격 증명 탈취·서버 결함 등 어떤 경로였는지 회사가 밝히지 않아 **단정하지 않는다.**\n- 구조적 원인 [추정 — 분석]: 한 사업자(소니)가 자사 서비스(So-net)뿐 아니라 다른 대형 통신사(NTT도코모)의 위탁 서비스까지 같은 인프라로 운영하는 구조라면, 한 번의 침해가 위탁사 고객에게까지 번질 수 있다는 점을 이번 사건이 보여준다(다만 두 서비스가 실제로 같은 데이터베이스를 공유했는지 등 구체적 구조는 공개되지 않았다).\n\n**침투 경로**: 공개되지 않음 — 이번 보고서는 ATT&CK 매핑을 하지 않는다.\n\n**어떻게 조치하나**\n- 즉시: (본 보고서의 권고) 영향받은 So-net·Docomo Hikari 이용자는 계정 비밀번호를, 특히 유출된 이메일 계정과 같은 비밀번호를 다른 곳에도 썼다면 그 비밀번호들을 **안전한 기기에서** 전부 교체한다. 공격자가 침해된 서버에 접근했으므로 그 서버 안에서 새 비밀을 만들지 않는다.\n- 단기: 소니·도코모가 안내하는 피싱 주의 공지를 확인하고, 출처가 불분명한 d포인트·유니버설 스튜디오 재팬 관련 메일·문자에 개인정보를 입력하지 않는다.\n- 장기: 위탁 운영 관계에 있는 서비스는 데이터베이스·접근 권한을 분리해 한쪽의 침해가 다른 쪽 고객 정보로 번지지 않도록 한다(이번 사건에서 실제 분리 여부는 공개되지 않아 권고 수준으로만 제시한다).\n- 탐지: 유출된 계정 정보를 이용한 비정상 로그인 시도를 모니터링한다.\n\n**교훈**: 침해 원인이 공개되지 않았다고 해서 \"탐지에 실패했다\"거나 \"경위가 뻔하다\"고 단정해서는 안 된다. 4일 만에 탐지하고 즉시 서버를 차단한 것은 비교적 빠른 대응으로 볼 수 있다.\n\n### 참고 기록 — 일본 GMO Desktop Cloud 침해([D20261022-onamae](2026-10-22.md)), 약 5천만 달러 랜섬 요구 거절 후속 보도\n[D20261022-onamae](2026-10-22.md) 사건(10/20 발생, FX 자동매매용 가상서버 서비스 침해)과 관련해, GMO가 공격자의 약 5천만 달러(한화 약 720억 원) 규모 금전 요구를 거절했고 체포에 도움이 되는 정보 제공자에게 최대 100만 달러의 포상금을 내걸었다는 보도가 있었다(보도, 1차 공식 발표문은 이번 조사에서 직접 열람하지 못했다). 고객 데이터가 탈취됐고, 일부 거래는 유출된 로그인 정보와 연관됐다는 보도도 있었다. 이 사건이 \"랜섬웨어(파일 암호화)\"인지 \"데이터 탈취 후 금전 갈취(단순 협박)\"인지는 이번 조사에서 구분되지 않았다 — 기존 보고서가 이미 \"공격 수단·경로는 공개되지 않았다\"고 기록한 상태를 유지하며, 새 ATT&CK 매핑은 추가하지 않는다. 기존 분류(C/J)도 유지한다.\n\n## 3. 국내 소식\n\n**국내 질의 결과**: 지침에 따라 ①금융권 ②통신·이커머스 ③공공·지자체·교육·의료 ④국내 랜섬웨어 ⑤정부 발표 ⑥기존 사건 규모 갱신, 총 6개 범주를 각각 검색했다(검색어에 \"2026년 10월\" 포함). ①금융권(검색어: \"2026년 10월 금융권 해킹 개인정보 유출 은행 카드 저축은행\")은 10/14 집계(16개사·약 10만 건, 555개사 긴급점검·130개사 미흡)보다 새로운 수치를 찾지 못했다 — 이미 [10-26](2026-10-26.md)~[10-28](2026-10-28.md) 보고서에 기록된 내용과 동일하다. ②통신·이커머스(검색어: \"2026년 10월 쿠팡 티빙 통신사 침해사고 개인정보 유출\")는 10월 신규 사건을 찾지 못했고, 결과는 모두 기존 티빙(최종 집계 3,954만 계정·피해 1,953만 명)·쿠팡(2025년 11월 사건) 사건의 재인용이었다. 통신 3사 관련 10월 신규 침해사고도 확인되지 않았다. ③공공·지자체·교육·의료(검색어: \"2026년 10월 공공기관 대학 의료기관 개인정보 유출 해킹\")는 10월 신규 사건을 찾지 못했고, 검색된 것은 모두 과거 사건(2026-01 해킹포럼 탈취, 서울대병원 사건, 2024년 전북대 사건)의 재인용이었다. ④국내 랜섬웨어(검색어: \"2026년 10월 국내 랜섬웨어 피해 기업\")는 10월 신규 피해를 찾지 못했다 — 검색 결과는 4월 중소기업 대상 공격(경찰청·중기부·KISA 공동 발표, 이미 archived)의 재인용과 해외(일본 등) 통계뿐이었다. ⑤정부 발표(검색어: \"과기정통부 KISA 개인정보보호위원회 금융위 금감원 2026년 10월 발표 제재\")는 10/24~29 구간의 신규 발표를 찾지 못했다. 10/13 개인정보보호위 국정감사 발언과 10/1 금융위 「신용정보업감독규정」 개정 예고는 이미 [10-26](2026-10-26.md) 보고서에 기록돼 있어 중복 추가하지 않았다. ⑥기존 사건 규모 갱신(검색어: \"금융권 해킹 16개사 추가 집계 10월 29일 금융감독원\")은 10/14 집계 이후의 추가 갱신 기사를 찾지 못했다 — 당국이 \"더 늘어날 수 있다\"고 밝힌 상태가 계속 유지되고 있을 뿐, 확정된 갱신치는 없다.\n\n오늘 조사에서도 사건으로 등록할 만큼 크고 새로운 국내 사건·수치는 확인되지 않았다(6개 범주 모두 기존 보고서 내용과 동일하거나 더 오래된 자료만 확인됨 — 어제([10-28](2026-10-28.md)) 조사와 동일한 결론이다).\n\n## 4. 우선 대응 체크리스트\n\n1. **PHP(8.2~8.5) 운영 조직 + 해당 리눅스 커널/방화벽 벤더(최우선, 신규)**: [D20261029-php2shellroot](#d20261029-php2shellroot-php2shell--linux-커널-fragnesia-결함-체인으로-방화벽관리서버-25대-루트-권한-탈취-美-정부-관련-기관-포함cve-2026-109618-cve-2026-109619-cve-2026-46300) — PHP2Shell 패치 기한이 **오늘(10/29)**, Fragnesia 커널 패치 기한이 **10/31**이다. 두 패치 모두 적용 여부 즉시 확인.\n2. **VeloCloud Orchestrator·Cisco Catalyst SD-WAN·N-able N-central·Versa Director·Quest KACE 운영 조직(신규)**: [D20261029-silenttrain](#d20261029-silenttrain-중국계-volt-typhoon-폐기형-중계망-silent-train으로-제로데이-공격-흔적-은닉cve-2026-16812-등) 관리 인터페이스 외부 노출 여부 즉시 점검.\n3. **Oracle E-Business Suite 운영 조직(신규)**: [D20261029-oracleebs](#d20261029-oracleebs-oracle-e-business-suite-신규-sql인젝션rce-결함-패치-직후-정찰-스캐닝-포착cve-2026-101767) 2026년 10월 CPU(10/20) 적용 여부 확인 — 디코이에서 이미 탐색 시도 포착됨.\n4. **So-net·Docomo Hikari 이용자(신규)**: [D20261029-sonet](#d20261029-sonet-소니-자회사일본-isp-so-net-유출-약-259만-건ntt도코모-일부-포함) 비밀번호(특히 재사용 비밀번호) 교체.\n5. [10-17](2026-10-17.md)~[10-28](2026-10-28.md) 보고서의 Ivanti·Atlassian·Ahsay·PAN-OS·Cisco SEG·BeyondTrust·Fortinet·SiteGuard·Plex·Siemens·UpdraftCentral·eMudhra·Onamae·커넥트와이즈·Arista VCO·LiteLLM·GitLab·Collabora·HPE ArubaOS·Adobe Commerce/Magento(PolyShell)·Node.js/Bun(Brotli) — 기한이 지났거나 임박한 건이 많으므로 미조치 상태라면 우선 처리.\n\n## 5. 검증 수준과 한계\n\n- CISA KEV는 JSON 피드를 직접 받아 10/28 등재분(Broadcom VMware ESX CVE-2026-41709, Linux Kernel \"Fragnesia\" CVE-2026-46300)과 PHP2Shell 2건(CVE-2026-109618·109619, 10/26 등재)의 dateAdded·dueDate·설명 원문을 확인했다(1차 출처). CVE-2026-46300의 설명이 PHP CVE 2건과의 체이닝을 직접 언급하는 것을 확인했다. VMware ESX 결함(CVE-2026-41709)은 CVSS 2.7의 낮은 심각도(관리자 행위 로깅 누락)로 판단해 오늘 보고서의 별도 이슈로 다루지 않았다.\n- \"방화벽 25대 루트 탈취\" 사건은 TheHackerNews·BleepingComputer를 WebFetch로 직접 열람했으나, TheHackerNews 기사 본문은 두 번째 열람 시 403 오류로 전체를 다시 확인하지 못했다(첫 열람 결과와 추가 WebSearch 교차 확인으로 내용을 재구성했다). 공격받은 방화벽 제조사·버전, 피해 미국 정부 관련 기관의 정확한 피해 서버 수(2대 vs 3대, 출처별 불일치)는 확인하지 못했다. \"AI 보조 공격\"이라는 표현의 구체적 근거(어느 단계에 AI가 쓰였는지)도 확인하지 못해 본문에서 단정하지 않았다. 공격자 귀속(중국계/북한계)도 결론이 아니다.\n- Volt Typhoon \"Silent Train\" 내용은 Lumen Black Lotus Labs의 연구를 보도한 BleepingComputer 기사를 WebFetch로 직접 열람해 확인했다. Lumen의 원문 보고서(1차 출처)는 이번 조사에서 직접 열람하지 못했다.\n- Oracle E-Business Suite(CVE-2026-101767) 내용은 Rescana·BleepingComputer 등 2차 보도를 확인했다. Horizon3.ai·Oracle의 원문 공지는 직접 열람하지 못했다.\n- So-net 유출 내용은 BleepingComputer 보도를 WebFetch로 직접 열람해 확인했다. 소니·NTT도코모의 일본어 원문 공지는 직접 열람하지 못했다. 침해 경위(공격 수단)는 보도 시점까지 공개되지 않아 ATT&CK 매핑을 하지 않았다.\n- 국내 질의 6개 범주 모두 WebSearch만으로 수행했고(전문 매체 직접 열람은 이번 조사에서 하지 못함), 결과 없음이 \"사건이 실제로 없다\"는 뜻인지 \"아직 보도되지 않았다\"는 뜻인지는 구분할 수 없다.\n- ShinyHunters의 Oracle PeopleSoft 캠페인(CVE-2026-35273) 관련해 \"최근 세 가지 결함이 하나의 CVE로 묶여 패치됐다\"는 일부 2차 요약이 있었으나, 이번 조사에서 1차·2차 출처로 재확인하지 못해 오늘 보고서에는 채택하지 않았다(해당 캠페인 자체는 2026년 6월 사건으로 이미 널리 보도됐다).\n\n## 출처\n\n- CISA KEV JSON 피드 (직접 확인)\n- BleepingComputer(직접 열람): \"PHP2Shell security flaws now sucessfully exploited in the wild\", \"Volt Typhoon hides zero-day attacks using 'Silent Train' framework\", \"Hackers now scanning systems for recently-patched Oracle flaw\", \"Sony ISP subsidiary data breach exposes 2.5 million customer records\"\n- TheHackerNews(직접 열람, 재열람 시 403): \"PHP2Shell Attack Roots 25 Servers, Breaches U.S. Government-Affiliated Network\"\n- 2차 보도 교차 확인: Unite.AI·DreamGroup 블로그·Cypro·Rescana (PHP2Shell/Fragnesia 체인, Oracle EBS 세부)\n- MITRE ATT&CK v19.2(저장소 기준, v20.0 공식 전환은 유지 확인됨, 재매핑 보류)\n"},{"path":"일일/2026-10-30.md","title":"일일 보안 이슈 분석 — 2026-10-30","md":"# 일일 보안 이슈 분석 — 2026-10-30\n\n> 수집 기준: 2026-10-30(오늘, 조사 진행 시각까지 공개분). 전날(10/29) 보고서까지 공백 없이 이어진다. CISA KEV는 JSON 피드를 직접 확인했으며 10/29 신규 등재 2건(GitLab, Cisco ASA/FTD)을 확인했다(1차 출처). 해외 소식은 BleepingComputer·TheHackerNews 메인 페이지를 WebFetch로 직접 열람해 확인했고, 개별 사건은 추가 WebFetch·WebSearch로 교차 확인했다. 국내 소식은 WebSearch로 6개 범주를 각각 확인했다(언론사 직접 열람은 일부만 수행).\n> 근거 표기: **[확인]** 벤더·정부기관·연구자가 직접 확인 / 보도 언론 보도 / **[추정]** 본 보고서의 추정 / **[주장]** 공격자 일방 주장. **조치는 본 보고서의 권고**이며 벤더 공식 지침이 우선한다.\n> **ATT&CK 버전 점검**: attack.mitre.org 직접 확인 결과 공식 버전은 여전히 **v20.0**이다(10/26~29 확인분과 동일, 추가 변경 없음). 이 저장소는 당분간 **v19.2 매핑을 유지**하며 임의로 대규모 재매핑하지 않는다.\n> **정정**: 조사 과정에서 \"Claude Code 확장이 Cursor 마켓플레이스에서 트로이목마화돼 SSH 백도어를 심었다\"는 내용을 한 차례 WebFetch 요약에서 얻었으나, 동일 사실을 뒷받침하는 1차·2차 출처를 WebSearch로 찾지 못해(검색 결과는 전혀 다른 과거 사건들만 나옴) 이번 보고서에는 채택하지 않았다. 출처가 불확실한 요약을 그대로 옮기지 않기 위해 제외했다는 점을 명시한다.\n\n## 1. 오늘의 요약\n\n| # | 이슈 | CVE | 유형 | 상태 | 즉시 조치 |\n|---|------|-----|------|------|-----------|\n| 1 | 바이낸스, 직원 노트북 침해로 시작된 사상 최대 규모(약 63억 달러) 암호화폐 탈취 | — | 내부 기기 침해 → 서비스 접근 권한 악용(경위 일부 미공개) | [확인] 바이낸스 자체 확인, TRM·Chainalysis가 북한계 TraderTraitor(Lazarus)로 귀속 | 영향 없는 이용자는 조치 불필요(바이낸스가 SAFU 펀드로 손실 전액 보전 발표). 관련 기관·기업은 유사한 \"직원 기기 하나로 거액 인출 권한에 닿는\" 구조가 있는지 점검 |\n| 2 | GitLab CI/CD 정규식 처리 결함, 패치 2주 반 만에 실제 악용 확인(CVSS 10.0) | CVE-2026-97229 | 공개 웹앱(자체 호스팅 GitLab) 비인증 원격 코드 실행 | [확인] CISA KEV 10/29 등재 | GitLab CE/EE를 19.2.8·19.3.5·19.4.2 이상으로 즉시 업그레이드 |\n| 3 | Cisco ASA/FTD SSL VPN 결함, 실제 공격으로 장비 다운(DoS) 확인 | CVE-2026-76418 | 공개 VPN 장비 비인증 서비스 거부(장비 재부팅) | [확인] CISA KEV 10/29 등재 | Cisco 보안 패치 즉시 적용 |\n| 4 | Drupal Commerce Core 접근제어 결함, 실제 공격 중(4만2천+ 사이트 사용) | CVE-2026-118539 | 공개 웹앱(전자상거래 모듈) 인가 우회 | [확인] Drupal 자체 확인(\"actively exploited\") | Commerce Core를 8.x-2.41 또는 3.3.13으로 즉시 업그레이드, 주문 내역 점검 |\n| 5 | Ledger 하드웨어 지갑 일부 물량에서 유통 단계 하드웨어 임플란트(스파이 칩) 확인 | — | 리셀러(유통사) 공급망 하드웨어 변조 | [확인] Ledger Donjon 팀 확인, 독립 연구자(Tibane Labs 등) 분해 분석 | CryptoBilis를 통해 구매한 기기는 설정하지 말고, 이미 설정했다면 **새 기기·새 시드문구로** 자산 이전 |\n\n오늘은 새 사건 5건을 기록한다. 또한 Cisco SD-WAN 제로데이(CVE-2026-20127)를 쓰는 별도 공격조직(UAT-11473, 커스텀 악성코드 \"KeyDrift\")이 [D20261029-silenttrain](2026-10-29.md) 사건과 겹치는 인프라를 쓴다는 Talos 연구가 보도돼 참고 기록으로 추가한다.\n\n## 2. 이슈별 분석\n\n### [D20261030-binance] 바이낸스, 직원 노트북 침해로 시작된 사상 최대 규모(약 63억 달러) 암호화폐 탈취\n> 날짜: 자금 유출 2026-10-29 20:05(UTC)부터 약 20분간 · 공개 확인 2026-10-30 · 유형: 내부 직원 기기 침해 → 내부 서비스 접근 권한 악용(구체적 경위 일부 미공개) · 행위자: TraderTraitor(북한 정찰총국 배후 추정, Lazarus Group/APT38과 동일 계열로 분류 — TRM Labs·Chainalysis 귀속) · 지역: 전 세계(해외, 거래소 바이낸스) · 근거: 확인(바이낸스 자체 확인·성명)·확인(TRM·Chainalysis 귀속 분석)\n\n**쉽게 말하면**: 세계 최대 암호화폐 거래소 바이낸스에서 2026년 10월 29일 밤, 10개 블록체인에 걸쳐 약 20분 만에 약 63억 달러(역대 최대 규모 암호화폐 탈취, 2025년 바이비트 사건의 약 4배) 상당의 암호화폐가 빠져나갔습니다. 바이낸스는 한 운영 담당 직원(DevOps 엔지니어)의 노트북이 침해당한 것에서 시작해, 공격자가 내부 \"서비스 컨테이너\"(회사 내부 시스템의 한 구성 단위)에 접근해 승인되지 않은 인출 거래를 제출할 수 있었다고 밝혔습니다. 다만 그 노트북이 정확히 어떻게 뚫렸는지, 그리고 바이낸스가 언급한 \"추가로 발견된 침해 지점\"이 구체적으로 무엇인지는 아직 공개되지 않았습니다. 보안 분석업체 TRM Labs와 Chainalysis는 이 공격을 북한 정찰총국과 연계된 해킹 조직(TraderTraitor, 흔히 라자루스 그룹으로 불리는 조직군)이 저질렀다고 높은 확신도로 분석했습니다. 바이낸스는 지갑 개인 키 유출 증거는 없다고 밝혔고, 테더·서클 등 스테이블코인 발행사들이 약 27억 달러를 동결했지만, 공격자는 여전히 약 24억 달러를 통제하고 있는 것으로 추정됩니다.\n\n**먼저 할 일(초보용)**: 바이낸스를 이용하는 일반 이용자가 당장 취할 조치는 없습니다 — 바이낸스는 이용자 자금이 안전하며 자체 비상 적립금(SAFU 펀드)과 회사 자금으로 손실 전액을 보전하겠다고 밝혔습니다. 다만 바이낸스는 사고 수습 중 입출금을 일시 중단했으니 거래소 공지를 확인하세요. 기업·기관 입장에서는 \"직원 한 명의 업무용 기기가 뚫리면 거액 자금 이동 권한까지 닿는\" 구조가 자신의 조직에도 있는지 점검하는 것이 이번 사건에서 얻을 수 있는 첫걸음입니다.\n\n**개요**: 블록체인 분석업체 TRM Labs에 따르면 2026-10-29 20:05(UTC)부터 약 20분 사이, 바이낸스의 지갑에서 10개 블록체인에 걸쳐 약 63억 달러(일부 보도는 64억 달러) 상당의 자산이 빠져나갔다. 바이낸스는 BleepingComputer에 보낸 성명에서 공격자가 한 DevOps 엔지니어의 노트북을 침해한 뒤 내부 \"서비스 컨테이너\"에 접근해, 비인가 인출 거래를 제출할 수 있었다고 확인했다. 바이낸스는 이것이 \"단일 행위나 한 엔지니어의 권한만으로 일어난 것이 아니라 여러 단계를 거친 공격\"이라고 설명했고, 수습 과정에서 \"추가적인 침해 지점을 발견했다\"고 밝혔지만 그 구체적 내용은 아직 공개하지 않았다. 바이낸스는 지갑 개인 키가 유출됐다는 증거는 발견하지 못했다고 밝혔다. 공동 CEO 리처드 텅은 수사가 아직 특정 개인에게 책임을 돌리지 않았다고 말했다. 바이낸스는 보안 점검을 위해 입출금을 일시 중단했고, 영향받은 주소의 권한을 회수했으며, 손실 전액을 자사 비상 적립금(SAFU 펀드)과 회사 자금으로 보전하고 복구 후 보유자산증명(Proof of Reserves)을 다시 공개하겠다고 밝혔다. TRM Labs는 이 공격을 북한 배후로 알려진 TraderTraitor(라자루스 그룹·APT38과 같은 계열로 분류)의 소행으로 귀속했고, Chainalysis도 \"높은 확신도\"로 이를 확인했다고 보도됐다. 테더·서클·리플·World Liberty Financial·Arbitrum 보안위원회 등이 약 27억 달러를 동결했지만, 공격자는 42만 ETH·1만8,270 BTC를 포함해 약 24억 달러를 여전히 통제하고 있으며 USDT를 마켓메이커에 매도하고 Aave에서 USDT를 담보로 ETH를 빌려 동결보다 빠르게 자금을 옮기고 있다고 TRM은 설명했다.\n\n**왜 일어났나**\n- 직접 원인 [일부 확인, 일부 미공개]: 바이낸스 직원의 노트북이 침해됐고(구체적 침해 방법은 공개되지 않음), 이 침해가 비인가 인출 거래를 제출할 수 있는 내부 서비스 접근 권한으로 이어졌다(바이낸스 확인). 어떤 악성코드·피싱·자격 증명 탈취 방식이 쓰였는지는 이번 조사에서 확인하지 못했다.\n- 구조적 원인: 공개되지 않음. 바이낸스 스스로 \"단일 행위·단일 권한으로 일어난 것이 아니다\"라고 밝혔지만, 내부 승인·권한 분리 체계가 구체적으로 어떻게 구성돼 있었는지는 공개되지 않아 설계상 결함 여부를 단정할 수 없다. [추정 — 분석, 확인된 사실 아님] 직원 한 명의 업무용 기기 침해가 결국 거액 인출 승인까지 이어졌다는 결과만으로 볼 때, 출금 승인 경로의 권한 분리·통제 수준은 앞으로 공개될 조사 결과로 확인해야 할 지점이다.\n\n**침투 경로 [일부 공개 — 전체 경위는 미공개, ATT&CK 매핑 보류]**: 바이낸스가 공개한 것은 \"직원 노트북 침해 → 내부 서비스 컨테이너 접근 → 비인가 인출 거래 제출\"이라는 단계뿐이며, 노트북이 어떻게 침해됐는지(피싱, 악성코드, 자격 증명 탈취 등)와 \"추가 침해 지점\"의 구체적 내용은 공개되지 않았다. 구체적인 공격 기법(ATT&CK 전술·기법)을 특정하기에는 공개된 정보가 부족해 이번 보고서는 이 사건에 ATT&CK 매핑을 하지 않는다.\n\n**어떻게 조치하나**\n- 즉시: (본 보고서의 권고) 바이낸스 이용자는 거래소의 입출금 재개 공지와 보유자산증명 재공개를 확인한다. 유사한 내부 구조(직원 기기 하나가 거액 인출 권한에 닿는 구조)를 가진 조직은 해당 접근 경로에 추가 승인 단계가 있는지 즉시 점검한다.\n- 단기: (바이낸스 기준) 영향받은 주소의 권한은 이미 회수됐다고 밝혔으나, 추가로 발견되는 침해 지점에 연결된 자격 증명·키는 깨끗한 환경에서 모두 교체해야 한다(바이낸스가 이를 완료했는지는 공개되지 않았다).\n- 장기: 내부 서비스(특히 자금 이동 권한이 있는 시스템)에 대한 접근을 직원 개인 기기의 보안 상태에만 의존하지 않도록, 다중 승인·이상 거래 자동 차단·콜드월렛 비중 확대 같은 중복 통제를 둔다.\n- 탐지: 거액·다수 블록체인에 걸친 짧은 시간 내 대량 인출 패턴에 대한 자동 경보·임시 차단 체계를 갖춘다.\n\n**교훈**: 아무리 큰 거래소라도 \"직원 개인의 업무 기기\"가 조직 전체의 자금 이동 권한으로 이어지는 연결고리가 하나라도 남아 있으면, 그 연결고리 하나가 사상 최대 규모의 피해로 이어질 수 있다.\n\n### [D20261030-gitlabrce] GitLab CI/CD 정규식 처리 결함, 패치 2주 반 만에 실제 악용 확인(CVE-2026-97229, CVSS 10.0)\n> 날짜: GitLab 보안 권고·패치 공개 2026-10-12 · CISA KEV 등재(실제 악용 확인) 2026-10-29 · 유형: 자체 호스팅 GitLab 비인증 원격 코드 실행 · 행위자: 미귀속 · 지역: 전 세계(해외) · 근거: 확인(GitLab 보안 권고, CISA KEV)\n\n**쉽게 말하면**: 회사들이 소스코드 관리와 자동 빌드(CI/CD)에 널리 쓰는 GitLab 소프트웨어에서, 로그인조차 하지 않은 공격자가 특수하게 만든 \"정규식\"(문자열 패턴) 하나만으로 서버에서 마음대로 명령을 실행할 수 있는 최고 위험도(10점 만점) 결함이 발견됐습니다. 10월 12일 패치가 나왔지만, 2주 반이 지난 10월 29일 미국 정부(CISA)가 이 결함이 \"실제로 공격에 쓰이고 있다\"고 공식 확인해 긴급 위험 목록에 올렸습니다.\n\n**먼저 할 일(초보용)**: 회사 서버에 직접 설치해 쓰는(자체 호스팅) GitLab Community/Enterprise Edition을 운영한다면 지금 바로 19.2.8·19.3.5·19.4.2 이상 버전으로 업그레이드하세요. GitLab.com(GitLab이 직접 운영하는 클라우드 서비스)과 GitLab Dedicated 고객은 이미 안전한 버전을 쓰고 있어 추가 조치가 필요 없습니다.\n\n**개요**: GitLab은 2026-10-12 보안 권고에서 CI/CD 파이프라인 설정 파일의 정규식을 처리하는 컴파일러 엔진의 정수 오버플로우(整數溢出) 결함(CVE-2026-97229, CVSS 10.0 \"최고 심각도\")을 공개하고 패치했다. 공개 프로젝트에 브랜치를 푸시할 수 있는 권한만 있으면 특수하게 조작한 정규식으로 GitLab 서버의 git 계정 권한에서 임의 코드를 실행시킬 수 있는 구조로, 연구자 Jonah Burgess가 공개 PoC(개념증명)를 발표하기도 했다. CISA는 2026-10-29 이 취약점을 KEV(실제 악용 확인 취약점 목록)에 등재했다 — 이는 CISA가 \"이 결함이 실제 공격에 쓰였다\"는 사실을 확인했을 때만 올리는 목록이며, 공격자가 정확히 어떤 방식으로 최초 접근했는지(이 결함을 직접 썼는지, 다른 결함과 체이닝했는지 등) 세부 공격 경과까지 CISA가 공개로 확정한 것은 아니다. 패치 공개 2주 반 만에 실제 악용이 확인됐다는 뜻이다. 어떤 조직이 피해를 입었는지, 공격자가 코드 실행 후 구체적으로 어떤 행위를 했는지는 보도 시점까지 공개되지 않았다. 참고로 19.3 브랜치의 수정 버전은 처음 19.3.4로 안내됐으나, 이 버전 자체에 별도 결함(Ona 연동 시 머지 리퀘스트 페이지 오류)이 있어 GitLab이 이후 **19.3.5**로 상향 권고했다 — 이 보고서는 19.3.5를 기준으로 쓴다.\n\n**왜 일어났나**\n- 직접 원인 [확인]: 정규식을 해석하는 내부 컴파일러 엔진에서 정수 오버플로우가 발생해, 비인증 상태에서도 서버 쪽 코드 실행이 가능했다(GitLab 보안 권고).\n- 구조적 원인 [추정 — 분석]: 소스코드 저장소·CI/CD 도구는 조직의 코드와 배포 파이프라인 전체에 접근할 수 있는 핵심 인프라인데도, 공개 프로젝트에 누구나 올릴 수 있는 입력(정규식)을 서버 쪽에서 처리하는 기능이 있었다는 점이 공격 표면을 넓혔다(다만 이것이 설계상 불가피한 기능이었는지는 확인되지 않았다).\n\n**침투 경로 [확인 — GitLab 권고 기준]**: 공개 프로젝트에 브랜치를 푸시할 수 있는 낮은 권한의 공격자가 CI/CD 설정 파일에 특수하게 조작한 정규식을 포함시켜, GitLab 서버의 정규식 처리 엔진에서 정수 오버플로우를 유발해 git 계정 권한으로 임의 코드를 실행한다.\n\n**어떻게 조치하나**\n- 즉시: (본 보고서의 권고) 자체 호스팅 GitLab CE/EE를 19.2.8·19.3.5·19.4.2 이상으로 즉시 업그레이드한다. 패치 전 로그(접근·CI 실행 로그)를 보존하되 패치를 늦추지 않는다.\n- 단기: 패치 전 기간 동안 공개 프로젝트에 푸시된 비정상 CI/CD 설정, git 계정 권한으로 실행된 예상치 못한 명령 흔적을 점검한다. 영향 가능 기간의 CI/CD 비밀(토큰·키)은 깨끗한 환경에서 교체한다.\n- 장기: 공개 프로젝트에 누구나 올릴 수 있는 입력을 서버가 처리하는 기능은 별도 샌드박스·권한 분리로 격리한다.\n- 탐지: GitLab 서버 로그에서 비정상적인 정규식 처리 오류·git 계정 권한의 예상치 못한 프로세스 생성을 모니터링한다.\n\n**교훈**: CVSS 10.0 같은 최고 위험도 결함은 PoC가 공개된 순간부터 실제 공격까지의 시간이 짧다. 패치 공개 즉시 적용이 유일한 방어선이다.\n\n### [D20261030-ciscoasa] Cisco ASA/FTD SSL VPN 결함, 실제 공격으로 장비 다운 확인(CVE-2026-76418)\n> 날짜: Cisco 패치 공개 2026-10-29 · CISA KEV 등재(실제 악용 확인) 2026-10-29 · 유형: 공개 VPN 장비 비인증 서비스 거부(DoS) · 행위자: 미귀속 · 지역: 전 세계(해외) · 근거: 확인(Cisco 패치, CISA KEV)\n\n**쉽게 말하면**: 많은 기업이 원격 접속(VPN)에 쓰는 Cisco의 방화벽 장비(ASA·FTD)에서, 로그인하지 않은 공격자가 조작된 요청을 보내는 것만으로 장비를 강제로 재부팅시켜 먹통으로 만들 수 있는 결함이 발견됐습니다. 이 결함은 실제로 장비를 다운시키는 데 쓰이고 있다는 것이 미국 정부(CISA)에 의해 공식 확인됐습니다. 이 결함 자체로는 데이터를 훔치거나 장비를 장악할 수는 없지만, 원격 접속이 끊기면 업무가 마비될 수 있습니다.\n\n**먼저 할 일(초보용)**: Cisco ASA 소프트웨어나 Secure FTD 소프트웨어로 원격 접속(SSL VPN) 서비스를 운영한다면 Cisco가 배포한 보안 패치를 지금 바로 적용하세요.\n\n**개요**: Cisco는 2026-10-29 ASA 소프트웨어와 Secure FTD 소프트웨어의 Remote Access SSL VPN 기능에서 CVE-2026-76418(CVSS 8.6)을 패치했다. 함수 반환값을 제대로 검사하지 않아 널 포인터 역참조(NULL pointer dereference)가 발생하는 결함으로, 비인증 원격 공격자가 특수하게 조작된 요청을 보내면 장비가 예기치 않게 재부팅되며 서비스 거부(DoS)가 발생한다. CISA는 같은 날 이 결함을 KEV에 등재해 실제 공격에서 악용되고 있음을 확인했다. 이 결함은 코드 실행이나 데이터 탈취로는 이어지지 않는 순수 DoS형 결함으로 보도됐다.\n\n**왜 일어났나**\n- 직접 원인 [확인]: ASA/FTD의 SSL VPN 처리 코드가 특정 함수의 반환값을 검사하지 않아 널 포인터 역참조로 이어졌다(Cisco 보안 권고).\n- 구조적 원인 [추정 — 분석]: 인터넷에 노출된 원격 접속 장비(VPN)는 기업의 업무 연속성에 직결되는 단일 장애점(single point of failure)이 될 수 있어, 데이터 탈취가 아닌 단순 DoS 결함조차도 업무에 실질적 영향을 줄 수 있다.\n\n**침투 경로 [확인 — Cisco 권고 기준]**: 공개 인터넷에 노출된 ASA/FTD의 SSL VPN 인터페이스에 조작된 요청을 보내 널 포인터 역참조를 유발, 장비를 재부팅시켜 서비스를 중단시킨다. 추가 권한 상승이나 데이터 접근으로 이어지는 체인은 보도되지 않았다.\n\n**어떻게 조치하나**\n- 즉시: (본 보고서의 권고) 자사 ASA/FTD 장비가 영향받는 Remote Access SSL VPN 구성(보조 인증·터널 그룹 설정 포함)을 쓰는지 Cisco 권고에서 확인하고, 해당된다면 보안 패치를 즉시 적용한다.\n- 단기: 패치 전 반복적인 장비 재부팅·크래시 로그가 있었는지 점검해 이미 공격 대상이 됐는지 확인한다.\n- 장기: 원격 접속 장비의 이중화(동일 장비를 2대 이상 운용)를 검토해 한 대가 다운돼도 업무가 끊기지 않도록 한다.\n- 탐지: VPN 장비의 비정상 재부팅·크래시 로그를 모니터링 체계에 포함시킨다.\n\n**교훈**: 모든 취약점이 \"데이터 탈취\"로 이어지는 것은 아니다. 단순히 장비를 멈추게 하는 결함도 원격 접속이 핵심 업무 통로인 조직에는 실질적 피해를 준다.\n\n### [D20261030-drupalcommerce] Drupal Commerce Core 접근제어 결함, 실제 공격 진행 중(CVE-2026-118539)\n> 날짜: Drupal 보안 권고 공개 2026-10-28(수) · 보도 2026-10-30 · 유형: 공개 웹앱(전자상거래 모듈) 인가 우회 · 행위자: 미귀속 · 지역: 전 세계(해외) · 근거: 확인(Drupal 자체 \"실제 악용 중\" 확인)\n\n**쉽게 말하면**: 웹사이트 제작 도구 Drupal의 전자상거래(쇼핑몰) 확장 모듈인 Commerce Core에서, 로그인하지 않은 방문자가 특정 경로·데이터에 대한 접근 제한을 건너뛸 수 있는 결함이 발견됐습니다. Drupal 측은 이 결함이 \"실제로 공격에 쓰이고 있다\"고 직접 확인했습니다. 이 모듈은 포춘 500대 기업과 대학을 포함해 4만2천 개 이상의 웹사이트에서 쓰이고 있습니다.\n\n**먼저 할 일(초보용)**: Drupal Commerce Core로 쇼핑몰을 운영한다면 지금 바로 8.x-2.41(이전 버전 계열) 또는 3.3.13(3.x 계열) 이상으로 업그레이드하고, 최근 주문 내역에 이상한 점이 없는지 점검하세요.\n\n**개요**: Drupal은 2026-10-28(수) 보안 권고(SA-contrib-2026-254, \"매우 치명적\"로 분류)에서 Commerce Core 모듈이 특정 경로와 엔티티 필드를 충분히 보호하지 않아 접근 제어를 우회할 수 있다고 밝혔다. 이 결함은 \"실제로 악용되고 있다(actively exploited)\"고 Drupal이 직접 확인했으며, 접근 우회가 판매자에게 금전적 피해로 이어질 수 있다고 설명했다. 영향받는 버전은 0.0.0~2.41, 3.0.0~3.3.13이며, 각각 8.x-2.41과 3.3.13으로 패치됐다. 구체적인 공격 방식·피해 규모는 보도되지 않았다. Drupal은 같은 해 5월에도 실제 악용된 SQL 인젝션 결함(CVE-2026-9082, CISA KEV 등재)을 경고한 바 있고, 약 2주 전에는 \"몇 시간~며칠 안에 공격이 나올 수 있다\"고 경고한 원격 코드 실행 결함 2건(CVE-2026-108097·108099)을 패치했다.\n\n**왜 일어났나**\n- 직접 원인 [확인]: Commerce Core 모듈이 특정 라우트(경로)와 엔티티 필드에 대한 권한 검사를 충분히 하지 않아, 인증되지 않은 사용자가 접근 제어를 우회할 수 있었다(Drupal 보안 권고).\n- 구조적 원인 [추정 — 분석]: 오픈소스 CMS의 커뮤니티 기여(contrib) 모듈은 핵심(core) 모듈보다 보안 검토가 상대적으로 덜 이뤄지는 경향이 있고, 전자상거래처럼 금전이 오가는 모듈의 결함은 발견이 늦어질수록 직접적인 금전 피해로 이어질 수 있다(다만 이번 결함이 실제로 금전 피해를 냈는지는 공개되지 않았다).\n\n**침투 경로 [확인 — Drupal 권고 기준, 세부 공격 방식은 미공개]**: 공개 웹사이트의 Commerce Core 경로·엔티티 필드에 대한 접근 제어가 누락된 지점을 비인증 상태에서 직접 호출해 접근 제한을 우회한다. 공격자가 우회 후 구체적으로 어떤 데이터·기능에 접근했는지는 보도되지 않았다.\n\n**어떻게 조치하나**\n- 즉시: (본 보고서의 권고) Commerce Core를 8.x-2.41 또는 3.3.13 이상으로 즉시 업그레이드한다. Drupal 권고대로 최근 주문 내역에 이상(가격 조작, 비정상 상태 변경 등)이 있는지 점검한다.\n- 단기: 패치 전 기간 동안의 웹 로그에서 비정상 경로 접근·반복 요청 패턴을 점검한다.\n- 장기: 전자상거래처럼 금전이 오가는 모듈은 별도의 보안 검토·모니터링 주기를 더 짧게 둔다.\n- 탐지: Commerce Core 관련 경로에 대한 비인증 접근 시도를 WAF·로그 모니터링으로 탐지한다.\n\n**교훈**: \"실제로 악용되고 있다\"는 벤더 스스로의 확인은 PoC 공개보다 훨씬 급한 신호다. 쇼핑몰처럼 돈이 오가는 시스템의 결함은 패치 지연이 곧바로 금전 피해로 번질 수 있다.\n\n### [D20261030-ledgerimplant] Ledger 하드웨어 지갑 일부 물량에서 유통 단계 하드웨어 임플란트(스파이 칩) 확인\n> 날짜: 피해 신고 접수·조사 시작 2026-10-09 · 임플란트 확인 2026-10-10 · 연구자 분해 분석 공개 2026-10-하순 · 유형: 리셀러(유통사) 공급망 하드웨어 변조 · 행위자: 미귀속 · 지역: 전 세계(해외, 주로 아시아 지역 유통 경로) · 근거: 확인(Ledger Donjon 팀 확인, 독립 연구자 분해 분석)\n\n**쉽게 말하면**: 암호화폐를 인터넷과 분리해 안전하게 보관하는 \"하드웨어 지갑\" 제조사 Ledger의 일부 제품에서, 동남아시아 리셀러(재판매업체) 'CryptoBilis'를 거친 물량에 몰래 심어진 도청용 전자회로(하드웨어 임플란트)가 발견됐습니다. 이 회로는 화면에 뜨는 복구용 비밀 단어(시드 문구)를 몰래 읽어, 휴대폰 유심(eSIM)이 내장된 통신 모듈을 통해 공격자에게 전송하는 방식으로 동작했습니다. 이 수법으로 일부 이용자의 자산이 빠져나간 것으로 추정됩니다. Ledger는 이 리셀러를 통한 제품에서만 문제가 확인됐다고 밝혔다. CryptoBilis가 이 사건 당시 Ledger의 정식 인증 리셀러였는지는 보도마다 엇갈린다 — 일부 보도는 Ledger 공식 리셀러 목록에 포함돼 있었다고 전하고, 다른 보도는 목록에 없다고 전해 이번 조사에서 확정하지 못했다. 경쟁사인 Trezor는 같은 리셀러와 거래를 끊었다고 밝혔다(Trezor 자사 제품에서 임플란트가 발견됐다는 보도는 아니다).\n\n**먼저 할 일(초보용)**: CryptoBilis를 통해 Ledger 하드웨어 지갑을 구매했다면, 아직 초기 설정을 하지 않았다면 설정하지 마세요. 이미 설정해 사용 중이라면 그 기기를 더 쓰지 말고 **새로 구매한 정식 기기에서 새로 생성한 복구 문구로** 자산을 즉시 옮기세요 — 침해된 기기에서 만든 새 문구는 안전하지 않습니다.\n\n**개요**: 이용자들이 CryptoBilis를 통해 구매한 Ledger 기기에서 예상치 못한 자산 유출을 신고하면서, Ledger는 2026-10-09 조사에 착수해 CryptoBilis에 판매·배송 중단을 요청했다. 다음 날인 10/10 Ledger는 최소 한 대의 기기에서 실제 변조(하드웨어 임플란트)를 확인했다고 밝혔다. 이후 독립 보안 연구자(Mark Karpelès, Tibane Labs 등)가 변조된 기기를 입수해 분해 분석을 공개했다. 이에 따르면 임플란트는 기기의 화면 출력과 버튼 입력을 가로채 복구 문구(시드 문구)를 읽어낸 뒤, eSIM이 내장된 LTE(이동통신) 모듈로 공격자에게 전송하는 방식으로 동작했다. 연구자들은 두 가지 변형을 발견했는데, 하나는 원래 배터리를 더 작은 배터리로 바꿔 회로 공간을 확보한 방식이고, 다른 하나는 원래 배터리를 그대로 쓰면서 화면 아래 패딩 공간에 회로를 숨긴 더 정교한 방식이었다. 부품에는 STM32G431 마이크로컨트롤러, 초소형 eSIM, 차폐된 LTE 모듈이 쓰였고 일부 부품 각인은 긁어 지워져 있었다. 연구자들은 회로 기판이 수작업이 아닌 전문적인 제조 공정으로 만들어진 것으로 보인다고 평가했다. 일부 변조 기기는 9월 중순부터 정식 가격의 약 절반 가격에 판매된 것으로 보도됐다. Ledger는 자사의 정품 확인 기능(\"Genuine Check\")이 보안칩(Secure Element) 자체가 원본이면 추가된 임플란트까지는 탐지하지 못한다고 밝혔다. 피해 규모(금액·대수)는 보도마다 차이가 있어 이번 보고서는 특정 수치를 확정하지 않는다.\n\n**왜 일어났나**\n- 직접 원인 [확인]: 리셀러 CryptoBilis를 거친 유통 과정에서 기기 내부에 데이터를 가로채 무선으로 전송하는 하드웨어가 몰래 추가됐다(Ledger 확인·연구자 분해 분석).\n- 구조적 원인 [추정 — 분석]: 하드웨어 지갑의 보안 모델은 \"보안칩(Secure Element)과 소프트웨어가 변조되지 않았는가\"에 집중돼 있어, 보안칩 자체는 손대지 않고 그 주변 회로(화면·버튼 신호를 가로채는 별도 칩)만 추가하는 방식의 변조는 제조사의 표준 정품 확인 절차로 잡아내기 어려운 구조적 틈이 있다. 또한 소비자가 가격 비교를 위해 비공식 리셀러·오픈마켓(아마존 재판매, 야후 재팬 경매 등)에서 구매하는 관행이 이런 변조 물량의 유통 경로가 됐다.\n\n**침투 경로 [확인 — Ledger·독립 연구자 분석 기준]**: 공격자(또는 변조를 수행한 중간 유통 단계)가 정식 제조사 경로를 거치지 않은 리셀러의 물량에 하드웨어 임플란트를 사전에 삽입하고, 이용자가 해당 기기를 구매·설정해 복구 문구를 화면에 띄우는 순간 임플란트가 이를 포착해 LTE로 유출한다. 어느 유통 단계(공장, 창고, 배송 중)에서 정확히 변조가 이뤄졌는지는 Ledger도 아직 밝히지 못했다.\n\n**어떻게 조치하나**\n- 즉시: (본 보고서의 권고) CryptoBilis를 통해 구매한 Ledger 기기는 설정을 중단하거나, 이미 설정했다면 **그 기기 안에서 새 복구 문구를 만들지 말고** 새로 구매한 정식 기기로 자산을 옮긴다.\n- 단기: 기기 외관(배터리 교체 흔적, 예상치 못한 안테나 선, OLED 화면 아래 패딩 두께 변화 등)을 점검하되, 이는 완전한 탐지 수단이 아니므로 외관이 정상이라도 CryptoBilis 경로 구매라면 안전하다고 단정하지 않는다.\n- 장기: 하드웨어 지갑은 제조사가 직접 운영하는 판매처나 명시적으로 인증된 리셀러를 통해서만 구매한다. 제조사는 정품 확인 절차에 \"추가된 회로\"까지 탐지할 수 있는 수단(예: 기기 무게·임피던스 측정)을 보강할 필요가 있다.\n- 탐지: 해당 리셀러를 통해 판매된 기기 일련번호를 제조사가 역추적해 구매자에게 개별 통지하는 체계를 둔다.\n\n**교훈**: 하드웨어 지갑은 \"인터넷에 연결되지 않아 안전하다\"는 보안 모델을 갖지만, 그 기기가 소비자 손에 들어오기 전 유통 단계에서 변조될 수 있다는 점은 소프트웨어 공급망 공격과 똑같은 \"신뢰 경로 전체를 봐야 한다\"는 교훈을 하드웨어에도 그대로 적용해야 함을 보여준다.\n\n### 참고 기록 — Cisco SD-WAN 제로데이로 커스텀 악성코드 \"KeyDrift\" 배포, Volt Typhoon \"Silent Train\"과 겹치는 인프라(별도 사건, [D20261029-silenttrain](2026-10-29.md) 아님)\n[D20261029-silenttrain](2026-10-29.md) 사건에서 다룬 Cisco Catalyst SD-WAN 제로데이(CVE-2026-20127)와 관련해, Cisco Talos는 이 취약점을 쓰는 또 다른 공격조직(Talos 명명 **UAT-11473**)이 SD-WAN 컨트롤러에서 동작하는 커스텀 악성코드 프레임워크 \"KeyDrift\"를 배포했다고 밝혔다(보도, 10/29). KeyDrift는 ① 정상 vdaemon 프로세스 안에서 동작하며 명령 실행·파일 전송·트래픽 중계를 수행하는 \"PolyFlame\"과, ② SSL_read 함수를 후킹해 복호화된 제어 메시지에서 IPsec 데이터 평면 암호화 키(AES-256 추정)를 추출한 뒤 RSA로 암호화해 UDP로 빼내는 \"LittleFilch\"로 구성된다고 Talos는 설명했다. **중요한 점은 Talos가 \"UAT-11473의 운영 인프라가 Volt Typhoon의 'Silent Train' 은신 인프라와 상당히 겹친다(overlaps considerably)\"고 높은 신뢰도로 평가했을 뿐, 이것이 \"인프라 중첩\"이라는 관찰이며 \"두 조직이 동일하다\"는 결론으로 직접 쓰지는 않았다는 것이다 — 인프라를 공유한다고 해서 같은 행위자라고 확정할 수는 없다.** 또한 이 CVE를 2023년부터 제로데이로 써온 것으로 보도된 별도 군집 \"UAT-8616\"과의 관계도 보도에서 명확히 설명되지 않았다. 따라서 이번 보고서는 이 KeyDrift 활동을 D20261029-silenttrain과 같은 사건으로 병합하지 않고, 새 ATT&CK 매핑도 추가하지 않는다 — 공격조직 귀속이 겹치는지 여부가 아직 결론이 아니기 때문이다. 영향받는 조직은 CVE-2026-20127에 대한 Cisco 패치를 적용하고 Cisco의 SD-WAN 하드닝 가이드를 따를 것을 권고한다(본 보고서의 권고).\n\n## 3. 국내 소식\n\n**국내 질의 결과**: 지침에 따라 ①금융권 ②통신·이커머스 ③공공·지자체·교육·의료 ④국내 랜섬웨어 ⑤정부 발표 ⑥기존 사건 규모 갱신, 총 6개 범주를 각각 검색했다(검색어에 \"2026년 10월\" 포함). ①금융권(검색어: \"2026년 10월 금융권 해킹 개인정보 유출 은행 카드 저축은행\")은 기존에 기록된 16개사·약 10만 건, 555개사 긴급점검·130개사 미흡(이미 [10-26](2026-10-26.md) 보고서에 [D20261006-finsector](../과거3년/2026.md) 사건으로 기록)과 같은 내용이었으나, 10/14 발표의 세부 내용을 다룬 추가 기사(법률신문)에서 130개사의 미흡사항이 주로 \"최신 보안패치 미적용\", \"제조사 기술지원 종료 시스템 관리 부족\", \"24시간 관제체계 미구축\", \"다중요소 인증(MFA) 미도입\" 등 구체적 항목으로 세분화된 것을 확인해 `국내뉴스.psv`에 보강 기록했다(같은 사건, 새 사건 아님). ②통신·이커머스(검색어: \"2026년 10월 쿠팡 티빙 통신사 침해사고 개인정보 유출\")는 10월 신규 사건을 찾지 못했고, 검색 결과는 모두 기존 티빙 사건(2026년 5~6월 발생, 최종 집계 3,954만 계정)의 재인용이었다. ③공공·지자체·교육·의료(검색어: \"2026년 10월 공공기관 대학 의료기관 개인정보 유출 해킹\")도 10월 신규 사건을 찾지 못했다. ④국내 랜섬웨어(검색어: \"2026년 10월 국내 랜섬웨어 피해 기업\")는 10월 신규 피해를 찾지 못했고, 검색 결과는 해외(미국·인도 등) 통계와 4월 국내 중소기업 공격(기존 archived 사건)의 재인용뿐이었다. ⑤정부 발표(검색어: \"과기정통부 KISA 개인정보보호위원회 금융위 금감원 2026년 10월 발표 제재\")에서 찾은 내용은 모두 10/13~14에 이미 보도되고 기록된 내용의 재인용이었다(개인정보위 송경희 위원장 국감 발언, 금융위·금감원 10/14 발표). ⑥기존 사건 규모 갱신은 10/14 집계 이후의 추가 갱신치를 찾지 못했다.\n\n오늘 조사에서도 사건으로 등록할 만큼 크고 새로운 국내 사건·수치는 확인되지 않았다(①의 세부 항목 보강만 `국내뉴스.psv`에 추가했다) — 최근 며칠간의 조사와 동일한 결론이다.\n\n## 4. 우선 대응 체크리스트\n\n1. **GitLab CE/EE 자체 호스팅 운영 조직(최우선, 신규)**: [D20261030-gitlabrce](#d20261030-gitlabrce-gitlab-cicd-정규식-처리-결함-패치-2주-반-만에-실제-악용-확인cve-2026-97229-cvss-100) — CVSS 10.0 결함이 실제 악용 확인됨. 19.2.8·19.3.5·19.4.2 이상 즉시 업그레이드.\n2. **Cisco ASA/FTD SSL VPN 운영 조직(신규)**: [D20261030-ciscoasa](#d20261030-ciscoasa-cisco-asaftd-ssl-vpn-결함-실제-공격으로-장비-다운-확인cve-2026-76418) — 패치 즉시 적용, 장비 재부팅 이력 점검.\n3. **Drupal Commerce Core 운영 쇼핑몰(신규)**: [D20261030-drupalcommerce](#d20261030-drupalcommerce-drupal-commerce-core-접근제어-결함-실제-공격-진행-중cve-2026-118539) — 8.x-2.41/3.3.13 이상 즉시 업그레이드, 최근 주문 내역 점검.\n4. **CryptoBilis를 통해 Ledger 하드웨어 지갑을 구매한 이용자(신규)**: [D20261030-ledgerimplant](#d20261030-ledgerimplant-ledger-하드웨어-지갑-일부-물량에서-유통-단계-하드웨어-임플란트스파이-칩-확인) — 설정 중단 또는 새 기기·새 복구 문구로 즉시 자산 이전.\n5. **바이낸스 이용자·유사 내부 구조를 가진 금융·거래소 조직(신규)**: [D20261030-binance](#d20261030-binance-바이낸스-직원-노트북-침해로-시작된-사상-최대-규모약-63억-달러-암호화폐-탈취) — 거래소 공지 확인(이용자), 내부 서비스 접근 권한의 다중 승인 체계 점검(조직).\n6. Cisco Catalyst SD-WAN Controller/Manager 운영 조직: CVE-2026-20127 패치가 안 됐다면 즉시 적용 — [D20261029-silenttrain](2026-10-29.md)와 오늘 참고 기록(KeyDrift) 모두 이 CVE를 공통으로 지목.\n7. [10-17](2026-10-17.md)~[10-29](2026-10-29.md) 보고서의 PHP2Shell·Fragnesia 커널·Ivanti·Atlassian·Oracle EBS·So-net 등 — 기한이 지났거나 임박한 건이 많으므로 미조치 상태라면 우선 처리.\n\n## 5. 검증 수준과 한계\n\n- CISA KEV는 JSON 피드를 직접 받아 10/29 등재분(GitLab CVE-2026-97229, Cisco ASA/FTD CVE-2026-76418)의 dateAdded·dueDate·설명 원문을 확인했다(1차 출처). 피드 용량이 커 전체를 한 번에 읽지 못해 처음 10만 자 구간만 확인했으나, 결과가 dateAdded 내림차순으로 정렬돼 있어 10/30 신규 등재분이 없다는 결론은 신뢰할 수 있다고 판단했다.\n- 바이낸스 사건은 BleepingComputer 기사를 WebFetch로 직접 열람해 확인했다. 바이낸스의 공식 성명·블로그 원문은 이번 조사에서 직접 열람하지 못했다. \"직원 노트북 침해\"의 구체적 방식과 \"추가 침해 지점\"의 내용은 보도 시점까지 공개되지 않아 ATT&CK 매핑을 하지 않았다. 피해 금액(63억 달러 vs 64억 달러)도 출처별로 약간 다르다.\n- GitLab·Cisco·Drupal 세 건은 각 벤더의 보안 권고·자체 확인과 BleepingComputer 보도를 교차 확인했다. GitLab의 원본 보안 권고 페이지는 리다이렉트 문제로 직접 열람하지 못해 2차 보도(BleepingComputer)의 버전 정보를 썼다.\n- Ledger 임플란트 사건은 BleepingComputer 보도와 독립 연구자(Tibane Labs 등)의 분해 분석 보도를 확인했다. Ledger의 공식 성명 원문은 직접 열람하지 못했고, 정확한 피해 금액·대수는 보도마다 차이가 커(약 7,200만~9,300만 달러, 311~315대 등 출처별 불일치) 본문에 특정 수치를 확정해서 쓰지 않았다. 어느 유통 단계에서 변조가 이뤄졌는지도 아직 공개되지 않았다.\n- **중요 정정**: TheHackerNews 메인 페이지를 WebFetch로 열람했을 때 \"Official Claude Code Extension on Cursor Marketplace Trojanized with Persistent SSH Backdoor\"라는 제목의 기사가 요약돼 나왔으나, 이후 WebSearch와 원문 기사 URL 직접 열람(403 오류) 모두에서 이 사실을 뒷받침하는 근거를 찾지 못했다. 관련 WebSearch 결과는 전혀 다른 과거 사건들(5월 Nx Console 사건, China NVD의 Claude Code 경고 등)만 보여줬다. 1차 출처로 재확인되지 않은 내용을 그대로 보고서에 싣지 않기 위해 이번 보고서에는 이 사건을 채택하지 않았다 — 이는 WebFetch의 페이지 요약이 실제 페이지 내용과 다를 수 있다는 점을 보여주는 사례로 기록해 둔다.\n- Cisco SD-WAN KeyDrift 내용은 BleepingComputer가 보도한 Cisco Talos 연구를 WebFetch로 직접 열람해 확인했다. Talos의 원문 블로그는 직접 열람하지 못했다. UAT-11473과 Volt Typhoon의 관계는 Talos 블로그 원문을 WebFetch로 직접 확인했다 — Talos는 \"인프라가 상당히 겹친다\"를 높은 신뢰도로 평가했을 뿐 \"동일 조직\"이라고는 쓰지 않았다. UAT-8616과의 관계는 보도 수준에서만 확인했고 명확한 설명을 찾지 못해 매핑하지 않았다.\n- 국내 질의 6개 범주 모두 WebSearch로 수행했고(전문 매체 직접 열람은 일부만 수행), 결과 없음이 \"사건이 실제로 없다\"는 뜻인지 \"아직 보도되지 않았다\"는 뜻인지는 구분할 수 없다.\n\n## 출처\n\n- CISA KEV JSON 피드 (직접 확인)\n- BleepingComputer(직접 열람): \"Binance links $6.3 billion crypto theft to compromised DevOps laptop\", \"Binance probes potential $5.8 billion crypto-theft hack\", \"GitLab warns of max severity code execution vulnerability\", \"Drupal warns of critical Commerce Core flaw exploited in attacks\", \"Hackers exploit Cisco SD-WAN flaw to deploy custom KeyDrift malware\", \"Ledger confirms hardware wallet spy implant behind crypto thefts\", \"CISA says max severity GitLab flaw now exploited in the wild\", \"New Cisco firewall zero-day exploited to crash SSL VPN devices\", \"CISA warns of Fragnesia Linux flaw chained in PHP2Shell attacks\"\n- 법률신문: \"금융위, '금융권 침해사고 방지를 위한 금융보안 관리체계 강화' 추진\" (10/14 발표 상세)\n- Cisco Talos 블로그(직접 열람): \"UAT-11473\" KeyDrift 분석 원문 (Volt Typhoon Silent Train과의 인프라 중첩 평가 확인)\n- MITRE ATT&CK v19.2(저장소 기준, v20.0 공식 전환은 유지 확인됨, 재매핑 보류)\n"},{"path":"일일/2026-10-31.md","title":"일일 보안 이슈 분석 — 2026-10-31","md":"# 일일 보안 이슈 분석 — 2026-10-31\n\n> 수집 기준: 2026-10-31 공개·보도분([10-30 보고서](2026-10-30.md) 이후). CISA KEV(10/31 신규 등재 없음) 및 해외·국내 보도를 확인했다.\n> 근거 표기: **[확인]** 벤더·정부기관·연구기관이 직접 확인 / 보도 언론 보도 / **[추정]** 본 보고서의 추정 / **[주장]** 공격자 일방 주장. **조치는 본 보고서의 권고**이며 벤더 공식 지침이 우선한다.\n> **ATT&CK 버전 점검**: attack.mitre.org 기준 공식 버전은 **v20.0**이다.\n\n## 1. 오늘의 요약\n\n| # | 이슈 | 유형 | 상태 | 즉시 조치 |\n|---|------|------|------|-----------|\n| 1 | 블록체인 분석업체 Chainalysis 내부 시스템 침해 | 내부 시스템 비인가 접근(경위 미공개) | [확인] 회사 자체 발표 | 해당 없음(일반 이용자 직접 영향 보도 없음) |\n| 2 | AI 개발 플랫폼 연쇄 침해(Northflank 등 최소 9건, Wiz 보고서) | 클라우드 개발 플랫폼 침해(경위 미공개) | [확인] Northflank·Wiz 발표 | Northflank 등 이용 조직은 저장된 API 키·환경변수 전부 유출 가정하고 교체 |\n| 3 | 안드로이드 \"SMS of Death\" — 문자 한 통으로 전화 기능 마비(CVE-2026-58882) | 모바일 제로클릭 서비스 거부 | [확인] 연구자 PoC·기술분석 | Android 12·13 사용자는 공식 패치 전까지 발신자 불명 대량 문자 수신 시 기기 재부팅 대비 |\n\n## 2. 이슈별 분석\n\n### [D20261103-chainalysis] 블록체인 분석업체 Chainalysis 내부 시스템 침해\n> 날짜: 탐지 2026년 10월 중(구체일 미공개) · 공개 2026-10-30 · 보도 2026-10-31 · 유형: 내부 시스템·도구 비인가 접근(최초 침투 경로 미공개) · 행위자: 미귀속 · 지역: 전 세계(해외) · 근거: 확인(회사 자체 발표)\n\n**쉽게 말하면**: 법집행기관·거래소에 블록체인 분석 서비스를 제공하는 Chainalysis가 자사 내부 시스템에 외부인이 접근한 사실을 확인했다고 밝혔습니다. 회사는 \"공격형 에이전틱(AI 자동화) 기법\"이 쓰였다고 언급했지만, 구체적으로 어떤 기법인지, 어떤 결함이 이용됐는지는 공개하지 않았습니다. 유출 가능 정보는 사용자 ID·실명·이메일·조직 내 역할명 수준이며, 수사 자료 내용이나 로그인 인증정보·세션 토큰에 접근한 증거는 없다고 밝혔습니다. 같은 시기 보도된 바이낸스 해킹 사건과는 무관하다고 회사가 명시했습니다.\n\n**먼저 할 일(초보용)**: Chainalysis의 서비스를 이용하는 법집행기관·거래소 담당자는 회사의 공식 안내를 확인하고, 유출 가능 범위에 자신의 계정 정보(이름·이메일·역할명)가 포함되는지 문의하세요. 일반 이용자가 직접 할 일은 보도되지 않았습니다.\n\n**개요**: Chainalysis는 2026-10-30(금) 외부 행위자가 내부 시스템·도구에 접근한 사실을 확인했다고 발표했다. 회사는 \"공격형 에이전틱 기법(offensive agentic techniques)\"이라는 표현을 썼으나 이 표현의 정의나 사용된 구체적 프레임워크(예: 앞서 다룬 ARTEX 계열 도구 여부)는 공개하지 않았다. 노출 가능 데이터는 사용자 ID·실명·이메일 주소·조직 내 역할명이며, 투자 조사 내용이나 인증정보·세션 토큰에 접근한 증거는 발견하지 못했다고 밝혔다. 회사는 이 사건이 같은 시기 보도된 바이낸스 해킹(10-30 보고서의 `D20261030-binance`)과는 무관하다고 명시했다.\n\n**왜 일어났나**\n- 직접 원인 [미공개]: 외부 행위자가 내부 시스템·도구에 접근했다는 사실만 확인됐고, 최초 침투 방법(피싱, 자격증명 탈취, 취약점 악용 등)은 공개되지 않았다.\n- 구조적 원인: 공개되지 않음. \"에이전틱 기법\"이라는 표현만으로는 구조적 결함을 특정할 수 없다.\n\n**침투 경로 [미공개 — ATT&CK 매핑 보류]**: 최초 침투 방법이 공개되지 않아 이번 보고서는 이 사건에 ATT&CK 매핑을 하지 않는다.\n\n**어떻게 조치하나**\n- 즉시: (본 보고서의 권고) Chainalysis 서비스 이용 기관은 영향받는 계정 정보 범위를 회사에 직접 확인한다.\n- 단기: 유출 가능 정보(이름·이메일·역할명)를 이용한 표적 피싱(스피어피싱) 가능성에 대비해 관련 담당자에게 주의를 안내한다.\n- 장기: 이 사건은 추가 정보 공개 시 갱신한다.\n- 탐지: 해당 없음(공개된 정보 부족).\n\n**교훈**: \"에이전틱 AI 기법이 쓰였다\"는 발표만으로는 독자가 실제 위험을 판단하기 어렵다. 구체적 기법이 공개되지 않은 사건은 추측으로 메우지 않고 모르는 부분으로 남겨 두는 것이 정확하다.\n\n### [D20261103-aidevbreach] AI 개발 플랫폼 연쇄 침해(Northflank 등 최소 9건, Wiz \"Black October\" 보고서)\n> 날짜: Wiz 경보 2026-10-30 11:43(UTC) · Northflank 공개 2026-10-30 · 보도 2026-10-31 · 유형: 클라우드 개발·배포 플랫폼 침해(경위 미공개, 다수 플랫폼) · 행위자: 미귀속(플랫폼마다 동일 공격자인지 미확인) · 지역: 전 세계(해외) · 근거: 확인(Northflank·Wiz 발표)\n\n**쉽게 말하면**: 코드를 배포·실행해 주는 클라우드 플랫폼 'Northflank'가 보안업체 Wiz의 경보로 침해 사실을 알게 돼, 고객들에게 \"여러분의 환경변수(API 키 등 민감한 설정값)가 복호화되어 탈취됐다고 가정하라\"고 통보했습니다. 실제로 여러 고객이 자신의 AI API 키가 무단으로 쓰인 것을 신고했습니다. Wiz는 \"AI 개발 플랫폼들의 암울한 10월(Black October for AI Developer Platforms)\"이라는 보고서에서, 10월 한 달 동안 Northflank·Railway·OpenCode·Warp·Lightning AI 등 AI 개발용 플랫폼에서 최소 9건의 유사한 보안 사고를 확인했다고 밝혔습니다(사고마다 심각도·확인 수준이 다를 수 있고, 모두 같은 공격자인지도 확인되지 않음). 이 9건과는 별개로, 관련이 명확히 밝혀지지 않은 2건에서 탈취된 기업 자격증명으로 아마존의 AI 서비스(Bedrock)를 약 250만 번 호출해 약 10만 달러의 요금이 발생한 사례도 Wiz 보고서에 포함돼 있습니다(이 2건이 위 9개 플랫폼 침해의 직접적인 결과인지는 보도에서 명확히 연결되지 않습니다).\n\n**먼저 할 일(초보용)**: Northflank·Railway·OpenCode·Warp·Lightning AI 등을 이용한다면, 해당 플랫폼에 저장해 둔 모든 API 키·비밀값이 유출됐다고 가정하고 **지금 바로 교체(재발급)**하세요. AI 서비스 사용량·청구 내역에 평소와 다른 급증이 있는지도 함께 확인하세요.\n\n**개요**: Wiz는 2026-10-30 11:43(UTC)에 Northflank 관련 위협 경보를 발령했다. Northflank는 같은 날 침해 사실을 공개하며 고객 환경변수가 복호화·탈취됐을 가능성을 통보했고, 다수 고객이 AI API 키 무단 사용을 신고했다. Wiz의 \"Black October\" 보고서는 10월 한 달간 Northflank를 포함해 Railway·OpenCode·Warp·Lightning AI 등 AI 개발 플랫폼에서 최소 9건의 유사한 보안 사고를 확인했다고 밝혔다(사고별 심각도·확인 수준은 다를 수 있고, 플랫폼 간 공격자가 동일한지도 확인되지 않았다). 침투 경로는 어느 플랫폼에서도 구체적으로 공개되지 않았다. 이와는 별개로, 관련이 명확히 밝혀지지 않은 2건의 사례에서 탈취된 기업 자격증명으로 Amazon Bedrock API를 약 250만 회 호출해 약 10만 달러의 비용이 발생한 것으로 보도됐다.\n\n**왜 일어났나**\n- 직접 원인 [미공개]: 각 플랫폼의 구체적 침투 방법은 공개되지 않았다.\n- 구조적 원인 [추정 — 분석]: AI 개발 플랫폼은 고객의 API 키·모델 접근 권한을 평문 또는 복호화 가능한 형태로 보관하는 경우가 많아, 플랫폼 자체가 뚫리면 그 플랫폼을 쓰는 모든 고객의 AI 서비스 접근권이 동시에 노출되는 구조적 위험이 있다. 짧은 기간에 여러 유사 플랫폼이 동시에 침해됐다는 점은 AI 개발 생태계 전반의 보안 성숙도가 아직 낮을 가능성을 시사한다(추정).\n\n**침투 경로 [미공개 — ATT&CK 매핑 보류]**: 어느 플랫폼의 최초 침투 경로도 공개되지 않아 이번 보고서는 ATT&CK 매핑을 하지 않는다.\n\n**어떻게 조치하나**\n- 즉시: (본 보고서의 권고) 해당 플랫폼에 저장된 모든 API 키·비밀값을 유출로 가정하고, 키를 발급한 서비스(클라우드·AI 제공사) 쪽에서 기존 값을 직접 폐기한 뒤 안전한 별도 환경에서 재발급한다 — 침해된 플랫폼 안에서 새 키를 만들지 않는다.\n- 단기: AI 서비스(Bedrock 등) 사용량·청구 내역뿐 아니라 API 호출 로그·접근 기록을 함께 점검하고, 유출된 자격증명으로 새로 생성된 계정·권한이 있는지 클라우드·데이터베이스·저장소 접근 이력을 전수 조사한다. 예산 알림(이상 지출을 \"알려주는\" 기능)과 자동 지출 차단(초과 시 \"막는\" 기능)은 서로 다른 기능이므로 둘 다 설정돼 있는지 별도로 확인한다.\n- 장기: AI API 키처럼 민감한 비밀값은 플랫폼에 평문 보관하지 않고 별도 비밀 관리 서비스(KMS 등)와 연동한다.\n- 탐지: AI API 호출량·청구액의 급격한 증가, 평소와 다른 지역·시간대의 호출 패턴을 모니터링한다.\n\n**교훈**: 한 달 사이 비슷한 유형의 플랫폼 9곳이 잇따라 침해됐다는 사실은, 개별 사건의 원인을 따지기 전에 \"AI 개발 플랫폼\"이라는 카테고리 자체가 공격자들에게 새로운 표적군으로 떠올랐다는 신호로 읽어야 한다.\n\n### [D20261103-smsdeath] 안드로이드 \"SMS of Death\" — 문자 한 통으로 전화 기능 마비(CVE-2026-58882)\n> 날짜: 구글 보안 패치 포함 2026-10-01(일부 버전만, 공식 보안 게시판 미등재) · PoC 공개·보도 2026-10-31 · 유형: 모바일(안드로이드) 제로클릭 서비스 거부 · 행위자: 해당 없음(취약점 공개, 실제 악용 공격 사례는 보도되지 않음) · 지역: 전 세계(해외) · 근거: 확인(연구자 기술분석·PoC)\n\n**쉽게 말하면**: 연구자 Mark Blah는 안드로이드 전화 기능 내부의 문자(SMS) 처리 코드에서, 특수하게 조작한 문자 한 통만 받으면(열어보지 않아도, 문자함에 보이지도 않는 채로) 전화 기능이 그대로 멈춰버리는 결함(CVE-2026-58882)을 공개했습니다. 피해자가 아무것도 하지 않아도 공격이 성립하는 \"제로클릭\" 방식입니다. 같은 문자를 20통 반복해서 보내면 일부 구버전(안드로이드 12) 기기는 재부팅이 계속 반복되는 상태에 빠져 공장 초기화까지 해야 했던 사례도 보고됐습니다. 응급전화를 포함해 통화 자체가 안 되는 상태가 될 수 있어, 단순 불편을 넘어서는 위험입니다.\n\n**먼저 할 일(초보용)**: 휴대폰 설정에서 시스템 업데이트를 확인해 최신 보안 패치를 적용하세요(안드로이드 14 이상 일부 기기는 10월 패치로 해결된 것으로 보이나, 구글의 공식 보안 게시판에는 아직 정식으로 등재되지 않아 정확한 적용 범위는 제조사 공지를 확인해야 합니다). 안드로이드 12·13 기기는 현재 공식 패치가 없어 더 취약하니, 전화가 갑자기 먹통이 되면 기기를 재시작해 보고 반복되면 제조사 서비스센터에 문의하세요.\n\n**개요**: 연구자 Mark Blah가 공개한 분석에 따르면, 안드로이드의 `WapPushOverSms.decodeWapPdu` 함수가 WAP Push(통신사가 설정 정보 등을 단말기에 전달할 때 쓰는 특수 문자 형식) 데이터의 헤더 길이를 제대로 검증하지 않아, 조작된 WAP Push 메시지 한 통으로 전화 앱 프로세스(`com.android.phone`)를 크래시시킬 수 있다. 연구자가 확인한 일부 안드로이드 버전(14~17) 빌드에서는 2026-10-01 패치로 결함이 해결된 것으로 보이지만, 10월 공식 보안 게시판에는 이 CVE가 등재되지 않아 제조사별 정확한 적용 범위는 불분명하다. 안드로이드 12·13은 연구자가 확인한 범위에서 수정된 버전을 찾지 못했다고 보도됐다. PoC와 기술분석은 2026-10-31 보도됐다. 실제로 이 결함을 이용한 공격 사례가 보도된 것은 아니며, 이번 사건은 \"발견·공개된 취약점\"이다.\n\n**왜 일어났나**\n- 직접 원인 [확인]: WAP Push 데이터의 헤더 길이 검증 누락으로 메모리 처리 오류가 발생해 전화 프로세스가 크래시된다(연구자 기술분석).\n- 구조적 원인 [추정 — 분석]: SMS·WAP Push 같은 통신 프로토콜 처리 코드는 오래된 레거시 기능이면서도 전화 앱 같은 핵심 기능과 강하게 결합돼 있어, 한 곳의 입력 검증 결함이 기기 전체의 핵심 기능(통화)을 마비시킬 수 있다.\n\n**침투 경로 [확인 — 연구자 분석 기준]**: 공격자가 피해자의 전화번호로 조작된 WAP Push SMS 한 통(또는 반복 전송)을 보내면, 피해자의 아무 조작 없이 기기의 전화 프로세스가 크래시된다. 이 결함은 모바일 기기 자체의 취약점이라 ATT&CK Enterprise 매트릭스(이 저장소가 기준으로 쓰는 매트릭스)의 기법으로 정확히 대응시키기 어려워, 이번 보고서는 공식 ATT&CK 매핑을 보류하고 서술로만 남긴다.\n\n**어떻게 조치하나**\n- 즉시: (본 보고서의 권고) 최신 보안 패치가 있는 기기는 즉시 적용한다.\n- 단기: 안드로이드 12·13 사용자는 제조사의 패치 일정을 확인하고, 통신사에 WAP Push 메시지 필터링이 가능한지 문의한다.\n- 장기: 제조사·구글은 레거시 프로토콜(WAP Push 등) 처리 코드에 대한 입력 검증을 전면 재점검한다.\n- 탐지: 통신사 차원에서 동일 수신자에게 반복 전송되는 비정상 WAP Push 트래픽을 탐지한다.\n\n**교훈**: \"클릭이 필요 없는\" 제로클릭 결함은 피해자가 스스로 조심해서 막을 수 있는 방법이 없다 — 방어는 전적으로 제조사·통신사의 패치·필터링에 달려 있다.\n\n## 3. 우선 대응 체크리스트\n\n1. **Northflank·Railway·OpenCode·Warp·Lightning AI 등 AI 개발 플랫폼 이용 조직(최우선, 신규)**: [D20261103-aidevbreach](#d20261103-aidevbreach-ai-개발-플랫폼-연쇄-침해northflank-등-최소-9건-wiz-black-october-보고서) — 저장된 API 키·비밀값 전부 유출 가정하고 즉시 교체.\n2. **Android 12·13 사용자(신규)**: [D20261103-smsdeath](#d20261103-smsdeath-안드로이드-sms-of-death--문자-한-통으로-전화-기능-마비cve-2026-58882) — 공식 패치 전까지 특이 증상(전화 앱 반복 크래시) 발생 시 제조사 문의.\n3. **Chainalysis 서비스 이용 기관**: 회사 공식 안내 확인 및 표적 피싱 주의.\n\n## 4. 검증 수준과 한계\n\n- Chainalysis·Northflank(및 Wiz \"Black October\" 보고서의 다른 AI 개발 플랫폼) 사건은 최초 침투 경로가 공개되지 않아 ATT&CK 매핑을 하지 않았다.\n- 안드로이드 SMS of Death(CVE-2026-58882)는 연구자의 기술분석·PoC를 기준으로 했으며, 모바일 기기 자체의 취약점이라 ATT&CK Enterprise 매핑을 보류했다.\n\n## 출처\n\n- BleepingComputer: \"Chainalysis confirms breach of internal systems\", \"Northflank breach exposes customer AI API keys\", Wiz \"Black October for AI Developer Platforms\" 보고서 인용 기사, \"New Android 'SMS of Death' flaw can crash phone calls remotely\"\n- MITRE ATT&CK v19.2 / v20.0\n"},{"path":"일일/2026-11-01.md","title":"일일 보안 이슈 분석 — 2026-11-01","md":"# 일일 보안 이슈 분석 — 2026-11-01\n\n> 수집 기준: 2026-11-01 기준 국내 금융권 추가 확인 침해 및 일일 점검([10-31 보고서](2026-10-31.md) 이후). CISA KEV 11/1 신규 등재는 없다.\n> 근거 표기: **[확인]** 벤더·정부기관·연구기관이 직접 확인 / 보도 언론 보도 / **[추정]** 본 보고서의 추정 / **[주장]** 공격자 일방 주장. **조치는 본 보고서의 권고**이며 벤더 공식 지침이 우선한다.\n> **ATT&CK 버전 점검**: attack.mitre.org 기준 공식 버전은 **v20.0**이다.\n\n## 1. 오늘의 요약\n\n| # | 이슈 | 유형 | 상태 | 즉시 조치 |\n|---|------|------|------|-----------|\n| 1 | 국내 금융권에서 이전 보고서가 놓친 침해 5건 추가 확인(빗썸·대신증권·미래에셋·새마을금고·OK저축은행) | 금융사별 개별 침해(경위 상이) | [확인] 각 사 자체 발표·당국 신고 | 빗썸 이용자는 명의도용·보이스피싱 주의, 각 사 안내 확인 |\n\n## 2. 이슈별 분석\n\n### [D20261103-finsector2] 국내 금융권에서 이전 보고서가 놓친 침해 5건 추가 확인(빗썸·대신증권·미래에셋·새마을금고·OK저축은행)\n> 날짜: 발생/탐지 각각 — 새마을금고 2026-10-10, OK저축은행 2026-10-11(1차)·10-15(2차), 대신증권 탐지 2026-10-17·발표 2026-10-28, 빗썸 2026-10-27, 미래에셋자산운용 확인 2026-10-28 · 지역: 한국 · 유형: 금융사별 개별 침해(사별로 경위 상이, 대부분 미공개) · 행위자: 미확인(사별로 다를 수 있음, 기존 연쐐 해킹과의 연관성 불명) · 근거: 확인(각 사 자체 발표 또는 당국 신고 보도)\n\n**쉽게 말하면**: 지난 보고서들이 \"국내 금융권 신규 사건 없음\"으로 결론 내렸던 기간(10월 중) 사이에, 사실은 5개 금융사에서 추가로 개인정보 유출이 있었다는 것이 오늘 조사에서 확인됐습니다. 가장 심각한 곳은 가상자산거래소 **빗썸**으로, 사내 모바일 그룹웨어가 침해당해 고객 844명(주민등록번호·운전면허번호·신분증 사본 포함)과 임직원 715명의 정보가 유출됐습니다. **대신증권**은 비대면 계좌개설 연계 서버에 비정상 접근이 있어 3만8,490명의 정보(계좌번호 등 일부는 암호화)가 유출됐고, **새마을금고**(약 400명)·**OK저축은행**(1차 250명+2차 추가)·**미래에셋자산운용**(규모 미공개, 회사는 민감정보는 없었다고 주장)도 각각 피해를 신고했습니다. 이 5건이 9월 말부터 보도된 \"금융권 연쐐 해킹\"(`D20261006-finsector`, 신한·KB국민 등 7곳)과 같은 공격자의 소행인지는 **확인되지 않았습니다** — 시기가 겹치지만 각 회사가 지목한 침해 경로가 서로 다르고(그룹웨어 vs 계좌개설 서버 등), 공통 공격 IP 등 연결 증거가 보도되지 않았기 때문입니다.\n\n**먼저 할 일(초보용)**: 빗썸·대신증권·새마을금고·OK저축은행·미래에셋자산운용 중 거래하는 곳이 있다면, 해당 회사의 개별 안내(문자·이메일)를 확인하고 명의도용·대출 사기·보이스피싱 의심 전화를 조심하세요. 특히 빗썸은 신분증 사본·주민등록번호가 유출된 고객이 있으니, 명의도용 방지 서비스(공동인증서 등록 현황 조회, PASS 앱의 명의도용방지 기능 등) 가입을 검토하세요. 비밀번호 변경은 시작점일 뿐이며, 이미 발급된 로그인 상태(세션)는 비밀번호만 바꿔서는 사라지지 않으므로 각 사의 \"전체 기기 로그아웃\" 기능이 있다면 함께 쓰세요.\n\n**개요**: 이번 조사(2026-11-03)에서 ①금융권 범주 검색 중 이전 보고서들이 놓쳤던 5개 금융사의 개별 발표를 추가로 확인했다. 빗썸은 외부 해커가 사내 모바일 그룹웨어에 침입했다고 2026-10-29 밝혔으며, 사고는 10/27 오전 약 1시간 발생했고 레거시 서비스 시스템이나 고객 DB 자체가 직접 침해된 정황은 확인되지 않았다고 설명했다(SBS Biz 직접 열람). 대신증권은 10/17 외부 이상 접근 징후를 포착해 금융보안원과 약 열흘간 6만여 건의 신호를 전수조사한 뒤 10/28 유출 항목(고객명·이메일·주소·통신ID·은행명·계좌번호 등 8개 항목)과 3만8,490명 규모를 공식 발표했고, 2차 피해나 핵심 업무시스템 불법 접근은 없었다고 밝혔다(SBS Biz 직접 열람). 미래에셋자산운용은 10/28 일부 업무시스템 정보 유출을 확인했으나 고유식별정보·민감정보·신용정보는 유출되지 않았다고 주장했다(회사 측 주장, 독립 확인 안 됨). 새마을금고는 10/10(연휴 중) 발생분을 10/13 당국에 신고했으며 약 400명의 이름·암호화된 주민번호·주소·계좌번호·잔액 등이 대상이었다. OK저축은행은 10/11 1차(250명, 이름·생년월일·주소·연간소득·대출금액)에 이어 10/15 2차 침입이 추가로 확인됐다. 이 5건과 기존 `D20261006-finsector`(16개사·약10만건으로 집계된 연쐐 해킹)의 연관성은 보도에서 확인되지 않았으며, 본 보고서도 임의로 연결하지 않는다.\n\n**왜 일어났나**\n- 직접 원인 [확인/보도 — 사별로 다름]: 빗썸은 \"사내 모바일 그룹웨어 비인가 접근\", 대신증권은 \"비대면 증권계좌개설 연계서버의 비정상 접근\"을 지목했다. 나머지 3사는 구체적 침투 방법을 공개하지 않았다.\n- 구조적 원인 [추정 — 분석]: 금융사의 핵심 거래 시스템이 아니라 그룹웨어·연계서버·모집인 시스템 같은 **보조·연계 시스템**이 반복적으로 공격 통로가 되고 있다는 점이 9월 이후 여러 사건에서 공통으로 나타난다(다만 이것이 동일 공격자를 뜻하지는 않는다 — 보조 시스템이 상대적으로 보안 투자가 적다는 업계 전반의 구조적 약점일 수 있다).\n\n**침투 경로 [일부 공개 — 사별로 상이, 전체 경위는 미공개]**: 빗썸은 그룹웨어 접근 이후 단계, 대신증권은 연계서버 비정상 접근 이후 단계가 공개되지 않았다. 나머지 3사는 침투 경로 자체가 보도에 없어 ATT&CK 매핑을 하지 않는다.\n\n**어떻게 조치하나**\n- 즉시: (각 사 권고) 피해 고객에게 개별 통지, 명의도용·보이스피싱 주의 안내. 담당 부서는 증거(그룹웨어·연계서버 접근 로그) 보존 후 침해 경로 차단.\n- 단기: 그룹웨어·비대면 계좌개설 연계서버 등 보조 시스템의 접근 통제·인증 강화, 영향 가능 기간의 계좌번호·인증정보 재확인.\n- 장기: 핵심 업무 시스템과 분리된 보조 시스템에도 핵심 시스템과 동등한 수준의 모니터링·접근 통제를 적용.\n- 탐지: 그룹웨어·연계서버에 대한 비정상 접근 패턴(이례적 시간대·대량 조회) 모니터링.\n\n**교훈**: \"금융권 연쐐 해킹\"처럼 하나의 큰 사건으로 보도된 뒤에는, 비슷한 시기에 발생한 개별 회사 사건들이 같은 사건으로 뭉뚱그려지거나 반대로 누락되기 쉽다. 각 회사의 발표를 개별적으로 추적해야 실제 피해 범위를 놓치지 않는다.\n\n## 3. 국내 소식\n\n- **①금융권**: 10/10~10/28 사이 발생해 이전 보고서들이 놓쳤던 금융사 5곳(빗썸·대신증권·미래에셋자산운용·새마을금고·OK저축은행)의 개별 발표를 새로 확인해 `D20261103-finsector2`로 기록했다. 기존 `D20261006-finsector`(16개사·약 10만 건)와의 연관성은 확인되지 않았다.\n- **소규모 소식(`국내뉴스.psv`에 기록)**: 가상자산 매체 블록미디어가 2026-10-12 자사 홈페이지 해킹으로 이메일·암호화 비밀번호(최대 3,124명)·로그인 세션정보(최대 2,772명) 유출 가능성을 공지했다(회사 자체 발표).\n\n## 4. 우선 대응 체크리스트\n\n1. **빗썸·대신증권·새마을금고·OK저축은행·미래에셋자산운용 거래 고객(최우선)**: [D20261103-finsector2](#d20261103-finsector2-국내-금융권에서-이전-보고서가-놓친-침해-5건-추가-확인빗썸대신증권미래에셋새마을금고ok저축은행) — 각 사 안내 확인, 빗썸 이용자는 명의도용 방지 서비스 가입 검토.\n2. **금융사 보조·연계 시스템 담당자**: 그룹웨어·비대면 계좌개설 연계서버 등 외부 접점 보조 시스템의 접근 통제·인증 강화.\n\n## 5. 검증 수준과 한계\n\n- 국내 금융권 5건은 SBS Biz 등 언론 보도를 통해 확인했으며, 빗썸·대신증권 2건은 기사 원문을 직접 열람했다. 미래에셋자산운용의 \"민감정보 미유출\" 주장은 회사 측 발표를 인용한 것으로 독립 검증은 이뤄지지 않았다.\n\n## 출처\n\n- SBS Biz: \"빗썸, 고객정보 추가 유출 확인\"(biz.sbs.co.kr/article/20000343129), \"대신증권, 고객 3만8490명 개인정보 유출\"(biz.sbs.co.kr/article/20000342566)\n- 블록미디어(자체 공지): 개인정보 유출 가능성 안내(2026-10-12)\n- MITRE ATT&CK v19.2 / v20.0\n"},{"path":"일일/2026-11-02.md","title":"일일 보안 이슈 분석 — 2026-11-02","md":"# 일일 보안 이슈 분석 — 2026-11-02\n\n> 수집 기준: 2026-11-02 공개·보도분([11-01 보고서](2026-11-01.md) 이후). CISA KEV 11/2 신규 등재는 없다.\n> 근거 표기: **[확인]** 벤더·정부기관·연구기관이 직접 확인 / 보도 언론 보도 / **[추정]** 본 보고서의 추정 / **[주장]** 공격자 일방 주장. **조치는 본 보고서의 권고**이며 벤더 공식 지침이 우선한다.\n> **ATT&CK 버전 점검**: attack.mitre.org 기준 공식 버전은 **v20.0**이다.\n\n## 1. 오늘의 요약\n\n| # | 이슈 | 유형 | 상태 | 즉시 조치 |\n|---|------|------|------|-----------|\n| 1 | Synology NAS 대상 C3RB3R(Cerber 계열) 랜섬웨어, 진입 경로는 출처 간 불일치 | NAS 랜섬웨어 | 보도(Synology 일부 확인) | 구버전 DSM 즉시 업데이트, 외부 노출 NAS 점검 |\n| 2 | 유럽 슈퍼마켓 냉동·냉장 시스템 원격 조작, 벨기에·네덜란드 등 115개+ 매장 | 산업제어(OT) 원격 조작(경위 미공개) | 보도(업체 일부 확인) | 해당 설비 운영사는 원격 접근 경로 점검 |\n\n또한 [10-13 보고서](2026-10-13.md)의 Ivanti Connect Secure 사건(`D20261013-ivanti`)에 대한 11/2 후속 소식(추가 패치 2건, 로그 조작 확인)을 참고 기록으로 덧붙인다.\n\n## 2. 이슈별 분석\n\n### [D20261103-synologyc3rb3r] Synology NAS 대상 C3RB3R(Cerber 계열) 랜섬웨어, 진입 경로는 출처 간 불일치\n> 날짜: 공격 시작 2026년 10월 초 · Synology 확인 성명 2026-10-29 · 보도 2026-11-02 · 유형: NAS(개인·기업용 네트워크 저장장치) 랜섬웨어 · 행위자: 미귀속(보도상 C3RB3R/옛 Cerber 랜섬웨어 계열로 식별) · 지역: 전 세계(한국 내 피해도 일부 보도) · 근거: 확인(Synology 자체 확인 — 암호화 피해 사실)·보도(랜섬웨어 계열명, 진입 경로는 출처 간 불일치)\n\n**쉽게 말하면**: 대만 회사 Synology가 만드는 가정·기업용 네트워크 저장장치(NAS)가 랜섬웨어(파일을 암호화하고 돈을 요구하는 악성코드)에 감염돼 파일이 암호화되는 사고가 10월 초부터 잇따랐습니다. 보도·연구자들은 이 악성코드를 'C3RB3R'(옛 Cerber 랜섬웨어 계열)로 식별했습니다. 파일 확장자가 `.L0CK3D`로 바뀌고 폴더마다 비트코인을 요구하는 메모가 남겨집니다. 다만 공격자가 정확히 어떤 결함으로 침투했는지는 보도마다 다르게 나와(일부는 9월에 이미 패치된 결함, 다른 보도는 최고 위험도의 새 결함 2건을 지목) 이번 조사에서 확정하지 못했습니다. 한국 매체(조선비즈)도 국내에서 비슷한 피해가 다수 발생했다고 전했으나 같은 캠페인인지는 확인되지 않았습니다.\n\n**먼저 할 일(초보용)**: Synology NAS를 쓴다면 지금 바로 DSM(운영체제) 버전을 최신으로 업데이트하고, 인터넷에 직접 노출된 관리 포트가 있다면 막으세요. 이미 파일이 `.L0CK3D`로 바뀌었다면 **몸값을 지불하지 말고**, 감염된 장비를 네트워크에서 분리한 뒤 백업(오프라인 백업이 있다면)으로 복구를 시도하세요.\n\n**개요**: Synology는 2026-10-29 성명에서 NAS 장비가 랜섬웨어에 감염돼 파일이 암호화되는 피해를 입었다고 확인했다. 피해 장비는 파일이 암호화돼 `.L0CK3D` 확장자로 바뀌고 각 폴더에 비트코인 지불을 요구하는 랜섬노트가 남는다. 이 랜섬웨어가 'C3RB3R'(옛 Cerber 계열)이라는 점은 보도·연구자 분석 수준의 식별이며, Synology 성명이 이 계열명 자체를 직접 확인한 것인지는 이번 조사에서 확정하지 못했다. 진입 경로에 대해서는 중국 보안업체 360이 \"9월에 이미 패치된 DSM 결함 2건\"을 지목한 반면, 다른 보도는 \"CVSS 10.0 원격코드실행 결함 2건\"을 지목해 **출처 간 불일치**가 있다. Synology는 구버전 DSM 사용자에게 즉시 업데이트를 권고했다. 한국 매체 보도에서도 국내 Synology NAS 이용자 피해가 다수 있다고 전했으나, 해외 캠페인과 동일한 것인지는 확인되지 않았다.\n\n**왜 일어났나**\n- 직접 원인 [보도 — 출처 불일치, 미확정]: NAS가 랜섬웨어에 감염돼 파일이 암호화된 것은 확인됐으나, 정확히 어떤 취약점(패치된 구결함 vs 신규 결함)으로 침투했는지는 출처마다 다르게 보도돼 이번 보고서는 특정하지 않는다.\n- 구조적 원인 [추정 — 분석]: 가정·소규모 기업이 쓰는 NAS는 관리 포트를 인터넷에 직접 열어두는 경우가 많고, 패치 적용이 기업 서버보다 느린 경향이 있어 반복적으로 랜섬웨어 표적이 된다(Synology NAS는 과거에도 여러 차례 랜섬웨어 캠페인의 표적이 됐다).\n\n**침투 경로 [미확정 — ATT&CK 매핑 보류]**: 진입 취약점이 출처마다 달라 구체적인 ATT&CK 초기접근 기법을 특정하지 않는다. 다만 파일 암호화라는 영향(impact) 자체는 Synology가 직접 확인했다.\n\n**어떻게 조치하나**\n- 즉시: (본 보고서의 권고) DSM을 최신 버전으로 업데이트하고, 감염이 의심되면 네트워크 연결을 끊어 추가 암호화·확산을 막은 뒤(패치 적용 자체는 미루지 않는다) 오프라인 백업으로 복구를 시도한다. 몸값 지불은 복구를 보장하지 않는다.\n- 단기: NAS 관리 포트(특히 QuickConnect, 원격 관리)가 인터넷에 직접 노출돼 있었는지 점검하고, 노출돼 있었다면 차단 후 접근 로그를 점검한다.\n- 장기: NAS를 포함한 모든 네트워크 저장장치에 대해 오프라인(연결 끊긴) 백업 체계를 별도로 둔다.\n- 탐지: NAS 파일시스템의 대량 확장자 변경(특히 `.L0CK3D` 패턴), 비정상적으로 짧은 시간 내 대량 파일 쓰기를 모니터링한다.\n\n**교훈**: 진입 경로가 불확실한 사건에서는 \"어느 결함이었는지\"를 단정하기보다, 확인된 피해(파일 암호화)에 대한 복구·백업 대응을 먼저 챙기는 것이 실질적이다.\n\n### [D20261103-eufridge] 유럽 슈퍼마켓 냉동·냉장 시스템 원격 조작, 벨기에·네덜란드 등 115개+ 매장\n> 날짜: 주 사건 2026-11-01 밤~11-02 새벽 · 선행 사건 2026년 10월(프랑스) · 보도 2026-11-02 · 유형: 산업제어(OT) 시스템 원격 조작(최초 침투 경로 미공개) · 행위자: 미귀속(단일/복수 캠페인 여부 불명) · 지역: 유럽(벨기에·네덜란드·스웨덴·룩셈부르크·아일랜드·에스토니아) · 근거: 확인 일부(냉동설비업체 성명)·보도\n\n**쉽게 말하면**: 벨기에·네덜란드·스웨덴 등 유럽 여러 나라의 슈퍼마켓 115개 이상(ICA, Coop, Ahold Delhaize, Carrefour 등)에서 냉동고·냉장고의 온도 설정이 외부에서 원격으로 바뀌거나 \"해빙(서리 제거) 모드\"로 전환돼, 보관 중인 식품이 상할 뻔한 사고가 11월 1일 밤부터 2일 새벽 사이에 발생했습니다. 냉동설비업체 Sabcobel은 이달 초 프랑스에서도 비슷한 사고가 있었고 \"같은 결함\"이 쓰였다고 밝혔습니다. 다만 공격자가 정확히 어떻게 시스템에 접근했는지는 아직 공개되지 않았습니다.\n\n**먼저 할 일(초보용)**: 이 유형의 냉동·냉장 제어시스템(Danfoss AK-SM/AK-SC, Copeland/Dixell XWEB 등)을 운영하는 매장·물류센터 담당자는 제어 장비가 인터넷에서 직접 접근 가능한 상태인지 지금 확인하고, 그렇다면 원격 접근을 차단하거나 비밀번호·접근 통제를 강화하세요. 일반 소비자가 할 일은 없습니다.\n\n**개요**: 11/1 밤부터 11/2 새벽 사이 벨기에·네덜란드·스웨덴·룩셈부르크·아일랜드·에스토니아의 슈퍼마켓 115개 이상에서 냉동·냉장 설비 온도 설정이 원격으로 변경되거나 해빙 모드로 전환됐다. 냉동설비업체 Sabcobel은 이 사고가 2026년 10월 프랑스에서 발생한 선행 사건(Danfoss AK-SM/AK-SC, Copeland/Dixell XWEB 컨트롤러 대상)과 \"동일한 취약점\"을 쓴 것이라고 밝혔다. Sabcobel은 \"소프트웨어 패치만으로는 부족하며 물리적 개조도 필요할 수 있다\"고 언급했다. 공격자의 정체와 단일/복수 캠페인 여부는 불명이며, 최초 침투 경로도 공개되지 않았다.\n\n**왜 일어났나**\n- 직접 원인 [미공개]: 어떤 결함·경로로 제어시스템에 접근했는지 공개되지 않았다. 업체가 \"동일한 취약점\"이라고 밝힌 것으로 보아 특정 제품군의 공통 결함일 가능성이 있으나 CVE 등 구체적 식별자는 보도되지 않았다.\n- 구조적 원인 [추정 — 분석]: 산업제어(OT) 장비는 전통적으로 인터넷 연결을 염두에 두지 않고 설계돼 인증·암호화가 약한 경우가 많고, 원격 모니터링 편의를 위해 인터넷에 직접 노출되는 경우 공격 표면이 커진다. 식품 매장 운영사 입장에서는 이런 제어시스템이 IT 부서가 아니라 설비 담당 부서가 관리해 보안 패치 주기에서 누락되기 쉽다(추정).\n\n**침투 경로 [미공개 — ATT&CK 매핑 보류]**: 최초 침투 방법이 공개되지 않아 이번 보고서는 ATT&CK 매핑을 하지 않는다.\n\n**어떻게 조치하나**\n- 즉시: (본 보고서의 권고) Danfoss·Copeland/Dixell 등 해당 제어장비 운영사는 벤더 보안 공지를 확인하고, 장비가 인터넷에 직접 노출돼 있다면 즉시 차단한다.\n- 단기: 과거 온도 변경 로그에서 비정상 원격 접속 흔적이 있는지 점검.\n- 장기: OT 장비는 업무망과 분리된 별도 네트워크에 두고, IT 보안팀이 설비 부서와 함께 패치·접근 통제를 관리하는 체계를 둔다.\n- 탐지: 냉동·냉장 설비의 원격 설정 변경 이벤트에 대한 실시간 알림 체계를 둔다.\n\n**교훈**: 사이버 공격이 데이터 유출이 아니라 \"식품이 상한다\"는 물리적 피해로 이어질 수 있다는 점은, OT(산업제어) 보안이 IT 보안과 똑같은 우선순위로 다뤄져야 함을 보여준다.\n\n### 참고 기록 — Ivanti Connect Secure 공격 체인, 추가 CVE 2건 패치·로그 조작 확인(기존 [D20261013-ivanti](2026-10-13.md) 후속)\n[10-13 보고서](2026-10-13.md)에서 다룬 Ivanti Connect Secure 인증 우회 결함(CVE-2026-104935, 행위자 UTA0576)의 공격 체인에 대해, Volexity는 2026-11-02 보도를 통해 두 가지 추가 사실을 확인했다. 첫째, Ivanti는 같은 공격 체인에 쓰인 추가 결함 2건(권한상승 CVE-2026-111357, 파일 업로드 CVE-2026-118527)을 11/2 패치했다. 둘째, 공격자가 패치된 ICS 장비에서도 **명령을 실행할 때마다 다시 익스플로잇**하는 방식으로 웹셸 등 상주 악성코드를 설치하지 않는 모습이 관측됐고, 별도로 Ivanti의 정품 확인 도구(Integrity Checker Tool)의 로그 기반 탐지를 피하려 한 것으로 보이는 **로그 조작**도 Volexity에 의해 확인됐다. 로그 조작 사실만 ATT&CK 기법 T1070(흔적·로그 지우기, TA0005 스텔스)으로 `D20261013-ivanti` 사건에 새 매핑 행을 추가한다. 영향받는 조직은 Ivanti의 11/2 패치를 즉시 적용하고, 로그만으로 침해 여부를 판단하지 말고 메모리·디스크 포렌식을 함께 수행할 것을 권고한다.\n\n## 3. 우선 대응 체크리스트\n\n1. **Synology NAS 운영자(신규)**: [D20261103-synologyc3rb3r](#d20261103-synologyc3rb3r-synology-nas-대상-c3rb3rcerber-계열-랜섬웨어-진입-경로는-출처-간-불일치) — DSM 즉시 업데이트, 오프라인 백업 확보.\n2. **유럽 및 국내외 슈퍼마켓·물류 냉동설비 운영사(신규)**: [D20261103-eufridge](#d20261103-eufridge-유럽-슈퍼마켓-냉동냉장-시스템-원격-조작-벨기에네덜란드-등-115개-매장) — 원격 접근 가능한 제어장비 점검.\n3. **Ivanti Connect Secure 운영 조직(기존 사건 후속)**: 11/2 추가 패치(CVE-2026-111357, CVE-2026-118527) 즉시 적용, 로그 외 메모리·디스크 포렌식 병행.\n\n## 4. 검증 수준과 한계\n\n- Synology C3RB3R의 정확한 진입 취약점(패치된 9월 결함 vs CVSS 10.0 신규 결함 2건)은 출처 간 불일치가 있어 단정하지 않았다.\n- 유럽 냉동설비 사건은 최초 침투 경로가 공개되지 않아 ATT&CK 매핑을 하지 않았다.\n\n## 출처\n\n- BleepingComputer: \"European supermarkets hit by remote tampering of refrigeration systems\", \"Synology confirms C3RB3R ransomware attacks on NAS devices\", \"Ivanti patches two more flaws in ongoing exploit chain\"\n- MITRE ATT&CK v19.2 / v20.0\n"},{"path":"일일/2026-11-03.md","title":"일일 보안 이슈 분석 — 2026-11-03","md":"# 일일 보안 이슈 분석 — 2026-11-03\n\n> 수집 기준: 2026-11-03 공개·보도분([10-31](2026-10-31.md)~[11-02](2026-11-02.md) 보고서 이후). CISA KEV JSON 피드 및 해외·국내 보도를 확인했다.\n> 근거 표기: **[확인]** 벤더·정부기관·연구기관이 직접 확인 / 보도 언론 보도 / **[추정]** 본 보고서의 추정 / **[주장]** 공격자 일방 주장. **조치는 본 보고서의 권고**이며 벤더 공식 지침이 우선한다.\n> **ATT&CK 버전 점검**: attack.mitre.org 직접 확인 결과 공식 버전은 여전히 **v20.0**이다.\n\n## 1. 오늘의 요약\n\n| # | 이슈 | 유형 | 상태 | 즉시 조치 |\n|---|------|------|------|-----------|\n| 1 | 중국계 Vapor Panda, AI 에이전트 프레임워크 'ARTEX'로 14개국 200개+ 조직 동시 공격 | AI 자동화 침투(공개 취약점 악용+웹셸+자격증명 위조) | [확인] CrowdStrike 조사, 최소 9곳 실제 침해 확인 | ARTEX 관련 공개 취약점(Zammad 등) 패치 여부 점검, EDR 우회 가능성 인지 |\n\n> 공백일(10/31~11/02) 사건은 각각 [2026-10-31](2026-10-31.md)(Chainalysis·Northflank 등 AI 개발 플랫폼·Android SMS of Death), [2026-11-01](2026-11-01.md)(국내 금융권 5곳 추가 확인), [2026-11-02](2026-11-02.md)(Synology C3RB3R·유럽 슈퍼마켓 냉동설비·Ivanti 후속) 보고서에 분리 수록했다.\n\n## 2. 이슈별 분석\n\n### [D20261103-vaporpanda] 중국계 Vapor Panda, AI 에이전트 프레임워크 'ARTEX'로 14개국 200개+ 조직 동시 공격\n> 날짜: 캠페인 시작 2026-10-17 · CrowdStrike 공개 2026-10-29 · 추가 보도 2026-11-02 · 유형: 공개 인프라 취약점 악용 + AI 에이전트 자동화 정찰·공격 · 행위자: Vapor Panda(CrowdStrike 명명, 중국계로 평가) · 지역: 전 세계(최소 14개국) · 근거: 확인(CrowdStrike 조사, 보도로 교차 확인)\n\n**쉽게 말하면**: 보안업체 CrowdStrike는 중국과 연계된 것으로 보이는 해킹 조직 'Vapor Panda'가 사람이 아니라 **AI 에이전트(스스로 여러 단계를 이어서 판단하고 실행하는 AI 프로그램)**를 이용해 10월 17일부터 전 세계 14개 나라, 200개 넘는 조직(통신·제약·반도체·국방·원자력·금융 등)을 동시에 공격했다고 밝혔습니다. 실제로 내부까지 뚫린 것으로 확인된 곳은 최소 9곳입니다. 공격에 쓰인 'ARTEX'라는 AI 에이전트 도구는 중국 AI 모델 '딥시크(DeepSeek)'를 주로 활용했고, 사람 운영자는 중요한 결정에만 개입했습니다. 이 ARTEX 도구는 과거 한국 금융권을 노린 공격(올해 9~10월, 신한·KB국민 등)과 미국 커넥트와이즈(ConnectWise) 침해 사건(10월, Storm-0940 조직)에도 쓰인 바 있는 도구이지만, CrowdStrike는 이번 Vapor Panda 캠페인이 그 사건들과는 **별개**라고 밝혔습니다 — 즉 같은 \"도구\"를 여러 조직이 나눠 쓰고 있을 가능성이 있다는 뜻이며, 조직이 같다는 뜻은 아닙니다.\n\n**먼저 할 일(초보용)**: 일반 이용자가 바로 할 일은 없습니다. 조직의 보안 담당자는 외부에 노출된 서비스(특히 오픈소스 헬프데스크·협업 도구 등)의 패치 현황을 점검하고, 사용 중인 EDR(침해 탐지 솔루션)이 공격자의 우회 설정 대상으로 지목되지 않았는지 벤더 공지를 확인하세요.\n\n**개요**: CrowdStrike는 2026-10-29 보고서에서 Vapor Panda가 'ARTEX'라는 에이전트형 AI 프레임워크(메인 에이전트·계획 에이전트·작업 에이전트·사람 운영자·공유 결과 저장소로 구성)로 10/17부터 14개국 이상 200개 조직 이상을 표적으로 삼았다고 밝혔다. 주로 딥시크를 백엔드로 썼고, 식별하지 못한 구독형 상업용 LLM을 보조로 썼다는 보도도 있다(보완 모델이 정확히 무엇인지는 출처마다 다르게 보도됨). CrowdStrike는 실제 침해 후 활동(post-exploitation)이 확인된 곳이 최소 9곳이라고 밝혔고, 별도로 12곳에서는 비밀번호 대입·자격증명 스캐닝 시도가 있었다고 전해졌다 — 즉 \"200개 조직\"은 대부분 표적 정찰·시도 단계였고 실제 뚫린 곳은 훨씬 적다는 점을 분명히 해야 한다. 그리스 정부 기관 공격에서는 2022년에 유출된 적이 있던 메일서버 암호화 키를 이용해 관리자 인증 토큰을 위조한 사례가 확인됐다. 또한 CrowdStrike Falcon(EDR) 제품이 설치된 장비는 건너뛰도록 공격자가 지시한 것으로 나타났다. 별개로, 네덜란드 취약점공개기관(DIVD)은 9월 자사 디코이(가짜) 서버 — 즉 실제 조직이 아니라 공격자를 유인·관찰하려고 만들어 둔 가짜 서버 — 가 Zammad 헬프데스크 소프트웨어의 제로데이(공개 안 된 결함)와 로컬 권한상승 결함을 체이닝(chaining, 여러 결함을 연달아 엮어 쓰는 방식)한 공격으로 **12분 만에 root 권한**까지 탈취당한 사례를 같은 ARTEX 도구 사용으로 귀속했다. 이 디코이 사례가 CrowdStrike가 집계한 \"실제 침해 확인 9곳\"에 포함되는지는 보도에서 명확히 밝혀지지 않았다. ARTEX는 Vapor Panda가 직접 만든 도구라는 근거는 없다 — 원래 오픈소스로 공개됐다가, 한국 금융권 공격 배후로 지목된 뒤 개발자가 비공개로 전환한 것으로 보도된 기존 도구를 가져다 쓴 것으로 보인다(10-23 보고서의 `D20261023-connectwise` 참고).\n\n**왜 일어났나**\n- 직접 원인 [확인]: 공개 인프라(헬프데스크 소프트웨어 등)의 알려지지 않은 결함을 AI 에이전트가 자동으로 찾아 악용하고, 웹셸을 심거나 유출된 과거 키로 인증 토큰을 위조해 침투했다(CrowdStrike·DIVD 분석).\n- 구조적 원인 [추정 — 분석]: AI 에이전트형 공격 도구가 오픈소스로 공개되면 누구나 가져다 쓸 수 있게 되고, 비공개로 전환된 뒤에도 이미 퍼진 사본이나 파생 도구가 여러 조직에 의해 각자 운용될 수 있다. 사람 운영자가 핵심 판단에만 개입하는 구조는 동시에 수백 개 표적을 정찰·시도하는 속도를 크게 높인다(다만 실제 \"침해\" 성공률 자체가 올라갔다는 근거는 이번 보도에 없다 — 표적 수와 성공 수를 구분해야 한다).\n\n**침투 경로 [확인 — 사례별]**: (1) 그리스 정부: 2022년 유출된 메일서버 키로 관리자 토큰 위조 → 내부 접근. (2) DIVD 디코이: Zammad 제로데이로 초기 침투 → 로컬 권한상승 결함 체이닝 → 12분 내 root 권한. (3) 그 외 다수 표적: 구체적 최초 침투 방법은 CrowdStrike 보고서에서 사례별로 공개되지 않았다.\n\n**어떻게 조치하나**\n- 즉시: (본 보고서의 권고) Zammad 등 헬프데스크·협업 소프트웨어를 쓰는 조직은 최신 패치 여부를 확인한다. 증거(접속 로그·에이전트 실행 흔적) 보존 후 패치를 진행하되 패치를 미루지 않는다. 비밀번호 대입 시도를 받은 조직은 해당 계정에 MFA(다중요소 인증)를 적용하고 로그인 시도 횟수를 제한한다.\n- 단기: 2022년 등 과거 유출된 키·인증서가 여전히 유효한지 전수 점검하고, 유효하면 그 키에 대한 신뢰 자체를 철회(폐기)한 뒤 새 환경에서 재발급한다(위조 토큰 공격의 재료가 되므로). 위조된 인증 토큰·세션이 있었다면 모두 무효화하고, 관리자 인증 로그를 다시 조사해 웹셸 등 상주 악성코드가 남아 있는지 확인한다.\n- 장기: EDR 제품의 존재 여부로 공격을 건너뛰는 지능형 공격자를 전제로, 단일 EDR 탐지에만 의존하지 않는 다계층 방어(네트워크 분리, 이상 행위 기반 탐지)를 구성한다.\n- 탐지: 짧은 시간 내 다수 표적에 대한 반복적인 취약점 스캐닝·비밀번호 대입 패턴(이상 로그인 포함), 사람이 수행하기 어려운 속도의 연쇄 작업 로그를 모니터링한다.\n\n**교훈**: \"AI 에이전트가 공격했다\"는 표현에 현혹되기보다 숫자를 분해해서 봐야 한다 — 이번 사건의 핵심은 200개 표적 중 실제 뚫린 곳이 9곳이라는 것이고, AI는 정찰·시도의 \"규모와 속도\"를 키웠을 뿐 결함 자체를 새로 만들어내지는 않았다. 또한 공개된 공격 도구는 원래 목적과 무관하게 여러 조직이 나눠 쓸 수 있다는 점도 다시 확인됐다.\n\n## 3. 국내 소식\n\n- 10/31~11/3 기간 중 확인된 국내 금융권 5곳 추가 유출(`D20261103-finsector2`)은 [2026-11-01 보고서](2026-11-01.md)에 기록했다.\n- ②통신·이커머스 및 ③공공·교육·의료 검색에서 과거 사건(29CM 2026년 8월, 샤넬코리아 2021년 8월, 한국뇌신경과학회 2026년 2월)이 걸렸으나 발생 시점을 확인해 제외했다(오탐).\n\n## 4. 우선 대응 체크리스트\n\n1. **ARTEX 등 AI 에이전트형 공격 도구에 노출될 수 있는 조직(최우선, 신규)**: [D20261103-vaporpanda](#d20261103-vaporpanda-중국계-vapor-panda-ai-에이전트-프레임워크-artex로-14개국-200개-조직-동시-공격) — Zammad 등 헬프데스크·협업 소프트웨어 패치 확인, 과거 유출 키·인증서 폐기.\n2. **10/31~11/02 주요 조치**: [2026-10-31](2026-10-31.md)(AI 개발 플랫폼 API 키 교체), [2026-11-01](2026-11-01.md)(국내 금융사 5곳 안내 확인), [2026-11-02](2026-11-02.md)(Synology DSM·Ivanti 11/2 패치 적용) 참고.\n\n## 5. 검증 수준과 한계\n\n- Vapor Panda/ARTEX 사건은 CrowdStrike 원문 블로그를 직접 열람하지 못해 BleepingComputer 등 2차 보도와 WebSearch 교차 확인에 의존했다. \"200개 조직\" 수치는 표적 수이며 실제 침해 확인은 최소 9곳임을 구분했다. ATT&CK 매핑은 Codex 검토를 반영해 T1587(자체 개발) 대신 T1588(기존 자원 확보)로 매핑했고, T1190·T1068은 구체적 경위가 공개된 DIVD의 Zammad 사례에만 한정해 매핑했다.\n\n## 출처\n\n- CISA KEV JSON 피드 (직접 확인)\n- BleepingComputer: \"Chinese hackers used AI agent framework ARTEX to target 200+ organizations\"\n- WebSearch 교차 확인: CrowdStrike Vapor Panda/ARTEX 보도, Korea Times(2026-10-08, ARTEX·한국 금융권 공격 관련)\n- MITRE ATT&CK v19.2 / v20.0\n"},{"path":"일일/2026-11-04.md","title":"일일 보안 이슈 분석 — 2026-11-04","md":"# 일일 보안 이슈 분석 — 2026-11-04\n\n> 수집 기준: 2026-11-04(오늘, 조사 진행 시각까지 공개분). 마지막 보고서는 [11-03](2026-11-03.md)이며 그 사이 공백일은 없다(다만 아래 사건 다수는 11/2~11/3 사이 공개돼 전날 보고서의 수집 마감 뒤에 알려졌다). CISA KEV는 공식 카탈로그 페이지를 직접 열람해(전날까지는 JSON 피드 사용) 10/20~11/3 등재분을 확인했다. 해외 소식은 BleepingComputer 기사를 WebFetch로 직접 열람했고, 일부(바이낸스 사건의 세부 기술 묘사 등)는 회사 발표를 기사가 인용한 수준이라 2차 확인이다. 국내 소식은 6개 범주를 WebSearch 했고, 핵심 사실은 보안뉴스·데일리시큐 기사 원문을 WebFetch로 직접 열람해 확인했다.\n> 근거 표기: **[확인]** 벤더·정부기관·연구기관이 직접 확인 / 보도 언론 보도 / **[추정]** 본 보고서의 추정 / **[주장]** 공격자 일방 주장. **조치는 본 보고서의 권고**이며 벤더 공식 지침이 우선한다.\n> **ATT&CK 버전 점검**: attack.mitre.org 직접 확인 결과 공식 버전은 여전히 **v20.0**이다(11/3 확인분과 동일). 이 저장소는 당분간 **v19.2 매핑을 유지**하며 임의로 대규모 재매핑하지 않는다.\n\n## 1. 오늘의 요약\n\n| # | 이슈 | 유형 | 상태 | 즉시 조치 |\n|---|------|------|------|-----------|\n| 1 | 바이낸스, 가짜 채용면접으로 시작된 공격에 지갑 서명 서비스가 뚫려 약 63억 달러 상당 자산 이전 | 구인 사칭 사회공학(북한 연계 추정) | [확인] 바이낸스 자체 발표, FBI 귀속 보도 | 구직 플랫폼을 통해 받은 \"코딩 과제\" 파일을 업무용 기기에서 실행하지 않기 |\n| 2 | 국내 ERP·백업 업체 더존비즈온 해킹, 거래 기업 24곳 이상에서 개인정보 유출 의심 | 서드파티(ERP·SaaS 공급사) 침해(경위 미공개) | [확인] 각 사 공지, 과기정통부 중대사고 지정 | 더존비즈온 서비스 이용 기업은 공지·점검 현황 확인, 관련 VPN 계정 점검 |\n| 3 | 대통령 전용기(공군1호기) 탑승자 168명 명단, 바이러스토탈에 5개월간 노출 | 정보 노출(외부 침입 증거 없음, 게시 경위 조사 중) | [확인] 외교부 신고·경찰 수사 전환 | 해당 없음(일반 이용자 직접 영향 없음) — 명단 포함자는 여권 재발급 등 외교부 안내 확인 |\n| 4 | 국내 보안기업 태광네트웍정보, 에베레스트 랜섬웨어 조직이 263GB 탈취 주장(공급망 영향 우려) | 보안·네트워크 기업 침해(경위 미공개) | [확인](회사 자체 공지)·[주장](탈취 규모) | 태광네트웍정보와 거래한 기관은 공유했던 기술자료·원격접속 계정 점검 |\n| 5 | 서버 보안 제품 cPGuard, 업데이트 배포망(CDN) 변조로 약 2,946대에 백도어·정보탈취 스크립트 유포 | 공급망(소프트웨어 업데이트) 변조 | [확인] 벤더(OpsShield) 자체 확인 | 즉시 5.88.25 이상으로 업데이트, SSH 키·DB 자격 증명 전체 교체 |\n| 6 | 개발 인프라 업체 WorkOS, AI 공격 자동화 도구(ARTEX AI)로 내부 영업 시스템 침해 | 내부 시스템 침해(경위 미공개) | [확인] 회사 자체 발표 | WorkOS 이용 기업은 영향 통지 확인, 노출 정보로 인한 표적 피싱 주의 |\n| 7 | 영국 한 학교 재단, AI 자동화 패턴으로 추정되는 3AM 랜섬웨어 공격으로 PC 37대 암호화 | 랜섬웨어(AI 자동화 의심) | 보도(Bitdefender 연구) | Veeam 백업서버 자격 증명 노출 가정하고 교체, 도메인 트러스트 구성 점검 |\n| 8 | 바라쿠다, 다수 보안장비에서 root 권한 탈취 가능한 치명적 결함 2건 패치 | 보안장비 취약점(실제 악용 미확인) | [확인] 벤더 보안 공지 | 관리 인터페이스 외부 노출 여부 확인 후 해당 패치 적용 |\n| 9 | CISA, 워드프레스 코어 레이스 컨디션 결함(CVE-2026-119977)을 '실제 악용 확인' 목록에 신규 등재(11/3) | 공개 CMS 취약점 | [확인](CISA KEV 등재)·보도(세부 기술, 단일 출처) | 워드프레스 7.1.4/7.0.8 이상으로 즉시 업데이트 |\n\n오늘은 새 사건 9건(해외 6건, 국내 3건)을 기록한다.\n\n## 2. 이슈별 분석\n\n### [D20261104-binance] 바이낸스, 가짜 채용면접으로 시작된 공격에 지갑 서명 서비스가 뚫려 약 63억 달러 상당 자산 이전\n> 날짜: 접촉 시작 2026년 9월 · 자금 이전 2026-10-29 · 바이낸스 보고서 공개 2026-11-03 · 유형: 구인 사칭 사회공학 → 내부 인프라 침투 → 가상자산 탈취 · 행위자: 북한 연계 추정(TraderTraitor/Lazarus/Jade Sleet/APT38로도 알려짐, FBI 귀속 보도) · 지역: 전 세계(해외, 거래소는 다국적) · 근거: 확인(바이낸스 자체 발표)·보도(공격자 귀속)\n\n**쉽게 말하면**: 세계 최대 가상자산 거래소 바이낸스가 10월 29일, 지갑에 서명(승인)을 해 주는 내부 서비스가 뚫려 여러 블록체인에서 약 63억 4천만 달러 상당의 자산이 빠져나갔다고 11월 3일 발표했습니다. 시작은 9월, 한 소프트�웨어 엔지니어가 구인 플랫폼에서 가짜 채용 담당자의 연락을 받은 것이었습니다. 두 차례 가짜 면접(영상통화까지 포함)을 거친 뒤 \"코딩 과제\"를 내려받아 실행했는데, 이 파일에 백신이 못 잡아내는 악성코드가 숨어 있었습니다. 이후 공격자는 이 엔지니어의 노트북을 발판으로 삼아 다른 직원 2명까지 추가로 뚫었고, 결국 지갑 서명 서비스에 접근해 대규모 자산을 빼냈습니다. 바이낸스는 이후 약 28억 5천만 달러를 동결·회수했고 일부 자산 종류는 자체 자금으로 메웠다고 밝혔습니다.\n\n**먼저 할 일(초보용)**: 바이낸스 이용자가 지금 당장 할 일은 보도되지 않았습니다(이용자 자금이 아니라 거래소 내부 시스템이 공격 대상이었습니다). 구직 중인 개발자·보안 담당자라면, 면접 과정에서 받은 \"코딩 과제\"나 실행 파일을 회사 업무용 기기에서 바로 실행하지 말고 격리된 환경(가상머신 등)에서만 열어 보세요.\n\n**개요**: 바이낸스는 2026-11-03 사고 보고서에서, 10월 29일 지갑 서명 서비스를 통해 여러 블록체인에 걸쳐 약 63.4억 달러가 이전됐다고 밝혔다. 공격의 시작은 9월로, 바이낸스 근무 경력이 프로필에 있던 한 소프트웨어 엔지니어가 구인 플랫폼을 통해 가짜 \"Project Director\"의 연락을 받았다. 이후 가짜 인사담당자(영상통화로 신뢰를 쌓음)와 가짜 CEO 행세를 하는 인물과 각각 면접을 진행했고, 채팅앱으로 전달된 온라인 코드 저장소 링크에서 \"코딩 과제\"를 내려받아 실행했다. 이 과제에는 백신이 탐지하지 못한 맞춤형 악성코드가 포함돼 있었다(바이낸스는 이를 \"제로데이\"라고 표현했는데, 이는 소프트웨어의 패치 가능한 결함이 아니라 \"백신 탐지를 피한 신종 악성코드\"라는 뜻으로 쓴 표현이다). 10월 20일까지 공격자는 이 노트북과 바이낸스 내부 AI 도구를 이용해 지갑 인프라팀 직원 2명을 추가로 침해해 자격 증명과 컨테이너 배포 토큰을 확보했고, 10월 29일 이를 이용해 악성 스크립트를 배포해 지갑 서명 서비스에 접근했다. 바이낸스가 출금을 중단한 뒤에도 공격자는 이더리움의 EIP-7702 권한 위임 기능을 악용해 탈취를 이어갔다. FBI는 이 공격을 북한 정부 연계 조직(TraderTraitor, 일명 Lazarus Group·Jade Sleet·APT38)의 소행으로 귀속했다고 보도됐다(바이낸스 자체 발표는 특정 캠페인과 직접 연결하지 않았다). 구인 사기→가짜 면접→악성 코딩 과제라는 수법은 북한 연계 조직의 기존 \"Contagious Interview\"·\"Operation Dream Job\" 캠페인과 유사하다고 보도됐다.\n\n**왜 일어났나**\n- 직접 원인 [확인]: 구인 플랫폼을 통한 사회공학으로 개발자 1명의 개인 기기를 감염시킨 뒤, 그 접근권을 발판으로 지갑 인프라팀 직원을 추가로 침해해 지갑 서명 서비스까지 도달했다(바이낸스 자체 조사).\n- 구조적 원인 [추정 — 분석]: 지갑 서명처럼 거래소 전체 자산 이동에 영향을 주는 민감한 내부 서비스가, 결국은 \"직원 몇 명의 개인 기기 보안\"에 의해 지켜지고 있었다는 뜻이다. 구인 사기는 기술적 방어(백신·패치)로 막기 어려운 사람 대상 공격이라, 최종 승인 단계에 사람의 신뢰에만 의존하지 않는 추가 장치(다중 승인, 하드웨어 기반 서명 등)가 없었다면 한 명의 실수가 전체 시스템까지 번질 수 있다.\n\n**침투 경로 [확인 — 바이낸스 자체 조사 기준]**: ① 구인 플랫폼에서 가짜 Project Director가 접촉 → ② 가짜 인사담당자·가짜 CEO와 2차례 면접(영상통화 포함, 신뢰 구축) → ③ 채팅앱으로 전달된 코드 저장소에서 \"코딩 과제\" 다운로드·실행 → ④ 백신 미탐지 악성코드가 macOS Homebrew 경로의 정상 `pyenv` 실행파일을 악성 버전으로 교체, 이를 통해 원격 명령 실행 경로 확보 → ⑤ 이 기기와 내부 AI 도구를 이용해 지갑 인프라팀 직원 2명 추가 침해, 자격 증명·컨테이너 배포 토큰 확보 → ⑥ 악성 스크립트 배포로 지갑 서명 서비스 접근, 자산 이전 → ⑦ 출금 중단 후에도 EIP-7702 권한 위임 악용으로 탈취 지속.\n\n**어떻게 조치하나**\n- 즉시: (바이낸스 자체 조치, 보도 기준) 영향받은 시스템 재구축, 침해된 기기 교체, 탈취된 자격 증명 전부 폐기. (본 보고서의 권고) 유사한 구인 사기에 노출된 적이 있는 조직은 해당 직원의 업무용·개인 기기를 포렌식 점검한다.\n- 단기: 구직 플랫폼을 통한 외부 코딩 과제·실행 파일은 격리된 샌드박스에서만 열도록 사내 정책을 안내하고, 이미 실행한 사례가 있다면 해당 기기 전체를 재설치한다.\n- 장기: 지갑 서명 등 대규모 자산 이동이 가능한 내부 서비스는 한 명의 자격 증명만으로 접근할 수 없도록 다중 승인·분리 보관(멀티시그, 임계값 서명 등) 구조를 강화한다.\n- 탐지: Homebrew 등 개발 도구 경로의 정상 실행파일이 교체되는 징후, 이례적으로 짧은 시간 내 발생하는 대규모 자산 이동 패턴을 모니터링한다.\n\n**교훈**: 거래소급 보안 투자를 한 조직도 \"가짜 면접 → 과제 파일 실행\"이라는 가장 오래된 수법에 뚫릴 수 있다. 기술적 방어가 아무리 튼튼해도 결국 한 사람의 클릭에서 시작될 수 있다는 점에서, 민감한 시스템일수록 사람의 실수 하나로 전체가 무너지지 않는 다중 안전장치가 필요하다.\n\n### [D20261104-douzone] 국내 ERP·백업 업체 더존비즈온 해킹, 거래 기업 24곳 이상에서 개인정보 유출 의심\n> 날짜: 보도 2026-11-02~11-04(최초 침해 시점 미공개) · 유형: 서드파티(ERP·클라우드 백업 공급사) 침해, 침투 경로 대부분 미공개 · 행위자: 미귀속 · 지역: 한국 · 근거: 확인(피해(의심) 기업 각사 공지, 과기정통부 중대사고 지정)\n\n**쉽게 말하면**: 국내 중소기업·세무회계사무소가 많이 쓰는 경영관리 소프트웨어(ERP) 회사 더존비즈온이 해킹당했습니다. 더존비즈온의 세무회계용 ERP '스마트 A10'과 클라우드 백업 서비스 'APO백업서비스'가 침해당한 것으로 보이며, 이 서비스를 쓰는 거래 기업 24곳 이상(케이옥션, 더본코리아, 한양증권, 국기원, 병원·재단·학교 관련 단체 등)에서 직원·고객의 이름·주민등록번호·계좌번호 등 개인정보가 유출됐을 가능성이 확인됐습니다. 과학기술정보통신부는 이를 \"중대사고\"로 보고 민관합동조사단을 꾸렸습니다. 다만 더존비즈온이 정확히 어떤 경로로 처음 뚫렸는지는 아직 공개되지 않았고, 피해(의심) 기업 목록은 계속 늘어나고 있습니다.\n\n**먼저 할 일(초보용)**: 케이옥션·더본코리아·한양증권·전북문화관광재단 등 위에서 언급된 기업·기관과 거래했거나 그 직원·고객이라면, 해당 기관의 개별 공지를 확인하세요. 비밀번호 변경만으로는 이미 유출된 주민등록번호·계좌번호 자체를 되돌릴 수 없으므로, 명의도용 방지 서비스 가입과 금융 거래 알림 설정을 함께 검토하세요.\n\n**개요**: 2026년 11월 2일부터 보안뉴스·데일리시큐 등 보도를 통해 더존비즈온의 세무회계용 ERP '스마트 A10'과 백업 서비스 'APO백업서비스'가 해킹당한 사실이 알려졌다. 11월 4일 기준 유출 의심이 확인된 거래 기업·기관은 케이옥션, 티앤에스엔지니어링, 춘천문화재단, 한국여자프로골프협회, 재원푸드, 위드유, 참존오토모티브, 창비, 아산·천안충무병원(영서의료재단), 국립박물관단지, 한우리독서토론논술, 국기원, 성현회계법인, 한국공항보안, 더본코리아, 한국킨볼협회, 한국재무설계협회, 발렉스서비스, 피앤에스로지스, 팬택씨앤아이, 펫닥, 전북문화관광재단, 중부발전서비스, 에스티유니타스 등 24곳 이상이다(한양증권은 같은 시기 별도 보도에서 \"다우오피스 그룹웨어\"가 원인으로 지목돼 더존비즈온 피해 목록과 경로가 같은지는 확인되지 않았다). 유출 의심 정보는 공통으로 성명·주민등록번호·계좌번호·연락처·이메일·주소·사업자등록번호이며, 일부 기업은 급여·인사 정보(연말정산, 입사·퇴직일, 노동조합 가입 여부 등)와 건강정보(채용·복리후생 관련)까지 포함된다고 밝혔 (개인의 직접 업로드인지, 이메일 보안 솔루션의 자동 전송인지)도 아직 조사 중입니다. \"해킹당했다\"고 단정할 근거는 현재로서는 없으며, 그 노출을 5개월간 아무도 알아차리지 못했다는 점이 핵심 문제입니다.\n\n**먼저 할 일(초보용)**: 일반 국민이 직접 할 일은 없습니다. 명단에 포함된 당사자는 외교부의 여권 재발급 등 안내를 따르면 됩니다.\n\n**개요**: 외교부는 2026-11-03 오전 10시경 공군1호기 탑승자 명단(2026년 6월 유럽 순방, 대한민국-벨기에)이 담긴 파일이 외부 사이트에 게시된 사실을 확인해 신고했다. 이 파일은 구글의 악성코드 검사 플랫폼 '바이러스토탈'을 통해 6월 2일경부터 약 5개월간 노출돼 있었고, 유료 회원이면 누구나 내려받을 수 있었다(현재는 다운로드가 차단됨). 노출된 정보는 이름, 소속·직책, 생년월일, 여권번호, 여권 발급일·만료일이다. 보안업계는 이 파일 자체가 조작되거나 악성코드가 심어진 문서는 아니라고 확인했다. 정확한 게시 경위는 조사 중이며, 개인이 검사를 위해 직접 올렸을 가능성과 일부 이메일 보안 솔루션이 첨부파일을 자동으로 바이러스토탈에 전송했을 가능성이 함께 제기됐다 — 바이러스토탈은 보안 전문가들이 악성코드 여부를 검사하려고 파일·URL을 올리는 서비스이며, 유료 회원끼리는 올라온 결과·파일을 공유해 볼 수 있는 구조라 기밀 문서가 업로드되면 그대로 노출될 위험이 구조적으로 있다. 구글도 기밀 파일은 올리지 말라고 안내하고 있으나, 플랫폼이 자동으로 민감정보를 걸러내기는 어렵다(여권번호 형식이 국가마다 다르고 업로드량이 방대하기 때문). 경찰청은 11월 3일 내사(입건 전 조사)를 정식 수사로 전환했고, 외교부는 관련자 여권 재발급과 6월 순방 업무용 컴퓨터·이메일 기술 점검을 진행 중이다. 이재명 대통령은 같은 날 국무회의에서, AI로 해킹 수법이 고도화되는 데 비해 기존 보안체계가 점검·사고 후 대응에 치우쳐 있다며 공공·민간의 보안 기능을 총괄 조정할 범정부 기구(\"사이버 보안 차르\") 신설을 검토하라고 지시했다(기구의 소속·권한·출범 일정은 아직 정해지지 않았다).\n\n**왜 일어났나**\n- 직접 원인 [보도 — 경위 조사 중]: 탑승자 명단 파일이 바이러스토탈에 업로드돼 유료 회원들에게 약 5개월간 노출됐다. 누가·왜 업로드했는지는 확정되지 않았으며, 개인의 직접 업로드와 이메일 보안 솔루션의 자동 전송 두 가지 가능성이 모두 조사 대상이다.\n- 구조적 원인 [추정 — 분석]: 기밀 문서를 온라인 악성코드 검사 서비스에 올리면 그 즉시 제3자에게 공유될 수 있다는 사실이 충분히 공유·교육되지 않았을 가능성, 그리고 이런 노출을 5개월간 아무도 알아차리지 못했다는 점에서 기밀 문서의 외부 유출 여부를 주기적으로 점검하는 체계(다크웹·공개 플랫폼 모니터링)가 부족했을 가능성이 있다.\n\n**침투 경로**: 공개된 내용에는 외부 공격자의 침입 증거가 제시돼 있지 않다. ATT&CK(공격자 행위를 분류하는 체계)는 공격자의 의도적 행위를 다루므로, 침입 사실이 확인되지 않은 이번 사건에는 매핑하지 않는다.\n\n**어떻게 조치하나**\n- 즉시: (외교부 조치, 보도 기준) 바이러스토탈에서 해당 파일 삭제 요청·삭제 완료, 추가 유포 여부 확인. (본 보고서의 권고) 명단에 포함된 인원 전체의 여권을 조기 재발급한다 — 여권번호가 노출된 경우 기존 여권을 그대로 쓰는 것은 신원 도용 위험을 남긴다.\n- 단기: 6월 순방 관련 업무용 컴퓨터·이메일 시스템의 기술 점검(이미 진행 중)과 함께, 다른 경로로의 추가 유포 여부를 다크웹·공개 플랫폼에서 점검한다.\n- 장기: 기밀 문서를 다룰 수 있는 공공기관 이메일·보안 솔루션에서 첨부파일을 외부 악성코드 검사 서비스로 자동 전송하는 기능이 있다면 비활성화하거나 오프라인(사내 폐쇄망) 검사 솔루션으로 대체한다. \"사이버 보안 차르\"처럼 공공·민간 보안 기능을 총괄하는 체계를 구체화한다면 이런 정보관리 부주의도 탐지 범위에 포함한다.\n- 탐지: 공개 플랫폼(바이러스토탈 등)에
