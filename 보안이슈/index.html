dobe Connect 비인증 CVSS 10.0 만점 결함 4건 및 SQL 삽입(9.9) 등 24건 일괄 패치 | APSB26-191 (CVE-2026-121351~121353, -121356 등) | 화상회의·교육 서버 경로 조작·CRLF·SSRF·SQLi | [확인] Adobe 보안 권고(실제 악용 미확인) | 자체 호스팅 Adobe Connect를 12.12.a / 12.11.i 등으로 즉시 패치, 비인가 파일 열람·세션 점검 |\n| 8 | 웹 자동화·AI 데이터 플랫폼 Apify 내부 자격 증명 침해 — API 토큰·프록시 비밀번호 강제 교체 및 GitHub 연동 해제 | — | 클라우드 자동화 플랫폼 자격 증명 침해 | [확인] Apify 공식 공지·강제 토큰 회전 조치 | 안전한 기기에서 Apify 2단계 인증(2FA) 재설정, 교체된 API 토큰 반영 및 GitHub OAuth 권한 재검토 |\n\n## 2. 이슈별 분석\n\n### [D20261113-multicampus] 삼성SDS 자회사 '멀티캠퍼스' 온라인 교육 플랫폼 해킹 — 고객사 임직원 약 7만 명 이름·사번·부서·직급 등 유출\n> 날짜: 비인가 접근 발생 2026-11-09 · 고객사 통지 및 개인정보위 신고 2026-11-11 야간(보도 11-12~13) · 유형: 기업·공공 위탁 온라인 교육 플랫폼 비인가 접근 및 임직원 정보 유출 · 행위자: 미귀속 · 지역: 한국 · 근거: 확인(멀티캠퍼스 고객사 통지·개인정보위 신고, 데일리시큐·비즈중앙 보도)\n\n**쉽게 말하면**: 삼성SDS의 자회사이자 주요 대기업·시중은행·공공기관 임직원 교육을 위탁받아 운영하는 '멀티캠퍼스'의 온라인 교육 사이트('러닝플랫폼')가 해킹당해 수강생 약 7만 명의 개인정보가 유출됐습니다. 유출된 정보에는 이름·전화번호·이메일뿐 아니라 소속 부서명·사번·아이디·직급·직위 같은 회사 내부 인사 정보까지 포함돼 있어, 해커가 실제 직장 상사나 인사팀을 정교하게 사칭해 보이스피싱이나 악성 메일 공격(스피어 피싱)을 시도할 위험이 큽니다.\n**먼저 할 일(초보용)**: 멀티캠퍼스 러닝플랫폼을 이용하는 기업·기관 임직원은 감염되지 않은 안전한 기기에서 교육 사이트 비밀번호와 같은 비밀번호를 쓰는 사내·외부 계정 비밀번호를 즉시 바꾸고, 기존 로그인 세션을 모두 로그아웃(무효화)하세요. 내 사번·부서·직급을 정확히 대면서 \"인사팀·교육담당자입니다\" 또는 \"부서장인데 급히 처리할 일이 있다\"고 연락해 오는 문자·메일·메신저는 반드시 사내 내선 전화 등 별도 통로로 진짜 본인인지 먼저 확인하세요.\n\n**개요**: 기업·공공기관 교육 전문 기업 멀티캠퍼스(삼성SDS 자회사)가 운영하는 온라인 교육 플랫폼 '러닝플랫폼'에서 2026년 11월 9일 외부의 인가받지 않은 비인가 접근(해킹)이 발생해 약 **7만 명(사람 기준)** 규모의 수강생(고객사 임직원 등) 개인정보가 유출됐다(데일리시큐·비즈중앙 11/12~13 보도). 멀티캠퍼스는 침해 사실을 인지한 뒤 11월 11일 밤 고객사들에 유출 사실을 통지하고 개인정보보호위원회에 신고했다. 통지된 유출 항목은 **이름, 전화번호, 이메일 주소, 부서명, 사번, 아이디(ID), 직급, 직위** 등이다(주민등록번호 등 고유식별정보나 결제·금융정보는 포함되지 않았다고 회사 측은 밝혔다). 멀티캠퍼스는 삼성 주요 계열사를 비롯해 다수의 시중은행과 공공기관 임직원 직무·법정 의무 교육을 위탁 수행하는 국내 대표 기업 교육(B2B) 플랫폼이어서, 여러 기업·금융사·공공기관의 조직도 및 임직원 식별 정보가 한꺼번에 외부로 노출됐을 우려가 제기됐다.\n\n**왜 일어났나**\n- 직접 원인 [확인 — 세부 침투 경로는 미공개]: 멀티캠퍼스 온라인 교육 플랫폼('러닝플랫폼')에 외부 비인가 접근이 발생해 수강생 약 7만 명의 개인·인사 정보가 조회·유출됐다(회사 통지 및 개인정보위 신고 확인). 공격자가 웹/API 취약점을 악용했는지, 관리자·위탁 운영 계정을 탈취했는지는 공개되지 않아 단정하지 않는다.\n- 구조적 원인 [추정 — 분석]: (1) 다수의 대기업·금융사·공공기관이 임직원 교육 편의를 위해 인사 시스템(HR)의 사번·부서·직급 데이터를 외부 위탁 교육 플랫폼에 그대로 연동·보관하는 구조여서, 위탁 플랫폼 한 곳이 뚫리면 수십 개 고객사의 조직도가 동시에 노출된다 (2) 올해 하반기 한국은행 온라인 연수 수탁업체(186명 노출), KISA 위탁 한국정보보호교육센터 외주 사이트, 국립외교원 온라인교육시스템(`D20261006-mofa`) 등 본원 업무망보다 보안 통제가 느슨한 '온라인 교육·연수 시스템'이 반복해서 공격 통로가 되고 있다(본 보고서의 분석).\n\n**침투 경로 [매핑 안 함 — 경위 미공개]**: 외부 비인가 접근으로 교육 플랫폼 내 개인·인사 정보가 유출된 사실만 확인됐고, 구체적인 최초 침투 수단은 공개되지 않아 ATT&CK 기법을 추측으로 매핑하지 않는다.\n\n**어떻게 조치하나** (본 보고서의 권고)\n- 즉시: (멀티캠퍼스) 러닝플랫폼 웹·API·DB 접근 로그와 메모리·디스크 포렌식 증거를 신속히 보존하고 비인가 접근 경로를 차단한다. 침해된 서버나 관리자 환경에서 새 인증키·비밀번호를 발급하지 않는다.\n- 단기: 비밀번호 변경만으로는 이미 발급된 세션 쿠키·모바일 앱 토큰·고객사 SSO 연동 토큰이 살아남을 수 있으므로, **전체 수강생·관리자 계정의 활성 세션과 연동 토큰을 일괄 무효화**하고 안전한 환경에서 비밀번호 및 고객사 인사 연동 API 키를 재발급한다. 서버 내 웹셸·비인가 관리자 계정 등 지속성 흔적을 전수 점검해 침해가 확인되면 시스템을 재구축한다. 고객사(기업·금융사·공공기관) 보안팀은 유출된 임직원의 **이메일·사번·아이디**가 사내 그룹웨어·VPN 로그인 아이디와 동일한지 확인해 패스워드 스프레이·크리덴셜 스터핑 감시를 강화하고 피싱 저항 MFA를 적용한다.\n- 장기: 외부 위탁 교육 플랫폼에 전달하는 임직원 정보에서 사번·세부 부서명·직급 등 불필요한 인사 속성 전달을 최소화(가명·고유 교육 식별자로 대체)하고, 위탁사 보안 실사와 대량 조회 차단 통제를 계약 요건으로 강제한다.\n- 탐지: 고객사 사내 메일·메신저로 유입되는 부서·직급·사번 맞춤형 스피어 피싱과, 유출된 사번·이메일 계정에 대한 외부 VPN·웹메일 로그인 시도를 집중 모니터링한다.\n\n**교훈**: 이름과 전화번호만 유출됐을 때보다 **'어느 회사 무슨 부서 누구(사번·직급)'**까지 함께 유출됐을 때가 기업 보안에는 훨씬 위험하다. 공격자가 그 회사의 실제 조직도와 직급 체계를 보고 내부 직원을 감쪽같이 속이는 표적 공격(스피어 피싱·헬프데스크 사칭)의 설계도로 쓸 수 있기 때문이다.\n\n### [D20261113-kbcapital] KB캐피탈 '자동차 임대자산관리시스템' 해킹으로 고객·임직원·협력사 직원 1,811명 개인·계정정보 유출\n> 날짜: 비정상 조회 탐지·차단 및 금감원 신고 2026-11-10 · 홈페이지 공지 2026-11-12 · 언론 보도 2026-11-13 · 유형: 금융사 내부 업무용 시스템(자동차 임대자산관리시스템) 해킹 및 개인·계정정보 유출 · 행위자: 미귀속(국내 IP 경유 조회 확인) · 지역: 한국 · 근거: 확인(KB캐피탈 공식 공지·금감원 신고, 연합뉴스·서울경제 보도)\n\n**쉽게 말하면**: KB금융그룹 계열 여신전문금융사인 'KB캐피탈'에서 직원들이 차량 임대 업무에 쓰는 '자동차 임대자산관리시스템'이 해킹당해 총 1,811명의 개인정보가 유출됐습니다. 유출 대상은 차량 임대·탁송 관련 일반 고객 20명(이름·생년월일·휴대전화번호·주소·차량번호)과 KB캐피탈 임직원 및 협력사 직원 1,791명(사용자 계정·이름·휴대전화번호·부서명·회사명·직함 등)입니다. 회사 측은 대출·결제 같은 핵심 금융거래 시스템과는 무관하다고 밝혔지만, 임직원과 협력사 직원의 계정·조직 정보가 대거 포함돼 추가 침투 시도에 대비해야 합니다.\n**먼저 할 일(초보용)**: 유출 대상인 KB캐피탈 임직원·협력사 직원은 감염되지 않은 안전한 기기에서 해당 시스템 및 사내 업무 계정의 비밀번호를 즉시 변경하고 기존 로그인 세션을 모두 초기화하세요. 일반 고객(20명)은 본인의 차량번호·주소를 언급하며 렌터카 점검·탁송·보험 처리를 빙자해 금융정보나 인증번호를 요구하는 연락에 속지 마세요.\n\n**개요**: KB캐피탈은 2026년 11월 12일 홈페이지 공지 및 11월 13일 발표를 통해, 외부의 악의적인 공격으로 고객·협력사 직원·임직원 등 총 **1,811명(사람 기준)**의 개인정보가 유출됐다고 밝혔다(연합뉴스·서울경제·파이낸셜뉴스 보도). KB캐피탈은 지난 11월 10일 국내 인터넷 프로토콜(IP) 주소에서 다수의 의심스러운 비정상 정보 조회 시도가 발생한 정황을 포착해 해킹 사실을 인지했으며, 즉시 해당 시스템과 서버 운영을 중단하고 외부 접근 경로를 차단한 뒤 당일 금융감독원에 신고했다. 유출이 발생한 곳은 직원들이 차량 임대자산을 관리하기 위해 사용하는 내부 업무용 프로그램인 **'자동차 임대자산관리시스템'**으로, 여신·결제 등 핵심 금융거래 시스템과는 분리돼 있어 금융거래 정보 유출은 없다고 회사는 설명했다. 구체적인 유출 규모와 항목은 ① **일반 고객 20명**(차량 임대·탁송 업무 연관 대상): 이름, 생년월일, 휴대전화번호, 주소, 차량번호 ② **임직원 및 협력사 직원 1,791명**: 사용자 계정, 이름, 휴대전화번호, 전화번호, 부서명, 회사명, 직함이다. KB캐피탈은 홈페이지에 개인별 유출 여부 조회 화면을 마련하고 이번 유출로 실제 손해가 발생할 경우 전액 배상하겠다고 밝혔으며, 금감원은 추후 현장점검을 진행할 예정이다.\n\n**왜 일어났나**\n- 직접 원인 [확인 — 최초 침투 수단은 미공개]: 국내 IP 주소를 경유한 외부 공격자가 자동차 임대자산관리시스템에 침투해 다수의 비정상 정보 조회를 수행함으로써 1,811명의 정보를 유출했다(KB캐피탈 공지·신고 확인). 공격자가 협력사·임직원 계정을 탈취해 들어왔는지, 외부에 노출된 웹·API 취약점을 악용했는지는 공개되지 않았다(국내 IP 발견은 경유지 단서일 뿐 공격자 소재 확정은 아님).\n- 구조적 원인 [추정 — 분석]: 핵심 코어뱅킹·여신 시스템은 망분리와 엄격한 통제를 받더라도, 외부 탁송·정비 협력사나 현장 직원이 함께 접속하는 '자산관리·대출모집인 조회 등 부수적 대외 업무 시스템'은 인터넷 접점이 열려 있고 다중 인증(MFA)이나 대량 조회 차단 임계치가 상대적으로 느슨해 금융권 연쇄 해킹(`D20261006-finsector`, `D20261103-finsector2`)의 반복적인 돌파구가 되고 있다(본 보고서의 분석).\n\n**침투 경로 [매핑 안 함 — 최초 침투 경위 미공개]**: 국내 IP에서 다수의 비정상 정보 조회 시도가 있었다는 사실만 공개됐고 최초 침투 기법(유효 계정 악용 여부 또는 웹 애플리케이션 취약점 여부)이 확인되지 않아 ATT&CK 기법을 매핑하지 않는다.\n\n**어떻게 조치하나** (본 보고서의 권고)\n- 즉시: 중단·차단된 자동차 임대자산관리시스템의 웹·WAS·DB 조회 로그와 서버 메모리·디스크 증거를 신속히 보존해 금감원 점검 및 수사에 활용하고, 침해된 서버에서 새 자격 증명을 발급하지 않는다.\n- 단기: 유출 항목에 임직원·협력사 직원 1,791명의 **'사용자 계정'·휴대전화번호·부서·직함**이 포함되어 있으므로, 안전한 환경에서 해당 시스템은 물론 사내 다른 업무 시스템·VPN·그룹웨어의 관련 계정 비밀번호를 전수 초기화하고 **기존 발급된 모든 세션·토큰을 무효화**한다. 서버 내 웹셸이나 백도어 계정 존재 여부를 전수 조사해 안전한 환경에서 재구축한 뒤에만 서비스를 재개한다.\n- 장기: 협력사·외부 직원이 접속하는 자산관리·위탁 업무 시스템에도 예외 없이 피싱 저항 MFA를 적용하고, 계정별 일일 조회 건수 상한(Rate Limiting)과 전체 임직원·협력사 명부 일괄 조회 차단을 강제한다.\n- 탐지: 유출된 1,791개 사용자 계정 ID를 이용한 사내 다른 대외 시스템 로그인 시도와, 단일 IP·세션에서의 단시간 연속 조회 쿼리를 실시간 경보·차단한다.\n\n**교훈**: 금융사의 '핵심 금융거래 시스템'이 아니더라도, 임직원·협력사 계정 1,791개가 들어 있는 주변 업무 시스템이 뚫리면 공격자는 그 계정과 조직도를 발판 삼아 본사 내부망이나 헬프데스크를 겨냥한 2차 공격을 시도할 수 있다. 주변 업무 시스템의 계정 테이블은 그 자체로 핵심 보안 자산이다.\n\n### [D20261113-github-ci] 탈취된 GitHub 계정 4,837개로 1,806개 저장소 오염 — 가짜 PR(`docs: dependency audit notes`)로 CI 시크릿 탈취 및 클라우드 IAM 백도어 설치\n> 날짜: 캠페인 시작 2026-11-11 · 위협 분석 공개·보도 2026-11-12~13 · 유형: 개발자 계정 및 CI/CD 파이프라인 대규모 공급망 침해(실제 악용 확인) · 행위자: 미귀속(지난 10월 GhostAction 캠페인 피해 계정과 일부 중첩) · 지역: 전 세계(해외) · 근거: 확인(Aviatrix Threat Research Center 분석·The Hacker News 보도)\n\n**쉽게 말하면**: 해커가 이미 훔쳐 둔 깃허브(GitHub) 개발자 계정 4,837개를 동원해, 전 세계 6만 개가 넘는 오픈소스·기업 코드 저장소에 '문서 점검 메모(`docs: dependency audit notes`)'라는 제목의 시험용 수정 요청(PR)을 자동으로 보내 어느 저장소를 마음대로 고칠 수 있는지 훑었습니다. 그중 수정 권한이 확인된 1,806개 이상의 저장소에 악성 자동화 작업(GitHub Actions)을 몰래 심어 클라우드(AWS·Azure·GCP) 접속 열쇠와 비밀 토큰을 싹쓸이한 뒤, 심지어 피해 회사가 나중에 비밀번호를 바꿔도 계속 들어올 수 있도록 클라우드의 '신뢰 정책(IAM)'까지 몰래 고쳐 놓았습니다.\n**먼저 할 일(초보용)**: GitHub 저장소와 AWS·Azure·GCP 클라우드를 연동해 쓰는 개발·보안팀은 저장소에 `wfx-docs`라는 브랜치나 `docs: dependency audit notes` 제목의 PR, 또는 몰래 추가됐다가 되돌려진(revert) 커밋 기록이 없는지 즉시 검색하세요. 흔적이 있다면 **단순히 시크릿(비밀키)만 바꾸면 소용이 없으므로**, 먼저 안전한 기기에서 AWS IAM 역할의 신뢰 정책(Trust Policy)과 Azure(Entra ID)의 `wfx-ci-`로 시작하는 외부 연동 자격 증명을 찾아 삭제한 뒤 모든 클라우드 키·토큰·세션을 폐기하고 재발급하세요.\n\n**개요**: 클라우드 보안 기업 Aviatrix의 위협연구센터(Threat Research Center)는 2026년 11월 12일, 지난 11월 11일부터 시작된 대규모 소프트웨어 공급망 및 CI/CD 시크릿 탈취 캠페인을 포착해 공개했다(The Hacker News 등 보도). 공격자는(지난 10월 발생한 'GhostAction' 캠페인 피해 계정과 일부 겹치는) 탈취된 **4,837개의 GitHub 계정 자격 증명**을 사용해 총 **61,764개 저장소**를 대상으로 `wfx-docs`라는 이름의 브랜치에서 `'docs: dependency audit notes'`라는 제목의 테스트 풀 리퀘스트(PR)를 자동으로 생성하며 쓰기(write) 권한 유무를 탐색했다. 쓰기 권한이 확인된 **1,806개 이상의 저장소**(공개 저장소 전체에서는 **8,093개**에서 악성 커밋 관측)에 대해 공격자는 기존 GitHub Actions 워크플로 파일이나 `npm postinstall` 훅에 시크릿 탈취 악성코드를 삽입했으며, 이는 npm·Go·Packagist·PyPI 패키지 생태계로도 빠르게 파급됐다. GitHub Actions 러너(Runner) 안에서 실행된 악성코드는 저장소의 GitHub Actions 시크릿, OIDC(OpenID Connect) 토큰, AWS·Azure·GCP 클라우드 자격 증명, SSH 키, 패키지 레지스트리 배포 토큰을 수확해 공격자 제어 서버(HTTP POST)와 텔레그램(Telegram) 채널로 빼돌린 뒤, **증거를 지우기 위해 악성 커밋을 즉시 되돌렸다(revert)**. 특히 공격자는 탈취한 클라우드 권한으로 **AWS IAM 역할의 신뢰 정책(Trust Policy)을 변조**하고 **Azure AD(현 Entra ID)에 `wfx-ci-` 접두사가 붙은 페더레이션 자격 증명(Federated Identity Credential)을 추가**해, 피해 조직이 추후 GitHub 시크릿이나 액세스 키를 교체하더라도 클라우드 접근 권한을 계속 유지하는 지속성 백도어를 심었다.\n\n**왜 일어났나**\n- 직접 원인 [확인: Aviatrix]: (1) 인포스틸러나 이전 침해(GhostAction 등)로 유출된 뒤 회수·보호되지 않은 4,837개의 유효한 GitHub 개발자 계정 자격 증명 악용 (2) 쓰기 권한이 있는 계정이 브랜치 보호 규칙이나 코드 리뷰 없이 CI 워크플로 파일을 직접 수정·실행할 수 있었던 저장소 설정.\n- 구조적 원인 [추정 — 분석]: 현대 클라우드 환경에서 CI/CD 파이프라인은 프로덕션 클라우드(AWS·Azure·GCP)의 높은 권한(IAM 수정 권한 포함)을 쥐고 있는 '최고 가치의 횡적 이동 통로'다. 특히 장기 비밀번호 대신 권장되는 OIDC 연동이라도, CI 러너에 부여된 클라우드 역할(Role)에 IAM 신뢰 정책 자체를 수정할 수 있는 과도한 권한이 열려 있으면 한 번의 파이프라인 오염이 영구적인 클라우드 백도어로 직결된다(본 보고서의 분석).\n\n**침투 경로 [확인 — Aviatrix 분석 기준]**: 탈취된 4,837개 GitHub 계정으로 로그인해 61,764개 저장소에 테스트 PR(`docs: dependency audit notes`)을 열어 권한 탐색(T1078) → 쓰기 권한이 확인된 저장소의 `npm postinstall` 훅·개발 워크플로에 악성 코드를 주입해 하위 패키지 생태계(npm·Go·Packagist·PyPI)로 파급(T1195.001) → 1,806개 이상 저장소의 GitHub Actions 워크플로를 오염시켜 러너에서 악성 페이로드 실행(T1677) → 파이프라인 내 GitHub 시크릿·클라우드 자격 증명·OIDC 토큰·SSH 키·레지스트리 토큰 수확(T1552) → 수확한 클라우드 권한으로 AWS IAM 신뢰 정책을 변조하고 Azure AD에 `wfx-ci-` 페더레이션 자격 증명을 추가해 지속성 확보(T1098.001) → 수집한 비밀 정보를 HTTP POST 및 텔레그램 웹서비스로 외부 반출(T1567) → 악성 커밋을 되돌려(revert) 저장소 내 침투 흔적 제거(T1070).\n\n**어떻게 조치하나** (연구기관 권고 및 본 보고서 권고)\n- 즉시: 조직 및 개인의 GitHub 감사 로그(Audit Log)·Git reflog·클라우드 감사 기록(AWS CloudTrail, Azure Activity/Audit Logs, GCP Cloud Audit Logs)을 신속히 보존하고, 저장소 내 `wfx-docs` 브랜치, `'docs: dependency audit notes'` PR, 또는 11월 11일 이후 생성됐다가 즉시 되돌려진(reverted) 워크플로·`package.json` 커밋이 있는지 전수 검색한다. 침해된 개발자 PC나 오염된 러너에서 새 비밀키를 발급하지 않는다.\n- 단기: **시크릿·비밀번호만 먼저 바꾸면 클라우드 IAM에 심어진 백도어를 통해 공격자가 새 세션을 다시 발급받을 수 있으므로 순서가 중요하다.** ① 먼저 AWS IAM 역할의 신뢰 정책(`AssumeRolePolicyDocument`)에 낯선 외부 계정·OIDC 주체가 추가됐는지, Azure(Entra ID) 앱·관리 ID에 `wfx-ci-` 접두사 페더레이션 자격 증명이 등록됐는지 전수 감사해 **클라우드 지속성 백도어부터 제거**한다. ② 그다음 오염된 저장소의 모든 GitHub Actions 시크릿, 클라우드 액세스 키, 활성 STS/클라우드 세션, SSH 키, npm·PyPI 등 패키지 배포 토큰을 안전한 환경에서 전면 폐기·재발급한다. ③ 침해된 GitHub 계정의 활성 세션·개인용 액세스 토큰(PAT)·OAuth 앱을 모두 회수하고 피싱 저항 MFA(FIDO2)를 강제하며, 해당 기간 빌드·배포된 패키지는 무결성을 검증해 재배포한다.\n- 장기: 기본 브랜치와 `.github/workflows/` 경로에 필수 코드 리뷰 및 브랜치 보호(CODEOWNERS)를 강제하고, CI/CD용 클라우드 OIDC 역할에는 배포에 꼭 필요한 최소 권한만 부여하며 IAM 정책·신뢰 관계를 스스로 수정하는 권한(`iam:UpdateAssumeRolePolicy` 등)을 엄격히 분리·제거한다. 또한 CI 러너의 외부 아웃바운드 통신을 허용 목록(Allowlist) 기반으로 차단해 텔레그램 등 미승인 도메인 전송을 막는다.\n- 탐지: GitHub에서 단시간 내 다수 저장소에 생성되는 동일 제목 PR·커밋 후 즉시 revert 패턴, AWS `UpdateAssumeRolePolicy` 및 Azure `Add federatedIdentityCredential`(`wfx-ci-*`) API 호출, CI 러너에서 `api.telegram.org` 등으로 향하는 네트워크 연결을 즉시 경보한다.\n\n**교훈**: 이번 사건은 \"비밀번호 대신 OIDC 토큰을 쓰면 안전하다\"거나 \"유출 사고가 나면 시크릿만 재발급하면 된다\"는 통념을 정면으로 깨뜨렸다. 공격자가 훔친 OIDC 토큰으로 아예 클라우드의 '문지기 규칙(IAM 신뢰 정책)'을 고쳐 놓으면 시크릿을 백 번 바꿔도 소용이 없으며, 커밋을 실행 직후 되돌려(revert) 놓기 때문에 현재 파일 상태만 봐서는 해킹당한 줄도 모를 수 있다.\n\n### [D20261113-apache-http2] Apache HTTP Server `mod_http2` 비인증 원격 코드 실행 결함(CVE-2026-119618, CVSS 9.8) 긴급 패치 — 병렬 요청 레이스 컨디션\n> 날짜: Apache 2.4.71 패치 및 CVE 공개 2026-11-11 · 보안 업계 분석·대량 스캔 보도 2026-11-12~13 · 유형: 웹서버 HTTP/2 모듈 레이스 컨디션 및 힙 메모리 오염 원격 코드 실행(CVSS 9.8) · 행위자: — (대량 스캔 및 PoC 연구 포착, 실제 침투 악용은 미확인) · 지역: 전 세계(해외) · 근거: 확인(Apache Software Foundation·MITRE CVE·Red Hat 확인)\n\n**쉽게 말하면**: 전 세계 웹사이트의 상당수가 사용하는 대표 웹서버 프로그램 '아파치(Apache HTTP Server)'의 고속 통신 기능(HTTP/2 모듈, `mod_http2`)에서, 해커가 로그인 없이 원격에서 서버를 장악할 수 있는 위험도 9.8점(10점 만점)짜리 치명적 결함(CVE-2026-119618)이 발견돼 긴급 패치(2.4.71 버전)가 나왔습니다. 동시에 여러 개의 요청을 빠르게 쏟아부어 서버가 요청 머리글(헤더)을 처리하는 순서를 꼬이게(레이스 컨디션) 만들면, 서버 메모리가 망가지면서 공격자가 원하는 명령어를 실행할 수 있습니다.\n**먼저 할 일(초보용)**: Apache HTTP Server(2.4.55~2.4.70 버전)를 운영하는 관리자는 즉시 수정 버전인 **2.4.71 이상**(또는 우분투·레드햇 등 리눅스 배포판이 제공하는 최신 보안 백포트 패키지)으로 업데이트하세요. 당장 업데이트가 어렵다면 아파치 설정(`Protocols` 지시자)에서 `h2`와 `h2c`(HTTP/2 기능)를 임시로 빼서 HTTP/1.1로만 동작하게 바꾸고, 만약 비정상 크래시 등 침해가 의심된다면 패치 후 기존 웹 세션·인증키를 안전한 기기에서 교체하세요.\n\n**개요**: 아파치 소프트웨어 재단(Apache Software Foundation)은 2026-11-11(현지시간) **Apache HTTP Server 2.4.71**을 배포하고, HTTP/2 프로토콜을 처리하는 `mod_http2` 모듈의 치명적 원격 코드 실행(RCE) 취약점 **CVE-2026-119618**(Red Hat 등 기준 **CVSS 9.8**, CWE-362)을 수정했다(MITRE CVE 공식 레코드 및 SecurityWeek·The Hacker News·BleepingComputer 11/12~13 보도). 이 취약점은 AI 기업 앤트로픽(Anthropic)의 오픈소스 스캐너(OSS Scanner)와 구글 클라우드 취약점 연구팀(Anthony Weems, Simon Scannell)이 공동으로 발굴·제보했다. 결함은 `mod_http2` 모듈의 `assign_headers()` 함수에서 공유 자원을 적절한 동기화 없이 동시에 실행할 때 발생하는 **레이스 컨디션(경쟁 조건)**이다. 서버에 HTTP/2(`h2` 또는 `h2c`)가 활성화되어 있을 때 인증되지 않은 원격 공격자가 특수 조작된 병렬 HTTP/2 요청을 보내면 서버의 힙(heap) 메모리를 오염시켜 임의 코드 실행(RCE)에 이를 수 있다. 영향 범위는 **Apache HTTP Server 2.4.55부터 2.4.70까지**(및 GitHub 독립 배포 `mod_h2` 2.0.8~2.0.42)다. 클라우드 보안 기업 Wiz는 다수의 클라우드 환경에 취약한 버전의 아파치 인스턴스가 노출돼 있다고 경고했으며, 11월 12일 기준 개념증명(PoC) 연구와 인터넷 대량 스캔 시도가 포착됐으나 실제 침투 악용은 아직 공식 확인되지 않았다.\n\n**왜 일어났나**\n- 직접 원인 [확인: Apache, MITRE CVE]: `mod_http2`의 `assign_headers()` 함수에서 병렬 HTTP/2 스트림의 헤더 처리 시 공유 자원에 대한 동기화(락·격리)가 불완전해 동시 실행 중 힙 메모리 오염이 발생했다.\n- 구조적 원인 [추정 — 분석]: 하나의 연결 안에서 수많은 스트림을 동시에 다중화(multiplexing)해 성능을 높이는 HTTP/2 프로토콜의 특성상, C 언어로 작성된 웹서버 모듈에서 미세한 스레드 동기화 실수가 곧바로 비인증 원격 메모리 오염 및 코드 실행으로 이어지기 쉽다(본 보고서의 분석).\n\n**침투 경로 [후보 — 대량 스캔 포착, 실제 침투 악용은 미확인]**: 외부에 노출된 Apache HTTP Server(HTTP/2 활성화 상태)에 조작된 동시 HTTP/2 요청을 전송해 `mod_http2` 레이스 컨디션 유발(T1190, 후보) → 힙 메모리 오염을 통해 웹서버 프로세스 권한으로 원격 코드·명령 실행(T1059, 후보). 실제 공격 침투 사례는 아직 공식 확인되지 않아 `후보`로 매핑한다.\n\n**어떻게 조치하나** (벤더 권고 및 본 보고서 권고)\n- 즉시: Apache HTTP Server를 **2.4.71 이상**(또는 독립 `mod_h2` 2.0.43 이상, Red Hat·Ubuntu·Debian·Amazon Linux 등 각 OS 배포판의 `CVE-2026-119618` 수정 패키지 — 당시 기준)으로 즉시 패치한다. 패치 전 아파치 에러 로그(워커 프로세스 세그멘테이션 오류·크래시 기록)와 접속 로그를 보존한다. 즉시 패치가 불가능한 운영 서버는 아파치 설정 파일의 `Protocols` 지시자에서 `h2` 및 `h2c`를 제거해 HTTP/2를 임시 비활성화하고 서비스를 재시작한다.\n- 단기: 11월 11일 이후 아파치 워커 프로세스의 반복적인 비정상 종료(`AH00051: child pid ... exit signal Segmentation fault` 등)나 웹서버 계정(`www-data`, `apache` 등)이 실행한 비정상 하위 프로세스·웹셸 생성 흔적이 있는지 점검한다. 침해 정황이 발견되면 패치만으로는 불충분하므로 웹서버가 접근할 수 있었던 API 키·DB 비밀번호·TLS 개인키·세션 서명 키를 안전한 환경에서 전면 재발급하고 서버를 재구축한다.\n- 장기: 웹서버 앞단의 CDN·리버스 프록시·WAF에서 비정상적인 고빈도 병렬 HTTP/2 스트림 생성 및 헤더 플러드 요청을 제한하고, 웹서버 프로세스를 컨테이너·최소 권한 샌드박스로 격리해 RCE가 발생하더라도 호스트 장악으로 번지지 않게 한다.\n- 탐지: 단일 IP에서 짧은 시간 안에 비정상적으로 많은 동시 HTTP/2 스트림을 여는 트래픽과 `httpd`/`apache2` 프로세스의 메모리 오염 크래시 및 쉘 실행(`/bin/sh` 등) 이벤트를 탐지한다.\n\n**교훈**: 이번 결함은 AI 기반 취약점 탐색 도구(Anthropic OSS Scanner)와 클라우드 보안 연구진이 함께 찾아낸 사례로, 방어자뿐 아니라 공격자 역시 AI를 활용해 복잡한 동시성(레이스 컨디션) 버그를 이전보다 훨씬 빠르게 찾아내고 무기화할 수 있는 시대가 되었음을 보여준다.\n\n### [D20261113-signdrop] Windows CLFS(`clfs.sys`) 로그 인증 기능을 역이용한 권한 상승 제로데이 'SignDrop' 개념증명(PoC) 공개\n> 날짜: 보안 연구자 PoC 공개 및 보도 2026-11-11~12 · 유형: Windows 공통 로그 파일 시스템(`clfs.sys`) 로컬 권한 상승 미패치 제로데이(PoC 공개) · 행위자: — (Abdelhamid Naceri 공개, 실제 악용 미확인) · 지역: 전 세계(해외) · 근거: 확인(보안 연구자 PoC 공개·The Hacker News·BleepingComputer 확인)\n\n**쉽게 말하면**: 윈도우 컴퓨터의 핵심 부품인 '공통 로그 파일 시스템(`clfs.sys`)'에서, 일반 사용자 권한만 가진 공격자가 컴퓨터 최고 관리자 권한(`SYSTEM`)을 단숨에 빼앗을 수 있는 새로운 '제로데이' 공격 코드(이름: **SignDrop**)가 인터넷에 공개됐습니다. 아이러니하게도 이 공격은 마이크로소프트가 과거 끊이지 않던 해킹을 막으려고 새로 넣었던 '로그 파일 진위 확인(인증) 보안 기능' 자체를 역이용해, 경로를 살짝 비틀어 최고 권한을 얻어냅니다. 아직 마이크로소프트의 공식 패치가 나오지 않아 랜섬웨어 조직들이 악용할 위험이 큽니다.\n**먼저 할 일(초보용)**: 이 결함은 이미 컴퓨터 안에 첫발을 들인 악성코드가 최고 권한으로 뛰어오를 때 쓰이므로, 일반 사용자와 기업은 출처가 불분명한 파일·스크립트를 절대 실행하지 말고 백신(EDR)을 최신 상태로 유지하세요. 기업 보안 담당자는 마이크로소프트의 긴급 패치가 나올 때까지 윈도우에서 `clfs.sys` 관련 비정상 로그 동반 파일(`.blf` 등)이 엉뚱한 시스템 폴더에 생성되는지 집중 감시하고, 감염이 의심되는 PC에서는 절대 비밀번호를 바꾸지 말고 네트워크에서 즉시 격리하세요.\n\n**개요**: 보안 연구자 압델하미드 나세리(Abdelhamid Naceri, 별칭 Nightmare Eclipse)가 2026년 11월 마이크로소프트 윈도우의 공통 로그 파일 시스템(CLFS, `clfs.sys`) 커널 드라이버를 겨냥한 새로운 로컬 권한 상승(LPE) 제로데이 기법 **'SignDrop'**의 분석과 작동하는 개념증명(PoC) 익스플로잇 코드를 공개했다(The Hacker News·BleepingComputer 11/12 보도). 윈도우의 `clfs.sys`는 최근 수년간 랜섬웨어 그룹과 APT 조직이 일반 권한에서 최고 권한으로 올라갈 때 가장 빈번하게 악용해 온 단골 표적이다. 마이크로소프트는 반복되는 CLFS 메모리 오염 공격을 막기 위해 드라이버 내에 로그 파일의 무결성을 검증하는 '로그 인증(log-authentication) 및 동반 파일(companion file)' 보안 메커니즘을 도입했는데, SignDrop은 바로 이 **보안 기능 자체를 공격 도구로 역이용**했다. 구체적으로 높은 권한(`SYSTEM`)을 가진 프로세스가 조작된 CLFS 로그 파일을 열 때 드라이버가 인증용 동반 파일을 자동 생성하는 과정에서, 공격자가 **경로 리디렉션(path redirection)** 기법을 써서 원래 허용되지 않은 임의의 시스템 경로에 파일이 생성·조작되도록 유도함으로써 프로세스 흐름을 가로채고 로컬 일반 사용자 권한에서 최고 권한인 **`NT AUTHORITY\\SYSTEM`**을 획득한다. 공개 시점(11/12~13) 기준 마이크로소프트의 공식 CVE 번호나 보안 패치는 아직 발표되지 않은 상태다.\n\n**왜 일어났나**\n- 직접 원인 [확인: 연구자 PoC·보안매체 분석]: `clfs.sys` 드라이버가 로그 인증을 위해 동반 파일을 생성·처리할 때 객체 경로(path redirection 등)에 대한 검증이 불완전해, 특권 프로세스의 파일 생성 동작을 공격자가 지정한 경로로 유도할 수 있는 결함이 발생했다.\n- 구조적 원인 [추정 — 분석]: 레거시 커널 드라이버(`clfs.sys`)의 근본 구조를 유지한 채 그 위에 사후 보완용 검증 로직(로그 인증 파일 생성)을 덧대면서, 새로 추가된 보안 코드가 오히려 커널 권한으로 파일을 생성해 주는 새로운 공격 표면(Gadget)이 된 역설적 사례다(본 보고서의 분석).\n\n**침투 경로 [후보 — 공개 PoC 기준, 실제 공격 악용은 미확인]**: 로컬 일반 권한을 확보한 상태에서 조작된 CLFS 로그와 경로 리디렉션을 이용해 `clfs.sys`의 로그 인증 동반 파일 생성을 악용, `NT AUTHORITY\\SYSTEM` 권한으로 상승(T1068, 후보). 실제 공격 캠페인에서의 악용은 아직 확인되지 않아 `후보`로 매핑한다.\n\n**어떻게 조치하나** (본 보고서의 권고)\n- 즉시: 현재 공식 패치가 없는 제로데이 상태이므로, 엔드포인트 보안 솔루션(EDR·백신)의 행위 기반 탐지 및 변조 방지(Tamper Protection) 기능을 최고 수준으로 유지하고 마이크로소프트의 공식 패치 발표를 모니터링해 출시 즉시 적용할 준비를 갖춘다. 침해 정황이 포착된 단말은 메모리·디스크·이벤트 로그를 보존한 뒤 즉시 격리한다.\n- 단기: 이 취약점은 원격에서 단독으로 실행되는 것이 아니라 피싱·초기 침투 등으로 먼저 로컬 실행 권한을 얻어야 작동하므로, 애플리케이션 제어(AppLocker, WDAC) 및 공격 표면 축소(ASR) 규칙을 통해 일반 사용자 영역(`AppData`, `Temp` 등)에서의 비신뢰 실행 파일·스크립트 구동과 심볼릭 링크·정션(Junction) 악용을 차단한다. 만약 로컬 권한 상승 침해가 확인된 단말이 있다면 해당 PC에 캐시된 도메인 자격 증명·세션·토큰이 모두 탈취됐을 수 있으므로 안전한 환경에서 관련 계정 비밀번호·세션을 전면 폐기하고 단말을 재설치(재구축)한다.\n- 장기: 업무상 불필요한 로컬 사용자 권한과 스크립트 실행 도구를 최소화하고, 커널 드라이버 취약점이 악용되더라도 측면 이동을 막을 수 있도록 로컬 관리자 비밀번호 개별 관리(LAPS) 및 특권 계정 분리(Tiering)를 적용한다.\n- 탐지: 비특권 프로세스가 생성한 `.blf`·`.regtrans-ms` 등 CLFS 관련 파일에 대해 `SYSTEM` 프로세스가 접근하며 재분석 지점(Reparse Point / Object Manager 심볼릭 링크)을 통해 시스템 디렉터리에 파일을 생성하는 비정상 이벤트를 EDR에서 집중 탐지한다.\n\n**교훈**: \"보안을 강화하려고 넣은 기능(로그 인증 파일 생성)이 해커에게 최고 권한을 주는 지름길이 됐다\"는 점은 보안 설계가 얼마나 정교해야 하는지 보여준다. 특히 CLFS는 랜섬웨어 조직들이 공개된 PoC를 불과 며칠 만에 자기들 공격 도구에 끼워 넣는 단골 영역이므로 패치 전까지는 초기 침투 차단과 EDR 행위 감시가 유일한 방패다.\n\n### [D20261113-nodejs-http2] Node.js 보안 업데이트(16건): HTTP/2 다른 연결의 응답 메모리 노출(CVE-2026-123866) 및 파일 다운로드 취소 시 서버 강제 종료(CVE-2026-123863·123875) 수정\n> 날짜: OpenJS Foundation 보안 권고·패치 및 CVE 공개 2026-11-11 · 보도 2026-11-12~13 · 유형: 서버 런타임(Node.js) HTTP/2 메모리 노출(UAF) 및 원격 서비스 거부(DoS) 등 16건 · 행위자: — (실제 악용 미확인) · 지역: 전 세계(해외) · 근거: 확인(Node.js 공식 보안 권고·MITRE CVE 확인)\n\n**쉽게 말하면**: 수많은 웹 서비스와 앱의 백엔드 서버로 쓰이는 '노드제이에스(Node.js)'에서 한꺼번에 16개의 보안 결함을 고친 긴급 업데이트가 나왔습니다. 가장 위험한 것은 HTTP/2 통신 중 연결이 끊어질 때 이미 반납한 메모리를 다시 쓰는 결함(CVE-2026-123866)으로, 엉뚱하게 **다른 사용자의 통신 응답 내용(메모리 조각)이 공격자에게 섞여 전달될 수 있는 정보 노출 위험**이 있습니다. 또한 공격자가 로그인도 하지 않고 파일 다운로드를 요청했다가 취소하는 것만으로 서버 전체를 강제로 꺼버릴 수 있는 결함(CVE-2026-123863, CVE-2026-123875)도 함께 수정됐습니다.\n**먼저 할 일(초보용)**: Node.js(22.x, 24.x, 26.x 계열)로 웹·API 서버를 운영하는 개발·인프라팀은 즉시 수정 버전(**v26.13.1, v24.22.3, v22.23.5 이상** — 당시 기준)으로 업데이트하세요. 특히 HTTP/2를 켜 둔 서버에서는 다른 이용자의 응답 데이터(토큰·개인정보 등)가 섞여 나갔을 가능성을 배제할 수 없으므로, 비정상 스트림 종료 로그가 많았다면 패치 후 주요 세션·토큰을 재발급하는 것이 안전합니다.\n\n**개요**: OpenJS 재단(Node.js 프로젝트)은 2026-11-11 지원 대상 릴리스 라인 전반(26.x, 24.x, 22.x)에 걸쳐 총 **16건의 보안 취약점**을 수정한 보안 업데이트(**v26.13.1, v24.22.3, v22.23.5**)를 배포했다(MITRE CVE 공식 레코드 및 The Hacker News·Tenable·KISA 보호나라 11/12~13 공지·보도). 이번 패치에서 가장 주목해야 할 핵심 결함 3건은 모두 기본 HTTP/2 구현에서 발생했다.\n1. **다른 연결의 응답 버퍼 메모리 노출 — CVE-2026-123866(Use-After-Free, 영향: 26.x, 24.x, 22.x)**: HTTP/2 스트림에서 쓰기(write) 작업이 배압(backpressure)으로 대기 중일 때 상대방(peer)이 `RST_STREAM`을 보내거나 서버 자체의 스트림 유휴 타임아웃 등으로 스트림이 해제되면, 스트림의 응답 버퍼 메모리는 해제(free)되지만 그에 대한 참조가 그대로 남는다. 그 결과 원래 보내려던 응답 대신 **이미 해제된 힙 메모리나 다른 연결(다른 사용자)의 응답 버퍼 내용**이 소켓에 기록돼 원격 상대방에게 그대로 노출될 수 있다. 특히 26.x(26.9.0 이후)와 24.x(24.22.0 이후)에서는 원격 클라이언트가 단독으로 이 조건을 유도할 수 있다.\n2. **세션 종료 시 어설션 실패를 통한 원격 서버 강제 종료 — CVE-2026-123863(Reachable Assertion, 영향: 26.9.0~26.13.0, 24.22.0~24.22.2)**: 과거 CVE-2024-27983 패치가 놓친 변종 결함이다. 비인증 클라이언트가 요청 본문(body)이 끝나기 전에 서버가 먼저 응답하는 흔한 HTTP/2 핸들러를 상대로, `nghttp2`가 할당한 헤더 버퍼를 쥔 `Http2Stream`이 세션보다 오래 남도록 유도할 수 있다. 이후 `~Http2Session()` 소멸자가 실행될 때 메모리 계산값이 0이 아니어서 `CHECK_EQ(current_nghttp2_memory_, 0)` 어설션이 실패하며 Node.js 서버 프로세스 전체가 즉시 강제 종료(abort)된다.\n3. **파일 다운로드 취소 시 NULL 포인터 역참조 서버 크래시 — CVE-2026-123875(NULL Pointer Dereference, 영향: 26.x, 24.x, 22.x)**: 서버가 `stream.respondWithFile()` 또는 `stream.respondWithFD()`로 파일을 전송하는 도중 비인증 클라이언트가 요청을 취소하면, 전송에 쓰이던 `StreamPipe` 해제 순서가 꼬이면서 NULL 포인터를 역참조해 프로세스가 즉시 종료된다. 특수 조작된 프레임조차 필요 없고 기본 파일 제공 서버에 몇 번 다운로드 취소를 반복하는 것만으로 서버를 멈추게 할 수 있다.\n\n**왜 일어났나**\n- 직접 원인 [확인: Node.js, MITRE CVE]: 비동기 입출력과 다중 스트림이 얽힌 HTTP/2 세션·스트림 해제(teardown) 과정에서 ① 배압 상태 버퍼의 생명주기 관리 오류로 인한 UAF(CVE-2026-123866), ② 세션 추적 목록에서 빠진 스트림의 미분리 및 어설션 검사 실패(CVE-2026-123863), ③ 파일 스트림 파이프 해제 순서 오류(CVE-2026-123875)가 발생했다.\n- 구조적 원인 [추정 — 분석]: 단일 프로세스(이벤트 루프) 안에서 수천 명의 고객 요청과 메모리 풀을 함께 처리하는 Node.js 특성상, 스트림 해제 시점의 포인터·버퍼 관리 실수 하나가 프로세스 전체 중단(DoS)이나 고객 간 응답 메모리 혼선(Cross-connection leak)으로 이어질 수 있다(본 보고서의 분석).\n\n**침투 경로 [후보 — 공개 시점 실제 악용 미확인, 취약점 메커니즘 기준]**: 외부에 노출된 Node.js HTTP/2 서버에 비정상 스트림 해제(`RST_STREAM` 등)를 유도해 다른 연결의 응답 버퍼 메모리를 열람(T1190, 후보)하거나, 요청 조기 응답·파일 다운로드 취소를 반복해 서버 프로세스를 강제 종료시켜 서비스 거부 유발(T1499, 후보). 실제 악용은 확인되지 않아 `후보`로 매핑한다.\n\n**어떻게 조치하나** (벤더 권고 및 본 보고서 권고)\n- 즉시: 운영 중인 Node.js 런타임을 당시 기준 수정 버전인 **v26.13.1, v24.22.3, v22.23.5 이상** 최신 보안 버전으로 즉시 업데이트하고 컨테이너 베이스 이미지도 재빌드·재배포한다. 패치 전 애플리케이션 크래시 로그와 프록시 접속 기록을 보존한다.\n- 단기: Node.js 프로세스가 인터넷에서 직접 HTTP/2 트래픽을 받고 있었다면, 패치된 리버스 프록시·로드밸런서(Envoy, Nginx 등)가 앞단에서 HTTP/2를 종료(termination)하고 백엔드 Node.js와는 내부 HTTP/1.1로 통신하도록 구성을 점검한다. 또한 `CVE-2026-123866`으로 인해 다른 사용자의 응답 버퍼(세션 토큰·API 응답 등)가 노출됐을 가능성이 있는 고위험 서비스는 패치 완료 후 기존 활성 세션·토큰을 일괄 재발급한다.\n- 장기: 런타임 버전 고정을 자동화 의존성 점검 파이프라인에 포함하고, 비정상 종료 시 자동 재시작(PM2·쿠버네티스 Liveness Probe)과 함께 클라이언트별 `RST_STREAM`·연결 취소 빈도 제한을 적용한다.\n- 탐지: Node.js 프로세스의 `CHECK_EQ(current_nghttp2_memory_, 0)` 어설션 실패 종료, 세그멘테이션 폴트, 단일 IP의 반복적인 HTTP/2 스트림 강제 리셋(`RST_STREAM`) 트래픽을 모니터링한다.\n\n**교훈**: 서버가 꺼지는 결함(DoS)도 문제지만, **다른 고객에게 가야 할 응답 메모리가 내 소켓으로 섞여 나오는 결함(CVE-2026-123866)**은 로그인 토큰이나 개인정보가 조용히 새어 나갈 수 있어 훨씬 치명적이다. 앞단 웹서버(Apache)와 백엔드 런타임(Node.js) 양쪽에서 동시에 HTTP/2 결함이 터져 나온 만큼 HTTP/2 처리 계층 전반을 즉시 점검해야 한다.\n\n### [D20261113-adobeconnect] Adobe Connect 비인증 CVSS 10.0 만점 결함 4건(CVE-2026-121351~121353·121356) 및 SQL 삽입(9.9) 등 24건 일괄 패치\n> 날짜: Adobe 보안 권고(APSB26-191) 및 MITRE CVE 공개 2026-11-10~11 · 국내외 보도 2026-11-12 · 유형: 화상회의·원격교육 서버 비인증 경로 조작·CRLF 삽입·인가 결함·SSRF·SQLi 치명적 취약점(CVSS 10.0 4건 포함 24건) · 행위자: — (실제 악용 미확인) · 지역: 전 세계(해외) · 근거: 확인(Adobe APSB26-191·MITRE CVE 확인)\n\n**쉽게 말하면**: 기업과 대학, 공공기관에서 온라인 화상회의나 원격 강의용으로 자체 서버에 설치해 쓰는 '어도비 커넥트(Adobe Connect)'에서, 위험도 최고 점수인 **CVSS 10.0 만점짜리 결함 4건**을 포함해 총 24개의 보안 취약점이 한꺼번에 발견돼 패치가 나왔습니다. 해커가 로그인조차 하지 않고 원격에서 서버 안의 민감한 파일을 마음대로 읽어가거나 줄바꿈 문자(CRLF 삽입)·요청 위조(SSRF)로 권한과 사용자 세션을 가로챌 수 있고, 낮은 권한 계정만 있어도 데이터베이스 명령어(SQL 삽입, CVSS 9.9)를 끼워 넣어 원격 코드를 실행할 수 있는 심각한 수준입니다.\n**먼저 할 일(초보용)**: 자체 윈도우 서버에 Adobe Connect(12.12 이하 버전)를 설치해 운영하는 기관·기업 관리자는 어도비가 배포한 수정 버전(**12.12.a, 12.11.i, 12.10.f, 12.9.a, 12.8.a** — 당시 기준)을 즉시 적용하세요. 외부 인터넷에 열려 있는 화상회의 서버 특성상 이미 설정 파일이나 세션이 노출됐을 가능성이 있다면, 패치만 하지 말고 안전한 기기에서 관리자 비밀번호·DB 연동 정보·기존 로그인 세션을 모두 재발급하세요.\n\n**개요**: 어도비(Adobe)는 보안 권고 **APSB26-191**을 통해 Windows 환경에서 자체 호스팅(self-hosted)으로 운영되는 **Adobe Connect(12.12 및 이전 버전)**의 보안 취약점 **24건**을 일괄 수정했다(MITRE CVE 공식 레코드 및 데일리시큐 11/12 보도, 공개 시점 실제 악용 사례는 미확인). 이 가운데 사전 인증이나 사용자 상호작용 없이 원격에서 악용 가능하고 영향 범위가 확장(Scope Changed)되는 **CVSS 10.0(만점) 취약점이 4건**, CVSS 9.9 취약점이 2건 이상 포함됐다.\n1. **CVE-2026-121351 (CVSS 10.0, 경로 조작 / CWE-22)** 및 **CVE-2026-121354 (CVSS 9.9, 경로 조작)**: 제한된 디렉터리 경로 검증이 부적절해, 비인증 공격자가 의도된 범위를 벗어나 서버 파일 시스템의 민감한 파일과 디렉터리를 임의로 읽어갈 수 있다.\n2. **CVE-2026-121352 (CVSS 10.0, 부적절한 인가 / CWE-863)**: 인가(Authorization) 검증 결함으로 인해 비인증 원격 공격자가 민감한 자원에 무단 접근하고 권한을 상승시킬 수 있다.\n3. **CVE-2026-121353 (CVSS 10.0, CRLF 삽입 / CWE-93)**: 줄바꿈 문자(CRLF) 시퀀스를 제대로 무력화하지 않아, 공격자가 현재 사용자 컨텍스트에서 임의 코드를 실행(RCE)하고 피해자의 계정이나 세션에 대한 높은 권한·제어권을 장악할 수 있다.\n4. **CVE-2026-121356 (CVSS 10.0, 서버 측 요청 위조 SSRF / CWE-918)**: SSRF 결함을 통해 비인증 원격 공격자가 서버를 경유해 비인가 요청을 수행하고 권한 상승을 달성할 수 있다.\n5. **CVE-2026-121896 (CVSS 9.9, SQL 삽입 / CWE-89)**: 낮은 권한의 공격자가 SQL 명령에 특수 요소를 삽입해 임의 코드를 실행할 수 있다.\n\n**왜 일어났나**\n- 직접 원인 [확인: Adobe, MITRE CVE]: Adobe Connect 웹 애플리케이션 전반에서 파일 경로 제한(Path Traversal), 리소스 인가 검사, CRLF 문자열 이스케이프, 외부 요청 대상 검증(SSRF), SQL 쿼리 파라미터 바인딩 등 기본적인 입력·권한 검증이 복합적으로 누락됐다.\n- 구조적 원인 [추정 — 분석]: 화상회의·원격교육 솔루션은 외부 참가자와 자료 공유·녹화 파일 처리·웹 세션을 위해 반드시 인터넷에 직접 노출되는 경우가 많아, 파일 경로 처리나 헤더·쿼리 검증 결함이 곧바로 외부 비인증 파일 열람과 원격 코드 실행으로 직결된다(본 보고서의 분석).\n\n**침투 경로 [후보 — 공개 시점 실제 악용 미확인, 취약점 메커니즘 기준]**: 외부에 노출된 Adobe Connect 서버에 조작된 요청을 보내 경로 조작·인가 우회·CRLF 삽입·SSRF 취약점 악용(T1190, 후보) → 경로 조작(CVE-2026-121351·121354)을 통해 제한된 디렉터리 밖의 민감한 서버 파일 열람·수집(T1005, 후보) 및 CRLF 삽입(CVE-2026-121353)·SQL 삽입(CVE-2026-121896)을 통한 임의 코드 실행(T1059, 후보). 실제 악용은 확인되지 않아 모두 `후보`로 매핑한다.\n\n**어떻게 조치하나** (벤더 권고 및 본 보고서 권고)\n- 즉시: 자체 호스팅 Adobe Connect 서버를 당시 기준 각 버전 브랜치별 수정 릴리스(**12.12.a, 12.11.i, 12.10.f, 12.9.a, 12.8.a** 이상 최신 보안 버전)로 즉시 업데이트한다. 패치 전 웹 접속 로그·파일 접근 기록·DB 로그를 보존한다.\n- 단기: 경로 조작 결함(`CVE-2026-121351`, `CVE-2026-121354`)으로 서버 설정 파일이나 녹화본·데이터베이스 접속 정보가 이미 열람됐을 가능성이 있으므로, 접속 로그에서 `../` 등 비정상 경로 요청이나 CRLF(`%0d%0a`) 삽입 흔적을 전수 점검한다. 의심 흔적이 있거나 외부에 무방비로 노출돼 있었다면 안전한 환경에서 **DB 비밀번호·연동 API 키·관리자 비밀번호를 전면 교체하고 기존 발급된 모든 사용자·관리자 세션을 무효화**하며, 웹셸 등 지속성 흔적 발견 시 서버를 재구축한다.\n- 장기: 자체 호스팅 화상회의 서버 앞단에 WAF를 배치해 경로 조작·SQLi·CRLF 패턴을 1차 차단하고, 서버 프로세스가 운영체제의 민감한 파일이나 내부 클라우드 메타데이터(SSRF 대상)에 접근하지 못하도록 OS 계정 권한과 아웃바운드 방화벽을 제한한다.\n- 탐지: Adobe Connect URL 및 헤더 내 `%0d%0a`(CRLF), `..` 경로 탐색 문자열, 비정상 SQL 구문 및 서버에서 내부망 IP로 향하는 비인가 아웃바운드 연결(SSRF)을 감시한다.\n\n**교훈**: 어제 다룬 SAP(`D20261112-sap-icm2shell`)에 이어 Adobe Connect에서도 한 번에 CVSS 10.0 만점 결함이 4건이나 쏟아져 나왔다. 특히 파일 읽기(Path Traversal)와 코드 실행(CRLF·SQLi)이 한 제품에서 동시에 공개되면 공격자가 두 결함을 엮어(Chaining) 손쉽게 서버를 장악할 수 있으므로 패치를 미뤄서는 안 된다.\n\n### [D20261113-apify] 웹 자동화·AI 데이터 플랫폼 Apify 내부 자격 증명 침해 — API 토큰·프록시 비밀번호 강제 교체 및 GitHub 연동 해제\n> 날짜: 비인가 접근 발생 2026-11-09~10 · 침해 탐지·차단 2026-11-11 12:13(UTC) · 고객 통지·보도 2026-11-11~12 · 유형: 웹 스크래핑·브라우저 자동화 클라우드 플랫폼 자격 증명 침해 및 API 토큰·연동 정보 노출 우려 · 행위자: 미귀속 · 지역: 전 세계(해외) · 근거: 확인(Apify 공식 보안 공지·BleepingComputer 보도)\n\n**쉽게 말하면**: 전 세계 개발자와 AI 기업들이 웹사이트 데이터를 자동으로 수집(스크래핑)하거나 브라우저 작업을 자동화할 때 널리 쓰는 클라우드 플랫폼 '애피파이(Apify)'의 내부 시스템이 해킹당했습니다. 공격자는 훔친 자격 증명으로 내부 시스템에 들어와 여러 고객의 계정 자격 증명과 2단계 인증(2FA) 관련 정보 등에 접근했습니다. 이에 회사는 피해 가능성이 있는 고객들의 API 접속 토큰과 프록시 비밀번호를 강제로 모두 새로 바꾸고, 혹시 모를 연쇄 해킹을 막기 위해 고객들이 연결해 둔 깃허브(GitHub) 연동(OAuth)도 일괄 해제했습니다.\n**먼저 할 일(초보용)**: Apify를 사용하는 개발자·기업은 감염되지 않은 안전한 기기에서 Apify 콘솔에 접속해 **2단계 인증(2FA)을 즉시 재설정(초기화 후 재등록)**하고, 회사가 강제로 새로 바꾼 API 토큰과 프록시 비밀번호를 확인해 사내 자동화 파이프라인에 반영하세요. 또한 Apify 자동화 작업(Actor) 안에 우리 회사의 다른 외부 서비스 비밀키(DB·클라우드·메신저 토큰 등)를 넣어 두었다면 그 비밀키들도 함께 폐기·재발급하세요.\n\n**개요**: 웹 스크래핑·브라우저 자동화 및 AI 에이전트 데이터 수집 플랫폼인 **Apify**는 2026-11-11~12 공식 보안 공지를 통해, 지난 11월 9일부터 10일 사이 비인가 제3자가 자사 내부 시스템 일부에 침입한 사실을 확인했다고 발표했다(BleepingComputer 등 보도). Apify는 11월 11일 12시 13분(UTC) 침입을 탐지해 공격자의 접근을 차단하고 조사에 착수했다. 회사 발표에 따르면 공격자는 **침해된 자격 증명(compromised credential)**을 이용해 내부 시스템에 접근한 뒤, 다수의 계정 자격 증명을 획득하고 관련된 사용자 계정들에 접근했다. 기본 로그인 비밀번호(해시)는 안전한 것으로 파악됐으나 **2단계 인증(2FA) 코드·설정 정보**와 API 토큰 등이 노출됐을 가능성이 제기됐다. 이에 Apify는 예방적·긴급 조치로 ① 영향받은 고객들의 **API 토큰과 프록시 비밀번호를 강제로 일괄 교체(회전)**하고, ② 외부 통합 경로를 통한 2차 피해를 원천 차단하기 위해 **GitHub 등 서드파티 OAuth 연결을 일괄 취소(revoke)**했으며(조사 결과 외부 OAuth 연동 자체가 공격 경로로 악용된 증거는 없다고 설명), ③ 영향받은 사용자들에게 개별 이메일을 보내 콘솔에서 2FA 설정을 재설정할 것을 권고했다.\n\n**왜 일어났나**\n- 직접 원인 [확인: Apify 공식 공지]: 공격자가 침해된 자격 증명을 이용해 Apify 내부 시스템 일부에 비인가 접근한 뒤 고객 계정 관련 자격 증명 및 인증 정보에 접근했다(최초 내부 자격 증명이 어떤 경위로 탈취됐는지는 미공개).\n- 구조적 원인 [추정 — 분석]: 웹 자동화·AI 스크래핑 플랫폼은 고객의 자동화 스크립트(Actor)를 대신 실행하기 위해 고객의 API 토큰, 프록시 자격 증명, 비공개 GitHub 저장소 연동 토큰(OAuth)을 한곳에 집중 보관한다. 따라서 플랫폼 내부 시스템 자격 증명 하나가 뚫리면 수많은 하위 기업 고객의 개발 저장소와 자동화 파이프라인으로 위험이 연쇄 전이되는 공급망 허브 성격을 갖는다(본 보고서의 분석).\n\n**침투 경로 [확인 — Apify 공지 기준]**: 침해된 자격 증명을 이용해 Apify 내부 시스템에 비인가 로그인(T1078, 확인 — 최초 자격 증명 탈취 수단은 미공개) → 내부 시스템에서 다수 고객 계정의 자격 증명(API 토큰·프록시 비밀번호·2FA 관련 정보 등)에 접근·수집(T1552, 확인).\n\n**어떻게 조치하나** (벤더 권고 및 본 보고서 권고)\n- 즉시: Apify로부터 통지를 받았거나 해당 기간 플랫폼을 사용한 조직은 11월 9일~11일 사이 자사 Apify 계정에서 비정상 Actor 실행·스케줄 변경·데이터 내보내기 및 연결됐던 GitHub 비공개 저장소에 대한 비인가 접근 로그가 있는지 신속히 보존·점검한다. 침해가 의심되는 기기에서 새 비밀을 발급하지 않는다.\n- 단기: Apify가 API 토큰·프록시 비밀번호를 강제 회전하고 GitHub OAuth 연동을 해제했더라도, 공격자가 **2FA 설정 정보**나 **고객이 Actor 환경변수·코드 안에 직접 적어 둔 제3자 서비스 비밀키(OpenAI·클라우드·사내 DB 키 등)**에 접근했을 가능성에 대비해야 한다. 따라서 ① 안전한 기기에서 Apify 콘솔의 **2FA를 즉시 초기화·재등록**하고 기존 웹 세션을 모두 로그아웃하며, ② Apify 환경변수(Secret)·스토리지에 저장해 두었던 모든 외부 API 키·크리덴셜을 별도로 전면 폐기·재발급한다. ③ GitHub 연동을 다시 연결할 때는 조직 전체가 아닌 꼭 필요한 단일 저장소에만 최소 권한으로 재승인한다.\n- 장기: 외부 자동화·스크래핑 SaaS에 사내 핵심 DB나 클라우드 장기 자격 증명을 직접 저장하지 않고 단기 토큰·제한된 수집 전용 계정을 사용하며, 서드파티 OAuth 앱의 접근 범위를 정기 감사한다.\n- 탐지: 11월 9일 이후 기존 Apify API 토큰이나 프록시 계정을 사용한 비정상 IP의 호출 시도 및 Apify에 저장됐던 타 서비스 API 키의 미승인 사용 이력을 모니터링한다.\n\n**교훈**: 클라우드 자동화 서비스(Apify)가 고객의 API 토큰과 GitHub 연동을 빠르게 일괄 회수(강제 회전)한 조치는 2차 피해를 줄이는 모범적인 초동 대응이다. 그러나 이용자 입장에서는 플랫폼이 바꿔 준 'Apify 자체 토큰'만 믿고 끝낼 것이 아니라, **내가 그 플랫폼 안에 넣어 두었던 다른 서비스의 비밀키들**과 **2단계 인증(2FA) 시드**까지 직접 갈아 끼워야 진짜 마무리가 된다.\n\n## 3. 교차 분석 — 오늘의 사례에서 보이는 패턴\n\n> 선정된 국내외 8건의 공통점이며 전체 공격의 통계가 아니다.\n\n1. **'비밀번호·시크릿만 바꾸면 끝'이라는 착각을 무너뜨리는 지속성과 2차 노출**: 오늘의 GitHub 4,837개 계정 캠페인(`D20261113-github-ci`)은 클라우드 시크릿과 OIDC 토큰을 훔친 뒤 곧바로 **AWS IAM 신뢰 정책과 Azure(Entra ID) 페더레이션 자격 증명(`wfx-ci-`)을 변조**해 두었다. 이 백도어를 먼저 지우지 않고 시크릿만 바꾸면 공격자는 바뀐 환경을 그대로 다시 장악한다. 또한 커밋을 즉시 되돌려(revert) 현재 코드 화면만 봐서는 침투 흔적이 보이지 않는다. Apify 침해(`D20261113-apify`) 역시 2FA 설정 정보까지 노출 우려가 제기돼 2FA 재등록이 함께 요구됐다.\n2. **웹의 대문(HTTP/2)과 화상회의 서버에서 동시에 터진 비인증 치명적 결함**: 전 세계 웹서버의 기둥인 Apache HTTP Server(`D20261113-apache-http2`, CVE-2026-119618, CVSS 9.8)와 백엔드 런타임 Node.js(`D20261113-nodejs-http2`, CVE-2026-123866 등)에서 나란히 **HTTP/2 스트림·세션 처리의 비동기/동시성 메모리 결함(레이스 컨디션·UAF)**이 수정됐다. 여기에 자체 호스팅 화상회의 서버 Adobe Connect(`D20261113-adobeconnect`)에서도 CVSS 10.0 만점 결함 4건이 한꺼번에 공개됐다.\n3. **'보안 기능'과 '주변 위탁·내부관리 시스템'의 역설**: Windows CLFS 제로데이 'SignDrop'(`D20261113-signdrop`)은 과거 해킹을 막으려고 추가한 '로그 인증 파일 생성' 기능을 거꾸로 이용해 `SYSTEM` 권한을 탈취했다. 국내에서는 대기업·은행·공공기관이 믿고 교육을 맡긴 삼성SDS 자회사 멀티캠퍼스(`D20261113-multicampus`, 약 7만 명)와 KB캐피탈의 자동차 임대자산관리시스템(`D20261113-kbcapital`, 1,811명)처럼 핵심 코어망이 아닌 **위탁 교육·부수적 자산관리 시스템**에서 임직원 사번·부서·직급·계정 정보가 대거 유출돼 표적형 2차 공격의 발판이 될 위험을 드러냈다.\n\n과거 3년 사건과의 연결은 [../과거3년/99-총평.md](../과거3년/99-총평.md)에 있다.\n\n## 4. 국내 소식 (업종별 6개 범주 검색 결과)\n\n최근 7일(2026년 11월) 기준으로 6개 범주를 각각 분리 검색해 본문 사건 2건(`D20261113-multicampus`, `D20261113-kbcapital`)과 `국내뉴스.psv` 보충 7건을 정리했다.\n\n- **① 금융권(은행·카드·보험·증권·저축은행·캐피탈·가상자산)**:\n  - **KB캐피탈**의 내부 업무용 '자동차 임대자산관리시스템'이 해킹당해 일반 고객 20명과 임직원·협력사 직원 1,791명 등 총 1,811명의 개인·계정정보가 유출된 사건(11/10 탐지·차단 및 금감원 신고, 11/12 공지, 11/13 보도)을 본문 사건 `[D20261113-kbcapital]`로 수록했다.\n  - 가상자산(코인마켓) 거래소 **플라이빗(운영사 한국디지털거래소)**에서 외부 비인가자가 사내 그룹웨어(다우기술 환경)에 접근해 조세징수 기관의 정보 제공 요청 메일 첨부파일에 담겨 있던 고객 40명의 성명·주민등록번호(또는 생년월일)·연락처·납세 관련 정보와 법인 정보를 유출한 사건(11/12 공지·보도, 거래 시스템 및 가상자산 피해 없음)을 `국내뉴스.psv`에 추가했다.\n- **② 통신·OTT·플랫폼·이커머스·유통**: 신세계그룹 계열 온라인 쇼핑몰 **SSG닷컴**에서 외부 비인가자가 API 취약점을 악용해 고객 성명과 내부 식별용 고객번호(일부 연락처·주소 등)를 무단 조회·유출한 사고(11/4 인지, 11/5~6 KISA·개인정보위 신고 및 고객 개별 통지, 전체 피해 규모 비공개)를 `국내뉴스.psv`에 추가했다.\n- **③ 공공기관·지자체·교육(대학)·의료·기업교육**:\n  - 삼성SDS 자회사이자 주요 대기업·금융사·공공기관 임직원 위탁 교육 전문 기업인 **멀티캠퍼스**의 온라인 교육 플랫폼('러닝플랫폼') 해킹으로 수강생 약 7만 명의 이름·전화번호·이메일·부서명·사번·아이디·직급·직위 등이 유출된 사건(11/9 발생, 11/11 야간 통지·신고, 11/12~13 보도)을 본문 사건 `[D20261113-multicampus]`로 수록했다.\n  - **개인정보보호위원회**가 정책포럼(11/9)에서 공공 부문 개인정보 유출 신고 건수의 **61%는 자료 오게시·이메일 오발송 등 '업무상 과실'**로 발생하지만 **유출 피해 규모(인원)의 95%는 해킹**에서 비롯된다고 밝히고 시스템적 예방 장치 전환을 강조한 내용을 `국내뉴스.psv`에 추가했다.\n- **④ 국내 랜섬웨어 피해**: 안랩 ASEC의 11월 2주차 랜섬웨어 동향 분석에서 글로벌 랜섬웨어 조직 **INC Ransom**이 **국내 화학소재 제조기업**을 공격해 피해를 입혔고, 메타인크립터(`D20261110-metaencryptor`) 등의 국내 기업 표적 공격도 이어졌다는 분석을 확인해 `국내뉴스.psv`에 추가했다.\n- **⑤ 과기정통부·KISA·개인정보위·금융위·금감원 조사 결과·제재·긴급 점검 발표**: **금융위원회와 금융감독원**이 금융보안원 '정보보호 상시평가 지원시스템' 해킹(`D20261111-fsec`)과 관련해 오는 **11월 16일부터 본격적인 특정감사**에 착수하며, 특히 **2022년 금융위 특정감사 당시 외부망을 통한 상시평가 시스템 증빙자료 열람·유출 위험을 경고받았음에도 제대로 시정했는지**와 구체적 유출 규모(48개 금융사 관련 파일 130여 개: 행정서식 약 200건, 서식 내 담당자 등 개인정보 300여 건, 마스킹 이용자 정보 350여 건 등)를 집중 조사한다는 발표(11/12~13 보도)를 `국내뉴스.psv`에 추가했다.\n- **⑥ 기존 대형 사건의 추가 규모·후속 분석 및 국내 컨퍼런스**: ⑤번의 금융보안원(`D20261111-fsec`) 세부 유출 건수 및 특정감사 착수 소식과 함께, 국내 금융권 공격(`D20261006-finsector`) 등에서 거론된 자율형 AI 침투 도구 **'아르텍스(ARTEX)'를 악용해 1초 간격으로 시도를 분산하는 기계적 패스워드 스프레이 패턴 분석**(보안뉴스 11/12 보도), 그리고 서울에서 개최된 국제 해킹·보안 컨퍼런스 **'POC 2026'에서 데브코어(DEVCORE) 연구진이 사파리(Safari) 26.5 및 웹킷(WebKit) 메모리 결함 해킹 시연을 공개**한 소식(데일리시큐 11/12 보도)을 `국내뉴스.psv`에 추가했다.\n\n## 5. 우선 대응 체크리스트\n\n1. **GitHub Actions 및 클라우드(AWS·Azure·GCP) 연동 조직(최우선 — 실제 대규모 악용 및 IAM 백도어)**: [D20261113-github-ci](#d20261113-github-ci-탈취된-github-계정-4837개로-1806개-저장소-오염--가짜-prdocs-dependency-audit-notes로-ci-시크릿-탈취-및-클라우드-iam-백도어-설치) — 저장소 내 `wfx-docs` 브랜치·`'docs: dependency audit notes'` PR·즉시 되돌려진(reverted) 커밋 흔적을 헌팅하고, **AWS IAM 신뢰 정책 변조 및 Azure `wfx-ci-` 페더레이션 자격 증명 백도어를 먼저 삭제한 뒤** 모든 시크릿·클라우드 키·토큰을 재발급.\n2. **Apache HTTP Server(2.4.55~2.4.70) 및 Node.js(22.x·24.x·26.x) 운영 조직**: [D20261113-apache-http2](#d20261113-apache-http2-apache-http-server-mod_http2-비인증-원격-코드-실행-결함cve-2026-119618-cvss-98-긴급-패치--병렬-요청-레이스-컨디션)·[D20261113-nodejs-http2](#d20261113-nodejs-http2-nodejs-보안-업데이트16건-http2-다른-연결의-응답-메모리-노출cve-2026-123866-및-파일-다운로드-취소-시-서버-강제-종료cve-2026-123863123875-수정) — Apache **2.4.71** 이상(또는 배포판 백포트 패치, 불가 시 `h2`·`h2c` 비활성화) 및 Node.js **v26.13.1 / v24.22.3 / v22.23.5** 이상 즉시 적용.\n3. **자체 호스팅 Adobe Connect 운영 기관·대학·기업(CVSS 10.0 4건)**: [D20261113-adobeconnect](#d20261113-adobeconnect-adobe-connect-비인증-cvss-100-만점-결함-4건cve-2026-121351121353121356-및-sql-삽입99-등-24건-일괄-패치) — **12.12.a / 12.11.i / 12.10.f** 등으로 즉시 업데이트하고 경로 조작(`..`)·CRLF 흔적 점검 및 자격 증명·세션 교체.\n4. **Windows 서버·엔드포인트 운영 조직(SignDrop 미패치 제로데이 PoC 대비)**: [D20261113-signdrop](#d20261113-signdrop-windows-clfsclfssys-로그-인증-기능을-역이용한-권한-상승-제로데이-signdrop-개념증명poc-공개) — 비신뢰 로컬 실행 통제 강화, EDR을 통한 `clfs.sys` 동반 파일 경로 리디렉션 감시 및 MS 패치 즉시 적용 대기.\n5. **멀티캠퍼스 러닝플랫폼 이용 기업·임직원, KB캐피탈 임직원·협력사·고객 및 Apify 이용자**: [D20261113-multicampus](#d20261113-multicampus-삼성sds-자회사-멀티캠퍼스-온라인-교육-플랫폼-해킹--고객사-임직원-약-7만-명-이름사번부서직급-등-유출)·[D20261113-kbcapital](#d20261113-kbcapital-kb캐피탈-자동차-임대자산관리시스템-해킹으로-고객임직원협력사-직원-1811명-개인계정정보-유출)·[D20261113-apify](#d20261113-apify-웹-자동화ai-데이터-플랫폼-apify-내부-자격-증명-침해--api-토큰프록시-비밀번호-강제-교체-및-github-연동-해제) — 안전한 기기에서 비밀번호·2FA 재설정 및 기존 세션 무효화, 유출된 사번·부서·직급·계정을 악용한 사칭 피싱 및 크리덴셜 스터핑 방어.\n\n## 6. 검증 수준과 한계\n\n- CISA KEV 카탈로그를 2026-11-13 직접 조회한 결과 11-10 등재분 이후 신규 등재 항목은 없었다.\n- Apache HTTP Server(`CVE-2026-119618`), Node.js(`CVE-2026-123863`, `CVE-2026-123866`, `CVE-2026-123875`), Adobe Connect(`CVE-2026-121351`, `CVE-2026-121352`, `CVE-2026-121353`, `CVE-2026-121354`, `CVE-2026-121355`, `CVE-2026-121356`, `CVE-2026-121896`) 취약점은 MITRE CVE 공식 API 레코드와 벤더 보안 권고를 직접 대조해 확인했다(일부 이차 요약 자료에서 Adobe Connect 결함으로 잘못 묶인 `CVE-2026-121389`는 MITRE 원문 확인 결과 FreeRDP 결함이어서 제외하고 실제 CVSS 10.0 결함인 `CVE-2026-121353`을 정확히 반영했다). 세 건 모두 공개 시점 실제 침투 악용은 공식 확인되지 않아 ATT&CK 매핑에서 `후보`로 구분했다. 수정 버전 번호는 발표 당시 기준이므로 실제 조치 시 각 벤더·OS 배포판의 최신 보안 권고를 재확인해야 한다.\n- Windows CLFS 'SignDrop'(`D20261113-signdrop`)은 공개 시점 공식 CVE 번호와 마이크로소프트 패치가 부여되지 않은 상태이며, PoC 공개는 확인됐으나 실제 공격 악용은 미확인이어서 `후보`로 매핑했다.\n- 국내 사건 중 멀티캠퍼스(`D20261113-multicampus`)와 KB캐피탈(`D20261113-kbcapital`)은 비인가 접근 및 정보 유출 사실과 규모·항목은 회사 공지·당국 신고로 확인됐으나, 최초 침투 기법(웹·API 취약점 여부 또는 계정 탈취 여부)이 공개되지 않아 지침에 따라 ATT&CK 기법을 추측으로 매핑하지 않았다.\n- **ATT&CK 버전 확인 결과**: https://attack.mitre.org/tactics/enterprise/ 에서 현재 공식 버전이 **v20.1**임을 확인했다(작업 지침은 v19.2 기준, 본 저장소 카탈로그는 v20.0 기준). 전술 15개 체계는 동일하므로 임의 대규모 재매핑 없이 기존 카탈로그 범위에서 매핑했다.\n- **독립 교차 검토**: 현재 실행 환경이 Gemini(Antigravity)여서 지침 8번에 따라 Gemini 자체 교차 검토를 수행해 사실관계·근거 표기·ATT&CK 전술-기법 일치·초보용 문장 정확성을 점검했다.\n\n## 출처\n\n- Aviatrix Threat Research Center (2026-11-12): \"4,837 Hijacked GitHub Accounts Weaponized to Steal CI Secrets Across 1,806+ Repositories\" 및 The Hacker News\n- Apache Software Foundation Security Advisory (Apache HTTP Server 2.4.71), MITRE CVE API (`CVE-2026-119618`), SecurityWeek·The Hacker News·BleepingComputer\n- The Hacker News·BleepingComputer: Windows CLFS (`clfs.sys`) Zero-Day LPE PoC \"SignDrop\" disclosed by Abdelhamid Naceri\n- OpenJS Foundation / Node.js November 2026 Security Releases (`v26.13.1`, `v24.22.3`, `v22.23.5`), MITRE CVE API (`CVE-2026-123863`, `CVE-2026-123866`, `CVE-2026-123875`), Tenable·KISA 보호나라\n- Adobe Security Bulletin APSB26-191 (Adobe Connect), MITRE CVE API (`CVE-2026-121351`~`121356`, `CVE-2026-121896`), 데일리시큐(idxno=209471)\n- Apify Security Incident Notice (November 2026) 및 BleepingComputer\n- 데일리시큐(idxno=209491)·비즈중앙(idxno=55344): 삼성SDS 자회사 멀티캠퍼스 해킹, 온라인 교육 플랫폼 임직원 약 7만 명 개인정보 유출\n- 연합뉴스(AKR20261113050800002)·서울경제(20113826)·KB캐피탈 공지: KB캐피탈 자동차 임대자산관리시스템 해킹 1,811명 정보 유출\n- 지디넷코리아(20261106151118)·조선비즈: SSG닷컴 API 취약점 개인정보 유출 신고·통지\n- 데일리시큐(idxno=209490)·이데일리: 가상자산 거래소 플라이빗(한국디지털거래소) 그룹웨어 경유 40명 주민번호·납세정보 유출\n- 디지털데일리(2026111217320095988)·서울경제: 금융위·금감원, 금융보안원 상시평가 시스템 해킹 관련 11/16 특정감사 착수\n- 데일리시큐(idxno=209415 public sector 61% negligence, idxno=209480 POC 2026 Safari WebKit), 보안뉴스(idxno=147193 ARTEX password spray), 안랩 ASEC 블로그(96480, 11월 2주차 랜섬웨어 동향 INC Ransom 국내 화학소재 제조사 피해)\n- MITRE ATT&CK Enterprise v20.1 (https://attack.mitre.org/tactics/enterprise/)\n"},{"path":"일일/2026-11-14.md","title":"일일 보안 이슈 분석 — 2026-11-14","md":"# 일일 보안 이슈 분석 — 2026-11-14\n\n> 수집 기준: 2026-11-13 야간 ~ 11-14 공개·보도분([11-13 보고서](2026-11-13.md) 이후). CISA KEV 2026-11-13 신규 등재 2건(Check Point CVE-2026-123039, UnrealIRCd CVE-2026-114713), 벤더·연구기관·사법당국 1차 발표(Check Point sk1000362·Aviatrix, UnrealIRCd, Barracuda Networks, Sentra·Wiz·Mandiant·Expedia, Notion·Fireworks AI, 미 법무부 DOJ·FBI, Forescout Vedere Labs, 유로폴 등 Operation Endgame)와 MITRE CVE 공식 레코드, 국내 정부·기업 공지 및 주요 언론·보안매체(한겨레·매일경제·지디넷코리아·보안뉴스·데일리시큐·MBC) 원문을 확인했다.\n> 근거 표기: **[확인]** 벤더·정부기관·연구기관이 직접 확인 / 보도 언론 보도 / **[추정]** 본 보고서의 추정 / **[주장]** 공격자 일방 주장. **조치는 본 보고서의 권고**이며 벤더·당국의 공식 지침이 우선한다. 모든 '즉시' 조치는 증거(로그·메모리·디스크·클라우드 감사 기록)를 신속히 보존하되 패치를 미루지 않으며, 침해된 장비·계정에서 새 비밀을 발급하지 않는다.\n> **ATT&CK 버전 점검**: https://attack.mitre.org/tactics/enterprise/ 직접 확인 결과 현재 공식 버전은 **v20.1**(저장소 카탈로그 기준은 v20.0, 작업 지침 문구는 v19.2)이다. 전술 15개(TA0005=Stealth, TA0112=Defense Impairment) 구성은 동일하여 임의 대규모 재매핑 없이 기존 카탈로그 기준으로 매핑했다.\n\n## 1. 오늘의 요약\n\n| # | 이슈 | CVE / 권고 | 유형 | 상태 | 즉시 조치 |\n|---|------|-----------|------|------|-----------|\n| 1 | 업무용 협업 플랫폼 '카카오워크(디케이테크인)' 해킹 — 임직원·외부 인원 개인정보 및 업무 메일 본문·첨부파일 원본 유출 | — | 기업용 협업툴·메일 시스템 비인가 접근 | [확인] 카카오엔터프라이즈·디케이테크인 공지 및 당국 신고 | 안전한 기기에서 비밀번호 변경·세션 초기화, 메일·첨부파일에 포함됐던 업무 비밀키·계정 전수 교체 및 사칭 피싱 주의 |\n| 2 | 중기부 '모두의 창업' 2차 사업 참여 AI 기업 '아미쿠스렉스 *가 탈취된 고객 AI 서비스 키의 무단 사용액을 **약 74만 달러**로 추산하고 1,852명의 연동 토큰을 재설정한 상세 조사 결과(11/10 발표), ③ 국제 사법당국의 **'엔드게임 작전(Operation Endgame)'**을 통한 **Gootloader·CastleRAT·StealC 악성코드 서버 235대·도메인 257개 압수**(11/13 발표), ④ 포어스카우트(Forescout) **Vedere Labs가 상용 AI 모델로 10개 레거시 TCP/IP 스택을 90시간 만에 분석해 66개의 미공개 제로데이를 포함한 99개 취약점을 발굴**한 연구(11/13 보도)를 교차 분석 및 본문에 함께 반영했다.\n\n## 2. 이슈별 분석\n\n### [D20261114-kakaowork] 업무용 협업 플랫폼 '카카오워크(디케이테크인)' 해킹 — 임직원·외부 인원 개인정보 및 업무 메일 본문·첨부파일 원본 유출\n> 날짜: 비정상 접근 발생 2026-11-09 · 공식 공지 및 당국 신고·보도 2026-11-12~13 · 유형: 기업용 협업 플랫폼·업무 메일 시스템 비인가 접근 및 업무 자료 유출 · 행위자: 미귀속 · 지역: 한국 · 근거: 확인(카카오엔터프라이즈·디케이테크인 공식 공지 및 개인정보위·KISA 신고, 보안뉴스·매일경제·한겨레·지디넷코리아 보도)\n\n**쉽게 말하면**: 카카오 그룹의 기업용 업무 메신저·협업 플랫폼인 '카카오워크'(운영사 디케이테크인) 시스템이 외부 해커에게 뚫려, 이를 사내 업무용으로 쓰는 카카오엔터프라이즈 전·현직 임직원과 외부 협업 인원 등의 개인정보뿐 아니라 **업무용 이메일 본문·제목과 메시지 첨부파일 원본**까지 유출됐습니다. 그동안 회사 측이 \"자체 종단간 암호화(E3) 기술 덕분에 물리적 해킹이 일어나도 누구도 고객 데이터를 볼 수 없다\"고 강조해 왔음에도 실제 메일 본문과 첨부파일 원본이 노출되면서 기업 내부 기밀과 2차 침투 위험에 대한 우려가 커졌습니다.\n**먼저 할 일(초보용)**: 카카오워크 유출 통지를 받은 임직원·외부 협업자 및 메일 수신자는 감염되지 않은 안전한 기기에서 계정 비밀번호를 즉시 변경하고 기존 로그인 세션과 모바일 기기 연동을 모두 로그아웃(초기화)하세요. 특히 **유출된 업무 메일 본문이나 메신저 첨부파일 안에 사내 서버 접속 정보, API 키, 고객사 자료, 계약서 등이 들어 있었다면 계정 비밀번호만 바꿔서는 막을 수 없으므로** 해당 문서에 적혀 있던 모든 비밀키·접속 정보도 즉시 폐기·재발급하고, 실제 업무 대화를 인용한 정교한 사칭 메일(스피어 피싱)을 철저히 의심하세요.\n\n**개요**: 카카오엔터프라이즈와 카카오워크 서비스 제공사인 **디케이테크인**(카카오 그룹 자회사)은 2026년 11월 12~13일 공식 홈페이지 공지를 통해, 지난 **11월 9일** 디케이테크인의 카카오워크 시스템에 외부 공격자의 비정상적인 접근이 발생해 일부 이용자의 개인정보 및 업무 관련 정보가 유출됐다고 발표하고 개인정보보호위원회와 한국인터넷진흥원(KISA)에 신고했다(보안뉴스·매일경제·한겨레·지디넷코리아·더일렉 11/13 보도). 유출 대상은 카카오엔터프라이즈 전·현직 임직원, 회사 계정을 이용한 외부 인원, 일부 메일 수신자 등이며 개인별 유출 항목과 범위는 상이해 세부 규모를 조사 중이다(현재까지 이용자 비밀번호 유출은 확인되지 않았다고 공지). 그러나 확인된 유출 항목에는 △이름 △닉네임 △소속 부서 △휴대전화번호 △이메일 주소 같은 기본 인적사항을 넘어 **△업무용 메일 본문 및 제목 △메일 첨부파일명 △암호화된 메시지 △메시지 내 첨부파일명 및 첨부파일 원본**이 포함됐다. 디케이테크인은 그동안 카카오워크가 기업용 종단간 암호화 보안 시스템 **'E3(Enterprise Endpoint Encryption)'**를 갖춰 \"물리적 해킹에서도 정보 유출이 불가능하며 누구도 고객 데이터를 볼 수 없다\"고 홍보해 왔으나, 이번 사고로 메일 원문과 첨부파일 원본이 노출되면서 암호화 적용 범위와 키·저장소 분리 설계에 대한 지적이 제기됐다. 한편 같은 날(11/13) 국내 다른 협업 플랫폼인 **NHN두레이(Dooray)**에서도 새벽 시간대 외부 비인가 계정 접근 시도와 API 키 비정상 호출이 포착돼 회사 측이 기존 서비스·관리자 API 키를 전량 폐기하고 API 서비스를 일시 차단하는 등 국내 업무용 협업툴 전반에 비상이 걸렸다.\n\n**왜 일어났나**\n- 직접 원인 [확인 — 세부 침투 경로는 조사 중]: 디케이테크인이 운영하는 카카오워크 시스템에 외부 비정상 접근이 발생해 인적사항과 메일 본문·메시지 첨부파일 원본 등이 유출됐다(공식 공지 확인). 공격자가 운영자·관리자 계정을 탈취했는지, 웹·API 취약점을 악용했는지는 조사 중이어서 단정하지 않는다.\n- 구조적 원인 [추정 — 분석]: (1) 메신저 대화 텍스트에 종단간 암호화(E3)를 적용하더라도, 표준 이메일(SMTP/IMAP) 연동 데이터나 미리보기·검색 인덱싱·파일 다운로드 서버에 별도 보관되는 **'메일 본문'과 '첨부파일 원본'**은 서버 측에서 복호화 가능하거나 평문·일반 암호화로 저장되는 경우가 많아 공격자가 서버·스토리지 권한을 얻으면 그대로 노출된다 (2) 운영 주체 이관(카카오엔터프라이즈→디케이테크인)이나 다수 관계사 계정 연동 과정에서 레거시 계정·접근 경로 통제가 느슨해졌을 가능성이 있다(본 보고서의 분석).\n\n**침투 경로 [매핑 안 함 — 구체적 침투 경위 미공개]**: 외부 공격자의 비정상 접근으로 개인정보 및 메일 본문·첨부파일 원본이 유출된 사실은 확인됐으나, 최초 침투 수단과 내부 접근 과정이 아직 공개되지 않아 지침에 따라 ATT&CK 기법을 추측으로 매핑하지 않는다.\n\n**어떻게 조치하나** (본 보고서의 권고)\n- 즉시: (디케이테크인·카카오엔터프라이즈) 침해가 발생한 메일·파일 스토리지·인증 서버의 접근 로그와 메모리·디스크 포렌식 증거를 신속히 보존하고 비인가 외부 접근 경로를 차단한다. 침해된 서버나 관리자 단말에서 새 인증키·비밀번호를 발급하지 않는다.\n- 단기: 비밀번호 유출이 확인되지 않았더라도 이미 발급된 세션 토큰이나 API 키가 노출됐을 가능성과 **유출된 메일 본문·첨부파일 원본 안에 평문으로 적혀 있던 제3의 업무 자격 증명(클라우드 키, DB 비밀번호, VPN 계정, 임시 비밀번호 안내 메일 등)이 악용될 위험**이 가장 크다. 따라서 ① 전·현직 임직원 및 외부 협업 계정의 활성 웹·모바일 세션과 OAuth·API 연동 토큰을 일괄 무효화하고 안전한 환경에서 비밀번호를 재설정하며, ② 유출 기간 메일함과 메신저로 주고받은 첨부파일·본문 내 사내 시스템 접속 정보·API 키·인증서를 전수 조사해 즉시 폐기·교체한다. ③ 운영사(디케이테크인)는 침해된 서버 내 웹셸·비인가 관리자 계정 등 지속성 흔적을 전수 점검하고, 변조가 확인되면 단순 파일 삭제가 아니라 클린 이미지에서 시스템을 재구축한다.\n- 장기: '종단간 암호화(E3)'의 실제 보호 범위에서 제외되거나 서버가 복호화 키를 함께 쥐고 있는 영역(웹메일 본문, 첨부파일 오브젝트 스토리지, 백업본)을 재설계해, 스토리지 접근 권한만으로는 첨부파일 원본을 열람할 수 없도록 사용자별 키 분리 및 HSM/KMS 통제를 강화한다.\n- 탐지: 유출된 메일 제목·본문 맥락과 발신자·부서명을 그대로 인용해 기존 대화에 답장 형태로 끼어드는 **대화 하이재킹(Thread Hijacking) 스피어 피싱**과, 사내 시스템에 대한 비정상 로그인 시도를 집중 감시한다.\n\n**교훈**: \"메신저에 종단간 암호화가 적용돼 있으니 안전하다\"는 홍보 문구만 믿고 업무 메일과 메신저 첨부파일로 서버 비밀번호나 중요 기밀 파일을 주고받아서는 안 된다. 실제 해킹에서는 암호화된 채팅 문장 옆에 있는 **'메일 본문'과 '첨부파일 원본 저장소'**가 그대로 털릴 수 있으며, 메일함이 뚫리면 그 안에 들어 있던 모든 사내 열쇠가 함께 넘어간 것으로 보고 대응해야 한다.\n\n### [D20261114-moduchangup] 중기부 '모두의 창업' 2차 사업 참여 AI 기업 '아미쿠스렉스(로폼)' SQL 삽입·API 해킹 — 참가자 818명 포함 총 2만28명 개인정보 유출\n> 날짜: 해킹 발생 2026-11-11 05:38 · 기업 인지 08:30 · KISA 신고 15:45 · 중기부 통보 11-12 18:10 · 이용자 통지 및 중기부 발표 2026-11-13 · 유형: 정부 창업 지원 사업 참여 AI 공급사 관리자 페이지 SQL 삽입·취약 API 해킹 · 행위자: 미귀속 · 지역: 한국 · 근거: 확인(아미쿠스렉스 통지·KISA 신고 및 중소벤처기업부 공식 발표, 보안뉴스·데일리시큐·한겨레·조선일보 보도)\n\n**쉽게 말하면**: 중소벤처기업부와 창업진흥원이 추진하는 대국민 창업 지원 사업 '모두의 창업'에서, 참가자들에게 인공지능(AI) 법률문서 서비스를 제공하는 참여 기업 '아미쿠스렉스(서비스명 로폼)'가 해킹당해 총 2만28명(이 중 창업 사업 참가자 818명)의 이름·전화번호·이메일이 유출됐습니다. 지난 6월 '1차 모두의 창업' 사업에서 API 보안 허점으로 약 5,000명의 정보와 창업 아이디어가 유출된 뒤 정부가 \"보안성을 철저히 검증해 50개 AI 공급기업을 새로 뽑았다\"고 발표했지만, 불과 한 달 만에 또다시 관리자 페이지 SQL 삽입과 취약한 API 결함으로 뚫렸습니다.\n**먼저 할 일(초보용)**: 아미쿠스렉스(로폼) 이용자 및 '2차 모두의 창업' 참가자(818명)는 중기부·창업진흥원이나 AI 공급기업을 사칭해 \"지원금 정산·심사 서류 보완·피해 보상\" 명목으로 악성 링크 클릭이나 추가 정보를 요구하는 문자(스미싱)·이메일에 절대 속지 마세요. 해당 서비스에 쓰던 비밀번호와 같은 비밀번호를 사용하는 다른 사이트가 있다면 안전한 기기에서 비밀번호를 바꾸고 기존 로그인 세션을 초기화하세요.\n\n**개요**: 중소벤처기업부와 창업진흥원, 법률 AI 솔루션 '로폼(LawForm)' 운영사 **아미쿠스렉스**는 2026년 11월 13일, 아미쿠스렉스 자체 시스템이 외부 해킹 공격을 받아 총 **2만28명(사람 기준)**의 개인정보가 유출됐으며 이 가운데 **'2차 모두의 창업' 사업에 참여한 창업가 818명**의 정보가 포함됐다고 발표했다(보안뉴스·데일리시큐·한겨레·조선일보 보도). 유출된 항목은 **이름, 전화번호, 이메일 주소**다(창업 아이디어나 사업계획서, 비밀번호 유출은 현재까지 확인되지 않았다고 안내). 유출 신고서 및 보도에 따르면 공격은 **11월 11일 오전 5시 38분** 발생했으며, 아미쿠스렉스는 같은 날 오전 8시 30분 침해 정황을 인지해 오후 3시 45분 한국인터넷진흥원(KISA)에 신고했다. 공격자는 **관리자 페이지를 겨냥한 SQL 삽입(SQL Injection) 공격과 보안이 취약한 API**를 악용해 데이터를 탈취한 것으로 파악됐으며, 회사 측은 취약한 API 코드를 삭제하고 해외 IP 접속을 차단한 뒤 11월 13일 오후 3시 피해자들에게 개별 통지했다. 그러나 이번 사고는 지난 6~7월 '1차 모두의 창업' 당시 서버 API 보안 미흡으로 약 5,000명의 참가자 프로필·아이디어가 유출된 지 5개월 만에, 그리고 정부가 지난달 전문가 평가위원회를 통해 보안성을 검증해 50개 AI 솔루션 공급기업을 선발했다고 밝힌 지 불과 한 달 만에 재발한 것이어서 부실 검증 논란이 일었다. 또한 해킹 발생 후 약 60시간(KISA 신고 접수 후 49시간)이 지난 13일 오후 5시 8분에야 중기부 공식 발표가 이뤄져 늑장 대응 지적도 제기됐다.\n\n**왜 일어났나**\n- 직접 원인 [확인: KISA 신고 내역 보도 및 기업 발표]: 외부에 노출된 관리자 페이지 및 API에서 입력값 검증이 누락돼 SQL 삽입(SQL Injection)과 취약한 API 호출을 통한 회원 데이터베이스 무단 조회가 가능했다.\n- 구조적 원인 [추정 — 분석]: 정부 지원 사업 본체 플랫폼만 점검하고 실제 참가자 개인정보를 제3자 제공 형태로 넘겨받아 자체 운영하는 **'참여 민간 공급기업(50개사)'의 웹·API 및 관리자 페이지에 대해서는 서류 중심의 형식적 보안 심사**에 그쳤기 때문에, 가장 기본적인 SQL 삽입과 API 인가 결함이 걸러지지 않았다(본 보고서의 분석).\n\n**침투 경로 [확인 — KISA 신고 내역 보도 및 기업 발표 기준]**: 인터넷에 노출된 관리자 페이지 및 취약한 API를 대상으로 SQL 삽입(SQL Injection) 공격을 수행해 초기 침투 및 인증·권한 통제 우회(T1190, 확인) → 시스템 데이터베이스에서 '2차 모두의 창업' 참가자 818명을 포함한 전체 이용자 2만28명의 이름·전화번호·이메일 정보 조회·수집(T1213, 확인).\n\n**어떻게 조치하나** (본 보고서의 권고)\n- 즉시: (아미쿠스렉스) 웹·WAS·DB 쿼리 로그와 서버 포렌식 증거를 신속히 보존하고, 문제가 된 취약 API 제거 및 모든 데이터베이스 쿼리의 파라미터 바인딩(Prepared Statement) 적용 여부를 전수 점검한다. 침해된 서버에서 새 자격 증명을 발급하지 않는다.\n- 단기: 관리자 페이지가 SQL 삽입으로 뚫렸다면 단순 회원 명단뿐 아니라 **관리자 계정 해시, DB 접속 정보, AI 모델 연동 API 키, 법률문서 템플릿·작성 데이터**에 대한 추가 쿼리가 실행됐을 가능성을 배제할 수 없다. 따라서 비밀번호·아이디어 유출이 미확인이라는 초기 결과에만 의존하지 말고, 안전한 환경에서 **관리자·DB 비밀번호와 클라우드·AI API 키를 전면 교체하고 전체 이용자·관리자의 기존 로그인 세션·토큰을 일괄 무효화**한다. 서버 내 웹셸 등 지속성 흔적을 점검한다.\n- 장기: (중기부·창업진흥원) '모두의 창업'에 참여하는 50개 AI 솔루션 공급기업 전체를 대상으로 서류 점검이 아닌 **실제 외부 노출 관리자 페이지 비노출 여부, API 인가 검증, 모의해킹(취약점 스캔)**을 즉시 실시하고, 침해 인지 시 주관기관 즉시 통보 SLA를 의무화한다.\n- 탐지: 관리자 경로(`/admin` 등)에 대한 외부 접근 시도, SQL 메타문자(`'`, `UNION`, `SELECT`, `SLEEP` 등)가 포함된 API 요청, 대량 회원 레코드 반환 트래픽을 WAF와 DB 감사 로그에서 실시간 차단·경보한다.\n\n**교훈**: 정부 본체 사이트를 아무리 고쳐도, 참가자 정보를 넘겨받는 수십 개 민간 협력사(공급망) 중 단 한 곳의 관리자 페이지에 기초적인 SQL 삽입 구멍이 열려 있으면 참가자 정보는 똑같이 유출된다. 같은 사업에서 1차(API 크롤링)와 2차(협력사 API·SQL 삽입) 사고가 연달아 터진 것은 '위탁·참여 기업까지 포함한 실질적 기술 검증'이 빠진 보안 대책의 한계를 보여준다.\n\n### [D20261114-checkpoint-kev] Check Point Gaia OS `DynamicCLI` 로컬 권한 상승 제로데이(CVE-2026-123039) CISA KEV 긴급 등재 — PHP2Shell 연쇄 악용해 루트 장악·백도어(`TSGA`) 및 ESXi 와이퍼(`destroy_v6`) 유포\n> 날짜: Check Point 보안 권고(`sk1000362`)·CVE 공개 2026-11-12 · CISA KEV 등재 2026-11-13(연방기관 패치 기한 11-16) · 유형: 방화벽·보안 게이트웨이 로컬 소켓 인증 누락 권한 상승 제로데이(실제 악용·와이퍼 공격 체인 확인) · 행위자: 미귀속(일부 파괴형·첩보 캠페인에서 악용 관측) · 지역: 전 세계(해외) · 근거: 확인(Check Point sk1000362·CISA KEV·MITRE CVE·Aviatrix 확인)\n\n**쉽게 말하면**: 전 세계 기업과 기관이 네트워크 대문(방화벽·VPN)으로 쓰는 '체크포인트(Check Point)' 보안 장비의 운영체제(Gaia OS)에서, 장비 안에 일단 발을 들인 해커가 단숨에 최고 관리자 권한(`root`)을 빼앗을 수 있는 치명적 제로데이 결함(CVE-2026-123039)이 실제 해킹에 악용돼 미국 CISA가 긴급 경보(KEV, 기한 11월 16일)를 발령했습니다. 해커들은 지난번 공개된 PHP 결함('PHP2Shell')으로 체크포인트 장비에 먼저 침투한 뒤, 이 제로데이를 연달아 써서 장비 전체를 완전히 장악하고 백도어(`TSGA`)를 심었을 뿐 아니라, 내부 가상 서버(VMware ESXi)로 넘어가 데이터를 통째로 지워버리는 파괴형 악성코드(와이퍼 `destroy_v6`)까지 실행했습니다.\n**먼저 할 일(초보용)**: Check Point 방화벽·보안 게이트웨이·관리 서버(R80.30~R82.20 계열)를 운영하는 조직은 가능한 범위에서 포렌식 증거를 신속히 보존한 뒤 제조사의 긴급 핫픽스(`sk1000362` — 당시 기준)를 **11월 16일까지 즉시 적용**하세요(당장 패치가 어렵다면 임시 조치로 `dynamic_server` 프로세스를 중지하고 자동 재시작을 끄세요). 이미 공격에 악용된 장비는 패치만 해도 심어진 백도어(`TSGA`/`TSProxy`)가 사라지지 않으므로, `/tmp/dynamic_socket` 악용 흔적과 내부 ESXi 하이퍼바이저로의 비정상 SSH 접속을 점검하고 안전한 환경에서 모든 관리자·VPN·ESXi 자격 증명과 세션을 교체하세요.\n\n**개요**: 미국 CISA는 2026-11-13(현지시간) **Check Point**의 다수 핵심 보안 제품(Quantum Security Gateway, Security Management Server, Multi-Domain Security Management Server, Scalable Platforms 등 R80.30~R82.20)에 영향을 미치는 로컬 권한 상승(LPE) 취약점 **CVE-2026-123039**(CVSS 7.8, CWE-732·CWE-862)를 실제 악용 확인 취약점 목록(KEV)에 긴급 등재하고, 미국 연방기관에 **포렌식 트리아지 수행 및 3일 이내(2026-11-16까지) 패치 완료**를 명령했다(Check Point 보안 권고 `sk1000362`, MITRE CVE 공식 레코드, Aviatrix·SecurityWeek·BleepingComputer 확인).\n- **취약점 메커니즘 [확인: Check Point, MITRE CVE]**: Gaia OS의 `DynamicCLI` 데몬(`dynamic_server`)은 최고 권한인 `root`로 실행되면서, 로컬 제어용 유닉스 도메인 소켓인 **`/tmp/dynamic_socket`을 모든 로컬 사용자가 쓸 수 있는 권한(world-writable)으로 열어 두고 접속하는 로컬 프로세스를 전혀 인증하지 않았다**. 그 결과 장비 내에서 낮은 권한만 확보한 공격자라도 이 소켓에 명령을 보내면 아무 검증 없이 `root` 권한으로 즉시 실행된다.\n- **실제 공격 체인 및 와이퍼 파괴 [확인: Check Point, Aviatrix]**: 실제 관측된 공격 캠페인에서 위협 행위자들은 인터넷에 노출된 Check Point Security Gateway(특히 Mobile Access 포털)를 상대로 먼저 PHP 비인증 원격 코드 실행 취약점인 **PHP2Shell(`CVE-2026-109618`·`109619`, [D20261022-php2shell](2026-10-22.md))**을 악용해 침투하고 낮은 권한의 PHP 웹셸을 배포했다. 이어 본 제로데이(**CVE-2026-123039**)를 연쇄 실행해 `/tmp/dynamic_socket`을 통해 단숨에 `root` 권한을 획득했다. `root`를 장악한 공격자는 PhiliKit 악성코드 프레임워크 변종인 지속성 백도어 **`TSGA`**와 그 안에 내장된 네트워크 중계 도구 **`TSProxy`**를 설치해 은밀한 내부망 진입로를 확보했으며, 일부 파괴적 공격 물결에서는 침해된 Check Point 게이트웨이에서 SSH를 통해 내부 **VMware ESXi 하이퍼바이저**로 횡적 이동한 뒤 파괴형 와이퍼 악성코드 **`destroy_v6`**를 실행해 가상화 스토리지를 재귀적으로 삭제·초토화했다(앞서 10월 말 `[D20261029-php2shellroot]`에서는 PHP2Shell과 리눅스 커널 결함 Fragnesia `CVE-2026-46300`의 결합이 확인됐는데, 이번에는 Check Point 자체 데몬 결함 `CVE-2026-123039`와의 결합 및 ESXi 와이퍼 파괴 체인이 추가로 규명됐다).\n\n**왜 일어났나**\n- 직접 원인 [확인: Check Point, CISA]: `root`로 동작하는 Gaia OS `DynamicCLI` 데몬(`dynamic_server`)이 `/tmp/dynamic_socket`에 잘못된 파일 권한(world-writable, CWE-732)을 부여하고 소켓 연결 주체에 대한 인가·인증 검사(CWE-862)를 누락했다.\n- 구조적 원인 [추정 — 분석]: (1) 방화벽·보안 게이트웨이 제조사들이 \"장비 외부 경계만 막으면 내부 프로세스 간 통신(IPC·로컬 소켓)은 안전할 것\"이라는 낡은 가정 아래 내부 데몬 소켓을 인증 없이 열어 두는 관행이, 웹 포털 RCE(PHP2Shell) 한 방에 곧바로 장비 전체 루트 장악으로 이어지는 치명적 약점이 됐다 (2) 네트워크 경계 장비가 내부 하이퍼바이저(ESXi) 관리망으로 향하는 SSH 통신까지 허용돼 있어 방화벽 함락이 곧바로 전사 가상화 인프라 파괴(와이퍼)로 번졌다(본 보고서의 분석).\n\n**침투 경로 [확인 — Check Point·CISA KEV·Aviatrix 분석 기준]**: 노출된 Check Point Security Gateway(Mobile Access 포털 등)에 PHP2Shell(`CVE-2026-109618`·`109619`)을 악용해 비인증 초기 침투(T1190, 확인) → 낮은 권한의 웹 컨텍스트에서 `/tmp/dynamic_socket`에 명령을 보내 `CVE-2026-123039`를 악용, `root` 권한으로 상승(T1068, 확인) → 게이트웨이에 PHP 웹셸 및 지속성 백도어 `TSGA` 설치(T1505.003, 확인) → `TSGA` 내장 `TSProxy` 컴포넌트로 내부망 중계(프록시) 통로 구축(T1090, 확인) → 침해된 게이트웨이에서 SSH를 이용해 내부 VMware ESXi 하이퍼바이저로 횡적 이동(T1021.004, 확인) → ESXi 호스트에서 `destroy_v6` 와이퍼를 실행해 가상화 스토리지 데이터 재귀 삭제(T1485, 확인).\n\n**어떻게 조치하나** (벤더·CISA 권고 및 본 보고서 권고)\n- 즉시: CISA BOD 26-04 포렌식 트리아지 지침에 따라 패치 전 장비의 메모리·로그·파일 시스템 증거를 신속히 수집·보존한 뒤, Check Point `sk1000362`에 명시된 버전별 긴급 핫픽스(R82.20 Jumbo Hotfix Take 10 초과, R82.10 Take 50 초과, R82 Take 130 초과, R81.20 Take 173 초과 등 최신 보안 업데이트 — 당시 기준)와 PHP2Shell 패치를 **즉시(KEV 기한 11월 16일)** 적용한다. 당장 패치가 불가능한 환경에서는 임시 완화책으로 `dynamic_server` 프로세스를 수동 중지하고 자동 재시작 설정을 비활성화한다. 침해가 의심되는 장비에서 새 비밀을 발급하지 않는다.\n- 단기: **패치나 프로세스 중지만으로는 이미 심어진 웹셸·`TSGA`/`TSProxy` 백도어나 탈취된 자격 증명이 제거되지 않는다.** ① 장비 내 비정상 PHP 웹셸, `TSGA`·`TSProxy` 바이너리, 비인가 cron·서비스 변조 여부를 전수 조사하고, 침해 흔적이 하나라도 발견되면 단순 파일 삭제가 아니라 **장비를 클린 이미지에서 완전히 재구축**한다. ② 게이트웨이에 저장돼 있던 모든 로컬·도메인 관리자 비밀번호, VPN 인증서·사전 공유키(PSK), RADIUS/LDAP 연동 비밀키, 그리고 게이트웨이에서 접근 가능했던 **내부 VMware ESXi 호스트의 root 비밀번호·SSH 키·활성 세션**을 안전한 별도 환경에서 전면 폐기·재발급한다.\n- 장기: 보안 게이트웨이의 Mobile Access·관리 포털 외부 노출을 최소화하고, 방화벽 장비 자체에서 내부 하이퍼바이저(ESXi)·백업 서버 관리 인터페이스로 직접 SSH 접속이 되지 않도록 관리망을 엄격히 분리(Out-of-Band 관리)하며, 오프라인·불변 백업을 유지해 와이퍼 공격에 대비한다.\n- 탐지: 게이트웨이 내 웹서버 프로세스(`httpd` 등)의 `/tmp/dynamic_socket` 접근 시도, 게이트웨이 자체가 출발지가 되어 내부망(특히 ESXi 22번 포트)으로 향하는 비정상 SSH 연결 및 대량 디스크 삭제 명령을 즉시 경보·차단한다.\n\n**교훈**: 이번 사건은 \"웹셸(PHP2Shell)만 막으면 된다\"거나 \"방화벽은 우리를 지켜주는 장비다\"라는 인식이 얼마나 위험한지 보여준다. 방화벽 내부의 허술한 로컬 소켓(`/tmp/dynamic_socket`) 하나가 웹셸을 루트 권한의 괴물로 키워냈고, 방화벽이 해커의 내부망 공격 거점(프록시)이 되어 가상 서버 전체를 지워버리는 와이퍼 공격의 발판으로 쓰였다.\n\n### [D20261114-unrealircd-kev] UnrealIRCd `labeled-response` 모듈 서버 간 명령 주입 취약점(CVE-2026-114713) 실제 악용 및 CISA KEV 등재\n> 날짜: 벤더 패치(`6.2.7.1`·핫패치) 및 CVE 공개 2026-11-07~08 · CISA KEV 등재 2026-11-13(연방기관 패치 기한 11-16) · 유형: IRC 서버 구분자 무력화 미흡을 통한 최고 서버 권한 명령 주입(실제 악용 확인) · 행위자: 미귀속 · 지역: 전 세계(해외) · 근거: 확인(UnrealIRCd 공식 보안 권고·CISA KEV·MITRE CVE 확인)\n\n**쉽게 말하면**: 전 세계 오픈소스 커뮤니티와 기업·기관 내부 채팅망에서 널리 쓰이는 대표 IRC 채팅 서버 프로그램 '언리얼아이알씨디(UnrealIRCd)'에서, 아무 권한 없는 일반 접속자가 채팅 메시지 꼬리표(`label`)에 특수 문자를 섞어 보내는 것만으로 **서버 전체의 최고 권한 명령을 마음대로 내릴 수 있는 치명적 결함(CVE-2026-114713)**이 실제 해킹에 악용돼 미국 CISA가 긴급 패치 명령(KEV, 기한 11월 16일)을 내렸습니다. 서버가 2대 이상 연결된 채팅망에서 이 공격이 성공하면, 해커가 관리자나 전체 이용자를 네트워크에서 강제로 쫓아내거나(`KILL`·`GLINE`) 채팅망 전체의 제어권을 빼앗을 수 있습니다.\n**먼저 할 일(초보용)**: UnrealIRCd(6.0.0~6.2.7 버전)를 운영하는 관리자는 서버를 재시작하지 않고도 즉시 고칠 수 있는 무중단 핫패치 명령(`./unrealircd hot-patch bundle-20261107`)을 실행하거나 **6.2.7.1 이상**(당시 기준)으로 즉시 업그레이드하세요(기한 11월 16일). 당장 패치가 어렵다면 설정 파일에 `blacklist-module \"labeled-response\";`를 추가하거나 스팸필터 차단 규칙을 적용하고, 이미 비정상 서버 명령이 실행된 흔적이 있다면 패치 후 운영자(IRCOp) 비밀번호와 서버 간 연동 비밀번호(Link block password)를 안전한 기기에서 교체하세요.\n\n**개요**: 오픈소스 IRC 데몬 프로젝트인 **UnrealIRCd**는 지난 2026-11-07~08 보안 권고 및 버전 **6.2.7.1**을 공개해 **CVE-2026-114713**(CVSS 8.6, CWE-140 구분자 무력화 미흡)을 포함한 보안 취약점들을 수정했으며, 미국 CISA는 이 취약점이 실제 야생에서 악용(actively exploited)되고 있음을 확인해 2026-11-13 KEV 카탈로그에 등재했다(기한 2026-11-16, UnrealIRCd 공지·MITRE CVE·CISA KEV 확인). 결함은 UnrealIRCd 6.0.0부터 6.2.7까지의 IRCv3 `labeled-response` 모듈(`src/modules/labeled-response.c`의 `labeled_response_mtag_is_ok()` 함수)에 존재한다. 이 모듈은 클라이언트가 보낸 IRCv3 `label` 메시지 태그를 응답 메시지에 그대로 되돌려(echo) 주는데, 이때 줄바꿈·공백·세미콜론 같은 구분자(delimiter)를 제대로 검증·이스케이프하지 않았다. 그 결과 **2대 이상의 서버가 서로 연결(linked)된 IRC 네트워크**에서 권한이 전혀 없는 일반 사용자라도 조작된 `label` 태그를 보내 **서버 간(server-to-server) 프로토콜 명령을 몰래 주입**할 수 있으며, 상대 서버는 이를 일반 사용자의 채팅이 아니라 **연결된 신뢰 서버가 내린 최고 권한 명령(server authority)**으로 오인해 그대로 실행한다. 실제 악용 시 공격자는 전체 네트워크에서 정상 운영자와 사용자를 영구 추방(`GLINE`)하거나 연결을 강제 종료(`KILL`)하고 채널·권한 상태를 임의로 조작할 수 있다.\n\n**왜 일어났나**\n- 직접 원인 [확인: UnrealIRCd, MITRE CVE]: `labeled-response` 모듈의 `labeled_response_mtag_is_ok()`가 클라이언트가 입력한 `label` 태그의 구분자를 이스케이프하지 않은 채 서버 간 통신 스트림에 그대로 반영(echo)해 명령 주입(CWE-140)을 허용했다.\n- 구조적 원인 [추정 — 분석]: 분산 IRC 네트워크는 연결된 서버끼리의 통신(Server-to-Server 프로토콜)을 전적으로 신뢰하는 구조여서, 클라이언트 입력 태그가 구분자 검증 없이 서버 간 프로토콜 줄(line)로 넘어가는 순간 일반 사용자 입력이 곧바로 최고 서버 권한 명령으로 둔갑한다(본 보고서의 분석).\n\n**침투 경로 [확인 — UnrealIRCd 권고·CISA KEV 기준]**: 2대 이상 연결된 외부 노출 UnrealIRCd 서버에 접속한 뒤 IRCv3 `labeled-response` 모듈의 구분자 처리 결함(`CVE-2026-114713`)을 악용해 최고 서버 권한의 서버 간 명령을 주입·실행(T1190, 확인).\n\n**어떻게 조치하나** (벤더·CISA 권고 및 본 보고서 권고)\n- 즉시: 서버 로그와 네트워크 트래픽 기록을 신속히 보존한 뒤, **UnrealIRCd 6.2.7.1 이상**(당시 기준)으로 업그레이드하거나 유닉스·리눅스 환경(6.0.0~6.2.7)에서는 서비스 중단 없이 즉시 적용되는 공식 핫패치 명령(`./unrealircd hot-patch bundle-20261107`)을 실행한다(KEV 기한 11월 16일). 즉시 패치가 불가능할 경우 모든 연결 서버의 설정 파일에 `blacklist-module \"labeled-response\";`를 추가해 해당 모듈을 비활성화하거나, IRCOp 권한으로 임시 정규식 차단 필터(`/SPAMFILTER add -regex T block - Invalid_label ^label=(?![^\\r\\n;\\x20]*\\z)`)를 즉시 등록한다(지원 종료된 UnrealIRCd 5 계열도 모듈 블랙리스트 후 재시작 필요).\n- 단기: 패치 전 이미 공격자가 서버 간 명령을 주입해 비인가 네트워크 영구 차단(`GLINE`/`KLINE`), 채널 관리자 권한 탈취, 또는 숨겨진 운영자 상태 부여를 수행했는지 서버 로그를 전수 점검한다. 침해 정황이 있으면 비정상 `GLINE`·권한 설정을 초기화하고, 안전한 환경에서 IRCOp 운영자 비밀번호·인증서 및 서버 간 링크 인증 비밀번호를 재발급한다.\n- 장기: 외부에 노출된 채팅·협업 데몬에서 기본 활성화된 확장 모듈 중 불필요한 모듈을 최소화하고, 무중단 핫패치 체계를 정기 점검 절차에 반영한다.\n- 탐지: 클라이언트 메시지 태그(`@label=...`) 내에 비정상적인 공백·세미콜론·개행 문자나 서버 전용 명령어(`GLINE`, `KILL`, `SVSKILL`, `SVS2MODE` 등)가 포함된 패킷과, 운영자 로그인 없이 발생한 서버 권한 명령 실행 로그를 감시한다.\n\n**교훈**: 텍스트 기반 프로토콜(IRC, HTTP 헤더 등)에서 줄바꿈이나 구분자 하나를 제대로 걸러내지 않는 사소해 보이는 실수(CWE-140)가, 서버끼리 주고받는 신뢰 통신망과 만나는 순간 아무 권한 없는 방문자에게 서버 전체의 지휘봉을 넘겨주는 치명적 결과로 이어진다.\n\n### [D20261114-barracuda-cloud] 바라쿠다(Barracuda) 내부 클라우드 침해 — 폐기 안 한 협력사 키와 AI 도구('ARTEX' 추정)로 고객 XDR 연동 자격 증명 저장소 접근\n> 날짜: 외부 협력사 개발 환경 침해 2026-10(추정) · 바라쿠다 클라우드 비인가 접근 2026-11-01~02(약 44시간) · 공식 공지·개별 통지 2026-11-10~11 · 보도 2026-11-12~13 · 유형: 보안 벤더 내부 클라우드 방치 자격 증명 악용 및 고객 보안 관제(XDR) 연동 키 저장소 노출 우려 · 행위자: 미귀속(AI 침투 도구 'ARTEX'와 일치하는 동작 관측) · 지역: 전 세계(해외) · 근거: 확인(Barracuda 공식 보안 공지, 데일리시큐 보도) / 추정(협력사 개발 환경 침해 경위 및 AI 도구 'ARTEX' 동작 일치 분석)\n\n**쉽게 말하면**: 글로벌 보안 기업 '바라쿠다(Barracuda)'가 과거 외부 협력사와 프로젝트를 끝내고도 지우지 않고 방치해 둔 클라우드 접속 열쇠(키) 때문에 내부 클라우드가 해킹당했습니다. 지난 10월 그 협력사의 개발 환경이 뚫렸을 때 이 열쇠를 손에 넣은 공격자는, AI 자동 해킹 도구('아르텍스 ARTEX'로 추정)를 써서 44시간 동안 바라쿠다 클라우드 계정 10여 개를 휘젓고 다니며 **고객사들의 마이크로소프트 365·구글 워크스페이스·보안 프로그램 연동 열쇠가 보관된 저장 시스템**에까지 접근했습니다.\n**먼저 할 일(초보용)**: 바라쿠다의 보안 관제 서비스(Managed XDR Cloud 또는 Monitored Endpoint)를 API로 연동해 쓰면서 개별 통지를 받은 기업은, \"고객 열쇠를 실제로 꺼내 갔다는 직접 증거는 없다\"는 설명에만 안심하지 말고 감염되지 않은 안전한 기기에서 **바라쿠다와 연결된 Microsoft 365·Google Workspace·엔드포인트 보안 제품의 API 키와 OAuth 토큰을 즉시 폐기하고 새로 발급**하세요. 아울러 11월 1일 이후 해당 클라우드 계정에서 수상한 로그인이나 데이터 조회 기록이 없는지 감사 로그를 반드시 확인하세요.\n\n**개요**: 보안 기업 **바라쿠다 네트웍스(Barracuda Networks)**는 2026-11-10~11 공식 보안 공지 및 후속 분석 보고서를 통해, 자사 내부 클라우드 환경이 침해돼 고객 시스템과 바라쿠다 보안 서비스를 연결하는 **자격 증명 저장 시스템(credential storage system)**에 공격자가 접근한 사실을 확인하고 노출 가능성이 있는 고객들에게 개별 통지했다고 밝혔다(데일리시큐 11/13 보도, 전체 영향 고객 수는 미공개).\n- **침해 경위 및 원인 [확인 및 추정: Barracuda]**: 바라쿠다는 과거 프로젝트를 위해 외부 협력사(third-party contractor)에 클라우드 접근 키를 발급했는데, **프로젝트가 끝난 뒤에도 이 키를 폐기하지 않고 유효한 상태로 방치**했다. 지난 2026년 10월 해당 협력사의 개발 환경이 침해됐을 때 공격자가 이 키를 확보한 것으로 분석됐다. 공격자는 이 키를 이용해 **11월 1일부터 2일까지 약 44시간 동안** 바라쿠다 내부 클라우드 계정 약 10개에 접근했다. 바라쿠다는 공격자의 행동 패턴이 자율형 AI 기반 보안 테스트 도구인 **'아르텍스(ARTEX)'**의 동작 방식과 일치한다고 분석했다(단, AI 도구 동작 일치만으로 특정 공격 조직을 확정할 수는 없다).\n- **노출 범위**: 공격자가 접근한 저장 시스템에는 바라쿠다의 확장 탐지·대응(XDR) 서비스인 **Managed XDR Cloud** 및 **Monitored Endpoint**가 고객사의 **Microsoft 365, Google Workspace, 단말(엔드포인트) 보안 제품**에서 보안 데이터를 수집할 때 사용하는 API 키와 토큰이 보관돼 있었다. 바라쿠다는 공격자가 해당 저장 시스템에 접근한 사실은 확인했으나 고객 연동 자격 증명 자체를 열람하거나 외부로 반출했다는 직접적인 증거는 발견하지 못했다고 설명하면서, 예방 차원에서 통지 대상 고객에게 연동 자격 증명을 모두 폐기·재발급하고 11월 1일 이후 접속 기록을 점검하도록 권고했다.\n\n**왜 일어났나**\n- 직접 원인 [확인: Barracuda]: 외부 협력사 프로젝트 종료 후에도 회수·폐기하지 않고 남겨 둔 장기 클라우드 접근 키가 협력사 개발 환경 침해를 통해 탈취·악용됐다.\n- 구조적 원인 [추정 — 분석]: (1) 고객사의 M365·구글 워크스페이스·EDR 로그를 24시간 들여다보는 보안 관제(XDR) 벤더는 사실상 고객사 클라우드의 '마스터 조회 열쇠'를 한곳에 모아 둔 금고와 같아서, 벤더 내부 클라우드 하나가 뚫리면 하위 고객사 전체로 위험이 전이된다 (2) 계약 종료 후 서드파티 키 미회수는 작년 쿠팡 퇴사자 키(`INC-2025-11-coupang`)나 오늘 함께 다룬 Qubole 사태(`D20261114-qubole-expedia`)와 똑같은 '비인간 자격 증명(NHI) 수명주기 관리 실패'다(본 보고서의 분석).\n\n**침투 경로 [확인 및 추정 — Barracuda 공식 발표 기준]**: 지난 10월 외부 협력사 개발 환경 침해를 통해 프로젝트 종료 후 폐기되지 않은 바라쿠다 클라우드 접근 키 확보(T1199, 추정 — 바라쿠다 분석상 연결) → 탈취한 유효 클라우드 접근 키로 바라쿠다 내부 클라우드 계정 약 10개 및 고객 XDR 연동 자격 증명 저장 시스템에 약 44시간 동안 접근(T1078.004, 확인). 고객 자격 증명 실제 반출 여부는 직접 증거 미발견으로 매핑하지 않는다.\n\n**어떻게 조치하나** (벤더 권고 및 본 보고서 권고)\n- 즉시: 바라쿠다 Managed XDR Cloud·Monitored Endpoint를 사용하는 조직은 11월 1일 이후 자사 Microsoft 365(Entra ID), Google Workspace, 엔드포인트 보안 콘솔에서 바라쿠다 연동 계정이 수행한 API 호출·비정상 조회 로그를 신속히 보존·점검한다. 침해가 의심되는 환경에서 새 비밀을 발급하지 않는다.\n- 단기: \"직접 반출 증거를 찾지 못했다\"는 것은 \"로그상 반출 흔적이 안 남았거나 못 찾았다\"는 뜻일 수 있으므로, 통지받은 고객사는 물론 해당 기간 연동 서비스를 사용한 조직은 안전한 환경에서 **바라쿠다 XDR에 연결된 모든 API 키, OAuth 토큰, 서비스 주체(Service Principal) 비밀값을 즉시 폐기(revoke)하고 새로 발급**한다.\n- 장기: 외부 보안 관제(XDR·SIEM) 벤더에 클라우드 연동을 허용할 때는 읽기 전용 최소 권한만 부여하고, 가능하면 벤더의 고정 IP 대역에서만 API 토큰 사용을 허용(조건부 접근·IP 제한)하며, 사내외 협력사 프로젝트용 클라우드 키에는 생성 시점부터 만료일(TTL)을 강제 설정한다.\n- 탐지: 보안 관제 연동용 서비스 계정이 평소 수집하던 보안 로그 외에 이메일 본문, 드라이브 문서, 디렉터리 전체 계정 속성을 조회하거나 비정상 IP에서 토큰을 사용하는 행위를 즉시 경보한다.\n\n**교훈**: 지난 11일 바라쿠다 이메일 보안 장비 제로데이 악용(`D20261111-barracuda`)에 이어 이번에는 바라쿠다 자체 클라우드가 '프로젝트 끝나고 안 지운 협력사 열쇠' 때문에 뚫렸다. 더구나 공격자가 자율형 AI 도구(ARTEX 추정)를 써서 44시간 만에 클라우드 계정 10개를 훑고 고객 키 저장소까지 도달했다는 점은, 방치된 열쇠 하나가 AI 자동화 공격을 만나면 수십 시간 안에 핵심 금고까지 털릴 수 있음을 경고한다.\n\n### [D20261114-qubole-expedia] 빅데이터 플랫폼 Qubole의 AWS 교차 계정 IAM 역할('방치된 연동') 악용 공급망 침해 — 다수 기업 데이터 유출 및 익스피디아(Expedia) 10억 건 협박 파장\n> 날짜: AWS 교차 계정 공격 관측 2026-10-14~26 · 보안 연구진(Sentra·Wiz·Mandiant) 공개 2026-11 초~중순 · 갈취 그룹 `n0n`의 익스피디아 협박 게시 2026-11-09(보도 11-12~13) · 유형: 서드파티 클라우드 빅데이터 플랫폼 AWS 자격 증명 탈취 및 고객사 미삭제 교차 계정 IAM 역할(`AssumeRole`) 연쇄 침해 · 행위자: `n0n`(`N0N`, 러시아 연루 추정 신생 협박 그룹 — 익스피디아 협박 주체) · 지역: 전 세계(해외) · 근거: 확인(Sentra·Wiz·Mandiant 분석 및 Expedia 서드파티 침해 확인) / 주장(`n0n`의 익스피디아 약 10억 건 유출 주장)\n\n**쉽게 말하면**: 기업들이 클라우드 데이터를 분석하려고 썼던 빅데이터 플랫폼 '큐볼(Qubole)'의 아마존 클라우드(AWS) 열쇠가 해커에게 털리면서, 큐볼이 고객사 클라우드에 들어올 수 있게 열어 두었던 **'교차 계정 통로(IAM 역할)'**를 타고 10여 개가 넘는 기업들의 AWS가 연쇄적으로 뚫렸습니다. 특히 **이미 몇 년 전에 큐볼 서비스를 해지하고 안 쓰던 기업들조차 과거에 만들어 둔 통로(IAM 역할)를 지우지 않고 방치했다가** 그대로 털렸으며, 글로벌 여행 플랫폼 '익스피디아(Expedia)'도 서드파티 데이터 플랫폼 통로가 악용된 침해를 조사 중인 가운데 해커(`n0n`)는 다크웹에서 약 10억 건의 여행자·로열티 기록을 훔쳤다고 협박하고 있습니다(10억 건 수치는 해커의 일방 주장).\n**먼저 할 일(초보용)**: AWS 클라우드를 사용하는 모든 기업은 지금 즉시 AWS IAM 콘솔에서 외부 업체(특히 **Qubole**을 비롯해 이미 해지했거나 현재 쓰지 않는 SaaS·분석 업체)에 `AssumeRole` 권한을 허용해 둔 **교차 계정 IAM 역할(Cross-account IAM Role)을 전수 검색해 즉시 삭제**하세요. 만약 10월 14일 이후 외부 계정이 해당 역할을 빌려 쓴(`AssumeRole`) 기록이 AWS CloudTrail에 남아 있다면, 역할만 지워서는 안 되며 안전한 기기에서 S3·Systems Manager(SSM) 등에 보관됐던 모든 비밀키·토큰·자격 증명을 전면 폐기·재발급하세요.\n\n**개요**: 클라우드 보안 기업 Sentra, Wiz, Mandiant 등의 위협 분석과 2026-11-12~13 주요 외신(Forbes, SecurityWeek, SC Media 등) 보도에 따르면, 지난 10월 중순~하순(10월 14일~26일) 클라우드 빅데이터 분석 플랫폼 **Qubole**과 연관된 AWS IAM 자격 증명이 공격자에게 침해돼 다수의 고객 기업 AWS 환경이 연쇄 침투당하는 공급망 공격이 발생했다.\n- **'잊힌 연동 문(Dormant Cross-Account IAM Role)' 악용 메커니즘 [확인: Sentra, Wiz, Mandiant]**: 기업들이 외부 SaaS(Qubole 등)에 자사 AWS 데이터 분석을 맡길 때는 보통 외부 업체의 AWS 계정이 고객사 AWS 내부 역할을 수임(`sts:AssumeRole`)할 수 있도록 **교차 계정 IAM 역할(Cross-account IAM Role)**을 설정한다. 공격자는 탈취한 Qubole 측 AWS 자격 증명을 이용해, 고객 기업들이 설정해 둔 이 교차 계정 역할들을 차례로 수임하며 10여 곳 이상의 기업 AWS 환경 내부로 합법적인 권한을 가진 것처럼 걸어 들어갔다. 충격적인 점은 피해 기업 상당수가 **이미 오래전에 Qubole 사용을 중단했음에도 AWS 계정 안에 옛날 교차 계정 IAM 역할을 지우지 않고 방치(dormant/forgotten)**해 두었다가 공격당했다는 사실이다. 내부로 진입한 공격자는 클라우드 리소스를 정찰하고 AWS 스토리지(S3)와 AWS Systems Manager(SSM) 파라미터 스토어 등에서 비밀정보(시크릿)를 수확해 데이터를 외부로 빼돌렸다.\n- **익스피디아(Expedia) 협박 파장 [기업 일부 확인 / 세부 규모는 공격자 주장]**: 이어 11월 9일 러시아 연루로 추정되는 신생 사이버 갈취 그룹 **`n0n`(`N0N`)**이 다크웹 유출 사이트에 글로벌 온라인 여행 기업 **익스피디아 그룹(Expedia Group)**을 올리고 카운트다운 타이머로 몸값을 압박했다. `n0n`은 로열티 프로그램 레코드 약 8억3,000만 건, 여행자 프로필 5,800만 건, 계정·자격 증명 레코드 3억3,300만 건 및 예약 기록(Vrbo 포함) 등 총 **약 10억 건(레코드 기준)**을 탈취했다고 주장했다(**[주장]** — 공개된 증거가 제한적이며 독립 검증 없음). 이에 대해 익스피디아는 핵심 플랫폼은 안전하다고 밝히면서도, **\"공격자가 서드파티 데이터 플랫폼 제공업체를 침해해 그 신뢰 접근(trusted access)을 악용함으로써 익스피디아를 포함한 복수 기업의 시스템에 도달했다\"**고 공식 인정하고 조사를 진행 중이다(보안 업계는 이 서드파티 데이터 플랫폼 경로를 Qubole 캠페인과 연관 지어 분석하고 있으나 양자 간 100% 동일 여부는 추가 조사 중이다).\n\n**왜 일어났나**\n- 직접 원인 [확인: Sentra·Wiz·Mandiant(Qubole 캠페인), Expedia(서드파티 데이터 플랫폼 침해)]: (1) 서드파티 빅데이터·데이터 플랫폼(Qubole 등)의 클라우드 자격 증명 침해 (2) 고객 기업들이 서드파티에 부여했던 과도한 교차 계정 IAM 역할 권한과, 서비스 해지·종료 후에도 해당 IAM 신뢰 역할을 삭제하지 않고 방치한 관리 허점.\n- 구조적 원인 [추정 — 분석]: 많은 기업이 외부 SaaS를 도입할 때는 설치 스크립트(CloudFormation·Terraform)를 돌려 광범위한 권한(`s3:*`, `ssm:*` 등)을 가진 교차 계정 IAM 역할을 쉽게 만들어 주지만, 계약을 해지하거나 담당자가 바뀔 때 클라우드 안에 남은 IAM 역할을 찾아 지우는 '오프보딩(Offboarding) 절차'가 전무해 수년 전 끊은 거래처가 영구적인 뒷문으로 남는다(본 보고서의 분석).\n\n**침투 경로 [확인 — Sentra·Wiz·Mandiant(Qubole 캠페인) 및 Expedia(서드파티 신뢰 접근) 발표 기준]**: 침해된 서드파티 빅데이터 플랫폼(Qubole 등)의 자격 증명을 이용해 고객사 클라우드에 설정된 교차 계정 IAM 역할(`AssumeRole` 등 신뢰 접근)을 수임하여 침투(T1199, 확인) → 침투한 고객사 AWS 환경에서 클라우드 스토리지·리소스 목록 열거(T1613, 확인) → AWS 스토리지 및 Systems Manager(SSM)에서 비밀정보·자격 증명 수확(T1552, 확인) → 고객사 클라우드 스토리지 객체에서 데이터 수집 및 외부 반출(T1530, 확인). (`n0n`이 주장한 익스피디아 10억 건 규모는 공격자 일방 주장 `[주장]`으로 본문에서만 구분 표기한다.)\n\n**어떻게 조치하나** (연구기관 권고 및 본 보고서 권고)\n- 즉시: AWS를 운영하는 조직은 10월 14일 이후 현재까지의 AWS CloudTrail 로그를 보존하고, 외부 AWS 계정 ID(특히 Qubole 관련 계정 ID 및 미승인 서드파티 계정)에서 발생한 `AssumeRole` 이벤트가 있는지 즉시 전수 검색한다. 침해된 클라우드 환경에서 새 비밀을 발급하지 않는다.\n- 단기: **Qubole을 현재 쓰지 않는 기업이라도 과거 테스트·도입 이력이 있다면 IAM 역할이 살아 있을 수 있다.** ① AWS IAM에서 외부 계정(`Principal: AWS`)을 신뢰 주체로 포함하는 모든 교차 계정 역할을 전수 조사해, Qubole 및 더 이상 사용하지 않는 서드파티 연동 역할을 **즉시 삭제**하고 활성 STS 세션을 모두 무효화한다. ② 만약 외부 계정의 비인가 `AssumeRole` 진입이 확인됐다면, 공격자가 이미 S3·SSM 파라미터 스토어·Secrets Manager의 키를 수확했을 가능성이 높으므로 안전한 환경에서 해당 AWS 환경 내 모든 애플리케이션 API 키·DB 비밀번호·IAM 액세스 키를 전면 교체한다.\n- 장기: 서드파티 SaaS에 교차 계정 IAM 역할을 허용할 때는 반드시 고유한 외부 ID(`sts:ExternalId`) 조건과 최소 권한 원칙을 적용하고, AWS IAM Access Analyzer를 통해 30~90일 이상 사용되지 않은 외부 신뢰 역할을 자동으로 탐지·회수하는 거버넌스를 구축한다.\n- 탐지: 평소에 호출이 없던 휴면(dormant) 교차 계정 IAM 역할에서 갑자기 발생하는 `AssumeRole` 이벤트와, 직후 이어지는 대규모 `ListBuckets`, `GetObject`, `GetParameter`/`GetSecretValue` 호출을 실시간 경보·차단한다.\n\n**교훈**: 앞서 다룬 바라쿠다 클라우드 해킹(`D20261114-barracuda-cloud`, 협력사에 주고 안 지운 키)과 이번 Qubole 사태(고객사가 만들어 주고 안 지운 AWS IAM 역할)는 정확히 동전의 양면이다. **\"계약은 끝났는데 클라우드 문은 안 닫았다\"**는 점이 2026년 클라우드 공급망 해킹의 가장 치명적인 약점으로 자리 잡았다.\n\n### [D20261114-notion-fireworks] 노션(Notion), AI 추론 공급사 'Fireworks AI' 해킹으로 일부 워크스페이스의 'Notion AI 채팅 기록' 노출 — '데이터 무보관' 약정 불일치\n> 날짜: Fireworks AI 침해 발생 2026-10-24 · Notion 연동 차단·데이터 삭제 2026-11-03 · 피해 워크스페이스 통지 2026-11-09~ · 언론 보도 2026-11-12~13 · 유형: 서드파티 AI 추론 공급사(Fireworks AI) 클라우드 침해 및 계약 위반 잔류 프롬프트·채팅 기록 노출 · 행위자: 미귀속 · 지역: 전 세계(해외) · 근거: 확인(Notion 공식 고객 통지 및 Fireworks AI 확인, SecurityWeek·BleepingComputer·TechCrunch 보도)\n\n**쉽게 말하면**: 전 세계 기업과 개인이 문서 정리·협업에 쓰는 '노션(Notion)'에서, 노션 AI의 일부 기능('인사이트' 분류 작업)을 처리하느라 외부 AI 인프라 업체인 '파이어웍스 AI(Fireworks AI)'로 보냈던 **노션 AI 채팅 대화 기록(질문과 답변)**이 파이어웍스 AI 해킹으로 인해 노출됐습니다(전체 노션 작업공간의 1% 미만 영향). 특히 파이어웍스 AI는 원래 계약상 \"고객 데이터를 저장하지 않는다(데이터 무보관)\"고 약속했지만 실제로는 서버에 대화 기록이 남아 있다가 털렸으며, 노션 측은 대화 기록에 '누가 어느 회사에서 썼는지' 이름표는 붙어 있지 않지만 **대화창에 비밀번호나 비밀키를 직접 복사해 넣었다면 즉시 바꾸라**고 권고했습니다.\n**먼저 할 일(초보용)**: 노션으로부터 데이터 노출 통지 이메일을 받은 워크스페이스 관리자·이용자는(통지를 받지 않은 곳은 영향 없음), 지난 10월 말 이전에 **Notion AI 채팅창에 질문하면서 무심코 붙여 넣었던 회사 API 키, 비밀번호, 접속 토큰, 미공개 기밀 정보가 있는지 확인해 감염되지 않은 안전한 기기에서 해당 비밀번호와 키를 즉시 모두 폐기·재발급**하세요.\n\n**개요**: 글로벌 생산성·협업 플랫폼 **노션(Notion)**은 2026-11-09부터 전체 워크스페이스의 **1% 미만**에 해당하는 일부 고객들에게 보안 사고 통지를 보내, 자사가 오픈웨이트(open-weight) AI 모델 구동 및 'Insights' 대시보드 분류 작업에 활용하던 외부 AI 추론 인프라 공급사 **Fireworks AI**의 침해 사고로 인해 일부 **Notion AI 채팅 기록(chat transcripts)**이 노출됐다고 밝혔다(SecurityWeek·BleepingComputer·TechCrunch 11/12~13 보도).\n- **사고 경위 및 '데이터 무보관(Zero-data-retention)' 약정 불일치 [확인: Notion, 보도]**: Fireworks AI는 지난 2026년 10월(10월 24일 개발·R&D 시스템을 호스팅하던 클라우드 환경 침해 포함) 외부 해킹 공격을 받아 내부 데이터셋, 청구 정보, 모델 가중치 등에 비인가 접근을 허용했다. 이 과정에서 Notion이 'Insights' 기능의 분류 작업을 위해 Fireworks AI 엔드포인트로 전송했던 **Notion AI의 사용자 입력(프롬프트)과 AI 출력(응답) 대화 기록**이 함께 노출됐다. 특히 보도(TechCrunch·SecurityWeek 등)에 따르면 Fireworks AI는 Notion과 **'데이터 무보관(Zero-data-retention)'** 계약을 맺고 있었음에도 불구하고, 실제 사용된 엔드포인트에 채팅 데이터가 삭제되지 않고 남아 있어 유출로 이어졌다.\n- **노출 데이터의 성격과 Notion의 조치**: Notion은 11월 3일 Fireworks AI와의 시스템 연결을 즉시 끊고 Fireworks 인프라에 남아 있던 자사 데이터를 영구 삭제했으며 조사 기간 중 'Insights' 기능을 비활성화했다. Notion은 노출된 채팅 기록의 대다수가 **'비식별·미귀속(unattributable)'** 상태여서 누가 작성했는지, 어느 워크스페이스 소속인지, 또는 도구 호출(tool-call) 결과가 무엇인지 나타내는 메타데이터·라벨이 붙어 있지 않다고 설명했다. 다만 대화 본문 자체에 사용자가 직접 회사명이나 비밀번호·API 키를 적어 넣었다면 텍스트 내용만으로도 노출될 수 있어, 해당 기간 Notion AI에 입력했을 가능성이 있는 자격 증명을 즉시 교체하도록 권고했다.\n\n**왜 일어났나**\n- 직접 원인 [확인: Notion, Fireworks AI, 보도]: AI 추론 공급사(Fireworks AI)의 개발·R&D 클라우드 환경이 외부 공격자에게 침해됐고, '데이터 무보관' 약정과 달리 엔드포인트에 삭제되지 않고 남아 있던 Notion AI 채팅 기록이 노출됐다.\n- 구조적 원인 [추정 — 분석]: 오늘날 수많은 SaaS 서비스들이 자체 AI 기능을 구현할 때 하나의 모델이 아니라 여러 하위 AI 추론 공급사(Inference Provider)로 프롬프트를 중계(라우팅)하는 다단계 AI 공급망 구조를 쓴다. 이때 원청 SaaS와 하위 추론 공급사 사이에 '데이터 무보관(Zero-retention)' 계약이 맺어져 있더라도, 하위 공급사의 개발·디버깅 로깅 설정 실수 하나로 고객 프롬프트가 디스크에 고스란히 쌓여 해킹 표적이 될 수 있다(본 보고서의 분석).\n\n**침투 경로 [확인 — Notion·Fireworks AI 발표 기준]**: 서드파티 AI 추론 공급사(Fireworks AI)의 클라우드 개발·R&D 환경을 침해해 클라우드 내에 보관돼 있던 데이터셋·모델 가중치 및 미삭제 Notion AI 채팅 기록에 접근(T1530, 확인). (Fireworks AI 개발 클라우드의 최초 침투 수단은 미공개여서 매핑하지 않는다.)\n\n**어떻게 조치하나** (벤더 권고 및 본 보고서 권고)\n- 즉시: Notion으로부터 개별 통지를 받은 워크스페이스 관리자는 통지 내역을 확인하고 관련 워크스페이스 감사 로그·AI 사용 기록을 신속히 보존하며, 해당 워크스페이스 구성원들에게 10월 말 이전 Notion AI 대화창에 입력한 민감 정보 유무를 즉시 파악하도록 공지한다. 침해가 의심되는 환경에서 새 비밀을 발급하지 않는다.\n- 단기: 노출된 채팅 기록에 작성자·조직 이름표(메타데이터)가 없더라도, **프롬프트 텍스트 안에 적힌 AWS 키(`AKIA...`), GitHub 토큰(`ghp_...`), 사내 도메인 주소, API 엔드포인트와 비밀번호는 공격자가 정규식 검색만 돌리면 주인이 누구인지 몰라도 즉시 자동 악용할 수 있다.** 따라서 구성원이 코드 디버깅이나 문서 요약을 시키면서 Notion AI에 붙여 넣었을 가능성이 있는 모든 API 키·비밀번호·토큰을 안전한 기기에서 즉시 폐기·재발급한다.\n- 장기: 사내 생성형 AI 및 협업툴 AI 활용 지침에 **\"계약상 비학습·무보관(Zero-retention) 엔터프라이즈 요금제라도 AI 프롬프트 창에 실제 운영 환경의 비밀키·비밀번호·고객 개인정보 원문을 절대 입력하지 않는다\"**는 원칙을 명시하고, DLP(데이터 유출 방지)나 브라우저 확장으로 AI 입력창 내 시크릿 패턴 전송을 사전 차단한다. 또한 SaaS 도입 시 하위 AI 추론 공급사(Sub-processor) 목록과 실제 로깅 비활성화 감사 결과를 확인한다.\n- 탐지: 과거 문서·메모나 AI 채팅에 언급됐던 내부 API 키·서비스 계정의 비정상 외부 IP 호출 여부를 모니터링한다.\n\n**교훈**: 이번 사고는 기업 보안 담당자들이 흔히 믿는 **\"우리 SaaS는 Zero-Data-Retention(데이터 무보관) 계약을 맺었으니 AI에 기밀을 넣어도 서버에 안 남는다\"**는 믿음이 왜 위험한지 증명한 대표 사례다. 계약서에는 '무보관'이라고 적혀 있어도 하위 AI 공급사의 개발 서버 설정 실수 하나로 대화록이 남아 털릴 수 있으며, 이름표가 없어도 대화 속에 적힌 API 키는 그 자체로 열쇠 구실을 한다.\n\n### [D20261114-facestealer-fbi] 미 법무부·FBI, 북한 해커의 가짜 화상회의 사칭 캠페인 '페이스스틸러(FaceStealer)' 인프라 압수(4억 달러 탈취·웹캠 영상 900개 확보) 및 바이낸스 해킹 탈취 자산 27억 달러 동결\n> 날짜: 미 법무부(DOJ)·FBI 발표 2026-11-12(현지시간) · 국내외 보도 2026-11-13 · 유형: 지인 계정 탈취 + 이전 피해자 웹캠 영상·딥페이크 가짜 화상회의 사회공학 캠페인 및 가상자산 탈취 · 행위자: 북한 연계 해커 조직(바이낸스 사건은 북한 'TraderTraitor' 공식 귀속) · 지역: 전 세계(해외) · 근거: 확인(미 법무부 DOJ·FBI 공식 발표, SecurityWeek·데일리시큐 확인)\n\n**쉽게 말하면**: 미국 법무부와 연방수사국(FBI)이 최근 18개월 동안 가짜 화상회의로 가상자산 업계 종사자와 오픈소스 개발자들을 속여 **4억 달러(약 5,600억 원) 이상**을 훔친 북한 해커들의 '페이스스틸러(FaceStealer)' 서버를 압수했습니다. 해커들은 먼저 해킹한 지인의 텔레그램·링크드인 계정으로 연락해 줌(Zoom)·팀즈 같은 화상회의로 불러낸 뒤, **이전에 해킹당한 사람들의 실제 웹캠 녹화 영상(압수 서버에서 900개 이상 발견)이나 딥페이크 영상**을 화면에 틀어 안심시키고 \"목소리가 안 들린다\"며 악성 프로그램을 깔게 만들었습니다. 한편 미국 정부는 같은 날 지난 10월 말 북한이 바이낸스에서 훔쳐 간 60억 달러대 가상자산 중 **27억 달러 이상을 동결하고 12억 달러 이상에 대해 법원 압류 승인**을 받았다고 발표했습니다.\n**먼저 할 일(초보용)**: 평소 알고 지내던 지인의 텔레그램·링크드인·슬랙·디스코드 계정에서 화상회의 초대가 오더라도, 회의 도중 **\"오디오·마이크나 카메라가 안 되니 업데이트·오류 해결 프로그램을 설치하라\"**는 안내가 뜨면 100% 해킹이므로 즉시 창을 닫고 절대 실행하지 마세요. 만약 이미 프로그램을 실행했다면 **즉시 그 컴퓨터의 인터넷(랜선·와이파이)을 끊고**, 그 컴퓨터가 아닌 **다른 안전한 기기**에서 가상자산 지갑 자산을 옮기고 메신저·GitHub·클라우드 계정의 비밀번호와 모든 로그인 세션·토큰을 폐기하세요.\n\n**개요**: 미국 법무부(DOJ)와 연방수사국(FBI)은 2026-11-12(현지시간) 북한 해커들이 가상자산 탈취 및 소프트웨어 공급망 침투에 사용해 온 **'페이스스틸러(FaceStealer)'** 캠페인의 클라우드 인프라를 압수했다고 발표하고, 같은 날 별도 발표를 통해 지난 10월 말 발생한 역대 최대 바이낸스 해킹([D20261030-binance](2026-10-30.md), [D20261104-binance](2026-11-04.md)) 탈취 자금에 대한 대규모 동결·압류 조치를 공개했다(DOJ·FBI 발표, SecurityWeek·데일리시큐 11/13 보도).\n1. **'페이스스틸러(FaceStealer)' 캠페인 수법과 피해 규모 [확인: DOJ, FBI]**: FBI에 따르면 북한 해커들은 최근 18개월 동안 이 수법으로 **4억 달러 이상의 가상자산**을 탈취했다(바이낸스 사건과는 별도 집계). 공격은 앞선 피해자에게서 탈취한 실제 지인의 텔레그램·링크드인·슬랙·디스코드 계정으로 접근해 협업이나 투자를 제안하면서 시작된다. 피해자가 수락하면 줌(Zoom), 마이크로소프트 팀즈(Teams), 구글 미트(Google Meet)로 위장한 가짜 화상회의 웹페이지로 초대한다. 회의 화면에는 **이전 피해자에게서 몰래 녹화한 실제 웹캠 영상(FBI가 압수 인프라에서 900개 이상 확보)**이나 가상자산 업계 유명 인사를 흉내 낸 **딥페이크 영상**이 재생된다. 화면에 아는 얼굴이 나타나 피해자가 경계를 풀면, 공격자는 \"목소리가 들리지 않는다\"는 식으로 오디오 오류를 꾸며 '해결 프로그램(패치·SDK·스크립트)' 실행을 유도한다. 피해자가 이를 실행하면 악성코드가 설치돼 가상자산 지갑·업무 시스템 접근권은 물론 **새 피해자의 웹캠 영상과 연락처까지 수집돼 다음 피해자를 속이는 미끼로 재사용**되는 연쇄 구조다. 특히 FBI는 일부 사례에서 **최초 감염 후 수개월~1년 이상 잠복**한 뒤에야 자산 탈취가 일어났으며, 최근에는 코드 저장소 장악(공급망 공격)을 노리고 **오픈소스 소프트웨어 개발자와 유지관리자(Maintainer)**로 표적을 확대했다고 경고했다.\n2. **바이낸스 해킹 탈취 자산 27억 달러 동결 및 12억 달러 압류 승인 [확인: DOJ, FBI]**: 미 법무부는 같은 날(11/12), 지난 10월 29일경 북한 해킹 조직 **'트레이더트레이터(TraderTraitor)'**가 바이낸스에서 60억 달러 이상의 가상자산을 탈취한 사건(`D20261104-binance`)과 관련해, 미국 정부와 민간 가상자산 사업자들이 협력해 탈취 자산 중 **27억 달러(약 3조8,000억 원) 이상을 동결(freeze)**했으며 이 가운데 **12억 달러 이상을 압류하거나 처분을 제한(seize/restrain)할 수 있도록 법원 승인**을 받았다고 발표했다. 공격자들은 탈취 자산을 주로 이더(ETH)로 바꾼 뒤 브리지·믹서·거래소를 통해 세탁을 시도 중이다.\n\n**왜 일어났나**\n- 직접 원인 [확인: DOJ, FBI]: 실제 지인의 탈취된 메신저 계정과 실제 웹캠 녹화본·딥페이크 영상을 결합한 고도의 사회공학(스피어피싱)으로, 피해자가 가짜 화상회의 사이트에서 오류 해결 프로그램으로 위장한 악성코드를 직접 실행하도록 유도했다.\n- 구조적 원인 [추정 — 분석]: (1) \"화면으로 얼굴을 보고 통화하면 진짜 본인일 것\"이라는 인간의 직관적 신뢰를 웹캠 녹화본(900개 이상 수집)과 딥페이크로 무너뜨렸다 (2) 감염 직후 바로 돈을 빼가지 않고 수개월~1년 이상 조용히 잠복하며 지갑 키나 오픈소스 저장소 권한이 열릴 때를 기다리기 때문에, 피해자가 \"며칠 전에 눌렀던 회의 링크\"와 \"1년 뒤 발생한 해킹\"을 연결해 알아차리기 어렵다(본 보고서의 분석).\n\n**침투 경로 [확인 — 미 법무부·FBI 발표 기준]**: 탈취한 지인의 텔레그램·링크드인·슬랙·디스코드 계정으로 접근해 가짜 화상회의 링크로 유인하는 스피어피싱 수행(T1566.003, 확인) → 가짜 화상회의 화면에서 이전 피해자 웹캠 영상·딥페이크를 재생하며 오디오 오류 해결 프로그램으로 위장한 악성코드를 피해자가 직접 실행하도록 유도(T1204.002, 확인) → 감염된 단말에서 피해자의 웹캠 영상을 수집해 다음 사칭 공격용으로 확보(T1125, 확인) → 수개월~1년 잠복 후 가상자산 지갑 등에 접근해 총 4억 달러 이상의 가상자산 탈취(T1657, 확인).\n\n**어떻게 조치하나** (FBI 권고 및 본 보고서 권고)\n- 즉시: 화상회의 접속 중 외부 프로그램·스크립트·드라이버 설치나 터미널 명령 실행을 요구받아 이를 실행한 적이 있다면(비록 수개월 전이라도), 해당 PC를 즉시 네트워크에서 격리하고 메모리·디스크·시작프로그램(런치에이전트·예약작업 등) 포렌식 증거를 보존한다. 침해된 기기에서 새 지갑이나 비밀번호를 생성하지 않는다.\n- 단기: **감염 후 1년 넘게 잠복하는 특성이 확인됐으므로, 과거 한 번이라도 '오디오 안 들림' 화상회의를 겪은 단말은 현재 증상이 없더라도 이미 침해된 것으로 간주해야 한다.** ① 감염 의심 단말이 아닌 **완전히 분리된 안전한 기기**에서 가상자산 지갑의 자산을 새 하드웨어 지갑(콜드월렛)으로 즉시 이전하고, 기존 지갑 시드 구문·개인키를 폐기한다. ② 안전한 기기에서 텔레그램·링크드인·슬랙·디스코드·GitHub·클라우드 계정의 비밀번호를 변경하고 **기존 발급된 모든 활성 세션·OAuth 토큰·SSH 키·PAT를 전량 회수(무효화)**하며, 피해 단말은 운영체제를 포맷 후 재설치(재구축)한다. ③ 내 웹캠 영상이 녹화돼 지인들을 속이는 데 악용될 수 있으므로 주요 거래처·동료들에게 사칭 주의 공지를 보낸다.\n- 장기: 화상회의는 브라우저 웹 링크 대신 공식 설치된 정식 클라이언트 앱이나 사내 표준 테넌트에서만 접속하도록 통제하고, 오픈소스 유지관리자·가상자산 서명 담당자는 일반 메신저·웹서핑용 PC와 코드 서명·지갑 관리용 기기를 물리적으로 분리한다.\n- 탐지: 브라우저에서 내려받은 파일이 PowerShell·배시 스크립트·Python 등을 실행하거나 카메라·마이크 장치에 비정상 접근하는 행위, 그리고 FBI가 공개한 북한 TraderTraitor 관련 지갑 주소와의 입출금 시도를 실시간 차단·감시한다.\n\n**교훈**: \"화상회의를 켜서 상대방 얼굴을 직접 봤다\"는 것이 더 이상 신원 확인의 증거가 되지 않는다. 해커가 어제 해킹한 내 동료의 웹캠 영상을 오늘 내 화면에 틀어놓고 \"마이크가 고장 났으니 이 파일을 눌러달라\"고 속이는 시대다. 어떤 이유로든 **화상회의 도중 파일이나 명령어를 실행하라는 요구는 무조건 해킹**으로 봐야 한다.\n\n## 3. 교차 분석 — 오늘의 사례에서 보이는 패턴\n\n> 선정된 국내외 8건(및 후속 보도)의 공통점이며 전체 공격의 통계가 아니다.\n\n1. **'계약이 끝난 뒤 안 지운 문'과 '약속과 달리 안 지운 데이터' — 서드파티·AI 공급망의 사각지대**: 오늘 해외 사례 3건은 모두 외부 공급사·협력사와의 연결 고리에서 터졌다. 바라쿠다(`D20261114-barracuda-cloud`)는 **프로젝트가 끝난 협력사에 줬던 클라우드 키를 지우지 않아** 고객 XDR 연동 키 저장소까지 공격자를 불러들였고, Qubole 캠페인(`D20261114-qubole-expedia`)에서는 반대로 고객 기업들이 **이미 해지한 빅데이터 업체의 AWS 교차 계정 IAM 역할(`AssumeRole`)을 지우지 않고 방치했다가** 줄줄이 털렸다. 노션(`D20261114-notion-fireworks`)은 하위 AI 추론 공급사(Fireworks AI)와 **'데이터 무보관(Zero-data-retention)' 계약을 맺었음에도 실제로는 엔드포인트에 채팅 기록이 남아 있다가** 해킹으로 노출됐다. 국내에서도 중기부 '모두의 창업'(`D20261114-moduchangup`)이 참여 AI 공급기업의 허술한 관리자 페이지·API 때문에 1차에 이어 2차에서도 다시 뚫렸다.\n2. **업무용 협업툴과 보안 장비의 '믿었던 보호막' 무력화**: 국내에서는 기업용 종단간 암호화(E3)를 내세운 카카오워크(`D20261114-kakaowork`)에서 임직원 인적사항뿐 아니라 **업무 메일 본문과 메시지 첨부파일 원본**이 유출됐고, NHN두레이에서도 비인가 접근 시도로 API 키를 전량 폐기하는 일이 같은 날 벌어졌다. 해외에서는 네트워크를 지키는 Check Point 방화벽(`D20261114-checkpoint-kev`)이 내부 로컬 소켓(`/tmp/dynamic_socket`) 인증 누락 때문에 PHP2Shell 웹셸에 단숨에 `root`를 내주고, 오히려 내부 VMware ESXi 서버들을 와이퍼(`destroy_v6`)로 파괴하는 공격 거점이 됐다. 한편 시트릭스(Citrix)도 11월 12일 기본 설정 장비에 영향을 주는 비인증 패킷 처리 메모리 결함(`CVE-2026-120868`, CVSS v4 9.3)과 게이트웨이 결함(`CVE-2026-107412`, 9.5) 등 NetScaler 메모리 결함 28개를 일괄 수정(14.1-73.57 / 13.1-64.39 이상)해 경계 장비 패치 압박이 계속되고 있다.\n3. **공격과 취약점 발굴 양면에서 입증된 AI·자동화 위력**: 바라쿠다 클라우드 침해(`D20261114-barracuda-cloud`)에서는 공격자가 자율형 AI 침투 도구 **'아르텍스(ARTEX)'**와 일치하는 방식으로 44시간 동안 클라우드 계정 10개를 훑었다. 동시에 방어·연구 측면에서는 포어스카우트(Forescout) **Vedere Labs가 상용 AI 모델(Claude 등)을 결합한 자동화 도구로 전 세계 IoT·OT·의료기기에 쓰이는 10개 핵심 TCP/IP 스택을 분석해, 수작업으로 9개월 걸릴 분량을 단 90시간(비용 935달러, 건당 약 2.58달러) 만에 끝내고 미공개 제로데이 66개를 포함한 99개 취약점(절반 이상이 고위험·치명적)을 찾아냈다**(11/13 보도). 이는 공격자 역시 단 몇백 달러로 레거시 소프트웨어에서 수십 개의 제로데이를 찍어낼 수 있음을 뜻한다.\n\n과거 3년 사건과의 연결은 [../과거3년/99-총평.md](../과거3년/99-총평.md)에 있다.\n\n## 4. 국내 소식 (업종별 6개 범주 검색 결과)\n\n최근 7일(2026년 11월) 기준으로 6개 범주를 각각 분리 검색해 본문 사건 2건(`D20261114-kakaowork`, `D20261114-moduchangup`)과 `국내뉴스.psv` 보충 8건을 정리했다.\n\n- **① 금융권(은행·카드·보험·증권·저축은행·캐피탈·가상자산·웹3)**:\n  - **금융보안원 상시평가 시스템 해킹(`D20261111-fsec`) 후속 조사 결과**(보안뉴스 11/13 보도, 국회 정무위 박대출 의원실 자료): 공격자는 회원가입 시 **문자메시지(SMS) 인증 우회 취약점**과 금융감독원 사칭 수법으로 신규 계정을 생성한 뒤, 관리자용 운영 점검 기능의 권한 검증 미흡을 파고들어 48개 금융사 파일 130여 건을 내려받은 것으로 드러났다. 특히 2022년 금융위 감사에서 외부망 열람 위험을 지적받아 '고정 IP 접속'으로 제한했다가, **금융사들의 편의 요구를 수용해 다시 '유동 IP 접속'을 허용해 준 것**이 결정적 화근으로 지목됐다(국내 국적 등 공격 IP 246개 차단 완료). 이를 `국내뉴스.psv`에 추가했다.\n  - 웹3 블록체인 게임 플랫폼 **'메이플스토리 유니버스'**(보안뉴스 11/13 보도): 11월 12일 오프체인 서버 인프라 일부에 비인가 외부 접근이 발생해 11월 5일 이후 생성된 오프체인 기록 일부(지갑 주소·닉네임·접속 IP·세션 키·이메일 앞 12자·소셜 계정 정보)와 외부 개발자 공간(빌더센터)에 등록된 **애플리케이션 328개의 개발자 API 키 및 OAuth 클라이언트 ID**가 노출됐다. 다만 운영용 개인키에 대한 KMS(키 관리 시스템) 복호화 시도를 모두 차단하고 서비스를 긴급 점검으로 전환해 서버·키를 전면 교체함으로써 가상자산 탈취 피해는 막았다. 이를 `국내뉴스.psv`에 추가했다.\n- **② 통신·OTT·플랫폼·이커머스·유통·모빌리티·협업툴**:\n  - 업무용 협업 플랫폼 **'카카오워크(운영사 디케이테크인)'** 해킹으로 카카오엔터프라이즈 전·현직 임직원 및 외부 인원의 인적사항과 업무용 메일 본문·첨부파일 원본 등이 유출된 사건(11/9 발생, 11/12~13 공지·보도)을 본문 사건 `[D20261114-kakaowork]`로 수록했다.\n  - 협업 플랫폼 **'NHN두레이(Dooray)'**(보안뉴스 11/13 단독 보도): 11월 13일 새벽 외부인의 비인가 계정 접근 시도와 API 키를 이용한 비정상 호출이 확인돼, 회사 측이 민간·공공 고객사 보호를 위해 **기존 서비스 API 및 관리자 API 키를 전량 폐기하고 API 서비스를 일시 중단**한 뒤 유출 여부와 경위를 조사 중이라는 소식을 `국내뉴스.psv`에 추가했다.\n  - 카셰어링 플랫폼 **'쏘카(SOCAR)'**(보안뉴스 11/13 보도): 외부 공격자가 내부 인증정보를 도용해 자체 구축 **사내 관리 시스템**에 비정상 접근함으로써 전·현직 임직원 일부의 이름·사내 이메일, 차량 이동을 맡는 '쏘카 핸들러' 일부의 휴대전화번호, 일부 협력사 관계자의 성명·이메일·계좌번호(원문 및 일부 마스킹)·암호화된 카드번호(일부 마스킹)가 조회·유출됐다(일반 카셰어링 이용 고객 정보는 미포함, KISA·개인정보위 신고 완료). 이를 `국내뉴스.psv`에 추가했다.\n- **③ 공공기관·지자체·교육(대학)·의료**:\n  - 중소벤처기업부·창업진흥원의 **'2차 모두의 창업'** 사업 참여 AI 공급기업 **'아미쿠스렉스(로폼)'**가 관리자 페이지 SQL 삽입 및 취약 API 공격을 받아 사업 참가자 818명을 포함한 총 2만28명의 이름·전화번호·이메일이 유출된 사건(11/11 발생·신고, 11/13 통지·발표)을 본문 사건 `[D20261114-moduchangup]`로 수록했다.\n  - **광주 동구청 마을공동체 앱 '우리동네do반장'**(보안뉴스 11/13 보도): 관리자 페이지 접속 인증 미적용 및 API 권한 검증 부재 취약점으로 외부 IP에서 관리자 화면에 접근해 엑셀 파일 6건을 내려받음으로써 주민 **2,101명**의 이름·휴대전화번호·닉네임·행정동명·포인트 적립액이 유출된 사실(11/5 사이버침해대응센터 통보로 인지, 외부 접근 차단 및 인증 적용 완료)을 `국내뉴스.psv`에 추가했다.\n  - **경일대학교 교직원 전자문서시스템 해킹**(데일리시큐 11/13 단독 보도): 11월 12일 오후 8시경 경일대 교직원 전용 전자문서시스템(`gw.kiu.ac.kr`)에 외부 침입이 발생해 대학 측이 주요 정보서비스 외부 접속을 통제하고 구성원 비밀번호 변경을 당부하는 안내 팝업을 게시했으며, 같은 날 해킹 포럼과 텔레그램에는 해커(`KimJEN`)가 메일(`kiu_ac_kr_mail.zip` 등)·설정·DB 등 **108GB**를 탈취했다는 주장이 올라온 소식(실제 유출 규모·개인정보 포함 여부는 미확인)을 `국내뉴스.psv`에 추가했다.\n- **④ 국내 랜섬웨어 피해**: 최근 7일 내 기수록된 한일네트웍스(`2026-11-10`), 메타인크립터(`D20261110-metaencryptor`), INC Ransom의 국내 화학소재 제조기업 공격(`2026-11`, 어제 수록) 외에 11월 13~14일 새로 공개된 국내 기업 특정 랜섬웨어 피해 건은 검색되지 않았다.\n- **⑤ 과기정통부·KISA·개인정보위·금융위·금감원·국정원 조사 결과·제재·긴급 점검 발표**: **국가정보원**이 최근 잇따른 금융·공공 해킹과 AI 기반 사이버 위협에 대응해 **전국 중앙부처 및 지방자치단체 등 2,100여 개 기관**에 외부 접점(공격표면)·보안관제·최신 패치 상태 점검 체크리스트를 배포해 자체 점검을 실시하고, 주요 정보통신기반시설은 국정원이 직접 취약점 점검에 나섰다는 보도(MBC·매일경제 등 11월 보도)를 `국내뉴스.psv`에 추가했다.\n- **⑥ 기존 대형 사건의 추가 규모 발표**: **더존비즈온 백업 서비스 침해(`D20261104-douzone`)**와 관련해 11월 13일 기준 **광주광역시 관광공사, 영산대학교 산학협력단, 한국제품안전관리원, KAC공항서비스, 노원문화재단 도서관기획실, 전북콘텐츠융합진흥원, 신진에스엠, 회계법인 리안, 발렉스특수물류 등 13곳**의 기업·기관이 추가로 개인정보 유출 가능성을 공지했다는 현황 갱신 보도(보안뉴스·데일리시큐 11/13 보도)를 `국내뉴스.psv`에 추가했다.\n\n## 5. 우선 대응 체크리스트\n\n1. **Check Point 방화벽·보안 게이트웨이·관리 서버 운영 조직(최우선 — CISA KEV 등재, PHP2Shell 연쇄 루트 탈취 및 ESXi 와이퍼 악용)**: [D20261114-checkpoint-kev](#d20261114-checkpoint-kev-check-point-gaia-os-dynamiccli-로컬-권한-상승-제로데이cve-2026-123039-cisa-kev-긴급-등재--php2shell-연쇄-악용해-루트-장악백도어tsga-및-esxi-와이퍼destroy_v6-유포) — 포렌식 증거 보존 후 **11월 16일까지** `sk1000362` 핫픽스 및 PHP2Shell 패치 즉시 적용(불가 시 `dynamic_server` 중지), `TSGA`/`TSProxy` 백도어 및 내부 VMware ESXi로의 SSH 접근 흔적 헌팅.\n2. **UnrealIRCd(6.0.0~6.2.7) 운영 조직(CISA KEV 기한 11/16)**: [D20261114-unrealircd-kev](#d20261114-unrealircd-kev-unrealircd-labeled-response-모듈-서버-간-명령-주입-취약점cve-2026-114713-실제-악용-및-cisa-kev-등재) — **6.2.7.1** 업그레이드 또는 무중단 핫패치(`./unrealircd hot-patch bundle-20261107`) 즉시 적용, 비인가 `GLINE`·권한 변경 점검.\n3. **AWS 클라우드 운영 기업 및 바라쿠다 XDR·노션(Notion AI) 이용 기업(서드파티·클라우드 연동 키 점검)**: [D20261114-qubole-expedia](#d20261114-qubole-expedia-빅데이터-플랫폼-qubole의-aws-교차-계정-iam-역할방치된-연동-악용-공급망-침해--다수-기업-데이터-유출-및-익스피디아expedia-10억-건-협박-파장)·[D20261114-barracuda-cloud](#d20261114-barracuda-cloud-바라쿠다barracuda-내부-클라우드-침해--폐기-안-한-협력사-키와-ai-도구artex-추정로-고객-xdr-연동-자격-증명-저장소-접근)·[D20261114-notion-fireworks](#d20261114-notion-fireworks-노션notion-ai-추론-공급사-fireworks-ai-해킹으로-일부-워크스페이스의-notion-ai-채팅-기록-노출--데이터-무보관-약정-불일치) — AWS 내 미사용·해지 서드파티(특히 Qubole) 교차 계정 IAM 역할 즉시 삭제 및 CloudTrail `AssumeRole` 점검, 통지받은 바라쿠다 XDR 고객은 M365·구글 워크스페이스 연동 키 재발급, 통지받은 노션 워크스페이스는 프롬프트에 입력했던 비밀키 교체.\n4. **가상자산·웹3 종사자 및 오픈소스 개발자(북한 FaceStealer 가짜 화상회의 방어)**: [D20261114-facestealer-fbi](#d20261114-facestealer-fbi-미-법무부fbi-북한-해커의-가짜-화상회의-사칭-캠페인-페이스스틸러facestealer-인프라-압수4억-달러-탈취웹캠-영상-900개-확보-및-바이낸스-해킹-탈취-자산-27억-달러-동결) — 지인 초대 및 실제 얼굴(웹캠 녹화본·딥페이크)이 보이더라도 화상회의 중 '오디오/비디오 복구 프로그램' 실행 절대 금지, 과거 실행 이력이 있으면 즉시 단말 격리 및 안전한 기기에서 지갑·코드 저장소 자격 증명 전면 교체.\n5. **카카오워크·NHN두레이·로폼(모두의 창업)·쏘카·경일대·메이플스토리 유니버스 등 국내 침해 영향 조직·이용자**: [D20261114-kakaowork](#d20261114-kakaowork-업무용-협업-플랫폼-카카오워크디케이테크인-해킹--임직원외부-인원-개인정보-및-업무-메일-본문첨부파일-원본-유출)·[D20261114-moduchangup](#d20261114-moduchangup-중기부-모두의-창업-2차-사업-참여-ai-기업-아미쿠스렉스로폼-sql-삽입api-해킹--참가자-818명-포함-총-2만28명-개인정보-유출) — 안전한 기기에서 비밀번호·세션·API 키를 재발급하고, 특히 카카오워크 이용자는 유출된 메일 본문·첨부파일 안에 적혀 있던 사내 시스템 접속 정보·API 키까지 별도로 폐기·교체하며 실제 업무 맥락을 사칭한 스피어 피싱에 주의.\n\n## 6. 검증 수준과 한계\n\n- CISA KEV 카탈로그를 2026-11-14 직접 조회해 11-13 신규 등재된 2건(`CVE-2026-123039` Check Point, `CVE-2026-114713` UnrealIRCd)과 MITRE CVE 공식 레코드(`CVE-2026-123039`, `CVE-2026-114713`, `CVE-2026-120868`, `CVE-2026-107412`)를 1차 대조해 확인했다. 수정 버전 번호는 발표 당시 기준이므로 실제 조치 시 각 벤더의 최신 보안 권고를 재확인해야 한다.\n- Qubole 공급망 침해 및 익스피디아 협박 사건(`D20261114-qubole-expedia`)에서 Qubole의 AWS 교차 계정 IAM 역할 악용 메커니즘과 익스피디아의 '서드파티 데이터 플랫폼 신뢰 접근 악용' 사실은 보안 연구기관(Sentra·Wiz·Mandiant) 및 익스피디아 입장문으로 확인됐으나, 갈취 그룹 `n0n`이 주장한 '익스피디아 레코드 약 10억 건(로열티 8.3억 건 등)' 수치는 공격자의 일방 주장(`[주장]`)이어서 확인된 사실과 엄격히 분리해 기술했다.\n- 바라쿠다 내부 클라우드 침해(`D20261114-barracuda-cloud`)에서 외부 협력사 개발 환경 침해를 통한 키 유출 경위는 바라쿠다의 분석상 추정(`[추정]`)을 그대로 반영해 매핑(`T1199|추정`)했으며, AI 도구 'ARTEX' 사용 가능성 역시 동작 패턴 일치에 기반한 분석 단서임을 명시했다.\n- 국내 사건 중 카카오워크(`D20261114-kakaowork`)는 비정상 접근 및 메일 본문·첨부파일 원본 유출 사실은 공식 확인됐으나 최초 침투 경로가 조사 중이어서 지침에 따라 ATT&CK 기법을 추측으로 매핑하지 않았다. 반면 '모두의 창업' 아미쿠스렉스(`D20261114-moduchangup`)는 KISA 신고 내역 보도에서 관리자 페이지 SQL 삽입 및 취약 API 악용이 구체적으로 확인돼 이를 반영했다.\n- **ATT&CK 버전 확인 결과**: https://attack.mitre.org/tactics/enterprise/ 에서 현재 공식 버전이 **v20.1**임을 확인했다(작업 지침은 v19.2 기준, 본 저장소 카탈로그는 v20.0 기준). 전술 15개 체계는 동일하므로 임의 대규모 재매핑 없이 기존 카탈로그 범위에서 매핑했다.\n- **독립 교차 검토**: 현재 실행 환경이 Gemini(Antigravity)여서 독립 교차 검토 기준에 따라 자체 교차 검토를 수행해 사실관계·근거 표기·ATT&CK 전술-기법 일치·초보용 문장 정확성을 점검했다.\n\n## 출처\n\n- CISA Known Exploited Vulnerabilities Catalog (2026-11-13 추가분: `CVE-2026-123039`, `CVE-2026-114713`) 및 MITRE CVE API\n- Check Point Security Advisory `sk1000362` (`CVE-2026-123039`), Aviatrix Threat Research, SecurityWeek·BleepingComputer\n- UnrealIRCd Security Advisory (`CVE-2026-114713`, `6.2.7.1` / `bundle-20261107`, https://forums.unrealircd.org/viewtopic.php?t=9487)\n- Barracuda Networks Security Incident Disclosure (November 10–11, 2026) 및 데일리시큐(idxno=209504)\n- Sentra·Wiz·Mandiant Qubole AWS Cross-Account I
