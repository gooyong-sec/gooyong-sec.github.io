<noscript><div style="max-width:760px;margin:24px auto;padding:0 16px"><h1>보안 이슈 · MITRE ATT&amp;CK</h1><p>이 화면은 JavaScript로 그립니다. JavaScript가 꺼져 있어 최근 사건 10건만 요약해 보여 줍니다(전체 236건).</p><ul>
<li><strong>Wiz 경보 2026-10-30 11:43(UTC) AI 개발 플랫폼 연쇄 침해(Northflank 등 최소 9건, Wiz &quot;Black October&quot; 보고서)</strong><br>코드를 배포·실행해 주는 클라우드 플랫폼 'Northflank'가 보안업체 Wiz의 경보로 침해 사실을 알게 돼, 고객들에게 &quot;여러분의 환경변수(API 키 등 민감한 설정값)가 복호화되어 탈취됐다고 가정하라&quot;고 통보했습니다. 실제로 여러 고객이 자신의 AI API 키가 무단으로 쓰인 것을 신고했습니다. Wiz는 &quot;AI 개발 플랫폼들의 암울한 10월(Black October for AI Developer Platforms)&quot;이라는 보고서에서, 10월 한 달 동안 Northflank·Railway·OpenCode·Warp·Lightning AI 등 AI 개발용 플랫폼에서 최소 9건의 유사한 보안 사고를 확인했다고 밝혔습니다(사고마다 심각도·확인 수준이 다를 수 있고, 모두 같은 공격자인지도 확인되지 않음). 이 9건과는 별개로, 관련이 명확히 밝혀지지 않은 2건에서 탈취된 기업 자격증명으로 아마존의 AI 서비스(Bedrock)를 약 250만 번 호출해 약 10만 달러의 요금이 발생한 사례도 Wiz 보고서에 포함돼 있습니다(이 2건이 위 9개 플랫폼 침해의 직접적인 결과인지는 보도에서 명확히 연결되지 않습니다).</li>
<li><strong>WebPros `WHMCS` 긴급 보안 업데이트(`9.1.2` / `9.0.10` / `8.13.8`) 배포 및 MITRE CVE(`CVE-2026-82981`·`CVE-2026-82979`·`CVE-2026-93700`) 공시 2026-11-23~24 브로드컴, VMware vCenter Server(`vmdir`) 두 번째 9.8점 인증 우회(CVE-2026-123903) 및 ESXi(IOFilterVP)·Aria Operations 원격 코드 실행 긴급 패치 — 웹 호스팅 관리 표준 'WHMCS' 비인증 SQL 삽입(CVE-2026-82981) 패치 병행</strong><br>기업의 가상 서버 전체를 총괄하는 사령탑(**VMware vCenter**)과 전 세계 웹 호스팅·도메인 업체들이 고객 관리와 요금 청구에 쓰는 핵심 플랫폼(**WHMCS**)에서 당장 오늘 패치하지 않으면 서버 전체를 빼앗길 수 있는 초위험 취약점들이 터져 나왔습니다. 첫째, 불과 나흘 전([11-20 보고서 `D20261120-vmware-vcenter-bonesaw`](2026-11-20.md)) 중국 해커(`ARMORY CASTLE`)가 제로데이로 악용해 가상화 사령탑을 장악했던 바로 그 **VMware vCenter의 디렉터리 서비스(`vmdir`)에서, 똑같이 위험도 9.8점짜리 '두 번째 비인증 로그인 우회 결함(`CVE-2026-123903`)'과 ESXi 가상 서버 호스트 원격 코드 실행 결함(`CVE-2026-123910`·`123911`, 9.8점)이 추가로 발견**돼 브로드컴이 11월 24일 긴급 패치(`VMSA-2026-0011`)를 내놓았습니다 — 지난주에 vCenter 패치를 했다고 안심하면 안 되고 **오늘 나온 새 패치를 한 번 더 깔아야 합니다.** 둘째, 국내외 수많은 웹 호스팅·클라우드 임대 업체들이 쓰는 **'WHMCS'**에서는 **해커가 로그인조차 하지 않고 쇼핑카트(장바구니) 화면에 조작된 데이터베이스 명령(SQL 삽입, `CVE-2026-82981`)을 넣는 것만으로 전체 호스팅 고객들의 개인정보·기술지원 티켓 내용과 최고관리자의 비밀번호 해시를 통째로 뽑아갈 수 있는 치명적 결함**과 원격 코드 실행 결함(`CVE-2026-93700`, 9.0점)이 공개됐습니다.</li>
<li><strong>Vates 긴급 보안 권고(VSA-2026-062)·패치 공개 2026-11-10 가상화 관리 도구 Xen Orchestra 인증 우회(VSA-2026-062) 실제 악용 — 빈 JSON 쿠키 하나로 하이퍼바이저 root 장악</strong><br>기업들이 여러 대의 가상 서버(가상머신)를 한꺼번에 관리할 때 쓰는 웹 도구 '젠 오케스트라(Xen Orchestra)'에서, 아이디나 비밀번호를 전혀 몰라도 로그인 과정을 통째로 건너뛸 수 있는 치명적인 결함(VSA-2026-062)이 실제 해킹 공격에 악용됐습니다. 공격자가 쿠키 값에 '빈 괄호(`j:{}`)' 하나만 넣어서 보내면, 프로그램이 이를 제대로 검사하지 않고 데이터베이스 맨 첫 줄에 있는 토큰(보통 최고 관리자 계정)을 그대로 꺼내 줘서 곧바로 관리자 권한을 얻게 됩니다. 이를 통해 공격자는 관리 도구뿐 아니라 그 아래 연결된 물리 가상화 서버(XCP-ng 하이퍼바이저) 전체의 최고 권한(root)까지 장악했습니다.</li>
<li><strong>SBC Medical Group 침해 인지 및 Tribeau 통보 2026-11-16(미 SEC Form 8-K 공시 및 보도 11-18~19) 미·일 미용의료 그룹 SBC 메디컬 162만 명(및 예약 플랫폼 1.2만 명) 유출 SEC 공시, 영국 런던교통공사(TfL) 26.5만 명·JP모건 서드파티 1.6만 건 유출</strong><br>해외에서 의료·대중교통·금융 분야의 굵직한 개인정보 유출 3건이 동시에 공식 확인됐습니다. 첫째, 미국 나스닥 상장사이자 일본 최대급 미용·성형 의료 그룹인 **'SBC 메디컬 그룹(쇼난 미용클리닉 등 운영)'**이 본사 웹 데이터베이스 해킹과 외부 예약 앱(**'트리뷰 Tribeau'**) 해킹을 같은 날 동시에 겪어 **환자·고객 약 162만4,000명과 직원 약 2만 명의 개인정보(이름·연락처·주소·비밀번호·생년월일·환자번호·상담 및 시술 예약 내역 등)**가 유출됐다고 미국 증권거래위원회(SEC)에 공식 보고했습니다. 둘째, 영국 **런던교통공사(TfL)**에서는 학생·노인·유공자 등이 쓰는 할인 교통카드(**오이스터 포토카드**) 고객 **약 26만5,000명**의 이름·주소·생년월일과 함께 **'비밀번호 찾기용 보안 질문과 답변'**이 털렸고, 셋째, 미국 최대 은행 **JP모건 체이스(JPMorgan Chase)**에서는 핵심 은행망이 아니라 **외부 마케팅·서비스 협력업체(서드파티 벤더)**가 해킹(`n0n` 조직 소행 주장)을 당해 프리미엄 카드 고객 등 **약 1만6,000건의 이메일·연락처**가 노출됐습니다.</li>
<li><strong>SAP 정기 보안 패치·Onapsis·RedRays 기술 공개 2026-11-10~11 SAP 11월 정기 패치: 'ICM2Shell'(CVE-2026-76964·89126) 등 비인증 원격 CVSS 10.0 만점 결함 4건 동시 수정</strong><br>대기업의 회계·인사·생산 등 핵심 업무를 담당하는 SAP 시스템에서, 위험도 최고 점수(CVSS 10.0 만점)짜리 치명적 보안 결함이 한 달에 무려 4건이나 동시에 발표돼 긴급 패치가 나왔습니다. 4건 모두 해커가 아이디·비밀번호 없이, 그리고 직원이 아무런 버튼을 누르지 않아도 원격에서 악용할 수 있습니다. 특히 'ICM2Shell'로 명명된 2건(CVE-2026-76964, CVE-2026-89126)은 외부 웹 접속을 받아 주는 길목(인터넷 통신 관리자와 웹 디스패처)에 기본으로 켜져 있는 웹소켓 통신 결함이어서, 조작된 신호만 보내면 곧바로 서버 운영체제 명령어를 실행하고 SAP 시스템 전체를 장악할 수 있습니다.</li>
<li><strong>Plerdy 추적 스크립트 변조 활동 2026-08-27~09-03 러시아 연계 APT29(추정), 정상 웹사이트 변조로 아이폰·안드로이드 겨냥(Poisoned Source)</strong><br>프랑스 보안업체 Sekoia가 &quot;Poisoned Source&quot;라는 이름으로 공개한 연구에 따르면, 공격자들이 멀쩍이 둘러보기만 해도 아이폰·안드로이드 기기가 감염될 수 있는 캠페인을 벌였습니다. 이들은 정상 웹사이트에 악성 코드를 심거나, 진짜 내용을 그대로 중계하는 가짜 거울(미러) 사이트를 운영하거나, 우크라이나의 웹 분석 서비스 'Plerdy'의 추적 스크립트 자체를 변조하는 세 가지 방식을 함께 썼습니다. 방문자의 기기 운영체제·브라우저 버전을 확인해 거기 맞는 공격을 내려보냈고, 아이폰에서는 문자메시지·왓츠앱·텔레그램 대화 내용·위치·사진까지, 안드로이드에서는 저장된 비밀번호·방문기록·와이파이 비밀번호까지 빼갔습니다. Sekoia는 이 공격이 러시아 정부와 연계된 것으로 알려진 APT29(일명 코지베어) 또는 그 하위 조직의 소행일 가능성이 중간~높은 신뢰도로 있다고 평가했습니다. 다행히 모든 공격 방식은 이미 제조사가 패치한 결함만 썼기 때문에, 최신 업데이트를 적용한 기기는 영향받지 않습니다.</li>
<li><strong>PHP2Shell 공개 2026-10-21 PHP2Shell + Linux 커널 &quot;Fragnesia&quot; 결함 체인으로 방화벽·관리서버 25대 루트 권한 탈취, 美 정부 관련 기관 포함(CVE-2026-109618, CVE-2026-109619, CVE-2026-46300)</strong><br>지난주 전 세계 웹사이트의 약 70%가 쓰는 프로그래밍 언어 PHP에서 로그인 없이도 서버를 장악할 수 있는 결함(PHP2Shell)이 발견돼 긴급 패치가 나왔습니다. 그런데 공격자들이 이 결함 하나만으로는 &quot;서버 프로그램 권한&quot;만 얻을 수 있었던 것을 노려, 리눅스 운영체제 자체의 또 다른 결함(연구자들이 &quot;Fragnesia&quot;라고 이름 붙인 결함)을 추가로 써서 &quot;컴퓨터 전체를 마음대로 할 수 있는 최고 권한(root)&quot;까지 올라간 사실이 보안업체 Dream(이스라엘)의 조사로 확인됐습니다. 이 방식으로 방화벽 장비 24대와 내부 관리서버 1대, 총 25대가 뚫렸고, 그중 3대는 미국 정부와 관련된 기관의 장비였습니다. 공격자는 그 안에서 비밀번호·개인 키를 훔치고 회사 내부 사용자 목록(Active Directory)까지 들여다봤습니다. 미국 정부(CISA)는 이 두 가지 결함 모두를 &quot;실제로 악용되고 있다&quot;고 공식 확인해 위험 목록에 올렸고, 첫 번째 결함(PHP2Shell)은 오늘(10/29)까지, 두 번째 결함(Fragnesia)은 10/31까지 미국 연방기관에 조치를 요구했습니다.</li>
<li><strong>PHP Foundation 보안 업데이트(`8.5.13`·`8.4.28`·`8.3.37`·`8.2.36`) 및 Depthfirst 기술 분석(`phpAfterShell`) 공식 공개 2026-11-19 PHP 긴급 보안 업데이트 18건 패치('phpAfterShell' 등 CVSS 9.2 치명적 RCE 7건) — 기본 파일 세션 부분 덮어쓰기 및 PHP-FPM 요청 밀수 결함</strong><br>지난달 전 세계와 한국 웹 서버들을 비상사태에 빠뜨렸던 `PHP2Shell` 사태에 이어, 이번에는 PHP 재단이 **최고 위험도(CVSS 9.2점) 원격 코드 실행 결함 7건을 포함한 총 18건의 보안 결함**을 고치는 긴급 업데이트를 발표했습니다. 특히 **'PHP애프터셸(phpAfterShell, `CVE-2026-126714`)'**이라 불린 핵심 결함은 PHP가 가장 기본으로 쓰는 '파일 기반 로그인 세션 저장' 과정에서 파일 쓰기가 중간에 끊기면 새 데이터와 옛날 데이터가 기형적으로 섞이면서 **평범한 글자가 해킹 객체로 변신해 실행되는 결함**이고, 함께 패치된 **'PHP-FPM 요청 밀수(`CVE-2026-129289`)'** 결함은 앞단 웹서버(NGINX·Apache)와 PHP가 연결을 재사용할 때 다 읽지 않고 남은 요청 찌꺼기를 **해커가 보낸 새로운 내부 PHP 실행 명령으로 착각해 그대로 실행해 주는 치명적 결함**입니다.</li>
<li><strong>Perforce 보안 권고 및 CVE 최초 공개 2026-11-03(동반 결함 `CVE-2026-115732` 포함) Perforce Puppet Enterprise 보고서 역직렬화 원격 코드 실행 취약점(CVE-2026-115731) 실제 악용 확인 — CISA KEV 긴급 등재</strong><br>기업이 수백~수천 대의 서버 설정을 한곳에서 자동으로 관리할 때 쓰는 핵심 중앙 통제 프로그램 **'퍼핏 엔터프라이즈(Puppet Enterprise)'**에서, 조작된 상태 보고서 하나만 보내면 중앙 서버에서 마음대로 해킹 명령을 실행할 수 있는 치명적 결함(`CVE-2026-115731`)이 **실제 해킹 공격에 악용**되고 있는 것으로 확인돼 미국 사이버보안청(CISA)이 긴급 경보를 발령했습니다. 특히 새 서버를 등록할 때 인증서를 자동으로 발급해 주는 설정(자동 서명)이 허술하게 켜져 있는 곳은, 해커가 아이디나 비밀번호 없이도 밖에서 즉시 인증서를 받아내 중앙 관리 서버 전체를 장악할 수 있습니다.</li>
<li><strong>Oracle 패치 공개 2026-10-20(2026년 10월 CPU) Oracle E-Business Suite 신규 SQL인젝션→RCE 결함, 패치 직후 정찰 스캐닝 포착(CVE-2026-101767)</strong><br>기업이 회계·인사 등에 널리 쓰는 Oracle E-Business Suite(EBS) 소프트웨어에서, 로그인 없이도 데이터베이스 명령을 끼워 넣어(SQL 인젝션) 결국 서버에서 임의 명령까지 실행할 수 있는 심각한 결함이 발견돼 10월 20일 패치가 나왔습니다. 아직 실제로 이 결함을 이용해 성공적으로 뚫린 사례는 확인되지 않았지만, 보안회사가 설치해 둔 '가짜 서버(디코이)'에서 공격자들이 패치 일주일 만에 이 결함을 겨냥해 찔러보는(정찰) 시도를 포착했습니다.</li>

const gRe = new RegExp([...gMap.keys()].sort((a, b) => b.length - a.length).map(k => {
  const e = k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return /^[\x20-\x7e]+$/.test(k) ? `(?<![A-Za-z0-9])${e}(?![A-Za-z0-9])` : e;
}).join('|'), 'g');
let seenTerms = new Set();
function gl(html){
  let skip = 0;
  return html.split(/(<[^>]+>)/).map(p => {
    if (p[0] === '<') {
      if (/^<(code|pre|a|abbr|h[1-6]|button|th)[\s>]/i.test(p)) skip++;
      else if (/^<\/(code|pre|a|abbr|h[1-6]|button|th)>/i.test(p)) skip = Math.max(0, skip - 1);
      return p;
    }
    if (skip || !p.trim()) return p;
    return p.replace(gRe, m => {
      if (seenTerms.has(m)) return m;
      seenTerms.add(m);
      return `<abbr class="g" tabindex="0" data-tip="${esc(gMap.get(m))}">${m}</abbr>`;
    });
  }).join('');
}

function inline(s){
  s = esc(s);
  const codes = [];
  s = s.replace(/`([^`]+)`/g, (m, c) => { codes.push(c); return '\u0000' + (codes.length - 1) + '\u0000'; });
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?![*\w])/g, '$1<em>$2</em>');
  s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (m, t, h) => /^https?:/.test(h)
    ? `<a href="${h}" target="_blank" rel="noopener">${t}</a>` : `<a href="#" data-rel="${h}">${t}</a>`);
  return s.replace(/\u0000(\d+)\u0000/g, (m, i) => `<code>${codes[i]}</code>`);
}
function buildList(items){
  let html = '', st = [];
  for (const it of items) {
    while (st.length && it.ind < st[st.length - 1].ind) html += '</li></' + (st.pop().ord ? 'ol' : 'ul') + '>';
    if (!st.length || it.ind > st[st.length - 1].ind) { html += '<' + (it.ord ? 'ol' : 'ul') + '><li>' + inline(it.text); st.push({ ind: it.ind, ord: it.ord }); }
    else html += '</li><li>' + inline(it.text);
  }
  while (st.length) html += '</li></' + (st.pop().ord ? 'ol' : 'ul') + '>';
  return html;
}
function md(text){
  const L = text.replace(/\r/g, '').split('\n'); const out = []; let i = 0;
  const isBlock = l => /^(#{1,6} |```|>|---+\s*$|\s*([-*]|\d+\.)\s|\|)/.test(l);
  while (i < L.length) {
    const l = L[i];
    if (/^```/.test(l)) { const c = []; i++; while (i < L.length && !/^```/.test(L[i])) c.push(L[i++]); i++; out.push('<pre><code>' + esc(c.join('\n')) + '</code></pre>'); continue; }
    let m;
    if ((m = l.match(/^(#{1,6}) (.*)$/))) { out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`); i++; continue; }
    if (/^---+\s*$/.test(l)) { out.push('<hr>'); i++; continue; }
    if (/^>/.test(l)) { const q = []; while (i < L.length && /^>/.test(L[i])) q.push(inline(L[i++].replace(/^>\s?/, ''))); out.push('<blockquote>' + q.join('<br>') + '</blockquote>'); continue; }
    if (/^\|/.test(l) && /^\|[\s:|-]+\|?\s*$/.test(L[i + 1] || '')) {
      const cells = r => r.replace(/^\|/, '').replace(/\|\s*$/, '').split('|').map(c => c.trim());
      const head = cells(l); i += 2; const rows = [];
      while (i < L.length && /^\|/.test(L[i])) rows.push(cells(L[i++]));
      out.push('<table><thead><tr>' + head.map(c => `<th>${inline(c)}</th>`).join('') + '</tr></thead><tbody>' +
        rows.map(r => '<tr>' + r.map(c => `<td>${inline(c)}</td>`).join('') + '</tr>').join('') + '</tbody></table>'); continue;
    }
    if (/^\s*([-*]|\d+\.)\s+/.test(l)) {
      const items = [];
      while (i < L.length) {
        const mm = L[i].match(/^(\s*)([-*]|\d+\.)\s+(.*)$/);
        if (mm) { items.push({ ind: mm[1].length, ord: /\d/.test(mm[2]), text: mm[3] }); i++; }
        else if (L[i].trim() && /^\s{2,}\S/.test(L[i]) && items.length) { items[items.length - 1].text += ' ' + L[i++].trim(); }
        else break;
      }
      out.push(buildList(items)); continue;
    }
    if (!l.trim()) { i++; continue; }
    const p = [];
    while (i < L.length && L[i].trim() && !(p.length && isBlock(L[i]))) p.push(L[i++]);
    out.push('<p>' + p.map(inline).join('<br>') + '</p>');
  }
  return out.join('\n');
}
function sections(text){
  return text.split(/\n\s*\n/).map(b => {
    const lab = (b.match(/^\*\*([^*]+)\*\*/) || [, ''])[1];
    const cls = /^(쉽게 말하면|먼저 할 일)/.test(lab) ? 's-easy' : /^개요/.test(lab) ? 's-over' : /^왜 일어났나/.test(lab) ? 's-why' : /^침투 경로/.test(lab) ? 's-path' : /^어떻게 조치하나/.test(lab) ? 's-fix' : /^교훈/.test(lab) ? 's-less' : '';
    return `<div class="sec ${cls}">${md(b)}</div>`;
  }).join('');
}
function resolveDoc(base, href){
  const target = href.split('#')[0]; if (!target) return null;
  const parts = base.split('/').slice(0, -1);
  for (const seg of target.split('/')) { if (seg === '..') parts.pop(); else if (seg && seg !== '.') parts.push(seg); }
  const p = parts.join('/');
  return docs.find(d => d.path === p) ? p : null;
}

  $('#hit').onchange = e => { state.onlyHit = e.target.checked; vMatrix(sel); };
  view.querySelectorAll('.tech').forEach(b => b.onclick = () => { location.hash = '#/matrix/' + b.dataset.t; });
  if (sel) { openDrawer(sel); const el = view.querySelector(`.tech[data-t="${sel}"]`); if (el) el.scrollIntoView({ block: 'nearest', inline: 'center' }); }
  else closeDrawer();
}
function openDrawer(id){
  const rows = (byTech[id] || []).slice().sort((a, b) => ((incById[b.id] || {}).date || '').localeCompare((incById[a.id] || {}).date || ''));
  const tacs = (techTactics[id] || []).map(t => (tacById[t] || {}).ko).join(' · ');
  const d = $('#drawer');
  d.innerHTML = `<button class="btn x" id="dx">닫기</button><h2 style="margin-top:0">${id}<br><small style="font-weight:400">${esc(catName[id] || '(카탈로그에 없음)')}</small></h2>
    ${techNotes[id] ? `<div class="sec s-easy"><p><strong>${esc(techNotes[id][0])}</strong><br>${esc(techNotes[id][1])}</p></div>` : ''}
    <p class="sub">전술: ${esc(tacs)} · <a href="https://attack.mitre.org/techniques/${id}/" target="_blank" rel="noopener">MITRE 공식 설명 ↗</a></p>
    <p><strong>${rows.length}</strong>건의 사례</p>
    ${rows.map(m => { const i = incById[m.id] || {title: m.id, date: ''}; return `<div class="case">
      <div>${tag(m.ev)} <span class="chip">${m.tech}</span> <span class="sub">${esc((tacById[m.ta] || {}).ko || '')}</span></div>
      <div><a href="#/inc/${m.id}"><strong>${esc(i.title)}</strong></a> <span class="sub">${esc(i.date)}</span></div>
      <div class="sub" style="margin:0">${esc(m.note)}</div></div>`; }).join('') || '<p class="sub">아직 관측된 사례가 없습니다. 새 사건이 매핑되면 여기에 쌓입니다.</p>'}`;
  d.hidden = false; $('#dx').onclick = () => { location.hash = '#/matrix'; };
}
function closeDrawer(){ $('#drawer').hidden = true; }

function vActors(){
  const g = {};
  incidents.forEach(i => (g[actorKey(i.actor)] = g[actorKey(i.actor)] || []).push(i));
  const rows = Object.entries(g).sort((a, b) => (a[0] === '미귀속') - (b[0] === '미귀속') || b[1].length - a[1].length);
  view.innerHTML = `<h1>위협 행위자</h1><p class="sub">사건의 '행위자' 표기 기준 그룹. 귀속이 확정이 아닌 경우가 많으므로 사건 본문의 근거 표기를 함께 본다.</p>
    <div class="list">${rows.map(([k, arr]) => {
      const ts = {}; arr.forEach(i => (mapsByInc[i.id] || []).forEach(m => ts[m.parent] = (ts[m.parent] || 0) + 1));
      return `<div class="card"><h3>${esc(k)} <span class="sub">· ${arr.length}건</span></h3>
        <div>${arr.sort((a, b) => b.date.localeCompare(a.date)).map(i => `<a href="#/inc/${i.id}">${esc(i.date)} ${esc(i.title)}</a>`).join('<br>')}</div>
        <div style="margin-top:6px">${Object.entries(ts).sort((a, b) => b[1] - a[1]).map(([t, n]) => `${techChip(t)}${n > 1 ? '×' + n : ''}`).join('')}</div></div>`;
    }).join('')}</div>`;
}
function vDaily(){
  const list = docs.filter(d => d.path.startsWith('일일/')).reverse();
  view.innerHTML = `<h1>일일 보고서</h1><p class="sub">${list.length}개</p><div class="list">${list.map(d => {
    const n = incidents.filter(i => i.file === d.path).length;
    return `<a class="card inc" href="#/doc/${enc(d.path)}"><h3>${esc(d.title)}</h3><div class="m">${esc(d.path)} · 사건 ${n}건</div></a>`; }).join('')}</div>`;
}
function vDocs(){
  const groups = [['과거 3년 (연도별 · 총평 · 타임라인)', d => d.path.startsWith('과거3년/')], ['ATT&CK 전술별', d => d.path.startsWith('ATTACK/')], ['기타', d => !/^(과거3년|ATTACK|일일)\//.test(d.path)]];
  view.innerHTML = `<h1>문서</h1>` + groups.map(([n, f]) => `<h2>${n}</h2><div class="list">${docs.filter(f).map(d =>
    `<a class="card inc" href="#/doc/${enc(d.path)}"><h3>${esc(d.title)}</h3><div class="m">${esc(d.path)}</div></a>`).join('')}</div>`).join('');
}
function vDoc(p){
  const d = docs.find(x => x.path === p); if (!d) { view.innerHTML = '<p>문서를 찾을 수 없습니다.</p>'; return; }
  if (needDocs([p], () => vDoc(p))) return;
  seenTerms = new Set();
  const inc = incidents.filter(i => i.file === p);
  view.innerHTML = `<a class="back" href="javascript:history.back()">← 뒤로</a>
    ${inc.length > 1 ? `<div class="card" style="margin-bottom:12px"><strong>이 문서의 사건</strong><br>${inc.map(i => `<a href="#/inc/${i.id}">${esc(i.title)}</a>`).join(' · ')}</div>` : ''}
    <div class="doc">${gl(md(DOC_MD[p]))}</div>`;
  view.querySelectorAll('a[data-rel]').forEach(a => a.onclick = e => {
    e.preventDefault(); const t = resolveDoc(d.path, a.dataset.rel);
    location.hash = t ? '#/doc/' + enc(t) : '#/matrix';
  });
  window.scrollTo(0, 0);
}

function vGuide(){
  view.innerHTML = `<h1>처음이세요?</h1>
    <p class="sub">보안 지식이 없어도 읽을 수 있게 만든 안내입니다. 어려운 말은 밑줄 위에 마우스를 올리면 뜻이 나옵니다.</p>
    <h2>이 화면은 이렇게 읽으세요</h2>
    <div class="card"><div class="kv">
      <b>① 쉽게 말하면</b><span>사건마다 맨 위의 보라색 상자. 무슨 일인지 두세 문장으로 설명합니다.</span>
      <b>② 먼저 할 일</b><span>전문가가 아니어도 할 수 있는 첫 행동입니다. 전체 대응이 아니라 시작점이며, 담당자는 사건 본문의 조치를 보세요.</span>
      <b>③ 왜 일어났나</b><span>주황색 상자. 바로 이유(직접 원인)와 근본 이유(구조적 원인)를 나눠 씁니다.</span>
      <b>④ 침투 경로</b><span>빨간색 상자. 공격자가 어떤 순서로 들어왔는지.</span>
      <b>⑤ 어떻게 조치하나</b><span>초록색 상자. 즉시·단기·장기·탐지 순서로 정리했습니다.</span>
      <b>⑥ ATT&amp;CK 표</b><span>사건 아래 표. 공격 행동에 표준 이름표를 붙인 것입니다.</span></div></div>
    <h2>읽을 때 주의할 점</h2>
    <div class="card"><div class="kv">
      <b>'로그인 없이'</b><span>그 기능에 접속할 수 있는 상태에서, 계정 인증 없이 공격된다는 뜻입니다. 인터넷 어디서나 가능하다는 뜻은 아닙니다.</span>
      <b>패치 ≠ 끝</b><span>패치는 결함을 막을 뿐, 이미 심어진 악성코드·훔친 비밀번호·토큰·키는 그대로일 수 있어 별도로 회수·교체해야 합니다.</span>
      <b>인터넷에서 닫기 ≠ 복구</b><span>추가 침입을 줄일 뿐 이미 침해됐는지는 따로 점검해야 합니다.</span>
      <b>조치마다 범위가 다름</b><span>방화벽(WAF)·망 분리·암호화·2단계 인증은 각각 막는 경로가 다릅니다. 하나만으로 사건 전체를 막지는 못합니다.</span></div></div>
    <h2>얼마나 믿을 수 있나 (근거 표기)</h2>
    <div class="card"><div class="kv">
      <span>${tag('확인')}</span><span>제조사·정부·보안 연구기관이 직접 확인한 내용.</span>
      <span>${tag('보도')}</span><span>언론 보도에 나온 내용. 원문을 직접 확인하지는 못했습니다.</span>
      <span>${tag('추정')}</span><span>공개 자료가 부족해 이 보고서가 추측한 내용.</span>
      <span>${tag('주장')}</span><span>공격자가 주장하는 내용. 사실로 확인된 것이 아닙니다.</span>
      <span>${tag('후보')}</span><span>(ATT&amp;CK 표에서) 아직 관측되지 않았고, 확인되면 적용할 항목.</span></div></div>
    <h2>원인 유형 A~I</h2>
    <div class="card"><div class="kv">${Object.entries(classes).map(([k, v]) => `<b>${k} ${esc(v)}</b><span>${esc(CLS_EASY[k] || '')}</span>`).join('')}</div></div>
    <h2>ATT&amp;CK이 뭐예요?</h2>
    <div class="card"><p style="margin-top:0"><strong>ATT&amp;CK은 '공격자가 쓰는 행동 사전'입니다.</strong> 공격을 단계별 목표인 <strong>전술</strong>과, 그 목표를 이루는 구체적 방법인 <strong>기법</strong>으로 나눠 정리했습니다. 집에 침입하는 것에 빗대면 아래와 같습니다. 모든 공격이 15단계를 다 거치지는 않습니다.</p>
      <div class="flow">${tactics.map((t, n) => `<div class="step"><span class="n">${n + 1}</span><div><strong>${esc(t.ko)}</strong> <span class="sub" style="margin:0">${t.id}</span><br>${esc((tacDesc[t.id] || ['', ''])[0])} <span class="sub" style="margin:0">(비유: ${esc((tacDesc[t.id] || ['', ''])[1])})</span></div></div>`).join('')}</div>
      <p class="sub" style="margin-bottom:0">예) 전술 <strong>초기접근</strong>(문으로 들어오기)을 이루는 기법 중 하나가 <a href="#/matrix/T1190">T1190 인터넷에 열린 서비스의 취약점 공격</a>입니다.</p></div>
    <p class="sub"><a href="#/glossary">용어집 보기</a> · <a href="#/matrix">ATT&amp;CK 매트릭스 보기</a> · <a href="#/korea">국내 소식 보기</a></p>`;
}
function vKorea(){
  const kr = incidents.filter(i => i.region.includes('한국')).sort((a, b) => b.date.localeCompare(a.date));
  const cats = ['전체', ...new Set(news.map(n => n.cat))];
  const cur = state.ncat || '전체';
  const list = news.filter(n => cur === '전체' || n.cat === cur);
  view.innerHTML = `<h1>국내 소식</h1>
    <p class="sub">한국에서 일어난 사건과 국내 뉴스를 따로 모았습니다. 뉴스는 기사를 옮긴 것이 아니라 요약한 것이니, 자세한 내용은 출처 링크에서 확인하세요.</p>
    <h2 style="margin-top:8px">국내 주요 사건 (${kr.length}건)</h2>
    <div class="list">${kr.slice(0, state.krN).map(incCard).join('') || '<p class="sub">아직 없습니다.</p>'}</div>
    ${moreBtn(kr.length - state.krN, 'kr')}
    <h2>뉴스 브리핑 (${list.length}건)</h2>
    <div class="filters">${cats.map(c => `<button class="pill ${c === cur ? 'on' : ''}" data-nc="${esc(c)}">${esc(c)}</button>`).join('')}</div>
    <div class="news">${list.slice(0, state.nwN).map(n => `<div class="item"><div class="sub" style="margin:0">${esc(n.date)} · ${tag(n.cat, 'mute')} · ${esc(n.src)}</div>
      <div>${esc(n.sum)}</div>
      <div style="font-size:13px"><a href="${esc(n.url)}" target="_blank" rel="noopener">원문 보기 ↗</a>${n.rel && incById[n.rel] ? ` · 관련 사건: <a href="#/inc/${n.rel}">${esc(incById[n.rel].title)}</a>` : ''}</div></div>`).join('') || '<p class="sub">없습니다.</p>'}</div>
    ${moreBtn(list.length - state.nwN, 'nw')}`;
  view.querySelectorAll('[data-nc]').forEach(b => b.onclick = () => { state.ncat = b.dataset.nc; state.nwN = PAGE; vKorea(); });
  view.querySelectorAll('[data-more]').forEach(b => b.onclick = () => { state[b.dataset.more + 'N'] += PAGE; vKorea(); });
}
function vGlossary(){
  const q = (state.gq || '').toLowerCase();
  view.innerHTML = `<h1>용어집</h1><p class="sub">${glossary.length}개 · 보고서와 사건 화면에서 이 용어가 처음 나오면 밑줄로 표시됩니다.</p>
    <div class="filters"><input id="gq" type="search" value="${esc(state.gq || '')}" placeholder="용어 검색" aria-label="용어 검색" style="padding:8px 12px;border:1px solid var(--border);border-radius:8px;background:var(--panel);color:var(--text);min-width:240px"></div>
    <table class="mtable"><thead><tr><th style="width:170px">용어</th><th>쉬운 설명</th></tr></thead><tbody>${glossary.filter(([t, d]) => !q || (t + d).toLowerCase().includes(q)).map(([t, d]) =>
      `<tr><td><strong>${esc(t)}</strong></td><td>${esc(d)}</td></tr>`).join('')}</tbody></table>`;
  const el = $('#gq');
  el.oninput = e => { state.gq = e.target.value; vGlossary(); const n = $('#gq'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); };
}

// ── 라우터 ──
function route(hash){
  const h = decodeURIComponent((hash == null ? location.hash : hash).replace(/^#\/?/, '')) || 'home';
  const [k, ...rest] = h.split('/'); const arg = rest.join('/');
  document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('on', a.dataset.k === (k === 'inc' ? 'timeline' : k === 'doc' ? (arg.startsWith('일일/') ? 'daily' : 'docs') : k)));
  if (k !== 'matrix') closeDrawer();
  ({ home: vHome, timeline: vTimeline, matrix: () => vMatrix(arg), actors: vActors, daily: vDaily, docs: vDocs, guide: vGuide, korea: vKorea, glossary: vGlossary,
     inc: () => vInc(arg), doc: () => vDoc(arg) }[k] || vHome)();
}
view.addEventListener('click', e => { const c = e.target.closest('[data-inc]'); if (c && !e.target.closest('a')) location.hash = '#/inc/' + c.dataset.inc; });
addEventListener('hashchange', () => route());
window.go = route; // 콘솔에서 go('#/matrix/T1190') 처럼 직접 이동 가능
$('#q').addEventListener('input', e => { state.q = e.target.value; state.tlN = PAGE; if (!/^#\/timeline/.test(location.hash)) location.hash = '#/timeline'; else vTimeline(); });
const root = document.documentElement;
try { const t = localStorage.getItem('theme'); if (t) root.dataset.theme = t; } catch (e) {}
$('#theme').onclick = () => {
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme:dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('theme', root.dataset.theme); } catch (e) {}
};
route();
})();
</script>
