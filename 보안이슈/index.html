도 | [2026-10-06-국내보충.md](../일일/2026-10-06-국내보충.md) |\n| 2026-10-04 | 서울사이버대 개인정보 유출 | 개인정보 유출 | 미귀속 | 보도 | [2026-10-06-국내보충.md](../일일/2026-10-06-국내보충.md) |\n| 2026-10-04 | Citrix NetScaler SAML CVE-2026-88779 | 엣지 장비 취약점 | 미귀속 | 확인 | [2026-10-06.md](../일일/2026-10-06.md) |\n| 2026-10-05 | 덴마크 CPR(주민등록부) 대량 조회 | 서드파티 접근 권한 오남용 | 미확인 | 보도 | [2026-10-06.md](../일일/2026-10-06.md) |\n| 2026-10-06 | ASOS 침해 주장과 인정된 개인정보 유출 | 서드파티 플랫폼 무단 접근 | 'Xuanye group' 자칭 | 보도 | [2026-10-07.md](../일일/2026-10-07.md) |\n"},{"path":"과거3년/2023-Q4.md","title":"2023년 4분기 (2023-10 ~ 2023-12) 주요 사건","md":"# 2023년 4분기 (2023-10 ~ 2023-12) 주요 사건\n\n> 작성 형식: 개요 → 왜 일어났나(직접·구조적 원인) → 침투 경로 → 어떻게 조치하나(즉시·단기·장기·탐지) → 교훈.\n> 근거 표기: **확인**(벤더·정부·연구기관 직접 확인) / **보도**(2차 보도 다수) / **추정**(공개 자료에 없어 본 보고서가 추정). **조치는 본 보고서의 권고**이며 벤더 공식 지침이 아니다. ATT&CK 매핑은 `../ATTACK/매핑.psv`에 있다(v19.2 기준). '구조적 원인'은 본 보고서의 분석이며 확인된 사실이 아니다. 모든 '즉시' 조치는 증거(로그·메모리·디스크·클라우드 감사 기록)를 보존한 뒤 수행하고, 침해된 장비·계정에서 새 비밀을 발급하지 않는다.\n\n### [INC-2023-10-okta] Okta 고객지원 시스템 침해\n> 날짜: 2023-10-20 · 유형: 서드파티·신원(IdP) · 행위자: 미귀속 · 지역: 글로벌 · 근거: 확인\n\n**쉽게 말하면**: 로그인 서비스 회사(Okta)의 고객지원 창구에 올라온 '문제 해결용 파일' 안에 로그인 상태 정보가 들어 있었고, 공격자가 이를 훔쳐 다른 회사 시스템에 몰래 들어갔습니다. 비밀번호가 아니라 '이미 로그인했다는 표시'를 훔친 사건입니다.\n\n**먼저 할 일(초보용)**: 지원팀의 공식 민감정보 제거 절차를 따라 파일에서 로그인 정보(쿠키·토큰)를 지우고, 남지 않았는지 확인한 뒤 보내세요. 유출이 의심되면 로그인 세션을 모두 끊습니다.\n\n**개요**: 2023-09-28 ~ 10-17 사이 공격자가 Okta 고객지원 시스템에서 고객 134곳 관련 지원 파일에 접근했다(세션 하이재킹이 확인된 고객은 5곳, Okta 보고). 고객이 문제 해결 때 올린 HAR 파일에는 쿠키와 세션 토큰이 들어 있었고, 이 토큰으로 1Password, BeyondTrust, Cloudflare 같은 고객 환경에 접근이 시도되거나 성공했다.\n\n**왜 일어났나**\n- 직접 원인: 서비스 계정 자격 증명이 직원의 개인 Google 계정에 저장된 사실이 확인됐다(직원이 회사 노트북 Chrome에 개인 프로필로 로그인한 채 서비스 계정을 사용). 개인 계정·기기의 침해가 유력한 노출 경로로 제시됐으나 **최초 탈취 경로가 확정된 것은 아니다**(Okta 조사 결과, 2차 보도).\n- 구조적 원인(분석): (1) 지원 시스템이 세션 토큰이 담길 수 있는 HAR를 원문 그대로 보관 (2) 서비스 계정 권한이 넓었을 가능성 (3) 관리 기기에서 개인 계정 동기화를 막지 않음 (4) HAR 업로드 때 민감값을 제거하지 않는 업계 관행\n\n**침투 경로**: 개인 Google 계정·기기 → 서비스 계정 자격 증명 → 지원 케이스 시스템 로그인 → HAR 열람 → 세션 토큰 확보 → 고객 IdP·관리 콘솔 세션 하이재킹\n\n**어떻게 조치하나**\n- 즉시: HAR 등 지원 파일에 포함됐을 수 있는 세션 토큰 폐기, 관리자 세션 강제 종료, 최근 관리 콘솔 변경 이력 감사\n- 단기: HAR·로그를 지원 채널에 올리기 전 쿠키·Authorization 헤더 마스킹, 지원 시스템에서 업로드 파일 자동 정제, 서비스 계정 권한 최소화, 관리 브라우저에서 개인 프로필 로그인·비밀번호 동기화 차단\n- 장기: 관리자 세션 토큰을 기기·IP에 바인딩, 관리자 접근에 피싱 저항 MFA(FIDO2. 단, 이미 발급된 세션의 재사용은 막지 못하므로 세션 폐기·재인증·바인딩을 병행), 지원 데이터 보존기간 단축\n- 탐지: 같은 세션 토큰이 다른 IP·ASN에서 재사용, 관리 콘솔의 신규 API 토큰·관리자 생성 이벤트\n\n**교훈**: 신원 공급자(IdP)의 공급망 하나가 하위 고객 수백 곳의 관리 권한으로 이어진다. \"로그 파일은 비밀이다.\"\n\n### [INC-2023-10-citrixbleed] Citrix Bleed (CVE-2023-4966) 대량 악용\n> 날짜: 2023-10-10 · 유형: 엣지 장비 취약점 · 행위자: LockBit 계열 제휴자 외 · 지역: 글로벌 · 근거: 확인\n\n**쉽게 말하면**: 회사 원격 접속 장비(Citrix)의 결함 때문에 '이미 로그인한 사람의 증표'가 밖으로 새어 나왔고, 공격자는 그 증표로 비밀번호와 2단계 인증 없이 들어왔습니다.\n\n**먼저 할 일(초보용)**: 장비를 업데이트한 뒤 접속 중인 세션을 모두 끊고 비밀번호도 바꾸세요. 업데이트만으로는 이미 훔친 증표가 남습니다.\n\n**개요**: NetScaler ADC/Gateway의 정보 노출 취약점이 대량 악용됐다. CISA 등의 공동 권고는 LockBit 3.0 제휴자의 이 취약점 악용과 Boeing(부품·유통 사업, 약 40GB 유출) 침해를 확인했다. ICBC 미국 법인(미 국채 시장 거래에 지장), DP World 호주, Allen & Overy는 같은 취약점과의 관련성이 보도된 사례다.\n\n**왜 일어났나**\n- 직접 원인: 조작된 요청이 장비 메모리의 세션 토큰을 그대로 돌려주는 결함. 이미 인증을 마친 세션을 가로채므로 MFA를 거치지 않는다. 공개(10/10) 이전부터 악용됐다는 보고가 있다(연구기관 보고, 원문 미확인).\n- 구조적 원인: (1) VPN·게이트웨이가 인터넷에 직접 노출 (2) **패치해도 이미 탈취된 세션이 계속 유효** (3) 장비 내부에는 EDR이 없어 침해를 알기 어려움 (4) 대형 조직도 패치 지연\n\n**침투 경로**: 노출된 NetScaler → 메모리 누수 요청으로 세션 토큰 수집 → 인증된 사용자로 접속(MFA 우회) → 내부망 이동 → 데이터 탈취·랜섬웨어\n\n**어떻게 조치하나**\n- 즉시: 패치 적용 **후** 활성·지속 세션을 모두 강제 종료(패치만으로는 탈취된 세션이 남는다). 세션 토큰·장비에 저장된 자격 증명 교체\n- 단기: 장비 로그로 비정상 세션 재사용(같은 세션이 다른 IP), 장비 내 웹셸·설정 변경·잔존 지속성과 내부 이동 조사. 침해 정황이 있으면 재구축. 자격 증명 교체는 세션 종료를 대신하지 못한다\n- 장기: 원격 접속 게이트웨이 앞단 관리면 분리, ZTNA·세션 기기 바인딩 도입, 엣지 장비 패치 SLA(예: 악용 확인 후 72시간)를 정책화\n- 탐지: 인증 이벤트 없이 생성된 세션, 로그인 이후 다른 IP·UA로 요청이 이어지는 패턴\n\n**교훈**: 패치 = 끝이 아니다. 세션·자격 증명 회수까지 해야 한다. 같은 제품이 2026-09에도 제로데이로 다시 나왔다(오늘 보고서 참조).\n\n---\n\n## 기타 2023-Q4 사건 (요약, 2차 자료 기준)\n\n| 날짜 | 사건 | 유형·원인 한 줄 | 근거 |\n|------|------|----------------|------|\n| 2023-11 | ICBC 미국 법인 랜섬웨어 | Citrix Bleed 악용과의 관련성 보도, LockBit, 국채 시장 거래 지연 | 보도 |\n| 2023-12 | 우크라이나 Kyivstar 코어망 파괴 | 와이퍼, Sandworm 연계 주장. 침투 시작·서비스 장애·발표일이 자료마다 달라 구분 필요 | 보도(일자 불일치) |\n"},{"path":"과거3년/2024.md","title":"2024년 주요 사건","md":"# 2024년 주요 사건\n\n> 형식과 근거 표기는 [2023-Q4.md](2023-Q4.md)와 같다. 조치는 본 보고서의 권고다. ATT&CK 매핑은 `../ATTACK/매핑.psv` (v19.2).\n\n### [INC-2024-01-ivanti] Ivanti Connect Secure 제로데이 (CVE-2023-46805 + CVE-2024-21887)\n> 날짜: 2024-01-10 · 유형: 엣지 장비 취약점 · 행위자: UNC5221(중국 연계 의심) · 지역: 글로벌 · 근거: 확인\n\n**쉽게 말하면**: 회사 VPN 장비(Ivanti)의 결함 두 개를 이어 붙이면 로그인 없이 장비를 조종할 수 있었고, 실제로 많은 장비가 공격당했습니다.\n\n**먼저 할 일(초보용)**: 제조사의 임시 조치와 업데이트를 적용하고, 의심되면 장비를 초기화한 뒤 그 장비에 저장된 비밀번호를 모두 바꾸세요.\n\n**개요**: SSL VPN 장비에서 인증 우회(CVE-2023-46805)와 명령 주입(CVE-2024-21887)을 연쇄해 인증 없이 원격 코드 실행이 가능했다. 약 1,700대 이상이 침해됐다는 2차 자료가 있다(집계 기관·기준 미확인). UNC5221은 초기 악용 일부의 귀속이며 이후의 대규모 악용 전체를 뜻하지 않는다.\n\n**왜 일어났나**\n- 직접 원인: 인증 우회로 관리 경로에 접근한 뒤 입력 검증이 부족한 기능에 명령을 주입.\n- 구조적 원인: 인터넷 노출 VPN, 패치 전 완화책(XML)에 의존, 장비 무결성 점검 도구가 우회되는 사례. 침해된 VPN 장비가 로그인 자격 증명을 가로채는 용도로 쓰였다는 분석이 있다(Mandiant 보고, 원문 미확인).\n\n**침투 경로**: 노출된 VPN 장비 → 두 취약점 연쇄로 RCE → 웹셸 → 로그인 페이지 변조로 자격 증명 수집 → 내부망 이동\n\n**어떻게 조치하나**\n- 즉시: 격리·증거 보존 후 벤더 완화책·패치 적용. 침해 의심 장비는 공식 절차에 따른 초기화·패치(CISA ED 24-01 추가 지침, 2024-01-31. 연방 민간기관 대상 의무이며 일반 조직은 참고. 원문 미확인)\n- 단기: 장비에 저장된 자격 증명·인증서·키 전체 교체, 외부 무결성 검사 도구 실행(검사 결과가 '이상 없음'이어도 비침해로 단정하지 않는다), VPN 계정 비밀번호 초기화\n- 장기: VPN 관리면 비노출, 엣지 장비 로그 외부 보존, 악용이 보고된 장비는 패치 대기 중에도 격리 가능한 구조\n- 탐지: 로그인 페이지 파일·JS 변조, 장비에서 시작되는 비정상 아웃바운드\n\n**교훈**: 침해된 VPN은 \"자격 증명 수집기\"가 된다. 패치 후에도 자격 증명을 교체해야 한다.\n\n### [INC-2024-01-midnight] Microsoft 사내 메일 침해 (Midnight Blizzard)\n> 날짜: 2024-01-19 · 유형: 신원·클라우드 · 행위자: Midnight Blizzard(러시아 국가 지원, Microsoft 귀속) · 지역: 글로벌 · 근거: 확인\n\n**쉽게 말하면**: 마이크로소프트가 잊고 있던 '테스트용 계정'에 2단계 인증이 꺼져 있었고, 공격자가 흔한 비밀번호를 여러 계정에 시도하는 방식(비밀번호 추측 공격)으로 들어온 뒤 거기서 핵심 계정으로 번져 임원 메일을 읽었습니다.\n\n**먼저 할 일(초보용)**: 테스트·옛 계정에도 2단계 인증을 켜고, 쓰지 않는 앱과 계정을 정리하세요.\n\n**개요**: 2023-11 말 시작해 2024-01-12 탐지. 공격자가 Microsoft 임원·보안·법무 직원의 메일을 읽었다.\n\n**왜 일어났나**\n- 직접 원인: MFA가 꺼진 **레거시 비운영 테스트 테넌트** 계정에 패스워드 스프레이 성공. 그 계정이 가진 테스트용 OAuth 앱이 운영 환경에 높은 권한을 갖고 있었다.\n- 구조적 원인: (1) 방치된 테스트 테넌트·계정 (2) MFA 예외 (3) OAuth 앱 권한 과다와 소유자 점검 부재 (4) 앱 권한(Exchange `full_access_as_app`)을 스스로 부여할 수 있는 구조\n\n**침투 경로**: 패스워드 스프레이(주거용 프록시 사용) → 테스트 테넌트 계정 → 레거시 OAuth 앱 → 악성 OAuth 앱 생성·권한 부여 → 임원 메일함 읽기\n\n**어떻게 조치하나**\n- 즉시: 의심 OAuth 앱·서비스 주체 폐기, 자격 증명 교체, 메일 접근 감사\n- 단기: 모든 테넌트의 사용자 계정(테스트 포함)에 MFA 예외 0건, 서비스 주체·앱은 MFA 대신 권한 범위·인증서/비밀 수명·접근 조건으로 통제, OAuth 앱 권한 전수조사, 미사용 앱 삭제\n- 장기: 앱 권한 부여를 승인 흐름에 연결, 테스트 환경을 운영과 권한 분리, 비인가 앱 동의 차단\n- 탐지: 신규 OAuth 앱 생성·관리자 동의, `full_access_as_app` 부여, 단일 IP에서 다수 계정 로그인 실패 후 성공, 비대화형 로그인·EWS 호출 급증\n\n**교훈**: 공격자는 가장 약한 테넌트에서 시작한다. 테스트 환경이 곧 운영 환경의 입구다.\n\n### [INC-2024-02-changehc] Change Healthcare 랜섬웨어 (ALPHV/BlackCat)\n> 날짜: 2024-02-21 · 유형: 신원·랜섬웨어 · 행위자: ALPHV/BlackCat · 지역: 미국 · 근거: 확인\n\n**쉽게 말하면**: 미국 의료비 청구 회사의 원격 접속 화면에 2단계 인증이 없었습니다. 훔친 비밀번호 하나로 들어와 9일 뒤 랜섬웨어로 서비스를 멈췄고, 병원과 약국의 업무가 마비됐습니다.\n\n**먼저 할 일(초보용)**: 회사 바깥에서 들어오는 모든 로그인에 2단계 인증을 켜세요.\n\n**개요**: 미국 의료 청구·결제 처리가 장기간 마비됐다. 영향받은 개인은 최종 약 1억 9,270만 명(2025-07 보고), 모회사는 랜섬 2,200만 달러를 지급한 것으로 알려졌다.\n\n**왜 일어났나**\n- 직접 원인: **MFA가 없는 Citrix 원격 접속 포털**에 탈취된 직원 자격 증명으로 로그인(UnitedHealth CEO 의회 증언). 자격 증명을 최초에 어떻게 탈취했는지는 별도 확인이 필요하다.\n- 구조적 원인: (1) 외부 포털에 MFA가 일관되게 적용되지 않음(인수·통합 과정의 문제인지는 근거 없음, 추정) (2) 단일 자격 증명으로 내부 이동이 가능한 구조 (3) 의료 청구 허브에 대한 집중도(단일 장애점) (4) 침입 9일 뒤에야 랜섬웨어 실행 — 그 사이를 못 잡음\n\n**침투 경로**: 탈취된 자격 증명 → Citrix 포털(MFA 없음) → 내부 이동 → 데이터 탈취 → 9일 뒤 랜섬웨어 배포\n\n**어떻게 조치하나**\n- 즉시: 모든 외부 접근 포털에 MFA 강제, 해당 계정 비밀번호 교체, 원격 접속 로그에서 비정상 로그인 소급 점검\n- 단기: 외부 노출 서비스 전수 목록화, MFA 미적용 예외 제거, 백업 격리 확인, 포털 로그인 이후 내부 이동 탐지와 관리자 권한 분리, 청구·처방 등 핵심 서비스의 대체 업무 절차와 복구 검증\n- 장기: 인수합병 시스템의 통제 수준 일치, 핵심 허브 이중화, 데이터 탈취 탐지(대량 아웃바운드)\n- 탐지: 평소와 다른 시간·지역의 원격 접속, 침입 후 내부 정찰, 대용량 외부 전송\n\n**교훈**: MFA 한 개 빠진 포털 하나가 국가 단위 장애가 됐다.\n\n### [INC-2024-03-xz] XZ Utils 백도어 (CVE-2024-3094)\n> 날짜: 2024-03-29 · 유형: 공급망(오픈소스) · 행위자: 가명 \"Jia Tan\"(미귀속) · 지역: 글로벌 · 근거: 확인\n\n**쉽게 말하면**: 리눅스에 널리 쓰이는 압축 프로그램에 누군가 2년에 걸쳐 신뢰를 쌓은 뒤 몰래 '뒷문'을 심었습니다. 한 개발자가 속도 이상을 눈치채서 큰 피해는 막았습니다.\n\n**먼저 할 일(초보용)**: 영향 버전(5.6.0·5.6.1)을 쓰는지 확인하고 안전한 버전으로 바꾸세요.\n\n**개요**: 압축 라이브러리 liblzma 5.6.0·5.6.1에 특정 빌드·연결 조건에서 sshd 인증을 우회할 수 있는 백도어가 삽입됐다. Andres Freund가 sshd의 이상한 CPU 사용을 이상하게 여겨 발견했다.\n\n**왜 일어났나**\n- 직접 원인: 약 2년간 신뢰를 쌓은 가명의 공동 유지보수자가 난독화된 테스트 파일에 페이로드를 숨기고 빌드 스크립트로 풀어 넣었다. 압력용 가짜 계정이 원 유지보수자에게 후임 지정을 재촉했다는 정황(보도).\n- 구조적 원인: (1) 1인 자원봉사 유지보수 프로젝트가 핵심 인프라 (2) 릴리스 tarball과 저장소 소스가 달라도 검증하지 않는 관행 (3) 간접 의존성(systemd → liblzma → sshd) 가시성 부족\n\n**침투 경로**: 신뢰 구축 → 유지보수 권한 획득 → 난독화된 페이로드 삽입 → 일부 배포판 개발·테스트 채널(Debian/Fedora 등) → 특정 조건에서 sshd 인증 우회. **광범위한 안정판 확산 전에 우연히 발견돼 대규모 피해를 피함.**\n\n**어떻게 조치하나**\n- 즉시: 5.6.0/5.6.1 사용 여부 점검, 5.4.x로 다운그레이드 또는 신뢰 가능한 패치 배포판으로 교체하고 sshd 등 관련 프로세스 재시작, 노출 환경 침해 조사\n- 단기: SBOM으로 liblzma 의존성 추적, 빌드 시 소스 저장소와 릴리스 아티팩트 비교\n- 장기: 핵심 오픈소스의 유지보수자 신원·권한 변경 모니터링, 재현 가능 빌드(reproducible build), 의존성 업데이트에 대한 이상 징후(성능 저하·새 바이너리 블롭) 검토. SBOM·재현 가능 빌드는 악성 소스 자체의 정당성을 보장하지 못하므로 코드 리뷰·유지보수 권한 변경 감시와 병행\n- 탐지: sshd 로그인 지연·CPU 이상, 라이브러리 로드 체인 변경\n\n**교훈**: 코드가 아니라 **사람(유지보수자) 신뢰**가 공격 표면이었다.\n\n### [INC-2024-04-panos] Palo Alto PAN-OS GlobalProtect 제로데이 (CVE-2024-3400)\n> 날짜: 2024-04-12 · 유형: 엣지 장비 취약점 · 행위자: UTA0218 · 지역: 글로벌 · 근거: 확인\n\n**쉽게 말하면**: 회사 방화벽·VPN 장비(Palo Alto)의 입력 처리 결함 때문에 로그인 없이 관리자 권한으로 명령을 실행할 수 있었습니다.\n\n**먼저 할 일(초보용)**: 업데이트와 제조사 지침을 적용하고, 장비 안에 저장된 비밀번호를 바꾸세요.\n\n**개요**: GlobalProtect 게이트웨이의 명령 주입으로 인증 없이 방화벽 root 코드 실행. 2024-03-26부터 악용된 것으로 분석됐고(Unit 42), Volexity가 4/10 악용을 탐지했으며 벤더 공개는 4/12다. 일부 피해 장비에서 파이썬 백도어 UPSTYLE, 터널링 도구 GOST 설치, 설정 파일 유출, 로그 삭제가 관찰됐으며 피해 수준은 장비마다 달랐다.\n\n**왜 일어났나**\n- 직접 원인: 입력 검증 부족으로 세션 ID 처리 경로에 명령 주입. GlobalProtect 게이트웨이와 장비 텔레메트리 기능이 함께 켜져 있을 때 영향(초기 설명). 이후 안내가 정정되어 텔레메트리 비활성화만으로는 충분한 완화가 아니라고 알려졌다(원문 미확인).\n- 구조적 원인: 방화벽·VPN이 인터넷 접점이면서 EDR이 없음. 패치 공개 전 제로데이 기간이 존재.\n\n**침투 경로**: 노출된 게이트웨이 → 명령 주입으로 root 실행 → UPSTYLE 백도어 → 설정(자격 증명 포함) 탈취 → GOST로 내부망 진입\n\n**어떻게 조치하나**\n- 즉시: 패치와 벤더 완화책 적용, 침해 점검(Unit 42 지침), 장비 내 설정에 저장된 자격 증명·인증서 교체\n- 단기: 장비에서 외부로 나가는 통신 제한, 비정상 파일(.pth 등) 점검, 침해 수준별 재이미징 판단, cron·비정상 프로세스·외부 연결 조사, 설정 파일의 웹 경로 복사 탐지\n- 장기: 방화벽 관리·GlobalProtect 표면 최소화, 제로데이 대비 격리 절차(임시 비활성화) 문서화\n- 탐지: 장비의 비정상 아웃바운드·신규 프로세스·로그 삭제\n\n**교훈**: 보안 장비도 취약하다. 장비 설정에 담긴 비밀은 침해 시 모두 유출된 것으로 보라.\n\n### [INC-2024-05-snowflake] Snowflake 고객 계정 대량 침해 (UNC5537)\n> 날짜: 2024-05 · 유형: 신원·클라우드 · 행위자: UNC5537 · 지역: 글로벌 · 근거: 확인\n\n**쉽게 말하면**: 클라우드 데이터 서비스(Snowflake) 자체가 뚫린 것이 아니라, 정보 탈취 악성코드 등으로 고객 쪽 직원·외주 PC 등에서 비밀번호가 유출됐습니다. 2단계 인증이 없던 계정들이 그대로 로그인당했습니다.\n\n**먼저 할 일(초보용)**: 모든 클라우드 계정에 2단계 인증을 켜고, 오래된 비밀번호를 바꾸세요. 감염이 의심되는 PC는 격리한 뒤 안전한 기기에서 바꿔야 새 비밀번호도 털리지 않습니다.\n\n**개요**: 2024-04 ~ 06 사이 Mandiant는 약 165개 잠재 노출 조직에 통지했고, 그중 일부에서 대량 유출이 확인됐다. Ticketmaster(약 5억 6천만 건 규모, 공격자·보도 수치), AT&T(통화·문자 메타데이터, 약 1억 1천만 가입자 규모이며 통화 내용은 아님), Santander, Advance Auto Parts, Neiman Marcus 등. AT&T는 약 37만 달러를 지급해 삭제 약속을 받았다는 보도가 있다.\n\n**왜 일어났나**\n- 직접 원인: Snowflake 플랫폼 취약점이 아니라, **인포스틸러(Vidar·RISEPRO·LummaC2)가 훔친 자격 증명**으로 **MFA가 없는** 고객 테넌트에 직접 로그인. 일부 자격 증명은 2020년 감염분이었다.\n- 구조적 원인: (1) 고객 테넌트에 MFA 강제 기능이 없거나 기본 꺼짐 (2) 자격 증명 만료·교체 안 함 (3) 네트워크 허용 목록 부재 (4) 계약사·외주 PC에서 인포스틸러 감염\n\n**침투 경로**: 인포스틸러 감염 PC(주로 외주·개인 기기) → 로그 마켓에서 자격 증명 확보 → MFA 없는 Snowflake 로그인 → 대량 조회·내보내기 → 공갈\n\n**어떻게 조치하나**\n- 즉시: SaaS·DB 접근 계정에 MFA 강제, 오래된 자격 증명 폐기·교체, 비정상 대량 쿼리 소급 점검\n- 단기: 접속 허용 IP·네트워크 정책, 다크웹 자격 증명 노출 모니터링, 외주·BYOD 기기 EDR\n- 장기: 장기 자격 증명 제거(SSO·단기 토큰), SaaS 계정 연합 인증 강제, 대량 데이터 반출 경보\n- 탐지: 처음 보는 IP·클라이언트(예: FrostyBite 같은 비표준 도구)로의 로그인, 단시간 대량 SELECT·COPY\n\n**교훈**: 공격자는 **취약점 없이 로그인**했다. 가장 큰 유출이 약한 로그인 한 줄에서 시작됐다.\n\n### [INC-2024-05-court-kr] 한국 법원 전산망 해킹 (Lazarus)\n> 날짜: 2024-05-10 · 유형: 국가 지원 APT·정보 탈취 · 행위자: Lazarus(북한) · 지역: 한국 · 근거: 보도\n\n**쉽게 말하면**: 북한 해킹 조직이 한국 법원 전산망에 2년 넘게 머물며 1,014GB를 외부로 보냈습니다. 어떤 자료인지 확인된 것은 일부뿐입니다.\n\n**먼저 할 일(초보용)**: 로그를 오래 보관하고, 서버에서 밖으로 나가는 큰 데이터 전송을 감시하세요.\n\n**개요**: 2021-01 이전부터 2023-02까지 약 2년간 법원 전산망에 침투해 1,014GB를 외부로 전송했다. 복원된 서버 1대에서 개인회생 관련 문서 5,171건(4.7GB, 주민등록번호·계좌번호 포함)이 확인됐고, 나머지 1,009GB(전송량의 99.6%)는 내용을 확인하지 못했다(피해자·개인정보 비율이 아님). 2024-05 수사 결과 발표.\n\n**왜 일어났나**\n- 직접 원인: 초기 침투 방법은 공개 자료에서 확인되지 않는다. 귀속은 악성 프로그램 유형, 가상자산으로 결제한 임대 서버 내역, IP로 수사당국이 판단했다.\n- 피해 확대·조사 제한 요인(분석): (1) 약 2년의 침해 기간 동안 탐지 실패 (2) 유출 내용을 대부분 확인하지 못할 만큼의 로그·감사 한계 (3) 사법 행정망의 민감정보 집중\n\n**침투 경로**: (미공개) → 내부 서버 장악 → 자료 수집 → 외부 서버 8대로 전송\n\n**어떻게 조치하나**\n- 즉시: 침해 서버 격리·포렌식, 노출 가능 개인정보 대상 통지·보이스피싱 주의 안내\n- 단기: 네트워크 전송 로그 보존 확대, 계정·DB·파일 접근 로그 중앙 보존, 서버 간 통신 기준선 구축, 대용량 외부 전송 경보와 내부 대량 조회·압축의 상관분석, 저속·분산 유출 탐지\n- 장기: 민감 문서 저장소 암호화·접근 로그, 망 분리 구조 재검토, 장기 침해 대비 위협 헌팅 정례화\n- 탐지: 내부 서버의 대량 외부 전송, 가상자산 결제 임대 서버 대역(IOC) 통신\n\n**교훈**: \"무엇이 나갔는지조차 모르는\" 상태가 가장 위험하다. 로그 보존이 곧 피해 규모 산정 능력이다.\n\n### [INC-2024-10-salttyphoon] Salt Typhoon 통신사 침해\n> 날짜: 2024-10 · 유형: 국가 지원 APT·통신 · 행위자: Salt Typhoon(중국 MSS 연계) · 지역: 글로벌 · 근거: 확인\n\n**쉽게 말하면**: 중국 연계 조직이 통신사 장비의 '이미 알려졌지만 고치지 않은 결함'을 주로 이용해 들어가 통화 기록과 위치 정보를 오랫동안 엿봤습니다.\n\n**먼저 할 일(초보용)**: 네트워크·통신 장비도 알려진 결함은 바로 고치고, 장비 관리용 접속 경로를 따로 분리하세요.\n\n**개요**: 미국 주요 통신사(AT&T, Verizon, T-Mobile, Lumen 등)를 포함해 통신·정부·숙박·운송·군 네트워크를 장기간 침해했다. 2025-08 13개국이 공동 권고를 냈다. 통화·문자 메타데이터, 위치 정보, 일부 통화 녹음 접근이 알려졌고, 2026-04 FBI 감시 시스템 사건에서도 이 그룹이 지목됐다(추정).\n\n**왜 일어났나**\n- 직접 원인(2025-08 13개국 공동 권고의 관측 범위): **공개된 알려진 취약점**이 주 침투 경로였고 제로데이는 관측되지 않았다. 권고가 다루는 활동은 Salt Typhoon 등 공개 추적명과 부분적으로 겹친다. 대표 CVE: Ivanti CVE-2024-21887, PAN-OS CVE-2024-3400, Cisco IOS XE CVE-2023-20198/20273, Cisco IOS CVE-2018-0171.\n- 구조적 원인: (1) 통신사 코어·엣지 장비 패치 지연(2018년 CVE 포함) (2) 장비에 EDR·로그 부족 (3) 사업자 간 연동망을 통한 하위 이동 가능 (4) 합법 감청(CALEA) 시스템이라는 고가치 표적\n\n**침투 경로**: 알려진 CVE로 엣지 장비 접근 → 특권 계정 생성·ACL 변경 → 비정상 고포트 원격 관리·SSH 리스너(IOS XR 57722) → SPAN/RSPAN/ERSPAN 트래픽 미러링 + TACACS+ 패킷으로 관리자 자격 증명 수집 → 사업자 간 링크로 하위 이동 → GRE/IPsec 터널로 유출\n\n**어떻게 조치하나**\n- 즉시: 공동 권고의 CVE 목록 기준 패치·구성 점검, 비정상 계정·ACL·고포트 서비스 확인\n- 단기: 관리 프로토콜 암호화(평문 TACACS+ 회피), 관리면 별도망, 장비 구성 변경 이력 감사, 중앙 AAA와 로컬 예외 계정 감사, 침해 의심 장비는 신뢰할 수 있는 이미지·구성으로 복구하고 관리자 비밀 교체\n- 장기: 엣지·코어 장비 수명주기·패치 SLA, 트래픽 미러링 설정 감시, 사업자 간 연동 신뢰 최소화\n- 탐지: 미러링 세션·터널 신규 생성, 비표준 포트 리스너, 구성 변경 이벤트\n\n**교훈**: **오래된 CVE도 해커의 주무기**다. 통신 장비의 \"알려진 취약점 부채\"가 곧 국가 안보 문제다.\n\n### [INC-2024-12-cleo] Cleo 파일 전송 제품 대량 악용 (Cl0p)\n> 날짜: 2024-12-03 · 유형: 엣지·MFT 취약점 · 행위자: Cl0p · 지역: 글로벌 · 근거: 확인\n\n**쉽게 말하면**: 기업이 큰 파일을 주고받을 때 쓰는 소프트웨어(Cleo)의 결함으로 Cl0p 조직이 많은 회사의 파일을 한꺼번에 훔쳤습니다. 한 번 업데이트한 뒤에도 다시 뚫렸습니다.\n\n**먼저 할 일(초보용)**: 당시 기준 수정 버전은 5.8.0.24 이상이며, 지금은 제조사의 최신 보안 버전을 확인해 올리고 인터넷에서 바로 접속되지 않게 막으세요.\n\n**개요**: Cleo Harmony·VLTrader·LexiCom의 CVE-2024-50623(무제한 파일 업로드·다운로드)과 CVE-2024-55956(인증 없는 파일 쓰기, CVSS 9.8)이 악용됐다. Cl0p이 2025-02-14 약 182개 조직을 유출 사이트에 올렸다(공격자 게시이며 확인된 피해 조직 수와 다를 수 있다).\n\n**왜 일어났나**\n- 직접 원인: 10월 수정 버전(5.8.0.21)에서도 12월에 후속 악용이 관측됐고(Huntress), 별도 결함 CVE-2024-55956(분석 출처에 따르면 다른 근본 원인)에 대한 추가 수정(5.8.0.24)이 필요했다.\n- 구조적 원인: (1) MFT 제품이 인터넷에 노출된 채 대량 데이터를 보관 (2) 앞선 MOVEit(2023)·GoAnywhere 때처럼 Cl0p이 MFT 제품을 반복 표적 (3) 패치의 효과를 검증하지 않음\n\n**침투 경로**: 노출된 MFT 서버 → 파일 업로드·쓰기 취약점 → 서버에서 코드 실행 → 보관 파일 대량 탈취 → 공갈\n\n**어떻게 조치하나**\n- 즉시: 5.8.0.24 이상으로 업데이트, 서버 인터넷 직접 노출 제거(VPN·allowlist 뒤), 침해 점검(autorun 디렉터리·신규 파일)\n- 단기: MFT 호스트 격리, 비정상 autorun·파일 생성·Java 자식 프로세스·외부 연결 조사, 연결된 파일 저장소·비밀 점검, MFT에 쌓인 데이터 보존기간 단축·암호화, 서버 로그 외부 보존\n- 장기: 패치 후 \"여전히 악용 가능한가\"를 격리 환경에서 재현 시험(패치 성공이 침해 제거를 뜻하지는 않는다), MFT 제품 이중 방어(WAF·전용 세그먼트)\n- 탐지: MFT 서버의 신규 실행 파일, 비정상 대량 다운로드\n\n**교훈**: 패치 번호가 올랐다고 안전하지 않다. 벤더 권고가 바뀌면 다시 확인한다.\n\n### [INC-2024-12-treasury] 미 재무부 침해 (BeyondTrust, Silk Typhoon)\n> 날짜: 2024-12-02 · 유형: 서드파티·원격 지원 SaaS · 행위자: Silk Typhoon(중국 국가 지원) · 지역: 미국 · 근거: 확인\n\n**쉽게 말하면**: 원격 지원 서비스(BeyondTrust)의 열쇠(API 키)가 털려, 그 열쇠로 미국 재무부 컴퓨터에 원격 접속했습니다.\n\n**먼저 할 일(초보용)**: 원격 지원 도구의 접근 범위를 줄이고, 비밀 키를 정기적으로 바꾸세요.\n\n**개요**: BeyondTrust의 인프라 API 키가 탈취돼 재무부 OFAC 워크스테이션 약 100대, 비기밀 파일 3,000개 이상에 접근했다(재무부 서한을 인용한 보도). BeyondTrust는 12/2 이상 징후를 탐지하고 12/5 키 침해를 확인, 12/8 재무부에 통지했다.\n\n**왜 일어났나**\n- 직접 원인: 벤더 측 API 키 탈취. 이후 조사에서 CVE-2024-12356(명령 주입, CVSS 9.8)과 CVE-2024-12686이 발견됐다. 두 CVE의 발견 사실과 재무부 침해에서의 악용 여부는 구분해야 하며 연결 근거는 확인하지 못했다.\n- 구조적 원인: (1) 원격 지원 SaaS는 고객 환경 전체에 관리 권한을 가짐 (2) 서드파티 키의 수명·범위 통제 부족 (3) 벤더와 고객 양쪽의 가시성 격차\n\n**침투 경로**: BeyondTrust 측 키 탈취 → 키로 고객 Remote Support 인스턴스의 로컬 애플리케이션 계정 비밀번호 재설정 → 원격 지원으로 재무부 워크스테이션 접근 → 문서 열람\n\n**어떻게 조치하나**\n- 즉시: 영향받은 인스턴스 중단·키 폐기·재발급, 원격 지원 세션 이력 감사, 활성 세션 차단과 고객 측에서 재설정된 계정 검증\n- 단기: 원격 지원·RMM 도구의 접근 범위 최소화(필요 시간에만 승인), API 키 주기적 교체\n- 장기: 서드파티 관리 도구에 대한 계약상 침해 통지 SLA, 키를 단기 토큰으로 대체\n- 탐지: 평소 없던 원격 지원 세션, 로컬 관리자 비밀번호 재설정\n\n**교훈**: 원격 관리 도구는 곧 \"합법적인 백도어\"다. 승인된 접근도 감사한다.\n\n---\n\n## 기타 2024 사건 (요약, 2차 자료 기준)\n\n| 날짜 | 사건 | 유형·원인 한 줄 | 근거 |\n|------|------|----------------|------|\n| 2024-05 | Dell 약 4,900만 건 | 레코드 수이며 고유 인원이 아님. 파트너 포털을 이용한 대량 조회 | 보도 |\n| 2024-06 | Synnovis(영국 NHS 병리 검사) | Qilin 랜섬웨어, 수술·검사 1,100건 이상 연기, 400GB 유출 | 보도 |\n| 2024-07 | WazirX 약 2.3억 달러 | 북한 Lazarus 연계 의심 | 보도(추정) |\n| 2024-07-19 | CrowdStrike 업데이트 장애 | **공격이 아닌** 결함 있는 센서 업데이트로 Windows 약 850만 대 장애. 변경 관리·단계적 배포의 교훈 | 확인 |\n| 2024-08 | National Public Data | 약 29억 건(레코드 수이며 고유 인원이 아님) 개인정보 유출 보도, 배경조회 업체 | 보도 |\n| 2024-11 | Blue Yonder(공급망 SW) | Termite 랜섬웨어, 소매업체 다수 영향 | 보도 |\n| 2024-12 | Cisco DevHub 소스·키 | IntelBroker의 4.5TB 탈취 주장(Cisco가 확인한 범위는 별도) | 주장 |\n"},{"path":"과거3년/2025.md","title":"2025년 주요 사건","md":"# 2025년 주요 사건\n\n> 형식과 근거 표기는 [2023-Q4.md](2023-Q4.md)와 같다. 조치는 본 보고서의 권고다. ATT&CK 매핑은 `../ATTACK/매핑.psv` (v19.2).\n\n### [INC-2025-02-bybit] Bybit 약 15억 달러 탈취 (Lazarus)\n> 날짜: 2025-02-21 · 유형: 서드파티·암호화폐 · 행위자: Lazarus(북한, FBI 확인) · 지역: 글로벌 · 근거: 확인\n\n**쉽게 말하면**: 암호화폐 거래소의 큰 이체를 승인하는 사람들이 정상으로 보이는 화면을 보고 승인했는데, 실제로는 공격자가 자산을 빼낼 수 있게 만든 조작된 거래였습니다(약 15억 달러).\n\n**먼저 할 일(초보용)**: 큰 이체는 승인 화면과 다른 경로로 거래 내용을 한 번 더 확인하세요.\n\n**개요**: 암호화폐 거래소 Bybit의 이더리움 콜드 월렛에서 약 15억 달러어치가 빠져나갔다. 역대 최대 규모의 암호화폐 탈취다.\n\n**왜 일어났나**\n- 직접 원인: Bybit이 서명에 쓰는 멀티시그 지갑 서비스 Safe{Wallet}의 **개발자 장비가 침해**돼, 승인 과정이 조작됐다(보도). 포렌식 보고에 따르면 서명자는 정상 화면을 보고 승인했지만 실제로는 공격자가 자산을 빼낼 수 있게 하는 조작된 거래에 서명했다(2차 보도, 세부 원문 미확인).\n- 구조적 원인: (1) 서명자가 화면에 표시된 내용에 의존해 승인하는 구조 (2) 서드파티 지갑 UI·배포 환경에 대한 검증 부족 (3) 거액 이체에 대한 독립 검증·지연 장치 부재\n\n**침투 경로**: 서드파티 개발자 장비 침해 → 지갑 UI·배포 경로 조작 → 서명자의 승인 → 공격자 주소로 이체 → 자금 세탁\n\n**어떻게 조치하나**\n- 즉시: 거래 서명 전 **독립 경로로 거래 내용을 재확인**(하드웨어 지갑 화면의 원문, 별도 검증 도구), 지갑 서비스 사용 중단·무결성 확인\n- 단기: 대규모 이체 지연·한도·다중 승인, 서명 도구의 배포 무결성(해시 고정·서명) 점검\n- 장기: 서드파티 개발·배포 환경 감사, 개발자 장비 EDR·세션 토큰 보호, 거래 시뮬레이션 자동 검증\n- 탐지: 평소와 다른 목적지 주소, 콜드→핫 비정상 이체, UI 스크립트 변경\n\n**교훈**: 화면에 보이는 것이 서명되는 것과 같다는 보장이 없다. **검증 경로를 분리**하라.\n\n### [INC-2025-03-tjactions] tj-actions/changed-files 공급망 공격 (CVE-2025-30066)\n> 날짜: 2025-03-14 · 유형: 공급망(CI/CD) · 행위자: 미귀속 · 지역: 글로벌 · 근거: 확인\n\n**쉽게 말하면**: 개발자들이 많이 쓰는 자동화 도구(GitHub Action)가 오염돼, 이를 쓰는 프로젝트의 비밀번호·키가 작업 기록에 드러났습니다.\n\n**먼저 할 일(초보용)**: 영향 기간에 쓴 비밀값을 모두 바꾸고, 외부 도구는 이름표(버전)가 아니라 고정된 코드 번호(SHA)로 지정하세요.\n\n**개요**: 23,000개 이상 저장소가 쓰는 GitHub Action이 오염돼, CI 파이프라인의 비밀값(액세스 키, GitHub PAT, npm 토큰, 개인 키)이 워크플로 로그에 노출됐다.\n\n**왜 일어났나**\n- 직접 원인: 저장소와 연결된 **GitHub PAT이 침해**돼(PAT 확보 경로는 이 조사에서 미확인) 공격자가 여러 버전 태그를 악성 커밋으로 옮겼다. Base64 페이로드가 추가 코드를 받아 메모리를 스캔했다. '23,000개'는 이 Action을 쓰는 저장소 수이며 실제로 비밀이 노출된 저장소 수가 아니다.\n- 구조적 원인: (1) 많은 프로젝트가 Action을 `v4` 같은 **변경 가능한 태그**로 참조 (2) 서드파티 Action이 비밀값에 접근하는 권한 과다 (3) 비밀값이 로그에 평문으로 출력됨\n\n**침투 경로**: PAT 탈취 → 태그 재지정 → 사용 프로젝트의 CI 실행 → 메모리의 비밀값 덤프 → 공개 로그·Gist로 노출\n\n**어떻게 조치하나**\n- 즉시: 영향 기간(3/14~15)에 실행된 워크플로를 식별하고 그 작업에 전달된 비밀·권한·산출물을 추적해 비밀값 전부 교체, 로그 열람 이력 점검, 필요 시 빌드 산출물 재생성\n- 단기: Action을 **커밋 SHA로 고정**, 서드파티 Action 허용 목록, 워크플로 권한 최소화(`permissions:`)\n- 장기: 비밀값을 단기 토큰(OIDC)으로 대체, 로그 마스킹 강제, 의존 Action 변경 모니터링\n- 탐지: 워크플로의 비정상 외부 다운로드, 로그에 대량 Base64 문자열\n\n**교훈**: 태그는 약속이 아니다. **불변 참조(SHA)** 로 고정하라.\n\n### [INC-2025-04-skt] SK텔레콤 USIM 정보 유출\n> 날짜: 2025-04-22 · 유형: 국가 규모 개인정보·통신 · 행위자: 미귀속 · 지역: 한국 · 근거: 확인\n\n**쉽게 말하면**: SK텔레콤 핵심 서버에 악성코드가 약 4년 동안 숨어 있었고, 가입자 인증 관련 정보(USIM 인증에 쓰이는 정보)가 유출됐습니다. 관리 계정이 암호화 없이 서버에 적혀 있었던 것이 출발점이었다고 정부가 밝혔습니다.\n\n**먼저 할 일(초보용)**: 일반 사용자는 통신사 안내에 따라 유심 보호 서비스를 이용하세요. 서버 담당자는 관리 계정을 안전한 비밀 보관소로 옮기고 숨은 악성코드(BPFDoor)를 점검하세요.\n\n**개요**: 과기정통부 최종 조사에서 약 2,696만 건(IMSI 기준, 9.82GB)의 USIM 정보 유출이 확인됐다. 초기 발표는 2,324만 건이었다. 28대 서버에서 BPFDoor 27종, TinyShell 3종, 웹셸 1종, CrossC2 1종, Sliver 1종 등 33종 악성코드가 확인됐다. 침해는 2021년부터 이어졌고 역대 최대 개인정보 과징금(1,348억 원)이 부과됐다(보도).\n\n**왜 일어났나**\n- 직접 원인: 코어망의 한 서버에 **HSS(가입자 인증) 관리 서버의 계정 정보가 평문으로 저장**돼 있었고, 공격자가 이를 이용해 2021-12-24 HSS 관리 서버에 접속한 뒤 BPFDoor를 설치했다(과기정통부 최종 조사).\n- 구조적 원인: (1) 핵심 인증 정보의 평문 보관 (2) **약 4년간 탐지 실패** — 리눅스 스텔스 백도어를 못 봄 (3) 서버 보안 관리 부실(보도) (4) 가입자 인증 관련 정보(USIM 정보)의 보호 수준(복제·사칭 악용이 실제 발생했다는 확인은 이 조사에 없다)\n\n**침투 경로**: (최초 침투는 미공개) → 코어망 서버의 평문 계정 → HSS 관리 서버 접속 → BPFDoor 등 설치 → USIM 정보 수집·전송\n\n**어떻게 조치하나**\n- 즉시: 감염 서버 격리·악성코드 제거, 영향 가입자 대상 USIM 보호서비스·유심 교체, 인증 키 재발급 검토\n- 단기: 코어망 계정·인증 정보 전수 교체, 평문 저장 제거(비밀 관리 시스템), BPFDoor 헌팅(비정상 BPF 소켓 필터, 매직 패킷)\n- 장기: 코어망 관리 접근에 PAM·MFA·세션 녹화, 가입자 데이터 암호화, 서버 행위 기반 탐지(EDR 등. eBPF 기반 관측은 보조 수단이며 악성 BPF 소켓 필터 탐지를 보장하지는 않는다)\n- 탐지: `/proc`·`ss`로 raw 소켓·BPF 필터 확인, 서버의 비정상 포트 대기, 코어 관리 접속 이상\n\n**교훈**: 평문 비밀번호 하나가 4년 침해를 지탱했다. **탐지 기간 = 피해 규모**다.\n\n### [INC-2025-04-mns] Marks & Spencer 랜섬웨어 (Scattered Spider · DragonForce 보도)\n> 날짜: 2025-04-24 · 유형: 사회공학·랜섬웨어 · 행위자: Scattered Spider(DragonForce 랜섬웨어 사용) · 지역: 영국 · 근거: 보도\n\n**쉽게 말하면**: 영국 유통업체 M&S가 공격 조직에 들어와 서버가 암호화됐고, 결제와 온라인 주문이 오랫동안 멈췄습니다. 초기 침투 방법은 공식 확인되지 않았고, 전화로 직원을 속이는 수법을 쓰는 조직으로 알려져 있습니다.\n\n**먼저 할 일(초보용)**: 지원 창구가 비밀번호·2단계 인증을 재설정해 줄 때는, 요청자가 알려 준 번호가 아니라 미리 등록된 연락처로 확인하고 관리자 승인을 거치게 하세요.\n\n**개요**: M&S는 비접촉 결제·온라인 주문이 장기간 장애를 겪었다. 보도에 따르면 공격자는 2024-02경부터 침입해 도메인 컨트롤러의 NTDS.dit를 탈취했고, 2025-04-24 VMware ESXi에 DragonForce 랜섬웨어를 배포했다. Co-op 등 같은 시기 영국 유통 사건은 별개 조사 대상이며 같은 경로로 단정할 수 없다.\n\n**왜 일어났나**\n- 직접 원인: 이 그룹의 전형 수법은 **IT 헬프데스크·고객센터를 속이는 사회공학**, MFA 폭탄, SIM 스와핑이다. M&S의 구체적 초기 접근은 공식 확인되지 않았다(외주 헬프데스크 거론은 보도·부인).\n- 구조적 원인(분석, 대부분 추정): (1) 헬프데스크의 본인 확인·MFA 재설정 절차가 약했을 가능성 (2) 도메인 컨트롤러 자격 증명 해시 탈취 후 오프라인 크래킹 가능 (3) 가상화 호스트(ESXi) 보호·백업 격리가 부족했을 가능성 (4) 보도된 침입 시점(2024-02경)과 암호화(2025-04) 사이 약 14개월 — 사실이라면 장기 미탐지(재확인 필요)\n\n**침투 경로**: (사회공학 추정) → 유효 계정 → AD 침투·NTDS.dit 탈취 → 해시 크래킹·횡이동 → ESXi 랜섬웨어\n\n**어떻게 조치하나**\n- 즉시: 헬프데스크 비밀번호·MFA 재설정에 **콜백·관리자 승인 등 별도 본인 확인**, krbtgt·특권 계정 교체\n- 단기: NTDS.dit 접근·볼륨 섀도 복사 탐지, ESXi 관리 인터페이스 격리·잠금 모드, 오프라인·불변 백업\n- 장기: 제3자 헬프데스크 통제 계약, 피싱 저항 MFA, 관리자 계층 분리(Tiered admin)\n- 탐지: 헬프데스크 티켓의 MFA 재설정 급증, DC에서 `ntdsutil`·VSS 사용, ESXi 관리 SSH 활성화\n\n**교훈**: 가장 강한 기술도 **사람이 응답하는 절차**에서 뚫린다.\n\n### [INC-2025-06-yes24] 예스24 랜섬웨어\n> 날짜: 2025-06-09 · 유형: 랜섬웨어 · 행위자: 미귀속 · 지역: 한국 · 근거: 보도\n\n**쉽게 말하면**: 예스24가 랜섬웨어(파일을 암호화하고 돈을 요구하는 악성코드)에 걸려 5일 동안 서비스가 멈췄습니다. 백업이 부족해 복구가 오래 걸렸다고 알려졌습니다.\n\n**먼저 할 일(초보용)**: 인터넷과 분리된 백업을 만들고, 실제로 복구해 보는 훈련을 하세요.\n\n**개요**: 두 차례 랜섬웨어 공격으로 홈페이지·앱이 닷새간 마비됐고(이용자 약 2,000만 명), 8월 기준 피해 확인 이용자는 200만 명 내외로 보도됐다.\n\n**왜 일어났나**\n- 직접 원인: 초기 침투 경로는 공개되지 않았다.\n- 구조적 원인: **백업 부재·미흡**으로 복구가 길어졌다(보도). 한 번 복구한 뒤 재공격을 당했다는 점은 원인 제거가 불완전했음을 시사.\n\n**어떻게 조치하나**\n- 즉시: 감염 자산 격리, 백업 무결성 확인, 복구 전 침투 경로 차단(재감염 방지)\n- 단기: **오프라인·불변 백업 3-2-1**, 복구 훈련(RTO·RPO 측정), 관리자 계정 격리, 복원 전 침해 경로 제거\n- 장기: 핵심 서비스 이중화, 랜섬웨어 대응 시나리오·법적 신고 절차 정비\n- 탐지: 대량 파일 변경·확장자 변경, 볼륨 섀도 삭제(`vssadmin`), 비정상 관리자 로그인\n\n**교훈**: 복구 능력이 없으면 **공격 한 번이 곧 영업 중단**이다. (초기 침투 경로는 미공개.)\n\n### [INC-2025-07-sgi] SGI서울보증 랜섬웨어\n> 날짜: 2025-07-14 · 유형: 랜섬웨어·원격 접속 · 행위자: Qilin 지목(보도) · 지역: 한국 · 근거: 보도\n\n**쉽게 말하면**: SGI서울보증은 VPN 로그인에 비밀번호를 계속 바꿔 넣는 공격을 당했고, 백업까지 함께 암호화돼 모든 업무가 멈췄다고 보도됐습니다.\n\n**먼저 할 일(초보용)**: 원격 접속에 2단계 인증과 로그인 실패 횟수 제한을 걸고, 백업은 업무 네트워크와 분리해 두세요.\n\n**개요**: 2025-07-14 0시 40분경 랜섬웨어로 전 업무 중단. 피해 고객은 10만 명 이상으로 추산됐다.\n\n**왜 일어났나**\n- 직접 원인: **VPN에 대한 무차별 대입 공격**(비밀번호를 계속 바꿔 넣는 방식)이 성공. 이를 막는 장치(잠금·MFA)가 없었다는 보도가 있다.\n- 구조적 원인: (1) 원격 접속에 MFA·시도 횟수 제한 부재 (2) 정보보호 인증을 받지 않았다는 보도 (3) DR·일·월 백업에 이어 **소산 백업까지 전산망에 연결**돼 함께 암호화·삭제된 정황\n\n**침투 경로**: VPN 무차별 대입 → 내부 접속 → 랜섬웨어 → 백업까지 암호화\n\n**어떻게 조치하나**\n- 즉시: 원격 접속 계정 MFA 강제, 실패 횟수 제한·IP 제한, 계정 비밀번호 교체\n- 단기: **소산·불변 백업을 망에서 분리**(자격 증명도 별도), 백업 관리면·계정·삭제 권한 분리, 복원 전 침해 경로 제거와 복구본 검증, 접속 국가·시간 제한\n- 장기: 원격 접속을 ZTNA로 전환, 금융 공통 보안 기준 점검·정기 모의침투\n- 탐지: 한 계정·IP에서 다수 로그인 실패 후 성공, 비업무 시간 VPN 접속\n\n**교훈**: VPN 비밀번호 한 줄과 연결된 백업이 **회사 전체의 마지막 방어선**을 지웠다.\n\n### [INC-2025-07-toolshell] SharePoint ToolShell (CVE-2025-53770)\n> 날짜: 2025-07-18 · 유형: 엣지·서버 취약점 · 행위자: Linen Typhoon·Violet Typhoon·Storm-2603(중국 연계) · 지역: 글로벌 · 근거: 확인\n\n**쉽게 말하면**: 회사에 직접 설치해 쓰는 SharePoint 서버의 결함으로 로그인 없이 서버를 장악할 수 있었습니다. 업데이트한 뒤에도 훔친 '서버 암호 키'가 남아 있으면 계속 악용될 수 있었습니다.\n\n**먼저 할 일(초보용)**: 업데이트와 함께 서버의 암호 키(MachineKey)를 교체하고, 서버가 인터넷에 직접 열려 있지 않은지 점검하세요.\n\n**개요**: 온프레미스 SharePoint의 역직렬화 취약점(CVSS 9.8)으로 인증 없는 RCE와 서버 암호 키 유출이 가능했다. 미국 연방 기관 다수가 영향을 받았다는 보도가 있다. SharePoint Online은 영향 없음.\n\n**왜 일어났나**\n- 직접 원인: 이전 취약점(CVE-2025-49704/49706 계열)의 패치가 우회됐다. 공격자는 서버의 ASP.NET **MachineKey**를 탈취해 서명된 페이로드를 위조했다.\n- 구조적 원인: (1) 온프레미스 SharePoint의 인터넷 노출 (2) 패치 후에도 **유출된 암호 키는 그대로 유효** (3) 패치 직후 수 주 뒤에도 악용 지속(Hacker News 보도)\n\n**침투 경로**: 노출된 SharePoint → 역직렬화 RCE → 웹셸 → MachineKey 탈취 → 키로 요청 위조(패치 후에도) → 내부 이동·일부 랜섬웨어(Storm-2603)\n\n**어떻게 조치하나**\n- 즉시: 패치 + **ASP.NET MachineKey 교체**(팜 전체 노드에 반영됐는지 검증)·IIS 재시작, AMSI 활성화, 웹셸·추가 지속성 점검\n- 단기: 인터넷 직접 노출 제거(역방향 프록시·인증 앞단), 서버 침해 시 재구축\n- 장기: 온프레미스 협업 서버를 클라우드·VPN 뒤로, 핵심 서버 EDR\n- 탐지: `_layouts` 하위 비정상 `.aspx`, w3wp에서 시작되는 프로세스\n\n**교훈**: 취약점이 아니라 **훔친 키**가 영구 백도어가 된다. 패치 후 키·자격 증명 회수.\n\n### [INC-2025-08-salesloft] Salesloft Drift OAuth 토큰 탈취 → Salesforce 데이터 유출\n> 날짜: 2025-08-08 · 유형: 서드파티·SaaS 연동 · 행위자: UNC6395(ShinyHunters 연계 보도) · 지역: 글로벌 · 근거: 확인\n\n**쉽게 말하면**: 영업 도구(Salesloft Drift)의 '연결 열쇠(토큰)'가 털려, 이 도구와 연결된 수백 개 회사의 고객 데이터(Salesforce)가 빠져나갔습니다. 문의 기록에 붙여넣은 비밀번호·키는 2차 피해로 이어질 수 있었습니다.\n\n**먼저 할 일(초보용)**: 연결된 외부 앱의 권한을 점검하고 유출된 연결 토큰은 폐기·재발급하세요. 문의 기록에 비밀번호를 붙여넣지 않도록 하세요(비밀번호만 바꿔서는 이미 발급된 토큰이 사라지지 않습니다).\n\n**개요**: 2025-08-08 ~ 08-18 사이 UNC6395가 Salesloft Drift 연동의 OAuth 리프레시 토큰으로 700개 이상 조직(연구기관 집계, 집계 기준은 자료마다 다를 수 있음)의 Salesforce를 조회·내보냈다. Cloudflare, Google, PagerDuty, Palo Alto Networks, Proofpoint, Zscaler 등이 포함된다. Salesloft는 8/19 탐지, 8/20 전체 토큰을 폐기했다.\n\n**왜 일어났나**\n- 직접 원인: Drift가 고객 Salesforce를 조회할 때 쓰는 **OAuth 토큰이 탈취**됐다. 토큰이 어떻게 탈취됐는지(공급사 측 침해 경로)는 후속 조사 보고를 확인하라(원문 미확인).\n- 구조적 원인: (1) 서드파티 앱 토큰이 고객 CRM에 넓은 읽기 권한을 가짐 (2) 토큰에 IP 제한·단기 만료가 없음 (3) **케이스(Case) 필드에 AWS 키·Snowflake 토큰·VPN 자격 증명이 평문으로 쌓여** 2차 침해로 이어질 수 있었음(실제 성공 여부는 조직별 확인 필요)\n\n**침투 경로**: 공급사 측 토큰 탈취 → 고객 Salesforce API 조회(TruffleHog 사용자 에이전트로 비밀값 탐색) → 대량 내보내기 → 비밀값 수확 → 2차 침해\n\n**어떻게 조치하나**\n- 즉시: 영향 연동의 토큰 폐기·재발급(세션·리프레시 토큰·연결 앱 권한을 함께 폐기하고 감사 로그 보존), Salesforce 로그에서 해당 기간 API 조회·내보내기 검토, **케이스·노트에 들어 있던 비밀값 전부 교체**\n- 단기: 연결 앱 목록·권한 전수조사, 앱별 IP 허용·세션 정책, 불필요한 읽기 권한 제거\n- 장기: 지원 채널에 비밀값을 붙여넣지 않도록 DLP·교육, SaaS 연동 토큰을 단기·범위 제한 토큰으로\n- 탐지: 처음 보는 IP의 API 대량 조회, 데이터 내보내기 이벤트, 비밀값 패턴 검색 쿼리\n\n**교훈**: **SaaS 연동 한 개가 CRM 전체의 열쇠**다. 지원 티켓에 붙여넣은 비밀번호가 다음 침해가 된다.\n\n### [INC-2025-08-jlr] Jaguar Land Rover 가동 중단\n> 날짜: 2025-08-31 · 유형: 랜섬웨어 추정·제조 · 행위자: \"Scattered Lapsus$ Hunters\" 주장(NYT는 러시아 연계 보도) · 지역: 영국 · 근거: 보도\n\n**쉽게 말하면**: 재규어 랜드로버가 사이버 공격을 받아 세계 공장이 약 5주 멈췄습니다. 어떻게 들어왔는지는 아직 확인되지 않았습니다.\n\n**먼저 할 일(초보용)**: 공장 생산망과 사무망을 분리하고, 컴퓨터 없이도 돌아가는 비상 운영 절차를 만들어 훈련하세요.\n\n**개요**: 글로벌 IT를 선제 차단해 영국·슬로바키아·브라질·인도 등 공장이 약 5주간 멈췄다. 영국 경제 전체 피해 약 19억 파운드 추산(경제 파급 추정이며 JLR의 직접 손실이 아님, 보도). JLR 직접 손실은 최대 약 2.6억 파운드로 보도됐다.\n\n**왜 일어났나**\n- 직접 원인: 초기 침투 경로는 **확인되지 않았다**. 도난 직원 자격 증명 사용과 접근 통제 불일치가 거론됐다(추정).\n- 구조적 원인: (1) IT·OT·생산 시스템의 연결 (2) 격리로 확산은 막았으나 **복구 우선순위·수동 대체 절차 부족** (3) 협력사 공급망까지 영향이 번짐\n\n**침투 경로**: (미확인, 자격 증명 도난 추정) → 내부 확산 → 시스템 선제 차단 → 생산 중단\n\n**어떻게 조치하나**\n- 즉시: 격리 범위 확정, 생산 필수 시스템 우선 복구 순서 확정\n- 단기: IT/OT 세그먼트 분리·단방향 연동, 오프라인 수동 운영 절차(BCP) 훈련\n- 장기: 공급망 장애 시 협력사 자금·재고 지원 체계, 사이버 보험·복구 시나리오\n- 탐지: 관리자 계정 이상 로그인, 대량 암호화 전 사전 징후(백업 삭제 등)\n\n**교훈**: 공격이 멈추게 한 것은 **데이터가 아니라 생산**이다. 복구 순서를 미리 정해 두라.\n\n### [INC-2025-08-kt] KT 무단 소액결제 (불법 초소형 기지국)\n> 날짜: 2025-08 · 유형: 통신망·인증 · 행위자: 미귀속(40대 중국 교포 용의자 체포 보도) · 지역: 한국 · 근거: 확인\n\n**쉽게 말하면**: 가짜 초소형 기지국으로 KT 이용자의 문자·인증번호를 가로채 소액결제를 했습니다. KT에 납품된 이 장비들이 모두 같은 인증서를 쓰고 있었던 점이 약점이었습니다.\n\n**먼저 할 일(초보용)**: 일반 사용자는 통신사 안내에 따라 결제 한도를 조정하세요. 통신사는 장비마다 다른 인증서를 쓰게 바꿔야 합니다.\n\n**개요**: 불법 초소형 기지국(펨토셀)으로 이용자 단말을 속여 접속을 받아, 문자·ARS 인증 정보를 가로채고 무단 소액결제를 했다. 최종 무단 소액결제 피해 368명·2억 4,300만 원, 개인정보 유출 2만 2,227명으로 집계됐다. 불법 펨토셀 ID 20개 확인, 2024-10부터 유출 정황이 있었다는 보도도 있다.\n\n**왜 일어났나**\n- 직접 원인: KT에 납품되는 **모든 펨토셀이 동일한 제조사 인증서**를 썼다. 이 인증서만 복제하면 정상 장비가 아니어도 내부망 인증을 받을 수 있었다.\n- 구조적 원인: (1) 장비별 고유 인증 없이 공통 인증서 (2) 펨토셀이 코어망에 닿는 신뢰 구조 (3) 소액결제의 인증이 SMS·ARS에 의존 (4) 장기간 탐지 못 함\n\n**침투 경로**: 인증서 복제 → 불법 펨토셀이 코어망 인증 통과 → 근처 단말을 붙잡아 SMS·음성 가로채기 → 결제 인증 우회 → 소액결제\n\n**어떻게 조치하나**\n- 즉시: 불법 펨토셀 접속 차단, 인증서 폐기·장비별 고유 인증서 재발급, 영향 가입자 결제 한도 제한\n- 단기: 펨토셀 접속 허용 목록·위치 검증, 비정상 단말-기지국 조합 탐지, 중복 인증서 사용 탐지, 인증서 교체의 서비스 영향 검토와 장비 등록·폐기 절차 정비\n- 장기: 결제 인증을 SMS에서 앱·생체 기반으로, 소규모 기지국 수명주기·키 관리, 위약금 면제 등 피해자 구제\n- 탐지: 정상 장비가 아닌 펨토셀 ID 접속, 동일 단말의 다중 셀 이동, 소액결제 급증\n\n**교훈**: 통신 인증을 **SMS 하나에 걸지 마라**. 장비 신뢰는 장비별 인증으로.\n\n### [INC-2025-08-lottecard] 롯데카드 개인정보 유출 (WebLogic 미패치)\n> 날짜: 2025-08-26 · 유형: 엣지·서버 취약점·금융 · 행위자: 미귀속 · 지역: 한국 · 근거: 보도\n\n**쉽게 말하면**: 이미 2017년에 고쳐진 서버 결함(WebLogic)이 고쳐지지 않은 채 남아 있다가 악용돼 고객 정보가 유출됐다는 보도입니다.\n\n**먼저 할 일(초보용)**: 인터넷에 열린 서버 목록을 만들어 실제 공격에 쓰이는 결함과 외부에 노출된 시스템부터 패치하세요. CVV는 결제 승인 뒤 저장하지 말고, 카드번호는 꼭 필요한 경우에만 보호해서 저장하세요.\n\n**개요**: 2025-08-26 점검에서 3개 서버에서 악성코드 2종과 웹셸 5종을 발견. 유출은 최대 200GB로 확대(초기 1.7GB), 고객 297만 명 정보가 포함됐고 28만 명은 카드번호·CVV·유효기간이 노출됐다(보도).\n\n**왜 일어났나**\n- 직접 원인: **2017년에 패치가 나온 Oracle WebLogic 원격 코드 실행(CVE-2017-10271)** 이 패치되지 않은 서버에서 악용됐다는 보도.\n- 구조적 원인(분석): (1) 2017년에 패치가 나온 취약점이 악용됐다는 보도 — 패치·취약점 관리 미흡 가능성(자산 목록 부재 여부는 근거 없음) (2) 카드 정보(PAN·CVV 등)의 접근 통제·모니터링 부족 가능성. 보안 인증 취득 직후 침해가 보도됐으나 시간적 선후일 뿐 원인으로 단정하지 않는다\n\n**침투 경로**: 노출된 WebLogic → CVE-2017-10271 RCE → 웹셸 → 서버 장악 → 데이터 반출\n\n**어떻게 조치하나**\n- 즉시: 취약 서버 격리·패치, 웹셸 전수 점검, 노출 카드 재발급·결제 모니터링\n- 단기: **외부 노출 자산 전수 목록화**, 취약점 스캐너 정기 실행, EOL·미패치 소프트웨어 목록\n- 장기: 패치 SLA(치명적 취약점 일 단위)·예외 승인 제도, 카드 승인 후 CVV 저장 금지·잔존 데이터 제거, PAN 토큰화\n- 탐지: WebLogic 비정상 URL(`wls-wsat`), 서버에서의 신규 파일·외부 연결\n\n**교훈**: **인증 취득과 별개로 패치·자산 관리**가 필요하다. 2017년 패치가 나온 CVE가 악용됐다고 보도됐다. (오늘 PeopleSoft 사례도 같은 WebLogic 계열.)\n\n### [INC-2025-09-shaihulud] Shai-Hulud npm 웜\n> 날짜: 2025-09-15 · 유형: 공급망(오픈소스) · 행위자: 미귀속 · 지역: 글로벌 · 근거: 확인\n\n**쉽게 말하면**: 개발자가 설치하는 npm 패키지에 '스스로 퍼지는' 악성코드가 들어 있어, 개발자 PC의 키를 훔치고 그 키로 다른 패키지까지 오염시켰습니다.\n\n**먼저 할 일(초보용)**: 영향 패키지를 쓰는지 확인하고, 감염이 의심되는 PC는 격리한 뒤 안전한 기기에서 개발·배포용 토큰을 모두 바꾸세요.\n\n**개요**: 1차 공격(2025-09-15 확인)에서 자기 복제하는 npm 웜이 500개 이상 패키지를 오염시켰다(2025-09 집계). 후속 변종 Shai-Hulud 2.0(2025-11-24 확인)은 별개 캠페인이며, 아래 동작 설명은 1차 기준이다. GitHub·npm·AWS·GCP·Azure 자격 증명을 훔쳐 공개 GitHub 저장소로 올렸다.\n\n**왜 일어났나**\n- 직접 원인: 설치 후 스크립트(postinstall)가 개발자 환경의 토큰·비밀을 수집하고, **npm 토큰을 발견하면 접근 가능한 다른 패키지에 악성 버전을 자동 게시**해 웜처럼 번졌다.\n- 구조적 원인: (1) 패키지 설치 스크립트 자동 실행 (2) 장기·고권한 npm 토큰 (3) 퍼블리시 시 2단계 인증·출처 증명 강제 부족 (4) CI·개발자 PC에 비밀이 평문 존재\n\n**침투 경로**: 감염된 패키지 설치 → 환경의 비밀 수집(TruffleHog 계열) → 공개 저장소로 유출 → 토큰으로 다른 패키지 오염 → 확산\n\n**어떻게 조치하나**\n- 즉시: 영향 패키지 사용 여부 점검(락 파일 조회), 노출 가능한 npm·GitHub·클라우드 토큰 전부 교체\n- 단기: 설치 스크립트 차단(`--ignore-scripts`)·사설 레지스트리·릴리스 후 대기 기간(cooldown) 적용, 퍼블리시 토큰을 단기·범위 제한으로\n- 장기: npm 신뢰 게시(Trusted Publishing)·출처 증명, 개발·CI 환경의 비밀 최소화, 의존성 변경 알림\n- 탐지: 신규 공개 저장소 생성(비밀 유출 흔적), 패키지의 예상 밖 버전 게시\n\n**교훈**: 의존성 한 줄이 **내 토큰으로 다음 피해자를 만든다**.\n\n### [INC-2025-10-f5] F5 BIG-IP 개발 환경 침해\n> 날짜: 2025-10-15 · 유형: 공급망·국가 지원 APT · 행위자: UNC5221(중국 연계, BRICKSTORM 백도어) · 지역: 글로벌 · 근거: 확인\n\n**쉽게 말하면**: 네트워크 장비 회사 F5의 개발 환경에 중국 연계 조직이 1년 넘게 숨어 소스 코드와 아직 공개되지 않은 취약점 정보를 가져갔습니다.\n\n**먼저 할 일(초보용)**: F5 장비를 쓴다면 최신 패치를 먼저 적용하고, 관리 화면을 인터넷에서 닫으세요.\n\n**개요**: F5가 국가 지원 공격자가 BIG-IP 개발 환경에 침투해 소스 코드, 미공개 취약점 정보, 일부 고객 설정을 가져갔다고 공개했다. F5는 2025-08-09 활동을 탐지했으나 미 법무부의 요청으로 10월 중순까지 공개를 늦췄다. 공격자는 최소 12개월 머물렀고 26만 6천 개 이상 BIG-IP가 인터넷에 노출돼 있었다.\n\n**왜 일어났나**\n- 직접 원인: 초기 침투 경로는 공개되지 않았다. BRICKSTORM은 EDR이 없는 **네트워크 어플라이언스용 Go 백도어**로 SOCKS 프록시를 지원한다.\n- 구조적 원인: (1) 개발 환경·지식 베이스에 취약점 정보 집중 (2) 장비형 시스템의 가시성 부족으로 12개월 이상 체류 (3) 탈취된 취약점 정보는 이후 **고객 장비 공격 로드맵**이 된다\n\n**침투 경로**: (미공개) → 개발 환경 침투 → BRICKSTORM 상주 → 소스 코드·취약점 정보 수집\n\n**어떻게 조치하나**\n- 즉시: F5 권고·헌팅 가이드 적용, BIG-IP 최신 버전 패치, 관리 인터페이스 인터넷 비노출\n- 단기: BIG-IP 구성·자격 증명 교체, 장비 로그 외부 보존, 이상 아웃바운드 점검\n- 장기: 벤더가 침해됐을 때를 가정한 방어(패치 우선순위 상향), 장비 무결성 모니터링\n- 탐지: 장비에서 외부로 나가는 SOCKS·터널 통신, 비정상 프로세스\n\n**교훈**: **벤더가 털리면 제로데이 목록이 털린다.** 해당 제품은 이후 패치를 가장 먼저 적용하라.\n\n### [INC-2025-10-oracleebs] Oracle E-Business Suite 제로데이 (Cl0p)\n> 날짜: 2025-07 · 유형: 엣지·ERP 취약점 · 행위자: Cl0p(2번째 CVE PoC는 ShinyHunters 관련 보도) · 지역: 글로벌 · 근거: 확인\n\n**쉽게 말하면**: 기업 업무 시스템(Oracle EBS)의 결함을 Cl0p 조직이 먼저 알고 악용해 여러 대학과 기업의 데이터를 훔친 뒤 협박했습니다.\n\n**먼저 할 일(초보용)**: 패치를 적용하고, 인터넷에서 바로 접속되지 않게 막으세요.\n\n**개요**: Oracle EBS의 CVE-2025-61882, CVE-2025-61884를 악용해 서버를 침해하고 데이터를 탈취한 뒤 2025-10 협박 메일을 보냈다. Harvard, Dartmouth, Penn, University of Phoenix, Logitech, GlobalLogic, 대한항공(Korean Air), Envoy 등이 피해를 입었다.\n\n**왜 일어났나**\n- 직접 원인: 패치 전부터(7~8월) 제로데이로 악용됐다.\n- 구조적 원인: (1) 인터넷에 노출된 ERP (2) Cl0p의 일관된 전략 — 대량 데이터를 보관하는 기업용 제품 제로데이 후 **일괄 갈취** (3) 탐지·알림이 제로데이 이후에야 가능\n\n**침투 경로**: 노출된 EBS → 제로데이 RCE → 데이터 대량 탈취 → 협박 메일\n\n**어떻게 조치하나**\n- 즉시: 패치, 침해 점검(CISA·벤더 IOC), 서버 외부 노출 제거\n- 단기: ERP 접근을 VPN 뒤로, 데이터 반출 모니터링, 협박 메일 수신 시 대응 절차(법무·수사)\n- 장기: 핵심 ERP의 세그먼트 분리, 보유 데이터 최소화\n- 탐지: ERP 서버의 신규 파일·비정상 대량 다운로드\n\n**교훈**: 한 제품에서 수백 곳이 같은 날 공갈을 받는다. **노출 제거가 가장 강한 완화책**이다.\n\n### [INC-2025-11-coupang] 쿠팡 3,370만 계정 개인정보 유출\n> 날짜: 2025-11 · 유형: 내부자·인증키 관리 · 행위자: 전 직원(퇴사자) · 지역: 한국 · 근거: 확인\n\n**쉽게 말하면**: 쿠팡의 인증 업무를 맡았던 전 직원이 퇴사 후에도 가지고 있던 '서명 키'로 시스템에 접속해 3,367만 계정의 정보를 조회했다고 정부 조사 결과가 나왔습니다.\n\n**먼저 할 일(초보용)**: 퇴사할 때 키와 계정을 회수하고, 서명 키는 개발자 PC가 아닌 전용 보관소에서만 관리하며 정기적으로 바꾸세요. 키를 바꿀 때는 이미 발급된 토큰도 무효화해야 합니다.\n\n**개요**: 최초 신고 때 약 4,500건으로 알려졌으나 조사 결과 3,367만 건(이름·이메일·전화번호·배송지·일부 주문내역)이 무단 조회된 것으로 확인됐다. 결제정보·비밀번호는 유출되지 않았다고 회사는 밝혔다. 정부 조사 결과는 2026-02-10 발표됐다.\n\n**왜 일어났나**\n- 직접 원인: 쿠팡 **인증 업무를 맡았던 전 직원이 퇴사 후에도 서명 키를 이용**해 시스템에 접근했다(정부 조사, 보도). 즉 '지능형 해킹'이 아니라 **인증 관리 실패**라는 평가가 나왔다.\n- 구조적 원인: (1) **토큰 서명 키 유효 기간이 5~10년으로 길고 교체 안 함** (2) 키 관리 시스템 외에 개발자 노트북에도 서명 키가 저장됨 (3) 퇴사자 접근 권한·키 회수 절차 부재 (4) 장기간 이상 접근을 탐지 못 함\n\n**침투 경로**: 퇴사자가 서명 키 보유 → 키로 유효한 인증 토큰 생성 → 고객 정보 조회 API 호출 → 대량 조회\n\n**어떻게 조치하나**\n- 즉시: 서명 키 폐기·재발급(기존 토큰 전부 무효화, 전 노드 반영 검증), 허용 알고리즘·발급자·대상(audience) 검증, 키 사용 감사, 퇴사자 접근 이력 점검\n- 단기: 키는 **KMS·HSM에만** 보관(개발자 PC 금지), 키 수명 단축·정기 로테이션, 퇴사 시 키·토큰 회수 체크리스트\n- 장기: 단기 토큰·키 분할(공개키 검증), 대량 조회 API에 속도 제한·이상 행위 탐지, 내부자 위험 관리\n- 탐지: 퇴사자·비활성 계정의 토큰 사용, 단일 주체의 대량 조회, 비정상 지역·시간\n\n**교훈**: 외부 해커가 아니라 **회수하지 않은 열쇠**가 문을 열었다.\n\n### [INC-2025-12-react2shell] React2Shell (CVE-2025-55182)\n> 날짜: 2025-12-03 · 유형: 프레임워크 취약점 · 행위자: 다수(중국 연계 그룹이 수 시간 내 악용, Amazon 보고) · 지역: 글로벌 · 근거: 확인\n\n**쉽게 말하면**: 웹사이트를 만드는 도구(React·Next.js)의 결함으로 로그인 없이 서버에서 명령을 실행할 수 있었고, 공개 직후부터 공격이 시작됐습니다.\n\n**먼저 할 일(초보용)**: 영향 버전을 최신 보안 버전으로 올리세요.\n\n**개요**: React Server Components(Flight 프로토콜) 역직렬화 취약점. 인증 없는 RCE(CVSS 10.0). React 19.0.0–19.2.0의 `react-server-dom-*`과 App Router를 쓰는 Next.js 15–16에 영향. CISA KEV 등재.\n\n**왜 일어났나**\n- 직접 원인(Qualys 등 분석 출처): Flight 프로토콜 요청에서 클라이언트가 보낸 모듈 이름을 **자신의 속성인지 확인하지 않고** 조회해, 프로토타입 체인을 거쳐 `Function` 생성자에 도달(서버 측 프로토타입 오염 성격).\n- 구조적 원인: (1) 서버가 클라이언트 직렬화 입력을 신뢰하는 프레임워크 설계 (2) 널리 쓰는 프레임워크의 기본 구성이 영향 (3) 공개 즉시 PoC 확산\n\n**침투 경로**: 조작된 요청 → 서버 함수 엔드포인트 → 역직렬화 중 임의 코드 실행 → 서버 장악\n\n**어떻게 조치하나**\n- 즉시: 영향 React·Next.js 패치 버전으로 업그레이드, WAF 임시 규칙(보조 수단)\n- 단기: 서버 함수 엔드포인트 노출 점검, 침해 정황 헌팅(서버 프로세스의 쉘 실행)\n- 장기: 프레임워크 보안 공지 구독·의존성 자동 업데이트, 웹 서버 프로세스 권한 최소화\n- 탐지: Node 프로세스의 자식 쉘, 서버 함수 경로로의 비정상 POST\n\n**교훈**: **프레임워크 하나가 수십만 사이트의 서버 권한**이다. 의존성 알림이 곧 보안 운영이다.\n\n---\n\n## 기타 2025 사건 (요약, 2차 자료 기준)\n\n| 날짜 | 사건 | 유형·원인 한 줄 | 근거 |\n|------|------|----------------|------|\n| 2025-05 | Coinbase 내부자 매수 | 협력사 직원 매수로 고객 데이터 유출(약 6.9만 명) | 보도 |\n| 2025-06 | 16B 자격 증명 대량 노출 | 인포스틸러·유출 데이터 취합본 | 보도 |\n| 2025 상반기 | Cetus 프로토콜 | 약 2.23억 달러 암호화폐 탈취(월 미확인) | 보도 |\n| 2025 전반 | ClickFix | 가짜 오류 화면으로 사용자가 직접 명령을 실행하게 유도 | 보도 |\n| 2025 전반 | 북한 IT 인력 위장 취업 | 가짜 신원으로 서방 기업 취업, \"노트북 농장\" | 보도 |\n| 2025(월 미확인) | 한국: 업비트 445억 원 | 해킹으로 자산 유출 | 보도(단일) |\n"},{"path":"과거3년/2026.md","title":"2026년 주요 사건 (1월 ~ 10월 초)","md":"# 2026년 주요 사건 (1월 ~ 10월 초)\n\n> 형식과 근거 표기는 [2023-Q4.md](2023-Q4.md)와 같다. **2026년 사건은 조사 시점에 출처 수가 상대적으로 적어**, 근거를 사건마다 구분했다. 조치는 본 보고서의 권고다. 2026-09-22 ~ 10-03 사건은 [일일 보고서](../일일/2026-10-03.md)에 있다.\n\n### [INC-2026-01-shinyhunters] ShinyHunters SSO 보이스 피싱(vishing) 캠페인\n> 날짜: 2026-01 · 유형: 사회공학·신원 · 행위자: ShinyHunters · 지역: 글로벌 · 근거: 보도\n\n**쉽게 말하면**: 공격자가 'IT 지원팀'이라며 직원에게 전화해 가짜 로그인 페이지에 비밀번호와 인증 코드를 입력하게 만들었고, 그렇게 들어가 회사 데이터를 가져갔다고 보도됐습니다.\n\n**먼저 할 일(초보용)**: 인증 코드나 승인 알림 대신 보안키·패스키(속아도 인증되지 않는 방식)를 쓰고, 'IT는 전화로 코드를 묻지 않는다'고 모두에게 알리세요.\n\n**개요**: 2026-01 말 약 100개 조직의 SSO 자격 증명을 노린 대규모 vishing을 시작으로 400개 이상 조직 침해가 보도됐다(공격자 주장과 보도가 섞여 있어 확인된 피해 조직 수는 별도). Charter 약 4,000만 건(4/1), Instructure(Canvas)는 5월 침해 후 5/12 몸값 합의로 알려졌다. 피해 규모 수치는 출처마다 다르다(Instructure: 3,000만 명 vs 2.75억 건·330개 기관 등).\n\n**왜 일어났나**\n- 직접 원인: IT 지원을 사칭한 전화로 직원이 피해 조직 **브랜드로 꾸민 피싱 포털**에 Okta SSO 자격 증명과 **MFA 코드까지 입력**하게 만들었다(실시간 중계). AI 음성 에이전트·VoIP 자동 발신으로 규모를 키웠다는 보도.\n- 구조적 원인: (1) 일회용 코드 기반 MFA는 **중계(실시간 피싱)에 취약** (2) SSO 한 번 로그인으로 SharePoint·OneDrive·Salesforce·Slack 전체에 접근 (3) 헬프데스크·직원 교육이 전화 기반 사칭에 약함\n\n**침투 경로**: 사칭 전화 → 가짜 SSO 포털 → 자격 증명·MFA 코드 중계 → 정상 로그인 → SaaS 데이터 대량 내보내기 → 공갈\n\n**어떻게 조치하나**\n- 즉시: 영향 계정의 세션·MFA 재등록, SaaS 감사 로그에서 대량 내보내기 점검\n- 단기: **피싱 저항 MFA(FIDO2·패스키)** 로 전환(코드·푸시 승인 제거), 로그인 허용 기기·도메인 제한(조건부 접근), 직원에게 \"IT는 전화로 코드를 묻지 않는다\" 교육\n- 장기: SSO 세션 수명 단축·재인증 요구, SaaS 데이터 반출 DLP·경보, 헬프데스크 본인 확인 절차 강화\n- 탐지: 새 기기·위치에서의 SSO 로그인 직후 MFA 등록 변경, 짧은 시간에 대량 파일·레코드 다운로드\n\n**교훈**: **MFA를 켰다고 끝이 아니다. 피싱 저항형이어야 한다.**\n\n### [INC-2026-01-kyowon] 교원그룹 랜섬웨어\n> 날짜: 2026-01-10 · 유형: 랜섬웨어·웹셸 · 행위자: 미확인 · 지역: 한국 · 근거: 보도\n\n**쉽게 말하면**: 교원그룹이 랜섬웨어에 걸려 가상 서버 약 600대가 영향을 받았고 여러 서비스에 장애가 났습니다. 웹서버에 숨은 악성 파일(웹셸)이 사용됐다는 보도가 있으나 최초 침투 방법은 확인되지 않았습니다.\n\n**먼저 할 일(초보용)**: 웹서버에 숨은 악성 파일이 없는지 점검하고, 백업은 업무 네트워크와 분리해 두세요.\n\n**개요**: 1/10 이상 징후, 전체 서버 약 800대 중 가상 서버 약 600대가 영향권에 들었고 8개 이상 계열 서비스에 장애가 났다. 유출 우려 개인정보 554만 명(중복 포함 960만 명) 규모로 보도됐다.\n\n**왜 일어났나**\n- 직접 원인: 보도에 따르면 **웹셸이 사용**됐다(최초 진입 경로는 확인되지 않았다). SK텔레콤·KT에서도 웹셸이 보고됐다는 언급이 있으나 동일 공격자·동일 경로로 볼 근거는 없다. 구체적 초기 취약점은 공개되지 않았다.\n- 구조적 원인: (1) 웹 서버 취약점·웹셸을 일찍 탐지하지 못함 (2) 가상 서버 다수가 동시에 암호화될 만큼 평면적 네트워크 (3) 공격자 미확인\n\n**침투 경로**: (미공개) 웹 서버 침투 → 웹셸 → 내부 확산 → 가상 서버 600대 암호화\n\n**어떻게 조치하나**\n- 즉시: 영향 가상 서버 격리, 웹셸·신규 계정·예약 작업 점검, 백업 무결성 확인 후 복구\n- 단기: 웹 루트 무결성 감시(파일 변경 탐지), 웹 서버와 내부망 분리, 하이퍼바이저 관리 접근 격리\n- 장기: 가상화 호스트 백업 불변화, 정기 침투 테스트, 개인정보 최소 보관\n- 탐지: 웹 서버 프로세스의 쉘 실행, 하이퍼바이저의 대량 VM 동시 암호화·정지\n\n**교훈**: 한국 사고(SKT·롯데카드·교원 등)에서 **웹셸이 반복 보고**된다. 웹셸 탐지는 기본기다.\n\n### [INC-2026-03-stryker] Stryker 와이퍼 공격 (Handala)\n> 날짜: 2026-03-11 · 유형: 파괴 공격·클라우드 관리 · 행위자: Handala(이란 정보부 MOIS 연계, 미 법무부 귀속 보도) · 지역: 글로벌 · 근거: 보도\n\n**쉽게 말하면**: 의료기기 기업 Stryker에서 공격자가 관리자 계정을 훔친 뒤, 기기 관리 도구(Intune)의 '원격 초기화' 기능으로 직원 기기를 대량으로 지웠습니다. 별도 악성코드 없이 정상 기능이 무기가 됐습니다.\n\n**먼저 할 일(초보용)**: 관리자 계정에 강한 2단계 인증을 걸고, 대량 삭제는 여러 관리자의 승인이 있어야 실행되게 하세요.\n\n**개요**: 의료기기 기업 Stryker에서 글로벌 Windows 환경의 장치가 대거 초기화됐다. 영향 직원 약 5만 6천 명(61개국 이상, 2차 자료). 별도로 일부 자료는 기기 20만 대 이상·79개국을 주장한다(직원 수와 기기 수는 서로 다른 단위이며 **수치는 출처마다 다르다**).\n\n**왜 일어났나**\n- 직접 원인: 공격자가 **관리자 계정을 탈취**한 뒤 클라우드 장치 관리 서비스(Microsoft Intune)의 **원격 초기화(remote wipe)** 기능으로 연결된 모든 기기에 명령을 내렸다. 별도 와이퍼 악성코드 없이도 파괴가 가능했다.\n- 구조적 원인: (1) 장치 관리 콘솔 관리자 계정이 침해 가능(MFA·승인 부재) (2) **한 계정이 전 직원 기기를 지울 수 있는 권한 집중** (3) 지정학적 보복 동기에 의한 파괴 목적 공격\n\n**침투 경로**: 관리자 계정 탈취 → Intune 접근 → 전체 장치에 원격 초기화 명령 → 업무 마비\n\n**어떻게 조치하나**\n- 즉시: 관리 콘솔 관리자 계정 교체·세션 폐기, 원격 초기화 정책 임시 제한, 복구 우선순위 확정\n- 단기: Intune의 Multi Admin Approval 등 **적용 가능한 다중 승인 통제**를 먼저 확인해 대량 초기화·삭제를 제한(적용 가능 여부 검증 필요), 대량 wipe 권한 최소화, 비상 관리자(break-glass) 보호, 특권 관리자 PIM·시간 제한, 관리자 로그인에 피싱 저항 MFA\n- 장기: 장치 관리 권한 분할(지역·그룹별), 파괴 시나리오를 포함한 복구 훈련, 오프라인 복구 이미지\n- 탐지: 관리 콘솔의 대량 wipe·retire 명령, 관리 정책 변경·초기화 요청 알림, 관리자 비정상 로그인\n\n**교훈**: **관리 콘솔 하나가 곧 무기**다. 파괴 권한은 한 사람이 쥐게 두지 마라.\n\n### [INC-2026-03-teampcp] TeamPCP 보안·개발 도구 공급망 연쇄 (Trivy → Checkmarx → Bitwarden CLI)\n> 날짜: 2026-03-16 · 유형: 공급망(CI/CD) · 행위자: TeamPCP · 지역: 글로벌 · 근거: 확인\n\n**쉽게 말하면**: 보안 점검 도구 Trivy를 시작으로 Checkmarx, Bitwarden CLI까지 개발 도구가 연달아 오염돼 개발자·CI의 비밀 키가 털렸습니다.\n\n**먼저 할 일(초보용)**: 영향 기간에 쓴 키를 모두 바꾸되 감염이 의심되는 환경은 격리한 뒤 안전한 기기에서 바꾸고, '옛 키가 완전히 무효가 됐는지'까지 확인하세요.\n\n**개요**: 2026-02 말 시작해 3/16 Aqua Security의 오픈소스 스캐너 **Trivy**와 관련 GitHub Action에 자격 증명 탈취 악성코드가 삽입됐다. 수확한 토큰으로 Checkmarx Action(`ast-github-action`·`kics-github-action`)과 LiteLLM, 4월 Bitwarden CLI 2026.4.0까지 오염됐다. 4/28 Checkmarx는 비공개 GitHub 데이터 96GB가 LAPSUS$ 갈취 포털에 올랐음을 확인했다. 다운스트림으로 OpenAI·Vercel 등이 영향을 받았다는 보도.\n\n**왜 일어났나**\n- 직접 원인: Trivy 저장소의 **불완전한 자격 증명 교체**(회수했다고 믿었지만 일부 남음)로 접근이 유지됐다. 이어 훔친 토큰으로 다음 도구를 오염시켰다.\n- 구조적 원인: (1) 보안 스캐너·CI 도구가 비밀값에 접근하는 높은 권한 (2) 서드파티 Action을 변경 가능한 참조로 사용 (3) 한 번의 침해가 다음 저장소 토큰으로 이어지는 **연쇄 구조** (4) 보안 도구를 신뢰해 점검 대상에서 제외\n\n**침투 경로**: 불완전한 키 교체로 접근 유지 → Trivy·Action 오염 → CI에서 개발자 비밀·클라우드 키·SSH 키·K8s 설정 수확 → 다음 도구 오염 → 데이터 유출·갈취\n\n**어떻게 조치하나**\n- 즉시: 영향 기간 CI에서 사용된 모든 비밀·토큰 교체, 오염 버전 사용 여부 점검(Microsoft 지침 등 참조)\n- 단기: Action·이미지를 **다이제스트·SHA로 고정**, CI 비밀 최소화·OIDC, **키 교체 시 구 키 완전 폐기 검증**\n- 장기: 보안 도구의 CI 권한 분리·네트워크 egress 제한, 도구 업데이트 자동 적용 대신 검증 후 적용\n- 탐지: CI에서 예상 밖 외부 접속·비밀 열거, 새 GitHub PAT·배포 키 생성\n\n**교훈**: **보안 도구도 공급망이다.** 키 교체는 \"새 키 발급\"이 아니라 \"옛 키 사망 확인\"이다.\n\n### [INC-2026-04-fbi] FBI 감시 시스템 침해 (\"major incident\" 지정)\n> 날짜: 2026-04-02 · 유형: 국가 지원 APT·서드파티 · 행위자: 중국 연계 의심(Salt Typhoon 지목 보도, 확정 아님) · 지역: 미국 · 근거: 보도\n\n**쉽게 말하면**: FBI는 감시 시스템이 인터넷 업체의 연동 구간을 통해 침해됐다고 의회에 알렸습니다. 중국 연계 의심 보도가 있지만 확정은 아닙니다.\n\n**먼저 할 일(초보용)**: 외부 업체와 연결된 구간의 로그인·접속 기록을 점검하세요.\n\n**개요**: FBI가 의회에 내부 감시 시스템(Digital Collection System Network) 침입을 FISMA상 \"major incident\"로 통보했다. 이 시스템에는 법원 승인 감청 결과, 통신 기록 정보, FISA 영장 자료, 수사 대상 개인정보가 저장된다. 법무부는 3/23 지정을 결정했다.\n\n**왜 일어났나**\n- 직접 원인: FBI는 공격자가 **상용 인터넷 서비스 제공자(ISP)의 벤더 인프라를 이용**해 접근한 것으로 보인다고 밝혔다.\n- 구조적 원인: (1) 정부 시스템과 통신사 연동 경로의 신뢰 (2) 앞선 Salt Typhoon 침해(2024)와 같은 통신 장비 취약점 부채 (3) 고가치 정보(감청 대상) 집중\n\n**침투 경로**: 통신사·ISP 벤더 인프라 침해 → 연동 경로로 감시 시스템 접근 → 감청·메타데이터 열람\n\n**어떻게 조치하나**\n- 즉시: 영향 연동 경로 차단, 노출 가능성이 있는 수사 대상·정보원 보호 조치\n- 단기: 벤더·ISP 연동 구간의 인증·로그 점검, 감청 시스템 접근 감사\n- 장기: 통신사 연동 최소화·분리, 감청 데이터 암호화·접근 최소화, 공급사 침해 통지 SLA\n- 탐지: 연동 계정의 비정상 조회, 평소와 다른 경로의 접속\n\n**교훈**: 감시 인프라는 **감시당하는 대상**이 된다. 서드파티 연동 구간이 가장 약한 고리다.\n\n### [INC-2026-05-tving] 티빙(TVING) 가입자 3,954만 계정 유출\n> 날짜: 2026-05-30 · 유형: 키 관리·개인정보 · 행위자: 미귀속 · 지역: 한국 · 근거: 확인\n\n**쉽게 말하면**: 티빙 개발자의 '접속키'가 털려, 해커가 개발 환경과 운영 시스템으로 차례로 들어갔고, 휴면·탈퇴 계정을 포함한 3,954만 계정의 정보가 유출됐다고 정부가 발표했습니다(2026-09-03).\n\n**먼저 할 일(초보용)**: 티빙 이용자는 같은 비밀번호를 쓰는 다른 서비스의 비밀번호도 바꾸고 2단계 인증을 켜세요. 담당자는 개발자 접속키를 코드나 개발 PC에 두지 말고 전용 보관소에서 관리하며 정기적으로 바꾸세요.\n\n**개요**: 침해는 2026-05-30 저녁에 시작됐고, 조사단이 판단한 인지 시점은 5/31 오전 10시경, 신고는 6/1 오후 3시경이다. 6/3 과기정통부가 '중대사고'로 판단해 민관합동조사단을 꾸렸고, 6/23 초기 보도는 약 1,953만 명이었으나 **9/3 최종 발표는 3,954만 계정**이다(활성 2,206만 + 비활성 1,737만[휴면 850만·탈퇴 887만] + 테스트 11만). 유출 항목은 아이디·비밀번호·이름·휴대전화·생년월일 등 20개이며, 휴대전화·이메일은 암호화 키도 함께 유출돼 사실상 평문 수준으로 판단됐다. 소스코드를 포함한 개발 프로젝트 361건(30.35GB)과 콘텐츠 추천 알고리즘 같은 기술 자산도 유출됐다. 발표 시점까지 불법 거래·스미싱 같은 2차 피해 정황은 발견되지 않았다. 티빙은 정보보호 투자를 2030년까지 직전 5년의 4배로 늘리고, 피해 보상 보험(최대 300만 원)과 포인트(5천 원 상당)를 제공한다고 밝혔다(보도).\n\n**왜 일어났나**\n- 직접 원인 [확인: 과기정통부 조사단, 보도]: 해커가 **개발자의 접속키를 탈취**해 내부 시스템에 침투했다. 접속키를 어떻게 탈취했는지는 공개 자료에서 확인하지 못했다.\n- 조사단이 지적한 원인 [확인, 보도]: 키 관리체계 미비, 비정상 행위 모니터링 체계 부재, 개발 인력에 비해 적은 정보보호 인력(4명 내외), 로그 관리 미흡.\n- 구조적 원인(분석, 추정): (1) 개발 환경의 비밀 키가 털리면 내부 시스템 전체로 이어질 수 있는 구조(개발 환경에서 운영 환경으로 이어졌다는 보도가 있으나 공개된 조사 요약만으로는 이동 경로를 확인하지 못했다) (2) 휴면·탈퇴 계정 정보가 포함돼 있어 보유 기간·목적·파기 의무 준수 여부를 점검할 필요가 있다\n- 신고 지연 [보도]: 조사단이 판단한 인지 시점(5/31 10:10경)에서 신고(6/1 15:08경)까지 약 29시간이 걸려 24시간 신고 의무를 넘겼고, 과기정통부는 최대 3,000만 원의 과태료 부과 방침을 밝혔다.\n\n**침투 경로**: 개발자 접속키 탈취(방법 미확인) → 내부 시스템 침투(개발 환경에서 운영 환경으로 이어졌다는 보도) → 회원 정보와 개발 프로젝트 유출\n\n**어떻게 조치하나**\n- 즉시: 증거(접속·API 로그) 보존 후 유출 키와 관련 토큰 폐기·재발급, 키의 접근 권한·사용 이력과 암호화 키 접근 경로 점검, 개발·운영 접속 로그 소급 조사, 이용자에게 비밀번호 변경·스미싱 주의 안내\n- 단기: 키를 코드·개발 PC가 아니라 비밀 관리 서비스(KMS 등)에 보관하고 소스 저장소의 비밀 노출을 스캔, 데이터 접근 권한과 키 관리 권한 분리와 비정상 복호화·대량 데이터 추출 탐지, 개발망과 운영망 접근 분리·승인, 대량 조회·반출 알림\n- 장기: 휴면·탈퇴 정보 파기·분리 보관, 정보보호 인력·예산 확대, 로그 장기 보존, 침해 인지 후 24시간 내 신고 절차 훈련\n- 탐지: 개발자 키의 새 IP·새 지역 사용, 개발 프로젝트 대량 다운로드, 회원 DB 대량 조회\n\n**교훈**: 개발자의 키 하나가 **회원 전체와 소스 코드**의 열쇠가 됐다. 한국 사건(쿠팡, 티빙)에서 '키 관리'가 반복된다.\n\n---\n\n## 기타 2026 사건 (요약, 2차 자료 단일·소수 출처 → 근거 약함)\n\n| 날짜 | 사건 | 유형·원인 한 줄 | 근거 |\n|------|------|----------------|------|\n| 2026-03~05 | 폴란드·스웨덴·노르웨이 인프라(수도·전력·댐) | 러시아 연계 침투·파괴 보도 | 보도(단일) |\n| 2026-05~06 | Klue 고객 데이터 | 4년간 미사용이던 2022년 발급 파일럿 자격 증명 악용 | 보도(단일) |\n| 2026-05~06 | Instagram 계정 탈취 | AI 챗봇의 비밀번호 재설정 권한 남용 | 보도(단일) |\n| 2026-06 | IDScan | 미국·캐나다 운전면허 약 1.5억 건 보도 | 보도(단일) |\n| 2026 | JadePuffer 랜섬웨어 | AI 에이전트로 공격 일부 단계 자동화 | 보도(단일) |\n| 2026-08 | ATF 시스템 | 랜섬웨어 조직이 조사 대상 정보 침해 주장 | 보도(단일) |\n| 2026 상반기 | 한국 침해사고 신고 1,236건 | 서버 해킹 487건, DDoS 373건(+56.7%), 랜섬웨어 145건(+76.8%)(KISA·과기정통부 발표) | 확인(통계) |\n"},{"path":"과거3년/99-총평.md","title":"3년 총평 — 왜 계속 뚫리고, 무엇부터 막아야 하나","md":"# 3년 총평 — 왜 계속 뚫리고, 무엇부터 막아야 하나\n\n> 대상: 2023-10 ~ 2026-10 선정 사건(과거 3년 33건 + 일일 보고서 8건). **선정 사례의 공통점**이며 전체 공격의 통계가 아니다. 조치는 본 보고서의 권고, ATT&CK 완화(Mitigation) 이름·ID는 MITRE 공식 목록(v19.2)을 확인했다.\n\n**공통 원칙**: (1) 모든 '즉시' 조치는 증거(로그·메모리·디스크·클라우드 감사 기록)를 보존한 뒤 수행한다. (2) 침해된 장비·계정에서 새 비밀을 발급하지 않는다(재탈취 위험). (3) 패치·MFA·백업 같은 통제는 이미 발급된 세션·토큰·키, 이미 설치된 지속성, 오염된 복구본을 해결하지 못하므로 **회수·무효화·검증**을 별도 완료 조건으로 둔다. (4) '구조적 원인'은 확인된 사실이 아니라 본 보고서의 분석이다.\n\n## 1. 원인 유형별 정리\n\n| 유형 | 왜 일어났나(공통 원인) | 대표 사건 | 핵심 조치 | ATT&CK 완화 |\n|------|----------------------|-----------|-----------|-------------|\n| **A. 인터넷 노출 장비·서비스의 취약점** | 노출된 VPN·방화벽·MFT·ERP·프레임워크의 제로데이·미패치. 알려진 CVE를 몇 년씩 방치 | Citrix Bleed, Ivanti, PAN-OS, Salt Typhoon, Cleo, ToolShell, Oracle EBS, 롯데카드(2017 CVE), React2Shell / 일일: FortiMail, Citrix, Cisco, WordPress, PeopleSoft, Zammad | 외부 노출 자산 **전수 목록** → 관리면 비노출 → 악용 확인 시 즉시 격리·패치 → **패치 후 세션·키·자격 증명 회수** → 침해 의심 시 재구축 | Update Software(M1051), Vulnerability Scanning(M1016), Network Segmentation(M1030), Limit Access to Resource Over Network(M1035), Disable or Remove Feature or Program(M1042), Network Intrusion Prevention(M1031) |\n| **B. 자격 증명·MFA 부재/취약** | MFA 없는 원격 접속·SaaS, 훔친 자격 증명 재사용, 관리 콘솔 계정 탈취 | Change Healthcare, Snowflake, Midnight Blizzard, SGI서울보증(VPN 무차별 대입), Stryker(Intune 관리자), 쿠팡(퇴사자 키) | 외부 접근 전부 **MFA 강제(예외 0)** → 관리자는 **피싱 저항 MFA(FIDO2)** → 장기 자격 증명을 단기 토큰으로 → 특권 계정 분리·PIM → 퇴사 시 키·토큰 회수 | Multi-factor Authentication(M1032), Privileged Account Management(M1026), User Account Management(M1018), Account Use Policies(M1036), Password Policies(M1027), Credential Access Protection(M1043) |\n| **C. 서드파티·공급망·SaaS 연동** | 협력사·SaaS·오픈소스·CI 도구가 고객의 열쇠를 쥠. 한 번 뚫리면 하위로 연쇄 | Okta, XZ, tj-actions, Salesloft Drift, Shai-Hulud, TeamPCP(Trivy), BeyondTrust→재무부, Bybit(Safe), FBI(ISP 벤더), F5 | 서드파티 접근 **최소 권한·단기 토큰·IP 제한** → CI 의존성 **SHA 고정** → 비밀값 최소화(OIDC) → 지원 채널에 비밀·토큰 금지 → 계약상 침해 통지 SLA | Application Developer Guidance(M1013), Code Signing(M1045), Limit Software Installation(M1033), Audit(M1047), Network Segmentation(M1030), Restrict Library Loading(M1044) |\n| **D. 사회공학(헬프데스크·전화)** | 사람이 응답하는 절차(본인 확인·MFA 재설정)가 약함. 일회용 코드 MFA는 실시간 중계에 취약 | M&S·Co-op, ShinyHunters vishing, JLR(추정) | 헬프데스크 **콜백·관리자 승인** 본인 확인 → **FIDO2·패스키** → \"IT는 전화로 코드를 묻지 않는다\" 교육·신고 경로 → 조건부 접근(기기·위치) | User Training(M1017), Multi-factor Authentication(M1032), Out-of-Band Communications Channel(M1060), Account Use Policies(M1036) |\n| **E. 장기 체류·탐지 실패** | 로그 부족, 장비·코어망 가시성 부재, 평문 비밀. 기간이 길수록 피해를 못 셈 | SKT(4년), 법원(2년), F5(12개월 이상), M&S(14개월), DMDC(약 9개월) | 로그 **보존 기간 확대·외부 저장** → 위협 헌팅 정례화 → 코어·장비 EDR/eBPF·NDR → 대용량 외부 전송 경보 → 평문 비밀 제거 | Audit(M1047), Encrypt Sensitive Information(M1041), Data Loss Prevention(M1057), Network Intrusion Prevention(M1031), Behavior Prevention on Endpoint(M1040) |\n| **F. 백업·복구 부재(랜섬웨어)** | 백업이 같은 망에 연결, 복구 훈련 없음, 평면적 네트워크 | 예스24, SGI서울보증, 교원, M&S, JLR, Change Healthcare | **오프라인·불변 백업**(별도 자격 증명) → 복구 훈련(RTO·RPO) → 하이퍼바이저 격리 → IT/OT 분리 | Data Backup(M1053), Network Segmentation(M1030), Privileged Account Management(M1026), Restrict File and Directory Permissions(M1022) |\n| **G. 파괴·지정학** | 정치적 보복·국가 지원. 클라우드 관리 권한으로 파괴 | Stryker(Intune wipe), Kyivstar, 폴란드 인프라 | **다중 관리자 승인**·대량 삭제 제한 → 특권 접근 시간 제한 → 파괴 시나리오 복구 훈련 | Privileged Account Management(M1026), Data Backup(M1053), Audit(M1047) |\n| **H. 인증·키 설계 결함** | 공통 인증서·평문 계정·장기 서명 키처럼 설계상의 약점 | KT(공통 인증서·SMS 인증), SKT(평문 HSS 계정), 쿠팡(서명 키 5~10년) | 장비별 고유 인증서 → 키는 **KMS·HSM에만** → 키 수명 단축·정기 교체 → 결제 인증을 SMS에서 앱·생체로 | Encrypt Sensitive Information(M1041), Credential Access Protection(M1043), Password Policies(M1027) |\n| **I. 클라이언트 취약점** | 복잡한 포맷 파서의 메모리 결함, 표적 공격 | Apple CoreGraphics(일일) | OS 업데이트 강제, 고위험 사용자 Lockdown Mode, 비신뢰 파일 최소화 | Update Software(M1051), Exploit Protection(M1050), Execution Prevention(M1038) |\n\n유형 **J(경위·원인 미공개)**는 공개 자료로 원인을 분류할 수 없는 사건(예: 한국전력 정보 노출, 서울사이버대)에 쓴다.\n\n## 2. 시간 순서로 본 변화 (선정 사례 기준)\n\n- **2023~2024**: *엣지 장비 + 세션·자격 증명*. Citrix Bleed, Ivanti, PAN-OS가 VPN·방화벽을 열고, Okta·Snowflake·Change Healthcare는 로그인 쪽에서 뚫렸다. 공통점은 **MFA를 우회하거나 아예 없는 지점**.\n- **2025**: *서드파티·SaaS·공급망과 한국의 기본기 부재*. tj-actions·Salesloft·Shai-Hulud가 연쇄 피해를 만들었고, SKT·KT·롯데카드·예스24·SGI·쿠팡은 **평문 비밀, 8년 미패치, 백업 연결, 키 미회수**처럼 기본기 문제가 드러났다.\n- **2026**: *전화·AI 활용 사회공학과 파괴, 보안 도구 자체의 공급망*. ShinyHunters vishing, Stryker wipe, Trivy→Bitwarden 체인. 이어 2026-09~10에 Citrix·Cisco·FortiMail 같은 엣지 장비가 **다시** 제로데이로 나왔다.\n\n## 3. 한국 사건에서 반복되는 것\n\n| 반복 요인 | 사건 |\n|-----------|------|\n| 평문·방치된 비밀·키 | SKT(평문 HSS 계정), 쿠팡(서명 키 장기 보관·미회수), KT(공통 인증서) |\n| 오래된 취약점 미패치 | 롯데카드(WebLogic CVE-2017-10271) |\n| 웹셸 | 롯데카드, SKT(1종), 교원 |\n| 백업·복구 | 예스24(백업 부재), SGI서울보증(소산 백업까지 암호화), 교원 |\n| 원격 접속 | SGI서울보증(VPN 무차별 대입) |\n| 장기 미탐지 | SKT(2021~), 법원(2021~2023) |\n\n## 4. 우선순위 (비용 대비 효과순)\n\n1. **외부 노출 자산 목록과 축소**: 인터넷에서 보이는 관리면·VPN·MFT·ERP를 전부 찾아 꼭 필요한 것만 남긴다. 악용 확인 즉시 격리한다.\n2. **MFA 예외 0건 + 관리자는 피싱 저항 MFA**: 테스트·레거시·협력사·SaaS 포함.\n3. **패치 SLA와 \"패치 후 회수\"**: 악용 확인 취약점은 일 단위. 패치 뒤에는 세션·키·자격 증명을 반드시 교체한다.\n4. **오프라인·불변 백업과 복구 훈련**: 백업 자격 증명을 분리하고 복구 시간을 실제로 측정한다.\n5. **비밀·키 관리**: KMS·HSM, 수명 단축, 퇴사·계약 종료 시 회수 체크리스트, 지원·티켓에 비밀 금지.\n6. **서드파티·CI 통제**: 연동 토큰 최소 권한·IP 제한, 의존성·Action SHA 고정.\n7. **탐지**: 엣지·장비 로그 외부 보존, 웹셸·대량 외부 전송·관리 콘솔 대량 명령 경보.\n8. **사람 절차**: 헬프데스크 콜백 본인 확인, 전화 기반 사칭 교육.\n"},{"path":"ATTACK/README.md","title":"MITRE ATT&CK 전술별 누적 정리","md":"# MITRE ATT&CK 전술별 누적 정리\n\n기준: **ATT&CK Enterprise v19.2**. v19에서 TA0005는 *Defense Evasion*에서 **Stealth**로 개칭됐고 **Defense Impairment(TA0112)** 가 신설됐다. 과거 자료와 전술명이 다를 수 있으니 기법 ID로 비교한다.\n\n> 이 폴더의 `NN-*.md`와 이 파일은 `node build.mjs`가 생성한다. **원본은 `매핑.psv`** (사건-기법 매핑)와 `_catalog.psv`(공식 기법 목록)다. 쉬운 한국어 해설은 `기법해설.psv`·`전술해설.psv`.\n\n| 파일 | 전술 | ID | 사례 있는 기법 / 공식 기법 |\n|------|------|----|------|\n| [01-정찰.md](01-정찰.md) | 정찰 (Reconnaissance) | TA0043 | 0 / 12 |\n| [02-자원개발.md](02-자원개발.md) | 자원개발 (Resource Development) | TA0042 | 3 / 9 |\n| [03-초기접근.md](03-초기접근.md) | 초기접근 (Initial Access) | TA0001 | 7 / 11 |\n| [04-실행.md](04-실행.md) | 실행 (Execution) | TA0002 | 4 / 20 |\n| [05-지속성.md](05-지속성.md) | 지속성 (Persistence) | TA0003 | 7 / 22 |\n| [06-권한상승.md](06-권한상승.md) | 권한상승 (Privilege Escalation) | TA0004 | 1 / 13 |\n| [07-스텔스.md](07-스텔스.md) | 스텔스 (Stealth (구 Defense Evasion)) | TA0005 | 4 / 30 |\n| [08-방어약화.md](08-방어약화.md) | 방어약화 (Defense Impairment) | TA0112 | 1 / 18 |\n| [09-자격증명접근.md](09-자격증명접근.md) | 자격증명접근 (Credential Access) | TA0006 | 12 / 17 |\n| [10-탐색.md](10-탐색.md) | 탐색 (Discovery) | TA0007 | 0 / 34 |\n| [11-횡적이동.md](11-횡적이동.md) | 횡적이동 (Lateral Movement) | TA0008 | 2 / 9 |\n| [12-수집.md](12-수집.md) | 수집 (Collection) | TA0009 | 5 / 17 |\n| [13-C2.md](13-C2.md) | C2 (Command and Control) | TA0011 | 6 / 18 |\n| [14-유출.md](14-유출.md) | 유출 (Exfiltration) | TA0010 | 2 / 9 |\n| [15-영향.md](15-영향.md) | 영향 (Impact) | TA0040 | 6 / 15 |\n\n전체: 서로 다른 상위 기법 60개에서 사례가 관측됨 (공식 222개). 사건 51건, 매핑 168행.\n\n근거 수준: **확인**(벤더·CISA·연구기관 직접 확인) / **추정**(공개 자료에 없어 분석상 추정) / **후보**(조건이 확인되면 적용). 공격자 일방 주장은 표에 넣지 않고 일일 보고서에만 적는다.\n\n## 매일 갱신하는 법\n\n1. `일일/YYYY-MM-DD.md`에 사건을 `### [D\u003c날짜>-\u003c이름>]` 제목과 `> 날짜: … · 유형: … · 행위자: … · 지역: … · 근거: …` 메타 줄로 쓴다.\n2. `ATTACK/매핑.psv`에 `사건ID|전술|기법|근거|설명` 행을 추가한다.\n3. `node build.mjs`를 실행하면 전술별 파일, 타임라인, `index.html`이 갱신된다.\n"},{"path":"README.md","title":"사용법","md":"# 보안 이슈 · MITRE ATT&CK 정리\n\n**보는 법**: `index.html`을 더블클릭하면 브라우저에서 열린다. 서버가 필요 없다. 처음이라면 왼쪽 메뉴의 **처음이세요?** 부터 본다.\n\n## 화면 구성\n\n| 메뉴 | 내용 |\n|------|------|\n| 홈 | 최근 이슈를 쉽게 말하면, 통계 |\n| 처음이세요? | 화면 읽는 법, 근거 표기, 원인 유형, ATT&CK 소개 |\n| 사건 타임라인 | 41건, 연도·원인 유형·근거로 필터. 사건마다 쉽게 말하면 → 먼저 할 일 → 원인 → 침투 경로 → 조치 |\n| 국내 소식 | 한국 사건(`지역: 한국`)과 국내 뉴스 브리핑 |\n| ATT&CK 매트릭스 | 15개 전술 × 공식 기법, 기법마다 쉬운 한국어 이름·설명 |\n| 위협 행위자 · 일일 보고서 · 용어집 · 문서 | |\n\n## 폴더\n\n| 위치 | 내용 | 직접 편집 |\n|------|------|-----------|\n| `일일/YYYY-MM-DD.md` | 그날의 이슈: 쉽게 말하면 / 원인 / 침투 경로 / 조치 | O |\n| `과거3년/YYYY.md` | 2023-10 이후 큰 사건 (연도별) | O |\n| `과거3년/99-총평.md` | 원인 유형별 정리와 조치 우선순위 | O |\n| `국내뉴스.psv` | 국내 뉴스 브리핑 (날짜\\|분류\\|출처\\|요약\\|URL\\|관련사건) | O |\n| `분류.psv` | 사건의 원인 유형 A~I | O |\n| `용어집.psv` | 초보용 용어 설명 (화면에서 처음 나올 때 밑줄) | O |\n| `ATTACK/매핑.psv` | 사건-ATT&CK 기법 매핑 (원본) | O |\n| `ATTACK/기법해설.psv`, `전술해설.psv` | ATT&CK 쉬운 한국어 해설 | O |\n| `ATTACK/_catalog.psv` | ATT&CK v19.2 공식 기법 목록 | 버전 갱신 때만 |\n| `ATTACK/NN-*.md`, `ATTACK/README.md`, `과거3년/00-타임라인.md`, `용어집.md`, `국내뉴스.md`, `index.html` | **자동 생성** | X |\n\n## 갱신\n\n1. 사건을 `### [ID] 제목` + `> 날짜: … · 유형: … · 행위자: … · 지역: … · 근거: …` 형식으로 쓴다. 메타 줄 다음에 `**쉽게 말하면**: …`, `**먼저 할 일(초보용)**: …` 문단을 쓴다.\n2. `ATTACK/매핑.psv`에 `사건ID|전술|기법|근거|설명` 행을, `분류.psv`에 원인 유형을 추가한다. 새 기법이면 `ATTACK/기법해설.psv`에도 쉬운 설명을 추가한다.\n3. 한국 소식은 `국내뉴스.psv`에 한 줄 추가한다.\n4. `./sync.ps1` 실행 — `node build.mjs`로 재생성하고, 보안이슈 폴더만 골라 커밋·push까지 한 번에 처리한다(공개 사이트는 push 시점에 GitHub Actions가 다시 빌드한다). 누락·불일치는 `build.mjs`가 경고로 알려 준다.\n\n## 사건 한 건의 구성\n\n쉽게 말하면 → 먼저 할 일 → 개요 → **왜 일어났나**(직접 원인 + 구조적 원인) → 침투 경로 → **어떻게 조치하나**(즉시·단기·장기·탐지) → 교훈.\n근거 표기: 확인 / 보도 / 추정 / 주장. 조치는 이 문서의 권고이며 벤더 공식 지침이 우선한다. '먼저 할 일'은 시작점이지 전체 대응이 아니다.\n"},{"path":"용어집.md","title":"보안 용어집 (초보용)","md":"# 보안 용어집 (초보용)\n\n> 자동 생성. 원본은 `용어집.psv`. 보고서와 화면에서 이 용어가 처음 나오면 밑줄로 표시되고, 마우스를 올리면 뜻이 보인다.\n\n| 용어 | 쉬운 설명 |\n|------|------|\n| CVE | 취약점에 붙는 공식 번호표(예: CVE-2026-1234). 같은 결함을 모두가 같은 이름으로 부르게 해 준다. |\n| CVSS | 취약점의 위험도를 0~10점으로 매긴 점수. 높을수록 위험하다. |\n| KEV | 미국 CISA가 '실제로 악용되고 있다'고 확인한 취약점 목록. 여기 오르면 서둘러 패치해야 한다. |\n| 제로데이 | 제조사가 아직 모르거나 아직 패치가 없는 취약점. 이를 이용한 공격을 '제로데이 공격'이라 한다(보도에서는 '이미 공격에 쓰이는 미패치 취약점'을 뜻하는 경우가 많다). |\n| 취약점 | 소프트웨어·장비의 보안 결함. 공격자가 이를 이용해 들어온다. |\n| 패치 | 결함을 고치는 업데이트. |\n| RCE | 원격 코드 실행. 공격자가 멀리서 상대 서버에 명령을 실행시키는 것으로 가장 위험한 유형 중 하나다. |\n| 인증 우회 | 로그인 확인을 건너뛰고 들어가는 결함. |\n| 웹셸 | 웹서버에 심어 두는 악성 파일. 공격자가 인터넷으로 접속해 서버에 명령을 내리는 '뒷문'이다. |\n| 백도어 | 정상 로그인 없이 다시 들어올 수 있게 숨겨 둔 통로. |\n| 랜섬웨어 | 파일을 암호화해 못 쓰게 만든 뒤, 풀어 주는 대가로 돈을 요구하는 악성코드. |\n| 와이퍼 | 돈 요구 없이 데이터를 그냥 지워 버리는 파괴형 악성코드. |\n| 인포스틸러 | PC에서 비밀번호·쿠키 등을 훔치는 악성코드. |\n| 피싱 | 가짜 메일·사이트로 속여 정보를 빼내는 수법. |\n| vishing | 전화로 속여 정보를 빼내는 수법(음성 피싱). |\n| 사회공학 | 기술이 아니라 사람을 속여 정보를 얻는 공격. |\n| MFA | 다중 인증. 비밀번호(아는 것)에 더해 휴대전화·보안키(가진 것)나 지문(신체 특징)처럼 서로 다른 종류를 함께 확인한다. 문자 코드는 가로채일 수 있어 방식에 따라 강도가 다르다. |\n| FIDO2 | 비밀번호·코드를 입력하지 않고 보안키·기기 인증을 쓰는 방식. 등록된 사이트인지 확인해 인증하므로 가짜 로그인 사이트에 강하다. 기기 감염이나 로그인 뒤의 세션 탈취까지 막아 주지는 않는다. |\n| 패스키 | FIDO2 기반의 비밀번호 없는 로그인. 지문·얼굴 등으로 인증한다. |\n| SSO | 한 번 로그인하면 여러 서비스에 같이 접속되는 통합 로그인. |\n| IdP | SSO 같은 로그인을 대신 확인해 주는 서비스(예: Okta, Entra ID). |\n| OAuth | 앱이 비밀번호 없이 다른 서비스에 접속하도록 허락해 주는 방식. 허락의 증표가 '토큰'이다. |\n| 토큰 | 로그인 상태나 접근 권한을 나타내는 값. 일부는 유출되면 유효기간과 권한 범위 안에서 비밀번호 없이도 악용될 수 있다. |\n| 세션 하이재킹 | 훔친 로그인 상태(쿠키·토큰)로 그 사람인 척 접속하는 것. |\n| 세션 | 로그인한 뒤 이어지는 접속 상태. |\n| 쿠키 | 웹사이트가 로그인 상태 등을 기억하려고 브라우저에 저장하는 작은 정보. |\n| 자격 증명 | 아이디·비밀번호·토큰·키처럼 신원을 증명하는 정보. |\n| 패스워드 스프레이 | 흔한 비밀번호 몇 개를 수많은 계정에 돌려 가며 시도하는 공격. |\n| 무차별 대입 | 비밀번호를 계속 바꿔 가며 맞을 때까지 시도하는 공격. |\n| EDR | PC·서버에서 수상한 행동을 감시하는 보안 프로그램. |\n| WAF | 웹사이트 앞에서 공격성 요청을 걸러 주는 웹 방화벽. |\n| VPN | 바깥에서 회사 내부망에 안전하게 접속하게 해 주는 통로. |\n| 방화벽 | 네트워크 출입을 규칙으로 막고 허용하는 장비. |\n| 엣지 장비 | 회사 네트워크와 인터넷의 경계에 있는 장비(VPN·방화벽·메일 게이트웨이 등). |\n| ERP | 회계·인사·재고 같은 회사 핵심 업무를 관리하는 시스템. |\n| MFT | 기업이 큰 파일을 안전하게 주고받게 해 주는 파일 전송 소프트웨어. |\n| SaaS | 설치 없이 웹으로 쓰는 서비스(예: Salesforce, Slack). |\n| 공급망 공격 | 고객이 쓰는 소프트웨어·협력사를 먼저 뚫어 그 고객 모두를 노리는 공격. |\n| SBOM | 소프트웨어에 어떤 부품(라이브러리)이 들어 있는지 적은 목록. |\n| CI/CD | 코드를 자동으로 빌드·시험·배포하는 개발 자동화 과정. |\n| 의존성 | 내 프로그램이 가져다 쓰는 외부 라이브러리·패키지. |\n| 서명 키 | 로그인 토큰이 진짜임을 보증하는 비밀 도장. 유출되면 가짜 토큰을 만들 수 있다. |\n| KMS | 암호 키를 안전하게 보관·관리하는 전용 서비스. |\n| HSM | 키가 장치 밖으로 나가지 않게 보관하는 전용 보안 장치. |\n| 불변 백업 | 정해진 기간 동안 수정·삭제를 막아 둔 백업. 별도 관리 권한과 복구 훈련이 함께 필요하고, 오염된 데이터를 되돌려 주지는 못한다. |\n| 헬프데스크 | 직원·고객의 문의를 받아 계정 문제 등을 처리하는 지원 창구. |\n| 횡적 이동 | 한 시스템에 들어온 뒤 내부의 다른 시스템으로 옮겨 가는 것. |\n| 지속성 | 재부팅·비밀번호 변경 뒤에도 침입 상태를 유지하는 것. |\n| 권한 상승 | 일반 권한에서 관리자 같은 높은 권한을 얻는 것. |\n| 터널링 | 허용된 통신 안에 다른 통신을 숨겨 보내 방화벽을 통과하는 기법. |\n| 프록시 | 중간에서 통신을 대신 전달해 주는 서버. 공격자는 출처를 숨기는 데 쓴다. |\n| C2 | 공격자가 감염된 기기를 원격으로 조종하는 연결(명령·제어). |\n| IOC | 침해 흔적을 알려 주는 단서(악성 IP, 파일 이름 등). |\n| APT | 정부 지원 등으로 장기간·치밀하게 공격하는 조직. |\n| 포렌식 | 침해 증거를 보존·분석해 무슨 일이 있었는지 밝히는 조사. |\n| 최소 권한 | 꼭 필요한 권한만 주는 원칙. |\n| PAM | 관리자 같은 높은 권한 계정을 별도로 통제·기록하는 관리 방식. |\n| 조건부 접근 | 기기·위치·위험도에 따라 로그인을 허용하거나 막는 정책. |\n| ESXi | VMware의 가상 서버 운영 소프트웨어. 한 대에 서버 수십 개가 올라간다. |\n| Intune | 마이크로소프트의 기기 관리 서비스. 원격 초기화 같은 기능이 있다. |\n| MDM | 회사가 직원 스마트폰·PC를 원격으로 관리하는 방식. |\n| 역직렬화 | 전달받은 데이터를 프로그램 객체로 되돌리는 처리. 신뢰할 수 없는 데이터를 위험한 방식으로 복원하면 구현에 따라 코드 실행 같은 문제가 생길 수 있다. |\n| SHA 고정 | 검토한 특정 코드를 고유 번호(SHA)로 지정해 몰래 바뀌는 것을 막는 방법. 악성 코드를 고정하면 그대로 실행되므로 코드가 안전하다는 보증은 아니다. |\n| LFI | 서버에 있는 파일을 프로그램이 불러오게 만드는 결함(로컬 파일 포함). |\n| 정규화 | URL 같은 입력을 하나의 표준 형태로 바꾸는 처리. 검사 단계와 처리 단계가 다르게 해석하면 우회가 생긴다. |\n| NTDS.dit | 윈도 도메인의 모든 계정 비밀번호 정보가 들어 있는 파일. |\n| USIM | 휴대폰 가입자를 식별·인증하는 칩(유심). |\n| 펨토셀 | 집·사무실용 초소형 기지국. |\n| TACACS+ | 네트워크 장비 관리자 로그인을 확인하는 프로토콜. |\n| DTLS | UDP 통신을 암호화하는 방식(VPN 등에서 쓴다). |\n| BPFDoor | 특정 통신 신호로 깨우는 방식으로 숨어 있는 리눅스 백도어. |\n| 오픈소스 | 누구나 코드를 보고 쓸 수 있게 공개된 소프트웨어. |\n| KISA | 한국인터넷진흥원. 한국의 인터넷·보안 지원 기관. |\n| CISA | 미국 사이버보안·인프라보안국. |\n| ATT&CK | MITRE가 만든 '공격자가 쓰는 행동 사전'. 전술(목표)과 기법(방법)으로 정리한다. |\n| SAML | 회사 로그인(SSO)에서 \"이 사람이 맞다\"는 증명서를 주고받는 표준 방식. 이 방식을 처리하는 장비 부분의 결함이 문제가 된 사례가 있다. |\n| 서비스 거부(DoS) | 장비나 서비스를 과부하·오류로 멈추게 해 정상 사용을 막는 공격. 데이터가 새는 것과는 다른 피해다. |\n| 접속키 | 서비스·서버에 접속할 때 쓰는 비밀 열쇠(API 키·액세스 키 등). 코드나 개발 PC에 방치하면 유출 위험이 크다. |\n| AI 에이전트 | 스스로 판단해 여러 단계의 작업을 자동으로 이어서 수행하는 AI. 공격에 쓰이면 사람보다 훨씬 빠르게 시도할 수 있다. |\n| ARTEX | 오픈소스 LLM 기반 자율 침투 테스트 도구(보도). 방어 점검용이지만 공격에도 쓸 수 있고, 금융권 사건에서 사용 여부는 확정되지 않았다. |\n| 민관합동조사단 | 정부와 민간 전문가가 함께 침해사고의 원인과 피해를 조사하는 팀. |\n| SQL 삽입 | 입력칸에 데이터베이스 명령을 끼워 넣어 원래 허용되지 않은 정보를 읽거나 바꾸는 공격. 입력값을 제대로 검사하지 않을 때 가능하다. |\n| 핫월렛 | 거래소가 즉시 이체할 수 있도록 인터넷에 연결해 둔 가상자산 지갑. 편리하지만 침해되면 바로 자산이 빠져나갈 수 있다. |\n"},{"path":"국내뉴스.md","title":"국내 보안 소식","md":"# 국내 보안 소식\n\n> 자동 생성. 원본은 `국내뉴스.psv`(뉴스 브리핑)와 각 사건 파일 중 `지역: 한국`인 사건.\n\n## 국내 주요 사건\n\n| 날짜 | 사건 | 유형 | 문서 |\n|------|------|------|------|\n| 2026-10-04 | 서울사이버대 개인정보 유출 | 개인정보 유출 | [2026-10-06-국내보충.md](일일/2026-10-06-국내보충.md) |\n| 2026-10-01 | 한국전력 전 직원 개인정보 외부 노출 | 정보 노출 | [2026-10-06-국내보충.md](일일/2026-10-06-국내보충.md) |\n| 2026-09-29 | 금융권 동시다발 해킹 (AI 자동화 공격 정황) | 다수 금융사·자동화 공격 | [2026-10-06-국내보충.md](일일/2026-10-06-국내보충.md) |\n| 2026-05-30 | 티빙(TVING) 가입자 3,954만 계정 유출 | 키 관리·개인정보 | [2026.md](과거3년/2026.md) |\n| 2026-02-01 | 외교부(국립외교원 온라인교육시스템) 개인정보 유출 | 장기 체류·개인정보 | [2026-10-06-국내보충.md](일일/2026-10-06-국내보충.md) |\n| 2026-01-10 | 교원그룹 랜섬웨어 | 랜섬웨어·웹셸 | [2026.md](과거3년/2026.md) |\n| 2025-11 | 쿠팡 3,370만 계정 개인정보 유출 | 내부자·인증키 관리 | [2025.md](과거3년/2025.md) |\n| 2025-08-26 | 롯데카드 개인정보 유출 (WebLogic 미패치) | 엣지·서버 취약점·금융 | [2025.md](과거3년/2025.md) |\n| 2025-08 | KT 무단 소액결제 (불법 초소형 기지국) | 통신망·인증 | [2025.md](과거3년/2025.md) |\n| 2025-07-14 | SGI서울보증 랜섬웨어 | 랜섬웨어·원격 접속 | [2025.md](과거3년/2025.md) |\n| 2025-06-09 | 예스24 랜섬웨어 | 랜섬웨어 | [2025.md](과거3년/2025.md) |\n| 2025-04-22 | SK텔레콤 USIM 정보 유출 | 국가 규모 개인정보·통신 | [2025.md](과거3년/2025.md) |\n| 2024-05-10 | 한국 법원 전산망 해킹 (Lazarus) | 국가 지원 APT·정보 탈취 | [2024.md](과거3년/2024.md) |\n\n## 뉴스 브리핑\n\n| 날짜 | 분류 | 출처 | 요약 |\n|------|------|------|------|\n| 2026-10-06 | 침해사고 | [데일리안(보도)](https://dailian.co.kr/news/view/1697907/%EB%8B%A8%EB%8F%85-%EC%99%B8%EA%B5%90%EA%B4%80-%EA%B0%9C%EC%9D%B8%EC%A0%95%EB%B3%B4-%EC%B5%9C%EB%8C%80-1%EB%A7%8C%EA%B1%B4-%ED%84%B8-2026) | 국립외교원 온라인교육시스템에서 최대 1만 건 정보가 유출됐고, 인지 7개월이 지나도록 책임자 조치가 없었다는 국회 자료 보도. |\n| 2026-10-05 | 분석 | [전자신문(보도)](https:/  공격에 쓰이는 미패치 취약점'을 뜻하는 경우가 많다)."],["취약점","소프트웨어·장비의 보안 결함. 공격자가 이를 이용해 들어온다."],["패치","결함을 고치는 업데이트."],["RCE","원격 코드 실행. 공격자가 멀리서 상대 서버에 명령을 실행시키는 것으로 가장 위험한 유형 중 하나다."],["인증 우회","로그인 확인을 건너뛰고 들어가는 결함."],["웹셸","웹서버에 심어 두는 악성 파일. 공격자가 인터넷으로 접속해 서버에 명령을 내리는 '뒷문'이다."],["백도어","정상 로그인 없이 다시 들어올 수 있게 숨겨 둔 통로."],["랜섬웨어","파일을 암호화해 못 쓰게 만든 뒤, 풀어 주는 대가로 돈을 요구하는 악성코드."],["와이퍼","돈 요구 없이 데이터를 그냥 지워 버리는 파괴형 악성코드."],["인포스틸러","PC에서 비밀번호·쿠키 등을 훔치는 악성코드."],["피싱","가짜 메일·사이트로 속여 정보를 빼내는 수법."],["vishing","전화로 속여 정보를 빼내는 수법(음성 피싱)."],["사회공학","기술이 아니라 사람을 속여 정보를 얻는 공격."],["MFA","다중 인증. 비밀번호(아는 것)에 더해 휴대전화·보안키(가진 것)나 지문(신체 특징)처럼 서로 다른 종류를 함께 확인한다. 문자 코드는 가로채일 수 있어 방식에 따라 강도가 다르다."],["FIDO2","비밀번호·코드를 입력하지 않고 보안키·기기 인증을 쓰는 방식. 등록된 사이트인지 확인해 인증하므로 가짜 로그인 사이트에 강하다. 기기 감염이나 로그인 뒤의 세션 탈취까지 막아 주지는 않는다."],["패스키","FIDO2 기반의 비밀번호 없는 로그인. 지문·얼굴 등으로 인증한다."],["SSO","한 번 로그인하면 여러 서비스에 같이 접속되는 통합 로그인."],["IdP","SSO 같은 로그인을 대신 확인해 주는 서비스(예: Okta, Entra ID)."],["OAuth","앱이 비밀번호 없이 다른 서비스에 접속하도록 허락해 주는 방식. 허락의 증표가 '토큰'이다."],["토큰","로그인 상태나 접근 권한을 나타내는 값. 일부는 유출되면 유효기간과 권한 범위 안에서 비밀번호 없이도 악용될 수 있다."],["세션 하이재킹","훔친 로그인 상태(쿠키·토큰)로 그 사람인 척 접속하는 것."],["세션","로그인한 뒤 이어지는 접속 상태."],["쿠키","웹사이트가 로그인 상태 등을 기억하려고 브라우저에 저장하는 작은 정보."],["자격 증명","아이디·비밀번호·토큰·키처럼 신원을 증명하는 정보."],["패스워드 스프레이","흔한 비밀번호 몇 개를 수많은 계정에 돌려 가며 시도하는 공격."],["무차별 대입","비밀번호를 계속 바꿔 가며 맞을 때까지 시도하는 공격."],["EDR","PC·서버에서 수상한 행동을 감시하는 보안 프로그램."],["WAF","웹사이트 앞에서 공격성 요청을 걸러 주는 웹 방화벽."],["VPN","바깥에서 회사 내부망에 안전하게 접속하게 해 주는 통로."],["방화벽","네트워크 출입을 규칙으로 막고 허용하는 장비."],["엣지 장비","회사 네트워크와 인터넷의 경계에 있는 장비(VPN·방화벽·메일 게이트웨이 등)."],["ERP","회계·인사·재고 같은 회사 핵심 업무를 관리하는 시스템."],["MFT","기업이 큰 파일을 안전하게 주고받게 해 주는 파일 전송 소프트웨어."],["SaaS","설치 없이 웹으로 쓰는 서비스(예: Salesforce, Slack)."],["공급망 공격","고객이 쓰는 소프트웨어·협력사를 먼저 뚫어 그 고객 모두를 노리는 공격."],["SBOM","소프트웨어에 어떤 부품(라이브러리)이 들어 있는지 적은 목록."],["CI/CD","코드를 자동으로 빌드·시험·배포하는 개발 자동화 과정."],["의존성","내 프로그램이 가져다 쓰는 외부 라이브러리·패키지."],["서명 키","로그인 토큰이 진짜임을 보증하는 비밀 도장. 유출되면 가짜 토큰을 만들 수 있다."],["KMS","암호 키를 안전하게 보관·관리하는 전용 서비스."],["HSM","키가 장치 밖으로 나가지 않게 보관하는 전용 보안 장치."],["불변 백업","정해진 기간 동안 수정·삭제를 막아 둔 백업. 별도 관리 권한과 복구 훈련이 함께 필요하고, 오염된 데이터를 되돌려 주지는 못한다."],["헬프데스크","직원·고객의 문의를 받아 계정 문제 등을 처리하는 지원 창구."],["횡적 이동","한 시스템에 들어온 뒤 내부의 다른 시스템으로 옮겨 가는 것."],["지속성","재부팅·비밀번호 변경 뒤에도 침입 상태를 유지하는 것."],["권한 상승","일반 권한에서 관리자 같은 높은 권한을 얻는 것."],["터널링","허용된 통신 안에 다른 통신을 숨겨 보내 방화벽을 통과하는 기법."],["프록시","중간에서 통신을 대신 전달해 주는 서버. 공격자는 출처를 숨기는 데 쓴다."],["C2","공격자가 감염된 기기를 원격으로 조종하는 연결(명령·제어)."],["IOC","침해 흔적을 알려 주는 단서(악성 IP, 파일 이름 등)."],["APT","정부 지원 등으로 장기간·치밀하게 공격하는 조직."],["포렌식","침해 증거를 보존·분석해 무슨 일이 있었는지 밝히는 조사."],["최소 권한","꼭 필요한 권한만 주는 원칙."],["PAM","관리자 같은 높은 권한 계정을 별도로 통제·기록하는 관리 방식."],["조건부 접근","기기·위치·위험도에 따라 로그인을 허용하거나 막는 정책."],["ESXi","VMware의 가상 서버 운영 소프트웨어. 한 대에 서버 수십 개가 올라간다."],["Intune","마이크로소프트의 기기 관리 서비스. 원격 초기화 같은 기능이 있다."],["MDM","회사가 직원 스마트폰·PC를 원격으로 관리하는 방식."],["역직렬화","전달받은 데이터를 프로그램 객체로 되돌리는 처리. 신뢰할 수 없는 데이터를 위험한 방식으로 복원하면 구현에 따라 코드 실행 같은 문제가 생길 수 있다."],["SHA 고정","검토한 특정 코드를 고유 번호(SHA)로 지정해 몰래 바뀌는 것을 막는 방법. 악성 코드를 고정하면 그대로 실행되므로 코드가 안전하다는 보증은 아니다."],["LFI","서버에 있는 파일을 프로그램이 불러오게 만드는 결함(로컬 파일 포함)."],["정규화","URL 같은 입력을 하나의 표준 형태로 바꾸는 처리. 검사 단계와 처리 단계가 다르게 해석하면 우회가 생긴다."],["NTDS.dit","윈도 도메인의 모든 계정 비밀번호 정보가 들어 있는 파일."],["USIM","휴대폰 가입자를 식별·인증하는 칩(유심)."],["펨토셀","집·사무실용 초소형 기지국."],["TACACS+","네트워크 장비 관리자 로그인을 확인하는 프로토콜."],["DTLS","UDP 통신을 암호화하는 방식(VPN 등에서 쓴다)."],["BPFDoor","특정 통신 신호로 깨우는 방식으로 숨어 있는 리눅스 백도어."],["오픈소스","누구나 코드를 보고 쓸 수 있게 공개된 소프트웨어."],["KISA","한국인터넷진흥원. 한국의 인터넷·보안 지원 기관."],["CISA","미국 사이버보안·인프라보안국."],["ATT&CK","MITRE가 만든 '공격자가 쓰는 행동 사전'. 전술(목표)과 기법(방법)으로 정리한다."],["SAML","회사 로그인(SSO)에서 \"이 사람이 맞다\"는 증명서를 주고받는 표준 방식. 이 방식을 처리하는 장비 부분의 결함이 문제가 된 사례가 있다."],["서비스 거부(DoS)","장비나 서비스를 과부하·오류로 멈추게 해 정상 사용을 막는 공격. 데이터가 새는 것과는 다른 피해다."],["접속키","서비스·서버에 접속할 때 쓰는 비밀 열쇠(API 키·액세스 키 등). 코드나 개발 PC에 방치하면 유출 위험이 크다."],["AI 에이전트","스스로 판단해 여러 단계의 작업을 자동으로 이어서 수행하는 AI. 공격에 쓰이면 사람보다 훨씬 빠르게 시도할 수 있다."],["ARTEX","오픈소스 LLM 기반 자율 침투 테스트 도구(보도). 방어 점검용이지만 공격에도 쓸 수 있고, 금융권 사건에서 사용 여부는 확정되지 않았다."],["민관합동조사단","정부와 민간 전문가가 함께 침해사고의 원인과 피해를 조사하는 팀."],["SQL 삽입","입력칸에 데이터베이스 명령을 끼워 넣어 원래 허용되지 않은 정보를 읽거나 바꾸는 공격. 입력값을 제대로 검사하지 않을 때 가능하다."],["핫월렛","거래소가 즉시 이체할 수 있도록 인터넷에 연결해 둔 가상자산 지갑. 편리하지만 침해되면 바로 자산이 빠져나갈 수 있다."]],"techNotes":{"T1003":["컴퓨터에서 계정 정보 뽑기","컴퓨터(OS) 안에 저장된 아이디·비밀번호(해시)를 통째로 꺼내 간다."],"T1005":["컴퓨터 안의 자료 모으기","침투한 컴퓨터·서버에 있는 파일을 찾아 모은다."],"T1021":["원격 접속 기능으로 이동","SSH·원격 데스크톱 같은 정상 원격 접속 기능으로 다른 컴퓨터로 옮겨 간다."],"T1027":["코드·파일 숨기기(난독화)","악성 코드를 알아보기 어렵게 인코딩·암호화해 탐지를 피한다."],"T1036":["정상인 척 위장","악성 파일의 이름·모양을 정상 프로그램처럼 꾸민다."],"T1040":["네트워크 통신 엿보기","네트워크를 지나가는 데이터(비밀번호 등)를 몰래 읽는다."],"T1041":["조종 통로로 데이터 빼내기","공격자가 원격 조종에 쓰는 연결을 그대로 이용해 자료를 밖으로 보낸다."],"T1053":["예약 작업으로 자동 실행","cron·작업 스케줄러에 등록해 정해진 때마다 악성 작업이 실행되게 한다. 재부팅해도 유지된다."],"T1056":["입력값 가로채기","로그인 화면 등에 입력하는 아이디·비밀번호를 몰래 가로챈다."],"T1059":["명령·스크립트 실행","쉘·PowerShell·Python·PHP 같은 도구로 명령을 실행한다."],"T1068":["취약점으로 권한 올리기","소프트웨어 결함을 이용해 일반 권한에서 관리자(root) 권한으로 올라간다."],"T1070":["흔적(로그) 지우기","로그 같은 침입 흔적을 지워 조사를 어렵게 한다."],"T1071":["평범한 웹 통신으로 조종","HTTP 같은 흔한 통신에 명령을 섞어 정상 트래픽처럼 보이게 한다."],"T1072":["관리·배포 도구 악용","기기 관리·소프트웨어 배포 도구를 악용해 명령이나 프로그램을 실행한다(많은 기기에 한꺼번에 내릴 수도 있다)."],"T1078":["유효한 계정 악용(정상 계정으로 로그인)","훔치거나 얻은 진짜(유효한) 계정으로 로그인한다. 보안 장치가 정상 사용자로 착각하기 쉽다."],"T1090":["중계(프록시) 사용","다른 서버·기기를 거쳐 통신해 출처를 숨기거나 내부망 접근을 우회한다."],"T1098":["계정 권한 조작","계정이나 앱에 권한을 추가·변경해 접근을 유지한다."],"T1105":["공격 도구 내려받기","침투한 기기에 외부에서 추가 악성 도구를 내려받는다."],"T1110":["비밀번호 대량 시도","비밀번호를 계속 바꿔 넣어 맞는 것을 찾는다(무차별 대입·패스워드 스프레이)."],"T1111":["2단계 인증 가로채기","SMS·인증 코드·푸시 승인 같은 2단계 인증 정보를 가로채 로그인을 완성한다."],"T1114":["이메일 수집","메일함의 내용을 읽거나 복사해 간다."],"T1133":["외부 원격 접속 이용","VPN·원격 데스크톱처럼 바깥에서 들어오는 서비스를 통해 접속한다."],"T1136":["새 계정 만들기","나중에 쓰려고 몰래 새 계정을 만든다."],"T1190":["인터넷에 열린 서비스의 취약점 공격","웹사이트·VPN·메일 장비처럼 인터넷에서 보이는 서비스의 결함을 공격해 들어온다. 가장 흔한 첫 침투 방법이다."],"T1195":["공급망 오염","고객이 쓰는 소프트웨어·패키지·개발 도구를 미리 오염시켜, 그것을 쓰는 모두를 감염시킨다."],"T1199":["믿는 협력사를 통해 침투","거래·연동 중인 업체의 접속 권한을 이용해 들어온다."],"T1200":["악성 장비 연결","가짜 기지국·USB 같은 장비를 설치해 침투한다."],"T1203":["사용자 프로그램 취약점으로 실행","문서·이미지를 여는 프로그램의 결함을 이용해 악성 코드를 실행시킨다."],"T1205":["신호 패킷으로 백도어 깨우기","특정한 통신 신호를 받으면 숨어 있던 악성코드가 반응한다(BPFDoor 등)."],"T1213":["업무 시스템에서 자료 빼내기","CRM·위키·데이터베이스·소스 저장소 같은 업무 저장소에서 데이터를 가져간다."],"T1219":["원격 제어 프로그램 설치","정상적인 원격 관리 프로그램을 설치해 몰래 조종한다."],"T1485":["데이터 파괴","파일·시스템을 복구하기 어렵게 지운다."],"T1486":["파일 암호화(랜섬웨어)","파일을 암호화해 못 쓰게 만들고, 풀어 주는 대가로 돈을 요구한다."],"T1490":["복구 수단 막기","백업·복구 기능을 지우거나 망가뜨려 복구를 어렵게 한다."],"T1505":["서버에 숨은 악성 부품(웹셸 등)","서버 소프트웨어에 악성 부품을 심어 언제든 다시 들어올 수 있게 한다(대표 사례가 웹셸)."],"T1528":["앱 접속 토큰 훔치기","앱이 서비스에 접속할 때 쓰는 열쇠(OAuth·API 토큰)를 훔친다."],"T1539":["로그인 상태(쿠키) 훔치기","이미 로그인된 상태를 나타내는 쿠키·세션 정보를 훔친다."],"T1550":["인증 자료 악용(훔친 증표로 로그인)","비밀번호 대신 훔친 토큰·쿠키·해시 같은 인증 자료를 내밀어 로그인한다."],"T1552":["안전하지 않게 놓인 비밀번호 찾기","파일·로그·설정에 평문으로 적힌 비밀번호·키를 찾아낸다."],"T1554":["정상 프로그램 변조","서버·장비에 설치된 정상 프로그램 파일을 바꿔 악성 기능을 넣는다."],"T1555":["저장된 비밀번호 꺼내기","브라우저·비밀번호 관리자 등에 저장된 계정 정보를 꺼낸다."],"T1556":["로그인 절차 조작","인증 과정을 바꿔서 비밀번호 없이 통과하거나 비밀번호를 수집한다."],"T1557":["중간자 공격","통신 중간에 끼어들어 내용을 가로채거나 바꾼다."],"T1565":["데이터 변조","화면·거래·데이터를 바꿔 속인다."],"T1566":["피싱(속여서 접속)","이메일·문자·전화(비싱)로 속여 비밀번호나 접속을 얻는다."],"T1567":["웹 서비스로 데이터 반출","GitHub·클라우드 저장소 같은 정상 웹 서비스에 훔친 데이터를 올려 빼낸다."],"T1572":["터널링","허용된 통신(HTTP 등) 안에 다른 통신을 숨겨 방화벽을 통과한다."],"T1574":["실행 흐름 가로채기","프로그램이 불러오는 라이브러리 등을 바꿔 정상 프로그램 안에서 악성 코드를 돌린다."],"T1583":["공격용 서버·도메인 마련","가짜 도메인·임대 서버처럼 공격에 쓸 인프라를 확보한다."],"T1585":["가짜 계정 만들기","신뢰를 얻거나 속이기 위해 가짜 온라인 계정을 만든다."],"T1599":["네트워크 경계 우회","장비의 접근 규칙(ACL) 등을 바꿔 막혀 있던 구간을 이어 붙인다."],"T1602":["장비 설정 정보 빼내기","네트워크 장비의 설정 파일(비밀번호 등 포함)을 가져간다."],"T1606":["로그인 증표 위조","쿠키·토큰 같은 로그인 증표를 직접 만들어 낸다."],"T1649":["인증서 훔치기·위조","장비·사용자가 신원을 증명하는 인증서를 훔치거나 복제한다."],"T1650":["접근 권한 구입","이미 뚫린 접근 권한이나 계정을 구매해 활용한다."],"T1657":["금전 갈취·탈취","협박·몸값 요구, 사기, 기술적 탈취 등으로 돈을 가져간다(MITRE 정의에 협박이 포함돼 있다)."],"T1671":["클라우드 앱 연동으로 거점 확보","악성 앱·연동을 등록해 비밀번호가 바뀌어도 접근을 유지한다."],"T1677":["개발 자동화 파이프라인 오염","CI/CD 자동화 작업 안에 악성 명령을 넣어 비밀 키를 가져간다."],"T1119":["자동으로 자료 모으기","프로그램으로 많은 정보를 반복 조회·수집한다."],"T1499":["서비스 멈추게 하기","장비나 서비스를 과부하·오류로 멈추게 해 쓰지 못하게 한다."],"T1595":["공격 대상 스캔·탐색","공격 전 const gMap = new Map(glossary.map(([t, d]) => [esc(t), d]));
const gRe = new RegExp([...gMap.keys()].sort((a, b) => b.length - a.length).map(k => {
  const e = k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return /^[\x20-\x7e]+$/.test(k) ? `(?<![A-Za-z0-9])${e}(?![A-Za-z0-9])` : e;
}).join('|'), 'g');
let seenTerms = new Set();
function gl(html){
  let skip = 0;
  return html.split(/(<[^>]+>)/).map(p => {
    if (p[0] === '<') {
      if (/^<(code|pre|a|abbr|h[1-6]|button|th)[\s>]/i.test(p)) skip++;
      else if (/^<\/(code|pre|a|abbr|h[1-6]|button|th)>/i.test(p)) skip = Math.max(0, skip - 1);
      return p;
    }
    if (skip || !p.trim()) return p;
    return p.replace(gRe, m => {
      if (seenTerms.has(m)) return m;
      seenTerms.add(m);
      return `<abbr class="g" tabindex="0" data-tip="${esc(gMap.get(m))}">${m}</abbr>`;
    });
  }).join('');
}

function inline(s){
  s = esc(s);
  const codes = [];
  s = s.replace(/`([^`]+)`/g, (m, c) => { codes.push(c); return '\u0000' + (codes.length - 1) + '\u0000'; });
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?![*\w])/g, '$1<em>$2</em>');
  s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (m, t, h) => /^https?:/.test(h)
    ? `<a href="${h}" target="_blank" rel="noopener">${t}</a>` : `<a href="#" data-rel="${h}">${t}</a>`);
  return s.replace(/\u0000(\d+)\u0000/g, (m, i) => `<code>${codes[i]}</code>`);
}
function buildList(items){
  let html = '', st = [];
  for (const it of items) {
    while (st.length && it.ind < st[st.length - 1].ind) html += '</li></' + (st.pop().ord ? 'ol' : 'ul') + '>';
    if (!st.length || it.ind > st[st.length - 1].ind) { html += '<' + (it.ord ? 'ol' : 'ul') + '><li>' + inline(it.text); st.push({ ind: it.ind, ord: it.ord }); }
    else html += '</li><li>' + inline(it.text);
  }
  while (st.length) html += '</li></' + (st.pop().ord ? 'ol' : 'ul') + '>';
  return html;
}
function md(text){
  const L = text.replace(/\r/g, '').split('\n'); const out = []; let i = 0;
  const isBlock = l => /^(#{1,6} |```|>|---+\s*$|\s*([-*]|\d+\.)\s|\|)/.test(l);
  while (i < L.length) {
    const l = L[i];
    if (/^```/.test(l)) { const c = []; i++; while (i < L.length && !/^```/.test(L[i])) c.push(L[i++]); i++; out.push('<pre><code>' + esc(c.join('\n')) + '</code></pre>'); continue; }
    let m;
    if ((m = l.match(/^(#{1,6}) (.*)$/))) { out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`); i++; continue; }
    if (/^---+\s*$/.test(l)) { out.push('<hr>'); i++; continue; }
    if (/^>/.test(l)) { const q = []; while (i < L.length && /^>/.test(L[i])) q.push(inline(L[i++].replace(/^>\s?/, ''))); out.push('<blockquote>' + q.join('<br>') + '</blockquote>'); continue; }
    if (/^\|/.test(l) && /^\|[\s:|-]+\|?\s*$/.test(L[i + 1] || '')) {
      const cells = r => r.replace(/^\|/, '').replace(/\|\s*$/, '').split('|').map(c => c.trim());
      const head = cells(l); i += 2; const rows = [];
      while (i < L.length && /^\|/.test(L[i])) rows.push(cells(L[i++]));
      out.push('<table><thead><tr>' + head.map(c => `<th>${inline(c)}</th>`).join('') + '</tr></thead><tbody>' +
        rows.map(r => '<tr>' + r.map(c => `<td>${inline(c)}</td>`).join('') + '</tr>').join('') + '</tbody></table>'); continue;
    }
    if (/^\s*([-*]|\d+\.)\s+/.test(l)) {
      const items = [];
      while (i < L.length) {
        const mm = L[i].match(/^(\s*)([-*]|\d+\.)\s+(.*)$/);
        if (mm) { items.push({ ind: mm[1].length, ord: /\d/.test(mm[2]), text: mm[3] }); i++; }
        else if (L[i].trim() && /^\s{2,}\S/.test(L[i]) && items.length) { items[items.length - 1].text += ' ' + L[i++].trim(); }
        else break;
      }
      out.push(buildList(items)); continue;
    }
    if (!l.trim()) { i++; continue; }
    const p = [];
    while (i < L.length && L[i].trim() && !(p.length && isBlock(L[i]))) p.push(L[i++]);
    out.push('<p>' + p.map(inline).join('<br>') + '</p>');
  }
  return out.join('\n');
}
function sections(text){
  return text.split(/\n\s*\n/).map(b => {
    const lab = (b.match(/^\*\*([^*]+)\*\*/) || [, ''])[1];
    const cls = /^(쉽게 말하면|먼저 할 일)/.test(lab) ? 's-easy' : /^개요/.test(lab) ? 's-over' : /^왜 일어났나/.test(lab) ? 's-why' : /^침투 경로/.test(lab) ? 's-path' : /^어떻게 조치하나/.test(lab) ? 's-fix' : /^교훈/.test(lab) ? 's-less' : '';
    return `<div class="sec ${cls}">${md(b)}</div>`;
  }).join('');
}
function resolveDoc(base, href){
  const target = href.split('#')[0]; if (!target) return null;
  const parts = base.split('/').slice(0, -1);
  for (const seg of target.split('/')) { if (seg === '..') parts.pop(); else if (seg && seg !== '.') parts.push(seg); }
  const p = parts.join('/');
  return docs.find(d => d.path === p) ? p : null;
}
