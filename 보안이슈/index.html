냥 지워 버리는 파괴형 악성코드(와이퍼)에 공격당해, VPS(가상서버)·S3(클라우드 저장소)·쿠버네티스 데이터와 CDN·IP 설정까지 모두 잃었다고 밝혔습니다. 회사는 데이터가 외부로 빠져나가거나 바뀐 흔적은 없고 \"오직 파괴\"만을 노린 공격으로 보인다고 설명했습니다. 20만 명 이상의 고객(온라인 쇼핑몰·미디어·교육 서비스 포함)이 영향을 받았고, VPS의 이진(바이너리) 백업은 완전히 사라졌으며 파일 백업도 절반 정도만 남아 있어 전체 인프라를 처음부터 다시 구축하고 있습니다.\n**먼저 할 일(초보용)**: 국내 이용자가 직접 영향받는 사건은 아닙니다. 다만 비슷한 호스팅·클라우드 서비스를 운영하는 담당자는 관리 시스템 접근 권한을 지금 재검토하고, 네트워크에서 완전히 분리된(오프라인) 백업이 있는지 확인해 보세요 — 온라인으로 연결된 백업은 와이퍼가 함께 지울 수 있습니다.\n\n**개요**: 2026년 11월 1일 밤, 공격자가 Beget의 전체 아키텍처를 관리하는 시스템에 접근해 서버 데이터를 지우는 스크립트를 실행했다. 회사는 악성코드가 작동한 직후 이를 탐지해 모든 서버를 네트워크에서 차단해 확산을 막았다고 밝혔다. VPS·S3(클라우드 저장소)·쿠버네티스 데이터, CDN 설정, IP 구성이 모두 소실됐다. VPS의 이진(바이너리) 백업은 전부 사라졌고, 파일 백업은 일부만 남아 있어 VPS 이용자의 약 절반 정도에게만 복구가 가능할 것으로 추정했으며, 백업과 개별 이용자를 다시 연결하는 작업이 기술적으로 복잡하다고 설명했다. 약 1,000대의 서버는 취약점·숨겨진 스크립트 여부를 수동으로 점검해야 한다. 회사는 경찰·정부기관에 신고했고 보안업체와 함께 조사 중이며, 11/3·11/6에 중간 공지를 냈다. 11월 9일 기준 공유 호스팅의 약 60%, 전용 서버의 약 40%가 복구됐고 작업은 계속 진행 중이다. 보도는 공격자의 신원이나 동기(국가 연계 여부 포함)를 전혀 언급하지 않았다 — 러시아 회사라는 사실만 확인되며, 지정학적 배경은 이번 보도에서 확인되지 않았다.\n\n**왜 일어났나**\n- 직접 원인 [확인 — 세부 경로는 미공개]: 공격자가 Beget의 전체 아키텍처 관리 시스템에 접근해 데이터 삭제 스크립트를 실행했다(회사 자체 확인). 최초 침투 경로는 공개되지 않았다.\n- 구조적 원인 [추정 — 분석]: VPS 이진 백업이 \"완전히\" 사라졌다는 것은, 백업이 운영 인프라와 네트워크로 연결돼 있어 와이퍼가 원본과 백업을 함께 지울 수 있었을 가능성을 보여준다(공식 확인은 아님). 오프라인(네트워크에서 분리된) 백업이 없었다면, 아무리 빠르게 탐지해도 복구 범위는 제한될 수밖에 없다.\n\n**침투 경로**: 공격자가 \"전체 아키텍처를 관리하는 시스템\"에 접근했다는 점만 확인됐다. 최초 접근 방법(자격 증명 탈취·취약점 악용 등)이 공개되지 않아, 본 저장소는 구체적인 ATT&CK 기법을 매핑하지 않는다. 다만 데이터 삭제 행위 자체는 확인됐다.\n\n**어떻게 조치하나**\n- 즉시: (회사 조치) 전체 서버 네트워크 차단으로 확산 저지, 경찰·정부기관 신고, 보안업체와 공동 조사. (본 보고서의 권고) 유사 업종은 관리 시스템 접근 권한을 지금 전수 재검토한다.\n- 단기: 살아남은 백업의 무결성을 검증하고, 모든 서버를 \"잠재적 감염\"으로 간주해 취약점·숨겨진 스크립트를 점검한다(회사가 실제로 취한 접근).\n- 장기: 운영 인프라와 분리된(오프라인·에어갭) 백업 체계를 구축해, 관리 시스템이 완전히 장악되더라도 백업만은 살아남도록 한다.\n- 탐지: 전체 아키텍처 관리 시스템에 대한 비정상 접근·대량 삭제 명령 실행을 실시간 모니터링한다.\n\n**교훈**: \"탐지가 빨랐다\"는 것과 \"피해가 적었다\"는 것은 다른 이야기다. Beget는 악성코드가 작동한 직후 탐지해 즉시 차단했지만, 그 짧은 시간에도 전체 인프라를 처음부터 다시 구축해야 할 만큼의 피해가 났다. 백업이 운영 시스템과 같은 네트워크 안에 있다면, 아무리 빨리 대응해도 \"복구할 백업 자체가 없는\" 상황을 막지 못한다.\n\n### [D20261110-sega] SEGA, 뉴스레터 발송업체 ARARA 침해로 구독자 이메일 220만 건 유출\n> 날짜: 공격(ARARA 추정) 2026년 10월 말 이전 · ARARA 침해 공개 2026-11-02 · SEGA 통지 받음 2026-11-03 · SEGA 공개 2026-11-09 · 유형: 서드파티(이메일 발송 대행사) 공급망 침해 · 행위자: 미귀속 · 지역: 전 세계(일본, 해외) · 근거: 확인(ARARA·SEGA 자체 확인)\n\n**쉽게 말하면**: 일본 게임사 SEGA가 뉴스레터 발송을 맡겼던 외부 업체 ARARA가 해킹당해, SEGA·SEGA Fave 관련 뉴스레터 11개에 등록된 구독자 220만 명의 이메일 주소가 유출됐습니다. ARARA는 자사가 쓰는 웹서버의 결함 때문이라고 밝혔는데, 이 업체를 쓰는 다른 고객사(MOS버거 750만 명, 쇼치쿠 멀티플렉스 극장 330만 명 등)까지 합치면 노출 규모가 약 7,700만 건에 이릅니다. SEGA는 이름·생년월일·주소·전화번호·신용카드 정보·계정 비밀번호는 영향받지 않았다고 밝혔습니다. 참고로 같은 시기 SEGA Fave의 아케이드 네트워크(ALL.Net·Aime) 서버에서도 별도의 비인가 접근이 있었지만, 회사는 이 사건과는 무관하다고 설명했습니다.\n**먼저 할 일(초보용)**: SEGA·SEGA Fave 관련 뉴스레터 구독자는 신용카드사를 사칭한 피싱 이메일(이미 10월 말부터 700만 건 이상 발송된 것으로 확인됨)에 특히 주의하세요. 비밀번호는 영향받지 않았다고 밝혔으므로 바꿀 필요는 없습니다.\n\n**개요**: 이메일 발송 대행업체 ARARA는 2026-11-02 자사 서비스가 침해당했다고 공개했으며, 웹서버 결함과 시스템 환경 문제를 원인으로 지목했지만 구체적인 침투 경로와 시점은 조사 중이라고 밝혔다. ARARA의 고객사 약 380곳이 영향을 받았고, 전체 노출 규모는 약 7,700만 건에 이른다(SEGA 외 MOS버거 750만 건, 쇼치쿠 멀티플렉스 극장 330만 건, TKC 230만 건, IIJmio 약 100만 건 포함). SEGA와 관련해서는 SEGA·SEGA Fave 제품에 연계된 뉴스레터 11개의 구독자 이메일 주소 220만 건과, 내용이 아직 파악 중인 추가 레코드 9만 2,300건이 노출 대상이다. SEGA는 이름·생년월일·성별·주소·전화번호·신용카드 정보·계정 비밀번호는 포함되지 않았으며, SEGA 계정용 이메일은 별도 시스템이라 영향받지 않았다고 밝혔다. 타임라인은 10월 말 공격자가 신용카드사를 사칭한 이메일 700만 건 이상을 발송 → 10/29 ARARA가 SEGA에 \"데이터 미침해\"라고 알림 → 11/2 ARARA가 침해를 공개 → 11/3 ARARA가 SEGA에 데이터 노출을 통지 → 11/5~8 세부 정보 공유 → 11/9 SEGA 공개 순이다. 한편 11/2 SEGA Fave는 아케이드 네트워크(ALL.Net·Aime)를 지원하는 서버에 대한 별도의 비인가 접근을 공개했는데, 서비스는 유지보수·안전 점검을 위해 오프라인 상태이며 고객 데이터 탈취나 결제 정보 영향의 증거는 없다고 밝혔다. SEGA는 이 사건이 ARARA 침해와는 무관하다고 설명했다.\n\n**왜 일어났나**\n- 직접 원인 [확인]: ARARA의 웹서버 결함(세부 종류 미공개)이 악용돼 비인가 접근이 이뤄졌고, 여기 보관된 SEGA 등 380개 고객사의 구독자 데이터가 노출됐다(ARARA 자체 확인).\n- 구조적 원인 [추정 — 분석]: 하나의 이메일 발송 대행업체가 380개 기업의 구독자 데이터를 한곳에 모아 관리하는 구조라면, 그 업체 하나의 결함이 7,700만 건 규모의 노출로 한꺼번에 번질 수 있다. 각 기업은 자사 시스템을 지켜도, 위탁한 서드파티의 보안 수준까지는 직접 통제하기 어렵다.\n\n**침투 경로 [확인 — ARARA 측 발표 기준, 세부 결함 미공개]**: 공격자가 ARARA의 웹서버 결함을 악용해 비인가 접근(T1190) → 보관된 고객사 구독자 데이터베이스(SEGA 포함 380개사)에 접근·반출(T1213). 공격자가 구체적으로 어떤 결함을 썼는지는 공개되지 않았다.\n\n**어떻게 조치하나**\n- 즉시: (SEGA·ARARA 조치, 보도 기준) 조사 진행, 영향 범위 확인, 고객사·구독자 통지. (본 보고서의 권고) 신용카드사 사칭 피싱에 이미 노출된 구독자는 해당 카드사 공식 채널로 진위를 확인한다.\n- 단기: 서드파티 이메일 발송 업체와의 계약에 보안 감사·침해 통지 기한 조항이 있는지 재확인하고, 필요하면 업체 교체를 검토한다.\n- 장기: 뉴스레터처럼 저위험으로 여겨지는 업무도 외부 위탁 시 벤더 보안 평가(서드파티 리스크 관리) 대상에 포함한다.\n- 탐지: 노출된 이메일 주소를 겨냥한 피싱 캠페인(신용카드사 사칭 등)의 패턴을 모니터링하고 구독자에게 경보한다.\n\n**교훈**: \"뉴스레터 발송\"처럼 핵심 업무로 보이지 않는 외주 기능이, 실제로는 수백만 명의 개인정보가 모이는 지점이 될 수 있다. 서드파티 하나의 결함이 여러 기업·수천만 명에게 동시에 영향을 준다는 점에서, 위탁 업무의 보안 수준도 자사 시스템과 동등하게 점검해야 한다.\n\n## 3. 국내 소식\n\n- **⑤정부 발표**: 개인정보보호위원회가 11/9 반복·중대 유출 시 매출액 최대 10% 과징금, 선제적 투자 시 최대 40% 감경(고의·중과실 제외) 방침을 발표했다는 보도를 `국내뉴스.psv`에 기록했다.\n\n## 4. 우선 대응 체크리스트\n\n1. **N-central(RMM) 온프레미스 운영 조직(최우선, 신규)**: [D20261110-nable](#d20261110-nable-n-able-rmm-플랫폼-n-central-연구자가-제로데이-30여-건-무단-공개) — 서버 지금 종료 또는 외부 접근 차단.\n2. **냉동·냉장 제어시스템을 운영하는 유통·식품·물류 기관(신규)**: [D20261110-iranfridge](#d20261110-iranfridge-프랑스-10월-슈퍼마켓-냉동시설-공격을-이란-irgc-연계-조직에-공식-귀속) — 컨트롤러 인터넷 노출 여부 즉시 점검([11-06 체크리스트](2026-11-06.md#4-우선-대응-체크리스트) 1번과 동일 대상).\n3. **SEGA·SEGA Fave 관련 뉴스레터 구독자(신규)**: [D20261110-sega](#d20261110-sega-sega-뉴스레터-발송업체-arara-침해로-구독자-이메일-220만-건-유출) — 신용카드사 사칭 피싱 메일 주의.\n4. **호스팅·클라우드 운영사**: [D20261110-beget](#d20261110-beget-러시아-호스팅업체-beget-데이터-와이퍼-공격으로-전체-인프라-재구축) — 아키텍처 관리 시스템 권한 재검토 및 오프라인(에어갭) 백업 점검.\n\n## 5. 검증 수준과 한계\n\n- N-able 사건은 30여 건의 결함 전체가 실재하는지, N-able이 이전 제보를 무시했다는 연구자의 주장이 맞는지 모두 검증되지 않았다. N-able 측 설명(실제 악용 미확인)만을 사실로 채택했다.\n- 프랑스의 이란 귀속 발표(`D20261110-iranfridge`)는 프랑스 정부의 공식 결론이지만 공유 인프라·도구·시점·언어 흔적 같은 정황 증거에 기반하며, 11월 벨기에·네덜란드 2차 공격([11-02 보고서](2026-11-02.md))과 프랑스 혈액원(EFS) 사건([11-06 보고서](2026-11-06.md))은 귀속 대상에서 제외됐다.\n- Beget 와이퍼 공격의 최초 침투 경로는 공개되지 않아 ATT&CK 초기접근 기법을 매핑하지 않았다.\n\n## 출처\n\n- BleepingComputer: \"N-able takes N-central hosted RMM offline after researcher drops 30+ zero-days\", \"France links October supermarket refrigeration cyberattacks to Iran\", \"Russian web host Beget rebuilds infrastructure after data wiper attack\", \"SEGA says 2.2M newsletter subscribers' emails leaked in vendor breach\"\n- 데일리시큐: \"개인정보 유출 반복 땐 매출 10% 과징금...사전 보안 투자 기업엔 최대 40% 감경\"(idxno=209412)\n- MITRE ATT&CK v20.1\n"},{"path":"일일/2026-11-10.md","title":"일일 보안 이슈 분석 — 2026-11-10","md":"# 일일 보안 이슈 분석 — 2026-11-10\n\n> 수집 기준: 2026-11-10 공개·보도분([11-07](2026-11-07.md)~[11-09](2026-11-09.md) 보고서 이후). CISA KEV 2026-11-09 신규 등재분(GPUStack CVE-2026-102895, SignalWire FreeSWITCH CVE-2026-116779, IBM Aspera Faspex CVE-2026-123218 등)과 국내 보안뉴스·데일리시큐 원문을 확인했다.\n> 근거 표기: **[확인]** 벤더·정부기관·연구기관이 직접 확인 / 보도 언론 보도 / **[추정]** 본 보고서의 추정 / **[주장]** 공격자 일방 주장. **조치는 본 보고서의 권고**이며 벤더 공식 지침이 우선한다.\n> **ATT&CK 버전 점검**: attack.mitre.org 직접 확인 결과 공식 버전은 **v20.1**이다.\n\n## 1. 오늘의 요약\n\n| # | 이슈 | 유형 | 상태 | 즉시 조치 |\n|---|------|------|------|-----------|\n| 1 | 원격지원 SaaS '리모트콜'(알서포트) 침해, 고객사 상담원·관리자 정보 유출 | SaaS 벤더 침해(고객사 다수 영향) | [확인] 회사 자체 확인, KISA 신고 | 리모트콜 관련 출처불명 이메일·문자 링크 열지 않기 |\n| 2 | 가상자산거래소 연쇄 피해(고팍스 협박메일·거래중단, 프라뱅 자산탈취), 금감원 CISO 소집 | 가상자산거래소 침해·갈취 | [확인] 거래소 자체 공지·금융당국 발표 | 고팍스·프라뱅 이용자는 거래소 공식 공지 확인 |\n| 3 | GPUStack 루프백 헤더 신뢰 인증 우회·코드 실행(CVE-2026-102895) 실제 악용 | AI 클러스터 관리 도구 인증 우회(실제 악용 확인) | [확인] CISA KEV 11/9 등재(기한 11/23) | GPUStack 2.2.0 이상 업데이트 또는 `force_auth_localhost=true` 설정 |\n| 4 | SignalWire FreeSWITCH SIP MESSAGE API 명령 실행(CVE-2026-116779) 실제 악용 | VoIP·통신 플랫폼 원격 코드 실행(실제 악용 확인) | [확인] CISA KEV 11/9 등재(기한 11/23) | FreeSWITCH 1.11.3 이상 업데이트 및 비인증 SIP 접근 제한 |\n| 5 | IBM Aspera Faspex 인가 우회 관리자 권한 획득(CVE-2026-123218) 실제 악용 | 대용량 파일 전송 솔루션 권한 상승(실제 악용 확인) | [확인] CISA KEV 11/9 등재(기한 11/23) | Faspex 5.0.19 패치(5.0.19.1 이상) 즉시 적용 |\n\n> 11/07~11/09 사건은 각각 [2026-11-07](2026-11-07.md)(SSHole OpenSSH·SonicWall SSL-VPN), [2026-11-08](2026-11-08.md)(Iris Ohyama·SM엔터 3사·메타인크립터), [2026-11-09](2026-11-09.md)(N-able·프랑스 이란 귀속·Beget 와이퍼·SEGA ARARA) 보고서에 분리 수록했다.\n\n## 2. 이슈별 분석\n\n### [D20261110-rsupport] 원격지원 SaaS '리모트콜'(알서포트) 침해, 고객사 상담원·관리자 정보 유출\n> 날짜: 비정상 징후 발견 2026-10-28 · KISA 신고 2026-10-29 · 보도 2026-11-01·11-10 · 유형: SaaS(원격지원) 벤더 침해(고객사 다수 영향, 경위 조사 중) · 행위자: 미귀속 · 지역: 한국 · 근거: 확인(회사 자체 확인, KISA 신고)\n\n**쉽게 말하면**: 국내 기업들이 상담센터·원격지원에 쓰는 소프트웨어 회사 알서포트의 서비스 '리모트콜' 운영 사이트가 외부 공격자에게 뚫렸습니다. 내부 개발자 PC에서 이상 징후가 발견돼 조사가 시작됐고, 그 결과 리모트콜을 쓰는 고객사들의 회사명, 고객사 운영관리자 연락처, 상담원 이메일 주소가 유출된 것으로 확인됐습니다. 다행히 지금까지는 최종 소비자(상담을 받은 일반 고객)의 개인정보나 원격지원 중 오간 데이터가 유출된 흔적은 없다고 회사가 밝혔습니다. 다만 공격자가 정확히 어떤 경로로 침투했는지는 아직 조사 중입니다.\n**먼저 할 일(초보용)**: 리모트콜을 쓰는 고객사의 운영관리자·상담원은 출처가 불분명한 이메일·문자의 링크나 첨부파일을 지금부터 열지 마세요. 유출된 연락처·이메일을 이용한 표적 피싱(회사 관계자 사칭)이 우려됩니다.\n\n**개요**: 알서포트는 2026년 10월 28일, 원격지원 SaaS '리모트콜'의 운영 사이트에 외부 공격자가 비인가 접근한 사실을 확인했고, 다음 날 KISA(한국인터넷진흥원)에 신고했다. 조사는 내부 개발자 PC에서 발견된 이상 징후를 계기로 시작됐다. 확인된 유출 정보는 고객사명, 고객사 운영관리자의 연락처, 상담원 이메일 주소다. 피해 고객사 수와 정확한 유출 규모는 공개되지 않았으며, 최종 소비자의 개인정보나 원격지원 관련 데이터(상담 내용, 원격 제어 기록 등)가 유출된 정황은 현재까지 확인되지 않았다고 밝혔다. 공격 경로가 개발자 PC를 거친 것인지, 개발자의 계정·인증정보가 먼저 탈취된 것인지는 조사 중이다. 회사는 비인가 접근 경로를 차단했고, 고객에게 출처가 불분명한 이메일·문자의 링크·첨부파일을 열지 말라고 당부했다.\n\n**왜 일어났나**\n- 직접 원인 [확인 — 세부는 조사 중]: 리모트콜 운영 사이트에 외부 공격자의 비인가 접근이 있었다는 사실은 확인됐지만, 최초 침투 경로(개발자 PC 경유 여부 등)는 아직 조사 중이다.\n- 구조적 원인 [추정 — 분석]: 원격지원 SaaS는 그 자체로 고객사의 상담원·관리자 계정 정보를 다루며 고객사 시스템에 원격으로 접속하는 권한을 가진다. 이런 벤더 하나가 침해되면, 직접 공격받지 않은 여러 고객사의 임직원 연락처까지 한꺼번에 노출될 수 있는 공급망형 위험을 안고 있다.\n\n**침투 경로 [매핑 안 함 — 경위 조사 중, 미공개]**: 내부 개발자 PC의 이상 징후를 계기로 침해가 드러났다는 사실 외에, 최초 침투 방법과 공격 경로는 공개되지 않았다. 본 저장소는 경위가 공개되지 않은 사건에 ATT&CK 기법을 매핑하지 않는다.\n\n**어떻게 조치하나**\n- 즉시: (회사 조치) 비인가 접근 경로 차단, KISA 신고, 고객 대상 피싱 주의 안내. (본 보고서의 권고) 유출된 연락처를 보유한 고객사는 담당 상담원·관리자에게 사칭 피싱 위험을 선제적으로 공지한다.\n- 단기: 조사 결과가 나오면 개발자 PC·계정이 최초 침투 경로였는지 확정하고, 관련 인증정보를 전부 교체한다.\n- 장기: SaaS 벤더는 개발자 PC·내부 계정처럼 고객 데이터에 간접 접근할 수 있는 경로에도 고객 데이터베이스와 동등한 접근 통제·모니터링을 적용한다.\n- 탐지: 리모트콜 관련 연락처를 겨냥한 표적 피싱 시도, 고객사 시스템에 대한 비정상 원격 접속 요청을 모니터링한다.\n\n**교훈**: \"최종 소비자 데이터는 안전하다\"는 설명만으로 이 사건이 작다고 보기는 어렵다. 유출된 것이 상담원·관리자의 연락처라 해도, 이는 다음 단계 표적 피싱의 재료가 될 수 있다. 원격지원 SaaS처럼 여러 고객사의 '통로' 역할을 하는 서비스는 그 자체가 공급망 위험의 축소판이라는 점을 보여준다.\n\n### [D20261110-cryptoexch] 가상자산거래소 연쇄 피해(고팍스 협박메일·거래중단, 프라뱅 자산탈취), 금감원 CISO 소집\n> 날짜: 고팍스 비인가 접근(추정) 2026년 9월 초 · 고팍스 협박메일·거래중단 2026-11-06 · 프라뱅 자산 탈취(시점 미공개) · 금융위 전 금융권(가상자산 포함) 보안점검 발표 2026-11-05 · 금감원 CISO 소집 공지 2026-11-08(회의 11-19) · 유형: 가상자산거래소 침해·갈취(경위 대부분 미공개) · 행위자: 미귀속 · 지역: 한국 · 근거: 확인(거래소 자체 공지·금융당국 발표)\n\n**쉽게 말하면**: 국내 가상자산(암호화폐) 거래소들이 잇따라 피해를 입으면서 금융감독원이 모든 국내 가상자산사업자의 정보보호최고책임자(CISO)를 11월 19일 긴급 소집하기로 했습니다. 거래소 '고팍스'는 9월 초 일부 계정에 비인가 접근이 있어 이용자 7,000명과 임직원 2명의 개인정보가 유출됐는데, 11월 6일에는 공격자로부터 금품을 요구하는 협박 이메일을 받고 모든 입출금·거래를 중단하며 자산을 콜드월렛(인터넷과 분리된 저장장치)으로 옮기고 있습니다. 코인마켓 거래소 '프라뱅'은 약 1억 원 상당의 자산을 탈취당했습니다. (참고로 한 보도에는 '바이낸스가 북한 추정 공격으로 63억 달러를 잃었다'는 내용도 섞여 있었는데, 정작 바이낸스는 해킹 자체를 부인하고 있어 — 서로 다른 보도가 충돌해 이 부분은 이번 보고서에서 제외했습니다.)\n**먼저 할 일(초보용)**: 고팍스 이용자는 거래소의 공식 공지를 확인하고 자산 이동(콜드월렛 전환) 상황을 지켜보세요. 프라뱅 이용자는 거래소의 공식 공지를 확인하세요. 두 거래소 모두 사칭 피싱에 특히 주의하세요.\n\n**개요**: 금융위원회는 2026-11-05 가상자산사업자를 포함한 전 금융권 보안점검을 발표했고, 금융감독원은 2026-11-08 이에 따른 후속 조치로 국내 모든 가상자산사업자(거래소·수탁업체 포함)의 CISO를 11월 19일 소집해 보안 운영 현황을 점검하고 대응책을 논의한다고 밝혔다. 거래소별로는 ①고팍스가 2026년 9월 초 일부 이용자 계정에 비인가 접근이 있어 이용자 7,000명과 현직·전직 임직원 2명의 개인정보가 유출됐다고 확인했고, 11월 6일 공격자로부터 금품을 요구하는 협박 이메일을 받자 모든 입출금·거래를 중단하고 보유 자산을 콜드월렛으로 옮기는 조치에 들어갔다. ②코인마켓(원화 거래 지원이 제한된 소형) 거래소 프라뱅은 약 1억 원 상당의 자산을 탈취당했다고 확인됐다. ③빗썸의 사내 모바일 그룹웨어 침해(고객 844명·임직원 715명)는 이미 [D20261103-finsector2](2026-11-01.md)에 기록된 사건으로, 이번 조사에서 같은 사건임을 재확인했다 — 중복 기록하지 않는다. 한편 같은 기사는 '바이낸스가 북한 추정 공격자에게 약 63억 달러를 탈취당했다'고도 전했으나, 같은 시기 BleepingComputer는 바이낸스가 ShinyHunters의 유출 주장을 공식적으로 부인했다고 보도해 두 보도가 서로 맞지 않는다 — 바이낸스 관련 내용은 서로 다른 사건이 뒤섞였을 가능성이 있어 이번 보고서는 이 부분을 채택하지 않고 한계에만 기록한다. 고팍스·프라뱅 모두 구체적인 최초 침투 경로는 공개되지 않았다.\n\n**왜 일어났나**\n- 직접 원인 [확인 — 사별로 경위 대부분 미공개]: 고팍스는 일부 계정의 비인가 접근, 프라뱅은 자산 탈취 사실 자체만 확인됐고, 구체적인 침투 방법은 양사 모두 공개하지 않았다.\n- 구조적 원인 [추정 — 분석]: 9월 빗썸부터 11월 고팍스·프라뱅까지 몇 달 사이 여러 국내 가상자산거래소에서 반복적으로 사고가 이어지는 패턴은, 거래소 업계 전반의 보안 투자·인력이 전통 금융권(은행·증권)보다 상대적으로 뒤처져 있을 가능성을 시사한다(공식 조사 결과는 아니며 분석상 추정). 금융당국이 CISO를 한꺼번에 소집한 것도 이런 업계 전반의 반복 패턴을 우려한 조치로 보인다.\n\n**침투 경로 [매핑 안 함 — 경위 미공개]**: 고팍스·프라뱅 모두 구체적인 최초 침투 경로가 공개되지 않아 ATT&CK 기법을 매핑하지 않는다. 다만 자금·자산이 실제로 빠져나간 결과(프라뱅의 자산 탈취, 고팍스에 대한 금품 요구)는 확인된 행위로서 영향(Impact) 단계에만 매핑한다.\n\n**어떻게 조치하나**\n- 즉시: (거래소 조치) 고팍스는 전체 입출금·거래 중단, 콜드월렛 이전. (본 보고서의 권고) 영향 가능 계정은 비밀번호·API 키를 지금 재발급한다(침해된 기기가 아닌 안전한 기기에서).\n- 단기: 협박 메일의 요구에 응하지 않고 수사기관에 신고하며, 유출된 이용자 데이터를 이용한 2차 피싱·사칭에 대한 이용자 경보를 발송한다.\n- 장기: 11월 19일 금감원 CISO 소집 결과에 따라 가상자산사업자 전반의 보안 운영 기준(콜드월렛 비율, 침해 탐지체계 등)을 표준화한다.\n- 탐지: 거래소 내부 시스템에 대한 비정상 접근, 대량 자산 이동·출금 패턴을 실시간 모니터링한다.\n\n**교훈**: 금품을 요구하는 협박 이메일을 받고서야 거래를 전면 중단하는 대응은, 침해 시점(9월)과 심각성 인지 시점(11월) 사이에 상당한 시차가 있었음을 보여준다. 또한 보도마다 서로 다른 사건(바이낸스 북한 귀속 추정 피해와 ShinyHunters의 바이낸스 유출 주장)이 뒤섞여 전달되는 경우, 독자가 \"바이낸스가 또 해킹당했다\"로 오인하기 쉽다는 점도 함께 드러난다.\n\n### [D20261110-gpustack] GPUStack 루프백 헤더 신뢰 인증 우회·원격 코드 실행(CVE-2026-102895) 실제 악용\n> 날짜: 취약점 공개 2026-11-04 · CISA KEV 등재 2026-11-09(조치 기한 2026-11-23) · 유형: AI·GPU 클러스터 관리 플랫폼 인증 우회 및 원격 코드 실행(실제 악용 확인) · 행위자: 미귀속 · 지역: 전 세계(해외) · 근거: 확인(벤더 보안 권고·CISA KEV 등재)\n\n**쉽게 말하면**: 여러 대의 GPU 서버에서 AI 모델을 돌리고 관리하는 오픈소스 플랫폼 'GPUStack'(2.2.0 미만)에서, 외부 요청에 `X-GPUStack-Real-IP: 127.0.0.1`이라는 헤더 한 줄만 붙여 보내면 서버가 이를 \"자기 자신(로컬호스트)이 보낸 요청\"으로 믿고 로그인 없이 관리자 권한을 내주는 결함(CVE-2026-102895)이 실제 공격에 악용되고 있습니다. 관리자 권한을 얻은 공격자는 저장된 클라우드·API 비밀값을 읽거나 추론 백엔드 설정(YAML)을 등록해 서버에서 원하는 명령을 실행할 수 있습니다.\n**먼저 할 일(초보용)**: GPUStack을 운영하는 조직은 지금 바로 2.2.0 이상으로 업데이트하고, 당장 업데이트가 어렵다면 설정에서 `force_auth_localhost=true`를 켜고 리버스 프록시가 외부의 `X-GPUStack-Real-IP` 헤더를 덮어쓰거나 차단하도록 조치하세요.\n\n**개요**: GPUStack 2.2.0 미만 버전은 기본 설정(`force_auth_localhost=false`)에서 로컬호스트(127.0.0.1) 발신 요청에 대해 인증을 생략하고 내장 관리자 권한을 부여한다. 이때 동일 호스트 리버스 프록시를 거치거나 클라이언트가 조작한 `X-GPUStack-Real-IP` 헤더의 루프백 주소를 검증 없이 신뢰해, 인증되지 않은 원격 공격자가 내장 관리자로 가장할 수 있다(CVSS 9.8). 관리자 권한 획득 후에는 등록된 비밀값(HuggingFace 토큰·클라우드 자격 증명 등) 조회와 커스텀 추론 백엔드 YAML 등록을 통한 임의 코드 실행이 가능하다. CISA는 2026-11-09 실제 악용을 확인해 KEV 카탈로그에 등재했다(연방기관 조치 기한 11/23).\n\n**왜 일어났나**\n- 직접 원인 [확인]: 로컬호스트 요청의 인증을 면제하는 기본 설정과, 클라이언트가 위조 가능한 `X-GPUStack-Real-IP` 헤더를 신뢰 프록시 검증 없이 그대로 받아들인 구현 결함(벤더·NVD 확인).\n- 구조적 원인 [추정 — 분석]: AI 인프라 관리 도구는 빠른 로컬 개발 편의를 위해 로컬 인증을 기본 비활성화하는 경우가 많으나, 컨테이너·리버스 프록시 환경에 배포될 때 프록시 헤더 신뢰 경계가 무너지면 곧바로 전체 GPU 클러스터 장악으로 이어진다.\n\n**침투 경로 [확인 — 벤더·KEV 기준]**: 외부 노출된 GPUStack 엔드포인트에 `X-GPUStack-Real-IP: 127.0.0.1` 헤더를 포함한 요청 전송(T1190) → 인증 없이 내장 관리자 권한 획득 → 추론 백엔드 YAML 등록 등을 통해 호스트/컨테이너 명령 실행(T1059).\n\n**어떻게 조치하나**\n- 즉시: (벤더·CISA 권고) GPUStack 2.2.0 이상으로 즉시 업데이트하고, `force_auth_localhost=true`를 활성화한다. 업그레이드 전이라도 접근 로그와 등록된 추론 백엔드 목록을 먼저 보존한다.\n- 단기: GPUStack에 저장돼 있던 API 키·모델 저장소 토큰·클라우드 자격 증명을 전부 유출 가정하에 폐기·재발급한다.\n- 장기: AI 클러스터 관리 콘솔을 공용 인터넷에 직접 노출하지 않고 내부망·VPN 뒤로 격리한다.\n- 탐지: 외부 인입 트래픽에 포함된 `X-GPUStack-Real-IP: 127.0.0.1` 헤더 및 비정상 추론 백엔드 등록 이벤트를 모니터링한다.\n\n**교훈**: \"로컬호스트는 안전하다\"는 가정과 \"프록시 헤더에 적힌 IP가 실제 IP다\"라는 가정이 만나면 인증 체계 전체가 헤더 한 줄로 무력화된다.\n\n### [D20261110-freeswitch] SignalWire FreeSWITCH SIP MESSAGE API 명령 실행(CVE-2026-116779) 실제 악용\n> 날짜: 취약점 공개 2026-11-05 · CISA KEV 등재 2026-11-09(조치 기한 2026-11-23) · 유형: 오픈소스 통신(VoIP/SIP) 플랫폼 원격 코드 실행(실제 악용 확인) · 행위자: 미귀속 · 지역: 전 세계(해외) · 근거: 확인(벤더 보안 권고·CISA KEV 등재)\n\n**쉽게 말하면**: 인터넷 전화(VoIP)·고객센터 시스템에 널리 쓰이는 오픈소스 통신 플랫폼 'FreeSWITCH'(1.11.3 미만)에서, 공격자가 수신자 주소(`To`)에 `api+명령어` 형식을 넣은 SIP 문자 메시지(MESSAGE)를 보내면 FreeSWITCH 내부 API와 운영체제 명령이 그대로 실행되는 결함(CVE-2026-116779)이 발견돼 실제 공격에 악용되고 있습니다. SIP 메시지 수락이 열려 있는 프로파일에서는 로그인 없이도 공격이 성립할 수 있습니다.\n**먼저 할 일(초보용)**: FreeSWITCH를 운영하는 관리자는 지금 바로 1.11.3 이상으로 업데이트하고, 비인증 SIP 프로파일에서 외부 SIP MESSAGE를 처리하지 않도록 접근 통제(ACL)를 점검하세요.\n\n**개요**: FreeSWITCH 1.11.3 미만에서 수신된 SIP `MESSAGE` 요청의 `To` 사용자 문자열을 더하기(`+`) 기호 기준으로 분리해 왼쪽 값을 채팅 프로토콜 선택자(chat proto)로 라우팅할 때, 공격자가 `api` 프로토콜을 지정하면 내부 `switch_api_execute()` 함수에 도달해 FreeSWITCH 데몬 권한으로 임의의 FreeSWITCH API 명령(예: `system` 모듈을 통한 OS 명령 포함)을 실행할 수 있다(CVSS 9.8). 공개 PoC 코드가 함께 유포됐으며, CISA는 2026-11-09 실제 악용을 확인해 KEV에 등재했다(기한 11/23).\n\n**왜 일어났나**\n- 직접 원인 [확인]: SIP `MESSAGE`의 사용자 입력(`To` 헤더 프로토콜 접두사)을 허용 목록 검증 없이 내부 채팅/API 디스패처에 전달해 관리용 `api` 인터페이스가 호출되도록 허용한 결함(벤더 확인).\n- 구조적 원인 [추정 — 분석]: 통신 미들웨어에서 외부 시그널링 메시지(SIP) 파서와 내부 관리 API 실행기가 같은 디스패치 테이블을 공유하면, 구분자(`+`) 하나만으로 외부 입력이 내부 특권 인터페이스로 넘어갈 수 있다.\n\n**침투 경로 [확인 — 벤더·KEV 기준]**: 외부에 노출된 SIP 포트로 `To: \u003capi+...>` 형식의 조작된 SIP MESSAGE 전송(T1190) → `switch_api_execute()` 호출을 통한 FreeSWITCH API 및 OS 명령 실행(T1059).\n\n**어떻게 조치하나**\n- 즉시: (벤더·CISA 권고) FreeSWITCH 1.11.3 이상으로 즉시 업데이트한다. 패치 전 SIP 시그널링 로그와 프로세스 실행 이력을 보존한다.\n- 단기: 외부 SIP 프로파일(external)에서 신뢰할 수 없는 발신지의 SIP MESSAGE를 ACL로 차단하고, 불필요한 `system` 등 명령 실행 모듈 노출을 점검한다.\n- 장기: VoIP 시그널링 서버를 인터넷에 전체 개방하지 않고 SIP 트렁크 제공사 IP 대역으로 방화벽을 제한한다.\n- 탐지: SIP `MESSAGE` 요청의 `To` 헤더에 `api+` 문자열이 포함된 패킷을 네트워크·방화벽에서 탐지·차단한다.\n\n**교훈**: 웹(HTTP)뿐 아니라 SIP 같은 통신 프로토콜도 외부 입력이 내부 명령 실행기로 이어질 수 있는 똑같은 공격 표면이다.\n\n### [D20261110-faspex] IBM Aspera Faspex 인가 우회 관리자 권한 획득(CVE-2026-123218) 실제 악용\n> 날짜: 취약점 공개 2026-11-07 · CISA KEV 등재 2026-11-09(조치 기한 2026-11-23) · 유형: 대용량 파일 전송 솔루션 권한 상승(실제 악용 확인) · 행위자: 미귀속 · 지역: 전 세계(해외) · 근거: 확인(IBM 보안 권고·CISA KEV 등재)\n\n**쉽게 말하면**: 기업들이 대용량 파일을 주고받을 때 쓰는 IBM Aspera Faspex(5.0.0~5.0.19)에서, 일반 권한을 가진 사용자가 특수하게 조작된 메시지를 보내 인가(권한) 검사를 우회하고 전체 관리자 권한을 얻을 수 있는 결함(CVE-2026-123218)이 실제 공격에 악용되고 있습니다.\n**먼저 할 일(초보용)**: IBM Aspera Faspex 5.0.x를 운영하는 조직은 IBM 보안 권고에 따라 5.0.19 패치(5.0.19.1 이상)를 즉시 적용하고, 최근 생성되거나 관리자 권한으로 승격된 계정이 있는지 전수 점검하세요.\n\n**개요**: IBM Aspera Faspex 5.0.0부터 5.0.19까지 버전에서 부정확한 인가 검사(CWE-863) 결함으로 인해 권한을 가진 사용자가 특수하게 조작된 메시지를 전송해 사용자 인가 절차를 우회하고 전체 관리자 권한(full administrative privileges)을 획득할 수 있다(CVSS 9.8). CISA는 2026-11-09 이 취약점의 실제 악용을 확인해 KEV 카탈로그에 등재했다(기한 11/23).\n\n**왜 일어났나**\n- 직접 원인 [확인]: 사용자 권한 변경·검증 처리에서 조작된 메시지에 대한 인가 검사가 누락되거나 부정확하게 수행된 결함(IBM·CISA 확인).\n- 구조적 원인 [추정 — 분석]: 기업용 대용량 파일 전송(MFT) 솔루션은 외부 협력사·거래처에도 계정을 발급해 운영하는 경우가 많아, \"인증된 저권한 계정\"에서 출발하는 관리자 권한 상승 결함도 실제 침해 위험이 매우 높다.\n\n**침투 경로 [확인 — IBM·KEV 기준]**: 권한을 가진 계정으로 특수 조작 메시지 전송 → 인가 검사 우회로 관리자 권한 획득(T1068). 최초 계정 확보 방식이나 관리자 권한 획득 이후 단계는 공개되지 않았다.\n\n**어떻게 조치하나**\n- 즉시: (IBM·CISA 권고) Aspera Faspex 5.0.19 패치(5.0.19.1 이상)를 즉시 적용한다. 패치 전 감사 로그와 사용자 권한 변경 이력을 보존한다.\n- 단기: 비정상적으로 관리자 권한이 부여된 계정이나 외부 협력사 계정의 이상 활동을 전수 점검한다.\n- 장기: MFT 솔루션의 외부 계정 발급 범위를 최소화하고, 관리자 권한 변경 시 별도 승인·즉시 경보 체계를 운영한다.\n- 탐지: 일반 사용자의 비정상 권한 변경 API 호출 및 관리자 계정 신규 등록 이벤트를 모니터링한다.\n\n**교훈**: MFT(파일 전송) 솔루션은 지난 수년간 공격자들의 주요 표적이었다. \"로그인한 사용자만 쓸 수 있는 기능\"이라도 외부 거래처 계정이 존재한다면 인가 우회 결함 하나가 전체 시스템 장악으로 이어진다.\n\n## 3. 교차 분석 — 11/07~11/10 사례에서 보이는 패턴\n\n> [2026-11-07](2026-11-07.md)~[2026-11-10](2026-11-10.md) 나흘간 확인한 사건들의 공통점이다.\n\n1. **서드파티·벤더 경유 피해 다수**: 알서포트 리모트콜(이번), SEGA([11-09](2026-11-09.md)), Iris Ohyama([11-08](2026-11-08.md))는 모두 위탁·SaaS 벤더가 피해이자 전파 경로가 된 구조였다.\n2. **CISA KEV 11/9 대량 등재와 빠른 악용**: OpenSSH SSHole([11-07](2026-11-07.md))에 이어 GPUStack(CVE-2026-102895), FreeSWITCH(CVE-2026-116779), IBM Aspera Faspex(CVE-2026-123218)까지 공개 직후 실제 악용이 확인돼 KEV에 동시 등재됐다.\n3. **국내 가상자산·금융권의 반복 피해**: 고팍스·프라뱅(이번)과 미래에셋증권([11-07](2026-11-07.md)) 등 같은 업종 내 침해가 이어져 금융당국의 전권역 CISO 소집으로 이어졌다.\n\n과거 3년 사건과의 연결은 [../과거3년/99-총평.md](../과거3년/99-총평.md)에 있다.\n\n## 4. 국내 소식\n\n- **①금융권·가상자산**: 고팍스(협박메일·거래중단)와 프라뱅(자산탈취), 금감원의 가상자산사업자 CISO 소집(11/19)을 `D20261110-cryptoexch`로 기록했다.\n- **②통신·이커머스 / SaaS**: 원격지원 SaaS 알서포트 '리모트콜' 침해(`D20261110-rsupport`)를 본문 사건으로 기록했고, 여행 플랫폼 줌줌투어(11/4 발생, 11/10 보도) 유출은 `국내뉴스.psv`에 기록했다.\n- **별도로 뒤늦게 확인한 소식**: '샤이니헌터스 창립자 Aegis' 계정이 한국 국방부·국군방첩사령부 데이터 1TB를 판매한다고 주장한 게시물(10/16 보도, 사기 계정 의심 평가)을 `국내뉴스.psv`에 보충 기록했다.\n\n## 5. 우선 대응 체크리스트\n\n1. **GPUStack·FreeSWITCH·IBM Aspera Faspex 운영 조직(최우선, KEV 11/23 기한)**: 각각 2.2.0 이상([D20261110-gpustack](#d20261110-gpustack-gpustack-루프백-헤더-신뢰-인증-우회원격-코드-실행cve-2026-102895-실제-악용)), 1.11.3 이상([D20261110-freeswitch](#d20261110-freeswitch-signalwire-freeswitch-sip-message-api-명령-실행cve-2026-116779-실제-악용)), 5.0.19 패치([D20261110-faspex](#d20261110-faspex-ibm-aspera-faspex-인가-우회-관리자-권한-획득cve-2026-123218-실제-악용)) 즉시 적용.\n2. **리모트콜(알서포트) 이용 고객사 상담원·관리자(신규)**: [D20261110-rsupport](#d20261110-rsupport-원격지원-saas-리모트콜알서포트-침해-고객사-상담원관리자-정보-유출) — 출처불명 이메일·문자 링크·첨부파일 열지 않기.\n3. **고팍스·프라뱅 이용자(신규)**: [D20261110-cryptoexch](#d20261110-cryptoexch-가상자산거래소-연쇄-피해고팍스-협박메일거래중단-프라뱅-자산탈취-금감원-ciso-소집) — 공식 공지 확인, 사칭 피싱 주의.\n4. **11/07~11/09 긴급 조치 재확인**: [11-07](2026-11-07.md)(OpenSSH 10.6p2·SonicWall SSL-VPN), [11-08](2026-11-08.md)(SM엔터 3사 사칭 주의·Iris Plaza 비밀번호 변경), [11-09](2026-11-09.md)(N-central 온프레미스 격리·냉동설비 컨트롤러 노출 차단) 참고.\n\n## 6. 검증 수준과 한계\n\n- CISA KEV 11/9 등재분 중 OpenSSH(CVE-2026-123158)는 첫 성공 악용 시점(11/7)에 맞춰 [2026-11-07 보고서](2026-11-07.md)에 수록했고, 나머지 3건(GPUStack CVE-2026-102895, FreeSWITCH CVE-2026-116779, IBM Aspera Faspex CVE-2026-123218)은 벤더·NVD·KEV 공식 메타데이터를 바탕으로 본 보고서에 전체 항목으로 수록했다.\n- 가상자산거래소 사건(`D20261110-cryptoexch`) 기사 중 바이낸스 관련 상충 보도는 사실관계가 맞지 않아 본문 채택에서 제외했다.\n- 알서포트 리모트콜의 최초 진입점은 조사 중으로 미공개 상태여서 ATT&CK 매핑을 하지 않았다.\n\n## 출처\n\n- CISA KEV 카탈로그(2026-11-09 등재: CVE-2026-102895, CVE-2026-123158, CVE-2026-116779, CVE-2026-123218)\n- 보안뉴스: \"알서포트 원격지원 서비스 '리모트콜' 해킹...고객사 관리자 정보 유출\"(idxno=147082), \"가상자산거래소 노린 해킹 잇따라...금감원, CISO 긴급 소집\"(idxno=147075), \"해외여행 플랫폼 줌줌투어 해킹\"(idxno=147080)\n- 데일리시큐: \"알서포트 '리모트콜' 해킹 사고 발생...KISA 신고 완료\"(idxno=209425), \"고팍스·프라뱅 등 가상자산거래소 보안사고 잇따라\"(idxno=209418)\n- MITRE ATT&CK v20.1\n"},{"path":"일일/2026-11-11.md","title":"일일 보안 이슈 분석 — 2026-11-11","md":"# 일일 보안 이슈 분석 — 2026-11-11\n\n> 수집 기준: 2026-11-10 야간 ~ 11-11 공개·보도분([11-10 보고서](2026-11-10.md) 이후). CISA KEV 2026-11-10 신규 등재 6건(Google Chromium CVE-2026-125350, Microsoft Outlook CVE-2026-124194, Barracuda CVE-2026-116606·111560, Cisco BroadWorks CVE-2026-20320, Openwave CVE-2026-111793), 벤더·CVE 공식 기록, 국내 주요 언론·보안매체(연합뉴스·뉴시스·전자신문·보안뉴스·데일리시큐) 원문을 확인했다.\n> 근거 표기: **[확인]** 벤더·정부기관·연구기관이 직접 확인 / 보도 언론 보도 / **[추정]** 본 보고서의 추정 / **[주장]** 공격자 일방 주장. **조치는 본 보고서의 권고**이며 벤더 공식 지침이 우선한다. 모든 '즉시' 조치는 증거(로그·메모리·디스크·클라우드 감사 기록)를 신속히 보존하되 패치를 미루지 않으며, 침해된 장비·계정에서 새 비밀을 발급하지 않는다.\n> **ATT&CK 버전 점검**: https://attack.mitre.org/tactics/enterprise/ 직접 확인 결과 현재 공식 버전은 **v20.1**(저장소 카탈로그 기준은 v20.0, 작업 지침 문구는 v19.2)이다. 전술 15개(TA0005=Stealth, TA0112=Defense Impairment) 구성은 동일하여 대규모 재매핑 없이 기존 카탈로그 기준으로 매핑했다.\n\n## 1. 오늘의 요약\n\n| # | 이슈 | CVE | 유형 | 상태 | 즉시 조치 |\n|---|------|-----|------|------|-----------|\n| 1 | 금융보안원 '정보보호 상시평가 지원시스템' 해킹, 행정서식·담당자 정보 유출 | — | 금융보안 전담기관 웹 시스템 침해 | [확인] 금융보안원·금융당국 확인, KISA 신고 | 상시평가 담당자는 금보원·당국 사칭 연락 주의, 제출 계정 비밀번호 점검 |\n| 2 | 대구시 공공배달앱 '대구로'(인성데이타) 해킹, 가맹점주 계좌 2.5만 개·직원 계정 유출 | — | 지역 공공배달 플랫폼 침해 | [확인] 대구시·운영사 확인, 경찰·KISA 신고 | 가맹점주는 정산 계좌·비밀번호 점검, 운영사 직원은 동일 비밀번호 즉시 교체 |\n| 3 | Google Chrome XML 파서 UAF 제로데이 실제 악용(올해 8번째) | CVE-2026-125350 | 브라우저 메모리 결함(실제 악용 확인) | [확인] Google 긴급 패치·CISA KEV 11/10(기한 11/24) | Chrome 157.0.8103.50/.51 이상 업데이트 후 브라우저 재시작 |\n| 4 | Microsoft 11월 정기 패치(1,235건) 및 Outlook NTLM 해시 노출 제로데이 악용 | CVE-2026-124194 | 이메일 클라이언트 강제 인증(실제 악용 확인) | [확인] MS 11월 패치·CISA KEV 11/10(기한 11/24) | 11월 Office 보안 업데이트 적용 및 외부 SMB(445 포트) 차단 |\n| 5 | 바라쿠다 ESG·다수 보안장비 root 원격 코드 실행 체인, 패치 일주일 만에 실제 악용 | CVE-2026-116606, -111560 | 보안장비 인증 우회+명령 삽입(실제 악용 확인) | [확인] CISA KEV 11/10 긴급 등재(기한 11/13) | 관리 화면 인터넷 노출 즉시 차단, 9.4.0.030 등 제품별 최신 펌웨어 적용 |\n| 6 | Cisco BroadWorks XXE 설정 유출 및 Openwave 문서 변환 제한 우회 실제 악용 | CVE-2026-20320, -111793 | 통신·메시징 미들웨어 취약점(실제 악용 확인) | [확인] CISA KEV 11/10 등재(기한 11/24) | BroadWorks OCI-P 패치·외부 접근 제한, Openwave Webtop 패치 적용 |\n\n## 2. 이슈별 분석\n\n### [D20261111-fsec] 금융보안원 '정보보호 상시평가 지원시스템' 해킹, 행정서식·담당자 정보 유출\n> 날짜: 비정상 접근·인지 2026-11-09 15:00경 · 보도·공식 설명 2026-11-10~11 · 유형: 금융보안 전담기관 평가 지원 시스템 침해(경위 조사 중) · 행위자: 미귀속 · 지역: 한국 · 근거: 확인(금융보안원 공식 확인, 금융위·KISA 신고)\n\n**쉽게 말하면**: 은행·증권사 등 금융권의 보안 관제와 평가를 담당하는 전문기관인 '금융보안원'이 운영하는 '정보보호 상시평가 지원시스템'이 외부 해킹 공격을 받아 일부 자료가 유출됐습니다. 금융보안원에 따르면 유출된 자료는 개인신용정보 동의서 샘플 등 행정서식 약 200건과 그 안에 적힌 이름·생년월일 등 개인정보 300여 건, 그리고 마스킹(가림) 처리된 금융사 평가 담당 직원들의 시스템 이용자 정보 350여 건입니다. 다행히 일반 금융 소비자의 계좌·신용정보나 금융사 시스템 구성도 같은 핵심 보안 자료는 이 시스템에 보관되지 않아 유출되지 않았다고 밝혔지만, 금융권 보안을 감독·지원하는 기관 자체가 뚫렸다는 점에서 파장이 큽니다.\n**먼저 할 일(초보용)**: 금융보안원 상시평가 시스템을 이용한 금융사 담당자는 유출된 연락처·이메일을 노린 금융당국·금융보안원 사칭 피싱 연락에 각별히 주의하세요. 해당 시스템과 같은 비밀번호를 다른 업무 사이트에서 쓰고 있다면 안전한 기기에서 비밀번호를 바꾸고 기존 로그인 세션을 초기화하세요.\n\n**개요**: 금융보안원은 2026년 11월 9일 오후 3시경, 금융회사들의 개인신용정보 보호 실태 평가(올해 대상 약 3,000개사) 자료 제출을 지원하는 '정보보호 상시평가 지원시스템'에서 외부의 비정상적인 접근을 통한 정보 유출 사실을 확인하고 즉시 시스템 접속을 차단한 뒤 금융위원회와 한국인터넷진흥원(KISA)에 신고했다. 11월 10~11일 금융보안원과 금융당국 발표(연합뉴스·뉴시스·보안뉴스·데일리시큐 보도)에 따르면, 현재까지 확인된 유출 규모는 ①광고성 이벤트 전송 내역·개인신용정보 동의서 샘플 등 행정서식 약 200건, ②해당 서식에 포함된 이름·생년월일 등 개인정보 300여 건, ③마스킹 처리된 이름·휴대전화번호·이메일 등 시스템 이용자(주로 금융사 상시평가 담당 직원) 정보 350여 건 등 총 850여 건이다. 금융보안원은 취약점 분석·평가 결과나 금융사 시스템 구성도 같은 핵심 보안 정보는 이 시스템에서 수집하지 않으며, 주민등록번호 등 일반 금융소비자의 민감한 금융거래 정보도 포함되지 않았다고 설명했다. 공격자는 IP 주소를 수시로 바꿔 가며 정상 접근인 것처럼 위장해 접근한 것으로 전해졌으며, 일부 보도에서는 감독당국 관계자 계정이 악용된 정황도 거론됐으나 구체적인 최초 침투 경로(웹 취약점인지 계정 탈취인지)는 정밀 조사 중이다. 한편 이 사고 직후 KISA도 자체 점검 차원에서 ISMS-P 누리집·개인정보침해 신고센터 등 대민 웹 서비스 7곳을 일시 중단하고 긴급 보안점검에 들어갔다.\n\n**왜 일어났나**\n- 직접 원인 [확인 — 세부 침투 경로는 조사 중]: 외부 공격자가 IP를 수시로 변경하며 정보보호 상시평가 지원시스템에 비정상 접근해 행정서식과 이용자 정보를 반출했다(금융보안원 확인). 어떤 취약점이나 계정 경로로 인증·접근 통제를 통과했는지는 조사 중이어서 단정하지 않는다.\n- 구조적 원인 [추정 — 분석]: 핵심 보안관제망이 아닌 '자료 제출·평가 지원용 대외 웹 시스템'은 수천 개 회원사 담당자가 접속해야 하므로 인터넷에 열려 있는 접점이 된다. 또한 제출된 '동의서 샘플·증빙 서식'에 실제 개인정보(300여 건)가 가명·비식별 처리 없이 그대로 들어 있었다는 점은, 평가·감사 증빙 과정의 개인정보 최소화 원칙이 현장에서 느슨했음을 보여준다.\n\n**침투 경로 [매핑 안 함 — 경위 조사 중, 미공개]**: 공격자가 IP를 바꿔 가며 상시평가 시스템에 비정상 접근해 자료를 반출했다는 사실은 확인됐으나, 최초 침투 수단(공개 웹 애플리케이션 결함 악용인지 유효 계정 악용인지)이 공식 확정되지 않았다. 본 저장소는 경위가 공개되지 않은 사건에 ATT&CK 기법을 추측으로 매핑하지 않는다.\n\n**어떻게 조치하나** (본 보고서의 권고이며 당국·기관 지침이 우선)\n- 즉시: (기관 조치) 상시평가 시스템 접속 차단, 웹 서버·접근 로그·세션 기록 등 포렌식 증거 보존 후 취약점 점검, 관계기관 신고 및 피해 금융사·정보주체 개별 통지. 침해가 의심되는 서버에서 새 인증키나 비밀번호를 발급하지 않는다.\n- 단기: 상시평가 시스템의 전체 이용자 세션·토큰을 무효화하고, 접근 권한(특히 감독·관리자 계정)과 웹셸 등 지속성 흔적을 전수 조사한다. 유출된 담당자 연락처를 악용한 2차 사칭 피싱 경보를 전 금융사에 발령한다.\n- 장기: 평가·감사 증빙 서류 제출 시 실제 고객 개인정보가 포함된 샘플 제출을 금지(자동 마스킹·검증 필터 적용)하고, 대외 평가 지원 시스템에도 핵심 시스템에 준하는 비정상 대량 조회 차단·MFA를 의무화한다.\n- 탐지: 다수 IP에서 분산 유입되는 반복 조회·다운로드 패턴, 비정상 시간대 평가 서식 일괄 열람 이벤트를 모니터링한다.\n\n**교훈**: 금융권 보안을 점검하는 기관의 '평가 자료 제출 사이트' 자체가 공격 표적이 됐다. 핵심 관제망이 안전하더라도 외곽의 대외 지원 시스템이 뚫리면 기관의 신뢰 전체가 흔들리며, 증빙용 샘플 서류에 실제 개인정보를 넣어 제출하는 관행도 함께 고쳐야 한다.\n\n### [D20261111-daeguro] 대구시 공공배달앱 '대구로'(인성데이타) 해킹, 가맹점주 계좌 2.5만 개·직원 계정 유출\n> 날짜: 외부 침입 발생 2026-10-31 · 운영사 인지·경찰 신고 2026-11-01 · KISA 신고 2026-11-02 · 가맹점 공지 2026-11-04 · 보도 2026-11-05~10 · 유형: 지역 공공배달 플랫폼 서버 침해(경위 수사 중) · 행위자: 미귀속 · 지역: 한국 · 근거: 확인(대구시·인성데이타 확인, 경찰·KISA 신고)\n\n**쉽게 말하면**: 대구시의 공공배달앱 '대구로'(운영사 인성데이타) 서버가 외부 해킹을 당해, 폐업 점주를 포함한 가맹점주의 정산용 계좌번호 약 2만 5,000개(예금주 이름 포함)와 운영사 전·현직 직원 250여 명의 내부 시스템 접속 아이디·비밀번호가 유출됐습니다. 일반 배달앱 이용자(누적 회원 74만 명)의 개인정보나 가맹점주의 실제 출금 금전 피해는 없는 것으로 파악됐지만, 점주 계좌번호와 직원 접속 계정이 함께 빠져나갔다는 점에서 추가 침투나 사칭 사기 위험이 있습니다.\n**먼저 할 일(초보용)**: '대구로' 가맹점주는 정산 계좌의 이상 거래 여부를 확인하고 대구로·배달대행사를 사칭한 계좌 변경·수수료 안내 연락에 속지 마세요. 인성데이타 전·현직 직원은 안전한 기기에서 내부 시스템 비밀번호와 같은 비밀번호를 쓰는 다른 사이트 비밀번호를 모두 바꾸고, 기존 로그인 세션·토큰도 전부 로그아웃(무효화)하세요.\n\n**개요**: 대구시와 대구로 운영사 인성데이타에 따르면 2026년 10월 31일 대구로 서버에 외부 침입이 발생해, 폐업 점주를 포함한 전체 누적 가맹점 규모의 정산용 계좌번호 약 2만 5,000개(예금주명 포함)와 운영사 전·현직 직원 250여 명의 내부 시스템 접속용 아이디·비밀번호가 유출됐다. 일반 앱 회원(약 74만 명)의 개인정보는 유출되지 않은 것으로 확인됐다. 운영사는 11월 1일 사고 정황을 인지해 긴급 점검과 함께 출금 시스템을 일시 정지하고 대구경찰청에 신고했으며, 11월 2일 KISA 신고, 11월 4일 가맹점주 공지 및 신규 가맹점 가입 중단을 진행했다. 대구시도 본청 및 산하 기관 사이버보안 특별점검에 착수했다. 일부 보도에서는 로그상 빠른 속도로 데이터가 탈취된 점을 들어 AI 활용 해킹 가능성을 언급했으나, 이는 정황 추정일 뿐 공식 확인된 사실이 아니며 최초 침투 경로도 경찰 수사 중이다.\n\n**왜 일어났나**\n- 직접 원인 [확인 — 최초 침투 수단은 수사 중]: 대구로 서버에 외부 비인가 침입이 발생해 가맹점 계좌 정보와 직원 계정 정보가 반출됐다(운영사·대구시 확인). 구체적인 취약점이나 초기 침투 방식은 공개되지 않았다.\n- 구조적 원인 [추정 — 분석]: (1) 지자체 공공앱을 민간 운영사가 위탁 운영하는 구조에서 소상공인 정산 데이터와 전·현직 직원 계정 정보에 대한 접근 통제·암호화가 충분히 분리되지 않았을 가능성 (2) 폐업한 가맹점주의 계좌번호와 퇴사(전직) 직원의 시스템 계정까지 삭제·파기되지 않고 서버에 남아 있어 피해 규모를 키운 점(본 보고서의 분석).\n\n**침투 경로 [매핑 안 함 — 경위 미공개]**: 외부 침입과 데이터 반출 사실만 확인됐고 최초 침투 기법은 수사 중이어서 ATT&CK 기법을 매핑하지 않는다(데이터 탈취 속도만으로 AI 도구 사용을 확정하지도 않는다).\n\n**어떻게 조치하나** (본 보고서의 권고)\n- 즉시: 서버 접근·데이터베이스 조회 로그 및 메모리·디스크 증거를 신속히 보존하고, 침해된 서버가 아닌 안전한 환경에서 전·현직 직원 250여 명의 계정을 즉시 초기화·비활성화하며 기존 발급 세션·인증 토큰을 모두 회수한다.\n- 단기: 퇴사자 계정과 폐업 가맹점의 불필요한 정산 계좌 정보를 전수 파기하고, 서버 내 웹셸·비인가 스케줄러 등 지속성 흔적을 점검해 침해가 깊을 경우 서버를 재구축한다. 정산금 출금 계좌 변경 시 다중 확인 절차를 적용한다.\n- 장기: 지자체 위탁 공공플랫폼에 대해 정기적인 모의해킹과 개인정보 보유기간(폐업·퇴사 시 즉시 파기) 감사 체계를 의무화한다.\n- 탐지: 직원 계정의 비정상 시간대 로그인, 가맹점 정산 계좌 목록에 대한 대량 조회 쿼리를 모니터링한다.\n\n**교훈**: 일반 소비자 정보만 개인정보가 아니다. 가맹점주의 정산 계좌 2만 5,000개와 전·현직 직원 250여 명의 아이디·비밀번호가 함께 남아 있었다는 것은, 폐업 점주·퇴사자 정보를 제때 지우는 '데이터 비우기'가 가장 확실한 피해 축소 수단임을 보여준다.\n\n### [D20261111-chrome] Google Chrome XML 파서 UAF 제로데이(CVE-2026-125350) 실제 악용\n> 날짜: Google 보안 권고·긴급 패치 2026-11-10 · CISA KEV 등재 2026-11-10(조치 기한 2026-11-24) · 유형: 웹 브라우저 메모리 결함(Use-After-Free, 실제 악용 확인) · 행위자: 미귀속 · 지역: 전 세계(해외) · 근거: 확인(Google 보안 권고·CISA KEV 등재)\n\n**쉽게 말하면**: 전 세계에서 가장 많이 쓰이는 웹 브라우저 구글 크롬(Google Chrome)에서, 조작된 웹페이지를 열기만 해도 브라우저 안에서 공격자의 코드가 실행될 수 있는 심각한 메모리 결함(CVE-2026-125350)이 실제 공격에 쓰이고 있는 것으로 확인됐습니다. 구글이 올해 들어 여덟 번째로 긴급 패치한 크롬 제로데이 결함입니다. 크롬과 같은 엔진(Chromium)을 쓰는 마이크로소프트 엣지(Edge), 브레이브(Brave), 오페라(Opera) 등 다른 브라우저도 영향을 받습니다.\n**먼저 할 일(초보용)**: 지금 바로 크롬(또는 엣지 등 Chromium 계열 브라우저) 오른쪽 위 메뉴의 '도움말 → Chrome 정보'를 열어 최신 버전(Windows·macOS 157.0.8103.50/.51, Linux 157.0.8103.50 이상 — 당시 기준)으로 업데이트하고, **반드시 브라우저를 완전히 껐다가 다시 켜세요**(재시작해야 패치가 적용됩니다).\n\n**개요**: Google은 2026-11-10 긴급 보안 업데이트를 발표하며 Chrome의 XML 파서 구성요소에서 발생한 Use-After-Free(UAF, 이미 해제한 메모리를 다시 참조하는 결함) 취약점 CVE-2026-125350(심각도 High)이 실제 공격에서 악용(in the wild)되고 있음을 확인했다. 공격자는 특별히 조작된 HTML/XML 웹페이지를 통해 브라우저 샌드박스 내부에서 임의 코드를 실행할 수 있다. CISA도 같은 날(11/10) 이 결함을 KEV 카탈로그에 등재하고 연방기관에 11월 24일까지 패치를 명령했다. Google은 대다수 사용자가 업데이트할 때까지 공격 주체·표적 등 세부 정보를 비공개로 유지한다고 밝혔다.\n\n**왜 일어났나**\n- 직접 원인 [확인: Google, CISA]: Chrome의 XML 파서가 데이터를 처리한 뒤 메모리에서 객체를 해제(삭제)했으나 그 위치를 가리키는 포인터를 지우지 않아, 이후 해당 메모리를 다시 읽거나 쓸 때 공격자가 메모리 구성을 조작해 코드를 실행할 수 있는 UAF 결함.\n- 구조적 원인 [추정 — 분석]: 웹 브라우저는 외부의 비신뢰 HTML·XML·스크립트를 즉시 해석해야 하는 복잡한 파서 집합체여서 메모리 안전성 결함이 반복적으로 발견된다. 다만 샌드박스 내부 코드 실행만으로는 운영체제 전체를 장악하기 어려워, 실제 표적 공격에서는 별도의 샌드박스 탈출 결함과 결합해 쓰이는 경우가 많다(이번 사건의 결합 여부는 미공개).\n\n**침투 경로 [확인 — Google·CISA 기준]**: 피해자가 조작된 웹페이지에 접속(T1189) → Chrome XML 파서의 UAF 결함(CVE-2026-125350)이 트리거되어 브라우저 샌드박스 내 임의 코드 실행(T1203). 이후 샌드박스 탈출이나 데이터 수집 단계는 공개되지 않았다.\n\n**어떻게 조치하나** (벤더·CISA 권고 및 본 보고서 권고)\n- 즉시: Chrome을 당시 기준 수정 버전(Windows·macOS 157.0.8103.50/.51, Linux 157.0.8103.50) 이상 최신 보안 버전으로 업데이트하고 브라우저를 재시작한다. Edge·Brave·Opera 등 Chromium 기반 브라우저도 각 벤더의 최신 패치를 즉시 적용한다.\n- 단기: 기업 보안 담당자는 엔드포인트 관리 도구(MDM·EDR)로 사내 기기의 브라우저 버전과 실제 프로세스 재시작 여부를 강제·점검한다. 표적 공격이 의심되는 기기는 로그·메모리 증거를 보존하고 세션을 무효화한다.\n- 장기: 브라우저 자동 업데이트와 강제 재시작 알림 정책을 상시 운영하고, 고위험 직무 PC는 비신뢰 사이트 격리(원격 브라우저 격리 등)를 검토한다.\n- 탐지: 브라우저 렌더러 프로세스의 비정상 크래시 및 브라우저가 생성하는 비정상 자식 프로세스·외부 연결을 EDR에서 모니터링한다.\n\n**교훈**: 브라우저는 업데이트가 자동으로 내려와도 **사용자가 창을 닫고 다시 열지 않으면 옛날 버전 그대로 돌아간다**. \"업데이트 다운로드\"가 아니라 \"브라우저 재시작 완료\"까지가 패치다.\n\n### [D20261111-outlook] Microsoft 11월 정기 패치(1,235건) 및 Outlook NTLM 해시 노출 제로데이(CVE-2026-124194) 실제 악용\n> 날짜: Microsoft 정기 패치·공개 2026-11-10 · CISA KEV 등재 2026-11-10(조치 기한 2026-11-24) · 유형: 이메일 클라이언트 스푸핑·강제 인증 취약점(실제 악용 확인) · 행위자: 미귀속 · 지역: 전 세계(해외) · 근거: 확인(Microsoft 보안 권고·CISA KEV 등재)\n\n**쉽게 말하면**: 마이크로소프트가 11월 정기 보안 업데이트(Patch Tuesday)를 통해 무려 1,235개의 보안 결함을 한꺼번에 고쳤는데, 그중 이메일 프로그램 아웃룩(Microsoft Outlook)의 결함 1건(CVE-2026-124194)은 이미 실제 해킹 공격에 쓰이고 있는 제로데이였습니다. 공격자가 보낸 특수 조작 메시지 파일(첨부파일 등)을 사용자가 아웃룩에서 열면, 평소 뜨던 '외부 콘텐츠 연결 경고창'도 없이 아웃룩이 공격자 서버로 몰래 접속하면서 사용자의 윈도우 로그인 암호 정보(NTLMv2 해시)를 넘겨주게 됩니다.\n**먼저 할 일(초보용)**: 윈도우와 마이크로소프트 오피스(아웃룩)의 2026년 11월 정기 보안 업데이트를 지금 바로 설치하세요. 패치 전까지는 출처가 불분명한 이메일이나 첨부된 메시지 파일을 열지 마세요.\n\n**개요**: Microsoft는 2026-11-10(현지시간) 발표한 11월 정기 패치에서 총 1,235건(치명적 등급 66건, 원격 코드 실행 296건, 권한 상승 536건 등 — 10월 1,411건에 이어 역대급 규모)의 취약점을 수정했다. 이 가운데 실제 악용이 확인된 제로데이는 Microsoft Office Outlook의 CVE-2026-124194(CVSS 6.5, CWE-359/Missing User Interaction) 1건이다. 인증되지 않은 공격자가 특수하게 조작된 메시지 파일을 보내 사용자가 이를 Outlook에서 열도록 유도하면, 일반적인 외부 콘텐츠 경고창을 띄우지 않은 채 공격자가 통제하는 원격 네트워크 경로로 자동 연결을 시도한다. 이때 Windows가 원격 서버에 자동 인증을 시도하면서 사용자의 NTLMv2 인증 해시가 노출되어, 공격자가 이를 가로채 오프라인에서 비밀번호를 해독하거나 계정을 사칭하는 데 악용할 수 있다. CISA는 11/10 이 취약점을 KEV에 등재했다(기한 11/24).\n\n**왜 일어났나**\n- 직접 원인 [확인: Microsoft, CISA]: 잠재적으로 위험한 외부 네트워크 연결 동작을 수행하기 전에 사용자 확인(경고창)을 거치도록 하는 검사가 누락되어, 조작된 메시지 파일을 열 때 외부 경로로 자동 접속·인증이 이뤄진 결함.\n- 구조적 원인 [추정 — 분석]: Windows 환경에서 파일·네트워크 공유에 쓰이는 NTLM 프로토콜은 원격 경로에 접속만 해도 자동으로 자격 증명 해시를 전송하는 설계 특성을 가지고 있어, Outlook·Word·탐색기 등에서 외부 경로 호출 검증이 하나만 뚫려도 반복적으로 계정 해시 탈취 통로가 된다.\n\n**침투 경로 [확인 — Microsoft·CISA 기준]**: 공격자가 조작된 메시지 파일을 보내 사용자가 열람(T1204.002) → Outlook이 경고 없이 공격자 제어 원격 네트워크 위치에 자동 접속하며 Windows NTLM 강제 인증으로 NTLMv2 해시 유출(T1187). 탈취된 해시의 오프라인 크래킹이나 릴레이 후속 단계는 개별 사건 세부가 비공개다.\n\n**어떻게 조치하나** (벤더·CISA 권고 및 본 보고서 권고)\n- 즉시: Microsoft Office·Outlook 2026년 11월 보안 업데이트를 즉시 적용한다. 침해(악성 메시지 열람)가 의심되는 계정은 로그·이메일 원본을 보존한 뒤, 안전한 기기에서 비밀번호를 즉시 변경하고 활성 세션·토큰을 무효화한다.\n- 단기: 기업 방화벽에서 내부 PC가 인터넷(외부)으로 나가는 SMB 트래픽(TCP 445번 포트 등)을 원천 차단하고, 그룹 정책으로 외부 NTLM 인증 전송을 제한(`Restrict NTLM: Outgoing NTLM traffic to remote servers`)한다.\n- 장기: 레거시 NTLM 인증 의존도를 줄이고 Kerberos 및 피싱 저항 MFA(FIDO2)로 전환하며, 매우 긴 패스프레이즈 정책을 적용해 NTLMv2 해시가 유출되더라도 오프라인 해독이 어렵게 만든다.\n- 탐지: 사내 엔드포인트에서 외부 공인 IP로의 비정상 SMB(445)·WebDAV 연결 시도 및 Outlook 프로세스가 유발하는 원격 네트워크 인증 이벤트를 탐지한다.\n\n**교훈**: CVSS 점수(6.5점, 중간)만 보고 패치를 미루면 안 된다. 공격자에게는 복잡한 코드 실행 결함보다 \"경고창 없이 암호 해시를 밖으로 보내 주는\" 결함 하나가 기업 내부망 계정을 여는 훨씬 실용적인 열쇠가 된다.\n\n### [D20261111-barracuda] 바라쿠다 ESG·다수 보안장비 root 원격 코드 실행 체인(CVE-2026-116606·111560), 패치 일주일 만에 실제 악용\n> 날짜: 취약점 공개·패치 2026-11-02~03 · CISA KEV 등재(실제 악용 확인) 2026-11-10(조치 기한 2026-11-13) · 유형: 보안장비 인증 우회 및 OS 명령 삽입 체인(실제 악용 확인) · 행위자: 미귀속 · 지역: 전 세계(해외) · 근거: 확인(Barracuda 보안 공지·CISA KEV 등재)\n\n> **기존 사건과의 관계**: 이 두 취약점은 지난 11월 3일 패치 공지 시점에는 실제 악용이 확인되지 않아 [2026-11-04 보고서](2026-11-04.md)의 `[D20261104-barracuda]`에서 '실제 악용 미확인(ATT&CK 매핑 보류)'으로 기록했던 건이다. 일주일 만인 **2026-11-10 CISA가 실제 공격 악용을 확인해 KEV에 긴급 등재(조치 기한 단 3일, 11/13)**함에 따라 실제 악용 사건으로 격상해 분석·매핑한다.\n\n**쉽게 말하면**: 지난주 패치가 나왔던 바라쿠다(Barracuda Networks) 이메일 보안 장비(ESG) 등의 치명적 결함 2건(CVE-2026-116606, CVE-2026-111560)이 패치 공개 일주일 만에 실제 해킹 공격에 악용되고 있는 것으로 확인됐습니다. 공격자는 인터넷에 열려 있는 장비 관리 화면에 로그인도 하지 않고 조작된 백업 설정 파일을 밀어 넣은 뒤(인증 우회), 시간대(timezone) 설정 칸에 운영체제 명령어를 심어 최고 관리자(root) 권한으로 실행시켰습니다. 미국 정부(CISA)는 사태가 시급하다고 보고 단 3일(11월 13일까지)의 긴급 패치 기한을 부여했습니다.\n**먼저 할 일(초보용)**: 바라쿠다 이메일 보안 게이트웨이(ESG) 및 관련 장비(ADC, BMA, WAF, WSG) 운영자는 **지금 당장 관리 화면(Admin UI)이 인터넷에서 보이지 않게 차단**하고, 로그·설정 증거를 보존한 뒤 최신 펌웨어(ESG 9.4.0.030 등)로 업데이트하세요. 이미 공격받았을 가능성이 있다면 패치만 하지 말고 장비의 인증서·비밀번호·연동 키를 모두 새 장비 기준으로 교체하세요.\n\n**개요**: Barracuda Email Security Gateway(ESG, 9.4.0.030 미만)의 CVE-2026-116606(CVSS v4 9.3)은 대체 경로를 통한 인증 우회 결함으로, 원격의 비인증 공격자가 설정 가져오기(configuration-import) 기능을 호출해 조작된 호환 백업 아카이브를 복원함으로써 장비 전역 설정을 무단 변경할 수 있게 한다. 이어 다수 바라쿠다 제품(ESG, Load Balancer ADC, Message Archiver, WAF, WAF Control Center, Web Security Gateway)의 공통 코드에 존재하는 CVE-2026-111560(CVSS v4 8.6)은 시간대(timezone) 설정 필드의 셸 메타문자 검증 미흡으로 인한 OS 명령 삽입 결함이다. 공격자는 관리 인터페이스가 노출된 ESG에서 두 결함을 연쇄(체이닝) 악용해 로그인 없이 root 권한으로 임의 명령을 실행했다. Barracuda와 CISA는 소수 조직을 대상으로 실제 악용이 발생한 것을 확인하고 2026-11-10 두 CVE를 모두 KEV에 등재했다(기한 11/13).\n\n**왜 일어났나**\n- 직접 원인 [확인: Barracuda, CISA]: 설정 가져오기 기능의 사전 인증 누락(CVE-2026-116606)과 시간대 설정 값 처리 시 셸 메타문자 무력화 누락(CVE-2026-111560)이 결합해 비인증 원격 root 코드 실행 경로가 열렸다.\n- 구조적 원인 [추정 — 분석]: (1) 메일·네트워크 보안 장비의 관리 인터페이스(Admin UI)를 공용 인터넷에 직접 노출해 둔 운영 관행 (2) 패치와 기술 정보가 공개되면 공격자들이 수일 내에 백업 아카이브 구조와 명령 삽입 지점을 역분석해 무기화(N-day 악용)하는 구조.\n\n**침투 경로 [확인 — Barracuda·CISA KEV 기준]**: 노출된 관리 인터페이스에서 설정 가져오기 기능으로 인증을 우회해 조작된 백업 설정 복원(T1190) → 시간대(timezone) 설정 필드에 삽입된 OS 명령이 root 권한으로 실행(T1059). 이후 웹셸·백도어 설치 등 후속 행위는 개별 피해 사례가 비공개다.\n\n**어떻게 조치하나** (벤더·CISA 권고 및 본 보고서 권고)\n- 즉시: 관리 인터페이스(Admin UI)의 외부 인터넷 접근을 즉시 차단한다. 패치 전 설정 변경 이력·백업 복원 로그·프로세스 기록을 신속히 보존한 뒤, 당시 기준 수정 펌웨어(ESG 9.4.0.030 / BNSF-40425, ADC BNADC-16586, BMA BNMA-32468, WCC BNWF-60060, WSG BNYF-24789 이상 최신 보안 버전)를 지체 없이 적용한다.\n- 단기: 비인가 설정 복원(configuration-import) 흔적이나 비정상 시간대(timezone) 문자열이 있었는지 점검한다. 침해 흔적이 확인된 장비는 패치만으로 지속성이 제거되지 않으므로 **장비 재구축(가상 어플라이언스 재배포 등)**을 우선하고, 장비에 저장됐던 LDAP/AD 연동 자격 증명·TLS 개인키·API 토큰을 안전한 환경에서 전부 회수·재발급한다.\n- 장기: 모든 엣지·보안 장비의 관리 인터페이스를 전용 관리망·VPN 뒤로 완전 격리하고, 패치 공개 후 악용까지의 시차(이번 건은 7일)보다 짧은 긴급 패치 SLA(48~72시간 이내)를 운영한다.\n- 탐지: 관리 UI에 대한 외부 접근 시도, 비정상 설정 백업 가져오기 이벤트, 시간대 설정 변경 및 root 권한 셸 실행 로그를 감시한다.\n\n**교훈**: 지난주([11-04 보고서](2026-11-04.md))에 \"아직 실제 악용은 없다\"고 기록했던 결함이 정확히 일주일 만에 실제 공격으로 돌아왔다. 보안 장비의 치명적 결함은 '패치 공개일 = 공격 카운트다운 시작일'이다.\n\n### [D20261111-broadworks] Cisco BroadWorks XXE 설정 유출(CVE-2026-20320) 및 Openwave 문서 변환 제한 우회(CVE-2026-111793) 실제 악용\n> 날짜: BroadWorks 공개 2026-08-19 · Openwave 공개 2026-10-16 · CISA KEV 동시 등재 2026-11-10(조치 기한 2026-11-24) · 유형: 통신·메시징 미들웨어 취약점(실제 악용 확인) · 행위자: 미귀속 · 지역: 전 세계(해외) · 근거: 확인(Cisco·Openwave·CISA KEV 등재)\n\n**쉽게 말하면**: 통신사·대기업의 인터넷 전화·클라우드 통화 서비스에 쓰이는 '시스코 브로드웍스(Cisco BroadWorks)'와 이메일 미디어 변환 솔루션 '오픈웨이브(Openwave Webtop Media Transcoder)'의 결함이 실제 해킹 공격에 쓰이고 있는 것으로 확인돼 미국 CISA의 긴급 패치 목록(KEV)에 나란히 올랐습니다. 브로드웍스 결함(CVE-2026-20320)은 로그인 없이도 조작된 XML 메시지를 보내 서버 안의 민감한 설정 파일을 읽어갈 수 있게 하고, 오픈웨이브 결함(CVE-2026-111793)은 웹메일 화면을 우회해 원래 관리자가 막아 놓은 종류의 문서 파일까지 서버가 강제로 변환·처리하게 만듭니다.\n**먼저 할 일(초보용)**: Cisco BroadWorks 또는 Openwave Webtop Media Transcoder를 운영하는 통신사·기업 관리자는 벤더의 보안 패치를 즉시 적용하고, 브로드웍스의 프로비저닝 인터페이스(OCI-P)가 외부 인터넷에 노출돼 있지 않은지 점검하세요. 이미 설정 파일이 노출됐을 가능성이 있다면 설정 안에 적힌 연동 비밀번호·키를 모두 교체하세요.\n\n**개요**: CISA는 2026-11-10 통신·메시징 인프라 취약점 2건을 KEV 카탈로그에 추가했다(기한 11/24). 첫째, **Cisco BroadWorks(CVE-2026-20320, CVSS 7.5)**는 Open Client Interface(OCI) XML 파서에서 외부 개체 참조(XXE, XML External Entity)가 기본 허용되어 발생한 결함이다. 인증되지 않은 원격 공격자가 OCI-P(Provisioning) 서비스에 조작된 XML 메시지를 보내면 BroadWorks 사용자 권한으로 파일 시스템의 민감한 설정 정보를 읽을 수 있다. 둘째, **Openwave Messaging Limited의 Webtop Media Transcoder(CVE-2026-111793, CVSS 4.3, CWE-669)**는 관리자가 지정한 변환 허용 파일 형식 제한을 서버 측에서 제대로 강제하지 않은 결함으로, 인증된 사용자가 표준 웹메일 UI를 우회해 요청을 보내면 의도하지 않은 문서 형식을 변환·처리하게 만들 수 있다. 두 취약점 모두 8월·10월에 각각 공개된 N-day 결함이나 실제 악용이 확인돼 KEV에 올랐다.\n\n**왜 일어났나**\n- 직접 원인 [확인: Cisco, MITRE, CISA]: BroadWorks는 OCI XML 파서에서 외부 개체(XXE) 해석을 기본 비활성화하지 않은 구현 결함이며, Openwave는 파일 형식 제한을 웹메일 프런트엔드 경험에만 의존하고 백엔드 미디어 트랜스코더에서 일관되게 검증하지 않은 결함이다.\n- 구조적 원인 [추정 — 분석]: 통신사·기업용 음성(VoIP)·웹메일 플랫폼의 프로비저닝(OCI-P)이나 미디어 변환기 같은 내부 연동 인터페이스는 \"정상 클라이언트만 호출할 것\"이라는 가정 아래 설계되는 경우가 많아, 공격자가 인터페이스를 직접 호출하면 설정 파일 노출이나 필터 우회로 이어진다.\n\n**침투 경로 [확인 — Cisco·CISA KEV 기준]**: (BroadWorks) 외부에서 접근 가능한 OCI-P 서비스에 조작된 XXE 메시지를 보내 취약점 악용(T1190) → 파일 시스템 내 민감한 시스템 설정 정보 열람·수집(T1005). (Openwave는 인증된 사용자의 웹메일 우회 문서 형식 변환 결함(CVE-2026-111793)에 대해 실제 악용 사실은 KEV 등재로 확인됐으나, 최초 계정 확보 경로와 문서 변환 이후 후속 공격 단계가 공개되지 않아 별도 ATT&CK 기법을 추가 매핑하지 않는다.)\n\n**어떻게 조치하나** (벤더·CISA 권고 및 본 보고서 권고)\n- 즉시: Cisco BroadWorks 및 Openwave Webtop Media Transcoder에 각 벤더의 최신 보안 패치를 적용한다(KEV 기한 11/24). 패치 전 OCI-P 및 트랜스코더 요청 로그를 보존한다.\n- 단기: BroadWorks 시스템에서 설정 파일 열람 흔적이 있는지 점검하고, 노출 가능성이 있는 설정 파일 내 데이터베이스 비밀번호·연동 자격 증명·세션 키를 안전한 환경에서 전부 재발급한다. Openwave 시스템은 비정상 문서 변환 요청을 보낸 계정의 활성 세션·토큰을 무효화하고 변환 서버 내 웹셸 등 지속성 흔적 여부를 점검해 침해 의심 시 재구축한다. OCI-P 인터페이스는 신뢰된 관리 IP에서만 접근하도록 방화벽으로 차단한다.\n- 장기: XML 파서의 외부 개체(DTD/XXE) 처리를 코드 전반에서 기본 비활성화하고, 파일 형식·권한 검증은 프런트엔드(웹메일 UI)가 아닌 백엔드 처리 엔진에서 직접 강제하도록 아키텍처를 검증한다.\n- 탐지: OCI-P 엔드포인트로 유입되는 XML 본문 내 `\u003c!ENTITY` 또는 `SYSTEM` 키워드 포함 요청, 웹메일 세션을 거치지 않은 직접 트랜스코더 API 호출을 탐지한다.\n\n**교훈**: BroadWorks의 설정 읽기 결함(CVSS 7.5)이나 Openwave의 파일 제한 우회(CVSS 4.3)는 단독 점수로만 보면 '최고 위험(Critical)'이 아니지만, 실제 공격자는 설정 파일을 읽어 다음 단계의 자격 증명을 얻거나 내부 변환기를 공격 디딤돌로 삼기 위해 이런 결함을 골라 쓴다.\n\n## 3. 교차 분석 — 오늘의 사례에서 보이는 패턴\n\n> 선정된 국내외 6건의 공통점이며 전체 공격의 통계가 아니다.\n\n1. **'패치 공개 = 공격 시작'과 중간 위험도 결함의 실전 악용**: 바라쿠다 ESG 체인(`D20261111-barracuda`)은 11/3 패치 공개 후 단 7일 만에 실제 악용이 확인돼 KEV에 올랐고, Outlook(`D20261111-outlook`, CVSS 6.5)·BroadWorks(`D20261111-broadworks`, CVSS 7.5)·Openwave(CVSS 4.3)처럼 원격 코드 실행이 아닌 '인증 해시 노출·설정 파일 열람·변환 제한 우회' 결함들도 실제 공격 체인의 부품으로 활발히 쓰이고 있다.\n2. **국내 보안·공공 플랫폼의 '주변부'와 '안 지운 데이터'**: 금융보안원(`D20261111-fsec`)은 핵심 관제망이 아닌 대외 '상시평가 자료 제출 시스템'과 샘플 서식 내 실제 개인정보가 약점이 됐고, 대구로(`D20261111-daeguro`)는 폐업 가맹점 계좌와 전직 직원 계정이 남아 있어 노출 범위를 키웠다.\n3. **클라이언트(브라우저·메일) 제로데이 동시 패치**: Chrome XML UAF(`D20261111-chrome`)와 Outlook 강제 인증(`D20261111-outlook`)이 같은 날 KEV에 등재돼, 서버·엣지 장비뿐 아니라 임직원 PC의 브라우저와 메일 클라이언트를 통한 초기 침투·자격 증명 탈취 위협도 동시에 높아졌다.\n\n과거 3년 사건과의 연결은 [../과거3년/99-총평.md](../과거3년/99-총평.md)에 있다.\n\n## 4. 국내 소식 (업종별 6개 범주 검색 결과)\n\n최근 7일(2026년 11월) 기준으로 6개 범주를 각각 분리 검색해 본문 사건 2건(`D20261111-fsec`, `D20261111-daeguro`)과 `국내뉴스.psv` 보충 7건을 정리했다.\n\n- **① 금융권(은행·카드·보험·증권·저축은행·캐피탈·유관기관)**: 금융권 보안 전담기관인 **금융보안원**의 정보보호 상시평가 지원시스템 해킹·유출(행정서식 200건·개인정보 300여 건·이용자 정보 350여 건)을 본문 사건 `[D20261111-fsec]`로 수록했다.\n- **② 통신·OTT·플랫폼·이커머스·유통**: 대구시 공공배달앱 **'대구로'**(운영사 인성데이타) 서버 해킹(가맹점주 계좌 2.5만여 개·전현직 직원 250여 명 계정 유출)을 본문 사건 `[D20261111-daeguro]`로 수록했다. 이 밖에 아파트 생활 플랫폼 **'아파트너'**의 데이터 내보내기 기능 무단 접근으로 입주민 휴대전화번호가 반출되고 12일 만에 인지된 사고(11/6 보도), 주차 플랫폼 **'모두의주차장'**의 알림톡 발송 위탁 대행사(커넥트웨이브 '비즈뿌리오') 침해로 보상 사칭 피싱 알림톡이 발송된 사고(11/10 보도), 생성형 AI **'클로드 엔터프라이즈'**(앤트로픽)에서 미국 보안 스타트업 캐시드럴의 제3자 업무용 SW 취약점 악용으로 국내 기업 계정 112개의 업무 연락처·조직 ID 등이 노출돼 개인정보위가 조사에 착수한 건(11/9~10 보도)을 `국내뉴스.psv`에 추가했다.\n- **③ 공공기관·지자체·교육(대학)·의료**: **조달청**에서 내부 직원이 온라인 평가 AI 프로그램 개발·테스트 중(7~10월) 외부 생성형 AI '챗GPT'에 평가위원 189명의 본인 확인용 얼굴 사진을 업로드해 유출된 사고(11/11 보도)를 `국내뉴스.psv`에 추가했다.\n- **④ 국내 랜섬웨어 피해**: 유베이스 그룹 IT 인프라 자회사 **한일네트웍스**의 일부 관리 서버가 11/2 랜섬웨어 공격을 받았으나 즉시 차단·복구해 외부 정보 유출이나 고객 금융사 전이 피해는 없었다는 보도(11/10 보도)를 `국내뉴스.psv`에 추가했다.\n- **⑤ 과기정통부·KISA·개인정보위·금융위·금감원 발표·점검**: 금융보안원 사고 직후 **KISA**가 자체 취약점 점검을 위해 ISMS-P 누리집·개인정보침해 신고센터 등 대민 웹 서비스 7곳을 일시 중단하고 긴급 보안점검에 들어갔다는 소식(11/11 보도)을 본문(`D20261111-fsec`)과 연관지어 확인했다(개인정보위 매출 10% 과징금 기준 발표는 [11-09 보고서](2026-11-09.md) 및 `국내뉴스.psv`에 기수록).\n- **⑥ 기존 대형 사건의 추가 규모·후속 발표**: **더존비즈온** APO 백업서비스 침해 사태(`D20261104-douzone`)의 11/10 기준 현황으로 NH농협은행 AI 자회사 애자일소다(임직원 인적사항·연락처·고유식별·금융·인사급여 정보 등)와 전남정보문화산업진흥원에서 유출 가능성이 새로 제기됐고, 앞서 거론됐던 성현회계법인은 유출 사실이 없는 것으로 확인됐다는 보도를 `국내뉴스.psv`에 갱신 추가했다.\n\n## 5. 우선 대응 체크리스트\n\n1. **바라쿠다 ESG 및 관련 장비 운영 조직(최우선, KEV 기한 11/13)**: [D20261111-barracuda](#d20261111-barracuda-바라쿠다-esg다수-보안장비-root-원격-코드-실행-체인cve-2026-116606111560-패치-일주일-만에-실제-악용) — 관리 인터페이스 인터넷 노출 즉시 차단, 포렌식 증거 보존 후 제품별 최신 패치 적용, 침해 의심 시 장비 재구축 및 연동 자격 증명·키 전면 교체.\n2. **전 조직 PC·임직원(Chrome 및 Outlook 제로데이, KEV 기한 11/24)**: [D20261111-chrome](#d20261111-chrome-google-chrome-xml-파서-uaf-제로데이cve-2026-125350-실제-악용) Chrome 157.0.8103.50/.51 이상 업데이트 후 **브라우저 재시작**, [D20261111-outlook](#d20261111-outlook-microsoft-11월-정기-패치1235건-및-outlook-ntlm-해시-노출-제로데이cve-2026-124194-실제-악용) 11월 Office 보안 패치 적용 및 방화벽 외부 SMB(445) 아웃바운드 차단.\n3. **Cisco BroadWorks·Openwave 운영사(KEV 기한 11/24)**: [D20261111-broadworks](#d20261111-broadworks-cisco-broadworks-xxe-설정-유출cve-2026-20320-및-openwave-문서-변환-제한-우회cve-2026-111793-실제-악용) — 보안 패치 적용, OCI-P 외부 노출 차단 및 설정 내 자격 증명 교체.\n4. **금융사 상시평가 담당자·대구로 가맹점주 및 운영사 직원(국내 신규)**: [D20261111-fsec](#d20261111-fsec-금융보안원-정보보호-상시평가-지원시스템-해킹-행정서식담당자-정보-유출)·[D20261111-daeguro](#d20261111-daeguro-대구시-공공배달앱-대구로인성데이타-해킹-가맹점주-계좌-25만-개직원-계정-유출) — 당국·운영사 사칭 피싱 주의, 안전한 기기에서 비밀번호 변경 및 기존 세션·토큰 무효화.\n\n## 6. 검증 수준과 한계\n\n- CISA KEV 2026-11-10 등재 6건은 CISA 공식 피드(`known_exploited_vulnerabilities.json`), MITRE CVE API 레코드, BleepingComputer 1차 보도를 직접 조회해 교차 확인했다. 수정 버전 번호는 발표 당시 기준이므로 실제 조치 시 각 벤더의 최신 보안 권고를 재확인해야 한다.\n- 금융보안원(`D20261111-fsec`)과 대구로(`D20261111-daeguro`) 사건은 기관·운영사 확인 및 복수 언론 보도로 피해 사실과 유출 항목이 확인됐으나, 최초 침투 경로(구체적 취약점·계정 탈취 경위)는 조사·수사 중이어서 ATT&CK 기법을 매핑하지 않았다.\n- **ATT&CK 버전 확인 결과**: https://attack.mitre.org/tactics/enterprise/ 에서 현재 공식 버전이 **v20.1**임을 확인했다(작업 지침은 v19.2 기준, 본 저장소 카탈로그는 v20.0 기준). 전술 15개 체계는 동일하므로 임의 대규모 재매핑은 하지 않고 기존 카탈로그 범위에서 매핑했다.\n- **독립 교차 검토**: 현재 실행 환경이 Gemini(Antigravity)여서 지침 8번에 따라 Gemini 자체 체크리스트 교차 검토를 수행해 사실관계·근거 표기·ATT&CK 전술-기법 일치·초보용 문장 정확성을 점검했다.\n\n## 출처\n\n- CISA Known Exploited Vulnerabilities (KEV) Catalog (2026-11-10 등재: CVE-2026-111560, CVE-2026-116606, CVE-2026-125350, CVE-2026-124194, CVE-2026-111793, CVE-2026-20320)\n- BleepingComputer: \"Microsoft November 2026 Patch Tuesday fixes 1,235 flaws, Outlook zero-day\", \"Google patches eighth Chrome zero-day exploited in attacks this year\"\n- 연합뉴스(AKR20261110174751002)·뉴시스(NISX20261111_0003862948)·보안뉴스(idxno=147156)·데일리시큐(idxno=209438): 금융보안원 상시평가 시스템 해킹 보도\n- 전자신문(20261105000345): \"대구 공공배달앱 '대구로' 해킹…점주 계좌번호 2만5000개 유출\"\n- 보안뉴스(idxno=147150 모두의주차장 대행사 피싱 알림톡, idxno=147151 더존비즈온 현황, idxno=147152 한일네트웍스 랜섬웨어, idxno=147162 KISA 대민 웹 서비스 점검, idxno=147168 조달청 평가위원 사진 챗GPT 전송), 데일리시큐(idxno=209347 아파트너 유출), 디지털데일리(2026110918440195083)·뉴스1(6349641) 클로드 국내 기업 계정 유출 조사\n- MITRE ATT&CK Enterprise v20.1 (https://attack.mitre.org/tactics/enterprise/)\n"},{"path":"일일/2026-11-12.md","title":"일일 보안 이슈 분석 — 2026-11-12","md":"# 일일 보안 이슈 분석 — 2026-11-12\n\n> 수집 기준: 2026-11-11 야간 ~ 11-12 공개·보도분([11-11 보고서](2026-11-11.md) 이후). CISA KEV 카탈로그(2026-11-12 조회 기준 11-10 이후 신규 등재 없음), 벤더·연구기관 1차 보안 공지(Vates VSA-2026-062, SAP 11월 정기 패치·Onapsis, ConnectWise·Huntress, Ivanti·Fortinet, Maersk)와 MITRE CVE 공식 레코드, 국내 정부 보도자료(과기정통부·개인정보위·한국소비자원·KISA) 및 주요 언론·보안매체(연합뉴스·보안뉴스·데일리시큐) 원문을 확인했다.\n> 근거 표기: **[확인]** 벤더·정부기관·연구기관이 직접 확인 / 보도 언론 보도 / **[추정]** 본 보고서의 추정 / **[주장]** 공격자 일방 주장. **조치는 본 보고서의 권고**이며 벤더·당국의 공식 지침이 우선한다. 모든 '즉시' 조치는 증거(로그·메모리·디스크·클라우드 감사 기록)를 신속히 보존하되 패치를 미루지 않으며, 침해된 장비·계정에서 새 비밀을 발급하지 않는다.\n> **ATT&CK 버전 점검**: https://attack.mitre.org/tactics/enterprise/ 직접 확인 결과 현재 공식 버전은 **v20.1**(저장소 카탈로그 기준은 v20.0, 작업 지침 문구는 v19.2)이다. 전술 15개(TA0005=Stealth, TA0112=Defense Impairment) 구성은 동일하여 임의 대규모 재매핑 없이 기존 카탈로그 기준으로 매핑했다.\n\n## 1. 오늘의 요약\n\n| # | 이슈 | CVE / 권고 | 유형 | 상태 | 즉시 조치 |\n|---|------|-----------|------|------|-----------|\n| 1 | GS건설 아파트('자이') 커뮤니티 시스템 침해, 입주민 정보·RF카드번호 등 15개 항목 유출 가능성 및 정부 첫 직권조사 | — | 아파트 커뮤니티 예약·관리 시스템 침해 | [확인] GS건설 신고·안내, 과기정통부 첫 직권조사 착수 | 입주민은 동일 비밀번호 변경·사칭 연락 주의, 관리 주체는 출입 RF카드 악용 가능성 점검 |\n| 2 | SPC그룹 계열사 '섹타나인'(해피포인트 운영사), 가맹점 관리자 계정 침해로 고객명·마스킹 카드번호 등 추가 유출 확인 | — | 지급대행·가맹점 관리자 계정 침해 | [확인] 섹타나인 1차(11/8)·2차(11/12) 공식 공지 | 가맹점 관리자 계정 비밀번호·세션 전면 초기화, 이용자는 결제·정산 사칭 연락 주의 |\n| 3 | 가상화 관리 도구 Xen Orchestra 인증 우회 실제 악용 — 빈 JSON 쿠키 하나로 하이퍼바이저 root 장악 | VSA-2026-062 | 가상화 관리 콘솔 인증 우회(실제 악용 확인) | [확인] Vates 긴급 패치·실제 악용 확인 | 관리 콘솔 인터넷 노출 즉시 차단, 6.9.2/6.10.1 패치 및 호스트 cron·낯선 VM 점검 |\n| 4 | SAP 11월 정기 패치: 'ICM2Shell' 등 비인증 원격 CVSS 10.0 만점 결함 4건 동시 수정 | CVE-2026-76964, -89126, -89103, -120017 | ERP 커널·웹 디스패처·게이트웨이·SAML 결함 | [확인] SAP·Onapsis 공개(실제 악용 미확인) | SAP 커널·모든 Web Dispatcher 동시 패치, 게이트웨이(33xx) 외부 노출 차단 |\n| 5 | ConnectWise ScreenConnect MSP 표적 캠페인 — 서드파티 확장(RMM+) 악용으로 클라우드 파트너 400여 곳 긴급 차단 | — | 원격 관리 도구(RMM)·서드파티 확장 악용 | [확인] ConnectWise·Huntress 확인 및 확장 강제 비활성화 | RMM+ 계열 확장 5종 즉시 비활성화, 엔드포인트 변조 클라이언트 점검·세션 재발급 |\n| 6 | Ivanti EPM 비인증 SQL 삽입 RCE 및 Fortinet FortiManager·FortiOS 치명적 결함 동시 패치 | CVE-2026-121653, -121683, -126170, -126253 | 엔드포인트·방화벽 중앙 관리 서버 취약점 | [확인] Ivanti·Fortinet 보안 권고(실제 악용 미확인) | EPM 2024 SU8·CSA 5.0.8.1 및 FortiManager·FortiOS 최신 패치, 관리 포트 비노출 |\n| 7 | 해운·물류 대기업 머스크(Maersk), 인수 법인(LF Logistics) 레거시 시스템 침해 확인 — 공격자는 100GB·500만 달러 주장 | — | 인수 법인 로컬 레거시 시스템 침해·협박 | [확인] 머스크 침해 확인 / [주장] WhiteArmor 100GB·500만 달러 요구 | 인수·자회사 레거시 시스템 격리·전수 점검, 노출 의심 관리자 계정·연동 키 교체 |\n\n## 2. 이슈별 분석\n\n### [D20261112-gsconst] GS건설 아파트('자이') 커뮤니티 시스템 침해, 입주민 정보·RF카드번호 등 15개 항목 유출 가능성 및 정부 첫 직권조사\n> 날짜: 비인가 접근 확인 2026-10-28 22:15경 · 침해 신고 2026-10-29 · 입주민 안내 2026-10-30 · 과기정통부 직권조사 결정·발표 2026-11-11(보도 11-11~12) · 유형: 아파트 커뮤니티 예약·관리 시스템 비인가 접근(경위 직권조사 중) · 행위자: 미귀속 · 지역: 한국 · 근거: 확인(GS건설 신고·공지, 과기정통부 직권조사 발표)\n\n**쉽게 말하면**: GS건설이 운영하는 아파트('자이' 등) 커뮤니티 시설 예약·관리 시스템에 외부 해커가 몰래 접근해, 입주민의 이름·생년월일·휴대전화번호·주소·세대주 여부·암호화된 비밀번호·관리자 ID·출입용 RF카드번호 등 최대 15개 항목이 유출됐을 가능성이 확인됐습니다. GS건설이 침해 신고 후 자체 원인 분석을 이유로 정부(과기정통부·KISA)의 기술지원 조사에 동의하지 않자, 과기정통부는 올해 10월 새로 시행된 개정 정보통신망법에 따라 '침해사고 조사 심의위원회'를 열어 법 시행 후 첫 번째 정부 직권조사를 결정했습니다.\n**먼저 할 일(초보용)**: 해당 아파트 커뮤니티 앱·웹사이트를 이용하는 입주민과 관리자는 안전한 기기에서 비밀번호를 즉시 바꾸고(같은 비밀번호를 쓰는 다른 사이트도 함께 변경), 기존 로그인 세션을 모두 로그아웃하세요. 단지 관리사무소나 건설사를 사칭해 출입카드 재발급·관리비 정산을 유도하는 문자·전화에 속지 마세요.\n\n**개요**: 과학기술정보통신부는 2026년 11월 11일 GS건설의 아파트 커뮤니티 시설 예약·관리 시스템(구 FMCS 등) 침해사고의 피해 현황과 사고 원인을 규명하기 위해 직권조사를 실시한다고 발표했다(보안뉴스·데일리시큐 보도). 앞서 GS건설은 10월 28일 오후 10시 15분경 해당 시스템에서 외부 비인가 접근을 확인해 10월 29일 관계기관에 신고하고 10월 30일 입주민에게 유출 가능성을 안내했다. 안내된 유출 가능 항목은 이름, 별명, 생년월일, 휴대전화번호, 성별, 이메일, 주소, 회원번호, 거주 유형, 암호화된 비밀번호, 관리자 ID, 세대주 여부, 회원가입 일시, 최종 로그인 IP 주소, RF카드번호 등 총 15개 항목이다(전체 피해 단지 수와 실제 외부 반출 규모는 최종 확인 중). 특히 RF카드번호는 공동현관 출입이나 커뮤니티 시설 이용과 연계될 수 있는 정보여서 물리적 출입 보안과의 연관성 확인이 필요한 사안이다(유출된 번호만으로 카드 복제·출입이 가능한지는 미확인). GS건설이 신고 당시 자체 원인 분석을 이유로 과기정통부·KISA 기술지원에 미동의하자(GS건설 측은 \"조사 미동의가 아니라 자체 원인분석·재발방지 기술지원 미동의이며 조사에 성실히 협조할 것\"이라고 해명), 과기정통부는 지난 10월 1일 시행된 개정 정보통신망법상 침해사고 조사 심의위원회를 개최해 **법 시행 이후 첫 직권조사**를 결정했으며, 중대 사고로 판단될 경우 민관합동조사단 구성도 검토할 계획이다.\n\n**왜 일어났나**\n- 직접 원인 [확인 — 세부 침투 경로는 직권조사 중]: 아파트 커뮤니티 시설 예약·관리 시스템에 외부 비인가 접근이 발생해 입주민·관리자 관련 15개 항목이 유출 위험에 노출됐다(GS건설 신고·과기정통부 발표). 구체적인 웹/API 취약점이나 계정 탈취 경로는 정부 직권조사 중이어서 단정하지 않는다.\n- 구조적 원인 [추정 — 분석]: 아파트 커뮤니티·스마트홈 관리 시스템은 다수 단지의 입주민 실거주 주소·세대주 여부·출입 RF카드번호 등 민감한 주거·물리 보안 정보를 집중 보관하면서도, 핵심 금융·통신망에 비해 보안 관제와 접근 통제가 느슨하기 쉽다(지난 10월 23일 발생한 아파트 생활 플랫폼 '아파트너' 휴대전화번호 반출 사고와도 맞닿아 있는 본 보고서의 분석).\n\n**침투 경로 [매핑 안 함 — 경위 조사 중, 미공개]**: 외부 비인가 접근 사실만 확인됐고 최초 침투 기법은 과기정통부 직권조사 중이어서 ATT&CK 기법을 추측으로 매핑하지 않는다.\n\n**어떻게 조치하나** (본 보고서의 권고이며 정부·기관 지침이 우선)\n- 즉시: (운영사·관리 주체) 커뮤니티 예약·관리 시스템의 웹·DB·API 접근 로그와 디스크·메모리 증거를 신속히 보존해 정부 직권조사에 제출하고, 침해가 의심되는 서버에서 새 인증키나 비밀번호를 발급하지 않는다.\n- 단기: 노출 가능 항목에 '관리자 ID'와 '암호화된 비밀번호'가 포함되어 있으므로 안전한 환경에서 전체 관리자·입주민 계정의 비밀번호 재설정을 강제하고 기존 발급된 모든 로그인 세션·토큰을 일괄 무효화한다. 또한 유출 가능성이 있는 'RF카드번호'만으로 단지 공동현관이나 시설 출입 인증이 통과되는 구조(단순 UID 대조 방식 등)인지 즉시 점검해 복제·도용 위험이 있으면 인증 방식을 보강하거나 카드 식별값을 재발급한다. 서버 내 웹셸 등 지속성 흔적 여부를 전수 조사해 침해가 깊을 경우 재구축한다.\n- 장기: 스마트홈·아파트 커뮤니티 플랫폼에 대해 단지별 데이터 격리, 관리자 다중 인증(MFA) 의무화, 출입카드 번호 등 물리 보안 식별자의 암호화·토큰화 저장을 적용한다.\n- 탐지: 다수 단지 입주민 정보나 RF카드 테이블에 대한 비정상 대량 조회 쿼리, 관리자 계정의 심야·비정상 IP 접속을 감시한다.\n\n**교훈**: 아파트 커뮤니티 앱은 단순한 헬스장·독서실 예약 사이트가 아니라 '누가 어느 동·호수에 살고 어떤 출입카드를 쓰는지'가 모이는 주거 안전 인프라다. 사이버 침해가 현실 공간의 주거 보안 위험으로 직결될 수 있다.\n\n### [D20261112-secta9ine] SPC그룹 계열사 '섹타나인'(해피포인트 운영사), 가맹점 관리자 계정 침해로 고객명·마스킹 카드번호 등 추가 유출 확인\n> 날짜: 비정상 접근 발생 2026-11-06 10:00경 · 1차 유출 의심 공지 2026-11-08 · 추가 유출 확인·2차 공지 2026-11-12 · 유형: 가맹점 관리자 계정 침해 및 지급대행·결제 고객 정보 유출 · 행위자: 미귀속 · 지역: 한국 · 근거: 확인(섹타나인 공식 공지)\n\n**쉽게 말하면**: 해피포인트 운영사이자 SPC그룹의 IT·마케팅 계열사인 '섹타나인(Secta9ine)'에서 가맹점 관리자 계정이 해킹당해 고객 개인정보가 유출된 사실이 확인됐습니다. 회사는 지난 11월 8일 지급대행서비스 이용 고객의 이름·휴대전화번호·계좌번호 유출 의심 정황을 1차로 알렸는데, 추가 조사를 거쳐 11월 12일에는 구매자 이름과 일부가 가려진(마스킹된) 카드번호, 카드사 정보까지 유출된 사실을 새로 확인했다고 발표했습니다. 카드 비밀번호나 CVC 같은 결제 인증정보는 유출되지 않았다고 밝혔지만, 계좌·결제 내역을 미끼로 한 사칭 피싱 위험이 있습니다.\n**먼저 할 일(초보용)**: 섹타나인 가맹점 관리자 시스템을 쓰는 점주·담당자는 감염되지 않은 안전한 기기에서 관리자 비밀번호를 즉시 바꾸고 기존 로그인 세션을 모두 로그아웃(무효화)하세요. 일반 이용자와 가맹점주는 결제 취소·환불·정산 계좌 변경을 명목으로 비밀번호나 인증번호를 요구하는 연락에 응하지 마세요.\n\n**개요**: SPC그룹(상미당홀딩스 완전자회사) 산하 IT 서비스·디지털 마케팅 기업 섹타나인은 2026년 11월 12일 공식 공지를 통해, 지난 11월 6일 오전 10시경 발생한 가맹점 관리자 계정 침해 사고를 조사하던 중 개인정보 유출 사실을 추가로 확인했다고 밝혔다(연합뉴스·보안뉴스 보도). 앞서 섹타나인은 11월 8일 1차 공지에서 외부 비정상 접근으로 지급대행서비스 이용 고객의 성명·휴대전화번호·계좌번호 등 유출 의심 정황을 안내한 바 있으며, 이번 후속 조사에서 **구매자명, 마스킹된 카드번호, 카드사** 등의 유출이 추가로 확인됐다(전체 피해 인원수는 공지에 구체적으로 명시되지 않음). 회사 측은 유출된 카드번호가 마스킹 처리되어 있고 카드 비밀번호나 CVC 등 결제 인증정보는 포함되지 않아 카드 부정결제로 직결되지는 않는다는 입장이며, 전체 시스템 전수 조사, 비정상 지급 요청 및 계좌 변경 시도 차단 강화, 이상 징후 시 즉각 거래 차단 조치를 시행 중이라고 밝혔다.\n\n**왜 일어났나**\n- 직접 원인 [확인 — 계정 탈취 수단은 미공개]: 외부 공격자가 가맹점 관리자 계정을 침해해 비정상 접근한 뒤 지급대행 및 결제 관련 고객 정보를 조회·반출했다(섹타나인 확인). 공격자가 어떤 경로(크리덴셜 스터핑, 피싱, 악성코드 등)로 가맹점 관리자 계정을 확보했는지는 공개되지 않았다.\n- 구조적 원인 [추정 — 분석]: (1) 가맹점 관리자 페이지에 다중 인증(MFA)이나 접속 IP·기기 제한이 엄격히 적용되지 않으면 탈취된 계정 하나로 대량의 고객 주문·정산 내역이 열람될 수 있는 구조 (2) 섹타나인은 과거(2022·2023년)에도 해피포인트 앱 크리덴셜 스터핑 유출로 2025년 2월 개인정보위 과징금 제재를 받은 바 있어, 계정 기반 침입 방어와 비정상 조회 차단이 가맹점 관리 영역까지 일관되게 작동했는지 점검이 필요하다(본 보고서의 분석).\n\n**침투 경로 [추정(유효 계정 로그인) / 확인(데이터 반출) — 계정 확보 수단은 미공개]**: 침해된 가맹점 관리자 계정으로 시스템에 비정상 로그인(T1078, 추정 — 공지상 '가맹점 관리자 계정 침해'로만 명시돼 구체적 인증 경위는 미공개) → 지급대행·결제 관리 시스템에 보관된 고객 정보(구매자명·마스킹 카드번호·카드사 및 성명·휴대전화번호·계좌번호 의심 항목) 열람·반출(T1213, 확인). 가맹점 관리자 계정이 처음 탈취된 기법은 공개되지 않아 매핑하지 않는다.\n\n**어떻게 조치하나** (본 보고서의 권고)\n- 즉시: 비정상 접근이 발생한 가맹점 관리자 시스템의 접근·조회 로그와 세션 기록을 신속히 보존하고, 침해된 환경이 아닌 안전한 경로에서 피해 가맹점 및 전체 관리자 계정의 비밀번호를 강제 초기화한다.\n- 단기: 비밀번호 변경만으로는 이미 발급된 세션 쿠키나 API 토큰이 유지될 수 있으므로 **기존 활성 세션·토큰을 전수 무효화**하고, 공격자가 정산 계좌 변경이나 추가 권한 계정을 심어 두었는지(지속성) 전수 점검한다. 지급대행 출금·계좌 변경 기능에는 추가 본인 확인을 즉시 강제한다.\n- 장기: 모든 가맹점·파트너 관리자 콘솔에 MFA(다중 인증)를 예외 없이 의무화하고, 단일 가맹점 계정이 조회할 수 있는 과거 거래·고객 정보의 범위와 일일 조회 건수 상한을 엄격히 제한한다.\n- 탐지: 가맹점 관리자 계정의 평상시와 다른 IP·국가 접속, 단시간 내 다수 고객 결제·지급대행 내역 연속 조회 및 정산 계좌 변경 시도를 실시간 차단·경보한다.\n\n**교훈**: 마스킹된 카드번호와 구매자 이름, 카드사 정보만으로는 당장 카드를 긁을 수 없더라도, 피해자에게 \"**OO카드로 결제하신 내역 확인차 연락드렸습니다**\"라고 속이는 맞춤형 보이스피싱에는 아주 강력한 미끼가 된다. \"결제 인증정보가 빠졌으니 안전하다\"고 안심할 수 없는 이유다.\n\n### [D20261112-xenorchestra] 가상화 관리 도구 Xen Orchestra 인증 우회(VSA-2026-062) 실제 악용 — 빈 JSON 쿠키 하나로 하이퍼바이저 root 장악\n> 날짜: Vates 긴급 보안 권고(VSA-2026-062)·패치 공개 2026-11-10 · 보도·분석 2026-11-11~12 · 유형: 가상화 관리 콘솔 인증 우회 및 하이퍼바이저 장악(실제 악용 확인) · 행위자: 미귀속 · 지역: 전 세계(해외) · 근거: 확인(Vates 공식 보안 권고·보안 연구진 관측)\n\n**쉽게 말하면**: 기업들이 여러 대의 가상 서버(가상머신)를 한꺼번에 관리할 때 쓰는 웹 도구 '젠 오케스트라(Xen Orchestra)'에서, 아이디나 비밀번호를 전혀 몰라도 로그인 과정을 통째로 건너뛸 수 있는 치명적인 결함(VSA-2026-062)이 실제 해킹 공격에 악용됐습니다. 공격자가 쿠키 값에 '빈 괄호(`j:{}`)' 하나만 넣어서 보내면, 프로그램이 이를 제대로 검사하지 않고 데이터베이스 맨 첫 줄에 있는 토큰(보통 최고 관리자 계정)을 그대로 꺼내 줘서 곧바로 관리자 권한을 얻게 됩니다. 이를 통해 공격자는 관리 도구뿐 아니라 그 아래 연결된 물리 가상화 서버(XCP-ng 하이퍼바이저) 전체의 최고 권한(root)까지 장악했습니다.\n**먼저 할 일(초보용)**: Xen Orchestra 또는 Xen Orchestra Appliance(XOA)를 운영하는 관리자는 **지금 즉시 관리 웹 화면이 외부 인터넷에서 접속되지 않도록 방화벽으로 차단**하고, 네트워크 패킷·호스트 로그를 보존한 뒤 수정 버전(안정 채널 6.9.2, 최신 채널 6.10.1 이상 — 당시 기준)으로 업데이트하세요. 이 공격은 일반 관리 로그에 흔적이 안 남으므로, 인터넷에 한 번이라도 열려 있었다면 관리자 토큰·연동 비밀번호를 전부 바꾸고 서버에 낯선 가상머신(`pivot2`)이나 예약 작업(`/etc/cron.d/zz-ustar`)이 없는지 반드시 확인하세요.\n\n**개요**: 가상화 솔루션 기업 Vates는 2026-11-10 치명적(Critical) 등급 보안 권고 **VSA-2026-062**(공개 시점 CVE 번호 미부여)를 발표하고, 자사의 가상화 통합 관리 플랫폼 Xen Orchestra(XO) 및 Xen Orchestra Appliance(XOA)의 인증 우회 취약점이 실제 공격에서 악용(in the wild)되고 있음을 확인했다. 결함은 REST API의 쿠키 파싱 과정에서 발생한다. 공격자가 `authenticationToken=j:%7B%7D`(디코딩 시 `j:{}`) 형태의 조작된 쿠키를 보내면 쿠키 파서가 이를 문자열이 아닌 빈 JSON 객체(`{}`)로 변환해 토큰 검증기에 넘긴다. 토큰 검증기가 입력값이 문자열인지 확인하지 않고 빈 객체를 그대로 데이터베이스 조회 조건(필터 없는 전체 조회)으로 처리하면서, 저장소에서 가장 먼저 발견되는 만료되지 않은 토큰(대부분 최초 생성된 최고 관리자 토큰)의 소유자로 공격자를 로그인시켜 준다. 이후 공격자는 인증된 `/rest/v0/users/me/authentication_tokens` 경로에서 재사용 가능한 로그인 토큰을 추출하고, 관리 대상 가상화 풀(Pool)에서 임의 코드를 실행해 연결된 XCP-ng 하이퍼바이저 노드의 root 권한까지 장악했다. 보안 연구진과 Vates가 확인한 실제 공격에서는 특정 악성 IP(`91.211.251[.]112`) 및 Tor 히든 서비스(`.onion`)가 사용됐으며, 호스트 내 악성 예약 작업(`/etc/cron.d/zz-ustar`) 등록과 `pivot2`라는 이름의 은닉 가상머신 생성 등 지속성 확보 행위가 관측됐다. 특히 비인증 공격이 성공하더라도 XO의 표준 애플리케이션 로그에는 인증 우회 기록이 남지 않는다.\n\n**왜 일어났나**\n- 직접 원인 [확인: Vates VSA-2026-062]: REST API 쿠키 파서가 `j:` 접두사를 JSON 객체로 역직렬화하는 동작과, 토큰 조회 함수가 입력 타입(문자열 여부)을 검증하지 않고 빈 객체(`{}`)를 무필터 쿼리로 실행한 타입 혼동(type confusion / improper input validation) 결함이 결합됐다.\n- 구조적 원인 [추정 — 분석]: (1) 물리 하이퍼바이저 전체의 생사여탈권을 쥔 가상화 통합 관리 콘솔(XO)을 공용 인터넷에 직접 노출해 둔 운영 환경 (2) 애플리케이션 자체 로그만 믿고 웹 프록시·네트워크 계층의 원시 HTTP 요청 로깅을 갖추지 않으면 인증 우회 침투를 사후에도 알아채기 어려운 구조.\n\n**침투 경로 [확인 — Vates·보안연구진 관측 기준]**: 외부 노출된 Xen Orchestra REST API에 빈 JSON 객체 쿠키(`authenticationToken=j:{}`)를 전송해 인증 우회 및 Admin 권한 획득(T1190) → `/rest/v0/users/me/authentication_tokens` 엔드포인트에서 재사용 가능한 인증 토큰 추출(T1528) → 관리 대상 가상화 풀 및 연결된 XCP-ng 호스트에서 root 권한으로 임의 명령 실행(T1059) → 호스트 `/etc/cron.d/zz-ustar` 등에 예약 작업(cron)을 등록해 지속성 확보(T1053.003).\n\n**어떻게 조치하나** (벤더 권고 및 본 보고서 권고)\n- 즉시: Xen Orchestra 관리 인터페이스의 외부 인터넷 노출을 즉시 차단하고 전용 관리망·VPN 뒤로 격리한다. 패치 전 네트워크 트래픽 캡처·웹 프록시 로그·XCP-ng 호스트 로그·메모리 증거를 신속히 보존한 뒤, 당시 기준 수정 버전(Stable 6.9.2 / `xo-server` 5.211.2, Latest 6.10.1 / `xo-server` 5.213.1 이상 최신 보안 버전)을 적용한다. 침해된 시스템에서 새 자격 증명이나 키를 발급하지 않는다.\n- 단기: XO 자체 로그에는 공격 흔적이 남지 않으므로, ① 웹 프록시·네트워크 패킷 기록에서 `authenticationToken=j:%7B%7D` 또는 `j:{}` 문자열 유무, ② 관리 중인 XCP-ng 호스트의 `/etc/cron.d/zz-ustar` 등 비정상 cron 작업, ③ `pivot2` 등 알 수 없는 가상머신이나 `hvm_serial: file` 설정이 있는 VM 존재 여부를 전수 점검한다. 인터넷에 노출돼 있었거나 침해 흔적이 하나라도 발견된 경우 패치만으로는 불충분하므로 **기존 XO 인증 토큰을 전수 폐기**하고, 백업·스토리지·AD 연동 자격 증명과 호스트 SSH 키를 안전한 환경에서 전면 교체하며 **XO 어플라이언스 및 침해된 XCP-ng 노드를 재설치(재구축)**한다.\n- 장기: 가상화 관리 평면(vCenter, Xen Orchestra, Proxmox 등)은 어떤 경우에도 인터넷에 직접 노출하지 않는 제로트러스트 관리망 원칙을 강제하고, API 프레임워크에서 쿠키·파라미터의 자동 JSON 객체 파싱을 비활성화하거나 스키마 타입 검증을 강제한다.\n- 탐지: HTTP 쿠키 헤더 내 `j:%7B`·`j:{` 패턴, `/rest/v0/users/me/authentication_tokens`에 대한 비정상 호출, 하이퍼바이저 호스트의 `/etc/cron.d/` 파일 생성 및 비인가 VM 생성 이벤트를 탐지한다.\n\n**교훈**: 가상화 관리 도구가 뚫리는 것은 서버 한 대가 뚫리는 것이 아니라 **데이터센터 전체의 바닥(하이퍼바이저)이 통째로 넘어가는 것**이다. 더욱이 공격이 성공해도 애플리케이션 로그에 남지 않는다는 점은, 왜 관리 화면을 인터넷에서 완전히 숨기는 것이 패치보다 먼저여야 하는지를 명확히 보여준다.\n\n### [D20261112-sap-icm2shell] SAP 11월 정기 패치: 'ICM2Shell'(CVE-2026-76964·89126) 등 비인증 원격 CVSS 10.0 만점 결함 4건 동시 수정\n> 날짜: SAP 정기 보안 패치·Onapsis·RedRays 기술 공개 2026-11-10~11 · 보도 2026-11-11~12 · 유형: 엔터프라이즈 ERP 커널·웹 디스패처·게이트웨이·SAML 치명적 취약점(CVSS 10.0 4건) · 행위자: — (실제 악용 미확인) · 지역: 전 세계(해외) · 근거: 확인(SAP Security Notes·Onapsis·MITRE CVE 확인)\n\n**쉽게 말하면**: 대기업의 회계·인사·생산 등 핵심 업무를 담당하는 SAP 시스템에서, 위험도 최고 점수(CVSS 10.0 만점)짜리 치명적 보안 결함이 한 달에 무려 4건이나 동시에 발표돼 긴급 패치가 나왔습니다. 4건 모두 해커가 아이디·비밀번호 없이, 그리고 직원이 아무런 버튼을 누르지 않아도 원격에서 악용할 수 있습니다. 특히 'ICM2Shell'로 명명된 2건(CVE-2026-76964, CVE-2026-89126)은 외부 웹 접속을 받아 주는 길목(인터넷 통신 관리자와 웹 디스패처)에 기본으로 켜져 있는 웹소켓 통신 결함이어서, 조작된 신호만 보내면 곧바로 서버 운영체제 명령어를 실행하고 SAP 시스템 전체를 장악할 수 있습니다.\n**먼저 할 일(초보용)**: SAP NetWeaver AS ABAP 및 SAP Web Dispatcher를 운영하는 기업은 SAP가 배포한 2026년 11월 보안 패치(Note #3778530, #3778556, #3798345, #3849308)를 최우선으로 적용하세요. 이때 내부 커널만 고치고 바깥쪽 **웹 디스패처(Web Dispatcher) 업데이트를 하나라도 빠뜨리면 구멍이 그대로 남으므로** 모든 웹 디스패처를 빠짐없이 함께 업데이트하고, 만약 침해가 의심된다면 패치만으로는 이미 발급된 세션·토큰이 사라지지 않으므로 안전한 환경에서 기존 세션을 무효화하세요.\n\n**개요**: SAP는 2026년 11월 정기 보안 패치(Security Patch Day)를 통해 총 17건의 보안 노트를 발표했으며, 이 가운데 **CVSS 10.0(만점) 취약점이 이례적으로 4건** 포함됐다(Onapsis Research Labs 발굴·분석 및 RedRays·The Hacker News·보안뉴스 보도). 4건 모두 사전 인증이나 사용자 상호작용이 필요 없다.\n1. **ICM2Shell — CVE-2026-76964(SAP Note #3778530, NetWeaver AS ABAP의 Internet Communication Manager) 및 CVE-2026-89126(SAP Note #3778556, SAP Web Dispatcher / HANA XS Advanced 내장 포함)**: 두 컴포넌트가 공유하는 SAP 커널 코드에서 분할(fragmented)된 웹소켓(WebSocket) 제어 메시지를 재조합할 때 길이 값 검증이 누락돼, 로그인 전 단계에서 힙 메모리 범위 밖 쓰기(out-of-bounds write)가 발생한다. SAP 환경에서 웹소켓은 기본 활성화돼 있고 일부 기본 서비스는 인증 없이 웹소켓 연결을 수락하므로, 비인증 원격 공격자가 조작된 트래픽을 보내 시스템 설치 소유자(`\u003csid>adm`) 권한으로 임의 OS 명령을 실행하거나 서비스를 중단시킬 수 있다.\n2. **ProxyGate — CVE-2026-89103(SAP Note #3798345, SAP Gateway)**: SAP 게이트웨이가 높은 권한을 부여하는 기본 접근 제어 목록(ACL)을 활성화해, 네트워크 접근이 가능한 비인증 외부 공격자가 내부 애플리케이션 서버로 위장해 비인가 작업을 수행하고 시스템을 완전 장악할 수 있는 접근 통제 결함이다.\n3. **SAML 2.0 인증 우회 — CVE-2026-120017(SAP Note #3849308, SAP NetWeaver AS ABAP 및 ABAP Platform)**: 특정 설정에서 수신되는 SAML 2.0 인증 증명(assertion)의 검증이 불충분해, 비인증 공격자가 조작된 데이터를 제출함으로써 인증을 우회하고 관리자 등 특권 계정을 사칭해 시스템과 연결된 후속 시스템까지 장악할 수 있는 결함이다(지난 6월 수정된 CVE-2026-44748과 달리 일반 계정조차 필요 없다).\n\n**왜 일어났나**\n- 직접 원인 [확인: SAP, Onapsis, MITRE]: (1) ICM·Web Dispatcher 커널의 분할 웹소켓 프레임 재조합 시 길이 검증 누락으로 인한 메모리 오염(CVE-2026-76964·89126) (2) SAP Gateway 기본 ACL의 과도한 권한 부여로 외부 호스트를 내부 앱 서버로 오인(CVE-2026-89103) (3) SAML 2.0 인증 응답 검증 미흡(CVE-2026-120017).\n- 구조적 원인 [추정 — 분석]: 외부 웹 트래픽을 최전선에서 받아 내부 ERP로 전달하는 Web Dispatcher와 ICM이 동일한 C/C++ 기반 커널 파서를 공유하고 기본 설정으로 비인증 웹소켓 엔드포인트를 열어 두어, 파서 결함 하나가 곧바로 경계 장비와 코어 서버 양쪽의 비인증 원격 코드 실행으로 이어지는 구조(본 보고서의 분석).\n\n**침투 경로 [후보 — 공개 시점 실제 악용 미확인, 취약점 메커니즘 기준]**: 외부 노출된 SAP Web Dispatcher·ICM·Gateway·SAML 엔드포인트에 조작된 웹소켓 트래픽·게이트웨이 요청·SAML 데이터를 전송해 비인증 침투(T1190, 후보) → (ICM2Shell의 경우) 힙 메모리 오염을 통해 `\u003csid>adm` 권한으로 운영체제 명령 실행(T1059, 후보). 실제 공격 악용 사례는 공개 시점에 보고되지 않아 모두 `후보`로 매핑한다.\n\n**어떻게 조치하나** (벤더·연구기관 권고 및 본 보고서 권고)\n- 즉시: SAP 커널 및 **모든 SAP Web Dispatcher 인스턴스(HANA XS Advanced 내장 포함)**에 2026년 11월 패치(Note #3778530, #3778556, #3798345, #3849308 등)를 즉시 적용한다. 패치 전 웹 디스패처·ICM·게이트웨이·SAML 감사 로그를 보존한다.\n- 단기: SAML 결함(CVE-2026-120017)과 게이트웨이 결함(CVE-2026-89103)은 별도의 설정 우회책(workaround)이 없으므로 패치가 유일한 해결책이다. 패치 후 게이트웨이 접근 규칙(ACL) 강화 설정을 활성화하고 게이트웨이 포트(`33xx`)가 인터넷이나 일반 사용자 망에 노출되지 않도록 방화벽으로 차단하며, 사용자가 ICM에 직접 붙지 않고 반드시 패치된 Web Dispatcher만 거치도록 구성한다. SAML을 사용하는 ABAP 시스템은 신뢰하는 IdP 목록과 감사 로그에서 비정상 특권 SAML 로그인 흔적이 있었는지 점검하고, 침해가 의심되면 활성 세션·토큰·연동 키를 회수하고 시스템을 재구축한다.\n- 장기: 인터넷 경계에 놓인 SAP Web Dispatcher의 불필요한 기본 웹소켓 서비스 노출을 최소화하고, ERP 코어 커널 패치 주기를 일반 업무 변경 관리보다 우선하는 긴급 보안 트랙으로 분리한다.\n- 탐지: Web Dispatcher 및 ICM으로 유입되는 비정상 분할 WebSocket 제어 프레임·크래시 로그, 외부 IP의 게이트웨이 포트(`33xx`) 접속 시도, 예상치 못한 출처의 특권 계정 SAML 로그인 이벤트를 모니터링한다.\n\n**교훈**: 지난주 바라쿠다 보안장비 결함(`D20261111-barracuda`)이 패치 공개 7일 만에 실제 악용으로 전환됐듯, CVSS 10.0 만점 결함 4건이 한꺼번에 공개된 SAP 환경도 공격자들의 최우선 역분석 표적이 된다. 특히 바깥쪽 Web Dispatcher 하나만 패치를 빼먹어도 그 지점이 그대로 돌파구가 된다.\n\n### [D20261112-screenconnect-msp] ConnectWise ScreenConnect MSP 표적 캠페인 — 서드파티 확장(RMM+ 계열) 악용으로 클라우드 파트너 400여 곳 긴급 차단\n> 날짜: ConnectWise·Huntress 경고 및 확장 강제 비활성화 2026-11-10~11 · 유형: 원격 관리 도구(ScreenConnect) 패널 및 서드파티 확장 악용 공급망·연쇄 침해 · 행위자: 미귀속 · 지역: 전 세계(해외) · 근거: 확인(ConnectWise 공식 공지·Huntress SOC 분석)\n\n**쉽게 말하면**: 여러 고객사의 PC와 서버를 원격으로 관리해 주는 IT 관리업체(MSP)들이 쓰는 원격 제어 도구 '커넥트와이즈 스크린커넥트(ConnectWise ScreenConnect)' 환경을 노린 실제 해킹 캠페인이 포착됐습니다. 공격자는 스크린커넥트 자체의 결함이 아니라, 탈취한 계정·세션으로 관리 화면에 들어간 뒤 원격 명령 실행 기능을 가진 제3자 부가기능(RMM+ 계열 확장 프로그램 5종)을 악용해 하위 고객사 컴퓨터 수백 대에 공격자가 조종하는 '가짜 스크린커넥트 프로그램'을 몰래 추가로 깔았습니다. 더 위험한 것은, 관리업체 직원이 감염된 고객 컴퓨터를 고치려고 원격 접속하는 순간 거꾸로 직원 컴퓨터의 로그인 토큰이 털려 다른 고객사 관리 화면까지 연쇄 감염될 수 있다는 점입니다.\n**먼저 할 일(초보용)**: ScreenConnect를 운영하는 MSP 및 기업 관리자는 서드파티 확장 프로그램 5종(**RMM+, RMM Plus, RMM Plus Password Link, RMM+ Password Link, Labtech Plus**)이 설치돼 있다면 즉시 비활성화·제거하세요(클라우드 버전은 ConnectWise가 약 400곳에서 강제 차단함). 또한 고객사 엔드포인트에 우리 회사가 아닌 낯선 서버 주소로 연결되는 ScreenConnect 클라이언트가 추가로 깔려 있지 않은지 전수 점검하세요.\n\n**개요**: 보안 기업 Huntress와 ConnectWise는 2026-11-10~11 관리형 서비스 제공사(MSP)의 ConnectWise ScreenConnect 환경을 겨냥한 활발한 악성코드 캠페인을 확인하고 긴급 경고를 발령했다. 두 회사의 발표(BleepingComputer·The Hacker News 보도)에 따르면, ScreenConnect 코어 소프트웨어 자체의 신규 취약점이나 ConnectWise 본사 인프라 침해 증거는 없으나, 공격자들이(탈취된 자격 증명이나 가로챈 운영자 세션 등을 통해) MSP의 ScreenConnect 관리 패널에 접근한 뒤 원격 명령 실행 API를 노출하는 서드파티 확장 기능 5종(**RMM+, RMM Plus, RMM Plus Password Link, RMM+ Password Link, Labtech Plus**)과 패널의 'Run Command' 기능을 악용했다. 이를 통해 다수의 침해된 MSP에 연결된 하위 고객사 엔드포인트 수백 대에 공격자의 서버로 연결되는 변조(rogue) ScreenConnect 클라이언트를 지속성 백도어로 배포했다. 특히 Huntress는 MSP 엔지니어가 이미 감염된 고객 엔드포인트를 조사·복구하기 위해 대화형(interactive) 세션으로 접속할 경우, 엔드포인트의 악성코드가 역방향으로 엔지니어 워크스테이션을 타고 넘어와 인증 토큰이나 브라우저 세션을 긁어낸 뒤 엔지니어가 접근할 수 있는 다른 ScreenConnect 패널로까지 확산(reverse pivot)하는 위험을 확인했다. ConnectWise는 예방 조치로 자사 클라우드 파트너 환경 약 400곳에서 해당 확장 5종을 강제 비활성화했으며, 자체 서버(On-premises) 운영 고객에게도 즉시 수동 비활성화할 것을 촉구했다.\n\n**왜 일어났나**\n- 직접 원인 [확인: ConnectWise, Huntress]: 공격자가 확보한 ScreenConnect 패널 접근 권한과 원격 명령 실행 API를 제공하는 서드파티 확장(RMM+ 계열 5종)·Run Command 기능을 결합해 하위 엔드포인트에 변조 원격 제어 클라이언트를 배포했다(최초 패널 계정·세션 탈취 경로는 개별 사례별로 조사 중).\n- 구조적 원인 [추정 — 분석]: (1) MSP 원격 관리 도구는 한 번 관리자 패널이 뚫리면 수백~수천 대의 고객사 엔드포인트에 정상 관리 명령으로 악성코드를 일괄 배포할 수 있는 구조적 파급력을 가짐 (2) 코어 제품은 안전하더라도 검증이 느슨한 서드파티 확장(플러그인)이 위험한 원격 실행 API를 열어 두면 공격 표면이 되며, 감염 기기에 관리자가 대화형으로 접속할 때 관리자 세션이 역탈취되는 양방향 신뢰 위험이 존재한다(본 보고서의 분석).\n\n**침투 경로 [확인 — ConnectWise·Huntress 기준]**: 침해된 MSP의 ScreenConnect 관리 환경을 통해 하위 고객사 엔드포인트에 신뢰 경로로 접근(T1199) → ScreenConnect의 Run Command 및 서드파티 RMM+ 계열 확장 API를 악용해 원격 명령·페이로드 일괄 실행(T1072) → 고객사 엔드포인트에 공격자 인프라로 연결되는 변조(rogue) ScreenConnect 원격 제어 클라이언트를 추가 설치해 C2·백도어 통로 확보(T1219) → MSP 기술자가 감염된 엔드포인트에 대화형 접속 시 기술자 PC의 인증 토큰·브라우저 세션을 탈취해 타 패널로 확산(T1539).\n\n**어떻게 조치하나** (벤더·Huntress 권고 및 본 보고서 권고)\n- 즉시: 온프레미스 ScreenConnect 서버에서 RMM+ 계열 서드파티 확장 5종(`RMM+`, `RMM Plus`, `RMM Plus Password Link`, `RMM+ Password Link`, `Labtech Plus`)을 즉시 비활성화·삭제한다(클라우드 파트너는 강제 비활성화됨). 조치 전 ScreenConnect 감사 로그·명령 실행 이력·엔드포인트 프로세스 기록을 보존하며, 침해된 관리자 PC에서 새 비밀번호나 토큰을 발급하지 않는다.\n- 단기: 모든 ScreenConnect 운영자 계정의 활성 세션·토큰을 일괄 무효화하고 안전한 기기에서 비밀번호를 교체하며 피싱 저항 MFA를 강제한다. 관리 대상 고객사 엔드포인트 전수에서 정상 MSP 인스턴스 외에 낯선 도메인·IP로 연결되는 **추가(rogue) ScreenConnect 클라이언트 프로세스·서비스**가 설치돼 있는지 헌팅해 제거하고, 이미 감염된 엔드포인트를 점검할 때는 브라우저 세션·토큰이 있는 일반 관리자 PC로 대화형 접속하지 말고 격리된 클린 분석 환경을 사용한다. 침해가 깊은 엔드포인트나 관리 서버는 재구축한다.\n- 장기: RMM·원격 지원 도구에 설치된 서드파티 확장·플러그인을 전수 감사해 불필요한 확장을 제거하고, 대규모 'Run Command' 실행 시 다중 관리자 승인이나 직무 분리 통제를 적용한다.\n- 탐지: ScreenConnect 서버가 생성하는 비정상 하위 프로세스(`cmd.exe`, `powershell.exe`), 새로운 `ScreenConnect.ClientService` 인스턴스 추가 설치 및 미승인 외부 Relay 서버로의 아웃바운드 연결을 EDR에서 탐지한다.\n\n**교훈**: 원격 관리 도구(RMM) 본체가 최신 패치 상태여도 **서드파티 확장 플러그인**과 **관리자 세션**이 뚫리면 똑같이 고객사 전체에 악성코드가 뿌려진다. 또한 \"감염된 고객 PC를 고치러 들어간 엔지니어 PC가 거꾸로 감염되는\" 역방향 전이는 보안 관제·인프라 운영팀이 반드시 기억해야 할 함정이다.\n\n### [D20261112-ivanti-fortinet] Ivanti EPM 비인증 SQL 삽입 RCE(CVE-2026-121653) 및 Fortinet FortiManager·FortiOS 치명적 결함(CVE-2026-126170·126253) 동시 패치\n> 날짜: Ivanti 보안 공지 2026-11-10(KISA 보안 권고 11-11) · Fortinet 보안 공지 및 CVE 공개 2026-11-11 · 유형: 엔드포인트·방화벽 중앙 관리 서버 및 네트워크 OS 치명적 취약점 · 행위자: — (실제 악용 미확인) · 지역: 전 세계(해외) · 근거: 확인(Ivanti·Fortinet 보안 권고, MITRE CVE, KISA 권고)\n\n**쉽게 말하면**: 기업 내부의 모든 PC·서버를 관리하는 '이반티 엔드포인트 매니저(Ivanti EPM)'와 회사 방화벽들을 중앙에서 통합 제어하는 '포티매니저(Fortinet FortiManager)' 및 방화벽 운영체제 '포티OS(FortiOS)'에서, 공격자가 로그인도 하지 않고 원격에서 명령어를 실행하거나 통신 경로를 조작할 수 있는 치명적인 결함들이 잇따라 발표돼 패치가 나왔습니다. 아직 실제 해킹 공격에 쓰인 사례는 보고되지 않았지만, 이반티와 포티넷 장비는 해커들이 패치가 나오자마자 가장 먼저 노리는 단골 표적이어서 서둘러 업데이트해야 합니다.\n**먼저 할 일(초보용)**: Ivanti EPM·CSA·EPMM·Sentry 또는 Fortinet FortiManager·FortiAnalyzer·FortiOS를 운영하는 기관·기업은 **관리 인터페이스와 연동 포트(JSON API·OFTP 등)가 외부 인터넷에 노출돼 있지 않은지 즉시 확인해 차단**하고, 각 벤더가 배포한 최신 보안 패치를 바로 적용하세요. 이미 비정상 접근이 의심되는 장비는 패치만 하지 말고 안전한 기기에서 연동 인증서·비밀번호·세션을 모두 재발급하세요.\n\n**개요**: 2026-11-10~11 엔터프라이즈 인프라 및 보안 장비 벤더인 Ivanti와 Fortinet이 각각 치명적(Critical) 등급 취약점 패치를 발표했다(MITRE CVE 공식 레코드·데일리시큐·KISA 보안 공지 확인, 두 벤더 모두 공지 시점 실제 악용 사례는 미확인).\n1. **Ivanti (11/10 공지, 11/11 KISA 권고)**:\n   - **Ivanti Endpoint Manager(EPM) 코어 — CVE-2026-121653(CVSS 9.8)**: 2024 SU8 미만 버전의 EPM 코어 서버에 존재하는 SQL 삽입 결함으로, 인증되지 않은 원격 공격자가 악용해 원격 코드 실행(RCE)을 달성할 수 있다(2024 SU8에서 수정).\n   - **Ivanti Cloud Services Application(CSA) — CVE-2026-121683(CVSS 9.4)**: CSA 5.0.8 버전의 인증 누락 결함으로, 비인증 원격 공격자가 신뢰된 EPM 코어 인증서 항목을 임의로 추가하거나 삭제할 수 있다(5.0.8.1에서 수정).\n   - **Ivanti EPMM 및 Sentry — CVE-2026-105425**: 운영체제 명령어 삽입 취약점(EPMM 12.9.0.3, 12.10.0.1, 12.11.0.0 등에서 수정).\n2. **Fortinet (11/11 CVE·보안 공지 공개)**:\n   - **FortiManager·FortiAnalyzer(및 Cloud·BigData) — CVE-2026-126170(CVSS 9.8)**: 7.6.0~7.6.7 및 8.0.0~8.0.2 버전의 JRPC API에서 출력 인코딩·이스케이프 처리가 미흡(JSON 삽입)해, 선택적 JSON API가 활성화된 환경에서 비인증 원격 공격자가 특수 조작된 HTTP 요청으로 임의 코드·명령을 실행할 수 있다. 아울러 도달 가능한 OFTP 서비스를 통한 비인증 SQL 삽입·SSRF 결함(**CVE-2026-126262·126260**)도 함께 수정됐다.\n   - **FortiOS — CVE-2026-126253(CVSS 9.3)**: FortiOS 7.2.0~7.2.13, 7.4.0~7.4.12, 7.6.0~7.6.7, 8.0.0~8.0.1의 OSPF 라우팅 프로세스 인증 우회 결함으로, OSPF가 활성화된 환경에서 비인증 공격자가 특수 조작된 요청으로 허위 라우팅 정보(LSA)를 브로드캐스트해 네트워크 트래픽을 오도하거나 단절시킬 수 있다.\n\n**왜 일어났나**\n- 직접 원인 [확인: Ivanti, Fortinet, MITRE]: (1) Ivanti EPM 코어의 SQL 쿼리 입력 검증 누락(CVE-2026-121653) 및 CSA의 인증서 관리 엔드포인트 사전 인증 누락(CVE-2026-121683) (2) FortiManager/FortiAnalyzer JRPC API의 출력 인코딩 누락(CVE-2026-126170) 및 FortiOS OSPF 라우팅 패킷 검증 결함(CVE-2026-126253).\n- 구조적 원인 [추정 — 분석]: 사내 모든 PC에 명령을 내리는 엔드포인트 관리 서버(EPM)와 수십~수백 대의 방화벽 정책을 배포하는 중앙 관리 장비(FortiManager)는 공격자에게 '한 번 뚫으면 전사 망을 장악하는 마스터키'여서, 관리 API나 연동 포트가 네트워크에 넓게 열려 있을 경우 치명적 피해로 직결된다(본 보고서의 분석).\n\n**침투 경로 [후보 — 공개 시점 실제 악용 미확인, 취약점 메커니즘 기준]**: 네트워크에서 접근 가능한 Ivanti EPM·CSA 또는 FortiManager·FortiOS 인터페이스에 조작된 요청을 보내 비인증 침투(T1190, 후보) → (EPM SQLi 및 FortiManager JRPC 결함의 경우) 서버에서 비인가 원격 코드·명령 실행(T1059, 후보). 실제 악용이 확인되지 않았으므로 `후보`로 매핑한다.\n\n**어떻게 조치하나** (벤더·KISA 권고 및 본 보고서 권고)\n- 즉시: Ivanti EPM(2024 SU8 이상), CSA(5.0.8.1 이상), EPMM(12.9.0.3 / 12.10.0.1 / 12.11.0.0 이상 — 당시 기준) 및 Fortinet FortiManager·FortiAnalyzer(영향 범위인 7.6.0~7.6.7·8.0.0~8.0.2 이후 수정 릴리스), FortiOS(영향 범위인 7.2.0~7.2.13·7.4.0~7.4.12·7.6.0~7.6.7·8.0.0~8.0.1 이후 수정 릴리스 — 각 계열별 정확한 수정 빌드 번호는 벤더 공식 권고 확인) 최신 보안 패치를 지체 없이 적용한다. 패치 전 관리 API·DB·인증서 변경 로그를 보존한다.\n- 단기: FortiManager·FortiAnalyzer에서 사용하지 않는 선택적 JSON API(JRPC)를 비활성화하고 관리 인터페이스와 OFTP 포트 접근을 신뢰된 장비·관리 IP로만 엄격히 제한한다. Ivanti CSA에서는 신뢰된 EPM 코어 인증서 목록에 낯선 인증서가 추가되거나 기존 항목이 삭제된 흔적이 없는지 감사하고, 이상 징후가 발견되면 연동 인증서·관리자 세션·토큰을 전면 재발급하며 침해 의심 시 서버를 재구축한다.\n- 장기: 엔드포인트 관리 서버(EPM)와 방화벽 중앙 관리기(FortiManager)를 공용 인터넷은 물론 일반 업무망에서도 직접 접근할 수 없도록 전용 관리 세그먼트로 분리한다.\n- 탐지: EPM 코어 서버의 비정상 SQL 오류 및 하위 프로세스 생성, CSA 인증서 목록 변경 이벤트, FortiManager JRPC 엔드포인트에 대한 비인가 HTTP 요청 및 FortiOS의 비정상 OSPF LSA 수신 경보를 모니터링한다.\n\n**교훈**: 보안 장비(FortiManager)와 PC 관리 서버(Ivanti EPM)는 방어자의 도구이지만, 패치가 늦어지면 공격자의 가장 강력한 배포 도구로 바뀐다. 특히 Ivanti CSA의 '신뢰 인증서 임의 추가·삭제(CVSS 9.4)'처럼 원격 코드 실행이 아니더라도 신뢰 체계를 무너뜨리는 결함을 함께 막아야 한다.\n\n### [D20261112-maersk] 해운·물류 대기업 머스크(Maersk), 인수 법인(LF Logistics) 레거시 시스템 침해 확인 — 공격자는 100GB·500만 달러 주장\n> 날짜: 공격자 다크웹 게시 및 Maersk 공식 확인·보도 2026-11-10~11 · 유형: 인수 법인 로컬 레거시 시스템 비인가 접근·데이터 추출 및 협박 · 행위자: WhiteArmor(자칭 랜섬웨어·협박 조직) · 지역: 전 세계(해외) · 근거: 확인(Maersk 로컬 레거시 시스템 침해·데이터 추출 확인) / 주장(공격자의 100GB 탈취·500만 달러 요구 및 세부 항목)\n\n**쉽게 말하면**: 세계적인 해운·물류 대기업 '머스크(A.P. Moller-Maersk)'가 과거 다른 회사를 인수하면서 물려받은 지역의 옛날 전산 시스템(레거시 시스템)에 해커가 침입해 데이터를 빼간 사실을 공식 확인했습니다. '화이트아머(WhiteArmor)'라는 해킹 조직은 자신들이 운전기사 정보와 최고관리자 계정, 창고 재고 기록 등 100GB 분량의 자료를 훔쳤다며 500만 달러(약 70억 원)의 몸값을 요구하고 있습니다. 머스크 측은 침입이 있었던 사실은 인정하면서도, 문제의 시스템은 본사 핵심 물류망과 분리된 옛 시스템이어서 화물 예약·운송 서비스에는 아무 지장이 없고 민감한 정보 노출도 없는 것으로 파악됐다고 밝혔습니다.\n**먼저 할 일(초보용)**: 기업 인수·합병(M&A)을 진행했거나 자회사·해외 지사를 둔 기업 보안 담당자는 본사 표준 보안 체계에 아직 편입되지 않은 채 돌아가고 있는 '인수 법인의 옛날 서버(레거시 시스템)'가 인터넷에 열려 있지 않은지 전수 점검하세요. 침해가 의심되는 레거시 서버가 있다면 즉시 망에서 격리하고, 감염된 서버가 아닌 안전한 기기에서 관리자 비밀번호·연동 키·세션을 모두 폐기·재발급하세요.\n\n**개요**: 해운·물류 대기업 A.P. Moller-Maersk는 2026-11-10~11(현지시간) 과거 기업 인수를 통해 물려받은 로컬 레거시 시스템(보안 업계 및 보도에서는 2022년 머스크가 36억 달러에 인수한 계약 물류 기업 LF Logistics의 OCF/LF 플랫폼으로 지목)에 외부 비인가 접근과 데이터 추출이 발생했다고 공식 확인했다(BleepingComputer·SecurityAffairs·Container News 보도). 동시에 'WhiteArmor'라고 자칭하는 랜섬웨어·협박 그룹이 다크웹 유출 사이트에 머스크를 등재하고, 수만 건의 운전기사 프로필·최고관리자(`SUPER_ADMIN`) 계정·모바일 기기 로그·창고 재고 데이터·배송 영수증 등 약 100GB의 데이터를 탈취했다며 30일 이내에 비트코인 500만 달러를 지불하라고 요구했다([주장]). 이에 대해 머스크는 해당 침해가 과거 인수에서 비롯된 격리된 로컬 레거시 시스템에 국한됐으며, 초기 조사 결과 민감한 데이터가 노출되지 않았고 API·EDI로 연결된 머스크의 광역 인프라나 고객 대면 화물 예약·운송 시스템에는 영향이 없어 정상 운영 중이라고 밝혔다([확인]).\n\n**왜 일어났나**\n- 직접 원인 [확인 — 세부 침투 경로는 미공개]: 과거 인수 법인에서 물려받은 로컬 레거시 시스템에 외부 비인가 접근이 발생해 데이터가 추출됐다(머스크 공식 확인). 어떤 취약점이나 계정으로 침투했는지는 공개되지 않았다.\n- 구조적 원인 [추정 — 분석]: 글로벌 대기업이 타 기업(물류·창고 업체 등)을 인수·합병한 뒤, 기존에 쓰던 지역 단위 레거시 시스템을 완전히 퇴역시키거나 본사 수준의 보안 관제·패치 체계로 통합하기까지의 과도기가 공격자들의 단골 침투 지점이 된다. 다만 해당 레거시 시스템이 머스크 본사 코어망과 네트워크적으로 분리돼 있었던 덕분에 전사 물류 마비로 번지지 않았다(본 보고서의 분석).\n\n**침투 경로 [확인(갈취 요구) / 최초 침투는 미공개]**: 인수 법인의 로컬 레거시 시스템에 비인가 접근해 데이터 추출(초기 침투 수단은 미공개여서 매핑 안 함) → 추출한 데이터를 빌미로 다크웹 유출 사이트에 등재하고 500만 달러 몸값 요구(T1657, 확인 — 단 100GB 규모와 세부 항목은 공격자 주장).\n\n**어떻게 조치하나** (본 보고서의 권고)\n- 즉시: 침해된 로컬 레거시 시스템을 외부 네트워크 및 본사 연동 구간에서 완전히 격리하고, 포렌식 증거(접근 로그·DB 추출 기록·디스크 이미지)를 신속히 보존한다. 침해된 서버에서 새 비밀번호나 키를 발급하지 않는다.\n- 단기: 공격자가 최고관리자(`SUPER_ADMIN`) 계정 등을 확보했다고 주장하고 있으므로, 해당 레거시 시스템의 모든 관리자·사용자 계정과 세션·토큰·API 연동 키를 안전한 환경에서 전면 폐기·교체하고, 본사나 타 자회사 시스템에 동일한 비밀번호·키가 재사용됐는지 전수 점검한다. 레거시 시스템의 기능은 검증된 신규 플랫폼으로 이전하고 기존 서버는 재구축 또는 영구 폐기한다.\n- 장기: 기업 인수·합병(M&A) 시 인수 대상 기업의 외부 노출 자산·레거시 서버 전수 목록화와 본사 코어망 연결 전 강제 격리·보안 실사(Due Diligence)를 표준 절차로 운영한다.\n- 탐지: 인수 법인·자회사 레거시 서버에서의 대용량 데이터 외부 전송 및 본사 API·EDI 게이트웨이로의 비정상 접근 시도를 모니터링한다.\n\n**교훈**: 이번 사건은 기업 인수 후 남은 '옛날 시스템(레거시)'이 어떻게 공격 표적이 되는지 보여 주는 동시에, **네트워크 격리(Segmentation)**가 왜 중요한지도 함께 보여 준다. 옛 시스템 하나가 뚫렸더라도 본사 핵심 물류망과 철저히 분리돼 있었기 때문에 2017년 NotPetya 사태 때와 같은 전 세계 물류 마비를 막을 수 있었다.\n\n## 3. 교차 분석 — 오늘의 사례에서 보이는 패턴\n\n> 선정된 국내외 7건의 공통점이며 전체 공격의 통계가 아니다.\n\n1. **'관리 평면(Control Plane)'을 노리는 공격과 로그 사각지대**: 가상화 통합 관리 도구 Xen Orchestra(`D20261112-xenorchestra`), MSP 원격 제어 패널 ScreenConnect(`D20261112-screenconnect-msp`), 엔드포인트·방화벽 중앙 관리 서버 Ivanti EPM·FortiManager(`D20261112-ivanti-fortinet`)까지 오늘의 해외 주요 이슈는 모두 **수백 대의 하위 서버·PC를 거느린 '중앙 관리 도구'**에 집중됐다. 특히 Xen Orchestra 인증 우회는 성공해도 자체 애플리케이션 로그에 기록이 남지 않아, 관리 화면의 인터넷 노출 차단과 네트워크 계층 감시가 필수적이다.\n2. **프런트엔드·경계 파서와 백엔드 코어의 공유 위험**: SAP의 CVSS 10.0 결함 4건(`D20261112-sap-icm2shell`) 중 ICM2Shell은 외부 웹 요청을 받는 Web Dispatcher와 내부 ABAP 서버(ICM)가 동일한 웹소켓 커널 코드를 공유해 양쪽 모두 비인증 원격 코드 실행에 노출됐다. 내부 서버만 패치하고 경계의 Web Dispatcher를 하나라도 누락하면 방어가 무의미해진다.\n3. **국내 생활 밀착 플랫폼(주거·결제) 침해와 정부의 첫 '직권조사'**: GS건설 아파트 커뮤니티 시스템(`D20261112-gsconst`)은 실거주 주소·세대주 여부·출입 RF카드번호 등 주거·물리 보안과 직결된 항목이 유출 위험에 놓이면서 개정 정보통신망법 시행(10/1) 이후 첫 정부 직권조사 대상이 됐고, SPC 섹타나인(`D20261112-secta9ine`)은 가맹점 관리자 계정 침해로 지급대행·결제 고객 정보가 유출됐다.\n\n과거 3년 사건과의 연결은 [../과거3년/99-총평.md](../과거3년/99-총평.md)에 있다.\n\n## 4. 국내 소식 (업종별 6개 범주 검색 결과)\n\n최근 7일(2026년 11월) 기준으로 6개 범주를 각각 분리 검색해 본문 사건 2건(`D20261112-gsconst`, `D20261112-secta9ine`)과 `국내뉴스.psv` 보충 7건을 정리했다.\n\n- **① 금융권(은행·카드·보험·증권·저축은행·캐피탈·유관기관)**: 어제 본문 사건으로 다룬 **금융보안원** 상시평가 시스템 해킹(`D20261111-fsec`)의 후속 보도로, 공격자가 시스템 취약점을 이용해 **금융감독원에 부여된 것과 같은 수준의 열람 권한(허위 계정)**을 확보해 48개 금융사 자료를 열람·반출했으며 일부 소규모 금융사가 마스킹 없이 제출한 평문 개인정보가 포함됐을 가능성, 금융위·금감원의 긴급 현장조사 착수 및 박상원 금융보안원장의 FISCON 2026 개회사 공개 사과(11/11~12 보도)를 `국내뉴스.psv`에 추가했다.\n- **② 통신·OTT·플랫폼·이커머스·유통**: 해피포인트 운영사이자 SPC그룹 IT 계열사인 **섹타나인**의 가맹점 관리자 계정 침해 및 구매자명·마스킹 카드번호·카드사 추가 유출 확인(11/12 공지·보도)을 본문 사건 `[D20261112-secta9ine]`로 수록했다. 아울러 **카카오**가 2026년 상반기 카카오톡에서 피싱·스팸 등으로 차단된 계정이 약 17만 6,000개(전년 동기 대비 +6%), 일반채팅 이용제한이 13만 4,918건(사기·사칭 72.9%)에 달했다는 '톡안녕 보고서' 발표(11/11 보도)를 `국내뉴스.psv`에 추가했다.\n- **③ 공공기관·지자체·교육(대학)·의료·주거**: **GS건설** 아파트('자이') 커뮤니티 예약·관리 시스템 비인가 접근으로 입주민 개인정보·RF카드번호 등 15개 항목 유출 가능성 안내 및 과기정통부의 개정 정보통신망법 시행 후 첫 직권조사 결정(11/11~12 보도)을 본문 사건 `[D20261112-gsconst]`로 수록했다. 또한 개인정보보호위원회와 교육부가 비상교육·천재교육·미리디·소프트앤·리로소프트 등 **공교육 지원 에듀테크 사업자**를 사전 실태점검해 전 직원 관리자 권한 부여·탈퇴 정보 미파기·취약점 미조치 등을 적발하고 시정권고·개선조치를 의결했다는 발표(11/12 보도)를 `국내뉴스.psv`에 추가했다.\n- **④ 국내 랜섬웨어 피해**: 최근 7일 내 기수록 사건(한일네트웍스 11/10 보도, 메타인크립터 주장 11/10 수록) 외에 11/11~12 새로 확인된 국내 기업·기관 랜섬웨어 피해 보도는 없었다(`\"2026년 11월\" 랜섬웨어 피해 OR 감염 OR 공격 기업 OR 기관` 질의 확인).\n- **⑤ 과기정통부·KISA·개인정보위·금융위·금감원 조사 결과·제재·긴급 점검 발표**:\n  - **개인정보보호위원회(11/11 의결, 11/12 발표)**: 메일서버 취약점 침투 후 외부망에 방치된 데이터 이관용 파일서버를 통해 임직원·주주 등 14만 9,767명(주민등록번호 8만 2,750건 포함, 1.3TB)의 정보를 유출한 **삼양그룹 4개사(삼양홀딩스·삼양사·삼양패키징·삼양데이타시스템)**에 과징금 총 5억 5,200만 원과 과태료 1,620만 원, 시정명령을 부과한 건과, **알뜰폰·통신 8개사** 실태조사로 과징금 6,090만 원·과태료 1,104만 원을 부과한 건을 `국내뉴스.psv`에 추가했다.\n  - **국가AI전략위·과기정통부·행안부·국정원(11/12 출범)**: AI 악용 공격과 침해 발생 시에도 국가 핵심 서비스가 멈추지 않고 복구되도록 하는 범정부 **'국가 사이버복원력 강화 태스크포스(TF)'** 공식 출범 소식을 `국내뉴스.psv`에 추가했다.\n  - **과기정통부·KISA(11/11~12 발표)**: 유럽 슈퍼마켓 냉장 설비 해킹(`D20261106-coldchain`, `D20261110-iranfridge`)을 계기로 국내 주요 **콜드체인 기업 CISO 긴급 점검 간담회**를 개최한 소식과, 한국소비자원·KISA가 시중 **IP 카메라 10개 제품**을 점검해 3개 제품의 영상 무단 열람·원격 조작 취약점 및 4개 제품의 하드웨어 테스트 단자 활성화를 적발한 발표를 `국내뉴스.psv`에 추가했다.\n- **⑥ 기존 대형 사건의 추가 규모·후속 발표**: ①번의 금융보안원(`D20261111-fsec`) 권한 확보 경위 및 현장조사 후속 보도를 반영했다.\n\n## 5. 우선 대응 체크리스트\n\n1. **Xen Orchestra(XOA) 운영 조직(최우선 — 실제 악용 및 무로그 인증 우회)**: [D20261112-xenorchestra](#d20261112-xenorchestra-가상화-관리-도구-xen-orchestra-인증-우회vsa-2026-062-실제-악용--빈-json-쿠키-하나로-하이퍼바이저-root-장악) — 관리 웹 인터페이스 인터넷 노출 즉시 차단, 6.9.2 / 6.10.1 이상 패치, 네트워크 패킷의 `authenticationToken=j:` 흔적 및 XCP-ng 호스트의 `/etc/cron.d/zz-ustar`·`pivot2` VM 점검 후 노출 이력 시 토큰·자격 증명 전면 교체 및 재설치.\n2. **ConnectWise ScreenConnect 사용 MSP 및 기업(실제 악용 진행 중)**: [D20261112-screenconnect-msp](#d20261112-screenconnect-msp-connectwise-screenconnect-msp-표적-캠페인--서드파티-확장rmm-계열-악용으로-클라우드-파트너-400여-곳-긴급-차단) — `RMM+` 계열 서드파티 확장 5종 즉시 비활성화, 고객사 엔드포인트 내 변조(rogue) ScreenConnect 클라이언트 전수 헌팅, 운영자 세션 무효화 및 감염 기기 대화형 접속 시 격리 환경 사용.\n3. **SAP NetWeaver ABAP·Web Dispatcher 운영 기업(CVSS 10.0 4건)**: [D20261112-sap-icm2shell](#d20261112-sap-icm2shell-sap-11월-정기-패치-icm2shellcve-2026-7696489126-등-비인증-원격-cvss-100-만점-결함-4건-동시-수정) — 커널과 **모든 Web Dispatcher**에 11월 패치(Note #3778530, #3778556, #3798345, #3849308) 동시 적용, 게이트웨이 포트(`33xx`) 외부 차단.\n4. **Ivanti EPM·CSA 및 Fortinet FortiManager·FortiOS 운영 조직**: [D20261112-ivanti-fortinet](#d20261112-ivanti-fortinet-ivanti-epm-비인증-sql-삽입-rcecve-2026-121653-및-fortinet-fortimanagerfortios-치명적-결함cve-2026-126170126253-동시-패치) — EPM 2024 SU8·CSA 5.0.8.1 및 FortiManager·FortiOS 최신 패치 적용, 불필요한 JSON API(JRPC)·관리 포트 외부 비노출.\n5. **자이 아파트 커뮤니티 이용자·관리 주체 및 섹타나인 가맹점·이용자(국내 신규)**: [D20261112-gsconst](#d20261112-gsconst-gs건설-아파트자이-커뮤니티-시스템-침해-입주민-정보rf카드번호-등-15개-항목-유출-가능성-및-정부-첫-직권조사)·[D20261112-secta9ine](#d20261112-secta9ine-spc그룹-계열사-섹타나인해피포인트-운영사-가맹점-관리자-계정-침해로-고객명마스킹-카드번호-등-추가-유출-확인) — 안전한 기기에서 비밀번호 변경 및 기존 세션 무효화, 출입 RF카드 인증 방식 점검, 결제·정산·관리사무소 사칭 피싱 주의.\n\n## 6. 검증 수준과 한계\n\n- CISA KEV 카탈로그를 2026-11-12 직접 조회한 결과 11-10 등재분(어제 보고서에 수록한 6건) 이후 신규 등재 항목은 없었다.\n- SAP(`CVE-2026-76964`, `CVE-2026-89126`, `CVE-2026-89103`, `CVE-2026-120017`), Ivanti(`CVE-2026-121653`, `CVE-2026-121683`), Fortinet(`CVE-2026-126170`, `CVE-2026-126253`) 취약점은 MITRE CVE 공식 API 레코드와 벤더·연구기관 발표를 직접 대조해 확인했으며, 공개 시점 실제 악용이 확인되지 않아 ATT&CK 매핑에서 `후보`로 구분했다. 수정 버전 번호는 발표 당시 기준이므로 실제 조치 시 각 벤더의 최신 보안 권고를 재확인해야 한다.\n- Xen Orchestra(`VSA-2026-062`)는 공개 시점 CVE 번호가 부여되지 않았으나 벤더(Vates) 공식 권고로 실제 악용과 기술 세부가 확인됐다.\n- GS건설(`D20261112-gsconst`)은 최초 침투 경로가 정부 직권조사 중이어서 매핑하지 않았고, 섹타나인(`D20261112-secta9ine`)은 가맹점 관리자 계정 침해와 고객 정보 유출만 확인되고 계정 탈취 수단은 미공개여서 확인된 범위만 매핑했다. 머스크(`D20261112-maersk`) 사건에서 100GB 규모와 세부 항목은 공격자(WhiteArmor)의 일방 주장(`[주장]`)으로 회사의 공식 확인 범위와 엄격히 구분했다.\n- **ATT&CK 버전 확인 결과**: https://attack.mitre.org/tactics/enterprise/ 에서 현재 공식 버전이 **v20.1**임을 확인했다(작업 지침은 v19.2 기준, 본 저장소 카탈로그는 v20.0 기준). 전술 15개 체계는 동일하므로 임의 대규모 재매핑 없이 기존 카탈로그 범위에서 매핑했다.\n- **독립 교차 검토**: 현재 실행 환경이 Gemini(Antigravity)여서 지침 8번에 따라 Gemini 자체 교차 검토를 수행해 사실관계·근거 표기·ATT&CK 전술-기법 일치·초보용 문장 정확성을 점검했다.\n\n## 출처\n\n- Vates Security Advisory VSA-2026-062 (Xen Orchestra authentication bypass actively exploited) 및 BleepingComputer·The Hacker News·데일리시큐(idxno=209467)\n- SAP November 2026 Security Patch Day (Notes #3778530, #3778556, #3798345, #3849308), Onapsis Research Labs (\"ICM2Shell\"), MITRE CVE API (`CVE-2026-76964`, `CVE-2026-89126`, `CVE-2026-89103`, `CVE-2026-120017`), 보안뉴스(idxno=147171)\n- ConnectWise Security Bulletin & Huntress SOC Advisory (ScreenConnect RMM+ extensions abuse targeting MSPs), BleepingComputer·The Hacker News\n- Ivanti November 2026 Security Advisory (`CVE-2026-121653`, `CVE-2026-121683`, `CVE-2026-105425`), KISA 보안 공지, 데일리시큐(idxno=209472)\n- Fortinet PSIRT November 2026 Advisories 및 MITRE CVE API (`CVE-2026-126170`, `CVE-2026-126253`, `CVE-2026-126262`, `CVE-2026-126260`)\n- BleepingComputer·SecurityAffairs·Container News: A.P. Moller-Maersk legacy system data breach & WhiteArmor extortion claim\n- 과기정통부 보도자료 및 보안뉴스(idxno=147194)·데일리시큐(idxno=209460): GS건설 아파트 커뮤니티 시스템 침해사고 직권조사 결정\n- 섹타나인 개인정보 유출 관련 공지 및 보안뉴스(idxno=147199): SPC그룹 산하 섹타나인 가맹점 관리자 계정 침해 개인정보 유출\n- 보안뉴스(idxno=147181 카카오 톡안녕 보고서, idxno=147183·147209 금융보안원 후속, idxno=147186 과기정통부 콜드체인 보안 점검, idxno=147208 한국소비자원·KISA IP 카메라 보안 점검, idxno=147211 삼양그룹 4사 과징금, idxno=147212 에듀테크 실태점검, idxno=147225 국가 사이버복원력 강화 TF 출범), 데일리시큐(idxno=209448 금융보안원 금감원 수준 권한 확보)\n- MITRE ATT&CK Enterprise v20.1 (https://attack.mitre.org/tactics/enterprise/)\n"},{"path":"일일/2026-11-13.md","title":"일일 보안 이슈 분석 — 2026-11-13","md":"# 일일 보안 이슈 분석 — 2026-11-13\n\n> 수집 기준: 2026-11-12 야간 ~ 11-13 공개·보도분([11-12 보고서](2026-11-12.md) 이후). CISA KEV 카탈로그(2026-11-13 조회 기준 11-10 이후 신규 등재 없음), 벤더·연구기관 1차 보안 공지(Apache Software Foundation·Anthropic·Google Cloud, OpenJS Foundation Node.js, Adobe APSB26-191, Aviatrix Threat Research Center, Apify, SignDrop PoC)와 MITRE CVE 공식 레코드, 국내 기업 공지 및 주요 언론·보안매체(연합뉴스·서울경제·지디넷코리아·이데일리·디지털데일리·보안뉴스·데일리시큐·안랩 ASEC) 원문을 확인했다.\n> 근거 표기: **[확인]** 벤더·정부기관·연구기관이 직접 확인 / 보도 언론 보도 / **[추정]** 본 보고서의 추정 / **[주장]** 공격자 일방 주장. **조치는 본 보고서의 권고**이며 벤더·당국의 공식 지침이 우선한다. 모든 '즉시' 조치는 증거(로그·메모리·디스크·클라우드 감사 기록)를 신속히 보존하되 패치를 미루지 않으며, 침해된 장비·계정에서 새 비밀을 발급하지 않는다.\n> **ATT&CK 버전 점검**: https://attack.mitre.org/tactics/enterprise/ 직접 확인 결과 현재 공식 버전은 **v20.1**(저장소 카탈로그 기준은 v20.0, 작업 지침 문구는 v19.2)이다. 전술 15개(TA0005=Stealth, TA0112=Defense Impairment) 구성은 동일하여 임의 대규모 재매핑 없이 기존 카탈로그 기준으로 매핑했다.\n\n## 1. 오늘의 요약\n\n| # | 이슈 | CVE / 권고 | 유형 | 상태 | 즉시 조치 |\n|---|------|-----------|------|------|-----------|\n| 1 | 삼성SDS 자회사 '멀티캠퍼스' 온라인 교육 플랫폼 해킹 — 고객사 임직원 약 7만 명 이름·사번·부서·직급 등 유출 | — | 기업·공공 위탁 교육 플랫폼 비인가 접근 | [확인] 멀티캠퍼스 고객사 통지·개인정보위 신고 | 수강생·담당자는 안전한 기기에서 비밀번호 변경·세션 무효화, 부서·직급 악용 사칭 피싱 주의 |\n| 2 | KB캐피탈 '자동차 임대자산관리시스템' 해킹으로 고객·임직원·협력사 직원 1,811명 개인·계정정보 유출 | — | 금융사 내부 자산관리 시스템 비인가 조회·유출 | [확인] KB캐피탈 공식 공지·금감원 신고 | 노출된 임직원·협력사 계정 비밀번호·세션 전면 초기화, 차량·렌터카 관련 사칭 연락 주의 |\n| 3 | 탈취된 GitHub 계정 4,837개로 1,806개 저장소 오염 — 가짜 PR로 CI 시크릿 탈취 및 클라우드 IAM 백도어 설치 | — | 개발자 계정·CI/CD 공급망 대량 침해(실제 악용 확인) | [확인] Aviatrix 위협연구센터 발표 | `wfx-docs` 브랜치·커밋 되돌림 이력 헌팅, 시크릿 교체 전 AWS IAM 신뢰 정책·Entra ID(`wfx-ci-`) 백도어 제거 |\n| 4 | Apache HTTP Server `mod_http2` 비인증 원격 코드 실행 결함(CVSS 9.8) 긴급 패치 — 병렬 요청 레이스 컨디션 | CVE-2026-119618 | 웹서버 HTTP/2 모듈 레이스 컨디션 RCE | [확인] Apache 2.4.71 패치 공개(대량 스캔 포착, 침투 미확인) | Apache 2.4.71 이상 즉시 패치(불가 시 `Protocols`에서 `h2`·`h2c` 임시 제거) |\n| 5 | Windows CLFS(`clfs.sys`) 로그 인증 기능을 역이용한 권한 상승 제로데이 'SignDrop' 개념증명(PoC) 공개 | CVE 미부여(미패치 제로데이) | Windows 커널 드라이버 로컬 권한 상승(SYSTEM) | [확인] 보안 연구자 PoC 공개(패치 전·실제 악용 미확인) | 엔드포인트에서 비정상 CLFS 동반 파일·경로 리디렉션 감시 및 비신뢰 로컬 코드 실행 차단 |\n| 6 | Node.js 보안 업데이트(16건): HTTP/2 다른 연결의 응답 메모리 노출 및 파일 다운로드 취소 시 서버 강제 종료 수정 | CVE-2026-123866, -123863, -123875 | 런타임 HTTP/2 메모리 노출(UAF)·서비스 거부(DoS) | [확인] OpenJS Foundation 패치 공개(실제 악용 미확인) | Node.js v26.13.1 / v24.22.3 / v22.23.5 이상 업데이트, 민감 응답 노출 가능성 점검 |\n| 7 | A
