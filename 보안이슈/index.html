te":"서버 이전으로 내부 시스템 노출 시작(추정) 2025년 2월","type":"내부 시스템 노출·권한 부여 결함","actor":"미귀속","region":"전 세계(해외)","evidence":"확인(회사 자체 확인)","easy":"웹사이트 암호화(SSL/TLS)에 쓰이는 디지털 인증서를 발급하는 세계적인 인증기관 DigiCert가, 내부 시스템이 실수로 인터넷에 노출돼 고객 정보와 일부 신원확인문서(운전면허증·여권·공과금 고지서 등)가 유출됐다고 밝혔습니다. 원래 VPN을 통해서만 접근할 수 있어야 했던 이 시스템이 2025년 2월 서버 이전 과정에서 그대로 인터넷에 노출됐고, 여기 있던 \"누구나 계정을 만들 수 있는\" 기능과 권한 부여 결함이 겹쳐, 외부인이 만든 계정으로 보관된 고객 정보를 읽기 전용으로 열람할 수 있었습니다. 다행히 DigiCert가 발급한 인증서 자체나 고객의 로그인 자격 증명은 영향받지 않았다고 밝혔습니다.","todo":"DigiCert에 신원확인문서를 제출한 적이 있는 기업·개인은 회사의 침해 통지를 확인하세요. DigiCert 로그인 자격 증명이나 발급받은 인증서 자체는 안전하다고 발표됐으므로 비밀번호를 바꿀 필요는 없지만, 노출된 신원확인문서(운전면허증·여권 등)가 있다면 명의도용 방지 서비스 가입을 검토하세요.","cls":["A","H"],"s":9429,"e":11916},{"id":"D20261106-govportal","title":"정부 정보공개포털, 주민번호·암 진단서 등 개인정보 노출(비식별 처리 실패)","file":"일일/2026-11-05.md","date":"노출 대상 문서 공개 2024년 이후(점검 대상 기간)","type":"정보 노출(공개 전 비식별 처리 실패, 외부 침입 아님)","actor":"해당 없음","region":"한국","evidence":"확인(행안부 자체 확인·발표)","easy":"중앙행정기관·지방자치단체·공공기관의 결재문서를 누구나 검색·열람할 수 있는 정부의 '정보공개포털'에서, 가려야 할 개인정보가 그대로 노출된 문서들이 발견됐습니다. 철거 보상 문서에 첨부된 주민등록등본 원본(이름·주민등록번호 13자리·주소 그대로), 병가·질병휴직 서류의 암 진단명·질병분류코드·의사 소견, 항공권·여행허가서의 여권번호 등이 가려지지 않은 채 공개돼 있었습니다. 이는 외부 해커의 침입이 아니라, 문서를 공개하기 전에 개인정보를 가리거나 비공개 처리해야 하는 절차가 제대로 작동하지 않은 사고입니다. 특히 스캔·촬영한 이미지 형태의 첨부파일은 기존 필터링 시스템이 걸러내지 못했습니다. 행정안전부는 11월 4일 사실을 확인해 원문 다운로드를 중단했고, 11월 5일 사과했습니다.","todo":"일반 이용자가 지금 당장 할 일은 없습니다. 자신의 결재문서가 공개 대상이었던 공무원이나 민원인이라면, 소속 기관이나 행안부의 통지·안내를 확인하세요.","cls":["E"],"s":12155,"e":14474},{"id":"D20261106-obsoft","title":"국내 의료기관 5곳, 신생 랜섬웨어 조직 '옵소프트' 약 90TB 탈취 주장(검증 안 됨)","file":"일일/2026-11-05.md","date":"다크웹 게시(추정) 2026년 11월 초","type":"랜섬웨어 협박(검증 안 됨)","actor":"옵소프트(OBSOFT, 신규 관측 조직, 다크웹 자체 표기)","region":"한국","evidence":"주장(공격자 다크웹 게시물, 독립 확인 없음)","easy":"새로 등장한 랜섬웨어 조직 '옵소프트(OBSOFT)'가 다크웹에, 국내 의료기관 5곳에서 합쳐서 약 90TB(전체 6건 기준으로는 약 123TB)에 달하는 수술 자료·환자 영상·개인정보를 탈취했다고 주장하는 게시물을 올렸습니다. 보도는 가려진 도메인을 실제 병원 홈페이지와 대조해 안양·구리·의정부·하남 지역의 의료기관일 가능성이 있는 후보를 추정했지만, 이는 추정일 뿐 실제 피해 병원이라는 확인은 아닙니다. 공격자는 협박문에서 24시간 내 연락이 없으면 몸값을 두 배로 올리고 48시간 후 자료를 공개하겠다고 압박했습니다. 다만 해당 병원들의 공식 입장이나, 실제로 병원 시스템이 뚫려 자료가 암호화·탈취됐는지는 아직 확인되지 않았습니다 — 다크웹 주장만 있는 상태입니다.","todo":"해당 지역 의료기관을 이용하는 환자가 지금 당장 할 일은 없습니다(어느 병원인지조차 확인되지 않았습니다). 병원 IT 담당자는 원격접속·관리자 계정 사용 이력, 비정상적인 대용량 외부 전송, 환자정보·의료영상 저장 시스템과 백업의 접근 기록을 지금 점검해 볼 필요가 있습니다.","cls":["J"],"s":14700,"e":16706},{"id":"D20261106-coldchain","title":"프랑스 혈액원 냉장시설까지 공격 확산, FBI·CISA 냉동·냉장 시스템 경보","file":"일일/2026-11-06.md","date":"유럽 슈퍼마켓 1차 공격 2026년 10월(프랑스)","type":"산업용 냉동·냉장 제어시스템(OT) 원격 조작, 설비 공급업체 경유","actor":"미귀속","region":"유럽(해외), 미국 당국 경보는 전 세계 적용 대상","evidence":"확인(EFS·Coolworld 자체 확인, FBI/CISA/HHS/USDA/DOT 공동 권고)","easy":"지난 일일 보고서(11-04)에서 다룬 유럽 슈퍼마켓 냉장고 원격 조작 사건(벨기에·네덜란드 등 115개 이상 매장)에 이어, 11월 2일에는 프랑스 국립 혈액원(EFS)의 혈액 보관 냉장시설 3곳까지 영향을 받았습니다. 직접 공격당한 것은 EFS가 아니라 냉장 설비를 관리해 주는 유럽 업체 Coolworld Rentals였고, 이 회사의 원격 모니터링 소프트웨어가 뚫려 보관실 온도·제상(서리 제거) 설정이 아주 높게 바뀌었습니다. 다행히 혈액 제품 손실이나 건강상 영향은 없었고, 직원들이 제품을 다른 시설로 옮겨 막았습니다. 하루 뒤인 11월 5일, 미국 FBI와 CISA 등 5개 기관은 산업용 냉동·냉장 제어시스템을 겨냥한 공격이 늘고 있다며 공동 경보를 발표했습니다. 다만 미국 당국이 유럽 사건들을 같은 공격자의 소행이라고 공식적으로 연결한 것은 아닙니다.","todo":"대형 유통매장·물류센터·의료기관의 냉동·냉장 설비 담당자는 그 설비의 온도 컨트롤러가 인터넷에서 직접 접근 가능한지 지금 확인하고, 그렇다면 즉시 공용 인터넷에서 분리하거나 접근을 차단하세요. 일반 소비자가 할 일은 없습니다.","cls":["C","A"],"s":1762,"e":4443},{"id":"D20261106-zyxel","title":"Zyxel GS1900 스위치 제로데이, 6월 패치를 우회해 약 1,000대 침해","file":"일일/2026-11-06.md","date":"공격 관측 시작(추정) 2026-08-17","type":"네트워크 장비 웹 관리 인터페이스 결함(실제 악용 확인)","actor":"Kapibala(중국어 사용 위협 행위자, GreyNoise 명명)","region":"전 세계(해외, 48개국 약 996대)","evidence":"확인(벤더·GreyNoise·Binarly 확인)","easy":"중소기업·사무실에서 많이 쓰는 Zyxel GS1900 시리즈 네트워크 스위치(10개 모델)가, 지난 6월에 이미 패치했던 결함을 \"우회\"하는 새로운 제로데이 공격을 받아 48개국에서 약 1,000대가 뚫렸습니다. 공격자('Kapibala'라는 중국어 사용 행위자로 추정)는 인증 없이 특수하게 조작된 웹 요청만으로 장비에 명령을 실행시켜, 설정값과 암호화된 관리자(root) 비밀번호, 네트워크 정보를 빼갔습니다. 연구팀이 분석한 끝에 \"6월 패치로는 막히지 않는\" 새 결함(CVE-2026-107441)이라는 사실이 10월 11일 확인됐고, Zyxel은 10월 22일 이를 막는 새 펌웨어를 배포했습니다.","todo":"Zyxel GS1900 스위치를 쓰는 관리자는 지금 바로 11월 3일 보안 권고에 안내된 최신 펌웨어로 업데이트하세요. 6월에 이미 한 번 업데이트했더라도 이번 결함은 그것으로 막히지 않으므로 다시 확인해야 합니다.","cls":["A"],"s":4829,"e":6928},{"id":"D20261106-dreamhost","title":"호스팅업체 DreamHost, 파일관리자 침해로 FTP·웹메일 자격 증명 유출 확정","file":"일일/2026-11-06.md","date":"침해 시작(추정) 2026년 8월경","type":"호스팅 서비스(File Manager) 소프트웨어 취약점 악용","actor":"미귀속","region":"전 세계(해외)","evidence":"확인(회사 자체 확인)","easy":"미국 웹호스팅 업체 DreamHost의 웹 기반 파일관리자(File Manager) 서버가 약 두 달간 뚫려, 그 사이 이 기능에 로그인한 고객들의 FTP/SFTP 접속정보와 일부 웹메일 세션 정보가 유출됐다고 회사가 확인했습니다. 이 사건은 10월 27일 일일 보고서가 \"증거 불충분으로 미채택\"했던 바로 그 DreamHost 비밀번호 재설정 건의 실체가 이번에 공식적으로 확인된 것입니다 — 당시 회사는 \"예방 조치\"라고만 설명했지만, 이제는 실제 공격자가 소프트웨어 취약점을 악용해 데이터에 접근했다고 인정했습니다. 회사는 컨트롤 패널 로그인 정보와 결제 정보는 접근되지 않았다고 밝혔습니다.","todo":"DreamHost 이용자는 이미 안내받은 FTP/SFTP·이메일 비밀번호 재설정을 아직 하지 않았다면 지금 하세요. 그리고 비밀번호 변경만으로는 부족합니다 — 웹메일 전달 규칙·필터가 공격자에 의해 몰래 추가됐는지 확인하고, 웹사이트 파일이 무단으로 변경되지 않았는지도 점검하세요.","cls":["A"],"s":7148,"e":9417},{"id":"D20261106-hanpass","title":"외국인 대상 핀테크 한패스, API 비인가 접근으로 증명서·개인정보 유출","file":"일일/2026-11-06.md","date":"침해(추정) 2026-11-01 04:38","type":"핀테크(해외송금·외국인 대상 서비스) API 비인가 접근","actor":"미귀속","region":"한국","evidence":"확인(회사 자체 공지)","easy":"외국인 노동자 등을 대상으로 해외송금·선불카드·구인구직 서비스를 제공하는 국내 핀테크 기업 한패스가 해킹당해, 이용자의 소득금액증명·외국인등록 사실증명 같은 증명서 원본과 성명·국적·전화번호·주소 등 개인정보가 유출됐습니다. 공격자는 API(서로 다른 시스템이 데이터를 주고받는 통로)를 통해 비인가 접근을 한 것으로 확인됐지만, 구체적으로 어떤 API 결함을 이용했는지는 아직 공개되지 않았습니다. 얼마나 많은 이용자가 영향받았는지도 아직 공개되지 않았습니다.","todo":"한패스 이용자는 한패스를 사칭한 전화·문자·이메일 피싱에 특히 주의하세요. 노출된 증명서에 소득·외국인등록 정보가 포함돼 있을 수 있으므로, 명의도용이 우려되면 KAIT의 엠세이퍼(M-Safer)나 신용평가기관의 신용조회 차단 서비스 가입을 검토하세요.","cls":["A","J"],"s":9631,"e":11535},{"id":"D20261106-nikke","title":"국산 게임 '니케' PC 런처 공급망 공격, 지갑·비밀번호 탈취 악성코드 유포","file":"일일/2026-11-06.md","date":"도메인 탈취·런처 스크립트 변조 2026-09-27 15:41(KST)","type":"게임 클라이언트 공급망(CDN·도메인) 공격","actor":"미귀속","region":"한국(개발사 시프트업, 서비스사 레벨인피니트, 해외 이용자 포함)","evidence":"확인(회사·연구자 MotherSphere 확인)","easy":"국내 게임사 시프트업이 만들고 레벨인피니트가 서비스하는 모바일·PC 게임 '승리의 여신: 니케'의 PC 런처(게임을 실행해 주는 프로그램)가 공급망 공격을 당해, 정식 런처를 그대로 실행한 이용자도 모르는 사이에 원격조종 악성코드에 감염될 수 있었습니다. 공격자는 9월 27일 게임 서비스가 쓰던 외부 도메인 하나를 탈취해, 런처가 공식 CDN(콘텐츠 전송망)에서 내려받는 스크립트 4개를 변조했습니다. 이 때문에 가짜 설치파일을 내려받지 않고 정식 런처만 실행해도 감염될 수 있었던 것이 특징입니다. 심어진 악성코드('K2F')는 명령 실행, 파일 탐색·다운로드, 화면 캡처는 물론 런처 로그인정보·브라우저 저장 비밀번호·가상자산 지갑 파일까지 수집할 수 있었고, 크롬에 악성 DLL을 심어 런처를 꺼도 계속 실행되도록 했습니다. 회사는 11월 4일 새벽 클라이언트를 수정했고, 11월 5일에는 공식 PC 클라이언트에 자동 검사·제거 기능을 추가했습니다.","todo":"9월 27일 오후 3시 41분 이후 니케 PC 런처를 실행한 적이 있는 Windows 이용자는 지금 바로 공식 보안 공지에 안내된 점검 도구로 감염 여부를 확인하세요. 감염이 확인되면, 해당 PC가 아닌 다른 기기나 안전성이 확인된 PC에서 비밀번호를 변경하고 필요한 인증 수단을 재발급하세요(감염된 PC에서 새 비밀번호를 만들면 그 비밀번호도 바로 다시 유출될 수 있습니다).","cls":["C"],"s":11886,"e":14601},{"id":"D20261110-sshole","title":"'SSHole' OpenSSH 인증 우회(CVE-2026-123158), musl 기반 리눅스 실제 악용","file":"일일/2026-11-07.md","date":"결함 발견·수정판(10.6p2) 출시 2026-11-05","type":"네트워크 노출 서비스(SSH) 인증 우회(실제 악용 확인)","actor":"다수(봇넷·암호화폐 채굴 포함, 단일 조직 아님)","region":"전 세계(해외)","evidence":"확인(OpenSSH 개발자·GreyNoise·Previdian·watchTower 등 다수 연구기관 확인)","easy":"가벼운 리눅스 배포판(Alpine 등)에 쓰이는 'musl'이라는 C 라이브러리와 OpenSSH를 함께 쓰는 서버에서, 비밀번호 로그인을 막아 놓은 계정인데도 아주 긴 비밀번호를 입력하면 뚫리는 결함('SSHole'이라는 이름이 붙음, CVE-2026-123158)이 발견됐습니다. 연구자가 공격 코드를 공개한 지 이틀도 안 돼 실제 공격이 시작됐고, 공격자들은 암호 파일을 훔쳐보거나 자신의 접속키를 몰래 등록해 계속 들어올 수 있게 했습니다. 다행히 지금까지 확인된 실제 성공 사례는 적은 수(한 연구기관 기준 16건)지만, 수정판(10.6p2)이 나온 지 40시간도 안 돼 첫 성공 사례가 나왔다는 점에서 패치를 미루면 위험합니다.","todo":"Alpine Linux 등 musl 기반 리눅스 서버를 관리한다면 지금 바로 OpenSSH를 10.6p2 이상으로 업데이트하거나, 업데이트가 어렵다면 SSH 비밀번호 로그인을 끄고 키(key) 인증만 허용하세요.","cls":["A","B"],"s":1169,"e":3675},{"id":"D20261110-sonicvpn","title":"SonicWall SSL-VPN SAML 인증(MFA) 우회(CVE-2026-19868) 실제 악용","file":"일일/2026-11-07.md","date":"연구자 발견·제보 시점 미공개","type":"VPN 인증 우회(실제 악용 확인)","actor":"미귀속","region":"전 세계(해외, 연방기관 포함)","evidence":"확인(벤더 PSIRT 조사·CISA KEV 등재로 실제 악용 확인)","easy":"많은 기업이 재택근무·원격 접속에 쓰는 SonicWall 방화벽의 SSL-VPN 기능에서, SAML(회사 로그인을 한 번만 하면 여러 서비스에 쓸 수 있게 해 주는 표준 방식) 인증으로 다중 인증(MFA)을 걸어 놨어도, 다른 로그인 방법의 정상 계정 정보만 있으면 그 MFA를 건너뛸 수 있는 결함(CVE-2026-19868)이 발견됐습니다. SonicWall은 실제 악용 정황을 조사했고, 미국 정부(CISA)도 이 결함이 실제 공격에 쓰이고 있다고 확인해 긴급 수정을 요구했습니다. SonicWall은 지난 7월부터 10월까지도 비슷한 제로데이 공격을 반복해서 당해 온 터라, 이번이 네 번째 연속 사고입니다.","todo":"SonicWall SSL-VPN을 SAML 인증(SSO)으로 설정한 조직의 관리자는 지금 바로 SonicOS를 7.3.4-7013(Gen7) 또는 8.2.3-8015(Gen8)로 업그레이드하세요. 이 결함은 우회책이 없어 업그레이드가 유일한 방법입니다.","cls":["A","B"],"s":3955,"e":6163},{"id":"D20261110-irisohyama","title":"생활용품업체 Iris Ohyama, 제3자 클라우드 침해로 770만 명 정보 노출","file":"일일/2026-11-08.md","date":"발견 2026년 10월 말","type":"서드파티 클라우드 노출(경위 미공개)","actor":"미귀속","region":"전 세계(일본, 해외)","evidence":"확인(회사 자체 확인)","easy":"일본의 생활용품 제조·유통업체 아이리스 오야마(Iris Ohyama)가 운영하는 온라인몰 'Iris Plaza'가, 이 회사가 쓰는 외부(제3자) 클라우드 서비스에서 수상한 파일을 발견해 조사한 결과 비인가 접근이 있었다고 확인했습니다. 회원·과거회원·비회원을 포함해 최대 770만 명의 이름·주소·전화번호·이메일·성별·생년월일, 그리고 활동 중인 회원의 암호화된 비밀번호까지 노출 대상에 포함될 수 있습니다. 신용카드 정보는 이 서비스에 보관돼 있지 않아 영향받지 않았습니다. 다만 공격자가 구체적으로 어떤 방법으로 침투했는지는 아직 공개되지 않았습니다.","todo":"Iris Plaza·SIMPLE STYLE 온라인몰 이용자는 지금 비밀번호를 변경하고, 같은 비밀번호를 다른 사이트에서도 쓰고 있었다면 그 비밀번호도 함께 바꾸세요.","cls":["J"],"s":1060,"e":2841},{"id":"D20261110-smtown","title":"SM엔터테인먼트·디어유(버블)·드림메이커, 업무시스템 해킹으로 주민번호·계좌정보 유출","file":"일일/2026-11-08.md","date":"침해(추정) 2026-11-04경","type":"엔터테인먼트 그룹 업무시스템 침해(경위 미공개)","actor":"미귀속","region":"한국","evidence":"확인(SM엔터테인먼트·디어유·드림메이커 자체 확인)","easy":"SM엔터테인먼트와 그 계열사인 팬 플랫폼 '버블' 운영사 디어유, 공연기획사 드림메이커엔터테인먼트가 외부 공격자에게 업무시스템(전자결재 시스템 포함)을 해킹당해 일부 문서 파일이 빠져나갔다고 밝혔습니다. SM엔터테인먼트·드림메이커 쪽에서는 이름·휴대전화번호·주소·계좌번호·주민등록번호·소속사 정보·계약서 내용까지 유출됐고, 디어유 쪽에서는 직원 데이터베이스(성명·생년월일·사번·이메일·부서·직급 등)가 유출됐습니다. 3사 모두 공격자의 접근 경로를 차단하고 유출 가능성이 있는 접근 키를 교체했다고 밝혔지만, 어떤 결함으로 침투당했는지는 아직 공개되지 않았습니다.","todo":"SM엔터테인먼트·디어유(버블)·드림메이커와 계약했거나 소속된 아티스트·스태프·거래처 관계자는 회사나 관계자를 사칭한 전화·문자(계좌변경 요청 등)에 응하지 말고, 공식 채널로만 확인하세요.","cls":["J"],"s":3047,"e":5061},{"id":"D20261110-metaencryptor","title":"랜섬웨어 조직 '메타인크립터', 현대건설 등 국내 기업 4곳 데이터 탈취 주장(검증 안 됨)","file":"일일/2026-11-08.md","date":"다크웹 게시(추정) 2026-11-07","type":"랜섬웨어 협박(검증 안 됨)","actor":"메타인크립터(MetaEncryptor, 다크웹 자체 표기)","region":"한국","evidence":"주장(공격자 다크웹 게시물, 독립 확인 없음)","easy":"랜섬웨어 조직 '메타인크립터'가 다크웹 유출 사이트에 현대건설, 우신시스템, 대원화성, 대아이앤씨 등 한국 기업 4곳의 이름을 올리고 데이터를 탈취했다고 주장했습니다. 다만 공개된 자료 크기를 표시한 곳은 대아이앤씨(100GB, 공격자 주장)뿐이고 나머지는 표시 자체가 없으며, '현대건설' 항목의 설명 문구가 현대자동차그룹 전체를 가리키는 등 신뢰하기 어려운 부분도 있습니다. 어느 회사도 아직 공식적으로 사고를 인정하지 않았고, 실제 침해·암호화·서비스 장애가 있었는지도 확인되지 않았습니다 — 다크웹 주장만 있는 단계입니다.","todo":"해당 4개 기업의 거래처·임직원이 지금 당장 할 일은 없습니다(공식 확인 전). 각 기업의 IT 담당자는 랜섬웨어 침해 지표(비정상 암호화, 대용량 외부 전송 흔적)를 내부적으로 점검해 볼 필요가 있습니다.","cls":["J"],"s":5293,"e":7072},{"id":"D20261110-nable","title":"N-able RMM 플랫폼 N-central, 연구자가 제로데이 30여 건 무단 공개","file":"일일/2026-11-09.md","date":"연구자 공개 2026-11-08 야간","type":"책임 없는 취약점 공개(풀 디스클로저)·RMM(원격 모니터링·관리 도구) 보안","actor":"해당 없음(공격자 아님, 보안연구자 Sean Bales의 공개)","region":"전 세계(해외, MSP·IT팀 대상)","evidence":"확인(N-able 자체 확인: 사고 인지·조치)·주장(연구자 주장: 결함 다수 존재, N-able이 이전 제보를 무시했다는 주장은 미확인)","easy":"여러 기업의 네트워크를 원격으로 관리해 주는 N-able의 RMM(Remote Monitoring and Management, 원격 모니터링·관리) 플랫폼 'N-central'에서, 보안연구자 Sean Bales가 30개 이상의 결함과 그 공격 코드를 N-able에 미리 알리지 않고 한꺼번에 공개했습니다. 가장 위험한 것은 로그인 없이도 가짜 관리자 계정을 만들고 서버에서 명령을 실행할 수 있는 결함입니다. N-able은 다음 날 자사가 직접 운영하는(호스팅) N-central 환경을 전부 오프라인으로 내렸고, 아직 실제 공격으로 이어진 사례는 확인되지 않았다고 밝혔습니다. 연구자는 이전에 다른 결함을 제보했는데 N-able이 무시했다고 주장했지만, N-able은 이 주장에 답하지 않았습니다.","todo":"N-central을 자체 서버(온프레미스)에 설치해 쓰는 조직은 N-able의 안내대로 지금 해당 서버를 종료하거나 외부 접근을 차단하세요. N-able이 직접 운영해 주는(호스팅) 고객은 복구 일정이 아직 없으니 4시간마다 올라오는 공식 공지를 확인하세요.","cls":["A"],"s":1277,"e":3630},{"id":"D20261110-iranfridge","title":"프랑스, 10월 슈퍼마켓 냉동시설 공격을 이란 IRGC 연계 조직에 공식 귀속","file":"일일/2026-11-09.md","date":"공격 실행 2026-10-11~12 야간(프랑스)","type":"산업용 냉동·냉장 제어시스템(OT) 원격 조작·국가 연계 파괴 공격","actor":"Shahid Kaveh(이란 IRGC 전자·사이버센터 연계 조직, 프랑스 정부 귀속)","region":"프랑스(해외)","evidence":"확인(프랑스 정부 사이버위기조정센터 C4·ANSSI·CERT-FR 공식 귀속)","easy":"지난 보고서들이 다뤘던 유럽 슈퍼마켓 냉장고 원격 조작 사건의 '원조'인 2026년 10월 프랑스 슈퍼마켓 공격에 대해, 프랑스 정부가 처음으로 공격 주체를 이란 혁명수비대(IRGC) 산하 전자·사이버센터와 연계된 조직('Shahid Kaveh')으로 공식 지목했습니다. 10월 11~12일 밤사이 까르푸·르클레르·인터마르셰 등 약 700개 매장(기존에 알려졌던 250~350곳보다 두 배 가까이 늘어난 수치)의 산업용 냉동·냉장 컨트롤러가 원격으로 조작돼 해동(제상) 온도로 바뀌면서 화재가 최소 15건 발생하고 수천만 유로 규모의 식품 손실이 났습니다. 다만 프랑스 정부는 11월에 벨기에·네덜란드 등에서 일어난 2차 공격이나, 프랑스 혈액원(EFS) 냉장시설 사건까지 이란 소행이라고 확정하지는 않았습니다 — 이번 귀속은 10월 프랑스 내 공격에만 한정됩니다.","todo":"대형 유통매장·식품·물류 기관의 냉동·냉장 설비 담당자는 그 설비의 온도 컨트롤러가 인터넷에서 직접 접근 가능한지 지금 확인하고, 그렇다면 즉시 분리하세요(이전 보고서([11-06](2026-11-06.md#d20261106-coldchain-프랑스-혈액원-냉장시설까지-공격-확산-fbicisa-냉동냉장-시스템-경보))의 권고와 동일). 일반 소비자가 할 일은 없습니다.","cls":["G","A"],"s":3964,"e":6933},{"id":"D20261110-beget","title":"러시아 호스팅업체 Beget, 데이터 와이퍼 공격으로 전체 인프라 재구축","file":"일일/2026-11-09.md","date":"공격 2026-11-01 야간","type":"파괴형(데이터 와이퍼) 공격","actor":"미귀속(동기·배후 불명)","region":"러시아(해외, 이용자 20만여 명)","evidence":"확인(회사 자체 확인)","easy":"러시아의 대형 웹호스팅·클라우드 업체 Beget가 데이터를 그냥 지워 버리는 파괴형 악성코드(와이퍼)에 공격당해, VPS(가상서버)·S3(클라우드 저장소)·쿠버네티스 데이터와 CDN·IP 설정까지 모두 잃었다고 밝혔습니다. 회사는 데이터가 외부로 빠져나가거나 바뀐 흔적은 없고 \"오직 파괴\"만을 노린 공격으로 보인다고 설명했습니다. 20만 명 이상의 고객(온라인 쇼핑몰·미디어·교육 서비스 포함)이 영향을 받았고, VPS의 이진(바이너리) 백업은 완전히 사라졌으며 파일 백업도 절반 정도만 남아 있어 전체 인프라를 처음부터 다시 구축하고 있습니다.","todo":"국내 이용자가 직접 영향받는 사건은 아닙니다. 다만 비슷한 호스팅·클라우드 서비스를 운영하는 담당자는 관리 시스템 접근 권한을 지금 재검토하고, 네트워크에서 완전히 분리된(오프라인) 백업이 있는지 확인해 보세요 — 온라인으로 연결된 백업은 와이퍼가 함께 지울 수 있습니다.","cls":["G","F"],"s":7184,"e":9215},{"id":"D20261110-sega","title":"SEGA, 뉴스레터 발송업체 ARARA 침해로 구독자 이메일 220만 건 유출","file":"일일/2026-11-09.md","date":"공격(ARARA 추정) 2026년 10월 말 이전","type":"서드파티(이메일 발송 대행사) 공급망 침해","actor":"미귀속","region":"전 세계(일본, 해외)","evidence":"확인(ARARA·SEGA 자체 확인)","easy":"일본 게임사 SEGA가 뉴스레터 발송을 맡겼던 외부 업체 ARARA가 해킹당해, SEGA·SEGA Fave 관련 뉴스레터 11개에 등록된 구독자 220만 명의 이메일 주소가 유출됐습니다. ARARA는 자사가 쓰는 웹서버의 결함 때문이라고 밝혔는데, 이 업체를 쓰는 다른 고객사(MOS버거 750만 명, 쇼치쿠 멀티플렉스 극장 330만 명 등)까지 합치면 노출 규모가 약 7,700만 건에 이릅니다. SEGA는 이름·생년월일·주소·전화번호·신용카드 정보·계정 비밀번호는 영향받지 않았다고 밝혔습니다. 참고로 같은 시기 SEGA Fave의 아케이드 네트워크(ALL.Net·Aime) 서버에서도 별도의 비인가 접근이 있었지만, 회사는 이 사건과는 무관하다고 설명했습니다.","todo":"SEGA·SEGA Fave 관련 뉴스레터 구독자는 신용카드사를 사칭한 피싱 이메일(이미 10월 말부터 700만 건 이상 발송된 것으로 확인됨)에 특히 주의하세요. 비밀번호는 영향받지 않았다고 밝혔으므로 바꿀 필요는 없습니다.","cls":["C"],"s":9474,"e":11746},{"id":"D20261110-rsupport","title":"원격지원 SaaS '리모트콜'(알서포트) 침해, 고객사 상담원·관리자 정보 유출","file":"일일/2026-11-10.md","date":"비정상 징후 발견 2026-10-28","type":"SaaS(원격지원) 벤더 침해(고객사 다수 영향, 경위 조사 중)","actor":"미귀속","region":"한국","evidence":"확인(회사 자체 확인, KISA 신고)","easy":"국내 기업들이 상담센터·원격지원에 쓰는 소프트웨어 회사 알서포트의 서비스 '리모트콜' 운영 사이트가 외부 공격자에게 뚫렸습니다. 내부 개발자 PC에서 이상 징후가 발견돼 조사가 시작됐고, 그 결과 리모트콜을 쓰는 고객사들의 회사명, 고객사 운영관리자 연락처, 상담원 이메일 주소가 유출된 것으로 확인됐습니다. 다행히 지금까지는 최종 소비자(상담을 받은 일반 고객)의 개인정보나 원격지원 중 오간 데이터가 유출된 흔적은 없다고 회사가 밝혔습니다. 다만 공격자가 정확히 어떤 경로로 침투했는지는 아직 조사 중입니다.","todo":"리모트콜을 쓰는 고객사의 운영관리자·상담원은 출처가 불분명한 이메일·문자의 링크나 첨부파일을 지금부터 열지 마세요. 유출된 연락처·이메일을 이용한 표적 피싱(회사 관계자 사칭)이 우려됩니다.","cls":["C","J"],"s":1815,"e":3611},{"id":"D20261110-cryptoexch","title":"가상자산거래소 연쇄 피해(고팍스 협박메일·거래중단, 프라뱅 자산탈취), 금감원 CISO 소집","file":"일일/2026-11-10.md","date":"고팍스 비인가 접근(추정) 2026년 9월 초","type":"가상자산거래소 침해·갈취(경위 대부분 미공개)","actor":"미귀속","region":"한국","evidence":"확인(거래소 자체 공지·금융당국 발표)","easy":"국내 가상자산(암호화폐) 거래소들이 잇따라 피해를 입으면서 금융감독원이 모든 국내 가상자산사업자의 정보보호최고책임자(CISO)를 11월 19일 긴급 소집하기로 했습니다. 거래소 '고팍스'는 9월 초 일부 계정에 비인가 접근이 있어 이용자 7,000명과 임직원 2명의 개인정보가 유출됐는데, 11월 6일에는 공격자로부터 금품을 요구하는 협박 이메일을 받고 모든 입출금·거래를 중단하며 자산을 콜드월렛(인터넷과 분리된 저장장치)으로 옮기고 있습니다. 코인마켓 거래소 '프라뱅'은 약 1억 원 상당의 자산을 탈취당했습니다. (참고로 한 보도에는 '바이낸스가 북한 추정 공격으로 63억 달러를 잃었다'는 내용도 섞여 있었는데, 정작 바이낸스는 해킹 자체를 부인하고 있어 — 서로 다른 보도가 충돌해 이 부분은 이번 보고서에서 제외했습니다.)","todo":"고팍스 이용자는 거래소의 공식 공지를 확인하고 자산 이동(콜드월렛 전환) 상황을 지켜보세요. 프라뱅 이용자는 거래소의 공식 공지를 확인하세요. 두 거래소 모두 사칭 피싱에 특히 주의하세요.","cls":["J"],"s":3930,"e":6299},{"id":"D20261110-gpustack","title":"GPUStack 루프백 헤더 신뢰 인증 우회·원격 코드 실행(CVE-2026-102895) 실제 악용","file":"일일/2026-11-10.md","date":"취약점 공개 2026-11-04","type":"AI·GPU 클러스터 관리 플랫폼 인증 우회 및 원격 코드 실행(실제 악용 확인)","actor":"미귀속","region":"전 세계(해외)","evidence":"확인(벤더 보안 권고·CISA KEV 등재)","easy":"여러 대의 GPU 서버에서 AI 모델을 돌리고 관리하는 오픈소스 플랫폼 'GPUStack'(2.2.0 미만)에서, 외부 요청에 `X-GPUStack-Real-IP: 127.0.0.1`이라는 헤더 한 줄만 붙여 보내면 서버가 이를 \"자기 자신(로컬호스트)이 보낸 요청\"으로 믿고 로그인 없이 관리자 권한을 내주는 결함(CVE-2026-102895)이 실제 공격에 악용되고 있습니다. 관리자 권한을 얻은 공격자는 저장된 클라우드·API 비밀값을 읽거나 추론 백엔드 설정(YAML)을 등록해 서버에서 원하는 명령을 실행할 수 있습니다.","todo":"GPUStack을 운영하는 조직은 지금 바로 2.2.0 이상으로 업데이트하고, 당장 업데이트가 어렵다면 설정에서 `force_auth_localhost=true`를 켜고 리버스 프록시가 외부의 `X-GPUStack-Real-IP` 헤더를 덮어쓰거나 차단하도록 조치하세요.","cls":["A","H"],"s":6560,"e":8330},{"id":"D20261110-freeswitch","title":"SignalWire FreeSWITCH SIP MESSAGE API 명령 실행(CVE-2026-116779) 실제 악용","file":"일일/2026-11-10.md","date":"취약점 공개 2026-11-05","type":"오픈소스 통신(VoIP/SIP) 플랫폼 원격 코드 실행(실제 악용 확인)","actor":"미귀속","region":"전 세계(해외)","evidence":"확인(벤더 보안 권고·CISA KEV 등재)","easy":"인터넷 전화(VoIP)·고객센터 시스템에 널리 쓰이는 오픈소스 통신 플랫폼 'FreeSWITCH'(1.11.3 미만)에서, 공격자가 수신자 주소(`To`)에 `api+명령어` 형식을 넣은 SIP 문자 메시지(MESSAGE)를 보내면 FreeSWITCH 내부 API와 운영체제 명령이 그대로 실행되는 결함(CVE-2026-116779)이 발견돼 실제 공격에 악용되고 있습니다. SIP 메시지 수락이 열려 있는 프로파일에서는 로그인 없이도 공격이 성립할 수 있습니다.","todo":"FreeSWITCH를 운영하는 관리자는 지금 바로 1.11.3 이상으로 업데이트하고, 비인증 SIP 프로파일에서 외부 SIP MESSAGE를 처리하지 않도록 접근 통제(ACL)를 점검하세요.","cls":["A"],"s":8598,"e":10186},{"id":"D20261110-faspex","title":"IBM Aspera Faspex 인가 우회 관리자 권한 획득(CVE-2026-123218) 실제 악용","file":"일일/2026-11-10.md","date":"취약점 공개 2026-11-07","type":"대용량 파일 전송 솔루션 권한 상승(실제 악용 확인)","actor":"미귀속","region":"전 세계(해외)","evidence":"확인(IBM 보안 권고·CISA KEV 등재)","easy":"기업들이 대용량 파일을 주고받을 때 쓰는 IBM Aspera Faspex(5.0.0~5.0.19)에서, 일반 권한을 가진 사용자가 특수하게 조작된 메시지를 보내 인가(권한) 검사를 우회하고 전체 관리자 권한을 얻을 수 있는 결함(CVE-2026-123218)이 실제 공격에 악용되고 있습니다.","todo":"IBM Aspera Faspex 5.0.x를 운영하는 조직은 IBM 보안 권고에 따라 5.0.19 패치(5.0.19.1 이상)를 즉시 적용하고, 최근 생성되거나 관리자 권한으로 승격된 계정이 있는지 전수 점검하세요.","cls":["A","H"],"s":10430,"e":11760},{"id":"D20261111-fsec","title":"금융보안원 '정보보호 상시평가 지원시스템' 해킹, 행정서식·담당자 정보 유출","file":"일일/2026-11-11.md","date":"비정상 접근·인지 2026-11-09 15:00경","type":"금융보안 전담기관 평가 지원 시스템 침해(경위 조사 중)","actor":"미귀속","region":"한국","evidence":"확인(금융보안원 공식 확인, 금융위·KISA 신고)","easy":"은행·증권사 등 금융권의 보안 관제와 평가를 담당하는 전문기관인 '금융보안원'이 운영하는 '정보보호 상시평가 지원시스템'이 외부 해킹 공격을 받아 일부 자료가 유출됐습니다. 금융보안원에 따르면 유출된 자료는 개인신용정보 동의서 샘플 등 행정서식 약 200건과 그 안에 적힌 이름·생년월일 등 개인정보 300여 건, 그리고 마스킹(가림) 처리된 금융사 평가 담당 직원들의 시스템 이용자 정보 350여 건입니다. 다행히 일반 금융 소비자의 계좌·신용정보나 금융사 시스템 구성도 같은 핵심 보안 자료는 이 시스템에 보관되지 않아 유출되지 않았다고 밝혔지만, 금융권 보안을 감독·지원하는 기관 자체가 뚫렸다는 점에서 파장이 큽니다.","todo":"금융보안원 상시평가 시스템을 이용한 금융사 담당자는 유출된 연락처·이메일을 노린 금융당국·금융보안원 사칭 피싱 연락에 각별히 주의하세요. 해당 시스템과 같은 비밀번호를 다른 업무 사이트에서 쓰고 있다면 안전한 기기에서 비밀번호를 바꾸고 기존 로그인 세션을 초기화하세요.","cls":["J"],"s":2214,"e":4705},{"id":"D20261111-daeguro","title":"대구시 공공배달앱 '대구로'(인성데이타) 해킹, 가맹점주 계좌 2.5만 개·직원 계정 유출","file":"일일/2026-11-11.md","date":"외부 침입 발생 2026-10-31","type":"지역 공공배달 플랫폼 서버 침해(경위 수사 중)","actor":"미귀속","region":"한국","evidence":"확인(대구시·인성데이타 확인, 경찰·KISA 신고)","easy":"대구시의 공공배달앱 '대구로'(운영사 인성데이타) 서버가 외부 해킹을 당해, 폐업 점주를 포함한 가맹점주의 정산용 계좌번호 약 2만 5,000개(예금주 이름 포함)와 운영사 전·현직 직원 250여 명의 내부 시스템 접속 아이디·비밀번호가 유출됐습니다. 일반 배달앱 이용자(누적 회원 74만 명)의 개인정보나 가맹점주의 실제 출금 금전 피해는 없는 것으로 파악됐지만, 점주 계좌번호와 직원 접속 계정이 함께 빠져나갔다는 점에서 추가 침투나 사칭 사기 위험이 있습니다.","todo":"'대구로' 가맹점주는 정산 계좌의 이상 거래 여부를 확인하고 대구로·배달대행사를 사칭한 계좌 변경·수수료 안내 연락에 속지 마세요. 인성데이타 전·현직 직원은 안전한 기기에서 내부 시스템 비밀번호와 같은 비밀번호를 쓰는 다른 사이트 비밀번호를 모두 바꾸고, 기존 로그인 세션·토큰도 전부 로그아웃(무효화)하세요.","cls":["J"],"s":4983,"e":6941},{"id":"D20261111-chrome","title":"Google Chrome XML 파서 UAF 제로데이(CVE-2026-125350) 실제 악용","file":"일일/2026-11-11.md","date":"Google 보안 권고·긴급 패치 2026-11-10","type":"웹 브라우저 메모리 결함(Use-After-Free, 실제 악용 확인)","actor":"미귀속","region":"전 세계(해외)","evidence":"확인(Google 보안 권고·CISA KEV 등재)","easy":"전 세계에서 가장 많이 쓰이는 웹 브라우저 구글 크롬(Google Chrome)에서, 조작된 웹페이지를 열기만 해도 브라우저 안에서 공격자의 코드가 실행될 수 있는 심각한 메모리 결함(CVE-2026-125350)이 실제 공격에 쓰이고 있는 것으로 확인됐습니다. 구글이 올해 들어 여덟 번째로 긴급 패치한 크롬 제로데이 결함입니다. 크롬과 같은 엔진(Chromium)을 쓰는 마이크로소프트 엣지(Edge), 브레이브(Brave), 오페라(Opera) 등 다른 브라우저도 영향을 받습니다.","todo":"지금 바로 크롬(또는 엣지 등 Chromium 계열 브라우저) 오른쪽 위 메뉴의 '도움말 → Chrome 정보'를 열어 최신 버전(Windows·macOS 157.0.8103.50/.51, Linux 157.0.8103.50 이상 — 당시 기준)으로 업데이트하고, **반드시 브라우저를 완전히 껐다가 다시 켜세요**(재시작해야 패치가 적용됩니다).","cls":["I"],"s":7206,"e":9222},{"id":"D20261111-outlook","title":"Microsoft 11월 정기 패치(1,235건) 및 Outlook NTLM 해시 노출 제로데이(CVE-2026-124194) 실제 악용","file":"일일/2026-11-11.md","date":"Microsoft 정기 패치·공개 2026-11-10","type":"이메일 클라이언트 스푸핑·강제 인증 취약점(실제 악용 확인)","actor":"미귀속","region":"전 세계(해외)","evidence":"확인(Microsoft 보안 권고·CISA KEV 등재)","easy":"마이크로소프트가 11월 정기 보안 업데이트(Patch Tuesday)를 통해 무려 1,235개의 보안 결함을 한꺼번에 고쳤는데, 그중 이메일 프로그램 아웃룩(Microsoft Outlook)의 결함 1건(CVE-2026-124194)은 이미 실제 해킹 공격에 쓰이고 있는 제로데이였습니다. 공격자가 보낸 특수 조작 메시지 파일(첨부파일 등)을 사용자가 아웃룩에서 열면, 평소 뜨던 '외부 콘텐츠 연결 경고창'도 없이 아웃룩이 공격자 서버로 몰래 접속하면서 사용자의 윈도우 로그인 암호 정보(NTLMv2 해시)를 넘겨주게 됩니다.","todo":"윈도우와 마이크로소프트 오피스(아웃룩)의 2026년 11월 정기 보안 업데이트를 지금 바로 설치하세요. 패치 전까지는 출처가 불분명한 이메일이나 첨부된 메시지 파일을 열지 마세요.","cls":["I","B"],"s":9509,"e":11669},{"id":"D20261111-barracuda","title":"바라쿠다 ESG·다수 보안장비 root 원격 코드 실행 체인(CVE-2026-116606·111560), 패치 일주일 만에 실제 악용","file":"일일/2026-11-11.md","date":"취약점 공개·패치 2026-11-02~03","type":"보안장비 인증 우회 및 OS 명령 삽입 체인(실제 악용 확인)","actor":"미귀속","region":"전 세계(해외)","evidence":"확인(Barracuda 보안 공지·CISA KEV 등재)","easy":"지난주 패치가 나왔던 바라쿠다(Barracuda Networks) 이메일 보안 장비(ESG) 등의 치명적 결함 2건(CVE-2026-116606, CVE-2026-111560)이 패치 공개 일주일 만에 실제 해킹 공격에 악용되고 있는 것으로 확인됐습니다. 공격자는 인터넷에 열려 있는 장비 관리 화면에 로그인도 하지 않고 조작된 백업 설정 파일을 밀어 넣은 뒤(인증 우회), 시간대(timezone) 설정 칸에 운영체제 명령어를 심어 최고 관리자(root) 권한으로 실행시켰습니다. 미국 정부(CISA)는 사태가 시급하다고 보고 단 3일(11월 13일까지)의 긴급 패치 기한을 부여했습니다.","todo":"바라쿠다 이메일 보안 게이트웨이(ESG) 및 관련 장비(ADC, BMA, WAF, WSG) 운영자는 **지금 당장 관리 화면(Admin UI)이 인터넷에서 보이지 않게 차단**하고, 로그·설정 증거를 보존한 뒤 최신 펌웨어(ESG 9.4.0.030 등)로 업데이트하세요. 이미 공격받았을 가능성이 있다면 패치만 하지 말고 장비의 인증서·비밀번호·연동 키를 모두 새 장비 기준으로 교체하세요.","cls":["A"],"s":11961,"e":14686},{"id":"D20261111-broadworks","title":"Cisco BroadWorks XXE 설정 유출(CVE-2026-20320) 및 Openwave 문서 변환 제한 우회(CVE-2026-111793) 실제 악용","file":"일일/2026-11-11.md","date":"BroadWorks 공개 2026-08-19","type":"통신·메시징 미들웨어 취약점(실제 악용 확인)","actor":"미귀속","region":"전 세계(해외)","evidence":"확인(Cisco·Openwave·CISA KEV 등재)","easy":"통신사·대기업의 인터넷 전화·클라우드 통화 서비스에 쓰이는 '시스코 브로드웍스(Cisco BroadWorks)'와 이메일 미디어 변환 솔루션 '오픈웨이브(Openwave Webtop Media Transcoder)'의 결함이 실제 해킹 공격에 쓰이고 있는 것으로 확인돼 미국 CISA의 긴급 패치 목록(KEV)에 나란히 올랐습니다. 브로드웍스 결함(CVE-2026-20320)은 로그인 없이도 조작된 XML 메시지를 보내 서버 안의 민감한 설정 파일을 읽어갈 수 있게 하고, 오픈웨이브 결함(CVE-2026-111793)은 웹메일 화면을 우회해 원래 관리자가 막아 놓은 종류의 문서 파일까지 서버가 강제로 변환·처리하게 만듭니다.","todo":"Cisco BroadWorks 또는 Openwave Webtop Media Transcoder를 운영하는 통신사·기업 관리자는 벤더의 보안 패치를 즉시 적용하고, 브로드웍스의 프로비저닝 인터페이스(OCI-P)가 외부 인터넷에 노출돼 있지 않은지 점검하세요. 이미 설정 파일이 노출됐을 가능성이 있다면 설정 안에 적힌 연동 비밀번호·키를 모두 교체하세요.","cls":["A"],"s":15002,"e":17629},{"id":"D20261112-gsconst","title":"GS건설 아파트('자이') 커뮤니티 시스템 침해, 입주민 정보·RF카드번호 등 15개 항목 유출 가능성 및 정부 첫 직권조사","file":"일일/2026-11-12.md","date":"비인가 접근 확인 2026-10-28 22:15경","type":"아파트 커뮤니티 예약·관리 시스템 비인가 접근(경위 직권조사 중)","actor":"미귀속","region":"한국","evidence":"확인(GS건설 신고·공지, 과기정통부 직권조사 발표)","easy":"GS건설이 운영하는 아파트('자이' 등) 커뮤니티 시설 예약·관리 시스템에 외부 해커가 몰래 접근해, 입주민의 이름·생년월일·휴대전화번호·주소·세대주 여부·암호화된 비밀번호·관리자 ID·출입용 RF카드번호 등 최대 15개 항목이 유출됐을 가능성이 확인됐습니다. GS건설이 침해 신고 후 자체 원인 분석을 이유로 정부(과기정통부·KISA)의 기술지원 조사에 동의하지 않자, 과기정통부는 올해 10월 새로 시행된 개정 정보통신망법에 따라 '침해사고 조사 심의위원회'를 열어 법 시행 후 첫 번째 정부 직권조사를 결정했습니다.","todo":"해당 아파트 커뮤니티 앱·웹사이트를 이용하는 입주민과 관리자는 안전한 기기에서 비밀번호를 즉시 바꾸고(같은 비밀번호를 쓰는 다른 사이트도 함께 변경), 기존 로그인 세션을 모두 로그아웃하세요. 단지 관리사무소나 건설사를 사칭해 출입카드 재발급·관리비 정산을 유도하는 문자·전화에 속지 마세요.","cls":["J"],"s":2730,"e":5203},{"id":"D20261112-secta9ine","title":"SPC그룹 계열사 '섹타나인'(해피포인트 운영사), 가맹점 관리자 계정 침해로 고객명·마스킹 카드번호 등 추가 유출 확인","file":"일일/2026-11-12.md","date":"비정상 접근 발생 2026-11-06 10:00경","type":"가맹점 관리자 계정 침해 및 지급대행·결제 고객 정보 유출","actor":"미귀속","region":"한국","evidence":"확인(섹타나인 공식 공지)","easy":"해피포인트 운영사이자 SPC그룹의 IT·마케팅 계열사인 '섹타나인(Secta9ine)'에서 가맹점 관리자 계정이 해킹당해 고객 개인정보가 유출된 사실이 확인됐습니다. 회사는 지난 11월 8일 지급대행서비스 이용 고객의 이름·휴대전화번호·계좌번호 유출 의심 정황을 1차로 알렸는데, 추가 조사를 거쳐 11월 12일에는 구매자 이름과 일부가 가려진(마스킹된) 카드번호, 카드사 정보까지 유출된 사실을 새로 확인했다고 발표했습니다. 카드 비밀번호나 CVC 같은 결제 인증정보는 유출되지 않았다고 밝혔지만, 계좌·결제 내역을 미끼로 한 사칭 피싱 위험이 있습니다.","todo":"섹타나인 가맹점 관리자 시스템을 쓰는 점주·담당자는 감염되지 않은 안전한 기기에서 관리자 비밀번호를 즉시 바꾸고 기존 로그인 세션을 모두 로그아웃(무효화)하세요. 일반 이용자와 가맹점주는 결제 취소·환불·정산 계좌 변경을 명목으로 비밀번호나 인증번호를 요구하는 연락에 응하지 마세요.","cls":["B","J"],"s":5467,"e":7851},{"id":"D20261112-xenorchestra","title":"가상화 관리 도구 Xen Orchestra 인증 우회(VSA-2026-062) 실제 악용 — 빈 JSON 쿠키 하나로 하이퍼바이저 root 장악","file":"일일/2026-11-12.md","date":"Vates 긴급 보안 권고(VSA-2026-062)·패치 공개 2026-11-10","type":"가상화 관리 콘솔 인증 우회 및 하이퍼바이저 장악(실제 악용 확인)","actor":"미귀속","region":"전 세계(해외)","evidence":"확인(Vates 공식 보안 권고·보안 연구진 관측)","easy":"기업들이 여러 대의 가상 서버(가상머신)를 한꺼번에 관리할 때 쓰는 웹 도구 '젠 오케스트라(Xen Orchestra)'에서, 아이디나 비밀번호를 전혀 몰라도 로그인 과정을 통째로 건너뛸 수 있는 치명적인 결함(VSA-2026-062)이 실제 해킹 공격에 악용됐습니다. 공격자가 쿠키 값에 '빈 괄호(`j:{}`)' 하나만 넣어서 보내면, 프로그램이 이를 제대로 검사하지 않고 데이터베이스 맨 첫 줄에 있는 토큰(보통 최고 관리자 계정)을 그대로 꺼내 줘서 곧바로 관리자 권한을 얻게 됩니다. 이를 통해 공격자는 관리 도구뿐 아니라 그 아래 연결된 물리 가상화 서버(XCP-ng 하이퍼바이저) 전체의 최고 권한(root)까지 장악했습니다.","todo":"Xen Orchestra 또는 Xen Orchestra Appliance(XOA)를 운영하는 관리자는 **지금 즉시 관리 웹 화면이 외부 인터넷에서 접속되지 않도록 방화벽으로 차단**하고, 네트워크 패킷·호스트 로그를 보존한 뒤 수정 버전(안정 채널 6.9.2, 최신 채널 6.10.1 이상 — 당시 기준)으로 업데이트하세요. 이 공격은 일반 관리 로그에 흔적이 안 남으므로, 인터넷에 한 번이라도 열려 있었다면 관리자 토큰·연동 비밀번호를 전부 바꾸고 서버에 낯선 가상머신(`pivot2`)이나 예약 작업(`/etc/cron.d/zz-ustar`)이 없는지 반드시 확인하세요.","cls":["A","H"],"s":8143,"e":11647},{"id":"D20261112-sap-icm2shell","title":"SAP 11월 정기 패치: 'ICM2Shell'(CVE-2026-76964·89126) 등 비인증 원격 CVSS 10.0 만점 결함 4건 동시 수정","file":"일일/2026-11-12.md","date":"SAP 정기 보안 패치·Onapsis·RedRays 기술 공개 2026-11-10~11","type":"엔터프라이즈 ERP 커널·웹 디스패처·게이트웨이·SAML 치명적 취약점(CVSS 10.0 4건)","actor":"— (실제 악용 미확인)","region":"전 세계(해외)","evidence":"확인(SAP Security Notes·Onapsis·MITRE CVE 확인)","easy":"대기업의 회계·인사·생산 등 핵심 업무를 담당하는 SAP 시스템에서, 위험도 최고 점수(CVSS 10.0 만점)짜리 치명적 보안 결함이 한 달에 무려 4건이나 동시에 발표돼 긴급 패치가 나왔습니다. 4건 모두 해커가 아이디·비밀번호 없이, 그리고 직원이 아무런 버튼을 누르지 않아도 원격에서 악용할 수 있습니다. 특히 'ICM2Shell'로 명명된 2건(CVE-2026-76964, CVE-2026-89126)은 외부 웹 접속을 받아 주는 길목(인터넷 통신 관리자와 웹 디스패처)에 기본으로 켜져 있는 웹소켓 통신 결함이어서, 조작된 신호만 보내면 곧바로 서버 운영체제 명령어를 실행하고 SAP 시스템 전체를 장악할 수 있습니다.","todo":"SAP NetWeaver AS ABAP 및 SAP Web Dispatcher를 운영하는 기업은 SAP가 배포한 2026년 11월 보안 패치(Note #3778530, #3778556, #3798345, #3849308)를 최우선으로 적용하세요. 이때 내부 커널만 고치고 바깥쪽 **웹 디스패처(Web Dispatcher) 업데이트를 하나라도 빠뜨리면 구멍이 그대로 남으므로** 모든 웹 디스패처를 빠짐없이 함께 업데이트하고, 만약 침해가 의심된다면 패치만으로는 이미 발급된 세션·토큰이 사라지지 않으므로 안전한 환경에서 기존 세션을 무효화하세요.","cls":["A","H"],"s":11983,"e":15554},{"id":"D20261112-screenconnect-msp","title":"ConnectWise ScreenConnect MSP 표적 캠페인 — 서드파티 확장(RMM+ 계열) 악용으로 클라우드 파트너 400여 곳 긴급 차단","file":"일일/2026-11-12.md","date":"ConnectWise·Huntress 경고 및 확장 강제 비활성화 2026-11-10~11","type":"원격 관리 도구(ScreenConnect) 패널 및 서드파티 확장 악용 공급망·연쇄 침해","actor":"미귀속","region":"전 세계(해외)","evidence":"확인(ConnectWise 공식 공지·Huntress SOC 분석)","easy":"여러 고객사의 PC와 서버를 원격으로 관리해 주는 IT 관리업체(MSP)들이 쓰는 원격 제어 도구 '커넥트와이즈 스크린커넥트(ConnectWise ScreenConnect)' 환경을 노린 실제 해킹 캠페인이 포착됐습니다. 공격자는 스크린커넥트 자체의 결함이 아니라, 탈취한 계정·세션으로 관리 화면에 들어간 뒤 원격 명령 실행 기능을 가진 제3자 부가기능(RMM+ 계열 확장 프로그램 5종)을 악용해 하위 고객사 컴퓨터 수백 대에 공격자가 조종하는 '가짜 스크린커넥트 프로그램'을 몰래 추가로 깔았습니다. 더 위험한 것은, 관리업체 직원이 감염된 고객 컴퓨터를 고치려고 원격 접속하는 순간 거꾸로 직원 컴퓨터의 로그인 토큰이 털려 다른 고객사 관리 화면까지 연쇄 감염될 수 있다는 점입니다.","todo":"ScreenConnect를 운영하는 MSP 및 기업 관리자는 서드파티 확장 프로그램 5종(**RMM+, RMM Plus, RMM Plus Password Link, RMM+ Password Link, Labtech Plus**)이 설치돼 있다면 즉시 비활성화·제거하세요(클라우드 버전은 ConnectWise가 약 400곳에서 강제 차단함). 또한 고객사 엔드포인트에 우리 회사가 아닌 낯선 서버 주소로 연결되는 ScreenConnect 클라이언트가 추가로 깔려 있지 않은지 전수 점검하세요.","cls":["C","B"],"s":15857,"e":19307},{"id":"D20261112-ivanti-fortinet","title":"Ivanti EPM 비인증 SQL 삽입 RCE(CVE-2026-121653) 및 Fortinet FortiManager·FortiOS 치명적 결함(CVE-2026-126170·126253) 동시 패치","file":"일일/2026-11-12.md","date":"Ivanti 보안 공지 2026-11-10(KISA 보안 권고 11-11)","type":"엔드포인트·방화벽 중앙 관리 서버 및 네트워크 OS 치명적 취약점","actor":"— (실제 악용 미확인)","region":"전 세계(해외)","evidence":"확인(Ivanti·Fortinet 보안 권고, MITRE CVE, KISA 권고)","easy":"기업 내부의 모든 PC·서버를 관리하는 '이반티 엔드포인트 매니저(Ivanti EPM)'와 회사 방화벽들을 중앙에서 통합 제어하는 '포티매니저(Fortinet FortiManager)' 및 방화벽 운영체제 '포티OS(FortiOS)'에서, 공격자가 로그인도 하지 않고 원격에서 명령어를 실행하거나 통신 경로를 조작할 수 있는 치명적인 결함들이 잇따라 발표돼 패치가 나왔습니다. 아직 실제 해킹 공격에 쓰인 사례는 보고되지 않았지만, 이반티와 포티넷 장비는 해커들이 패치가 나오자마자 가장 먼저 노리는 단골 표적이어서 서둘러 업데이트해야 합니다.","todo":"Ivanti EPM·CSA·EPMM·Sentry 또는 Fortinet FortiManager·FortiAnalyzer·FortiOS를 운영하는 기관·기업은 **관리 인터페이스와 연동 포트(JSON API·OFTP 등)가 외부 인터넷에 노출돼 있지 않은지 즉시 확인해 차단**하고, 각 벤더가 배포한 최신 보안 패치를 바로 적용하세요. 이미 비정상 접근이 의심되는 장비는 패치만 하지 말고 안전한 기기에서 연동 인증서·비밀번호·세션을 모두 재발급하세요.","cls":["A","H"],"s":19670,"e":23237},{"id":"D20261112-maersk","title":"해운·물류 대기업 머스크(Maersk), 인수 법인(LF Logistics) 레거시 시스템 침해 확인 — 공격자는 100GB·500만 달러 주장","file":"일일/2026-11-12.md","date":"공격자 다크웹 게시 및 Maersk 공식 확인·보도 2026-11-10~11","type":"인수 법인 로컬 레거시 시스템 비인가 접근·데이터 추출 및 협박","actor":"WhiteArmor(자칭 랜섬웨어·협박 조직)","region":"전 세계(해외)","evidence":"확인(Maersk 로컬 레거시 시스템 침해·데이터 추출 확인) / 주장(공격자의 100GB 탈취·500만 달러 요구 및 세부 항목)","easy":"세계적인 해운·물류 대기업 '머스크(A.P. Moller-Maersk)'가 과거 다른 회사를 인수하면서 물려받은 지역의 옛날 전산 시스템(레거시 시스템)에 해커가 침입해 데이터를 빼간 사실을 공식 확인했습니다. '화이트아머(WhiteArmor)'라는 해킹 조직은 자신들이 운전기사 정보와 최고관리자 계정, 창고 재고 기록 등 100GB 분량의 자료를 훔쳤다며 500만 달러(약 70억 원)의 몸값을 요구하고 있습니다. 머스크 측은 침입이 있었던 사실은 인정하면서도, 문제의 시스템은 본사 핵심 물류망과 분리된 옛 시스템이어서 화물 예약·운송 서비스에는 아무 지장이 없고 민감한 정보 노출도 없는 것으로 파악됐다고 밝혔습니다.","todo":"기업 인수·합병(M&A)을 진행했거나 자회사·해외 지사를 둔 기업 보안 담당자는 본사 표준 보안 체계에 아직 편입되지 않은 채 돌아가고 있는 '인수 법인의 옛날 서버(레거시 시스템)'가 인터넷에 열려 있지 않은지 전수 점검하세요. 침해가 의심되는 레거시 서버가 있다면 즉시 망에서 격리하고, 감염된 서버가 아닌 안전한 기기에서 관리자 비밀번호·연동 키·세션을 모두 폐기·재발급하세요.","cls":["C","J"],"s":23563,"e":26048},{"id":"D20261113-multicampus","title":"삼성SDS 자회사 '멀티캠퍼스' 온라인 교육 플랫폼 해킹 — 고객사 임직원 약 7만 명 이름·사번·부서·직급 등 유출","file":"일일/2026-11-13.md","date":"비인가 접근 발생 2026-11-09","type":"기업·공공 위탁 온라인 교육 플랫폼 비인가 접근 및 임직원 정보 유출","actor":"미귀속","region":"한국","evidence":"확인(멀티캠퍼스 고객사 통지·개인정보위 신고, 데일리시큐·비즈중앙 보도)","easy":"삼성SDS의 자회사이자 주요 대기업·시중은행·공공기관 임직원 교육을 위탁받아 운영하는 '멀티캠퍼스'의 온라인 교육 사이트('러닝플랫폼')가 해킹당해 수강생 약 7만 명의 개인정보가 유출됐습니다. 유출된 정보에는 이름·전화번호·이메일뿐 아니라 소속 부서명·사번·아이디·직급·직위 같은 회사 내부 인사 정보까지 포함돼 있어, 해커가 실제 직장 상사나 인사팀을 정교하게 사칭해 보이스피싱이나 악성 메일 공격(스피어 피싱)을 시도할 위험이 큽니다.","todo":"멀티캠퍼스 러닝플랫폼을 이용하는 기업·기관 임직원은 감염되지 않은 안전한 기기에서 교육 사이트 비밀번호와 같은 비밀번호를 쓰는 사내·외부 계정 비밀번호를 즉시 바꾸고, 기존 로그인 세션을 모두 로그아웃(무효화)하세요. 내 사번·부서·직급을 정확히 대면서 \"인사팀·교육담당자입니다\" 또는 \"부서장인데 급히 처리할 일이 있다\"고 연락해 오는 문자·메일·메신저는 반드시 사내 내선 전화 등 별도 통로로 진짜 본인인지 먼저 확인하세요.","cls":["J","C"],"s":3050,"e":5579},{"id":"D20261113-kbcapital","title":"KB캐피탈 '자동차 임대자산관리시스템' 해킹으로 고객·임직원·협력사 직원 1,811명 개인·계정정보 유출","file":"일일/2026-11-13.md","date":"비정상 조회 탐지·차단 및 금감원 신고 2026-11-10","type":"금융사 내부 업무용 시스템(자동차 임대자산관리시스템) 해킹 및 개인·계정정보 유출","actor":"미귀속(국내 IP 경유 조회 확인)","region":"한국","evidence":"확인(KB캐피탈 공식 공지·금감원 신고, 연합뉴스·서울경제 보도)","easy":"KB금융그룹 계열 여신전문금융사인 'KB캐피탈'에서 직원들이 차량 임대 업무에 쓰는 '자동차 임대자산관리시스템'이 해킹당해 총 1,811명의 개인정보가 유출됐습니다. 유출 대상은 차량 임대·탁송 관련 일반 고객 20명(이름·생년월일·휴대전화번호·주소·차량번호)과 KB캐피탈 임직원 및 협력사 직원 1,791명(사용자 계정·이름·휴대전화번호·부서명·회사명·직함 등)입니다. 회사 측은 대출·결제 같은 핵심 금융거래 시스템과는 무관하다고 밝혔지만, 임직원과 협력사 직원의 계정·조직 정보가 대거 포함돼 추가 침투 시도에 대비해야 합니다.","todo":"유출 대상인 KB캐피탈 임직원·협력사 직원은 감염되지 않은 안전한 기기에서 해당 시스템 및 사내 업무 계정의 비밀번호를 즉시 변경하고 기존 로그인 세션을 모두 초기화하세요. 일반 고객(20명)은 본인의 차량번호·주소를 언급하며 렌터카 점검·탁송·보험 처리를 빙자해 금융정보나 인증번호를 요구하는 연락에 속지 마세요.","cls":["J"],"s":5877,"e":8433},{"id":"D20261113-github-ci","title":"탈취된 GitHub 계정 4,837개로 1,806개 저장소 오염 — 가짜 PR(`docs: dependency audit notes`)로 CI 시크릿 탈취 및 클라우드 IAM 백도어 설치","file":"일일/2026-11-13.md","date":"캠페인 시작 2026-11-11","type":"개발자 계정 및 CI/CD 파이프라인 대규모 공급망 침해(실제 악용 확인)","actor":"미귀속(지난 10월 GhostAction 캠페인 피해 계정과 일부 중첩)","region":"전 세계(해외)","evidence":"확인(Aviatrix Threat Research Center 분석·The Hacker News 보도)","easy":"해커가 이미 훔쳐 둔 깃허브(GitHub) 개발자 계정 4,837개를 동원해, 전 세계 6만 개가 넘는 오픈소스·기업 코드 저장소에 '문서 점검 메모(`docs: dependency audit notes`)'라는 제목의 시험용 수정 요청(PR)을 자동으로 보내 어느 저장소를 마음대로 고칠 수 있는지 훑었습니다. 그중 수정 권한이 확인된 1,806개 이상의 저장소에 악성 자동화 작업(GitHub Actions)을 몰래 심어 클라우드(AWS·Azure·GCP) 접속 열쇠와 비밀 토큰을 싹쓸이한 뒤, 심지어 피해 회사가 나중에 비밀번호를 바꿔도 계속 들어올 수 있도록 클라우드의 '신뢰 정책(IAM)'까지 몰래 고쳐 놓았습니다.","todo":"GitHub 저장소와 AWS·Azure·GCP 클라우드를 연동해 쓰는 개발·보안팀은 저장소에 `wfx-docs`라는 브랜치나 `docs: dependency audit notes` 제목의 PR, 또는 몰래 추가됐다가 되돌려진(revert) 커밋 기록이 없는지 즉시 검색하세요. 흔적이 있다면 **단순히 시크릿(비밀키)만 바꾸면 소용이 없으므로**, 먼저 안전한 기기에서 AWS IAM 역할의 신뢰 정책(Trust Policy)과 Azure(Entra ID)의 `wfx-ci-`로 시작하는 외부 연동 자격 증명을 찾아 삭제한 뒤 모든 클라우드 키·토큰·세션을 폐기하고 재발급하세요.","cls":["C","B"],"s":8794,"e":13060},{"id":"D20261113-apache-http2","title":"Apache HTTP Server `mod_http2` 비인증 원격 코드 실행 결함(CVE-2026-119618, CVSS 9.8) 긴급 패치 — 병렬 요청 레이스 컨디션","file":"일일/2026-11-13.md","date":"Apache 2.4.71 패치 및 CVE 공개 2026-11-11","type":"웹서버 HTTP/2 모듈 레이스 컨디션 및 힙 메모리 오염 원격 코드 실행(CVSS 9.8)","actor":"— (대량 스캔 및 PoC 연구 포착, 실제 침투 악용은 미확인)","region":"전 세계(해외)","evidence":"확인(Apache Software Foundation·MITRE CVE·Red Hat 확인)","easy":"전 세계 웹사이트의 상당수가 사용하는 대표 웹서버 프로그램 '아파치(Apache HTTP Server)'의 고속 통신 기능(HTTP/2 모듈, `mod_http2`)에서, 해커가 로그인 없이 원격에서 서버를 장악할 수 있는 위험도 9.8점(10점 만점)짜리 치명적 결함(CVE-2026-119618)이 발견돼 긴급 패치(2.4.71 버전)가 나왔습니다. 동시에 여러 개의 요청을 빠르게 쏟아부어 서버가 요청 머리글(헤더)을 처리하는 순서를 꼬이게(레이스 컨디션) 만들면, 서버 메모리가 망가지면서 공격자가 원하는 명령어를 실행할 수 있습니다.","todo":"Apache HTTP Server(2.4.55~2.4.70 버전)를 운영하는 관리자는 즉시 수정 버전인 **2.4.71 이상**(또는 우분투·레드햇 등 리눅스 배포판이 제공하는 최신 보안 백포트 패키지)으로 업데이트하세요. 당장 업데이트가 어렵다면 아파치 설정(`Protocols` 지시자)에서 `h2`와 `h2c`(HTTP/2 기능)를 임시로 빼서 HTTP/1.1로만 동작하게 바꾸고, 만약 비정상 크래시 등 침해가 의심된다면 패치 후 기존 웹 세션·인증키를 안전한 기기에서 교체하세요.","cls":["A"],"s":13440,"e":16513},{"id":"D20261113-signdrop","title":"Windows CLFS(`clfs.sys`) 로그 인증 기능을 역이용한 권한 상승 제로데이 'SignDrop' 개념증명(PoC) 공개","file":"일일/2026-11-13.md","date":"보안 연구자 PoC 공개 및 보도 2026-11-11~12","type":"Windows 공통 로그 파일 시스템(`clfs.sys`) 로컬 권한 상승 미패치 제로데이(PoC 공개)","actor":"— (Abdelhamid Naceri 공개, 실제 악용 미확인)","region":"전 세계(해외)","evidence":"확인(보안 연구자 PoC 공개·The Hacker News·BleepingComputer 확인)","easy":"윈도우 컴퓨터의 핵심 부품인 '공통 로그 파일 시스템(`clfs.sys`)'에서, 일반 사용자 권한만 가진 공격자가 컴퓨터 최고 관리자 권한(`SYSTEM`)을 단숨에 빼앗을 수 있는 새로운 '제로데이' 공격 코드(이름: **SignDrop**)가 인터넷에 공개됐습니다. 아이러니하게도 이 공격은 마이크로소프트가 과거 끊이지 않던 해킹을 막으려고 새로 넣었던 '로그 파일 진위 확인(인증) 보안 기능' 자체를 역이용해, 경로를 살짝 비틀어 최고 권한을 얻어냅니다. 아직 마이크로소프트의 공식 패치가 나오지 않아 랜섬웨어 조직들이 악용할 위험이 큽니다.","todo":"이 결함은 이미 컴퓨터 안에 첫발을 들인 악성코드가 최고 권한으로 뛰어오를 때 쓰이므로, 일반 사용자와 기업은 출처가 불분명한 파일·스크립트를 절대 실행하지 말고 백신(EDR)을 최신 상태로 유지하세요. 기업 보안 담당자는 마이크로소프트의 긴급 패치가 나올 때까지 윈도우에서 `clfs.sys` 관련 비정상 로그 동반 파일(`.blf` 등)이 엉뚱한 시스템 폴더에 생성되는지 집중 감시하고, 감염이 의심되는 PC에서는 절대 비밀번호를 바꾸지 말고 네트워크에서 즉시 격리하세요.","cls":["H","I"],"s":16838,"e":19853},{"id":"D20261113-nodejs-http2","title":"Node.js 보안 업데이트(16건): HTTP/2 다른 연결의 응답 메모리 노출(CVE-2026-123866) 및 파일 다운로드 취소 시 서버 강제 종료(CVE-2026-123863·123875) 수정","file":"일일/2026-11-13.md","date":"OpenJS Foundation 보안 권고·패치 및 CVE 공개 2026-11-11","type":"서버 런타임(Node.js) HTTP/2 메모리 노출(UAF) 및 원격 서비스 거부(DoS) 등 16건","actor":"— (실제 악용 미확인)","region":"전 세계(해외)","evidence":"확인(Node.js 공식 보안 권고·MITRE CVE 확인)","easy":"수많은 웹 서비스와 앱의 백엔드 서버로 쓰이는 '노드제이에스(Node.js)'에서 한꺼번에 16개의 보안 결함을 고친 긴급 업데이트가 나왔습니다. 가장 위험한 것은 HTTP/2 통신 중 연결이 끊어질 때 이미 반납한 메모리를 다시 쓰는 결함(CVE-2026-123866)으로, 엉뚱하게 **다른 사용자의 통신 응답 내용(메모리 조각)이 공격자에게 섞여 전달될 수 있는 정보 노출 위험**이 있습니다. 또한 공격자가 로그인도 하지 않고 파일 다운로드를 요청했다가 취소하는 것만으로 서버 전체를 강제로 꺼버릴 수 있는 결함(CVE-2026-123863, CVE-2026-123875)도 함께 수정됐습니다.","todo":"Node.js(22.x, 24.x, 26.x 계열)로 웹·API 서버를 운영하는 개발·인프라팀은 즉시 수정 버전(**v26.13.1, v24.22.3, v22.23.5 이상** — 당시 기준)으로 업데이트하세요. 특히 HTTP/2를 켜 둔 서버에서는 다른 이용자의 응답 데이터(토큰·개인정보 등)가 섞여 나갔을 가능성을 배제할 수 없으므로, 비정상 스트림 종료 로그가 많았다면 패치 후 주요 세션·토큰을 재발급하는 것이 안전합니다.","cls":["A"],"s":20211,"e":23866},{"id":"D20261113-adobeconnect","title":"Adobe Connect 비인증 CVSS 10.0 만점 결함 4건(CVE-2026-121351~121353·121356) 및 SQL 삽입(9.9) 등 24건 일괄 패치","file":"일일/2026-11-13.md","date":"Adobe 보안 권고(APSB26-191) 및 MITRE CVE 공개 2026-11-10~11","type":"화상회의·원격교육 서버 비인증 경로 조작·CRLF 삽입·인가 결함·SSRF·SQLi 치명적 취약점(CVSS 10.0 4건 포함 24건)","actor":"— (실제 악용 미확인)","region":"전 세계(해외)","evidence":"확인(Adobe APSB26-191·MITRE CVE 확인)","easy":"기업과 대학, 공공기관에서 온라인 화상회의나 원격 강의용으로 자체 서버에 설치해 쓰는 '어도비 커넥트(Adobe Connect)'에서, 위험도 최고 점수인 **CVSS 10.0 만점짜리 결함 4건**을 포함해 총 24개의 보안 취약점이 한꺼번에 발견돼 패치가 나왔습니다. 해커가 로그인조차 하지 않고 원격에서 서버 안의 민감한 파일을 마음대로 읽어가거나 줄바꿈 문자(CRLF 삽입)·요청 위조(SSRF)로 권한과 사용자 세션을 가로챌 수 있고, 낮은 권한 계정만 있어도 데이터베이스 명령어(SQL 삽입, CVSS 9.9)를 끼워 넣어 원격 코드를 실행할 수 있는 심각한 수준입니다.","todo":"자체 윈도우 서버에 Adobe Connect(12.12 이하 버전)를 설치해 운영하는 기관·기업 관리자는 어도비가 배포한 수정 버전(**12.12.a, 12.11.i, 12.10.f, 12.9.a, 12.8.a** — 당시 기준)을 즉시 적용하세요. 외부 인터넷에 열려 있는 화상회의 서버 특성상 이미 설정 파일이나 세션이 노출됐을 가능성이 있다면, 패치만 하지 말고 안전한 기기에서 관리자 비밀번호·DB 연동 정보·기존 로그인 세션을 모두 재발급하세요.","cls":["A"],"s":24229,"e":27480},{"id":"D20261113-apify","title":"웹 자동화·AI 데이터 플랫폼 Apify 내부 자격 증명 침해 — API 토큰·프록시 비밀번호 강제 교체 및 GitHub 연동 해제","file":"일일/2026-11-13.md","date":"비인가 접근 발생 2026-11-09~10","type":"웹 스크래핑·브라우저 자동화 클라우드 플랫폼 자격 증명 침해 및 API 토큰·연동 정보 노출 우려","actor":"미귀속","region":"전 세계(해외)","evidence":"확인(Apify 공식 보안 공지·BleepingComputer 보도)","easy":"전 세계 개발자와 AI 기업들이 웹사이트 데이터를 자동으로 수집(스크래핑)하거나 브라우저 작업을 자동화할 때 널리 쓰는 클라우드 플랫폼 '애피파이(Apify)'의 내부 시스템이 해킹당했습니다. 공격자는 훔친 자격 증명으로 내부 시스템에 들어와 여러 고객의 계정 자격 증명과 2단계 인증(2FA) 관련 정보 등에 접근했습니다. 이에 회사는 피해 가능성이 있는 고객들의 API 접속 토큰과 프록시 비밀번호를 강제로 모두 새로 바꾸고, 혹시 모를 연쇄 해킹을 막기 위해 고객들이 연결해 둔 깃허브(GitHub) 연동(OAuth)도 일괄 해제했습니다.","todo":"Apify를 사용하는 개발자·기업은 감염되지 않은 안전한 기기에서 Apify 콘솔에 접속해 **2단계 인증(2FA)을 즉시 재설정(초기화 후 재등록)**하고, 회사가 강제로 새로 바꾼 API 토큰과 프록시 비밀번호를 확인해 사내 자동화 파이프라인에 반영하세요. 또한 Apify 자동화 작업(Actor) 안에 우리 회사의 다른 외부 서비스 비밀키(DB·클라우드·메신저 토큰 등)를 넣어 두었다면 그 비밀키들도 함께 폐기·재발급하세요.","cls":["B","C"],"s":27799,"e":30653},{"id":"D20261114-kakaowork","title":"업무용 협업 플랫폼 '카카오워크(디케이테크인)' 해킹 — 임직원·외부 인원 개인정보 및 업무 메일 본문·첨부파일 원본 유출","file":"일일/2026-11-14.md","date":"비정상 접근 발생 2026-11-09","type":"기업용 협업 플랫폼·업무 메일 시스템 비인가 접근 및 업무 자료 유출","actor":"미귀속","region":"한국","evidence":"확인(카카오엔터프라이즈·디케이테크인 공식 공지 및 개인정보위·KISA 신고, 보안뉴스·매일경제·한겨레·지디넷코리아 보도)","easy":"카카오 그룹의 기업용 업무 메신저·협업 플랫폼인 '카카오워크'(운영사 디케이테크인) 시스템이 외부 해커에게 뚫려, 이를 사내 업무용으로 쓰는 카카오엔터프라이즈 전·현직 임직원과 외부 협업 인원 등의 개인정보뿐 아니라 **업무용 이메일 본문·제목과 메시지 첨부파일 원본**까지 유출됐습니다. 그동안 회사 측이 \"자체 종단간 암호화(E3) 기술 덕분에 물리적 해킹이 일어나도 누구도 고객 데이터를 볼 수 없다\"고 강조해 왔음에도 실제 메일 본문과 첨부파일 원본이 노출되면서 기업 내부 기밀과 2차 침투 위험에 대한 우려가 커졌습니다.","todo":"카카오워크 유출 통지를 받은 임직원·외부 협업자 및 메일 수신자는 감염되지 않은 안전한 기기에서 계정 비밀번호를 즉시 변경하고 기존 로그인 세션과 모바일 기기 연동을 모두 로그아웃(초기화)하세요. 특히 **유출된 업무 메일 본문이나 메신저 첨부파일 안에 사내 서버 접속 정보, API 키, 고객사 자료, 계약서 등이 들어 있었다면 계정 비밀번호만 바꿔서는 막을 수 없으므로** 해당 문서에 적혀 있던 모든 비밀키·접속 정보도 즉시 폐기·재발급하고, 실제 업무 대화를 인용한 정교한 사칭 메일(스피어 피싱)을 철저히 의심하세요.","cls":["J","C"],"s":3919,"e":7170},{"id":"D20261114-moduchangup","title":"중기부 '모두의 창업' 2차 사업 참여 AI 기업 '아미쿠스렉스(로폼)' SQL 삽입·API 해킹 — 참가자 818명 포함 총 2만28명 개인정보 유출","file":"일일/2026-11-14.md","date":"해킹 발생 2026-11-11 05:38","type":"정부 창업 지원 사업 참여 AI 공급사 관리자 페이지 SQL 삽입·취약 API 해킹","actor":"미귀속","region":"한국","evidence":"확인(아미쿠스렉스 통지·KISA 신고 및 중소벤처기업부 공식 발표, 보안뉴스·데일리시큐·한겨레·조선일보 보도)","easy":"중소벤처기업부와 창업진흥원이 추진하는 대국민 창업 지원 사업 '모두의 창업'에서, 참가자들에게 인공지능(AI) 법률문서 서비스를 제공하는 참여 기업 '아미쿠스렉스(서비스명 로폼)'가 해킹당해 총 2만28명(이 중 창업 사업 참가자 818명)의 이름·전화번호·이메일이 유출됐습니다. 지난 6월 '1차 모두의 창업' 사업에서 API 보안 허점으로 약 5,000명의 정보와 창업 아이디어가 유출된 뒤 정부가 \"보안성을 철저히 검증해 50개 AI 공급기업을 새로 뽑았다\"고 발표했지만, 불과 한 달 만에 또다시 관리자 페이지 SQL 삽입과 취약한 API 결함으로 뚫렸습니다.","todo":"아미쿠스렉스(로폼) 이용자 및 '2차 모두의 창업' 참가자(818명)는 중기부·창업진흥원이나 AI 공급기업을 사칭해 \"지원금 정산·심사 서류 보완·피해 보상\" 명목으로 악성 링크 클릭이나 추가 정보를 요구하는 문자(스미싱)·이메일에 절대 속지 마세요. 해당 서비스에 쓰던 비밀번호와 같은 비밀번호를 사용하는 다른 사이트가 있다면 안전한 기기에서 비밀번호를 바꾸고 기존 로그인 세션을 초기화하세요.","cls":["A","C"],"s":7536,"e":10502},{"id":"D20261114-checkpoint-kev","title":"Check Point Gaia OS `DynamicCLI` 로컬 권한 상승 제로데이(CVE-2026-123039) CISA KEV 긴급 등재 — PHP2Shell 연쇄 악용해 루트 장악·백도어(`TSGA`) 및 ESXi 와이퍼(`destroy_v6`) 유포","file":"일일/2026-11-14.md","date":"Check Point 보안 권고(`sk1000362`)·CVE 공개 2026-11-12","type":"방화벽·보안 게이트웨이 로컬 소켓 인증 누락 권한 상승 제로데이(실제 악용·와이퍼 공격 체인 확인)","actor":"미귀속(일부 파괴형·첩보 캠페인에서 악용 관측)","region":"전 세계(해외)","evidence":"확인(Check Point sk1000362·CISA KEV·MITRE CVE·Aviatrix 확인)","easy":"전 세계 기업과 기관이 네트워크 대문(방화벽·VPN)으로 쓰는 '체크포인트(Check Point)' 보안 장비의 운영체제(Gaia OS)에서, 장비 안에 일단 발을 들인 해커가 단숨에 최고 관리자 권한(`root`)을 빼앗을 수 있는 치명적 제로데이 결함(CVE-2026-123039)이 실제 해킹에 악용돼 미국 CISA가 긴급 경보(KEV, 기한 11월 16일)를 발령했습니다. 해커들은 지난번 공개된 PHP 결함('PHP2Shell')으로 체크포인트 장비에 먼저 침투한 뒤, 이 제로데이를 연달아 써서 장비 전체를 완전히 장악하고 백도어(`TSGA`)를 심었을 뿐 아니라, 내부 가상 서버(VMware ESXi)로 넘어가 데이터를 통째로 지워버리는 파괴형 악성코드(와이퍼 `destroy_v6`)까지 실행했습니다.","todo":"Check Point 방화벽·보안 게이트웨이·관리 서버(R80.30~R82.20 계열)를 운영하는 조직은 가능한 범위에서 포렌식 증거를 신속히 보존한 뒤 제조사의 긴급 핫픽스(`sk1000362` — 당시 기준)를 **11월 16일까지 즉시 적용**하세요(당장 패치가 어렵다면 임시 조치로 `dynamic_server` 프로세스를 중지하고 자동 재시작을 끄세요). 이미 공격에 악용된 장비는 패치만 해도 심어진 백도어(`TSGA`/`TSProxy`)가 사라지지 않으므로, `/tmp/dynamic_socket` 악용 흔적과 내부 ESXi 하이퍼바이저로의 비정상 SSH 접속을 점검하고 안전한 환경에서 모든 관리자·VPN·ESXi 자격 증명과 세션을 교체하세요.","cls":["A","H","G"],"s":10952,"e":15646},{"id":"D20261114-unrealircd-kev","title":"UnrealIRCd `labeled-response` 모듈 서버 간 명령 주입 취약점(CVE-2026-114713) 실제 악용 및 CISA KEV 등재","file":"일일/2026-11-14.md","date":"벤더 패치(`6.2.7.1`·핫패치) 및 CVE 공개 2026-11-07~08","type":"IRC 서버 구분자 무력화 미흡을 통한 최고 서버 권한 명령 주입(실제 악용 확인)","actor":"미귀속","region":"전 세계(해외)","evidence":"확인(UnrealIRCd 공식 보안 권고·CISA KEV·MITRE CVE 확인)","easy":"전 세계 오픈소스 커뮤니티와 기업·기관 내부 채팅망에서 널리 쓰이는 대표 IRC 채팅 서버 프로그램 '언리얼아이알씨디(UnrealIRCd)'에서, 아무 권한 없는 일반 접속자가 채팅 메시지 꼬리표(`label`)에 특수 문자를 섞어 보내는 것만으로 **서버 전체의 최고 권한 명령을 마음대로 내릴 수 있는 치명적 결함(CVE-2026-114713)**이 실제 해킹에 악용돼 미국 CISA가 긴급 패치 명령(KEV, 기한 11월 16일)을 내렸습니다. 서버가 2대 이상 연결된 채팅망에서 이 공격이 성공하면, 해커가 관리자나 전체 이용자를 네트워크에서 강제로 쫓아내거나(`KILL`·`GLINE`) 채팅망 전체의 제어권을 빼앗을 수 있습니다.","todo":"UnrealIRCd(6.0.0~6.2.7 버전)를 운영하는 관리자는 서버를 재시작하지 않고도 즉시 고칠 수 있는 무중단 핫패치 명령(`./unrealircd hot-patch bundle-20261107`)을 실행하거나 **6.2.7.1 이상**(당시 기준)으로 즉시 업그레이드하세요(기한 11월 16일). 당장 패치가 어렵다면 설정 파일에 `blacklist-module \"labeled-response\";`를 추가하거나 스팸필터 차단 규칙을 적용하고, 이미 비정상 서버 명령이 실행된 흔적이 있다면 패치 후 운영자(IRCOp) 비밀번호와 서버 간 연동 비밀번호(Link block password)를 안전한 기기에서 교체하세요.","cls":["A"],"s":15989,"e":19253},{"id":"D20261114-barracuda-cloud","title":"바라쿠다(Barracuda) 내부 클라우드 침해 — 폐기 안 한 협력사 키와 AI 도구('ARTEX' 추정)로 고객 XDR 연동 자격 증명 저장소 접근","file":"일일/2026-11-14.md","date":"외부 협력사 개발 환경 침해 2026-10(추정)","type":"보안 벤더 내부 클라우드 방치 자격 증명 악용 및 고객 보안 관제(XDR) 연동 키 저장소 노출 우려","actor":"미귀속(AI 침투 도구 'ARTEX'와 일치하는 동작 관측)","region":"전 세계(해외)","evidence":"확인(Barracuda 공식 보안 공지, 데일리시큐 보도) / 추정(협력사 개발 환경 침해 경위 및 AI 도구 'ARTEX' 동작 일치 분석)","easy":"글로벌 보안 기업 '바라쿠다(Barracuda)'가 과거 외부 협력사와 프로젝트를 끝내고도 지우지 않고 방치해 둔 클라우드 접속 열쇠(키) 때문에 내부 클라우드가 해킹당했습니다. 지난 10월 그 협력사의 개발 환경이 뚫렸을 때 이 열쇠를 손에 넣은 공격자는, AI 자동 해킹 도구('아르텍스 ARTEX'로 추정)를 써서 44시간 동안 바라쿠다 클라우드 계정 10여 개를 휘젓고 다니며 **고객사들의 마이크로소프트 365·구글 워크스페이스·보안 프로그램 연동 열쇠가 보관된 저장 시스템**에까지 접근했습니다.","todo":"바라쿠다의 보안 관제 서비스(Managed XDR Cloud 또는 Monitored Endpoint)를 API로 연동해 쓰면서 개별 통지를 받은 기업은, \"고객 열쇠를 실제로 꺼내 갔다는 직접 증거는 없다\"는 설명에만 안심하지 말고 감염되지 않은 안전한 기기에서 **바라쿠다와 연결된 Microsoft 365·Google Workspace·엔드포인트 보안 제품의 API 키와 OAuth 토큰을 즉시 폐기하고 새로 발급**하세요. 아울러 11월 1일 이후 해당 클라우드 계정에서 수상한 로그인이나 데이터 조회 기록이 없는지 감사 로그를 반드시 확인하세요.","cls":["C","B","H"],"s":19700,"e":23016},{"id":"D20261114-qubole-expedia","title":"빅데이터 플랫폼 Qubole의 AWS 교차 계정 IAM 역할('방치된 연동') 악용 공급망 침해 — 다수 기업 데이터 유출 및 익스피디아(Expedia) 10억 건 협박 파장","file":"일일/2026-11-14.md","date":"AWS 교차 계정 공격 관측 2026-10-14~26","type":"서드파티 클라우드 빅데이터 플랫폼 AWS 자격 증명 탈취 및 고객사 미삭제 교차 계정 IAM 역할(`AssumeRole`) 연쇄 침해","actor":"`n0n`(`N0N`, 러시아 연루 추정 신생 협박 그룹 — 익스피디아 협박 주체)","region":"전 세계(해외)","evidence":"확인(Sentra·Wiz·Mandiant 분석 및 Expedia 서드파티 침해 확인) / 주장(`n0n`의 익스피디아 약 10억 건 유출 주장)","easy":"기업들이 클라우드 데이터를 분석하려고 썼던 빅데이터 플랫폼 '큐볼(Qubole)'의 아마존 클라우드(AWS) 열쇠가 해커에게 털리면서, 큐볼이 고객사 클라우드에 들어올 수 있게 열어 두었던 **'교차 계정 통로(IAM 역할)'**를 타고 10여 개가 넘는 기업들의 AWS가 연쇄적으로 뚫렸습니다. 특히 **이미 몇 년 전에 큐볼 서비스를 해지하고 안 쓰던 기업들조차 과거에 만들어 둔 통로(IAM 역할)를 지우지 않고 방치했다가** 그대로 털렸으며, 글로벌 여행 플랫폼 '익스피디아(Expedia)'도 서드파티 데이터 플랫폼 통로가 악용된 침해를 조사 중인 가운데 해커(`n0n`)는 다크웹에서 약 10억 건의 여행자·로열티 기록을 훔쳤다고 협박하고 있습니다(10억 건 수치는 해커의 일방 주장).","todo":"AWS 클라우드를 사용하는 모든 기업은 지금 즉시 AWS IAM 콘솔에서 외부 업체(특히 **Qubole**을 비롯해 이미 해지했거나 현재 쓰지 않는 SaaS·분석 업체)에 `AssumeRole` 권한을 허용해 둔 **교차 계정 IAM 역할(Cross-account IAM Role)을 전수 검색해 즉시 삭제**하세요. 만약 10월 14일 이후 외부 계정이 해당 역할을 빌려 쓴(`AssumeRole`) 기록이 AWS CloudTrail에 남아 있다면, 역할만 지워서는 안 되며 안전한 기기에서 S3·Systems Manager(SSM) 등에 보관됐던 모든 비밀키·토큰·자격 증명을 전면 폐기·재발급하세요.","cls":["C","B"],"s":23518,"e":27700},{"id":"D20261114-notion-fireworks","title":"노션(Notion), AI 추론 공급사 'Fireworks AI' 해킹으로 일부 워크스페이스의 'Notion AI 채팅 기록' 노출 — '데이터 무보관' 약정 불일치","file":"일일/2026-11-14.md","date":"Fireworks AI 침해 발생 2026-10-24","type":"서드파티 AI 추론 공급사(Fireworks AI) 클라우드 침해 및 계약 위반 잔류 프롬프트·채팅 기록 노출","actor":"미귀속","region":"전 세계(해외)","evidence":"확인(Notion 공식 고객 통지 및 Fireworks AI 확인, SecurityWeek·BleepingComputer·TechCrunch 보도)","easy":"전 세계 기업과 개인이 문서 정리·협업에 쓰는 '노션(Notion)'에서, 노션 AI의 일부 기능('인사이트' 분류 작업)을 처리하느라 외부 AI 인프라 업체인 '파이어웍스 AI(Fireworks AI)'로 보냈던 **노션 AI 채팅 대화 기록(질문과 답변)**이 파이어웍스 AI 해킹으로 인해 노출됐습니다(전체 노션 작업공간의 1% 미만 영향). 특히 파이어웍스 AI는 원래 계약상 \"고객 데이터를 저장하지 않는다(데이터 무보관)\"고 약속했지만 실제로는 서버에 대화 기록이 남아 있다가 털렸으며, 노션 측은 대화 기록에 '누가 어느 회사에서 썼는지' 이름표는 붙어 있지 않지만 **대화창에 비밀번호나 비밀키를 직접 복사해 넣었다면 즉시 바꾸라**고 권고했습니다.","todo":"노션으로부터 데이터 노출 통지 이메일을 받은 워크스페이스 관리자·이용자는(통지를 받지 않은 곳은 영향 없음), 지난 10월 말 이전에 **Notion AI 채팅창에 질문하면서 무심코 붙여 넣었던 회사 API 키, 비밀번호, 접속 토큰, 미공개 기밀 정보가 있는지 확인해 감염되지 않은 안전한 기기에서 해당 비밀번호와 키를 즉시 모두 폐기·재발급**하세요.","cls":["C"],"s":28130,"e":31656},{"id":"D20261114-facestealer-fbi","title":"미 법무부·FBI, 북한 해커의 가짜 화상회의 사칭 캠페인 '페이스스틸러(FaceStealer)' 인프라 압수(4억 달러 탈취·웹캠 영상 900개 확보) 및 바이낸스 해킹 탈취 자산 27억 달러 동결","file":"일일/2026-11-14.md","date":"미 법무부(DOJ)·FBI 발표 2026-11-12(현지시간)","type":"지인 계정 탈취 + 이전 피해자 웹캠 영상·딥페이크 가짜 화상회의 사회공학 캠페인 및 가상자산 탈취","actor":"북한 연계 해커 조직(바이낸스 사건은 북한 'TraderTraitor' 공식 귀속)","region":"전 세계(해외)","evidence":"확인(미 법무부 DOJ·FBI 공식 발표, SecurityWeek·데일리시큐 확인)","easy":"미국 법무부와 연방수사국(FBI)이 최근 18개월 동안 가짜 화상회의로 가상자산 업계 종사자와 오픈소스 개발자들을 속여 **4억 달러(약 5,600억 원) 이상**을 훔친 북한 해커들의 '페이스스틸러(FaceStealer)' 서버를 압수했습니다. 해커들은 먼저 해킹한 지인의 텔레그램·링크드인 계정으로 연락해 줌(Zoom)·팀즈 같은 화상회의로 불러낸 뒤, **이전에 해킹당한 사람들의 실제 웹캠 녹화 영상(압수 서버에서 900개 이상 발견)이나 딥페이크 영상**을 화면에 틀어 안심시키고 \"목소리가 안 들린다\"며 악성 프로그램을 깔게 만들었습니다. 한편 미국 정부는 같은 날 지난 10월 말 북한이 바이낸스에서 훔쳐 간 60억 달러대 가상자산 중 **27억 달러 이상을 동결하고 12억 달러 이상에 대해 법원 압류 승인**을 받았다고 발표했습니다.","todo":"평소 알고 지내던 지인의 텔레그램·링크드인·슬랙·디스코드 계정에서 화상회의 초대가 오더라도, 회의 도중 **\"오디오·마이크나 카메라가 안 되니 업데이트·오류 해결 프로그램을 설치하라\"**는 안내가 뜨면 100% 해킹이므로 즉시 창을 닫고 절대 실행하지 마세요. 만약 이미 프로그램을 실행했다면 **즉시 그 컴퓨터의 인터넷(랜선·와이파이)을 끊고**, 그 컴퓨터가 아닌 **다른 안전한 기기**에서 가상자산 지갑 자산을 옮기고 메신저·GitHub·클라우드 계정의 비밀번호와 모든 로그인 세션·토큰을 폐기하세요.","cls":["D","B","C"],"s":32048,"e":36063}],"mappings":[{"id":"INC-2023-10-okta","ta":"TA0001","tech":"T1078","parent":"T1078","ev":"확인","note":"지원 시스템 서비스 계정의 도난 자격 증명으로 접속"},{"id":"INC-2023-10-okta","ta":"TA0006","tech":"T1 uda 공식 분석상 추정: 지난 10월 외부 협력사의 개발 환경이 침해됐을 때 프로젝트 종료 후에도 폐기되지 않은 바라쿠다 클라우드 접근 키가 탈취된 것으로 분석"},{"id":"D20261114-barracuda-cloud","ta":"TA0001","tech":"T1078.004","parent":"T1078","ev":"확인","note":"Barracuda 공식 공지: 과거 협력사 프로젝트용으로 발급한 뒤 폐기하지 않은 유효 클라우드 접근 키를 이용해 약 44시간 동안 내부 클라우드 계정 10여 개 및 고객 XDR 연동 자격 증명 저장 시스템에 접근"},{"id":"D20261114-qubole-expedia","ta":"TA0001","tech":"T1199","parent":"T1199","ev":"확인","note":"Sentra·Wiz·Mandiant 확인(Qubole AWS 교차 계정 IAM 역할 악용 캠페인) 및 Expedia 확인(서드파티 데이터 플랫폼 신뢰 접근 침해): 침해된 서드파티 데이터 플랫폼의 자격 증명과 고객사 클라우드에 설정된(일부는 서비스 종료 후 방치된) 교차 계정 IAM 역할(AssumeRole) 등 신뢰 관계를 타고 다수 기업 환경에 침투"},{"id":"D20261114-qubole-expedia","ta":"TA0007","tech":"T1613","parent":"T1613","ev":"확인","note":"Sentra·Wiz 확인: 교차 계정 역할로 진입한 고객사 AWS 환경에서 클라우드 스토리지 및 시스템 리소스 열거 수행"},{"id":"D20261114-qubole-expedia","ta":"TA0006","tech":"T1552","parent":"T1552","ev":"확인","note":"Sentra·Wiz 확인: 고객사 AWS 스토리지 및 Systems Manager(SSM)에서 비밀정보와 자격 증명 수확"},{"id":"D20261114-qubole-expedia","ta":"TA0009","tech":"T1530","parent":"T1530","ev":"확인","note":"Sentra·Wiz 확인: 다수 피해 기업의 AWS 클라우드 스토리지 객체에서 데이터 수집·반출(단, 갈취 그룹 n0n이 주장한 익스피디아 10억 건 규모는 공격자 일방 주장으로 미검증)"},{"id":"D20261114-notion-fireworks","ta":"TA0009","tech":"T1530","parent":"T1530","ev":"확인","note":"Notion·Fireworks AI 공식 확인: 추론 인프라 공급사 Fireworks AI의 클라우드 개발/R&D 환경 침해로 데이터셋·모델 가중치 및 엔드포인트에 남아 있던 일부 워크스페이스(1% 미만)의 Notion AI 채팅 기록 노출"},{"id":"D20261114-facestealer-fbi","ta":"TA0001","tech":"T1566.003","parent":"T1566","ev":"확인","note":"미 법무부(DOJ)·FBI 확인: 탈취한 지인의 텔레그램·링크드인·슬랙·디스코드 계정으로 피해자에게 접근해 줌·팀즈·구글 미트로 위장한 가짜 화상회의에 초대"},{"id":"D20261114-facestealer-fbi","ta":"TA0002","tech":"T1204.002","parent":"T1204","ev":"확인","note":"DOJ·FBI 확인: 가짜 화상회의에서 이전 피해자의 웹캠 녹화 영상·딥페이크를 보여주며 오디오 오류 해결 프로그램으로 위장한 악성코드를 직접 실행하도록 유도"},{"id":"D20261114-facestealer-fbi","ta":"TA0009","tech":"T1125","parent":"T1125","ev":"확인","note":"DOJ·FBI 확인: 감염된 피해자의 웹캠 영상을 몰래 수집해 다음 사칭 공격에 재사용(압수된 클라우드 인프라에서 피해자 웹캠 영상 900개 이상 확보)"},{"id":"D20261114-facestealer-fbi","ta":"TA0040","tech":"T1657","parent":"T1657","ev":"확인","note":"DOJ·FBI 확인: 감염 수개월~1년 뒤 가상자산 지갑 등에 접근해 최근 18개월간 4억 달러 이상의 가상자산 탈취"}],"docs":[{"path":"일일/2026-10-03.md","title":"일일 보안 이슈 분석 — 2026-10-03","md":"# 일일 보안 이슈 분석 — 2026-10-03\n\n> 수집 기준: 2026-09-22 ~ 10-03 공개분. CISA KEV 신규 등재와 1차 벤더/연구기관 자료를 우선했다.\n> 근거 표기: **[확인]** 벤더·CISA·연구기관이 직접 확인 / **[주장]** 공격자 일방 주장 / **[추정]** 공개 자료에 없어 본 보고서가 추정. 주체가 중요한 곳은 괄호로 밝힌다. **조치는 본 보고서의 권고**이며 벤더 공식 지침이 우선한다. 모든 '즉시' 조치는 증거(로그·메모리·디스크·클라우드 감사 기록)를 보존한 뒤 수행하고, 침해된 장비·계정에서 새 비밀을 발급하지 않는다.\n> ATT&CK 기준: **v19.2**(TA0005는 *Stealth*로 개칭, *Defense Impairment* 신설). 사건별 기법 매핑은 [../ATTACK/README.md](../ATTACK/README.md)의 전술별 파일과 UI에서 본다.\n\n## 1. 오늘의 요약\n\n| # | 이슈 | CVE | 유형 | 상태 | 즉시 조치 |\n|---|------|-----|------|------|-----------|\n| 1 | Fortinet FortiMail 제로데이 | CVE-2026-104286 | 인증 없이 임의 파일 쓰기 (CVSS 9.8) | 악용 중, KEV 10/1 | IBE 비활성화, 관리 인터페이스 격리 (패치 출시 여부 확인) |\n| 2 | Citrix NetScaler ADC/Gateway 제로데이 2건 | CVE-2026-88771, -88772 | 인증 없이 RCE (CVSS v4 9.5) | 전 세계 악용 중, KEV 9/27 | 패치 **전** 포렌식 증거 보존 후 패치 |\n| 3 | Cisco Catalyst SD-WAN Manager | CVE-2026-76504 | 인증 우회 → admin API (CVSS 9.8) | 악용 중, KEV 9/30 | 패치(우회책 없음), KEV 기한 10/3 |\n| 4 | WordPress 코어 | CVE-2026-87902 | 로컬 파일 포함 → RCE (CVSS 9.2) | 패치 당일 악용, KEV 9/25 | 7.1.2 / 7.0.6 / 6.9.9 / 6.8.10 |\n| 5 | Oracle PeopleSoft (ShinyHunters) | CVE-2026-35273 | 인증 없이 RCE, WAF 우회 | 대량 악용 지속 | 패치 적용, WAF에만 의존 금지 |\n| 6 | Zammad 헬프데스크 | CVE-2026-102489 + -102490 | 세션 고정 → RCE → root | 악용 중, KEV 10/2 | 7.2.0 업그레이드, KEV 기한 10/5 |\n| 7 | Apple CoreGraphics | CVE-2026-86950 | 메모리 쓰기 범위 초과 | 표적 공격, KEV 9/29 | iOS/macOS 26.7.1, macOS 15.8.1 |\n| 8 | 미 국방부 DMDC 유출 | (제품·CVE 비공개) | 파일 공유 시스템 취약점 | 약 305만 명 영향 | 공개 정보 제한적 |\n\n## 2. 이슈별 분석\n\n### [D20261003-fortimail] FortiMail CVE-2026-104286\n> 날짜: 2026-10-01 · 유형: 엣지 장비 취약점 · 행위자: 미귀속 · 지역: 글로벌 · 근거: 확인\n\n**쉽게 말하면**: 메일 보안 장비(FortiMail)에 로그인 없이 파일을 써 넣을 수 있는 결함이 있고, 실제로 공격에 쓰이고 있습니다.\n\n**먼저 할 일(초보용)**: 제조사의 임시 조치(IBE 끄기, 관리 화면을 인터넷에서 닫기)를 적용하고, 수정 버전이 나왔는지 확인하세요.\n\n**개요**: FortiMail에서 인증 없이 파일을 쓰는 제로데이가 악용 중이며 CISA KEV에 10/1 등재됐다(CVSS 9.8, Fortinet 공지 FG-IR-175). 영향 버전은 8.0.0–8.0.1, 7.6.0–7.6.6, 7.4.0–7.4.8, 7.2.0–7.2.9다.\n\n**왜 일어났나**\n- 직접 원인 [확인: Fortinet]: 경로 순회(CWE-22)와 널 바이트(NULL byte) 처리 오류(CWE-158)가 결합해, 조작된 HTTP(S) 요청으로 인증 없이 파일 쓰기가 가능하다. 경로 검증과 파일 쓰기 단계의 문자열 해석 차이일 가능성은 있으나 구체 메커니즘은 미공개다 [추정: 본 보고서].\n- 구조적 원인 [추정]: (1) 메일 보안 장비의 웹/IBE 관리면이 인터넷에 노출 (2) 장비에 EDR이 없어 변조를 못 봄 (3) 7.2 계열은 지원 종료 성격으로 수정 대상이 아님(7.4 이상 이전 권고)\n\n**관측된 아티팩트 [확인]** (실행 순서는 확인되지 않음): `/data/lib/liblog.so`와 `/data/etc/ld.so.preload` 추가, `/data/bin/webconsole`·`/data/bin/mailservice` 추가, `/bin/smit`·`/data/etc/httpd.conf`·`/data/migadmin.tar.gz` 변조, root cron이 `/migadmin` 참조, 의심 아카이브 계정 `archive234`가 데이터를 유출하도록 설정. IOC: IP `79.141.169.187`, `45.129.0.192`.\n\n**침투 경로 [추정: 본 보고서]**: 노출된 웹/IBE → 임의 파일 쓰기 → `ld.so.preload`로 `liblog.so`를 프로세스에 주입 → cron으로 재부팅 후 유지 → 아카이브 계정으로 메일 수집. 각 파일의 구체 기능은 공개 자료에 없다.\n\n**어떻게 조치하나**\n- 즉시: IBE 기능 비활성화(CLI), 관리 인터페이스를 신뢰 대역으로 제한하거나 인터넷에서 제거, **수정 버전(8.0.2 / 7.6.7 / 7.4.9 이상) 출시 여부 확인 후 즉시 적용**\n- 단기: `ld.so.preload`, `liblog.so`, `/migadmin` cron, `archive234`, 비인가 아카이브·전달 규칙 점검. 변조가 확인되면 **제거가 아니라 재구축**을 우선하고, 장비에 저장된 자격 증명·인증서·키 교체\n- 장기: 7.2 → 7.4 이상 이전, 메일 장비 관리면 비노출, 장비 로그 외부 보존\n- 탐지: 장비의 신규 공유 라이브러리·cron 변경, IBE 복호화 시 잘못된 Base64 오류, 위 IOC IP와의 통신\n\n**교훈**: 메일 장비는 모든 메일이 지나가는 곳이다. 침해되면 **메일 내용과 인증 링크** 전부가 노출된다.\n\n### [D20261003-citrix] Citrix NetScaler CVE-2026-88771 / -88772\n> 날짜: 2026-09-27 · 유형: 엣지 장비 취약점 · 행위자: 미귀속 · 지역: 글로벌 · 근거: 확인\n\n**쉽게 말하면**: 회사 원격 접속 장비(NetScaler)의 결함 두 개가 이미 공격에 쓰이고 있습니다. 공개되기 3주 전부터 악용됐다는 관측이 있습니다.\n\n**먼저 할 일(초보용)**: 패치 직전에 가능한 범위에서 로그와 설정을 신속히 보존하고(조사는 병행) 지체 없이 패치한 뒤, 접속 중인 세션을 모두 끊으세요.\n\n**개요**: NetScaler ADC·Gateway의 제로데이 2건이 전 세계에서 악용돼 CISA KEV에 9/27 등재됐다(CISA 공지는 CVE-2026-88771~88778 8건 중 2건이 치명적 제로데이). 벤더 공지는 CTX697096.\n\n**왜 일어났나**\n- 직접 원인 [확인]: -88771은 입력 검증 미흡으로 인증 없이 명령 실행, **기본 구성에서도 영향**. -88772는 DTLS(UDP 기반 TLS) 파싱 코드의 힙 버퍼 오버플로로, DTLS가 VPN 가상 서버에서 기본 활성화되어 있다(영향 버전 범위는 벤더 공지 확인).\n- 구조적 원인: (1) VPN 포털이 인터넷에 직접 노출 (2) 기본 활성 기능이 공격 면이 됨 (3) 장비 내부에 EDR이 없음 (4) 2023 Citrix Bleed 이후에도 같은 제품군에서 반복\n- 악용 시점 [관측: eSentire]: -88771은 **9월 5일부터** 악용돼 KEV 등재(9/27)보다 22일 앞섰다. 벤더 공개일이 이보다 늦었는지는 확인하지 못했다.\n\n**관측된 공격 [확인]**: 인터넷 노출 Gateway에 조작 요청 → 인증 없이 명령 실행 → 웹셸 `/var/netscaler/logon/LogonPoint/custom/.ctxs.receiver`(확장자 없이 PHP 실행) → `/etc/httpd.conf`에서 `php_engine` 활성화(CERT-EU) → 웹셸이 `NSC_CLIENTTYPE` 헤더의 Base64 PHP 코드를 실행. 내부망 진입 가능성은 [추정]이며 후속 이동은 확인된 바 없다.\n\n**어떻게 조치하나**\n- 즉시: **패치 전에** 침해 지표 확인·포렌식 증거(로그·설정·메모리) 보존(CISA 권고), 그다음 패치. 패치 후 **활성 세션 전부 종료**, 장비 저장 자격 증명 교체\n- 단기: 위 웹셸 경로·`php_engine` 설정·`NSC_CLIENTTYPE` 이상 값 점검, 침해 의심 장비는 재구축, NetScaler Console의 IOC 확인\n- 장기: VPN·게이트웨이 앞단 관리면 분리, 엣지 장비 로그 외부 보존, 악용 확인 시 우선 격리·긴급 패치 SLA\n- 탐지: 헤더 `NSC_CLIENTTYPE`에 Base64 문자열, `custom` 디렉터리의 비PHP 확장자 파일, 장비의 비정상 아웃바운드\n\n**교훈**: **패치 전에 증거 보존** — 패치가 아티팩트를 지울 수 있다. 같은 제품이 3년 만에 다시 제로데이다.\n\n### [D20261003-cisco] Cisco SD-WAN Manager CVE-2026-76504\n> 날짜: 2026-09-30 · 유형: 엣지 장비 취약점 · 행위자: 미귀속 · 지역: 글로벌 · 근거: 확인\n\n**쉽게 말하면**: Cisco SD-WAN 관리 화면의 로그인 검사가 주소의 글자 하나를 다르게 쓰면(%6a) 건너뛰어져서 관리자처럼 접속할 수 있었습니다.\n\n**먼저 할 일(초보용)**: 바로 패치(우회 방법이 없습니다)하고, 관리 화면을 인터넷에서 닫으세요.\n\n**개요**: SD-WAN Manager API 인증 우회(CVSS 9.8). Cisco PSIRT가 9월 악용을 인지했고 CISA KEV에 9/30 등재됐다. 올해 Cisco SD-WAN 제어 구성요소의 세 번째 치명적 인증 우회라고 Rapid7이 지적했다.\n\n**왜 일어났나**\n- 직접 원인 [확인: Cisco, Rapid7]: URL 인코딩 처리 오류(CWE-177). 특정 API 엔드포인트의 인증 규칙이 `j_security_check` 경로를 `%6a`(=`j`)처럼 인코딩한 요청에는 적용되지 않고, 요청은 그대로 처리되어 admin 권한 API에 접근된다.\n- 구조적 원인 [추정]: (1) 인증 검사와 라우팅이 서로 다른 단계에서 문자열을 해석 (2) SD-WAN 컨트롤러가 인터넷에 노출 (3) 같은 구성요소의 반복 취약점\n\n**관측된 후속 행위**: 공개 자료에서 **확인되지 않음**. admin API 접근만으로 구성정보 수집이 성립하는 것은 아니다.\n\n**어떻게 조치하나**\n- 즉시: 패치 20.9.10.1 / 20.12.8.2 / 20.15.6.1 / 20.18.4.1 / 26.1.2.1 / 26.2.1 (우회책 없음). KEV 기한 10/3(2차 자료 기준)\n- 단기: Manager 관리면 인터넷 비노출·허용 IP 제한, `serviceproxy-access.log`·`vmanage-server.log`에서 인코딩된 인증 경로 POST와 사용자명 `viptela-reserved-*` 점검, admin 계정·API 키 감사\n- 장기: SD-WAN 컨트롤러를 관리망에만 두기, 구성 변경 승인·감사 로그 외부 보존\n- 탐지: 인코딩된 `j_security_check` 요청, 평소 없던 admin API 호출\n\n**교훈**: **인증 검사 위치와 처리 위치가 다르면** 인코딩 한 글자로 우회된다. 정규화 후 검사.\n\n### [D20261003-wordpress] WordPress CVE-2026-87902\n> 날짜: 2026-09-22 · 유형: 웹 애플리케이션 취약점 · 행위자: 미귀속 · 지역: 글로벌 · 근거: 확인\n\n**쉽게 말하면**: 워드프레스의 결함으로, 특정 조건의 사이트에서는 로그인 없이 서버 코드가 실행됩니다. 패치가 공개된 당일부터 공격이 있었습니다.\n\n**먼저 할 일(초보용)**: 워드프레스를 최신 버전으로 올리고 자동 업데이트를 켜세요.\n\n**개요**: `get_page_template()` 템플릿 해석 로직 결함으로 인증 없이 RCE 가능(CVSS 9.2). 9/22 패치 당일 11:49 UTC에 첫 악용, 9/23~25 허니팟에서 68건 이상, KEV는 9/25.\n\n**왜 일어났나**\n- 직접 원인 [확인: Patchstack 등]: 조작된 요청으로 읽을 수 있는 임의 로컬 `.php`를 include(LFI). KEV는 \"Remote File Inclusion\"으로 분류하지만 이는 KEV의 표현이고, 관측된 흐름은 *로컬 include → PHP 파일 생성 → 원격 스크립트 수령*이다.\n- 선행 조건 [확인]: 활성 테마 최상위 디렉터리명이 `page-`로 시작하고, 웹 서버가 읽을 수 있는 PHP(대표적으로 `pearcmd.php`)가 있을 것. 조건이 좁아 모든 사이트가 영향받지는 않는다.\n- 구조적 원인 [추정]: (1) 서버에 `pearcmd.php` 같은 도구가 남아 있음 (2) 웹 서버 계정이 `/tmp`에 쓸 수 있음 (3) 공개 즉시 자동 악용 스캐너가 대응\n\n**관측된 공격 [확인]**: 조작 요청 → `pearcmd.php` include → `/tmp`·`/var/tmp`에 PHP 파일 쓰기 → GitHub 호스팅 업로드 스크립트 수령 → 웹셸 실행.\n\n**어떻게 조치하나**\n- 즉시: 7.1.2 / 7.0.6 / 6.9.9 / 6.8.10로 업데이트, **자동 업데이트 활성화**\n- 단기: 테마 디렉터리에 `page-` 접두 폴더가 있는지 점검, `/tmp`·`/var/tmp`의 PHP 파일·`wp-pear-rce-flag.php`·`poc87902.php` 점검, 웹 서버의 `/tmp` 쓰기·실행 제한\n- 장기: 컨테이너에서 PEAR 제거(`pearcmd.php` 불필요 시), `open_basedir`·읽기 전용 파일 시스템, 웹셸 탐지\n- 탐지: `/tmp` 아래의 PHP 생성, 웹 서버 프로세스의 외부 다운로드(GitHub)\n\n**교훈**: **패치 공개 = 악용 시작**(몇 시간). 자동 업데이트와 불필요한 도구 제거가 가장 싼 방어다.\n\n### [D20261003-peoplesoft] Oracle PeopleSoft CVE-2026-35273 / ShinyHunters\n> 날짜: 2026-06-10 · 유형: 엣지·ERP 취약점 · 행위자: ShinyHunters(UNC6240) · 지역: 글로벌 · 근거: 확인\n\n**쉽게 말하면**: 대학·기업이 쓰는 PeopleSoft의 결함을 ShinyHunters가 악용했습니다. 방화벽(WAF)의 차단 규칙은 글자 하나를 다르게 쓰는 것만으로 피해 갔습니다.\n\n**먼저 할 일(초보용)**: 방화벽 규칙에 기대지 말고 실제 패치를 적용하세요.\n\n**개요**: PeopleSoft Environment Management Hub(`/PSEMHUB/`)의 인증 없는 RCE(CVSS 9.8). 5/27부터 제로데이로 악용, 6/10 Oracle 공개. Google GTIG는 ShinyHunters를 UNC6240으로 추적하며 6월 기준 100개 이상 조직이 피해를 입었다.\n\n**왜 일어났나**\n- 직접 원인 [확인]: 직렬화 Java 객체를 받는 `/PSEMHUB/hub`의 인증 없는 RCE.\n- WAF 우회 [확인: BleepingComputer]: WAF가 원문 경로 `/PSEMHUB/`를 차단하는데, 공격자는 `/%50SEMHUB/`로 요청한다. WAF는 디코딩 전 문자열을 비교해 놓치고, WebLogic은 디코딩해 취약 엔드포인트로 라우팅한다. **WAF 규칙만으로 막고 있던 조직**이 표적이 된다. 해당 피해 조직들이 실제로 미패치였는지는 확인되지 않았다.\n- 구조적 원인: (1) ERP 관리 구성요소가 인터넷에 노출 (2) **패치 대신 WAF 가상 패치에 의존** (3) 기본 비활성화되지 않은 관리 허브\n\n**관측된 활동 [확인]** (보고된 도구·행위 목록이며 같은 호스트에서 이 순서로 실행됐다는 뜻은 아님): 정찰(직렬화 객체 POST 5~15회), 메모리 내 명령 실행 또는 JSP 웹셸(`x.jsp`, `u.jsp`/`u2.jsp`, `tunnel.jsp`/`.jspx`), Windows: `Ple64.exe`(Light Alloy 위장) → SIDEEYE 백도어, Linux: MeshAgent, Neo-reGeorg SOCKS5 터널, 데이터 탈취 후 공갈.\n\n**FBI 건 [주장: ShinyHunters]**: 9/22 FBIjobs.gov와 AWS GovCloud를 침해해 2~3TB를 가져갔다고 주장. FBI는 FBIjobs.gov의 무단 활동을 조사 중이라고만 밝혔고 침해·유출은 **확인하지 않았다**. 공격자는 WAF 우회 외에 \"새 미공개 취약점\"도 썼다고 주장하나 검증되지 않았다.\n\n**어떻게 조치하나**\n- 즉시: **패치 적용**(WAF 규칙으로 대체 금지), PSEMHUB 접근을 내부망·허용 IP로 제한, 로그에서 `/PSEMHUB/`와 `/%50SEMHUB/` 검색\n- 단기: 웹셸(`x.jsp`, `u.jsp`, `tunnel.jsp*`), `Ple64.exe`, MeshAgent·Neo-reGeorg 흔적 점검, 의심 서버의 자격 증명 교체, 공갈 메일 수신 시 법무·수사기관 연계\n- 장기: ERP 관리 기능 비노출, WAF 규칙을 **디코딩 후 정규화 기준**으로 점검, 정기 침투 테스트\n- 탐지: 정규화 전후 URI 둘 다 로깅, WebLogic에서의 쉘 프로세스·비정상 외부 통신\n\n**교훈**: WAF는 **패치의 대체물이 아니라 시간 벌기**다. 인코딩 한 글자로 규칙이 무너진다.\n\n### [D20261003-zammad] Zammad CVE-2026-102489 / -102490 (DIVD 침해)\n> 날짜: 2026-09-21 · 유형: 웹 애플리케이션 취약점 · 행위자: 미귀속(DIVD는 AI 에이전트형 공격 의혹) · 지역: 글로벌 · 근거: 확인\n\n**쉽게 말하면**: 헬프데스크 소프트웨어 Zammad의 결함 두 개를 이어 로그인 없이 서버 최고 권한(root)까지 얻을 수 있었고, 실제 침해가 있었습니다.\n\n**먼저 할 일(초보용)**: 당시 기준 수정 버전은 7.2.0이며, 지금은 제조사의 최신 보안 버전으로 올리고 기존 로그인 세션을 모두 무효화하세요.\n\n**개요**: 헬프데스크 소프트웨어 Zammad의 세션 고정/하이재킹으로 `zammad` 사용자 권한 RCE(CVE-2026-102489, CVSS 9.4)가 가능하고, 로컬 권한 상승(CVE-2026-102490, CVSS 9.4)으로 root에 이른다. DIVD가 자신의 인스턴스 침해를 조사하다 발견했고 10/2 KEV에 등재(기한 10/5).\n\n**왜 일어났나**\n- 직접 원인 [확인: DIVD, 2차 보도]: 세션 처리 결함으로 인증 없이 세션을 가로채고, 그 권한에서 로컬 권한 상승 결함으로 root 획득.\n- 구조적 원인 [추정]: (1) 헬프데스크 소프트웨어는 인터넷에 노출되고 고객 대화·자격 증명을 다룸 (2) 애플리케이션 계정(`zammad`)에서 root로 가는 경로가 존재 (3) 오픈소스 인스턴스의 느린 업그레이드\n- AI 에이전트 공격 의혹 [추정: DIVD]: 스크립트에 사람이 달지 않을 설명 주석, 수초 내 root 도달, 어설픈 논리를 근거로 \"agentic AI 기반 공격으로 보인다\"고 평가. \"수초\"의 측정 시작점은 확인하지 못했고 귀속 증거가 아니라 정황 판단이다.\n\n**타임라인 [확인]**: 9/21 침해 → 9/22 DIVD 탐지·차단 → 9/24 벤더 신고 → 9/26 영향 인스턴스 통지 → 9/30 공개 → 10/2 KEV. 6.3.0–6.5.4 악용 가능, 7.0.0–7.1.3은 취약 코드가 있으나 \"환경 조건상 악용 불가\"로 보고됨(해당 버전 전체에서 불가능하다는 뜻은 아님). 유출: 자원봉사자 이메일 등.\n\n**어떻게 조치하나**\n- 즉시: **Zammad 7.2.0으로 업그레이드**(기한 10/5), 업그레이드 불가 시 서비스 오프라인·접근 제한\n- 단기: **기존 세션 전부 무효화**, 인증 후 세션 ID 재발급 확인, `zammad` 계정·서버의 신규 계정·SSH 키·cron 점검, 침해 의심 시 서버 재구축\n- 장기: 헬프데스크를 VPN·SSO 뒤로, 애플리케이션 서비스 계정에 sudo·SUID 최소화, 오픈소스 보안 공지 구독\n- 탐지: 세션 쿠키 이상 재사용, 앱 서버의 쉘 실행·root 승격, 대량 티켓 조회\n\n**교훈**: 헬프데스크 시스템은 **사람의 신뢰가 쌓인 곳**이다. 침해되면 사회공학 재료가 된다.\n\n### [D20261003-apple] Apple CoreGraphics CVE-2026-86950\n> 날짜: 2026-09-29 · 유형: 클라이언트 취약점 · 행위자: 미귀속(표적 공격) · 지역: 글로벌 · 근거: 확인\n\n**쉽게 말하면**: 아이폰·맥이 이미지·문서를 그리는 부분의 결함이 소수의 표적에게 악용됐습니다.\n\n**먼저 할 일(초보용)**: 기기를 최신 보안 업데이트로 올리세요. 표적이 될 위험이 큰 사람은 Lockdown Mode를 고려하세요.\n\n**개요**: CoreGraphics의 범위 초과 쓰기로 조작된 파일 처리 시 코드 실행 가능. Apple은 \"극도로 정교한 공격\"에서 특정 개인을 겨냥한 악용을 인지했다고 밝혔고 Meta Product Security가 신고했다. KEV 9/29.\n\n**왜 일어났나**\n- 직접 원인 [확인: Apple]: 렌더링 코드의 경계 검사 부족(범위 초과 쓰기). iOS/iPadOS 26.7.1 미만, macOS Tahoe 26.7.1 미만, macOS Sequoia 15.8.1 미만이 영향.\n- 구조적 원인 [추정]: 이미지·PDF 같은 복잡한 포맷 파서의 메모리 안전성 한계, 메시징 앱을 통한 파일 자동 처리.\n- 전달 경로 [추정: 일부 보도의 가설]: WhatsApp PDF 전달 가능성이 거론되나 정황 수준이다. 공개 PoC는 제어된 범위 초과 쓰기만 보여주고 코드 실행은 시연하지 않는다.\n\n**어떻게 조치하나**\n- 즉시: iOS/iPadOS·macOS 최신 보안 업데이트 적용, 자동 업데이트 켜기\n- 단기: 표적 공격 위험이 높은 사용자는 **Lockdown Mode** 사용 검토, 출처 불명 첨부파일 열람 최소화, 의심 시 기기 점검·조사\n- 장기: MDM으로 OS 업데이트 강제·최소 버전 정책, 고위험 인원 별도 관리\n- 탐지: MDM·EDR의 OS 버전 준수율, 비정상 크래시(렌더링 프로세스) 이력\n\n**교훈**: 클라이언트 제로데이는 **업데이트 속도가 유일한 방어**다. 고위험 사용자는 기능을 줄여라.\n\n### [D20261003-dmdc] 미 국방부 DMDC 유출\n> 날짜: 2026-07-16 · 유형: 파일 공유 시스템·대규모 개인정보 · 행위자: 미귀속 · 지역: 미국 · 근거: 보도\n\n**쉽게 말하면**: 미국 국방부 인사 정보 시스템의 파일 공유 서비스 결함으로 약 305만 명의 정보가 노출됐다고 보도됐습니다.\n\n**먼저 할 일(초보용)**: 파일 공유 서비스의 패치·공개 범위·접근 권한을 먼저 점검하고, 주민번호 같은 민감한 번호는 최소한만 저장하며 암호화하고, 접속 기록을 오래 보관하세요.\n\n**개요**: 파일 공유 시스템 취약점으로 2025-10부터 2026-07-16 발견 시까지 무단 접근이 있었다(보고된 침해 기간 약 9개월). 생존자 276만 명과 사망자 29만 4천 명 등 약 305만 명이 영향을 받았고, 유출 데이터에 이름·생년월일·연락처와 **암호화되지 않은 SSN**이 포함됐다고 보도됐다.\n\n**왜 일어났나**\n- 직접 원인: 취약점(제품·CVE)은 공개되지 않았다.\n- 구조적 원인: 침해 기간이 길었다는 사실만으로 연속 접근이나 \"미탐지\"를 단정할 수 없고, 유출 데이터가 평문이었다는 것이 원본 시스템의 저장 방식을 뜻하는지도 확인되지 않았다. 확인되는 구조는 (1) 인터넷 접점의 파일 공유 시스템 (2) 침해 기간이 약 9개월 (3) 유출 데이터에 평문 SSN이 포함됐다는 보도 정도다.\n\n**어떻게 조치하나** (원인 미공개로 일반 권고)\n- 즉시: 영향 대상 통지·신용 모니터링, 파일 공유 시스템 패치·접근 제한\n- 단기: SSN 등 민감 필드 암호화·토큰화, 대량 다운로드 감사, 소급 가능한 로그 보존 여부 확인(보존이 짧으면 \"IOC 없음\" 판단의 신뢰도가 낮다)\n- 장기: 데이터 최소 수집·보유기간, 파일 공유 시스템의 인터넷 비노출, 접근 통제·권한 분리\n- 탐지: 평소와 다른 대량 파일 조회, 비정상 시간대 접근\n\n**교훈**: 민감정보는 **저장 순간부터 보호**해야 한다. 기간이 길수록 피해 산정이 어려워진다.\n\n## 3. 교차 분석 — 선정한 8건에서 보이는 패턴\n\n> 표본은 이번 주 눈에 띈 8건이며 전체 공격의 분모는 아니다. 아래는 추세 단정이 아니라 선정 사례의 공통점이다.\n\n1. **URL 디코딩·정규화 불일치 2건 + 유사 가능성 1건**: Cisco(`%6a`)와 PeopleSoft(`%50`)는 설명상 URL 디코딩 시점 차이로 인증 규칙·WAF 규칙을 피한 사례다. FortiMail은 널 바이트 처리 취약점으로 검증과 사용 단계의 해석 차이일 가능성은 있으나 같은 메커니즘임은 확인되지 않았다. 공통 교훈은 *디코딩 후 검사하고 검사한 값 그대로 사용*하는 구조이며, 시그니처 기반 WAF만으로는 한계가 있다는 점이다.\n2. **인터넷에 노출된 장비·서비스의 악용 반복**: FortiMail, NetScaler, SD-WAN Manager, PeopleSoft, Zammad가 모두 인터넷 접점이다. EDR 설치가 어려운 장비가 많고 침해 시 내부망 진입점이 될 수 있다.\n3. **패치 전 악용과 패치 직후 악용이 함께 관측**: Citrix는 KEV 등재 22일 전부터, WordPress는 패치 당일 악용됐다. PeopleSoft는 6/10 공개 후에도 WAF에 의존한 시스템이 표적이 됐다(속도와 운영 지연은 서로 다른 문제다).\n4. **자동화·AI 정황은 단일 사례**: Zammad의 DIVD 평가가 맞다면 취약점 연쇄 악용이 자동화되는 신호이나 아직 한 건의 정황 판단이다.\n5. **침해 기간이 긴 사례**: DMDC는 보고된 침해 기간이 약 9개월. 로그 보존, 파일 공유 시스템 감사, 민감정보 보호가 쟁점이다.\n\n과거 3년 사건과의 연결은 [../과거3년/99-총평.md](../과거3년/99-총평.md)에 있다.\n\n## 4. 침투 경로 종합 (선정 사례의 공통 흐름)\n\n```\n[정찰: 인터넷 스캔]\n   └→ T1190 노출된 장비/웹 앱 악용 (인증 없이)\n        ├ 인코딩 불일치 (Cisco %6a / PeopleSoft %50 / FortiMail 널 바이트)\n        └ 입력 검증·메모리 결함 (Citrix, Zammad, WordPress)\n   └→ 지속성: T1505.003 웹셸 / T1053.003 cron / (FortiMail) T1574.006 로더 변조\n   └→ C2: T1071.001, T1572·T1090 터널링, T1219 원격 관리 도구\n   └→ (일부) 내부 이동 → 데이터 탈취 → T1657 공갈 (ShinyHunters)\n```\n\n## 5. 우선 대응 체크리스트\n\n**패치와 침해 대응은 별개의 완료 조건이다.** 패치만으로 이미 설치된 웹셸·로더 변조·탈취된 인증 자료는 사라지지 않는다.\n\n1. **오늘**: Cisco SD-WAN(KEV 기한 10/3) 패치. Citrix는 패치 **전** 로그·설정·메모리 증거 보존 및 IOC 점검 후 패치.\n2. **10/5까지**: Zammad 7.2.0(기한 10/5). 패치와 함께 기존 세션 무효화, 인증 후 세션 ID 재발급 동작 확인. WordPress 최신 보안 릴리스, PeopleSoft 패치 확인.\n3. **관리 평면 노출 점검**: FortiMail·NetScaler·SD-WAN 관리 인터페이스, PSEMHUB가 인터넷에 꼭 열려 있어야 하는지 확인하고 허용 출발지를 제한.\n4. **FortiMail**: IBE 비활성화, 관리 인터페이스를 신뢰 대역으로 제한, `ld.so.preload`·`archive234`·`/migadmin` cron 점검, 비인가 아카이브 계정·전달 규칙 조사, 수정 버전 출시 여부 확인. 변조가 확인되면 제거보다 재구축 우선.\n5. **헌팅**: WebLogic·프록시 로그의 `/PSEMHUB/`와 `/%50SEMHUB/`, 인코딩된 `j_security_check`, `NSC_CLIENTTYPE` 이상 값, `/tmp`·`/var/tmp`의 PHP 파일. 파일명 IOC만 보지 말고 **원문 URI와 실제 처리 경로를 함께 로깅**하고 `%6a`·`%50` 문자열 차단에만 의존하지 않는다.\n6. **행위 탐지**: 동적 링커 설정·공유 라이브러리·cron·웹 실행 설정 변경, 웹 프로세스의 파일 생성·자식 프로세스·예상 밖 외부 통신. MeshAgent 같은 합법 원격 도구는 승인 기준과 비교.\n7. **Apple**: OS 업데이트 적용 상태 확인. 표적 공격 가능성이 있는 사용자는 별도 조사 절차 검토.\n8. **데이터 보호**: 민감정보(SSN 등) 최소 수집·보유기간·암호화·대량 다운로드 감사, 각 사건의 최초 악용일까지 소급 가능한 로그 보존 여부 확인.\n\n## 6. 검증 수준과 한계\n\n- CVE 정보는 CISA KEV, 벤더 권고(Fortinet, Citrix, Cisco), 연구기관(Rapid7, Google GTIG, eSentire, DIVD) 및 2차 보도에서 교차 확인했다. 버전·날짜 등 세부는 2차 자료에 의존한 항목이 있어 **조치 전 벤더 원문 재확인 필요**.\n- **제외한 항목**: Supabase 대량 설정 오류, AI 음성 복제 결제 사기(Fideuram), KillSec 검거, Tokyo Metro·Keio 사건, Zscaler 랜섬웨어 통계(+275.8%)는 단일 2차 요약에서만 확인되어 1차 검증을 마치지 못했다.\n- FBI 침해 건은 공격자 주장이며 확인되지 않았다.\n- 독립 검토: GPT(Codex) 검토를 받아 ATT&CK v19.2 전술 분류 교정, 관측과 추정의 분리, 단정 완화, 방어 항목 보강을 반영했다. ATT&CK 전술은 공식 사이트에서 직접 재확인했다.\n\n## 출처\n\n- CISA KEV 카탈로그, CISA 알림(10/1 FortiMail, 9/27 Citrix, 10/2 Zammad)\n- Fortinet FortiMail 0-day 보도(cybersecuritynews), Citrix 보안 공지 CTX697096, eSentire/Unit 42/watchTowr Citrix 분석\n- Rapid7, Horizon3, SOC Prime의 Cisco SD-WAN CVE-2026-76504 분석\n- The Hacker News / SecurityWeek / Patchstack의 WordPress CVE-2026-87902\n- Google GTIG / BleepingComputer / Arctic Wolf / eSentire의 PeopleSoft CVE-2026-35273\n- DIVD / SecurityOnline의 Zammad 분석\n- The Hacker News / eSecurityPlanet의 Apple CoreGraphics 분석\n- Federal News Network / Security Affairs의 DMDC 유출 보도\n- MITRE ATT&CK v19.2 (attack.mitre.org)\n"},{"path":"일일/2026-10-04.md","title":"일일 보안 이슈 분석 — 2026-10-04","md":"# 일일 보안 이슈 분석 — 2026-10-04\n\n> 수집 기준: 2026-10-04 공개분([10-03 보고서](2026-10-03.md) 이후). CISA KEV 신규 등재와 1차 출처·보도를 우선했다.\n> 근거 표기: **[확인]** 벤더·CISA·연구기관·정부가 직접 확인 / **보도** 언론 보도 / **[추정]** 본 보고서의 추정 / **[주장]** 공격자 일방 주장. **조치는 본 보고서의 권고**이며 벤더 공식 지침이 우선한다. 모든 '즉시' 조치는 증거(로그·메모리·디스크·클라우드 감사 기록)를 신속히 보존하되 패치를 미루지 않으며, 침해된 장비·계정에서 새 비밀을 발급하지 않는다. 수정 버전 번호는 작성 당시 기준이므로 최신 보안 버전을 확인한다.\n> ATT&CK 기준: **v19.2**. 사건별 매핑은 [../ATTACK/README.md](../ATTACK/README.md) 참고.\n\n## 1. 오늘의 요약\n\n| # | 이슈 | CVE | 유형 | 상태 | 즉시 조치 |\n|---|------|-----|------|------|-----------|\n| 1 | Citrix NetScaler SAML 제로데이 | CVE-2026-88779 | 메모리 오버플로(CVSS 8.7), 서비스 거부 + 명령 실행 정황 | 악용 중, KEV 10/4 (기한 10/7) | 14.1-73.41 / 13.1-64.28 이상 |\n| 2 | 국내 이슈(금융당국 긴급 소집·서울사이버대 통보) | | | [국내 보충](2026-10-06-국내보충.md) 참고 | |\n\n추가 메모: 10-03 보고서의 FortiMail(CVE-2026-104286)은 10/2 보도 기준 **수정 패치가 아직 출시되지 않았다**(여러 브랜치가 '예정'). 우회책(IBE 비활성화, 관리면 제한)에 의존 중이므로 벤더 공지를 계속 확인한다. KEV 기한은 10/4였다.\n\n## 2. 이슈별 분석\n\n### [D20261006-citrix-saml] Citrix NetScaler SAML CVE-2026-88779\n> 날짜: 2026-10-04 · 유형: 엣지 장비 취약점 · 행위자: 미귀속 · 지역: 글로벌 · 근거: 확인\n\n**쉽게 말하면**: 회사 원격 접속 장비(NetScaler)에서 또 하나의 결함이 공격에 쓰이고 있습니다. 로그인(SAML 방식) 처리 부분의 결함이며, 벤더는 서비스 중단 위험이라고 했지만 연구자들은 명령 실행으로 이어질 가능성도 봅니다. 10-03 보고서의 Citrix 건과는 별개의 결함입니다.\n\n**먼저 할 일(초보용)**: SAML 로그인을 쓰는 장비인지 확인하고, 수정 버전으로 올린 뒤 접속 중인 세션을 모두 끊으세요. 이미 침해됐을 수 있는 장비라면 그 장비에서 새 비밀번호·키를 만들지 마세요.\n\n**개요**: CISA가 10/4 KEV에 등재했다(기한 10/7). SAML 인증(서비스 제공자 SP 또는 인증 제공자 IdP 구성)을 쓰는 NetScaler ADC·Gateway의 메모리 버퍼 오버플로이며 CVSS v4 8.7이다. 벤더가 확인한 것은 DoS 영향이며, 아래 셸 명령·다운로드·크래시는 관리자 관측 보고이고 이 CVE와의 인과는 미확인이다. 수정 버전은 14.1-73.41, 13.1-64.28(FIPS: 14.1-73.41 FIPS, 13.1-37.282)이다(보도 기준, 벤더 공지 원문 재확인 필요).\n\n**왜 일어났나**\n- 직접 원인 [보도]: 인증 처리(`nsaaad` 프로세스)의 메모리 오버플로. 벤더는 \"미조치 장비에 대한 표적 공격으로 서비스 거부 가능\"이라 밝혔다.\n- 구조적 원인 [추정]: (1) 인증·VPN 장비가 인터넷에 직접 노출 (2) 같은 제품군에서 몇 주 사이 연속 제로데이 (3) 장비 내부 EDR 부재.\n- 실행 가능성 [보도]: 관리자들이 사용자명 필드에 셸 명령이 삽입된 공격 요청을 관측했고, 그 요청이 외부 IP `213.209.159[.]55`에서 페이로드를 내려받으려는 시도를 관측했고 `nsaaad`가 반복 비정상 종료했다. 이것이 성공한 명령 실행인지는 확인되지 않았다.\n\n**침투 경로 [추정]**: 인터넷에 노출된 SAML 인증 엔드포인트에 조작 요청 → 프로세스 충돌(서비스 거부) 또는 명령 실행 시도 → 외부 페이로드 내려받기 시도. 이후 행위는 공개 자료에 없다.\n\n**어떻게 조치하나**\n- 즉시: 증거(로그·설정·메모리)를 신속히 보존하되 패치를 미루지 말고 수정 버전 적용. 패치 후 활성 세션 종료. 최근 다른 Citrix 취약점 때문에 패치했더라도 이 건은 별도로 확인.\n- 단기: `nsaaad` 반복 비정상 종료, 인증 로그의 셸 문자가 든 사용자명, 위 IP와의 통신 점검. 침해 의심 장비는 재구축하고 장비 저장 자격 증명·인증서·키 교체(깨끗한 기기에서).\n- 장기: 인증 장비 관리면 분리, 로그 외부 보존, 엣지 장비 긴급 패치 SLA.\n- 탐지: 인증 서비스 크래시, 사용자명 필드의 이상 문자열, 장비의 비정상 아웃바운드.\n\n**교훈**: 같은 제품군에서 한 주 사이 제로데이가 이어졌다. \"한 번 패치했으니 끝\"이 아니라 계속 점검해야 한다.\n\n> 10/4 금융당국 긴급 소집(`D20261006-finsector`) 및 서울사이버대 KISA 통보(`D20261006-seoulcyber`)는 [국내 보충 보고서](2026-10-06-국내보충.md)에서 다룬다.\n\n## 3. 우선 대응 체크리스트\n\n1. **10/7까지**: Citrix 14.1-73.41 / 13.1-64.28 이상(당시 기준). 패치 후 세션 종료, `nsaaad` 크래시·IP `213.209.159[.]55` 점검.\n2. **FortiMail**: 패치 출시 여부를 매일 확인하고 그때까지 IBE 비활성·관리면 제한.\n\n## 4. 검증 수준과 한계\n\n- Citrix CVE-2026-88779는 CISA KEV 등재(목록 직접 확인)와 BleepingComputer 보도에 근거한다. 벤더 공지 원문은 직접 확인하지 못했다.\n- ATT&CK는 v19.2 유지를 공식 사이트에서 확인했다.\n\n## 출처\n\n- CISA KEV 카탈로그 (10/4 CVE-2026-88779 등재 확인)\n- BleepingComputer: Citrix NetScaler SAML zero-day, The Register: FortiMail 제로데이(패치 미출시)\n- MITRE ATT&CK v19.2\n"},{"path":"일일/2026-10-05.md","title":"일일 보안 이슈 분석 — 2026-10-05","md":"# 일일 보안 이슈 분석 — 2026-10-05\n\n> 수집 기준: 2026-10-05 공개분([10-04 보고서](2026-10-04.md) 이후). 1차 출처·보도를 우선했다.\n> 근거 표기: **[확인]** 벤더·CISA·연구기관·정부가 직접 확인 / **보도** 언론 보도 / **[추정]** 본 보고서의 추정 / **[주장]** 공격자 일방 주장. **조치는 본 보고서의 권고**이며 벤더 공식 지침이 우선한다. 모든 '즉시' 조치는 증거(로그·메모리·디스크·클라우드 감사 기록)를 신속히 보존하되 패치를 미루지 않으며, 침해된 장비·계정에서 새 비밀을 발급하지 않는다.\n> ATT&CK 기준: **v19.2**. 사건별 매핑은 [../ATTACK/README.md](../ATTACK/README.md) 참고.\n\n## 1. 오늘의 요약\n\n| # | 이슈 | CVE | 유형 | 상태 | 즉시 조치 |\n|---|------|-----|------|------|-----------|\n| 1 | 덴마크 CPR(주민등록부) 대량 조회 | 해당 없음 | 사설 업체 접근 권한 오남용 | 약 880만 건 조회, 조사 중 | 접근 권한·조회량 통제 |\n| 2 | 국내 이슈 | | | [국내 보충](2026-10-06-국내보충.md) 참고 | |\n\n## 2. 이슈별 분석\n\n### [D20261006-dk-cpr] 덴마크 CPR(주민등록부) 대량 조회\n> 날짜: 2026-10-05 · 유형: 서드파티 접근 권한 오남용 · 행위자: 미확인 · 지역: 글로벌 · 근거: 보도\n\n**쉽게 말하면**: 덴마크 국민 신분 정보를 모아 둔 국가 등록부에, 접근 권한을 가진 민간 업체의 계정이 악용돼 약 880만 명 등록자의 이름·주소·주민번호(CPR 번호)에 무단 접근이 있었다고 보도됐습니다. 정보가 자동화된 조회로 빠져나갔다고 보도됐습니다. 복사·판매·공개 여부는 아직 알려지지 않았습니다.\n\n**먼저 할 일(초보용)**: 덴마크 거주자라면 당국 안내를 따르고 신분증 번호를 이용한 사칭(전화·문자) 시도를 경계하세요. 담당자라면 외부 업체에 준 조회 권한의 범위와 조회량 제한을 점검하세요. 비밀번호만 바꿔도 이미 얻은 주민번호는 되돌릴 수 없습니다.\n\n**개요**: 10/2 인지, 10/5 공개(보도). 사설 업체의 정당한 접근 권한이 오남용돼 대규모 자동 조회가 이뤄졌다. 약 1,100만 건 중 약 880만 명 등록자 정보에 접근했고 현재 거주자뿐 아니라 이민·사망자도 포함한다(현 국민 수가 아님)(2차 보도 기준, 정부 원문 재확인 필요).\n\n**왜 일어났나**\n- 직접 원인 [보도]: 장관이 \"민간 업체의 접근 보안이 부적절했다\"고 밝혔다. 업체 직원 계정 탈취·자격 증명 유출·내부 통제 미흡 중 무엇인지는 **확인되지 않았다**.\n- 구조적 원인 [추정]: (1) 민간 업체에 대량 조회 가능한 권한 위임 (2) 유효한 주민번호를 찾기 위한 자동 조회를 막는 속도·총량 제한 부재 가능성.\n\n**침투 경로 [추정]**: 해킹이라기보다 정상 권한으로의 자동 조회. 어떻게 권한을 얻었는지는 미공개.\n\n**어떻게 조치하나**\n- 즉시: 해당 업체 접근 차단·자격 증명 회수, 조회 로그 보존, 영향자 통지.\n- 단기: 업체별 조회 상한·이상 징후 경보, 권한 재심사.\n- 장기: 최소 권한, 외부 업체 접근을 개인 계정·MFA·IP 제한으로 통제, 식별번호 의존 인증 축소.\n- 탐지: 순차·대량 조회 패턴, 평소와 다른 시간대·출처.\n\n**교훈**: 외부 업체에 준 정당한 권한도 공격면이다. 식별번호는 한 번 새면 바꿀 수 없다.\n\n> 한국전력 직원 정보 노출(10/1)은 [국내 보충 보고서](2026-10-06-국내보충.md)의 `D20261006-kepco`에서 다룬다.\n\n## 3. 우선 대응 체크리스트\n\n1. **외부 업체 권한**: 대량 조회 가능한 계정의 목록·상한·로그 점검.\n2. **Citrix (10/7 기한)**: [10-04 보고서](2026-10-04.md)의 CVE-2026-88779 수정 버전 적용 확인.\n\n## 4. 검증 수준과 한계\n\n- 덴마크 CPR은 2차 요약(shattered.io) 한 건에 의존하며 정부 1차 자료를 확인하지 못했다. 수치·원인은 보도 수준이다.\n- 독립 검토(Codex) 반영: T1078→후보, T1119→추정으로 낮추고 880만 \"명\" 해석을 정정했다.\n\n## 출처\n\n- shattered.io: 덴마크 CPR 유출 요약(2차)\n- MITRE ATT&CK v19.2\n"},{"path":"일일/2026-10-06-국내보충.md","title":"국내 보안 이슈 보충 — 2026-10-06","md":"# 국내 보안 이슈 보충 — 2026-10-06\n\n> 이 문서는 해외 이슈 위주로 정리하던 일일 보고서에서 **빠졌던 국내 이슈**를 보충한 것이다(수집 기간: 2026-09-18 ~ 10-06). 해외 이슈는 `2026-10-03.md`와 `2026-10-06.md`를 본다. 티빙 사건은 [과거3년/2026.md](../과거3년/2026.md)에 있다.\n> 근거 표기: **[확인]** 정부·금융당국·해당 기관이 밝힌 내용 / **보도** 언론 보도 / **[추정]** 본 보고서 / **[주장]** 일방 주장. 구조적 원인은 본 보고서의 분석이다. **조치는 본 보고서의 권고**이며 기관 공식 지침이 우선하고, 모든 '즉시' 조치는 증거(로그·메모리·디스크·클라우드 감사 기록)를 신속히 보존하되 패치를 미루지 않으며 침해된 시스템에서 새 비밀을 발급하지 않는다.\n\n## 1. 오늘의 요약\n\n| # | 이슈 | 규모 | 상태 |\n|---|------|------|------|\n| 1 | 금융권 동시다발 해킹 (신한·KB·하나·BNK부산·예가람·현대캐피탈·웰컴) | 7곳, 기관별 발표 합산 약 6.6만 명 + 법인정보 2,200건 | 조사 중, 금융당국 10/4 긴급 소집 |\n| 2 | 한국전력 전 직원 정보 노출 | 약 2.4만 명(7개 항목) | 삭제 완료, 경위 조사 중 |\n| 3 | 서울사이버대 개인정보 유출 | 규모·시점 조사 중 | KISA 통보 10/4 |\n| 4 | 외교부(국립외교원 온라인교육시스템) 개인정보 유출 | 최대 1만 건 | 인지 2026-02, 책임 조치 없음 보도(10/6) |\n\n## 2. 이슈별 분석\n\n### [D20261006-finsector] 금융권 동시다발 해킹 (AI 자동화 공격 정황)\n> 날짜: 2026-09-29 · 유형: 다수 금융사·자동화 공격 · 행위자: 미귀속(연관성 조사 중) · 지역: 한국 · 근거: 보도\n\n**쉽게 말하면**: 9월 말부터 10월 초 사이 금융사 7곳에서 개인정보 유출이 보고됐습니다. 같은 공격자의 IP가 여러 곳에서 발견돼 서로 연관된 공격인지 조사 중이고, 일부 사건에서 AI 도구의 흔적이 보도됐지만 실제로 쓰였는지는 공식 확인되지 않았습니다.\n\n**먼저 할 일(초보용)**: 이용자는 금융사 안내를 확인하고, 대출·한도를 미끼로 한 의심 전화·문자를 조심하세요. 담당자는 대출 조회·업무 지원·영업 지원처럼 바깥에서 접속하는 업무 시스템의 인증과 접근 통제, 이상 접속 탐지부터 점검하세요.\n\n**개요**: 피해 금융사와 규모는 보도 기준으로 신한은행 25,729명(9/29~30 발생, 이름·전화번호·연소득·대출 산출한도 등, 일부는 주민등록번호 66건·연계정보 97건 포함), 예가람저축은행 약 4만 명, KB국민은행 119명(9/30 밤, 직원용 모바일 업무지원 시스템), 하나은행 89명(영업지원시스템 ODS), 현대캐피탈 146명(대출모집인), BNK부산은행 11명(외주 개발 직원), 웰컴저축은행 법인정보 최대 2,200건이다. 기관별 발표 인원을 단순 합산하면 약 6.6만 명이며 기관 간 중복 여부는 확인되지 않았다(법인정보는 별도). 금융위원회와 금융감독원은 **10/4 오후 2시 정부서울청사에서 전 금융권 협회장과 피해 금융사 최고경영자를 긴급 소집**했다. 금융감독원·금융보안원이 같은 공격자 IP를 공유하며 추가 피해를 찾고 있다고 보도됐다. 피해 인원은 계속 갱신될 수 있다.\n\n**왜 일어났나**\n- 직접 원인 [보도: 각 금융사 보고]: **대출 조회, 업무 지원 서비스, 영업지원시스템** 같은 외부 접점 서비스가 공격 통로로 보고됐다. 구체적인 취약점(CVE 등)이나 침투 방법은 공개되지 않았다.\n- AI 정황 [보도, 미확정]: 신한 관련 공격 서버에서 오픈소스 LLM 기반 자율 침투 테스트 도구 'ARTEX'의 흔적이 발견됐다는 보도가 있다. 그러나 **실제로 쓰였는지는 공식 확인되지 않았고**, 공개 도구라 흔적만으로 공격자를 특정하기 어렵다. 보안업체의 특정 재현 환경에서는 대상 작업이 22초, 약 0.88달러로 가능했다고 보도됐으나 이는 실제 사건의 소요 시간·비용이 아니다. BNK부산은행은 10/1 밤 AI 에이전트를 이용한 웹서버 공격 시도가 있었고 대부분 차단됐으나 후속 점검에서 외주 직원 정보 유출이 확인됐다(보도). 공통 IP는 연관성의 단서일 뿐 동일 공격자의 확정 근거는 아니다.\n- 구조적 원인(분석, 추정): (1) 보조 업무 시스템(모집인·외주·영업지원)의 인증·접근 통제가 약했을 가능성 (2) 조회 서비스가 주민등록번호 같은 민감정보를 다룸 (3) 자동화 공격의 속도에 비해 탐지·차단이 늦을 수 있음 (4) 금융사 간 공격 정보 공유 시차\n\n**침투 경로 [추정: 중간 단계 미공개]**: 외부 접점 업무 시스템 공격 → 고객 정보 조회·추출 → (BNK부산은행 일부 사례) 유출 자료를 외부 사이트에 올림(위키 서술, 미확인)\n\n**어떻게 조치하나**\n- 즉시: 증거 보존 후 금융보안원이 공유한 공격자 IP 차단과 과거 로그 소급 조회(IP는 바뀔 수 있으므로 요청 패턴·파일 흔적 같은 다른 지표를 함께 사용), 영향 시스템 격리·계정 재설정, 피해자·모집인 통지와 2차 피해(대출 사기) 안내\n- 단기: 외부 접점 업무 시스템 전수 점검(인증, 접근 IP 제한, 요청 속도 제한), 사용자별 조회 권한·서비스 계정 최소 권한·API 인증/인가 점검, 모집인·외주 계정에 2단계 인증, 대량 조회·순차 식별자 조회 알림, 웹서버 취약점 점검과 WAF 로그 소급 분석\n- 장기: 조회 화면의 개인정보 최소화·마스킹, 봇·자동화 공격 탐지, AI 기반 공격을 가정한 모의훈련, 금융권 위협 정보 실시간 공유, 외주 업체 보안 점검\n- 탐지: 같은 IP·ASN이 여러 금융사에 접속, 사람이 하기 어려운 속도의 반복 요청, 평소와 다른 조회량\n\n**교훈**: 공격 통로가 대출 조회·영업지원 같은 **보조 업무 시스템**으로 보고됐고, 공격은 여러 회사를 잇달아 노렸다. 한 곳이 당하면 다른 곳의 IP·수법 정보를 바로 공유해야 한다.\n\n### [D20261006-kepco] 한국전력 전 직원 개인정보 외부 노출\n> 날짜: 2026-10-01 · 유형: 정보 노출 · 행위자: 미확인(해킹 여부 미확인) · 지역: 한국 · 근거: 보도\n\n**쉽게 말하면**: 한국전력 전 직원 약 2만 4천 명의 이름·연락처·이메일·직위 등이 외부 웹페이지에 올라와 있었습니다. 국정원이 먼저 발견해 알렸고 약 32시간 뒤 삭제됐습니다. 한전은 주민번호·주소 같은 민감정보와 고객 정보는 노출되지 않았다고 밝혔습니다. 해킹인지 실수인지는 아직 확인되지 않았습니다.\n\n**먼저 할 일(초보용)**: 직원은 한전·협력사를 사칭한 피싱 메일·문자를 조심하세요. 담당자는 노출 경위가 해킹인지 설정 실수인지 밝혀질 때까지 관련 접근 기록을 보존하고, 같은 식으로 공개된 페이지가 더 없는지 점검하세요.\n\n**개요**: 한전은 10/1 오후 4시경 전 직원(약 2만 4천 명)의 정보 7개 항목이 특정 외부 웹페이지에 노출됐다고 밝혔고, 국정원이 처음 발견해 통보한 뒤 10/3 새벽 0시경 삭제가 끝났다(보도). 같은 사건을 다룬 [2026-10-06.md](2026-10-06.md)의 초기 정리는 이 문서로 통합했다.\n\n**왜 일어났나**\n- 직접 원인: **노출 경위는 조사 중**이며 외부 공격인지 내부 설정·관리 실수인지는 확인되지 않았다.\n- 구조적 원인(분석, 추정): 외부에 공개된 자기 정보를 찾는 점검이 있었는지는 공개되지 않았다. 국정원 통보로 알게 됐다는 사실은 확인되지만 자체 탐지 여부는 알 수 없다.\n\n**어떻게 조치하나**\n- 즉시: 노출 페이지 삭제(완료)와 함께 게시·접근 로그 보존, 검색 캐시까지 삭제됐는지 확인, 직원 대상 2차 피해(사칭) 주의 안내\n- 단기: 노출 경위 확인, 외부 검색엔진·유출 사이트에 우리 정보가 올라와 있는지 정기 점검\n- 장기: 전사 개인정보 공개 기준과 승인 절차, 외부 노출 자산 모니터링, 삭제 요청 절차의 시간 목표 설정\n- 탐지: 내부 명단 형식의 데이터가 외부 공개 페이지·게시판에 올라오는지 감시\n\n**교훈**: 직원 명단은 **사칭 피싱의 재료**다. 알게 된 뒤 삭제까지 걸리는 시간이 피해를 좌우한다.\n\n### [D20261006-seoulcyber] 서울사이버대 개인정보 유출\n> 날짜: 2026-10-04 · 유형: 개인정보 유출 · 행위자: 미귀속 · 지역: 한국 · 근거: 보도\n\n**쉽게 말하면**: KISA(한국인터넷진흥원)가 학교 구성원의 개인정보로 보이는 자료가 외부 사이트에 올라와 있다고 알려 왔고, 학교는 성명·학번·연락처·주소 등이 유출된 것으로 확인했습니다. 주민번호·비밀번호·계좌번호는 암호화된 채 유출됐고, 발표 시점까지 풀린 정황은 확인되지 않았다고 학교는 설명합니다. 규모와 시점은 조사 중입니다.\n\n**먼저 할 일(초보용)**: 재학생·졸업생·교직원은 학교 공지를 확인하고, 학교를 사칭한 문자·전화를 조심하며, 같은 비밀번호를 쓰는 다른 서비스도 바꾸세요. 담당자는 암호화 키가 함께 유출됐는지부터 확인하세요.\n\n**개요**: 학교는 10/4 KISA로부터 외부 사이트 게시 통보를 받았다. 유출 항목은 성명, 학번, 생년월일, 연락처, 이메일, 주소, 학과, 학적 상태, 입학·학력 정보 등이다(보도).\n\n**왜 일어났나**\n- 직접 원인: 유출 경로는 공개되지 않았다. 규모·시점은 조사 중이다.\n- 구조적 원인(분석): 공개된 정보만으로는 구조적 원인을 판단하기 어렵다. KISA 통보로 사건을 확인했다는 점만 확인되며, 자체 탐지 여부와 통보 전 인지 경위는 공개되지 않았다.\n\n**어떻게 조치하나**\n- 즉시: 증거 보존, 유출 자료 확인·삭제 요청, 구성원 통지와 2차 피해(사칭 전화) 안내\n- 단기: 암호화 키 노출 여부와 복호화 가능성 점검, 웹·학사 시스템 접근 로그 소급 분석, 외부 노출 자산과 관제 대상 목록 대조, 로그 수집 누락·보존 기간 점검\n- 장기: 학사 정보 최소 보관·파기, 외부 유출 모니터링, 보안 인력·예산 확충\n- 탐지: 외부 유출 사이트 모니터링, 학사 DB의 대량 조회\n\n**교훈**: **암호화는 키가 지켜질 때만 의미**가 있다. 암호문이 유출됐다는 것과 보호 효과가 사라졌다는 것은 다르므로 키 유출 여부를 먼저 확인한다.\n\n### [D20261006-mofa] 외교부(국립외교원 온라인교육시스템) 개인정보 유출\n> 날짜: 2026-02-01 · 유형: 장기 체류·개인정보 · 행위자: 미귀속 · 지역: 한국 · 근거: 보도\n\n**쉽게 말하면**: 국립외교원 온라인교육시스템이 2025년 4~5월에 장악당해 약 10개월 동안 접근이 이어졌고, 현직·전직 외교부 직원 최대 1만 건의 정보(이름·아이디·이메일·암호화된 비밀번호 등)가 유출됐습니다. 외교부는 2026년 2월 초에 알았고, 국회 의원실 자료에 따르면 보도 시점(10/6)까지 책임자에 대한 인사·감찰 조치가 없었습니다.\n\n**먼저 할 일(초보용)**: 해당 시스템 이용자는 같은 비밀번호를 쓰는 다른 서비스도 바꾸고 외교·공무 사칭 메일을 조심하세요. 담당 기관은 방화벽이 열린 경위와 보안관제에서 빠진 이유를 조사해 재발 방지부터 하세요.\n\n**개요**: 보도에 따르면 공격자가 2025년 4~5월 서버를 장악한 뒤 2026년 2월까지 약 10개월간 접근했고 외교부는 2월 초 사실을 인지했다. 국회 의원실(안철수 의원) 자료로는 방화벽 개방 경위, 보안관제 대상에서 제외된 이유, 손해배상 책임 판단이 아직 마무리되지 않았고 인사·감찰 조치도 없다(2026-10-06 보도).\n\n**왜 일어났나**\n- 직접 원인: 서버 장악 경로는 공개되지 않았다. **방화벽이 열린 경위와 보안관제 제외 사유가 조사 중**이다.\n- 구조적 원인(분석, 추정): 해당 시스템이 보안관제 범위 밖에 있었을 가능성, 약 10개월 동안 접근을 발견하지 못한 점은 조사 쟁점이다. 인사·감찰 조치가 없다는 것이 사고 대응 전체의 부재를 뜻하지는 않는다.\n\n**어떻게 조치하나**\n- 즉시: 시스템 격리·재구축 판단, 접근 로그 보존, 이용자 통지와 비밀번호 변경 안내\n- 단기: 보안관제 대상 자산 목록 전수 점검(교육·부속 시스템 포함), 방화벽 정책 재검토, 로그 수집 누락·보존 기간·경보 처리 여부 점검\n- 장기: 장기 침해 대비 위협 헌팅, 로그 보존 기간 확대, 사고 책임·재발 방지 절차 정립\n- 탐지: 관제 목록에 없는 서버의 외부 통신, 장기간 낮은 빈도의 반복 접근\n\n**교훈**: 중요하지 않다고 본 **부속 시스템**이 관제에서 빠져 있으면 10개월도 못 볼 수 있다.\n\n## 3. 교차 분석 — 이번에 확인한 국내 사건에서 보이는 점\n\n> 표본은 사건 4건(티빙 포함 시 5건)이며 대표성이 없다. 추세가 아니라 관찰이다.\n\n1. **보조·부속 시스템이 점검 대상으로 드러났다**: 금융권은 대출 조회·영업지원 같은 업무 시스템이, 외교부는 교육 시스템이 대상이었다. 티빙·서울사이버대·한전은 최초 침투 지점이 공개되지 않았다.\n2. **외부 통보로 알게 된 사례가 있다**: 한전(국정원)과 서울사이버대(KISA)는 외부 기관 통보로 확인했다. 자체 탐지 여부는 공개되지 않았으므로 '탐지 실패'로 단정하지 않는다. 외교부는 약 10개월간 접근을 발견하지 못한 것이 조사 쟁점이다.\n3. **키와 암호화의 한계**: 티빙은 접속키와 암호화 키가 함께 유출돼 보호 효과가 약해졌다. 서울사이버대는 암호화된 채 유출됐고 발표 시점까지 복호화 정황이 확인되지 않았다. 두 사례를 같은 실패로 묶지 않는다.\n4. **자동화 공격 정황은 보도 수준**: 금융권 사건에서 AI 도구 흔적이 보도됐으나 확정이 아니며, 일곱 곳 전체에 적용할 수 없다.\n\n## 4. 우선 대응 체크리스트\n\n1. **외부에서 접속되는 보조 업무 시스템 목록**을 만들고 인증(2단계), 접근 IP, 요청 속도 제한, 서비스 계정 최소 권한을 점검한다.\n2. **우리 정보가 밖에 있는지 스스로 찾는다**: 외부 사이트 모니터링, 대량 조회·반출 알림. 외부 통보에만 기대지 않는다.\n3. **키 관리**: 접속키·암호화 키를 코드·개발 PC에 두지 말고 전용 보관소에서 관리하고 정기 교체. 데이터 접근 권한과 키 관리 권한을 분리한다.\n4. **관제 대상 자산 전수 점검**: 교육·부속·외주 시스템과 로그 수집 누락을 확인한다.\n5. **금융권**: 공유된 공격자 IP를 소급 조회하되 다른 지표도 함께 쓰고, 외주·모집인 계정을 점검한다.\n6. **개인정보 보유 기간**: 휴면·탈퇴 정보의 보유 목적·기간과 파기 의무 준수를 점검한다(티빙 사건).\n\n## 5. 검증 수준과 한계\n\n- 금융권 사건의 피해 규모는 파이낸셜뉴스(10/4) 보도의 기관별 발표 합산이며, 금융사별 공식 발표와 다를 수 있고 기관 간 중복은 확인되지 않았다.\n- AI 도구(ARTEX) 사용은 **확정되지 않았다**. 'ARTEX' 흔적과 22초·0.88달러 재현 결과는 보도 기준이다.\n- 금융권 사건의 날짜별 타임라인 일부(예가람 9/18 최초 침해 등)는 위키 서술이라 확인하지 않았다.\n- 한전·서울사이버대·외교부는 경위가 공개되지 않아 ATT&CK 매핑을 하지 않았다.\n- 이 문서는 해외 이슈를 다루지 않는다.\n- 독립 검토(GPT): 비민감 요약으로 한 번 받아 단정 완화, 매핑 조정(근거 없는 항목 제외), 조치 보강을 반영했다.\n\n## 출처\n\n- 파이낸셜뉴스(10/4) 금융사 7곳 피해 집계, 한국일보(10/3) 2금융권 확산·금융당국 긴급 소집, 디지털타임스·이데일리·전자신문·서울신문 AI 자동화 공격 정황 보도\n- YTN·MBC·국제뉴스 한국전력 직원 정보 노출 보도, 헤럴드경제·국제뉴스·데일리안 서울사이버대 보도, 데일리안(10/6) 외교부 보도\n"},{"path":"일일/2026-10-06.md","title":"일일 보안 이슈 분석 — 2026-10-06","md":"# 일일 보안 이슈 분석 — 2026-10-06\n\n> 수집 기준: 2026-10-06 공개분([10-04](2026-10-04.md)·[10-05](2026-10-05.md) 보고서 이후). 1차 출처·벤더 보안 권고와 국내 보도를 우선했다.\n> 근거 표기: **[확인]** 벤더·CISA·연구기관·정부가 직접 확인 / **보도** 언론 보도 / **[추정]** 본 보고서의 추정 / **[주장]** 공격자 일방 주장. **조치는 본 보고서의 권고**이며 벤더 공식 지침이 우선한다. 모든 '즉시' 조치는 증거(로그·메모리·디스크·클라우드 감사 기록)를 신속히 보존하되 패치를 미루지 않으며, 침해된 장비·계정에서 새 비밀을 발급하지 않는다.\n> ATT&CK 기준: **v19.2**. 사건별 매핑은 [../ATTACK/README.md](../ATTACK/README.md) 참고.\n\n## 1. 오늘의 요약\n\n| # | 이슈 | CVE | 유형 | 상태 | 즉시 조치 |\n|---|------|-----|------|------|-----------|\n| 1 | SonicWall SMA1000 Work Place 사전 인증 SSRF | CVE-2026-102255 | 서버 측 요청 위조(CVSS 10.0), 비인가 내부 요청 | 벤더 긴급 보안 권고 공개 | 최신 핫픽스 적용 및 Work Place 외부 노출 제한 |\n| 2 | 국내 이슈(금융권 동시다발 해킹·한전·서울사이버대·외교부) | | | [국내 보충](2026-10-06-국내보충.md) 참고 | |\n\n## 2. 이슈별 분석\n\n### [D20261006-sonicwall-sma] SonicWall SMA1000 Work Place 사전 인증 SSRF (CVE-2026-102255)\n> 날짜: 2026-10-06 · 유형: 엣지 장비 취약점 · 행위자: 미귀속 · 지역: 글로벌 · 근거: 확인\n\n**쉽게 말하면**: 원격 접속 장비인 SonicWall SMA1000 시리즈의 사용자 포털(Work Place) 인터페이스에서 로그인하지 않은 외부 공격자가 장비로 하여금 내부 기능에 요청을 보내게 만들고 비인가 작업을 수행할 수 있는 최고 위험도(CVSS 10.0) 결함이 공개됐습니다.\n\n**먼저 할 일(초보용)**: SonicWall SMA1000 장비를 운영 중이라면 벤더 권고에 따른 최신 패치(12.4.3-03312 이상)를 즉시 적용하고, Work Place 포털과 관리 인터페이스의 불필요한 외부 노출을 차단하세요.\n\n**개요**: SonicWall이 SMA1000(Secure Mobile Access) 어플라이언스의 Work Place 웹 인터페이스에서 발생하는 사전 인증 서버 측 요청 위조(SSRF) 및 대체 경로 접근 취약점(CVE-2026-102255, CVSS v3.1 10.0)을 공개했다. 인증되지 않은 원격 공격자가 조작된 요청을 보내 어플라이언스 내부 서비스와 통신하거나 비인가 동작을 유발할 수 있다.\n\n**왜 일어났나**\n- 직접 원인 [확인]: Work Place 인터페이스의 요청 경로 처리에서 의도치 않은 대체 경로(alternate path)를 통한 내부 요청 전달을 차단하지 못한 결함(CWE-918, CWE-424).\n- 구조적 원인 [추정]: 원격 접속(VPN) 장비의 웹 포털이 외부 인터넷에 직접 노출되는 구조에서, 프록시·내부 API 호출 경계의 인증 전 입력 검증이 미흡할 경우 단일 결함이 장비 전체 위험으로 직결된다.\n\n**침투 경로 [추정]**: 외부에 노출된 SMA1000 Work Place 포털에 조작된 사전 인증 요청 전송 → 장비 내부 서비스로 SSRF 발생 → 비인가 내부 기능 호출.\n\n**어떻게 조치하나**\n- 즉시: 증거(접근 로그·설정) 보존 후 SonicWall 공식 권고에 따른 최신 펌웨어/핫픽스 즉시 적용.\n- 단기: Work Place 및 관리 콘솔의 비정상 요청 로그 점검, 의심 징후 발견 시 세션 초기화 및 자격 증명 재발급.\n- 장기: 경계 장비 관리 인터페이스 인터넷 노출 차단 및 접근 IP 제한.\n- 탐지: Work Place 엔드포인트에 대한 비정상 경로·프록시성 요청 패턴 모니터링.\n\n**교훈**: SMA1000 제품군은 올해(CVE-2026-15409 등) 반복적으로 SSRF·인증 우회 결함이 발견되고 있어
