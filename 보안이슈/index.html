특정 키워드(기관명·고위직 성명 등)로 자사 문서가 업로드되는지 정기적으로 검색하는 모니터링 체계를 둔다.\n\n**교훈**: 이번 사건은 \"해킹당했다\"는 사건이 아니라 \"실수로 올린 파일을 5개월간 아무도 몰랐다\"는 사건이다. 기술적 방어(암호화, 접근 통제)가 아무리 튼튼해도, 문서를 다루는 사람의 작은 습관(검사 사이트 업로드) 하나가 그 방어를 통째로 건너뛸 수 있다는 점을 보여준다.\n\n### [D20261104-taegwang] 국내 보안기업 태광네트웍정보, 에베레스트 랜섬웨어 조직이 263GB 탈취 주장(공급망 영향 우려)\n> 날짜: 사고 발생(회사 추정) 2026-10-12경 · 회사 공지 2025-10-21(원문 표기 그대로, 보도 시점과 선후관계 불일치 가능성 있음) · 다크웹 게시·보도 2026-11-03~04 · 유형: 네트워크·보안 기업 내부 계정 침해(최초 침투 경로 미공개) · 행위자: 에베레스트(Everest) 랜섬웨어 조직(주장) · 지역: 한국 · 근거: 확인(회사 자체 공지: 계정 비정상 접근·일부 자료 유출)·주장(탈취 규모 263GB는 공격자 주장)\n\n**쉽게 말하면**: 안랩 보안장비의 공공 부문 총판과 KT 매니지드 보안 사업 등을 맡아 온 국내 네트워크·보안 전문기업 태광네트웍정보가 해킹당했습니다. 회사는 업무용 Microsoft 365 원드라이브(클라우드 저장소) 계정에 외부의 비정상 접근이 있었고 일부 자료가 유출됐다고 공지했습니다. 그런데 랜섬웨어 조직 '에베레스트'는 다크웹에 이보다 훨씬 큰 규모(약 263GB, 5만 4,581개 파일)를 탈취했다고 주장하며, 여기에 병원·공공기관·금융회사·KT·안랩 등 여러 기관·협력사 이름이 담긴 자료가 포함된다고 밝혔습니다. 이 주장이 사실인지, 회사가 인정한 범위를 넘어서는지는 독립적으로 확인되지 않았습니다. 다만 이 회사가 다수 기관의 네트워크 구축·보안 유지보수를 담당해 왔기 때문에, 만약 고객사 기술자료(네트워크 구성도, 인증정보 등)가 실제로 유출됐다면 그 고객사들까지 위험이 번질 수 있다는 점이 우려됩니다.\n\n**먼저 할 일(초보용)**: 태광네트웍정보와 거래했거나 그 담당자인 조직은, 이 회사에 제공했던 네트워크 구성도·인증정보 등 기술자료의 종류와 외부 유지보수 계정 사용 여부를 지금 확인하세요. 또한 태광네트웍정보 직원을 사칭한 거래·계좌변경 요청 전화·메일은 사실 확인 전까지 응하지 마세요.\n\n**개요**: 태광네트웍정보는 업무용 Microsoft 365 원드라이브 계정에 외부의 비정상 접근이 있었고 그 계정의 일부 자료가 유출됐다고 공지했다(회사는 사고 발생을 10월 12일경으로 추정). 공격자가 이 계정에 어떤 방식으로 접근했는지(최초 침투 경로)는 공개되지 않았고, 서버나 업무용 PC가 랜섬웨어에 감염돼 암호화됐다는 사실도 확인되지 않았다. 반면 랜섬웨어 조직 에베레스트는 다크웹 게시물에서 약 263.71GB, 5만 4,581개 파일을 확보했다고 주장했다. 게시물에는 62개 항목으로 분류된 자료가 있으며, 회사 사업·재무자료, 고객사별 네트워크 구축·유지보수 자료, 장비 설정, 인증정보, 일부 소스코드, 개인정보가 포함된다고 주장한다. 게시물에는 병원, 공공기관(KDI, 서울교통공사 등), 금융회사, 대학·국제학교, KT, 안랩, 포티넷, 시스코 등 75개 명칭이 언급되는데, 이는 피해 기관 수가 아니라 협력사·제조사·과거 사업 수행기관 등이 섞여 있을 수 있는 숫자라는 점을 데일리시큐 보도도 분명히 하고 있다. 회사가 공식적으로 인정한 유출 항목은 담당자 이름과 휴대전화번호·이메일 주소 수준이며, 공격자 주장 규모나 고객사 기술자료 포함 여부는 공지에 명시돼 있지 않다. 데일리시큐가 게시물을 입수해 KISA에 전달했고, KISA가 회사에 통보해 조사가 이뤄졌다. 회사는 해당 M365 계정을 비활성화하고 개인정보보호위원회·KISA에 신고했으며, 거래처를 사칭한 송금·계좌변경 요청에 주의를 당부했다.\n\n**왜 일어났나**\n- 직접 원인 [미공개]: 업무용 M365 원드라이브 계정에 비정상 접근이 있었다는 사실만 확인됐고, 공격자가 이 계정에 접근한 구체적 방법(피싱, 자격 증명 탈취, MFA 미적용 등)은 공개되지 않았다.\n- 구조적 원인 [추정 — 분석]: 네트워크·보안 전문기업은 업무 특성상 다수 고객사의 네트워크 구성도·인증정보·원격 유지보수 접속 정보를 보유하기 쉽다. 이런 기업의 클라우드 협업 계정 하나가 뚫리면, 그 기업 자체보다 거기 보관된 '고객사 정보'가 더 큰 공급망 위험으로 번질 수 있는 구조다.\n\n**침투 경로 [미공개 — ATT&CK 매핑 제한적]**: 최초 침투 방법은 공개되지 않아 초기접근 기법은 매핑하지 않는다. 다만 \"업무용 M365 원드라이브 계정에서 자료가 유출됐다\"는 점은 회사가 직접 확인한 사실이다.\n\n**어떻게 조치하나**\n- 즉시: (회사 조치, 보도 기준) 해당 M365 계정 비활성화, 추가 비정상 접근 차단, 개인정보보호위원회·KISA 신고. (본 보고서의 권고) 태광네트웍정보와 거래한 기관은 공유한 기술자료의 종류, 외부 유지보수 계정 존재 여부, 접근 기록을 증거 보존 차원에서 먼저 확인한다.\n- 단기: 거래 기관은 태광네트웍정보에 제공했던 네트워크 구성도·IP 체계·방화벽 정책·인증정보가 실제로 이번 유출(의심) 범위에 포함되는지 회사 측에 직접 확인하고, 포함 가능성이 있다면 관련 장비의 관리자 계정·원격 접속 정보를 선제적으로 교체한다.\n- 장기: 보안·네트워크 협력사와의 계약에 기술자료 보관 기간·암호화·접근 통제 기준을 명시하고, 정기적으로 협력사의 보안 수준을 점검하는 절차를 둔다.\n- 탐지: 거래처를 사칭한 송금·계좌변경 요청, 공식 확인된 담당자 이름·연락처를 이용한 표적 피싱 시도를 주의 깊게 점검한다.\n\n**교훈**: 공격자의 탈취 규모 주장(263GB)과 회사가 공식 인정한 범위(담당자 연락처 수준) 사이에 큰 차이가 있다는 점은, 다크웹 주장을 검증 없이 그대로 받아들이면 과장된 공포를 퍼뜨릴 수도, 반대로 회사의 공지만 믿으면 실제 위험을 과소평가할 수도 있음을 보여준다. 보안·네트워크 기업이 뚫렸을 때는 그 기업 자체의 피해보다 \"그 기업이 보관한 고객사 정보\"의 위험을 먼저 따져야 한다.\n\n### [D20261104-cpguard] 서버 보안 제품 cPGuard, 업데이트 배포망(CDN) 변조로 약 2,946대에 백도어·정보탈취 스크립트 유포\n> 날짜: 변조 시작 2026-11-02 02:06(UTC) · 벤더 탐지·차단 약 12시간 내 · 보도 2026-11-03 · 유형: 소프트웨어 공급망(업데이트 배포망) 변조 · 행위자: 미귀속(탈취한 자격 증명 사용) · 지역: 전 세계(해외) · 근거: 확인(벤더 OpsShield 자체 확인)\n\n**쉽게 말하면**: cPanel·DirectAdmin·Plesk 같은 서버 관리 도구와 함께 쓰이는 보안 제품 'cPGuard'의 업데이트 배포망(CDN)이 해킹당해, 정상 업데이트 경로로 백도어와 정보탈취 스크립트가 유포됐습니다. 제조사 OpsShield는 11월 2일 공격자가 탈취한 계정으로 배포망에 접근해 악성 스크립트를 심었다고 밝혔고, 이 기간(버전 5.88.12~5.88.19)에 업데이트를 받은 서버는 비밀번호 해시·데이터베이스 설정·루트 계정의 SSH 키 등 민감한 파일을 노려 공격자에게 전송하는 스크립트가 함께 설치됐습니다. 회사는 2,946대의 서버가 영향을 받았다고 확인했습니다. 호스팅 업체나 서버 관리자가 쓰는 보안 제품이 오히려 공격 통로가 된 사례입니다.\n\n**먼저 할 일(초보용)**: cPGuard를 쓰는 서버 관리자는 지금 바로 버전을 5.88.25 이상으로 업데이트하세요. 그리고 비밀번호만 바꾸는 것으로는 부족합니다 — 이미 유출됐을 수 있는 SSH 키, 데이터베이스 접속정보, 클라우드 비밀값을 모두 새로 발급해야 합니다(기존 값은 이미 공격자 손에 있을 수 있으므로 무효화가 핵심입니다).\n\n**개요**: cPGuard는 cPanel·DirectAdmin·Plesk 같은 서버 관리 도구와 함께 쓰이는 악성코드 탐지·방화벽 제품으로, Namecheap 등 호스팅사가 VPS·전용서버에 기본 제공하기도 한다. 제조사 OpsShield는 신원이 확인되지 않은 공격자가 탈취한 자격 증명으로 2026-11-02 02:06(UTC)부터 업데이트 배포 인프라(CDN)에 접근했다고 밝혔다. 자격 증명을 어떻게 탈취당했는지는 공개되지 않았다. 공격자는 정상 cPGuard 업데이트 채널로 악성 스크립트를 배포했고, 버전 5.88.12~5.88.19를 받은 서버에는 백도어와 정보탈취 스크립트가 함께 설치됐다. 이 스크립트는 리눅스 비밀번호 해시, 루트 권한 데이터베이스(MariaDB/MySQL) 설정, 루트 셸 기록, 루트 SSH 인증·known_hosts 파일을 표적으로 삼았다. 탈취된 데이터는 OpsShield의 라이선스 서버 계정(이 역시 침해됨)을 거쳐 공격자에게 전송됐다. OpsShield는 배포 12시간 내 탐지·차단했으나 업데이트 확인 주기 때문에 모든 서버가 영향받았는지는 확정하지 못했고, 2,946대가 영향을 받았으며 과금 시스템 데이터베이스도 함께 복사됐다고 확인했다.\n\n**왜 일어났나**\n- 직접 원인 [확인]: 공격자가 탈취한 자격 증명으로 cPGuard의 업데이트 배포 인프라(CDN)에 접근해, 정상 업데이트 채널을 통해 백도어·정보탈취 스크립트를 유포했다(OpsShield 자체 확인).\n- 구조적 원인 [추정 — 분석]: 보안 제품 자체의 자동 업데이트 메커니즘은 사용자가 별도로 검증하지 않고 신뢰하는 통로다. 이 통로의 배포 서버 쪽 계정 관리(단일 계정 탈취로 전체 배포망 접근 가능했는지 여부는 불명)가 뚫리면, \"보안을 지켜주는 제품\"이 거꾸로 모든 설치 서버에 악성코드를 뿌리는 통로가 된다.\n\n**침투 경로 [확인 — 배포 단계 이후]**: 공격자가 탈취한 자격 증명으로 CDN(업데이트 배포 인프라)에 접근 → 악성 버전(5.88.12~5.88.19)을 정상 업데이트 채널로 배포 → 각 서버가 업데이트를 받으며 백도어·정보탈취 스크립트 설치 → 스크립트가 SSH 키·DB 설정·비밀번호 해시 등을 수집해 라이선스 서버(역시 침해된 계정)를 거쳐 유출. 자격 증명이 애초에 어떻게 탈취됐는지(최초 침투)는 공개되지 않았다.\n\n**어떻게 조치하나**\n- 즉시: (벤더 권고) 모든 cPGuard를 5.88.25 이상으로 업데이트해 백도어·악성 파일을 제거한다. (본 보고서의 권고) 영향받은 서버는 패치 전 증거(로그, 설치 파일 타임스탬프)를 먼저 보존한다.\n- 단기: 영향 기간에 업데이트를 받은 모든 서버의 비밀번호·데이터베이스 자격 증명·클라우드 비밀값·SSH 키를 전부 폐기하고 새로 발급한다(해당 서버 안에서 새 키를 만들지 않고, 침해 가능성이 없는 별도 환경에서 생성한다).\n- 장기: 보안 제품을 포함한 모든 자동 업데이트 메커니즘에 대해, 배포 서명 검증과 배포망 접근 계정의 다중 인증을 의무화한다.\n- 탐지: 서버 관리자는 cPGuard 설치 기록에서 영향 기간(11/2 02:06 UTC 전후)에 업데이트가 이뤄졌는지, 평소와 다른 라이선스 서버 통신이 있었는지 점검한다.\n\n**교훈**: \"보안을 지켜주는 소프트웨어\"일수록 자동 업데이트에 대한 신뢰가 크기 때문에, 그 배포망이 뚫리면 피해가 더 광범위하고 빠르게 퍼진다. 보안 제품 벤더는 자사 배포 인프라 보호를 제품 기능만큼 중요하게 다뤄야 한다.\n\n### [D20261104-workos] 개발 인프라 업체 WorkOS, AI 공격 자동화 도구(ARTEX AI)로 내부 영업 시스템 침해\n> 날짜: 접근 식별 2026-10-30 · 보도 2026-11-03 · 유형: 내부 업무 시스템 침해(최초 침투 경로 미공개) · 행위자: 미귀속(ARTEX AI 프레임워크 사용 추정) · 지역: 전 세계(해외) · 근거: 확인(회사 자체 발표: 침해 사실)·추정(공격 도구, user agent 흔적 기준)\n\n**쉽게 말하면**: 로그인·인증 기능을 다른 회사들에 API로 제공하는 개발 인프라 업체 WorkOS(최소 3,000여 개 회사가 이용)가, 영업팀이 쓰는 내부 시스템에 외부인이 침입한 사실을 10월 30일 확인했다고 밝혔습니다. 회사는 \"AI 기반 공격 자동화 도구\"가 쓰였다고 설명했고, 창업자는 이 도구가 앞서 여러 사건(한국 금융권 공격, 네덜란드 허니팟 침해 등)에 쓰인 'ARTEX AI'라고 언급했습니다(공격자 흔적에서 \"artex-enrich/1.0\" 같은 식별값이 발견됨). 유출 가능 정보는 고객사의 담당자 이름·이메일·직책, 제품 사용 현황, 영업·상담 대화 요약 등이며, WorkOS는 자사의 실제 서비스(인증 API)나 고객 데이터 자체는 영향받지 않았다고 밝혔습니다.\n\n**먼저 할 일(초보용)**: WorkOS를 이용하는 기업의 담당자는 자신의 이름·연락처·소속이 이번에 노출됐을 수 있다는 점을 인지하고, 이를 이용한 표적 피싱(사칭 메일·전화)에 평소보다 주의하세요. WorkOS 자체 인증 서비스에는 영향이 없다고 발표됐으므로 일반 최종 사용자가 직접 할 일은 없습니다.\n\n**개요**: WorkOS는 \"2026년 10월 30일, 영업팀이 쓰는 내부 WorkOS 애플리케이션에 대한 비인가 접근을 확인했다\"고 발표했다. 공격자가 어떻게 최초 접근했는지는 공개되지 않았으며, 회사는 공격자가 정찰·공격 시도를 자동화하는 \"AI 기반 공격형 보안 프레임워크\"를 썼다고만 설명했다. 창업자 Michael Grinich는 이 도구가 올해 여러 사건에서 관측된 'ARTEX AI' 침투테스트 도구라고 언급했으며, 조사 과정에서 \"artex-enrich/1.0\", \"norma/0.4\" 같은 User-Agent 흔적이 공격자 요청에서 발견됐다. ARTEX AI는 중국 개발자들이 올해 초 오픈소스로 공개했다가, 한국 금융권 공격에 쓰인 뒤 비공개로 전환했지만 여러 포크(파생 사본)가 여전히 떠돌고 있다. 유출 가능 데이터는 CRM상의 담당자 이름·이메일·직책·소속, 고객 계정 이용 현황(제품 사용·연동 상태), 영업·상담·고객 슬랙 대화의 요약·일부 내용이다. WorkOS는 자사 애플리케이션 데이터나 운영 서비스(인증 API 등)는 접근·영향받지 않았다고 밝혔다. 이 침해가 CrowdStrike가 보도한 'Vapor Panda'(D20261103-vaporpanda, 200개 이상 조직을 노린 캠페인) 소행인지, 네덜란드 DIVD 허니팟 침해와 같은 공격자인지는 기사에서 특정되지 않았다 — ARTEX AI라는 \"도구\"가 같을 뿐, \"운영자\"가 같다는 근거는 없다.\n\n**먼저 할 일**과 **왜 일어났나**를 포함한 아래 분석은 공개된 정보의 한계를 반영한다.\n\n**왜 일어났나**\n- 직접 원인 [미공개]: 공격자가 내부 영업 애플리케이션에 최초로 어떻게 접근했는지(취약점 악용, 자격 증명 탈취, 피싱 등)는 공개되지 않았다.\n- 구조적 원인: 공개된 정보로는 구조적 결함을 특정할 수 없다. \"AI 기반 자동화 도구가 쓰였다\"는 설명만으로는 침투 난이도나 방어 실패 지점을 알 수 없다.\n\n**침투 경로 [미공개 — ATT&CK 매핑 보류]**: 최초 침투 방법이 공개되지 않아 이번 보고서는 이 사건에 ATT&CK 매핑을 하지 않는다(D20261103-vaporpanda·D20261103-chainalysis·D20261103-aidevbreach와 같은 이유).\n\n**어떻게 조치하나**\n- 즉시: (회사 조치, 보도 기준) 영향받은 애플리케이션의 외부 접근 차단, 내부 도구 접근 통제 재검토, 독립 포렌식·사고대응 업체 고용.\n- 단기: (본 보고서의 권고) WorkOS 이용 기업은 자사 담당자 정보가 영향받았는지 WorkOS에 직접 문의하고, 노출 가능 정보로 위장한 피싱 시도에 대해 담당자에게 사전 공지한다.\n- 장기: 영업·CRM 도구처럼 \"핵심 서비스는 아니지만 고객 정보를 다루는\" 내부 시스템에도 핵심 서비스와 동등한 접근 통제·모니터링을 적용한다.\n- 탐지: 해당 없음(공개된 정보 부족으로 구체적 탐지 지표를 제시하기 어렵다).\n\n**교훈**: \"AI가 공격했다\"는 설명이 반복해서 등장하지만(D20261103-vaporpanda 참고), 매번 구체적 침투 경로가 공개되지 않으면 독자는 실제 위험의 크기를 판단할 수 없다. 같은 \"ARTEX AI\"라는 도구명이 여러 사건에 등장하는 것은 그 도구가 널리 퍼졌다는 뜻이지, 하나의 조직이 모든 사건을 벌였다는 뜻은 아니다.\n\n### [D20261104-3amschool] 영국 한 학교 재단, AI 자동화 패턴으로 추정되는 3AM 랜섬웨어 공격으로 PC 37대 암호화\n> 날짜: 공격 활동 2026-09-10~09-19 · 연구 결과 보도 2026-11-03(Bitdefender) · 유형: 랜섬웨어(AI 자동화 의심) · 행위자: 3AM 랜섬웨어 계열(과거 Conti·Royal 연계 분석) · 지역: 영국(해외) · 근거: 보도(Bitdefender 연구 기준)\n\n**쉽게 말하면**: 영국의 한 학교 재단(여러 학교를 운영하는 단체)이 '3AM'이라는 랜섬웨어 조직의 공격을 받아 약 50대 중 37대의 컴퓨터가 암호화됐습니다. 보안업체 Bitdefender는 공격자가 명령을 40~100초 간격으로 조금씩 바꿔가며 반복 실행한 패턴을 발견했는데, 이는 사람이 아니라 AI가 자동으로 판단해 다음 명령을 내리는 방식(\"에이전틱 루프\")과 비슷하다고 분석했습니다. 다만 공격자의 컴퓨터 자체를 들여다보지 못해, 정말 AI 모델이 썼는지, 아니면 사람이 AI 모델의 답을 보고 손으로 입력을 중계했는지는 확정하지 못했습니다. 공격자는 백업서버(Veeam) 3대에서 자격 증명을 훔치고, 원래 따로 분리돼 있던 조직 내 3개 관리 영역(도메인)을 서로 신뢰하도록 연결해 접근 범위를 넓혔습니다.\n\n**먼저 할 일(초보용)**: 이 사건은 특정 학교의 사건이라 일반 이용자가 할 일은 없습니다. 조직의 IT 담당자는 Veeam 등 백업 소프트웨어에 저장된 자격 증명이 평문으로 보관되고 있는지 점검하고, 백업서버 접근 계정에도 일반 서버와 동등한 수준의 보호(MFA 등)를 적용해야 합니다.\n\n**개요**: Bitdefender는 2026-11-03 보도에서, 영국 학교 재단 하나가 '관리되지 않는(unmanaged) 호스트'를 통해 침입당해 9월 10일부터 19일까지 공격 활동이 이어졌고, 50대 중 37대가 3AM 랜섬웨어로 암호화됐다고 밝혔다. 최초 침투 방법은 Bitdefender도 확인하지 못했다. 연구팀은 공격자가 매 40~100초마다 조금씩 변형된 명령을 반복 실행한 패턴을 관측했는데, 이는 AI 에이전트가 자동으로 다음 행동을 판단해 실행하는 \"에이전틱 루프\"와 유사하다. 다만 공격자의 시스템에 직접 접근하지 못해 실제로 어떤 AI 모델이 쓰였는지, 혹은 사람이 AI의 결과물을 수동으로 중계했을 가능성을 배제할 수 없다고 명시했다. 공격자는 재무 데이터를 탈취하고, Veeam 백업서버 3대에서 자격 증명을 확보했으며, 기존에 분리돼 있던 액티브 디렉터리(AD) 도메인 3개를 양방향 트러스트(서로를 신뢰하는 관계)로 연결해 접근 범위를 넓혔다. 로그온 스크립트 폴더를 뒤져 다른 학교 관련 참조가 있는지도 탐색했다. 3AM 랜섬웨어는 2023년 LockBit이 차단된 뒤 등장한 러스트(Rust) 기반 암호화 도구로, 이후 Conti·Royal 랜섬웨어 조직과의 연관성이 분석됐다. 과거 피해 사례로 2024년 8월 미국 Kootenai Health(환자 46만 4천여 명 정보 노출)가 있다.\n\n**왜 일어났나**\n- 직접 원인 [보도 — 미확정]: 최초 침투 경로는 확인되지 않았다. 다만 백업서버 자격 증명 탈취와 AD 도메인 간 신뢰관계 확장을 통해 접근 범위를 넓힌 뒤 암호화한 것은 Bitdefender가 직접 관측했다.\n- 구조적 원인 [추정 — 분석]: 백업 소프트웨어(Veeam 등)는 복구의 '최후 수단'임에도 그 자격 증명이 일반 업무 시스템만큼 보호되지 않는 경우가 많다. 또한 조직 내에서 역사적으로 분리 운영돼 온 여러 도메인이 느슨한 신뢰 관계로 다시 연결될 수 있는 구조라면, 한 곳의 침해가 전체로 쉽게 번진다.\n- AI 자동화 의심에 대해 [추정 — 미확정]: 명령 반복 패턴이 자동화를 시사하지만, 사람이 AI를 보조적으로 쓴 것인지 AI가 주도적으로 판단한 것인지는 이번 조사로 확정되지 않았다. \"AI 랜섬웨어\"로 단정하지 않는다.\n\n**침투 경로 [부분 확인 — 침입 이후 단계만]**: 최초 침투(초기접근) 방법은 비공개라 매핑하지 않는다. 이후 단계는 Bitdefender가 직접 확인했다: Veeam 백업서버 3대에서 자격 증명 탈취 → 분리돼 있던 AD 도메인 3개를 양방향 트러스트로 연결해 접근 범위 확장 → 로그온 스크립트 폴더 탐색으로 다른 학교 관련 참조 탐색 → 재무 데이터 수집 → 약 50대 중 37대 암호화.\n\n**어떻게 조치하나**\n- 즉시: (본 보고서의 권고) 암호화되지 않은 나머지 기기를 네트워크에서 분리해 확산을 막고, 패치·복구에 앞서 증거(로그, 메모리)를 보존한다. Veeam 등 백업서버의 자격 증명은 유출로 가정하고 즉시 교체한다(침해된 네트워크 안에서 새로 발급하지 않는다).\n- 단기: 임의로 연결된 AD 도메인 간 트러스트 관계를 재검토하고, 불필요한 양방향 트러스트는 제거한다. 로그온 스크립트 등에 다른 조직·지사 정보가 노출돼 있는지 점검한다.\n- 장기: 백업 인프라를 업무망과 분리하고, 백업 자격 증명에도 MFA·최소 권한 원칙을 적용한다. 여러 학교·지사를 운영하는 조직은 도메인 간 신뢰 관계를 기본적으로 최소화하는 아키텍처를 검토한다.\n- 탐지: 짧은 간격(초 단위)으로 조금씩 변형되며 반복되는 명령 실행 패턴(자동화 의심 지표), 백업서버에 대한 비정상 접근, 신규 도메인 트러스트 생성 이벤트를 모니터링한다.\n\n**교훈**: \"AI가 랜섬웨어를 실행했다\"는 가능성 자체보다 중요한 것은, 이 사건에서 실제로 피해를 키운 것은 여전히 전통적인 약점들(백업 자격 증명 노출, 느슨한 도메인 신뢰 관계)이라는 점이다. 공격 수단이 새로워져도 막아야 할 기본기는 그대로다.\n\n### [D20261104-barracuda] 바라쿠다, 다수 보안장비에서 root 권한 탈취 가능한 치명적 결함 2건 패치\n> 날짜: 벤더 보안 공지 2026-11-03 · 유형: 보안장비 취약점(실제 악용 미확인) · 행위자: 해당 없음 · 지역: 전 세계(해외) · 근거: 확인(벤더 보안 공지)\n\n**쉽게 말하면**: 네트워크·이메일 보안 장비 회사 바라쿠다(Barracuda Networks)가 자사 여러 제품(이메일 보안 게이트웨이, 로드밸런서, 메시지 아카이버, 웹 방화벽 등)에서 공격자가 root(최고 관리자) 권한까지 얻을 수 있는 치명적 결함 2건을 공개하고 패치했습니다. 하나는 인증 절차의 약점(CVE-2026-116606), 다른 하나는 관리자 권한이 있는 사용자가 root로 명령을 실행할 수 있는 결함(CVE-2026-111560)입니다. 아직 실제로 이 결함이 공격에 쓰였다는 보도는 없지만, 관리 화면에 접근할 수 있는 공격자라면 장비를 완전히 장악할 수 있어 위험도가 높습니다.\n\n**먼저 할 일(초보용)**: 바라쿠다 제품(ESG, Load Balancer ADC, Message Archiver, WAF, WAF Control Center, Web Security Gateway)을 쓰는 조직의 담당자는 지금 바로 벤더가 안내한 패치(제품별로 다름)를 적용하고, 관리 인터페이스가 인터넷에 직접 노출돼 있다면 당장 차단하세요.\n\n**개요**: 바라쿠다는 2026-11-03 보안 공지에서 두 가지 결함을 밝혔다. CVE-2026-116606은 이메일 보안 게이트웨이(ESG)의 인증 약점으로 공격자가 장비의 전역 설정을 바꿀 수 있다. CVE-2026-111560은 OS 명령어 삽입(명령 인젝션) 결함으로, 관리자 권한을 가진 사용자가 root 권한으로 명령을 실행할 수 있다. 두 결함을 결합하면 인가 통제를 우회해 root 권한까지 얻을 수 있다. 영향받는 제품과 패치는 제품별로 다르다: ESG(두 결함 모두 해당, 패치 BNSF-40425/BNSF-40430), Load Balancer ADC·WAF(CVE-111560만 해당, 패치 BNADC-16586), Message Archiver(패치 BNMA-32468), WAF Control Center(패치 BNWF-60060), Web Security Gateway(패치 BNYF-24789). 공지는 두 결함 모두 공격자가 해당 제품의 관리 인터페이스에 접근할 수 있어야 악용 가능하다고 설명했다. CVSS 점수는 보도에서 확인되지 않았고, 실제 악용(공격) 사례는 보도되지 않았다.\n\n**왜 일어났나**\n- 직접 원인 [확인]: ESG의 인증 절차 약점과, 관리자 권한 사용자가 OS 명령을 삽입해 root로 실행할 수 있는 결함이 각 제품에 존재한다(벤더 보안 공지).\n- 구조적 원인: 실제 악용이 확인되지 않아 구조적 원인을 분석하지 않는다(취약점 공개·패치 단계).\n\n**침투 경로 [매핑 보류]**: 실행 능력(취약점)만 공개됐고 실제 공격 행위가 관측되지 않아 이번 보고서는 ATT&CK 매핑을 하지 않는다.\n\n**어떻게 조치하나**\n- 즉시: (벤더 권고) 영향받는 제품별로 안내된 패치를 적용한다. 관리 인터페이스가 인터넷에 노출돼 있다면 패치 전이라도 접근을 차단한다.\n- 단기: 관리 인터페이스 접근을 신뢰할 수 있는 내부망으로 제한하고, 관리자 계정에 MFA를 적용한다.\n- 장기: 보안 장비 자체의 관리 인터페이스를 인터넷에 노출하지 않는 것을 기본 원칙으로 삼는다(엣지 장비의 관리면 노출이 반복적으로 공격 경로가 되고 있다는 점은 이 저장소의 과거3년 총평 'A. 노출 장비·서비스 취약점' 유형과 일치한다).\n- 탐지: 해당 장비의 설정 변경 로그, 비정상적인 root 권한 명령 실행 이력을 모니터링한다.\n\n**교훈**: 보안 장비 자체가 공격 대상이 될 수 있다는 점은 반복해서 확인된다(이 저장소의 Cisco ASA/FTD, FortiMail 등 과거 사례 참고). 패치 공개 시점과 실제 악용 시작 시점 사이의 시차가 짧아지는 경향이 있으므로, 실제 악용 여부와 무관하게 공지 즉시 패치하는 것이 안전하다.\n\n### [D20261104-wpcore] CISA, 워드프레스 코어 레이스 컨디션 결함(CVE-2026-119977)을 '실제 악용 확인' 목록에 신규 등재\n> 날짜: 결함 패치(벤더) 보도 기준 7.1.4 출시 · CISA KEV 등재 2026-11-03 · 유형: 공개 CMS(콘텐츠 관리 시스템) 취약점, 실제 악용 확인 · 행위자: 미귀속(자동화 스캐너 추정) · 지역: 전 세계(해외) · 근거: 확인(CISA KEV 등재=실제 악용 확인)·보도(기술적 세부 내용, 단일 2차 출처)\n\n**쉽게 말하면**: 미국 CISA(사이버보안 담당 정부기관)가 11월 3일, 워드프레스 코어(전 세계 웹사이트의 상당수가 쓰는 콘텐츠 관리 시스템)의 한 결함(CVE-2026-119977)을 \"실제로 공격에 쓰이고 있다\"고 확인되는 목록(KEV, 실제 악용 취약점 카탈로그)에 새로 올렸습니다. 확인된 단일 2차 보도에 따르면 이 결함은 업데이트(스테이징) 처리 과정에서 생기는 '레이스 컨디션'(프로그램이 거의 동시에 일어나는 일의 순서를 제대로 처리하지 못해 생기는 결함)으로, 검증을 건너뛰고 코드를 실행시킬 수 있는 수준의 심각도(CVSS 8.1)로 평가됩니다. 워드프레스 7.1.4(또는 7.0.8) 버전에서 해결됐다고 알려졌습니다.\n\n**먼저 할 일(초보용)**: 워드프레스로 운영되는 웹사이트의 관리자는 지금 바로 워드프레스 버전을 확인하고, 7.1.4(또는 7.0.8) 이상으로 업데이트하세요.\n\n**개요**: CISA는 공식 KEV(Known Exploited Vulnerabilities, 실제 악용이 확인된 취약점) 카탈로그에 CVE-2026-119977(WordPress Core)을 2026-11-03자로 등재했다. KEV 등재는 CISA가 실제 공격에 쓰이고 있다고 확인했을 때만 이뤄지므로, \"실제 악용 확인\"이라는 사실 자체는 믿을 수 있는 근거다. 다만 결함의 기술적 세부 내용(정확한 원리, 영향 범위)은 이번 조사에서 단 하나의 2차 보도(보안 분석 블로그)에서만 확인됐고, 워드프레스 공식 보안 권고나 CVE.org 원문은 이번 조사에서 직접 열람하지 못했다. 해당 보도에 따르면 이 결함은 워드프레스 코어의 업그레이드/스테이징 처리 과정에서 발생하는 레이스 컨디션(검사와 사용 시점 사이의 시간차를 노리는 TOCTOU 유형 결함)으로, CVSS 3.1 기준 8.1점(High)이며 영향 버전은 7.1.0~7.1.3·7.0.0~7.0.7이고 7.1.4·7.0.8에서 수정됐다고 전해진다. 같은 보도는 패치 공개 수시간 내 공격자들이 취약한 경로를 탐색하기 시작했다고 전했다.\n\n**왜 일어났나**\n- 직접 원인 [보도 — 단일 출처, 미확정]: 업그레이드/스테이징 처리 과정의 레이스 컨디션으로 검증 절차를 건너뛰고 코드 실행이 가능해진 것으로 보도됐으나, 이 설명은 하나의 2차 출처에만 의존해 본 보고서가 그대로 확정하지 않는다.\n- 구조적 원인 [추정 — 분석]: 워드프레스처럼 전 세계적으로 쓰이는 CMS의 코어 결함은 공개 즉시 자동화된 스캐너의 표적이 되는 경향이 있어, 패치 공개와 실제 악용 사이의 '패치 적용 유예 기간'이 거의 없다고 봐야 한다.\n\n**침투 경로 [확인 — 실행 능력]·[보도 — 세부 메커니즘]**: CISA의 KEV 등재는 \"실제 악용\"이라는 사실만 확인해 주며, 어느 사이트가 어떻게 피해를 입었는지는 공개하지 않는다. 공개 웹 애플리케이션(워드프레스)의 결함을 악용해 코드 실행에 이르렀다는 점에서 ATT&CK T1190(공개 애플리케이션 악용)으로 매핑하되, 구체적 악용 사례·침해 범위는 매핑하지 않는다.\n\n**어떻게 조치하나**\n- 즉시: (벤더 권고 추정) 워드프레스를 7.1.4 또는 7.0.8 이상으로 업데이트한다. 패치 전 사이트는 접근 로그를 증거 보존 차원에서 보관한다.\n- 단기: 이미 패치 전 기간에 노출됐던 사이트는 관리자 계정·API 키·세션을 교체하고, 알 수 없는 관리자 계정·플러그인이 생성됐는지 점검한다.\n- 장기: 워드프레스 코어·플러그인의 자동 업데이트를 활성화하고, 중요 사이트는 스테이징 환경을 운영망과 분리한다.\n- 탐지: 워드프레스 관리자 영역(wp-admin)의 비정상 동시 요청, 알려지지 않은 사용자 계정 생성 이벤트를 모니터링한다.\n\n**교훈**: KEV 등재는 \"정부가 확인한 실제 악용\"이라는 신뢰할 수 있는 신호지만, 기술적 세부까지 공식적으로 공개되는 것은 아니다. 공식 출처가 부족한 결함은 \"악용되고 있다\"는 사실과 \"정확히 어떻게 악용되는가\"를 구분해서 다뤄야 한다.\n\n## 3. 국내 소식\n\n**국내 질의 결과**: 지침에 따라 ①금융권 ②통신·이커머스 ③공공·교육·의료 ④국내 랜섬웨어 ⑤정부 발표 ⑥기존 사건 규모 갱신, 총 6개 범주를 각각 검색했다(검색어에 \"2026년 11월\" 포함).\n\n- **①금융권**: 이번 window 자체의 신규 금융사 단독 사건은 찾지 못했으나, 더존비즈온 사태(`D20261104-douzone`)의 피해(의심) 목록에 한양증권이 포함돼 있어(다만 보도상 한양증권은 \"다우오피스 그룹웨어\"가 원인으로 별도 지목돼 더존비즈온 피해와 경로가 같은지 확인되지 않았다) 참고로 남긴다.\n- **②통신·이커머스**: 10/31~11/4 신규 사건은 찾지 못했다.\n- **③공공·교육·의료**: 더존비즈온 사태의 피해(의심) 목록에 국기원·전북문화관광재단(공공·문화)·한우리독서토론논술(교육)·아산·천안충무병원(의료)·국립박물관단지(공공) 등이 포함돼 `D20261104-douzone`으로 함께 기록했다. 별도의 단독 사건은 찾지 못했다.\n- **④국내 랜섬웨어**: 태광네트웍정보 사건(`D20261104-taegwang`, 에베레스트 랜섬웨어 조직 주장)을 확인해 기록했다.\n- **⑤정부 발표**: 이재명 대통령의 \"사이버 보안 차르\" 신설 검토 지시(11/3 국무회의, `D20261104-vtleak`에 포함), 경찰청의 공군1호기 명단 유출 수사 전환, 과학기술정보통신부의 더존비즈온 사태 중대사고 지정·민관합동조사단 구성을 확인했다. KISA의 부산 해운 침해대응 모의훈련(소규모 소식, 아래 국내뉴스.psv에 기록) 외 추가 발표는 찾지 못했다.\n- **⑥규모 갱신**: 더존비즈온 사태의 피해(의심) 기업 목록은 11/2 보도 이후 11/4까지 계속 늘어나고 있으며, 앞으로도 갱신될 수 있다(현재 24곳 이상).\n- **소규모 소식(국내뉴스.psv에 기록)**: KISA가 11/3 부산에서 \"협력사 PC 해킹으로 선박 소프트웨어 변조\" 시나리오의 해운 분야 침해대응 모의훈련을 실시했다는 보도. 또한 국내 기업망에서 코발트 스트라이크 등 침투테스트 도구의 무단 사용이 217만 건 탐지됐다는 통계 보도(보안업체 집계, 사건이 아닌 통계).\n\n## 4. 우선 대응 체크리스트\n\n1. **지갑·자산 서명 등 민감한 내부 승인 시스템을 운영하는 조직(최우선, 신규)**: [D20261104-binance](#d20261104-binance-바이낸스-가짜-채용면접으로-시작된-공격에-지갑-서명-서비스가-뚫려-약-63억-달러-상당-자산-이전) — 구직 플랫폼을 통한 \"코딩 과제\" 실행 금지 교육, 민감 승인 시스템에 다중 승인 적용.\n2. **더존비즈온 서비스(스마트 A10, APO백업서비스) 이용 기업(최우선, 신규)**: [D20261104-douzone](#d20261104-douzone-국내-erp백업-업체-더존비즈온-해킹-거래-기업-24곳-이상에서-개인정보-유출-의심) — 공지·피해 목록 확인, 관련 VPN·원격접속 계정 점검.\n3. **cPGuard 이용 서버 관리자(신규)**: [D20261104-cpguard](#d20261104-cpguard-서버-보안-제품-cpguard-업데이트-배포망cdn-변조로-약-2946대에-백도어정보탈취-스크립트-유포) — 5.88.25 이상 업데이트, SSH 키·DB 자격 증명 전체 교체.\n4. **바라쿠다 ESG/Load Balancer ADC/Message Archiver/WAF/WSG 운영 조직(신규)**: [D20261104-barracuda](#d20261104-barracuda-바라쿠다-다수-보안장비에서-root-권한-탈취-가능한-치명적-결함-2건-패치) — 제품별 패치 적용, 관리 인터페이스 외부 노출 차단.\n5. **워드프레스 운영자(신규)**: [D20261104-wpcore](#d20261104-wpcore-cisa-워드프레스-코어-레이스-컨디션-결함cve-2026-119977을-실제-악용-확인-목록에-신규-등재) — 7.1.4/7.0.8 이상 즉시 업데이트.\n6. **태광네트웍정보 거래 기관(신규)**: [D20261104-taegwang](#d20261104-taegwang-국내-보안기업-태광네트웍정보-에베레스트-랜섬웨어-조직이-263gb-탈취-주장공급망-영향-우려) — 공유 기술자료·원격접속 계정 점검.\n7. **WorkOS 이용 기업(신규)**: [D20261104-workos](#d20261104-workos-개발-인프라-업체-workos-ai-공격-자동화-도구artex-ai로-내부-영업-시스템-침해) — 담당자 정보 노출 여부 확인, 표적 피싱 주의.\n8. **Veeam 백업 운영 조직 전반(신규)**: [D20261104-3amschool](#d20261104-3amschool-영국-한-학교-재단-ai-자동화-패턴으로-추정되는-3am-랜섬웨어-공격으로-pc-37대-암호화) — 백업 자격 증명 보호 수준 점검, 불필요한 도메인 트러스트 제거.\n9. 공군1호기 탑승자 명단에 포함된 인원: [D20261104-vtleak](#d20261104-vtleak-대통령-전용기공군1호기-탑승자-168명-명단-바이러스토탈에-5개월간-노출) — 외교부 안내(여권 재발급 등) 확인.\n10. [10-17](2026-10-17.md)~[11-03](2026-11-03.md) 보고서의 미조치 건(PHP2Shell·Ivanti 추가 패치·Synology C3RB3R 등) — 기한이 지났거나 임박했으므로 미조치 상태라면 우선 처리.\n\n## 5. 검증 수준과 한계\n\n- CISA KEV는 이번에는 JSON 피드 대신 공식 카탈로그 웹페이지를 직접 열람해 10/20~11/3 등재분을 확인했다. 10/29·10/30 등재분(Ivanti, Cisco ASA/FTD, GitLab)은 11-03 보고서에서 이미 다뤘고, 11/3 신규 등재인 WordPress Core(CVE-2026-119977)만 이번 보고서에 새로 반영했다.\n- 바이낸스 사건은 BleepingComputer 보도를 통해 바이낸스 자체 사고 보고서 내용을 2차로 확인한 것으로, 원문 보고서를 직접 열람하지 못했다. \"EIP-7702 악용으로 출금 중단 후에도 탈취 지속\"이라는 기술적 세부는 보도 수준이며, FBI의 TraderTraitor/Lazarus 귀속도 보도를 통해 확인한 것으로 바이낸스 자체 발표가 직접 귀속한 것은 아니다.\n- WorkOS·Chainalysis(11-03)·Northflank(11-03)·이번 사건처럼, \"AI 에이전트형 공격 도구가 쓰였다\"는 설명이 반복해서 보도되지만 구체적 초기접근 경로가 공개되지 않는 사건이 늘고 있다. 본 보고서는 이런 사건에 ATT&CK 매핑을 하지 않는 원칙을 일관되게 유지했다.\n- 더존비즈온 사태는 피해(의심) 기업 목록이 11/2~11/4 사이 계속 갱신되는 '진행 중'인 사건이다. 이번 보고서의 24곳 목록은 11/4 조사 시점 기준이며, 더존비즈온 자체의 최초 침투 경로는 아직 공개되지 않았다. 한양증권은 별도 보도에서 \"다우오피스 그룹웨어\"가 원인으로 지목돼, 더존비즈온 피해 목록에 포함할지 애매한 경계 사례로 처리해 본문에 그 불확실성을 명시했다.\n- 워드프레스 CVE-2026-119977의 기술적 세부(레이스 컨디션, CVSS 8.1, 영향 버전)는 단 하나의 2차 출처(보안 분석 블로그)에서만 확인했고, WordPress 공식 보안 권고나 cve.org 원문은 이번 조사에서 직접 열람하지 못했다(페이지가 제목만 반환됨). CISA KEV 등재 사실 자체만 [확인]으로 표기하고, 기술적 세부는 보도로 구분했다.\n- 태광네트웍정보 사건은 회사가 공식 인정한 유출 범위(담당자 연락처 수준)와 공격자(에베레스트)가 주장하는 탈취 규모(263GB) 사이에 큰 차이가 있다. 본 보고서는 공격자 주장을 [주장]으로 명확히 구분했고, 263GB 전체의 진위나 고객사 기술자료 포함 여부는 검증하지 못했다.\n- 공군1호기 명단 유출은 진행 중인 수사 사안이라, 게시 경위(개인 업로드 vs 이메일 솔루션 자동 전송)가 아직 확정되지 않았다. 본 보고서는 두 가능성을 모두 제시된 그대로 기록했고 어느 쪽으로도 단정하지 않았다.\n- 국내 질의 중 ①②③ 범주에서 이번 window 단독의 금융·통신·이커머스 신규 사건은 찾지 못했다 — 더존비즈온 사태처럼 여러 분야를 가로지르는 사건에 흡수된 것으로 보인다. 결과 없음이 \"사건이 없다\"는 뜻인지 \"아직 보도되지 않았다\"는 뜻인지는 구분할 수 없다.\n- **GPT(Codex) 검토 실시**: 비민감 요약(사건 개요, ATT&CK 매핑 표, 쉬운 설명)만 전달해 독립 검토를 받았다. 반영한 지적: (1) 더존비즈온 사건의 T1199(신뢰관계 악용) 매핑을 '확인'에서 '후보'로 하향 — 한국킨볼협회의 VPN 계정이 공급사-고객 간 신뢰 접근으로 부여된 것인지 보도에서 명시되지 않았기 때문. (2) 같은 사건의 T1213(정보 저장소 수집) 매핑은 근거가 약해 삭제. (3) 공군1호기 명단 유출을 \"정보관리 부주의\"로 단정한 표현을 \"외부 침입 증거 없음·게시 경위 조사 중\"으로 더 중립적으로 수정. 반영하지 않은 지적은 없었다(제시된 지적 모두 타당하다고 판단해 반영).\n\n## 출처\n\n- CISA KEV 카탈로그(공식 웹페이지, 직접 확인)\n- BleepingComputer(직접 열람): \"Binance says fake job interview led to $6.3 billion crypto heist\", \"WorkOS says attacker used ARTEX AI to breach internal sales app\", \"Hackers hijack cPGuard autoupdate to deploy backdoor, steal data\", \"Barracuda warns of critical flaws allowing root access to devices\", \"UK school estate hit by 3AM ransomware in suspected AI-assisted attack\"\n- WebSearch 교차 확인: CVE-2026-119977 관련 보안 분석 블로그(rescana.com, 단일 출처·미확정)\n- 보안뉴스(직접 열람): \"더존비즈온 사태 유출 의심 기업 현황\"(idxno=146975), \"외교부, '대통령 개인정보 유출' 개인정보위에 신고\"(idxno=146981), \"대통령 개인정보 유출 파문... '바이러스 토탈' 이용 행태 도마 위\"(idxno=146973), \"'협력사 PC 뚫어 선박 SW 변조'... KISA, 부산서 해운 침해대응 모의훈련\"(idxno=146985)\n- 데일리시큐(직접 열람): \"이 대통령, '사이버 보안 차르' 검토 지시…공군 1호기 168명 개인정보 유출 수사\"(idxno=209298), \"[단독 후속] 네트워크·보안기업 태광네트웍정보, 해킹·정보유출 공식 인정\"(idxno=209013)\n- MITRE ATT&CK v19.2(저장소 기준, v20.0 공식 전환은 유지 확인됨, 재매핑 보류)\n"},{"path":"일일/2026-11-05.md","title":"일일 보안 이슈 분석 — 2026-11-05","md":"# 일일 보안 이슈 분석 — 2026-11-05\n\n> 수집 기준: 2026-11-05 공개·보도분([11-04 보고서](2026-11-04.md) 이후). CISA KEV 및 BleepingComputer, 보안뉴스·데일리시큐 원문을 확인했다.\n> 근거 표기: **[확인]** 벤더·정부기관·연구기관이 직접 확인 / 보도 언론 보도 / **[추정]** 본 보고서의 추정 / **[주장]** 공격자 일방 주장. **조치는 본 보고서의 권고**이며 벤더 공식 지침이 우선한다.\n> **ATT&CK 버전 점검**: attack.mitre.org 직접 확인 결과 공식 버전은 **v20.1**이다.\n\n## 1. 오늘의 요약\n\n| # | 이슈 | 유형 | 상태 | 즉시 조치 |\n|---|------|------|------|-----------|\n| 1 | 러시아 연계 APT29(추정), 정상 웹사이트 변조로 아이폰·안드로이드 이용자 공격(Poisoned Source) | 워터링홀·공급망·모바일 익스플로잇 | [확인] Sekoia 연구기관 직접 확인 | iOS·Android·Chrome 최신 버전 유지 |\n| 2 | 프랑스 아르케아(Arkéa) 은행, 협력업체 경유 공격으로 약 1,333억원 상당 탈취 | 은행 내부 계좌 자금 이전 | [확인] 은행 자체 확인(규모는 추정) | 해당 없음(고객 자산 영향 없다고 발표) |\n| 3 | 서버관리패널 CWP 변조 공급망 공격(CWPdoor), 노출 인스턴스 34만여 개 | 소프트웨어 공급망 변조 | [확인] 보안연구진 확인 | cwpsrv 바이너리 검증 후 최신 버전 업그레이드 |\n| 4 | 인증기관 DigiCert, 내부 시스템 노출로 고객정보·신원확인문서 유출 | 내부 시스템 노출·권한 부여 결함 | [확인] 회사 자체 확인 | 신원확인문서 제출자는 회사 통지 확인 |\n| 5 | 정부 정보공개포털, 주민번호·암 진단서 등 개인정보 노출(비식별 처리 실패) | 정보 노출(외부 침입 아님) | [확인] 행안부 자체 확인 | 노출 문서 당사자는 기관 통지 확인 |\n| 6 | 국내 의료기관 5곳, 신생 랜섬웨어 조직 '옵소프트' 약 90TB 탈취 주장(검증 안 됨) | 랜섬웨어 협박(미검증) | [주장] 공격자 다크웹 게시물 | 해당 병원 확인 전까지 일반 이용자 조치 없음 |\n\n## 2. 이슈별 분석\n\n### [D20261106-apt29] 러시아 연계 APT29(추정), 정상 웹사이트 변조로 아이폰·안드로이드 겨냥(Poisoned Source)\n> 날짜: Plerdy 추적 스크립트 변조 활동 2026-08-27~09-03 · Sekoia 연구 결과 공개 2026-11-04 · 국내 보도 2026-11-05 · 유형: 워터링홀(정상 웹사이트 변조)·모바일 익스플로잇 체인 · 행위자: 러시아 연계 APT29 또는 하위 조직(Sekoia 중~고신뢰도 추정) · 지역: 전 세계(해외, 피해자 특정 미공개) · 근거: 확인(Sekoia 연구기관 직접 확인)·추정(행위자 귀속)\n\n**쉽게 말하면**: 프랑스 보안업체 Sekoia가 \"Poisoned Source\"라는 이름으로 공개한 연구에 따르면, 공격자들이 멀쩍이 둘러보기만 해도 아이폰·안드로이드 기기가 감염될 수 있는 캠페인을 벌였습니다. 이들은 정상 웹사이트에 악성 코드를 심거나, 진짜 내용을 그대로 중계하는 가짜 거울(미러) 사이트를 운영하거나, 우크라이나의 웹 분석 서비스 'Plerdy'의 추적 스크립트 자체를 변조하는 세 가지 방식을 함께 썼습니다. 방문자의 기기 운영체제·브라우저 버전을 확인해 거기 맞는 공격을 내려보냈고, 아이폰에서는 문자메시지·왓츠앱·텔레그램 대화 내용·위치·사진까지, 안드로이드에서는 저장된 비밀번호·방문기록·와이파이 비밀번호까지 빼갔습니다. Sekoia는 이 공격이 러시아 정부와 연계된 것으로 알려진 APT29(일명 코지베어) 또는 그 하위 조직의 소행일 가능성이 중간~높은 신뢰도로 있다고 평가했습니다. 다행히 모든 공격 방식은 이미 제조사가 패치한 결함만 썼기 때문에, 최신 업데이트를 적용한 기기는 영향받지 않습니다.\n**먼저 할 일(초보용)**: 아이폰·안드로이드 이용자는 지금 바로 운영체제와 Chrome 등 브라우저를 최신 버전으로 업데이트하세요. Sekoia는 완전히 패치된 기기에서는 이 공격 체인이 작동하지 않는다고 밝혔습니다.\n\n**개요**: Sekoia는 2026-11-04 \"Poisoned Source\" 보고서에서, 2026년 8월 27일부터 9월 3일까지 우크라이나 웹 분석 서비스 Plerdy의 추적 스크립트가 변조돼 있었다고 밝혔다(공급망 공격). 공격자는 이와 함께 정상 사이트에 직접 악성 JavaScript를 주입하거나, 실제 콘텐츠를 그대로 중계하는 미러 사이트를 운영하는 방식도 병행했다. 방문자가 해당 페이지를 열면 운영체제·브라우저 버전을 확인한 뒤 맞는 익스플로잇을 전달했다. 안드로이드에서는 Chrome과 Adreno GPU 드라이버의 결함을, iOS에서는 \"DarkSword\"로 명명된 다단계 취약점 체인(CVE-2026-20700 포함)을 썼다. iOS 16.7 기준 체인은 쿠키를 노렸고, iOS 18.5 기준 체인은 문자메시지, 왓츠앱·텔레그램 데이터베이스, 저장된 자격 증명, 위치, 사진까지 가져갔다. 안드로이드의 최종 악성코드 \"AndroSnitch\"는 Chrome 쿠키·저장된 로그인정보·방문기록·와이파이 비밀번호를 수집했다. Sekoia는 모든 익스플로잇 체인이 제조사가 이미 패치한 결함만 썼다고 확인했다. 보고서는 기술적 유사성·공격 인프라·표적 패턴을 근거로 러시아 연계 APT29(코지베어) 또는 그 하위 조직의 소행일 가능성을 중간~높은 신뢰도로 평가했으나, 구체적인 피해자(개인·기관·국가)는 공개하지 않았다.\n\n**왜 일어났나**\n- 직접 원인 [확인]: 공급망(Plerdy 스크립트 변조)과 사이트 직접 변조·미러링을 함께 써서 워터링홀 공격을 구성했고, 방문자의 기기 정보를 확인해 이미 패치된 결함을 겨냥한 익스플로잇 체인을 내려보냈다(Sekoia 확인).\n- 구조적 원인 [추정 — 분석]: 모바일 운영체제·브라우저 업데이트를 미루는 이용자가 일정 비율 존재하는 한, \"이미 패치된\" 결함도 여전히 공격 자산으로 재활용될 수 있다. 또한 분석·광고 스크립트처럼 수많은 사이트가 외부에서 그대로 불러오는 제3자 코드는, 그 하나가 변조되면 그 코드를 쓰는 모든 사이트의 방문자가 동시에 위험해지는 구조다.\n\n**침투 경로 [확인 — Sekoia 기준]**: ① Plerdy 추적 스크립트 변조(공급망) 또는 정상 사이트 직접 변조·미러 사이트 운영 → ② 방문자가 페이지를 열면 기기 OS·브라우저 버전 확인 → ③ 맞는 익스플로잇 체인(Android: Chrome·GPU 드라이버 결함, iOS: DarkSword 체인) 전달해 코드 실행 → ④ 아이폰은 문자·메신저 DB·위치·사진, 안드로이드는 쿠키·저장 비밀번호·방문기록·와이파이 비밀번호 수집.\n\n**어떻게 조치하나**\n- 즉시: (본 보고서의 권고) iOS·Android·Chrome을 최신 버전으로 즉시 업데이트한다. 분석·추적 스크립트처럼 외부에서 불러오는 제3자 코드를 쓰는 웹사이트 운영자는 해당 스크립트의 무결성(서브리소스 무결성, SRI 등)을 점검한다.\n- 단기: 평소 신뢰하던 사이트라도 낯선 리디렉션·미러 도메인으로 이동하는지 점검하는 습관을 들인다. 기업은 임직원 모바일 기기의 OS·브라우저 버전을 중앙에서 점검·강제 업데이트하는 정책을 검토한다.\n- 장기: 웹사이트에 제3자 분석·광고 스크립트를 삽입할 때, 그 스크립트 공급업체의 보안 수준도 공급망 위험 평가 대상에 포함한다.\n- 탐지: 알려진 \"DarkSword\" 체인·AndroSnitch 악성코드의 침해 지표(IoC)가 공개되면 모바일 위협 탐지 솔루션에 반영한다.\n\n**교훈**: \"이미 패치된 결함\"이라는 말이 안심의 근거가 되려면 실제로 그 패치가 설치돼 있어야 한다. 국가 연계 공격자조차 새 제로데이 대신 오래된 패치된 결함을 재활용해 공격할 수 있다는 점은, 업데이트를 미루는 습관이 생각보다 오래, 널리 위험으로 남는다는 뜻이다.\n\n### [D20261106-arkea] 프랑스 아르케아(Arkéa) 은행, 협력업체 경유 공격으로 약 1,333억원 상당 탈취\n> 날짜: 공격 포착(블록체인 추적) 2026-11-02 · 은행 성명 2026-11-04(현지시각) · 국내 보도 2026-11-05 · 유형: 협력업체 경유 은행 내부 계좌 자금 이전 · 행위자: 미귀속 · 지역: 프랑스(해외) · 근거: 확인(은행 자체 확인)·추정(피해 규모, 블록체인 추적)\n\n**쉽게 말하면**: 프랑스의 협동조합은행 그룹 아르케아(Arkéa)가, 이름이 공개되지 않은 협력업체의 플랫폼을 거쳐 공격당해 은행 자체 계좌에서 다른 금융기관으로 거액이 빠져나갔습니다. 미국의 블록체인 추적가 ZachXBT는 며칠에 걸쳐 약 1억 3,300만 달러(약 1,333억 원) 이상이 빠져나갔고 일부가 암호화폐로 세탁됐을 가능성이 있다고 추산했습니다. 은행은 정확한 금액을 밝히지 않았지만 그 규모가 맞다고 인정했습니다. 중요한 점은 이 사건이 고객의 계좌나 자산을 겨냥한 것이 아니라 은행 \"자체\" 계좌가 쓰였다는 것입니다. 은행은 고객 자산에는 영향이 없다고 밝혔고, 자금 일부는 이미 동결됐습니다.\n**먼저 할 일(초보용)**: 아르케아·포르튀네오(Fortuneo) 이용자가 지금 당장 해야 할 일은 보도되지 않았습니다(고객 계좌·자산은 영향받지 않았다고 발표됐습니다). 다만 은행과 거래하는 협력업체·공급업체는 자사 플랫폼의 접근 로그를 점검해 볼 필요가 있습니다.\n\n**개요**: ZachXBT는 2026-11-02 텔레그램을 통해 아르케아 은행 그룹에서 자금이 빠져나가고 있다는 내용을 처음 공개했다. 추적 결과 며칠에 걸쳐 1억 3,300만 달러 이상이 암호화폐 거래소 출금 내역과 자금 세탁으로 보이는 거래 경로를 통해 이동했다. 아르케아는 11월 4일(현지시각) 저녁 성명을 내고 \"정교한 공격\"을 받았다고 인정했으며, 공격자가 협력업체의 플랫폼을 거쳐 은행 그룹에 접근한 뒤 고객 계좌가 아닌 은행 자체 계좌를 이용해 다른 금융기관으로 자금을 이전했다고 밝혔다. 이전된 자금 중 일부는 암호화폐로 전환됐을 가능성이 있다. 프랑스 현지 언론은 공격자가 아르케아의 온라인 은행 자회사 포르튀네오(Fortuneo)를 통해 들어와 첫 송금을 했다고 보도했으나, 은행은 이를 부인했다 — 따라서 구체적인 최초 침투 지점은 보도 간에 일치하지 않는다. 은행은 사람의 실수로 생긴 일이 아니라고 밝혔고, 자금 일부는 동결됐으며 나머지 회수 작업이 진행 중이다. 최종 손실액은 확정되지 않았지만, 은행은 이 사건이 지급 능력이나 재무 건전성을 위협할 수준은 아니라고 설명했다.\n\n**왜 일어났나**\n- 직접 원인 [확인 — 세부 경로는 보도 불일치]: 협력업체 플랫폼을 거쳐 은행 그룹에 접근한 뒤 은행 자체 계좌로 자금을 이전했다(은행 자체 확인). 다만 어떤 협력업체인지, 포르튀네오를 거쳤는지는 보도마다 다르다.\n- 구조적 원인 [추정 — 분석]: 은행이 협력업체 플랫폼에 부여한 접근 권한이 고객 자산과는 분리돼 있었던 것으로 보이지만(고객 계좌 영향 없음), 은행 \"자체\" 계좌로의 이전까지 허용할 만큼의 접근권이 외부 플랫폼 경유로 확보될 수 있었다는 점은 내부 계좌와 외부 연계 시스템 간의 통제 경계를 다시 점검할 필요가 있음을 보여준다.\n\n**침투 경로 [부분 확인 — 보도 간 불일치]**: 협력업체 플랫폼을 거쳐 접근했다는 점은 은행이 확인했지만, 그 플랫폼이 무엇이고 신뢰 관계(trusted relationship)로 부여된 접근인지 다른 방식으로 탈취된 것인지는 공개되지 않았다. 현지 언론의 \"포르튀네오 경유\" 보도는 은행이 부인해 그대로 확정하지 않는다.\n\n**어떻게 조치하나**\n- 즉시: (은행 조치, 보도 기준) 위기 대응 절차 가동, 의심 자금 이전 탐지·차단, 일부 자금 동결. (본 보고서의 권고) 영향 가능성이 있는 협력업체 연계 시스템은 접근 로그를 증거 보존 차원에서 먼저 확보한다.\n- 단기: 협력업체 플랫폼에 부여된 접근 권한 범위를 재검토하고, 은행 자체 계좌로의 자금 이전이 외부 연계 시스템의 권한만으로 가능했는지 점검한다.\n- 장기: 은행 자체 계좌·고객 자산 계좌 간 접근 통제 경계를 명확히 분리하고, 협력업체 플랫폼 경유 접근에는 별도의 다중 승인·이상 거래 탐지 기준을 적용한다.\n- 탐지: 은행 자체 계좌에서 평소와 다른 패턴·규모·빈도로 발생하는 대외 이전 거래를 실시간 모니터링한다.\n- 탐지: 블록체인 추적 서비스·암호화폐 거래소와의 협력을 통해 세탁 의심 자금의 흐름을 조기에 포착한다.\n\n**교훈**: 이번 사건은 \"고객 계좌는 안전했다\"는 것만으로 사건이 작다고 볼 수 없다는 점을 보여준다. 은행 \"자체\" 계좌가 1,333억 원 규모로 빠져나갈 수 있었다는 것은, 협력업체를 통한 접근권이 은행 내부 자금 이동 권한까지 닿아 있었다는 뜻이고, 이는 고객 보호 장치만큼 내부 자금 이동 통제도 중요하다는 교훈을 준다.\n\n### [D20261106-cwpdoor] 서버관리패널 CWP 변조 공급망 공격(CWPdoor), 노출 인스턴스 34만여 개\n> 날짜: 변조 업데이터 스크립트 포착 2026-06-29 · Ebury 연계 샘플 VirusTotal 업로드 확인 2026-09-30 · 보도 2026-11-05 · 유형: 소프트웨어 공급망(서버 관리 패널) 변조 · 행위자: 미귀속 · 지역: 전 세계(해외, CWP 공개 노출 인스턴스 34만여 개) · 근거: 확인(보안연구진 확인)\n\n**쉽게 말하면**: 리눅스 서버를 관리하는 무료 제어판 소프트웨어 CWP(Control Web Panel, 구 CentOS Web Panel)의 핵심 웹서버 프로그램(cwpsrv)이 악성 버전으로 바뀌어 있는 사례가 발견됐습니다. 연구자들은 이를 'CWPdoor'라고 이름 붙였는데, 평소에는 조용히 숨어 있다가 공격자가 특수하게 꾸민 요청을 보내면 암호화된 명령을 받아 실행하는 방식입니다. 명령을 실행한 흔적(로그·타임스탬프)도 스스로 지워 매우 은밀합니다. 전 세계에 공개적으로 노출된 CWP 설치 대수가 34만 개가 넘는 것으로 집계됐지만, 이 중 실제로 이 백도어에 감염된 서버가 몇 대인지는 아직 공개되지 않았습니다.\n**먼저 할 일(초보용)**: CWP(Control Web Panel)를 쓰는 서버 관리자는 지금 바로 cwpsrv 바이너리에 수상한 유닉스 소켓(`ngx_http_integrity_helper`)이나 의심스러운 헬퍼 프로세스가 있는지 확인하고, 감염이 확인되면 정상 버전으로 교체한 뒤 제어판 관련 자격 증명을 전부 새로 발급하세요(기존 값은 공격자가 이미 알고 있을 수 있습니다).\n\n**개요**: 보안연구진은 2026년 6월 29일, CWP 업데이트처럼 위장한 스크립트가 cwpsrv(버전 1.15.10, 1.24.0)를 악성 버전으로 교체하는 것을 포착했다. 이 스크립트는 파일·디렉터리의 타임스탬프를 원래대로 되돌리고, 임시 파일을 지우고, 명령 기록을 삭제해 흔적을 숨긴다. 9월 30일에는 Ebury 백도어가 든 압축 파일 안에 담긴 악성 cwpsrv 샘플(파일명 cwpsrv.suspeito)이 VirusTotal에 올라온 것도 확인됐는데, 당시 탐지 엔진 검출 건수는 0건이었다. 변조된 백도어는 평소 휴면 상태로 있다가, 공격자가 보낸 특수 HTTP 헤더(암호화된 명령·타임스탬프·RSA 서명 포함)에 반응한다. 타임스탬프가 전후 5분 이내인지 확인하고 서명을 검증한 뒤 명령을 복호화해 헬퍼 프로세스로 실행하며, 명령과 출력은 AES-256-CBC로 암호화돼 오간다. 또한 로깅 모듈을 방해해 트리거 요청이 접근 로그에 남지 않게 한다. 연구진은 CWPdoor가 수동적으로 동작해 매우 은밀하다고 평가했다. XLab 집계에 따르면 최근 한 달간 공개 웹에 노출된 CWP 인스턴스는 34만 개가 넘지만, 이는 노출 규모일 뿐 실제 CWPdoor 감염 수는 공개되지 않았고, CWPdoor와 Ebury 백도어의 정확한 연관성도 아직 불분명하다. CWP 개발사의 공식 대응은 보도에서 확인되지 않았다.\n\n**왜 일어났나**\n- 직접 원인 [확인]: CWP의 핵심 웹서버 바이너리(cwpsrv)가 변조된 버전으로 교체돼 백도어 기능을 갖게 됐다(연구진 확인). 이 교체가 CWP의 공식 배포망을 통한 것인지, 이미 침해된 개별 서버에서 수동으로 교체된 것인지는 보도에서 명확히 구분되지 않는다.\n- 구조적 원인 [추정 — 분석]: 서버 관리 패널은 그 자체가 root 권한에 가까운 통제권을 갖는 소프트웨어다. 이런 핵심 구성요소 하나가 변조되면, 로그 조작·흔적 삭제 기능까지 함께 심어져 있어 장기간 탐지를 피할 수 있는 구조적 위험이 크다.\n\n**침투 경로 [확인 — 변조 메커니즘 한정]**: 변조된 업데이터 스크립트가 cwpsrv 바이너리를 악성 버전으로 교체(공급망 변조) → 백도어는 휴면 상태 유지 → 공격자가 RSA 서명·타임스탬프가 포함된 특수 HTTP 헤더 요청 전송 → 서명·시간 검증 후 암호화된 명령 복호화·실행 → 명령 실행 흔적(로그·타임스탬프·임시파일) 자동 삭제. 이 변조가 애초에 어떤 경로로 각 서버에 심어졌는지(최초 침투)는 공개되지 않았다.\n\n**어떻게 조치하나**\n- 즉시: (연구진 권고) `ngx_http_integrity_helper` 유닉스 소켓, 의심스러운 cwpsrv 헬퍼 프로세스, 서버 바이너리 내 X-Ngx-Integrity 문자열을 확인한다. 감염이 확인되면 패치 전 증거(바이너리 사본, 로그)를 먼저 보존한다.\n- 단기: 감염된 바이너리를 정상 사본으로 교체하고 최신 버전으로 업그레이드하며, 제어판 관련 자격 증명을 전부 새로 발급한다(해당 서버 안에서 새로 만들지 않는다). 다른 악성코드가 함께 심어졌는지 호스트 전체를 조사한다.\n- 장기: 서버 관리 패널처럼 root급 통제권을 갖는 소프트웨어의 업데이트 배포 과정에 무결성 서명 검증을 의무화하고, 정기적으로 핵심 바이너리의 체크섬을 알려진 정상값과 비교한다.\n- 탐지: 평소와 다른 아웃바운드 HTTP 요청 패턴, 접근 로그에 남지 않는 서버 활동(로그 공백)을 모니터링한다.\n\n**교훈**: \"흔적을 스스로 지우는 백도어\"가 발견되기까지 감염 시작(6월 말로 추정)부터 보도(11월)까지 수개월이 걸렸다는 것은, 로그 조작 기능이 포함된 악성코드가 얼마나 오래 숨어 있을 수 있는지를 보여준다. 노출된 인스턴스가 34만 개라는 숫자는 실제 피해 규모가 아니라 \"공격 가능한 표면\"의 크기일 뿐이라는 점도 구분해서 읽어야 한다.\n\n### [D20261106-digicert] 인증기관 DigiCert, 내부 시스템 노출로 고객정보·신원확인문서 유출\n> 날짜: 서버 이전으로 내부 시스템 노출 시작(추정) 2025년 2월 · 미승인 계정 최초 발견 2026년 6월(당시 위험 낮게 평가) · 미승인 계정의 실제 데이터 접근 2026-06-27~07-02 · 추가 조사로 확인 2026-10-19 · 보도 2026-11-05 · 유형: 내부 시스템 노출·권한 부여 결함 · 행위자: 미귀속 · 지역: 전 세계(해외) · 근거: 확인(회사 자체 확인)\n\n**쉽게 말하면**: 웹사이트 암호화(SSL/TLS)에 쓰이는 디지털 인증서를 발급하는 세계적인 인증기관 DigiCert가, 내부 시스템이 실수로 인터넷에 노출돼 고객 정보와 일부 신원확인문서(운전면허증·여권·공과금 고지서 등)가 유출됐다고 밝혔습니다. 원래 VPN을 통해서만 접근할 수 있어야 했던 이 시스템이 2025년 2월 서버 이전 과정에서 그대로 인터넷에 노출됐고, 여기 있던 \"누구나 계정을 만들 수 있는\" 기능과 권한 부여 결함이 겹쳐, 외부인이 만든 계정으로 보관된 고객 정보를 읽기 전용으로 열람할 수 있었습니다. 다행히 DigiCert가 발급한 인증서 자체나 고객의 로그인 자격 증명은 영향받지 않았다고 밝혔습니다.\n**먼저 할 일(초보용)**: DigiCert에 신원확인문서를 제출한 적이 있는 기업·개인은 회사의 침해 통지를 확인하세요. DigiCert 로그인 자격 증명이나 발급받은 인증서 자체는 안전하다고 발표됐으므로 비밀번호를 바꿀 필요는 없지만, 노출된 신원확인문서(운전면허증·여권 등)가 있다면 명의도용 방지 서비스 가입을 검토하세요.\n\n**개요**: DigiCert에 따르면 2025년 2월 서버 이전 과정에서, 원래 VPN을 통해서만 접근할 수 있던 내부 업무 시스템이 실수로 인터넷에 노출됐다. 이 시스템에는 다른 애플리케이션을 위한 자가 등록(self-registration) 기능이 있어 외부 사용자가 계정을 만들 수 있었다. 2026년 6월 시스템에서 미승인 계정이 처음 발견됐지만, 당시에는 이 계정이 특정 애플리케이션에 할당되지 않아 고객 정보에 접근할 수 없다고 판단했다. 이후 보안 연구 프로그램을 통해 외부 사용자가 계정을 만들 수 있다는 제보를 받아 패치를 배포했는데, 이때도 보관 데이터에 이미 접근이 있었다는 사실은 인지하지 못했다. 2026년 10월 19일 추가 조사에서, 권한 부여 결함으로 미승인 계정이 2026년 6월 27일~7월 2일 사이 보관된 고객 정보에 실제로 접근했다는 사실이 확인됐다. 유출 가능 정보는 이름, 사업자 이메일 주소, 전화번호, 사업장 주소이며, 일부 고객은 운전면허증·여권·공과금 고지서 등 신원 확인 문서도 포함된다(DigiCert는 해당 대상자를 검토 중이라고 밝혔다). 영향받은 고객 수는 공개되지 않았으며, DigiCert는 \"소규모 부분\"의 보관 고객 데이터라고만 설명했다. 회사는 해당 시스템 접근을 제한하고 자가 등록 기능을 비활성화했으며 추가 접근 통제를 도입했고, 영향받은 고객에게 통지를 시작했다. 미승인 계정은 읽기 전용 권한만 가졌고 기록 수정, 인증 승인, 인증서 발급은 할 수 없었다고 밝혔다. CertCentral, DigiCert ONE 플랫폼은 침해되지 않았으며 고객 로그인 자격 증명과 발급된 인증서는 안전하다고 설명했다.\n\n**왜 일어났나**\n- 직접 원인 [확인]: 서버 이전 과정의 설정 실수로 VPN 전용 내부 시스템이 인터넷에 노출됐고, 이 시스템의 자가 등록 기능과 권한 부여 결함이 겹쳐 외부 계정이 보관 고객 정보를 읽기 전용으로 열람할 수 있었다(회사 자체 확인).\n- 구조적 원인 [추정 — 분석]: 2026년 6월 미승인 계정이 처음 발견됐을 때 \"애플리케이션에 할당되지 않았으니 위험이 낮다\"고 판단한 것이 실제로는 틀렸다 — 권한 부여 체계의 결함까지는 그때 확인하지 못한 것이다. 노출 시작(2025년 2월)부터 실제 데이터 접근 확인(2026년 10월)까지 1년 8개월이 걸렸다는 것은, 노출된 내부 시스템에 대한 정기적인 권한·접근 범위 재검증이 부족했을 가능성을 보여준다.\n\n**침투 경로 [확인 — 공격자 단계 미공개]**: ① 서버 이전 중 VPN 전용 내부 시스템이 인터넷에 노출 → ② 노출된 시스템의 자가 등록 기능으로 외부에서 계정 생성 가능 → ③ 권한 부여 결함으로 해당 계정이 애플리케이션에 할당되지 않았음에도 보관된 고객 정보를 읽기 전용으로 열람. 공격자(또는 계정을 만든 주체)가 누구인지, 의도적 공격이었는지 우연한 발견이었는지는 공개되지 않았다.\n\n**어떻게 조치하나**\n- 즉시: (회사 조치, 보도 기준) 해당 시스템 접근 제한, 자가 등록 기능 비활성화, 추가 접근 통제 도입, 영향받은 고객 통지 시작. (본 보고서의 권고) 신원확인문서가 포함된 고객 목록을 우선 확정해 통지한다.\n- 단기: 노출됐던 내부 시스템과 연결된 다른 애플리케이션에도 동일한 권한 부여 결함이 있는지 전체 점검한다.\n- 장기: 서버 이전·인프라 변경 작업 시 네트워크 노출 범위(VPN 전용 여부)를 자동으로 검증하는 절차를 도입하고, 내부 시스템의 자가 등록 기능은 기본적으로 비활성화한다.\n- 탐지: VPN 전용으로 설계된 내부 시스템이 실제로 외부에서 접근 가능한지 주기적으로 외부 스캔한다.\n\n**교훈**: \"애플리케이션에 할당되지 않은 계정이라 위험이 낮다\"는 초기 판단이 몇 달 뒤 틀린 것으로 확인됐다. 노출이나 미승인 계정을 발견했을 때 \"당장 접근 가능한 데이터가 보이지 않는다\"는 것과 \"권한 부여 체계 전체에 결함이 없다\"는 것은 다른 이야기라는 점을 보여준다.\n\n### [D20261106-govportal] 정부 정보공개포털, 주민번호·암 진단서 등 개인정보 노출(비식별 처리 실패)\n> 날짜: 노출 대상 문서 공개 2024년 이후(점검 대상 기간) · 행안부 인지·다운로드 중단 2026-11-04 · 설명·사과 2026-11-05 · 유형: 정보 노출(공개 전 비식별 처리 실패, 외부 침입 아님) · 행위자: 해당 없음 · 지역: 한국 · 근거: 확인(행안부 자체 확인·발표)\n\n**쉽게 말하면**: 중앙행정기관·지방자치단체·공공기관의 결재문서를 누구나 검색·열람할 수 있는 정부의 '정보공개포털'에서, 가려야 할 개인정보가 그대로 노출된 문서들이 발견됐습니다. 철거 보상 문서에 첨부된 주민등록등본 원본(이름·주민등록번호 13자리·주소 그대로), 병가·질병휴직 서류의 암 진단명·질병분류코드·의사 소견, 항공권·여행허가서의 여권번호 등이 가려지지 않은 채 공개돼 있었습니다. 이는 외부 해커의 침입이 아니라, 문서를 공개하기 전에 개인정보를 가리거나 비공개 처리해야 하는 절차가 제대로 작동하지 않은 사고입니다. 특히 스캔·촬영한 이미지 형태의 첨부파일은 기존 필터링 시스템이 걸러내지 못했습니다. 행정안전부는 11월 4일 사실을 확인해 원문 다운로드를 중단했고, 11월 5일 사과했습니다.\n**먼저 할 일(초보용)**: 일반 이용자가 지금 당장 할 일은 없습니다. 자신의 결재문서가 공개 대상이었던 공무원이나 민원인이라면, 소속 기관이나 행안부의 통지·안내를 확인하세요.\n\n**개요**: 행정안전부는 2026년 11월 4일 정보공개포털의 공개 문서 일부에서 개인정보가 노출된 사실을 확인해 원문정보 다운로드 서비스를 일시 중단했고, 전국 공공기관에 공개 문서의 개인정보 노출 여부를 전수점검하도록 요청했다. 11월 5일 설명자료를 내고 노출 사실을 인정하며 사과했다. 노출된 정보는 ①주민등록 정보(철거 보상 문서에 첨부된 주민등록등본 원본의 이름·주민등록번호 13자리·주소, 가림 처리 없음) ②건강정보(병가·질병휴직 관련 진단서·의사 소견서의 암 진단명·질병분류코드·의사 소견, 직원 실명과 질병명이 드러나는 첨부파일명 포함) ③여행·출입국 정보(전자항공권·탑승권의 이름과 항공예약번호, 해외 전자여행허가 자료의 여권번호·생년월일·비자 번호)로, 공무원뿐 아니라 일반 시민과 미성년자의 정보도 포함된 것으로 보도됐다. 공개 문서는 별도 정보공개청구 없이 열람·내려받을 수 있었는데, 문제의 핵심은 공개 전 개인정보 보호 조치(가림·비공개 처리)가 제대로 이뤄지지 않은 것이다. 기존에 필터링 시스템이 있었지만 스캔·촬영한 이미지 형태의 첨부파일은 걸러내지 못했다. 최소 22개 기관의 결재문서 35건에서 노출이 확인됐으며(2025년 공개 문서 약 5,150만 건은 전체 공개 규모로, 노출 문서 수가 아니다), 전체 노출 문서 수와 영향을 받은 정보주체 수는 확정되지 않았다. 외부 해킹이 아니라 문서 공개·비식별 처리 과정에서 생긴 사고로 구분된다. 행안부는 새로운 개인정보 필터링 소프트웨어 도입과 문서 생산 단계부터의 담당자 교육·모니터링 강화를 계획하고 있으며, 기관별 관리 방식이 달라 전수점검 과정에서 추가 노출 사례가 나올 수 있다고 전망했다.\n\n**왜 일어났나**\n- 직접 원인 [확인]: 공공기관이 문서를 정보공개포털에 공개하기 전 개인정보를 가리거나 비공개 처리해야 하는 절차가 제대로 지켜지지 않았고, 특히 이미지 형태 첨부파일은 기존 필터링으로 걸러지지 않았다(행안부 자체 확인).\n- 구조적 원인 [추정 — 분석]: \"정보공개\"라는 공공성과 \"개인정보 보호\"라는 책무가 같은 업무 흐름 안에서 충돌할 때, 문서를 생산·공개하는 담당자 개개인의 판단에 전적으로 맡겨져 있었다면 대량의 문서를 처리하는 과정에서 누락이 반복적으로 생길 수 있다. 2024년 이후 공개된 문서가 점검 대상이 됐다는 것은, 그만큼 오랜 기간 이 문제가 구조적으로 반복됐을 가능성을 보여준다.\n\n**침투 경로**: 공개된 내용에 외부 공격자의 침입 증거는 없다. 이 사건은 공공기관의 문서 공개·비식별 처리 과정에서 생긴 정보관리 사고이며, ATT&CK(공격자의 의도적 행위를 분류하는 체계)는 공격 행위가 확인되지 않은 이번 사건에는 매핑하지 않는다.\n\n**어떻게 조치하나**\n- 즉시: (행안부 조치) 원문정보 다운로드 서비스 일시 중단, 전국 공공기관 전수점검 요청. (본 보고서의 권고) 이미 노출돼 내려받힌 이력이 있는 문서는 외부 반출 여부와 2차 유포 가능성을 점검한다.\n- 단기: 전수점검 결과에 따라 노출이 확인된 정보주체에게 개별 통지하고, 노출 기간 동안의 다운로드·열람 이력을 확인한다.\n- 장기: 이미지 형태 첨부파일까지 인식할 수 있는 개인정보 필터링 소프트웨어를 도입하고, 문서 생산 단계부터 개인정보 비식별 처리를 의무적으로 검증하는 절차를 마련한다.\n- 탐지: 공개 문서의 개인정보 포함 여부를 주기적으로 자동 재검사하는 체계를 두고, 과거 공개 문서도 소급 점검한다.\n\n**교훈**: \"해킹당하지 않아도\" 개인정보는 유출될 수 있다. 공개를 전제로 하는 시스템일수록, 공개하기 전 단계의 비식별 처리 절차가 기술적 방어(암호화·접근 통제)보다 먼저 지켜야 할 기본이라는 점을 보여준다.\n\n### [D20261106-obsoft] 국내 의료기관 5곳, 신생 랜섬웨어 조직 '옵소프트' 약 90TB 탈취 주장(검증 안 됨)\n> 날짜: 다크웹 게시(추정) 2026년 11월 초 · 보도 2026-11-05 · 유형: 랜섬웨어 협박(검증 안 됨) · 행위자: 옵소프트(OBSOFT, 신규 관측 조직, 다크웹 자체 표기) · 지역: 한국 · 근거: 주장(공격자 다크웹 게시물, 독립 확인 없음)\n\n**쉽게 말하면**: 새로 등장한 랜섬웨어 조직 '옵소프트(OBSOFT)'가 다크웹에, 국내 의료기관 5곳에서 합쳐서 약 90TB(전체 6건 기준으로는 약 123TB)에 달하는 수술 자료·환자 영상·개인정보를 탈취했다고 주장하는 게시물을 올렸습니다. 보도는 가려진 도메인을 실제 병원 홈페이지와 대조해 안양·구리·의정부·하남 지역의 의료기관일 가능성이 있는 후보를 추정했지만, 이는 추정일 뿐 실제 피해 병원이라는 확인은 아닙니다. 공격자는 협박문에서 24시간 내 연락이 없으면 몸값을 두 배로 올리고 48시간 후 자료를 공개하겠다고 압박했습니다. 다만 해당 병원들의 공식 입장이나, 실제로 병원 시스템이 뚫려 자료가 암호화·탈취됐는지는 아직 확인되지 않았습니다 — 다크웹 주장만 있는 상태입니다.\n**먼저 할 일(초보용)**: 해당 지역 의료기관을 이용하는 환자가 지금 당장 할 일은 없습니다(어느 병원인지조차 확인되지 않았습니다). 병원 IT 담당자는 원격접속·관리자 계정 사용 이력, 비정상적인 대용량 외부 전송, 환자정보·의료영상 저장 시스템과 백업의 접근 기록을 지금 점검해 볼 필요가 있습니다.\n\n**개요**: 다크웹에 새로 등장한 랜섬웨어 조직 '옵소프트'가 피해 주장 게시물 6건(그중 한국 표시 5건)을 올렸다. 한국 표시 5곳의 탈취 주장 규모 합계는 약 89.81TB, 6건 전체는 약 122.65TB다. 기사는 이 수치가 공격자 측 주장이며, 반출 파일 목록이나 전송 기록으로 검증되지 않았다고 명시한다. 병원명은 정확히 공개되지 않았지만, 가려진 도메인을 실제 홈페이지와 대조한 결과 안양·구리·의정부·하남 소재 의료기관과 철자·글자 수가 맞는 후보가 나왔다(추정이며 확인 아님). 네 번째 대상은 특정하기 어렵다고 보도됐다. 실제 침해·의료정보 유출 여부는 조사가 필요한 상태다. 게시물의 'Resolved'·'Data destroyed' 표시만으로는 협상 타결·금전 지급·자료 삭제 여부를 판단할 수 없다고 보도는 강조한다. 파일이 암호화되고 '.obsoft' 확장자가 붙으며 'READ_ME.txt' 협박문이 생성된다는 악성코드 동작이 공개 분석 샘플에서 확인됐지만, 그 샘플이 이번 한국 공격에 실제로 쓰였는지는 확인되지 않았다. 협박문은 수술 자료, 환자 영상, 개인정보를 내려받았다고 주장하며, 24시간 내 연락이 없으면 몸값을 두 배로 올리고 48시간 후 공개하겠다고 압박한다. 병원 측의 공식 입장이나 대응은 보도에서 확인되지 않았다.\n\n**왜 일어났나**\n- 직접 원인 [주장 — 검증 안 됨]: 공격자는 의료기관의 시스템을 침해해 대용량 자료를 탈취했다고 주장하지만, 이를 뒷받침하는 독립적인 확인(병원 공지, 당국 발표, 포렌식 증거)은 아직 없다.\n- 구조적 원인: 실제 침해 여부부터 확인되지 않아 구조적 원인을 분석하지 않는다.\n\n**침투 경로**: 침투 경로에 대한 정보가 전혀 공개되지 않았고, 피해 사실 자체도 공격자 일방의 다크웹 게시물에만 근거한다. 이 보고서는 공격자 일방 주장만 있는 사건에 ATT&CK 매핑을 하지 않는다(의료기관 명단조차 보도 추정 수준이기 때문이다).\n\n**어떻게 조치하나**\n- 즉시: (본 보고서의 권고) 추정 대상 지역(안양·구리·의정부·하남)의 의료기관은 원격접속·관리자 계정 사용 이력을 지금 점검하고, 비정상적인 대용량 외부 전송 흔적이 있는지 확인한다.\n- 단기: 환자정보·의료영상 저장 시스템과 백업의 접근 기록을 점검하고, 이상이 발견되면 즉시 KISA·개인정보보호위원회에 신고한다.\n- 장기: 의료기관은 원격 유지보수 계정에도 일반 업무 계정과 동등한 다중 인증·접근 통제를 적용하고, 대용량 의료영상 저장소의 외부 반출을 탐지하는 체계를 둔다.\n- 탐지: 해당 없음(공격자 주장만 있는 단계로, 구체적 탐지 지표를 제시하기 어렵다).\n\n**교훈**: 다크웹의 탈취 주장은 그 자체로 사실 확인이 아니다. 피해 병원조차 특정되지 않은 상태에서 \"90TB 탈취\"라는 숫자만 퍼지면 근거 없는 공포나 반대로 근거 없는 안심을 낳을 수 있으므로, 독립 확인 없이는 추정으로만 다뤄야 한다.\n\n## 3. 국내 소식\n\n- **①금융권**: 금융위원회가 11/5 발표한 집계(9/30~11/3 금융권 37개사·40건 침해사고, 개인정보 약 47만3천건·자금 약 10억원 피해)와 후속 대책(약 580개사 전수점검, 망분리 규제 전면해제 TF, AI방어서비스 등)을 `국내뉴스.psv`에 기록했다.\n- **③공공·교육·의료 / ④국내 랜섬웨어**: 정부 정보공개포털의 개인정보 노출(행안부, `D20261106-govportal`)과 국내 의료기관 5곳을 겨냥한 랜섬웨어 협박 주장(`D20261106-obsoft`)을 확인해 기록했다.\n- **⑥규모 갱신**: 더존비즈온 사태(`D20261104-douzone`)의 유출 의심 기업 목록이 11/5에도 늘어 e스포츠단 T1과 서울시 육아종합지원센터가 추가로 확인됐다는 보도를 `국내뉴스.psv`에 기록했다.\n\n## 4. 우선 대응 체크리스트\n\n1. **아이폰·안드로이드 이용자 전반(최우선, 신규)**: [D20261106-apt29](#d20261106-apt29-러시아-연계-apt29추정-정상-웹사이트-변조로-아이폰안드로이드-겨냥poisoned-source) — OS·Chrome 즉시 최신 버전 업데이트.\n2. **CWP(Control Web Panel) 운영 서버 관리자(신규)**: [D20261106-cwpdoor](#d20261106-cwpdoor-서버관리패널-cwp-변조-공급망-공격cwpdoor-노출-인스턴스-34만여-개) — cwpsrv 바이너리·헬퍼 프로세스 점검, 감염 시 제어판 자격 증명 전체 교체.\n3. **DigiCert에 신원확인문서를 제출한 고객(신규)**: [D20261106-digicert](#d20261106-digicert-인증기관-digicert-내부-시스템-노출로-고객정보신원확인문서-유출) — 회사 통지 확인, 노출 문서 있으면 명의도용 방지 서비스 검토.\n4. **더존비즈온 피해(의심) 목록에 새로 포함된 T1·서울시 육아종합지원센터 등 관련 기관·개인**: 각 기관 공지 확인([D20261104-douzone](2026-11-04.md) 참고).\n\n## 5. 검증 수준과 한계\n\n- 프랑스 아르케아 은행 사건은 피해 규모(1억 3,300만 달러)가 블록체인 추적가의 추산이며, 은행은 \"규모가 맞다\"고만 인정했을 뿐 정확한 금액은 밝히지 않았다.\n- 국내 의료기관 랜섬웨어 협박(`D20261106-obsoft`)은 공격자의 다크웹 게시물에 근거하며 [주장]으로 구분하고 ATT&CK 매핑을 하지 않았다.\n\n## 출처\n\n- BleepingComputer: \"DigiCert data breach exposes customer information, identity documents\", \"Hackers backdoor Linux servers using trojanized CWP web server\"\n- 보안뉴스: \"[더존비즈온 사태] 11월5일 유출 의심 기업 현황... e스포츠단 T1 유출 가능성\"(idxno=147045), \"협력업체 거쳐 은행 계좌로 직행... 프랑스 아르케아, 1억3300만달러 규모 탈취 인정\"(idxno=147013), \"47만건 유출에 털린 금융권\"(idxno=147032)\n- 데일리시큐: \"[단독] 국내 의료기관 5곳 겨냥한 랜섬웨어 협박 정황\"(idxno=209331), \"정부 정보공개포털서 주민번호·암 진단서까지 개인정보 노출\"(idxno=209329), \"[금융사 해킹 종합] 금융권 37개사 해킹 등 침해사고 40건\"(idxno=209324), \"러시아 APT29 연계 해커, 정상 웹사이트로 아이폰·안드로이드 공격\"(idxno=209325)\n- MITRE ATT&CK v20.1\n"},{"path":"일일/2026-11-06.md","title":"일일 보안 이슈 분석 — 2026-11-06","md":"# 일일 보안 이슈 분석 — 2026-11-06\n\n> 수집 기준: 2026-11-06 공개·보도분([11-05 보고서](2026-11-05.md) 이후). CISA KEV 공식 카탈로그 페이지(Apple CVE-2024-27834 1건 등재 확인) 및 해외·국내 보도를 확인했다.\n> 근거 표기: **[확인]** 벤더·정부기관·연구기관이 직접 확인 / 보도 언론 보도 / **[추정]** 본 보고서의 추정 / **[주장]** 공격자 일방 주장. **조치는 본 보고서의 권고**이며 벤더 공식 지침이 우선한다.\n> **ATT&CK 버전 점검**: attack.mitre.org 직접 확인 결과 공식 버전은 **v20.1**이다.\n\n## 1. 오늘의 요약\n\n| # | 이슈 | 유형 | 상태 | 즉시 조치 |\n|---|------|------|------|-----------|\n| 1 | 프랑스 혈액원 냉장시설까지 공격 확산, FBI·CISA가 냉동·냉장 시스템 공격에 공동 경보 | 산업제어(OT) 원격 조작·공급업체 경유 | [확인] EFS·Coolworld 자체 확인, FBI/CISA 공동 권고 | 냉동·냉장 컨트롤러를 공용 인터넷에서 분리 |\n| 2 | Zyxel GS1900 스위치 제로데이, 6월 패치를 우회해 약 1,000대 침해 | 네트워크 장비 취약점(실제 악용 확인) | [확인] 벤더·GreyNoise·Binarly 확인 | 11/3 보안 권고의 신규 펌웨어로 즉시 업데이트 |\n| 3 | 호스팅업체 DreamHost, 파일관리자 침해로 FTP·웹메일 자격 증명 유출 확정 | 호스팅 서비스 소프트웨어 취약점 악용 | [확인] 회사 자체 확인 | FTP/SFTP·웹메일 비밀번호 변경, 웹사이트 파일 변조 여부 확인 |\n| 4 | 외국인 대상 핀테크 한패스, API 비인가 접근으로 증명서·개인정보 유출 | 핀테크 API 비인가 접근 | [확인] 회사 자체 공지 | 한패스 사칭 피싱 주의, 명의도용 방지 서비스 검토 |\n| 5 | 국산 게임 '니케' PC 런처 공급망 공격, 지갑·비밀번호 탈취 악성코드 유포 | 게임 클라이언트 공급망(CDN·도메인) 공격 | [확인] 회사·연구자 확인 | 9/27 15:41 이후 런처 실행 PC는 공식 점검 도구로 감염 확인 |\n\n> 11/05 공개·보도분 6건(APT29 Poisoned Source, 아르케아 은행, CWPdoor, DigiCert, 정보공개포털, 옵소프트 주장)은 [2026-11-05 보고서](2026-11-05.md)에 분리 수록했다.\n\n## 2. 이슈별 분석\n\n### [D20261106-coldchain] 프랑스 혈액원 냉장시설까지 공격 확산, FBI·CISA 냉동·냉장 시스템 경보\n> 날짜: 유럽 슈퍼마켓 1차 공격 2026년 10월(프랑스) · 2차 공격 2026-11-01~11-02(벨기에·네덜란드·스웨덴·룩셈부르크·아일랜드·에스토니아 115개+ 매장, [D20261103-eufridge](../2026-11-02.md#d20261103-eufridge-유럽-슈퍼마켓-냉동냉장-시스템-원격-조작-벨기에네덜란드-등-115개-매장)) · 프랑스 혈액원(EFS) 냉장시설 공격 2026-11-02 · EFS 성명 2026-11-03 · FBI·CISA 등 공동 경보 2026-11-05 · 유형: 산업용 냉동·냉장 제어시스템(OT) 원격 조작, 설비 공급업체 경유 · 행위자: 미귀속 · 지역: 유럽(해외), 미국 당국 경보는 전 세계 적용 대상 · 근거: 확인(EFS·Coolworld 자체 확인, FBI/CISA/HHS/USDA/DOT 공동 권고)\n\n**쉽게 말하면**: 지난 일일 보고서(11-04)에서 다룬 유럽 슈퍼마켓 냉장고 원격 조작 사건(벨기에·네덜란드 등 115개 이상 매장)에 이어, 11월 2일에는 프랑스 국립 혈액원(EFS)의 혈액 보관 냉장시설 3곳까지 영향을 받았습니다. 직접 공격당한 것은 EFS가 아니라 냉장 설비를 관리해 주는 유럽 업체 Coolworld Rentals였고, 이 회사의 원격 모니터링 소프트웨어가 뚫려 보관실 온도·제상(서리 제거) 설정이 아주 높게 바뀌었습니다. 다행히 혈액 제품 손실이나 건강상 영향은 없었고, 직원들이 제품을 다른 시설로 옮겨 막았습니다. 하루 뒤인 11월 5일, 미국 FBI와 CISA 등 5개 기관은 산업용 냉동·냉장 제어시스템을 겨냥한 공격이 늘고 있다며 공동 경보를 발표했습니다. 다만 미국 당국이 유럽 사건들을 같은 공격자의 소행이라고 공식적으로 연결한 것은 아닙니다.\n**먼저 할 일(초보용)**: 대형 유통매장·물류센터·의료기관의 냉동·냉장 설비 담당자는 그 설비의 온도 컨트롤러가 인터넷에서 직접 접근 가능한지 지금 확인하고, 그렇다면 즉시 공용 인터넷에서 분리하거나 접근을 차단하세요. 일반 소비자가 할 일은 없습니다.\n\n**개요**: EFS는 2026-11-03 성명에서, 11월 2일 자사 생물학적 시료·혈액 제품을 보관하는 3개 시설의 저온 보관실 온도 및 제상 설정값이 비정상적으로 올라갔다고 밝혔다. 직접 침해당한 곳은 EFS가 아니라 냉장 설비 공급·관리 업체인 Coolworld Rentals로, 자사가 직접 통제하지 않는 제3자 구성요소의 취약점이 악용됐다고 설명했다. 수혈용 혈장과 의약품 제조용 혈장은 다른 시설로 옮기거나 보관해 손상을 막았고, 채혈·공급은 중단 없이 계속됐다. EFS는 프랑스 국가사이버보안청(ANSSI)·보건부와 협력해 대응 중이다. 이 사고는 2026년 10월 프랑스 슈퍼마켓 약 250~350곳, 11월 1~2일 벨기에·네덜란드 등 6개국 115개 이상 매장(본 저장소 [D20261103-eufridge]로 기록)에서 발생한 냉장 시스템 원격 조작의 뒤를 이은 것이다. 벨기에 업체 Sabcobel은 11월 공격이 10월과 \"동일한 취약점\"을 썼다고 밝혔지만, EFS·Coolworld 사건이 Danfoss 등 같은 장비·같은 취약점을 썼는지는 보도에서 확인되지 않는다. 11월 5일 FBI·CISA·HHS·USDA·DOT는 산업용 냉동·냉장 설비와 콜드체인 모니터링 시스템(전자식 온도 컨트롤러, 상업용 냉동 관리 시스템)을 겨냥한 공격에 공동 경보를 냈다. 인터넷에 노출됐거나 패치되지 않은 장비가 인증 우회·임의 코드 삽입·취약한 설정으로 악용되고 있으며, 공격자가 온도를 바꾸거나 냉동기를 제상 모드로 전환시킬 수 있다고 설명했다. 경보는 이 사건들을 시간순으로 언급했을 뿐, 미국 당국이 동일 공격자·캠페인으로 공식 귀속하지는 않았다.\n\n**왜 일어났나**\n- 직접 원인 [확인]: Coolworld의 원격 모니터링 소프트웨어의 제3자 구성요소 취약점이 악용돼 EFS 시설 3곳의 온도·제상 설정이 변경됐다(EFS·Coolworld 자체 확인). FBI/CISA 경보는 업계 전반에서 인증 우회·임의 코드 삽입·취약한 설정이 악용되고 있다고 설명한다.\n- 구조적 원인 [추정 — 분석]: 냉동·냉장 설비는 전통적으로 \"안전·식품관리\" 영역으로 다뤄져 왔지, 사이버보안 투자 우선순위에서는 뒤로 밀리는 경우가 많다. 그 결과 인터넷에 직접 노출된 관리 인터페이스, 패치되지 않은 소프트웨어, 공급업체를 통한 원격 접근이 그대로 방치되는 경향이 있고, 이번처럼 설비 하나가 뚫리면 혈액·의약품 보관처럼 생명과 직결된 시설까지 번질 수 있다.\n\n**침투 경로 [부분 확인]**: Coolworld가 통제하지 않는 \"제3자 구성요소\"의 취약점이 악용됐다는 점만 확인됐다. 구체적인 취약점 종류, Danfoss 등 10월 사건과 동일한 결함인지는 공개되지 않아, 이 사건 단독으로는 구체적 초기접근 기법을 특정하지 않는다. 다만 온도·제상 설정을 변경한 결과(데이터 조작)는 EFS·FBI/CISA가 공통으로 확인했다.\n\n**어떻게 조치하나**\n- 즉시: (FBI/CISA 권고) 냉동·냉장 컨트롤러를 공용 인터넷에서 분리하고, 필요한 원격 접속은 안전하게 보호한다. 기본 비밀번호를 변경하고 제공되는 보안 업데이트를 적용한다. (본 보고서의 권고) 영향 가능성이 있는 설비는 패치 전이라도 접근 로그를 증거 보존 차원에서 먼저 확보한다.\n- 단기: OT(운영기술) 시스템을 업무망과 분리하고, 컨트롤러가 허용 범위를 벗어나지 않도록 안전한 온도 제한을 설정한다. 냉동·냉장 설비 유지보수 공급업체의 원격 접근 계정도 일반 업무 계정과 동등하게 점검한다.\n- 장기: 의료·식품·운송 등 생명·안전과 직결된 OT 시설은 공급업체 원격 모니터링 소프트웨어 자체를 정기 보안 점검 대상에 포함하고, 한 공급업체 장애가 여러 고객 시설에 동시에 번지지 않도록 접근을 세분화한다.\n- 탐지: 냉동·냉장 설비의 원격 설정 변경 이벤트, 비정상적인 온도·제상 모드 전환에 대한 실시간 알림 체계를 둔다.\n\n**교훈**: 슈퍼마켓 냉장고에서 시작된 공격이 한 달 안에 혈액 보관시설까지 번졌다는 것은, OT(운영기술) 공급망의 한 고리가 뚫리면 전혀 다른 업종·전혀 다른 중요도의 시설까지 연쇄적으로 위험해질 수 있다는 뜻이다. \"식품 창고 냉장고\"와 \"혈액 보관 냉장고\"는 쓰는 사람이 다르지만, 뚫리는 경로는 같을 수 있다.\n\n### [D20261106-zyxel] Zyxel GS1900 스위치 제로데이, 6월 패치를 우회해 약 1,000대 침해\n> 날짜: 공격 관측 시작(추정) 2026-08-17 · GreyNoise의 기존 CVE 연결·CISA KEV 등재 2026-09-21 · Binarly 제보 2026-09-29 · Zyxel 신규 CVE 확인 2026-10-11 · 패치 배포 2026-10-22 · 보안 권고 공개 2026-11-03 · 유형: 네트워크 장비 웹 관리 인터페이스 결함(실제 악용 확인) · 행위자: Kapibala(중국어 사용 위협 행위자, GreyNoise 명명) · 지역: 전 세계(해외, 48개국 약 996대) · 근거: 확인(벤더·GreyNoise·Binarly 확인)\n\n**쉽게 말하면**: 중소기업·사무실에서 많이 쓰는 Zyxel GS1900 시리즈 네트워크 스위치(10개 모델)가, 지난 6월에 이미 패치했던 결함을 \"우회\"하는 새로운 제로데이 공격을 받아 48개국에서 약 1,000대가 뚫렸습니다. 공격자('Kapibala'라는 중국어 사용 행위자로 추정)는 인증 없이 특수하게 조작된 웹 요청만으로 장비에 명령을 실행시켜, 설정값과 암호화된 관리자(root) 비밀번호, 네트워크 정보를 빼갔습니다. 연구팀이 분석한 끝에 \"6월 패치로는 막히지 않는\" 새 결함(CVE-2026-107441)이라는 사실이 10월 11일 확인됐고, Zyxel은 10월 22일 이를 막는 새 펌웨어를 배포했습니다.\n**먼저 할 일(초보용)**: Zyxel GS1900 스위치를 쓰는 관리자는 지금 바로 11월 3일 보안 권고에 안내된 최신 펌웨어로 업데이트하세요. 6월에 이미 한 번 업데이트했더라도 이번 결함은 그것으로 막히지 않으므로 다시 확인해야 합니다.\n\n**개요**: 보안 위협 모니터링 업체 GreyNoise는 2026년 8월 17일경부터 중국어 사용 위협 행위자(자체 명명 'Kapibala')가 Zyxel GS1900 스위치를 겨냥한 공격 활동을 관찰했다고 밝혔다. 공격자는 원격으로 명령을 실행한 뒤 장비 설정, 해시된 root 자격 증명, 네트워크 정보를 수집하는 스크립트를 내려받게 했으며, 48개국에서 996대가 침해됐다. 9월 21일 GreyNoise는 이 공격을 기존에 알려진 결함(CVE-2026-7273, 6월 패치됨)과 연결했고, CISA는 같은 날 이를 KEV(실제 악용 확인) 카탈로그에 등재했다. 이후 보안업체 Binarly가 회수한 익스플로잇을 분석한 결과, 공격자가 실제로는 6월 패치가 추가한 검증 절차를 우회하는 별도의 미패치 취약점(파라미터 카운터를 검증 전에 손상시키는 out-of-bounds write 결함)을 쓰고 있다는 사실을 확인했다. Binarly는 9월 29일 이를 Zyxel에 제보했고, Zyxel은 10월 11일 새로운 결함으로 확인하며 CVE-2026-107441 번호를 부여했다. Zyxel은 10월 22일 파라미터 크기를 제한하고 메모리 복사 전 파라미터 개수를 검증하는 새 펌웨어를 배포했으며, 11월 3일 보안 권고문을 공개했다. 즉 6월 패치(CVE-2026-7273용)만 적용한 장비는 여전히 이번 결함에 취약할 수 있다.\n\n**왜 일어났나**\n- 직접 원인 [확인]: GS1900 웹 관리 인터페이스의 out-of-bounds write 결함으로, 인증되지 않은 공격자가 특수하게 조작된 HTTP 요청만으로 OS 명령을 실행할 수 있었다(벤더·Binarly 확인).\n- 구조적 원인 [추정 — 분석]: 공격자가 \"패치됐다고 알려진\" 취약점의 수정 코드를 역으로 분석해, 그 수정이 막지 못하는 우회 경로(파라미터 검증 순서의 틈)를 찾아낸 사례다. 한 번의 패치로 안심하기보다, 패치 이후에도 같은 코드 경로를 공격자가 계속 분석할 수 있다는 전제가 필요하다.\n\n**침투 경로 [확인 — 벤더·연구진 확인]**: 인증 없는 공격자가 조작된 HTTP 요청 전송 → out-of-bounds write로 OS 명령 실행 → 장비 설정·해시된 root 자격 증명·네트워크 정보를 수집하는 스크립트 실행 → 수집 데이터 외부 전송(세부 방식은 공개되지 않음).\n\n**어떻게 조치하나**\n- 즉시: (벤더 권고) 11월 3일 보안 권고의 신규 펌웨어로 즉시 업데이트한다. 6월 패치만 적용된 장비도 여전히 취약할 수 있으므로 반드시 재확인한다.\n- 단기: 영향 가능 기간에 노출됐던 장비는 관리자 비밀번호를 전부 교체하고, 알 수 없는 설정 변경이나 추가 계정이 있는지 점검한다.\n- 장기: 네트워크 장비의 웹 관리 인터페이스를 인터넷에 직접 노출하지 않는 것을 기본 원칙으로 삼고, 관리 접근을 VPN·사설망으로 제한한다.\n- 탐지: 정상적이지 않은 대량의 설정 조회·다운로드 요청, 짧은 시간 내 다수 장비에서 반복되는 동일 패턴의 요청을 모니터링한다.\n\n**교훈**: 패치했다는 사실 자체가 안전을 보장하지 않는다. 특히 \"같은 결함을 막기 위한 다른 우회로\"가 존재할 수 있다는 점에서, 벤더의 공식 권고에 안내된 정확한 버전·날짜를 확인하는 습관이 중요하다.\n\n### [D20261106-dreamhost] 호스팅업체 DreamHost, 파일관리자 침해로 FTP·웹메일 자격 증명 유출 확정\n> 날짜: 침해 시작(추정) 2026년 8월경 · 발견 2026-10-23 · 보도 2026-11-04 · 유형: 호스팅 서비스(File Manager) 소프트웨어 취약점 악용 · 행위자: 미귀속 · 지역: 전 세계(해외) · 근거: 확인(회사 자체 확인)\n\n**쉽게 말하면**: 미국 웹호스팅 업체 DreamHost의 웹 기반 파일관리자(File Manager) 서버가 약 두 달간 뚫려, 그 사이 이 기능에 로그인한 고객들의 FTP/SFTP 접속정보와 일부 웹메일 세션 정보가 유출됐다고 회사가 확인했습니다. 이 사건은 10월 27일 일일 보고서가 \"증거 불충분으로 미채택\"했던 바로 그 DreamHost 비밀번호 재설정 건의 실체가 이번에 공식적으로 확인된 것입니다 — 당시 회사는 \"예방 조치\"라고만 설명했지만, 이제는 실제 공격자가 소프트웨어 취약점을 악용해 데이터에 접근했다고 인정했습니다. 회사는 컨트롤 패널 로그인 정보와 결제 정보는 접근되지 않았다고 밝혔습니다.\n**먼저 할 일(초보용)**: DreamHost 이용자는 이미 안내받은 FTP/SFTP·이메일 비밀번호 재설정을 아직 하지 않았다면 지금 하세요. 그리고 비밀번호 변경만으로는 부족합니다 — 웹메일 전달 규칙·필터가 공격자에 의해 몰래 추가됐는지 확인하고, 웹사이트 파일이 무단으로 변경되지 않았는지도 점검하세요.\n\n**개요**: DreamHost는 2026년 8월경부터 10월 23일까지 웹 기반 파일관리자 서버(files.dreamhost.com)가 침해됐으며 10월 23일 이를 발견했다고 밝혔다. 회사는 공격이 의도적이었다고 설명했다. 비인가 제3자가 File Manager 소프트웨어의 취약점을 악용했으며, 구체적인 취약점이나 최초 침투 방식은 공개하지 않았다. 유출된 정보는 해당 기간 File Manager에 로그인한 사용자의 FTP/SFTP 사용자명·비밀번호, 그리고 일부 제한된 사용자의 웹메일 시스템 접근 가능성 및 자격 증명을 포함한 세션 정보다. 컨트롤 패널 로그인 정보와 청구·결제 정보는 접근되지 않았다고 밝혔다. 영향받은 고객 수는 공개되지 않았다(BleepingComputer가 여러 차례 문의했으나 답변받지 못함). 이 사건은 본 저장소가 10월 27일 보고서에서 \"DreamHost가 File Manager 장애 이후 이메일·FTP/SFTP 비밀번호 전면 재설정을 강제했으나, 회사가 이를 '예방 조치'라고만 밝혀 실제 침해 여부가 불확실해 미채택\"으로 분류했던 사건과 같은 사안이다 — 이번 11월 4일 발표로 실제 침해였음이 공식 확인됐다. 회사는 공격자의 접근을 차단하고 취약점을 해결했으며, 영향받은 것으로 보이는 사용자의 활성 세션을 종료하고 비밀번호를 무효화했다고 밝혔다. 영향받은 개인에게는 Equifax를 통한 1년 무료 신용 모니터링과 신원 도용 보호 서비스를 제공한다.\n\n**왜 일어났나**\n- 직접 원인 [확인]: File Manager 소프트웨어의 취약점을 악용해 비인가 제3자가 서버에 접근했다(회사 자체 확인). 구체적인 결함 종류는 공개되지 않았다.\n- 구조적 원인 [추정 — 분석]: 약 두 달간 침해가 지속된 뒤에야 발견됐다는 점, 그리고 10월 26일 \"예방 조치\"로만 설명됐던 비밀번호 재설정이 실제로는 이미 확인된 침해에 대한 대응이었을 가능성을 배제할 수 없다는 점에서, 사고 초기 커뮤니케이션이 실제 위험 수준을 충분히 전달하지 못했을 가능성이 있다.\n\n**침투 경로 [확인 — 소프트웨어 취약점 수준]**: 공격자가 File Manager 소프트웨어의 취약점을 악용해 서버(files.dreamhost.com)에 접근 → 해당 기간 로그인한 이용자의 FTP/SFTP 사용자명·비밀번호 탈취 → 일부 이용자의 웹메일 세션(자격 증명 포함) 탈취. 구체적 결함 종류와 최초 접근 방식은 공개되지 않았다.\n\n**어떻게 조치하나**\n- 즉시: (회사 조치) 공격자 접근 차단, 취약점 해결, 영향받은 세션 종료·비밀번호 무효화. (본 보고서의 권고) 안내받은 비밀번호 재설정을 즉시 완료하고, 재설정 전 기간에 로그인한 적이 있다면 웹사이트 파일 변조 여부를 점검한다.\n- 단기: 웹메일 전달 규칙·필터에 낯선 항목이 추가됐는지 확인하고, 동일한 자격 증명을 다른 서비스에서도 쓰고 있었다면 그 서비스의 비밀번호도 교체한다.\n- 장기: 호스팅 서비스에 내장된 웹 기반 파일관리자 같은 부가 기능도 핵심 서비스와 동등한 취약점 관리·패치 주기를 적용한다.\n- 탐지: FTP/SFTP 계정의 비정상 로그인 위치·시간, 웹사이트 파일의 예상치 못한 변경을 모니터링한다.\n\n**교훈**: \"예방 조치\"라는 설명과 \"실제 침해 확인\"이라는 설명 사이에는 큰 차이가 있다. 불확실한 상황에서 과장도 과소평가도 피하려는 본 저장소의 '미채택' 판단이, 이번처럼 이후 공식 확인으로 뒤집힐 수 있다는 점에서, 기업의 초기 공지가 모호할 때는 후속 보도를 계속 추적하는 것이 중요하다.\n\n### [D20261106-hanpass] 외국인 대상 핀테크 한패스, API 비인가 접근으로 증명서·개인정보 유출\n> 날짜: 침해(추정) 2026-11-01 04:38 · 인지 2026-11-01 10:00경 · 보도 2026-11-06 · 유형: 핀테크(해외송금·외국인 대상 서비스) API 비인가 접근 · 행위자: 미귀속 · 지역: 한국 · 근거: 확인(회사 자체 공지)\n\n**쉽게 말하면**: 외국인 노동자 등을 대상으로 해외송금·선불카드·구인구직 서비스를 제공하는 국내 핀테크 기업 한패스가 해킹당해, 이용자의 소득금액증명·외국인등록 사실증명 같은 증명서 원본과 성명·국적·전화번호·주소 등 개인정보가 유출됐습니다. 공격자는 API(서로 다른 시스템이 데이터를 주고받는 통로)를 통해 비인가 접근을 한 것으로 확인됐지만, 구체적으로 어떤 API 결함을 이용했는지는 아직 공개되지 않았습니다. 얼마나 많은 이용자가 영향받았는지도 아직 공개되지 않았습니다.\n**먼저 할 일(초보용)**: 한패스 이용자는 한패스를 사칭한 전화·문자·이메일 피싱에 특히 주의하세요. 노출된 증명서에 소득·외국인등록 정보가 포함돼 있을 수 있으므로, 명의도용이 우려되면 KAIT의 엠세이퍼(M-Safer)나 신용평가기관의 신용조회 차단 서비스 가입을 검토하세요.\n\n**개요**: 한패스는 해외송금(200개국 이상), 선불카드, 모바일 월렛, 구인구직·행정상담 등을 제공하는 핀테크 기업으로, 공식 집계 기준 누적 송금 건수 1,300만 건·누적 송금액 10조 원 이상이다. 회사는 2026년 11월 1일 오전 4시 38분경 외부 공격자가 API를 통해 비인가 접근을 했다고 추정하며, 같은 날 오전 10시경 사고를 인지했다고 밝혔다. 유출 가능 정보는 소득금액증명·외국인등록 사실증명 등 증명서 발급 원본, 한패스모바일 가입자의 성명·국적·전화번호·주소, 선불·후불 납부정보다. 영향받은 이용자 규모, 유출된 증명서 건수, 외부 반출 규모는 모두 공개되지 않았다. 회사는 비인가 접근 경로를 차단하고 방화벽·시스템 보안 점검을 강화했으며 API 키 인증 강화 등 긴급 보안 조치를 완료했다고 밝혔다. 개인정보보호위원회·KISA·금융감독원에 신고하고 조사에 협조하고 있으며, 현재까지 2차 피해는 확인되지 않았다고 전했다.\n\n**왜 일어났나**\n- 직접 원인 [확인 — 세부는 미공개]: 외부 공격자가 API를 통해 비인가 접근을 했다는 사실은 회사가 확인했지만, 구체적인 API 종류·인증 우회 방식은 공개되지 않았다.\n- 구조적 원인 [추정 — 분석]: 소득금액증명·외국인등록 사실증명 같은 고위험 증명서를 자동 발급하는 서비스는 그 발급 과정의 API 하나라도 인증·인가 검증이 허술하면, 신분증·소득정보처럼 명의도용에 직결되는 민감정보가 대량으로 노출될 수 있는 구조다. 외국인 이용자는 신고·분쟁 대응 체계에 상대적으로 접근성이 낮을 수 있어 2차 피해 대응이 더 어려울 수 있다.\n\n**침투 경로 [부분 확인 — 미공개]**: API를 통한 비인가 접근이라는 사실만 확인됐다. 구체적인 API 결함(인증 누락, 권한 검증 누락, 파라미터 조작 등)은 공개되지 않아 구체적 ATT&CK 기법까지는 확정하지 않고 T1190(공개 애플리케이션 악용)으로만 매핑한다.\n\n**어떻게 조치하나**\n- 즉시: (회사 조치) 비인가 접근 경로 차단, 방화벽·시스템 보안 점검 강화, API 키 인증 강화, 관계기관 신고. (본 보고서의 권고) 유출 범위가 아직 확정되지 않았으므로 영향 가능 기간(11/1 전후)에 발급된 증명서 전체를 우선 점검한다.\n- 단기: 영향받은 이용자가 확정되면 개별 통지를 신속히 진행하고, 증명서 재발급·검증 과정에 추가 인증 단계를 도입한다.\n- 장기: 민감 증명서를 자동 발급하는 모든 API에 대해 정기적인 침투 테스트와 권한 검증 재점검을 의무화한다.\n- 탐지: 짧은 시간 내 비정상적으로 많은 증명서 발급 요청, 동일 IP·계정에서 반복되는 API 호출 패턴을 모니터링한다.\n\n**교훈**: 외국인 대상 금융·행정 서비스는 소득·체류자격처럼 그 자체로 신분증명과 다를 바 없는 고위험 정보를 다룬다. API 하나의 인증 결함이 이런 정보를 대량으로 노출시킬 수 있다는 점에서, \"증명서 발급\"처럼 외부에서 자동으로 호출되는 기능일수록 더 엄격한 검증이 필요하다.\n\n### [D20261106-nikke] 국산 게임 '니케' PC 런처 공급망 공격, 지갑·비밀번호 탈취 악성코드 유포\n> 날짜: 도메인 탈취·런처 스크립트 변조 2026-09-27 15:41(KST) · 포렌식상 악성코드 실행 확인(사례) 2026-11-01~11-03 · 클라이언트 긴급 수정 2026-11-04 02:30경 · 자동 검사·제거 기능 추가 2026-11-05 · 보도 2026-11-04~05 · 유형: 게임 클라이언트 공급망(CDN·도메인) 공격 · 행위자: 미귀속 · 지역: 한국(개발사 시프트업, 서비스사 레벨인피니트, 해외 이용자 포함) · 근거: 확인(회사·연구자 MotherSphere 확인)\n\n**쉽게 말하면**: 국내 게임사 시프트업이 만들고 레벨인피니트가 서비스하는 모바일·PC 게임 '승리의 여신: 니케'의 PC 런처(게임을 실행해 주는 프로그램)가 공급망 공격을 당해, 정식 런처를 그대로 실행한 이용자도 모르는 사이에 원격조종 악성코드에 감염될 수 있었습니다. 공격자는 9월 27일 게임 서비스가 쓰던 외부 도메인 하나를 탈취해, 런처가 공식 CDN(콘텐츠 전송망)에서 내려받는 스크립트 4개를 변조했습니다. 이 때문에 가짜 설치파일을 내려받지 않고 정식 런처만 실행해도 감염될 수 있었던 것이 특징입니다. 심어진 악성코드('K2F')는 명령 실행, 파일 탐색·다운로드, 화면 캡처는 물론 런처 로그인정보·브라우저 저장 비밀번호·가상자산 지갑 파일까지 수집할 수 있었고, 크롬에 악성 DLL을 심어 런처를 꺼도 계속 실행되도록 했습니다. 회사는 11월 4일 새벽 클라이언트를 수정했고, 11월 5일에는 공식 PC 클라이언트에 자동 검사·제거 기능을 추가했습니다.\n**먼저 할 일(초보용)**: 9월 27일 오후 3시 41분 이후 니케 PC 런처를 실행한 적이 있는 Windows 이용자는 지금 바로 공식 보안 공지에 안내된 점검 도구로 감염 여부를 확인하세요. 감염이 확인되면, 해당 PC가 아닌 다른 기기나 안전성이 확인된 PC에서 비밀번호를 변경하고 필요한 인증 수단을 재발급하세요(감염된 PC에서 새 비밀번호를 만들면 그 비밀번호도 바로 다시 유출될 수 있습니다).\n\n**개요**: 2026년 9월 27일, 니케 PC 런처가 쓰는 일부 게임 서비스 도메인(insightjs.com)이 제3자에 의해 탈취됐다. 같은 날 오후 3시 41분~42분(KST) 사이, PC 런처가 공식 CDN에서 내려받는 스크립트 파일 4개가 외부 도메인에 연결되도록 변조됐다. 런처 자체가 전달 경로였기 때문에, 가짜 설치파일을 내려받지 않고 정식 런처만 실행해도 노출될 수 있었다. 연구자 MotherSphere의 정적 분석에 따르면, 변조된 스크립트는 추가 코드를 끌어오고 런처의 다운로드·실행 기능을 악용해 원격조종 악성코드('K2F')를 실행시켰다. K2F는 명령 실행, 파일 탐색·다운로드, 화면 캡처 기능을 가지며, 저장된 니케 런처 로그인정보, 브라우저에 저장된 비밀번호·쿠키, 개발자 도구 자격 증명, 가상자산 지갑 파일을 수집할 수 있다. Windows에서는 추가로 크롬이 악성 DLL을 로드하도록 설정해, 런처를 종료해도 악성코드가 계속 실행되도록 했다. 감염된 이용자 수와 실제 탈취된 데이터 규모는 공개되지 않았다. 알려진 노출 기간은 9월 27일 오후 3시 41분 이후부터이며, 한 이용자 PC의 포렌식 분석에서는 11월 1~3일 사이 악성 에이전트가 다운로드·실행된 것이 확인됐지만, 실제로 어떤 명령이 내려졌는지, 비밀번호·파일이 실제로 탈취됐는지까지는 입증되지 않았다. 11월 4일 새벽 2시 30분경 회사는 클라이언트를 수정·업데이트했고, 배포 서버에 남아 있던 이전 버전의 CDN 캐시도 정오경까지 갱신했다. 11월 5일에는 공식 PC 클라이언트에 자동 검사·제거 기능을 추가했다. 9월 27일 오후 3시 41분 이후 런처를 실행한 Windows 이용자에게 안내와, 런처를 켜지 않고도 확인할 수 있는 수동 점검 방법을 안내했다.\n\n**왜 일어났나**\n- 직접 원인 [확인]: 게임 서비스가 쓰던 외부 도메인이 탈취돼, 런처가 공식 CDN에서 내려받는 스크립트가 변조됐다(회사·연구자 확인).\n- 구조적 원인 [추정 — 분석]: 게임 런처처럼 자동으로 외부 스크립트를 내려받아 실행하는 구조는, 그 스크립트가 참조하는 도메인 하나만 탈취돼도 \"정식 프로그램을 그대로 실행한\" 모든 이용자에게 동시에 악성코드가 퍼질 수 있는 구조적 위험을 안고 있다. 도메인 소유권 관리(갱신 누락, 등록 정보 관리 등)가 소홀하면 이런 탈취가 쉬워진다.\n\n**침투 경로 [확인 — 회사·연구자 확인]**: 외부 게임 서비스 도메인(insightjs.com) 탈취 → PC 런처가 내려받는 CDN 스크립트 4개 변조 → 정식 런처 실행 시 변조된 스크립트가 추가 코드를 끌어와 원격조종 악성코드(K2F) 실행 → 런처 로그인정보·브라우저 저장 비밀번호·쿠키·개발자 도구 자격 증명·가상자산 지갑 파일 수집 → Windows에서는 크롬에 악성 DLL을 로드시켜 런처 종료 후에도 지속 실행.\n\n**어떻게 조치하나**\n- 즉시: (회사 조치) 클라이언트 수정·배포, CDN 캐시 갱신, 공식 보안 공지로 영향 가능 이용자 안내, 자동 검사·제거 기능 추가. (본 보고서의 권고) 9/27 15:41 이후 런처를 실행한 PC는 안내된 점검 도구로 감염 여부를 먼저 확인한다.\n- 단기: 감염이 확인된 PC는 전체 재설치를 검토하고, 해당 PC에서 쓰던 모든 계정(게임·이메일·가상자산 지갑 등)의 비밀번호를 다른 안전한 기기에서 변경한다.\n- 장기: 외부 도메인에 의존하는 CDN·스크립트 로딩 구조를 줄이고, 도메인 소유권 갱신·모니터링을 자동화해 탈취를 예방한다. 클라이언트가 실행 시 내려받는 스크립트에는 무결성 검증(서브리소스 무결성 등)을 적용한다.\n- 탐지: 게임 클라이언트가 평소와 다른 외부 도메인에 접속하는지, 알 수 없는 DLL이 브라우저에 로드되는지 모니터링한다.\n\n**교훈**: \"정식 프로그램을 그대로 실행했을 뿐\"인데도 감염될 수 있다는 점에서, 이용자 입장의 주의(가짜 설치파일 조심)만으로는 막을 수 없는 공급망 공격이었다. 게임사·서비스사가 쓰는 외부 도메인·CDN 전체가 공격 표면이라는 전제로 관리해야 한다.\n\n## 3. 국내 소식\n\n- **①금융권**: 핀테크(해외송금) 기업 한패스의 해킹을 확인해 `D20261106-hanpass`로 기록했다.\n- **별도로 확인한 국내 사건**: 국산 게임 '니케' PC 런처 공급망 공격(`D20261106-nikke`)은 해외 매체(BleepingComputer)와 국내 매체(데일리시큐·보안뉴스) 양쪽에서 동시에 보도됐다.\n\n## 4. 우선 대응 체크리스트\n\n1. **냉동·냉장 제어시스템을 운영하는 의료·식품·물류 기관(최우선, 신규)**: [D20261106-coldchain](#d20261106-coldchain-프랑스-혈액원-냉장시설까지-공격-확산-fbicisa-냉동냉장-시스템-경보) — 컨트롤러를 공용 인터넷에서 분리, 기본 비밀번호 교체.\n2. **Zyxel GS1900 스위치 운영자(신규)**: [D20261106-zyxel](#d20261106-zyxel-zyxel-gs1900-스위치-제로데이-6월-패치를-우회해-약-1000대-침해) — 11/3 보안 권고의 신규 펌웨어로 재확인·업데이트(6월 패치만으로는 불충분).\n3. **DreamHost 이용자(신규)**: [D20261106-dreamhost](#d20261106-dreamhost-호스팅업체-dreamhost-파일관리자-침해로-ftp웹메일-자격-증명-유출-확정) — FTP/SFTP·웹메일 비밀번호 재설정, 웹메일 전달규칙·웹사이트 파일 변조 여부 확인.\n4. **한패스 이용자(신규)**: [D20261106-hanpass](#d20261106-hanpass-외국인-대상-핀테크-한패스-api-비인가-접근으로-증명서개인정보-유출) — 사칭 피싱 주의, 명의도용 방지 서비스 검토.\n5. **니케 PC 런처를 9/27 이후 실행한 Windows 이용자(신규)**: [D20261106-nikke](#d20261106-nikke-국산-게임-니케-pc-런처-공급망-공격-지갑비밀번호-탈취-악성코드-유포) — 공식 점검 도구로 감염 확인, 감염 시 다른 기기에서 비밀번호 변경.\n6. SonicWall GMS(9.5.2 이하, 지원종료) 운영 조직: 벤더가 해당 결함(CVE-2026-109593·109594)을 패치하지 않기로 선언했으므로 Network Security Manager(NSM)로 마이그레이션 검토.\n\n## 5. 검증 수준과 한계\n\n- CISA KEV 11/4~11/6 등재분 중 Apple CVE-2024-27834(포인터 인증 우회)는 2024년 이미 수정 배포가 끝난 결함이라 별도 전체 항목으로 다루지 않았다.\n- 한패스 사건은 구체적인 API 결함·영향 규모가 공개되지 않아 ATT&CK 매핑을 T1190(공개 애플리케이션 악용) 수준으로만 제한했다.\n\n## 출처\n\n- CISA KEV 카탈로그(공식 웹페이지, 직접 확인)\n- BleepingComputer: \"Zyxel fixes zero-day exploited to hack nearly 1,000 network switches\", \"SonicWall warns of unpatched flaws in end-of-life GMS software\", \"DreamHost confirms data breach exposed FTP logins and webmail sessions\", \"Cyberattack disrupts blood storage refrigeration systems in France\", \"FBI, CISA warn of cyberattacks targeting refrigeration systems\", \"NIKKE PC game launcher hacked to spread remote access, data-stealing malware\"\n- 보안뉴스: \"'니케' 런처 해킹 공식 사과\"(idxno=147025), \"혈액 냉장실 온도 설정값 치솟아... 프랑스혈액원\"(idxno=147015)\n- 데일리시큐: \"한패스 해킹으로 고객 개인정보 유출\"(idxno=209335), \"국내 게임 '승리의 여신: 니케' PC 런처 해킹\"(idxno=209328), \"프랑스 혈액 보관시설 3곳 해킹\"(idxno=209327)\n- MITRE ATT&CK v20.1\n"},{"path":"일일/2026-11-07.md","title":"일일 보안 이슈 분석 — 2026-11-07","md":"# 일일 보안 이슈 분석 — 2026-11-07\n\n> 수집 기준: 2026-11-07 공개·보도분([11-06 보고서](2026-11-06.md) 이후). CISA KEV 등재(SonicWall CVE-2026-19868) 및 OpenSSH 'SSHole'(CVE-2026-123158) 첫 성공 악용 관측, 국내 금융권 소식을 확인했다.\n> 근거 표기: **[확인]** 벤더·정부기관·연구기관이 직접 확인 / 보도 언론 보도 / **[추정]** 본 보고서의 추정 / **[주장]** 공격자 일방 주장. **조치는 본 보고서의 권고**이며 벤더 공식 지침이 우선한다.\n> **ATT&CK 버전 점검**: attack.mitre.org 직접 확인 결과 공식 버전은 **v20.1**이다.\n\n## 1. 오늘의 요약\n\n| # | 이슈 | 유형 | 상태 | 즉시 조치 |\n|---|------|------|------|-----------|\n| 1 | 'SSHole' OpenSSH 인증 우회(CVE-2026-123158), musl 기반 리눅스 실제 악용 | 네트워크 노출 서비스 결함(실제 악용 확인) | [확인] GreyNoise 등 다수 연구기관 확인, KEV 11/9 | OpenSSH 10.6p2 이상 업데이트 또는 비밀번호 로그인 비활성화 |\n| 2 | SonicWall SSL-VPN SAML 인증(MFA) 우회(CVE-2026-19868) 실제 악용 | VPN 인증 우회(실제 악용 확인) | [확인] 벤더 PSIRT·CISA KEV 11/6 | 7.3.4-7013(Gen7)/8.2.3-8015(Gen8)로 업그레이드(우회책 없음) |\n\n## 2. 이슈별 분석\n\n### [D20261110-sshole] 'SSHole' OpenSSH 인증 우회(CVE-2026-123158), musl 기반 리눅스 실제 악용\n> 날짜: 결함 발견·수정판(10.6p2) 출시 2026-11-05 · 공격 시도 시작 2026-11-05 · 첫 성공 악용 확인(GreyNoise) 2026-11-07 00:46(UTC) · 유형: 네트워크 노출 서비스(SSH) 인증 우회(실제 악용 확인) · 행위자: 다수(봇넷·암호화폐 채굴 포함, 단일 조직 아님) · 지역: 전 세계(해외) · 근거: 확인(OpenSSH 개발자·GreyNoise·Previdian·watchTower 등 다수 연구기관 확인)\n\n**쉽게 말하면**: 가벼운 리눅스 배포판(Alpine 등)에 쓰이는 'musl'이라는 C 라이브러리와 OpenSSH를 함께 쓰는 서버에서, 비밀번호 로그인을 막아 놓은 계정인데도 아주 긴 비밀번호를 입력하면 뚫리는 결함('SSHole'이라는 이름이 붙음, CVE-2026-123158)이 발견됐습니다. 연구자가 공격 코드를 공개한 지 이틀도 안 돼 실제 공격이 시작됐고, 공격자들은 암호 파일을 훔쳐보거나 자신의 접속키를 몰래 등록해 계속 들어올 수 있게 했습니다. 다행히 지금까지 확인된 실제 성공 사례는 적은 수(한 연구기관 기준 16건)지만, 수정판(10.6p2)이 나온 지 40시간도 안 돼 첫 성공 사례가 나왔다는 점에서 패치를 미루면 위험합니다.\n**먼저 할 일(초보용)**: Alpine Linux 등 musl 기반 리눅스 서버를 관리한다면 지금 바로 OpenSSH를 10.6p2 이상으로 업데이트하거나, 업데이트가 어렵다면 SSH 비밀번호 로그인을 끄고 키(key) 인증만 허용하세요.\n\n**개요**: 결함은 계정의 비밀번호 해시 칸이 별표(*, 비밀번호 로그인 차단을 뜻함)로 설정돼 있어도, 아주 긴(비정상적으로 긴) 비밀번호를 넣으면 musl의 해시 함수가 오류로 별표를 반환하는데 OpenSSH가 이를 \"일치\"로 잘못 처리해 인증을 우회하는 방식이다. 연구자 Ozgun Kultekin이 발견했고, OpenSSH 개발팀은 2026-11-05 10.6p2로 수정판을 냈다. 같은 날 개념증명(PoC) 공격 코드가 공개돼 공격 시도가 시작됐고, watchTower는 11/6 봇넷·암호화폐 채굴과 연결된 공격을 관측했다. GreyNoise는 수정판 출시 약 40시간 뒤인 11/7 00:46(UTC) 첫 성공 악용을 확인했으며, 6개 발신 IP에서 16건의 성공 공격 체인을 기록했다(이는 전체 공격 규모를 대표하지 않는다고 밝혔다). Previdian은 9개국 13개 IP에서 20건의 시도와 성공 사례를, Defused는 소수의 공격자가 시도한 제한적 활동을, watchTower는 봇넷·채굴형 공격을 각각 관측했다. 공격자는 시스템·컨테이너 정찰, 클라우드 메타데이터 서비스 질의, 비밀번호 해시·root SSH 키 읽기 시도, authorized_keys 파일 변조를 했고, 한 공격자는 root 권한을 얻어 파이썬 기반 명령제어(C2) 임플란트 'TAC Agent'를 설치했지만 실제로 명령을 받지는 않았다. GreyNoise는 별도로 22번 포트 스캔 2,750만 건·SSH 접속 시도 2,010만 건을 관측했지만 이를 SSHole 공격으로 확정하지는 않았다.\n\n**왜 일어났나**\n- 직접 원인 [확인]: musl의 비밀번호 해시 처리 오류(해시 비교 실패 시 반환값이 \"차단\"을 뜻하는 별표와 같아짐)와, OpenSSH가 이 반환값을 제대로 구분하지 않은 처리가 겹쳐 비밀번호 인증이 없는 계정도 우회될 수 있었다(OpenSSH 개발팀·연구기관 확인).\n- 구조적 원인 [추정 — 분석]: 비밀번호 해시 비교처럼 \"에러 상황\"과 \"정상 차단 상황\"의 반환값이 같은 문자(*)로 겹치는 코드 설계는, 한쪽 라이브러리(musl)만 봐서는 드러나지 않고 다른 쪽(OpenSSH)의 처리 방식과 합쳐질 때만 문제가 생긴다 — 이런 \"조합형 결함\"은 개별 컴포넌트 검증만으로는 찾기 어렵다.\n\n**침투 경로 [확인 — 연구기관 공통]**: 공격자가 비정상적으로 긴 비밀번호로 SSH 로그인 시도(T1190, 노출된 SSH 서비스 악용) → musl 해시 오류로 인증 우회 성공 → 시스템·컨테이너 정찰 및 클라우드 메타데이터 질의(T1613) → 패스워드 해시·root SSH 키 탈취 시도(T1552) → authorized_keys에 공격자 키 추가로 지속 접근 확보(T1098.004) → (일부) C2 임플란트 TAC Agent 다운로드·설치(T1105).\n\n**어떻게 조치하나**\n- 즉시: (OpenSSH·연구기관 권고) OpenSSH를 10.6p2 이상으로 업데이트한다. 업데이트가 어려우면 SSH 비밀번호 인증을 비활성화한다. (본 보고서의 권고) `/etc/shadow`에서 비밀번호 필드가 `*`인 계정에 성공한 로그인 기록이 있는지 지금 점검한다.\n- 단기: authorized_keys 파일의 비인가 키, TAC Agent 관련 파일·시작 서비스가 있는지 전체 서버를 점검하고, 발견되면 패치 전이라도 로그를 먼저 보존한다.\n- 장기: 패스워드 없는 관리자 권한 계정(암호 로그인 차단만으로 안전하다고 여겨진 계정)을 원칙적으로 없애고, 키 기반 인증과 최소 권한 원칙을 함께 적용한다.\n- 탐지: 비밀번호 필드가 `*`인 계정의 성공한 로그인, 클라우드 메타데이터 서비스에 대한 비정상 질의를 모니터링한다.\n\n**교훈**: \"비밀번호 로그인을 막아 놨다\"는 설정이 실제로는 보호 장치가 아니라 공격 표면이 될 수 있다는 점을 보여준다. 수정판이 나온 지 이틀도 안 돼 실제 공격이 성공했다는 사실은, 패치 공개 자체가 공격자들에게 \"여기를 보라\"는 신호가 되는 시대에 패치 적용 속도가 곧 방어 수준이라는 점을 다시 확인시킨다.\n\n### [D20261110-sonicvpn] SonicWall SSL-VPN SAML 인증(MFA) 우회(CVE-2026-19868) 실제 악용\n> 날짜: 연구자 발견·제보 시점 미공개 · 벤더 보안 권고(SNWLID-2026-0014) 공개 2026-11-06 · CISA KEV 등재 2026-11-06 · 유형: VPN 인증 우회(실제 악용 확인) · 행위자: 미귀속 · 지역: 전 세계(해외, 연방기관 포함) · 근거: 확인(벤더 PSIRT 조사·CISA KEV 등재로 실제 악용 확인)\n\n**쉽게 말하면**: 많은 기업이 재택근무·원격 접속에 쓰는 SonicWall 방화벽의 SSL-VPN 기능에서, SAML(회사 로그인을 한 번만 하면 여러 서비스에 쓸 수 있게 해 주는 표준 방식) 인증으로 다중 인증(MFA)을 걸어 놨어도, 다른 로그인 방법의 정상 계정 정보만 있으면 그 MFA를 건너뛸 수 있는 결함(CVE-2026-19868)이 발견됐습니다. SonicWall은 실제 악용 정황을 조사했고, 미국 정부(CISA)도 이 결함이 실제 공격에 쓰이고 있다고 확인해 긴급 수정을 요구했습니다. SonicWall은 지난 7월부터 10월까지도 비슷한 제로데이 공격을 반복해서 당해 온 터라, 이번이 네 번째 연속 사고입니다.\n**먼저 할 일(초보용)**: SonicWall SSL-VPN을 SAML 인증(SSO)으로 설정한 조직의 관리자는 지금 바로 SonicOS를 7.3.4-7013(Gen7) 또는 8.2.3-8015(Gen8)로 업그레이드하세요. 이 결함은 우회책이 없어 업그레이드가 유일한 방법입니다.\n\n**개요**: 이 결함(CVSS 7.1)은 SAML로 다중 인증을 적용한 SSL-VPN 서비스에서, 공격자가 다른(\"대체\") 인증 방식의 정상 자격 증명만 가지고 있으면 SAML 통제(여기에 걸린 MFA 포함)를 건너뛸 수 있게 한다. 연구자 Ryan Harris(The Electronic Office)가 발견·제보했고, SonicWall PSIRT는 실제 악용 가능성 제보를 조사한 뒤 즉시 업그레이드를 권고했다. 세부 악용 정황은 공개하지 않았지만, CISA가 이를 실제 악용 확인 카탈로그(KEV)에 등재해 실제 공격이 있었음을 공식 확인했다(연방 민간기관 조치 기한 11/20). 영향받는 버전은 SonicOS Gen7 7.3.3-7015 이하, Gen8 8.2.2-8015 이하이며, 각각 7.3.4-7013·8.2.3-8015에서 수정됐고 우회책은 없다. 같은 보안 권고(SNWLID-2026-0014)에서 관리 인터페이스의 비인증 비인가 작업 결함 2건(CVSS 8.8), SSL-VPN·TACACS+ 서비스의 사전 인증 버퍼 오버플로(서비스 거부), 가상 어플라이언스의 약한 비밀번호 해시까지 총 7건을 함께 수정했다. SonicWall은 2026년 7월(SMA1000 제로데이 2건, 악성코드 배포), 9월(제로데이 2건 연쇄로 RCE), 10월(CVE-2026-102255 최고위험도 결함 악용 시도)에 이어 이번이 네 번째 연속 사고다.\n\n**왜 일어났나**\n- 직접 원인 [확인]: SAML 기반 SSL-VPN 인증 로직이 \"대체 인증 방식\"의 유효 자격 증명을 SAML 통제 우회에 쓸 수 있도록 허용하는 설계·구현 결함이었다(벤더 확인).\n- 구조적 원인 [추정 — 분석]: 올해 들어 네 번째로 반복되는 SonicWall 제로데이라는 점에서, 개별 결함 하나를 고치는 패치 대응을 넘어 SSL-VPN·SAML 인증 로직 전반의 설계 재검토가 필요한 신호로 보인다. MFA를 \"걸어 놓았으니 안전하다\"고 여기기보다, 그 MFA를 구현한 코드 경로 자체도 검증 대상이라는 점을 보여준다.\n\n**침투 경로 [확인 — 벤더·CISA]**: 공격자가 대체 인증 방식의 유효 자격 증명 확보(구체적 입수 경로는 미공개) → SAML 기반 SSL-VPN 로그인 시 MFA 통제 우회(T1556.006) → VPN을 통한 내부망 접근(이후 단계는 공개되지 않음).\n\n**어떻게 조치하나**\n- 즉시: (벤더 권고) 7.3.4-7013(Gen7)/8.2.3-8015(Gen8)로 즉시 업그레이드한다(우회책 없음). (본 보고서의 권고) 업그레이드 전이라도 SAML 로그인 접근 로그를 보존한다.\n- 단기: 영향 가능 기간 SSL-VPN으로 접속한 계정의 세션을 무효화하고 비밀번호를 재발급하며, 비정상 접근 흔적을 점검한다.\n- 장기: SonicWall처럼 반복적으로 제로데이가 발견되는 경계 장비는 원격 접속 경로를 이중화(VPN 업체 다변화 또는 추가 네트워크 분할)하는 것을 검토한다.\n- 탐지: 대체 인증 방식으로 로그인한 뒤 곧바로 SAML 전용 리소스에 접근하는 비정상 패턴을 모니터링한다.\n\n**교훈**: 다중 인증(MFA)은 \"켜 놨다\"는 사실만으로 안전을 보장하지 않는다. MFA를 적용한 로직 자체에 우회 경로가 있다면, 이용자 입장에서는 평소처럼 로그인했을 뿐인데도 보호 장치가 조용히 빠져나가는 셈이다. 같은 벤더에서 반복되는 제로데이는 패치 속도보다 설계 문제를 의심해야 하는 신호다.\n\n## 3. 국내 소식\n\n- **①금융권**: 미래에셋증권이 모바일 웹 로그인·사내 그룹웨어 침해로 고객 3,800명·임직원 35,255명의 정보가 유출됐다고 11/7 공개했다 — 미래에셋생명(10/26)·미래에셋자산운용(10/28, 이미 [D20261103-finsector2](2026-11-01.md)에 기록)에 이어 미래에셋 계열 세 번째 유출이라 `국내뉴스.psv`에 `D20261103-finsector2` 관련사건으로 기록했다.\n\n## 4. 우선 대응 체크리스트\n\n1. **musl 기반 리눅스(Alpine 등) 서버 관리자(최우선, 신규)**: [D20261110-sshole](#d20261110-sshole-sshole-openssh-인증-우회cve-2026-123158-musl-기반-리눅스-실제-악용) — OpenSSH 10.6p2 이상 업데이트 또는 비밀번호 로그인 비활성화.\n2. **SonicWall SSL-VPN(SAML/MFA 설정) 운영 조직(최우선, 신규)**: [D20261110-sonicvpn](#d20261110-sonicvpn-sonicwall-ssl-vpn-saml-인증mfa-우회cve-2026-19868-실제-악용) — 7.3.4-7013/8.2.3-8015로 즉시 업그레이드(우회책 없음).\n3. 미래에셋증권·미래에셋생명·미래에셋자산운용 거래 고객: 각 사 공지 확인([2026-11-01 보고서](2026-11-01.md) 참고).\n\n## 5. 검증 수준과 한계\n\n- SSHole(CVE-2026-123158)은 수정판(10.6p2) 출시 약 40시간 뒤인 11/7 00:46(UTC) GreyNoise가 첫 성공 악용을 확인했으며, 이후 11/9 CISA KEV에도 등재됐다.\n- SonicWall CVE-2026-19868은 벤더 권고(SNWLID-2026-0014)와 CISA KEV 등재를 기준으로 정리했다.\n\n## 출처\n\n- CISA KEV 카탈로그(공식 웹페이지, 직접 확인)\n- BleepingComputer: \"Hackers actively exploiting new 'SSHole' OpenSSH auth bypass bug\", \"SonicWall urges admins to patch actively exploited SSLVPN flaw\"\n- 데일리시큐: \"미래에셋증권도 해킹 피해...고객·임직원 약 3만9천 명 정보 유출\"(idxno=209391)\n- MITRE ATT&CK v20.1\n"},{"path":"일일/2026-11-08.md","title":"일일 보안 이슈 분석 — 2026-11-08","md":"# 일일 보안 이슈 분석 — 2026-11-08\n\n> 수집 기준: 2026-11-08 공개·보도분([11-07 보고서](2026-11-07.md) 이후). 해외(BleepingComputer) 및 국내(보안뉴스·데일리시큐) 원문을 확인했다.\n> 근거 표기: **[확인]** 벤더·정부기관·연구기관이 직접 확인 / 보도 언론 보도 / **[추정]** 본 보고서의 추정 / **[주장]** 공격자 일방 주장. **조치는 본 보고서의 권고**이며 벤더 공식 지침이 우선한다.\n> **ATT&CK 버전 점검**: attack.mitre.org 직접 확인 결과 공식 버전은 **v20.1**이다.\n\n## 1. 오늘의 요약\n\n| # | 이슈 | 유형 | 상태 | 즉시 조치 |\n|---|------|------|------|-----------|\n| 1 | 생활용품업체 Iris Ohyama, 제3자 클라우드 침해로 770만 명 정보 노출 | 서드파티 클라우드 노출(경위 미공개) | [확인] 회사 자체 확인 | Iris Plaza 비밀번호 변경, 동일 비밀번호 재사용 서비스도 교체 |\n| 2 | SM엔터테인먼트·디어유(버블)·드림메이커, 업무시스템 해킹으로 주민번호·계좌정보 유출 | 엔터테인먼트 그룹 내부시스템 침해(경위 미공개) | [확인] 3사 자체 확인 | 회사 사칭 전화·문자(계좌변경 요청 등) 응대 금지 |\n| 3 | 랜섬웨어 조직 '메타인크립터', 현대건설 등 국내 기업 4곳 데이터 탈취 주장(검증 안 됨) | 랜섬웨어 협박(미검증) | [주장] 공격자 다크웹 게시물 | 해당 기업 외 조치 없음(피해 미확인) |\n\n## 2. 이슈별 분석\n\n### [D20261110-irisohyama] 생활용품업체 Iris Ohyama, 제3자 클라우드 침해로 770만 명 정보 노출\n> 날짜: 발견 2026년 10월 말 · 서비스 중단 2026-10-28 · 공개·당국 신고 2026-10-29 · 추가 설명 2026-11-05 · 보도 2026-11-08 · 유형: 서드파티 클라우드 노출(경위 미공개) · 행위자: 미귀속 · 지역: 전 세계(일본, 해외) · 근거: 확인(회사 자체 확인)\n\n**쉽게 말하면**: 일본의 생활용품 제조·유통업체 아이리스 오야마(Iris Ohyama)가 운영하는 온라인몰 'Iris Plaza'가, 이 회사가 쓰는 외부(제3자) 클라우드 서비스에서 수상한 파일을 발견해 조사한 결과 비인가 접근이 있었다고 확인했습니다. 회원·과거회원·비회원을 포함해 최대 770만 명의 이름·주소·전화번호·이메일·성별·생년월일, 그리고 활동 중인 회원의 암호화된 비밀번호까지 노출 대상에 포함될 수 있습니다. 신용카드 정보는 이 서비스에 보관돼 있지 않아 영향받지 않았습니다. 다만 공격자가 구체적으로 어떤 방법으로 침투했는지는 아직 공개되지 않았습니다.\n**먼저 할 일(초보용)**: Iris Plaza·SIMPLE STYLE 온라인몰 이용자는 지금 비밀번호를 변경하고, 같은 비밀번호를 다른 사이트에서도 쓰고 있었다면 그 비밀번호도 함께 바꾸세요.\n\n**개요**: 아이리스 오야마는 Iris Plaza가 이용하는 외부 클라우드 서비스에서 의심스러운 파일을 발견해 조사한 끝에, 2026년 10월 말 비인가 접근 사실을 확인했다. 노출 대상 정보는 이름·주소·전화번호·이메일 주소·성별·생년월일이며, 활동 중인 회원의 경우 암호화된(구체적 암호화 방식은 미공개) 비밀번호도 포함된다. 과거 회원은 저장된 비밀번호가 없어 대상에서 제외된다. 영향 규모는 등록·과거 회원 최대 580만 명과 비회원 190만 명을 합쳐 약 770만 명으로 추정되며, 정확한 레코드·인원 수는 계속 파악 중이다. 신용카드 정보는 해당 서비스에 보관되지 않아 영향받지 않았다. 회사는 10월 28일 Iris Plaza와 연계 서비스(SIMPLE STYLE 온라인몰, Iris Tech Service 웹사이트)를 중단하고 조사에 들어갔으며, 10월 29일 일본 개인정보보호위원회와 경찰에 신고하고 사실을 공개했다. 11월 5일 기준 명의도용이나 금전 피해 신고는 없으며, 공격자로부터 직접적인 연락도 받지 못했고 공격자의 신원도 특정하지 못했다고 밝혔다. 보도는 공격자가 구체적으로 어떤 결함이나 방법으로 이 클라우드 서비스에 접근했는지는 다루지 않았다.\n\n**왜 일어났나**\n- 직접 원인 [확인 — 세부는 미공개]: 회사가 쓰는 제3자 클라우드 서비스에 비인가 접근이 있었다는 사실은 확인됐지만, 어떤 결함·방법으로 접근했는지는 공개되지 않았다.\n- 구조적 원인: 구체적인 침투 경로가 공개되지 않아 구조적 원인을 분석하지 않는다.\n\n**침투 경로 [매핑 안 함 — 경위 미공개]**: 제3자 클라우드 서비스에서 비인가 접근이 확인됐다는 사실 외에 구체적인 결함·접근 방법이 공개되지 않아, 본 저장소는 이 사건에 ATT&CK 기법을 매핑하지 않는다.\n\n**어떻게 조치하나**\n- 즉시: (회사 조치) Iris Plaza 등 관련 시스템 중단, 조사 착수, 당국 신고·공개. (본 보고서의 권고) 노출 가능 비밀번호 보유 회원은 재설정을 안내한다.\n- 단기: 조사 결과가 나오면 정확한 영향 인원·침투 경로를 확정해 재공지하고, 동일한 제3자 클라우드 서비스를 쓰는 다른 자사 시스템도 함께 점검한다.\n- 장기: 제3자 클라우드 서비스에 저장하는 개인정보의 암호화 범위·접근 통제를 정기적으로 재평가하는 절차를 마련한다.\n- 탐지: 제3자 클라우드 서비스에 대한 비정상 파일 접근·다운로드 패턴을 모니터링한다.\n\n**교훈**: \"제3자 클라우드 서비스\"라는 표현 뒤에는 구체적으로 무엇이 뚫렸는지에 대한 설명이 비어 있는 경우가 많다. 경위가 불분명한 사건일수록 섣불리 원인을 단정하지 않는 것이, 추측성 보도가 쌓여 실제 원인과 다른 방향으로 대응이 흘러가는 것을 막는 길이다.\n\n### [D20261110-smtown] SM엔터테인먼트·디어유(버블)·드림메이커, 업무시스템 해킹으로 주민번호·계좌정보 유출\n> 날짜: 침해(추정) 2026-11-04경 · 회사 공개 2026-11-08 · 유형: 엔터테인먼트 그룹 업무시스템 침해(경위 미공개) · 행위자: 미귀속 · 지역: 한국 · 근거: 확인(SM엔터테인먼트·디어유·드림메이커 자체 확인)\n\n**쉽게 말하면**: SM엔터테인먼트와 그 계열사인 팬 플랫폼 '버블' 운영사 디어유, 공연기획사 드림메이커엔터테인먼트가 외부 공격자에게 업무시스템(전자결재 시스템 포함)을 해킹당해 일부 문서 파일이 빠져나갔다고 밝혔습니다. SM엔터테인먼트·드림메이커 쪽에서는 이름·휴대전화번호·주소·계좌번호·주민등록번호·소속사 정보·계약서 내용까지 유출됐고, 디어유 쪽에서는 직원 데이터베이스(성명·생년월일·사번·이메일·부서·직급 등)가 유출됐습니다. 3사 모두 공격자의 접근 경로를 차단하고 유출 가능성이 있는 접근 키를 교체했다고 밝혔지만, 어떤 결함으로 침투당했는지는 아직 공개되지 않았습니다.\n**먼저 할 일(초보용)**: SM엔터테인먼트·디어유(버블)·드림메이커와 계약했거나 소속된 아티스트·스태프·거래처 관계자는 회사나 관계자를 사칭한 전화·문자(계좌변경 요청 등)에 응하지 말고, 공식 채널로만 확인하세요.\n\n**개요**: SM엔터테인먼트는 2026-11-08, 외부 공격자가 전자결재 시스템을 포함한 업무시스템에 비인가 접근해 일부 문서 파일을 반출했다고 공개했다. 영향받은 계열사는 SM엔터테인먼트, 팬 플랫폼 '버블'을 운영하는 디어유, 공연기획사 드림메이커엔터테인먼트다. SM엔터테인먼트와 드림메이커 쪽에서는 이름·휴대전화번호·주소·계좌번호·주민등록번호, 소속·계약서에 담긴 정보가 유출 대상에 포함된다. 디어유 쪽에서는 직원 데이터베이스 기록(국문·영문 성명, 성별, 생년월일, 사번, 로그인ID, 이메일, 휴대전화번호, 부서, 직급)이 포함되며, 주민등록번호·계좌번호가 포함됐는지는 보도에서 확인되지 않는다. 공격자가 어떤 결함이나 방법으로 침투했는지는 공개되지 않았다. 3사는 공격 IP와 접근 경로를 차단하고 비인가 접근이 있었던 키(인증키)를 교체했으며, 정부기관·외부 보안전문가와 함께 세부 조사를 진행 중이라고 밝혔다. 접근 통제·보안 모니터링·전반적 보안체계 강화를 계획하고 있으며, 3사 모두 사과문을 냈고 회사·관계자를 사칭한 보이스피싱·스미싱에 유의하라고 공지했다. 영향받은 인원 수는 아직 확정되지 않았으며, 현재까지 2차 피해는 보고되지 않았다.\n\n**왜 일어났나**\n- 직접 원인 [확인 — 세부는 미공개]: 외부 공격자가 업무시스템(전자결재 포함)에 비인가 접근했다는 사실은 3사가 확인했지만, 구체적인 결함·침투 방법은 공개되지 않았다.\n- 구조적 원인 [추정 — 분석]: SM엔터테인먼트·디어유·드림메이커가 계열사 간 업무시스템을 공유하거나 연계해 쓰는 구조였다면, 한 곳의 침해가 여러 계열사로 동시에 번질 수 있다. 연예기획사·팬 플랫폼은 아티스트·스태프의 계약서·계좌정보처럼 민감한 금융·신원 정보를 다루면서도, 전통적으로 금융·통신업만큼 보안 투자가 집중되지 않는 업종으로 여겨져 왔다.\n\n**침투 경로 [매핑 안 함 — 경위 미공개]**: 전자결재 시스템을 포함한 업무시스템에 비인가 접근이 있었다는 사실 외에 구체적인 결함·최초 침투 방법이 공개되지 않아, 본 저장소는 이 사건에 ATT&CK 기법을 매핑하지 않는다.\n\n**어떻게 조치하나**\n- 즉시: (3사 조치) 공격 IP·접근 경로 차단, 비인가 접근 키 교체, 정부기관·외부 전문가와 조사. (본 보고서의 권고) 유출 가능성이 있는 계좌정보·주민등록번호 보유자 목록을 우선 확정해 통지한다.\n- 단기: 계열사 간 공유·연계된 업무시스템 구조를 전체 점검하고, 영향받은 아티스트·스태프·거래처에 개별 통지와 명의도용 방지 서비스 안내를 진행한다.\n- 장기: 계약서·계좌정보처럼 금융·신원 정보가 담긴 문서를 다루는 전자결재 시스템에는 핵심 금융시스템과 동등한 접근 통제·암호화를 적용한다.\n- 탐지: 전자결재 시스템의 대량 문서 조회·다운로드, 비정상 시간대 접근을 모니터링한다.\n\n**교훈**: 연예기획사·팬 플랫폼도 계좌번호·주민등록번호 같은 민감한 금융·신원 정보를 대량으로 다룬다는 점에서 금융사·통신사와 다르지 않은 침해 위험을 안고 있다. 업종이 \"금융\"이 아니라는 이유로 보안 투자 우선순위에서 밀리면, 피해자 입장에서는 유출되는 정보의 민감도가 똑같이 크다는 점이 가려지기 쉽다.\n\n### [D20261110-metaencryptor] 랜섬웨어 조직 '메타인크립터', 현대건설 등 국내 기업 4곳 데이터 탈취 주장(검증 안 됨)\n> 날짜: 다크웹 게시(추정) 2026-11-07 · 보도 2026-11-08 · 유형: 랜섬웨어 협박(검증 안 됨) · 행위자: 메타인크립터(MetaEncryptor, 다크웹 자체 표기) · 지역: 한국 · 근거: 주장(공격자 다크웹 게시물, 독립 확인 없음)\n\n**쉽게 말하면**: 랜섬웨어 조직 '메타인크립터'가 다크웹 유출 사이트에 현대건설, 우신시스템, 대원화성, 대아이앤씨 등 한국 기업 4곳의 이름을 올리고 데이터를 탈취했다고 주장했습니다. 다만 공개된 자료 크기를 표시한 곳은 대아이앤씨(100GB, 공격자 주장)뿐이고 나머지는 표시 자체가 없으며, '현대건설' 항목의 설명 문구가 현대자동차그룹 전체를 가리키는 등 신뢰하기 어려운 부분도 있습니다. 어느 회사도 아직 공식적으로 사고를 인정하지 않았고, 실제 침해·암호화·서비스 장애가 있었는지도 확인되지 않았습니다 — 다크웹 주장만 있는 단계입니다.\n**먼저 할 일(초보용)**: 해당 4개 기업의 거래처·임직원이 지금 당장 할 일은 없습니다(공식 확인 전). 각 기업의 IT 담당자는 랜섬웨어 침해 지표(비정상 암호화, 대용량 외부 전송 흔적)를 내부적으로 점검해 볼 필요가 있습니다.\n\n**개요**: 랜섬웨어 조직 '메타인크립터'가 자사 다크웹 유출 사이트에 2026년 11월 7일(추적 플랫폼 기록 기준 22:30 KST) 한국 기업 4곳 — 현대건설, 우신시스템, 대원화성, 대아이앤씨 — 을 피해 기업으로 게시했다. 자료 규모를 표시한 곳은 대아이앤씨(100GB, 공격자 주장)뿐이며, 우신시스템·대원화성은 포착 당시 공개 파일 항목이 0건으로 표시됐다(이것이 데이터가 없다는 증거는 아니라고 보도는 지적한다). '현대건설' 게시물의 설명 문구는 현대자동차그룹 전체를 가리키는 내용이어서, 보도는 이 주장을 현대건설 하나로 한정할 근거가 없다고 평가했다. 게시 시점이 네 회사가 동시에 공격받았다는 뜻은 아니며, 추적 플랫폼이 이를 기록한 시각일 뿐이다. 여러 추적 서비스가 같은 게시물을 보여주지만 모두 같은 원천 데이터(Ransomware.live)에 기반해 보이므로 독립적인 교차 확인으로 보기는 어렵다. 공격자가 당국 통보·완전 삭제를 주장한 부분도 검증되지 않았다. '메타인크립터'라는 이름은 2023년 SentinelOne 분석에서 LostTrust 랜섬웨어와 연결된 적이 있지만, 이번 사건이 같은 도구·기법을 쓴다는 증거는 없으며 운영자의 신원·국적·침투 방법은 모두 불명이다. 네 회사 중 어느 곳도 이 보도 시점까지 공식 입장을 내지 않았다.\n\n**왜 일어났나**\n- 직접 원인 [주장 — 검증 안 됨]: 공격자는 네 회사의 시스템을 침해해 데이터를 탈취했다고 주장하지만, 이를 뒷받침하는 독립적인 확인(회사 공지, 포렌식 증거)은 없다.\n- 구조적 원인: 실제 침해 여부부터 확인되지 않아 구조적 원인을 분석하지 않는다.\n\n**침투 경로**: 침투 경로에 대한 정보가 전혀 공개되지 않았고, 피해 사실 자체도 공격자 일방의 다크웹 게시물에만 근거한다. 이 보고서는 공격자 일방 주장만 있는 사건에 ATT&CK 매핑을 하지 않는다.\n\n**어떻게 조치하나**\n- 즉시: (본 보고서의 권고) 해당 4개 기업은 공식 확인 전이라도 내부적으로 랜섬웨어 침해 지표(비정상 암호화 프로세스, 대용량 외부 전송 로그)를 점검한다.\n- 단기: 이상이 발견되면 즉시 KISA·관계기관에 신고하고 포렌식 증거를 보존한다.\n- 장기: 다크웹 유출 사이트 모니터링(브랜드·자사명 언급 추적)을 상시 운영 체계에 포함한다.\n- 탐지: 해당 없음(공격자 주장만 있는 단계로, 구체적 탐지 지표를 제시하기 어렵다).\n\n**교훈**: 다크웹 유출 사이트에 회사 이름이 오르는 것 자체는 사실 확인이 아니다. 자료 크기 표시가 없거나 설명이 부정확한(현대자동차그룹 전체를 가리키는 등) 게시물도 \"탈취 주장\"으로 집계될 수 있으므로, 공식 확인 전까지는 추정으로만 다뤄야 한다.\n\n## 3. 국내 소식\n\n- **③기업 침해**: SM엔터테인먼트·디어유(버블)·드림메이커엔터테인먼트 3사가 11/8 전자결재 등 업무시스템 비인가 접근 사실을 공개했다(`D20261110-smtown`).\n- **④국내 랜섬웨어**: 메타인크립터의 국내 기업 4곳 탈취 주장(`D20261110-metaencryptor`, 미검증)을 확인했다.\n\n## 4. 우선 대응 체크리스트\n\n1. **SM엔터테인먼트·디어유(버블)·드림메이커 관계자(최우선, 신규)**: [D20261110-smtown](#d20261110-smtown-sm엔터테인먼트디어유버블드림메이커-업무시스템-해킹으로-주민번호계좌정보-유출) — 사칭 전화·문자(계좌변경 요청) 응대 금지.\n2. **Iris Plaza·SIMPLE STYLE 이용자(신규)**: [D20261110-irisohyama](#d20261110-irisohyama-생활용품업체-iris-ohyama-제3자-클라우드-침해로-770만-명-정보-노출) — 비밀번호 변경, 동일 비밀번호 재사용 서비스도 교체.\n3. **[11-07 보고서](2026-11-07.md) 긴급 패치**: OpenSSH 10.6p2 이상 업데이트(CVE-2026-123158) 및 SonicWall SSL-VPN(CVE-2026-19868) 업그레이드.\n\n## 5. 검증 수준과 한계\n\n- SM엔터테인먼트·디어유·드림메이커 해킹의 구체적 결함과 Iris Ohyama의 클라우드 침해 방법은 공개되지 않아 ATT&CK 매핑을 하지 않았다.\n- 메타인크립터의 국내 기업 4곳 탈취 주장은 자료 크기 표시가 대부분 없고 '현대건설' 게시물 설명이 현대자동차그룹 전체를 가리키는 등 신뢰도가 낮으며 어느 회사도 공식 확인을 하지 않아 [주장]으로만 기록했다.\n\n## 출처\n\n- BleepingComputer: \"Japanese retailer Iris Ohyama says data breach affects 7.7M people\"\n- 보안뉴스: \"SM엔터·디어유·드림메이커 해킹 피해...이름·계좌번호·주민번호 등 유출\"(idxno=147061), \"현대건설 등 국내 기업 4곳, 랜섬웨어 그룹 '메타인크립터' 공격 받아\"(idxno=147056)\n- 데일리시큐: \"SM엔터·디어유(버블)·드림메이커 동시 해킹...업무시스템 침해로 개인정보 유출\"(idxno=209394)\n- MITRE ATT&CK v20.1\n"},{"path":"일일/2026-11-09.md","title":"일일 보안 이슈 분석 — 2026-11-09","md":"# 일일 보안 이슈 분석 — 2026-11-09\n\n> 수집 기준: 2026-11-09 공개·보도분([11-08 보고서](2026-11-08.md) 이후). 해외(BleepingComputer) 및 국내(보안뉴스·데일리시큐) 원문을 확인했다.\n> 근거 표기: **[확인]** 벤더·정부기관·연구기관이 직접 확인 / 보도 언론 보도 / **[추정]** 본 보고서의 추정 / **[주장]** 공격자 일방 주장. **조치는 본 보고서의 권고**이며 벤더 공식 지침이 우선한다.\n> **ATT&CK 버전 점검**: attack.mitre.org 직접 확인 결과 공식 버전은 **v20.1**이다.\n\n## 1. 오늘의 요약\n\n| # | 이슈 | 유형 | 상태 | 즉시 조치 |\n|---|------|------|------|-----------|\n| 1 | N-able RMM 플랫폼 N-central, 연구자가 제로데이 30여 건 무단 공개 | 책임 없는 취약점 공개·RMM(원격관리도구) | [확인] N-able 자체 확인, 실제 악용은 미확인 | 온프레미스 서버 지금 종료, 호스팅 고객은 공식 안내 대기 |\n| 2 | 프랑스, 10월 슈퍼마켓 냉동시설 공격을 이란 IRGC 연계 조직에 공식 귀속 | 산업제어(OT) 파괴 공격·국가 귀속 | [확인] 프랑스 정부(C4·ANSSI·CERT-FR) | 냉동·냉장 컨트롤러 인터넷 노출 여부 즉시 점검 |\n| 3 | 러시아 호스팅업체 Beget, 데이터 와이퍼 공격으로 전체 인프라 재구축 | 파괴형(와이퍼) 공격 | [확인] 회사 자체 확인 | 유사 업종은 관리 시스템 권한 및 오프라인 백업 점검 |\n| 4 | SEGA, 뉴스레터 발송업체 ARARA 침해로 구독자 이메일 220만 건 유출 | 서드파티(이메일 발송 대행사) 공급망 | [확인] ARARA·SEGA 자체 확인 | 신용카드사 사칭 피싱 주의 |\n\n## 2. 이슈별 분석\n\n### [D20261110-nable] N-able RMM 플랫폼 N-central, 연구자가 제로데이 30여 건 무단 공개\n> 날짜: 연구자 공개 2026-11-08 야간 · N-able 호스팅 환경 오프라인 조치 2026-11-09 · 유형: 책임 없는 취약점 공개(풀 디스클로저)·RMM(원격 모니터링·관리 도구) 보안 · 행위자: 해당 없음(공격자 아님, 보안연구자 Sean Bales의 공개) · 지역: 전 세계(해외, MSP·IT팀 대상) · 근거: 확인(N-able 자체 확인: 사고 인지·조치)·주장(연구자 주장: 결함 다수 존재, N-able이 이전 제보를 무시했다는 주장은 미확인)\n\n**쉽게 말하면**: 여러 기업의 네트워크를 원격으로 관리해 주는 N-able의 RMM(Remote Monitoring and Management, 원격 모니터링·관리) 플랫폼 'N-central'에서, 보안연구자 Sean Bales가 30개 이상의 결함과 그 공격 코드를 N-able에 미리 알리지 않고 한꺼번에 공개했습니다. 가장 위험한 것은 로그인 없이도 가짜 관리자 계정을 만들고 서버에서 명령을 실행할 수 있는 결함입니다. N-able은 다음 날 자사가 직접 운영하는(호스팅) N-central 환경을 전부 오프라인으로 내렸고, 아직 실제 공격으로 이어진 사례는 확인되지 않았다고 밝혔습니다. 연구자는 이전에 다른 결함을 제보했는데 N-able이 무시했다고 주장했지만, N-able은 이 주장에 답하지 않았습니다.\n**먼저 할 일(초보용)**: N-central을 자체 서버(온프레미스)에 설치해 쓰는 조직은 N-able의 안내대로 지금 해당 서버를 종료하거나 외부 접근을 차단하세요. N-able이 직접 운영해 주는(호스팅) 고객은 복구 일정이 아직 없으니 4시간마다 올라오는 공식 공지를 확인하세요.\n\n**개요**: Sean Bales는 2026-11-08 야간, N-central의 사전 출시판(2026.4.0.31)을 대상으로 테스트한 30개 이상의 결함과 'Able2Shell'이라는 이름의 개념증명(PoC, 결함이 실제로 공격에 쓰일 수 있음을 보여주는 검증용 코드) 공격 코드를 GitHub에 공개했다. 결함 종류는 인증 우회, 자격 증명 노출, 임의 파일 쓰기, 디렉터리 탐색, XSS, XXE 주입, 원격 코드 실행(RCE)까지 다양하며, 가장 심각한 것은 인증 없이도 XXE(XML 외부 개체) 주입을 RCE로 연결해 가짜 관리자 계정을 만들고 'nable' 계정 권한으로 명령을 실행할 수 있는 체인이다. 연구자는 이 공개가 AI의 도움을 받아 이뤄졌다고 밝혔으며, N-able이 다른 제품의 무관한 RCE 2건과 권한상승 1건에 대한 이전 제보를 무시했다는 이유로 사전 통지 없이 공개했다고 주장했다 — N-able은 이 주장에 대한 질문에 답하지 않았다. N-able은 2026-11-09 이를 '중대 보안 사고'로 규정하고 긴급 수정(핫픽스)을 준비 중이라고 밝혔으며, 현재까지 실제 악용이나 비인가 데이터 접근의 증거는 없다고 설명했다. N-able이 직접 운영하는 호스팅 환경은 복구 일정 없이 오프라인 상태이며, 온프레미스 고객에게는 서버를 \"추가 안내가 있을 때까지\" 종료하라고 안내했다.\n\n**왜 일어났나**\n- 직접 원인 [확인 — 공개 경위]: 연구자가 다수의 결함을 발견해 벤더에게 미리 알리지 않고 공격 코드와 함께 전부 공개했다(연구자·N-able 양측 확인). 이 결함들이 N-central의 설계·코드에 실재하는지는 N-able이 조사 중이며 전부가 검증된 것은 아니다.\n- 구조적 원인 [추정 — 분석]: RMM(원격 모니터링·관리) 플랫폼은 MSP(관리형 서비스 제공업체)가 다수 고객사의 네트워크를 동시에 관리하는 데 쓰인다. 이런 플랫폼 하나에 인증 없는 RCE 체인이 있다면, 그 MSP가 관리하는 모든 고객사로 공격이 번질 수 있는 구조적 위험이 크다 — 이번에는 실제 악용이 확인되지 않았지만, 공개된 공격 코드로 위험은 이미 커진 상태다.\n\n**침투 경로 [매핑 안 함 — 실제 악용 미확인]**: N-able은 현재까지 이 결함들을 이용한 실제 공격을 확인하지 못했다고 밝혔다. 본 저장소는 실행 가능성만 있고 실제 악용이 관측되지 않은 결함에는 ATT&CK 기법을 매핑하지 않는다.\n\n**어떻게 조치하나**\n- 즉시: (N-able 권고) 온프레미스 N-central 서버를 지금 종료하거나 네트워크에서 격리한다. 호스팅 고객은 공식 공지를 주기적으로 확인한다. (본 보고서의 권고) 공개된 PoC 코드가 있으므로 N-central 접근 로그를 지금 보존한다.\n- 단기: N-able의 핫픽스가 나오면 지체 없이 적용하고, 적용 전후 비정상 관리자 계정 생성·명령 실행 흔적을 점검한다.\n- 장기: MSP가 쓰는 RMM 플랫폼처럼 다수 고객사에 영향을 줄 수 있는 핵심 소프트웨어는 취약점 제보·공개 정책(책임 있는 공개 절차)을 명확히 운영해, 이런 '무단 전체 공개' 상황 자체를 줄인다.\n- 탐지: N-central 관련 비정상 관리자 계정 생성, 예상 밖의 파일 쓰기·디렉터리 접근을 모니터링한다.\n\n**교훈**: 연구자가 \"벤더가 제보를 무시했다\"고 주장하며 수십 건을 한꺼번에 공개한 이번 사례는, 취약점 제보·공개 절차에 대한 신뢰가 깨지면 그 결과를 전체 고객사가 함께 떠안게 된다는 것을 보여준다. 공개 자체가 공격은 아니지만, 공격 코드가 세상에 나온 순간부터 위험 관리의 책임은 벤더와 고객 모두에게 넘어온다.\n\n### [D20261110-iranfridge] 프랑스, 10월 슈퍼마켓 냉동시설 공격을 이란 IRGC 연계 조직에 공식 귀속\n> 날짜: 공격 실행 2026-10-11~12 야간(프랑스) · CyberbanNews 공개 2026-10-13 · 프랑스 정부 귀속 발표 2026-11-09(현지 월요일) · 유형: 산업용 냉동·냉장 제어시스템(OT) 원격 조작·국가 연계 파괴 공격 · 행위자: Shahid Kaveh(이란 IRGC 전자·사이버센터 연계 조직, 프랑스 정부 귀속) · 지역: 프랑스(해외) · 근거: 확인(프랑스 정부 사이버위기조정센터 C4·ANSSI·CERT-FR 공식 귀속)\n\n**쉽게 말하면**: 지난 보고서들이 다뤘던 유럽 슈퍼마켓 냉장고 원격 조작 사건의 '원조'인 2026년 10월 프랑스 슈퍼마켓 공격에 대해, 프랑스 정부가 처음으로 공격 주체를 이란 혁명수비대(IRGC) 산하 전자·사이버센터와 연계된 조직('Shahid Kaveh')으로 공식 지목했습니다. 10월 11~12일 밤사이 까르푸·르클레르·인터마르셰 등 약 700개 매장(기존에 알려졌던 250~350곳보다 두 배 가까이 늘어난 수치)의 산업용 냉동·냉장 컨트롤러가 원격으로 조작돼 해동(제상) 온도로 바뀌면서 화재가 최소 15건 발생하고 수천만 유로 규모의 식품 손실이 났습니다. 다만 프랑스 정부는 11월에 벨기에·네덜란드 등에서 일어난 2차 공격이나, 프랑스 혈액원(EFS) 냉장시설 사건까지 이란 소행이라고 확정하지는 않았습니다 — 이번 귀속은 10월 프랑스 내 공격에만 한정됩니다.\n**먼저 할 일(초보용)**: 대형 유통매장·식품·물류 기관의 냉동·냉장 설비 담당자는 그 설비의 온도 컨트롤러가 인터넷에서 직접 접근 가능한지 지금 확인하고, 그렇다면 즉시 분리하세요(이전 보고서([11-06](2026-11-06.md#d20261106-coldchain-프랑스-혈액원-냉장시설까지-공격-확산-fbicisa-냉동냉장-시스템-경보))의 권고와 동일). 일반 소비자가 할 일은 없습니다.\n\n**개요**: 프랑스 외교부는 2026-11-09(현지 월요일) 발표한 성명에서, 10월 프랑스 슈퍼마켓 공격을 이란 IRGC의 전자·사이버센터와 연계된 조직 'Shahid Kaveh'의 소행으로 지목했다. 이 귀속은 프랑스의 사이버위기조정센터(C4, ANSSI·군 사이버사령부·정보기관 포함)가 내렸고, CERT-FR이 기술 보고서를 공개했다. 근거로는 ①공격자 인프라가 이 조직의 기존 기법으로 알려진 Schneider Electric 산업시스템 정찰에도 쓰였다는 점, ②이 조직이 흔히 쓰는 인터넷 노출 장비 검색 플랫폼 'FOFA' 사용, ③프랑스가 이 조직과 연계로 보는 매체 CyberbanNews가 10/13 이 공격을 공개했다는 점, ④공격자 인프라에서 페르시아어(파르시) 흔적 발견, ⑤이 조직이 2026년 3~4월 이스라엘·미국 대상 사보타주를 주장하고 프랑스 내 Schneider 시스템 정찰을 한 전례가 있다는 점을 들었다 — 이는 모두 정황 증거(공유 인프라·도구·시점·언어 흔적)이며 단독으로 \"누가 직접 실행했는지\"를 증명하지는 않는다. 공격은 10월 11~12일 야간, 산업용 냉동 컨트롤러를 원격 조작해 해동(제상) 모드로 전환하는 방식으로 이뤄졌으며, 까르푸·르클레르·쿠프라티브 U·메트로·인터마르셰 등 약 700개 매장과 일부 소규모 정육점·도축장·식품가공 협동조합까지 영향을 받았고, 화재 최소 15건과 수천만 유로 규모의 손실이 발생했다. 같은 시기 소규모 수력발전 시설의 Schneider Electric 장비도 같은 캠페인과 연계돼 영향을 받았으나 피해는 제한적이었다. 프랑스는 11월 벨기에·네덜란드 등 2차 공격(본 저장소 [D20261103-eufridge](2026-11-02.md))이나 프랑스 혈액원(EFS) 냉장시설 사건([D20261106-coldchain](2026-11-06.md#d20261106-coldchain-프랑스-혈액원-냉장시설까지-공격-확산-fbicisa-냉동냉장-시스템-경보))까지 이란 소행으로 확정하지 않았다 — 이번 귀속은 10월 프랑스 내 공격에 한정된다. 프랑스는 이란 대사를 소환하고 EU 차원의 추가 제재를 제안할 계획이라고 밝혔다.\n\n**왜 일어났나**\n- 직접 원인 [확인]: 공격자가 산업용 냉동·냉장 제어 컨트롤러를 원격으로 조작해 해동(제상) 온도로 전환시켰다(프랑스 정부 확인).\n- 구조적 원인 [추정 — 분석]: 국가 연계 공격자가 \"경제적 피해·사회 혼란\" 자체를 목적으로 산업용 OT 설비를 노린다면, 그 설비의 보안 수준이 아니라 \"인터넷에 노출돼 있는지\" 자체가 공격의 1차 선별 기준이 된다(FOFA 같은 장비 검색 플랫폼으로 노출 장비를 먼저 찾는 방식). OT 보안이 전통적으로 안전·식품관리 영역으로 다뤄져 사이버 투자 우선순위에서 밀려 왔다는 점은 [11-06 보고서](2026-11-06.md)에서도 지적한 구조적 약점이다.\n\n**침투 경로 [확인 — CERT-FR 기준, 일부 추정]**: FOFA 등 인터넷 노출 장비 검색 플랫폼으로 Schneider Electric 등 산업 시스템 정찰(추정 — 공격자 기존 수법과의 연결) → 노출된 냉동·냉장 제어 컨트롤러에 원격 접근(확인) → 제상·온도 설정값 변경으로 화재·식품 손실 유발(확인). 컨트롤러 접근에 쓰인 구체적 결함(인증 우회·기본 비밀번호 등)은 이번 발표에서도 공개되지 않았다.\n\n**어떻게 조치하나**\n- 즉시: (프랑스 정부·FBI/CISA 공동 권고, [11-06 보고서](2026-11-06.md) 반복) 냉동·냉장 컨트롤러를 공용 인터넷에서 분리하고, 기본 비밀번호를 교체한다. (본 보고서의 권고) 영향 가능성이 있는 설비는 패치 전이라도 접근 로그를 보존한다.\n- 단기: OT 시스템을 업무망과 분리하고, FOFA·Shodan류 검색 플랫폼에 자사 OT 장비가 노출돼 있는지 직접 검색해 본다.\n- 장기: 국가 연계 공격자의 OT 표적화가 반복되는 추세라면, 식품·에너지·의료 등 국가기반시설에 준하는 OT 운영 조직은 정부 사이버 경보(CERT-FR, FBI/CISA 등)를 정기적으로 구독하고 반영하는 절차를 마련한다.\n- 탐지: 냉동·냉장 설비의 원격 설정 변경 이벤트, FOFA 등 검색 플랫폼에서 자사 장비에 대한 조회 흔적(가능하다면)을 모니터링한다.\n\n**교훈**: 한 나라의 정부가 공식적으로 \"이것은 국가 연계 공격\"이라고 지목하기까지 한 달이 걸렸고, 그 사이 공격의 영향 범위(250~350곳 → 700곳)도 두 배 가까이 늘어난 것으로 재평가됐다. 초기 피해 추정치는 조사가 진행되며 커질 수 있다는 점과, 슈퍼마켓 냉장고 하나가 국가 간 외교 문제로까지 번질 수 있다는 점을 함께 보여준다.\n\n### [D20261110-beget] 러시아 호스팅업체 Beget, 데이터 와이퍼 공격으로 전체 인프라 재구축\n> 날짜: 공격 2026-11-01 야간 · 서버 네트워크 차단·확산 저지 2026-11-01~02 · 중간 공지 2026-11-03·11-06 · 보도 2026-11-09 · 유형: 파괴형(데이터 와이퍼) 공격 · 행위자: 미귀속(동기·배후 불명) · 지역: 러시아(해외, 이용자 20만여 명) · 근거: 확인(회사 자체 확인)\n\n**쉽게 말하면**: 러시아의 대형 웹호스팅·클라우드 업체 Beget가 데이터를 그
